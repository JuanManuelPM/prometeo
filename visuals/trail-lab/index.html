<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3155ff">
<title>Prometeo · Trail Lab</title>
<style>
:root{--bg:#3155ff;--ink:#070707}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{overscroll-behavior:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.label{position:fixed;z-index:3;left:max(12px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));pointer-events:none;font:900 10px/1 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;mix-blend-mode:multiply}
.label small{display:block;margin-top:5px;font:700 8px/1.25 Arial,sans-serif;letter-spacing:.03em;opacity:.64}
.credit{position:fixed;z-index:3;left:max(12px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));font:700 8px/1.2 Arial,sans-serif;letter-spacing:.03em;opacity:.58;mix-blend-mode:multiply;pointer-events:none}
.readout{position:fixed;z-index:3;right:max(12px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));font:900 8px/1 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;mix-blend-mode:multiply;pointer-events:none}
button{position:fixed;z-index:4;right:max(9px,env(safe-area-inset-right));top:max(7px,env(safe-area-inset-top));width:48px;height:44px;padding:0;border:0;background:transparent;color:var(--ink);font:900 17px/1 Arial,sans-serif;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:-4px}
.loading{position:fixed;inset:0;z-index:7;display:grid;place-items:center;background:var(--bg);font:900 11px/1 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;transition:opacity .12s linear;pointer-events:none}.loading.off{opacity:0}
@media(max-height:500px){.label{font-size:9px}.label small{display:none}.credit,.readout{font-size:7px}}
@media(prefers-reduced-motion:reduce){.label small{display:none}}
</style>
</head>
<body>
<canvas id="stage" aria-label="Pulga de Micrographia repetida en copias completas que persisten brevemente durante el movimiento"></canvas>
<div class="label">TRAIL LAB / OLD REDRAW<small>copias completas · tocá o arrastrá para cambiar la trayectoria</small></div>
<button id="pause" aria-label="Pausar" aria-pressed="false">Ⅱ</button>
<div class="credit">Robert Hooke · Micrographia · 1665 · dominio público · Wikimedia Commons</div>
<div class="readout" id="readout">0 COPIAS COMPLETAS</div>
<div class="loading" id="loading">aislando espécimen</div>

<script>
(()=>{
'use strict';

const ASSET='https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Flea_Micrographia_Hooke.png/960px-Flea_Micrographia_Hooke.png';
const SOURCE_CROP={sx:0,sy:18,sw:960,sh:724};
const BG='#3155ff';
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

const canvas=document.getElementById('stage');
const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
const loading=document.getElementById('loading');
const readout=document.getElementById('readout');
const pauseButton=document.getElementById('pause');

const img=new Image();
img.decoding='async';
img.crossOrigin='anonymous';
img.referrerPolicy='no-referrer';

const sprite=document.createElement('canvas');
const spriteCtx=sprite.getContext('2d',{willReadFrequently:true});
let spriteReady=false;

let W=1,H=1;
let x=0,y=0;
let vx=460,vy=285;
let paused=false;
let last=0;
let stampClock=0;
let stamps=[];
let pointerDown=false;
let pointerLast=null;
let lastCount=-1;

const SPEED=reduced?250:520;
const STAMP_MS=reduced?48:24;
const LIFE_MS=reduced?880:720;
const MAX_STAMPS=reduced?20:34;
const FAN_STAMPS=reduced?3:7;

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function wrapAngle(a){
  while(a>Math.PI)a-=Math.PI*2;
  while(a<-Math.PI)a+=Math.PI*2;
  return a;
}
function lerpAngle(a,b,t){return a+wrapAngle(b-a)*t}
function setSpeed(angle){
  vx=Math.cos(angle)*SPEED;
  vy=Math.sin(angle)*SPEED;
}
function spriteSize(){
  const w=Math.round(clamp(Math.min(W*.265,H*.46),155,310));
  return {w,h:Math.round(w*(SOURCE_CROP.sh/SOURCE_CROP.sw))};
}
function configure(c){
  c.imageSmoothingEnabled=false;
  c.globalAlpha=1;
  c.globalCompositeOperation='source-over';
  c.filter='none';
}
function isolateSprite(){
  const sw=480,sh=Math.round(sw*(SOURCE_CROP.sh/SOURCE_CROP.sw));
  sprite.width=sw;
  sprite.height=sh;
  spriteCtx.clearRect(0,0,sw,sh);
  spriteCtx.imageSmoothingEnabled=true;
  spriteCtx.drawImage(
    img,
    SOURCE_CROP.sx,SOURCE_CROP.sy,SOURCE_CROP.sw,SOURCE_CROP.sh,
    0,0,sw,sh
  );
  try{
    const data=spriteCtx.getImageData(0,0,sw,sh);
    const p=data.data;
    for(let i=0;i<p.length;i+=4){
      const lum=p[i]*.299+p[i+1]*.587+p[i+2]*.114;
      const alpha=clamp((247-lum)*5.25,0,255);
      p[i]=5;p[i+1]=5;p[i+2]=5;p[i+3]=alpha;
    }
    spriteCtx.clearRect(0,0,sw,sh);
    spriteCtx.putImageData(data,0,0);
    spriteReady=true;
  }catch(_){
    spriteReady=false;
  }
}
function drawWhole(px,py,angle,flip,scale=1){
  const s=spriteSize();
  const w=s.w*scale,h=s.h*scale;
  ctx.save();
  ctx.translate(Math.round(px),Math.round(py));
  ctx.rotate(angle);
  ctx.scale(flip,1);
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  ctx.imageSmoothingEnabled=false;
  if(spriteReady){
    ctx.drawImage(sprite,-w*.5,-h*.5,w,h);
  }else{
    ctx.globalCompositeOperation='multiply';
    ctx.filter='grayscale(1) contrast(1.7)';
    ctx.drawImage(
      img,
      SOURCE_CROP.sx,SOURCE_CROP.sy,SOURCE_CROP.sw,SOURCE_CROP.sh,
      -w*.5,-h*.5,w,h
    );
  }
  ctx.restore();
  configure(ctx);
}
function makeStamp(px,py,angle,scale=1,born=performance.now()){
  stamps.push({
    x:px,y:py,
    angle:angle*.16,
    flip:Math.cos(angle)>=0?1:-1,
    scale,
    born
  });
  if(stamps.length>MAX_STAMPS)stamps.splice(0,stamps.length-MAX_STAMPS);
}
function seedComposition(now){
  stamps.length=0;
  const angle=Math.atan2(vy,vx);
  const s=spriteSize();
  const step=Math.max(12,s.w*.055);
  for(let i=16;i>=1;i--){
    const t=i/16;
    const px=x-Math.cos(angle)*step*i;
    const py=y-Math.sin(angle)*step*i+Math.sin(t*Math.PI)*H*.08;
    makeStamp(px,py,angle-.28*Math.sin(t*Math.PI),1,now-i*STAMP_MS);
  }
}
function stampCurrent(now){
  makeStamp(x,y,Math.atan2(vy,vx),1,now);
}
function bounceFan(now,oldAngle,newAngle){
  for(let i=1;i<=FAN_STAMPS;i++){
    const t=i/(FAN_STAMPS+1);
    const a=lerpAngle(oldAngle,newAngle,t);
    makeStamp(
      x-Math.cos(a)*(FAN_STAMPS-i)*2.2,
      y-Math.sin(a)*(FAN_STAMPS-i)*2.2,
      a,
      lerp(.99,1.035,t),
      now
    );
  }
}
function age(now){
  while(stamps.length && now-stamps[0].born>LIFE_MS)stamps.shift();
  if(stamps.length>MAX_STAMPS)stamps.splice(0,stamps.length-MAX_STAMPS);
}
function update(dt,now){
  const s=spriteSize();
  const rx=s.w*.43,ry=s.h*.42;
  const oldAngle=Math.atan2(vy,vx);
  let hit=false;

  x+=vx*dt;
  y+=vy*dt;

  if(x<rx){x=rx;vx=Math.abs(vx);hit=true}
  else if(x>W-rx){x=W-rx;vx=-Math.abs(vx);hit=true}

  if(y<ry){y=ry;vy=Math.abs(vy);hit=true}
  else if(y>H-ry){y=H-ry;vy=-Math.abs(vy);hit=true}

  const speed=Math.hypot(vx,vy)||1;
  vx=vx/speed*SPEED;
  vy=vy/speed*SPEED;

  stampClock+=dt*1000;
  while(stampClock>=STAMP_MS){
    stampClock-=STAMP_MS;
    stampCurrent(now-stampClock);
  }

  if(hit){
    const newAngle=Math.atan2(vy,vx);
    bounceFan(now,oldAngle,newAngle);
    stampClock=0;
  }
  age(now);
}
function render(now){
  ctx.fillStyle=BG;
  ctx.fillRect(0,0,W,H);

  for(let i=0;i<stamps.length;i++){
    const s=stamps[i];
    drawWhole(s.x,s.y,s.angle,s.flip,s.scale);
  }

  const angle=Math.atan2(vy,vx);
  drawWhole(x,y,angle*.16,Math.cos(angle)>=0?1:-1,1.045);

  if(stamps.length!==lastCount){
    lastCount=stamps.length;
    readout.textContent=stamps.length+' COPIAS COMPLETAS';
  }
}
function resize(){
  W=Math.max(1,Math.floor(innerWidth));
  H=Math.max(1,Math.floor(innerHeight));
  canvas.width=W;
  canvas.height=H;
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  configure(ctx);

  if(!x&&!y){
    x=W*.28;
    y=H*.46;
  }else{
    const s=spriteSize();
    x=clamp(x,s.w*.43,W-s.w*.43);
    y=clamp(y,s.h*.42,H-s.h*.42);
  }
  seedComposition(performance.now());
  render(performance.now());
}
function steer(cx,cy){
  const dx=cx-x,dy=cy-y;
  if(Math.hypot(dx,dy)<8)return;
  setSpeed(Math.atan2(dy,dx));
  const now=performance.now();
  stampCurrent(now);
}
function tick(now){
  requestAnimationFrame(tick);
  if(paused){last=now;render(now);return}
  const dt=Math.min(.034,Math.max(.001,(now-(last||now-16))/1000));
  last=now;
  update(dt,now);
  render(now);
}

canvas.addEventListener('pointerdown',e=>{
  pointerDown=true;
  pointerLast={x:e.clientX,y:e.clientY};
  steer(e.clientX,e.clientY);
  canvas.setPointerCapture?.(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  if(!pointerDown)return;
  if(!pointerLast||Math.hypot(e.clientX-pointerLast.x,e.clientY-pointerLast.y)>22){
    steer(e.clientX,e.clientY);
    pointerLast={x:e.clientX,y:e.clientY};
  }
});
canvas.addEventListener('pointerup',()=>{pointerDown=false;pointerLast=null});
canvas.addEventListener('pointercancel',()=>{pointerDown=false;pointerLast=null});

pauseButton.addEventListener('click',e=>{
  paused=!paused;
  e.currentTarget.textContent=paused?'▶':'Ⅱ';
  e.currentTarget.setAttribute('aria-pressed',paused?'true':'false');
  e.currentTarget.setAttribute('aria-label',paused?'Reanudar':'Pausar');
});

addEventListener('resize',resize,{passive:true});

img.onload=()=>{
  isolateSprite();
  loading.classList.add('off');
  x=innerWidth*.28;
  y=innerHeight*.46;
  const startAngle=.56;
  setSpeed(startAngle);
  resize();
  requestAnimationFrame(tick);
};
img.onerror=()=>{
  loading.textContent='asset no disponible';
  loading.style.opacity='1';
};
img.src=ASSET;

})();
</script>
</body>
</html>
