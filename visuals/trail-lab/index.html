<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2c5cff">
<title>Prometeo · Trail Lab</title>
<style>
:root{--bg:#2c5cff;--ink:#090909;--paper:#f5f1e8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{overscroll-behavior:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.topbar{position:fixed;z-index:4;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;gap:16px;pointer-events:none;color:var(--ink);mix-blend-mode:multiply}
.title{font:900 11px/1 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;max-width:38vw}
.title small{display:block;margin-top:4px;font:700 8px/1.25 Arial,sans-serif;letter-spacing:.04em;opacity:.72}
.modes{pointer-events:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
button{appearance:none;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--ink);min-height:42px;padding:0 9px;font:900 10px/1 Arial,sans-serif;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
button[aria-pressed="true"]{border-bottom-color:currentColor}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#pause{min-width:42px;font-size:15px;padding:0}
.credit{position:fixed;z-index:4;left:max(12px,env(safe-area-inset-left));bottom:max(9px,env(safe-area-inset-bottom));font:700 8px/1.25 Arial,sans-serif;letter-spacing:.03em;color:var(--ink);opacity:.66;mix-blend-mode:multiply;pointer-events:none;max-width:62vw}
.status{position:fixed;z-index:5;right:max(12px,env(safe-area-inset-right));bottom:max(9px,env(safe-area-inset-bottom));font:900 9px/1 Arial,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--ink);mix-blend-mode:multiply;pointer-events:none}
.loading{position:fixed;inset:0;z-index:6;display:grid;place-items:center;background:#2c5cff;color:#090909;font:900 12px/1 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;transition:opacity .18s linear;pointer-events:none}
.loading.off{opacity:0}
@media(max-width:700px){
 .topbar{gap:6px}.title{font-size:9px;max-width:28vw}.title small{display:none}.modes{max-width:70vw;gap:0}button{min-height:40px;padding:0 7px;font-size:8px}.credit{font-size:7px;max-width:54vw}.status{font-size:7px}
}
@media(prefers-reduced-motion:reduce){.status:after{content:' · movimiento reducido'}}
</style>
</head>
<body>
<canvas id="stage" aria-label="Ilustración histórica de una pulga repetida en estampas duras mientras rebota por la pantalla"></canvas>
<div class="topbar">
  <div class="title">TRAIL LAB / IMAGE FIRST<small>arrastrá o tocá el campo para alterar la trayectoria</small></div>
  <div class="modes" role="group" aria-label="Variantes visuales">
    <button data-mode="redraw" aria-pressed="true">Redraw</button>
    <button data-mode="buffer" aria-pressed="false">Buffer cut</button>
    <button data-mode="chain" aria-pressed="false">Chain beast</button>
    <button id="pause" aria-label="Pausar" aria-pressed="false">Ⅱ</button>
  </div>
</div>
<div class="credit">Robert Hooke · Micrographia · 1665 · dominio público</div>
<div class="status" id="status">REDRAW · STAMPS DUROS</div>
<div class="loading" id="loading">cargando espécimen</div>
<script>
(()=>{
'use strict';
const ASSET='https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Flea_Micrographia_Hooke.png/960px-Flea_Micrographia_Hooke.png';
const canvas=document.getElementById('stage');
const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
const loading=document.getElementById('loading');
const status=document.getElementById('status');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const img=new Image();
img.decoding='async';img.referrerPolicy='no-referrer';

const presets={
 redraw:{bg:'#2c5cff',label:'REDRAW · STAMPS DUROS',spacing:42,max:22,speed:reduced?1.15:2.55,scale:.23},
 buffer:{bg:'#ff4f86',label:'BUFFER CUT · BLOQUES DISCONTINUOS',spacing:31,max:34,speed:reduced?1.25:2.9,scale:.21},
 chain:{bg:'#d8ff3f',label:'CHAIN BEAST · CADENA SEGMENTADA',spacing:23,max:44,speed:reduced?.9:2.05,scale:.18}
};
let mode='redraw',W=1,H=1,dpr=1,x=0,y=0,vx=2.2,vy=1.45,angle=0,last=0,acc=0,paused=false,frame=0;
let points=[],scars=[],frozen=[],pointerDown=false,lastPointer=null;
const crop={sx:0,sy:22,sw:960,sh:720};

function baseSize(){
  const p=presets[mode];
  const w=Math.max(138,Math.min(285,W*p.scale));
  return {w,h:w*(crop.sh/crop.sw)};
}
function resize(){
  dpr=Math.min(devicePixelRatio||1,W<700?1.35:1.6);
  W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);
  canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=true;
  if(!points.length){x=W*.28;y=H*.43;seedHistory()}
}
function seedHistory(){
  points.length=0;
  const n=34;
  for(let i=n;i>=0;i--){
    const t=i/n;
    points.push({x:W*(.18+.64*(1-t)),y:H*(.58-.23*Math.sin(t*Math.PI*1.55)),a:-.18+.36*t,dir:1,stamp:i});
  }
}
function background(){
  const p=presets[mode];
  document.documentElement.style.setProperty('--bg',p.bg);
  document.querySelector('meta[name="theme-color"]').setAttribute('content',p.bg);
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.filter='none';
  ctx.fillStyle=p.bg;ctx.fillRect(0,0,W,H);
}
function drawFlea(p,scale=1,rotation=null,flip=null){
  const s=baseSize(),rot=rotation==null?p.a:rotation,dir=flip==null?(p.dir||1):flip;
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(rot);ctx.scale(dir*scale,scale);
  ctx.globalCompositeOperation='multiply';ctx.globalAlpha=1;ctx.filter='contrast(1.18) grayscale(1)';
  ctx.drawImage(img,crop.sx,crop.sy,crop.sw,crop.sh,-s.w/2,-s.h/2,s.w,s.h);
  ctx.restore();ctx.filter='none';ctx.globalCompositeOperation='source-over';
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function sampleByDistance(list,spacing,limit){
  if(!list.length)return [];
  const out=[list[0]];let anchor=list[0];
  for(let i=1;i<list.length&&out.length<limit;i++)if(dist(anchor,list[i])>=spacing){out.push(list[i]);anchor=list[i]}
  return out;
}
function captureScar(){
  const chosen=sampleByDistance(points.slice(0,15),presets[mode].spacing*.72,5);
  chosen.forEach((p,i)=>scars.push({...p,born:frame,ttl:mode==='chain'?520:380+i*28,scale:1+(i%2)*.035}));
  if(scars.length>24)scars.splice(0,scars.length-24);
}
function captureFrozenBatch(){
  const batch=sampleByDistance(points.slice(8,30),44,7).map((p,i)=>({...p,x:p.x+(i%2?26:-18),y:p.y+((i%3)-1)*17,born:frame,ttl:230+i*9}));
  frozen.push(...batch);if(frozen.length>30)frozen.splice(0,frozen.length-30);
}
function update(){
  const p=presets[mode],s=baseSize();
  x+=vx;y+=vy;angle+=Math.max(-.024,Math.min(.024,(vy*.006)));
  let hit=false;
  const rx=s.w*.42,ry=s.h*.42;
  if(x<rx){x=rx;vx=Math.abs(vx);hit=true}
  else if(x>W-rx){x=W-rx;vx=-Math.abs(vx);hit=true}
  if(y<ry){y=ry;vy=Math.abs(vy);hit=true}
  else if(y>H-ry){y=H-ry;vy=-Math.abs(vy);hit=true}
  if(hit){captureScar();if(mode==='buffer')captureFrozenBatch();angle*=-.55}
  const speed=Math.hypot(vx,vy)||1;vx=vx/speed*p.speed;vy=vy/speed*p.speed;
  const dir=vx>=0?1:-1;
  points.unshift({x,y,a:mode==='redraw'?0:Math.atan2(vy,vx)*.18,dir,stamp:frame});
  if(points.length>460)points.length=460;
  scars=scars.filter(s=>frame-s.born<s.ttl);frozen=frozen.filter(s=>frame-s.born<s.ttl);
  frame++;
  if(mode==='buffer'&&frame%96===0)captureFrozenBatch();
}
function renderRedraw(){
  const stamps=sampleByDistance(points,42,22);
  const cut=Math.floor(frame/32)%5;
  for(let i=stamps.length-1;i>=0;i--){if(i>5&&i%7===cut)continue;drawFlea(stamps[i],1,0,1)}
  scars.forEach((p,i)=>{if(i%2===0||frame-p.born<95)drawFlea(p,p.scale||1,0,1)});
}
function renderBuffer(){
  const stamps=sampleByDistance(points,31,34);
  frozen.forEach((p,i)=>{if((i%5)!==Math.floor(frame/28)%5)drawFlea(p,1,0,p.dir)});
  for(let i=stamps.length-1;i>=0;i--){
    const block=Math.floor(i/4);
    if(block%3===1)continue;
    const p={...stamps[i]};
    if(block%4===2){p.x+=34;p.y-=13}
    drawFlea(p,1,0,p.dir);
  }
  scars.slice(-10).forEach((p,i)=>{if(i%3!==1)drawFlea(p,1.02,0,p.dir)});
}
function renderChain(){
  const stamps=sampleByDistance(points,23,44);
  for(let i=stamps.length-1;i>=0;i--){
    const p=stamps[i],next=stamps[Math.max(0,i-1)]||p;
    const tangent=Math.atan2(next.y-p.y,next.x-p.x);
    const swell=1+Math.sin(i*.72)*.075;
    drawFlea(p,swell,tangent*.22,p.dir);
  }
  scars.slice(-16).forEach((p,i)=>{if(i%4!==0)drawFlea(p,.94+(i%3)*.025,p.a,p.dir)});
}
function render(){
  if(!img.complete||!img.naturalWidth)return;
  background();
  if(mode==='redraw')renderRedraw();
  else if(mode==='buffer')renderBuffer();
  else renderChain();
}
function tick(t){
  requestAnimationFrame(tick);if(paused)return;
  const dt=Math.min(42,t-last||16);last=t;acc+=dt;const step=reduced?30:16;
  while(acc>=step){update();acc-=step}render();
}
function setMode(next){
  mode=next;points.length=0;scars.length=0;frozen.length=0;seedHistory();
  const p=presets[mode],signX=Math.sign(vx||1),signY=Math.sign(vy||1);vx=signX*p.speed;vy=signY*p.speed*.62;
  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode?'true':'false'));
  status.textContent=p.label;render();
}
function steer(cx,cy){
  const dx=cx-x,dy=cy-y,len=Math.hypot(dx,dy)||1,s=presets[mode].speed*1.14;vx=dx/len*s;vy=dy/len*s;
  if(mode==='buffer')captureFrozenBatch();
}
canvas.addEventListener('pointerdown',e=>{pointerDown=true;lastPointer={x:e.clientX,y:e.clientY};steer(e.clientX,e.clientY);canvas.setPointerCapture?.(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!pointerDown)return;if(!lastPointer||Math.hypot(e.clientX-lastPointer.x,e.clientY-lastPointer.y)>34){steer(e.clientX,e.clientY);lastPointer={x:e.clientX,y:e.clientY}}});
canvas.addEventListener('pointerup',()=>{pointerDown=false;lastPointer=null});
canvas.addEventListener('pointercancel',()=>{pointerDown=false;lastPointer=null});
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
document.getElementById('pause').addEventListener('click',e=>{paused=!paused;e.currentTarget.textContent=paused?'▶':'Ⅱ';e.currentTarget.setAttribute('aria-pressed',paused?'true':'false');e.currentTarget.setAttribute('aria-label',paused?'Reanudar':'Pausar');if(!paused)last=performance.now()});
addEventListener('resize',resize,{passive:true});
img.onload=()=>{loading.classList.add('off');resize();setMode('redraw');requestAnimationFrame(tick)};
img.onerror=()=>{loading.textContent='asset no disponible';loading.style.opacity='1'};
img.src=ASSET;
})();
</script>
</body>
</html>
