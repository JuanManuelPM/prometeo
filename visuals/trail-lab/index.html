<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3155ff">
<title>Prometeo · Trail Lab</title>
<style>
:root{--bg:#3155ff;--ink:#070707}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{overscroll-behavior:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.label{position:fixed;z-index:3;left:max(12px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));pointer-events:none;font:900 10px/1 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;mix-blend-mode:multiply}
.label small{display:block;margin-top:5px;font:700 8px/1.25 Arial,sans-serif;letter-spacing:.03em;opacity:.64}
.credit{position:fixed;z-index:3;left:max(12px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));max-width:min(48vw,500px);font:700 8px/1.25 Arial,sans-serif;letter-spacing:.03em;opacity:.62;mix-blend-mode:multiply;pointer-events:none}
.readout{position:fixed;z-index:3;right:max(12px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));font:900 8px/1 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;mix-blend-mode:multiply;pointer-events:none}
.pause{position:fixed;z-index:5;right:max(9px,env(safe-area-inset-right));top:max(7px,env(safe-area-inset-top));width:48px;height:44px;padding:0;border:0;background:transparent;color:var(--ink);font:900 17px/1 Arial,sans-serif;cursor:pointer}
.pause:focus-visible,.variant:focus-visible{outline:3px solid currentColor;outline-offset:-4px}
.variants{position:fixed;z-index:5;left:50%;top:max(7px,env(safe-area-inset-top));transform:translateX(-50%);display:flex;gap:4px;max-width:calc(100vw - 118px);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:0 2px}.variants::-webkit-scrollbar{display:none}
.variant{flex:0 0 auto;min-width:58px;height:44px;padding:0 9px;border:2px solid currentColor;background:rgba(255,255,255,.16);color:var(--ink);font:900 8px/1 Arial,sans-serif;letter-spacing:.055em;text-transform:uppercase;cursor:pointer;mix-blend-mode:multiply}
.variant[aria-pressed="true"]{background:var(--ink);color:var(--bg);mix-blend-mode:normal}
.loading{position:fixed;inset:0;z-index:7;display:grid;place-items:center;background:var(--bg);font:900 11px/1 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;transition:opacity .12s linear;pointer-events:none}.loading.off{opacity:0}
@media(max-width:720px){.variant{min-width:54px;padding:0 7px}.credit{max-width:42vw}.variants{max-width:calc(100vw - 108px)}}
@media(max-width:720px) and (orientation:portrait){
  .label{display:none}
  .variants{left:8px;right:58px;top:max(6px,env(safe-area-inset-top));transform:none;max-width:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;overflow:visible;padding:0}
  .variant{min-width:0;height:34px;padding:0 2px;font-size:6.5px;letter-spacing:.02em}
  .pause{top:max(5px,env(safe-area-inset-top));height:34px;width:46px}
}
@media(max-height:500px){.label{font-size:9px;top:8px}.label small{display:none}.credit,.readout{font-size:7px}.variants{top:7px}.variant{height:44px}}
@media(prefers-reduced-motion:reduce){.label small{display:none}}
</style>
</head>
<body>
<canvas id="stage" aria-label="Figuras recortadas repetidas en copias completas durante el movimiento"></canvas>
<div class="label">TRAIL LAB / CUTOUT REDRAW<small>copias completas · siluetas recortadas · sin flip brusco · tocá o arrastrá</small></div>
<div class="variants" id="variants" aria-label="Variantes visuales"></div>
<button class="pause" id="pause" aria-label="Pausar" aria-pressed="false">Ⅱ</button>
<div class="credit" id="credit"></div>
<div class="readout" id="readout">0 COPIAS</div>
<div class="loading" id="loading">cargando figura</div>
<script>
(()=>{
'use strict';

const VARIANTS=[
  {
    id:'baseline',label:'1 BASE',name:'Pulga · Micrographia',
    src:'assets/01-base.png',bg:'#3155ff',size:1,orientation:'fixed',baseAngle:.03,maxH:.70,
    credit:'1 BASE · Robert Hooke · Micrographia · 1665 · dominio público · asset local'
  },
  {
    id:'wings',label:'2 WINGS',name:'Mantis ocelada · placa 1782',
    src:'assets/02-wings.png',bg:'#90c879',size:.98,orientation:'fixed',baseAngle:0,maxH:.72,
    credit:'2 WINGS · FAVORITA · Dru Drury · Pseudocreobotra ocellata · 1782 · dominio público · asset local'
  },
  {
    id:'oni',label:'3 ONI',name:'Oni ritual · máscara de exorcismo',
    src:'assets/03-oni.png',bg:'#19b8a7',size:1.08,orientation:'fixed',baseAngle:0,maxH:.72,maxW:.34,
    credit:'3 ONI · máscara ritual japonesa · Edo · Freer Gallery · CC0 · asset local'
  },
  {
    id:'hannya',label:'4 HANNYA',name:'Hannya · máscara Noh',
    src:'assets/04-hannya.png',bg:'#ff5d6c',size:1.08,orientation:'fixed',baseAngle:0,maxH:.74,maxW:.34,
    credit:'4 HANNYA · máscara Noh · Tokyo National Museum · Gov. Japan / CC BY compatible · asset local'
  },
  {
    id:'shishi',label:'5 SHISHI',name:'Shishiguchi · máscara de león',
    src:'assets/05-shishi.png',bg:'#c6df39',size:1.12,orientation:'fixed',baseAngle:0,maxH:.76,maxW:.35,
    credit:'5 SHISHI · máscara Noh de león · Tokyo National Museum · Gov. Japan / CC BY compatible · asset local'
  },
  {
    id:'shikami',label:'6 SHIKAMI',name:'Shikami · máscara demonio',
    src:'assets/06-shikami.png',bg:'#6c78ff',size:1.10,orientation:'fixed',baseAngle:0,maxH:.76,maxW:.35,
    credit:'6 SHIKAMI · máscara Noh demoníaca · Tokyo National Museum · Gov. Japan / CC BY compatible · asset local'
  }
];

const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas=document.getElementById('stage');
const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
const loading=document.getElementById('loading');
const readout=document.getElementById('readout');
const pauseButton=document.getElementById('pause');
const variantsEl=document.getElementById('variants');
const credit=document.getElementById('credit');
const themeMeta=document.querySelector('meta[name="theme-color"]');

const img=new Image();
img.decoding='async';

const sprite=document.createElement('canvas');
const spriteCtx=sprite.getContext('2d',{willReadFrequently:true});
let spriteReady=false;
let assetReady=false;
let spriteRatio=.75;
let active=VARIANTS[1];
let loadToken=0;

let W=1,H=1,x=0,y=0,vx=460,vy=285;
let paused=false,last=0,stampClock=0,pointerDown=false,pointerLast=null,lastCount=-1;
let visualAngle=active.baseAngle||0;

const SPEED=reduced?250:520;
const LIFE_MS=reduced?880:720;
const POOL_SIZE=40;
const stampPool=Array.from({length:POOL_SIZE},()=>({x:0,y:0,angle:0,scale:1,born:0}));
let stampStart=0,stampCount=0;

const QUALITY=[
  {scale:.72,max:22,stamp:34,fan:4},
  {scale:.86,max:28,stamp:28,fan:5},
  {scale:1,max:34,stamp:24,fan:7}
];
let quality=reduced?0:2;
let frameEMA=16.7;
let lastQualityShift=performance.now();

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function wrapAngle(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a}
function lerpAngle(a,b,t){return a+wrapAngle(b-a)*t}
function q(){return QUALITY[quality]}
function setSpeed(angle){vx=Math.cos(angle)*SPEED;vy=Math.sin(angle)*SPEED}
function motionAngle(){return Math.atan2(vy,vx)}
function desiredAngle(){
  if(active.orientation==='fixed')return active.baseAngle||0;
  return motionAngle()+(active.angleOffset||0);
}
function updateVisualAngle(dt){
  if(active.orientation==='fixed'){visualAngle=active.baseAngle||0;return}
  const rate=active.turnRate||4.5;
  visualAngle=lerpAngle(visualAngle,desiredAngle(),1-Math.exp(-rate*dt));
}
function spriteSize(){
  let w=clamp(Math.min(W*.27,H*.47),150,320)*(active.size||1);
  let h=w*spriteRatio;
  const maxH=H*(active.maxH||.72),maxW=W*(active.maxW||.38);
  if(h>maxH){const k=maxH/h;w*=k;h*=k}
  if(w>maxW){const k=maxW/w;w*=k;h*=k}
  return {w:Math.round(w),h:Math.round(h)};
}
function configure(c){c.imageSmoothingEnabled=false;c.globalAlpha=1;c.globalCompositeOperation='source-over';c.filter='none'}
function applyCanvasMetrics(){
  const s=q().scale;
  canvas.width=Math.max(1,Math.floor(W*s));
  canvas.height=Math.max(1,Math.floor(H*s));
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  ctx.setTransform(s,0,0,s,0,0);
  configure(ctx);
}
function isolateSprite(){
  const sw=480,sh=Math.max(1,Math.round(sw*(img.naturalHeight/img.naturalWidth)));
  sprite.width=sw;sprite.height=sh;spriteRatio=sh/sw;
  spriteCtx.clearRect(0,0,sw,sh);
  spriteCtx.imageSmoothingEnabled=true;
  spriteCtx.drawImage(img,0,0,sw,sh);
  spriteReady=true;
}
function drawWhole(px,py,angle,scale=1){
  if(!assetReady)return;
  const s=spriteSize(),w=s.w*scale,h=s.h*scale;
  ctx.save();
  ctx.translate(Math.round(px),Math.round(py));
  ctx.rotate(angle);
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  ctx.imageSmoothingEnabled=false;
  if(spriteReady)ctx.drawImage(sprite,-w*.5,-h*.5,w,h);
  else ctx.drawImage(img,-w*.5,-h*.5,w,h);
  ctx.restore();
  configure(ctx);
}
function clearStamps(){stampStart=0;stampCount=0}
function firstStamp(){return stampCount?stampPool[stampStart]:null}
function trimToBudget(){
  while(stampCount>q().max){stampStart=(stampStart+1)%POOL_SIZE;stampCount--}
}
function makeStamp(px,py,angle,scale=1,born=performance.now()){
  let idx;
  if(stampCount>=Math.min(q().max,POOL_SIZE)){
    stampStart=(stampStart+1)%POOL_SIZE;
    idx=(stampStart+stampCount-1)%POOL_SIZE;
  }else{
    idx=(stampStart+stampCount)%POOL_SIZE;
    stampCount++;
  }
  const s=stampPool[idx];
  s.x=px;s.y=py;s.angle=angle;s.scale=scale;s.born=born;
}
function seedComposition(now){
  clearStamps();
  const a=motionAngle(),s=spriteSize(),step=Math.max(12,s.w*.055);
  for(let i=16;i>=1;i--){
    const t=i/16;
    makeStamp(
      x-Math.cos(a)*step*i,
      y-Math.sin(a)*step*i+Math.sin(t*Math.PI)*H*.08,
      visualAngle,
      1,
      now-i*q().stamp
    );
  }
}
function stampCurrent(now){makeStamp(x,y,visualAngle,1,now)}
function bounceFan(now,oldMotion,newMotion){
  const count=q().fan;
  for(let i=1;i<=count;i++){
    const t=i/(count+1),a=lerpAngle(oldMotion,newMotion,t);
    makeStamp(
      x-Math.cos(a)*(count-i)*2.2,
      y-Math.sin(a)*(count-i)*2.2,
      visualAngle,
      lerp(.99,1.035,t),
      now
    );
  }
}
function age(now){
  while(stampCount){
    const s=firstStamp();
    if(!s||now-s.born<=LIFE_MS)break;
    stampStart=(stampStart+1)%POOL_SIZE;
    stampCount--;
  }
  trimToBudget();
}
function update(dt,now){
  const s=spriteSize(),rx=s.w*.43,ry=s.h*.42,oldMotion=motionAngle();
  let hit=false;
  x+=vx*dt;y+=vy*dt;
  if(x<rx){x=rx;vx=Math.abs(vx);hit=true}else if(x>W-rx){x=W-rx;vx=-Math.abs(vx);hit=true}
  if(y<ry){y=ry;vy=Math.abs(vy);hit=true}else if(y>H-ry){y=H-ry;vy=-Math.abs(vy);hit=true}
  const speed=Math.hypot(vx,vy)||1;vx=vx/speed*SPEED;vy=vy/speed*SPEED;
  updateVisualAngle(dt);
  stampClock+=dt*1000;
  while(stampClock>=q().stamp){stampClock-=q().stamp;stampCurrent(now-stampClock)}
  if(hit){bounceFan(now,oldMotion,motionAngle());stampClock=0}
  age(now);
}
function forEachStamp(fn){
  for(let i=0;i<stampCount;i++)fn(stampPool[(stampStart+i)%POOL_SIZE],i);
}
function render(){
  ctx.fillStyle=active.bg;ctx.fillRect(0,0,W,H);
  forEachStamp(s=>drawWhole(s.x,s.y,s.angle,s.scale));
  drawWhole(x,y,visualAngle,1.045);
  if(stampCount!==lastCount){
    lastCount=stampCount;
    readout.textContent=stampCount+' COPIAS · '+active.label;
  }
}
function resize(){
  W=Math.max(1,Math.floor(innerWidth));H=Math.max(1,Math.floor(innerHeight));
  applyCanvasMetrics();
  if(!x&&!y){x=W*.28;y=H*.46}
  else{
    const s=spriteSize();
    x=clamp(x,s.w*.43,W-s.w*.43);y=clamp(y,s.h*.42,H-s.h*.42);
  }
  seedComposition(performance.now());render();
}
function steer(cx,cy){
  const dx=cx-x,dy=cy-y;if(Math.hypot(dx,dy)<8)return;
  setSpeed(Math.atan2(dy,dx));
  stampCurrent(performance.now());
}
function setQuality(next,now){
  if(reduced)return;
  next=clamp(next,0,QUALITY.length-1);
  if(next===quality)return;
  quality=next;lastQualityShift=now;trimToBudget();applyCanvasMetrics();render();
}
function monitorFrame(ms,now){
  if(reduced||ms<6||ms>80)return;
  frameEMA=frameEMA*.94+ms*.06;
  const since=now-lastQualityShift;
  if(frameEMA>21.5&&quality>0&&since>3500)setQuality(quality-1,now);
  else if(frameEMA<17.4&&quality<2&&since>8000)setQuality(quality+1,now);
}
function tick(now){
  requestAnimationFrame(tick);
  if(document.hidden){last=now;return}
  if(paused){last=now;render();return}
  const raw=now-(last||now-16);
  monitorFrame(raw,now);
  const dt=Math.min(.034,Math.max(.001,raw/1000));
  last=now;update(dt,now);render();
}
function syncButtons(){
  for(const b of variantsEl.querySelectorAll('button'))b.setAttribute('aria-pressed',b.dataset.variant===active.id?'true':'false');
}
function preloadRest(){
  const run=()=>{
    for(const v of VARIANTS){
      if(v.id===active.id)continue;
      const p=new Image();p.decoding='async';p.src=v.src;
    }
  };
  if('requestIdleCallback'in window)requestIdleCallback(run,{timeout:1800});else setTimeout(run,700);
}
function loadVariant(id,initial=false){
  const next=VARIANTS.find(v=>v.id===id);
  if(!next||(!initial&&next.id===active.id))return;
  active=next;spriteReady=false;assetReady=false;lastCount=-1;const token=++loadToken;
  visualAngle=desiredAngle();
  document.documentElement.style.setProperty('--bg',active.bg);
  themeMeta.setAttribute('content',active.bg);
  credit.textContent=active.credit;
  loading.textContent='cargando '+active.name;
  loading.style.opacity='';loading.classList.remove('off');syncButtons();
  img.onload=()=>{
    if(token!==loadToken)return;
    assetReady=true;isolateSprite();loading.classList.add('off');
    if(!x&&!y){x=innerWidth*.28;y=innerHeight*.46}
    resize();visualAngle=desiredAngle();seedComposition(performance.now());render();
    if(initial)preloadRest();
  };
  img.onerror=()=>{
    if(token!==loadToken)return;
    loading.textContent='asset no disponible · '+active.label;loading.style.opacity='1';
  };
  img.src=active.src;
}

for(const v of VARIANTS){
  const b=document.createElement('button');
  b.type='button';b.className='variant';b.dataset.variant=v.id;b.textContent=v.label;
  b.setAttribute('aria-label','Mostrar '+v.name);
  b.setAttribute('aria-pressed',v.id===active.id?'true':'false');
  b.addEventListener('click',()=>loadVariant(v.id));
  variantsEl.appendChild(b);
}
canvas.addEventListener('pointerdown',e=>{pointerDown=true;pointerLast={x:e.clientX,y:e.clientY};steer(e.clientX,e.clientY);canvas.setPointerCapture?.(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!pointerDown)return;if(!pointerLast||Math.hypot(e.clientX-pointerLast.x,e.clientY-pointerLast.y)>22){steer(e.clientX,e.clientY);pointerLast={x:e.clientX,y:e.clientY}}});
canvas.addEventListener('pointerup',()=>{pointerDown=false;pointerLast=null});
canvas.addEventListener('pointercancel',()=>{pointerDown=false;pointerLast=null});
pauseButton.addEventListener('click',e=>{paused=!paused;e.currentTarget.textContent=paused?'▶':'Ⅱ';e.currentTarget.setAttribute('aria-pressed',paused?'true':'false');e.currentTarget.setAttribute('aria-label',paused?'Reanudar':'Pausar')});
addEventListener('resize',resize,{passive:true});
document.addEventListener('visibilitychange',()=>{last=performance.now();stampClock=0});
const startAngle=.56;setSpeed(startAngle);visualAngle=desiredAngle();loadVariant('wings',true);requestAnimationFrame(tick);
})();
</script>
</body>
</html>
