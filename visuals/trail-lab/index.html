<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2d47e8">
<title>Prometeo · Trail Lab</title>
<style>
:root{--bg:#2d47e8;--ink:#080808}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{overscroll-behavior:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.topbar{position:fixed;z-index:4;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;gap:16px;pointer-events:none;color:var(--ink);mix-blend-mode:multiply}
.title{font:900 11px/1 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;max-width:38vw}.title small{display:block;margin-top:4px;font:700 8px/1.25 Arial,sans-serif;letter-spacing:.04em;opacity:.7}
.modes{pointer-events:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
button{appearance:none;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--ink);min-height:42px;padding:0 9px;font:900 10px/1 Arial,sans-serif;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
button[aria-pressed="true"]{border-bottom-color:currentColor}button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}#pause{min-width:42px;font-size:15px;padding:0}
.credit{position:fixed;z-index:4;left:max(12px,env(safe-area-inset-left));bottom:max(9px,env(safe-area-inset-bottom));font:700 8px/1.25 Arial,sans-serif;letter-spacing:.03em;color:var(--ink);opacity:.62;mix-blend-mode:multiply;pointer-events:none;max-width:62vw}
.status{position:fixed;z-index:5;right:max(12px,env(safe-area-inset-right));bottom:max(9px,env(safe-area-inset-bottom));font:900 9px/1 Arial,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--ink);mix-blend-mode:multiply;pointer-events:none}
.loading{position:fixed;inset:0;z-index:6;display:grid;place-items:center;background:#2d47e8;color:#080808;font:900 12px/1 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;transition:opacity .12s linear;pointer-events:none}.loading.off{opacity:0}
@media(max-width:700px){.topbar{gap:6px}.title{font-size:9px;max-width:29vw}.title small{display:none}.modes{max-width:69vw;gap:0}button{min-height:40px;padding:0 7px;font-size:8px}.credit{font-size:7px;max-width:54vw}.status{font-size:7px}}
@media(prefers-reduced-motion:reduce){.status:after{content:' · reducido'}}
</style>
</head>
<body>
<canvas id="stage" aria-label="Pulga de Micrographia moviéndose con rastros de buffer roto y redraw incompleto"></canvas>
<div class="topbar">
  <div class="title">TRAIL LAB / BROKEN REDRAW<small>tocá o arrastrá para desviar el espécimen</small></div>
  <div class="modes" role="group" aria-label="Perfiles de corrupción de buffer">
    <button data-mode="redraw" aria-pressed="true">Redraw</button>
    <button data-mode="vram" aria-pressed="false">VRAM</button>
    <button data-mode="rebound" aria-pressed="false">Rebound</button>
    <button id="pause" aria-label="Pausar" aria-pressed="false">Ⅱ</button>
  </div>
</div>
<div class="credit">Robert Hooke · Micrographia · 1665 · dominio público</div>
<div class="status" id="status">REDRAW · MEMORIA SUCIA</div>
<div class="loading" id="loading">cargando espécimen</div>
<script>
(()=>{
'use strict';
const ASSET='https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Flea_Micrographia_Hooke.png/960px-Flea_Micrographia_Hooke.png';
const canvas=document.getElementById('stage');
const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
const memory=document.createElement('canvas');
const mem=memory.getContext('2d',{alpha:false,desynchronized:true});
const loading=document.getElementById('loading');
const status=document.getElementById('status');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const img=new Image();
img.decoding='async';img.referrerPolicy='no-referrer';
const crop={sx:0,sy:22,sw:960,sh:720};
const presets={
  redraw:{bg:'#2d47e8',label:'REDRAW · MEMORIA SUCIA',speed:reduced?1.05:2.55,gap:[17,61],ttl:[780,5600],damage:1.0,copy:.16,bounce:9,scale:.225},
  vram:{bg:'#f03c76',label:'VRAM · BLOQUES PERDIDOS',speed:reduced?1.08:2.7,gap:[12,48],ttl:[560,7200],damage:1.45,copy:.34,bounce:11,scale:.215},
  rebound:{bg:'#cce83a',label:'REBOUND · ACUMULACIÓN',speed:reduced?.95:2.3,gap:[28,78],ttl:[1100,8200],damage:.72,copy:.11,bounce:17,scale:.235}
};
let mode='redraw',W=1,H=1,x=0,y=0,vx=2.3,vy=1.35,paused=false,last=0,acc=0,frame=0;
let distanceSinceStamp=0,nextGap=32,stamps=[],pointerDown=false,lastPointer=null,lastHitFrame=-999;

function rand(a,b){return a+Math.random()*(b-a)}
function randi(a,b){return Math.floor(rand(a,b+1))}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function baseSize(){const p=presets[mode];const w=Math.max(142,Math.min(294,W*p.scale));return {w:Math.round(w),h:Math.round(w*(crop.sh/crop.sw))}}
function currentBg(){return presets[mode].bg}
function configureContext(c){c.imageSmoothingEnabled=false;c.globalCompositeOperation='source-over';c.globalAlpha=1;c.filter='none'}
function fillMemory(){configureContext(mem);mem.fillStyle=currentBg();mem.fillRect(0,0,W,H)}
function resize(){
  W=Math.max(1,Math.floor(innerWidth));H=Math.max(1,Math.floor(innerHeight));
  canvas.width=W;canvas.height=H;memory.width=W;memory.height=H;
  canvas.style.width=W+'px';canvas.style.height=H+'px';configureContext(ctx);configureContext(mem);fillMemory();
  stamps.length=0;x=clamp(x||W*.24,0,W);y=clamp(y||H*.46,0,H);seedDamage();render();
}
function setTheme(){const bg=currentBg();document.documentElement.style.setProperty('--bg',bg);document.querySelector('meta[name="theme-color"]').setAttribute('content',bg)}
function drawFlea(c,px,py,scale=1,dir=1,rotation=0){
  const s=baseSize();
  c.save();c.translate(Math.round(px),Math.round(py));c.rotate(rotation);c.scale(dir*scale,scale);
  c.globalCompositeOperation='multiply';c.globalAlpha=1;c.filter='grayscale(1) contrast(1.48)';c.imageSmoothingEnabled=false;
  c.drawImage(img,crop.sx,crop.sy,crop.sw,crop.sh,-Math.round(s.w/2),-Math.round(s.h/2),s.w,s.h);
  c.restore();c.filter='none';c.globalCompositeOperation='source-over';c.globalAlpha=1;c.imageSmoothingEnabled=false;
}
function recordStamp(px,py,opt={}){
  const p=presets[mode],s=baseSize();
  const scale=opt.scale||1,dir=opt.dir||Math.sign(vx||1)||1,rot=opt.rot||0;
  drawFlea(mem,px,py,scale,dir,rot);
  const ttl=opt.ttl||rand(p.ttl[0],p.ttl[1]);
  stamps.push({x:Math.round(px),y:Math.round(py),w:s.w*scale,h:s.h*scale,dir,rot,scale,die:performance.now()+ttl,stages:opt.stages||randi(1,3)});
  if(stamps.length>190)stamps.splice(0,stamps.length-190);
}
function stampCurrent(force=false){
  const p=presets[mode],dir=Math.sign(vx||1)||1;
  if(!force&&distanceSinceStamp<nextGap)return;
  recordStamp(x,y,{dir});distanceSinceStamp=0;nextGap=rand(p.gap[0],p.gap[1]);
  if(Math.random()<.19){
    const n=randi(1,3);
    for(let i=0;i<n;i++)recordStamp(x+rand(-18,18),y+rand(-14,14),{dir,scale:rand(.97,1.035),ttl:rand(p.ttl[0]*.6,p.ttl[1]*.7),stages:randi(1,2)});
  }
}
function eraseRect(rx,ry,rw,rh){mem.fillStyle=currentBg();mem.fillRect(Math.round(rx),Math.round(ry),Math.max(1,Math.round(rw)),Math.max(1,Math.round(rh)))}
function corruptErase(s,full=false){
  const left=s.x-s.w*.54,top=s.y-s.h*.54,w=s.w*1.08,h=s.h*1.08;
  mem.save();mem.globalCompositeOperation='source-over';mem.globalAlpha=1;mem.filter='none';mem.imageSmoothingEnabled=false;
  if(full||Math.random()<.22){eraseRect(left,top,w,h)}else{
    const pieces=randi(1,4);
    for(let i=0;i<pieces;i++){
      if(Math.random()<.55){const hh=rand(h*.14,h*.42);eraseRect(left+rand(-8,w*.22),top+rand(0,h-hh),w*rand(.46,1.05),hh)}
      else{const ww=rand(w*.13,w*.38);eraseRect(left+rand(0,w-ww),top+rand(-5,h*.18),ww,h*rand(.54,1.05))}
    }
  }
  mem.restore();
}
function ageMemory(now){
  let handled=0;
  for(let i=stamps.length-1;i>=0&&handled<5;i--){
    const s=stamps[i];if(now<s.die)continue;handled++;
    s.stages--;
    if(s.stages<=0||Math.random()<.28){corruptErase(s,Math.random()<.24);stamps.splice(i,1)}
    else{corruptErase(s,false);s.die=now+rand(180,980)}
  }
}
function copyFault(){
  const p=presets[mode];if(!stamps.length||Math.random()>p.copy)return;
  const s=stamps[randi(Math.max(0,stamps.length-28),stamps.length-1)];
  const sw=Math.round(rand(s.w*.26,s.w*.78)),sh=Math.round(rand(s.h*.18,s.h*.62));
  const sx=Math.round(clamp(s.x-s.w*.42+rand(0,s.w*.5),0,Math.max(0,W-sw)));
  const sy=Math.round(clamp(s.y-s.h*.42+rand(0,s.h*.5),0,Math.max(0,H-sh)));
  const dx=Math.round(clamp(sx+rand(-46,46),0,Math.max(0,W-sw)));
  const dy=Math.round(clamp(sy+rand(-26,26),0,Math.max(0,H-sh)));
  mem.save();mem.globalCompositeOperation='source-over';mem.globalAlpha=1;mem.imageSmoothingEnabled=false;
  mem.drawImage(memory,sx,sy,sw,sh,dx,dy,sw,sh);mem.restore();
}
function randomDamage(){
  const p=presets[mode];if(frame%Math.max(14,Math.round(27/p.damage))!==0)return;
  if(Math.random()<.55&&stamps.length){const s=stamps[randi(0,stamps.length-1)];corruptErase(s,false)}
  else{
    mem.save();mem.fillStyle=currentBg();
    if(Math.random()<.5){const h=randi(5,22),yy=randi(0,Math.max(0,H-h));mem.fillRect(0,yy,randi(Math.floor(W*.12),Math.floor(W*.48)),h)}
    else{const w=randi(6,28),xx=randi(0,Math.max(0,W-w));mem.fillRect(xx,0,w,randi(Math.floor(H*.12),Math.floor(H*.5)))}
    mem.restore();
  }
}
function bounceBurst(hitX,hitY){
  const p=presets[mode],s=baseSize(),dir=Math.sign(vx||1)||1;
  for(let i=0;i<p.bounce;i++){
    const push=(i/(Math.max(1,p.bounce-1))-.5);
    recordStamp(x+rand(-s.w*.11,s.w*.11)+(hitX?push*22:0),y+rand(-s.h*.12,s.h*.12)+(hitY?push*18:0),{
      dir,scale:rand(.975,1.045),ttl:rand(p.ttl[1]*.42,p.ttl[1]*1.05),stages:randi(2,4)
    });
  }
  for(let i=0;i<randi(1,3);i++)copyFault();
}
function seedDamage(){
  if(!img.complete||!img.naturalWidth)return;
  const dir=1;
  for(let i=0;i<8;i++)recordStamp(W*(.12+i*.072),H*(.62-.18*Math.sin(i*.55)),{dir,ttl:rand(1200,5200),stages:randi(1,3)});
  corruptErase(stamps[2]||{x:W*.3,y:H*.5,w:120,h:90},false);
}
function update(){
  const p=presets[mode],s=baseSize(),oldX=x,oldY=y;let hitX=false,hitY=false;
  x+=vx;y+=vy;
  const rx=s.w*.43,ry=s.h*.43;
  if(x<rx){x=rx;vx=Math.abs(vx);hitX=true}else if(x>W-rx){x=W-rx;vx=-Math.abs(vx);hitX=true}
  if(y<ry){y=ry;vy=Math.abs(vy);hitY=true}else if(y>H-ry){y=H-ry;vy=-Math.abs(vy);hitY=true}
  const speed=Math.hypot(vx,vy)||1;vx=vx/speed*p.speed;vy=vy/speed*p.speed;
  distanceSinceStamp+=Math.hypot(x-oldX,y-oldY);stampCurrent(false);
  if((hitX||hitY)&&frame-lastHitFrame>5){lastHitFrame=frame;bounceBurst(hitX,hitY);distanceSinceStamp=0;nextGap=rand(p.gap[0]*.55,p.gap[1]*.75)}
  ageMemory(performance.now());if(frame%9===0)copyFault();randomDamage();frame++;
}
function render(){
  if(!img.complete||!img.naturalWidth)return;
  configureContext(ctx);ctx.drawImage(memory,0,0,W,H);
  const dir=Math.sign(vx||1)||1,rot=mode==='vram'?0:Math.round(Math.atan2(vy,vx)*4)/4*.08;
  drawFlea(ctx,x,y,1.015,dir,rot);
}
function tick(t){
  requestAnimationFrame(tick);if(paused)return;
  const dt=Math.min(44,t-last||16);last=t;acc+=dt;const step=reduced?31:16;
  while(acc>=step){update();acc-=step}render();
}
function resetScene(){fillMemory();stamps.length=0;distanceSinceStamp=0;nextGap=rand(...presets[mode].gap);seedDamage();render()}
function setMode(next){
  mode=next;setTheme();const p=presets[mode],sx=Math.sign(vx||1)||1,sy=Math.sign(vy||1)||1;vx=sx*p.speed;vy=sy*p.speed*.61;
  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode?'true':'false'));
  status.textContent=p.label;resetScene();
}
function steer(cx,cy){const dx=cx-x,dy=cy-y,len=Math.hypot(dx,dy)||1,s=presets[mode].speed*1.14;vx=dx/len*s;vy=dy/len*s;recordStamp(x,y,{ttl:rand(700,2400),stages:randi(1,2)});copyFault()}
canvas.addEventListener('pointerdown',e=>{pointerDown=true;lastPointer={x:e.clientX,y:e.clientY};steer(e.clientX,e.clientY);canvas.setPointerCapture?.(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!pointerDown)return;if(!lastPointer||Math.hypot(e.clientX-lastPointer.x,e.clientY-lastPointer.y)>34){steer(e.clientX,e.clientY);lastPointer={x:e.clientX,y:e.clientY}}});
canvas.addEventListener('pointerup',()=>{pointerDown=false;lastPointer=null});canvas.addEventListener('pointercancel',()=>{pointerDown=false;lastPointer=null});
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
document.getElementById('pause').addEventListener('click',e=>{paused=!paused;e.currentTarget.textContent=paused?'▶':'Ⅱ';e.currentTarget.setAttribute('aria-pressed',paused?'true':'false');e.currentTarget.setAttribute('aria-label',paused?'Reanudar':'Pausar');if(!paused)last=performance.now()});
addEventListener('resize',resize,{passive:true});
img.onload=()=>{loading.classList.add('off');x=innerWidth*.24;y=innerHeight*.46;resize();setMode('redraw');requestAnimationFrame(tick)};
img.onerror=()=>{loading.textContent='asset no disponible';loading.style.opacity='1'};
img.src=ASSET;
})();
</script>
</body>
</html>
