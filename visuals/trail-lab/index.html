<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2d47e8">
<title>Prometeo · Trail Lab · Full Frame Residue</title>
<style>
:root{--bg:#2d47e8;--ink:#080808}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{overscroll-behavior:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.top{position:fixed;z-index:4;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));top:max(9px,env(safe-area-inset-top));display:flex;align-items:flex-start;justify-content:space-between;gap:14px;pointer-events:none;mix-blend-mode:multiply}
.title{font:900 11px/1 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}.title small{display:block;margin-top:4px;font:700 8px/1.25 Arial,sans-serif;letter-spacing:.04em;opacity:.66}
#pause{pointer-events:auto;appearance:none;border:0;border-bottom:3px solid currentColor;background:transparent;color:inherit;min-width:46px;min-height:42px;font:900 15px/1 Arial,sans-serif;cursor:pointer}
.credit,.status{position:fixed;z-index:4;bottom:max(9px,env(safe-area-inset-bottom));font:800 8px/1.2 Arial,sans-serif;letter-spacing:.05em;text-transform:uppercase;mix-blend-mode:multiply;pointer-events:none}
.credit{left:max(12px,env(safe-area-inset-left));opacity:.58;text-transform:none;letter-spacing:.02em}.status{right:max(12px,env(safe-area-inset-right))}
.loading{position:fixed;inset:0;z-index:6;display:grid;place-items:center;background:var(--bg);font:900 11px/1 Arial,sans-serif;letter-spacing:.09em;text-transform:uppercase;transition:opacity .12s}.loading.off{opacity:0;pointer-events:none}
@media(max-width:700px){.title{font-size:9px}.title small{display:none}.credit,.status{font-size:7px}}
</style>
</head>
<body>
<canvas id="stage" aria-label="Pulga de Micrographia repetida como cuadros completos de redraw"></canvas>
<div class="top"><div class="title">TRAIL LAB / FULL FRAME RESIDUE<small>copias completas · alta cadencia · el cuadro viejo desaparece entero</small></div><button id="pause" aria-label="Pausar" aria-pressed="false">Ⅱ</button></div>
<div class="credit">Robert Hooke · Micrographia · 1665 · dominio público</div>
<div class="status" id="status">FULL STAMP → FULL STAMP → DROP OLDEST</div>
<div class="loading" id="loading">cargando espécimen</div>
<script>
(()=>{
'use strict';
const ASSET='https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Flea_Micrographia_Hooke.png/960px-Flea_Micrographia_Hooke.png';
const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
const loading=document.getElementById('loading'),pauseButton=document.getElementById('pause');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const img=new Image();img.decoding='async';img.referrerPolicy='no-referrer';
const crop={sx:0,sy:22,sw:960,sh:720};
let W=1,H=1,x=0,y=0,vx=2.8,vy=1.55,last=0,acc=0,paused=false,pointerDown=false,lastPointer=null;
let distance=0,nextGap=13,stamps=[];
const MAX_STAMPS=reduced?8:22;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rand(a,b){return a+Math.random()*(b-a)}
function size(){const w=Math.round(Math.max(150,Math.min(310,W*.235)));return{w,h:Math.round(w*(crop.sh/crop.sw))}}
function configure(){ctx.imageSmoothingEnabled=false;ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.filter='none'}
function resize(){
  W=Math.max(1,Math.floor(innerWidth));H=Math.max(1,Math.floor(innerHeight));canvas.width=W;canvas.height=H;
  x=clamp(x||W*.20,0,W);y=clamp(y||H*.48,0,H);stamps=[];distance=0;render();
}
function drawFlea(px,py,scale,dir,rot,alpha){
  const s=size();ctx.save();ctx.translate(Math.round(px),Math.round(py));ctx.rotate(rot||0);ctx.scale((dir||1)*(scale||1),scale||1);
  ctx.globalAlpha=alpha==null?1:alpha;ctx.globalCompositeOperation='multiply';ctx.filter='grayscale(1) contrast(1.52)';
  ctx.drawImage(img,crop.sx,crop.sy,crop.sw,crop.sh,-Math.round(s.w/2),-Math.round(s.h/2),s.w,s.h);ctx.restore();
}
function pushStamp(px,py,opt={}){
  stamps.push({x:px,y:py,scale:opt.scale||1,dir:opt.dir||Math.sign(vx||1)||1,rot:opt.rot||0,born:performance.now()});
  while(stamps.length>MAX_STAMPS)stamps.shift();
}
function stamp(force=false){
  if(!force&&distance<nextGap)return;
  pushStamp(x,y,{rot:Math.atan2(vy,vx)*.025});distance=0;nextGap=rand(reduced?26:9,reduced?42:18);
}
function bounceFan(hitX,hitY){
  const dir=Math.sign(vx||1)||1,s=size(),n=reduced?4:10;
  for(let i=0;i<n;i++){
    const k=i/Math.max(1,n-1)-.5;
    pushStamp(
      x+(hitX?k*s.w*.20:rand(-s.w*.035,s.w*.035)),
      y+(hitY?k*s.h*.22:rand(-s.h*.04,s.h*.04)),
      {dir,scale:1+Math.abs(k)*.025,rot:k*.11}
    );
  }
}
function update(){
  const s=size(),oldX=x,oldY=y;let hitX=false,hitY=false;
  x+=vx;y+=vy;const rx=s.w*.43,ry=s.h*.43;
  if(x<rx){x=rx;vx=Math.abs(vx);hitX=true}else if(x>W-rx){x=W-rx;vx=-Math.abs(vx);hitX=true}
  if(y<ry){y=ry;vy=Math.abs(vy);hitY=true}else if(y>H-ry){y=H-ry;vy=-Math.abs(vy);hitY=true}
  distance+=Math.hypot(x-oldX,y-oldY);stamp(false);if(hitX||hitY){bounceFan(hitX,hitY);distance=0;nextGap=7}
}
function render(){
  if(!img.complete||!img.naturalWidth)return;configure();ctx.fillStyle='#2d47e8';ctx.fillRect(0,0,W,H);
  const now=performance.now(),n=stamps.length;
  for(let i=0;i<n;i++){
    const s=stamps[i],age=(now-s.born)/1000,rank=(i+1)/Math.max(1,n);
    const alpha=clamp(.22+rank*.58-age*.025,.16,.82);
    drawFlea(s.x,s.y,s.scale,s.dir,s.rot,alpha);
  }
  drawFlea(x,y,1.018,Math.sign(vx||1)||1,Math.atan2(vy,vx)*.025,1);
}
function tick(t){
  requestAnimationFrame(tick);if(paused){render();return}
  const dt=Math.min(40,t-last||16);last=t;acc+=dt;const step=reduced?32:16;
  while(acc>=step){update();acc-=step}render();
}
function steer(cx,cy){
  const dx=cx-x,dy=cy-y,len=Math.hypot(dx,dy)||1,speed=reduced?1.3:3.0;
  pushStamp(x,y);vx=dx/len*speed;vy=dy/len*speed;distance=0;nextGap=5;
}
canvas.addEventListener('pointerdown',e=>{pointerDown=true;lastPointer={x:e.clientX,y:e.clientY};steer(e.clientX,e.clientY);canvas.setPointerCapture?.(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!pointerDown)return;if(!lastPointer||Math.hypot(e.clientX-lastPointer.x,e.clientY-lastPointer.y)>26){steer(e.clientX,e.clientY);lastPointer={x:e.clientX,y:e.clientY}}});
canvas.addEventListener('pointerup',()=>{pointerDown=false;lastPointer=null});canvas.addEventListener('pointercancel',()=>{pointerDown=false;lastPointer=null});
pauseButton.addEventListener('click',()=>{paused=!paused;pauseButton.textContent=paused?'▶':'Ⅱ';pauseButton.setAttribute('aria-pressed',String(paused));if(!paused)last=performance.now()});
addEventListener('resize',resize,{passive:true});
img.onload=()=>{loading.classList.add('off');x=innerWidth*.20;y=innerHeight*.48;resize();for(let i=0;i<9;i++)pushStamp(W*(.11+i*.055),H*(.66-.17*Math.sin(i*.48)),{scale:1,dir:1,rot:(i-4)*.018});requestAnimationFrame(tick)};
img.onerror=()=>{loading.textContent='asset no disponible'};
img.src=ASSET;
})();
</script>
</body>
</html>
