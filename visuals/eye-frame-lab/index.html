<title>Prometeo · Eye Alignment Lab V16</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;background:#606060}
body{display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,#777 0%,#606060 54%,#444 100%)}
#eye{width:min(94vw,82vh,760px);aspect-ratio:1/1;display:block}
#error{position:fixed;left:12px;right:12px;bottom:12px;margin:auto;max-width:760px;padding:10px 12px;
font:700 13px/1.35 system-ui,sans-serif;color:#fff;background:#6e1c1c;border:1px solid rgba(255,255,255,.35);
border-radius:8px;display:none;white-space:pre-wrap}

<body>
<canvas id="eye" width="512" height="512" aria-label="Marco de ojo alineado parpadeando"></canvas>
<div id="error"></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('eye');
const ctx=canvas.getContext('2d',{alpha:false});
const error=document.getElementById('error');
ctx.imageSmoothingEnabled=true;

const EXPECTED_W=640, EXPECTED_H=256, CELL=128, COLS=5, COUNT=10;
const timing=[78,68,58,50,46,90,46,58,68,78];
const img=new Image();
let ready=false,busy=false;

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rect=i=>[(i%COLS)*CELL,Math.floor(i/COLS)*CELL,CELL,CELL];

function report(msg){
  error.textContent=msg;
  error.style.display='block';
}
function draw(i){
  const [sx,sy,sw,sh]=rect(i);
  ctx.fillStyle='#606060';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,sx,sy,sw,sh,0,0,canvas.width,canvas.height);
}
async function blink(){
  if(!ready||busy)return;
  busy=true;
  for(let i=0;i<COUNT;i++){draw(i);await sleep(timing[i]);}
  await sleep(30);
  draw(0);
  busy=false;
}
function input(e){if(e?.cancelable)e.preventDefault();blink();}

img.onload=()=>{
  if(img.naturalWidth!==EXPECTED_W || img.naturalHeight!==EXPECTED_H){
    report('SPRITE DECODIFICÓ, PERO TIENE GEOMETRÍA INCORRECTA: '+img.naturalWidth+'×'+img.naturalHeight+'; esperado 640×256.');
    return;
  }
  ready=true;
  draw(0);
};
img.onerror=()=>report('EL SPRITE EMBEBIDO NO PUDO DECODIFICARSE. Esta versión no hace ninguna petición externa; si aparece esto, el problema son los bytes del sprite.');
