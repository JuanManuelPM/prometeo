<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#606060">
<title>Prometeo · Eye Alignment Lab V17</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;background:#606060}
body{display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,#777 0%,#606060 54%,#444 100%)}
#eye{width:min(94vw,82vh,760px);aspect-ratio:1/1;display:block}
#status{
  position:fixed;left:12px;right:12px;bottom:12px;margin:auto;max-width:760px;
  padding:9px 11px;font:700 12px/1.35 system-ui,sans-serif;color:#fff;
  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18);
  border-radius:8px;white-space:pre-wrap;text-align:center
}
#status.ok{display:none}
#status.error{background:#6e1c1c;border-color:rgba(255,255,255,.35)}
</style>
</head>
<body>
<canvas id="eye" width="512" height="512" aria-label="Marco de ojo alineado parpadeando"></canvas>
<div id="status">Cargando sprite alineado…</div>
<script>
(()=>{
'use strict';

const canvas=document.getElementById('eye');
const ctx=canvas.getContext('2d',{alpha:false});
const status=document.getElementById('status');
ctx.imageSmoothingEnabled=true;

const ASSET='./eye-blink-aligned-grid-v15.jpg?v=c4fb7c8d';
const EXPECTED_W=640;
const EXPECTED_H=256;
const CELL=128;
const COLS=5;
const COUNT=10;
const timing=[78,68,58,50,46,90,46,58,68,78];

let img=null;
let ready=false;
let busy=false;
let objectUrl=null;

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rect=i=>[(i%COLS)*CELL,Math.floor(i/COLS)*CELL,CELL,CELL];

function setStatus(message,kind=''){
  status.textContent=message;
  status.className=kind;
}

function clear(){
  ctx.fillStyle='#606060';
  ctx.fillRect(0,0,canvas.width,canvas.height);
}

function draw(i){
  if(!img)return;
  const [sx,sy,sw,sh]=rect(i);
  clear();
  ctx.drawImage(img,sx,sy,sw,sh,0,0,canvas.width,canvas.height);
}

async function blink(){
  if(!ready||busy)return;
  busy=true;
  for(let i=0;i<COUNT;i++){
    draw(i);
    await sleep(timing[i]);
  }
  await sleep(30);
  draw(0);
  busy=false;
}

function input(e){
  if(e?.cancelable)e.preventDefault();
  blink();
}

async function loadSprite(){
  clear();
  try{
    const response=await fetch(ASSET,{cache:'no-store'});
    if(!response.ok){
      throw new Error('HTTP '+response.status+' al pedir '+ASSET);
    }

    const blob=await response.blob();
    if(!blob.size){
      throw new Error('el archivo llegó vacío');
    }

    objectUrl=URL.createObjectURL(blob);

    await new Promise((resolve,reject)=>{
      const candidate=new Image();
      candidate.onload=()=>{
        if(candidate.naturalWidth!==EXPECTED_W || candidate.naturalHeight!==EXPECTED_H){
          reject(new Error(
            'geometría inesperada '+candidate.naturalWidth+'×'+candidate.naturalHeight+
            '; esperado '+EXPECTED_W+'×'+EXPECTED_H
          ));
          return;
        }
        img=candidate;
        resolve();
      };
      candidate.onerror=()=>reject(new Error('el navegador recibió el archivo pero no pudo decodificarlo como imagen'));
      candidate.src=objectUrl;
    });

    ready=true;
    draw(0);
    setStatus('', 'ok');
  }catch(err){
    ready=false;
    clear();
    setStatus(
      'ERROR CARGANDO SPRITE\n'+
      String(err?.message||err)+
      '\n\nEsta versión usa un archivo externo verificado; no contiene base64 embebido.',
      'error'
    );
  }
}

window.addEventListener('pointerdown',input,{passive:false});
window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter')input(e);
});
window.addEventListener('pagehide',()=>{
  if(objectUrl)URL.revokeObjectURL(objectUrl);
},{once:true});

loadSprite();
})();
</script>
</body>
</html>
