<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#606060">
<title>Prometeo · Eye Alignment Lab V15</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  touch-action:none;overscroll-behavior:none;background:#606060
}
body{
  display:grid;place-items:center;
  background:radial-gradient(circle at 50% 50%,#747474 0%,#606060 54%,#444 100%)
}
#eye{
  width:min(94vw,82vh,760px);
  aspect-ratio:1/1;
  display:block;
  image-rendering:auto;
}
</style>
</head>
<body>
<canvas id="eye" width="512" height="512" aria-label="Marco de ojo alineado parpadeando"></canvas>
<script>
(()=>{
'use strict';

const canvas=document.getElementById('eye');
const ctx=canvas.getContext('2d',{alpha:false});
ctx.imageSmoothingEnabled=true;

const img=new Image();
img.decoding='async';

const CELL=128;
const COLS=5;
const COUNT=10;
const timing=[78,68,58,50,46,90,46,58,68,78];

let ready=false;
let busy=false;

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function rect(i){
  return [(i%COLS)*CELL,Math.floor(i/COLS)*CELL,CELL,CELL];
}

function draw(i){
  const [sx,sy,sw,sh]=rect(i);
  ctx.fillStyle='#606060';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,sx,sy,sw,sh,0,0,canvas.width,canvas.height);
}

async function blink(){
  if(!ready||busy)return;
  busy=true;
  for(let i=0;i<COUNT;i++){
    draw(i);
    await sleep(timing[i]);
  }
  await sleep(30);
  draw(0);
  busy=false;
}

function input(e){
  if(e?.cancelable)e.preventDefault();
  blink();
}

function fail(){
  ctx.fillStyle='#606060';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#fff';
  ctx.font='700 20px system-ui,sans-serif';
  ctx.textAlign='center';
  ctx.fillText('ERROR CARGANDO SPRITE',canvas.width/2,canvas.height/2);
}

img.onload=()=>{ready=true;draw(0)};
img.onerror=fail;
img.src='./eye-blink-aligned-grid-v15.jpg?v=15';

window.addEventListener('pointerdown',input,{passive:false});
window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter')input(e);
});
})();
</script>
</body>
</html>
