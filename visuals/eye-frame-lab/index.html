<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Prometeo · Eye Blink Lab</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none}
body{display:grid;place-items:center}
#eye{
  width:min(92vw,76vh,760px);
  aspect-ratio:1/1;
  display:block;
  background:#000;
}
</style>
</head>
<body>
<canvas id="eye" width="512" height="512" aria-label="Marco de ojo retro parpadeando"></canvas>
<script>
(function(){
'use strict';

const canvas=document.getElementById('eye');
const ctx=canvas.getContext('2d',{alpha:false});
ctx.imageSmoothingEnabled=true;

const img=new Image();
img.decoding='async';

const CELL=128;
const COLS=5;
const FRAME_COUNT=10;
const timings=[70,62,56,52,52,92,52,56,62,70];

let loaded=false;
let busy=false;

function srcRect(frame){
  const col=frame%COLS;
  const row=Math.floor(frame/COLS);
  return [col*CELL,row*CELL,CELL,CELL];
}

function drawFrame(frame){
  const [sx,sy,sw,sh]=srcRect(frame);
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,sx,sy,sw,sh,0,0,canvas.width,canvas.height);
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

async function blink(){
  if(!loaded||busy)return;
  busy=true;

  for(let frame=0;frame<FRAME_COUNT;frame++){
    drawFrame(frame);
    await sleep(timings[frame]);
  }

  await sleep(38);
  drawFrame(0);
  busy=false;
}

function trigger(e){
  if(e&&e.cancelable)e.preventDefault();
  blink();
}

img.onload=function(){
  loaded=true;
  drawFrame(0);
};

img.src='./eye-blink-grid-v3.webp?v=3';

window.addEventListener('pointerdown',trigger,{passive:false});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='Enter')trigger(e);
});
})();
</script>
</body>
</html>
