<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#555">
<title>Prometeo · Eye Lab V25</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#555;touch-action:none;overscroll-behavior:none}
body{display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#777 0%,#606060 54%,#424242 100%)}
#eye{width:min(94vw,82vh,760px);aspect-ratio:1/1;display:block}
#status,#mode{position:fixed;left:12px;right:12px;margin:auto;max-width:760px;color:#fff;text-align:center;pointer-events:none;font-family:system-ui,sans-serif}
#status{bottom:12px;padding:9px 11px;border-radius:8px;background:rgba(0,0,0,.42);font-size:12px;font-weight:700;white-space:pre-wrap}
#status.ok{display:none} #status.error{background:#6e1c1c}
#mode{top:12px;font-size:12px;font-weight:650;color:rgba(255,255,255,.76);text-shadow:0 1px 1px #000}
</style>
</head>
<body>
<canvas id="eye" width="128" height="128" aria-label="Eye lab V25"></canvas>
<div id="mode"></div><div id="status">cargando V25…</div>
<script type="module">
const canvas=document.getElementById('eye'),ctx=canvas.getContext('2d',{alpha:true});
const modeEl=document.getElementById('mode'),statusEl=document.getElementById('status');
const Q=new URLSearchParams(location.search);
const PACK_URL='./sprite-pack-v21.json?v=25';
const FX_URL='./eye-effects-v25.json?v=25';
const BLINK='blink',ALPHA_BARRIER=40,DILATE=1;
let pack,fx,frames=new Map(),apertures=new Map(),defaultGeom,blinkSteps=[],blinkStarts=[],blinkTotal=0,activeBlink=null,nextBlink=0;
let effectIndex=0,effectStart=0,lastTap=0,audio=null,media=null,mediaReady=false,mediaIsVideo=false;
const off=document.createElement('canvas');off.width=24;off.height=16;const octx=off.getContext('2d');octx.imageSmoothingEnabled=false;

const setStatus=(t,k='')=>{statusEl.textContent=t;statusEl.className=k};
const b64=s=>{const x=atob(s),a=new Uint8Array(x.length);for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return a};
async function sha(a){const h=await crypto.subtle.digest('SHA-256',a);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}

function validatePack(p){if(p?.schema!=='PROMETEO_INDEXED_SPRITE_PACK_V2')throw Error('schema blink');if(p.logical_size?.[0]!==128||p.logical_size?.[1]!==128)throw Error('size blink');}
async function decode(f){const bytes=b64(f.data_b64);if(bytes.length!==f.byte_length||await sha(bytes)!==f.sha256)throw Error(f.id+' hash');const pal=pack.encoding.palette_rgba,rgba=new Uint8ClampedArray(65536);let px=0;for(let i=0;i<bytes.length;i+=2){const n=bytes[i],c=pal[bytes[i+1]];for(let j=0;j<n;j++){const z=px++*4;rgba[z]=c[0];rgba[z+1]=c[1];rgba[z+2]=c[2];rgba[z+3]=c[3]}}if(px!==16384)throw Error(f.id+' pixels');const c=document.createElement('canvas');c.width=c.height=128;c.getContext('2d').putImageData(new ImageData(rgba,128,128),0,0);return c}
function aperture(fc){const d=fc.getContext('2d').getImageData(0,0,128,128).data,b=new Uint8Array(16384);for(let i=0;i<16384;i++)b[i]=d[i*4+3]>=ALPHA_BARRIER?1:0;for(let p=0;p<DILATE;p++){const q=b.slice();for(let y=1;y<127;y++)for(let x=1;x<127;x++){const i=y*128+x;if(!q[i]&&(q[i-1]||q[i+1]||q[i-128]||q[i+128]))b[i]=1}}
const seen=new Uint8Array(16384),qx=new Int16Array(16384),qy=new Int16Array(16384);let best=null;
for(let sy=1;sy<127;sy++)for(let sx=1;sx<127;sx++){let s=sy*128+sx;if(b[s]||seen[s])continue;let h=0,t=0,touch=false,pts=[],minx=127,miny=127,maxx=0,maxy=0,sumx=0,sumy=0;qx[t]=sx;qy[t++]=sy;seen[s]=1;while(h<t){let x=qx[h],y=qy[h++],i=y*128+x;pts.push(i);if(x===0||y===0||x===127||y===127)touch=true;minx=Math.min(minx,x);maxx=Math.max(maxx,x);miny=Math.min(miny,y);maxy=Math.max(maxy,y);sumx+=x;sumy+=y;for(const [nx,ny] of [[x-1,y],[x+1,y],[x,y-1],[x,y+1]]){if(nx<0||ny<0||nx>=128||ny>=128)continue;let ni=ny*128+nx;if(!b[ni]&&!seen[ni]){seen[ni]=1;qx[t]=nx;qy[t++]=ny}}}if(!touch&&pts.length>8&&(!best||pts.length>best.pts.length))best={pts,minx,miny,maxx,maxy,sumx,sumy}}
const m=document.createElement('canvas');m.width=m.height=128;const mc=m.getContext('2d'),im=mc.createImageData(128,128);if(!best)return{mask:m,area:0,bbox:[38,54,90,86],cx:64,cy:70};for(const i of best.pts)im.data[i*4+3]=255;mc.putImageData(im,0,0);return{mask:m,area:best.pts.length,bbox:[best.minx,best.miny,best.maxx+1,best.maxy+1],cx:best.sumx/best.pts.length,cy:best.sumy/best.pts.length}}

function triggerBlink(){activeBlink={start:performance.now()};nextBlink=performance.now()+3200}
function blinkFrame(now){if(!activeBlink)return pack.default_frame;let t=now-activeBlink.start;if(t>=blinkTotal){activeBlink=null;return pack.default_frame}for(let i=blinkStarts.length-1;i>=0;i--)if(t>=blinkStarts[i])return blinkSteps[i].id;return blinkSteps[0].id}
function colorHsl(h,s,l){return 'hsl('+((h%360)+360)%360+' '+s+'% '+l+'%)'}
function stepFor(e,now){if(e.kind!=='steps')return null;const hold=e.hold_ms||125,idx=Math.floor((now-effectStart)/hold)%e.steps.length;return e.steps[(idx+e.steps.length)%e.steps.length]}
function circleState(step,now,e){if(step)return step;if(e.kind==='chromatic'){const fps=Number(Q.get('fps')||fx.defaults.content_fps||8),tick=Math.floor((now-effectStart)/(1000/fps));const h=Number(Q.get('hue')||fx.defaults.hue||0)+tick*18;return{fill:colorHsl(h,80,50),pupil:'#000',shape:tick%5===0?'slit':'circle',x:[0,-.45,0,.45,0][tick%5],y:0,r:[.18,.24,.32,.24,.18][tick%5]}}if(e.kind==='glitch'){const tick=Math.floor((now-effectStart)/95);return{fill:tick%4===0?'#000':colorHsl(tick*47,90,50),pupil:tick%4===0?'#fff':'#000',shape:['circle','slit','dot','circle'][tick%4],x:[-.6,.5,0,.2][tick%4],y:[0,-.4,.5,0][tick%4],r:[.2,.35,.08,.55][tick%4]}}return{fill:'#fff',pupil:'#000',shape:'circle',x:0,y:0,r:.22}}
function drawState(state,ap,now,e){
const [x0,y0,x1,y1]=defaultGeom.bbox,bw=x1-x0,bh=y1-y0;
const layer=document.createElement('canvas');layer.width=layer.height=128;const l=layer.getContext('2d');l.imageSmoothingEnabled=false;
if(e.kind==='media'){drawMedia(l,x0,y0,bw,bh,now)}else{
octx.clearRect(0,0,24,16);octx.fillStyle=state.fill||'#fff';octx.fillRect(0,0,24,16);
if(state.pupil){const cx=Math.round(12+(state.x||0)*4),cy=Math.round(8+(state.y||0)*2.5),base=16,r=Math.max(1,(state.r||.22)*base);octx.fillStyle=state.pupil;octx.beginPath();if(state.shape==='slit')octx.ellipse(cx,cy,Math.max(1,r*.25),Math.max(2,r),0,0,Math.PI*2);else if(state.shape==='dot')octx.arc(cx,cy,Math.max(1,r*.4),0,Math.PI*2);else octx.arc(cx,cy,r,0,Math.PI*2);octx.fill()}
l.drawImage(off,x0,y0,bw,bh)}
l.globalCompositeOperation='destination-in';l.drawImage(ap.mask,0,0);ctx.drawImage(layer,0,0)
}
function drawMedia(l,x,y,w,h,now){if(mediaReady&&media){try{l.drawImage(media,x,y,w,h);return}catch{}}const tick=Math.floor(now/90);const g=l.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,colorHsl(tick*13,90,50));g.addColorStop(1,colorHsl(tick*13+140,90,40));l.fillStyle=g;l.fillRect(x,y,w,h);l.fillStyle='rgba(255,255,255,.35)';for(let yy=y+(tick%4);yy<y+h;yy+=4)l.fillRect(x,yy,w,1);l.fillStyle='rgba(0,0,0,.35)';l.fillRect(x+((tick*3)%Math.max(1,w)),y,2,h)}
function drawAudioLines(now){
if(!audio?.analyser)return;const arr=new Uint8Array(audio.analyser.fftSize);audio.analyser.getByteTimeDomainData(arr);ctx.save();ctx.lineWidth=1;ctx.globalAlpha=.8;ctx.strokeStyle='#fff';ctx.beginPath();const tick=Math.floor(now/(1000/(fx.defaults.waveform_fps||8)));for(let i=0;i<32;i++){const a=(i/31)*Math.PI*2,v=(arr[(i*7)%arr.length]-128)/128,r=38+v*8+((tick+i)%3-1);const x=64+Math.cos(a)*r,y=70+Math.sin(a)*r*.55;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath();ctx.stroke();ctx.restore()}
function drawAudioIcon(ap){
const playing=audio?.ctx&&audio.ctx.state==='running';const l=document.createElement('canvas');l.width=l.height=128;const c=l.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,128,128);c.fillStyle='#000';if(playing){c.fillRect(57,62,4,17);c.fillRect(67,62,4,17)}else{c.beginPath();c.moveTo(59,60);c.lineTo(59,80);c.lineTo(74,70);c.closePath();c.fill()}c.globalCompositeOperation='destination-in';c.drawImage(ap.mask,0,0);ctx.drawImage(l,0,0)}
function makeAudio(){
if(audio)return;const C=window.AudioContext||window.webkitAudioContext,ac=new C(),an=ac.createAnalyser();an.fftSize=256;const gain=ac.createGain();gain.gain.value=.16;gain.connect(an);an.connect(ac.destination);const buf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++){const t=i/ac.sampleRate,beat=(t%0.5),env=Math.exp(-beat*10),tone=Math.sin(2*Math.PI*110*t)+.45*Math.sin(2*Math.PI*220*t)+.2*Math.sin(2*Math.PI*55*t);d[i]=(tone*.18+((Math.random()*2-1)*.03))*env}const src=ac.createBufferSource();src.buffer=buf;src.loop=true;src.connect(gain);src.start();ac.suspend();audio={ctx:ac,analyser:an,src,gain}}
async function toggleAudio(){makeAudio();if(audio.ctx.state==='running')await audio.ctx.suspend();else await audio.ctx.resume()}
function setupMedia(){const url=Q.get('media');if(!url)return;if(/\.gif(\?|$)/i.test(url)){const img=new Image();img.onload=()=>{mediaReady=true};img.src=url;media=img}else{const v=document.createElement('video');v.src=url;v.loop=true;v.muted=true;v.playsInline=true;v.autoplay=true;v.addEventListener('canplay',()=>{mediaReady=true;v.play().catch(()=>{})});media=v;mediaIsVideo=true}}
function nextEffect(dir=1){effectIndex=(effectIndex+dir+fx.effects.length)%fx.effects.length;effectStart=performance.now();modeEl.textContent=fx.effects[effectIndex].label;triggerBlink()}
async function onTap(){const now=performance.now(),e=fx.effects[effectIndex];if(now-lastTap<330){nextEffect(1);lastTap=0;return}lastTap=now;if(e.kind==='audio'){setTimeout(()=>{if(lastTap===now){toggleAudio();lastTap=0}},340)}else{effectStart=now;triggerBlink();lastTap=0}}
function render(now){if(now>=nextBlink&&!activeBlink&&(fx.defaults.auto_blink!==false))triggerBlink();const id=blinkFrame(now),ap=apertures.get(id),e=fx.effects[effectIndex];ctx.clearRect(0,0,128,128);if(e.kind==='audio'){drawAudioLines(now);drawAudioIcon(ap)}else if(ap.area>0){drawState(circleState(stepFor(e,now),now,e),ap,now,e)}ctx.drawImage(frames.get(id),0,0);requestAnimationFrame(render)}
async function boot(){
try{const [pr,fr]=await Promise.all([fetch(PACK_URL,{cache:'no-store'}),fetch(FX_URL,{cache:'no-store'})]);if(!pr.ok||!fr.ok)throw Error('HTTP assets');pack=await pr.json();fx=await fr.json();validatePack(pack);for(const f of pack.frames){const c=await decode(f);frames.set(f.id,c);apertures.set(f.id,aperture(c))}defaultGeom=apertures.get(pack.default_frame);const a=pack.animations[BLINK];for(const s of a.frames){blinkStarts.push(blinkTotal);blinkSteps.push(s);blinkTotal+=s.duration_ms}const req=Q.get('effect'),idx=fx.effects.findIndex(x=>x.id===req);if(idx>=0)effectIndex=idx;effectStart=performance.now();nextBlink=effectStart+2800;modeEl.textContent=fx.effects[effectIndex].label;setupMedia();setStatus('','ok');requestAnimationFrame(render)}catch(e){setStatus('ERROR V25\n'+e.message,'error')}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();onTap()},{passive:false});
window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextEffect(1);else if(e.key==='ArrowLeft')nextEffect(-1);else if(e.code==='Space'){e.preventDefault();if(fx.effects[effectIndex].kind==='audio')toggleAudio();else{effectStart=performance.now();triggerBlink()}}});
boot();
</script>
</body>
</html>
