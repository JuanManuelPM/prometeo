<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#040604">
<title>Prometeo · Spaces Lab · Green Arch Passage</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020302;color:#d8d0af;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none;touch-action:none}
#app{position:fixed;inset:0;overflow:hidden;background:#020302;isolation:isolate}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:auto}
#veil{position:absolute;z-index:4;inset:-7%;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 28%,rgba(0,0,0,.18) 58%,rgba(0,0,0,.79) 100%);box-shadow:inset 0 0 12vw rgba(0,0,0,.82)}
#scan{position:absolute;z-index:5;inset:0;pointer-events:none;opacity:.13;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.024) 0 1px,transparent 1px 4px);mix-blend-mode:screen}
#tag{position:absolute;z-index:8;left:max(10px,env(safe-area-inset-left));top:max(9px,env(safe-area-inset-top));padding:6px 8px;background:rgba(3,5,3,.62);border:1px solid rgba(197,189,130,.12);color:rgba(221,213,173,.58);font:800 7px/1 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;pointer-events:none}
#pad{position:absolute;z-index:10;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));width:142px;height:96px;pointer-events:none;opacity:.78}
#pad button{position:absolute;width:46px;height:46px;border:1px solid rgba(229,220,171,.16);background:rgba(3,5,3,.64);color:rgba(231,221,177,.80);font:900 20px/1 system-ui,sans-serif;display:grid;place-items:center;pointer-events:auto;backdrop-filter:blur(2px)}
#left{left:0;top:25px}#right{right:0;top:25px}#up{left:48px;top:0}#down{left:48px;bottom:0}
#pad button:active{background:rgba(102,116,64,.34);color:#f1e7bf}
#hint{position:absolute;z-index:8;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));max-width:48%;color:rgba(224,215,190,.42);font:800 7px/1.3 system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;pointer-events:none;transition:opacity 1s}
#loading{position:absolute;z-index:20;inset:0;display:grid;place-items:center;background:#020302;color:#777861;font:800 9px/1 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;transition:opacity .34s}
#loading.off{opacity:0;pointer-events:none}
@media(max-height:430px){#tag{top:5px}#pad{transform:scale(.92);transform-origin:bottom right}#hint{font-size:6px}}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="Pasillo oscuro de arcos superpuestos"></canvas>
  <div id="veil"></div><div id="scan"></div>
  <div id="tag">PASO VERDE · 04</div>
  <div id="pad" aria-label="Controles táctiles">
    <button id="left" aria-label="Mirar izquierda">‹</button>
    <button id="right" aria-label="Mirar derecha">›</button>
    <button id="up" aria-label="Avanzar">↑</button>
    <button id="down" aria-label="Retroceder">↓</button>
  </div>
  <div id="hint">izq/der = mirar · arriba/abajo = avanzar recto · suelo continuo</div>
  <div id="loading">cargando materiales</div>
</div>
<script>
(function(){
'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
const loading=document.getElementById('loading');
const hint=document.getElementById('hint');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const NEAR=.16;
let W=640,H=360,last=0;
let yaw=0,targetYaw=0,camZ=1.4,targetCamZ=1.4;
let drag=null;
const pointers=new Map();
const assets={};
const atlas={};
const SOURCE_PAGES={
  wall:'https://commons.wikimedia.org/wiki/File:Dark_green_grey_flecked_speckled_spotted_clean_marble_cemented_building_wall_square_checkered_tile_texture.jpg',
  floor:'https://commons.wikimedia.org/wiki/File:Green_mosaic_square_seamless_tiled_floor_texture.jpg',
  ceiling:'https://commons.wikimedia.org/wiki/File:Ceiling_Pattern,_Tomb_of_Qenamun_MET_DT10887.jpg',
  stone:'https://commons.wikimedia.org/wiki/File:Stone_Wall_Texture.jpg'
};
const SOURCES={
  wall:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/Dark_green_grey_flecked_speckled_spotted_clean_marble_cemented_building_wall_square_checkered_tile_texture.jpg/1024px-Dark_green_grey_flecked_speckled_spotted_clean_marble_cemented_building_wall_square_checkered_tile_texture.jpg',
  floor:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Green_mosaic_square_seamless_tiled_floor_texture.jpg/1280px-Green_mosaic_square_seamless_tiled_floor_texture.jpg',
  ceiling:'https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Ceiling_Pattern%2C_Tomb_of_Qenamun_MET_DT10887.jpg/960px-Ceiling_Pattern%2C_Tomb_of_Qenamun_MET_DT10887.jpg',
  stone:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Stone_Wall_Texture.jpg/1280px-Stone_Wall_Texture.jpg'
};
function load(name,url){
  return new Promise(resolve=>{
    const im=new Image();im.decoding='async';
    if(/^https?:/.test(url))im.crossOrigin='anonymous';
    im.onload=()=>{assets[name]=im;resolve(im)};
    im.onerror=()=>{assets[name]=null;resolve(null)};
    im.src=url;
  });
}
function resize(){
  const a=innerWidth/Math.max(1,innerHeight);H=360;W=Math.round(H*a);
  if(W>760){W=760;H=Math.round(W/a)}
  if(W<360){W=360;H=Math.round(W/a)}
  canvas.width=W;canvas.height=H;
}
addEventListener('resize',resize,{passive:true});resize();
function cover(g,img,w,h){
  const ir=img.naturalWidth/img.naturalHeight,cr=w/h;let sx=0,sy=0,sw=img.naturalWidth,sh=img.naturalHeight;
  if(ir>cr){sw=sh*cr;sx=(img.naturalWidth-sw)*.5}else{sh=sw/cr;sy=(img.naturalHeight-sh)*.5}
  g.drawImage(img,sx,sy,sw,sh,0,0,w,h);
}
function grade(name,img,tint,screen){
  if(!img)return null;const c=document.createElement('canvas');c.width=384;c.height=384;const g=c.getContext('2d');cover(g,img,c.width,c.height);
  g.globalCompositeOperation='multiply';g.fillStyle=tint;g.fillRect(0,0,c.width,c.height);
  g.globalCompositeOperation='screen';g.globalAlpha=.10;g.fillStyle=screen;g.fillRect(0,0,c.width,c.height);
  g.globalAlpha=1;g.globalCompositeOperation='source-over';atlas[name]=c;return c;
}
function archPath(g,w,h,x0,x1,shoulder,top){
  const mid=w*.5;g.beginPath();g.moveTo(x0,h);g.lineTo(x0,shoulder);
  g.bezierCurveTo(x0,top,mid-w*.19,top,mid,top);
  g.bezierCurveTo(mid+w*.19,top,x1,top,x1,shoulder);
  g.lineTo(x1,h);g.closePath();
}
function buildArch(img){
  if(!img)return null;const c=document.createElement('canvas');c.width=512;c.height=384;const g=c.getContext('2d');cover(g,img,c.width,c.height);
  g.globalCompositeOperation='multiply';g.fillStyle='rgba(68,76,43,.78)';g.fillRect(0,0,c.width,c.height);
  g.globalCompositeOperation='screen';g.globalAlpha=.22;g.fillStyle='#d2bc73';g.fillRect(0,0,c.width,c.height);g.globalAlpha=1;
  // Keep only an outer arch silhouette, then punch the inner opening out of the photographed stone.
  g.globalCompositeOperation='destination-in';archPath(g,c.width,c.height,c.width*.025,c.width*.975,c.height*.67,c.height*.02);g.fill();
  g.globalCompositeOperation='destination-out';archPath(g,c.width,c.height,c.width*.31,c.width*.69,c.height*.51,c.height*.21);g.fill();
  g.globalCompositeOperation='source-over';atlas.arch=c;return c;
}
function buildAtlas(){
  grade('wall',assets.wall,'rgba(44,64,38,.96)','#aa9c61');
  grade('floor',assets.floor,'rgba(83,78,45,.86)','#d0c37a');
  grade('ceiling',assets.ceiling,'rgba(50,62,40,.91)','#9c8b57');
  grade('stone',assets.stone,'rgba(47,65,39,.94)','#baa66a');
  buildArch(assets.stone||assets.wall);
  loading.classList.add('off');
}
Promise.all(Object.entries(SOURCES).map(([n,u])=>load(n,u))).then(buildAtlas);
function texTri(img,p0,p1,p2,uv0,uv1,uv2,alpha){
  if(!img)return;const den=uv0.x*(uv1.y-uv2.y)+uv1.x*(uv2.y-uv0.y)+uv2.x*(uv0.y-uv1.y);if(Math.abs(den)<.001)return;
  const a=(p0.x*(uv1.y-uv2.y)+p1.x*(uv2.y-uv0.y)+p2.x*(uv0.y-uv1.y))/den;
  const c=(p0.x*(uv2.x-uv1.x)+p1.x*(uv0.x-uv2.x)+p2.x*(uv1.x-uv0.x))/den;
  const e=(p0.x*(uv1.x*uv2.y-uv2.x*uv1.y)+p1.x*(uv2.x*uv0.y-uv0.x*uv2.y)+p2.x*(uv0.x*uv1.y-uv1.x*uv0.y))/den;
  const b=(p0.y*(uv1.y-uv2.y)+p1.y*(uv2.y-uv0.y)+p2.y*(uv0.y-uv1.y))/den;
  const d=(p0.y*(uv2.x-uv1.x)+p1.y*(uv0.x-uv2.x)+p2.y*(uv1.x-uv0.x))/den;
  const f=(p0.y*(uv1.x*uv2.y-uv2.x*uv1.y)+p1.y*(uv2.x*uv0.y-uv0.x*uv2.y)+p2.y*(uv0.x*uv1.y-uv1.x*uv0.y))/den;
  ctx.save();ctx.globalAlpha=alpha;ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.closePath();ctx.clip();ctx.setTransform(a,b,c,d,e,f);ctx.drawImage(img,0,0);ctx.restore();
}
function cameraVertex(v){
  const dz=v.z-camZ,cs=Math.cos(yaw),sn=Math.sin(yaw);
  return {x:v.x*cs-dz*sn,y:v.y,z:v.x*sn+dz*cs,u:v.u,v:v.v};
}
function clipNear(poly){
  const out=[];for(let i=0;i<poly.length;i++){
    const a=poly[i],b=poly[(i+1)%poly.length],ain=a.z>=NEAR,bin=b.z>=NEAR;
    if(ain)out.push(a);
    if(ain!==bin){const t=(NEAR-a.z)/(b.z-a.z);out.push({x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t),z:NEAR,u:lerp(a.u,b.u,t),v:lerp(a.v,b.v,t)});}
  }return out;
}
function projectCam(p){const f=214/p.z;return{x:W*.5+p.x*f,y:H*.50-p.y*f,z:p.z,f};}
function worldQuad(img,pts,alpha){
  if(!img)return;const iw=img.width,ih=img.height;
  let poly=pts.map((p,i)=>cameraVertex({x:p.x,y:p.y,z:p.z,u:(i===1||i===2)?iw:0,v:(i>=2)?ih:0}));
  poly=clipNear(poly);if(poly.length<3)return;const pp=poly.map(projectCam);
  for(let i=1;i<poly.length-1;i++)texTri(img,pp[0],pp[i],pp[i+1],{x:poly[0].u,y:poly[0].v},{x:poly[i].u,y:poly[i].v},{x:poly[i+1].u,y:poly[i+1].v},alpha);
}
function fog(depth){return clamp(1-depth/70,.17,.98)}
function baseFill(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#070a06');g.addColorStop(.50,'#11150e');g.addColorStop(1,'#020302');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function renderPassage(){
  baseFill();
  const halfW=3.35,floorY=-1.72,ceilY=1.86,seg=2.65;
  const first=Math.floor((camZ-12)/seg)*seg;
  const list=[];
  // Start well behind the camera. Yaw can rotate lateral parts of a nominally-behind tile into view; clipping decides visibility.
  for(let i=0;i<34;i++){const z0=first+i*seg,z1=z0+seg,mid=(z0+z1)*.5-camZ;if(mid>72)continue;list.push({z0,z1,mid,index:Math.floor(z0/seg)});}
  list.sort((a,b)=>b.mid-a.mid);

  // The end wall is genuinely far-away geometry, so paint it before nearer layers.
  const farZ=camZ+58;
  worldQuad(atlas.stone||atlas.wall,[{x:-halfW,y:ceilY,z:farZ},{x:halfW,y:ceilY,z:farZ},{x:halfW,y:floorY,z:farZ},{x:-halfW,y:floorY,z:farZ}],.48);

  for(const s of list){
    const a=fog(s.mid),z0=s.z0,z1=s.z1;
    worldQuad(atlas.ceiling,[{x:-halfW,y:ceilY,z:z0},{x:halfW,y:ceilY,z:z0},{x:halfW,y:ceilY,z:z1},{x:-halfW,y:ceilY,z:z1}],a*.78);
    worldQuad(atlas.floor,[{x:-halfW,y:floorY,z:z1},{x:halfW,y:floorY,z:z1},{x:halfW,y:floorY,z:z0},{x:-halfW,y:floorY,z:z0}],a*.96);
    worldQuad(atlas.wall,[{x:-halfW,y:ceilY,z:z0},{x:-halfW,y:ceilY,z:z1},{x:-halfW,y:floorY,z:z1},{x:-halfW,y:floorY,z:z0}],a*.96);
    worldQuad(atlas.wall,[{x:halfW,y:ceilY,z:z1},{x:halfW,y:ceilY,z:z0},{x:halfW,y:floorY,z:z0},{x:halfW,y:floorY,z:z1}],a*.96);

    // Coliseo-derived material grammar: continuous lower stone band + distinct upper frieze.
    worldQuad(atlas.stone,[{x:-halfW+.035,y:floorY+.54,z:z0},{x:-halfW+.035,y:floorY+.54,z:z1},{x:-halfW+.035,y:floorY,z:z1},{x:-halfW+.035,y:floorY,z:z0}],a*.84);
    worldQuad(atlas.stone,[{x:halfW-.035,y:floorY+.54,z:z1},{x:halfW-.035,y:floorY+.54,z:z0},{x:halfW-.035,y:floorY,z:z0},{x:halfW-.035,y:floorY,z:z1}],a*.82);
    worldQuad(atlas.ceiling,[{x:-halfW+.03,y:ceilY,z:z0},{x:-halfW+.03,y:ceilY,z:z1},{x:-halfW+.03,y:ceilY-.25,z:z1},{x:-halfW+.03,y:ceilY-.25,z:z0}],a*.54);
    worldQuad(atlas.ceiling,[{x:halfW-.03,y:ceilY,z:z1},{x:halfW-.03,y:ceilY,z:z0},{x:halfW-.03,y:ceilY-.25,z:z0},{x:halfW-.03,y:ceilY-.25,z:z1}],a*.52);

    if(atlas.arch){
      const az=z0+.08;
      worldQuad(atlas.arch,[{x:-halfW,y:ceilY,z:az},{x:halfW,y:ceilY,z:az},{x:halfW,y:floorY,z:az},{x:-halfW,y:floorY,z:az}],clamp(a*.98,.22,.96));
    }
  }
  const center=projectCam({x:0,y:.10,z:58});
  const glow=ctx.createRadialGradient(center.x,center.y,0,center.x,center.y,Math.max(18,W*.12));glow.addColorStop(0,'rgba(183,163,82,.10)');glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
}
function analog(){
  ctx.save();ctx.globalAlpha=.035;ctx.globalCompositeOperation='screen';
  for(let i=0;i<28;i++){const x=(i*89+(last|0)*.011)%W,y=(i*43+(last|0)*.007)%H;ctx.fillStyle=i%3?'#c5b06f':'#70825d';ctx.fillRect(x,y,1,1)}
  ctx.restore();
}
function render(){ctx.setTransform(1,0,0,1,0,0);renderPassage();analog();}
function update(dt){const k=Math.min(1,dt*.014);yaw=lerp(yaw,targetYaw,k);camZ=lerp(camZ,targetCamZ,k);}
function frame(t){requestAnimationFrame(frame);if(document.hidden||t-last<30)return;const dt=Math.min(50,t-last||16);last=t;update(dt);render();}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
canvas.addEventListener('pointerdown',e=>{const p=point(e);pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);if(pointers.size===1)drag={id:e.pointerId,x:p.x,y:p.y,yaw:targetYaw,z:targetCamZ};e.preventDefault();});
canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const p=point(e);pointers.set(e.pointerId,p);targetYaw=clamp(drag.yaw+(p.x-drag.x)/W*1.38,-.96,.96);targetCamZ=clamp(drag.z-(p.y-drag.y)/H*22,-5,96);e.preventDefault();});
function end(e){pointers.delete(e.pointerId);if(drag&&drag.id===e.pointerId)drag=null;}
canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
const held=new Map();
function nudge(kind,amount){
  if(kind==='left')targetYaw=clamp(targetYaw-amount,-.96,.96);
  if(kind==='right')targetYaw=clamp(targetYaw+amount,-.96,.96);
  if(kind==='up')targetCamZ=clamp(targetCamZ+amount*9,-5,96);
  if(kind==='down')targetCamZ=clamp(targetCamZ-amount*9,-5,96);
  hint.style.opacity='.22';
}
['left','right','up','down'].forEach(id=>{
  const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();nudge(id,.13);const timer=setInterval(()=>nudge(id,.052),60);held.set(e.pointerId,timer);b.setPointerCapture(e.pointerId);});
  const stop=e=>{const t=held.get(e.pointerId);if(t)clearInterval(t);held.delete(e.pointerId);};
  b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);
});
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')nudge('left',.10);
  else if(e.key==='ArrowRight'||e.key==='d')nudge('right',.10);
  else if(e.key==='ArrowUp'||e.key==='w')nudge('up',.12);
  else if(e.key==='ArrowDown'||e.key==='s')nudge('down',.12);
});
setTimeout(()=>hint.style.opacity='.24',1800);
window.PrometeoSpaces={
  version:'spaces-green-arch-v5',
  contract:'left/right = yaw; up/down = z-only travel; floor uses near-plane clipping; no strafe; no fisheye',
  references:['retro corridor pattern','dark arch passage','vintage game tunnel','occult hallway texture','surreal corridor object'],
  sourcePages:SOURCE_PAGES,
  camera:{get yaw(){return targetYaw},get z(){return targetCamZ}}
};
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
