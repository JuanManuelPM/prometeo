<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#030604">
<title>Prometeo · Spaces Lab · Green Nave</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020403;color:#d8d0af;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none;touch-action:none}
#app{position:fixed;inset:0;overflow:hidden;background:#020403;isolation:isolate}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:auto}
#veil{position:absolute;z-index:4;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 22%,rgba(0,0,0,.06) 62%,rgba(0,0,0,.38) 100%);box-shadow:inset 0 0 7vw rgba(0,0,0,.38)}
#scan{position:absolute;z-index:5;inset:0;pointer-events:none;opacity:.075;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.022) 0 1px,transparent 1px 4px);mix-blend-mode:screen}
#tag{position:absolute;z-index:8;left:max(10px,env(safe-area-inset-left));top:max(9px,env(safe-area-inset-top));padding:6px 8px;background:rgba(3,5,3,.42);border:1px solid rgba(197,189,130,.08);color:rgba(221,213,173,.52);font:800 7px/1 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;pointer-events:none}
#pad{position:absolute;z-index:10;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));width:58px;height:106px;pointer-events:none;opacity:.76}
#pad button{position:absolute;left:0;width:58px;height:50px;border:1px solid rgba(229,220,171,.14);background:rgba(3,5,3,.58);color:rgba(231,221,177,.80);font:900 20px/1 system-ui,sans-serif;display:grid;place-items:center;pointer-events:auto;backdrop-filter:blur(2px)}
#up{top:0}#down{bottom:0}
#pad button:active{background:rgba(102,116,64,.34);color:#f1e7bf}
#hint{position:absolute;z-index:8;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));max-width:58%;color:rgba(224,215,190,.36);font:800 7px/1.3 system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;pointer-events:none;transition:opacity 1s}
#loading{position:absolute;z-index:20;inset:0;display:grid;place-items:center;background:#020403;color:#777861;font:800 9px/1 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;transition:opacity .34s}
#loading.off{opacity:0;pointer-events:none}
@media(max-height:430px){#tag{top:5px}#pad{transform:scale(.92);transform-origin:bottom right}#hint{font-size:6px}}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="Nave verde alta de arcos continuos"></canvas>
  <div id="veil"></div><div id="scan"></div>
  <div id="tag">PASO VERDE · NAVE ALTA</div>
  <div id="pad" aria-label="Caminar">
    <button id="up" aria-label="Avanzar">↑</button>
    <button id="down" aria-label="Retroceder">↓</button>
  </div>
  <div id="hint">arriba/abajo = avanzar/retroceder · vista frontal fija</div>
  <div id="loading">cargando materiales</div>
</div>
<script>
(function(){
'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
const loading=document.getElementById('loading');
const hint=document.getElementById('hint');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const NEAR=.14;
let W=640,H=360,last=0;
let camZ=1.4,targetCamZ=1.4;
const assets={};
const atlas={};
const SOURCE_PAGES={
  wall:'https://commons.wikimedia.org/wiki/File:Dark_green_grey_flecked_speckled_spotted_clean_marble_cemented_building_wall_square_checkered_tile_texture.jpg',
  floor:'https://commons.wikimedia.org/wiki/File:Green_mosaic_square_seamless_tiled_floor_texture.jpg',
  ceiling:'https://commons.wikimedia.org/wiki/File:Ceiling_Pattern,_Tomb_of_Qenamun_MET_DT10887.jpg',
  stone:'https://commons.wikimedia.org/wiki/File:Stone_Wall_Texture.jpg'
};
const SOURCES={
  wall:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/Dark_green_grey_flecked_speckled_spotted_clean_marble_cemented_building_wall_square_checkered_tile_texture.jpg/1024px-Dark_green_grey_flecked_speckled_spotted_clean_marble_cemented_building_wall_square_checkered_tile_texture.jpg',
  floor:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Green_mosaic_square_seamless_tiled_floor_texture.jpg/1280px-Green_mosaic_square_seamless_tiled_floor_texture.jpg',
  ceiling:'https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Ceiling_Pattern%2C_Tomb_of_Qenamun_MET_DT10887.jpg/960px-Ceiling_Pattern%2C_Tomb_of_Qenamun_MET_DT10887.jpg',
  stone:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Stone_Wall_Texture.jpg/1280px-Stone_Wall_Texture.jpg'
};
function load(name,url){
  return new Promise(resolve=>{
    const im=new Image();im.decoding='async';
    if(/^https?:/.test(url))im.crossOrigin='anonymous';
    im.onload=()=>{assets[name]=im;resolve(im)};
    im.onerror=()=>{assets[name]=null;resolve(null)};
    im.src=url;
  });
}
function resize(){
  const a=innerWidth/Math.max(1,innerHeight);
  H=360;W=Math.round(H*a);
  if(W>760){W=760;H=Math.round(W/a)}
  if(W<360){W=360;H=Math.round(W/a)}
  canvas.width=W;canvas.height=H;
}
addEventListener('resize',resize,{passive:true});resize();
function cover(g,img,w,h){
  const ir=img.naturalWidth/img.naturalHeight,cr=w/h;
  let sx=0,sy=0,sw=img.naturalWidth,sh=img.naturalHeight;
  if(ir>cr){sw=sh*cr;sx=(img.naturalWidth-sw)*.5}
  else{sh=sw/cr;sy=(img.naturalHeight-sh)*.5}
  g.drawImage(img,sx,sy,sw,sh,0,0,w,h);
}
function grade(name,img,tint,screen){
  if(!img)return null;
  const c=document.createElement('canvas');c.width=384;c.height=384;
  const g=c.getContext('2d');cover(g,img,c.width,c.height);
  g.globalCompositeOperation='multiply';g.fillStyle=tint;g.fillRect(0,0,c.width,c.height);
  g.globalCompositeOperation='screen';g.globalAlpha=.10;g.fillStyle=screen;g.fillRect(0,0,c.width,c.height);
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
  atlas[name]=c;return c;
}
function tileMaterial(name,src,step){
  if(!src)return null;
  const c=document.createElement('canvas');c.width=768;c.height=768;const g=c.getContext('2d');
  const s=step||192,cols=Math.ceil(c.width/s)+1,rows=Math.ceil(c.height/s)+1;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    g.save();g.translate(x*s,y*s);
    if((x+y)&1){g.translate(s,0);g.scale(-1,1)}
    g.drawImage(src,0,0,s,s);g.restore();
  }
  atlas[name]=c;return c;
}
function mixMaterial(name,a,b,alpha){
  if(!a&&!b)return null;
  const c=document.createElement('canvas');c.width=768;c.height=768;const g=c.getContext('2d');
  if(a)g.drawImage(a,0,0,c.width,c.height);
  if(b){g.globalAlpha=alpha;g.globalCompositeOperation='multiply';g.drawImage(b,0,0,c.width,c.height)}
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
  atlas[name]=c;return c;
}
function archPath(g,w,h,x0,x1,shoulder,top){
  const mid=w*.5;
  g.beginPath();g.moveTo(x0,h);g.lineTo(x0,shoulder);
  g.bezierCurveTo(x0,top,mid-w*.20,top,mid,top);
  g.bezierCurveTo(mid+w*.20,top,x1,top,x1,shoulder);
  g.lineTo(x1,h);g.closePath();
}
function buildCrown(img){
  if(!img)return null;
  const c=document.createElement('canvas');c.width=720;c.height=520;const g=c.getContext('2d');
  cover(g,img,c.width,c.height);
  g.globalCompositeOperation='multiply';g.fillStyle='rgba(31,75,28,.90)';g.fillRect(0,0,c.width,c.height);
  g.globalCompositeOperation='screen';g.globalAlpha=.15;g.fillStyle='#d0b457';g.fillRect(0,0,c.width,c.height);
  g.globalAlpha=1;
  g.globalCompositeOperation='destination-in';
  archPath(g,c.width,c.height,4,c.width-4,c.height*.80,c.height*.01);g.fill();
  g.globalCompositeOperation='destination-out';
  archPath(g,c.width,c.height,c.width*.235,c.width*.765,c.height*.77,c.height*.18);g.fill();
  g.clearRect(0,c.height*.80,c.width,c.height*.20);
  g.globalCompositeOperation='source-over';
  atlas.crown=c;return c;
}
function darken(name,src,amount){
  if(!src)return null;
  const c=document.createElement('canvas');c.width=src.width;c.height=src.height;const g=c.getContext('2d');
  g.drawImage(src,0,0);g.globalCompositeOperation='multiply';g.fillStyle='rgba(4,8,4,'+amount+')';g.fillRect(0,0,c.width,c.height);
  g.globalCompositeOperation='source-over';atlas[name]=c;return c;
}
function buildAtlas(){
  grade('wall',assets.wall,'rgba(35,76,30,.97)','#c4a64d');
  grade('floor',assets.floor,'rgba(32,64,30,.90)','#d0b65b');
  grade('ceiling',assets.ceiling,'rgba(29,55,27,.94)','#8e7c42');
  grade('stone',assets.stone,'rgba(39,76,33,.96)','#c2a44f');
  tileMaterial('wallField',atlas.wall,160);
  tileMaterial('floorTile',atlas.floor,118);
  tileMaterial('stoneTile',atlas.stone,138);
  tileMaterial('ceilingField',atlas.ceiling,176);
  mixMaterial('floorField',atlas.floorTile,atlas.stoneTile,.48);
  mixMaterial('wallMass',atlas.wallField,atlas.stoneTile,.30);
  buildCrown(assets.wall||assets.stone);
  darken('shadow',atlas.wallMass||atlas.wall,.76);
  darken('far',atlas.stoneTile||atlas.stone,.88);
  loading.classList.add('off');
}
Promise.all(Object.entries(SOURCES).map(([n,u])=>load(n,u))).then(buildAtlas);
function texTri(img,p0,p1,p2,uv0,uv1,uv2,alpha){
  if(!img)return;
  const den=uv0.x*(uv1.y-uv2.y)+uv1.x*(uv2.y-uv0.y)+uv2.x*(uv0.y-uv1.y);
  if(Math.abs(den)<.001)return;
  const a=(p0.x*(uv1.y-uv2.y)+p1.x*(uv2.y-uv0.y)+p2.x*(uv0.y-uv1.y))/den;
  const c=(p0.x*(uv2.x-uv1.x)+p1.x*(uv0.x-uv2.x)+p2.x*(uv1.x-uv0.x))/den;
  const e=(p0.x*(uv1.x*uv2.y-uv2.x*uv1.y)+p1.x*(uv2.x*uv0.y-uv0.x*uv2.y)+p2.x*(uv0.x*uv1.y-uv1.x*uv0.y))/den;
  const b=(p0.y*(uv1.y-uv2.y)+p1.y*(uv2.y-uv0.y)+p2.y*(uv0.y-uv1.y))/den;
  const d=(p0.y*(uv2.x-uv1.x)+p1.y*(uv0.x-uv2.x)+p2.y*(uv1.x-uv0.x))/den;
  const f=(p0.y*(uv1.x*uv2.y-uv2.x*uv1.y)+p1.y*(uv2.x*uv0.y-uv0.x*uv2.y)+p2.y*(uv0.x*uv1.y-uv1.x*uv0.y))/den;
  ctx.save();ctx.globalAlpha=alpha;ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.closePath();ctx.clip();
  ctx.setTransform(a,b,c,d,e,f);ctx.drawImage(img,0,0);ctx.restore();
}
function cameraVertex(v){
  return{x:v.x,y:v.y,z:v.z-camZ,u:v.u,v:v.v};
}
function clipNear(poly){
  const out=[];
  for(let i=0;i<poly.length;i++){
    const a=poly[i],b=poly[(i+1)%poly.length],ain=a.z>=NEAR,bin=b.z>=NEAR;
    if(ain)out.push(a);
    if(ain!==bin){
      const t=(NEAR-a.z)/(b.z-a.z);
      out.push({x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t),z:NEAR,u:lerp(a.u,b.u,t),v:lerp(a.v,b.v,t)});
    }
  }
  return out;
}
function projectCam(p){const f=220/p.z;return{x:W*.5+p.x*f,y:H*.555-p.y*f,z:p.z,f};}
function worldQuad(img,pts,alpha){
  if(!img)return;
  const iw=img.width,ih=img.height;
  let poly=pts.map((p,i)=>cameraVertex({x:p.x,y:p.y,z:p.z,u:(i===1||i===2)?iw:0,v:(i>=2)?ih:0}));
  poly=clipNear(poly);if(poly.length<3)return;
  const pp=poly.map(projectCam);
  for(let i=1;i<poly.length-1;i++)texTri(img,pp[0],pp[i],pp[i+1],{x:poly[0].u,y:poly[0].v},{x:poly[i].u,y:poly[i].v},{x:poly[i+1].u,y:poly[i+1].v},alpha);
}
function chamferPier(img,side,outerX,innerFloor,innerTop,y0,y1,z0,z1,alpha){
  const s=side<0?-1:1;
  const outer=s*outerX,foot=s*innerFloor,top=s*innerTop;
  const front=[
    {x:outer,y:y1,z:z0},{x:top,y:y1,z:z0},
    {x:foot,y:y0,z:z0},{x:outer,y:y0,z:z0}
  ];
  const back=[
    {x:top,y:y1,z:z1},{x:outer,y:y1,z:z1},
    {x:outer,y:y0,z:z1},{x:foot,y:y0,z:z1}
  ];
  const bevel=[
    {x:top,y:y1,z:z1},{x:top,y:y1,z:z0},
    {x:foot,y:y0,z:z0},{x:foot,y:y0,z:z1}
  ];
  const cap=[
    {x:outer,y:y1,z:z0},{x:outer,y:y1,z:z1},
    {x:top,y:y1,z:z1},{x:top,y:y1,z:z0}
  ];
  worldQuad(img,front,alpha);
  worldQuad(img,back,alpha*.72);
  worldQuad(img,bevel,alpha*.88);
  worldQuad(img,cap,alpha*.68);
}
function depthAlpha(d){return clamp(1-d/112,.18,.98)}
function baseFill(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#061007');g.addColorStop(.55,'#091309');g.addColorStop(1,'#020403');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function renderPassage(){
  baseFill();

  // Much taller cavity. The first visible arch starts ahead of the player,
  // so the camera no longer sits under a giant nearby ceiling slab.
  const halfW=5.75,floorY=-1.56,ceilY=9.55,shoulderY=3.72;
  const innerFloor=2.55,innerTop=3.34;
  const zNear=camZ-22,zFar=camZ+112;
  const ceilingStart=camZ+12;

  const wallTex=atlas.wallMass||atlas.wallField||atlas.wall;
  const floorTex=atlas.floorField||atlas.floorTile||atlas.floor;
  const ceilTex=atlas.ceilingField||atlas.ceiling;
  const ribTex=atlas.stoneTile||atlas.stone||wallTex;
  const shadowTex=atlas.shadow||wallTex;
  const farTex=atlas.far||shadowTex;

  // Continuous floor remains under the player.
  worldQuad(floorTex,[
    {x:-halfW,y:floorY,z:zFar},{x:halfW,y:floorY,z:zFar},
    {x:halfW,y:floorY,z:zNear},{x:-halfW,y:floorY,z:zNear}
  ],1);

  // Side envelope stays present so gaps never become empty black holes.
  worldQuad(wallTex,[
    {x:-halfW,y:ceilY,z:zNear},{x:-halfW,y:ceilY,z:zFar},
    {x:-halfW,y:floorY,z:zFar},{x:-halfW,y:floorY,z:zNear}
  ],1);
  worldQuad(wallTex,[
    {x:halfW,y:ceilY,z:zFar},{x:halfW,y:ceilY,z:zNear},
    {x:halfW,y:floorY,z:zNear},{x:halfW,y:floorY,z:zFar}
  ],1);

  // Ceiling begins well ahead. This keeps the immediate overhead area open and
  // makes the nave feel much taller rather than like a low lid over the camera.
  worldQuad(ceilTex,[
    {x:-halfW,y:ceilY,z:ceilingStart},{x:halfW,y:ceilY,z:ceilingStart},
    {x:halfW,y:ceilY,z:zFar},{x:-halfW,y:ceilY,z:zFar}
  ],.88);

  // Low side skirts visually bind floor and walls without adding square posts.
  worldQuad(ribTex,[
    {x:-halfW+.04,y:floorY+.78,z:zNear},{x:-halfW+.04,y:floorY+.78,z:zFar},
    {x:-halfW+.04,y:floorY,z:zFar},{x:-halfW+.04,y:floorY,z:zNear}
  ],.84);
  worldQuad(ribTex,[
    {x:halfW-.04,y:floorY+.78,z:zFar},{x:halfW-.04,y:floorY+.78,z:zNear},
    {x:halfW-.04,y:floorY,z:zNear},{x:halfW-.04,y:floorY,z:zFar}
  ],.84);

  worldQuad(farTex,[
    {x:-halfW,y:ceilY,z:zFar},{x:halfW,y:ceilY,z:zFar},
    {x:halfW,y:floorY,z:zFar},{x:-halfW,y:floorY,z:zFar}
  ],.90);

  const bay=6.15,thick=.68;
  const first=Math.ceil((camZ+4.8)/bay)*bay;
  const ribs=[];
  for(let i=0;i<22;i++){
    const z=first+i*bay;
    if(z>zFar-2)continue;
    ribs.push({z,depth:z-camZ});
  }
  ribs.sort((a,b)=>b.depth-a.depth);

  for(const r of ribs){
    const a=depthAlpha(r.depth);
    const z0=r.z-thick*.5,z1=r.z+thick*.5;

    // Dark rear wedges add depth, but remain part of the material mass.
    chamferPier(shadowTex,-1,halfW-.10,innerFloor-.03,innerTop-.06,floorY,shoulderY,z0+.20,z1+.26,a*.34);
    chamferPier(shadowTex, 1,halfW-.10,innerFloor-.03,innerTop-.06,floorY,shoulderY,z0+.20,z1+.26,a*.34);

    // Main supports are trapezoidal: the inner edge leans outward as it rises.
    // That replaces the old parade of rectangular columns with smoother diagonal thresholds.
    chamferPier(ribTex,-1,halfW-.08,innerFloor,innerTop,floorY,shoulderY,z0,z1,a*.98);
    chamferPier(ribTex, 1,halfW-.08,innerFloor,innerTop,floorY,shoulderY,z0,z1,a*.98);

    // Curved crown is wide/open and visually connects both diagonal supports.
    if(atlas.crown){
      worldQuad(atlas.crown,[
        {x:-halfW+.02,y:ceilY+.05,z:z1+.10},{x:halfW-.02,y:ceilY+.05,z:z1+.10},
        {x:halfW-.02,y:shoulderY-.06,z:z1+.10},{x:-halfW+.02,y:shoulderY-.06,z:z1+.10}
      ],a*.30);
      worldQuad(atlas.crown,[
        {x:-halfW+.02,y:ceilY+.05,z:z0},{x:halfW-.02,y:ceilY+.05,z:z0},
        {x:halfW-.02,y:shoulderY-.06,z:z0},{x:-halfW+.02,y:shoulderY-.06,z:z0}
      ],a*.92);
    }

    // Thin top bridge gives the arch perceptual depth without becoming a low ceiling slab.
    worldQuad(ribTex,[
      {x:-halfW+.15,y:ceilY-.22,z:z0},{x:halfW-.15,y:ceilY-.22,z:z0},
      {x:halfW-.15,y:ceilY-.22,z:z1},{x:-halfW+.15,y:ceilY-.22,z:z1}
    ],a*.42);
  }

  // Subtle central wear strip: depth cue, not a detached geometric carpet.
  worldQuad(ribTex,[
    {x:-1.05,y:floorY+.014,z:zFar},{x:1.05,y:floorY+.014,z:zFar},
    {x:1.05,y:floorY+.014,z:zNear},{x:-1.05,y:floorY+.014,z:zNear}
  ],.14);

  // Darkness lives at the distant central throat, not in the side gaps.
  const p=projectCam({x:0,y:2.35,z:camZ+90});
  const throat=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,Math.max(38,W*.13));
  throat.addColorStop(0,'rgba(0,0,0,.43)');
  throat.addColorStop(.45,'rgba(0,0,0,.18)');
  throat.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=throat;ctx.fillRect(0,0,W,H);
}
function analog(){
  ctx.save();ctx.globalAlpha=.026;ctx.globalCompositeOperation='screen';
  for(let i=0;i<20;i++){
    const x=(i*97+(last|0)*.010)%W,y=(i*47+(last|0)*.006)%H;
    ctx.fillStyle=i%3?'#b39d56':'#5f774e';ctx.fillRect(x,y,1,1);
  }
  ctx.restore();
}
function render(){ctx.setTransform(1,0,0,1,0,0);renderPassage();analog();}
function update(dt){
  const k=Math.min(1,dt*.014);
  camZ=lerp(camZ,targetCamZ,k);
}
function frame(t){
  requestAnimationFrame(frame);
  if(document.hidden||t-last<28)return;
  const dt=Math.min(50,t-last||16);last=t;update(dt);render();
}
const held=new Map();
function nudge(kind,amount){
  if(kind==='up')targetCamZ=clamp(targetCamZ+amount*9,-5,126);
  if(kind==='down')targetCamZ=clamp(targetCamZ-amount*9,-5,126);
  hint.style.opacity='.18';
}
['up','down'].forEach(id=>{
  const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();nudge(id,.13);
    const timer=setInterval(()=>nudge(id,.052),60);held.set(e.pointerId,timer);b.setPointerCapture(e.pointerId);
  });
  const stop=e=>{const t=held.get(e.pointerId);if(t)clearInterval(t);held.delete(e.pointerId);};
  b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);
});
addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'||e.key==='w')nudge('up',.12);
  else if(e.key==='ArrowDown'||e.key==='s')nudge('down',.12);
