<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050504">
<title>Prometeo · Spaces Lab · Image First</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030403;color:#d7cfb9;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none;touch-action:none}
#app{position:fixed;inset:0;overflow:hidden;background:#030403}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#sceneNav{position:absolute;z-index:8;left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);display:flex;gap:3px;padding:3px;background:rgba(3,4,3,.46);backdrop-filter:blur(3px);opacity:.62;transition:opacity .25s}
#sceneNav:hover,#sceneNav:focus-within{opacity:1}
#sceneNav button{border:0;background:transparent;color:#8c897c;padding:7px 10px;font:700 9px/1.1 system-ui,sans-serif;letter-spacing:.11em;text-transform:uppercase}
#sceneNav button.on{color:#ece1c5;background:rgba(180,156,102,.12)}
#hint{position:absolute;z-index:7;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);color:rgba(224,215,190,.45);font:600 8px/1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;pointer-events:none;transition:opacity 1s}
#loading{position:absolute;z-index:10;inset:0;display:grid;place-items:center;background:#030403;color:#777266;font:700 9px/1 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;transition:opacity .35s}
#loading.off{opacity:0;pointer-events:none}
#grain{position:absolute;z-index:6;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.025) 0 1px,transparent 1px 4px);mix-blend-mode:screen}
#shade{position:absolute;z-index:5;inset:-8%;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.20) 66%,rgba(0,0,0,.80) 100%)}
@media(max-height:430px){#sceneNav{top:5px}#sceneNav button{padding:6px 8px;font-size:8px}}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="Espacios pseudo-3D de Prometeo"></canvas>
  <div id="shade"></div><div id="grain"></div>
  <nav id="sceneNav" aria-label="Escenas">
    <button class="on" data-scene="passage">PASSAGE</button>
    <button data-scene="tunnel">TUNNEL</button>
    <button data-scene="chamber">CHAMBER</button>
  </nav>
  <div id="hint">arrastrá para mirar · vertical para avanzar · pinch para zoom</div>
  <div id="loading">cargando materiales</div>
</div>

<!--
IMAGE SOURCES
1) Abandoned tiled room panorama, Sergej Majboroda via Poly Haven, CC0:
   https://commons.wikimedia.org/wiki/File:Abandoned_tiled_room_-_Panorama_(Poly_Haven).jpg
2) Internal Prometeo mask/heart assets already present in this repository.
The panorama is intentionally used as a material atlas and as the CHAMBER environment.
-->
<script>
(function(){
'use strict';
var canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
var loading=document.getElementById('loading'),hint=document.getElementById('hint');
var W=640,H=360,last=0,scene='passage',yaw=0,targetYaw=0,depth=0,targetDepth=0,zoom=1,targetZoom=1,drag=null,pointers=new Map(),pinch=null;
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v))};
var lerp=function(a,b,t){return a+(b-a)*t};
var assets={},ready=0;
var SOURCES={
  panorama:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2d/Abandoned_tiled_room_-_Panorama_%28Poly_Haven%29.jpg/1280px-Abandoned_tiled_room_-_Panorama_%28Poly_Haven%29.jpg',
  mask:'../../strategy/mask-mouth/assets/mask-transparent.webp',
  heart:'../../arte/assets/footer/heart-mask-final-alpha.png'
};
function load(name,url){
  return new Promise(function(resolve){
    var im=new Image();
    im.decoding='async';im.crossOrigin='anonymous';
    im.onload=function(){assets[name]=im;ready++;resolve(im)};
    im.onerror=function(){assets[name]=null;resolve(null)};
    im.src=url;
  });
}
var atlas={};
function crop(name,img,sx,sy,sw,sh,tint){
  if(!img)return null;
  var c=document.createElement('canvas');c.width=384;c.height=256;var g=c.getContext('2d');
  g.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
  if(tint){g.globalCompositeOperation='multiply';g.fillStyle=tint;g.fillRect(0,0,c.width,c.height);g.globalCompositeOperation='source-over'}
  atlas[name]=c;return c;
}
function buildAtlas(){
  var p=assets.panorama;
  if(p){
    var iw=p.naturalWidth||1280,ih=p.naturalHeight||640;
    crop('wallA',p,0,70,Math.min(410,iw),Math.min(430,ih-70),'rgba(86,92,72,.88)');
    crop('wallB',p,Math.max(0,iw*.33),80,Math.min(430,iw*.4),Math.min(420,ih-80),'rgba(88,74,61,.90)');
    crop('floor',p,0,Math.max(0,ih*.55),iw,Math.min(ih*.45,ih),'rgba(65,59,50,.88)');
    crop('ceiling',p,0,0,iw,Math.min(250,ih),'rgba(54,48,39,.82)');
    crop('pillar',p,Math.max(0,iw*.08),0,Math.min(220,iw*.2),ih,'rgba(71,65,55,.92)');
    crop('darkWall',p,Math.max(0,iw*.66),60,Math.min(350,iw*.3),Math.min(450,ih-60),'rgba(45,55,48,.78)');
  }
  loading.classList.add('off');
}
Promise.all([load('panorama',SOURCES.panorama),load('mask',SOURCES.mask),load('heart',SOURCES.heart)]).then(buildAtlas);

function resize(){
  var cw=innerWidth,ch=innerHeight,aspect=cw/Math.max(1,ch);
  H=360;W=Math.round(H*aspect);
  if(W>760){W=760;H=Math.round(W/aspect)}
  if(W<300){W=300;H=Math.round(W/aspect)}
  canvas.width=W;canvas.height=H;
}
addEventListener('resize',resize,{passive:true});resize();

function texTri(img,p0,p1,p2,uv0,uv1,uv2,alpha){
  if(!img)return;
  var u0=uv0.x,v0=uv0.y,u1=uv1.x,v1=uv1.y,u2=uv2.x,v2=uv2.y;
  var den=u0*(v1-v2)+u1*(v2-v0)+u2*(v0-v1);if(Math.abs(den)<.001)return;
  var a=(p0.x*(v1-v2)+p1.x*(v2-v0)+p2.x*(v0-v1))/den;
  var c=(p0.x*(u2-u1)+p1.x*(u0-u2)+p2.x*(u1-u0))/den;
  var e=(p0.x*(u1*v2-u2*v1)+p1.x*(u2*v0-u0*v2)+p2.x*(u0*v1-u1*v0))/den;
  var b=(p0.y*(v1-v2)+p1.y*(v2-v0)+p2.y*(v0-v1))/den;
  var d=(p0.y*(u2-u1)+p1.y*(u0-u2)+p2.y*(u1-u0))/den;
  var f=(p0.y*(u1*v2-u2*v1)+p1.y*(u2*v0-u0*v2)+p2.y*(u0*v1-u1*v0))/den;
  ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.closePath();ctx.clip();
  ctx.setTransform(a,b,c,d,e,f);ctx.drawImage(img,0,0);ctx.restore();
}
function texQuad(img,p0,p1,p2,p3,alpha){
  if(!img)return;
  var w=img.width||384,h=img.height||256;
  texTri(img,p0,p1,p2,{x:0,y:0},{x:w,y:0},{x:w,y:h},alpha);
  texTri(img,p0,p2,p3,{x:0,y:0},{x:w,y:h},{x:0,y:h},alpha);
}
function fillPoly(ps,col,a){
  ctx.save();ctx.globalAlpha=a==null?1:a;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(ps[0].x,ps[0].y);for(var i=1;i<ps.length;i++)ctx.lineTo(ps[i].x,ps[i].y);ctx.closePath();ctx.fill();ctx.restore();
}
function project(x,y,z){
  var zz=Math.max(.35,z),f=(154/zz)*zoom;
  var vp=W*.5+targetYaw*W*.29;
  return {x:vp+x*f,y:H*.49-y*f,s:f/154,z:zz};
}
function corridorSlice(z,halfW,halfH){
  var a=project(-halfW,halfH,z),b=project(halfW,halfH,z),c=project(halfW,-halfH,z),d=project(-halfW,-halfH,z);
  return {tl:a,tr:b,br:c,bl:d};
}
function panelImage(img,x,y,z,w,h,alpha){
  if(!img)return;
  var p=project(x,y,z),sw=w*154/z*zoom,sh=h*154/z*zoom;
  if(sw<2||sh<2)return;
  ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.drawImage(img,p.x-sw*.5,p.y-sh*.5,sw,sh);ctx.restore();
}
function corridorBase(){
  var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#090a08');g.addColorStop(.48,'#12130f');g.addColorStop(1,'#050504');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function renderPassage(){
  corridorBase();
  var step=4.4,phase=((depth%step)+step)%step,halfW=2.85,halfH=1.62;
  var segs=[];
  for(var i=0;i<12;i++){var zn=1.1+i*step-phase,zf=zn+step;if(zf>.45)segs.push({n:Math.max(.45,zn),f:zf,i:i})}
  for(var j=segs.length-1;j>=0;j--){
    var s=segs[j],n=corridorSlice(s.n,halfW,halfH),f=corridorSlice(s.f,halfW,halfH);
    var fade=clamp(1-s.f/48,.18,.98);
    texQuad(atlas.wallA,n.tl,f.tl,f.bl,n.bl,fade);
    texQuad(atlas.wallB,f.tr,n.tr,n.br,f.br,fade);
    texQuad(atlas.ceiling,n.tl,n.tr,f.tr,f.tl,fade*.72);
    texQuad(atlas.floor,f.bl,f.br,n.br,n.bl,fade*.90);
    if(s.i%2===0){
      var railY=-.72;
      var l0=project(-halfW+.13,railY,s.n),l1=project(-halfW+.13,railY,s.f),l2=project(-halfW+.47,railY,s.f),l3=project(-halfW+.47,railY,s.n);
      texQuad(atlas.pillar,l0,l1,l2,l3,fade*.95);
      var r0=project(halfW-.47,railY,s.n),r1=project(halfW-.47,railY,s.f),r2=project(halfW-.13,railY,s.f),r3=project(halfW-.13,railY,s.n);
      texQuad(atlas.pillar,r0,r1,r2,r3,fade*.88);
    }
    if(s.i%3===1){
      var z=s.f-.7;
      panelImage(assets.mask,-2.51,.05,z,.80,1.28,fade*.84);
    }
    if(s.i%5===2)panelImage(assets.heart,2.45,.10,s.f-.9,.62,.62,fade*.58);
  }
  var end=project(0,0,45);ctx.save();ctx.globalAlpha=.20;ctx.fillStyle='#a79365';ctx.fillRect(end.x-2,end.y-5,4,10);ctx.restore();
}
function renderTunnel(){
  corridorBase();
  var step=3.25,phase=((depth%step)+step)%step,halfW=3.65,halfH=1.95;
  var modules=[];
  for(var i=0;i<16;i++){var z=1.0+i*step-phase;if(z>.42)modules.push({z:z,i:i})}
  var far=corridorSlice(44,halfW,halfH);fillPoly([far.tl,far.tr,far.br,far.bl],'#121914',.92);
  var floorNear=corridorSlice(.48,halfW,halfH),floorFar=corridorSlice(45,halfW,halfH);
  texQuad(atlas.floor,floorFar.bl,floorFar.br,floorNear.br,floorNear.bl,.76);
  for(var j=modules.length-1;j>=0;j--){
    var m=modules[j],z=m.z,s=corridorSlice(z,halfW,halfH),fade=clamp(1-z/52,.12,.98);
    var w=.46;
    var p1=project(-halfW,-halfH,z),p2=project(-halfW+w,-halfH,z),p3=project(-halfW+w,halfH,z),p4=project(-halfW,halfH,z);
    texQuad(atlas.pillar,p4,p3,p2,p1,fade);
    var q1=project(halfW-w,-halfH,z),q2=project(halfW,-halfH,z),q3=project(halfW,halfH,z),q4=project(halfW-w,halfH,z);
    texQuad(atlas.darkWall,q4,q3,q2,q1,fade);
    var b1=project(-halfW,halfH,z),b2=project(halfW,halfH,z),b3=project(halfW,halfH-.34,z),b4=project(-halfW,halfH-.34,z);
    texQuad(atlas.ceiling,b1,b2,b3,b4,fade*.96);
    if(m.i%4===0){
      var inset=project(0,.18,z+.16);
      panelImage(assets.mask,0,.12,z+.10,.62,.95,fade*.64);
      ctx.save();ctx.globalAlpha=fade*.12;ctx.fillStyle='#9c684a';ctx.fillRect(inset.x-1,inset.y-1,2,2);ctx.restore();
    }
  }
}
function renderPanorama(){
  var img=assets.panorama;if(!img){corridorBase();return}
  var iw=img.naturalWidth,ih=img.naturalHeight;
  var strips=72,base=((yaw/(Math.PI*2))%1+1)%1,view=.44/zoom;
  for(var i=0;i<strips;i++){
    var t=i/strips,n=(i+1)/strips;
    var ang=(t-.5)*Math.PI*.90;
    var sxNorm=(base+(t-.5)*view+1)%1;
    var sx=Math.floor(sxNorm*iw),sw=Math.ceil(iw*view/strips)+2;
    var dx=Math.floor(t*W)-2,dw=Math.ceil((n-t)*W)+4;
    var bulge=Math.cos(ang)*10*(zoom-.72);
    var dy=-5+bulge*.18,dh=H+10-bulge*.36;
    if(sx+sw<=iw)ctx.drawImage(img,sx,0,sw,ih,dx,dy,dw,dh);
    else{
      var a=iw-sx,b=sw-a;
      var dwA=dw*a/sw;
      ctx.drawImage(img,sx,0,a,ih,dx,dy,dwA,dh);
      ctx.drawImage(img,0,0,b,ih,dx+dwA,dy,dw-dwA,dh);
    }
  }
  var sh=ctx.createLinearGradient(0,0,0,H);sh.addColorStop(0,'rgba(9,10,7,.16)');sh.addColorStop(.55,'rgba(6,7,5,.03)');sh.addColorStop(1,'rgba(0,0,0,.38)');ctx.fillStyle=sh;ctx.fillRect(0,0,W,H);
  var a1=-.95,a2=.75;
  function chamberRelic(img,a,scale,alpha){
    var d=Math.cos(a-yaw),side=Math.sin(a-yaw);
    if(d<.12||!img)return;
    var x=W*.5+side/d*W*.25,y=H*.58;
    var s=scale/d*zoom;
    ctx.save();ctx.globalAlpha=alpha*clamp(d,.2,1);ctx.drawImage(img,x-s*.5,y-s*.65,s,s);ctx.restore();
  }
  chamberRelic(assets.mask,a1,86,.74);
  chamberRelic(assets.heart,a2,54,.48);
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  if(scene==='passage')renderPassage();
  else if(scene==='tunnel')renderTunnel();
  else renderPanorama();
  var g=ctx.createRadialGradient(W*.5,H*.5,W*.14,W*.5,H*.5,W*.66);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.58)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function update(dt){
  yaw=lerp(yaw,targetYaw,Math.min(1,dt*.012));
  depth=lerp(depth,targetDepth,Math.min(1,dt*.012));
  zoom=lerp(zoom,targetZoom,Math.min(1,dt*.012));
}
function frame(t){
  requestAnimationFrame(frame);
  if(document.hidden||t-last<30)return;
  var dt=Math.min(50,t-last||16);last=t;update(dt);render();
}
function setScene(s){
  scene=s;document.querySelectorAll('#sceneNav button').forEach(function(b){b.classList.toggle('on',b.dataset.scene===s)});
  hint.style.opacity='1';setTimeout(function(){hint.style.opacity='.24'},1800);
}
document.querySelectorAll('#sceneNav button').forEach(function(b){b.addEventListener('pointerdown',function(e){e.stopPropagation();setScene(b.dataset.scene)})});
function point(e){var r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
canvas.addEventListener('pointerdown',function(e){
  var p=point(e);pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);
  if(pointers.size===1)drag={id:e.pointerId,x:p.x,y:p.y,yaw:targetYaw,depth:targetDepth,zoom:targetZoom};
  if(pointers.size===2){var ps=[...pointers.values()];pinch={d:Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y),z:targetZoom};drag=null}
  e.preventDefault();
});
canvas.addEventListener('pointermove',function(e){
  if(!pointers.has(e.pointerId))return;var p=point(e);pointers.set(e.pointerId,p);
  if(pinch&&pointers.size>=2){var ps=[...pointers.values()],d=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);targetZoom=clamp(pinch.z*d/Math.max(1,pinch.d),.72,1.50);return}
  if(drag&&drag.id===e.pointerId){
    targetYaw=drag.yaw+(p.x-drag.x)/W*1.65;
    if(scene==='chamber')targetZoom=clamp(drag.zoom-(p.y-drag.y)/H*.45,.72,1.50);
    else targetDepth=drag.depth-(p.y-drag.y)/H*18;
  }
  e.preventDefault();
});
function end(e){
  pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;
  if(pointers.size===1){var z=[...pointers.entries()][0];drag={id:z[0],x:z[1].x,y:z[1].y,yaw:targetYaw,depth:targetDepth,zoom:targetZoom}}else drag=null;
}
canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'||e.key==='a')targetYaw-=.12;
  else if(e.key==='ArrowRight'||e.key==='d')targetYaw+=.12;
  else if(e.key==='ArrowUp'||e.key==='w')targetDepth+=1.2;
  else if(e.key==='ArrowDown'||e.key==='s')targetDepth-=1.2;
});
window.PrometeoSpaces={version:'spaces-image-first-v2',setScene:setScene,assets:assets,camera:{get yaw(){return targetYaw},get depth(){return targetDepth}}};
setScene('passage');requestAnimationFrame(frame);
})();
</script>
</body>
</html>
