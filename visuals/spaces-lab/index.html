<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#040504">
<title>Prometeo · Spaces Lab · Passage</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030403;color:#d9d0b8;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none;touch-action:none}
#app{position:fixed;inset:0;overflow:hidden;background:#030403;isolation:isolate}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:auto}
#pad{position:absolute;z-index:11;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));width:128px;height:86px;pointer-events:none;opacity:.62}
#pad button{position:absolute;width:42px;height:42px;border:1px solid rgba(221,205,151,.16);background:rgba(5,6,4,.58);color:rgba(229,216,174,.72);font:900 18px/1 system-ui,sans-serif;display:grid;place-items:center;pointer-events:auto;backdrop-filter:blur(2px)}
#left{left:0;top:22px}#right{right:0;top:22px}#up{left:43px;top:0}#down{left:43px;bottom:0}
#pad button:active{background:rgba(106,104,61,.32);color:#efe5c7}
#hint{position:absolute;z-index:7;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));max-width:48%;color:rgba(224,215,190,.40);font:700 7px/1.25 system-ui,sans-serif;letter-spacing:.10em;text-transform:uppercase;pointer-events:none;transition:opacity 1s}
#loading{position:absolute;z-index:20;inset:0;display:grid;place-items:center;background:#030403;color:#777461;font:800 9px/1 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;transition:opacity .32s}
#loading.off{opacity:0;pointer-events:none}
#vignette{position:absolute;z-index:5;inset:-8%;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 34%,rgba(0,0,0,.18) 57%,rgba(0,0,0,.77) 100%)}
#scan{position:absolute;z-index:6;inset:0;pointer-events:none;opacity:.20;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.024) 0 1px,transparent 1px 4px);mix-blend-mode:screen}
@media(max-height:430px){#pad{transform:scale(.9);transform-origin:bottom right}}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="Pasillo pseudo-3D de Prometeo"></canvas>
  <div id="vignette"></div><div id="scan"></div>
  <div id="pad" aria-label="Controles táctiles">
    <button id="left" aria-label="Mirar izquierda">‹</button>
    <button id="right" aria-label="Mirar derecha">›</button>
    <button id="up" aria-label="Avanzar">↑</button>
    <button id="down" aria-label="Retroceder">↓</button>
  </div>
  <div id="hint">izquierda/derecha = mirar · arriba/abajo = avanzar recto · suelo continuo</div>
  <div id="loading">cargando lugar</div>
</div>
<script>
(function(){
'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
const loading=document.getElementById('loading');
const hint=document.getElementById('hint');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
let W=640,H=360,last=0,scene='passage';
let yaw=0,targetYaw=0,camZ=0,targetCamZ=0,zoom=1,targetZoom=1;
let drag=null,pinch=null;const pointers=new Map();
const assets={};const atlas={};
const SOURCES={
  room:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2d/Abandoned_tiled_room_-_Panorama_%28Poly_Haven%29.jpg/1280px-Abandoned_tiled_room_-_Panorama_%28Poly_Haven%29.jpg',
  mask:'../../strategy/mask-mouth/assets/mask-transparent.webp',
  heart:'../../arte/assets/footer/heart-mask-final-alpha.png'
};
function load(name,url){return new Promise(resolve=>{const im=new Image();im.decoding='async';if(/^https?:/.test(url))im.crossOrigin='anonymous';im.onload=()=>{assets[name]=im;resolve(im)};im.onerror=()=>{assets[name]=null;resolve(null)};im.src=url})}
function resize(){const a=innerWidth/Math.max(1,innerHeight);H=360;W=Math.round(H*a);if(W>760){W=760;H=Math.round(W/a)}if(W<320){W=320;H=Math.round(W/a)}canvas.width=W;canvas.height=H}
addEventListener('resize',resize,{passive:true});resize();
function makeCrop(name,img,sx,sy,sw,sh,grade){
  if(!img)return null;const c=document.createElement('canvas');c.width=384;c.height=256;const g=c.getContext('2d');
  g.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
  g.globalCompositeOperation='multiply';g.fillStyle=grade;g.fillRect(0,0,c.width,c.height);
  g.globalCompositeOperation='screen';g.globalAlpha=.11;g.fillStyle='#c9b86f';g.fillRect(0,0,c.width,c.height);g.globalAlpha=1;g.globalCompositeOperation='source-over';
  const id=g.getImageData(0,0,c.width,c.height),d=id.data;for(let y=0;y<c.height;y+=2){for(let x=(y>>1)&1;x<c.width;x+=2){const i=(y*c.width+x)*4;d[i]*=.88;d[i+1]*=.92;d[i+2]*=.82}}
  g.putImageData(id,0,0);atlas[name]=c;return c;
}
function buildAtlas(){
  const p=assets.room;if(p){const iw=p.naturalWidth,ih=p.naturalHeight;
    makeCrop('wallL',p,0,Math.floor(ih*.08),Math.floor(iw*.33),Math.floor(ih*.72),'rgba(73,91,53,.96)');
    makeCrop('wallR',p,Math.floor(iw*.31),Math.floor(ih*.10),Math.floor(iw*.36),Math.floor(ih*.70),'rgba(73,62,49,.98)');
    makeCrop('floor',p,0,Math.floor(ih*.52),iw,Math.floor(ih*.47),'rgba(57,52,42,.98)');
    makeCrop('ceiling',p,0,0,iw,Math.floor(ih*.35),'rgba(54,58,43,.96)');
    makeCrop('rust',p,Math.floor(iw*.62),Math.floor(ih*.05),Math.floor(iw*.34),Math.floor(ih*.74),'rgba(76,51,42,.98)');
    makeCrop('moss',p,Math.floor(iw*.11),Math.floor(ih*.12),Math.floor(iw*.28),Math.floor(ih*.67),'rgba(54,74,53,.98)');
  }
  loading.classList.add('off');
}
Promise.all(Object.entries(SOURCES).map(([n,u])=>load(n,u))).then(buildAtlas);
function texTri(img,p0,p1,p2,uv0,uv1,uv2,alpha=1){
  if(!img)return;const den=uv0.x*(uv1.y-uv2.y)+uv1.x*(uv2.y-uv0.y)+uv2.x*(uv0.y-uv1.y);if(Math.abs(den)<.001)return;
  const a=(p0.x*(uv1.y-uv2.y)+p1.x*(uv2.y-uv0.y)+p2.x*(uv0.y-uv1.y))/den;
  const c=(p0.x*(uv2.x-uv1.x)+p1.x*(uv0.x-uv2.x)+p2.x*(uv1.x-uv0.x))/den;
  const e=(p0.x*(uv1.x*uv2.y-uv2.x*uv1.y)+p1.x*(uv2.x*uv0.y-uv0.x*uv2.y)+p2.x*(uv0.x*uv1.y-uv1.x*uv0.y))/den;
  const b=(p0.y*(uv1.y-uv2.y)+p1.y*(uv2.y-uv0.y)+p2.y*(uv0.y-uv1.y))/den;
  const d=(p0.y*(uv2.x-uv1.x)+p1.y*(uv0.x-uv2.x)+p2.y*(uv1.x-uv0.x))/den;
  const f=(p0.y*(uv1.x*uv2.y-uv2.x*uv1.y)+p1.y*(uv2.x*uv0.y-uv0.x*uv2.y)+p2.y*(uv0.x*uv1.y-uv1.x*uv0.y))/den;
  ctx.save();ctx.globalAlpha=alpha;ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.closePath();ctx.clip();ctx.setTransform(a,b,c,d,e,f);ctx.drawImage(img,0,0);ctx.restore();
}
function texQuad(img,p0,p1,p2,p3,alpha=1){if(!img)return;const w=img.width,h=img.height;texTri(img,p0,p1,p2,{x:0,y:0},{x:w,y:0},{x:w,y:h},alpha);texTri(img,p0,p2,p3,{x:0,y:0},{x:w,y:h},{x:0,y:h},alpha)}
function cameraPoint(x,y,z){
  const dz=z-camZ,cs=Math.cos(yaw),sn=Math.sin(yaw);return {x:x*cs-dz*sn,y,z:x*sn+dz*cs};
}
function projectWorld(x,y,z){const p=cameraPoint(x,y,z);if(p.z<=.18)return null;const f=(205/p.z)*zoom;return{x:W*.5+p.x*f,y:H*.51-y*f,z:p.z,f}}
function quadWorld(a,b,c,d,img,alpha){const p=[a,b,c,d].map(q=>projectWorld(q.x,q.y,q.z));if(p.some(q=>!q))return;texQuad(img,p[0],p[1],p[2],p[3],alpha)}
function continuousFloor(halfW,y,z0,z1,img,alpha){
  const cs=Math.max(.22,Math.cos(yaw)),sn=Math.abs(Math.sin(yaw));
  const near=Math.max(z0,camZ+(halfW*sn+.34)/cs);
  if(z1<=near)return;
  quadWorld({x:-halfW,y,z:z1},{x:halfW,y,z:z1},{x:halfW,y,z:near},{x:-halfW,y,z:near},img,alpha);
}
function spriteWorld(img,x,y,z,w,h,alpha=1){if(!img)return;const p=projectWorld(x,y,z);if(!p)return;const sw=w*p.f,sh=h*p.f;if(sw<2||sh<2)return;ctx.save();ctx.globalAlpha=alpha;ctx.drawImage(img,p.x-sw*.5,p.y-sh*.5,sw,sh);ctx.restore()}
function baseFill(top,bottom){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,top);g.addColorStop(.55,'#11120d');g.addColorStop(1,bottom);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function renderPassage(){
  baseFill('#090b08','#030403');
  const halfW=3.15,halfH=1.78,seg=4.2,start=Math.floor((camZ-2)/seg)*seg-4;
  const items=[];for(let k=0;k<18;k++){const z0=start+k*seg,z1=z0+seg;const mid=(z0+z1)*.5-camZ;if(mid<-2||mid>58)continue;items.push({z0,z1,mid,k})}
  items.sort((a,b)=>b.mid-a.mid);
  for(const s of items){const fade=clamp(1-s.mid/58,.16,.98),z0=s.z0,z1=s.z1;
    quadWorld({x:-halfW,y:halfH,z:z0},{x:-halfW,y:halfH,z:z1},{x:-halfW,y:-halfH,z:z1},{x:-halfW,y:-halfH,z:z0},s.k%3===0?atlas.moss:atlas.wallL,fade);
    quadWorld({x:halfW,y:halfH,z:z1},{x:halfW,y:halfH,z:z0},{x:halfW,y:-halfH,z:z0},{x:halfW,y:-halfH,z:z1},s.k%4===0?atlas.rust:atlas.wallR,fade*.98);
    quadWorld({x:-halfW,y:halfH,z:z0},{x:halfW,y:halfH,z:z0},{x:halfW,y:halfH,z:z1},{x:-halfW,y:halfH,z:z1},atlas.ceiling,fade*.82);
    continuousFloor(halfW,-halfH,z0,z1,atlas.floor,fade*.95);
    const doorZ=z1-.72;
    if(s.k%3===1){spriteWorld(assets.mask,-2.70,-.10,doorZ,.92,1.42,fade*.80);}
    if(s.k%5===2){spriteWorld(assets.heart,2.66,-.14,doorZ,.66,.66,fade*.55);}
    if(s.k%2===0){
      quadWorld({x:-3.04,y:1.30,z:z0+.28},{x:-3.04,y:1.30,z:z0+1.18},{x:-3.04,y:.22,z:z0+1.18},{x:-3.04,y:.22,z:z0+.28},atlas.rust,fade*.92);
      quadWorld({x:3.04,y:.95,z:z0+2.12},{x:3.04,y:.95,z:z0+.92},{x:3.04,y:-.45,z:z0+.92},{x:3.04,y:-.45,z:z0+2.12},atlas.moss,fade*.86);
    }
  }
  const far=projectWorld(0,0,camZ+54);if(far){ctx.save();ctx.globalAlpha=.18;ctx.fillStyle='#d6bd72';ctx.fillRect(far.x-2,far.y-7,4,14);ctx.restore()}
}
function renderTunnel(){
  baseFill('#050706','#020302');const halfW=2.75,halfH=1.63,seg=3.2,start=Math.floor((camZ-1)/seg)*seg-3;
  const items=[];for(let k=0;k<22;k++){const z0=start+k*seg,z1=z0+seg,mid=(z0+z1)*.5-camZ;if(mid<-1.5||mid>62)continue;items.push({z0,z1,mid,k})}items.sort((a,b)=>b.mid-a.mid);
  for(const s of items){const f=clamp(1-s.mid/62,.11,.96),z0=s.z0,z1=s.z1;
    quadWorld({x:-halfW,y:halfH,z:z0},{x:-halfW,y:halfH,z:z1},{x:-halfW,y:-halfH,z:z1},{x:-halfW,y:-halfH,z:z0},atlas.rust,f);
    quadWorld({x:halfW,y:halfH,z:z1},{x:halfW,y:halfH,z:z0},{x:halfW,y:-halfH,z:z0},{x:halfW,y:-halfH,z:z1},atlas.moss,f*.92);
    quadWorld({x:-halfW,y:halfH,z:z0},{x:halfW,y:halfH,z:z0},{x:halfW,y:halfH,z:z1},{x:-halfW,y:halfH,z:z1},atlas.wallR,f*.68);
    continuousFloor(halfW,-halfH,z0,z1,atlas.floor,f*.90);
    if(s.k%4===0)spriteWorld(assets.mask,0,.16,z1-.25,.72,1.08,f*.54);
  }
}
function renderChamber(){
  const img=assets.room;if(!img){baseFill('#070806','#030403');return}const iw=img.naturalWidth,ih=img.naturalHeight,base=((yaw/(Math.PI*2))%1+1)%1,view=.44/zoom,strips=88;
  for(let i=0;i<strips;i++){const t=i/strips,n=(i+1)/strips,sn=(base+(t-.5)*view+1)%1,sx=Math.floor(sn*iw),sw=Math.ceil(iw*view/strips)+2,dx=Math.floor(t*W)-2,dw=Math.ceil((n-t)*W)+4;if(sx+sw<=iw)ctx.drawImage(img,sx,0,sw,ih,dx,-5,dw,H+10);else{const a=iw-sx,b=sw-a,dwa=dw*a/sw;ctx.drawImage(img,sx,0,a,ih,dx,-5,dwa,H+10);ctx.drawImage(img,0,0,b,ih,dx+dwa,-5,dw-dwa,H+10)}}
  ctx.fillStyle='rgba(29,39,24,.22)';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='multiply';ctx.fillStyle='rgba(72,66,41,.35)';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';
  function relic(img,a,y,size,alpha){if(!img)return;let d=a-yaw;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;if(Math.abs(d)>.95)return;const x=W*.5+Math.tan(d)*W*.43,s=size*zoom;ctx.save();ctx.globalAlpha=alpha*(1-Math.abs(d)/.95);ctx.drawImage(img,x-s*.5,y-s*.55,s,s);ctx.restore()}
  relic(assets.mask,-.78,H*.55,92,.72);relic(assets.heart,.64,H*.61,58,.46);
}
function analog(){
  const g=ctx.createRadialGradient(W*.5,H*.48,W*.16,W*.5,H*.48,W*.69);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.44)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=.035;ctx.globalCompositeOperation='screen';for(let i=0;i<34;i++){const x=(i*83+(last|0)*.013)%W,y=(i*47+(last|0)*.009)%H;ctx.fillStyle=i%3?'#c5ad70':'#84906c';ctx.fillRect(x,y,1,1)}ctx.restore();
}
function render(){ctx.setTransform(1,0,0,1,0,0);renderPassage();analog()}
function update(dt){const k=Math.min(1,dt*.013);yaw=lerp(yaw,targetYaw,k);camZ=lerp(camZ,targetCamZ,k);zoom=lerp(zoom,targetZoom,k)}
function frame(t){requestAnimationFrame(frame);if(document.hidden||t-last<28)return;const dt=Math.min(50,t-last||16);last=t;update(dt);render()}
function setScene(){scene='passage';targetCamZ=0;targetYaw=0;targetZoom=1;hint.style.opacity='1';setTimeout(()=>hint.style.opacity='.24',1700)}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
canvas.addEventListener('pointerdown',e=>{const p=point(e);pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);if(pointers.size===1)drag={id:e.pointerId,x:p.x,y:p.y,yaw:targetYaw,z:targetCamZ,zoom:targetZoom};if(pointers.size===2){const ps=[...pointers.values()];pinch={d:Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y),z:targetZoom};drag=null}e.preventDefault()});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const p=point(e);pointers.set(e.pointerId,p);if(pinch&&pointers.size>=2){const ps=[...pointers.values()],d=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);targetZoom=clamp(pinch.z*d/Math.max(1,pinch.d),.78,1.32);return}if(drag&&drag.id===e.pointerId){targetYaw=clamp(drag.yaw+(p.x-drag.x)/W*1.28,-.82,.82);targetCamZ=clamp(drag.z-(p.y-drag.y)/H*18,-6,70)}e.preventDefault()});
function end(e){pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;if(pointers.size===1){const z=[...pointers.entries()][0];drag={id:z[0],x:z[1].x,y:z[1].y,yaw:targetYaw,z:targetCamZ,zoom:targetZoom}}else drag=null}
canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
const held=new Map();function nudge(kind,amount){if(kind==='left')targetYaw=clamp(targetYaw-amount,-.82,.82);if(kind==='right')targetYaw=clamp(targetYaw+amount,-.82,.82);if(kind==='up')targetCamZ=clamp(targetCamZ+amount*8,-6,70);if(kind==='down')targetCamZ=clamp(targetCamZ-amount*8,-6,70)}
['left','right','up','down'].forEach(id=>{const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();nudge(id,.13);const timer=setInterval(()=>nudge(id,.055),60);held.set(e.pointerId,timer);b.setPointerCapture(e.pointerId)});const stop=e=>{const t=held.get(e.pointerId);if(t)clearInterval(t);held.delete(e.pointerId)};b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop)});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')nudge('left',.10);else if(e.key==='ArrowRight'||e.key==='d')nudge('right',.10);else if(e.key==='ArrowUp'||e.key==='w')nudge('up',.12);else if(e.key==='ArrowDown'||e.key==='s')nudge('down',.12)});
window.PrometeoSpaces={version:'spaces-passage-v4',setScene,camera:{get yaw(){return targetYaw},get z(){return targetCamZ}},contract:'single image-first passage; yaw rotates view; z-only travel; continuous near floor; no strafe'};
setScene();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
