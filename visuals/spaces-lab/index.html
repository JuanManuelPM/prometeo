<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#030604">
<title>Prometeo · Spaces Lab · Green Nave</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020403;color:#d8d0af;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none;touch-action:none}
#app{position:fixed;inset:0;overflow:hidden;background:#020403;isolation:isolate}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:auto}
#veil{position:absolute;z-index:4;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 18%,rgba(0,0,0,.08) 58%,rgba(0,0,0,.42) 100%);box-shadow:inset 0 0 8vw rgba(0,0,0,.42)}
#scan{position:absolute;z-index:5;inset:0;pointer-events:none;opacity:.08;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.022) 0 1px,transparent 1px 4px);mix-blend-mode:screen}
#tag{position:absolute;z-index:8;left:max(10px,env(safe-area-inset-left));top:max(9px,env(safe-area-inset-top));padding:6px 8px;background:rgba(3,5,3,.46);border:1px solid rgba(197,189,130,.09);color:rgba(221,213,173,.54);font:800 7px/1 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;pointer-events:none}
#pad{position:absolute;z-index:10;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));width:142px;height:96px;pointer-events:none;opacity:.74}
#pad button{position:absolute;width:46px;height:46px;border:1px solid rgba(229,220,171,.14);background:rgba(3,5,3,.56);color:rgba(231,221,177,.78);font:900 20px/1 system-ui,sans-serif;display:grid;place-items:center;pointer-events:auto;backdrop-filter:blur(2px)}
#left{left:0;top:25px}#right{right:0;top:25px}#up{left:48px;top:0}#down{left:48px;bottom:0}
#pad button:active{background:rgba(102,116,64,.34);color:#f1e7bf}
#hint{position:absolute;z-index:8;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));max-width:52%;color:rgba(224,215,190,.38);font:800 7px/1.3 system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;pointer-events:none;transition:opacity 1s}
#loading{position:absolute;z-index:20;inset:0;display:grid;place-items:center;background:#020403;color:#777861;font:800 9px/1 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;transition:opacity .34s}
#loading.off{opacity:0;pointer-events:none}
@media(max-height:430px){#tag{top:5px}#pad{transform:scale(.92);transform-origin:bottom right}#hint{font-size:6px}}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="Nave verde de arcos altos y continuos"></canvas>
  <div id="veil"></div><div id="scan"></div>
  <div id="tag">PASO VERDE · NAVE</div>
  <div id="pad" aria-label="Controles táctiles">
    <button id="left" aria-label="Mirar izquierda">‹</button>
    <button id="right" aria-label="Mirar derecha">›</button>
    <button id="up" aria-label="Avanzar">↑</button>
    <button id="down" aria-label="Retroceder">↓</button>
  </div>
  <div id="hint">izq/der = mirar · arriba/abajo = avanzar recto · envolvente continua</div>
  <div id="loading">cargando materiales</div>
</div>
<script>
(function(){
'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
const loading=document.getElementById('loading');
const hint=document.getElementById('hint');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const NEAR=.14;
let W=640,H=360,last=0;
let yaw=0,targetYaw=0,camZ=1.4,targetCamZ=1.4;
let drag=null;
const pointers=new Map();
const assets={};
const atlas={};
const SOURCE_PAGES={
  wall:'https://commons.wikimedia.org/wiki/File:Dark_green_grey_flecked_speckled_spotted_clean_marble_cemented_building_wall_square_checkered_tile_texture.jpg',
  floor:'https://commons.wikimedia.org/wiki/File:Green_mosaic_square_seamless_tiled_floor_texture.jpg',
  ceiling:'https://commons.wikimedia.org/wiki/File:Ceiling_Pattern,_Tomb_of_Qenamun_MET_DT10887.jpg',
  stone:'https://commons.wikimedia.org/wiki/File:Stone_Wall_Texture.jpg'
};
const SOURCES={
  wall:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/Dark_green_grey_flecked_speckled_spotted_clean_marble_cemented_building_wall_square_checkered_tile_texture.jpg/1024px-Dark_green_grey_flecked_speckled_spotted_clean_marble_cemented_building_wall_square_checkered_tile_texture.jpg',
  floor:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Green_mosaic_square_seamless_tiled_floor_texture.jpg/1280px-Green_mosaic_square_seamless_tiled_floor_texture.jpg',
  ceiling:'https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Ceiling_Pattern%2C_Tomb_of_Qenamun_MET_DT10887.jpg/960px-Ceiling_Pattern%2C_Tomb_of_Qenamun_MET_DT10887.jpg',
  stone:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Stone_Wall_Texture.jpg/1280px-Stone_Wall_Texture.jpg'
};
function load(name,url){
  return new Promise(resolve=>{
    const im=new Image();im.decoding='async';
    if(/^https?:/.test(url))im.crossOrigin='anonymous';
    im.onload=()=>{assets[name]=im;resolve(im)};
    im.onerror=()=>{assets[name]=null;resolve(null)};
    im.src=url;
  });
}
function resize(){
  const a=innerWidth/Math.max(1,innerHeight);
  H=360;W=Math.round(H*a);
  if(W>760){W=760;H=Math.round(W/a)}
  if(W<360){W=360;H=Math.round(W/a)}
  canvas.width=W;canvas.height=H;
}
addEventListener('resize',resize,{passive:true});resize();
function cover(g,img,w,h){
  const ir=img.naturalWidth/img.naturalHeight,cr=w/h;
  let sx=0,sy=0,sw=img.naturalWidth,sh=img.naturalHeight;
  if(ir>cr){sw=sh*cr;sx=(img.naturalWidth-sw)*.5}
  else{sh=sw/cr;sy=(img.naturalHeight-sh)*.5}
  g.drawImage(img,sx,sy,sw,sh,0,0,w,h);
}
function grade(name,img,tint,screen){
  if(!img)return null;
  const c=document.createElement('canvas');c.width=384;c.height=384;
  const g=c.getContext('2d');cover(g,img,c.width,c.height);
  g.globalCompositeOperation='multiply';g.fillStyle=tint;g.fillRect(0,0,c.width,c.height);
  g.globalCompositeOperation='screen';g.globalAlpha=.10;g.fillStyle=screen;g.fillRect(0,0,c.width,c.height);
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
  atlas[name]=c;return c;
}
function tileMaterial(name,src,step){
  if(!src)return null;
  const c=document.createElement('canvas');c.width=768;c.height=768;const g=c.getContext('2d');
  const s=step||192,cols=Math.ceil(c.width/s)+1,rows=Math.ceil(c.height/s)+1;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    g.save();g.translate(x*s,y*s);
    if((x+y)&1){g.translate(s,0);g.scale(-1,1)}
    g.drawImage(src,0,0,s,s);g.restore();
  }
  atlas[name]=c;return c;
}
function mixMaterial(name,a,b,alpha){
  if(!a&&!b)return null;
  const c=document.createElement('canvas');c.width=768;c.height=768;const g=c.getContext('2d');
  if(a)g.drawImage(a,0,0,c.width,c.height);
  if(b){g.globalAlpha=alpha;g.globalCompositeOperation='multiply';g.drawImage(b,0,0,c.width,c.height)}
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
  atlas[name]=c;return c;
}
function archPath(g,w,h,x0,x1,shoulder,top){
  const mid=w*.5;
  g.beginPath();g.moveTo(x0,h);g.lineTo(x0,shoulder);
  g.bezierCurveTo(x0,top,mid-w*.19,top,mid,top);
  g.bezierCurveTo(mid+w*.19,top,x1,top,x1,shoulder);
  g.lineTo(x1,h);g.closePath();
}
function buildCrown(img){
  if(!img)return null;
  const c=document.createElement('canvas');c.width=640;c.height=420;const g=c.getContext('2d');
  cover(g,img,c.width,c.height);
  g.globalCompositeOperation='multiply';g.fillStyle='rgba(34,72,29,.88)';g.fillRect(0,0,c.width,c.height);
  g.globalCompositeOperation='screen';g.globalAlpha=.17;g.fillStyle='#d0b457';g.fillRect(0,0,c.width,c.height);
  g.globalAlpha=1;
  g.globalCompositeOperation='destination-in';
  archPath(g,c.width,c.height,6,c.width-6,c.height*.78,c.height*.02);g.fill();
  g.globalCompositeOperation='destination-out';
  archPath(g,c.width,c.height,c.width*.30,c.width*.70,c.height*.76,c.height*.24);g.fill();
  g.clearRect(0,c.height*.77,c.width,c.height*.23);
  g.globalCompositeOperation='source-over';
  atlas.crown=c;return c;
}
function darken(name,src,amount){
  if(!src)return null;
  const c=document.createElement('canvas');c.width=src.width;c.height=src.height;const g=c.getContext('2d');
  g.drawImage(src,0,0);g.globalCompositeOperation='multiply';g.fillStyle='rgba(4,8,4,'+amount+')';g.fillRect(0,0,c.width,c.height);
  g.globalCompositeOperation='source-over';atlas[name]=c;return c;
}
function buildAtlas(){
  grade('wall',assets.wall,'rgba(35,76,30,.97)','#c4a64d');
  grade('floor',assets.floor,'rgba(32,64,30,.90)','#d0b65b');
  grade('ceiling',assets.ceiling,'rgba(29,55,27,.94)','#8e7c42');
  grade('stone',assets.stone,'rgba(39,76,33,.96)','#c2a44f');
  tileMaterial('wallField',atlas.wall,160);
  tileMaterial('floorTile',atlas.floor,118);
  tileMaterial('stoneTile',atlas.stone,138);
  tileMaterial('ceilingField',atlas.ceiling,176);
  mixMaterial('floorField',atlas.floorTile,atlas.stoneTile,.44);
  mixMaterial('wallMass',atlas.wallField,atlas.stoneTile,.28);
  buildCrown(assets.wall||assets.stone);
  darken('shadow',atlas.wallMass||atlas.wall,.72);
  darken('far',atlas.stoneTile||atlas.stone,.84);
  loading.classList.add('off');
}
Promise.all(Object.entries(SOURCES).map(([n,u])=>load(n,u))).then(buildAtlas);
function texTri(img,p0,p1,p2,uv0,uv1,uv2,alpha){
  if(!img)return;
  const den=uv0.x*(uv1.y-uv2.y)+uv1.x*(uv2.y-uv0.y)+uv2.x*(uv0.y-uv1.y);
  if(Math.abs(den)<.001)return;
  const a=(p0.x*(uv1.y-uv2.y)+p1.x*(uv2.y-uv0.y)+p2.x*(uv0.y-uv1.y))/den;
  const c=(p0.x*(uv2.x-uv1.x)+p1.x*(uv0.x-uv2.x)+p2.x*(uv1.x-uv0.x))/den;
  const e=(p0.x*(uv1.x*uv2.y-uv2.x*uv1.y)+p1.x*(uv2.x*uv0.y-uv0.x*uv2.y)+p2.x*(uv0.x*uv1.y-uv1.x*uv0.y))/den;
  const b=(p0.y*(uv1.y-uv2.y)+p1.y*(uv2.y-uv0.y)+p2.y*(uv0.y-uv1.y))/den;
  const d=(p0.y*(uv2.x-uv1.x)+p1.y*(uv0.x-uv2.x)+p2.y*(uv1.x-uv0.x))/den;
  const f=(p0.y*(uv1.x*uv2.y-uv2.x*uv1.y)+p1.y*(uv2.x*uv0.y-uv0.x*uv2.y)+p2.y*(uv0.x*uv1.y-uv1.x*uv0.y))/den;
  ctx.save();ctx.globalAlpha=alpha;ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.closePath();ctx.clip();
  ctx.setTransform(a,b,c,d,e,f);ctx.drawImage(img,0,0);ctx.restore();
}
function cameraVertex(v){
  const dz=v.z-camZ,cs=Math.cos(yaw),sn=Math.sin(yaw);
  return{x:v.x*cs-dz*sn,y:v.y,z:v.x*sn+dz*cs,u:v.u,v:v.v};
}
function clipNear(poly){
  const out=[];
  for(let i=0;i<poly.length;i++){
    const a=poly[i],b=poly[(i+1)%poly.length],ain=a.z>=NEAR,bin=b.z>=NEAR;
    if(ain)out.push(a);
    if(ain!==bin){
      const t=(NEAR-a.z)/(b.z-a.z);
      out.push({x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t),z:NEAR,u:lerp(a.u,b.u,t),v:lerp(a.v,b.v,t)});
    }
  }
  return out;
}
function projectCam(p){const f=218/p.z;return{x:W*.5+p.x*f,y:H*.56-p.y*f,z:p.z,f};}
function worldQuad(img,pts,alpha){
  if(!img)return;
  const iw=img.width,ih=img.height;
  let poly=pts.map((p,i)=>cameraVertex({x:p.x,y:p.y,z:p.z,u:(i===1||i===2)?iw:0,v:(i>=2)?ih:0}));
  poly=clipNear(poly);if(poly.length<3)return;
  const pp=poly.map(projectCam);
  for(let i=1;i<poly.length-1;i++)texTri(img,pp[0],pp[i],pp[i+1],{x:poly[0].u,y:poly[0].v},{x:poly[i].u,y:poly[i].v},{x:poly[i+1].u,y:poly[i+1].v},alpha);
}
function worldBox(img,x0,x1,y0,y1,z0,z1,alpha){
  if(!img)return;
  const faces=[
    [{x:x0,y:y1,z:z1},{x:x1,y:y1,z:z1},{x:x1,y:y0,z:z1},{x:x0,y:y0,z:z1}],
    [{x:x1,y:y1,z:z0},{x:x0,y:y1,z:z0},{x:x0,y:y0,z:z0},{x:x1,y:y0,z:z0}],
    [{x:x0,y:y1,z:z0},{x:x0,y:y1,z:z1},{x:x0,y:y0,z:z1},{x:x0,y:y0,z:z0}],
    [{x:x1,y:y1,z:z1},{x:x1,y:y1,z:z0},{x:x1,y:y0,z:z0},{x:x1,y:y0,z:z1}],
    [{x:x0,y:y1,z:z0},{x:x1,y:y1,z:z0},{x:x1,y:y1,z:z1},{x:x0,y:y1,z:z1}]
  ];
  for(const face of faces)worldQuad(img,face,alpha);
}
function depthAlpha(d){return clamp(1-d/104,.20,.98)}
function baseFill(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#071008');g.addColorStop(.52,'#0a130a');g.addColorStop(1,'#020403');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function renderPassage(){
  baseFill();
  const halfW=4.90,floorY=-1.58,ceilY=6.78,shoulderY=2.48,innerHalf=2.05;
  const zNear=camZ-22,zFar=camZ+98;
  const wallTex=atlas.wallMass||atlas.wallField||atlas.wall;
  const floorTex=atlas.floorField||atlas.floorTile||atlas.floor;
  const ceilTex=atlas.ceilingField||atlas.ceiling;
  const ribTex=atlas.stoneTile||atlas.stone||wallTex;
  const shadowTex=atlas.shadow||wallTex;
  const farTex=atlas.far||shadowTex;

  worldQuad(ceilTex,[
    {x:-halfW,y:ceilY,z:zNear},{x:halfW,y:ceilY,z:zNear},
    {x:halfW,y:ceilY,z:zFar},{x:-halfW,y:ceilY,z:zFar}
  ],.96);
  worldQuad(floorTex,[
    {x:-halfW,y:floorY,z:zFar},{x:halfW,y:floorY,z:zFar},
    {x:halfW,y:floorY,z:zNear},{x:-halfW,y:floorY,z:zNear}
  ],1);
  worldQuad(wallTex,[
    {x:-halfW,y:ceilY,z:zNear},{x:-halfW,y:ceilY,z:zFar},
    {x:-halfW,y:floorY,z:zFar},{x:-halfW,y:floorY,z:zNear}
  ],1);
  worldQuad(wallTex,[
    {x:halfW,y:ceilY,z:zFar},{x:halfW,y:ceilY,z:zNear},
    {x:halfW,y:floorY,z:zNear},{x:halfW,y:floorY,z:zFar}
  ],1);

  worldQuad(ribTex,[
    {x:-halfW+.035,y:floorY+.82,z:zNear},{x:-halfW+.035,y:floorY+.82,z:zFar},
    {x:-halfW+.035,y:floorY,z:zFar},{x:-halfW+.035,y:floorY,z:zNear}
  ],.90);
  worldQuad(ribTex,[
    {x:halfW-.035,y:floorY+.82,z:zFar},{x:halfW-.035,y:floorY+.82,z:zNear},
    {x:halfW-.035,y:floorY,z:zNear},{x:halfW-.035,y:floorY,z:zFar}
  ],.90);

  worldQuad(farTex,[
    {x:-halfW,y:ceilY,z:zFar},{x:halfW,y:ceilY,z:zFar},
    {x:halfW,y:floorY,z:zFar},{x:-halfW,y:floorY,z:zFar}
  ],.84);

  const bay=5.45,thick=.72;
  const first=Math.floor((camZ-4)/bay)*bay;
  const ribs=[];
  for(let i=0;i<24;i++){
    const z=first+i*bay;
    if(z<camZ-5||z>zFar-2)continue;
    ribs.push({z,depth:z-camZ,index:Math.floor(z/bay)});
  }
  ribs.sort((a,b)=>b.depth-a.depth);

  for(const r of ribs){
    const a=depthAlpha(r.depth);
    const z0=r.z-thick*.5,z1=r.z+thick*.5;

    worldBox(shadowTex,-halfW+.12,-innerHalf-.03,floorY,shoulderY,z0+.22,z1+.26,a*.42);
    worldBox(shadowTex,innerHalf+.03,halfW-.12,floorY,shoulderY,z0+.22,z1+.26,a*.42);

    worldBox(ribTex,-halfW+.10,-innerHalf,floorY,shoulderY,z0,z1,a*.98);
    worldBox(ribTex,innerHalf,halfW-.10,floorY,shoulderY,z0,z1,a*.98);

    worldBox(shadowTex,-innerHalf-.08,-innerHalf+.12,floorY+.08,shoulderY-.04,z0-.03,z1+.12,a*.68);
    worldBox(shadowTex,innerHalf-.12,innerHalf+.08,floorY+.08,shoulderY-.04,z0-.03,z1+.12,a*.68);

    if(atlas.crown){
      worldQuad(atlas.crown,[
        {x:-halfW+.04,y:ceilY+.08,z:z1+.08},{x:halfW-.04,y:ceilY+.08,z:z1+.08},
        {x:halfW-.04,y:shoulderY-.02,z:z1+.08},{x:-halfW+.04,y:shoulderY-.02,z:z1+.08}
      ],a*.46);
      worldQuad(atlas.crown,[
        {x:-halfW+.04,y:ceilY+.08,z:z0},{x:halfW-.04,y:ceilY+.08,z:z0},
        {x:halfW-.04,y:shoulderY-.02,z:z0},{x:-halfW+.04,y:shoulderY-.02,z:z0}
      ],a*.98);
    }

    worldBox(ribTex,-halfW+.16,halfW-.16,ceilY-.34,ceilY+.08,z0,z1,a*.74);
  }

  worldQuad(ribTex,[
    {x:-1.32,y:floorY+.014,z:zFar},{x:1.32,y:floorY+.014,z:zFar},
    {x:1.32,y:floorY+.014,z:zNear},{x:-1.32,y:floorY+.014,z:zNear}
  ],.22);

  const relicStep=27;
  const seed=Math.floor(camZ/relicStep);
  for(let j=1;j<4;j++){
    const rz=(seed+j)*relicStep+8,side=((seed+j)&1)?1:-1;
    if(rz<camZ+7||rz>zFar-7)continue;
    const a=depthAlpha(rz-camZ);
    const x=side*(innerHalf+.70);
    worldBox(ribTex,x-.18,x+.18,floorY,floorY+1.20,rz-.18,rz+.18,a*.54);
  }

  const p=projectCam({x:0,y:1.95,z:camZ+78});
  const glow=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,Math.max(34,W*.14));
  glow.addColorStop(0,'rgba(0,0,0,.30)');
  glow.addColorStop(.44,'rgba(0,0,0,.14)');
  glow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
}
function analog(){
  ctx.save();ctx.globalAlpha=.028;ctx.globalCompositeOperation='screen';
  for(let i=0;i<22;i++){
    const x=(i*97+(last|0)*.010)%W,y=(i*47+(last|0)*.006)%H;
    ctx.fillStyle=i%3?'#b39d56':'#5f774e';ctx.fillRect(x,y,1,1);
  }
  ctx.restore();
}
function render(){ctx.setTransform(1,0,0,1,0,0);renderPassage();analog();}
function update(dt){
  const k=Math.min(1,dt*.014);
  yaw=lerp(yaw,targetYaw,k);camZ=lerp(camZ,targetCamZ,k);
}
function frame(t){
  requestAnimationFrame(frame);
  if(document.hidden||t-last<28)return;
  const dt=Math.min(50,t-last||16);last=t;update(dt);render();
}
function point(e){
  const r=canvas.getBoundingClientRect();
  return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};
}
canvas.addEventListener('pointerdown',e=>{
  const p=point(e);pointers.set(e.pointerId,p);canvas.setPointerCapture(e.pointerId);
  if(pointers.size===1)drag={id:e.pointerId,x:p.x,y:p.y,yaw:targetYaw,z:targetCamZ};
  e.preventDefault();
});
canvas.addEventListener('pointermove',e=>{
  if(!drag||drag.id!==e.pointerId)return;
  const p=point(e);pointers.set(e.pointerId,p);
  targetYaw=clamp(drag.yaw+(p.x-drag.x)/W*1.18,-.68,.68);
  targetCamZ=clamp(drag.z-(p.y-drag.y)/H*22,-5,112);
  e.preventDefault();
});
function end(e){pointers.delete(e.pointerId);if(drag&&drag.id===e.pointerId)drag=null;}
canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
const held=new Map();
function nudge(kind,amount){
  if(kind==='left')targetYaw=clamp(targetYaw-amount,-.68,.68);
  if(kind==='right')targetYaw=clamp(targetYaw+amount,-.68,.68);
  if(kind==='up')targetCamZ=clamp(targetCamZ+amount*9,-5,112);
  if(kind==='down')targetCamZ=clamp(targetCamZ-amount*9,-5,112);
  hint.style.opacity='.20';
}
['left','right','up','down'].forEach(id=>{
  const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();nudge(id,.13);
    const timer=setInterval(()=>nudge(id,.052),60);held.set(e.pointerId,timer);b.setPointerCapture(e.pointerId);
  });
  const stop=e=>{const t=held.get(e.pointerId);if(t)clearInterval(t);held.delete(e.pointerId);};
  b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);
});
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')nudge('left',.10);
  else if(e.key==='ArrowRight'||e.key==='d')nudge('right',.10);
  else if(e.key==='ArrowUp'||e.key==='w')nudge('up',.12);
  else if(e.key==='ArrowDown'||e.key==='s')nudge('down',.12);
});
setTimeout(()=>hint.style.opacity='.20',1800);
window.PrometeoSpaces={
  version:'spaces-green-nave-v7',
  contract:'left/right = yaw; up/down = z-only travel; continuous textured envelope; tall repeated volumetric ribs; central darkness only; no strafe; no fisheye',
  referenceMechanism:'tall green nave + repeated arch ribs + textured side envelope + floor-led depth + central dark throat',
  sourcePages:SOURCE_PAGES,
  camera:{get yaw(){return targetYaw},get z(){return targetCamZ}}
};
requestAnimationFrame(frame);
})();
