<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#030604">
<title>Prometeo · Spaces Lab</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020403;color:#d8d0af;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none;touch-action:none}
#app{position:fixed;inset:0;overflow:hidden;background:#020403;isolation:isolate}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:auto}
#veil{position:absolute;z-index:4;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 22%,rgba(0,0,0,.05) 64%,rgba(0,0,0,.34) 100%);box-shadow:inset 0 0 7vw rgba(0,0,0,.34)}
#scan{position:absolute;z-index:5;inset:0;pointer-events:none;opacity:.07;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.02) 0 1px,transparent 1px 4px);mix-blend-mode:screen}
#tag{position:absolute;z-index:8;left:max(10px,env(safe-area-inset-left));top:max(9px,env(safe-area-inset-top));padding:6px 8px;background:rgba(3,5,3,.42);border:1px solid rgba(197,189,130,.08);color:rgba(221,213,173,.54);font:800 7px/1 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;pointer-events:none}
#maps{position:absolute;z-index:11;top:max(9px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:5px;width:min(92vw,620px);max-width:none;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:none;padding:0 10px 4px;touch-action:pan-x;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;scroll-snap-type:x proximity}#maps::-webkit-scrollbar{display:none}
#maps button{height:29px;padding:0 9px;border:1px solid rgba(235,226,181,.13);background:rgba(4,5,6,.58);color:rgba(235,226,181,.56);font:900 8px/1 system-ui;letter-spacing:.11em;text-transform:uppercase;backdrop-filter:blur(3px);touch-action:pan-x;-webkit-user-select:none;user-select:none;flex:0 0 auto;scroll-snap-align:center}
#maps button.active{color:#f0e5bc;border-color:rgba(231,215,151,.35);background:rgba(55,68,37,.52)}
#pad{position:absolute;z-index:10;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));width:58px;height:106px;pointer-events:none;opacity:.76}
#pad button{position:absolute;left:0;width:58px;height:50px;border:1px solid rgba(229,220,171,.14);background:rgba(3,5,3,.58);color:rgba(231,221,177,.80);font:900 20px/1 system-ui,sans-serif;display:grid;place-items:center;pointer-events:auto;backdrop-filter:blur(2px);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#up{top:0}#down{bottom:0}
#pad button:active{background:rgba(102,116,64,.34);color:#f1e7bf}
#hint{position:absolute;z-index:8;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));max-width:62%;color:rgba(224,215,190,.34);font:800 7px/1.3 system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;pointer-events:none;transition:opacity 1s}
#loading{position:absolute;z-index:20;inset:0;display:grid;place-items:center;background:#020403;color:#777861;font:800 9px/1 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;transition:opacity .34s}
#loading.off{opacity:0;pointer-events:none}
@media(max-width:520px){#maps{top:44px;width:calc(100vw - 14px);padding-left:8px;padding-right:8px}#maps button{height:30px;padding:0 10px;font-size:7px}}
@media(max-height:430px){#tag{top:5px}#maps{top:5px}#pad{transform:scale(.92);transform-origin:bottom right}#hint{font-size:6px}}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="Espacios pseudo-3D monumentales"></canvas>
  <div id="veil"></div><div id="scan"></div>
  <div id="tag">MAPA 1 · NAVE ALTA</div>
  <div id="maps" aria-label="Mapas">
    <button id="map1" class="active">1 ARCOS</button>
    <button id="map2">2 CILINDROS</button>
    <button id="map3">3 CALZADA</button>
    <button id="map4">4 TÚNEL</button>
    <button id="map5">5 TEMPLO</button>
  </div>
  <div id="pad" aria-label="Caminar">
    <button id="up" aria-label="Avanzar">↑</button>
    <button id="down" aria-label="Retroceder">↓</button>
  </div>
  <div id="hint">deslizá ↑/↓, W/S o scroll = avanzar/retroceder · A/D = lateral · vista frontal fija</div>
  <div id="loading">cargando materiales</div>
</div>
<script>
(function(){
'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
const loading=document.getElementById('loading');
const hint=document.getElementById('hint');
const tag=document.getElementById('tag');
const mapsBar=document.getElementById('maps');
const mapButtons=Array.from(document.querySelectorAll('#maps button'));
let mapStripDrag=null,mapStripSuppressClickUntil=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const NEAR=.14;
let W=640,H=360,last=0;
let camX=0,targetCamX=0,camZ=1.4,targetCamZ=1.4,currentMap=1;
const ritualSigns=new Map();
const assets={};
const atlas={};
const SOURCE_PAGES={
  wall:'https://commons.wikimedia.org/wiki/File:Dark_green_grey_flecked_speckled_spotted_clean_marble_cemented_building_wall_square_checkered_tile_texture.jpg',
  floor:'https://commons.wikimedia.org/wiki/File:Green_mosaic_square_seamless_tiled_floor_texture.jpg',
  ceiling:'https://commons.wikimedia.org/wiki/File:Ceiling_Pattern,_Tomb_of_Qenamun_MET_DT10887.jpg',
  stone:'https://commons.wikimedia.org/wiki/File:Stone_Wall_Texture.jpg'
};
const SOURCES={
  wall:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/Dark_green_grey_flecked_speckled_spotted_clean_marble_cemented_building_wall_square_checkered_tile_texture.jpg/1024px-Dark_green_grey_flecked_speckled_spotted_clean_marble_cemented_building_wall_square_checkered_tile_texture.jpg',
  floor:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Green_mosaic_square_seamless_tiled_floor_texture.jpg/1280px-Green_mosaic_square_seamless_tiled_floor_texture.jpg',
  ceiling:'https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Ceiling_Pattern%2C_Tomb_of_Qenamun_MET_DT10887.jpg/960px-Ceiling_Pattern%2C_Tomb_of_Qenamun_MET_DT10887.jpg',
  stone:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Stone_Wall_Texture.jpg/1280px-Stone_Wall_Texture.jpg'
};
function load(name,url){
  return new Promise(resolve=>{
    const im=new Image();im.decoding='async';
    if(/^https?:/.test(url))im.crossOrigin='anonymous';
    im.onload=()=>{assets[name]=im;resolve(im)};
    im.onerror=()=>{assets[name]=null;resolve(null)};
    im.src=url;
  });
}
function resize(){
  const a=innerWidth/Math.max(1,innerHeight);
  H=360;W=Math.round(H*a);
  if(W>760){W=760;H=Math.round(W/a)}
  if(W<360){W=360;H=Math.round(W/a)}
  canvas.width=W;canvas.height=H;
}
addEventListener('resize',resize,{passive:true});resize();
function cover(g,img,w,h){
  const ir=img.naturalWidth/img.naturalHeight,cr=w/h;
  let sx=0,sy=0,sw=img.naturalWidth,sh=img.naturalHeight;
  if(ir>cr){sw=sh*cr;sx=(img.naturalWidth-sw)*.5}
  else{sh=sw/cr;sy=(img.naturalHeight-sh)*.5}
  g.drawImage(img,sx,sy,sw,sh,0,0,w,h);
}
function grade(name,img,tint,screen){
  if(!img)return null;
  const c=document.createElement('canvas');c.width=384;c.height=384;
  const g=c.getContext('2d');cover(g,img,c.width,c.height);
  g.globalCompositeOperation='multiply';g.fillStyle=tint;g.fillRect(0,0,c.width,c.height);
  g.globalCompositeOperation='screen';g.globalAlpha=.10;g.fillStyle=screen;g.fillRect(0,0,c.width,c.height);
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
  atlas[name]=c;return c;
}
function tileMaterial(name,src,step){
  if(!src)return null;
  const c=document.createElement('canvas');c.width=768;c.height=768;const g=c.getContext('2d');
  const s=step||192,cols=Math.ceil(c.width/s)+1,rows=Math.ceil(c.height/s)+1;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    g.save();g.translate(x*s,y*s);
    if((x+y)&1){g.translate(s,0);g.scale(-1,1)}
    g.drawImage(src,0,0,s,s);g.restore();
  }
  atlas[name]=c;return c;
}
function mixMaterial(name,a,b,alpha){
  if(!a&&!b)return null;
  const c=document.createElement('canvas');c.width=768;c.height=768;const g=c.getContext('2d');
  if(a)g.drawImage(a,0,0,c.width,c.height);
  if(b){g.globalAlpha=alpha;g.globalCompositeOperation='multiply';g.drawImage(b,0,0,c.width,c.height)}
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
  atlas[name]=c;return c;
}
function archPath(g,w,h,x0,x1,shoulder,top){
  const mid=w*.5;
  g.beginPath();g.moveTo(x0,h);g.lineTo(x0,shoulder);
  g.bezierCurveTo(x0,top,mid-w*.20,top,mid,top);
  g.bezierCurveTo(mid+w*.20,top,x1,top,x1,shoulder);
  g.lineTo(x1,h);g.closePath();
}
function buildCrown(img){
  if(!img)return null;
  const c=document.createElement('canvas');c.width=720;c.height=520;const g=c.getContext('2d');
  cover(g,img,c.width,c.height);
  g.globalCompositeOperation='multiply';g.fillStyle='rgba(31,75,28,.90)';g.fillRect(0,0,c.width,c.height);
  g.globalCompositeOperation='screen';g.globalAlpha=.15;g.fillStyle='#d0b457';g.fillRect(0,0,c.width,c.height);
  g.globalAlpha=1;
  g.globalCompositeOperation='destination-in';
  archPath(g,c.width,c.height,4,c.width-4,c.height*.80,c.height*.01);g.fill();
  g.globalCompositeOperation='destination-out';
  archPath(g,c.width,c.height,c.width*.235,c.width*.765,c.height*.77,c.height*.18);g.fill();
  g.clearRect(0,c.height*.80,c.width,c.height*.20);
  g.globalCompositeOperation='source-over';
  atlas.crown=c;return c;
}
function buildArchBacking(img){
  if(!img)return null;
  const c=document.createElement('canvas');c.width=720;c.height=520;
  const g=c.getContext('2d');
  cover(g,img,c.width,c.height);
  g.globalCompositeOperation='multiply';
  g.fillStyle='rgba(25,58,24,.94)';
  g.fillRect(0,0,c.width,c.height);
  g.globalCompositeOperation='screen';
  g.globalAlpha=.07;
  g.fillStyle='#8f8247';
  g.fillRect(0,0,c.width,c.height);
  g.globalAlpha=1;
  // Cut the walkable opening out of the backing wall. The structural arch is drawn later,
  // in front of this plane, so the wall reads as architecture behind the figure.
  g.globalCompositeOperation='destination-out';
  archPath(g,c.width,c.height,c.width*.235,c.width*.765,c.height*.77,c.height*.18);
  g.fill();
  g.globalCompositeOperation='source-over';
  atlas.archBacking=c;
  return c;
}
function darken(name,src,amount){
  if(!src)return null;
  const c=document.createElement('canvas');c.width=src.width;c.height=src.height;const g=c.getContext('2d');
  g.drawImage(src,0,0);g.globalCompositeOperation='multiply';g.fillStyle='rgba(4,8,4,'+amount+')';g.fillRect(0,0,c.width,c.height);
  g.globalCompositeOperation='source-over';atlas[name]=c;return c;
}
function buildAtlas(){
  grade('wall',assets.wall,'rgba(35,76,30,.97)','#c4a64d');
  grade('floor',assets.floor,'rgba(32,64,30,.90)','#d0b65b');
  grade('ceiling',assets.ceiling,'rgba(29,55,27,.94)','#8e7c42');
  grade('stone',assets.stone,'rgba(39,76,33,.96)','#c2a44f');
  grade('tunnel',assets.stone,'rgba(111,79,43,.96)','#d1b17d');
  tileMaterial('wallField',atlas.wall,160);
  tileMaterial('floorTile',atlas.floor,118);
  tileMaterial('stoneTile',atlas.stone,138);
  tileMaterial('tunnelTile',atlas.tunnel,132);
  mixMaterial('floorField',atlas.floorTile,atlas.stoneTile,.48);
  mixMaterial('wallMass',atlas.wallField,atlas.stoneTile,.30);
  buildCrown(assets.wall||assets.stone);
  buildArchBacking(assets.wall||assets.stone);
  darken('shadow',atlas.wallMass||atlas.wall,.76);
  darken('far',atlas.stoneTile||atlas.stone,.88);
  loading.classList.add('off');
}
Promise.all(Object.entries(SOURCES).map(([n,u])=>load(n,u))).then(buildAtlas);
function texTri(img,p0,p1,p2,uv0,uv1,uv2,alpha){
  if(!img)return;
  const den=uv0.x*(uv1.y-uv2.y)+uv1.x*(uv2.y-uv0.y)+uv2.x*(uv0.y-uv1.y);
  if(Math.abs(den)<.001)return;
  const a=(p0.x*(uv1.y-uv2.y)+p1.x*(uv2.y-uv0.y)+p2.x*(uv0.y-uv1.y))/den;
  const c=(p0.x*(uv2.x-uv1.x)+p1.x*(uv0.x-uv2.x)+p2.x*(uv1.x-uv0.x))/den;
  const e=(p0.x*(uv1.x*uv2.y-uv2.x*uv1.y)+p1.x*(uv2.x*uv0.y-uv0.x*uv2.y)+p2.x*(uv0.x*uv1.y-uv1.x*uv0.y))/den;
  const b=(p0.y*(uv1.y-uv2.y)+p1.y*(uv2.y-uv0.y)+p2.y*(uv0.y-uv1.y))/den;
  const d=(p0.y*(uv2.x-uv1.x)+p1.y*(uv0.x-uv2.x)+p2.y*(uv1.x-uv0.x))/den;
  const f=(p0.y*(uv1.x*uv2.y-uv2.x*uv1.y)+p1.y*(uv2.x*uv0.y-uv0.x*uv2.y)+p2.y*(uv0.x*uv1.y-uv1.x*uv0.y))/den;
  ctx.save();ctx.globalAlpha=alpha;ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.closePath();ctx.clip();
  ctx.setTransform(a,b,c,d,e,f);ctx.drawImage(img,0,0);ctx.restore();
}
function cameraVertex(v){return{x:v.x-camX,y:v.y,z:v.z-camZ,u:v.u,v:v.v};}
function clipNear(poly){
  const out=[];
  for(let i=0;i<poly.length;i++){
    const a=poly[i],b=poly[(i+1)%poly.length],ain=a.z>=NEAR,bin=b.z>=NEAR;
    if(ain)out.push(a);
    if(ain!==bin){
      const t=(NEAR-a.z)/(b.z-a.z);
      out.push({x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t),z:NEAR,u:lerp(a.u,b.u,t),v:lerp(a.v,b.v,t)});
    }
  }
  return out;
}
function projectCam(p){const f=220/p.z;return{x:W*.5+p.x*f,y:H*.555-p.y*f,z:p.z,f};}
function worldQuad(img,pts,alpha){
  if(!img)return;
  const iw=img.width,ih=img.height;
  let poly=pts.map((p,i)=>cameraVertex({x:p.x,y:p.y,z:p.z,u:(i===1||i===2)?iw:0,v:(i>=2)?ih:0}));
  poly=clipNear(poly);if(poly.length<3)return;
  const pp=poly.map(projectCam);
  for(let i=1;i<poly.length-1;i++)texTri(img,pp[0],pp[i],pp[i+1],{x:poly[0].u,y:poly[0].v},{x:poly[i].u,y:poly[i].v},{x:poly[i+1].u,y:poly[i+1].v},alpha);
}
function worldSolidQuad(color,pts,alpha){
  let poly=pts.map(p=>cameraVertex({x:p.x,y:p.y,z:p.z,u:0,v:0}));
  poly=clipNear(poly);if(poly.length<3)return;
  const pp=poly.map(projectCam);
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(pp[0].x,pp[0].y);
  for(let i=1;i<pp.length;i++)ctx.lineTo(pp[i].x,pp[i].y);
  ctx.closePath();ctx.fill();
  ctx.restore();
}
function worldSolidPoly(color,pts,alpha){
  let poly=pts.map(p=>cameraVertex({x:p.x,y:p.y,z:p.z,u:0,v:0}));
  poly=clipNear(poly);if(poly.length<3)return;
  const pp=poly.map(projectCam);
  ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;
  ctx.beginPath();ctx.moveTo(pp[0].x,pp[0].y);
  for(let i=1;i<pp.length;i++)ctx.lineTo(pp[i].x,pp[i].y);
  ctx.closePath();ctx.fill();ctx.restore();
}
function chamferPier(img,side,outerX,innerFloor,innerTop,y0,y1,z0,z1,alpha){
  const s=side<0?-1:1,outer=s*outerX,foot=s*innerFloor,top=s*innerTop;
  worldQuad(img,[{x:outer,y:y1,z:z0},{x:top,y:y1,z:z0},{x:foot,y:y0,z:z0},{x:outer,y:y0,z:z0}],alpha);
  worldQuad(img,[{x:top,y:y1,z:z1},{x:outer,y:y1,z:z1},{x:outer,y:y0,z:z1},{x:foot,y:y0,z:z1}],alpha*.72);
  worldQuad(img,[{x:top,y:y1,z:z1},{x:top,y:y1,z:z0},{x:foot,y:y0,z:z0},{x:foot,y:y0,z:z1}],alpha*.88);
  worldQuad(img,[{x:outer,y:y1,z:z0},{x:outer,y:y1,z:z1},{x:top,y:y1,z:z1},{x:top,y:y1,z:z0}],alpha*.68);
}
function renderCylinderSolid(cx,cz,r,y0,y1){
  const faces=[],n=28,slices=12;
  for(let i=0;i<n;i++){
    const a0=(i/n)*Math.PI*2,a1=((i+1)/n)*Math.PI*2;
    const x0=cx+Math.cos(a0)*r,z0=cz+Math.sin(a0)*r;
    const x1=cx+Math.cos(a1)*r,z1=cz+Math.sin(a1)*r;
    const mid=(a0+a1)*.5;

    for(let s=0;s<slices;s++){
      // More samples near the base. Equal-height slices made the first visible
      // section inherit the darkness of a point much higher than the player's eye.
      const t0=Math.pow(s/slices,1.78);
      const t1=Math.pow((s+1)/slices,1.78);
      const yy0=lerp(y0,y1,t0),yy1=lerp(y0,y1,t1);

      faces.push({
        z:(z0+z1)*.5,
        y:(yy0+yy1)*.5,
        mid,
        pts:[
          {x:x0,y:yy1,z:z0},{x:x1,y:yy1,z:z1},
          {x:x1,y:yy0,z:z1},{x:x0,y:yy0,z:z0}
        ]
      });
    }
  }

  faces.sort((a,b)=>b.z-a.z || b.y-a.y);

  for(const f of faces){
    const midX=(f.pts[0].x+f.pts[1].x)*.5;
    const midZ=(f.pts[0].z+f.pts[1].z)*.5;

    // Distance to the camera CENTER is the dominant rule.
    const L=cameraLight3DAt(midX,f.y,midZ,32,0,.00035);

    // Curvature only models roundness. It may not override distance enough to
    // turn a genuinely nearby pillar black.
    const curve=.42+.58*Math.max(0,Math.cos(f.mid+.72));
    const shade=L*curve;

    const rr=Math.round(1+150*shade);
    const gg=Math.round(1+72*shade);
    const bb=Math.round(2+198*shade);
    worldSolidQuad('rgb('+rr+','+gg+','+bb+')',f.pts,.998);
  }
}
function depthAlpha(d,max){return clamp(1-d/(max||112),.16,.98)}
function fogAlphaByWorldZ(worldZ,start,end,min){
  const d=worldZ-camZ;
  if(d<=start)return .98;
  if(d>=end)return min;
  return lerp(.98,min,(d-start)/(end-start));
}
function cameraLightAt(worldX,worldZ,reach,cone,ambient){
  return cameraLight3DAt(worldX,0,worldZ,reach,0,ambient);
}
function cameraLight3DAt(worldX,worldY,worldZ,reach,cone,ambient){
  const dx=worldX-camX;
  const dy=worldY; // camera eye is world Y=0
  const dz=worldZ-camZ;

  // One rule only: Euclidean distance from this exact world point to the
  // center of the camera. Closer always means more light.
  const dist=Math.max(.001,Math.hypot(dx,dy,dz));
  const radius=reach||32;
  const radial=1/(1+Math.pow(dist/radius,2.28));

  // Nonlinear falloff preserves a bright near field while sending distant
  // and especially high tower tips almost completely into black.
  const light=Math.pow(radial,1.24);
  const a=ambient==null?.00035:ambient;
  return clamp(a+(1-a)*light,a,1);
}
function renderCameraLitSolidFloor(floorY,zNear,zFar,color){
  const bands=28,cells=12;
  for(let zi=bands-1;zi>=0;zi--){
    const t0=zi/bands,t1=(zi+1)/bands;
    const z0=lerp(zNear,zFar,t0),z1=lerp(zNear,zFar,t1);
    const d0=Math.max(NEAR,z0-camZ),d1=Math.max(NEAR,z1-camZ);
    const w0=visibleHalfWidthAtDepth(d0,1.18),w1=visibleHalfWidthAtDepth(d1,1.18);
    for(let xi=0;xi<cells;xi++){
      const q0=xi/cells,q1=(xi+1)/cells;
      const x00=camX-w0+2*w0*q0,x01=camX-w0+2*w0*q1;
      const x10=camX-w1+2*w1*q0,x11=camX-w1+2*w1*q1;

function renderCameraLitTexturedFloor(img,floorY,zNear,zFar,halfW){

function ritualSignKey(ri,side){return ri+':'+side}
function ritualSignOpen(ri,side){
  const st=ritualSigns.get(ritualSignKey(ri,side));
  return st?st.open:0;
}
function updateRitualSigns(dt){
  if(currentMap!==5)return;
  const step=8.7;
  const first=Math.floor((camZ-step*1.1)/step);
  const active=new Set();

  // The sign is a hinged barrier-like stick. It only drops while the spire is
  // IN FRONT of the player and inside a middle-distance display band.
  // Far away: upright/hidden. Medium distance: drops and shows cardboard sign.
  // Very close: raises again quickly so the player passes without "hitting" it.
  const SHOW_FROM=18.0;
  const RAISE_BEFORE=6.2;

  for(let ri=first-3;ri<=first+5;ri++){
    const z=ri*step+7;
    const dz=z-camZ;

    for(const side of [-1,1]){
      const key=ritualSignKey(ri,side);
      let st=ritualSigns.get(key);
      if(!st){st={open:0,target:0};ritualSigns.set(key,st)}

      const inFront=dz>0;
      const inDisplayBand=inFront && dz<SHOW_FROM && dz>RAISE_BEFORE;
      st.target=inDisplayBand?1:0;

      // Drop deliberately; emergency raise near the player is faster.
      const raisingNear=inFront && dz<=RAISE_BEFORE;
      const rate=st.target?.0105:(raisingNear?.021:.0070);
      st.open+=(st.target-st.open)*(1-Math.exp(-dt*rate));
      if(Math.abs(st.open-st.target)<.001)st.open=st.target;
      active.add(key);
    }
  }

  for(const [key,st] of ritualSigns){
    if(active.has(key))continue;
    st.target=0;
    st.open+=(0-st.open)*(1-Math.exp(-dt*.008));
    if(st.open<.001)ritualSigns.delete(key);
  }
}
function ritualRect(cx,cy,ux,uy,px,py,halfAlong,halfAcross,z){
  return [
    {x:cx+ux*halfAlong+px*halfAcross,y:cy+uy*halfAlong+py*halfAcross,z},
    {x:cx+ux*halfAlong-px*halfAcross,y:cy+uy*halfAlong-py*halfAcross,z},
    {x:cx-ux*halfAlong-px*halfAcross,y:cy-uy*halfAlong-py*halfAcross,z},
    {x:cx-ux*halfAlong+px*halfAcross,y:cy-uy*halfAlong+py*halfAcross,z}
  ];
}
function renderRitualSign(cx,cz,side,open){
  if(open<=.003)return;

  const floorY=-1.5;

  // Hinge sits on the road-facing side of each violet spire.
  const hingeX=cx-side*.98;
  const hingeY=floorY+2.38;
  const frontZ=cz-1.03;

  // 0° = upright against the spire. ~82° = fallen inward toward the road.
  const angle=t*(Math.PI*.455);
  const ux=-side*Math.sin(angle);
  const uy=Math.cos(angle);
  const px=-uy;
  const py=ux;

  const poleLen=5.15;
  const poleCenterX=hingeX+ux*poleLen*.5;
  const poleCenterY=hingeY+uy*poleLen*.5;
  const poleL=cameraLight3DAt(poleCenterX,poleCenterY,frontZ,48,0,.0012);

  // Cardboard sign fixed near the free end of the falling stick.
  const cardCenterX=hingeX+ux*3.78;

  const cardL=cameraLight3DAt(cardCenterX,cardCenterY,frontZ-.02,50,0,.0015);

  worldSolidPoly(litColor([183,132,72],cardL,1),
    ritualRect(cardCenterX,cardCenterY,ux,uy,px,py,1.43,.81,frontZ-.030),1);

  // Crude painted mark so it reads as a physical sign, not a flat blank rectangle.
  const markCenterX=cardCenterX+uy*.02;

  worldSolidPoly(litColor([73,40,91],cardL,.96),

  worldSolidQuad(litColor(rgb,L,.62),[
    {x:cx-w*.5,y:y1,z:back},{x:cx-w*.5,y:y1,z:front},
    {x:cx-w*.5,y:y0,z:front},{x:cx-w*.5,y:y0,z:back}
  ],1);
  worldSolidQuad(litColor(rgb,L,.50),[
    {x:cx+w*.5,y:y1,z:front},{x:cx+w*.5,y:y1,z:back},
    {x:cx+w*.5,y:y0,z:back},{x:cx+w*.5,y:y0,z:front}
  ],1);
  worldSolidQuad(litColor(rgb,L,.78),[
    {x:cx-w*.5,y:y1,z:back},{x:cx+w*.5,y:y1,z:back},
    {x:cx+w*.5,y:y1,z:front},{x:cx-w*.5,y:y1,z:front}
  ],1);
}
function renderMap5(){
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#f13706');
  sky.addColorStop(.50,'#f27b05');
  sky.addColorStop(.72,'#cf7110');
  sky.addColorStop(1,'#1d1028');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  const floorY=-1.5,zNear=camZ+NEAR+.03,zFar=camZ+166;
  const roadHalf=6.2,bands=28,stripes=14;

  for(let zi=bands-1;zi>=0;zi--){
    const z0=lerp(zNear,zFar,zi/bands),z1=lerp(zNear,zFar,(zi+1)/bands);
    const d0=Math.max(NEAR,z0-camZ),d1=Math.max(NEAR,z1-camZ);
    const w0=visibleHalfWidthAtDepth(d0,1.18),w1=visibleHalfWidthAtDepth(d1,1.18);
    const midZ=(z0+z1)*.5;
    const groundL=cameraLight3DAt(0,floorY,midZ,54,0,.003);
    worldSolidQuad(litColor([82,42,72],groundL,.72),[
      {x:camX-w1,y:floorY,z:z1},{x:camX+w1,y:floorY,z:z1},
      {x:camX+w0,y:floorY,z:z0},{x:camX-w0,y:floorY,z:z0}
    ],1);

    for(let si=0;si<stripes;si++){
      const x0=-roadHalf+(2*roadHalf)*(si/stripes);
      const x1=-roadHalf+(2*roadHalf)*((si+1)/stripes);
      const L=cameraLight3DAt((x0+x1)*.5,floorY,midZ,58,0,.004);
      const rgb=(si&1)?[56,38,104]:[127,87,145];
      worldSolidQuad(litColor(rgb,L,1),[
        {x:x0,y:floorY+.014,z:z1},{x:x1,y:floorY+.014,z:z1},
        {x:x1,y:floorY+.014,z:z0},{x:x0,y:floorY+.014,z:z0}
      ],1);
    }
  }

  // Monumental stepped destination, fixed in world space so it approaches as the player walks.
  // It is farthest, so it renders before the nearer repeated spires.
  const tz=154;
  renderTempleBlock(0,tz,27,9,-1.48,2.8,[188,120,24],145);
  renderTempleBlock(0,tz-1.0,20,7,3.0,6.4,[205,139,31],145);
  renderTempleBlock(0,tz-1.8,12,5,6.8,9.8,[221,158,43],145);
  renderTempleBlock(0,tz-2.5,5.2,3.2,12.0,14.1,[219,153,35],145);

  const step=8.7,first=Math.floor((camZ-step*1.0)/step);
  const spires=[];
  for(let ri=first;ri<first+20;ri++)spires.push({ri,z:ri*step+7});
  spires.sort((a,b)=>b.z-a.z);
  for(const p of spires){
    if(p.z-camZ<NEAR-2)continue;
    const h=10.5+((p.ri&3)===0?3.2:0);
    renderRitualSign(-9.2,p.z,-1,ritualSignOpen(p.ri,-1));
    renderObelisk(-9.2,p.z,2.0,5.1,h,[116,63,83]);
    renderRitualSign( 9.2,p.z, 1,ritualSignOpen(p.ri, 1));
    renderObelisk( 9.2,p.z,2.0,5.1,h,[116,63,83]);
  }

  const sunGlow=ctx.createRadialGradient(W*.5,H*.39,0,W*.5,H*.39,W*.30);
  sunGlow.addColorStop(0,'rgba(255,197,57,.10)');
  sunGlow.addColorStop(1,'rgba(255,99,0,0)');
  ctx.fillStyle=sunGlow;ctx.fillRect(0,0,W,H);
}
function analog(){
  const palettes={
    1:['#b39d56','#5f774e'],
    2:['#c496b4','#79658d'],
    3:['#8ea8ad','#4a6670'],
    4:['#c5aa77','#745b38'],
    5:['#f0a04b','#72518c']
  };
  const p=palettes[currentMap]||palettes[1];
  ctx.save();ctx.globalAlpha=.028;ctx.globalCompositeOperation='screen';
  for(let i=0;i<20;i++){
    const x=(i*97+(last|0)*.010)%W,y=(i*47+(last|0)*.006)%H;
    ctx.fillStyle=i%3?p[0]:p[1];
    ctx.fillRect(x,y,1,1);
  }
  ctx.restore();
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  if(currentMap===1)renderMap1();
  else if(currentMap===2)renderMap2();
  else if(currentMap===3)renderMap3();
  else if(currentMap===4)renderMap4();
  else renderMap5();
  analog();
}
const keys=new Set();
function lateralLimit(){
  if(currentMap===1)return 1.35;
  if(currentMap===2)return 22;
  if(currentMap===3)return 4.7;
  if(currentMap===4)return 1.55;
  return 5.8;
}
function mapMaxZ(){
  if(currentMap===1)return 132;
  if(currentMap===2)return 145;
  if(currentMap===3)return 165;
  if(currentMap===4)return 150;
  return 118;
}
function update(dt){
  const forwardSpeed=dt*.020;
  const lateralSpeed=dt*.017;
  if(keys.has('w')||keys.has('arrowup')) targetCamZ+=forwardSpeed;
  if(keys.has('s')||keys.has('arrowdown')) targetCamZ-=forwardSpeed;
  if(keys.has('a')) targetCamX-=lateralSpeed;
  if(keys.has('d')) targetCamX+=lateralSpeed;
  targetCamZ=clamp(targetCamZ,-5,mapMaxZ());
  targetCamX=clamp(targetCamX,-lateralLimit(),lateralLimit());

  const k=Math.min(1,dt*.014);
  camZ=lerp(camZ,targetCamZ,k);
  camX=lerp(camX,targetCamX,k);
  updateRitualSigns(dt);
}
function frame(t){
  requestAnimationFrame(frame);
  if(document.hidden||t-last<28)return;
  const dt=Math.min(50,t-last||16);last=t;update(dt);render();
}
function setMap(n){
  currentMap=n;camX=0;targetCamX=0;camZ=1.4;targetCamZ=1.4;
  if(n===5)ritualSigns.clear();
  mapButtons.forEach((b,i)=>b.classList.toggle('active',i===n-1));
  const activeButton=mapButtons[n-1];
  if(activeButton)activeButton.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  const names=[
    'MAPA 1 · NAVE ALTA',
    'MAPA 2 · CILINDROS',
    'MAPA 3 · CALZADA PAREADA',
    'MAPA 4 · TÚNEL',
    'MAPA 5 · AVENIDA RITUAL'
  ];
  tag.textContent=names[n-1]||names[0];
}
mapsBar.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='touch'&&e.pointerType!=='pen')return;
  mapStripDrag={
    id:e.pointerId,
    startX:e.clientX,
    lastX:e.clientX,
    startScroll:mapsBar.scrollLeft,
    moved:false
  };
  mapsBar.setPointerCapture(e.pointerId);
});
mapsBar.addEventListener('pointermove',e=>{
  if(!mapStripDrag||e.pointerId!==mapStripDrag.id)return;
  const dx=e.clientX-mapStripDrag.startX;
  if(Math.abs(dx)>4)mapStripDrag.moved=true;
  if(!mapStripDrag.moved)return;
  e.preventDefault();
  mapsBar.scrollLeft=mapStripDrag.startScroll-dx;
  mapStripDrag.lastX=e.clientX;
});
function finishMapStripDrag(e){
  if(!mapStripDrag||e.pointerId!==mapStripDrag.id)return;
  if(mapStripDrag.moved)mapStripSuppressClickUntil=performance.now()+260;
  try{mapsBar.releasePointerCapture(e.pointerId)}catch(_){}
  mapStripDrag=null;
}
mapsBar.addEventListener('pointerup',finishMapStripDrag);
mapsBar.addEventListener('pointercancel',finishMapStripDrag);

mapButtons.forEach((b,i)=>b.addEventListener('click',e=>{
  if(performance.now()<mapStripSuppressClickUntil){
    e.preventDefault();
    e.stopPropagation();
    return;
  }
  setMap(i+1);
  // Keep the active option visible even after selecting it near an edge.
  b.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}));
const held=new Map();
function nudge(kind,amount){
  const max=mapMaxZ();
  if(kind==='up')targetCamZ=clamp(targetCamZ+amount*9,-5,max);
  if(kind==='down')targetCamZ=clamp(targetCamZ-amount*9,-5,max);
  if(kind==='left')targetCamX=clamp(targetCamX-amount*7,-lateralLimit(),lateralLimit());
  if(kind==='right')targetCamX=clamp(targetCamX+amount*7,-lateralLimit(),lateralLimit());
  hint.style.opacity='.18';
}

let swipePointer=null,swipeLastY=0;
canvas.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='touch'&&e.pointerType!=='pen')return;
  e.preventDefault();
  swipePointer=e.pointerId;
  swipeLastY=e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  if(e.pointerId!==swipePointer)return;
  e.preventDefault();
  const dy=e.clientY-swipeLastY;
  swipeLastY=e.clientY;
  if(Math.abs(dy)<.35)return;
  const max=mapMaxZ();
  // Finger up = walk forward. Finger down = walk backward.
  // Movement is proportional to actual drag distance so it feels like direct touch locomotion.
  targetCamZ=clamp(targetCamZ-dy*.045,-5,max);
  hint.style.opacity='.18';
});
function endSwipe(e){
  if(e.pointerId!==swipePointer)return;
  e.preventDefault();
  swipePointer=null;
  try{canvas.releasePointerCapture(e.pointerId)}catch(_){}
}
canvas.addEventListener('pointerup',endSwipe);
canvas.addEventListener('pointercancel',endSwipe);
['up','down'].forEach(id=>{
  const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();nudge(id,.13);
    const timer=setInterval(()=>nudge(id,.052),60);held.set(e.pointerId,timer);b.setPointerCapture(e.pointerId);
  });
  const stop=e=>{const t=held.get(e.pointerId);if(t)clearInterval(t);held.delete(e.pointerId);};
  b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);
});
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['w','a','s','d','arrowup','arrowdown'].includes(k)){
    keys.add(k);e.preventDefault();
  }else if(['1','2','3','4','5'].includes(k))setMap(Number(k));
});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>keys.clear());
addEventListener('wheel',e=>{
  e.preventDefault();
  const amount=clamp(Math.abs(e.deltaY)/140,.08,.72);
  if(e.deltaY<0)nudge('up',amount);
  else if(e.deltaY>0)nudge('down',amount);
},{passive:false});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('selectstart',e=>e.preventDefault());
addEventListener('dragstart',e=>e.preventDefault());
setTimeout(()=>hint.style.opacity='.18',1800);
window.PrometeoSpaces={
  version:'spaces-maps-v21',
  maps:[
    '1 green arch nave',
    '2 brutalist cylinder hall',
    '3 straight paired-column road',
    '4 enclosing barrel tunnel',
    '5 ritual striped avenue with hinged cardboard signs, paired spires and stepped temple'
  ],
  contract:'fixed frontal view; touch swipe + WASD + wheel; Map 5 uses hinged stick-and-cardboard signs: upright/hidden when far, they fall inward while the spire is ahead at medium range, then raise quickly again before the player reaches them',
  sourcePages:SOURCE_PAGES,
  camera:{get x(){return targetCamX},get z(){return targetCamZ}},
  get map(){return currentMap}
};
requestAnimationFrame(frame);
})();
</script>
