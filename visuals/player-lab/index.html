<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020202">
<title>Prometeo · Player Lab · Four Hands</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#eee8d7;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none;touch-action:none}
#shell{position:fixed;inset:0;overflow:hidden;background:#020202}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
#veil{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 48% 44%,rgba(0,0,0,0) 24%,rgba(0,0,0,.22) 58%,rgba(0,0,0,.84) 100%)}
#scan{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:.12;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.055) 0 1px,transparent 1px 4px);mix-blend-mode:screen}
#prompt{position:absolute;z-index:4;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);font:900 8px/1 system-ui,-apple-system,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:rgba(249,242,218,.78);text-shadow:0 1px 0 #000,0 2px 7px #000;white-space:nowrap;pointer-events:none;transition:opacity .35s,transform .12s}
#prompt.quiet{opacity:.10}
#prompt.hit{transform:translateX(-50%) translateY(-3px);opacity:1}
#flash{position:absolute;z-index:5;inset:0;background:#fbf6db;opacity:0;pointer-events:none;mix-blend-mode:screen}
#flash.on{animation:flash .12s steps(2,end)}
@keyframes flash{0%{opacity:.28}36%{opacity:.08}100%{opacity:0}}
@media(orientation:portrait){#shell{inset:auto;left:50%;top:50%;width:100dvh;height:100dvw;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center}}
</style>
</head>
<body>
<div id="shell">
  <canvas id="game" width="320" height="180" aria-label="Una habitación abandonada con una máscara, un corazón y cuatro poses de mano que cambian al tocar"></canvas>
  <div id="veil"></div><div id="scan"></div><div id="flash"></div><div id="prompt">tocá</div>
</div>

<!--
PLAYER LAB V5 · FOUR-HAND CUT SYSTEM · IMAGE-FIRST

Material change from V4:
- V4 used one anatomical hand asset for every state and tried to manufacture variety with filters.
- V5 uses four genuinely different hand image assets / silhouettes and hard pose cuts.
- The room, 320x180 internal resolution, touch, vibration, cheap audio and persistent state machine remain.
- The relic progression remains persistent: untouched mask -> marked mask -> mask pulled aside -> heart exposed.
- No hand, character or main object is drawn with primitives.

HAND ASSETS / LICENSING
1. OPEN
   Wikimedia Commons: "Open Hand pointing upwards.svg"
   Author/source: XOXO; crop by Benedikt Schäfer (WMDE)
   License: CC0 1.0
   https://commons.wikimedia.org/wiki/File:Open_Hand_pointing_upwards.svg

2. POINT
   Wikimedia Commons: "PointingHand.svg"
   Author: Work2survive
   License: Public Domain (PD-self)
   https://commons.wikimedia.org/wiki/File:PointingHand.svg

3. GRIP
   Wikimedia Commons: "Hand gripping (horizontal item).svg"
   Author: PhysicsEtc
   License: CC0 1.0
   https://commons.wikimedia.org/wiki/File:Hand_gripping_(horizontal_item).svg

4. FIST
   Wikimedia Commons: "Fist.svg"
   Author: KeithTyler / later smoothed version by Vizorsols
   License: Public Domain
   https://commons.wikimedia.org/wiki/File:Fist.svg

OTHER ASSETS
- Prometeo mask: ../../strategy/mask-mouth/assets/mask-transparent.webp
- Prometeo mask solid: ../../strategy/mask-mouth/assets/mask.webp
- Prometeo heart: ../../arte/assets/footer/heart-mask-final-alpha.png
- Room: Sergej Majboroda / Poly Haven, CC0, via Wikimedia Commons.
-->
<script>
(function(){
'use strict';
var c=document.getElementById('game'),x=c.getContext('2d',{alpha:false}),flash=document.getElementById('flash'),prompt=document.getElementById('prompt');
x.imageSmoothingEnabled=false;
var W=320,H=180,last=0,audio=null,actionStart=-10,action=0,actionStage=0,commitDone=false,shake=0,pulseUntil=0;
var KEY='prometeo.playerLab.maskRoom.stage.v5',OLDKEYS=['prometeo.playerLab.maskRoom.stage.v4','prometeo.playerLab.maskRoom.stage.v3'];
var stage=0;
try{
  var saved=localStorage.getItem(KEY);
  if(saved==null){for(var oi=0;oi<OLDKEYS.length&&saved==null;oi++)saved=localStorage.getItem(OLDKEYS[oi])}
  stage=Math.max(0,Math.min(3,parseInt(saved||'0',10)||0));
}catch(_){}

var assets={};
var URLS={
 room:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2d/Abandoned_tiled_room_-_Panorama_%28Poly_Haven%29.jpg/1280px-Abandoned_tiled_room_-_Panorama_%28Poly_Haven%29.jpg',
 open:'https://upload.wikimedia.org/wikipedia/commons/8/85/Open_Hand_pointing_upwards.svg',
 point:'https://upload.wikimedia.org/wikipedia/commons/1/1b/PointingHand.svg',
 grip:'https://upload.wikimedia.org/wikipedia/commons/a/ae/Hand_gripping_%28horizontal_item%29.svg',
 fist:'https://upload.wikimedia.org/wikipedia/commons/2/2a/Fist.svg',
 mask:'../../strategy/mask-mouth/assets/mask-transparent.webp',
 maskSolid:'../../strategy/mask-mouth/assets/mask.webp',
 heart:'../../arte/assets/footer/heart-mask-final-alpha.png'
};

function load(name,url){
  var im=new Image();
  im.decoding='async';
  im.onload=function(){assets[name]=im};
  im.onerror=function(){assets[name]=null};
  im.src=url
}
Object.keys(URLS).forEach(function(k){load(k,URLS[k])});

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function smooth(t){t=clamp(t,0,1);return t*t*(3-2*t)}
function pulseArc(t){return Math.sin(clamp(t,0,1)*Math.PI)}

function drawImageFitted(img,cx,cy,h,rot,alpha,filter,flip){
  if(!img)return;
  var iw=img.naturalWidth||img.width||1,ih=img.naturalHeight||img.height||1,w=h*(iw/ih);
  x.save();
  x.translate(Math.round(cx),Math.round(cy));
  if(rot)x.rotate(rot);
  if(flip)x.scale(-1,1);
  x.globalAlpha=alpha==null?1:alpha;
  if(filter)x.filter=filter;
  x.drawImage(img,-w*.5,-h*.5,w,h);
  x.restore()
}

function drawRoom(t){
  x.fillStyle='#050403';
  x.fillRect(0,0,W,H);
  var img=assets.room;
  if(!img)return;
  var iw=img.naturalWidth||1280,ih=img.naturalHeight||640;
  var cropW=iw*.46,cropH=ih*.94;
  var reveal=stage>=3?1:0;
  var sx=iw*.27+reveal*iw*.075+Math.sin(t*.08)*iw*.0035,sy=ih*.02;
  x.save();
  x.filter=stage>=3?'brightness(.46) saturate(.58) sepia(.12) contrast(1.38)':'brightness(.30) saturate(.43) sepia(.22) contrast(1.38)';
  x.drawImage(img,sx,sy,cropW,cropH,0,0,W,H);
  x.restore()
}

function drawShadow(img,cx,cy,h,rot,alpha,flip){
  if(!img)return;
  drawImageFitted(img,cx+4,cy+5,h,rot,alpha,'brightness(0) blur(2px)',flip)
}

function drawHeart(cx,cy,h,alpha,rot){
  var img=assets.heart;
  if(!img)return;
  drawImageFitted(img,cx,cy,h,rot||0,alpha,'sepia(.7) saturate(1.5) hue-rotate(-22deg) contrast(1.28)',false)
}

function relicPose(st,t){
  var breathe=Math.sin(t*1.4)*1.1;
  if(st===0)return {mx:160,my:79+breathe,mh:68,mr:Math.sin(t*.35)*.012,ma:.86,hx:160,hy:86,hh:0,ha:0};
  if(st===1)return {mx:160,my:78+breathe,mh:69,mr:Math.sin(t*.42)*.016,ma:.98,hx:160,hy:87,hh:31,ha:.88};
  if(st===2)return {mx:205,my:83+breathe*.7,mh:65,mr:.18+Math.sin(t*.4)*.013,ma:.96,hx:155,hy:83,hh:58,ha:.96};
  return {mx:253,my:102+breathe*.4,mh:52,mr:.31,ma:.68,hx:151,hy:79,hh:78,ha:1}
}

function drawRelic(t){
  var p=relicPose(stage,t);
  var beat=performance.now()<pulseUntil?1+Math.sin((pulseUntil-performance.now())*.044)*.10:1;
  if(stage>=1)drawHeart(p.hx,p.hy,p.hh*beat,p.ha,Math.sin(t*.75)*.018);
  if(assets.mask){
    drawShadow(assets.mask,p.mx,p.my,p.mh,p.mr,.58,false);
    drawImageFitted(
      assets.mask,p.mx,p.my,p.mh,p.mr,p.ma,
      stage===0?'grayscale(.34) brightness(.72) contrast(1.44)':'sepia(.07) saturate(.96) contrast(1.34)',
      false
    )
  }
  if(stage===1)drawHeart(p.mx-2,p.my+6,18,.68,-.05);
  if(stage===3&&assets.maskSolid)drawImageFitted(assets.maskSolid,p.mx,p.my,p.mh*.95,p.mr,.22,'brightness(.42) contrast(1.6)',false)
}

var HANDS=[
  {key:'open',  cx:270,cy:139,h:158,rot:-.28,flip:false,entryX:336,entryY:166,targetX:216,targetY:118,targetH:166,targetR:-.14},
  {key:'point', cx:259,cy:112,h:82, rot:-.07,flip:true, entryX:354,entryY:120,targetX:238,targetY:101,targetH:88, targetR:-.03},
  {key:'grip',  cx:239,cy:131,h:108,rot:-.20,flip:true, entryX:348,entryY:158,targetX:208,targetY:111,targetH:116,targetR:-.09},
  {key:'fist',  cx:276,cy:137,h:164,rot:-.34,flip:false,entryX:346,entryY:165,targetX:225,targetY:118,targetH:172,targetR:-.20}
];

function currentHandStage(){
  if(action<=0)return stage;
  return actionStage===3?0:actionStage+1
}

function handPose(t){
  var hs=currentHandStage(),cfg=HANDS[hs],img=assets[cfg.key];
  if(!img)return null;
  var idle=action<=0;
  var breathe=Math.sin(t*.82+hs)*1.3;
  if(idle){
    return {img:img,hs:hs,cx:cfg.cx,cy:cfg.cy+breathe,h:cfg.h,rot:cfg.rot+Math.sin(t*.47+hs)*.009,flip:cfg.flip,alpha:.99}
  }
  var p=pulseArc(action);
  var reach=smooth(Math.min(1,p*1.12));
  return {
    img:img,hs:hs,
    cx:cfg.entryX+(cfg.targetX-cfg.entryX)*reach,
    cy:cfg.entryY+(cfg.targetY-cfg.entryY)*reach,
    h:cfg.h+(cfg.targetH-cfg.h)*reach,
    rot:cfg.rot+(cfg.targetR-cfg.rot)*reach,
    flip:cfg.flip,alpha:1
  }
}

function handWhiteFilter(hs){
  if(hs===0)return 'grayscale(1) brightness(0) invert(1) contrast(2.6)';
  if(hs===1)return 'grayscale(1) brightness(0) invert(1) contrast(3.2)';
  if(hs===2)return 'grayscale(1) brightness(0) invert(1) contrast(3.4)';
  return 'grayscale(1) brightness(0) invert(1) contrast(4)'
}

function drawHand(t){
  var p=handPose(t);
  if(!p)return;
  var o=p.hs===1?2.8:2.2;
  drawImageFitted(p.img,p.cx-o,p.cy,p.h,p.rot,.98,'brightness(0) contrast(8)',p.flip);
  drawImageFitted(p.img,p.cx+o,p.cy,p.h,p.rot,.98,'brightness(0) contrast(8)',p.flip);
  drawImageFitted(p.img,p.cx,p.cy-o,p.h,p.rot,.98,'brightness(0) contrast(8)',p.flip);
  drawImageFitted(p.img,p.cx,p.cy+o,p.h,p.rot,.98,'brightness(0) contrast(8)',p.flip);
  if(p.hs===2||p.hs===3){
    drawImageFitted(p.img,p.cx-4,p.cy+2,p.h,p.rot-.012,.18,'grayscale(1) brightness(0) invert(1) contrast(4)',p.flip)
  }
  drawImageFitted(p.img,p.cx,p.cy,p.h,p.rot,p.alpha,handWhiteFilter(p.hs),p.flip)
}

function drawHeartEcho(t){
  if(stage<3||!assets.heart)return;
  var beat=(Math.sin(t*3.2)+1)*.5;
  drawHeart(151,79,98+beat*8,.055+beat*.045,0);
  drawHeart(151,79,128+beat*10,.018+beat*.018,0)
}

function draw(t){
  var sx=shake?Math.round((Math.random()-.5)*shake):0,sy=shake?Math.round((Math.random()-.5)*shake):0;
  x.save();
  x.translate(sx,sy);
  drawRoom(t);
  drawHeartEcho(t);
  drawRelic(t);
  drawHand(t);
  x.restore()
}

function setPrompt(){
  var txt=stage===0?'tocá':stage===1?'seguí':stage===2?'tiralo':stage===3?'late';
  prompt.textContent=txt;
  prompt.classList.remove('quiet');
  prompt.classList.add('hit');
  setTimeout(function(){prompt.classList.remove('hit')},150);
  setTimeout(function(){prompt.classList.add('quiet')},1250)
}

function beep(freq,dur,type,gain){
  try{
    audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    var o=audio.createOscillator(),g=audio.createGain();
    o.type=type||'triangle';
    o.frequency.value=freq;
    g.gain.setValueAtTime(gain||.022,audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);
    o.connect(g).connect(audio.destination);
    o.start();
    o.stop(audio.currentTime+dur)
  }catch(_){}
}

function activate(){
  var now=performance.now()/1000;
  if(now-actionStart<1.0)return;
  actionStage=stage;
  actionStart=now;
  action=.001;
  commitDone=false;
  shake=1;
  if(stage===0){beep(110,.07,'triangle');setTimeout(function(){beep(158,.07,'sine')},70)}
  else if(stage===1){beep(138,.08,'square',.015);setTimeout(function(){beep(92,.10,'sine')},78)}
  else if(stage===2){beep(78,.12,'sawtooth',.018);setTimeout(function(){beep(42,.13,'triangle',.018)},88)}
  else{beep(62,.16,'sine');setTimeout(function(){beep(124,.16,'sine')},120)}
  if(navigator.vibrate)navigator.vibrate(stage===2?[20,28,34]:stage===3?[24,48,24]:16);
  flash.classList.remove('on');
  void flash.offsetWidth;
  flash.classList.add('on')
}

function commit(){
  if(commitDone)return;
  commitDone=true;
  if(stage<3){
    stage++;
    try{localStorage.setItem(KEY,String(stage))}catch(_){}
  }else{
    pulseUntil=performance.now()+1200
  }
  shake=stage>=2?3:1;
  setTimeout(function(){shake=0},150);
  setPrompt()
}

function tick(ms){
  var t=ms/1000;
  if(action>0){
    var d=t-actionStart;
    action=d<1.0?d/1.0:0;
    if(action>.46&&!commitDone)commit()
  }
  if(!last||ms-last>33){
    draw(t);
    last=ms
  }
  requestAnimationFrame(tick)
}

c.addEventListener('pointerdown',function(e){e.preventDefault();activate()},{passive:false});
addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='Enter')activate()});
setPrompt();
requestAnimationFrame(tick)
})();
</script>
</body>
</html>
