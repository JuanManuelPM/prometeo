<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020202">
<title>Prometeo · Player Lab · The White Hand</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#eee8d7;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none;touch-action:none}
#shell{position:fixed;inset:0;overflow:hidden;background:#020202}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
#veil{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 48% 45%,rgba(0,0,0,0) 26%,rgba(0,0,0,.26) 62%,rgba(0,0,0,.82) 100%)}
#scan{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:.14;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.05) 0 1px,transparent 1px 4px);mix-blend-mode:screen}
#prompt{position:absolute;z-index:4;left:50%;bottom:max(7px,env(safe-area-inset-bottom));transform:translateX(-50%);font:800 8px/1 system-ui,-apple-system,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:rgba(248,240,211,.74);text-shadow:0 1px 0 #000,0 2px 6px #000;white-space:nowrap;pointer-events:none;transition:opacity .45s,transform .18s}
#prompt.quiet{opacity:.10}
#prompt.hit{transform:translateX(-50%) translateY(-2px);opacity:1}
#flash{position:absolute;z-index:5;inset:0;background:#f7f4df;opacity:0;pointer-events:none;mix-blend-mode:screen}
#flash.on{animation:flash .14s steps(2,end)}
@keyframes flash{0%{opacity:.22}35%{opacity:.08}100%{opacity:0}}
@media(orientation:portrait){#shell{inset:auto;left:50%;top:50%;width:100dvh;height:100dvw;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center}}
</style>
</head>
<body>
<div id="shell">
  <canvas id="game" width="320" height="180" aria-label="Una habitación abandonada con una máscara suspendida y una mano blanca que interactúa con ella"></canvas>
  <div id="veil"></div><div id="scan"></div><div id="flash"></div><div id="prompt">tocá la máscara</div>
</div>

<!--
PLAYER LAB V4 · IMAGE-FIRST
Crítica de V3 antes del cambio:
- la escena persistente y la secuencia máscara→mano→cambio ya funcionaban;
- la mano quedaba demasiado lateral, sepia y secundaria frente a la máscara;
- su presencia dependía demasiado de la animación, no de una silueta fuerte en reposo.
V4 conserva el motor barato y convierte la mano en foreground dominante con alto contraste,
contorno por reimpresión del propio asset, doble exposición e inversión parcial.
No se dibujan personajes ni entidades con primitivas.

ASSETS / LICENSING
- Prometeo mask: ../../strategy/mask-mouth/assets/mask-transparent.webp
- Prometeo heart: ../../arte/assets/footer/heart-mask-final-alpha.png
- Room: Sergej Majboroda / Poly Haven, CC0, via Wikimedia Commons.
- Hand: Darryl Leja / NHGRI, US Federal Government work, public domain, via Wikimedia Commons.
-->
<script>
(function(){
'use strict';
var c=document.getElementById('game'),x=c.getContext('2d',{alpha:false}),flash=document.getElementById('flash'),prompt=document.getElementById('prompt');
x.imageSmoothingEnabled=false;
var W=320,H=180,last=0,audio=null,actionStart=-10,action=0,actionStage=0,commitDone=false,shake=0,pulseUntil=0;
var KEY='prometeo.playerLab.maskRoom.stage.v4',OLDKEY='prometeo.playerLab.maskRoom.stage.v3';
var stage=0;
try{
  var saved=localStorage.getItem(KEY);
  if(saved==null)saved=localStorage.getItem(OLDKEY);
  stage=Math.max(0,Math.min(3,parseInt(saved||'0',10)||0));
}catch(_){}
var assets={};
var URLS={
 room:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2d/Abandoned_tiled_room_-_Panorama_%28Poly_Haven%29.jpg/1280px-Abandoned_tiled_room_-_Panorama_%28Poly_Haven%29.jpg',
 hand:'https://upload.wikimedia.org/wikipedia/commons/a/ab/Hand_external_anatomy%2C_dorsum.svg',
 mask:'../../strategy/mask-mouth/assets/mask-transparent.webp',
 maskSolid:'../../strategy/mask-mouth/assets/mask.webp',
 heart:'../../arte/assets/footer/heart-mask-final-alpha.png'
};
function load(name,url){
  var im=new Image();im.decoding='async';im.crossOrigin='anonymous';
  im.onload=function(){assets[name]=im};
  im.onerror=function(){assets[name]=null};
  im.src=url
}
Object.keys(URLS).forEach(function(k){load(k,URLS[k])});
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function smooth(t){t=clamp(t,0,1);return t*t*(3-2*t)}
function arcPulse(t){return Math.sin(clamp(t,0,1)*Math.PI)}
function drawImageFitted(img,cx,cy,h,rot,alpha,filter,flip){
  if(!img)return;
  var iw=img.naturalWidth||img.width||1,ih=img.naturalHeight||img.height||1,w=h*(iw/ih);
  x.save();x.translate(Math.round(cx),Math.round(cy));if(rot)x.rotate(rot);if(flip)x.scale(-1,1);
  x.globalAlpha=alpha==null?1:alpha;if(filter)x.filter=filter;
  x.drawImage(img,-w*.5,-h*.5,w,h);x.restore()
}
function drawRoom(t){
  x.fillStyle='#050403';x.fillRect(0,0,W,H);
  var img=assets.room;if(!img)return;
  var iw=img.naturalWidth||1280,ih=img.naturalHeight||640;
  var cropW=iw*.46,cropH=ih*.94,reveal=stage>=3?1:0;
  var sx=iw*.27+reveal*iw*.08+Math.sin(t*.10)*iw*.004,sy=ih*.02;
  x.save();
  x.filter=stage>=3?'brightness(.43) saturate(.68) sepia(.18) contrast(1.3)':'brightness(.31) saturate(.48) sepia(.24) contrast(1.32)';
  x.drawImage(img,sx,sy,cropW,cropH,0,0,W,H);
  x.restore()
}
function drawShadow(img,cx,cy,h,rot,alpha){
  if(!img)return;
  drawImageFitted(img,cx+4,cy+5,h,rot,alpha,'brightness(0) blur(2px)',false)
}
function drawHeart(cx,cy,h,alpha,rot){
  var img=assets.heart;if(!img)return;
  drawImageFitted(img,cx,cy,h,rot||0,alpha,'sepia(.8) saturate(1.35) hue-rotate(-18deg) contrast(1.18)',false)
}
function stagePose(t){
  var breathe=Math.sin(t*1.5)*1.3;
  if(stage===0)return {mx:160,my:78+breathe,mh:67,mr:Math.sin(t*.4)*.012,hx:160,hy:86,hh:20,ha:0};
  if(stage===1)return {mx:160,my:77+breathe,mh:69,mr:Math.sin(t*.5)*.018,hx:160,hy:87,hh:26,ha:.42};
  if(stage===2)return {mx:190,my:76+breathe,mh:67,mr:.12+Math.sin(t*.5)*.015,hx:157,hy:85,hh:49,ha:.82};
  return {mx:226,my:88+breathe*.5,mh:58,mr:.23,hx:151,hy:78,hh:78,ha:1}
}
function drawRelic(t){
  var p=stagePose(t),pulse=performance.now()<pulseUntil?1+Math.sin((pulseUntil-performance.now())*.04)*.09:1;
  if(stage>=1)drawHeart(p.hx,p.hy,p.hh*pulse,p.ha,Math.sin(t*.8)*.02);
  var m=assets.mask;
  if(m){
    drawShadow(m,p.mx,p.my,p.mh,p.mr,.56);
    drawImageFitted(m,p.mx,p.my,p.mh,p.mr,stage===0?.80:.96,stage===0?'grayscale(.45) brightness(.65) contrast(1.38)':'sepia(.08) saturate(.94) contrast(1.28)',false)
  }
  if(stage===1)drawHeart(p.mx-5,p.my+7,18,.72,-.08);
  if(stage===2)drawHeart(p.mx-10,p.my+4,20,.72,-.10);
  if(stage===3&&assets.maskSolid)drawImageFitted(assets.maskSolid,226,88,56,.23,.18,'brightness(.45) contrast(1.55)',false)
}
function handPose(t){
  if(!assets.hand)return null;
  var idle=[
    {cx:293,cy:151,h:164,rot:-.34},
    {cx:289,cy:150,h:169,rot:-.32},
    {cx:282,cy:146,h:176,rot:-.29},
    {cx:276,cy:142,h:184,rot:-.25}
  ];
  var targets=[
    {cx:189,cy:104,h:190,rot:-.12},
    {cx:183,cy:101,h:194,rot:-.10},
    {cx:179,cy:100,h:198,rot:-.08},
    {cx:186,cy:101,h:196,rot:-.06}
  ];
  var base=idle[action>0?actionStage:stage],target=targets[action>0?actionStage:stage];
  if(action<=0){
    return {cx:base.cx,cy:base.cy+Math.sin(t*.9)*1.5,h:base.h,rot:base.rot+Math.sin(t*.55)*.012,alpha:stage===0?.92:.96,phase:0}
  }
  var p=arcPulse(action),reach=smooth(Math.min(1,p*1.06));
  return {
    cx:base.cx+(target.cx-base.cx)*reach,
    cy:base.cy+(target.cy-base.cy)*reach,
    h:base.h+(target.h-base.h)*reach,
    rot:base.rot+(target.rot-base.rot)*reach,
    alpha:.99,
    phase:p
  }
}
function handFilter(which){
  if(which===0)return 'grayscale(1) brightness(0) invert(1) contrast(2.8)';
  if(which===1)return 'grayscale(1) sepia(.18) brightness(1.35) contrast(2.4)';
  if(which===2)return 'grayscale(1) brightness(0) invert(1) contrast(4)';
  return 'grayscale(1) brightness(1.65) contrast(2.5) invert(.08)'
}
function drawHand(t){
  var p=handPose(t);if(!p)return;
  var img=assets.hand,st=action>0?actionStage:stage;
  var outline=2.2;
  drawImageFitted(img,p.cx-outline,p.cy,p.h,p.rot,.94,'brightness(0) contrast(5)',true);
  drawImageFitted(img,p.cx+outline,p.cy,p.h,p.rot,.94,'brightness(0) contrast(5)',true);
  drawImageFitted(img,p.cx,p.cy-outline,p.h,p.rot,.94,'brightness(0) contrast(5)',true);
  drawImageFitted(img,p.cx,p.cy+outline,p.h,p.rot,.94,'brightness(0) contrast(5)',true);

  if(st>=2){
    var drift=st===3?5:3;
    drawImageFitted(img,p.cx-drift,p.cy+1,p.h,p.rot,p.alpha*.24,'grayscale(1) brightness(0) invert(1) contrast(3)',true);
  }
  if(st===3){
    drawImageFitted(img,p.cx+6,p.cy-2,p.h*.98,p.rot+.015,p.alpha*.14,'grayscale(1) brightness(0) invert(1) contrast(4)',true);
  }
  drawImageFitted(img,p.cx,p.cy,p.h,p.rot,p.alpha,handFilter(st),true);

  if(action>0&&p.phase>.62){
    drawImageFitted(img,p.cx-7,p.cy+3,p.h*.985,p.rot-.018,.10,'grayscale(1) brightness(0) invert(1) contrast(4)',true);
  }
}
function drawEcho(t){
  if(stage<3||!assets.heart)return;
  var beat=(Math.sin(t*3.1)+1)*.5;
  drawHeart(151,78,86+beat*7,.07+beat*.06,0);
  drawHeart(151,78,118+beat*9,.02+beat*.025,0)
}
function draw(t){
  var sx=shake?Math.round((Math.random()-.5)*shake):0,sy=shake?Math.round((Math.random()-.5)*shake):0;
  x.save();x.translate(sx,sy);
  drawRoom(t);drawEcho(t);drawRelic(t);drawHand(t);
  x.restore()
}
function setPrompt(){
  var txt=stage===0?'tocá la máscara':stage===1?'la marca quedó · tocá otra vez':stage===2?'apartala':'abierta · tocá para escuchar';
  prompt.textContent=txt;prompt.classList.remove('quiet');prompt.classList.add('hit');
  setTimeout(function(){prompt.classList.remove('hit')},180);
  setTimeout(function(){prompt.classList.add('quiet')},1500)
}
function beep(freq,dur,type){
  try{
    audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    var o=audio.createOscillator(),g=audio.createGain();
    o.type=type||'triangle';o.frequency.value=freq;
    g.gain.setValueAtTime(.022,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);
    o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)
  }catch(_){}
}
function activate(){
  var now=performance.now()/1000;if(now-actionStart<1.08)return;
  actionStage=stage;actionStart=now;action=.001;commitDone=false;shake=1;
  if(stage===0){beep(108,.08,'triangle');setTimeout(function(){beep(146,.08,'sine')},85)}
  else if(stage===1){beep(142,.08,'triangle');setTimeout(function(){beep(96,.12,'sine')},90)}
  else if(stage===2){beep(86,.12,'sawtooth');setTimeout(function(){beep(172,.12,'triangle')},105)}
  else{beep(72,.16,'sine');setTimeout(function(){beep(144,.16,'sine')},120)}
  if(navigator.vibrate)navigator.vibrate(stage===2?[18,24,30]:stage===3?[22,45,22]:14);
  flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on')
}
function commit(){
  if(commitDone)return;commitDone=true;
  if(stage<3){
    stage++;
    try{localStorage.setItem(KEY,String(stage))}catch(_){}
  }else pulseUntil=performance.now()+1100;
  shake=stage>=2?3:1;
  setTimeout(function(){shake=0},150);
  setPrompt()
}
function tick(ms){
  var t=ms/1000;
  if(action>0){
    var d=t-actionStart;action=d<1.08?d/1.08:0;
    if(action>.44&&!commitDone)commit()
  }
  if(!last||ms-last>33){draw(t);last=ms}
  requestAnimationFrame(tick)
}
c.addEventListener('pointerdown',function(e){e.preventDefault();activate()},{passive:false});
addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='Enter')activate()});
setPrompt();requestAnimationFrame(tick)
})();
</script>
</body>
</html>
