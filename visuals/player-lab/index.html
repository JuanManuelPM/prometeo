<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020202">
<title>Prometeo · Player Lab · Hand Loops</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#eee8d7;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none;touch-action:none}
#shell{position:fixed;inset:0;overflow:hidden;background:#020202}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
#veil{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 46% 42%,rgba(0,0,0,0) 25%,rgba(0,0,0,.18) 56%,rgba(0,0,0,.82) 100%)}
#scan{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:.11;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.05) 0 1px,transparent 1px 4px);mix-blend-mode:screen}
#prompt{position:absolute;z-index:4;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);font:900 8px/1 system-ui,-apple-system,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:rgba(249,242,218,.74);text-shadow:0 1px 0 #000,0 2px 7px #000;white-space:nowrap;pointer-events:none;transition:opacity .25s,transform .1s}
#prompt.quiet{opacity:.11}
#prompt.hit{transform:translateX(-50%) translateY(-3px);opacity:1}
#flash{position:absolute;z-index:5;inset:0;background:#fbf6db;opacity:0;pointer-events:none;mix-blend-mode:screen}
#flash.on{animation:flash .11s steps(2,end)}
@keyframes flash{0%{opacity:.26}38%{opacity:.07}100%{opacity:0}}
@media(orientation:portrait){#shell{inset:auto;left:50%;top:50%;width:100dvh;height:100dvw;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center}}
</style>
</head>
<body>
<div id="shell">
  <canvas id="game" width="320" height="180" aria-label="Una habitación abandonada con una máscara, un corazón y una mano animada con secuencias de imágenes"></canvas>
  <div id="veil"></div><div id="scan"></div><div id="flash"></div><div id="prompt">tocá</div>
</div>

<!--
PLAYER LAB V6 · HAND-SEQUENCE PLAYER · IMAGE-FIRST

Material change from V5:
- V5 still read as four pose swaps.
- V6 consumes a reusable hand-sequence manifest with a 12-frame IDLE loop plus a 7-frame GRAB action.
- Every hand frame is an external image asset; the canvas only crops/transforms/composites.
- GRAB interrupts IDLE, advances through reach/open/close/pull frames, commits a persistent relic change, then returns to the loop.
- Persistent room/state machine, 320x180 internal resolution, touch, vibration and cheap audio remain.
- No main hand/entity is procedurally drawn.

HAND SOURCE
visuals/player-lab/hand-sequences-v1.js
Wikimedia Commons assets marked Public Domain / CC0 in that manifest.
-->
<script src="./hand-sequences-v1.js"></script>
<script>
(function(){
'use strict';

var c=document.getElementById('game');
var x=c.getContext('2d',{alpha:false});
var flash=document.getElementById('flash');
var prompt=document.getElementById('prompt');
var W=320,H=180,lastDraw=0,audio=null,shake=0,pulseUntil=0;
var KEY='prometeo.playerLab.maskRoom.stage.v6';
var OLDKEYS=['prometeo.playerLab.maskRoom.stage.v5','prometeo.playerLab.maskRoom.stage.v4','prometeo.playerLab.maskRoom.stage.v3'];
var stage=0;
try{
  var saved=localStorage.getItem(KEY);
  for(var oi=0;oi<OLDKEYS.length&&saved==null;oi++)saved=localStorage.getItem(OLDKEYS[oi]);
  stage=Math.max(0,Math.min(3,parseInt(saved||'0',10)||0));
}catch(_){}

x.imageSmoothingEnabled=false;

var roomAssets={};
var ROOM_URLS={
  room:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2d/Abandoned_tiled_room_-_Panorama_%28Poly_Haven%29.jpg/1280px-Abandoned_tiled_room_-_Panorama_%28Poly_Haven%29.jpg',
  mask:'../../strategy/mask-mouth/assets/mask-transparent.webp',
  maskSolid:'../../strategy/mask-mouth/assets/mask.webp',
  heart:'../../arte/assets/footer/heart-mask-final-alpha.png'
};

function loadImage(url,onload){
  var im=new Image();
  im.decoding='async';
  im.onload=function(){onload(im)};
  im.onerror=function(){onload(null)};
  im.src=url;
}

Object.keys(ROOM_URLS).forEach(function(k){
  loadImage(ROOM_URLS[k],function(im){roomAssets[k]=im});
});

var LIB=window.PROMETEO_HAND_SEQUENCES_V1||{assets:{},sequences:{IDLE:[],GRAB:[]},commons:function(){return''}};
var handAssets={};
Object.keys(LIB.assets||{}).forEach(function(k){
  var meta=LIB.assets[k];
  loadImage(LIB.commons(meta.file),function(im){handAssets[k]=im});
});

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function drawImageFitted(img,cx,cy,h,rot,alpha,filter,flip){
  if(!img)return;
  var iw=img.naturalWidth||img.width||1;
  var ih=img.naturalHeight||img.height||1;
  var w=h*(iw/ih);
  x.save();
  x.translate(Math.round(cx),Math.round(cy));
  if(rot)x.rotate(rot);
  if(flip)x.scale(-1,1);
  x.globalAlpha=alpha==null?1:alpha;
  if(filter)x.filter=filter;
  x.drawImage(img,-w*.5,-h*.5,w,h);
  x.restore();
}

function drawRoom(t){
  x.fillStyle='#050403';
  x.fillRect(0,0,W,H);
  var img=roomAssets.room;
  if(!img)return;
  var iw=img.naturalWidth||1280,ih=img.naturalHeight||640;
  var cropW=iw*.46,cropH=ih*.94;
  var reveal=stage>=3?1:0;
  var sx=iw*.27+reveal*iw*.075+Math.sin(t*.08)*iw*.0035;
  x.save();
  x.filter=stage>=3?'brightness(.46) saturate(.58) sepia(.12) contrast(1.38)':'brightness(.30) saturate(.43) sepia(.22) contrast(1.38)';
  x.drawImage(img,sx,ih*.02,cropW,cropH,0,0,W,H);
  x.restore();
}

function drawHeart(cx,cy,h,alpha,rot){
  drawImageFitted(roomAssets.heart,cx,cy,h,rot||0,alpha,'sepia(.7) saturate(1.5) hue-rotate(-22deg) contrast(1.28)',false);
}

function relicPose(st,t){
  var breathe=Math.sin(t*1.4)*1.1;
  if(st===0)return {mx:160,my:79+breathe,mh:68,mr:Math.sin(t*.35)*.012,ma:.86,hx:160,hy:86,hh:0,ha:0};
  if(st===1)return {mx:160,my:78+breathe,mh:69,mr:Math.sin(t*.42)*.016,ma:.98,hx:160,hy:87,hh:31,ha:.88};
  if(st===2)return {mx:205,my:83+breathe*.7,mh:65,mr:.18+Math.sin(t*.4)*.013,ma:.96,hx:155,hy:83,hh:58,ha:.96};
  return {mx:253,my:102+breathe*.4,mh:52,mr:.31,ma:.68,hx:151,hy:79,hh:78,ha:1};
}

function drawRelic(t){
  var p=relicPose(stage,t);
  var beat=performance.now()<pulseUntil?1+Math.sin((pulseUntil-performance.now())*.044)*.10:1;
  if(stage>=1)drawHeart(p.hx,p.hy,p.hh*beat,p.ha,Math.sin(t*.75)*.018);
  if(roomAssets.mask){
    drawImageFitted(roomAssets.mask,p.mx+4,p.my+5,p.mh,p.mr,.48,'brightness(0) blur(2px)',false);
    drawImageFitted(roomAssets.mask,p.mx,p.my,p.mh,p.mr,p.ma,stage===0?'grayscale(.34) brightness(.72) contrast(1.44)':'sepia(.07) saturate(.96) contrast(1.34)',false);
  }
  if(stage===1)drawHeart(p.mx-2,p.my+6,18,.68,-.05);
  if(stage===3&&roomAssets.maskSolid)drawImageFitted(roomAssets.maskSolid,p.mx,p.my,p.mh*.95,p.mr,.22,'brightness(.42) contrast(1.6)',false);
}

function drawHeartEcho(t){
  if(stage<3||!roomAssets.heart)return;
  var beat=(Math.sin(t*3.2)+1)*.5;
  drawHeart(151,79,98+beat*8,.055+beat*.045,0);
  drawHeart(151,79,128+beat*10,.018+beat*.018,0);
}

function sequenceFrame(seq,elapsedMs,loop){
  if(!seq||!seq.length)return null;
  var total=0,i;
  for(i=0;i<seq.length;i++)total+=seq[i].hold||100;
  if(loop)elapsedMs=((elapsedMs%total)+total)%total;
  else elapsedMs=clamp(elapsedMs,0,total-1);
  var acc=0;
  for(i=0;i<seq.length;i++){
    acc+=seq[i].hold||100;
    if(elapsedMs<acc)return {frame:seq[i],index:i,total:seq.length,progress:elapsedMs/total};
  }
  return {frame:seq[seq.length-1],index:seq.length-1,total:seq.length,progress:1};
}

var mode='IDLE';
var actionStarted=0;
var actionCommitted=false;
var idleEpoch=performance.now();
var lastIdleIndex=-1;
var cutKick=0;

function activeFrame(ms){
  if(mode==='GRAB'){
    var sf=sequenceFrame(LIB.sequences.GRAB,ms-actionStarted,false);
    var duration=0;
    (LIB.sequences.GRAB||[]).forEach(function(f){duration+=f.hold||100});
    if(sf&&sf.frame.commit&&!actionCommitted)commitAction();
    if(ms-actionStarted>=duration){
      mode='IDLE';
      idleEpoch=ms;
      actionCommitted=false;
      sf=sequenceFrame(LIB.sequences.IDLE,0,true);
    }
    return sf;
  }
  return sequenceFrame(LIB.sequences.IDLE,ms-idleEpoch,true);
}

function drawHand(ms){
  var sf=activeFrame(ms);
  if(!sf)return;
  var f=sf.frame;
  var img=handAssets[f.asset];
  if(!img){
    var seq=mode==='GRAB'?LIB.sequences.GRAB:LIB.sequences.IDLE;
    for(var k=1;k<seq.length;k++){
      var alt=seq[(sf.index-k+seq.length)%seq.length];
      if(handAssets[alt.asset]){f=alt;img=handAssets[alt.asset];break}
    }
  }
  if(!img)return;

  if(mode==='IDLE'&&sf.index!==lastIdleIndex){
    lastIdleIndex=sf.index;
    cutKick=1;
  }
  cutKick*=.78;
  var stageShift=stage===0?0:stage===1?-2:stage===2?-6:-10;
  var cx=f.x+stageShift;
  var cy=f.y+(mode==='IDLE'?Math.sin(ms*.008+sf.index)*1.2:0);
  var h=f.h*(1+cutKick*.012);
  var r=f.r+(mode==='IDLE'?Math.sin(ms*.0031+sf.index)*.006:0);

  drawImageFitted(img,cx+3,cy+5,h,r,.92,'brightness(0) contrast(9)',!!f.flip);
  drawImageFitted(img,cx-2,cy+1,h,r,.30,'brightness(0) contrast(9)',!!f.flip);
  drawImageFitted(img,cx,cy,h,r,1,'grayscale(1) brightness(0) invert(1) contrast(4)',!!f.flip);

  if(mode==='GRAB'){
    drawImageFitted(img,cx-5,cy+2,h,r-.008,.10,'grayscale(1) brightness(0) invert(1) contrast(5)',!!f.flip);
  }
}

function setPrompt(){
  prompt.textContent=stage===0?'agarrá':stage===1?'otra vez':stage===2?'tiralo':'late';
  prompt.classList.remove('quiet');
  prompt.classList.add('hit');
  setTimeout(function(){prompt.classList.remove('hit')},140);
  setTimeout(function(){prompt.classList.add('quiet')},1100);
}

function beep(freq,dur,type,gain){
  try{
    audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    var o=audio.createOscillator(),g=audio.createGain();
    o.type=type||'triangle';
    o.frequency.value=freq;
    g.gain.setValueAtTime(gain||.02,audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);
    o.connect(g).connect(audio.destination);
    o.start();
    o.stop(audio.currentTime+dur);
  }catch(_){}
}

function trigger(){
  var now=performance.now();
  if(mode==='GRAB')return;
  mode='GRAB';
  actionStarted=now;
  actionCommitted=false;
  shake=1;
  if(stage===0){beep(110,.06,'triangle');setTimeout(function(){beep(158,.07,'sine')},62)}
  else if(stage===1){beep(138,.07,'square',.014);setTimeout(function(){beep(92,.09,'sine')},70)}
  else if(stage===2){beep(78,.10,'sawtooth',.016);setTimeout(function(){beep(42,.12,'triangle',.016)},82)}
  else{beep(62,.14,'sine');setTimeout(function(){beep(124,.14,'sine')},110)}
  if(navigator.vibrate)navigator.vibrate(stage===2?[18,26,32]:stage===3?[22,42,22]:14);
  flash.classList.remove('on');
  void flash.offsetWidth;
  flash.classList.add('on');
}

function commitAction(){
  if(actionCommitted)return;
  actionCommitted=true;
  if(stage<3){
    stage++;
    try{localStorage.setItem(KEY,String(stage))}catch(_){}
  }else{
    pulseUntil=performance.now()+1100;
  }
  shake=stage>=2?3:2;
  setTimeout(function(){shake=0},140);
  setPrompt();
}

function draw(ms){
  var t=ms/1000;
  var sx=shake?Math.round((Math.random()-.5)*shake):0;
  var sy=shake?Math.round((Math.random()-.5)*shake):0;
  x.save();
  x.translate(sx,sy);
  drawRoom(t);
  drawHeartEcho(t);
  drawRelic(t);
  drawHand(ms);
  x.restore();
}

function tick(ms){
  if(!lastDraw||ms-lastDraw>32){
    draw(ms);
    lastDraw=ms;
  }
  requestAnimationFrame(tick);
}

c.addEventListener('pointerdown',function(e){e.preventDefault();trigger()},{passive:false});
addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='Enter')trigger()});
setPrompt();
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
