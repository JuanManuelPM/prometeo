<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020202">
<title>Prometeo · Player Lab · Pet V9</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#eee8d7;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none;touch-action:none}
#shell{position:fixed;inset:0;overflow:hidden;background:#020202}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
#veil{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 23%,rgba(0,0,0,.14) 58%,rgba(0,0,0,.83) 100%)}
#scan{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:.09;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.045) 0 1px,transparent 1px 4px);mix-blend-mode:screen}
#prompt{position:absolute;z-index:4;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);font:900 8px/1 system-ui,-apple-system,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:rgba(249,242,218,.72);text-shadow:0 1px 0 #000,0 2px 7px #000;white-space:nowrap;pointer-events:none;transition:opacity .25s,transform .1s}
#prompt.quiet{opacity:.10}
#prompt.hit{transform:translateX(-50%) translateY(-3px);opacity:1}
#flash{position:absolute;z-index:5;inset:0;background:#fbf6db;opacity:0;pointer-events:none;mix-blend-mode:screen}
#flash.on{animation:flash .11s steps(2,end)}
@keyframes flash{0%{opacity:.18}38%{opacity:.04}100%{opacity:0}}
@media(orientation:portrait){#shell{inset:auto;left:50%;top:50%;width:100dvh;height:100dvw;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center}}
</style>
</head>
<body>
<div id="shell">
  <canvas id="game" width="320" height="180" aria-label="Escena retro en primera persona con la mano del jugador y una mascota-reliquia viva enfrente"></canvas>
  <div id="veil"></div><div id="scan"></div><div id="flash"></div><div id="prompt">acariciá</div>
</div>
<script src="./hand-atlas-v4.js?v=9"></script>
<script>
(function(){
'use strict';

var c=document.getElementById('game');
var x=c.getContext('2d',{alpha:false});
var flash=document.getElementById('flash');
var prompt=document.getElementById('prompt');
var W=320,H=180,audio=null,shake=0;
var KEY='prometeo.playerLab.pet.stage.v9';
var OLD=[
  'prometeo.playerLab.maskRoom.stage.v8',
  'prometeo.playerLab.maskRoom.stage.v7',
  'prometeo.playerLab.maskRoom.stage.v6',
  'prometeo.playerLab.maskRoom.stage.v5',
  'prometeo.playerLab.maskRoom.stage.v4',
  'prometeo.playerLab.maskRoom.stage.v3'
];

var bond=0;
try{
  var saved=localStorage.getItem(KEY);
  for(var oi=0;oi<OLD.length&&saved==null;oi++)saved=localStorage.getItem(OLD[oi]);
  bond=Math.max(0,Math.min(3,parseInt(saved||'0',10)||0));
}catch(_){}

x.imageSmoothingEnabled=false;

var ACT=window.PROMETEO_PLAYER_ACTORS_V4||{
  cell:128,
  self:{
    source:'./hand-atlas-v3-inspect.webp',
    idleFrames:[1,2,3,4,3,2],
    petFrames:[1,2,3,4,5,6,7,8,7,6]
  }
};

var assets={};
var URLS={
  room:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2d/Abandoned_tiled_room_-_Panorama_%28Poly_Haven%29.jpg/1280px-Abandoned_tiled_room_-_Panorama_%28Poly_Haven%29.jpg',
  mask:'../../strategy/mask-mouth/assets/mask-transparent.webp',
  maskSolid:'../../strategy/mask-mouth/assets/mask.webp',
  heart:'../../arte/assets/footer/heart-mask-final-alpha.png'
};

function loadImage(url,onload){
  var im=new Image();
  im.decoding='async';
  im.onload=function(){onload(im)};
  im.onerror=function(){onload(null)};
  im.src=url;
}

Object.keys(URLS).forEach(function(k){
  loadImage(URLS[k],function(im){assets[k]=im});
});

var selfStrip=null;
loadImage(ACT.self.source+'?v=9',function(im){
  if(im){
    selfStrip=alphaKeyStrip(im);
  }else{
    prompt.textContent='mano no cargó';
    prompt.classList.remove('quiet');
  }
});

function alphaKeyStrip(img){
  var oc=document.createElement('canvas');
  oc.width=img.naturalWidth||img.width||1280;
  oc.height=img.naturalHeight||img.height||128;
  var ox=oc.getContext('2d',{alpha:true,willReadFrequently:true});
  ox.clearRect(0,0,oc.width,oc.height);
  ox.drawImage(img,0,0);
  try{
    var d=ox.getImageData(0,0,oc.width,oc.height);
    var p=d.data;
    for(var i=0;i<p.length;i+=4){
      var r=p[i],g=p[i+1],b=p[i+2];
      var hi=Math.max(r,g,b),lo=Math.min(r,g,b);
      var lum=.299*r+.587*g+.114*b;
      var chroma=hi-lo;
      var a=Math.max((lum-24)*7,(chroma-7)*10);
      if(lum<28&&chroma<11)a=0;
      p[i+3]=Math.max(0,Math.min(255,a));
    }
    ox.putImageData(d,0,0);
  }catch(_){
    return img;
  }
  return oc;
}

function drawFit(img,cx,cy,h,rot,alpha,filter,flip){
  if(!img)return;
  var iw=img.naturalWidth||img.width||1;
  var ih=img.naturalHeight||img.height||1;
  var w=h*(iw/ih);
  x.save();
  x.translate(Math.round(cx),Math.round(cy));
  if(rot)x.rotate(rot);
  if(flip)x.scale(-1,1);
  x.globalAlpha=alpha==null?1:alpha;
  if(filter)x.filter=filter;
  x.drawImage(img,-w*.5,-h*.5,w,h);
  x.restore();
}

function drawRoom(t){
  x.fillStyle='#050403';
  x.fillRect(0,0,W,H);
  var im=assets.room;
  if(!im)return;
  var iw=im.naturalWidth||1280,ih=im.naturalHeight||640;
  var cropW=iw*.46,cropH=ih*.94;
  var sx=iw*.27+Math.sin(t*.07)*iw*.003;
  x.save();
  x.filter='brightness(.30) saturate(.43) sepia(.22) contrast(1.38)';
  x.drawImage(im,sx,ih*.02,cropW,cropH,0,0,W,H);
  x.restore();
}

var petReactUntil=0;
var petTapSide=1;

function petReaction(ms){
  if(ms>=petReactUntil)return 0;
  return Math.max(0,Math.min(1,(petReactUntil-ms)/520));
}

function drawPet(t,ms){
  if(!assets.mask&&!assets.heart)return;
  var react=petReaction(ms);
  var breath=(Math.sin(t*2.15)+1)*.5;
  var bob=Math.sin(t*1.55)*2.0-react*4;
  var sway=Math.sin(t*.78)*.035+react*.10*petTapSide;
  var cx=159+Math.sin(t*.42)*1.5+react*5*petTapSide;
  var headY=76+bob;
  var bodyY=118+bob*.55;
  var pulse=1+breath*.035+react*.12+(bond*.012);
  var heartH=(46+bond*4)*pulse;
  var headH=58+bond*2;

  if(assets.heart){
    drawFit(assets.heart,cx+2,bodyY+3,heartH*1.12,sway,.24,'brightness(0) blur(3px)',false);
    drawFit(assets.heart,cx,bodyY,heartH,sway,.88,'sepia(.72) saturate(1.45) hue-rotate(-24deg) contrast(1.32)',false);
    if(bond>=2){
      drawFit(assets.heart,cx,bodyY,heartH*(1.14+breath*.04),-sway*.5,.10,'brightness(1.6) blur(1px)',false);
    }
  }

  if(assets.mask){
    drawFit(assets.mask,cx+3,headY+4,headH,sway,.50,'brightness(0) blur(2px)',false);
    drawFit(assets.mask,cx,headY,headH,sway,.98,bond===0
      ?'grayscale(.22) brightness(.78) contrast(1.38)'
      :'sepia(.08) saturate(.98) contrast(1.35)',false);
  }

  if(bond>=3&&assets.maskSolid){
    drawFit(assets.maskSolid,cx,headY,headH*.96,-sway*.3,.13,'brightness(.55) contrast(1.5)',false);
  }
}

var handMode='IDLE';
var handStart=0;
var handCommitted=false;
var idleEpoch=performance.now();

function idleFrame(ms){
  var seq=ACT.self.idleFrames;
  return seq[Math.floor(((ms-idleEpoch)/185)%seq.length+seq.length)%seq.length];
}

function petFrame(ms){
  var seq=ACT.self.petFrames;
  var elapsed=ms-handStart;
  var idx=Math.min(seq.length-1,Math.floor(elapsed/88));
  if(!handCommitted&&idx>=5){
    handCommitted=true;
    commitPet(ms);
  }
  if(elapsed>=seq.length*88){
    handMode='IDLE';
    idleEpoch=ms;
    return seq[0];
  }
  return seq[idx];
}

function drawSelfHandFrame(frame,cx,cy,size,rot,alpha,filter){
  if(!selfStrip)return;
  var S=ACT.cell||128;
  x.save();
  x.translate(Math.round(cx),Math.round(cy));
  if(rot)x.rotate(rot);
  x.globalAlpha=alpha==null?1:alpha;
  if(filter)x.filter=filter;
  x.drawImage(selfStrip,frame*S,0,S,S,-size*.5,-size*.5,size,size);
  x.restore();
}

function drawSelfHand(ms){
  if(!selfStrip)return;
  var idle=handMode==='IDLE';
  var fr=idle?idleFrame(ms):petFrame(ms);
  var approach=0;

  if(!idle){
    var dur=(ACT.self.petFrames.length-1)*88;
    var p=Math.max(0,Math.min(1,(ms-handStart)/dur));
    approach=1-Math.abs(p*2-1);
  }

  var cx=287-approach*60+(idle?Math.sin(ms*.0018)*1.2:0);
  var cy=171-approach*42+(idle?Math.sin(ms*.0032)*1.0:0);
  var size=132+approach*10;
  var rot=-.34+approach*.16+(idle?Math.sin(ms*.0013)*.012:0);

  x.save();
  x.globalCompositeOperation='source-over';
  drawSelfHandFrame(fr,cx+3,cy+5,size,rot,.36,'brightness(0) blur(2px)');
  drawSelfHandFrame(fr,cx,cy,size,rot,1,'none');
  x.restore();
}

function save(){
  try{localStorage.setItem(KEY,String(bond))}catch(_){}
}

function commitPet(ms){
  if(bond<3){
    bond++;
    save();
  }
  petReactUntil=ms+620;
  petTapSide*=-1;
  shake=2.8;
  try{navigator.vibrate&&navigator.vibrate([16,26,22])}catch(_){}
  beep(118+bond*9,.08,'triangle',.024);
  flash.classList.remove('on');
  void flash.offsetWidth;
  flash.classList.add('on');
}

function beep(freq,dur,type,gain){
  try{
    audio=audio||new(window.AudioContext||window.webkitAudioContext)();
    var o=audio.createOscillator(),g=audio.createGain();
    o.type=type||'triangle';
    o.frequency.value=freq;
    g.gain.setValueAtTime(gain||.02,audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);
    o.connect(g).connect(audio.destination);
    o.start();
    o.stop(audio.currentTime+dur);
  }catch(_){}
}

function triggerPet(){
  if(handMode!=='IDLE')return;
  handMode='PET';
  handStart=performance.now();
  handCommitted=false;
  prompt.textContent='mascota';
  prompt.classList.remove('quiet');
  prompt.classList.add('hit');
  setTimeout(function(){prompt.classList.remove('hit')},140);
  setTimeout(function(){
    prompt.textContent='acariciá';
    prompt.classList.add('quiet');
  },1050);
  beep(150,.045,'square',.010);
}

function input(e){
  if(e&&e.cancelable)e.preventDefault();
  triggerPet();
}

c.addEventListener('pointerdown',input,{passive:false});
c.addEventListener('touchstart',input,{passive:false});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='Enter')triggerPet();
});

function draw(ms){
  var t=ms/1000;
  x.save();
  if(shake>0){
    x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
    shake*=.80;
  }
  drawRoom(t);
  drawPet(t,ms);
  drawSelfHand(ms);
  x.restore();
  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
setTimeout(function(){prompt.classList.add('quiet')},1450);

})();
</script>
</body>
</html>
