<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f0e7">
<title>Lector · Capítulo 1</title>
<link rel="stylesheet" href="./v7.css?v=7">
</head>
<body>
<div class="shell">
  <div class="crumbs">Biblioteca <span>›</span> Psicología</div>

  <main class="playerCard">
    <div class="cardHead">
      <div>
        <div class="chapterTitle">Capítulo 1</div>
        <div class="chapterMeta"><span id="wordCount">— palabras</span> · <span id="readTime">— min</span></div>
      </div>
      <button id="settingsBtn" class="settingsBtn" aria-label="Ajustes" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="19" cy="12" r="1.7" fill="currentColor"/></svg>
      </button>
    </div>

    <div class="transport">
      <button id="playBtn" class="playCore" aria-label="Reproducir">▶</button>
      <div class="timeline">
        <div id="track" class="track" aria-label="Posición del capítulo">
          <div class="trackBase"></div>
          <div id="trackBuffered" class="trackBuffered"></div>
          <div id="trackFill" class="trackFill"></div>
          <div id="trackThumb" class="trackThumb"></div>
        </div>
        <div class="timelineFoot"><span><span id="timeLabel">0:00</span> / <span id="totalTime">3:00</span></span><span id="bufferHint" class="bufferHint">preparando…</span></div>
      </div>
    </div>

    <div id="settingsPanel" class="settingsPanel" hidden>
      <div class="settingsGroup"><div class="settingsLabel">Voz</div><div id="voiceChoices" class="choiceRow"></div></div>
      <div class="settingsGroup"><div class="settingsLabel">Velocidad</div><div id="speedChoices" class="choiceRow"></div></div>
    </div>
  </main>
</div>

<div class="hiddenEngine" aria-hidden="true">
  <button id="backBtn">atrás</button><button id="forwardBtn">adelante</button>
  <button id="voiceButton"><span id="voiceButtonLabel">Julián</span></button><div id="voiceMenu"></div>
  <span id="nowVoice">Julián</span><span id="nowState"></span><span id="chapterProgress">0%</span>
  <span id="bufferState"><i></i><span></span></span><span id="bufferCount">0</span>
  <div id="readerFrame"><aside><div id="railTrack"><div id="railFill"></div><div id="railThumb"></div></div></aside><article id="reader"></article></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="./app.js?v=3"></script>
<script src="./v7.js?v=7"></script>
</body>
</html>
