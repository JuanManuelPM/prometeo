<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f0e7">
<title>Lector · Capítulo 1</title>
<link rel="stylesheet" href="./v9.css?v=9">
</head>
<body>
<div class="shell">
  <div class="crumbs">Biblioteca <span>›</span> Psicología</div>

  <main id="playerCard" class="playerCard" data-text-size="normal">
    <div class="cardHead">
      <div class="chapterTitle">Capítulo 1</div>
      <button id="disclosureBtn" class="disclosure" aria-label="Mostrar texto" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9.5 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="transport">
      <button id="playBtn" class="playCore" aria-label="Reproducir">▶</button>
      <div class="timeline">
        <div id="track" class="track" aria-label="Posición del capítulo">
          <div class="trackBase"></div>
          <div id="trackBuffered" class="trackBuffered"></div>
          <div id="trackFill" class="trackFill"></div>
          <div id="trackThumb" class="trackThumb"></div>
        </div>
      </div>
    </div>

    <div class="playerFoot">
      <div class="timelineMeta">
        <span><span id="timeLabel">0:00</span> / <span id="totalTime">3:00</span></span>
        <span class="dot">·</span>
        <span id="wordCount">— palabras</span>
        <span class="dot">·</span>
        <span id="bufferHint" class="bufferHint">preparando…</span>
      </div>
      <button id="settingsBtn" class="settingsBtn" aria-label="Ajustes" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M8 4v6M8 14v6M16 4v6M16 14v6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="8" cy="7" r="2" fill="var(--paper)" stroke="currentColor" stroke-width="1.5"/><circle cx="16" cy="17" r="2" fill="var(--paper)" stroke="currentColor" stroke-width="1.5"/></svg>
        <span>Ajustes</span>
      </button>
    </div>

    <div id="settingsPanel" class="settingsPanel" hidden>
      <div class="settingRow"><div class="settingsLabel">Texto</div><div id="textChoices" class="choiceRow"></div></div>
      <div class="settingRow"><div class="settingsLabel">Voz</div><div id="voiceChoices" class="choiceRow"></div></div>
      <div class="settingRow"><div class="settingsLabel">Velocidad</div><div id="speedChoices" class="choiceRow"></div></div>
    </div>

    <section id="readerSection" class="readerSection" hidden>
      <div id="readerFrame" class="readerFrame">
        <aside class="readRail" aria-hidden="true">
          <div id="railTrack" class="railTrack"><div id="railFill" class="railFill"></div><div id="railThumb" class="railThumb"></div></div>
        </aside>
        <article id="reader" class="reader" aria-live="off"></article>
      </div>
    </section>
  </main>
</div>

<div class="hiddenEngine" aria-hidden="true">
  <span id="readTime">—</span>
  <button id="backBtn">atrás</button><button id="forwardBtn">adelante</button>
  <button id="voiceButton"><span id="voiceButtonLabel">Julián</span></button><div id="voiceMenu"></div>
  <span id="nowVoice">Julián</span><span id="nowState"></span><span id="chapterProgress">0%</span>
  <span id="bufferState"><i></i><span></span></span><span id="bufferCount">0</span>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="./app.js?v=3"></script>
<script src="./v9.js?v=9"></script>
</body>
</html>
