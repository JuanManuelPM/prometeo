<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f0e7">
<title>Lector · Capítulo de prueba</title>
<link rel="stylesheet" href="./style.css?v=1">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="crumbs">Biblioteca <span>›</span> Psicología</div>
    <button id="voiceButton" class="voiceButton" aria-haspopup="true" aria-expanded="false">
      <span class="voiceDot"></span><span id="voiceButtonLabel">Julián</span><span class="chev">⌄</span>
    </button>
    <div id="voiceMenu" class="voiceMenu" hidden></div>
  </header>

  <main>
    <section class="bookHead">
      <div class="kicker">Capítulo 4</div>
      <h1>La memoria no guarda copias</h1>
      <p class="deck">Por qué recordar es reconstruir, y por qué eso no convierte a la memoria en un sistema defectuoso.</p>
      <div class="bookMeta"><span>Lectura guiada</span><span>·</span><span id="wordCount">— palabras</span><span>·</span><span id="readTime">— min</span></div>
    </section>

    <article id="reader" class="reader" aria-live="off"></article>

    <div class="endMark"><span></span><div>Fin del capítulo</div><span></span></div>
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div class="playerWrap">
  <div class="player">
    <div class="playCluster">
      <button id="backBtn" class="skip" aria-label="Retroceder 5 segundos">↶<small>5</small></button>
      <button id="playBtn" class="play" aria-label="Reproducir">▶</button>
      <button id="forwardBtn" class="skip" aria-label="Adelantar 10 segundos"><small>10</small>↷</button>
    </div>

    <div class="now">
      <div class="nowTop">
        <div><strong id="nowVoice">Julián</strong><span class="sep">·</span><span id="nowState">preparando lectura</span></div>
        <div id="timeLabel" class="timeLabel">0:00</div>
      </div>
      <div class="track" id="track"><div id="trackFill" class="trackFill"></div></div>
      <div class="nowBottom">
        <span id="chapterProgress">0%</span>
        <span id="bufferState" class="bufferState"><i></i><span>preparando el comienzo</span></span>
      </div>
    </div>

    <button id="followBtn" class="follow active" aria-pressed="true"><span>◎</span><span>seguir lectura</span></button>
  </div>
</div>

<script src="./app.js?v=1"></script>
</body>
</html>
