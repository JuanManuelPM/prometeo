<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f0e7">
<title>Lector · Capítulo de prueba</title>
<link rel="stylesheet" href="./style.css?v=2">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="crumbs">Biblioteca <span>›</span> Psicología</div>
    <button id="voiceButton" class="voiceButton" aria-haspopup="true" aria-expanded="false">
      <span class="voiceDot"></span><span id="voiceButtonLabel">Julián</span><span class="chev">⌄</span>
    </button>
    <div id="voiceMenu" class="voiceMenu" hidden></div>
  </header>

  <main>
    <section class="bookHead">
      <div class="kicker">Capítulo 4</div>
      <h1>La memoria no guarda copias</h1>
      <p class="deck">Por qué recordar es reconstruir, y por qué eso no convierte a la memoria en un sistema defectuoso.</p>
      <div class="bookMeta"><span>Lectura guiada</span><span>·</span><span id="wordCount">— palabras</span><span>·</span><span id="readTime">— min</span></div>
    </section>

    <div class="readerFrame">
      <aside class="readRail" aria-hidden="true">
        <div class="railTrack"><div id="railFill" class="railFill"></div><div id="railThumb" class="railThumb"><span></span></div></div>
      </aside>
      <article id="reader" class="reader" aria-live="off"></article>
    </div>

    <div class="endMark"><span></span><div>Fin del capítulo</div><span></span></div>
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div class="playerWrap">
  <div class="player">
    <div class="playCluster">
      <button id="backBtn" class="skip" aria-label="Retroceder 5 segundos">↶<small>5</small></button>
      <button id="playBtn" class="play" aria-label="Reproducir">▶</button>
      <button id="forwardBtn" class="skip" aria-label="Avanzar 10 segundos">10<small>↷</small></button>
    </div>
    <div class="now">
      <div class="nowTop"><div><strong id="nowVoice">Julián</strong><span class="sep">·</span><span id="nowState">preparando lectura</span></div><span id="timeLabel" class="timeLabel">0:00</span></div>
      <div id="track" class="track" aria-label="Progreso del capítulo"><div id="trackFill" class="trackFill"></div></div>
      <div class="nowBottom"><span id="chapterProgress">0%</span><span id="bufferState" class="bufferState busy"><i></i><span>precargando</span></span></div>
    </div>
    <div class="bufferBadge"><span id="bufferCount">0</span><small>por delante</small></div>
  </div>
</div>
<script src="./app.js?v=2"></script>
</body>
</html>
