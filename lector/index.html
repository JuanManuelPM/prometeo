<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f0e7">
<title>Lector · Capítulo 1</title>
<link rel="stylesheet" href="./style.css?v=3">
<link rel="stylesheet" href="./v4.css?v=4">
<link rel="stylesheet" href="./v5.css?v=5">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="crumbs">Biblioteca <span>›</span> Psicología</div>
    <button id="voiceButton" class="voiceButton" aria-haspopup="true" aria-expanded="false" aria-label="Elegir voz">
      <span class="voiceDot"></span><span id="voiceButtonLabel">Julián</span><span class="chev">⌄</span>
    </button>
    <div id="voiceMenu" class="voiceMenu" hidden></div>
  </header>

  <main id="chapterCard" class="chapterCard">
    <section class="chapterCollapsed">
      <div class="chapterTop">
        <div class="chapterInfo">
          <button id="chapterToggle" class="chapterToggle" aria-expanded="false">
            <span class="chapterChevron">⌄</span><strong>Capítulo 1</strong>
          </button>
          <div class="chapterMeta"><span id="wordCount">— palabras</span><span>·</span><span id="readTime">— min</span></div>
        </div>
        <button id="playBtn" class="chapterPlay" aria-label="Reproducir">
          <svg class="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.8c0-.86.94-1.39 1.68-.95l9.1 5.55a1.86 1.86 0 0 1 0 3.2l-9.1 5.55A1.1 1.1 0 0 1 8 18.2V5.8Z" fill="currentColor"/></svg>
        </button>
        <button id="chapterSettingsBtn" class="chapterSettingsButton" aria-label="Ajustes de lectura" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M8 4v6M8 14v6M16 4v6M16 14v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="8" cy="7" r="2" fill="var(--v4-card)" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="17" r="2" fill="var(--v4-card)" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </div>
      <div class="chapterSeek">
        <div id="track" class="track" aria-label="Progreso del capítulo"><div id="trackBuffered" class="trackBuffered"></div><div id="trackFill" class="trackFill"></div></div>
        <span id="miniPct" class="miniPct">0%</span>
      </div>
    </section>

    <section id="chapterBody" class="chapterBody" aria-hidden="true">
      <div id="settingsPanel" class="settingsPanel" hidden>
        <div class="settingsGroup"><div class="settingsLabel">Voz</div><div id="settingsVoices" class="settingsChoices"></div></div>
        <div class="settingsGroup"><div class="settingsLabel">Velocidad</div><div id="settingsSpeeds" class="settingsChoices"></div></div>
      </div>
      <div class="readTitle">
        <h1>La memoria no guarda copias</h1>
        <p>Por qué recordar es reconstruir, y por qué eso no convierte a la memoria en un sistema defectuoso.</p>
      </div>
      <div id="readerFrame" class="readerFrame">
        <aside class="readRail">
          <div id="railTrack" class="railTrack" role="slider" aria-label="Posición de lectura" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="railFill" class="railFill"></div><div id="railThumb" class="railThumb" role="button" aria-label="Reanudar lectura"></div></div>
        </aside>
        <article id="reader" class="reader" aria-live="off"></article>
      </div>
      <div class="endMark"><span></span><div>Fin del capítulo</div><span></span></div>
    </section>
  </main>
</div>

<div class="hiddenTransport" aria-hidden="true">
  <button id="backBtn">atrás</button><button id="forwardBtn">adelante</button>
  <span id="nowVoice">Julián</span><span id="nowState"></span><span id="timeLabel">0:00</span><span id="chapterProgress">0%</span>
  <span id="bufferState"><i></i><span></span></span><span id="bufferCount">0</span>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="./app.js?v=3"></script>
<script src="./v5.js?v=5"></script>
</body>
</html>
