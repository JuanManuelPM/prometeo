<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#0a0a09">
<title>PROMETEO · WORK LOOP V5.1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0a0a09;color:#f4efe5;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
main{max-width:980px;margin:auto;padding:22px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}h1{font:900 clamp(30px,7vw,72px)/.9 system-ui,sans-serif;letter-spacing:-.06em;margin:0;color:#ff6a00}
button{border:1px solid #f4efe5;background:#f4efe5;color:#0a0a09;padding:11px 14px;font:900 11px/1 system-ui;letter-spacing:.08em;cursor:pointer}.live{border:1px solid #34312d;padding:12px;margin-bottom:18px}.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.lane{border-right:1px solid #34312d;padding-right:10px}.lane:last-child{border:0}.k{font-size:9px;font-weight:900;opacity:.5}.v{font:900 22px/1 system-ui;margin-top:4px}.critical{margin-top:10px;font-size:10px;line-height:1.45}.state{font:800 10px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;opacity:.55;margin:0 0 12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:600 13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:0;border-top:1px solid #34312d;padding-top:18px}
@media(max-width:620px){header{align-items:flex-end}h1{font-size:38px}.lanes{grid-template-columns:1fr}.lane{border-right:0;border-bottom:1px solid #34312d;padding:0 0 8px}.lane:last-child{border-bottom:0}}
</style>
</head>
<body><main>
<header><h1>WORK LOOP V5.1</h1><button id="copy">COPIAR</button></header>
<section class="live">
  <div class="lanes">
    <div class="lane"><div class="k">REVIEW</div><div class="v" id="review">—</div></div>
    <div class="lane"><div class="k">RECOVERY V5</div><div class="v" id="recovery">—</div></div>
    <div class="lane"><div class="k">PRODUCT VERIFIED</div><div class="v" id="product">—</div></div>
  </div>
  <div class="critical" id="critical">CARGANDO ESTADO VIVO…</div>
</section>
<div class="state" id="state">CARGANDO PROMPT CANÓNICO…</div><pre id="prompt"></pre>
</main>
<script>
(()=>{
const B='https://catnohyouxqjjtseaueb.supabase.co/rest/v1/rpc/',KEY='sb_publishable_eqh3PngXs4UjLLWiY3pz1w_nhHtf7X-',H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const E={p:document.getElementById('prompt'),s:document.getElementById('state'),c:document.getElementById('copy'),review:document.getElementById('review'),recovery:document.getElementById('recovery'),product:document.getElementById('product'),critical:document.getElementById('critical')};let text='';
const num=(v,d=0)=>Number.isFinite(Number(v))?Number(v):d,age=s=>{s=Math.max(0,num(s));if(s<60)return Math.round(s)+'s';if(s<3600)return Math.floor(s/60)+'m';return Math.floor(s/3600)+'h '+Math.floor((s%3600)/60)+'m'};
async function rpc(name){const r=await fetch(B+name,{method:'POST',headers:H,body:'{}',cache:'no-store'});if(!r.ok)throw new Error(name+' '+r.status);return r.json()}
async function prompt(){try{text=await rpc('prometeo_worker_lobby_prompt_v1');if(typeof text!=='string')text=String(text||'');E.p.textContent=text.trim();E.s.textContent='CANÓNICO · SUPABASE · V5_FRONTIER_BURST'}catch(e){E.s.textContent='ERROR CARGANDO PROMPT';E.p.textContent='No uses una copia vieja. Reintentá esta misma página.'}}
async function live(){try{const [w,r]=await Promise.all([rpc('prometeo_world_snapshot_v1'),rpc('prometeo_runtime_recovery_v5_status_v1')]);const c=(w.focus_run||{}).counts||{},rc=(r||{}).counts||{},pp=((w.product_completion||{}).percentage)||{},h=w.worker_health||{};E.review.textContent=num(c.success,num(c.done))+'/'+num(c.total);E.recovery.textContent=num(rc.done_success)+'/'+num(rc.total)+' · '+num(rc.active)+' ACTIVE';E.product.textContent=num(pp.display).toFixed(0)+'%';E.critical.textContent='CRITICAL '+String(h.critical_node||'—')+' · AGE '+age(h.critical_age_seconds)+' · READY '+num(h.useful_ready_width)+' · ACTIVE '+num(h.useful_active)+' · NEED +'+num(h.recommended_new_shells)+' · '+String(h.capacity_decision||'UNKNOWN').replaceAll('_',' ')}catch(e){E.critical.textContent='ESTADO VIVO NO DISPONIBLE'}}
E.c.onclick=async()=>{if(!text)return;try{await navigator.clipboard.writeText(text.trim());E.c.textContent='COPIADO'}catch{E.c.textContent='ERROR'}};
prompt();live();setInterval(live,5000);
})();
</script>
</body></html>
