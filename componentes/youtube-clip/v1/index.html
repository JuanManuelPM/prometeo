<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PROMETEO · VIDEO</title>
<style>
:root{--bg:#0b0e0c;--surface:#121713;--line:#394338;--accent:#cbe1b3;--paper:#eaf0e3}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--paper);font-family:Arial,sans-serif}main{min-height:100dvh;padding:clamp(18px,3vw,42px);display:flex;flex-direction:column;gap:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;font-size:11px;font-weight:800;letter-spacing:.2em}.top small{font-size:10px;color:#86947f}.viewport{flex:1;min-height:52vh;position:relative;display:grid;place-items:center;overflow:hidden;perspective:1300px;background:radial-gradient(circle at 55% 40%,#233027 0%,#101812 48%,#080d09 100%);border:1px solid #334337}.scene{width:min(88vw,920px);transform-style:preserve-3d;transform:rotateY(-12deg) rotateX(3deg);transition:transform .65s cubic-bezier(.2,.7,.15,1)}.scene.flat{transform:none}.frame{padding:clamp(9px,1.5vw,18px);background:#222b22;border:1px solid #526c4e;box-shadow:25px 36px 65px #020603aa,0 0 90px #728e5030}.screen{position:relative;aspect-ratio:16/9;background:black}.screen iframe{display:block;width:100%;height:100%}.scene::after{content:'';display:block;margin:0 auto;width:24%;height:40px;background:linear-gradient(#4e6346,#18281d);clip-path:polygon(45% 0,55% 0,65% 100%,35% 100%)}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tools input{background:#141b15;color:#f0f3ec;border:1px solid #3a4b3c;padding:11px 12px;font:inherit;font-size:13px;border-radius:0;min-width:0}.tools input.url{flex:1 1 235px}.tools input.time{width:83px}.tools button{cursor:pointer;border:1px solid #53694d;background:#19261b;color:#edf5e7;padding:11px 14px;font:inherit;font-size:12px;font-weight:800;letter-spacing:.08em}.tools button.primary{background:var(--accent);color:#172218;border-color:var(--accent)}.tools button:focus-visible{outline:2px solid white}#status{font:600 11px Arial,sans-serif;color:#94ae90;letter-spacing:.08em}.screen .prometeo-youtube-clip{height:100%;min-height:0!important}.screen iframe{position:absolute;inset:0;width:100%!important;height:100%!important}@media(max-width:600px){.scene{width:94%}.viewport{min-height:46vh}.tools{gap:6px}.tools button{flex:1}.top{font-size:10px}}
</style></head><body><main><div class="top"><span>PROMETEO / VIDEO</span><small>URL · INICIO · FIN</small></div><div class="viewport"><div class="scene" id="scene"><div class="frame"><div class="screen" id="screen"></div></div></div></div><div class="tools"><input class="url" aria-label="Enlace de YouTube" id="url" value="https://youtu.be/CgIGel3zXEI" spellcheck="false"><input class="time" aria-label="Inicio" id="start" value="02:36"><input class="time" aria-label="Fin" id="end" value="03:16"><button class="primary" id="play">VER ▶</button><button id="again">OTRO CORTE</button><button id="angle">3D / PLANO</button></div><div id="status" role="status">PREPARANDO</div></main>
<script src="./player.js"></script><script>
'use strict';
const $=id=>document.getElementById(id);let clip=null;
const values=()=>({url:$('url').value.trim(),start:$('start').value.trim(),end:$('end').value.trim()});
function info(s){$('status').textContent=s.toUpperCase()}
try{
 clip=PrometeoYouTubeClip.create({target:'#screen',...values(),passive:true,onEnd:()=>info('FIN DEL FRAGMENTO'),onError:e=>info('ERROR: '+String(e)),onState:e=>{if(e.status==='cued')info('LISTO PARA VER');else if(e.status==='autoplay-blocked')info('TOCÁ PLAY SOBRE EL REPRODUCTOR');else if(e.status==='playing')info('REPRODUCIENDO')}});
}catch(e){info('ERROR: '+e.message)}
$('play').onclick=()=>{try{clip.load(values());if(!clip.play())info('CARGANDO REPRODUCTOR');}catch(e){info(e.message)}};
$('again').onclick=()=>{try{clip.load(values());info('INTERVALO CAMBIADO');}catch(e){info(e.message)}};
$('angle').onclick=()=>$('scene').classList.toggle('flat');
</script></body></html>
