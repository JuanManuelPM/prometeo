<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<title>6 capacidades base · Plan</title>
<style>
:root{--bg:#F3EBDD;--ink:#111}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;overflow:hidden}button{font:inherit;color:inherit}.top{position:fixed;z-index:30;left:0;right:0;top:0;height:54px;background:var(--bg);border-bottom:2px solid var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 16px}.count{font-size:12px;font-weight:900;letter-spacing:.18em}.dots{display:flex;gap:6px}.dot{width:8px;height:8px;border:2px solid var(--ink);border-radius:50%;background:var(--bg);padding:0}.dot.on{background:var(--ink)}.screens{width:100vw;height:100dvh;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}.screens::-webkit-scrollbar{display:none}.screen{flex:0 0 100vw;width:100vw;height:100dvh;overflow-y:auto;scroll-snap-align:start;scroll-snap-stop:always;padding-top:54px;background:var(--bg);overscroll-behavior-y:contain}.page{width:min(100%,760px);margin:auto;padding:34px 24px 170px}.n{font-size:12px;font-weight:900;letter-spacing:.2em;margin-bottom:18px}.title{margin:0;font-family:Impact,"Arial Black",Arial,sans-serif;font-size:clamp(55px,14vw,110px);line-height:.84;letter-spacing:-.045em}.lead{margin:18px 0 50px;font-size:clamp(18px,5vw,28px);line-height:1.05;font-weight:900;text-transform:uppercase;max-width:620px}.section{border-top:3px solid var(--ink);padding:22px 0 28px}.section h2{margin:0 0 14px;font-family:Impact,"Arial Black",Arial,sans-serif;font-size:clamp(29px,7vw,46px);line-height:.92;letter-spacing:-.025em}.section ul{margin:0;padding-left:20px}.section li{font-size:16px;line-height:1.25;font-weight:700;margin:0 0 9px}.done{font-size:13px;font-weight:900;letter-spacing:.12em}.work{position:fixed;z-index:50;left:50%;bottom:18px;transform:translateX(-50%);width:112px;height:54px;border:2px solid var(--ink);border-radius:999px;background:var(--bg);font-weight:900;letter-spacing:.08em;touch-action:none;user-select:none;cursor:grab;display:grid;place-items:center}.targets{position:fixed;z-index:45;left:14px;right:14px;bottom:12px;height:80px;display:flex;gap:12px;opacity:0;pointer-events:none;transition:opacity .12s}.targets.show{opacity:1}.target{flex:1;border:2px dashed var(--ink);display:grid;place-items:center;font-size:12px;font-weight:900;letter-spacing:.12em;background:var(--bg)}.toast{position:fixed;z-index:70;top:66px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 13px;font-size:12px;font-weight:900;letter-spacing:.1em;opacity:0;pointer-events:none}.toast.show{opacity:1}@media(min-width:800px){.page{padding-left:36px;padding-right:36px}.work{width:130px}}
</style></head><body><header class="top"><div class="count" id="count">01 / 06</div><div class="dots" id="dots"></div></header><div class="toast" id="toast">PROMPT COPIADO</div><div class="targets" id="targets"><div class="target" data-action="copy">COPIAR</div><div class="target" data-action="chat">CHAT</div></div><button class="work" id="work">TRABAJAR</button><main class="screens" id="screens"></main><script>
const DATA=[
{title:'VOZ ↔ TEXTO',lead:'Una sola capacidad para grabar, transcribir, pegar texto y escucharlo sin perder material.',flow:['Entrada: micrófono, archivo de audio o texto pegado.','Guardar el original antes de procesar nada.','Audio → transcripción por cola; texto → lectura por fragmentos concatenables.','Pausa, reanudar, siguiente, anterior y posición persistente.','Salida reutilizable: texto limpio, transcript crudo y audio/lectura.'],guards:['Nunca perder una grabación si falla la transcripción.','No bloquear la interfaz mientras procesa.','Textos largos se dividen internamente, pero se sienten como una sola lectura.','Permitir corregir, borrar y volver a procesar sin duplicados.'],qa:['Móvil con permiso de micrófono aceptado y denegado.','Audio corto y largo; texto de una página y de muchas.','Cerrar/reabrir y continuar desde la posición anterior.'],prompt:'Construí una capacidad web reusable VOZ ↔ TEXTO en un único HTML mobile-first. Debe aceptar micrófono, archivos de audio y texto pegado; guardar el original antes de procesar; transcribir audio en segundo plano sin bloquear; permitir lectura en voz alta de textos largos mediante fragmentos concatenados que se comporten como una sola lectura; incluir play/pausa/anterior/siguiente, posición persistente, corrección y borrado. Separá estado crudo de estado procesado. No pierdas una grabación si falla Whisper/TTS. Entregá HTML funcional, contrato de datos y pruebas manuales para móvil y escritorio. No integres otras funciones.'},
{title:'PUBLICAR WEB',lead:'Un procedimiento único para convertir un HTML en un link público estable sin repetir 404, ramas equivocadas ni caché vieja.',flow:['Elegir repo, ruta canónica y URL final antes de escribir.','Detectar qué sirve GitHub Pages: main, /docs o gh-pages.','Si el archivo existe, obtener SHA actual y actualizarlo; si no, crearlo.','Publicar en la autoridad correcta sin inventar rutas paralelas.','Verificar archivo en la rama y después verificar la URL pública real.'],guards:['Nunca afirmar “publicado” sólo porque el commit existe.','No cambiar el link estable por una versión nueva salvo pedido explícito.','Diagnosticar 404 por rama/ruta/Pages antes de rehacer el HTML.','Evitar main y gh-pages divergentes cuando ambas deban conservar copia.','Usar cache-bust sólo para verificar; mantener URL canónica limpia.'],qa:['Crear una página nueva.','Actualizar la misma página sin cambiar URL.','Provocar 404 deliberado y resolverlo por diagnóstico.','Comprobar que el contenido público corresponde al último commit.'],prompt:'Creá un HTML-guía reusable llamado PUBLICAR WEB para GitHub Pages. Tiene que conducir a una IA o humano por el flujo exacto: elegir repo/ruta/URL estable, detectar fuente de Pages (main, docs o gh-pages), hacer fetch del archivo y su SHA antes de update, crear si no existe, actualizar sin cambiar el link, verificar rama y luego verificar la URL pública real, diagnosticar 404 y caché. La guía debe impedir que se declare publicado sólo por tener commit. Incluir checklist de DONE y decisiones explícitas para main vs gh-pages. Diseño mobile-first, bicolor y muy directo.'},
{title:'ARCHIVOS ↔ CONTENIDO',lead:'Una puerta común para meter materiales distintos y convertirlos en contenido utilizable sin rehacer importadores.',flow:['Aceptar PDF, imagen, audio, texto, CSV/Excel, JSON y ZIP.','Conservar archivo original + metadatos + representación normalizada.','Extraer sólo cuando haga falta; no destruir formato de origen.','Exponer una interfaz común para que otras páginas lean el contenido.','Exportar nuevamente archivo, selección o paquete ZIP.'],guards:['Nunca reemplazar el original por la versión procesada.','No usar OCR si ya existe texto fiable.','Errores de un archivo no deben romper el resto del lote.','Identidad estable para evitar duplicados al reimportar.'],qa:['Importar un archivo por tipo.','Importar varios mezclados.','Cerrar/reabrir y conservar originales y derivados.','Exportar y volver a importar sin pérdida esencial.'],prompt:'Construí un módulo HTML reusable ARCHIVOS ↔ CONTENIDO. Debe importar PDF, imágenes, audio, texto, CSV/Excel, JSON y ZIP; conservar siempre el original con metadatos; generar representaciones normalizadas sin sobrescribir el origen; evitar OCR cuando exista texto; manejar lotes sin que un archivo fallido rompa los demás; asignar identidad estable para evitar duplicados; permitir exportar archivo, selección y ZIP. Diseñá un contrato de datos común para que cualquier página pueda consumir esos materiales. Entregá demo funcional client-side donde sea posible y marcá claramente qué procesamiento requiere backend.'},
{title:'GUARDAR ↔ VOLVER',lead:'Persistir lo importante y regresar exactamente al mismo contexto en cualquier página.',flow:['Definir un estado serializable y versionado.','Guardar cambios relevantes con debounce, no cada pixel.','Persistir pantalla, scroll, foco lógico, selección, progreso y datos.','Restaurar primero datos y después posición visual.','Migrar estados viejos cuando cambia el esquema.'],guards:['No confundir Back del navegador con Exact Back interno.','No restaurar scroll antes de que el contenido exista.','No perder estado por refresh, cierre o cambio de pantalla.','Una migración fallida debe conservar copia previa recuperable.'],qa:['Refresh en mitad de una tarea.','Cerrar pestaña y reabrir.','Cambiar versión del esquema y migrar.','Volver desde fullscreen/overlay al foco y scroll exactos.'],prompt:'Construí un módulo HTML reusable GUARDAR ↔ VOLVER. Definí un estado serializable y versionado que preserve datos, pantalla activa, scroll, foco lógico, selección, progreso y configuración. Guardá con debounce; restaurá datos antes de posición visual; separá Back del navegador de Exact Back interno; incluí migraciones de schema y copia recuperable si una migración falla. Demo obligatoria: editar contenido, navegar, scrollear, recargar y volver exactamente al contexto anterior.'},
{title:'RECURSOS WEB',lead:'Una forma única de mostrar enlaces, videos, PDFs, imágenes y herramientas externas sin iframes rotos.',flow:['Entrada universal: URL + tipo opcional.','Detectar recurso y elegir embed, preview o tarjeta externa.','YouTube, PDF, imagen, GeoGebra y web genérica comparten el mismo contrato.','Si no puede embeberse, ofrecer fallback útil sin dejar un rectángulo roto.','Conservar siempre la URL original y un botón abrir externo.'],guards:['No asumir que toda URL permite iframe.','No bloquear scroll o touch por un embed invisible.','Carga fallida debe degradar a tarjeta, no romper layout.','Nunca perder la fuente original al generar previews.'],qa:['YouTube embebible y restringido.','PDF, imagen y página externa con X-Frame-Options.','Offline o URL inválida.','Móvil pequeño y escritorio.'],prompt:'Construí un componente HTML reusable RECURSOS WEB. Debe aceptar una URL y representar YouTube, PDF, imagen, GeoGebra o web genérica mediante un contrato común. Elegí embed cuando sea viable y fallback de tarjeta cuando no; conservar siempre URL original y acción Abrir externo. Un iframe fallido jamás debe quedar como cuadro roto ni bloquear gestos. Incluí estados loading/error/fallback, demo con varios tipos y pruebas móvil/escritorio.'},
{title:'CONTROLES UNIVERSALES',lead:'Gestos, botones y estados que funcionen igual en móvil, mouse y lápiz sin pelearse con el scroll.',flow:['Unificar Pointer Events para touch, mouse y stylus.','Separar tap, hold, drag y scroll con umbrales claros.','Controles con estados idle/pressed/dragging/disabled/busy.','Fullscreen, cerrar, volver y selección comparten reglas predecibles.','Feedback visual/sonoro opcional sin cambiar la lógica.'],guards:['Un drag no debe disparar click al soltar.','Un control no debe secuestrar el scroll si el gesto es vertical de página.','Evitar dobles handlers touch+mouse.','Enter no ejecuta acciones peligrosas por accidente.','Cancelar pointer siempre limpia estado y captura.'],qa:['Android táctil pequeño.','Desktop mouse/trackpad.','Stylus/Wacom con presión disponible.','Scroll dentro de overlay y cierre sin saltos.'],prompt:'Construí una librería/demo HTML reusable CONTROLES UNIVERSALES basada en Pointer Events. Debe resolver tap, hold, drag y scroll con umbrales; estados idle/pressed/dragging/disabled/busy; fullscreen, cerrar, volver y selección; evitar click fantasma al terminar drag; no secuestrar scroll; limpiar pointer capture en cancel; evitar handlers duplicados touch/mouse; no usar Enter para acciones peligrosas. Incluir feedback visual/sonoro desacoplado y una matriz de pruebas Android, desktop y stylus/Wacom.'}
];
const screens=document.getElementById('screens'),dots=document.getElementById('dots'),count=document.getElementById('count'),work=document.getElementById('work'),targets=document.getElementById('targets'),toast=document.getElementById('toast');DATA.forEach((d,i)=>{const s=document.createElement('section');s.className='screen';s.innerHTML=`<div class="page"><div class="n">0${i+1} / 06</div><h1 class="title">${d.title}</h1><div class="lead">${d.lead}</div><div class="section"><h2>FLUJO</h2><ul>${d.flow.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="section"><h2>NO PUEDE FALLAR</h2><ul>${d.guards.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="section"><h2>LISTO CUANDO</h2><ul>${d.qa.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="section"><div class="done">ARRASTRÁ “TRABAJAR” → COPIAR / CHAT</div></div></div>`;screens.appendChild(s);const b=document.createElement('button');b.className='dot'+(i===0?' on':'');b.onclick=()=>screens.scrollTo({left:i*innerWidth,behavior:'smooth'});dots.appendChild(b)});let active=0,timer;function update(){active=Math.max(0,Math.min(5,Math.round(screens.scrollLeft/innerWidth)));count.textContent=`0${active+1} / 06`;[...dots.children].forEach((d,i)=>d.classList.toggle('on',i===active))}screens.addEventListener('scroll',()=>{clearTimeout(timer);timer=setTimeout(update,60)});addEventListener('resize',update);async function copyPrompt(){const text=DATA[active].prompt;try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1100)}let dragging=false,start={x:0,y:0};work.addEventListener('pointerdown',e=>{dragging=true;work.setPointerCapture(e.pointerId);start={x:e.clientX,y:e.clientY};targets.classList.add('show')});work.addEventListener('pointermove',e=>{if(!dragging)return;work.style.transform=`translate(calc(-50% + ${e.clientX-start.x}px),${e.clientY-start.y}px)`});async function finish(e){if(!dragging)return;dragging=false;const el=document.elementFromPoint(e.clientX,e.clientY),target=el&&el.closest('.target');work.style.transform='translateX(-50%)';targets.classList.remove('show');if(!target)return;await copyPrompt();if(target.dataset.action==='chat')window.open('https://chatgpt.com/','_blank','noopener')}work.addEventListener('pointerup',finish);work.addEventListener('pointercancel',()=>{dragging=false;work.style.transform='translateX(-50%)';targets.classList.remove('show')});update();
</script></body></html>
