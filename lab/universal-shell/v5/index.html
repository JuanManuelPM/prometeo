<!doctype html>
<html lang="es" data-p-material="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Universal Shell V5</title>
<link rel="stylesheet" href="https://juanmanuelpm.github.io/prometeo/shared/material/v1/material.css">
<style>
:root{--bg:#171816;--ink:#eeeae0;--muted:#94958d;--line:rgba(255,255,255,.075);--ease:cubic-bezier(.2,.8,.2,1);--dock:94px;--font:"Avenir Next","Helvetica Neue","Century Gothic",Avenir,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font)}body{overflow:hidden;background:radial-gradient(circle at 16% 8%,rgba(255,255,255,.035),transparent 26%),linear-gradient(145deg,#191a18,#121310)}button{font:inherit;color:inherit}
.app{width:100%;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) var(--dock);overflow:hidden}.stage{position:relative;min-width:0;min-height:0;overflow:hidden}
.rail{width:100%;height:100%;display:flex;gap:18px;padding:3vh 7vw;overflow-x:auto;overflow-y:hidden;scroll-padding-inline:7vw;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch}.rail::-webkit-scrollbar{display:none}
.page{position:relative;flex:0 0 100%;height:100%;min-width:0;scroll-snap-align:center;scroll-snap-stop:always;overflow:hidden;border-radius:38px;background:linear-gradient(145deg,rgba(255,255,255,.025),rgba(0,0,0,.01)),var(--pm-surface,#20211e);box-shadow:var(--pm-bevel,inset 1px 1px rgba(255,255,255,.05),inset -1px -1px rgba(0,0,0,.55)),var(--pm-raised,-12px -12px 24px rgba(255,255,255,.05),12px 12px 24px rgba(0,0,0,.46));opacity:.18;transform:scale(.978);transition:opacity .24s var(--ease),transform .24s var(--ease)}.page.near{opacity:.38;transform:scale(.989)}.page.active{opacity:1;transform:scale(1)}
.page-content{position:absolute;inset:0;padding:clamp(28px,5vw,70px);display:grid;grid-template-columns:minmax(0,1.35fr) minmax(220px,.65fr);gap:clamp(28px,5vw,80px);align-items:end}.title{align-self:start;margin:0;max-width:8ch;font-size:clamp(58px,9vw,126px);font-weight:530;line-height:.89;letter-spacing:-.068em;text-wrap:balance}.preview{display:grid;align-self:end;min-width:0}.preview-line{min-height:56px;display:flex;align-items:center;border-top:1px solid var(--line);color:var(--muted);font-size:clamp(16px,1.7vw,23px);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview-line:last-child{border-bottom:1px solid var(--line)}.page:not(.active) .preview{opacity:0}
.enter,.back{border:0;display:grid;place-items:center;background:var(--pm-surface,#20211e);box-shadow:var(--pm-raised-soft,-7px -7px 16px rgba(255,255,255,.03),7px 7px 16px rgba(0,0,0,.30));-webkit-tap-highlight-color:transparent;touch-action:manipulation}.enter{position:absolute;right:34px;top:34px;width:58px;height:58px;border-radius:50%}.enter svg{width:25px;height:25px}.back{position:absolute;z-index:40;left:20px;top:50%;width:52px;height:52px;margin-top:-26px;border-radius:50%;display:none}.back.show{display:grid}.back svg{width:22px;height:22px}
.dock{position:relative;overflow:hidden;padding:12px 10px;background:linear-gradient(90deg,rgba(255,255,255,.018),transparent 36%),rgba(12,13,12,.34);box-shadow:inset 8px 0 20px rgba(0,0,0,.16)}.dock-window{height:100%;display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.spine{position:relative;min-width:0;border-radius:14px 14px 10px 10px;overflow:hidden;background:var(--pm-surface,#20211e);box-shadow:inset 1px 1px rgba(255,255,255,.04),3px 4px 10px rgba(0,0,0,.22);opacity:.30;transform:translateY(var(--shift));transition:opacity .22s var(--ease),transform .26s var(--ease)}.spine:first-child{opacity:.72}.spine-label{position:absolute;inset:12px 0;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;line-height:1;letter-spacing:.055em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.previous-edge{position:absolute;z-index:30;left:0;top:50%;width:8px;height:34%;transform:translateY(-50%);border-radius:0 8px 8px 0;background:linear-gradient(180deg,transparent,rgba(255,255,255,.12),transparent);opacity:0;transition:opacity .18s var(--ease)}.previous-edge.show{opacity:.72}
.contact{position:fixed;z-index:9999;width:30px;height:30px;border-radius:50%;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.75);border:1px solid rgba(238,234,224,.28);background:rgba(238,234,224,.08);box-shadow:0 3px 14px rgba(0,0,0,.16);transition:opacity 90ms linear,transform 160ms var(--ease)}.contact.show{opacity:.72;transform:translate(-50%,-50%) scale(1)}
@media(orientation:portrait) and (max-width:900px){:root{--dock:clamp(96px,10vh,116px)}.app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) var(--dock)}.rail{display:block;width:100%;height:100%;padding:9px 14px;overflow-y:auto;overflow-x:hidden;scroll-padding-block:9px;scroll-snap-type:y mandatory;touch-action:pan-y}.page{width:100%;height:calc(100% - 18px);min-height:0;max-height:none;margin:0 0 14px;scroll-snap-align:center;transform:scale(.987)}.page.active{transform:scale(1)}.page-content{padding:24px;display:flex;flex-direction:column;justify-content:space-between;gap:30px}.title{max-width:8ch;font-size:clamp(52px,16vw,86px);line-height:.91}.preview{width:100%}.preview-line{min-height:50px;font-size:clamp(16px,5vw,22px)}.enter{top:20px;right:20px;width:54px;height:54px}.back{position:fixed;left:16px;top:auto;bottom:calc(var(--dock) + 14px);margin:0;width:50px;height:50px}.dock{padding:9px 12px 8px;box-shadow:inset 0 8px 20px rgba(0,0,0,.16)}.dock-window{grid-template-columns:1fr;grid-template-rows:repeat(6,1fr);gap:3px}.spine{width:100%;min-height:0;border-radius:12px 12px 8px 8px;transform:translateX(var(--shift))}.spine-label{inset:0 14px;writing-mode:horizontal-tb;transform:none;justify-content:flex-start;font-size:10px}.previous-edge{left:50%;top:0;width:40%;height:7px;transform:translateX(-50%);border-radius:0 0 8px 8px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent)}}
@media(max-width:380px){.page-content{padding:21px}.title{font-size:clamp(46px,15vw,64px)}}@media(prefers-reduced-motion:reduce){.page,.spine,.previous-edge,.contact{transition:none!important}}
</style>
</head>
<body>
<main class="app">
<section class="stage">
<button class="back" id="back" type="button" aria-label="Volver"><svg viewBox="0 0 28 28" fill="none"><path d="M23 14H5M11 8l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<div class="previous-edge" id="previousEdge" aria-hidden="true"></div>
<nav class="rail" id="rail" aria-label="Destinos"></nav>
</section>
<aside class="dock" aria-hidden="true"><div class="dock-window" id="dockWindow"></div></aside>
</main>
<div class="contact" id="contact"></div>
<script>
(()=>{
const tree={id:'root',children:[
{id:'design',title:'Design',children:[{id:'material',title:'Material',children:[{id:'surface',title:'Surface',url:'#surface'},{id:'inset',title:'Inset',url:'#inset'},{id:'control',title:'Control',url:'#control'}]},{id:'type',title:'Type',children:[{id:'display',title:'Display',url:'#display'},{id:'interface',title:'Interface',url:'#interface'},{id:'mono',title:'Mono',url:'#mono'}]},{id:'motion',title:'Motion',children:[{id:'press',title:'Press',url:'#press'},{id:'enter',title:'Enter',url:'#enter'},{id:'return',title:'Return',url:'#return'}]}]},
{id:'students',title:'Students',children:[{id:'jose',title:'José',children:[{id:'math',title:'Matemática',url:'https://juanmanuelpm.github.io/jose-study/'},{id:'physics',title:'Física',url:'#physics'},{id:'chem',title:'Química',url:'#chem'}]},{id:'sofi',title:'Sofi',url:'#sofi'},{id:'tadeo',title:'Tadeo',url:'#tadeo'}]},
{id:'tools',title:'Tools',children:[{id:'timer',title:'Timer',url:'#timer'},{id:'board',title:'Board',url:'#board'},{id:'notes',title:'Notes',url:'#notes'},{id:'player',title:'Player',url:'#player'}]},
{id:'projects',title:'Projects',children:[{id:'adriana',title:'Adriana',url:'#adriana'},{id:'prometeo',title:'Prometeo',url:'https://juanmanuelpm.github.io/prometeo/'},{id:'labs',title:'Labs',url:'#labs'}]},
{id:'calendar',title:'Calendar',children:[{id:'today',title:'Today',url:'#today'},{id:'week',title:'Week',url:'#week'},{id:'month',title:'Month',url:'#month'}]},
{id:'notes',title:'Notes',children:[{id:'capture',title:'Capture',url:'#capture'},{id:'recent',title:'Recent',url:'#recent'}]},
{id:'library',title:'Library',children:[{id:'files',title:'Files',url:'#files'},{id:'sources',title:'Sources',url:'#sources'}]},
{id:'studio',title:'Studio',children:[{id:'html',title:'HTML',url:'#html'},{id:'visual',title:'Visual',url:'#visual'}]},
{id:'archive',title:'Archive',children:[{id:'current',title:'Current',url:'#current'},{id:'history',title:'History',url:'#history'}]},
{id:'focus',title:'Focus',children:[{id:'session',title:'Session',url:'#session'},{id:'queue',title:'Queue',url:'#queue'}]},
{id:'music',title:'Music',children:[{id:'player2',title:'Player',url:'#player2'},{id:'sets',title:'Sets',url:'#sets'}]},
{id:'settings',title:'Settings',children:[{id:'appearance',title:'Appearance',url:'#appearance'},{id:'interaction',title:'Interaction',url:'#interaction'}]}
]};
const rail=document.getElementById('rail'),dock=document.getElementById('dockWindow'),back=document.getElementById('back'),prev=document.getElementById('previousEdge'),contact=document.getElementById('contact');
const frames=[{node:tree,active:0}];let pages=[],active=0,raf=0,drag=null,suppressClick=false;
const portrait=()=>matchMedia('(orientation:portrait) and (max-width:900px)').matches,reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches,frame=()=>frames.at(-1),nodes=()=>frame().node.children||[];
function render(){rail.innerHTML='';pages=[];active=Math.min(frame().active||0,Math.max(0,nodes().length-1));nodes().forEach((node,index)=>{const page=document.createElement('article');page.className='page';page.tabIndex=0;const content=document.createElement('div');content.className='page-content';const title=document.createElement('h1');title.className='title';title.textContent=node.title;const preview=document.createElement('div');preview.className='preview';(node.children||[]).slice(0,5).forEach(child=>{const line=document.createElement('div');line.className='preview-line';line.textContent=child.title;preview.appendChild(line)});const enter=document.createElement('button');enter.className='enter';enter.type='button';enter.setAttribute('aria-label','Entrar');enter.innerHTML='<svg viewBox="0 0 28 28" fill="none"><path d="M4 14h18M16 8l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';enter.addEventListener('click',e=>{e.stopPropagation();openNode(index)});page.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();openNode(index)}});content.append(title,preview);page.append(content,enter);rail.appendChild(page);pages.push(page)});back.classList.toggle('show',frames.length>1);requestAnimationFrame(()=>{apply();center(active,'auto')})}
function renderDock(){dock.innerHTML='';for(let offset=1;offset<=6;offset++){const node=nodes()[active+offset];if(!node)break;const spine=document.createElement('div');spine.className='spine';spine.style.setProperty('--shift',portrait()?`${Math.min(offset-1,5)*4}px`:`${Math.min(offset-1,5)*4}px`);const label=document.createElement('span');label.className='spine-label';label.textContent=node.title;spine.appendChild(label);dock.appendChild(spine)}}
function apply(){pages.forEach((p,i)=>{const d=Math.abs(i-active);p.classList.toggle('active',d===0);p.classList.toggle('near',d===1)});frame().active=active;prev.classList.toggle('show',active>0);renderDock()}
function center(index,behavior='smooth'){if(!pages.length)return;active=Math.max(0,Math.min(pages.length-1,index));apply();pages[active].scrollIntoView({behavior:reduced()?'auto':behavior,block:'center',inline:'center'})}
function measure(){if(!pages.length)return;const r=rail.getBoundingClientRect(),vertical=portrait(),mid=vertical?r.top+r.height/2:r.left+r.width/2;let best=active,dist=Infinity;pages.forEach((p,i)=>{const b=p.getBoundingClientRect(),c=vertical?b.top+b.height/2:b.left+b.width/2,d=Math.abs(c-mid);if(d<dist){dist=d;best=i}});if(best!==active){active=best;apply()}}
function req(){cancelAnimationFrame(raf);raf=requestAnimationFrame(measure)}
function openNode(index){const node=nodes()[index];frame().active=index;if(node.children?.length){frames.push({node,active:0});render();return}if(node.url&&!node.url.startsWith('#')){location.href=node.url;return}pages[index]?.animate?.([{transform:'scale(1)'},{transform:'scale(.991)'},{transform:'scale(1)'}],{duration:180,easing:'cubic-bezier(.2,.8,.2,1)'})}
function goBack(){if(frames.length<=1)return;frames.pop();render()}
rail.addEventListener('scroll',req,{passive:true});back.addEventListener('click',goBack);addEventListener('resize',req,{passive:true});
rail.addEventListener('pointerdown',e=>{contact.style.left=e.clientX+'px';contact.style.top=e.clientY+'px';if(e.pointerType==='mouse'||e.pointerType==='pen'){contact.classList.add('show');drag={id:e.pointerId,x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,left:rail.scrollLeft,top:rail.scrollTop,index:active,moved:false};try{rail.setPointerCapture(e.pointerId)}catch{}}},{passive:true});
rail.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;contact.style.left=e.clientX+'px';contact.style.top=e.clientY+'px';drag.lastX=e.clientX;drag.lastY=e.clientY;const dx=e.clientX-drag.x,dy=e.clientY-drag.y,d=portrait()?Math.abs(dy):Math.abs(dx);if(!drag.moved&&d>5)drag.moved=true;if(!drag.moved)return;if(portrait())rail.scrollTop=drag.top-dy;else rail.scrollLeft=drag.left-dx},{passive:true});
function endDrag(e){if(!drag||e.pointerId!==drag.id)return;const finished=drag;suppressClick=finished.moved;if(suppressClick)setTimeout(()=>suppressClick=false,260);drag=null;contact.classList.remove('show');if(finished.moved){const delta=portrait()?finished.lastY-finished.y:finished.lastX-finished.x;if(Math.abs(delta)>48)center(finished.index+(delta<0?1:-1));else center(finished.index)}};rail.addEventListener('pointerup',endDrag,{passive:true});rail.addEventListener('pointercancel',endDrag,{passive:true});rail.addEventListener('click',e=>{if(suppressClick){e.preventDefault();e.stopPropagation()}},true);
rail.addEventListener('wheel',e=>{if(portrait())return;if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){rail.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
addEventListener('keydown',e=>{const p=portrait()?'ArrowUp':'ArrowLeft',n=portrait()?'ArrowDown':'ArrowRight';if(e.key===p){e.preventDefault();center(active-1)}if(e.key===n){e.preventDefault();center(active+1)}if(e.key==='Enter'){e.preventDefault();openNode(active)}if(e.key==='Escape'){e.preventDefault();goBack()}});
render();
})();
</script>
<script type="module" src="/prometeo/shared/prometeo-shell/v3/prometeo-shell.js?v=3" data-prometeo-shell></script>
</body>
</html>
