<!doctype html>
<html lang="es" data-p-material="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prometeo · Universal Scroll Shell V2</title>
<link rel="stylesheet" href="https://juanmanuelpm.github.io/prometeo/shared/material/v1/material.css">
<style>
:root{--bg:#171816;--ink:#ece9df;--muted:#666860;--near:#9b9c93;--accent:#d0b273;--arrow-x:clamp(20px,6vw,72px);--text-x:clamp(92px,14vw,170px);--row-h:clamp(86px,12vh,118px);--font-ui:"Century Gothic","Avenir Next",Avenir,Futura,system-ui,sans-serif}*{box-sizing:border-box}html{background:var(--bg);color:var(--ink);scroll-snap-type:y proximity;scrollbar-width:none}html::-webkit-scrollbar{display:none}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 18% 8%,rgba(255,255,255,.032),transparent 28%),linear-gradient(145deg,#191a18 0%,#121310 100%);color:var(--ink);font-family:var(--font-ui)}button,a{font:inherit;color:inherit}.chrome{position:fixed;inset:0;z-index:20;pointer-events:none}.brand,.count{position:absolute;top:max(22px,env(safe-area-inset-top));font-size:11px;letter-spacing:.16em;text-transform:uppercase}.brand{left:var(--arrow-x)}.count{right:clamp(20px,6vw,72px);color:var(--pm-muted,#9a9a91);letter-spacing:.08em}.selector{position:absolute;left:var(--arrow-x);top:50%;width:52px;height:52px;transform:translateY(-50%);border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--pm-surface,#20211e);box-shadow:var(--pm-bevel,inset 1px 1px rgba(255,255,255,.055),inset -1px -1px rgba(0,0,0,.55)),var(--pm-raised-soft,-7px -7px 16px rgba(255,255,255,.032),7px 7px 16px rgba(0,0,0,.30))}.selector svg{width:25px;height:25px;display:block}.scroll-hint{position:absolute;left:var(--arrow-x);bottom:max(22px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:9px;color:var(--pm-muted,#9a9a91);font-size:10px}.scroll-hint::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px rgba(208,178,115,.05)}.menu{width:100%;padding-top:calc(50vh - var(--row-h)/2);padding-bottom:calc(50vh - var(--row-h)/2)}.destination{display:flex;align-items:center;min-height:var(--row-h);padding:10px clamp(20px,6vw,72px) 10px var(--text-x);text-decoration:none;scroll-snap-align:center;scroll-margin-block:2vh;outline:none;color:var(--muted);opacity:.28;transition:opacity .22s cubic-bezier(.2,.8,.2,1),color .22s cubic-bezier(.2,.8,.2,1)}.label{display:block;max-width:min(76vw,820px);padding:.08em 0 .14em;font-size:clamp(38px,7.2vw,78px);font-weight:560;line-height:1.08;letter-spacing:-.055em;overflow:visible;text-wrap:balance;transform-origin:left center;transition:transform .22s cubic-bezier(.2,.8,.2,1),font-weight .22s cubic-bezier(.2,.8,.2,1),text-shadow .22s cubic-bezier(.2,.8,.2,1)}.destination.near{opacity:.58;color:var(--near)}.destination.active{opacity:1;color:var(--ink)}.destination.active .label{transform:translateX(10px);font-weight:650;text-shadow:0 10px 28px rgba(0,0,0,.18)}.destination:focus-visible .label{outline:2px solid color-mix(in srgb,var(--ink) 34%,transparent);outline-offset:8px;border-radius:8px}.destination:active .label{transform:translateX(12px) scale(.992)}@media(max-width:640px){:root{--arrow-x:18px;--text-x:84px;--row-h:clamp(78px,11.5vh,104px)}.selector{width:46px;height:46px}.selector svg{width:22px;height:22px}.destination{padding-right:18px}.label{max-width:calc(100vw - var(--text-x) - 18px);font-size:clamp(34px,12vw,58px);line-height:1.1;letter-spacing:-.05em}.brand,.count{font-size:9px}.scroll-hint{font-size:9px}}@media(prefers-reduced-motion:reduce){html{scroll-snap-type:none}.destination,.label{transition:none!important}}
</style>
</head>
<body>
<div class="chrome" aria-hidden="true"><div class="brand">Prometeo</div><div class="count"><span id="n">01</span> / <span id="total">01</span></div><div class="selector"><svg viewBox="0 0 28 28" fill="none"><path d="M3.5 14H23.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M17.5 7.5L24 14L17.5 20.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="scroll-hint">Scroll</div></div>
<nav class="menu" id="menu" aria-label="Destinos"></nav>
<script>(()=>{const destinations=[{id:"design",label:"Design",url:"https://juanmanuelpm.github.io/prometeo/design/"},{id:"students",label:"Students",url:"#students"},{id:"tools",label:"Tools",url:"#tools"},{id:"calendar",label:"Calendar",url:"#calendar"},{id:"projects",label:"Projects",url:"#projects"},{id:"notes",label:"Notes",url:"#notes"},{id:"prometeo",label:"Prometeo",url:"https://juanmanuelpm.github.io/prometeo/"}];const menu=document.getElementById("menu"),n=document.getElementById("n"),total=document.getElementById("total");total.textContent=String(destinations.length).padStart(2,"0");for(const d of destinations){const a=document.createElement("a");a.className="destination";a.href=d.url;a.dataset.id=d.id;const span=document.createElement("span");span.className="label";span.textContent=d.label;a.appendChild(span);menu.appendChild(a)}const items=[...menu.querySelectorAll(".destination")];let active=0,raf=0;function measure(){const center=innerHeight/2;let best=0,distance=Infinity;items.forEach((item,index)=>{const r=item.getBoundingClientRect(),d=Math.abs((r.top+r.height/2)-center);if(d<distance){distance=d;best=index}});if(best===active&&items[active]?.classList.contains("active"))return;active=best;items.forEach((item,index)=>{const delta=Math.abs(index-active);item.classList.toggle("active",delta===0);item.classList.toggle("near",delta===1);if(delta===0)item.setAttribute("aria-current","page");else item.removeAttribute("aria-current")});n.textContent=String(active+1).padStart(2,"0")}function requestMeasure(){cancelAnimationFrame(raf);raf=requestAnimationFrame(measure)}addEventListener("scroll",requestMeasure,{passive:true});addEventListener("resize",requestMeasure,{passive:true});addEventListener("keydown",event=>{if(event.metaKey||event.ctrlKey||event.altKey)return;if(event.key==="ArrowDown"||event.key==="ArrowUp"){event.preventDefault();const next=event.key==="ArrowDown"?Math.min(items.length-1,active+1):Math.max(0,active-1);items[next].scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"});items[next].focus({preventScroll:true})}if(event.key==="Enter"){const current=items[active];if(current&&current.href&&!current.getAttribute("href").startsWith("#"))current.click()}});requestAnimationFrame(()=>{items[0].scrollIntoView({behavior:"auto",block:"center"});requestMeasure()})})();</script>
</body></html>
