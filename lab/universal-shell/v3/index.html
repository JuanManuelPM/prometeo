<!doctype html>
<html lang="es" data-p-material="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prometeo · Universal Focus Rail V3</title>
<link rel="stylesheet" href="https://juanmanuelpm.github.io/prometeo/shared/material/v1/material.css">
<style>
:root{
--bg:#171816;
--ink:#ece9df;
--muted:#7e8078;
--near:#a6a79e;
--accent:#cfb274;
--ease:cubic-bezier(.2,.8,.2,1);
--pad:clamp(16px,3vw,34px);
--font:"Century Gothic","Avenir Next",Avenir,Futura,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{
margin:0;
min-height:100%;
background:var(--bg);
color:var(--ink);
font-family:var(--font);
}
body{
min-height:100vh;
overflow:hidden;
background:
radial-gradient(circle at 18% 7%,rgba(255,255,255,.03),transparent 27%),
linear-gradient(145deg,#191a18,#121310);
}
button,a{font:inherit;color:inherit}
.app{
min-height:100vh;
display:grid;
grid-template-rows:auto 1fr auto;
gap:14px;
padding:max(16px,env(safe-area-inset-top)) var(--pad) max(16px,env(safe-area-inset-bottom));
}
.top{
min-height:50px;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
position:relative;
z-index:10;
}
.brand{
font-size:11px;
letter-spacing:.16em;
text-transform:uppercase;
}
.path{
min-width:0;
margin-left:auto;
font-size:10px;
color:var(--muted);
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}
.back{
display:none;
width:42px;
height:42px;
place-items:center;
cursor:pointer;
}
.back.show{display:grid}
.back svg{width:18px;height:18px}
.stage{
min-height:0;
overflow:hidden;
position:relative;
}
.rail{
width:100%;
height:100%;
display:flex;
gap:12px;
overflow-x:auto;
overflow-y:hidden;
scroll-snap-type:x mandatory;
scroll-padding-inline:6%;
overscroll-behavior-x:contain;
scrollbar-width:none;
-webkit-overflow-scrolling:touch;
padding:2% 6%;
}
.rail::-webkit-scrollbar{display:none}
.card{
flex:0 0 84%;
min-width:0;
height:96%;
scroll-snap-align:center;
scroll-snap-stop:always;
border:0;
position:relative;
overflow:hidden;
text-align:left;
padding:clamp(24px,4vw,54px);
border-radius:clamp(26px,3vw,40px);
color:var(--muted);
opacity:.34;
transform:scale(.975);
background:
linear-gradient(145deg,rgba(255,255,255,.022),rgba(0,0,0,.01)),
var(--pm-surface,#20211e);
box-shadow:
var(--pm-bevel,inset 1px 1px rgba(255,255,255,.055),inset -1px -1px rgba(0,0,0,.55)),
var(--pm-raised-soft,-7px -7px 16px rgba(255,255,255,.032),7px 7px 16px rgba(0,0,0,.30));
transition:
opacity .22s var(--ease),
transform .22s var(--ease),
color .22s var(--ease);
}
.card.active{
color:var(--ink);
opacity:1;
transform:scale(1);
}
.card.near{
opacity:.58;
color:var(--near);
}
.card:active{
transform:scale(.993);
box-shadow:
var(--pm-inset,inset 5px 5px 10px rgba(0,0,0,.42),inset -5px -5px 10px rgba(255,255,255,.045));
}
.index{
font-size:10px;
color:var(--muted);
letter-spacing:.10em;
}
.title{
margin:clamp(26px,6vh,70px) 0 0;
font-size:clamp(48px,8vw,104px);
line-height:.92;
letter-spacing:-.065em;
font-weight:560;
max-width:9ch;
overflow:visible;
}
.preview{
position:absolute;
left:clamp(24px,4vw,54px);
bottom:clamp(28px,5vh,54px);
right:clamp(96px,10vw,150px);
display:grid;
gap:8px;
opacity:0;
transform:translateY(8px);
transition:opacity .20s var(--ease),transform .20s var(--ease);
}
.active .preview{
opacity:1;
transform:none;
}
.preview-line{
font-size:clamp(15px,2vw,22px);
color:var(--near);
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
.enter{
position:absolute;
right:clamp(22px,3vw,38px);
bottom:clamp(22px,3vw,38px);
width:56px;
height:56px;
border:0;
display:grid;
place-items:center;
cursor:pointer;
}
.enter svg{width:24px;height:24px}
.enter[hidden]{display:none}
.edge{
position:absolute;
top:50%;
transform:translateY(-50%);
z-index:8;
pointer-events:none;
width:20px;
height:46%;
opacity:.28;
}
.edge.left{left:1px}
.edge.right{right:1px}
.edge::before,
.edge::after{
content:"";
position:absolute;
top:0;
bottom:0;
width:3px;
border-radius:999px;
background:linear-gradient(180deg,transparent,rgba(255,255,255,.22),transparent);
}
.edge::before{left:2px}
.edge::after{left:10px;opacity:.55}
.bottom{
min-height:46px;
display:flex;
align-items:center;
justify-content:space-between;
gap:14px;
color:var(--muted);
font-size:10px;
}
.position{
display:flex;
align-items:center;
gap:8px;
}
.position::before{
content:"";
width:7px;
height:7px;
border-radius:50%;
background:var(--accent);
box-shadow:0 0 0 5px rgba(207,178,116,.05);
}
kbd{
border:0;
background:transparent;
color:inherit;
font:inherit;
}
@media(max-width:720px){
body{overflow:auto}
.app{
min-height:100vh;
display:block;
padding:0;
}
.top{
position:fixed;
top:0;
left:0;
right:0;
height:64px;
padding:max(12px,env(safe-area-inset-top)) 16px 8px;
background:linear-gradient(var(--bg) 72%,transparent);
pointer-events:none;
}
.top > *{pointer-events:auto}
.brand{font-size:9px}
.path{font-size:9px}
.stage{
overflow:visible;
}
.rail{
display:block;
height:auto;
overflow:visible;
scroll-snap-type:y proximity;
padding:
calc(20vh + 54px)
14px
22vh;
}
.card{
width:100%;
height:68vh;
min-height:430px;
max-height:620px;
margin:0 0 12px;
padding:24px;
scroll-snap-align:center;
transform:scale(.985);
border-radius:30px;
}
.card.active{transform:scale(1)}
.title{
margin-top:clamp(42px,8vh,74px);
font-size:clamp(48px,15vw,76px);
max-width:8ch;
line-height:.94;
}
.preview{
left:24px;
right:90px;
bottom:30px;
}
.preview-line{
font-size:17px;
}
.enter{
right:22px;
bottom:22px;
width:54px;
height:54px;
}
.edge{
position:fixed;
left:50%!important;
right:auto!important;
width:42%;
height:18px;
transform:translateX(-50%);
}
.edge.left{top:69px}
.edge.right{top:auto;bottom:18px}
.edge::before,
.edge::after{
left:0;
right:0;
width:auto;
height:3px;
top:2px;
bottom:auto;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.20),transparent);
}
.edge::after{top:10px;left:12%;right:12%}
.bottom{
position:fixed;
left:16px;
right:16px;
bottom:max(8px,env(safe-area-inset-bottom));
z-index:12;
pointer-events:none;
}
.bottom .keys{display:none}
}
@media(max-width:360px){
.card{padding:20px}
.title{
font-size:clamp(42px,14vw,56px);
max-width:100%;
overflow-wrap:anywhere;
}
.preview{left:20px;right:80px}
}
@media(prefers-reduced-motion:reduce){
.rail{scroll-behavior:auto}
.card,.preview{transition:none!important}
}
</style>
</head>
<body>
<main class="app">
<header class="top">
<button class="back p-control" id="back" type="button" aria-label="Volver">
<svg viewBox="0 0 24 24" fill="none">
<path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
</button>
<div class="brand">Prometeo</div>
<div class="path" id="path">Root</div>
</header>
<section class="stage">
<div class="edge left"></div>
<div class="edge right"></div>
<nav class="rail" id="rail" aria-label="Destinos"></nav>
</section>
<footer class="bottom">
<div class="position"><span id="position">01 / 05</span></div>
<div class="keys"><kbd>Scroll</kbd> · <kbd>← →</kbd> · <kbd>Enter</kbd></div>
</footer>
</main>
<script>
(() => {
const tree = {
id:"root",
title:"Root",
children:[
{
id:"design",
title:"Design",
preview:["Material","Type","Motion"],
children:[
{id:"material",title:"Material",preview:["Surface","Inset","Control"],url:"https://juanmanuelpm.github.io/prometeo/design/"},
{id:"type",title:"Type",preview:["Display","Interface","Mono"],url:"#type"},
{id:"motion",title:"Motion",preview:["Press","Enter","Back"],url:"#motion"}
]
},
{
id:"students",
title:"Students",
preview:["José","Sofi","Tadeo"],
children:[
{id:"jose",title:"José",preview:["Matemática","Física","Química"],children:[
{id:"jose-math",title:"Matemática",preview:["Continuar"],url:"https://juanmanuelpm.github.io/jose-study/"},
{id:"jose-physics",title:"Física",preview:["Próxima sesión"],url:"#jose-fisica"},
{id:"jose-chem",title:"Química",preview:["Ejercicios"],url:"#jose-quimica"}
]},
{id:"sofi",title:"Sofi",preview:["Estudio"],url:"#sofi"},
{id:"tadeo",title:"Tadeo",preview:["Estudio"],url:"#tadeo"}
]
},
{
id:"tools",
title:"Tools",
preview:["Timer","Board","Notes"],
children:[
{id:"timer",title:"Timer",preview:["25 min"],url:"#timer"},
{id:"board",title:"Board",preview:["PageKit"],url:"#board"},
{id:"notes",title:"Notes",preview:["Captura"],url:"#notes"}
]
},
{
id:"projects",
title:"Projects",
preview:["Adriana","Prometeo","Labs"],
children:[
{id:"adriana",title:"Adriana",preview:["Portfolio"],url:"#adriana"},
{id:"prometeo",title:"Prometeo",preview:["Living","Design"],url:"https://juanmanuelpm.github.io/prometeo/"},
{id:"labs",title:"Labs",preview:["Experiments"],url:"#labs"}
]
},
{
id:"calendar",
title:"Calendar",
preview:["Today","Week"],
url:"#calendar"
}
]
};
const rail = document.getElementById("rail");
const position = document.getElementById("position");
const pathEl = document.getElementById("path");
const back = document.getElementById("back");
const stack = [{node:tree,active:0}];
let items = [];
let active = 0;
let raf = 0;
const prefersReduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const isMobile = () => matchMedia("(max-width:720px)").matches;
function currentFrame(){ return stack[stack.length-1]; }
function render(){
const frame = currentFrame();
const children = frame.node.children || [];
rail.innerHTML = "";
items = [];
active = Math.max(0,Math.min(frame.active || 0,children.length-1));
children.forEach((node,index) => {
const article = document.createElement("article");
article.className = "card";
article.tabIndex = 0;
article.dataset.index = index;
const idx = document.createElement("div");
idx.className = "index";
idx.textContent = String(index+1).padStart(2,"0");
const title = document.createElement("div");
title.className = "title";
title.textContent = node.title;
const preview = document.createElement("div");
preview.className = "preview";
(node.preview || []).slice(0,3).forEach(text => {
const line = document.createElement("div");
line.className = "preview-line";
line.textContent = text;
preview.appendChild(line);
});
const enter = document.createElement("button");
enter.type = "button";
enter.className = "enter p-control";
enter.setAttribute("aria-label","Entrar en " + node.title);
enter.innerHTML = '<svg viewBox="0 0 28 28" fill="none"><path d="M4 14h18M16 8l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
enter.addEventListener("click",event => {
event.stopPropagation();
activateNode(index);
});
article.addEventListener("click",() => {
if(index === active) activateNode(index);
else center(index);
});
article.addEventListener("keydown",event => {
if(event.key === "Enter"){
event.preventDefault();
activateNode(index);
}
});
article.append(idx,title,preview,enter);
rail.appendChild(article);
items.push(article);
});
const path = stack.slice(1).map(x => x.node.title);
pathEl.textContent = path.length ? path.join(" / ") : "Root";
back.classList.toggle("show",stack.length > 1);
requestAnimationFrame(() => {
updateClasses();
center(active,"auto");
});
}
function activateNode(index){
const frame = currentFrame();
const node = frame.node.children[index];
frame.active = index;
if(node.children && node.children.length){
stack.push({node,active:0});
render();
return;
}
if(node.url && !node.url.startsWith("#")){
location.href = node.url;
return;
}
const card = items[index];
card.animate(
[{transform:"scale(1)"},{transform:"scale(.988)"},{transform:"scale(1)"}],
{duration:180,easing:"cubic-bezier(.2,.8,.2,1)"}
);
}
function center(index,behavior="smooth"){
const item = items[index];
if(!item) return;
item.scrollIntoView({
behavior: prefersReduced() ? "auto" : behavior,
block:"center",
inline:"center"
});
}
function measure(){
if(!items.length) return;
const stage = rail.getBoundingClientRect();
const axisCenter = isMobile()
? innerHeight/2
: stage.left + stage.width/2;
let best = 0;
let bestDistance = Infinity;
items.forEach((item,index) => {
const r = item.getBoundingClientRect();
const center = isMobile()
? r.top + r.height/2
: r.left + r.width/2;
const d = Math.abs(center-axisCenter);
if(d < bestDistance){
bestDistance = d;
best = index;
}
});
if(best !== active){
active = best;
currentFrame().active = active;
updateClasses();
}
}
function updateClasses(){
items.forEach((item,index) => {
const d = Math.abs(index-active);
item.classList.toggle("active",d===0);
item.classList.toggle("near",d===1);
if(d===0) item.setAttribute("aria-current","page");
else item.removeAttribute("aria-current");
});
position.textContent =
String(active+1).padStart(2,"0") +
" / " +
String(items.length).padStart(2,"0");
}
function requestMeasure(){
cancelAnimationFrame(raf);
raf = requestAnimationFrame(measure);
}
rail.addEventListener("scroll",requestMeasure,{passive:true});
addEventListener("scroll",requestMeasure,{passive:true});
addEventListener("resize",requestMeasure,{passive:true});
back.addEventListener("click",() => {
if(stack.length <= 1) return;
stack.pop();
render();
});
addEventListener("keydown",event => {
if(event.metaKey || event.ctrlKey || event.altKey) return;
if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName)) return;
const prevKey = isMobile() ? "ArrowUp" : "ArrowLeft";
const nextKey = isMobile() ? "ArrowDown" : "ArrowRight";
if(event.key === prevKey || event.key === nextKey){
event.preventDefault();
const next = event.key === nextKey
? Math.min(items.length-1,active+1)
: Math.max(0,active-1);
active = next;
currentFrame().active = active;
updateClasses();
center(active);
items[active]?.focus({preventScroll:true});
}
if(event.key === "Enter"){
event.preventDefault();
activateNode(active);
}
if(event.key === "Escape" && stack.length > 1){
event.preventDefault();
stack.pop();
render();
}
});
render();
})();
</script>
</body>
</html>
