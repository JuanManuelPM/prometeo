<!doctype html>
<html lang="es" data-p-material="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prometeo · Universal Scroll Menu</title>
<link rel="stylesheet" href="https://juanmanuelpm.github.io/prometeo/shared/material/v1/material.css">
<style>
:root{--menu-bg:#171816;--menu-text:#ece9df;--menu-muted:#72736d;--menu-accent:#d1b47a;--menu-width:760px}*{box-sizing:border-box}html{background:var(--menu-bg);color:var(--menu-text);scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 24% 8%,rgba(255,255,255,.035),transparent 24%),linear-gradient(145deg,#191a18,#121310);color:var(--menu-text);font-family:"Century Gothic","Avenir Next",Avenir,Futura,system-ui,sans-serif;overflow-x:hidden}button,a{font:inherit;color:inherit}.shell{width:min(var(--menu-width),100%);min-height:100vh;margin:0 auto;padding:18px 16px 24px;display:flex;flex-direction:column}.topbar{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:4px 2px 12px}.brand{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.92}.counter{font-size:11px;letter-spacing:.08em;color:var(--pm-muted,var(--menu-muted))}.viewport{position:relative;flex:1;min-height:0;display:flex;align-items:center}.viewport::before,.viewport::after{content:"";position:absolute;left:0;right:0;height:22%;z-index:5;pointer-events:none}.viewport::before{top:0;background:linear-gradient(var(--menu-bg),transparent)}.viewport::after{bottom:0;background:linear-gradient(transparent,var(--menu-bg))}.menu{width:100%;height:min(72vh,620px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-snap-type:y proximity;padding:34vh 6px}.menu::-webkit-scrollbar{display:none}.item{display:block;width:100%;text-decoration:none;scroll-snap-align:center;scroll-margin-block:20px;position:relative;min-height:88px;padding:10px 8px;color:var(--menu-muted);opacity:.36;transform:scale(.94);transform-origin:left center;transition:color .24s cubic-bezier(.2,.8,.2,1),opacity .24s cubic-bezier(.2,.8,.2,1),transform .24s cubic-bezier(.2,.8,.2,1)}.item-inner{min-height:68px;display:flex;align-items:center;gap:18px;border-radius:24px;padding:0 18px;transition:background .24s cubic-bezier(.2,.8,.2,1),box-shadow .24s cubic-bezier(.2,.8,.2,1),transform .16s cubic-bezier(.2,.8,.2,1)}.item-name{font-size:clamp(34px,8vw,70px);line-height:.96;letter-spacing:-.055em;font-weight:600;white-space:nowrap}.arrow{width:0;overflow:hidden;opacity:0;font-size:clamp(30px,6vw,54px);line-height:1;transition:width .24s cubic-bezier(.2,.8,.2,1),opacity .24s cubic-bezier(.2,.8,.2,1),transform .24s cubic-bezier(.2,.8,.2,1);transform:translateX(-8px)}.item.active{color:var(--menu-text);opacity:1;transform:scale(1)}.item.active .item-inner{background:linear-gradient(145deg,rgba(255,255,255,.03),rgba(0,0,0,.012)),var(--pm-surface,#20211e);box-shadow:var(--pm-bevel,inset 1px 1px rgba(255,255,255,.055),inset -1px -1px rgba(0,0,0,.55)),var(--pm-raised-soft,-7px -7px 16px rgba(255,255,255,.032),7px 7px 16px rgba(0,0,0,.30))}.item.active .arrow{width:48px;opacity:1;transform:translateX(0);color:var(--menu-accent)}.item:active .item-inner{transform:scale(.992) translateY(1px);box-shadow:var(--pm-inset,inset 5px 5px 10px rgba(0,0,0,.42),inset -5px -5px 10px rgba(255,255,255,.045))}.item.near{opacity:.60;transform:scale(.975);color:#aaa99f}.footer{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 2px 0;color:var(--pm-muted,var(--menu-muted));font-size:10px;letter-spacing:.04em}.hint{display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;border-radius:50%;background:var(--menu-accent);box-shadow:0 0 0 5px rgba(209,180,122,.05)}@media(max-width:640px){.shell{padding:14px 12px 18px}.menu{height:76vh;padding:36vh 2px}.item{min-height:78px;padding:6px 2px}.item-inner{min-height:64px;border-radius:22px;padding:0 14px;gap:12px}.item-name{font-size:clamp(38px,13vw,60px)}.item.active .arrow{width:40px}.footer{font-size:9px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.item,.item-inner,.arrow{transition:none!important}}
</style>
</head>
<body><main class="shell"><header class="topbar"><div class="brand">Prometeo</div><div class="counter"><span id="currentIndex">01</span> / <span id="totalCount">07</span></div></header><section class="viewport" aria-label="Destinos"><nav class="menu" id="menu"><a class="item" href="#design" data-id="design"><span class="item-inner"><span class="arrow">→</span><span class="item-name">Design</span></span></a><a class="item" href="#students" data-id="students"><span class="item-inner"><span class="arrow">→</span><span class="item-name">Students</span></span></a><a class="item" href="#tools" data-id="tools"><span class="item-inner"><span class="arrow">→</span><span class="item-name">Tools</span></span></a><a class="item" href="#calendar" data-id="calendar"><span class="item-inner"><span class="arrow">→</span><span class="item-name">Calendar</span></span></a><a class="item" href="#projects" data-id="projects"><span class="item-inner"><span class="arrow">→</span><span class="item-name">Projects</span></span></a><a class="item" href="#notes" data-id="notes"><span class="item-inner"><span class="arrow">→</span><span class="item-name">Notes</span></span></a><a class="item" href="#prometeo" data-id="prometeo"><span class="item-inner"><span class="arrow">→</span><span class="item-name">Prometeo</span></span></a></nav></section><footer class="footer"><div class="hint"><span class="dot"></span><span>Scroll</span></div><div>Tap / Enter</div></footer></main><script>(()=>{const menu=document.getElementById('menu');const items=[...menu.querySelectorAll('.item')];const currentIndex=document.getElementById('currentIndex');const totalCount=document.getElementById('totalCount');totalCount.textContent=String(items.length).padStart(2,'0');let active=0;let raf=0;function centerItem(index,behavior='smooth'){items[index]?.scrollIntoView({block:'center',behavior})}function updateActive(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{const box=menu.getBoundingClientRect();const center=box.top+box.height/2;let bestIndex=0;let bestDistance=Infinity;items.forEach((item,index)=>{const r=item.getBoundingClientRect();const itemCenter=r.top+r.height/2;const d=Math.abs(itemCenter-center);if(d<bestDistance){bestDistance=d;bestIndex=index}});if(bestIndex===active&&items[active]?.classList.contains('active'))return;active=bestIndex;items.forEach((item,index)=>{item.classList.toggle('active',index===active);item.classList.toggle('near',Math.abs(index-active)===1);item.setAttribute('aria-current',index===active?'page':'false')});currentIndex.textContent=String(active+1).padStart(2,'0')})}menu.addEventListener('scroll',updateActive,{passive:true});window.addEventListener('resize',updateActive,{passive:true});menu.addEventListener('keydown',event=>{if(event.key==='ArrowDown'){event.preventDefault();active=Math.min(items.length-1,active+1);centerItem(active);items[active].focus({preventScroll:true})}if(event.key==='ArrowUp'){event.preventDefault();active=Math.max(0,active-1);centerItem(active);items[active].focus({preventScroll:true})}if(event.key==='Enter'){const el=document.activeElement?.closest?.('.item');if(el){event.preventDefault();pulse(el)}}});function pulse(el){const inner=el.querySelector('.item-inner');inner.animate([{transform:'scale(1)'},{transform:'scale(.985) translateY(1px)'},{transform:'scale(1)'}],{duration:180,easing:'cubic-bezier(.2,.8,.2,1)'})}items.forEach((item,index)=>{item.addEventListener('click',event=>{event.preventDefault();if(index!==active){active=index;centerItem(index);updateActive()}else{pulse(item)}})});requestAnimationFrame(()=>{active=1;centerItem(active,'auto');updateActive()})})();</script></body></html>
