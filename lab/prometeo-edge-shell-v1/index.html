<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prometeo — Edge Shell Candidate</title>
<link rel="stylesheet" href="../../shared/navigation/edge-stack/v1/edge-stack.css">
<style>
:root{--page:#DED4C6}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--page)}
body{font-family:Arial,sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 14%,rgba(255,255,255,.33),transparent 34%),radial-gradient(circle at 82% 78%,rgba(76,61,25,.065),transparent 38%),repeating-linear-gradient(0deg,rgba(76,61,25,.017) 0,rgba(76,61,25,.017) 1px,transparent 1px,transparent 4px),repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 1px,transparent 5px);mix-blend-mode:multiply;opacity:.72}
main{position:relative;width:100%;height:100%;padding:clamp(8px,2.4vw,30px);display:grid;place-items:center}
#prometeo-nav{width:min(96vw,1180px);height:min(92dvh,800px);min-height:420px}
@media(max-width:600px){main{padding:7px}#prometeo-nav{width:100%;height:calc(100dvh - 14px);min-height:0}}
</style>
</head>
<body>
<main><div id="prometeo-nav"></div></main>
<script src="../../shared/navigation/edge-stack/v1/edge-stack.js"></script>
<script>
(async()=>{
  const fallback=[
    {id:'prometeo',title:'Prometeo',url:'../../'},
    {id:'jose-study',title:'José',url:'https://juanmanuelpm.github.io/jose-study/'},
    {id:'arte-mama',title:'Arte',url:'../../arte/'},
    {id:'prometeo-workspace',title:'Workspace',url:'https://prometeo-live-hub.vercel.app/app'}
  ];

  let items=fallback;
  try{
    const response=await fetch('../../projects.json',{cache:'no-store'});
    if(response.ok){
      const catalog=await response.json();
      const projects=Array.isArray(catalog.projects) ? catalog.projects : [];
      const mapped=projects.filter(p=>p && p.title).map(p=>({
        id:p.id,
        title:p.title,
        url:p.id==='prometeo-current' ? '../../' : p.public_url
      }));
      if(mapped.length) items=mapped;
    }
  }catch{}

  PrometeoEdgeStack.create(document.querySelector('#prometeo-nav'),{
    items,
    side:'left',
    loop:true
  });
})();
</script>
<script type="module" src="/prometeo/shared/prometeo-shell/v3/prometeo-shell.js?v=3" data-prometeo-shell></script>
</body>
</html>
