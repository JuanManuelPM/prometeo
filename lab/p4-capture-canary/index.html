<title>Prometeo Capture · Canary</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8dece;font-family:Arial,Helvetica,sans-serif}#prometeoFrame{display:block;width:100%;height:100%;border:0;background:#e8dece}#p4Bar{position:fixed;z-index:2147483646;left:50%;top:max(6px,env(safe-area-inset-top));transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:rgba(23,28,33,.82);color:#e8dece;font:700 10px/1 Arial;letter-spacing:.04em;backdrop-filter:blur(8px);pointer-events:auto}#p4Bar button{appearance:none;border:0;background:transparent;color:inherit;font:900 10px Arial;padding:3px 4px}#p4Dispatch{position:fixed;z-index:2147483647;inset:auto 12px max(12px,env(safe-area-inset-bottom));margin:auto;max-width:560px;padding:14px;border-radius:22px;background:#dce5ea;color:#172027;box-shadow:0 15px 50px rgba(0,0,0,.28)}#p4Dispatch textarea{width:100%;height:92px;resize:none;border:1px solid rgba(23,32,39,.2);border-radius:14px;background:#eef3f5;padding:10px;color:#172027;font:700 12px/1.4 monospace}#p4Dispatch .r{display:flex;gap:8px;margin-top:8px}#p4Dispatch button{flex:1;min-height:42px;border:1px solid rgba(23,32,39,.25);border-radius:14px;background:#dce5ea;color:#172027;font:900 12px Arial}#p4CloseDispatch{max-width:48px}#p4Dispatch[hidden]{display:none}</style>
</head>
<body>
<iframe id="prometeoFrame" title="Prometeo Navigator" src="/prometeo/navigator/?prometeo=0&p4-canary=1" allow="microphone"></iframe>
<div id="p4Bar"><span>CAPTURE CANDIDATE</span><span id="p4Status">cargando</span><button id="p4Diag" type="button">diag</button></div>
<section id="p4Dispatch" hidden>
  <textarea id="p4DispatchText" readonly></textarea>
  <div class="r"><button id="p4Copy" type="button">Copiar patente</button><button id="p4Chat" type="button">Abrir ChatGPT</button><button id="p4CloseDispatch" type="button">×</button></div>
</section>
<script src="./shared/core/v1/durable.js"></script>
<script src="./shared/workflow/v1/workflow.js"></script>
<script src="./shared/runtime/ownership/v1/ownership.js"></script>
<script type="module" src="./shared/capture/v1/canary-app.js"></script>
</body>
</html>
