<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050607">
<title>Prometeo · Llegada</title>
<style>
:root{--bg:#050607;--fg:#f5f7f8;--muted:#7f8992;--off:#171b20;--green:#51e27a;--yellow:#ffd34d;--red:#ff5f63;--line:#252b32}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;justify-content:center}
main{width:min(1100px,100%);min-height:100vh;padding:clamp(20px,4vw,48px) clamp(16px,4vw,48px) 50px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;gap:14px;align-items:center}
.kicker{font:700 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.live{font:700 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8fa0ac}
.hero{margin:auto 0;padding:5vh 0 4vh}
.percent{font-size:clamp(118px,30vw,310px);font-weight:950;letter-spacing:-.105em;line-height:.72}
.percent span{font-size:.22em;letter-spacing:-.02em;color:var(--muted);margin-left:.03em}
.track{height:clamp(24px,4vw,42px);margin-top:clamp(30px,5vw,55px);background:#111419;border:1px solid #30363d;overflow:hidden}
.fill{height:100%;width:0;background:#e8ecef;transition:width .5s ease}
.summary{display:flex;justify-content:space-between;gap:14px;align-items:end;margin-top:12px}
.remaining{font-size:clamp(18px,4vw,32px);font-weight:850;letter-spacing:-.035em}
.small{font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);text-align:right}
.lights{display:grid;grid-template-columns:repeat(10,1fr);gap:clamp(7px,1.4vw,16px);margin:clamp(30px,5vw,55px) 0}
.lightWrap{text-align:center}
.light{aspect-ratio:1;border-radius:50%;background:var(--off);border:1px solid #30363d;box-shadow:inset 0 0 0 1px #0b0d10;transition:all .35s ease}
.light.PASS{background:var(--green);border-color:#9cffb4;box-shadow:0 0 24px color-mix(in srgb,var(--green) 50%,transparent),inset 0 0 16px rgba(255,255,255,.25)}
.light.PARTIAL{background:var(--yellow);border-color:#ffe594;box-shadow:0 0 24px color-mix(in srgb,var(--yellow) 45%,transparent),inset 0 0 16px rgba(255,255,255,.2)}
.light.BLOCKED{background:var(--red);border-color:#ff9b9e;box-shadow:0 0 24px color-mix(in srgb,var(--red) 45%,transparent),inset 0 0 16px rgba(255,255,255,.2)}
.num{margin-top:8px;font:700 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#66717b}
.focus{border-top:1px solid var(--line);padding-top:17px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start}
.focus h2{margin:0 0 6px;font-size:clamp(18px,3vw,28px);letter-spacing:-.035em}
.focus p{margin:0;color:#98a4ae;font-size:12px;line-height:1.5;max-width:780px}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.legend span{font:700 9px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:#909aa4;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.dot.g{background:var(--green)}.dot.y{background:var(--yellow)}.dot.r{background:var(--red)}
.stamp{margin-top:22px;font:9px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#56616a}
.err{margin-top:28px;padding:14px;border:1px solid #5a3033;color:#ff9da1}
@media(max-width:680px){
 main{min-height:100svh}
 .lights{grid-template-columns:repeat(5,1fr)}
 .focus{grid-template-columns:1fr}
 .legend{justify-content:flex-start}
 .small{display:none}
 .hero{padding-top:8vh}
}
@media(prefers-reduced-motion:reduce){.fill,.light{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="kicker">PROMETEO · META FINAL</div>
    <div class="live" id="live">cargando…</div>
  </div>

  <section class="hero">
    <div class="percent" id="percent">—<span>%</span></div>
    <div class="track" aria-label="Porcentaje de gates cerrados"><div class="fill" id="fill"></div></div>
    <div class="summary">
      <div class="remaining" id="remaining">—</div>
      <div class="small">verde = cerrado<br>amarillo = parcial · rojo = bloqueado</div>
    </div>

    <div class="lights" id="lights"></div>
  </section>

  <section class="focus">
    <div>
      <div class="kicker">LO QUE FRENA EL FINAL AHORA</div>
      <h2 id="focusTitle">cargando…</h2>
      <p id="focusWhy"></p>
    </div>
    <div class="legend">
      <span><i class="dot g"></i>cerrado</span>
      <span><i class="dot y"></i>parcial</span>
      <span><i class="dot r"></i>bloqueado</span>
    </div>
  </section>

  <div class="stamp" id="stamp"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(s){
  const pct=Math.max(0,Math.min(100,Number(s.percent)||0));
  $('percent').innerHTML=esc(pct)+'<span>%</span>';
  $('fill').style.width=pct+'%';

  const gates=Array.isArray(s.gates)?s.gates:[];
  const unfinished=gates.filter(g=>g.state!=='PASS');
  const pass=gates.filter(g=>g.state==='PASS').length;
  const partial=gates.filter(g=>g.state==='PARTIAL').length;
  const blocked=gates.filter(g=>g.state==='BLOCKED').length;

  $('remaining').textContent=unfinished.length===0
    ? 'TERMINADO'
    : 'FALTAN '+unfinished.length+' DE '+gates.length+' LUCES';

  $('lights').innerHTML=gates.map((g,i)=>
    '<div class="lightWrap" title="'+esc(g.title)+' · '+esc(g.state)+'">'+
      '<div class="light '+esc(g.state)+'" aria-label="'+esc(g.id+' '+g.state)+'"></div>'+
      '<div class="num">'+String(i+1).padStart(2,'0')+'</div>'+
    '</div>'
  ).join('');

  const f=s.next_focus || unfinished[0];
  $('focusTitle').textContent=f ? (f.id+' · '+f.title) : 'Todos los gates están cerrados';
  $('focusWhy').textContent=f?.reason || f?.blocker || 'No queda bloqueo técnico medido.';
  $('live').textContent='● AUTO';
  $('stamp').textContent='actualizado '+(s.generated_at||'desconocido')+
    ' · '+pass+' verdes · '+partial+' amarillas · '+blocked+' rojas'+
    ' · porcentaje de gates, no ETA';
}
async function load(){
  try{
    const r=await fetch('./state.json?x='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    render(await r.json());
  }catch(e){
    $('live').textContent='SIN DATOS';
    $('focus').insertAdjacentHTML('afterend','<div class="err">No pude cargar el estado. No invento porcentaje cuando falta evidencia.</div>');
  }
}
load();
setInterval(load,15000);
</script>
</body>
</html>
