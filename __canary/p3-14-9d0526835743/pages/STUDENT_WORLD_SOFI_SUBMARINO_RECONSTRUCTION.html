<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="prometeo-artifact" content="reconstruction-2026">
<title>Sofi · Mundo submarino</title>
<style>
:root{--abyss:#071f2b;--deep:#0c3843;--water:#17606a;--foam:#d8e6d5;--coral:#dc725e;--sun:#e4c66d;--ink:#03151d}
*{box-sizing:border-box}html{background:var(--abyss);color:var(--foam);font-family:"Trebuchet MS",Arial,sans-serif;scroll-behavior:smooth}body{margin:0;overflow-x:hidden}
.ocean{position:relative;min-height:2400px;background:linear-gradient(#347f80 0,#185766 20%,#0d3a49 48%,#071f2b 78%,#031119 100%);isolation:isolate}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.16;background-image:radial-gradient(circle at 25% 20%,#fff 0 1px,transparent 1.5px);background-size:31px 31px;mix-blend-mode:screen}
.surface{position:absolute;top:0;left:0;right:0;height:190px;background:linear-gradient(rgba(228,198,109,.82),transparent);clip-path:polygon(0 0,100% 0,100% 68%,87% 79%,73% 65%,55% 81%,37% 67%,20% 80%,0 64%)}
header{position:relative;z-index:3;min-height:100vh;display:grid;align-content:center;padding:clamp(26px,7vw,90px);max-width:1100px;margin:auto}
.kicker{text-transform:uppercase;letter-spacing:.22em;font-size:12px;font-weight:900}.title{font-size:clamp(70px,17vw,190px);line-height:.72;letter-spacing:-.09em;margin:24px 0 32px;text-shadow:0 12px 30px rgba(0,0,0,.24)}
.intro{font-family:Georgia,serif;font-size:clamp(20px,3vw,32px);line-height:1.25;max-width:620px}.dive{position:absolute;bottom:34px;left:clamp(26px,7vw,90px);font-size:11px;text-transform:uppercase;letter-spacing:.17em;animation:pulse 2s infinite}@keyframes pulse{50%{transform:translateY(8px);opacity:.55}}
.route{position:relative;z-index:2;width:min(920px,100%);margin:auto;padding:20px clamp(20px,6vw,72px) 180px}
.cable{position:absolute;left:50%;top:0;bottom:100px;width:4px;background:linear-gradient(var(--sun),var(--coral),#719f98);transform:translateX(-50%);opacity:.7}
.level{position:relative;width:min(430px,76%);margin:0 0 190px;padding:26px 28px;color:var(--ink);background:var(--foam);border:0;border-radius:4px;box-shadow:10px 13px 0 rgba(2,18,25,.32);cursor:pointer;text-align:left;font:inherit;transition:transform .25s,box-shadow .25s}
.level:nth-of-type(even){margin-left:auto}.level:hover,.level:focus-visible{transform:translate(-4px,-5px);box-shadow:15px 18px 0 rgba(2,18,25,.38);outline:3px solid var(--sun)}
.level::after{content:"";position:absolute;top:50%;width:clamp(36px,12vw,110px);height:3px;background:var(--coral)}.level:nth-of-type(odd)::after{left:100%}.level:nth-of-type(even)::after{right:100%}
.depth{font:800 11px/1 monospace;letter-spacing:.12em;color:#6c3a33}.level h2{font-size:clamp(26px,5vw,48px);line-height:.92;letter-spacing:-.045em;margin:13px 0}.level p{margin:0;line-height:1.4}.status{display:inline-block;margin-top:18px;padding:7px 9px;background:var(--deep);color:var(--foam);font:800 10px/1 Arial;text-transform:uppercase;letter-spacing:.12em}.level.locked{filter:saturate(.45);opacity:.66}.level.done .status{background:#5f774d}.level.active{background:var(--sun)}
.sub{position:fixed;z-index:5;right:clamp(12px,3vw,40px);top:28px;width:154px;padding:14px;background:rgba(3,21,29,.84);border:1px solid rgba(216,230,213,.25);backdrop-filter:blur(8px)}
.subtop{display:flex;align-items:center;gap:10px}.submarine{width:55px;height:29px;border-radius:50% 55% 48% 50%;background:var(--sun);position:relative;box-shadow:inset -7px -5px 0 #b49b4f}.submarine:before{content:"";position:absolute;width:15px;height:9px;border:4px solid var(--sun);border-bottom:0;top:-10px;left:22px}.submarine:after{content:"✦";position:absolute;left:-17px;top:5px;color:var(--coral)}
.sub b{font-size:12px}.meter{height:5px;background:#143844;margin-top:12px}.meter i{display:block;height:100%;width:46%;background:var(--coral);transition:width .4s}.readout{display:flex;justify-content:space-between;margin-top:6px;font:700 9px/1 monospace;text-transform:uppercase}
.modal{position:fixed;z-index:20;inset:0;display:grid;place-items:center;padding:24px;background:rgba(1,12,18,.82);opacity:0;pointer-events:none;transition:.25s}.modal.open{opacity:1;pointer-events:auto}.card{width:min(540px,100%);background:var(--foam);color:var(--ink);padding:clamp(24px,6vw,52px);box-shadow:16px 18px 0 var(--coral)}.card h3{font-size:clamp(38px,8vw,72px);line-height:.85;margin:12px 0 20px}.card button{border:0;background:var(--deep);color:var(--foam);padding:13px 18px;font-weight:800;cursor:pointer}
.bubble{position:fixed;bottom:-30px;border:1px solid rgba(216,230,213,.55);border-radius:50%;pointer-events:none;animation:rise linear forwards}@keyframes rise{to{transform:translateY(-115vh) translateX(25px);opacity:0}}
footer{position:absolute;bottom:30px;left:30px;right:30px;display:flex;justify-content:space-between;font:700 10px/1 monospace;text-transform:uppercase;letter-spacing:.12em;opacity:.55}
@media(max-width:540px){.sub{width:118px}.submarine{width:43px}.level{width:80%;padding:20px;margin-bottom:150px}.cable{left:50%}.level::after{width:25%}}
</style>
</head>
<body>
<main class="ocean">
  <div class="surface"></div><div class="grain"></div>
  <aside class="sub" aria-label="Progreso"><div class="subtop"><div class="submarine"></div><b>SOFI<br>EXPEDICIÓN 04</b></div><div class="meter"><i></i></div><div class="readout"><span>Progreso</span><span id="progress">46%</span></div></aside>
  <header><span class="kicker">Student World · Sofi</span><h1 class="title">Bajo<br>el agua</h1><p class="intro">Cada tema es una estación de profundidad. Bajá para explorar; tocá una estación para abrir la misión.</p><span class="dive">↓ comenzar inmersión</span></header>
  <section class="route"><div class="cable"></div>
    <button class="level done" data-progress="24" data-note="Completaste clasificación, hábitat y adaptación."><span class="depth">— 20 M</span><h2>Arrecife vivo</h2><p>Ecosistemas, relaciones y especies.</p><span class="status">Completado</span></button>
    <button class="level done" data-progress="38" data-note="La bitácora tiene 8 observaciones y una hipótesis confirmada."><span class="depth">— 80 M</span><h2>Bitácora de campo</h2><p>Observar, registrar, comparar.</p><span class="status">Completado</span></button>
    <button class="level active" data-progress="46" data-note="Misión actual: seguir el viaje del oxígeno desde el agua hasta cada célula."><span class="depth">— 240 M</span><h2>Respirar profundo</h2><p>Intercambio gaseoso y circulación.</p><span class="status">Misión actual</span></button>
    <button class="level" data-progress="61" data-note="Disponible después de Respirar profundo. Vas a modelar una cadena alimentaria."><span class="depth">— 600 M</span><h2>Red invisible</h2><p>Energía, alimento y equilibrio.</p><span class="status">Próxima</span></button>
    <button class="level locked" data-progress="82" data-note="Estación todavía cerrada. Completá Red invisible para encender el sonar."><span class="depth">— 1.200 M</span><h2>Zona de sombra</h2><p>Luz, presión y adaptación extrema.</p><span class="status">Bloqueado</span></button>
  </section>
  <footer><span>Prometeo · Mundo del alumno</span><span>Reconstrucción 2026</span></footer>
</main>
<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mission-title"><div class="card"><small id="mission-depth"></small><h3 id="mission-title"></h3><p id="mission-note"></p><button id="close">Volver al mapa</button></div></div>
<script>
const modal=document.querySelector('.modal'),title=document.querySelector('#mission-title'),depth=document.querySelector('#mission-depth'),note=document.querySelector('#mission-note');
document.querySelectorAll('.level').forEach(level=>level.addEventListener('click',()=>{title.textContent=level.querySelector('h2').textContent;depth.textContent=level.querySelector('.depth').textContent;note.textContent=level.dataset.note;modal.classList.add('open');document.querySelector('#close').focus()}));
function close(){modal.classList.remove('open')}document.querySelector('#close').onclick=close;modal.addEventListener('click',e=>{if(e.target===modal)close()});addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function sync(){const ratio=Math.min(1,scrollY/(document.documentElement.scrollHeight-innerHeight));const value=Math.round(24+ratio*58);document.querySelector('.meter i').style.width=value+'%';document.querySelector('#progress').textContent=value+'%'}addEventListener('scroll',sync,{passive:true});sync();
setInterval(()=>{const b=document.createElement('i');b.className='bubble';const s=5+Math.random()*14;b.style.cssText=`left:${Math.random()*100}vw;width:${s}px;height:${s}px;animation-duration:${5+Math.random()*6}s`;document.body.appendChild(b);setTimeout(()=>b.remove(),12000)},850);
</script>
<script type="module" src="/prometeo/shared/prometeo-shell/v2/prometeo-shell.js?v=2" data-prometeo-shell></script>
</body>
</html>
