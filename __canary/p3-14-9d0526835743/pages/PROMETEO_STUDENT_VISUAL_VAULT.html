<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="prometeo-artifact" content="reconstruction-2026">
<title>Student Visual Vault · Prometeo</title>
<style>
:root{--paper:#efe8d7;--ink:#182019;--moss:#354024;--sage:#aab99d;--rust:#8e3f2f;--line:rgba(24,32,25,.2)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}body{overflow:hidden}
.shell{height:100vh;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
header{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;padding:clamp(18px,4vw,42px) clamp(18px,5vw,58px) 18px;border-bottom:1px solid var(--line)}
.title{font-size:clamp(30px,6vw,68px);line-height:.83;letter-spacing:-.055em;margin:0}.meta{font:800 10px/1.4 monospace;text-transform:uppercase;letter-spacing:.1em;text-align:right}
.tabs{display:flex;align-items:stretch;padding:0 clamp(18px,5vw,58px);border-bottom:1px solid var(--line);background:#e5ddc9}.tab{appearance:none;border:0;border-right:1px solid var(--line);background:transparent;color:inherit;font:800 12px/1 Arial;letter-spacing:.08em;text-transform:uppercase;padding:17px 21px;cursor:pointer}.tab:first-child{border-left:1px solid var(--line)}.tab[aria-selected="true"]{background:var(--moss);color:var(--paper)}.tab:hover:not([aria-selected="true"]){background:var(--sage)}
.hint{margin-left:auto;align-self:center;font:700 10px/1.3 monospace;opacity:.65;text-transform:uppercase}
.viewport{position:relative;min-height:0;background:#fff}.panel{position:absolute;inset:0;visibility:hidden;opacity:0;transition:opacity .2s}.panel.active{visibility:visible;opacity:1}.panel iframe{width:100%;height:100%;border:0;display:block;background:white}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--paper);font:800 11px/1 monospace;letter-spacing:.16em;text-transform:uppercase;z-index:-1}
@media(max-width:600px){header{align-items:flex-start}.meta{display:none}.tabs{padding:0}.tab{flex:1;padding:15px 8px;font-size:10px}.hint{display:none}}
</style>
</head>
<body>
<main class="shell">
  <header><h1 class="title">Student<br>Visual Vault</h1><div class="meta">45+ recursos visuales<br>José · aprendizaje<br>Reconstrucción 2026</div></header>
  <nav class="tabs" role="tablist" aria-label="Vistas del archivo">
    <button class="tab" role="tab" aria-selected="true" aria-controls="library">Biblioteca</button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="map">Mapa de uso</button>
    <span class="hint">dos vistas · una sola autoridad de recursos</span>
  </nav>
  <section class="viewport">
    <div class="panel active" id="library" role="tabpanel"><span class="loading">Cargando biblioteca</span><iframe title="Organizador de stickers de José" src="Prometeo/ORGANIZADOR_STICKERS_JOSE.html"></iframe></div>
    <div class="panel" id="map" role="tabpanel"><span class="loading">Cargando mapa</span><iframe title="Mapa de stickers de José" data-src="Prometeo/MAPA_STICKERS_JOSE.html"></iframe></div>
  </section>
</main>
<script>
const tabs=[...document.querySelectorAll('.tab')],panels=[...document.querySelectorAll('.panel')];
function select(tab){tabs.forEach(item=>item.setAttribute('aria-selected',String(item===tab)));panels.forEach(panel=>panel.classList.toggle('active',panel.id===tab.getAttribute('aria-controls')));const frame=document.querySelector('#'+tab.getAttribute('aria-controls')+' iframe');if(!frame.hasAttribute('src')&&frame.dataset.src)frame.src=frame.dataset.src;}
tabs.forEach((tab,index)=>{tab.addEventListener('click',()=>select(tab));tab.addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();const next=tabs[(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length];next.focus();select(next)})});
</script>
<script type="module" src="/prometeo/shared/prometeo-shell/v2/prometeo-shell.js?v=2" data-prometeo-shell></script>
</body>
</html>
