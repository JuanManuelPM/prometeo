<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>José · Química</title>
<style>
:root{
  --bg:#0b0f12;--stage:#0d1114;--rail:#0e1519;--text:#eef3f4;--soft:#c5ced2;
  --muted:#86949b;--faint:#52616a;--line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.15);
  --accent:#8ed8ff;--good:#acd9c1;--bad:#df988e;--warm:#dbc8aa;
  --rail-w:clamp(280px,20vw,370px);--ease:cubic-bezier(.22,.76,.18,1);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid rgba(142,216,255,.7);outline-offset:3px}
.app{height:100vh;display:grid;grid-template-columns:minmax(0,1fr) var(--rail-w);background:var(--stage)}
.stage{position:relative;min-width:0;height:100vh;background:
  radial-gradient(900px 700px at 24% 42%,rgba(142,216,255,.022),transparent 68%),var(--stage)}
.identity{position:absolute;left:34px;top:27px;z-index:20;display:flex;gap:9px;align-items:flex-start;user-select:none}
.id-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px rgba(142,216,255,.28);margin-top:5px}
.identity strong{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.identity span{display:block;margin-top:4px;color:#66747c;font-size:9px}
.sound-btn{position:absolute;right:28px;top:24px;z-index:20;width:38px;height:38px;border:1px solid var(--line);border-radius:50%;
 background:rgba(255,255,255,.015);display:grid;place-items:center;cursor:pointer;color:#8c9aa1}
.sound-btn:hover{border-color:var(--line2);color:#e5edf0}.sound-btn.muted{opacity:.45}
.stage-scroll{height:100%;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;scrollbar-width:thin;
 scrollbar-color:rgba(255,255,255,.10) transparent;overscroll-behavior:contain}
.stage-page{min-height:100%;padding:clamp(118px,15.5vh,165px) clamp(42px,5vw,84px) 100px clamp(72px,8vw,150px);
 animation:pageIn .28s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#7e9caf;font-weight:720;margin-bottom:16px}
.page-title{margin:0;font-size:clamp(30px,3vw,44px);letter-spacing:-.042em;line-height:1.05;font-weight:620}
.rule{height:1px;background:var(--line);margin:32px 0 36px}

/* continuous theory */
.theory-sheet{max-width:780px}.theory-intro{margin-bottom:40px}
.theory-section{position:relative;padding:0 0 38px;margin:0 0 40px;border-bottom:1px solid var(--line)}
.theory-section:last-child{border-bottom:0}
.theory-kicker{font-size:9px;letter-spacing:.145em;text-transform:uppercase;color:#6d8490;margin-bottom:10px}
.theory-section h2{font-size:clamp(19px,1.75vw,27px);font-weight:590;letter-spacing:-.024em;margin:0 0 12px}
.theory-section p{margin:0;color:#adb8bd;font-size:15px;line-height:1.82;max-width:710px}
.theory-section.anchor-hit:before{content:"";position:absolute;left:-19px;top:0;bottom:22px;width:2px;background:var(--accent);
 box-shadow:0 0 20px rgba(142,216,255,.28);animation:anchorHit 1.5s ease forwards}
@keyframes anchorHit{0%{opacity:0}18%{opacity:1}100%{opacity:.18}}
.theory-back{position:sticky;top:14px;z-index:8;width:max-content;margin:-58px 0 24px auto;border:1px solid var(--line2);
 background:rgba(13,17,20,.88);backdrop-filter:blur(12px);border-radius:999px;padding:9px 13px;cursor:pointer;font-size:10px;color:#b6c1c6}
.board{margin:24px 0 2px;max-width:680px;border-radius:4px;background:#e9ece6;color:#152128;padding:25px 28px;
 box-shadow:0 18px 45px rgba(0,0,0,.15)}
.compare-board{display:grid;grid-template-columns:1fr 1fr;gap:0}.compare-board>div{padding:7px 18px 8px 0}
.compare-board>div+div{border-left:1px solid rgba(10,24,30,.16);padding-left:22px}
.compare-board span,.calc-kicker{display:block;font:700 9px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;color:#617078}
.compare-board strong{display:block;margin-top:9px;font-size:21px}.compare-board small{display:block;margin-top:6px;color:#647077}
.process-board{display:grid;gap:11px}.process-board>div{display:grid;grid-template-columns:1fr 28px 1fr;align-items:center;border-bottom:1px solid rgba(15,31,38,.1);padding-bottom:10px}
.process-board>div:last-child{border:0;padding-bottom:0}.process-board span{text-align:center;color:#8a6c32}.process-board strong{text-align:right}
.calc-board{display:grid;gap:11px}.calc-row{display:flex;justify-content:space-between;align-items:baseline;color:#5b6970}.calc-row b{font-size:20px;color:#152128}
.calc-line{height:1px;background:#25353b;margin:3px 0}.calc-row.result span,.calc-row.result b{color:#152128}
.formula{margin-top:9px;font:600 26px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.04em}
.formula strong{color:#9e6216}.formula-grid{display:grid;grid-template-columns:1fr 1fr;margin-top:14px}
.formula-grid>div{display:grid;gap:3px;padding:10px 16px 10px 0}.formula-grid>div+div{border-left:1px solid rgba(15,31,38,.16);padding-left:20px}
.formula-grid span{font:700 10px ui-monospace,monospace;color:#65737a}.formula-grid b{font-size:36px}.formula-grid small{color:#647077}
.bond-board{display:grid;grid-template-columns:repeat(3,1fr);gap:0}.bond-board>div{display:grid;gap:6px;padding:4px 16px}
.bond-board>div+div{border-left:1px solid rgba(15,31,38,.15)}.bond-board b{font:800 11px ui-monospace,monospace;letter-spacing:.06em}
.bond-board span{font-size:14px}.bond-board small{color:#65737a}
.reaction-board{display:grid;grid-template-columns:1fr 42px 1fr;align-items:center}
.reaction-board>div:not(.reaction-arrow){display:grid;gap:8px}.reaction-board span{font:700 9px ui-monospace,monospace;letter-spacing:.1em;color:#68777e}
.reaction-board b{font:650 25px ui-monospace,monospace}.reaction-arrow{text-align:center;font-size:28px;color:#9b6a28}
.molar-formula{display:flex;gap:16px;align-items:baseline}.big-formula{display:flex;gap:14px;align-items:center}
.frac{display:grid;grid-template-rows:auto 1px auto;gap:5px;text-align:center}.frac i{height:1px;background:#26373d}.compact{font-size:20px}
.practice-bridge{margin-top:22px;padding-top:14px;border-top:1px solid rgba(142,216,255,.16);display:flex;align-items:center;gap:13px;color:#8da1aa}
.practice-bridge span{font-size:12px;line-height:1.55}.bridge-btn{margin-left:auto;border:0;background:transparent;color:#9fdcf7;font-size:11px;cursor:pointer;white-space:nowrap}
.bridge-btn:disabled{opacity:.28;cursor:default}
.video-stack{display:grid;gap:10px;margin-top:20px;max-width:680px}
.video-card{display:grid;grid-template-columns:58px 1fr auto;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.video-thumb{width:58px;height:38px;border-radius:4px;background:linear-gradient(135deg,#1d2d35,#273d47);display:grid;place-items:center;color:#b6dce9}
.video-copy strong{display:block;font-size:13px}.video-copy small{display:block;color:#7e8c93;margin-top:4px;line-height:1.4}
.video-card a{color:#a7dff7;text-decoration:none;font-size:11px}

/* practice */
.practice-shell{max-width:790px}.practice-head{max-width:720px}
.step-kicker{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#647a85;margin-bottom:13px}
.prompt{font-size:clamp(24px,2.55vw,36px);line-height:1.28;font-weight:590;letter-spacing:-.028em;margin:0;max-width:780px}
.instruction{color:#8d9aa1;font-size:13px;line-height:1.6;margin:12px 0 0;max-width:680px}
.response-zone{margin-top:30px;max-width:790px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choice{min-height:62px;border:1px solid var(--line);background:rgba(255,255,255,.012);border-radius:12px;padding:13px 15px;
 display:flex;gap:12px;align-items:center;text-align:left;cursor:pointer;color:#b9c4c9;transition:.14s var(--ease)}
.choice:hover{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.022)}
.choice .mark{width:20px;height:20px;border:1px solid rgba(255,255,255,.16);border-radius:50%;display:grid;place-items:center;flex:none;font-size:9px;color:transparent}
.choice.selected{border-color:rgba(142,216,255,.48);background:rgba(142,216,255,.055);color:#edf6f9}
.choice.selected .mark{border-color:var(--accent);background:rgba(142,216,255,.11);color:var(--accent)}
.choice.wrong{border-color:rgba(223,152,142,.34);background:rgba(223,152,142,.035)}
.choice.correct{border-color:rgba(172,217,193,.35);background:rgba(172,217,193,.04)}
.classify{display:grid;gap:8px}.class-row{display:grid;grid-template-columns:minmax(170px,.9fr) minmax(0,1.6fr);gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.class-row:last-child{border-bottom:0}.class-label{font-size:13px;color:#c0c9cd;line-height:1.4}
.class-options{display:flex;gap:7px;flex-wrap:wrap}.mini-choice{border:1px solid var(--line);background:rgba(255,255,255,.01);padding:8px 10px;border-radius:9px;color:#84929a;cursor:pointer;font-size:11px}
.mini-choice.selected{border-color:rgba(142,216,255,.45);color:#dcecf2;background:rgba(142,216,255,.05)}
.class-row.bad .class-label{color:#cfaaa5}.class-row.bad .mini-choice.selected{border-color:rgba(223,152,142,.45);color:#e2b7b0}
.class-row.good .class-label{color:#b8d2c3}
.direct-line{border-bottom:1px solid rgba(255,255,255,.18);max-width:640px;padding:5px 0 9px}
.direct-input{width:100%;border:0;outline:0;background:transparent;color:#f1f6f7;font-size:clamp(30px,3.4vw,48px);font-weight:520;letter-spacing:-.04em;caret-color:var(--accent)}
.direct-input::placeholder{color:#2d3a41}
.action-row{display:flex;align-items:center;gap:10px;margin-top:25px;min-height:46px}
.btn{border:1px solid var(--line2);background:rgba(255,255,255,.015);border-radius:11px;padding:11px 15px;cursor:pointer;color:#aeb9be}
.btn:hover{border-color:rgba(255,255,255,.23);color:#eef4f6}.btn.primary{margin-left:auto;background:#eaf5fa;color:#0d1519;border-color:#eaf5fa;font-weight:740}
.btn.primary:disabled{opacity:.32;cursor:default}
.feedback-slot{min-height:55px;padding-top:16px;margin-top:21px;border-top:1px solid var(--line);font-size:13px;line-height:1.6;color:#96a4aa}
.feedback-slot.bad{color:#cda9a4}.feedback-slot.good{color:#b4d1c1}
.hint-slot{min-height:72px;margin-top:4px;padding-top:12px;color:#a6b1b7;font-size:13px;line-height:1.6}
.hint-line{display:flex;gap:10px;align-items:flex-start}.hint-badge{flex:none;border:1px solid var(--line);border-radius:999px;padding:4px 6px;font-size:8px;letter-spacing:.1em;color:#718893}
.hint-theory{margin-top:10px;border:0;background:transparent;padding:0;color:#9fdaf7;cursor:pointer;font-size:12px}

/* rail */
.rail{height:100vh;position:relative;background:linear-gradient(180deg,var(--rail),#0c1114);border-left:1px solid rgba(255,255,255,.055);overflow:hidden}
.rail-head{height:132px;padding:22px 20px 15px;border-bottom:1px solid rgba(255,255,255,.055);background:linear-gradient(180deg,rgba(255,255,255,.015),transparent);position:relative;z-index:8}
.topic-head-row{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:8px}
.topic-nav{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.015);display:grid;place-items:center;cursor:pointer;color:#7c8b92}
.topic-nav:hover:not(:disabled){border-color:var(--line2);color:#e6edef}.topic-nav:disabled{opacity:.15;cursor:default}
.topic-center{text-align:center}.rail-level{font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:#5f7682}
.rail-title{font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-top:7px;color:#c1ccd0;font-weight:680;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topic-peeks{display:flex;justify-content:space-between;margin-top:8px;font-size:8px;color:#526169;min-height:10px}
.rail-progress-line{display:flex;align-items:center;gap:9px;margin-top:12px}.bar{height:3px;flex:1;display:flex;gap:3px}.bar i{display:block;flex:1;border-radius:5px;background:rgba(255,255,255,.08)}
.bar i.done{background:var(--accent)}.rail-count{font-size:9px;color:#6d7f88;font-variant-numeric:tabular-nums;min-width:32px;text-align:right}
.world-window{position:absolute;left:0;right:0;top:132px;bottom:0;overflow:hidden;background:#091014}
.world-scene{position:absolute;left:0;top:0;width:100%;height:1320px;will-change:transform;transition:transform .44s var(--ease)}
.world-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;filter:saturate(.78) brightness(.58) contrast(.98);opacity:.94}
.world-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,11,14,.02),rgba(6,11,14,.28) 43%,rgba(6,11,14,.56));pointer-events:none}
.route-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.route-line{fill:none;stroke:rgba(235,246,249,.22);stroke-width:1.4;stroke-dasharray:4 9}
.route-line-done{fill:none;stroke:rgba(142,216,255,.62);stroke-width:2;stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(142,216,255,.25))}
.map-node{position:absolute;width:114px;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:7px;border:0;background:transparent;color:#75858c;padding:5px;cursor:pointer}
.map-node.locked{opacity:.28;cursor:default}.map-node .node-core{width:50px;height:50px;border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;color:#a7b2b6;background:rgba(12,18,21,.76);backdrop-filter:blur(7px);transition:.18s var(--ease)}
.map-node[data-type="THEORY"] .node-core{border-radius:10px}.map-node[data-type="PRACTICE"] .node-core{border-radius:50%}.map-node[data-type="CHECKPOINT"] .node-core{width:40px;height:40px;border-radius:6px;transform:rotate(45deg)}
.map-node[data-type="CHECKPOINT"] .node-symbol{transform:rotate(-45deg)}.map-node.current .node-core{border-color:rgba(142,216,255,.76);box-shadow:0 0 0 4px rgba(142,216,255,.05),0 0 28px rgba(142,216,255,.12);color:#f2fbfd}
.map-node.completed .node-core{border-color:rgba(172,217,193,.54);color:var(--good)}.node-symbol{font-size:12px;font-weight:700}.node-label{font-size:10px;color:#aebcc1;text-shadow:0 1px 8px #000;white-space:nowrap}
.route-arrow{position:absolute;left:50%;transform:translateX(-50%);z-index:9;width:50px;height:36px;border:1px solid rgba(255,255,255,.10);border-radius:999px;background:rgba(8,13,16,.76);backdrop-filter:blur(8px);color:#84939a;display:grid;place-items:center;cursor:pointer}
.route-arrow:hover:not(:disabled){color:#e6eef1;border-color:rgba(255,255,255,.22)}.route-arrow:disabled{opacity:.13;cursor:default}
.route-up{top:12px}.route-down{bottom:13px}
.world-label{position:absolute;right:12px;bottom:10px;z-index:6;font-size:7px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.25)}

/* intervention */
.intervention{position:fixed;z-index:90;inset:0;display:grid;place-items:center;background:rgba(4,7,9,.73);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:.17s}
.intervention.open{opacity:1;pointer-events:auto}.intervention-card{width:min(520px,calc(100vw - 48px));min-height:245px;border:1px solid rgba(255,255,255,.12);background:#11171a;display:grid;grid-template-columns:128px 1fr;gap:22px;padding:28px;border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.42)}
.sticker-slot{width:118px;height:118px;display:grid;place-items:center;align-self:start}.sticker-slot img{max-width:100%;max-height:100%;object-fit:contain;border-radius:9px}
.int-kicker{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#71848d}.int-title{font-size:24px;letter-spacing:-.03em;margin:8px 0 8px}.int-message{font-size:13px;line-height:1.65;color:#9facb2;margin:0}
.timer{margin-top:14px;min-height:30px;display:flex;align-items:center;gap:9px;color:#75868e;font-size:11px}.timer strong{font-size:22px;font-variant-numeric:tabular-nums;color:#d6e0e3;min-width:28px}
.int-action{margin-top:14px;border:1px solid var(--line2);background:#edf5f7;color:#11181b;border-radius:10px;padding:10px 13px;font-weight:720;cursor:pointer}.int-action:disabled{opacity:.3;cursor:default}
.toast{position:fixed;z-index:70;left:32px;bottom:26px;width:min(330px,calc(100vw - 64px));display:grid;grid-template-columns:54px 1fr;gap:11px;align-items:center;padding:11px 13px;border:1px solid var(--line);background:rgba(13,18,21,.92);backdrop-filter:blur(10px);border-radius:12px;transform:translateY(18px);opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:none}.toast img{width:48px;height:48px;object-fit:contain}.toast strong{display:block;font-size:12px}.toast span{display:block;font-size:10px;line-height:1.45;color:#809097;margin-top:3px}

.keyboard-hint{position:absolute;left:34px;bottom:20px;color:#46545b;font-size:9px;z-index:10;pointer-events:none}
@media(max-width:1180px){:root{--rail-w:280px}.stage-page{padding-left:58px;padding-right:42px}.identity{left:25px}.page-title{font-size:32px}.theory-sheet{max-width:720px}}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr) 250px}:root{--rail-w:250px}.stage-page{padding-left:38px}.class-row{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.board{padding:20px}.bond-board{grid-template-columns:1fr}.bond-board>div+div{border-left:0;border-top:1px solid rgba(15,31,38,.15);padding-top:10px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
  <main class="stage">
    <div class="identity"><span class="id-dot"></span><div><strong>José</strong><span>Química · Study World</span></div></div>
    <button class="sound-btn" id="soundBtn" aria-label="Sonido">⌁</button>
    <div class="stage-scroll" id="stageScroll"><div class="stage-page" id="stagePage"></div></div>
    <div class="keyboard-hint" id="keyboardHint"></div>
  </main>
  <aside class="rail">
    <div class="rail-head">
      <div class="topic-head-row">
        <button class="topic-nav" id="prevTopic" aria-label="Tema anterior">←</button>
        <div class="topic-center"><div class="rail-level" id="railLevel"></div><div class="rail-title" id="railTitle"></div></div>
        <button class="topic-nav" id="nextTopic" aria-label="Tema siguiente">→</button>
      </div>
      <div class="topic-peeks"><span id="prevPeek"></span><span id="nextPeek"></span></div>
      <div class="rail-progress-line"><div class="bar" id="progressBar"></div><div class="rail-count" id="railCount"></div></div>
    </div>
    <div class="world-window" id="worldWindow">
      <div class="world-scene" id="worldScene"></div>
      <button class="route-arrow route-up" id="upBtn" aria-label="Subir">↑</button>
      <button class="route-arrow route-down" id="downBtn" aria-label="Bajar">↓</button>
      <div class="world-label">tema · mapa</div>
    </div>
  </aside>
</div>

<div class="intervention" id="intervention">
  <div class="intervention-card">
    <div class="sticker-slot"><img id="intSticker" alt=""></div>
    <div>
      <div class="int-kicker" id="intKicker"></div>
      <h2 class="int-title" id="intTitle"></h2>
      <p class="int-message" id="intMessage"></p>
      <div class="timer"><strong id="timerNumber"></strong><span id="timerLabel"></span></div>
      <button class="int-action" id="intAction"></button>
    </div>
  </div>
</div>
<div class="toast" id="toast"><img id="toastImg" alt=""><div><strong id="toastTitle"></strong><span id="toastMsg"></span></div></div>

<script>
const TOPICS=[{"id": "MATTER", "title": "Materia y mezclas", "short": "MATERIA", "world": "A", "theory": [{"id": "TH_MATTER_TYPES", "kicker": "IDEA", "title": "Primero: ¿sustancia pura o mezcla?", "body": "Una sustancia pura tiene composición definida. Si está formada por un solo tipo de átomo es un elemento; si combina dos o más elementos en proporciones definidas es un compuesto. Una mezcla, en cambio, reúne sustancias sin convertirlas necesariamente en una sustancia nueva."}, {"id": "TH_MIXTURES", "kicker": "DISTINCIÓN", "title": "Homogénea y heterogénea no significan “líquida” y “sólida”", "body": "La pregunta útil es cuántas fases distinguís. En una mezcla homogénea el sistema se observa como una sola fase; en una heterogénea aparecen dos o más fases. El bronce, aunque sea sólido, es una mezcla homogénea; una roca suele ser heterogénea.", "board": "<div class=\"compare-board\">\n                  <div><span>HOMOGÉNEA</span><strong>una fase</strong><small>ej.: bronce</small></div>\n                  <div><span>HETEROGÉNEA</span><strong>dos o más fases</strong><small>ej.: roca</small></div>\n                </div>", "bridge": {"step": "MAT-P1", "copy": "Con esto ya podés intentar la primera práctica de clasificación."}}, {"id": "TH_SEPARATION", "kicker": "PROCEDIMIENTO", "title": "Para separar una mezcla, mirá qué propiedad cambia", "body": "Tamizado aprovecha diferencias de tamaño; decantación, diferencias de densidad y fases que se separan; filtración, el paso de una fase a través de un material poroso. Para sal disuelta en agua sirve evaporación; para tinta, cromatografía; para alcohol y agua, destilación.", "board": "<div class=\"process-board\">\n                  <div><b>arena + piedras</b><span>→</span><strong>tamizado</strong></div>\n                  <div><b>agua + aceite</b><span>→</span><strong>decantación</strong></div>\n                  <div><b>sal + agua</b><span>→</span><strong>evaporación</strong></div>\n                  <div><b>alcohol + agua</b><span>→</span><strong>destilación</strong></div>\n                </div>", "bridge": {"step": "MAT-P2", "copy": "Esta parte prepara la práctica de métodos de separación."}}, {"id": "TH_DENSITY", "kicker": "REGLA", "title": "Densidad: masa dividida por volumen", "body": "La densidad es una propiedad intensiva: no depende de cuánto material tengas. Para medir el volumen de un objeto irregular podés sumergirlo y mirar cuánto sube el nivel del agua. Después dividís masa por volumen.", "board": "<div class=\"calc-board\">\n                  <div class=\"calc-kicker\">DESPLAZAMIENTO DE AGUA</div>\n                  <div class=\"calc-row\"><span>lectura final</span><b>60 mL</b></div>\n                  <div class=\"calc-row\"><span>lectura inicial</span><b>50 mL</b></div>\n                  <div class=\"calc-line\"></div>\n                  <div class=\"calc-row result\"><span>volumen del objeto</span><b>10 mL</b></div>\n                  <div class=\"formula\">78,7 g ÷ 10 mL = <strong>7,87 g/mL</strong></div>\n                </div>", "bridge": {"step": "MAT-CHECK", "copy": "Si entendés de dónde salió el volumen, el checkpoint de densidad ya es razonable."}}, {"id": "TH_MASS_WEIGHT", "kicker": "ERROR TÍPICO", "title": "Masa y peso no son la misma magnitud", "body": "La masa mide cantidad de materia y se expresa, por ejemplo, en kg. El peso es una fuerza gravitatoria. Por eso decir “mi peso es 58 kg” mezcla unidades y magnitudes."}], "steps": [{"id": "MAT-THEORY", "type": "THEORY", "label": "Teoría"}, {"id": "MAT-P1", "type": "PRACTICE", "label": "Práctica 1", "source": "Q-ME-001 / Q-ME-002", "exercise": {"surface": "CLASSIFY", "prompt": "Clasificá cada caso.", "instruction": "Elegí una respuesta en cada fila.", "rows": [{"label": "Mercurio", "options": ["Elemento", "Compuesto"], "answer": "Elemento"}, {"label": "Bicarbonato de sodio", "options": ["Elemento", "Compuesto"], "answer": "Compuesto"}, {"label": "Bronce", "options": ["Mezcla homogénea", "Mezcla heterogénea"], "answer": "Mezcla homogénea"}, {"label": "Roca", "options": ["Mezcla homogénea", "Mezcla heterogénea"], "answer": "Mezcla heterogénea"}], "theory_anchor": "TH_MATTER_TYPES", "hints": ["Primero separá sustancia pura de mezcla.", "Elemento = un solo tipo de átomo; una mezcla homogénea se observa como una fase.", "THEORY:TH_MATTER_TYPES"], "wrong": "Revisá las filas marcadas: no uses el estado físico como criterio para decidir si algo es una mezcla."}}, {"id": "MAT-P2", "type": "PRACTICE", "label": "Práctica 2", "source": "Q-ME-009", "exercise": {"surface": "CLASSIFY", "prompt": "Elegí el método de separación más adecuado.", "instruction": "Una técnica por mezcla.", "rows": [{"label": "Sal disuelta en agua", "options": ["Evaporación", "Filtración", "Tamizado"], "answer": "Evaporación"}, {"label": "Tinta", "options": ["Cromatografía", "Decantación", "Tamizado"], "answer": "Cromatografía"}, {"label": "Arena con piedrecillas", "options": ["Tamizado", "Destilación", "Evaporación"], "answer": "Tamizado"}, {"label": "Agua con aceite", "options": ["Decantación", "Filtración", "Cromatografía"], "answer": "Decantación"}, {"label": "Alcohol disuelto en agua", "options": ["Destilación", "Tamizado", "Decantación"], "answer": "Destilación"}], "theory_anchor": "TH_SEPARATION", "hints": ["Mirá qué diferencia física podés aprovechar.", "Tamaño → tamizado; fases que se separan → decantación; líquidos miscibles con distinto punto de ebullición → destilación.", "THEORY:TH_SEPARATION"], "wrong": "Hay al menos una mezcla con un método que no aprovecha la propiedad correcta."}}, {"id": "MAT-P3", "type": "PRACTICE", "label": "Práctica 3", "source": "Q-ME-011", "exercise": {"surface": "SINGLE", "prompt": "¿Cuál frase usa correctamente la magnitud y la unidad?", "instruction": "Elegí una opción.", "options": [{"id": "a", "text": "El peso de un estudiante es 58 kg."}, {"id": "b", "text": "La masa de un estudiante es 58 kg.", "correct": true}], "theory_anchor": "TH_MASS_WEIGHT", "hints": ["Fijate qué magnitud se mide en kg.", "El peso es una fuerza; la masa se expresa en kg.", "THEORY:TH_MASS_WEIGHT"], "wrong": "Los kg corresponden a masa. El peso es una fuerza."}}, {"id": "MAT-CHECK", "type": "CHECKPOINT", "label": "Checkpoint", "source": "Q-ME-014b", "exercise": {"surface": "DIRECT", "prompt": "Un cubo de aluminio tiene 15 cm de lado y una masa de 8.775 g. ¿Cuál es su densidad en g/cm³?", "instruction": "Escribí sólo el valor numérico.", "accepted": ["2.6", "2,6"], "theory_anchor": "TH_DENSITY", "hints": ["Primero necesitás el volumen del cubo.", "V = 15³ cm³. Después densidad = masa ÷ volumen.", "THEORY:TH_DENSITY"], "wrong": "Separá los dos pasos: calculá primero 15³ y recién después dividí 8.775 g por ese volumen."}}]}, {"id": "ATOM", "title": "Átomo y enlaces", "short": "ÁTOMO · ENLACES", "world": "B", "theory": [{"id": "TH_ATOM_MODELS", "kicker": "MODELO", "title": "Los modelos atómicos fueron cambiando con la evidencia", "body": "Thomson propuso una esfera de carga positiva con electrones incrustados. El experimento de Rutherford mostró que la carga positiva y casi toda la masa estaban concentradas en una región central: el núcleo. El modelo no es el átomo real; es una herramienta para explicar observaciones."}, {"id": "TH_ZA", "kicker": "REGLA", "title": "Z cuenta protones; A cuenta protones + neutrones", "body": "El número atómico Z identifica al elemento porque coincide con la cantidad de protones. El número másico A suma protones y neutrones. En un átomo neutro, protones y electrones coinciden, pero los electrones no entran en A.", "board": "<div class=\"calc-board atom-board\">\n                  <div class=\"calc-kicker\">22 p⁺ · 22 e⁻ · 26 n</div>\n                  <div class=\"formula-grid\"><div><span>Z</span><b>22</b><small>protones</small></div><div><span>A</span><b>48</b><small>22 + 26</small></div></div>\n                </div>", "bridge": {"step": "ATOM-P1", "copy": "Con esta regla ya podés intentar Z y A sin memorizar una tabla."}}, {"id": "TH_BONDS", "kicker": "DISTINCIÓN", "title": "Iónico, covalente y metálico: mirá qué pasa con los electrones", "body": "En el enlace iónico hay transferencia de electrones entre un metal y un no metal. En el covalente, átomos no metálicos comparten electrones. En el metálico, los iones positivos permanecen unidos por electrones deslocalizados.", "board": "<div class=\"bond-board\">\n                  <div><b>IÓNICO</b><span>metal + no metal</span><small>transferencia</small></div>\n                  <div><b>COVALENTE</b><span>no metal + no metal</span><small>compartición</small></div>\n                  <div><b>METÁLICO</b><span>metal</span><small>electrones deslocalizados</small></div>\n                </div>", "bridge": {"step": "ATOM-P2", "copy": "Ahora ya tenés el criterio para clasificar varios enlaces."}}, {"id": "TH_BOND_EXAMPLES", "kicker": "EJEMPLO", "title": "Clasificá mirando los elementos, no la forma de la fórmula", "body": "NaCl y LiBr combinan metal + no metal: iónico. H₂O está formado por no metales y presenta enlace covalente polar. Cl₂ une dos átomos iguales de un no metal: covalente apolar."}, {"id": "TH_ATOM_VIDEO", "kicker": "VIDEO", "title": "Si querés verlo antes de seguir", "body": "Estos dos videos sirven especialmente para visualizar estructura atómica y cómo se forman los enlaces. No reemplazan la teoría: son una segunda explicación.", "video": [{"title": "Atomic Structure · Cognito", "url": "https://www.youtube.com/results?search_query=Cognito+Atomic+Structure+GCSE+Chemistry", "why": "Protones, neutrones, electrones, Z y A."}, {"title": "Ionic & Covalent Bonding · Cognito", "url": "https://www.youtube.com/results?search_query=Cognito+Ionic+Covalent+Bonding+GCSE+Chemistry", "why": "Transferencia vs. compartición de electrones."}]}], "steps": [{"id": "ATOM-THEORY", "type": "THEORY", "label": "Teoría"}, {"id": "ATOM-P1", "type": "PRACTICE", "label": "Práctica 1", "source": "Q-ME-017a", "exercise": {"surface": "DIRECT", "prompt": "Un átomo tiene 22 protones, 22 electrones y 26 neutrones. ¿Cuál es su número másico A?", "instruction": "Escribí sólo el número.", "accepted": ["48"], "trap_values": ["26"], "trap_message": "Acá la trampa era usar sólo los neutrones. A suma protones + neutrones: 22 + 26.", "theory_anchor": "TH_ZA", "hints": ["A no cuenta electrones.", "A = protones + neutrones.", "THEORY:TH_ZA"], "wrong": "Sumá protones y neutrones. Los electrones no forman parte del número másico."}}, {"id": "ATOM-P2", "type": "PRACTICE", "label": "Práctica 2", "source": "Q-ME-030", "exercise": {"surface": "CLASSIFY", "prompt": "Indicá qué enlace aparece en cada compuesto.", "instruction": "Usá el criterio metal/no metal y, cuando corresponda, polaridad.", "rows": [{"label": "NaCl", "options": ["Iónico", "Covalente polar", "Covalente apolar"], "answer": "Iónico"}, {"label": "H₂O", "options": ["Iónico", "Covalente polar", "Covalente apolar"], "answer": "Covalente polar"}, {"label": "LiBr", "options": ["Iónico", "Covalente polar", "Covalente apolar"], "answer": "Iónico"}, {"label": "Cl₂", "options": ["Iónico", "Covalente polar", "Covalente apolar"], "answer": "Covalente apolar"}], "theory_anchor": "TH_BONDS", "hints": ["Primero identificá si hay metal + no metal.", "Metal + no metal suele indicar enlace iónico; entre no metales, covalente.", "THEORY:TH_BONDS"], "wrong": "Revisá los elementos de las filas marcadas antes de mirar la fórmula completa."}}, {"id": "ATOM-P3", "type": "PRACTICE", "label": "Práctica 3", "source": "Q-ME-023", "exercise": {"surface": "SINGLE", "prompt": "¿Qué descripción corresponde a un enlace iónico?", "instruction": "Elegí una opción.", "options": [{"id": "a", "text": "Se comparten electrones entre no metales."}, {"id": "b", "text": "Se transfieren electrones entre un metal y un no metal.", "correct": true}, {"id": "c", "text": "Iones positivos quedan unidos por una nube de electrones."}], "theory_anchor": "TH_BONDS", "hints": ["Buscá la palabra que diferencia iónico de covalente.", "Iónico implica transferencia; covalente, compartición.", "THEORY:TH_BONDS"], "wrong": "La clave es transferencia de electrones entre metal y no metal."}}, {"id": "ATOM-CHECK", "type": "CHECKPOINT", "label": "Checkpoint", "source": "Q-ME-024", "exercise": {"surface": "CLASSIFY", "prompt": "Nombrá estos aniones.", "instruction": "Elegí el nombre correcto de cada uno.", "rows": [{"label": "SO₄²⁻", "options": ["Sulfato", "Fosfato", "Carbonato"], "answer": "Sulfato"}, {"label": "PO₄³⁻", "options": ["Carbonato", "Fosfato", "Sulfato"], "answer": "Fosfato"}, {"label": "CO₃²⁻", "options": ["Sulfato", "Carbonato", "Fosfato"], "answer": "Carbonato"}], "theory_anchor": "TH_BONDS", "hints": ["Acá hace falta reconocer los nombres de tres oxoaniones frecuentes.", "SO₄²⁻ sulfato; PO₄³⁻ fosfato; CO₃²⁻ carbonato.", "THEORY:TH_BONDS"], "wrong": "Revisá las fórmulas: sulfato, fosfato y carbonato tienen átomos centrales distintos."}}]}, {"id": "REACTIONS", "title": "Reacciones y mol", "short": "REACCIONES · MOL", "world": "A", "theory": [{"id": "TH_CHANGE", "kicker": "IDEA", "title": "Cambio físico y cambio químico", "body": "En un cambio físico no cambia la composición química de las sustancias. En un cambio químico aparecen sustancias con composición diferente. Condensar agua es un cambio físico; corrosión y combustión son cambios químicos.", "bridge": {"step": "RX-P1", "copy": "Con esta distinción ya podés clasificar los primeros casos."}}, {"id": "TH_REACTANTS", "kicker": "LECTURA DE ECUACIONES", "title": "A la izquierda están los reactantes; a la derecha, los productos", "body": "La flecha separa lo que reacciona de lo que se forma. Los coeficientes indican cantidades relativas y no cambian la identidad de la sustancia.", "board": "<div class=\"reaction-board\">\n                  <div><span>reactantes</span><b>N₂ + 3H₂</b></div>\n                  <div class=\"reaction-arrow\">→</div>\n                  <div><span>producto</span><b>2NH₃</b></div>\n                </div>", "bridge": {"step": "RX-P2", "copy": "Ahora podés leer una ecuación sin calcular nada todavía."}}, {"id": "TH_MOLAR", "kicker": "PROCEDIMIENTO", "title": "Masa molar: sumá las masas atómicas con sus subíndices", "body": "Para CO₂ hay un átomo de carbono y dos de oxígeno. Usando C ≈ 12 y O ≈ 16: 12 + 2·16 = 44 g/mol. El subíndice multiplica la contribución de ese elemento.", "board": "<div class=\"calc-board\">\n                  <div class=\"calc-kicker\">CO₂</div>\n                  <div class=\"formula molar-formula\"><span>12</span><span>+</span><span>2 × 16</span><span>=</span><strong>44 g/mol</strong></div>\n                </div>", "bridge": {"step": "RX-P3", "copy": "Con este procedimiento ya podés calcular la masa molar de CO₂."}}, {"id": "TH_MOLES", "kicker": "REGLA", "title": "Para pasar de masa a moles: n = m / M", "body": "n es cantidad de sustancia en moles, m es masa y M es masa molar. Si tenés 130 g de CO₂ y M = 44 g/mol, dividís 130 por 44. El resultado es aproximadamente 2,95 mol.", "board": "<div class=\"calc-board\">\n                  <div class=\"formula big-formula\"><span>n =</span><span class=\"frac\"><b>m</b><i></i><b>M</b></span></div>\n                  <div class=\"formula compact\">130 g ÷ 44 g/mol ≈ <strong>2,95 mol</strong></div>\n                </div>"}], "steps": [{"id": "RX-THEORY", "type": "THEORY", "label": "Teoría"}, {"id": "RX-P1", "type": "PRACTICE", "label": "Práctica 1", "source": "Q-ME-034", "exercise": {"surface": "CLASSIFY", "prompt": "Clasificá los cambios.", "instruction": "Físico o químico.", "rows": [{"label": "Condensación del agua", "options": ["Físico", "Químico"], "answer": "Físico"}, {"label": "Disolución de azúcar en agua", "options": ["Físico", "Químico"], "answer": "Físico"}, {"label": "Corrosión de un metal", "options": ["Físico", "Químico"], "answer": "Químico"}, {"label": "Combustión del petróleo", "options": ["Físico", "Químico"], "answer": "Químico"}, {"label": "Ciclo del agua", "options": ["Físico", "Quím const KEY='jose_quimica_world_v20260818_2';
const byTopic=Object.fromEntries(TOPICS.map(t=>[t.id,t]));
const byStep={};TOPICS.forEach(t=>t.steps.forEach((s,i)=>{s.topicId=t.id;s.index=i;byStep[s.id]=s}));
const DEFAULT={
 version:2,topicId:TOPICS[0].id,muted:false,completed:{},exercise:{},topicState:{},streak:0,recentStickers:[]
};
TOPICS.forEach(t=>DEFAULT.topicState[t.id]={currentStepId:t.steps[0].id,deepestUnlocked:1,theoryScroll:0});
let state=load();
let returnFrame=null,anchorTarget=null,interactionLocked=false,timerHandle=null,toastHandle=null;
const stageScroll=document.getElementById('stageScroll'),stagePage=document.getElementById('stagePage'),worldScene=document.getElementById('worldScene'),worldWindow=document.getElementById('worldWindow');

function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(!x||x.version!==2)return clone(DEFAULT);const y=Object.assign(clone(DEFAULT),x);TOPICS.forEach(t=>{y.topicState[t.id]=Object.assign(clone(DEFAULT.topicState[t.id]),y.topicState?.[t.id]||{})});return y}catch(e){return clone(DEFAULT)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function topic(){return byTopic[state.topicId]}
function tstate(t=topic()){return state.topicState[t.id]}
function step(){return byStep[tstate().currentStepId]||topic().steps[0]}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s??'').trim().toLowerCase().replace(/\s+/g,' ').replace(',','.')}
function exs(id){if(!state.exercise[id])state.exercise[id]={attempts:0,hint:0,response:null,checked:false,correct:false,rowResponses:{}};return state.exercise[id]}
function available(s){return s.type==='THEORY'||s.index<=tstate(byTopic[s.topicId]).deepestUnlocked}
function completedCount(t){return t.steps.slice(1).filter(s=>state.completed[s.id]).length}
function requiredCount(t){return t.steps.length-1}

function setTopic(delta){
 if(interactionLocked)return false;
 const i=TOPICS.findIndex(t=>t.id===state.topicId),j=i+delta;if(j<0||j>=TOPICS.length)return false;
 tstate().theoryScroll=step().type==='THEORY'?stageScroll.scrollTop:tstate().theoryScroll;
 state.topicId=TOPICS[j].id;save();play('NAV');render(true);return true;
}
function goStep(targetId,{sound=true}={}){
 if(interactionLocked)return false;const s=byStep[targetId];if(!s||s.topicId!==state.topicId||!available(s))return false;
 const old=step();if(old.type==='THEORY')tstate().theoryScroll=stageScroll.scrollTop;
 tstate().currentStepId=s.id;save();if(sound)play('NAV');render();return true;
}
function goDepth(delta){
 const t=topic(),i=step().index,j=i+delta;
 if(j<0||j>=t.steps.length)return false;
 const s=t.steps[j];if(!available(s))return false;
 return goStep(s.id);
}
function unlockAfter(s){
 const ts=tstate();if(s.index>=ts.deepestUnlocked&&s.index<topp().steps.length-1){ts.deepestUnlocked=Math.min(topp().steps.length-1,s.index+1);return true}return false
}
function topp(){return topic()}

function render(topicChanged=false){
 renderStage(topicChanged);renderRail();updateSound();save();
}
function renderStage(topicChanged=false){
 const t=topic(),s=step();
 document.getElementById('keyboardHint').textContent=s.type==='THEORY'?'← → temas · ↑ ↓ mapa':'← → temas · ↑ ↓ mapa · Enter comprobar';
 if(s.type==='THEORY')renderTheory(t);else renderExercise(s,t);
 requestAnimationFrame(()=>{
   if(s.type==='THEORY'){
     if(anchorTarget){
       const el=document.getElementById(anchorTarget);anchorTarget=null;
       if(el){el.scrollIntoView({block:'center'});el.classList.add('anchor-hit');setTimeout(()=>el.classList.remove('anchor-hit'),1600)}
     }else if(!returnFrame)stageScroll.scrollTop=tstate().theoryScroll||0;
   }else if(!returnFrame)stageScroll.scrollTop=0;
 });
}
function renderTheory(t){
 const back=returnFrame?`<button class="theory-back" id="exactBack">← volver al ejercicio</button>`:'';
 const sections=t.theory.map(sec=>{
   const board=sec.board?`<div class="board">${sec.board}</div>`:'';
   const bridge=sec.bridge?renderBridge(sec.bridge):'';
   const videos=sec.video?`<div class="video-stack">${sec.video.map(v=>`<div class="video-card"><div class="video-thumb">▶</div><div class="video-copy"><strong>${esc(v.title)}</strong><small>${esc(v.why)}</small></div><a target="_blank" rel="noopener" href="${esc(v.url)}">Buscar video ↗</a></div>`).join('')}</div>`:'';
   return `<section class="theory-section" id="${sec.id}"><div class="theory-kicker">${esc(sec.kicker)}</div><h2>${esc(sec.title)}</h2><p>${esc(sec.body)}</p>${board}${videos}${bridge}</section>`;
 }).join('');
 stagePage.innerHTML=`<div class="theory-sheet">${back}<header class="theory-intro"><div class="eyebrow">${esc(t.short)} · TEORÍA</div><h1 class="page-title">${esc(t.title)}</h1></header><div class="rule"></div>${sections}</div>`;
 if(returnFrame)document.getElementById('exactBack').onclick=closeTheory;
 stagePage.querySelectorAll('.bridge-btn').forEach(b=>b.onclick=()=>goStep(b.dataset.step));
}
function renderBridge(b){
 const s=byStep[b.step],ok=s&&available(s);
 return `<div class="practice-bridge"><span>${esc(b.copy)}</span><button class="bridge-btn" data-step="${b.step}" ${ok?'':'disabled'}>${ok?'ir '+esc(s.label)+' ↓':'todavía bloqueado'}</button></div>`;
}
function renderExercise(s,t){
 const e=s.exercise,es=exs(s.id),status=state.completed[s.id]?'COMPLETO':s.type==='CHECKPOINT'?'CHECKPOINT':s.label.toUpperCase();
 let zone='';
 if(e.surface==='SINGLE')zone=renderSingle(s,e,es);
 if(e.surface==='CLASSIFY')zone=renderClassify(s,e,es);
 if(e.surface==='DIRECT')zone=renderDirect(s,e,es);
 const feedback=es.feedback||'';
 const fclass=es.correct?'good':es.attempts?'bad':'';
 const hint=renderHint(s,e,es);
 const action=state.completed[s.id]?nextActionLabel(s):'COMPROBAR';
 stagePage.innerHTML=`<div class="practice-shell"><header class="practice-head"><div class="step-kicker">${esc(t.short)} · ${esc(status)}</div><h1 class="prompt">${esc(e.prompt)}</h1><p class="instruction">${esc(e.instruction||'')}</p></header><div class="response-zone">${zone}</div><div class="feedback-slot ${fclass}">${feedback?esc(feedback):' '}</div>${hint}<div class="action-row"><button class="btn" id="hintBtn">${es.hint? 'otra pista':'pista'}</button><button class="btn" id="theoryBtn">ver teoría</button><button class="btn primary" id="primaryBtn">${action}</button></div></div>`;
 wireExercise(s,e,es);
}
function renderSingle(s,e,es){
 return `<div class="choices">${e.options.map(o=>`<button class="choice ${es.response===o.id?'selected':''} ${es.checked&&es.response===o.id?(o.correct?'correct':'wrong'):''}" data-opt="${o.id}"><span class="mark">✓</span><span>${esc(o.text)}</span></button>`).join('')}</div>`;
}
function renderClassify(s,e,es){
 return `<div class="classify">${e.rows.map((r,i)=>{const val=es.rowResponses?.[i],bad=es.checked&&val!==r.answer,good=es.checked&&val===r.answer;return `<div class="class-row ${bad?'bad':''} ${good?'good':''}"><div class="class-label">${esc(r.label)}</div><div class="class-options">${r.options.map(o=>`<button class="mini-choice ${val===o?'selected':''}" data-row="${i}" data-val="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`}).join('')}</div>`;
}
function renderDirect(s,e,es){
 return `<div class="direct-line"><input id="directInput" class="direct-input" autocomplete="off" inputmode="decimal" placeholder="respuesta" value="${esc(es.response??'')}"></div>`;
}
function renderHint(s,e,es){
 if(!es.hint)return `<div class="hint-slot"></div>`;
 const idx=Math.min(es.hint-1,e.hints.length-1),h=e.hints[idx];
 if(String(h).startsWith('THEORY:'))return `<div class="hint-slot"><div class="hint-line"><span class="hint-badge">H${es.hint}</span><span>Volvé a la parte exacta de la teoría.</span></div><button class="hint-theory" id="hintTheory">abrir teoría exacta →</button></div>`;
 return `<div class="hint-slot"><div class="hint-line"><span class="hint-badge">H${es.hint}</span><span>${esc(h)}</span></div></div>`;
}
function wireExercise(s,e,es){
 stagePage.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{if(state.completed[s.id])return;es.response=b.dataset.opt;es.checked=false;es.feedback='';save();renderStage()});
 stagePage.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>{if(state.completed[s.id])return;es.rowResponses[+b.dataset.row]=b.dataset.val;es.checked=false;es.feedback='';save();renderStage()});
 const inp=document.getElementById('directInput');if(inp){inp.oninput=()=>{es.response=inp.value;es.checked=false;es.feedback='';save()};inp.focus({preventScroll:true})}
 document.getElementById('hintBtn').onclick=()=>openHint(s,e,es);
 document.getElementById('theoryBtn').onclick=()=>openTheory(e.theory_anchor);
 const pb=document.getElementById('primaryBtn');pb.onclick=()=>state.completed[s.id]?advance(s):check(s,e,es);
 const ht=document.getElementById('hintTheory');if(ht)ht.onclick=()=>openTheory(e.theory_anchor);
}
function openHint(s,e,es){
 if(!e.hints?.length)return;es.hint=Math.min((es.hint||0)+1,e.hints.length);save();play('HINT');
 if(es.hint===1)showToast('Pista','Mirá sólo una cosa antes de volver a intentar.','hint');
 renderStage();
}
function openTheory(anchor){
 if(interactionLocked)return;const s=step();
 returnFrame={topicId:state.topicId,stepId:s.id,scroll:stageScroll.scrollTop,focus:document.activeElement?.id||null};
 tstate().currentStepId=topic().steps[0].id;anchorTarget=anchor;save();play('NAV');render();
}
function closeTheory(){
 if(!returnFrame)return;const f=returnFrame;returnFrame=null;state.topicId=f.topicId;tstate().currentStepId=f.stepId;save();render();requestAnimationFrame(()=>{stageScroll.scrollTop=f.scroll||0;const el=document.getElementById(f.focus);if(el)el.focus({preventScroll:true})});play('BACK');
}
function check(s,e,es){
 if(interactionLocked)return;
 let ok=false,ready=true;
 if(e.surface==='SINGLE'){ready=!!es.response;const o=e.options.find(x=>x.id===es.response);ok=!!o?.correct}
 if(e.surface==='CLASSIFY'){ready=e.rows.every((r,i)=>es.rowResponses?.[i]!=null);ok=ready&&e.rows.every((r,i)=>es.rowResponses[i]===r.answer)}
 if(e.surface==='DIRECT'){ready=String(es.response??'').trim()!=='';ok=ready&&e.accepted.map(norm).includes(norm(es.response))}
 if(!ready){es.feedback='Completá la respuesta antes de comprobar.';renderStage();return}
 es.attempts=(es.attempts||0)+1;es.checked=true;
 if(ok){
   const recovery=es.attempts>1||es.hint>0;es.correct=true;state.completed[s.id]=true;state.streak=recovery?0:(state.streak||0)+1;
   es.feedback=recovery?'Ahora sí. Corregiste el punto que estaba trabando el ejercicio.':'Bien. La regla que usaste coincide con este caso.';
   const unlocked=unlockAfter(s);save();play(recovery?'RECOVERY':'GOOD');render();
   if(recovery)showToast('Ahora sí','Quedó recuperado.','recovery');
   if(unlocked)setTimeout(()=>showToast('Nuevo tramo','Ahora podés bajar un nivel más.','correct'),360);
   if(s.type==='CHECKPOINT')setTimeout(()=>showIntervention({family:'complete',kicker:'Checkpoint',title:'Tema completo.',message:'Podés volver a la teoría, repasar niveles o pasar al tema siguiente.',wait:0,action:'Seguir'}),520);
   return;
 }
 es.correct=false;state.streak=0;es.feedback=e.wrong||'Revisá el paso anterior.';save();play('WRONG');
 const trap=e.trap_values?.map(norm).includes(norm(es.response));
 if(trap){showIntervention({family:'trap',kicker:'Respuesta trampa',title:'Acá estaba la trampa.',message:e.trap_message,wait:3000,action:'Volver al ejercicio'});return}
 if(es.attempts>=2){showIntervention({family:'repeat',kicker:'Segundo intento',title:'Revisá una sola idea antes de seguir.',message:e.wrong,wait:0,action:'Volver al ejercicio'});return}
 renderStage();
}
function nextActionLabel(s){
 const t=topic(),i=s.index;if(i>=t.steps.length-1)return 'CERRAR';const next=t.steps[i+1];return available(next)?'SIGUIENTE':'TERMINAR';
}
function advance(s){
 const t=topic(),i=s.index;if(i>=t.steps.length-1){showIntervention({family:'complete',kicker:'Tema',title:'Este recorrido quedó completo.',message:'Podés cambiar de tema con ← → o volver a cualquier parte del mapa.',wait:0,action:'Volver'});return}
 const n=t.steps[i+1];if(available(n))goStep(n.id);else showToast('Listo','El siguiente tramo todavía no está habilitado.','correct');
}
function unlockAfter(s){
 const ts=tstate(),last=topic().steps.length-1;
 if(s.index>=ts.deepestUnlocked&&s.index<last){ts.deepestUnlocked=Math.min(last,s.index+1);return true}
 return false;
}

/* rail */
const NODE_Y=[150,405,665,925,1175],NODE_X=[50,62,45,59,48];
function renderRail(){
 const t=topic(),idx=TOPICS.findIndex(x=>x.id===t.id),ts=tstate(),s=step();
 document.getElementById('railLevel').textContent=`TEMA ${idx+1} DE ${TOPICS.length}`;
 document.getElementById('railTitle').textContent=t.title;
 document.getElementById('prevPeek').textContent=idx>0?'‹ '+TOPICS[idx-1].short:'';
 document.getElementById('nextPeek').textContent=idx<TOPICS.length-1?TOPICS[idx+1].short+' ›':'';
 document.getElementById('prevTopic').disabled=idx<=0;document.getElementById('nextTopic').disabled=idx>=TOPICS.length-1;
 const req=t.steps.slice(1),done=req.filter(x=>state.completed[x.id]).length;
 document.getElementById('progressBar').innerHTML=req.map(x=>`<i class="${state.completed[x.id]?'done':''}"></i>`).join('');
 document.getElementById('railCount').textContent=`${done}/${req.length}`;
 const visible=t.steps.filter((x,i)=>i<=Math.min(t.steps.length-1,ts.deepestUnlocked+1));
 const pts=visible.map((x,i)=>({x:NODE_X[i]*3,y:NODE_Y[i]}));
 let path='';pts.forEach((p,i)=>path+=(i?' L ':'M ')+p.x+' '+p.y);
 let lastDone=0;for(let i=1;i<t.steps.length;i++){if(state.completed[t.steps[i].id])lastDone=i;else break}
 const donePts=pts.slice(0,Math.min(pts.length,lastDone+1));let donePath='';donePts.forEach((p,i)=>donePath+=(i?' L ':'M ')+p.x+' '+p.y);
 worldScene.innerHTML=`<img class="world-bg" src="${WORLDS[t.world]}" alt=""><div class="world-veil"></div><svg class="route-svg" viewBox="0 0 300 1320" preserveAspectRatio="none"><path class="route-line" d="${path}"/><path class="route-line-done" d="${donePath}"/></svg>`+
 visible.map((x,i)=>nodeHtml(x,i,pts[i])).join('');
 worldScene.querySelectorAll('.map-node:not(.locked)').forEach(b=>b.onclick=()=>goStep(b.dataset.step));
 const currentY=NODE_Y[s.index]||NODE_Y[0],vh=worldWindow.clientHeight,min=vh-1320;
 const target=Math.max(min,Math.min(0,vh*.5-currentY));
 worldScene.style.transform=`translateY(${target}px)`;
 document.getElementById('upBtn').disabled=s.index<=0;
 document.getElementById('downBtn').disabled=s.index>=ts.deepestUnlocked;
}
function nodeHtml(s,i,p){
 const cur=s.id===step().id,done=!!state.completed[s.id],locked=!available(s);
 const sym=s.type==='THEORY'?'≡':s.type==='CHECKPOINT'?'◇':String(i).padStart(2,'0');
 return `<button class="map-node ${cur?'current':''} ${done?'completed':''} ${locked?'locked':''}" data-step="${s.id}" data-type="${s.type}" style="left:${p.x/3}%;top:${p.y}px" ${locked?'disabled':''}><span class="node-core"><span class="node-symbol">${done?'✓':sym}</span></span><span class="node-label">${esc(s.label)}</span></button>`;
}
document.getElementById('prevTopic').onclick=()=>setTopic(-1);document.getElementById('nextTopic').onclick=()=>setTopic(1);
document.getElementById('upBtn').onclick=()=>goDepth(-1);document.getElementById('downBtn').onclick=()=>goDepth(1);
let wheelSum=0,wheelTimer=null;worldWindow.addEventListener('wheel',e=>{e.preventDefault();if(interactionLocked)return;wheelSum+=e.deltaY;clearTimeout(wheelTimer);if(Math.abs(wheelSum)>50){const d=wheelSum>0?1:-1;wheelSum=0;goDepth(d)}wheelTimer=setTimeout(()=>wheelSum=0,100)},{passive:false});

/* stickers / intervention */
function sticker(family){
 const pool=STICKERS[family]||[];if(!pool.length)return '';
 const recent=state.recentStickers||[],candidates=pool.filter(x=>!recent.includes(x));
 const pick=(candidates.length?candidates:pool)[Math.floor(Math.random()*(candidates.length?candidates:pool).length)];
 state.recentStickers=[...(recent||[]),pick].slice(-2);save();return pick;
}
function showToast(title,msg,family){
 const el=document.getElementById('toast'),im=document.getElementById('toastImg'),src=sticker(family);
 document.getElementById('toastTitle').textContent=title;document.getElementById('toastMsg').textContent=msg;
 if(src){im.src=src;im.style.visibility='visible'}else im.style.visibility='hidden';
 el.classList.add('show');clearTimeout(toastHandle);toastHandle=setTimeout(()=>el.classList.remove('show'),1700);
}
function showIntervention({family,kicker,title,message,wait=0,action='Volver'}){
 interactionLocked=true;const box=document.getElementById('intervention'),im=document.getElementById('intSticker'),src=sticker(family);
 document.getElementById('intKicker').textContent=kicker;document.getElementById('intTitle').textContent=title;document.getElementById('intMessage').textContent=message;
 if(src){im.src=src;im.style.visibility='visible'}else im.style.visibility='hidden';
 const btn=document.getElementById('intAction');btn.textContent=action;btn.disabled=wait>0;box.classList.add('open');
 clearInterval(timerHandle);const num=document.getElementById('timerNumber'),lab=document.getElementById('timerLabel');
 if(wait){const start=Date.now();const tick=()=>{const left=Math.max(0,wait-(Date.now()-start)),sec=Math.ceil(left/1000);num.textContent=sec||'✓';lab.textContent=left?'revisá esta idea':'ya podés volver';if(!left){clearInterval(timerHandle);btn.disabled=false;play('READY')}};tick();timerHandle=setInterval(tick,160)}
 else{num.textContent='';lab.textContent=''}
 btn.onclick=()=>{box.classList.remove('open');interactionLocked=false;renderStage()};
}

/* audio */
let AC=null;
function ensureAudio(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}
function play(kind){
 if(state.muted)return;try{ensureAudio();const now=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
 const f={NAV:145,HINT:260,GOOD:420,RECOVERY:520,WRONG:92,BACK:170,READY:350}[kind]||180;o.frequency.setValueAtTime(f,now);
 g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(kind==='WRONG'?.05:.032,now+.006);g.gain.exponentialRampToValueAtTime(.0001,now+.07);o.start(now);o.stop(now+.08)}catch(e){}
}
function updateSound(){const b=document.getElementById('soundBtn');b.classList.toggle('muted',state.muted);b.textContent=state.muted?'⊘':'⌁'}
document.getElementById('soundBtn').onclick=()=>{state.muted=!state.muted;save();updateSound();if(!state.muted)play('NAV')};

/* keyboard: same semantic commands as pointer */
document.addEventListener('keydown',e=>{
 if(interactionLocked)return;
 const tag=document.activeElement?.tagName,editing=tag==='INPUT'||tag==='TEXTAREA'||document.activeElement?.isContentEditable;
 if(editing){if(e.key==='Enter'){e.preventDefault();document.getElementById('primaryBtn')?.click()}return}
 if(e.key==='ArrowLeft'){if(setTopic(-1))e.preventDefault();return}
 if(e.key==='ArrowRight'){if(setTopic(1))e.preventDefault();return}
 if(e.key==='ArrowUp'){if(goDepth(-1))e.preventDefault();return}
 if(e.key==='ArrowDown'){if(goDepth(1))e.preventDefault();return}
 if(e.key==='Escape'&&returnFrame){e.preventDefault();closeTheory();return}
 if(e.key==='Enter'){const p=document.getElementById('primaryBtn');if(p){e.preventDefault();p.click()}}
});

/* save theory scroll without turning scroll into selection */
let scrollSave=null;stageScroll.addEventListener('scroll',()=>{if(step().type!=='THEORY'||returnFrame)return;clearTimeout(scrollSave);scrollSave=setTimeout(()=>{tstate().theoryScroll=stageScroll.scrollTop;save()},140)});

window.addEventListener('resize',()=>renderRail());
render();
</script>
</body>
</html>
