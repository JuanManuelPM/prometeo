<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prometeo · Guides</title>
<style>
:root{color-scheme:dark;--bg:#000;--fg:#fff;--line:#292929;--dim:#8e8e8e}
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
main{width:min(1080px,100%);margin:auto;padding:16px 14px 44px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;border-bottom:1px solid var(--line);padding-bottom:13px}
.brand{font-size:10px;font-weight:900;letter-spacing:.18em}.stamp{font:800 9px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.48;text-align:right}
h1{font-size:28px;letter-spacing:-.045em;margin:6px 0 0}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr)}
nav{border-right:1px solid var(--line)}
.guideBtn{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#000;color:#fff;padding:15px 13px;cursor:pointer}
.guideBtn[aria-selected="true"]{background:#fff;color:#000}
.guideTop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.guideName{font-size:16px;font-weight:850;letter-spacing:-.02em}
.guideStatus{font:800 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.07em}
.guideTime{font:700 9px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:5px;opacity:.55}
main article{min-width:0;padding:22px 22px 36px}
.kicker{font:850 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;opacity:.5}
#title{font-size:31px;letter-spacing:-.045em;margin:7px 0 7px}
#mission{font-size:13px;line-height:1.48;opacity:.62;max-width:700px}
.message{padding:22px 0;border-bottom:1px solid var(--line)}
#headline{font:26px/1.18 Georgia,"Times New Roman",serif;margin:8px 0}
#spoken{font:16px/1.55 Georgia,"Times New Roman",serif;opacity:.78;max-width:720px}
.timeLine{font:800 9px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;opacity:.5}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}
button.action,a.action{border:1px solid #fff;background:#fff;color:#000;min-height:39px;padding:0 12px;display:inline-flex;align-items:center;text-decoration:none;font:900 10px/1 system-ui;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
a.action.alt{background:#000;color:#fff}
#copyState{font-size:10px;opacity:.5;align-self:center}
.columns{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
section{padding:16px 0;border-bottom:1px solid var(--line)}
h2{font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.45;margin:0 0 9px}
.item{font-size:13px;line-height:1.42;padding:7px 0;border-top:1px solid #171717}.item:first-child{border-top:0}
.empty{font-size:13px;opacity:.4}
.footerLink{padding-top:16px;font-size:11px}.footerLink a{color:#fff;font-weight:850}
@media(max-width:760px){
 .layout{grid-template-columns:1fr}
 nav{border-right:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr}
 .guideBtn:nth-child(odd){border-right:1px solid var(--line)}
 main article{padding:20px 2px 34px}
 .columns{grid-template-columns:1fr}
}
</style>
</head>
<body><main>
<header><div><div class="brand">PROMETEO</div><h1>GUIDES</h1></div><div class="stamp" id="server">cargando…</div></header>
<div class="layout">
<nav id="guideNav" aria-label="Cambiar Guide"></nav>
<article>
  <div class="kicker" id="kind">GUIDE</div>
  <div id="title">…</div>
  <div id="mission"></div>

  <div class="message">
    <div class="kicker">MENSAJE ACTUAL</div>
    <div id="headline">cargando…</div>
    <div class="timeLine" id="updated"></div>
    <div id="spoken"></div>
  </div>

  <div class="actions">
    <a id="openGuide" class="action" href="#">ABRIR GUIDE</a>
    <button id="invoke" class="action" type="button">INVOCAR</button>
    <a id="playStrategy" class="action alt" href="/prometeo/strategy/" hidden>PLAY</a>
    <span id="copyState"></span>
  </div>

  <div class="columns">
    <section><h2>Ahora</h2><div id="read"></div></section>
    <section><h2>Trabajo abierto</h2><div id="work"></div></section>
    <section><h2>Ideas</h2><div id="ideas"></div></section>
    <section><h2>Capacidades</h2><div id="caps"></div></section>
  </div>

  <div class="footerLink"><a href="/prometeo/guides/foundry/">DOMAIN FOUNDRY V1 →</a> <span style="opacity:.45">diseña y audita los exámenes de estos Guides</span></div>
</article>
</div>
</main>
<script>
(()=>{
const BASE='https://catnohyouxqjjtseaueb.supabase.co/rest/v1/rpc/';
const KEY='sb_publishable_eqh3PngXs4UjLLWiY3pz1w_nhHtf7X-';
const HEAD={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const TZ='America/Argentina/Buenos_Aires';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let registry=[],selected='STRATEGY',ctx=null;
const fmt=t=>!t?'sin actualización':new Intl.DateTimeFormat('es-AR',{timeZone:TZ,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(t));
function age(t){
 if(!t)return 'sin actualización';
 const s=Math.max(0,Math.round((Date.now()-new Date(t).getTime())/1000));
 if(s<60)return 'hace '+s+'s';
 if(s<3600)return 'hace '+Math.floor(s/60)+'m';
 if(s<86400)return 'hace '+Math.floor(s/3600)+'h';
 return 'hace '+Math.floor(s/86400)+'d';
}
function list(id,a){
 const el=document.getElementById(id);
 el.innerHTML=Array.isArray(a)&&a.length?a.map(x=>'<div class="item">'+esc(typeof x==='string'?x:JSON.stringify(x))+'</div>').join(''):'<div class="empty">Sin contenido todavía.</div>';
}
async function rpc(name,args){
 const r=await fetch(BASE+name,{method:'POST',headers:HEAD,body:JSON.stringify(args||{}),cache:'no-store'});
 if(!r.ok)throw new Error(name+' '+r.status);
 return await r.json();
}
function renderNav(){
 document.getElementById('guideNav').innerHTML=registry.map(g=>
  '<button class="guideBtn" data-key="'+esc(g.guide_key)+'" aria-selected="'+(g.guide_key===selected?'true':'false')+'">'+
   '<div class="guideTop"><span class="guideName">'+esc(g.short_title)+'</span><span class="guideStatus">'+esc(g.capsule_status||g.status)+'</span></div>'+
   '<div class="guideTime">'+esc(age(g.generated_at))+' · '+esc(fmt(g.generated_at))+'</div>'+
  '</button>'
 ).join('');
 document.querySelectorAll('.guideBtn').forEach(b=>b.onclick=()=>selectGuide(b.dataset.key));
}
async function selectGuide(key){
 selected=key;renderNav();
 try{
  ctx=await rpc('prometeo_domain_guide_context_v1',{p_guide_key:key});
  const g=ctx.guide||{},c=ctx.capsule||{};
  document.getElementById('kind').textContent=(g.domain_type||'GUIDE')+' · '+(g.guide_key||'');
  document.getElementById('title').textContent=g.short_title||g.title||key;
  document.getElementById('mission').textContent=g.mission||'';
  document.getElementById('headline').textContent=c.headline||'Sin CURRENT todavía.';
  document.getElementById('updated').textContent='ACTUALIZADO '+fmt(c.generated_at)+' · '+age(c.generated_at)+' · v'+(c.version||0);
  document.getElementById('spoken').textContent=c.spoken_brief||'Todavía no hay un mensaje hablado sintetizado para este Guide.';
  list('read',c.current_read);list('work',c.open_work);list('ideas',c.ideas);list('caps',c.capabilities);
  document.getElementById('openGuide').href='/prometeo'+(g.page_route||'/guides/');
  document.getElementById('playStrategy').hidden=g.guide_key!=='STRATEGY';
  history.replaceState(null,'','#'+String(g.slug||key).toLowerCase());
 }catch(e){
  document.getElementById('headline').textContent='No se pudo cargar el Guide.';
 }
}
async function load(){
 try{
  const s=await rpc('prometeo_domain_guide_registry_v1',{});
  registry=s.guides||[];
  document.getElementById('server').textContent='LIVE · '+new Intl.DateTimeFormat('es-AR',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(s.server_time));
  const hash=location.hash.replace('#','');
  const matched=registry.find(g=>String(g.slug).toLowerCase()===hash.toLowerCase());
  if(matched)selected=matched.guide_key;
  else if(!registry.some(g=>g.guide_key===selected)&&registry[0])selected=registry[0].guide_key;
  renderNav();
  await selectGuide(selected);
 }catch(e){document.getElementById('server').textContent='reconectando'}
}
document.getElementById('invoke').onclick=async()=>{
 try{
  if(!ctx)return;
  const r=await fetch('/prometeo'+ctx.guide.invoke_route,{cache:'no-store'});
  if(!r.ok)throw new Error(r.status);
  await navigator.clipboard.writeText(await r.text());
  document.getElementById('copyState').textContent='prompt copiado';
 }catch(e){document.getElementById('copyState').textContent='no se pudo copiar'}
};
load();
setInterval(async()=>{
 try{
  const s=await rpc('prometeo_domain_guide_registry_v1',{});
  registry=s.guides||registry;renderNav();
  await selectGuide(selected);
 }catch{}
},30000);
})();
</script></body></html>
