<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prometeo · Autonomy Mesh V1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(940px,100%);margin:auto;padding:16px 14px 48px}
header{display:flex;justify-content:space-between;gap:14px;align-items:end;border-bottom:1px solid #292929;padding-bottom:12px}
h1{font-size:28px;letter-spacing:-.045em;margin:5px 0 0}.k{font:850 9px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;opacity:.5}
.metrics{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid #292929}.m{padding:12px 8px;border-right:1px solid #292929}.m:last-child{border-right:0}.m b{font-size:21px;display:block}.m span{font-size:8px;letter-spacing:.1em;text-transform:uppercase;opacity:.45}
.note{padding:13px 0;border-bottom:1px solid #292929;font-size:12px;line-height:1.45}.note a{color:#fff;font-weight:850}
.task{display:grid;grid-template-columns:34px 1fr auto;gap:10px;padding:13px 0;border-bottom:1px solid #292929}.n{font:900 16px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.meta{font:800 8px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;opacity:.48}.title{font-size:14px;font-weight:820;margin-top:4px}.sub{font:700 9px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.5;margin-top:5px}.state{font:850 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid currentColor;padding:5px 6px;height:max-content}
@media(max-width:650px){.metrics{grid-template-columns:repeat(3,1fr)}.task{grid-template-columns:30px 1fr}.state{grid-column:2;width:max-content}}
</style></head><body><main>
<header><div><div class="k">PROMETEO · GUIDES</div><h1>AUTONOMY MESH V1</h1></div><div class="k" id="stamp">cargando…</div></header>
<div class="metrics">
 <div class="m"><b id="done">–</b><span>done</span></div>
 <div class="m"><b id="ready">–</b><span>ready</span></div>
 <div class="m"><b id="active">–</b><span>active</span></div>
 <div class="m"><b id="blocked">–</b><span>blocked</span></div>
 <div class="m"><b id="workers">–</b><span>workers</span></div>
 <div class="m"><b id="recoveries">–</b><span>recoveries</span></div>
</div>
<div class="note">CURRENTs · voz/perfil · mundo animado · Broker canary · reconciliación. <a href="/prometeo/coordination/design-dna/experiments/AUTONOMY-MESH-V1/WORKER_PROMPT.txt">PROMPT ÚNICO</a> · <a href="/prometeo/guides/">GUIDES</a> · <a href="/prometeo/guides/world/">WORLD</a></div>
<div id="tasks"></div>
</main>
<script>
(()=>{
const B='https://catnohyouxqjjtseaueb.supabase.co/rest/v1/rpc/',K='sb_publishable_eqh3PngXs4UjLLWiY3pz1w_nhHtf7X-';
const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){try{
 const x=await fetch(B+'prometeo_autonomy_mesh_status_v1',{method:'POST',headers:H,body:'{}',cache:'no-store'}).then(r=>r.json());
 const c=x.counts||{},s=x.sessions||{},ts=x.tasks||[];
 done.textContent=c.done||0;ready.textContent=c.ready||0;active.textContent=c.active||0;blocked.textContent=c.blocked||0;workers.textContent=s.total||0;
 recoveries.textContent=ts.reduce((a,t)=>a+(t.recovery_count||0),0);
 stamp.textContent=(x.run?.status||'')+' · '+new Intl.DateTimeFormat('es-AR',{timeZone:'America/Argentina/Buenos_Aires',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(x.server_time));
 tasks.innerHTML=ts.map(t=>'<div class="task"><div class="n">'+String(t.ordinal).padStart(2,'0')+'</div><div><div class="meta">'+esc(t.task_kind)+(t.guide_key?' · '+esc(t.guide_key):'')+'</div><div class="title">'+esc(t.title)+'</div><div class="sub">gen '+esc(t.generation||0)+' · recovery '+esc(t.recovery_count||0)+' · '+esc(t.progress_stage||'—')+'</div></div><div class="state">'+esc(t.state)+'</div></div>').join('');
}catch(e){stamp.textContent='reconectando'}}
load();setInterval(load,3000);
})();
</script></body></html>
