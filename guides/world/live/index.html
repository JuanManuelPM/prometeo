<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Prometeo · World Live</title>
<style>
:root{--line:#59635d;--dim:#89918c;--soft:#111612;--panel:#060a07}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#f4f5f2;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button{font:inherit;color:inherit;background:none;border:0}
.shell{width:100%;height:100%;overflow-x:auto;overflow-y:hidden;display:flex;scroll-snap-type:x mandatory;scroll-behavior:smooth;overscroll-behavior-x:contain;scrollbar-width:none}
.shell::-webkit-scrollbar{display:none}
.screen{position:relative;flex:0 0 100vw;width:100vw;height:100dvh;min-height:100vh;scroll-snap-align:start;background:#000;overflow:hidden}
.ops{padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 14px);display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:12px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{font-size:11px;font-weight:900;letter-spacing:.12em}.clock{font-size:10px;opacity:.66}.live{font-size:10px;font-weight:900;letter-spacing:.1em;text-align:right}
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0}
.pct{font-size:clamp(52px,17vw,108px);font-weight:950;line-height:.82;letter-spacing:-.08em}.pct small{font-size:.28em;letter-spacing:0;margin-left:4px}
.gate{text-align:right;max-width:46vw}.eyebrow{font-size:9px;opacity:.58;letter-spacing:.12em}.gateName{font-size:12px;font-weight:900;margin-top:4px;word-break:break-word}
.track{height:5px;background:#111;border:1px solid #3b433e;margin-top:9px}.fill{height:100%;width:0;background:#f1f3ee;transition:width .35s ease}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line)}
.metric{padding:9px 8px;border-right:1px solid var(--line);min-width:0}.metric:last-child{border-right:0}.n{font-size:22px;font-weight:950;line-height:1}.k{font-size:8px;opacity:.55;margin-top:5px;letter-spacing:.08em}
.action{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;border:1px solid var(--line);padding:10px 11px;align-items:center;background:var(--panel)}
.next{min-width:0}.next strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.next span{font-size:9px;opacity:.55}.need{font-size:12px;font-weight:950;text-align:right}.need.hot{animation:pulse 1.1s ease-in-out infinite}@keyframes pulse{50%{opacity:.42}}
.promptBox{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);border:1px solid var(--line);background:#020402}
.promptHead{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 10px;border-bottom:1px solid #303832}
.promptTitle{min-width:0}.promptTitle b{display:block;font-size:10px;letter-spacing:.08em}.promptTitle span{display:block;font-size:8px;opacity:.52;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.copy,.expand{border:1px solid #67716b;padding:7px 9px;font-size:9px;font-weight:900;cursor:pointer}
.promptText{margin:0;padding:10px 11px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:700 9px/1.38 ui-monospace,SFMono-Regular,Menlo,monospace;color:#d7ddd8}
.promptBox.collapsed .promptText{overflow:hidden;mask-image:linear-gradient(#000 58%,transparent);-webkit-mask-image:linear-gradient(#000 58%,transparent)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:8px;opacity:.58}.hint{font-weight:900;letter-spacing:.08em}
.world{background:#000}.world iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.worldTop{position:absolute;z-index:2;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 10px);display:flex;justify-content:space-between;pointer-events:none}
.pill{background:#000d;border:1px solid #ffffff35;padding:7px 9px;font-size:9px;font-weight:900;letter-spacing:.09em}
.dots{position:fixed;z-index:5;left:50%;bottom:calc(env(safe-area-inset-bottom) + 7px);transform:translateX(-50%);display:flex;gap:7px;background:#000b;padding:6px 9px;border:1px solid #ffffff21}
.dot{width:7px;height:7px;border-radius:50%;background:#5a605c;cursor:pointer}.dot.on{background:#fff}
@media(min-width:900px){
 .ops{padding:22px 28px 18px;gap:15px;grid-template-columns:minmax(0,1.3fr) minmax(420px,.7fr);grid-template-rows:auto auto auto 1fr auto}
 .head,.hero,.metrics,.action,.foot{grid-column:1}.promptBox{grid-column:2;grid-row:1/6}.pct{font-size:min(13vw,150px)}.brand{font-size:14px}.metric{padding:14px}.n{font-size:32px}.k{font-size:10px}.promptText{font-size:10px}
}
</style>
</head>
<body>
<div class="shell" id="shell">
  <section class="screen ops" aria-label="Operación">
    <div class="head">
      <div><div class="brand">PROMETEO · LIVE</div><div class="clock" id="clock">—</div></div>
      <div class="live" id="status">CARGANDO</div>
    </div>

    <div class="hero">
      <div>
        <div class="eyebrow">PRODUCT VERIFIED</div>
        <div class="pct"><span id="productPct">0</span><small>%</small></div>
        <div class="track"><div class="fill" id="productFill"></div></div>
      </div>
      <div class="gate">
        <div class="eyebrow">GATE ACTUAL</div>
        <div class="gateName" id="gate">—</div>
      </div>
    </div>

    <div class="metrics">
      <div class="metric"><div class="n" id="ready">0</div><div class="k">READY</div></div>
      <div class="metric"><div class="n" id="active">0</div><div class="k">ACTIVE</div></div>
      <div class="metric"><div class="n" id="blocked">0</div><div class="k">BLOCKED</div></div>
      <div class="metric"><div class="n" id="done">0</div><div class="k">DONE</div></div>
    </div>

    <div class="action">
      <div class="next"><span id="nextLabel">NEXT</span><strong id="nextJob">—</strong><span id="nextMeta">sin frontier</span></div>
      <div class="need" id="need">NO NEED</div>
    </div>

    <div class="promptBox collapsed" id="promptBox">
      <div class="promptHead">
        <div class="promptTitle"><b>PROMPT ACTUAL</b><span id="promptVersion">cargando desde backend…</span></div>
        <button class="copy" id="copy">COPIAR</button>
        <button class="expand" id="expand">VER</button>
      </div>
      <pre class="promptText" id="promptText">Cargando prompt canónico…</pre>
    </div>

    <div class="foot"><span id="reviewRecovery">REVIEW — · RECOVERY —</span><span class="hint">DESLIZÁ → WORLD</span></div>
  </section>

  <section class="screen world" aria-label="World">
    <iframe id="world" src="/prometeo/guides/world/?view=tv" allow="autoplay"></iframe>
    <div class="worldTop"><div class="pill">← OPERACIÓN</div><div class="pill">WORLD</div></div>
  </section>
</div>

<div class="dots"><button class="dot on" data-page="0" aria-label="Operación"></button><button class="dot" data-page="1" aria-label="World"></button></div>

<script>
(()=>{
const B='https://catnohyouxqjjtseaueb.supabase.co/rest/v1/rpc/';
const K='sb_publishable_eqh3PngXs4UjLLWiY3pz1w_nhHtf7X-';
const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};
const $=id=>document.getElementById(id);
const E={shell:$('shell'),world:$('world'),clock:$('clock'),status:$('status'),productPct:$('productPct'),productFill:$('productFill'),gate:$('gate'),ready:$('ready'),active:$('active'),blocked:$('blocked'),done:$('done'),need:$('need'),nextLabel:$('nextLabel'),nextJob:$('nextJob'),nextMeta:$('nextMeta'),reviewRecovery:$('reviewRecovery'),promptBox:$('promptBox'),promptVersion:$('promptVersion'),promptText:$('promptText'),copy:$('copy'),expand:$('expand')};
const dots=[...document.querySelectorAll('.dot')];
const num=(v,d=0)=>Number.isFinite(Number(v))?Number(v):d;
const upper=v=>String(v??'UNKNOWN').toUpperCase();
const cleanGate=v=>String(v||'—').replace(/^GATE_/,'').replaceAll('_',' ');
async function rpc(name){const r=await fetch(B+name,{method:'POST',headers:H,body:'{}',cache:'no-store'});if(!r.ok)throw new Error(name+' '+r.status);return r.json()}
function setPage(i){E.shell.scrollTo({left:i*innerWidth,behavior:'smooth'});dots.forEach((d,n)=>d.classList.toggle('on',n===i))}
dots.forEach(d=>d.onclick=()=>setPage(Number(d.dataset.page)));
let raf=0;E.shell.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{const i=Math.round(E.shell.scrollLeft/Math.max(innerWidth,1));dots.forEach((d,n)=>d.classList.toggle('on',n===i))})},{passive:true});
E.expand.onclick=()=>{const c=E.promptBox.classList.toggle('collapsed');E.expand.textContent=c?'VER':'OCULTAR'};
E.copy.onclick=async()=>{try{await navigator.clipboard.writeText(E.promptText.textContent);E.copy.textContent='COPIADO';setTimeout(()=>E.copy.textContent='COPIAR',1200)}catch(_){E.promptText.focus();document.getSelection()?.selectAllChildren(E.promptText)}};

let promptLoaded=false,lastWorldReload=Date.now();
async function loadPrompt(){
 try{
  const p=await rpc('prometeo_worker_lobby_prompt_v1');
  const text=typeof p==='string'?p:String(p??'');
  E.promptText.textContent=text||'Prompt canónico vacío.';
  const first=(text.split('\n').find(Boolean)||'PROMPT CANÓNICO').trim();
  E.promptVersion.textContent=first;
  promptLoaded=true;
 }catch(err){console.error(err);E.promptVersion.textContent='error leyendo prompt canónico'}
}
async function load(){
 try{
  const [x,rv]=await Promise.all([rpc('prometeo_world_snapshot_v1'),rpc('prometeo_runtime_recovery_v5_status_v1')]);
  const run=x.focus_run||{},pc=x.product_completion||{},pj=pc.jobs||{},pp=pc.percentage||{},health=x.worker_health||{},review=x.review||{},reviewCounts=(review.counts||{}),rc=((rv||{}).counts||{});
  const product=num(pp.display),ready=num(pj.ready,num(health.useful_ready_width)),active=num(pj.active,num(health.useful_active)),blocked=num(pj.blocked),done=num(pj.done_success);
  E.productPct.textContent=Math.round(product);E.productFill.style.width=Math.max(0,Math.min(100,product))+'%';
  E.gate.textContent=cleanGate(pp.limiting_gate);
  E.ready.textContent=ready;E.active.textContent=active;E.blocked.textContent=blocked;E.done.textContent=done;
  const need=num(health.recommended_new_shells);E.need.textContent=need>0?'NEED +'+need+' WORKER'+(need===1?'':'S'):'CAPACITY OK';E.need.className='need'+(need>0?' hot':'');
  const jobs=((run.runtime||{}).jobs||[]);
  const activeJobs=jobs.filter(j=>upper(j.state)==='ACTIVE');
  const readyJobs=jobs.filter(j=>upper(j.state)==='READY');
  const target=activeJobs[0]||readyJobs[0]||null;
  E.nextLabel.textContent=activeJobs.length?'WORKING':'NEXT';
  E.nextJob.textContent=target?.node_key||'—';
  E.nextMeta.textContent=target?upper(target.state)+' · '+String(target.job_class||''):(blocked?'esperando dependencias':'sin frontier');
  const reviewDone=num(reviewCounts.done),reviewTotal=num(reviewCounts.total);
  const recoveryDone=num(rc.done_success),recoveryTotal=num(rc.total);
  E.reviewRecovery.textContent='REVIEW '+(reviewTotal?Math.round(reviewDone/reviewTotal*100):100)+'% · RECOVERY '+(recoveryTotal?Math.round(recoveryDone/recoveryTotal*100):100)+'%';
  E.status.textContent=active>0?'WORKING · '+active:need>0?'NEED +'+need:ready>0?'READY · '+ready:'NO FRONTIER';
  E.clock.textContent=new Intl.DateTimeFormat('es-AR',{timeZone:'America/Argentina/Buenos_Aires',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(x.generated_at||Date.now()));
 }catch(err){console.error(err);E.status.textContent='RECONEXIÓN'}
 if(!promptLoaded)loadPrompt();
 if(Date.now()-lastWorldReload>300000){E.world.src='/prometeo/guides/world/?view=tv&v='+Date.now();lastWorldReload=Date.now()}
}
loadPrompt();load();setInterval(load,3000);
})();
</script>
</body>
</html>
