<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prometeo · World Live</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.stage{position:relative;width:100vw;height:100vh;background:#000;overflow:hidden}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.hud{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.92) 18%,#000 100%);padding:44px 22px 15px;pointer-events:none}
.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:10px}.brand,.status,.label,.meta,.critical{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.brand,.status{font-size:10px;font-weight:950;letter-spacing:.12em}.bars{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.barline{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.label{font-size:9px;font-weight:950;opacity:.72}.value{font:950 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.track{height:10px;border:1px solid rgba(255,255,255,.58);background:#000}.fill{height:100%;width:0;background:#fff;transition:width .45s ease}
.meta{display:grid;grid-template-columns:auto auto auto auto 1fr;gap:14px;align-items:center;margin-top:9px;font-size:9px;font-weight:850}.critical{margin-top:8px;font-size:10px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dim{opacity:.62}.flash{animation:pulse 1.1s ease-in-out infinite}@keyframes pulse{50%{opacity:.38}}.corner{position:absolute;top:14px;right:16px;background:#000c;border:1px solid #ffffff4d;padding:7px 9px;font:850 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace}
@media(max-width:900px){.bars{grid-template-columns:1fr}.hud{padding:34px 12px 11px}.meta{grid-template-columns:auto auto auto 1fr}.hideSmall{display:none}.brand,.status{font-size:9px}}

/* TV-READABILITY */
@media(min-width:1100px){
  .hud{padding:64px 30px 20px}
  .brand,.status{font-size:15px}
  .label{font-size:12px}.value{font-size:16px}
  .track{height:14px}
  .meta{font-size:11px;gap:18px;margin-top:12px}
  .critical{font-size:13px;margin-top:10px}
  .corner{font-size:12px;padding:9px 11px}
}
</style>
</head>
<body>
<div class="stage">
  <iframe id="world" src="/prometeo/guides/world/?view=tv" allow="autoplay"></iframe>
  <div class="corner" id="clock">LIVE</div>
  <div class="hud">
    <div class="top"><div class="brand" id="brand">PROMETEO · WORLD</div><div class="status" id="status">CARGANDO</div></div>
    <div class="bars">
      <div class="barline"><span class="label">REVIEW</span><div class="track"><div class="fill" id="reviewFill"></div></div><span class="value" id="reviewPct">0%</span></div>
      <div class="barline"><span class="label">RECOVERY V5</span><div class="track"><div class="fill" id="recoveryFill"></div></div><span class="value" id="recoveryPct">0%</span></div>
      <div class="barline"><span class="label">PRODUCT VERIFIED</span><div class="track"><div class="fill" id="productFill"></div></div><span class="value" id="productPct">0%</span></div>
    </div>
    <div class="meta">
      <div><span id="reviewDone">0</span>/<span id="reviewTotal">0</span> REVIEW</div>
      <div><span id="recoveryDone">0</span>/<span id="recoveryTotal">0</span> RECOVERY</div>
      <div><span id="frontier">0</span> READY · <span id="active">0</span> ACTIVE</div>
      <div>NEED +<span id="need">0</span></div>
      <div class="dim hideSmall" id="capacity">CAPACITY UNKNOWN</div>
    </div>
    <div class="critical" id="critical">CRITICAL · — · AGE —</div>
  </div>
</div>
<script>
(()=>{
const B='https://catnohyouxqjjtseaueb.supabase.co/rest/v1/rpc/';
const K='sb_publishable_eqh3PngXs4UjLLWiY3pz1w_nhHtf7X-';
const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};
const el=id=>document.getElementById(id),E={world:el('world'),clock:el('clock'),brand:el('brand'),status:el('status'),reviewFill:el('reviewFill'),reviewPct:el('reviewPct'),recoveryFill:el('recoveryFill'),recoveryPct:el('recoveryPct'),productFill:el('productFill'),productPct:el('productPct'),reviewDone:el('reviewDone'),reviewTotal:el('reviewTotal'),recoveryDone:el('recoveryDone'),recoveryTotal:el('recoveryTotal'),frontier:el('frontier'),active:el('active'),need:el('need'),capacity:el('capacity'),critical:el('critical')};
let lastWorldReload=Date.now(); const num=(v,d=0)=>Number.isFinite(Number(v))?Number(v):d; const upper=v=>String(v??'UNKNOWN').toUpperCase();
const clamp=v=>Math.max(0,Math.min(100,num(v,0))); const age=s=>{s=Math.max(0,num(s));if(s<60)return Math.round(s)+'s';if(s<3600)return Math.floor(s/60)+'m '+Math.round(s%60)+'s';return Math.floor(s/3600)+'h '+Math.floor((s%3600)/60)+'m'};
async function rpc(name){const r=await fetch(B+name,{method:'POST',headers:H,body:'{}',cache:'no-store'});if(!r.ok)throw new Error(name+' '+r.status);return r.json()}
async function load(){
  try{
    const [x,rv]=await Promise.all([rpc('prometeo_world_snapshot_v1'),rpc('prometeo_runtime_recovery_v5_status_v1')]);
    const run=x.focus_run||{},counts=run.counts||{},pp=(x.product_completion||{}).percentage||{},health=x.worker_health||{},rc=(rv||{}).counts||{};
    const reviewDone=num(counts.success,num(counts.done)),reviewTotal=num(counts.total),reviewPct=reviewTotal?clamp(reviewDone/reviewTotal*100):0;
    const recoveryDone=num(rc.done_success),recoveryTotal=num(rc.total),recoveryPct=recoveryTotal?clamp(recoveryDone/recoveryTotal*100):0;
    const productPct=clamp(pp.display),ready=num(health.useful_ready_width),active=num(health.useful_active),need=num(health.recommended_new_shells);
    const readyJobs=((run.runtime||{}).jobs||[]).filter(j=>upper(j.state)==='READY');const critical=String(health.critical_node||readyJobs[0]?.node_key||'—'),criticalAge=num(health.critical_age_seconds),stale=!!health.critical_stale,capacity=upper(health.capacity_decision);
    E.brand.textContent='PROMETEO · '+String(run.run_id||'WORLD');
    E.reviewFill.style.width=reviewPct+'%';E.reviewPct.textContent=reviewPct.toFixed(0)+'%';E.reviewDone.textContent=reviewDone;E.reviewTotal.textContent=reviewTotal;
    E.recoveryFill.style.width=recoveryPct+'%';E.recoveryPct.textContent=recoveryPct.toFixed(0)+'%';E.recoveryDone.textContent=recoveryDone;E.recoveryTotal.textContent=recoveryTotal;
    E.productFill.style.width=productPct+'%';E.productPct.textContent=productPct.toFixed(0)+'%';
    E.frontier.textContent=ready;E.active.textContent=active;E.need.textContent=need;E.capacity.textContent=capacity.replaceAll('_',' ');
    E.critical.textContent=(health.critical_node?'CRITICAL':'NEXT')+' · '+critical+(health.critical_node?' · AGE '+age(criticalAge):'')+(stale?' · STALE':'');
    E.status.textContent=stale?'STALL DETECTED':need>0?'NEED +'+need+' WORKERS':active>0?'WORKING · '+active+' ACTIVE':ready>0?'READY · '+ready:'NO CLAIMABLE FRONTIER';
    E.status.className='status'+(stale||need>0?' flash':'');
    E.clock.textContent=new Intl.DateTimeFormat('es-AR',{timeZone:'America/Argentina/Buenos_Aires',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(x.generated_at||Date.now()));
  }catch(err){console.error(err);E.status.textContent='RECONEXIÓN';E.status.className='status'}
  if(Date.now()-lastWorldReload>300000){E.world.src='/prometeo/guides/world/?view=tv&v='+Date.now();lastWorldReload=Date.now()}
}
load();setInterval(load,3000);
})();
</script>
</body></html>
