*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;touch-action:none}
button{font:inherit}
#world{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 48%,rgba(132,156,129,.055),transparent 40%),var(--bg)}
#scene{position:absolute;inset:0;will-change:transform;transform-origin:0 0;transition:transform .26s cubic-bezier(.2,.72,.18,1)}
#header{position:absolute;left:0;right:0;top:0;height:var(--header-h);z-index:200;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:8px 10px 7px;background:linear-gradient(to bottom,rgba(7,11,8,.96),rgba(7,11,8,.76),transparent)}

function renderRuns(){const focus=state.run&&state.run.id;el.runsBody.innerHTML=(state.runs||[]).map(r=>{const st=up(r.status),cls=(r.run_id===focus?' current ':' ')+st.toLowerCase(),counts=r.counts||{},success=num(counts.success,0)||0,total=num(counts.total,0)||0;return '<div class="run-row '+cls.trim()+'"><div class="run-name">'+esc(r.run_id||'UNKNOWN')+'</div><div class="run-meta">'+esc(st)+' · '+success+'/'+total+' SUCCESS · TARGET '+esc(r.target_workers??'?')+'</div>'+(r.objective?'<div class="run-objective">'+esc(r.objective)+'</div>':'')+'</div>'}).join('')||'<div class="run-row"><div class="run-name">SIN RUNS</div></div>'}
function updateStatusPill(){if(state.mode==='demo'){el.statusPill.textContent='DEMO · 20% · SIMULACIÓN VISUAL';return}const working=state.workers.filter(isWorking).length;el.statusPill.textContent='VIVO · '+esc(state.run&&state.run.status||'UNKNOWN')+' · '+working+'/'+state.workers.length+' WORKING'}
function normalizeTimelineEvent(e){const p=e.payload||{},ep=(p.event_payload&&typeof p.event_payload==='object')?p.event_payload:{},label=e.workerCode||e.guideCode||e.source||'EVENT',subject=e.taskKey||e.nodeKey||e.jobId||'';return {eventKey:e.eventKey,time:e.time,type:eventKind(e.eventType),text:[label,e.eventType,subject].filter(Boolean).join(' · ')}}
function findTaskForEvent(e){return state.tasks.find(t=>(e.jobId&&t.jobId===e.jobId)||(e.nodeKey&&t.nodeKey===e.nodeKey)||(e.taskKey&&t.key===e.taskKey))||null}
function findWorkerForEvent(e){if(e.workerCode)return state.workers.find(w=>w.workerCode===e.workerCode||w.id===e.workerCode)||null;return null}
function checkpointKind(e){const p=e.payload||{},ep=(p.event_payload&&typeof p.event_payload==='object')?p.event_payload:{};return up(ep.checkpoint_kind||p.checkpoint_kind,'')}
function progressStageFromEvent(e){const p=e.payload||{},ep=(p.event_payload&&typeof p.event_payload==='object')?p.event_payload:{};return up(p.progress_stage||ep.stage,'')}
function applyEvents(batch){if(!batch||!Array.isArray(batch.events))return;let runMismatch=false;for(const e of batch.events){if(state.eventKeys.has(e.eventKey))continue;appendTimeline(normalizeTimelineEvent(e));if(e.runId&&state.run&&e.runId!==state.run.id){runMismatch=true;continue}if(e.source!=='WORKER_BUS')continue;const t=findTaskForEvent(e),w=findWorkerForEvent(e),p=e.payload||{},etype=e.eventType,stage=progressStageFromEvent(e);if(t){const ps=up(p.state,'');if(KNOWN_JOB_STATES.has(ps))t.state=ps;if(stage)t.stage=stage;if(e.generation!=null)t.generation=e.generation;if(num(p.recovery_count)!=null)t.recoveries=Math.max(t.recoveries||0,num(p.recovery_count,0)||0);if(etype==='ASSIGNED'||etype==='ASSIGNMENT_RESUMED')t.state='ACTIVE';if(etype==='SUBMIT_SUCCESS'){t.state='DONE';t.completion='SUCCESS';t.stage='DONE';t.finalCheckpoint=true}const ck=checkpointKind(e);if(etype.includes('CHECKPOINT')||ck){if(ck==='DRAFT'||stage==='DRAFT_CHECKPOINT')t.draftCheckpoint=true;if(ck==='FINAL'||stage==='FINAL_CHECKPOINT')t.finalCheckpoint=true;spawnCheck(t.key)}if(etype.includes('FAIL')||etype.includes('REQUEUE')||etype.includes('RECOVER')){t.recoveries=Math.max(1,t.recoveries||0);if(w)spawnRecovery(w.sessionId)}}if(w){w.lastEvent=etype;if(e.generation!=null)w.generation=e.generation;if(t){w.currentJobId=t.jobId;w.taskKey=t.key;w.guide=t.guide}if(WORKING_EVENT_TYPES.has(etype))w.observedLiveness='WORKING';if(etype==='SUBMIT_SUCCESS')w.observedLiveness='UNKNOWN'} }
 state.cursor=batch.nextCursor||state.cursor;renderGuides();renderTasks();renderWorkers();plan();renderStats();renderRuns();updateStatusPill();if(runMismatch&&state.mode==='live')setTimeout(reconcileSnapshot,120)}
function spawnCheck(key){const v=taskEls.get(key);if(!v)return;const r=v.e.getBoundingClientRect(),wr=el.world.getBoundingClientRect(),q=document.createElement('i');q.className='fx-check';q.style.left=(r.left-wr.left+r.width/2)+'px';q.style.top=(r.top-wr.top+r.height/2)+'px';el.fx.appendChild(q);setTimeout(()=>q.remove(),800)}
function spawnRecovery(id){const v=workerEls.get(id);if(!v)return;const q=document.createElement('div');q.className='fx-death';q.textContent='☠';q.style.left=v.x+'px';q.style.top=v.y+'px';q.title='recovery / requeue';el.fx.appendChild(q);setTimeout(()=>q.remove(),2800)}
function depsDone(t){return (t.depends||[]).every(k=>{const d=state.tasks.find(x=>x.key===k);return d&&d.state==='DONE'})}
function activateTask(t){t.state='ACTIVE';t.stage='FIRST_SIGNAL';t.observedLiveness='WORKING'}
function demoTick(){if(state.mode!=='demo')return;state.tick++;const act=state.tasks.filter(t=>t.state==='ACTIVE');if(!act.length){const r=state.tasks.find(t=>t.state==='READY'&&depsDone(t));if(r)activateTask(r);renderAll();return}const t=act[state.tick%act.length],idx=Math.max(0,stageIndex(t.stage)),next=STAGES[Math.min(STAGES.length-1,idx+1)];if(next==='DRAFT_CHECKPOINT'&&!t.draftCheckpoint){t.draftCheckpoint=true;spawnCheck(t.key)}if(next==='FINAL_CHECKPOINT'&&!t.finalCheckpoint){t.finalCheckpoint=true;spawnCheck(t.key)}t.stage=next;if(state.tick===6){const victim=act[0];if(victim&&victim.state==='ACTIVE'){victim.recoveries++;victim.generation++;victim.draftCheckpoint=true;const w=state.workers.find(x=>x.taskKey===victim.key);if(w){spawnRecovery(w.sessionId);state.workers=state.workers.filter(x=>x!==w);setTimeout(()=>{if(state.mode!=='demo')return;state.workers.push({id:'W-R',sessionId:'demo-recovery',workerCode:'W-R',currentJobId:victim.jobId,taskKey:victim.key,guide:victim.guide,sprite:(w.sprite+1)%SPRITES.length,generation:victim.generation,jobsDone:0,lastEvent:'RESUME',currentPhase:'RESUME',membershipStatus:'ACTIVE',observedLiveness:'WORKING',secondsSinceSeen:1,activeMs:8000});renderAll()},700)}}}if(next==='DONE'){t.state='DONE';t.completion='SUCCESS';t.draftCheckpoint=t.finalCheckpoint=true;const w=state.workers.find(x=>x.taskKey===t.key);if(w){w.jobsDone=(w.jobsDone||0)+1;const nextTask=state.tasks.find(x=>x.state==='READY'&&depsDone(x));if(nextTask){activateTask(nextTask);w.currentJobId=nextTask.jobId;w.taskKey=nextTask.key;w.guide=nextTask.guide;w.lastEvent='ASSIGNED'}else{w.currentJobId=null;w.taskKey=null;w.observedLiveness='UNKNOWN'}}state.tasks.filter(x=>x.state==='BLOCKED'&&depsDone(x)).forEach(x=>x.state='READY')}renderAll()}
async function reconcileSnapshot(){try{const model=await CanonicalWorldAdapter.snapshot();state.liveModel=model;state.lastSnapshotAt=Date.now();if(state.mode==='live')setSnapshot(model);document.body.classList.remove('reconnecting')}catch(err){console.error(err);document.body.classList.add('reconnecting');if(state.mode==='live')el.statusPill.textContent='VIVO · RECONNECTING'}}
async function pollEvents(){if(state.mode!=='live'||!state.run)return;try{let loops=0,more=true;while(more&&loops<4){const batch=await CanonicalWorldAdapter.events(state.cursor);PrometeoWorld.applyEvents(batch);const hm=batch.hasMore;more=hm===true||(hm&&typeof hm==='object'&&(hm.worker||hm.guide));loops++}document.body.classList.remove('reconnecting')}catch(err){console.error(err);document.body.classList.add('reconnecting')}}
async function startDemo(){state.mode='demo';state.tick=0;document.body.classList.add('demo-mode');el.modeBtn.textContent='VIVO';clearInterval(state.demoTimer);setSnapshot(makeDemoSnapshot());state.demoTimer=setInterval(demoTick,2400)}
async function stopDemo(){state.mode='live';document.body.classList.remove('demo-mode');el.modeBtn.textContent='DEMO';clearInterval(state.demoTimer);state.demoTimer=null;if(state.liveModel)setSnapshot(state.liveModel);await reconcileSnapshot();await pollEvents()}
el.modeBtn.addEventListener('click',()=>state.mode==='demo'?stopDemo():startDemo());
window.addEventListener('resize',()=>renderAll());el.world.addEventListener('click',e=>{if(e.target===el.world||e.target===el.scene){clearFocus();el.detailSheet.classList.remove('open')}});
window.PrometeoWorld={setSnapshot,applyEvents,openStats:()=>openSheet(el.statsSheet),getState:()=>({mode:state.mode,run:state.run,tasks:state.tasks,workers:state.workers,runs:state.runs,product:state.product,cursor:state.cursor})};
ensureGuides();renderAtlas();if(ATLAS_BOOT)openSheet(el.atlasSheet);requestAnimationFrame(animate);reconcileSnapshot().then(()=>pollEvents());state.eventTimer=setInterval(pollEvents,2500);state.reconcileTimer=setInterval(reconcileSnapshot,15000);
})();
</script>
