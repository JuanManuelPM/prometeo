<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prometeo · facultad</title>
<style>
:root{color-scheme:dark;--line:#292929}*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(900px,100%);margin:auto;padding:14px 14px 50px}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}
a{color:#fff}.back{font:850 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-decoration:none}.state{font:850 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid #fff;padding:5px 6px}
.hero{padding:20px 0;border-bottom:1px solid var(--line)}.k{font:850 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;opacity:.48}
h1{font-size:33px;letter-spacing:-.05em;margin:7px 0 8px}.mission{font-size:13px;line-height:1.5;opacity:.64;max-width:760px}
.msg{padding:20px 0;border-bottom:1px solid var(--line)}.headline{font:27px/1.18 Georgia,"Times New Roman",serif;margin:8px 0}.spoken{font:16px/1.55 Georgia,"Times New Roman",serif;opacity:.78;max-width:760px}.time{font:800 9px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.48}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:13px 0;border-bottom:1px solid var(--line)}button,.action{border:1px solid #fff;background:#fff;color:#000;padding:0 12px;min-height:39px;display:inline-flex;align-items:center;text-decoration:none;font:900 10px/1 system-ui;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.alt{background:#000;color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}section{padding:15px 0;border-bottom:1px solid var(--line)}h2{font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.45;margin:0 0 9px}.item{padding:7px 0;border-top:1px solid #171717;font-size:13px;line-height:1.42}.item:first-child{border-top:0}.empty{font-size:13px;opacity:.4}
.workrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-top:1px solid #171717}.workrow:first-child{border-top:0}.wmeta{font:750 9px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.5}.wstate{font:850 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid currentColor;padding:4px 5px;height:max-content}
.surfaceGrid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}.surface{padding:10px;min-height:110px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);color:#fff;text-decoration:none;display:block}.surface.off{opacity:.35;pointer-events:none}.sk{font:800 8px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.48}.st{font-size:13px;font-weight:800;line-height:1.2;margin:7px 0}.sp{font:700 8px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.45;overflow-wrap:anywhere}.shared{font-size:9px;opacity:.55;margin-top:7px}
.arch{padding:10px;border:1px solid var(--line);font-size:12px;line-height:1.45;margin:10px 0}
@media(max-width:720px){.grid2{grid-template-columns:1fr}.surfaceGrid{grid-template-columns:1fr 1fr}}
</style></head>
<body><main>
<header><a class="back" href="/prometeo/guides/#facultad">← GUIDES</a><div class="state" id="state">cargando</div></header>
<div class="hero"><div class="k" id="kind">GUIDE</div><h1 id="title">…</h1><div class="mission" id="mission"></div></div>
<div class="msg"><div class="k">MENSAJE ACTUAL</div><div class="headline" id="headline">cargando…</div><div class="time" id="updated"></div><div class="spoken" id="spoken"></div></div>
<div class="actions"><button id="invoke">INVOCAR GUIDE</button><a class="action alt" href="/prometeo/guides/foundry/">FOUNDRY</a><span id="copy"></span></div>
<div class="grid2">
<section><h2>Ahora</h2><div id="read"></div></section>
<section><h2>Trabajo del Guide</h2><div id="jobs"></div></section>
<section><h2>Trabajo abierto</h2><div id="work"></div></section>
<section><h2>Ideas</h2><div id="ideas"></div></section>
</div>
<section><h2>Guide Work Broker</h2><div id="broker"></div></section>
<section><h2>Superficies existentes</h2><div class="arch" id="arch">Inventario cargando…</div><div class="surfaceGrid" id="surfaces"></div></section>
<section><h2>Capacidades</h2><div id="caps"></div></section>
</main>
<script>
(()=>{
const GUIDE='STUDY',BASE='https://catnohyouxqjjtseaueb.supabase.co/rest/v1/rpc/',KEY='sb_publishable_eqh3PngXs4UjLLWiY3pz1w_nhHtf7X-';
window.PROMETEO_GUIDE_SURFACE={guide:GUIDE,base:BASE,key:KEY};
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},TZ='America/Argentina/Buenos_Aires';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=t=>!t?'sin actualización':new Intl.DateTimeFormat('es-AR',{timeZone:TZ,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(t));
function list(id,a){document.getElementById(id).innerHTML=Array.isArray(a)&&a.length?a.map(x=>'<div class="item">'+esc(typeof x==='string'?x:JSON.stringify(x))+'</div>').join(''):'<div class="empty">Sin contenido todavía.</div>'}
async function rpc(n,a){const r=await fetch(BASE+n,{method:'POST',headers:H,body:JSON.stringify(a||{}),cache:'no-store'});if(!r.ok)throw new Error(r.status);return await r.json()}
let ctx=null;
async function load(){try{
 ctx=await rpc('prometeo_domain_guide_operating_view_v2',{p_guide_key:GUIDE});
 const g=ctx.guide||{},c=ctx.capsule||{},sa=ctx.surface_archaeology;
 state.textContent=c.capsule_status||g.status||'';kind.textContent=(g.domain_type||'GUIDE')+' · '+g.guide_key;title.textContent=g.short_title||g.title;mission.textContent=g.mission||'';headline.textContent=c.headline||'Sin CURRENT todavía.';updated.textContent='CAPSULE '+fmt(c.generated_at)+' · v'+(c.version||0);spoken.textContent=c.spoken_brief||'Todavía no hay un mensaje hablado sintetizado para este Guide.';
 list('read',c.current_read);list('work',c.open_work);list('ideas',c.ideas);list('caps',c.capabilities);
 jobs.innerHTML=(ctx.domain_work||[]).map(x=>'<div class="workrow"><div><b>'+esc(x.task_key)+'</b><div class="wmeta">'+esc(x.task_kind||'')+' · '+esc(x.progress_stage||'—')+(x.worker_code?' · '+esc(x.worker_code):'')+'</div></div><div class="wstate">'+esc(x.state)+'</div></div>').join('')||'<div class="empty">Sin jobs del dominio todavía.</div>';
 const bi=ctx.broker_inbox||{},dem=bi.demands||[];
 broker.innerHTML='<div class="workrow"><div><b>GUIDE_WORK_BROKER_V1</b><div class="wmeta">demanda tipada durable · dispatch desactivado en SHADOW</div></div><div class="wstate">'+esc(bi.broker_mode||'—')+'</div></div>'+
   (dem.length?dem.slice(0,6).map(x=>'<div class="workrow"><div><b>'+esc(x.request_key)+'</b><div class="wmeta">'+esc(x.objective||'')+' · score '+esc(x.shadow_score??'—')+'</div></div><div class="wstate">'+esc(x.status)+'</div></div>').join(''):'<div class="empty">Todavía no hay demanda registrada para este Guide.</div>');
 arch.textContent=sa?.state==='DONE'?('Arqueología terminada: '+(sa.summary||'resultado disponible.')):sa?.state==='ACTIVE'?('Arqueología en curso · '+(sa.progress_stage||'WORKING')):'Arqueología pendiente. Se muestran rutas reales del repo; sólo gh-pages verificadas son navegables.';
 surfaces.innerHTML=(ctx.surface_inventory||[]).map(s=>{const ok=s.route_status==='GH_PAGES_PRESENT',sh=(s.shared_with||[]).length?'Compartida: '+s.shared_with.join(', '):'';const b='<div class="sk">'+esc(s.surface_kind)+' · '+esc(s.route_status)+'</div><div class="st">'+esc((s.notes||s.repo_path).replace(/\.$/,''))+'</div><div class="sp">'+esc(s.public_route||s.repo_path)+'</div>'+(sh?'<div class="shared">'+esc(sh)+'</div>':'');return ok?'<a class="surface" href="/prometeo'+esc(s.public_route)+'">'+b+'</a>':'<div class="surface off">'+b+'</div>'}).join('');
}catch(e){state.textContent='ERROR'}}
invoke.onclick=async()=>{try{const r=await fetch('/prometeo'+ctx.guide.invoke_route,{cache:'no-store'});if(!r.ok)throw new Error(r.status);await navigator.clipboard.writeText(await r.text());copy.textContent='copiado'}catch(e){copy.textContent='error'}};
load();setInterval(load,20000);
})();
</script><script src="/prometeo/guides/domain-input-v1.js" defer></script>
</body></html>
