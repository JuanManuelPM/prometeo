<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000">
<title>Prometeo · Voice Progress</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%}main{max-width:760px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px}.eyebrow,.meta,.grid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.14em;opacity:.6}h1{font-size:clamp(34px,8vw,76px);line-height:.88;letter-spacing:-.055em;margin:10px 0 14px}.spoken{font-size:clamp(18px,3.2vw,28px);line-height:1.22;font-weight:750;max-width:24em}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}.card{border-top:1px solid #444;padding-top:8px}.k{font-size:9px;opacity:.5;font-weight:900}.v{font-size:17px;font-weight:950;margin-top:4px}.meta{font-size:10px;line-height:1.55;opacity:.7;border-top:1px solid #222;padding-top:12px}.btn{border:1px solid #fff;background:#fff;color:#000;padding:11px 13px;font:900 10px/1 ui-monospace,monospace;letter-spacing:.08em;cursor:pointer}.btn.off{background:#000;color:#fff}.dot{display:inline-block;width:7px;height:7px;background:#fff;border-radius:50%;margin-right:7px}.fresh{animation:p 1s ease 2}@keyframes p{50%{opacity:.25}}@media(max-width:560px){.grid{grid-template-columns:1fr}.card{display:flex;justify-content:space-between}.v{margin:0}}
</style>
</head>
<body><main>
<div class="top"><div class="eyebrow"><span class="dot"></span>LIVE VOICE PROJECTION</div><button class="btn off" id="voiceBtn">VOZ OFF</button></div>
<h1 id="headline">Cargando estado…</h1><div class="spoken" id="spoken"></div>
<div class="grid"><div class="card"><div class="k">REVIEW</div><div class="v" id="review">—</div></div><div class="card"><div class="k">RECOVERY V5</div><div class="v" id="recovery">—</div></div><div class="card"><div class="k">PRODUCT VERIFIED</div><div class="v" id="product">—</div></div></div>
<div class="meta" id="meta">—</div>
</main>
<script>
(()=>{
const B='https://catnohyouxqjjtseaueb.supabase.co/rest/v1/rpc/',K='sb_publishable_eqh3PngXs4UjLLWiY3pz1w_nhHtf7X-',H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};
const E={headline:document.getElementById('headline'),spoken:document.getElementById('spoken'),review:document.getElementById('review'),recovery:document.getElementById('recovery'),product:document.getElementById('product'),meta:document.getElementById('meta'),btn:document.getElementById('voiceBtn')};
let voiceOn=localStorage.getItem('prometeo.voice.enabled')==='1',lastKey=localStorage.getItem('prometeo.voice.last_event')||'';const num=(v,d=0)=>Number.isFinite(Number(v))?Number(v):d,age=s=>{s=Math.max(0,num(s));if(s<60)return Math.round(s)+'s';if(s<3600)return Math.floor(s/60)+'m '+Math.round(s%60)+'s';return Math.floor(s/3600)+'h '+Math.floor((s%3600)/60)+'m'};
function paintBtn(){E.btn.textContent=voiceOn?'VOZ ON':'VOZ OFF';E.btn.className='btn'+(voiceOn?'':' off')}paintBtn();
async function rpc(name){const r=await fetch(B+name,{method:'POST',headers:H,body:'{}',cache:'no-store'});if(!r.ok)throw new Error(name+' '+r.status);return r.json()}
function speak(text){if(!voiceOn||!text||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='es-AR';u.rate=1.06;u.pitch=.82;speechSynthesis.speak(u)}
async function load(){
  try{
    await rpc('prometeo_voice_progress_tick_v1');
    const [m,w,r]=await Promise.all([rpc('prometeo_voice_progress_current_v1'),rpc('prometeo_world_snapshot_v1'),rpc('prometeo_runtime_recovery_v5_status_v1')]);
    const c=(w.focus_run||{}).counts||{},rc=(r||{}).counts||{},pp=((w.product_completion||{}).percentage)||{},h=w.worker_health||{},key=String(m.event_key||m.message_id||'');
    E.headline.textContent=m.headline||'Sin mensaje';E.spoken.textContent=m.spoken_text||'';
    E.review.textContent=num(c.success,num(c.done))+'/'+num(c.total);E.recovery.textContent=num(rc.done_success)+'/'+num(rc.total)+' · '+num(rc.active)+' ACTIVE';E.product.textContent=num(pp.display).toFixed(0)+'%';
    E.meta.textContent='EVENT '+(key||'—')+' · CRITICAL '+String(h.critical_node||'—')+' · AGE '+age(h.critical_age_seconds)+' · READY '+num(h.useful_ready_width)+' · ACTIVE '+num(h.useful_active)+' · NEED +'+num(h.recommended_new_shells);
    if(key&&key!==lastKey){lastKey=key;localStorage.setItem('prometeo.voice.last_event',key);E.headline.classList.remove('fresh');void E.headline.offsetWidth;E.headline.classList.add('fresh');speak(m.spoken_text)}
  }catch(e){console.error(e);E.headline.textContent='Reconectando';E.meta.textContent=String(e.message||e)}
}
E.btn.onclick=()=>{voiceOn=!voiceOn;localStorage.setItem('prometeo.voice.enabled',voiceOn?'1':'0');paintBtn();if(voiceOn&&E.spoken.textContent)speak(E.spoken.textContent);else if('speechSynthesis' in window)speechSynthesis.cancel()};
load();setInterval(load,5000);
})();
</script>
</body></html>
