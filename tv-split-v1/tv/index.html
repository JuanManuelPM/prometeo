<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<title>Canal TV</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
#stage{position:fixed;inset:0;display:grid;background:#000;gap:1px}
#stage.n1{grid-template-columns:1fr;grid-template-rows:1fr}
#stage.n2{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
#stage.n3{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr}
#stage.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.panel{position:relative;overflow:hidden;background:#000;min-width:0;min-height:0}
.panel iframe,.ytHost,.ytHost iframe{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;border:0!important}
.ytHost iframe{pointer-events:none!important}
.videoProgress{position:absolute;left:0;right:0;bottom:0;height:4px;z-index:8;background:#2b2b2b;pointer-events:none}
.videoProgressFill{height:100%;width:0;background:#f4f3ee;transition:width .20s linear}
.clockPanel{display:grid;place-items:center;background:#050505;container-type:size}
.clockLayout{width:100%;height:100%;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(300px,.88fr);align-items:center;gap:min(3cqw,36px);padding:min(3cqh,28px) min(3cqw,34px)}
.hybridClock{position:relative;width:min(94cqw,94cqh);max-width:100%;aspect-ratio:1;border-radius:50%;justify-self:center;background:#050505}
.pomodoroTrack{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from -90deg,#f4f3ee 0deg 150deg,#ff3b30 150deg 180deg,#f4f3ee 180deg 330deg,#ff3b30 330deg 360deg);-webkit-mask:radial-gradient(circle,transparent 0 81%,#000 81% 100%);mask:radial-gradient(circle,transparent 0 81%,#000 81% 100%)}
.hourTicks{position:absolute;inset:11%;border-radius:50%;background:repeating-conic-gradient(from -90deg,#f4f3ee 0deg 2deg,transparent 2deg 30deg);-webkit-mask:radial-gradient(circle,transparent 0 91%,#000 91% 100%);mask:radial-gradient(circle,transparent 0 91%,#000 91% 100%)}
.minuteTicks{position:absolute;inset:12.5%;border-radius:50%;background:repeating-conic-gradient(from -90deg,#77766f 0deg .8deg,transparent .8deg 6deg);-webkit-mask:radial-gradient(circle,transparent 0 96%,#000 96% 100%);mask:radial-gradient(circle,transparent 0 96%,#000 96% 100%);opacity:.7}
.clockNumber{position:absolute;font:900 clamp(18px,4cqw,44px)/1 Arial,Helvetica,sans-serif;color:#f4f2ea;z-index:2}
.clockNumber.n12{left:50%;top:17%;transform:translate(-50%,-50%)}.clockNumber.n3{right:17%;top:50%;transform:translate(50%,-50%)}.clockNumber.n6{left:50%;bottom:17%;transform:translate(-50%,50%)}.clockNumber.n9{left:17%;top:50%;transform:translate(-50%,-50%)}
.clockHand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:99px;z-index:5}
.clockHour{width:clamp(8px,1.4cqw,16px);height:24%;background:#f4f2ea}
.clockMinute{width:clamp(5px,.8cqw,10px);height:35%;background:#f4f2ea}
.clockSecond{width:clamp(2px,.28cqw,4px);height:40%;background:#ff3b30}
.clockCenter{position:absolute;left:50%;top:50%;width:clamp(16px,2.4cqw,28px);height:clamp(16px,2.4cqw,28px);transform:translate(-50%,-50%);border-radius:50%;background:#050505;border:clamp(3px,.45cqw,5px) solid #f4f2ea;z-index:8}
.phaseMarker{position:absolute;left:50%;top:50%;width:clamp(10px,1.6cqw,18px);height:clamp(10px,1.6cqw,18px);border-radius:50%;background:#050505;border:clamp(3px,.45cqw,5px) solid #f4f2ea;transform-origin:0 0;z-index:7;pointer-events:none}
.clockReadout{min-width:0;align-self:center;display:flex;flex-direction:column;justify-content:center}
.wallTimeBig{font:900 clamp(64px,13cqw,170px)/.82 Arial,Helvetica,sans-serif;letter-spacing:-.075em;color:#f4f2ea;white-space:nowrap}
.phaseName{margin-top:min(4cqh,34px);font-size:clamp(28px,5.5cqw,72px);font-weight:900;line-height:.92;letter-spacing:.03em}
.phaseRemaining{margin-top:min(1.8cqh,16px);font:900 clamp(42px,8cqw,104px)/.9 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.075em;white-space:nowrap}
.phaseHint{margin-top:min(1.6cqh,14px);font:900 clamp(12px,1.8cqw,24px)/1.1 Arial,Helvetica,sans-serif;color:#77766f;letter-spacing:.06em;text-transform:uppercase}
.phaseScale{margin-top:min(4cqh,34px);height:clamp(12px,2cqh,22px);display:grid;grid-template-columns:5fr 1fr 5fr 1fr;gap:3px}
.phaseScale span{display:block;background:#f4f2ea}.phaseScale span:nth-child(2),.phaseScale span:nth-child(4){background:#ff3b30}
.phaseScaleLabels{margin-top:7px;display:flex;justify-content:space-between;font:900 clamp(9px,1.25cqw,16px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#77766f;letter-spacing:.04em}
@container (max-width:720px){
  .clockLayout{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:6px;padding:10px}
  .hybridClock{width:min(72cqw,62cqh)}
  .clockReadout{align-items:center;text-align:center}
  .wallTimeBig{font-size:clamp(48px,17cqw,110px)}
  .phaseName{margin-top:5px;font-size:clamp(22px,7cqw,44px)}
  .phaseRemaining{margin-top:4px;font-size:clamp(32px,11cqw,70px)}
  .phaseHint{display:none}.phaseScale,.phaseScaleLabels{display:none}
}
.unlock{position:fixed;z-index:50;right:12px;bottom:12px;display:none;border:1px solid #ffffff55;background:#000c;color:#fff;height:36px;padding:0 12px;font-size:9px;font-weight:900;letter-spacing:.08em}
.unlock.show{display:block}
.status{position:fixed;right:8px;top:8px;z-index:60;width:5px;height:5px;border-radius:50%;background:#333;opacity:.35}.status.err{background:#fff}
</style>
</head>
<body>
<main id="stage" class="n1"></main>
<button id="unlock" class="unlock">ACTIVAR VIDEO</button>
<div id="status" class="status"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
(()=>{
'use strict';
const BUILD='17';
const API='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/tv-schedule-v1';
const RUNTIME='https://juanmanuelpm.github.io/prometeo/tv/canonical.json';
const p=new URLSearchParams(location.hash.slice(1));
const DEFAULT_ROOM='TV-PM2K7Q',DEFAULT_TOKEN='6e7f4b74d76d2488ac3779832c77632475dd845db3a9b598765a757c7f18c327';
const room={code:p.get('room')||DEFAULT_ROOM,token:p.get('t')||DEFAULT_TOKEN,role:'tv'};
const client='tv-v17-'+Math.random().toString(36).slice(2,10);
const stage=document.getElementById('stage'),unlock=document.getElementById('unlock'),status=document.getElementById('status');
const views=new Map(),advancing=new Set();
let blocks=[],serverActive=[],ytReady=false,lastCommandId=0,updatePending=false,pageStarted=Date.now();

window.onYouTubeIframeAPIReady=()=>{ytReady=true;for(const b of active())ensureView(b,true)};

function nowParts(){
 const ps=new Intl.DateTimeFormat('en-GB',{timeZone:'America/Argentina/Buenos_Aires',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
 const get=t=>Number(ps.find(x=>x.type===t)?.value||0);return{h:get('hour'),m:get('minute'),s:get('second')}
}
function active(){return (serverActive||[]).slice().sort((a,b)=>String(a.id).localeCompare(String(b.id))).slice(0,4)}
async function api(body){
 const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:room.code,role:'tv',token:room.token,client_id:client,...body}),cache:'no-store'});
 const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'TV_API');return d
}
function sig(b){return b.kind+'|'+JSON.stringify(b.payload||{})}
function clockMarkup(){return '<div class="clockLayout"><div class="hybridClock"><div class="pomodoroTrack"></div><div class="hourTicks"></div><div class="minuteTicks"></div><span class="clockNumber n12">12</span><span class="clockNumber n3">3</span><span class="clockNumber n6">6</span><span class="clockNumber n9">9</span><div class="clockHand clockHour"></div><div class="clockHand clockMinute"></div><div class="clockHand clockSecond"></div><div class="phaseMarker"></div><div class="clockCenter"></div></div><div class="clockReadout"><div class="wallTimeBig">--:--</div><div class="phaseName">FOCO</div><div class="phaseRemaining">25:00</div><div class="phaseHint">hasta el recreo</div><div class="phaseScale"><span></span><span></span><span></span><span></span></div><div class="phaseScaleLabels"><span>25 FOCO</span><span>5 RECREO</span><span>25 FOCO</span><span>5 RECREO</span></div></div></div>'}
function destroyView(id){
 const v=views.get(String(id));if(!v)return;
 try{v.player?.destroy()}catch{}
 try{v.el.remove()}catch{}
 views.delete(String(id))
}
function createView(b){
 const id=String(b.id),el=document.createElement('section');el.className='panel';
 const v={id,el,kind:b.kind,sig:sig(b),player:null,ready:false,muted:false,state:null,progressFill:null};
 views.set(id,v);stage.appendChild(el);
 if(b.kind==='clock'){el.classList.add('clockPanel');el.innerHTML=clockMarkup()}
 else if(b.kind==='page'){const f=document.createElement('iframe');f.src=b.payload?.url||'about:blank';f.allow='autoplay; fullscreen; picture-in-picture';el.appendChild(f)}
 else if(b.kind==='youtube'){
   const host=document.createElement('div');host.className='ytHost';host.id='yt-'+id.replace(/[^a-z0-9_-]/gi,'');el.appendChild(host);
   const progress=document.createElement('div');progress.className='videoProgress';
   const fill=document.createElement('div');fill.className='videoProgressFill';progress.appendChild(fill);el.appendChild(progress);v.progressFill=fill;
   if(ytReady&&window.YT?.Player)mountPlayer(b,v)
 }
 return v
}
function mountPlayer(b,v){
 if(v.player||!ytReady||!window.YT?.Player)return;
 try{
  v.player=new YT.Player(v.el.querySelector('.ytHost').id,{
    videoId:String(b.payload?.video_id||''),
    playerVars:{autoplay:1,controls:0,playsinline:1,rel:0,fs:0,iv_load_policy:3,disablekb:1},
    events:{
      onReady:e=>{v.ready=true;try{e.target.playVideo()}catch{}},
      onStateChange:e=>{v.state=Number(e.data);if(Number(e.data)===0)advanceYoutube(b,v)},
      onAutoplayBlocked:()=>unlock.classList.add('show'),
      onError:()=>unlock.classList.add('show')
    }
  })
 }catch{unlock.classList.add('show')}
}
function ensureView(b,forceMount=false){
 const id=String(b.id),old=views.get(id);
 if(old&&old.sig===sig(b)){if(forceMount&&b.kind==='youtube')mountPlayer(b,old);return old}
 if(old)destroyView(id);
 return createView(b)
}
function applyGrid(act){
 const n=Math.max(1,act.length);stage.className='n'+n;
 for(let i=0;i<act.length;i++){
   const v=views.get(String(act[i].id));if(!v)continue;
   if(n<=3){v.el.style.gridColumn=String(i+1);v.el.style.gridRow='1'}
   else{v.el.style.gridColumn=String(i%2+1);v.el.style.gridRow=String(Math.floor(i/2)+1)}
 }
}
function syncStage(){
 const act=active(),ids=new Set(act.map(b=>String(b.id)));
 for(const id of [...views.keys()])if(!ids.has(id))destroyView(id);
 for(const b of act)ensureView(b,true);
 if(!act.length){
   stage.className='n1';
   if(!stage.querySelector('.empty')){const e=document.createElement('section');e.className='panel empty';stage.appendChild(e)}
 }else stage.querySelector('.empty')?.remove();
 applyGrid(act);tickClock();maybeApplyPendingUpdate()
}
function tickClock(){
 const n=nowParts(),totalSec=n.m*60+n.s,halfSec=totalSec%(30*60),work=halfSec<25*60;
 const phaseElapsed=work?halfSec:halfSec-25*60,phaseLength=work?25*60:5*60,remaining=Math.max(0,phaseLength-phaseElapsed);
 const hh=((n.h%12)+(n.m/60)+(n.s/3600))*30,mm=(n.m+n.s/60)*6,ss=n.s*6;
 const remM=Math.floor(remaining/60),remS=Math.floor(remaining%60),timeText=String(n.h).padStart(2,'0')+':'+String(n.m).padStart(2,'0');
 document.querySelectorAll('.clockLayout').forEach(layout=>{
   const clock=layout.querySelector('.hybridClock'),hour=layout.querySelector('.clockHour'),minute=layout.querySelector('.clockMinute'),second=layout.querySelector('.clockSecond');
   const name=layout.querySelector('.phaseName'),left=layout.querySelector('.phaseRemaining'),hint=layout.querySelector('.phaseHint'),wall=layout.querySelector('.wallTimeBig'),marker=layout.querySelector('.phaseMarker');
   if(hour)hour.style.transform='translateX(-50%) rotate('+hh+'deg)';
   if(minute)minute.style.transform='translateX(-50%) rotate('+mm+'deg)';
   if(second)second.style.transform='translateX(-50%) rotate('+ss+'deg)';
   if(wall)wall.textContent=timeText;
   if(name){name.textContent=work?'FOCO':'RECREO';name.style.color=work?'#f4f2ea':'#ff3b30'}
   if(left){left.textContent=String(remM).padStart(2,'0')+':'+String(remS).padStart(2,'0');left.style.color=work?'#f4f2ea':'#ff3b30'}
   if(hint)hint.textContent=work?'hasta el recreo':'hasta volver al foco';
   if(marker&&clock){const r=clock.clientWidth/2-8,ang=mm-90;marker.style.transform='rotate('+ang+'deg) translateX('+r+'px) translate(-50%,-50%)';marker.style.borderColor=work?'#f4f2ea':'#ff3b30'}
 })
}
function updateProgress(){
 for(const v of views.values()){
  if(v.kind!=='youtube'||!v.progressFill)continue;
  let current=0,duration=0;
  try{current=Number(v.player?.getCurrentTime?.()||0);duration=Number(v.player?.getDuration?.()||0)}catch{}
  const pct=duration>0?Math.max(0,Math.min(100,current/duration*100)):0;
  v.progressFill.style.width=pct+'%'
 }
}
function youtubeViews(){return active().filter(b=>b.kind==='youtube').map(b=>views.get(String(b.id))).filter(Boolean)}
function targets(blockId){if(blockId&&views.has(String(blockId)))return[views.get(String(blockId))];return youtubeViews()}
function playerCommand(cmd,blockId){
 for(const v of targets(blockId)){
   if(v.kind!=='youtube'||!v.player)continue;
   try{
    if(cmd==='play')v.player.playVideo();
    else if(cmd==='pause')v.player.pauseVideo();
    else if(cmd==='toggle'){const s=v.player.getPlayerState();s===1?v.player.pauseVideo():v.player.playVideo()}
    else if(cmd==='mute'){v.player.mute();v.muted=true}
    else if(cmd==='unmute'){v.player.unMute();v.muted=false}
   }catch{}
 }
}
function replaceBlock(updated){
 const id=String(updated.id);
 blocks=blocks.map(x=>String(x.id)===id?updated:x);
 serverActive=serverActive.map(x=>String(x.id)===id?updated:x)
}
async function advanceYoutube(b,v){
 const id=String(b.id),current=String(b.payload?.video_id||'');
 if(!current||advancing.has(id)||b.payload?.auto_next===false)return;
 advancing.add(id);
 try{
  const d=await api({action:'youtube_advance',block_id:id,video_id:current});
  if(d.advanced&&d.block){
    replaceBlock(d.block);
    destroyView(id);
    ensureView(d.block,true);
    applyGrid(active());
    unlock.classList.remove('show')
  }
 }catch{}
 finally{setTimeout(()=>advancing.delete(id),800)}
}
function refreshPanel(blockId){const b=blocks.find(x=>String(x.id)===String(blockId));if(!b)return;destroyView(blockId);ensureView(b,true);applyGrid(active())}
function hardReload(){location.replace('/prometeo/tv/?v='+Date.now()+location.hash)}
function maybeApplyPendingUpdate(){if(updatePending&&youtubeViews().length===0)hardReload()}
async function pollCommands(){
 try{
  const d=await api({action:'commands',after_id:lastCommandId});
  for(const ev of d.events||[]){
   lastCommandId=Math.max(lastCommandId,Number(ev.id)||0);
   if(new Date(ev.created_at).getTime()<pageStarted-1500)continue;
   const x=ev.payload||{},cmd=String(x.command||''),blockId=String(x.block_id||'');
   if(['play','pause','toggle','mute','unmute'].includes(cmd))playerCommand(cmd,blockId);
   else if(cmd==='refresh_panel')refreshPanel(blockId);
   else if(cmd==='reload_now')hardReload();
   else if(cmd==='reload_when_idle'){updatePending=true;maybeApplyPendingUpdate()}
  }
 }catch{}
}
async function sendState(){
 const act=active(),ys=act.filter(b=>b.kind==='youtube'),playerState={};
 for(const b of ys){
  const v=views.get(String(b.id));let state=null,muted=false,time=null;
  try{state=v?.player?.getPlayerState?.()??v?.state??null;muted=!!v?.player?.isMuted?.();time=v?.player?.getCurrentTime?.()??null}catch{}
  playerState[String(b.id)]={state,muted,current_time:time,video_id:b.payload?.video_id||''}
 }
 try{await api({action:'tv_state',build:BUILD,active_ids:act.map(b=>b.id),active_youtube_ids:ys.map(b=>b.id),player_state:playerState,update_pending:updatePending})}catch{}
}
async function loadSchedule(){
 try{
  const d=await api({action:'list'});
  blocks=d.blocks||[];serverActive=d.active_blocks||[];
  status.className='status';syncStage()
 }catch{status.className='status err'}
}
async function checkRuntime(){
 try{
  const r=await fetch(RUNTIME+'?t='+Date.now(),{cache:'no-store'}),d=await r.json();
  if(String(d.tv_build||d.build||BUILD)!==BUILD){if(youtubeViews().length)updatePending=true;else hardReload()}
 }catch{}
}
unlock.onclick=()=>{unlock.classList.remove('show');for(const v of youtubeViews())try{v.player?.playVideo()}catch{}};
document.addEventListener('click',()=>{for(const v of youtubeViews())try{v.player?.playVideo()}catch{}},{once:true});
stage.addEventListener('contextmenu',e=>e.preventDefault());
setInterval(()=>{tickClock();updateProgress();syncStage()},250);
setInterval(loadSchedule,700);
setInterval(pollCommands,350);
setInterval(sendState,1000);
setInterval(checkRuntime,15000);
loadSchedule();pollCommands();sendState();checkRuntime();
})();
</script>
</body>
</html>
