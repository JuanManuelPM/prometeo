<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<title>Canal TV</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
#stage{position:fixed;inset:0;display:grid;background:#000;gap:1px;grid-template-columns:1fr;grid-template-rows:1fr}
#stage.layout-single{grid-template-columns:1fr;grid-template-rows:1fr}
#stage.layout-two-stack{grid-template-columns:1fr;grid-template-rows:minmax(0,44fr) minmax(0,56fr)}
#stage.layout-two-side{grid-template-columns:minmax(0,34fr) minmax(0,66fr);grid-template-rows:1fr}
#stage.layout-two-equal{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
#stage.layout-three-wide-bottom{grid-template-columns:minmax(0,34fr) minmax(0,66fr);grid-template-rows:minmax(0,42fr) minmax(0,58fr)}
#stage.layout-three-side-stack{grid-template-columns:minmax(0,31fr) minmax(0,69fr);grid-template-rows:1fr 1fr}
#stage.layout-three-balanced{grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,48fr) minmax(0,52fr)}
#stage.layout-four-wide-bottom{grid-template-columns:repeat(3,1fr);grid-template-rows:minmax(0,43fr) minmax(0,57fr)}
#stage.layout-four-two-wide{grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,42fr) minmax(0,58fr)}
#stage.layout-four-grid{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.panel{position:relative;overflow:hidden;background:#000;min-width:0;min-height:0}
.panel iframe,.ytHost,.ytHost iframe{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;border:0!important}
.youtubePanel,.newsPanel{background:#000;overflow:hidden}
.nativeVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;border:0;outline:0;z-index:1}
.newsPanel .nativeVideo{object-fit:contain}
.ytFallback{position:absolute;inset:0;z-index:1;overflow:hidden;background:#000}
.ytFallback>div,.ytFallback iframe{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;border:0!important;pointer-events:none!important}
.ytFallback iframe{transform:scale(1.07);transform-origin:center}
.newsCaption{position:absolute;z-index:4;left:16px;right:16px;bottom:44px;pointer-events:none;text-shadow:0 1px 5px #000}
.newsChannel{font:900 8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;color:#f0ede4}
.newsTitle{margin-top:5px;max-width:80%;font:800 clamp(12px,2vw,22px)/1.08 system-ui,sans-serif;color:#f0ede4}
.youtubeStatus{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.18);color:#d5d1c7;text-align:center;text-shadow:0 1px 5px #000;font:900 clamp(8px,1.1vw,13px) ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;z-index:2;pointer-events:none}
.youtubeStatus span{display:block;margin-top:8px;color:#363630;font-size:.72em}
.tvProgress{position:absolute;z-index:5;left:14px;right:14px;bottom:10px;height:26px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:10px;pointer-events:none;opacity:.94}
.tvProgressTrack{height:4px;align-self:end;background:#2a2925;overflow:hidden}
.tvProgressFill{height:100%;width:0;background:#f0ede4;transition:width .12s linear}
.tvRemaining{min-width:54px;text-align:right;color:#d9d5ca;font:900 9px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1}
.videoProgress{display:none!important}
.videoProgressFill{display:none!important}
.youtubeEmpty{position:absolute;inset:0;display:grid;place-items:center;background:#000;color:#f4f2ea;font:900 clamp(14px,2.2vw,28px)/1 Arial,Helvetica,sans-serif;letter-spacing:.12em}
.youtubeEmpty span{color:#77766f;font-size:.38em;display:block;text-align:center;margin-top:9px;letter-spacing:.1em}
.clockPanel{display:grid;place-items:center;background:#050505;container-type:size}
.clockLayout{width:100%;height:100%;display:grid;grid-template-columns:minmax(0,1.42fr) minmax(230px,.58fr);align-items:center;gap:min(2.2cqw,28px);padding:min(2.3cqh,22px) min(2.2cqw,28px)}
.hybridClock{position:relative;width:min(72cqw,94cqh);max-width:100%;aspect-ratio:1;border-radius:50%;justify-self:center;background:#050505;overflow:hidden}
.timeMass{position:absolute;inset:5.2%;border-radius:50%;background:conic-gradient(from -90deg,#ff3b30 0deg 150deg,transparent 150deg 360deg);z-index:0}
.dialRim{position:absolute;inset:4.2%;border:clamp(3px,.38cqw,5px) solid #f4f2ea;border-radius:50%;z-index:1}
.hourTicks{position:absolute;inset:8.7%;border-radius:50%;background:repeating-conic-gradient(from -90deg,#f4f3ee 0deg 2deg,transparent 2deg 30deg);-webkit-mask:radial-gradient(circle,transparent 0 92%,#000 92% 100%);mask:radial-gradient(circle,transparent 0 92%,#000 92% 100%);z-index:2}
.minuteTicks{position:absolute;inset:10.2%;border-radius:50%;background:repeating-conic-gradient(from -90deg,#8b8980 0deg .8deg,transparent .8deg 6deg);-webkit-mask:radial-gradient(circle,transparent 0 96%,#000 96% 100%);mask:radial-gradient(circle,transparent 0 96%,#000 96% 100%);opacity:.72;z-index:2}
.clockNumber{position:absolute;font:900 clamp(18px,3.2cqw,42px)/1 Arial,Helvetica,sans-serif;color:#f4f2ea;z-index:4;text-shadow:0 1px 8px #000}
.clockNumber.n12{left:50%;top:15.5%;transform:translate(-50%,-50%)}.clockNumber.n3{right:15.5%;top:50%;transform:translate(50%,-50%)}.clockNumber.n6{left:50%;bottom:15.5%;transform:translate(-50%,50%)}.clockNumber.n9{left:15.5%;top:50%;transform:translate(-50%,-50%)}
.clockHand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:99px;z-index:6;box-shadow:0 0 5px #000}
.clockHour{width:clamp(8px,1.15cqw,15px);height:23%;background:#f4f2ea}
.clockMinute{width:clamp(5px,.7cqw,9px);height:34%;background:#f4f2ea}
.clockSecond{width:clamp(2px,.24cqw,4px);height:39%;background:#050505;outline:1px solid #f4f2ea}
.clockCenter{position:absolute;left:50%;top:50%;width:clamp(18px,2.15cqw,28px);height:clamp(18px,2.15cqw,28px);transform:translate(-50%,-50%);border-radius:50%;background:#050505;border:clamp(3px,.42cqw,5px) solid #f4f2ea;z-index:8}
.clockReadout{min-width:0;align-self:center;display:flex;flex-direction:column;justify-content:center;padding-right:min(2cqw,24px)}
.phaseName{font:900 clamp(22px,3.2cqw,48px)/.95 Arial,Helvetica,sans-serif;letter-spacing:.08em;color:#f4f2ea}
.phaseRemaining{margin-top:min(1.6cqh,14px);font:900 clamp(52px,7cqw,112px)/.86 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.075em;white-space:nowrap;color:#f4f2ea}
.phaseHint{margin-top:min(2cqh,18px);font:900 clamp(10px,1.15cqw,17px)/1.2 Arial,Helvetica,sans-serif;color:#8b8980;letter-spacing:.08em;text-transform:uppercase}
.wallTimeBig{margin-top:min(5cqh,40px);font:900 clamp(34px,4.6cqw,74px)/.86 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.06em;color:#f4f2ea;white-space:nowrap}
.wallLabel{margin-top:8px;font:900 clamp(9px,1cqw,14px)/1 Arial,Helvetica,sans-serif;color:#77766f;letter-spacing:.12em;text-transform:uppercase}
@container (max-width:720px){
  .clockLayout{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:2px;padding:8px}
  .hybridClock{width:min(88cqw,67cqh)}
  .clockReadout{align-items:center;text-align:center;padding:0 0 8px}
  .phaseName{font-size:clamp(18px,6cqw,32px)}
  .phaseRemaining{margin-top:4px;font-size:clamp(36px,11cqw,66px)}
  .phaseHint{display:none}
  .wallTimeBig{margin-top:7px;font-size:clamp(26px,8cqw,44px)}
  .wallLabel{display:none}
}
.panel.mode-compact.clockPanel .clockLayout{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:0;padding:7px}
.panel.mode-compact.clockPanel .hybridClock{width:min(90cqw,64cqh)}
.panel.mode-compact.clockPanel .clockReadout{align-items:center;text-align:center;padding:0 0 6px}
.panel.mode-compact.clockPanel .phaseName{font-size:clamp(15px,5cqw,25px)}
.panel.mode-compact.clockPanel .phaseRemaining{margin-top:3px;font-size:clamp(30px,9cqw,54px)}
.panel.mode-compact.clockPanel .phaseHint,.panel.mode-compact.clockPanel .wallLabel{display:none}
.panel.mode-compact.clockPanel .wallTimeBig{margin-top:5px;font-size:clamp(22px,7cqw,36px)}
.panel.mode-wide iframe,.panel.mode-wide .ytHost,.panel.mode-wide .ytHost iframe{object-fit:contain}
.unlock{position:fixed;z-index:70;right:12px;bottom:12px;display:none;border:1px solid #ffffff66;background:#080806e8;color:#f2eee5;min-height:44px;padding:0 15px;font-size:9px;font-weight:900;letter-spacing:.09em;box-shadow:0 8px 24px #000a}
.unlock.show{display:block}
.status{position:fixed;right:8px;top:8px;z-index:60;width:5px;height:5px;border-radius:50%;background:#333;opacity:.35}.status.err{background:#fff}
</style>
</head>
<body>
<main id="stage" class="n1"></main>
<button id="unlock" class="unlock">TOCÁ UNA VEZ PARA SONIDO</button>
<div id="status" class="status"></div>
<script>
(()=>{
'use strict';
const BUILD='36';
const API='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/tv-schedule-v1';
const RUNTIME='https://juanmanuelpm.github.io/prometeo/tv/canonical.json';
const p=new URLSearchParams(location.hash.slice(1));
const DEFAULT_ROOM='TV-PM2K7Q',DEFAULT_TOKEN='6e7f4b74d76d2488ac3779832c77632475dd845db3a9b598765a757c7f18c327';
const room={code:p.get('room')||DEFAULT_ROOM,token:p.get('t')||DEFAULT_TOKEN,role:'tv'};
const client='tv-v36-'+Math.random().toString(36).slice(2,10);
const stage=document.getElementById('stage'),unlock=document.getElementById('unlock'),status=document.getElementById('status');
const views=new Map(),advancing=new Set();
const PIPED_APIS=[
 'https://pipedapi.kavin.rocks',
 'https://pipedapi.tokhmi.xyz',
 'https://pipedapi.moomoo.me',
 'https://pipedapi.syncpundit.io',
 'https://api-piped.mha.fi',
 'https://piped-api.garudalinux.org',
 'https://pipedapi.qdi.fi',
 'https://piped-api.hostux.net',
 'https://pdapi.vern.cc',
 'https://pipedapi.pfcd.me',
 'https://pipedapi.frontendfriendly.xyz',
 'https://api.piped.yt',
 'https://pipedapi.astartes.nl',
 'https://pipedapi.osphost.fi',
 'https://pipedapi.simpleprivacy.fr',
 'https://pipedapi.drgns.space',
 'https://piapi.ggtyler.dev',
 'https://api.watch.pluto.lat'
];
let blocks=[],serverActive=[],lastCommandId=0,updatePending=false,pageStarted=Date.now(),ytFallbackPromise=null;
let soundWanted=true,soundGestureUnlocked=false;
try{localStorage.setItem('prometeo.tv.sound','1')}catch{}

function nowParts(){
 const ps=new Intl.DateTimeFormat('en-GB',{timeZone:'America/Argentina/Buenos_Aires',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
 const get=t=>Number(ps.find(x=>x.type===t)?.value||0);return{h:get('hour'),m:get('minute'),s:get('second')}
}
function active(){return (serverActive||[]).slice().sort((a,b)=>String(a.id).localeCompare(String(b.id))).slice(0,4)}
async function api(body){
 const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:room.code,role:'tv',token:room.token,client_id:client,...body}),cache:'no-store'});
 const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'TV_API');return d
}
function sig(b){return (b.kind==='youtube'||b.kind==='news')?b.kind:b.kind+'|'+JSON.stringify(b.payload||{})}
function clockMarkup(){return '<div class="clockLayout"><div class="hybridClock"><div class="timeMass"></div><div class="dialRim"></div><div class="hourTicks"></div><div class="minuteTicks"></div><span class="clockNumber n12">12</span><span class="clockNumber n3">3</span><span class="clockNumber n6">6</span><span class="clockNumber n9">9</span><div class="clockHand clockHour"></div><div class="clockHand clockMinute"></div><div class="clockHand clockSecond"></div><div class="clockCenter"></div></div><div class="clockReadout"><div class="phaseName">FOCO</div><div class="phaseRemaining">25:00</div><div class="phaseHint">la superficie roja es el tiempo que queda</div><div class="wallTimeBig">--:--</div><div class="wallLabel">hora actual</div></div></div>'}
function destroyView(id){
 const v=views.get(String(id));if(!v)return;
 try{v.player?.destroy()}catch{}
 try{v.abort?.abort()}catch{}
 try{v.el.remove()}catch{}
 views.delete(String(id))
}
function chooseMuxedStream(data){
 const xs=(Array.isArray(data?.videoStreams)?data.videoStreams:[]).filter(x=>x&&x.url&&!x.videoOnly&&String(x.mimeType||'').startsWith('video/'));
 xs.sort((a,b)=>{
   const amp=/mp4/i.test(String(a.mimeType||a.format||''))?1:0,bmp=/mp4/i.test(String(b.mimeType||b.format||''))?1:0;
   if(amp!==bmp)return bmp-amp;
   const ah=Number(a.height||0),bh=Number(b.height||0),ac=ah<=1080?ah:-ah,bc=bh<=1080?bh:-bh;
   return bc-ac||Number(b.bitrate||0)-Number(a.bitrate||0)
 });
 return xs[0]||null
}
async function resolveFromPiped(base,videoId,outerSignal){
 const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),5200);
 const abort=()=>ctl.abort();outerSignal?.addEventListener('abort',abort,{once:true});
 try{
  const r=await fetch(base+'/streams/'+encodeURIComponent(videoId),{
   cache:'no-store',signal:ctl.signal,headers:{Accept:'application/json'}
  });
  if(!r.ok)throw new Error(base+' '+r.status);
  const d=await r.json(),stream=chooseMuxedStream(d);
  if(!stream?.url)throw new Error(base+' sin stream combinado');
  return{url:String(stream.url),duration:Number(d.duration||0),title:String(d.title||''),source:base,mime:String(stream.mimeType||'video/mp4')}
 }finally{
  clearTimeout(timer);outerSignal?.removeEventListener('abort',abort)
 }
}
async function resolveCleanStream(videoId,signal){
 const attempts=PIPED_APIS.map(base=>resolveFromPiped(base,videoId,signal));
 const deadline=new Promise((_,reject)=>setTimeout(()=>reject(new Error('RESOLVER_TIMEOUT')),6500));
 try{return await Promise.race([Promise.any(attempts),deadline])}
 catch(e){throw new Error('SIN_STREAM_LIMPIO')}
}
function persistSoundWanted(){
 try{localStorage.setItem('prometeo.tv.sound',soundWanted?'1':'0')}catch{}
}
function showSoundUnlock(){
 if(soundWanted){unlock.textContent='ACTIVAR SONIDO';unlock.classList.add('show')}
}
function hideSoundUnlock(){unlock.classList.remove('show')}
function playerStateOf(v){try{return Number(v?.player?.getPlayerState?.()??v?.state??-1)}catch{return-1}}
function playerMuted(v){try{return !!v?.player?.isMuted?.()}catch{return !!v?.muted}}
function preservePlayingAfterAudio(v,wasPlaying){
 if(!wasPlaying||v?.userPaused)return;
 setTimeout(()=>{
  try{
   if(playerStateOf(v)!==1){
    if(soundWanted&&!soundGestureUnlocked){v.player?.mute?.();v.muted=true;showSoundUnlock()}
    v.player?.playVideo?.()
   }
  }catch{}
 },120)
}
function recoverBlockedSound(v){
 if(!v?.player||v.userPaused)return;
 try{v.player.mute?.();v.muted=true;v.player.playVideo?.()}catch{}
 showSoundUnlock()
}
function watchSoundAttempt(v){
 if(!v?.player)return;
 const until=Date.now()+4500;v.audioTransitionUntil=until;
 const id=String(v.id);
 const check=()=>{
  if(!views.has(id)||v.userPaused)return;
  const st=playerStateOf(v),muted=playerMuted(v);
  if(st===1&&!muted){v.muted=false;soundGestureUnlocked=true;hideSoundUnlock();return}
  if(st===2||st===5){recoverBlockedSound(v);return}
  if(Date.now()>=until){if(st!==1)recoverBlockedSound(v);else if(muted)showSoundUnlock();return}
  setTimeout(check,180)
 };
 setTimeout(check,180)
}
function applyMutePreference(v,on,{forcePlay=false}={}){
 if(!v?.player)return;
 const wasPlaying=forcePlay||playerStateOf(v)===1||(!v.userPaused&&v.playbackSeen);
 try{
  if(on){v.player.unMute?.();v.muted=false}
  else{v.player.mute?.();v.muted=true}
 }catch{}
 preservePlayingAfterAudio(v,wasPlaying)
}
function startDesiredPlayback(v){
 if(!v?.player)return;
 v.userPaused=false;
 if(soundWanted){
  // Legacy behavior that previously worked here: ask YouTube to play first,
  // without forcing an audio state before playback.
  try{v.player.playVideo?.()}catch{}
  setTimeout(()=>{
   if(!views.has(String(v.id))||v.userPaused)return;
   const st=playerStateOf(v),muted=playerMuted(v);
   if(st===1&&!muted){v.muted=false;soundGestureUnlocked=true;hideSoundUnlock();return}
   if(st===1&&muted){
    try{v.player.unMute?.();v.muted=false}catch{}
    watchSoundAttempt(v);return
   }
   // Audible autoplay was rejected: keep the sequence alive muted,
   // but expose one local gesture to unlock sound for the persistent player.
   recoverBlockedSound(v)
  },700)
 }else{
  try{v.player.mute?.();v.muted=true;v.player.playVideo?.()}catch{}
  hideSoundUnlock()
 }
}
function unlockSoundFromGesture(){
 soundGestureUnlocked=true;soundWanted=true;persistSoundWanted();
 for(const v of mediaViews()){
  if(!v?.player)continue;
  v.userPaused=false;
  try{v.player.unMute?.();v.muted=false;v.player.playVideo?.()}catch{}
  setTimeout(()=>{try{if(playerStateOf(v)!==1)v.player.playVideo?.();v.muted=playerMuted(v)}catch{}},220)
 }
 hideSoundUnlock()
}
function ensureYTFallback(){
 if(window.YT?.Player)return Promise.resolve(window.YT);
 if(ytFallbackPromise)return ytFallbackPromise;
 ytFallbackPromise=new Promise((resolve,reject)=>{
  const old=window.onYouTubeIframeAPIReady,timer=setTimeout(()=>reject(new Error('YT_FALLBACK_TIMEOUT')),9000);
  window.onYouTubeIframeAPIReady=()=>{clearTimeout(timer);try{old?.()}catch{}resolve(window.YT)};
  const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';sc.async=true;sc.onerror=()=>{clearTimeout(timer);reject(new Error('YT_FALLBACK_LOAD'))};document.head.appendChild(sc)
 });
 return ytFallbackPromise
}
async function mountYoutubeFallback(b,v){
 const videoId=String(b.payload?.video_id||'');if(!videoId)return;
 try{v.abort?.abort()}catch{}
 try{v.video?.pause();if(v.video)v.video.style.display='none'}catch{}
 if(v.fallbackWrap)try{v.fallbackWrap.remove()}catch{}
 const wrap=document.createElement('div');wrap.className='ytFallback';const host=document.createElement('div');host.id='yt-fallback-'+String(v.id).replace(/[^a-z0-9_-]/gi,'');wrap.appendChild(host);v.el.insertBefore(wrap,v.status);v.fallbackWrap=wrap;
 v.status.innerHTML='ABRIENDO VIDEO<span>MODO DE EMERGENCIA</span>';
 try{
  await ensureYTFallback();if(!views.has(String(v.id))||String(v.block?.payload?.video_id||'')!==videoId)return;
  const p=new YT.Player(host,{videoId,playerVars:{autoplay:1,controls:0,playsinline:1,rel:0,fs:0,iv_load_policy:3,disablekb:1,modestbranding:1},
   events:{
    onReady:e=>{v.fallbackPlayer=e.target;v.player=e.target;v.streamSource='youtube-fallback';v.ready=true;v.userPaused=false;v.muted=!!e.target.isMuted?.();v.status.style.display='none';startDesiredPlayback(v)},
    onStateChange:e=>{
      v.state=Number(e.data);
      if(v.state===1){v.playbackSeen=true;v.muted=playerMuted(v);v.status.style.display='none';if(soundWanted&&!v.muted){soundGestureUnlocked=true;hideSoundUnlock()}}
      if(v.state===2&&Date.now()<Number(v.audioTransitionUntil||0)&&!v.userPaused)recoverBlockedSound(v)
      if(v.state===0&&v.playbackSeen){if(v.kind==='news'){if(!v.autoAdvanceFired){v.autoAdvanceFired=true;advanceNews(v.block,v)}}else advanceYoutube(v.block,v)}
    },
    onAutoplayBlocked:()=>{try{v.player?.mute?.();v.muted=true;v.player?.playVideo?.()}catch{};if(soundWanted)showSoundUnlock()},
    onError:()=>{v.status.style.display='grid';v.status.innerHTML='NO PUDE ABRIR ESTE SHORT<span>PASANDO AL SIGUIENTE</span>';setTimeout(()=>{if(v.kind==='news')advanceNews(v.block,v)},1200)}
   }});
 }catch{
  v.status.style.display='grid';v.status.innerHTML='NO PUDE ABRIR ESTE SHORT<span>PASANDO AL SIGUIENTE</span>';setTimeout(()=>{if(v.kind==='news')advanceNews(v.block,v)},1200)
 }
}
function nativeAdapter(video,v){
 return{
  playVideo(){return video.play()},
  pauseVideo(){video.pause()},
  getPlayerState(){return video.ended?0:video.paused?2:(video.readyState<3?3:1)},
  mute(){video.muted=true;v.muted=true},
  unMute(){video.muted=false;v.muted=false},
  isMuted(){return !!video.muted},
  getCurrentTime(){return Number(video.currentTime||0)},
  getDuration(){return Number(video.duration||v.streamDuration||0)},
  seekTo(t){const d=Number(video.duration||v.streamDuration||0),n=Math.max(0,d>0?Math.min(d-.05,Number(t)||0):Number(t)||0);video.currentTime=n},
  destroy(){try{video.pause();video.removeAttribute('src');video.load()}catch{}}
 }
}
async function startNativePlayback(v){
 const video=v?.video;if(!video)return;v.userPaused=false;
 if(!soundWanted){
  try{video.muted=true;v.muted=true;await video.play();hideSoundUnlock();return}catch{unlock.classList.add('show');return}
 }
 try{video.muted=false;await video.play();v.muted=false;hideSoundUnlock();return}catch{}
 try{video.muted=true;v.muted=true;await video.play();showSoundUnlock()}catch{unlock.classList.add('show')}
}
async function loadNativeStream(b,v){
 const videoId=String(b.payload?.video_id||'');if(!videoId||!v.video)return;
 try{v.abort?.abort()}catch{}
 const abort=new AbortController();v.abort=abort;const ticket=(v.loadTicket||0)+1;v.loadTicket=ticket;
 v.ready=false;v.state=3;v.playbackSeen=false;v.status.innerHTML='BUSCANDO VIDEO LIMPIO<span>PROBANDO FUENTES EN PARALELO</span>';
 try{
   const out=await resolveCleanStream(videoId,abort.signal);
   if(abort.signal.aborted||ticket!==v.loadTicket)return;
   v.videoId=videoId;v.streamDuration=out.duration||0;v.streamSource=out.source;v.video.src=out.url;v.video.load();v.status.textContent='CARGANDO';await startNativePlayback(v)
 }catch(e){
   if(abort.signal.aborted||ticket!==v.loadTicket)return;
   v.state=3;await mountYoutubeFallback(b,v)
 }
}
function createView(b){
 const id=String(b.id),el=document.createElement('section');el.className='panel';
 const videoId=String(b.payload?.video_id||'');
 const v={id,el,kind:b.kind,sig:sig(b),block:b,videoId,player:null,video:null,status:null,progress:null,progressFill:null,remaining:null,abort:null,fallbackWrap:null,fallbackPlayer:null,loadTicket:0,ready:false,muted:false,state:null,streamDuration:0,streamSource:'',playbackSeen:false,userPaused:false,audioTransitionUntil:0,autoAdvanceFired:false};
 views.set(id,v);stage.appendChild(el);
 if(b.kind==='clock'){el.classList.add('clockPanel');el.innerHTML=clockMarkup()}
 else if(b.kind==='page'){const f=document.createElement('iframe');f.src=b.payload?.url||'about:blank';f.allow='autoplay; fullscreen; picture-in-picture';f.addEventListener('load',()=>setTimeout(()=>applyGrid(active()),30));el.appendChild(f)}
 else if(b.kind==='youtube'||b.kind==='news'){
   el.classList.add(b.kind==='news'?'newsPanel':'youtubePanel');
   if(!videoId){const empty=document.createElement('div');empty.className='youtubeEmpty';empty.innerHTML='<div>'+(b.kind==='news'?'NOTICIAS':'YOUTUBE')+'<span>SIN CONTENIDO</span></div>';el.appendChild(empty)}
   else{
     const video=document.createElement('video');video.className='nativeVideo';video.autoplay=true;video.playsInline=true;video.preload='auto';video.controls=false;video.disablePictureInPicture=true;video.poster=String(b.payload?.thumbnail||('https://i.ytimg.com/vi/'+videoId+'/maxresdefault.jpg'));video.setAttribute('disableRemotePlayback','');video.setAttribute('aria-label',b.kind==='news'?'Short de noticias':'Video');
     const st=document.createElement('div');st.className='youtubeStatus';st.innerHTML='PREPARANDO VIDEO<span>'+String(b.payload?.channel_title||'').toUpperCase()+'</span>';
     const pr=document.createElement('div');pr.className='tvProgress';pr.innerHTML='<div class="tvProgressTrack"><div class="tvProgressFill"></div></div><div class="tvRemaining">--:--</div>';
     el.append(video,st,pr);
     if(b.kind==='news'){const cap=document.createElement('div');cap.className='newsCaption';cap.innerHTML='<div class="newsChannel"></div><div class="newsTitle"></div>';el.appendChild(cap);v.caption=cap}
     v.video=video;v.status=st;v.progress=pr;v.progressFill=pr.querySelector('.tvProgressFill');v.remaining=pr.querySelector('.tvRemaining');v.player=nativeAdapter(video,v);
     if(v.caption){v.caption.querySelector('.newsChannel').textContent=String(b.payload?.channel_title||'NOTICIAS').toUpperCase();v.caption.querySelector('.newsTitle').textContent=String(b.payload?.video_title||'')}
     video.addEventListener('loadedmetadata',()=>{v.ready=true;v.streamDuration=Number(video.duration||v.streamDuration||0);st.textContent='';st.style.display='none'});
     video.addEventListener('playing',()=>{v.state=1;v.playbackSeen=true;v.muted=video.muted;st.style.display='none'});
     video.addEventListener('pause',()=>{if(!video.ended)v.state=2});
     video.addEventListener('waiting',()=>{v.state=3});
     video.addEventListener('ended',()=>{v.state=0;const d=Number(video.duration||0),t=Number(video.currentTime||0);if(v.playbackSeen&&d>0&&(t>=d-3||t/d>=.97)){if(v.kind==='news'){if(!v.autoAdvanceFired){v.autoAdvanceFired=true;advanceNews(v.block,v)}}else advanceYoutube(v.block,v)}});
     video.addEventListener('error',()=>{if(v.ready){st.style.display='grid';st.innerHTML='STREAM INTERRUMPIDO<span>RECONECTANDO</span>';setTimeout(()=>loadNativeStream(v.block,v),900)}});
     loadNativeStream(b,v)
   }
 }
 return v
}
function switchYoutubeVideo(b,v){
 const next=String(b.payload?.video_id||'');if(!next||next===v.videoId)return;
 v.block=b;v.videoId=next;v.playbackSeen=false;v.userPaused=false;v.autoAdvanceFired=false;v.state=3;
 if(v.video)v.video.poster=String(b.payload?.thumbnail||('https://i.ytimg.com/vi/'+next+'/maxresdefault.jpg'));
 if(v.fallbackPlayer&&v.streamSource==='youtube-fallback'){
   try{
    v.player=v.fallbackPlayer;
    v.status.style.display='none';
    v.fallbackPlayer.loadVideoById({videoId:next,startSeconds:0});
    setTimeout(()=>startDesiredPlayback(v),60);
    return
   }catch{}
 }
 try{v.fallbackPlayer?.destroy()}catch{};v.fallbackPlayer=null;v.fallbackWrap=null;v.streamSource='';v.player=nativeAdapter(v.video,v);if(v.video)v.video.style.display='';
 loadNativeStream(b,v)
}
function ensureView(b,forceMount=false){
 const id=String(b.id),old=views.get(id),nextVideo=String(b.payload?.video_id||'');
 if(old&&old.kind===b.kind&&old.sig===sig(b)){
   old.block=b;
   if(b.kind==='youtube'||b.kind==='news'){
     const had=!!old.videoId,has=!!nextVideo;
     if(had!==has){destroyView(id);return createView(b)}
     if(has&&nextVideo!==old.videoId)switchYoutubeVideo(b,old);
     if(b.kind==='news'&&old.caption){old.caption.querySelector('.newsChannel').textContent=String(b.payload?.channel_title||'NOTICIAS').toUpperCase();old.caption.querySelector('.newsTitle').textContent=String(b.payload?.video_title||'')}
   }
   return old
 }
 if(old)destroyView(id);
 return createView(b)
}
function displaySpec(b){
  const raw=(b?.payload?.display&&typeof b.payload.display==='object')?b.payload.display:
            (b?.payload?.layout&&typeof b.payload.layout==='object')?b.payload.layout:{};
  const allowed=new Set(['wide','compact','flex']);
  let profile=allowed.has(String(raw.profile||''))?String(raw.profile):'';
  if(!profile)profile=b.kind==='youtube'?'wide':b.kind==='news'?'compact':b.kind==='clock'?'compact':'flex';
  let position=String(raw.position||'');
  if(!['top','bottom','side','auto'].includes(position))position=profile==='wide'?'bottom':profile==='compact'?'side':'auto';
  return{profile,position}
}
function clearPlacement(act){
  stage.removeAttribute('style');
  for(const b of act){
    const v=views.get(String(b.id));if(!v)continue;
    v.el.style.gridColumn='';v.el.style.gridRow='';v.el.style.gridArea='';
    v.el.classList.remove('mode-wide','mode-compact','mode-flex');
    v.el.classList.add('mode-'+displaySpec(b).profile)
  }
}
function place(b,col,row){
  const v=views.get(String(b.id));if(!v)return;
  v.el.style.gridColumn=col;v.el.style.gridRow=row
}
function notifyPageLayout(b,mode,count){
  if(b.kind!=='page')return;
  const v=views.get(String(b.id)),frame=v?.el?.querySelector('iframe');if(!v||!frame)return;
  requestAnimationFrame(()=>{
    const r=v.el.getBoundingClientRect();
    try{frame.contentWindow?.postMessage({type:'prometeo:layout',mode,profile:displaySpec(b).profile,width:Math.round(r.width),height:Math.round(r.height),count,orientation:r.width>=r.height?'landscape':'portrait'},'*')}catch{}
  })
}
function applyGrid(act){
  const n=Math.max(1,act.length);clearPlacement(act);
  if(!act.length){stage.className='layout-single';return}
  const entries=act.map(b=>({b,...displaySpec(b)}));
  const wide=entries.filter(x=>x.profile==='wide'),compact=entries.filter(x=>x.profile==='compact'),flex=entries.filter(x=>x.profile==='flex');
  let mode='layout-single';

  if(n===1){
    mode='layout-single';place(act[0],'1','1')
  }else if(n===2){
    if(wide.length){
      mode='layout-two-stack';
      const w=wide[0],other=entries.find(x=>x!==w);
      place(other.b,'1','1');place(w.b,'1','2')
    }else if(compact.length===1){
      mode='layout-two-side';
      const c=compact[0],other=entries.find(x=>x!==c);
      place(c.b,'1','1');place(other.b,'2','1')
    }else{
      mode='layout-two-equal';place(act[0],'1','1');place(act[1],'2','1')
    }
  }else if(n===3){
    if(wide.length===1){
      mode='layout-three-wide-bottom';
      const w=wide[0],tops=entries.filter(x=>x!==w).sort((a,b)=>(a.profile==='compact'?-1:1)-(b.profile==='compact'?-1:1));
      place(tops[0].b,'1','1');place(tops[1].b,'2','1');place(w.b,'1 / -1','2')
    }else if(wide.length>=2||compact.length===1){
      mode='layout-three-side-stack';
      const side=compact[0]||flex[0]||entries[0],others=entries.filter(x=>x!==side);
      place(side.b,'1','1 / -1');place(others[0].b,'2','1');place(others[1].b,'2','2')
    }else{
      mode='layout-three-balanced';
      place(act[0],'1','1');place(act[1],'2','1');place(act[2],'1 / -1','2')
    }
  }else{
    if(wide.length===1){
      mode='layout-four-wide-bottom';
      const w=wide[0],tops=entries.filter(x=>x!==w);
      tops.forEach((x,i)=>place(x.b,String(i+1),'1'));place(w.b,'1 / -1','2')
    }else if(wide.length===2){
      mode='layout-four-two-wide';
      const tops=entries.filter(x=>!wide.includes(x));
      place(tops[0].b,'1','1');place(tops[1].b,'2','1');place(wide[0].b,'1','2');place(wide[1].b,'2','2')
    }else{
      mode='layout-four-grid';
      act.forEach((b,i)=>place(b,String(i%2+1),String(Math.floor(i/2)+1)))
    }
  }

  stage.className=mode;
  for(const b of act)notifyPageLayout(b,mode,n)
}
function syncStage(){
 const act=active(),ids=new Set(act.map(b=>String(b.id)));
 for(const id of [...views.keys()])if(!ids.has(id))destroyView(id);
 for(const b of act)ensureView(b,true);
 if(!act.length){
   stage.className='n1';
   if(!stage.querySelector('.empty')){const e=document.createElement('section');e.className='panel empty';stage.appendChild(e)}
 }else stage.querySelector('.empty')?.remove();
 applyGrid(act);tickClock();maybeApplyPendingUpdate()
}
function tickClock(){
 const n=nowParts(),daySec=n.h*3600+n.m*60+n.s;
 const hh=((n.h%12)+(n.m/60)+(n.s/3600))*30,mm=(n.m+n.s/60)*6,ss=n.s*6,timeText=String(n.h).padStart(2,'0')+':'+String(n.m).padStart(2,'0');
 for(const b of active().filter(x=>x.kind==='clock')){
   const v=views.get(String(b.id)),layout=v?.el?.querySelector('.clockLayout');if(!layout)continue;
   const focus=Math.max(5,Math.min(120,Number(b.payload?.focus_minutes)||25))*60,rest=Math.max(1,Math.min(60,Number(b.payload?.break_minutes)||5))*60,cycle=focus+rest,pos=daySec%cycle,work=pos<focus;
   const phaseElapsed=work?pos:pos-focus,phaseLength=work?focus:rest,remaining=Math.max(0,phaseLength-phaseElapsed);
   const remM=Math.floor(remaining/60),remS=Math.floor(remaining%60),massAngle=Math.max(0,Math.min(360,remaining/Math.max(1,phaseLength)*360));
   const hour=layout.querySelector('.clockHour'),minute=layout.querySelector('.clockMinute'),second=layout.querySelector('.clockSecond'),mass=layout.querySelector('.timeMass');
   const name=layout.querySelector('.phaseName'),left=layout.querySelector('.phaseRemaining'),hint=layout.querySelector('.phaseHint'),wall=layout.querySelector('.wallTimeBig');
   if(hour)hour.style.transform='translateX(-50%) rotate('+hh+'deg)';
   if(minute)minute.style.transform='translateX(-50%) rotate('+mm+'deg)';
   if(second)second.style.transform='translateX(-50%) rotate('+ss+'deg)';
   if(mass)mass.style.background='conic-gradient(from -90deg,#ff3b30 0deg '+massAngle+'deg,transparent '+massAngle+'deg 360deg)';
   if(wall)wall.textContent=timeText;
   if(name)name.textContent=work?'FOCO':'RECREO';
   if(left)left.textContent=String(remM).padStart(2,'0')+':'+String(remS).padStart(2,'0');
   if(hint)hint.textContent=work?('foco '+Math.round(focus/60)+' min'):('recreo '+Math.round(rest/60)+' min');
 }
}
function mediaTimeLeft(sec){
 sec=Math.max(0,Math.ceil(Number(sec)||0));const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),ss=sec%60;
 return h?('-'+h+':'+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')):('-'+m+':'+String(ss).padStart(2,'0'))
}
function updateProgress(){
 for(const v of views.values()){
  if(!['youtube','news'].includes(v.kind)||!v.progressFill)continue;
  let current=0,duration=0;
  try{current=v.fallbackPlayer?Number(v.fallbackPlayer.getCurrentTime?.()||0):Number(v.video?.currentTime||0);duration=v.fallbackPlayer?Number(v.fallbackPlayer.getDuration?.()||0):Number(v.video?.duration||v.streamDuration||0)}catch{}
  const pct=duration>0?Math.max(0,Math.min(100,current/duration*100)):0;
  v.progressFill.style.width=pct+'%';
  if(v.remaining)v.remaining.textContent=duration>0?mediaTimeLeft(duration-current):'--:--';
  if(v.kind==='news'&&duration>1&&current>=duration-.8&&!v.autoAdvanceFired){
    v.autoAdvanceFired=true;
    advanceNews(v.block,v)
  }
 }
}
function youtubeViews(){return active().filter(b=>b.kind==='youtube').map(b=>views.get(String(b.id))).filter(Boolean)}
function newsViews(){return active().filter(b=>b.kind==='news').map(b=>views.get(String(b.id))).filter(Boolean)}
function mediaViews(){return active().filter(b=>b.kind==='youtube'||b.kind==='news').map(b=>views.get(String(b.id))).filter(Boolean)}
function targets(blockId){if(blockId&&views.has(String(blockId)))return[views.get(String(blockId))];return youtubeViews()}
function playerCommand(cmd,blockId,value){
 for(const v of targets(blockId)){
   if(!['youtube','news'].includes(v.kind)||!v.player)continue;
   try{
    if(cmd==='play'){
      v.userPaused=false;
      if(soundWanted)startDesiredPlayback(v);else v.player.playVideo()
    }else if(cmd==='pause'){
      v.userPaused=true;v.player.pauseVideo()
    }else if(cmd==='toggle'){
      const st=playerStateOf(v);
      if(st===1){v.userPaused=true;v.player.pauseVideo()}
      else{v.userPaused=false;if(soundWanted)startDesiredPlayback(v);else v.player.playVideo()}
    }else if(cmd==='mute'){
      soundWanted=false;persistSoundWanted();
      const wasPlaying=playerStateOf(v)===1;applyMutePreference(v,false,{forcePlay:wasPlaying});hideSoundUnlock()
    }else if(cmd==='unmute'){
      soundWanted=true;persistSoundWanted();
      const wasPlaying=playerStateOf(v)===1||!v.userPaused;
      try{v.player.unMute?.();v.muted=false;if(wasPlaying)v.player.playVideo?.()}catch{}
      if(wasPlaying)watchSoundAttempt(v)
    }else if(cmd==='seek_relative'){
      const cur=Number(v.player.getCurrentTime?.()||0),dur=Number(v.player.getDuration?.()||0),delta=Math.max(-120,Math.min(120,Number(value)||0)),to=Math.max(0,dur>0?Math.min(dur-.1,cur+delta):cur+delta);
      v.player.seekTo(to,true)
    }else if(cmd==='seek_absolute'){
      const dur=Number(v.player.getDuration?.()||0),to=Math.max(0,dur>0?Math.min(dur-.1,Number(value)||0):Number(value)||0);
      v.player.seekTo(to,true)
    }
   }catch{}
 }
}
function widgetCommand(cmd,blockId){
 const v=views.get(String(blockId||''));if(!v||v.kind!=='page')return;
 const frame=v.el?.querySelector('iframe');if(!frame)return;
 try{frame.contentWindow?.postMessage({type:'prometeo:control',action:String(cmd).replace(/^widget_/,''),block_id:String(blockId||'')},'*')}catch{}
}
function replaceBlock(updated){
 const id=String(updated.id);
 blocks=blocks.map(x=>String(x.id)===id?updated:x);
 serverActive=serverActive.map(x=>String(x.id)===id?updated:x)
}
async function advanceYoutube(b,v){
 const id=String(b.id),current=String(b.payload?.video_id||'');
 if(!current||advancing.has(id)||b.payload?.auto_next===false)return;
 advancing.add(id);
 try{
  const d=await api({action:'youtube_advance',block_id:id,video_id:current});
  if(d.advanced&&d.block){
    replaceBlock(d.block);
    ensureView(d.block,true);
    applyGrid(active());
    unlock.classList.remove('show')
  }
 }catch{}
 finally{setTimeout(()=>advancing.delete(id),800)}
}
async function advanceNews(b,v){
 const id=String(b.id),current=String(b.payload?.video_id||'');
 if(!current||advancing.has(id))return;
 advancing.add(id);
 try{
  const d=await api({action:'news_advance',block_id:id,video_id:current});
  if(d.advanced&&d.block){replaceBlock(d.block);ensureView(d.block,true);applyGrid(active());unlock.classList.remove('show')}
 }catch{}
 finally{setTimeout(()=>advancing.delete(id),500)}
}
function refreshPanel(blockId){const b=blocks.find(x=>String(x.id)===String(blockId));if(!b)return;destroyView(blockId);ensureView(b,true);applyGrid(active())}
function hardReload(){location.replace('/prometeo/tv/?fresh='+Date.now()+location.hash)}
function maybeApplyPendingUpdate(){if(updatePending&&youtubeViews().length===0)hardReload()}
async function pollCommands(){
 try{
  const d=await api({action:'commands',after_id:lastCommandId});
  for(const ev of d.events||[]){
   lastCommandId=Math.max(lastCommandId,Number(ev.id)||0);
   if(new Date(ev.created_at).getTime()<pageStarted-1500)continue;
   const x=ev.payload||{},cmd=String(x.command||''),blockId=String(x.block_id||'');
   if(['play','pause','toggle','mute','unmute','seek_relative','seek_absolute'].includes(cmd))playerCommand(cmd,blockId,x.value);
   else if(['widget_previous','widget_next','widget_toggle','widget_reset'].includes(cmd))widgetCommand(cmd,blockId);
   else if(cmd==='refresh_panel')refreshPanel(blockId);
   else if(cmd==='reload_now')hardReload();
   else if(cmd==='reload_when_idle'){updatePending=true;maybeApplyPendingUpdate()}
  }
 }catch{}
}
async function sendState(){
 const act=active(),ys=act.filter(b=>b.kind==='youtube'),media=act.filter(b=>b.kind==='youtube'||b.kind==='news'),playerState={};
 for(const b of media){
  const v=views.get(String(b.id));let state=null,muted=false,time=null,duration=null;
  try{state=v?.player?.getPlayerState?.()??v?.state??null;muted=!!v?.player?.isMuted?.();time=v?.player?.getCurrentTime?.()??null;duration=v?.player?.getDuration?.()??null}catch{}
  playerState[String(b.id)]={state,muted,current_time:time,duration,video_id:b.payload?.video_id||'',stream_source:v?.streamSource||''}
 }
 try{await api({action:'tv_state',build:BUILD,active_ids:act.map(b=>b.id),active_youtube_ids:ys.map(b=>b.id),player_state:playerState,update_pending:updatePending})}catch{}
}
async function loadSchedule(){
 try{
  const d=await api({action:'list'});
  blocks=d.blocks||[];serverActive=d.active_blocks||[];
  status.className='status';syncStage()
 }catch{status.className='status err'}
}
async function checkRuntime(){
 try{
  const r=await fetch(RUNTIME+'?t='+Date.now(),{cache:'no-store'}),d=await r.json();
  if(String(d.tv_build||d.build||BUILD)!==BUILD){location.replace('/prometeo/tv/?v='+encodeURIComponent(String(d.tv_build||d.build||''))+'&fresh='+Date.now()+location.hash)}
 }catch{}
}
unlock.onclick=e=>{e.preventDefault();e.stopPropagation();unlockSoundFromGesture()};
document.addEventListener('pointerdown',()=>{if(!soundGestureUnlocked)unlockSoundFromGesture()},{once:true,capture:true});
document.addEventListener('keydown',()=>{if(!soundGestureUnlocked)unlockSoundFromGesture()},{once:true,capture:true});
setTimeout(()=>{if(!soundGestureUnlocked)showSoundUnlock()},700);
stage.addEventListener('contextmenu',e=>e.preventDefault());
setInterval(()=>{tickClock();updateProgress();syncStage()},250);
setInterval(loadSchedule,700);
setInterval(pollCommands,350);
setInterval(sendState,1000);
setInterval(checkRuntime,15000);
setInterval(()=>api({action:'news_refresh'}).then(loadSchedule).catch(()=>{}),600000);
loadSchedule();pollCommands();sendState();checkRuntime();setTimeout(()=>api({action:'news_refresh'}).then(loadSchedule).catch(()=>{}),4000);
})();
