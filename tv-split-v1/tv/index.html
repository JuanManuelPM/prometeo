<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Canal TV</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
#stage{position:fixed;inset:0;display:grid;background:#000;gap:1px}
#stage.n1{grid-template-columns:1fr;grid-template-rows:1fr}
#stage.n2{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
#stage.n3{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr}
#stage.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.panel{position:relative;overflow:hidden;background:#000;min-width:0;min-height:0}
.panel iframe,.ytHost,.ytHost iframe{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;border:0!important}
.clockPanel{display:grid;place-items:center}
.clockFace{position:relative;display:grid;place-items:center;width:min(68%,68vh);aspect-ratio:1;border:2px solid #fff;border-radius:50%}
.clockTime{font-size:clamp(36px,8vw,150px);font-weight:900;letter-spacing:-.08em;font-variant-numeric:tabular-nums;z-index:2;white-space:nowrap}
.sweep{position:absolute;width:1px;height:48%;background:#fff;top:2%;left:50%;transform-origin:50% 100%;animation:spin 60s linear infinite}.center{position:absolute;width:8px;height:8px;background:#fff;border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
.unlock{position:fixed;z-index:50;inset:0;display:none;place-items:center;border:0;background:#000;color:#fff;font-size:14px;font-weight:900;letter-spacing:.12em}.unlock.show{display:grid}
.status{position:fixed;right:8px;top:8px;z-index:60;width:5px;height:5px;border-radius:50%;background:#333;opacity:.35}.status.err{background:#fff}
@media(max-aspect-ratio:1/1){#stage.n2{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main id="stage" class="n1"></main>
<button id="unlock" class="unlock">TOCAR PARA ACTIVAR</button>
<div id="status" class="status"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
(()=>{
'use strict';
const API='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/tv-schedule-v1';
const p=new URLSearchParams(location.hash.slice(1));
const room={code:p.get('room')||'',token:p.get('t')||'',role:'tv'};
const stage=document.getElementById('stage'),unlock=document.getElementById('unlock'),status=document.getElementById('status');
let blocks=[],renderKey='',players=[],ytReady=false;
window.onYouTubeIframeAPIReady=()=>{ytReady=true;renderActive(true)};

function ba(){const ps=new Intl.DateTimeFormat('en-GB',{timeZone:'America/Argentina/Buenos_Aires',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const get=t=>Number(ps.find(x=>x.type===t)?.value||0);return{h:get('hour'),m:get('minute')}}
function nowMin(){const n=ba();return n.h*60+n.m}
function activeBlocks(){const n=nowMin();return blocks.filter(b=>b.enabled!==false&&n>=b.start_minute&&n<b.end_minute).sort((a,b)=>a.start_minute-b.start_minute||String(a.id).localeCompare(String(b.id)))}
async function api(){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'list',code:room.code,role:'tv',token:room.token}),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'SCHEDULE');return d}
function destroyPlayers(){for(const p of players){try{p.destroy()}catch{}}players=[]}
function clockMarkup(){return '<div class="clockFace"><div class="clockTime">00:00</div><div class="sweep"></div><div class="center"></div></div>'}
function makePanel(b,i){
  const panel=document.createElement('section');panel.className='panel';
  if(b.kind==='black')return panel;
  if(b.kind==='clock'){panel.classList.add('clockPanel');panel.innerHTML=clockMarkup();return panel}
  if(b.kind==='page'){const f=document.createElement('iframe');f.src=b.payload?.url||'about:blank';f.allow='autoplay; fullscreen; picture-in-picture';panel.appendChild(f);return panel}
  if(b.kind==='youtube'){
    const host=document.createElement('div');host.className='ytHost';host.id='yt-'+i+'-'+String(b.id).replace(/[^a-z0-9_-]/gi,'');panel.appendChild(host);
    if(ytReady&&window.YT?.Player){
      queueMicrotask(()=>{try{
        const player=new YT.Player(host.id,{videoId:b.payload?.video_id||'',playerVars:{autoplay:1,controls:0,playsinline:1,rel:0,fs:0,iv_load_policy:3,disablekb:1},events:{
          onReady:e=>{try{e.target.playVideo()}catch{}},
          onAutoplayBlocked:()=>unlock.classList.add('show')
        }});
        players.push(player);
      }catch{}});
    }
    return panel;
  }
  return panel;
}
function renderActive(force=false){
  let act=activeBlocks();
  const key=act.map(b=>b.id+':'+b.kind).join('|');
  if(!force&&key===renderKey){tickClock();return}
  renderKey=key;destroyPlayers();stage.innerHTML='';
  if(!act.length){stage.className='n1';stage.appendChild(document.createElement('section')).className='panel';return}
  // Up to four concurrent surfaces. More remain scheduled but only first four are visible.
  act=act.slice(0,4);
  stage.className='n'+act.length;
  act.forEach((b,i)=>stage.appendChild(makePanel(b,i)));
  tickClock();
}
function tickClock(){const n=ba(),t=String(n.h).padStart(2,'0')+':'+String(n.m).padStart(2,'0');document.querySelectorAll('.clockTime').forEach(el=>el.textContent=t)}
async function load(){try{const d=await api();blocks=d.blocks||[];status.className='status';renderActive()}catch{status.className='status err'}}
unlock.onclick=async()=>{unlock.classList.remove('show');try{await document.documentElement.requestFullscreen?.()}catch{}for(const p of players){try{p.playVideo()}catch{}}};
document.addEventListener('click',async()=>{try{await document.documentElement.requestFullscreen?.()}catch{}},{once:true});
setInterval(()=>{tickClock();renderActive()},1000);
load();setInterval(load,8000);
})();
</script>
</body>
</html>
