<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090909">
<title>TV · horario</title>
<style>
:root{--bg:#090909;--fg:#f4f3ee;--muted:#83837d;--line:#2c2c28;--half:#191917;--now:#ff3b30}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit}
.app{min-height:100dvh;background:var(--bg)}
.top{position:sticky;top:0;z-index:80;background:#090909f2;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topInner{max-width:760px;margin:auto;padding:8px 10px}
.mainRow{height:40px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.addBtn{height:34px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);padding:0 12px;font-size:10px;font-weight:900;letter-spacing:.08em}
.nowTop{font:900 13px ui-monospace,SFMono-Regular,Menlo,monospace}
.room{font:700 7px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);margin-top:1px;text-align:right}
.palette{display:grid;grid-template-rows:0fr;transition:grid-template-rows .16s ease}
.palette.open{grid-template-rows:1fr}
.paletteInner{overflow:hidden}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding-top:0;opacity:0;transform:translateY(-5px);transition:.16s ease}
.palette.open .tools{padding-top:7px;opacity:1;transform:none}
.tool{height:48px;border:1px solid #3d3d39;background:#11110f;padding:0 8px;text-align:left}
.tool strong{display:block;font-size:10px;font-weight:900}.tool span{display:block;font-size:8px;color:var(--muted);margin-top:3px}
.tool:active{background:var(--fg);color:var(--bg)}.tool:active span{color:#333}
.viewport{max-width:760px;margin:auto;position:relative;height:calc(100dvh - 57px);overflow:auto;overscroll-behavior:contain;scrollbar-width:none}
.viewport::-webkit-scrollbar{display:none}
.day{position:relative;width:100%}
.hour{position:absolute;left:56px;right:0;height:1px;background:var(--line);z-index:2}
.hourLabel{position:absolute;left:-54px;top:-12px;width:48px;text-align:right;font:900 13px ui-monospace,SFMono-Regular,Menlo,monospace;color:#f4f3ee;background:var(--bg);padding-right:7px;z-index:20}
.half{position:absolute;left:56px;right:0;height:1px;background:var(--half);z-index:1}
.halfLabel{position:absolute;left:7px;top:-8px;font:800 8px ui-monospace,SFMono-Regular,Menlo,monospace;color:#55554f;background:var(--bg);padding:0 3px}
.layer{position:absolute;inset:0;z-index:5}
.block{position:absolute;left:64px;right:8px;min-height:28px;background:var(--fg);color:var(--bg);border:0;overflow:visible;user-select:none;touch-action:pan-y;transition:top .12s cubic-bezier(.2,.8,.2,1),height .12s cubic-bezier(.2,.8,.2,1),box-shadow .12s ease,outline-color .12s ease}
.block.selected{outline:2px solid var(--now);outline-offset:2px;touch-action:none}.block.stretching{outline-style:dashed;box-shadow:0 0 0 3px #ff3b3033}
.block.fresh{animation:pulseEdge .72s ease-in-out infinite}
.block.conflict{background:#282824;color:#fff;outline:2px dashed var(--now);outline-offset:2px}
@keyframes pulseEdge{0%,100%{box-shadow:0 0 0 0 #ff3b3000}50%{box-shadow:0 0 0 3px #ff3b30}}
.blockBody{position:absolute;inset:0;padding:6px 30px 6px 8px;text-align:left;overflow:hidden;background:var(--fg)}
.kind{font-size:7px;font-weight:900;letter-spacing:.14em;opacity:.48}
.name{font-size:14px;font-weight:900;line-height:1;letter-spacing:-.03em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font:800 8px ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.58;margin-top:4px}
.moveMark{display:none;position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:19px;font-weight:900;color:var(--bg);opacity:1;pointer-events:none}
.block.selected .moveMark{display:block}
.handle{display:none;position:absolute;left:-10px;right:-10px;height:34px;z-index:12;touch-action:none;background:transparent}
.block.selected .handle{display:block}
.handle.top{top:-18px}.handle.bottom{bottom:-18px}
.handle:after{content:'';position:absolute;left:50%;transform:translateX(-50%);width:28px;height:4px;background:var(--now);border-radius:99px}
.handle.top:after{bottom:13px}.handle.bottom:after{top:13px}
.nowLine{position:absolute;left:54px;right:0;height:2px;background:var(--now);z-index:40;pointer-events:none}
.nowDot{position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.nowLabel{position:absolute;left:-50px;top:-13px;background:var(--now);color:#fff;padding:2px 4px;font:900 8px ui-monospace,monospace}
.dragTime{position:fixed;z-index:125;pointer-events:none;background:var(--now);color:#fff;padding:4px 6px;font:900 10px ui-monospace,monospace;display:none}
.dragTime.show{display:block}
.toast{position:fixed;z-index:140;left:50%;bottom:70px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 12px;font-size:9px;font-weight:900;display:none;white-space:nowrap}.toast.show{display:block}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="topInner">
      <div class="mainRow">
        <button id="addBtn" class="addBtn">+ AGREGAR</button>
        <div><div id="nowTop" class="nowTop">--:--</div><div id="room" class="room">—</div></div>
      </div>
      <div id="palette" class="palette"><div class="paletteInner"><div class="tools">
        <button class="tool" data-kind="youtube"><strong>YOUTUBE</strong><span>Veritasium · ejemplo</span></button>
        <button class="tool" data-kind="clock"><strong>RELOJ</strong><span>reloj animado</span></button>
        <button class="tool" data-kind="page"><strong>PÁGINA</strong><span>Calendario · ejemplo</span></button>
        <button class="tool" data-kind="black"><strong>NEGRO</strong><span>pantalla vacía</span></button>
      </div></div></div>
    </div>
  </header>

  <main id="viewport" class="viewport">
    <section id="day" class="day">
      <div id="grid"></div>
      <div id="layer" class="layer"></div>
      <div id="nowLine" class="nowLine"><span class="nowDot"></span><span id="nowLabel" class="nowLabel">--:--</span></div>
    </section>
  </main>
</div>

<div id="dragTime" class="dragTime">--:--</div>
<div id="toast" class="toast"></div>

<script>
(()=>{
'use strict';
const API='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/tv-schedule-v1';
const params=new URLSearchParams(location.hash.slice(1));
const room={code:params.get('room')||'',token:params.get('t')||'',role:'remote'};
const client='timeline-v4-'+Math.random().toString(36).slice(2,9);
const $=id=>document.getElementById(id);
const viewport=$('viewport'),day=$('day'),layer=$('layer'),palette=$('palette'),dragTime=$('dragTime');
const labels={youtube:'YOUTUBE',clock:'RELOJ',page:'PÁGINA',black:'NEGRO'};
const samples={
  youtube:{title:'VERITASIUM',payload:{url:'https://www.youtube.com/watch?v=J1WoNuemKOg'}},
  page:{title:'CALENDARIO',payload:{url:'https://juanmanuelpm.github.io/prometeo/experiments/tv-split-v1-sample-calendar.html'}},
  clock:{title:'RELOJ',payload:{}},
  black:{title:'NEGRO',payload:{}}
};
let blocks=[],selected=null,freshId=null,ppm=1,loaded=false,lastHaptic=null;
const dirty=new Map();
const cacheKey='tv.program.cache.'+room.code;

function measure(){ppm=Math.max(.58,viewport.clientHeight/(12*60));day.style.height=(1440*ppm)+'px'}
function y(m){return Number(m)*ppm}
function floor30(m){return Math.max(0,Math.min(1410,Math.floor(m/30)*30))}
function fmt(m){if(m>=1440)return'24:00';m=Math.max(0,Math.min(1439,Number(m)||0));return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ba(){const ps=new Intl.DateTimeFormat('en-GB',{timeZone:'America/Argentina/Buenos_Aires',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const get=t=>Number(ps.find(x=>x.type===t)?.value||0);return{h:get('hour'),m:get('minute')}}
function nowMin(){const n=ba();return n.h*60+n.m}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),1300)}
function cache(){try{localStorage.setItem(cacheKey,JSON.stringify(blocks.filter(b=>!String(b.id).startsWith('tmp-'))))}catch{}}
async function api(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:room.code,role:'remote',token:room.token,client_id:client,...body}),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'ERROR');return d}
function localOverlap(b){return blocks.some(x=>x.id!==b.id&&b.start_minute<x.end_minute&&b.end_minute>x.start_minute)}
function updateBlockLocal(id,patch){const i=blocks.findIndex(b=>b.id===id);if(i<0)return null;blocks[i]={...blocks[i],...patch};renderBlocks();return blocks[i]}
function replaceId(oldId,newBlock){
  const i=blocks.findIndex(b=>b.id===oldId);if(i<0)return;
  blocks[i]={...blocks[i],...newBlock};
  if(selected===oldId)selected=newBlock.id;
  if(freshId===oldId)freshId=newBlock.id;
  dirty.delete(oldId);
  renderBlocks();cache();
}
function scheduleWrite(block){
  if(!block||localOverlap(block))return;
  const key=block.id;
  const token=(dirty.get(key)||0)+1;dirty.set(key,token);
  const isTemp=String(key).startsWith('tmp-');
  queueMicrotask(async()=>{
    try{
      const d=await api({action:'save',id:isTemp?'':key,title:block.title||labels[block.kind],kind:block.kind,start_minute:block.start_minute,end_minute:block.end_minute,payload:block.payload||{}});
      if(dirty.get(key)!==token)return;
      if(isTemp)replaceId(key,d.block);
      else{dirty.delete(key);cache()}
    }catch(e){
      if(dirty.get(key)!==token)return;
      dirty.delete(key);
      if(e.message==='TIME_OVERLAP'){renderBlocks();toast('Ese espacio está ocupado. Movelo a otro horario.')}
      else toast(String(e.message||e));
    }
  });
}
async function syncServer({initial=false}={}){
  try{
    const d=await api({action:'list'});
    if(dirty.size===0){
      blocks=d.blocks||[];cache();renderBlocks();
    }
    if(initial&&!loaded){loaded=true;requestAnimationFrame(scrollAroundNow)}
  }catch(e){if(initial)toast(String(e.message||e))}
}
function grid(){
  const g=$('grid');g.innerHTML='';
  for(let h=0;h<=24;h++){
    const a=document.createElement('div');a.className='hour';a.style.top=y(h*60)+'px';
    if(h<24)a.innerHTML='<span class="hourLabel">'+String(h).padStart(2,'0')+':00</span>';g.appendChild(a);
    if(h<24){const b=document.createElement('div');b.className='half';b.style.top=y(h*60+30)+'px';b.innerHTML='<span class="halfLabel">:30</span>';g.appendChild(b)}
  }
}
function updateNow(){const n=ba(),m=n.h*60+n.m;$('nowTop').textContent=fmt(m);$('nowLabel').textContent=fmt(m);$('nowLine').style.top=y(m)+'px'}
function scrollAroundNow(){viewport.scrollTop=Math.max(0,y(nowMin()-5.5*60))}
function select(id){selected=id;renderBlocks()}
function blockEl(b){
  const conflict=localOverlap(b),isSelected=selected===b.id;
  const el=document.createElement('div');el.className='block'+(isSelected?' selected':'')+(freshId===b.id?' fresh':'')+(conflict?' conflict':'');el.dataset.id=b.id;
  el.style.top=y(b.start_minute)+'px';el.style.height=Math.max(28,y(b.end_minute-b.start_minute))+'px';
  el.innerHTML='<div class="handle top" aria-label="Cambiar inicio"></div><div class="blockBody"><div class="kind">'+labels[b.kind]+'</div><div class="name">'+esc(b.title||labels[b.kind])+'</div><div class="time">'+fmt(b.start_minute)+' — '+fmt(b.end_minute)+'</div></div><div class="moveMark">↕</div><div class="handle bottom" aria-label="Cambiar fin"></div>';
  if(isSelected){
    el.addEventListener('pointerdown',e=>beginMoveGesture(e,b,el));
    el.querySelector('.handle.top').addEventListener('pointerdown',e=>beginResizeHandle(e,b,el,'start'));
    el.querySelector('.handle.bottom').addEventListener('pointerdown',e=>beginResizeHandle(e,b,el,'end'));
  }else el.addEventListener('pointerdown',e=>armSelectionTap(e,b));
  return el
}
function renderBlocks(){layer.innerHTML='';for(const b of blocks.slice().sort((a,b)=>a.start_minute-b.start_minute))layer.appendChild(blockEl(b))}
day.addEventListener('click',()=>select(null));

function showDragTime(clientX,clientY,label,m){dragTime.textContent=(label?label+' ':'')+fmt(m);dragTime.style.left=Math.min(window.innerWidth-94,clientX+12)+'px';dragTime.style.top=Math.max(8,clientY-22)+'px';dragTime.classList.add('show')}
function vibrate(slot){if(slot===lastHaptic)return;lastHaptic=slot;try{navigator.vibrate?.(8)}catch{}}
function armSelectionTap(e,b){
  if(e.button!==undefined&&e.button!==0)return;
  const sx=e.clientX,sy=e.clientY,pid=e.pointerId;
  let cancelled=false,selectedByHold=false;
  const timer=setTimeout(()=>{
    if(cancelled)return;
    selectedByHold=true;freshId=null;select(b.id);vibrate('select-'+b.id);
  },460);
  const move=ev=>{
    if(ev.pointerId!==pid)return;
    if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>9){
      cancelled=true;clearTimeout(timer);
    }
  };
  const finish=ev=>{
    clearTimeout(timer);
    window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',finish);window.removeEventListener('pointercancel',cancel);
    // Ordinary taps intentionally do nothing.
    if(selectedByHold)ev.stopPropagation();
  };
  const cancel=()=>{cancelled=true;clearTimeout(timer);window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',finish);window.removeEventListener('pointercancel',cancel)};
  window.addEventListener('pointermove',move,{passive:true});
  window.addEventListener('pointerup',finish,{once:true});
  window.addEventListener('pointercancel',cancel,{once:true});
}
function beginMoveGesture(e,b,el){
  if(e.button!==undefined&&e.button!==0)return;
  if(e.target.closest('.handle'))return;
  e.preventDefault();e.stopPropagation();
  const startY=e.clientY,baseStart=b.start_minute,dur=b.end_minute-b.start_minute;
  const threshold=Math.max(34,y(30)*1.18);
  let current=baseStart,lastStep=0,changed=false;
  const move=ev=>{
    ev.preventDefault();
    const dy=ev.clientY-startY;
    const step=dy<0?Math.ceil(dy/threshold):Math.floor(dy/threshold);
    if(step===lastStep)return;
    lastStep=step;
    let ns=baseStart+step*30;ns=Math.max(0,Math.min(1440-dur,ns));
    if(ns===current)return;
    current=ns;changed=true;
    updateBlockLocal(b.id,{start_minute:current,end_minute:current+dur});
    showDragTime(ev.clientX,ev.clientY,'',current);vibrate('m'+current);
  };
  const finish=()=>{
    window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',finish);window.removeEventListener('pointercancel',cancel);
    dragTime.classList.remove('show');lastHaptic=null;
    const latest=blocks.find(x=>x.id===b.id);
    if(changed&&latest){freshId=null;renderBlocks();scheduleWrite(latest)}
  };
  const cancel=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',finish);window.removeEventListener('pointercancel',cancel);dragTime.classList.remove('show');lastHaptic=null;renderBlocks()};
  window.addEventListener('pointermove',move,{passive:false});
  window.addEventListener('pointerup',finish,{once:true});
  window.addEventListener('pointercancel',cancel,{once:true});
}
function beginResizeHandle(e,b,el,edge){
  if(e.button!==undefined&&e.button!==0)return;
  e.preventDefault();e.stopPropagation();
  const startY=e.clientY,baseStart=b.start_minute,baseEnd=b.end_minute;
  const anchor=edge==='start'?baseEnd:baseStart;
  const baseDragged=edge==='start'?baseStart:baseEnd;
  const threshold=Math.max(34,y(30)*1.18);
  let dragged=baseDragged,lastStep=0,changed=false,activeEdge=edge;
  el.classList.add('stretching');

  const applyDragged=(value,clientX,clientY)=>{
    let v=Math.max(0,Math.min(1440,value));
    // Keep at least 30 minutes. Crossing the opposite endpoint flips which
    // endpoint is being edited, instead of stopping the gesture.
    if(v===anchor)v += (activeEdge==='start'?-30:30);
    v=Math.max(0,Math.min(1440,v));
    let ns,ne;
    if(v<anchor){ns=v;ne=anchor;activeEdge='start'}
    else{ns=anchor;ne=v;activeEdge='end'}
    if(ne-ns<30){
      if(activeEdge==='start')ns=Math.max(0,ne-30);
      else ne=Math.min(1440,ns+30);
    }
    dragged=v;changed=true;
    updateBlockLocal(b.id,{start_minute:ns,end_minute:ne});
    showDragTime(clientX,clientY,activeEdge==='start'?'INICIO':'FIN',activeEdge==='start'?ns:ne);
    vibrate((activeEdge==='start'?'s':'e')+(activeEdge==='start'?ns:ne));
  };

  showDragTime(e.clientX,e.clientY,edge==='start'?'INICIO':'FIN',baseDragged);

  const move=ev=>{
    ev.preventDefault();
    const dy=ev.clientY-startY;
    const step=dy<0?Math.ceil(dy/threshold):Math.floor(dy/threshold);
    if(step===lastStep)return;
    lastStep=step;
    applyDragged(baseDragged+step*30,ev.clientX,ev.clientY);
  };
  const finish=()=>{
    window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',finish);window.removeEventListener('pointercancel',cancel);
    dragTime.classList.remove('show');lastHaptic=null;el.classList.remove('stretching');
    const latest=blocks.find(x=>x.id===b.id);
    if(changed&&latest){freshId=null;renderBlocks();scheduleWrite(latest)}
  };
  const cancel=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',finish);window.removeEventListener('pointercancel',cancel);dragTime.classList.remove('show');lastHaptic=null;el.classList.remove('stretching');renderBlocks()};
  window.addEventListener('pointermove',move,{passive:false});
  window.addEventListener('pointerup',finish,{once:true});
  window.addEventListener('pointercancel',cancel,{once:true});
}
function addSample(kind){
  palette.classList.remove('open');
  const dur=(kind==='youtube'||kind==='page')?60:30;
  const start=floor30(nowMin()),s=samples[kind];
  const id='tmp-'+Date.now().toString(36);
  const b={id,title:s.title,kind,start_minute:start,end_minute:start+dur,payload:s.payload,enabled:true};
  blocks.push(b);selected=id;freshId=id;renderBlocks();
  requestAnimationFrame(()=>viewport.scrollTo({top:Math.max(0,y(start)-viewport.clientHeight*.43),behavior:'smooth'}));
  if(!localOverlap(b))scheduleWrite(b);
  setTimeout(()=>{if(freshId===id){freshId=null;renderBlocks()}},8000);
}
$('addBtn').onclick=()=>palette.classList.toggle('open');
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>addSample(b.dataset.kind));

$('room').textContent=room.code||'sin sala';
try{const cached=JSON.parse(localStorage.getItem(cacheKey)||'[]');if(Array.isArray(cached)&&cached.length){blocks=cached;loaded=true}}catch{}
function layout(){measure();grid();renderBlocks();updateNow()}
layout();
requestAnimationFrame(()=>{if(loaded)scrollAroundNow();syncServer({initial:true})});
setInterval(updateNow,15000);
setInterval(()=>{if(dirty.size===0)syncServer()},30000);
window.addEventListener('resize',layout);
})();
</script>
</body>
</html>
