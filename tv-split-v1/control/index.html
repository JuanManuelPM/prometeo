<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>TV · horario</title>
<style>
:root{--bg:#050505;--fg:#f5f3ec;--muted:#6f6f69;--grid:#1d1d1a;--grid2:#10100f;--red:#ff3b30}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif}
button{font:inherit;color:inherit}
.app{height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.top{flex:0 0 auto;z-index:60;background:var(--bg);border-bottom:1px solid var(--grid)}
.topbar{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
.add{width:34px;height:34px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);font-size:22px;line-height:1;font-weight:400;padding:0}
.now{font:900 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
.palette{display:grid;grid-template-rows:0fr;transition:grid-template-rows .14s ease}
.palette.open{grid-template-rows:1fr}
.paletteInner{overflow:hidden}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:0 8px;opacity:0;transform:translateY(-4px);transition:.14s ease}
.palette.open .tools{padding-bottom:8px;opacity:1;transform:none}
.tool{height:42px;border:1px solid #2d2d29;background:#0a0a09;padding:0 5px;text-align:center;font-size:8px;font-weight:900;letter-spacing:.04em}
.tool span{display:block;margin-top:2px;color:var(--muted);font-size:6px;font-weight:700;letter-spacing:0}
.viewport{position:relative;flex:1 1 auto;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior-y:none}
.viewport::-webkit-scrollbar{display:none}
.timeline{position:relative;width:100%}
.gridLayer{position:absolute;inset:0}
.hourLine,.halfLine{position:absolute;left:48px;right:0;height:1px;background:var(--grid)}
.halfLine{background:var(--grid2)}
.hourLabel{position:absolute;left:-42px;top:-6px;width:32px;text-align:right;background:var(--bg);font:900 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#d8d6ce;padding-right:2px;z-index:40}
.eventLayer{position:absolute;left:52px;right:6px;top:0;bottom:0}
.block{position:absolute;min-height:18px;background:#151513;color:var(--fg);border:0;overflow:visible;user-select:none;touch-action:pan-y;transition:top .10s ease,height .10s ease,left .08s linear,width .08s linear;box-shadow:inset 1px 0 0 #2a2a26,inset -1px 0 0 #2a2a26}
.block.firstSlice{border-top:1px solid #2a2a26}
.block.lastSlice{border-bottom:1px solid #2a2a26}
.block.splitSlice{box-shadow:inset 1px 0 0 #2a2a26,inset -1px 0 0 #2a2a26}
.blockBody{position:absolute;inset:0;padding:5px 8px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;background:transparent}
.kind{display:none}
.name{font-size:11px;font-weight:900;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}
.time{font:700 7px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#85857e;margin-top:4px;white-space:nowrap}
.block.halfhour .blockBody{padding:0 7px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center}
.block.halfhour .name{font-size:8px;margin:0}
.block.halfhour .time{font-size:6px;margin:0;color:#9b9a93}
.block.selected{outline:0;z-index:30;touch-action:none;box-shadow:inset 2px 0 0 var(--red),inset -2px 0 0 var(--red)}
.block.selected.firstSlice{border-top:2px solid var(--red)}
.block.selected.lastSlice{border-bottom:2px solid var(--red)}
.handle{display:none;position:absolute;left:14%;right:14%;height:30px;z-index:40;touch-action:none;background:transparent;border:0;padding:0}
.block.selected.firstSlice .handle.top,.block.selected.lastSlice .handle.bottom{display:block}
.handle.top{top:-19px}.handle.bottom{bottom:-19px}
.handle:after{content:'';position:absolute;left:50%;transform:translateX(-50%);width:32px;height:2px;background:var(--red);border-radius:2px}
.handle.top:after{bottom:2px}.handle.bottom:after{top:2px}
.splitGrip{position:absolute;width:26px;transform:translateX(-50%);z-index:22;touch-action:none;background:transparent}
.splitGrip:after{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:#4b4b46}
.splitGrip.active:after{width:2px;background:var(--red)}
.nowLine{position:absolute;left:48px;right:0;height:2px;background:var(--red);z-index:50;pointer-events:none}
.nowDot{position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.dragTime{position:fixed;z-index:100;display:none;pointer-events:none;background:var(--red);color:#fff;padding:3px 5px;font:900 9px ui-monospace,monospace}
.dragTime.show{display:block}
.toast{position:fixed;z-index:120;left:50%;bottom:18px;transform:translateX(-50%);display:none;background:var(--fg);color:var(--bg);padding:8px 10px;font-size:8px;font-weight:900}.toast.show{display:block}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="topbar">
      <button id="add" class="add" aria-label="Agregar">+</button>
      <div id="now" class="now">--:--</div>
    </div>
    <div id="palette" class="palette"><div class="paletteInner"><div class="tools">
      <button class="tool" data-kind="youtube">YOUTUBE<span>Veritasium</span></button>
      <button class="tool" data-kind="clock">RELOJ<span>25 / 5</span></button>
      <button class="tool" data-kind="page">PÁGINA<span>Calendario</span></button>
      <button class="tool" data-kind="black">NEGRO<span>vacío</span></button>
    </div></div></div>
  </header>

  <main id="viewport" class="viewport">
    <section id="timeline" class="timeline">
      <div id="gridLayer" class="gridLayer"></div>
      <div id="eventLayer" class="eventLayer"></div>
      <div id="now0" class="nowLine"><span class="nowDot"></span></div>
      <div id="now1" class="nowLine"><span class="nowDot"></span></div>
      <div id="now2" class="nowLine"><span class="nowDot"></span></div>
    </section>
  </main>
</div>
<div id="dragTime" class="dragTime">--:--</div>
<div id="toast" class="toast"></div>
<script>
(()=>{
'use strict';
const API='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/tv-schedule-v1';
const p=new URLSearchParams(location.hash.slice(1));
const room={code:p.get('room')||'',token:p.get('t')||'',role:'remote'};
const client='loop-timeline-'+Math.random().toString(36).slice(2,9);
const viewport=document.getElementById('viewport');
const timeline=document.getElementById('timeline');
const gridLayer=document.getElementById('gridLayer');
const eventLayer=document.getElementById('eventLayer');
const palette=document.getElementById('palette');
const dragTime=document.getElementById('dragTime');
const labels={youtube:'YOUTUBE',clock:'RELOJ',page:'PÁGINA',black:'NEGRO'};
const samples={
 youtube:{title:'VERITASIUM',payload:{url:'https://www.youtube.com/watch?v=J1WoNuemKOg'}},
 clock:{title:'RELOJ 25/5',payload:{style:'focus25-5'}},
 page:{title:'CALENDARIO',payload:{url:'https://juanmanuelpm.github.io/prometeo/experiments/tv-split-v1-sample-calendar.html'}},
 black:{title:'NEGRO',payload:{}}
};
let blocks=[],layouts=[],selected=null,ppm=.7,cycleH=1000,loaded=false,lastHaptic=null,rendering=false;
const dirty=new Map();
const cacheKey='tv.program.loop.v18.'+room.code;

function ba(){
 const ps=new Intl.DateTimeFormat('en-GB',{timeZone:'America/Argentina/Buenos_Aires',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
 const get=t=>Number(ps.find(x=>x.type===t)?.value||0);return{h:get('hour'),m:get('minute')}
}
function nowMin(){const n=ba();return n.h*60+n.m}
function fmt(m){m=((Number(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1200)}
function cache(){try{localStorage.setItem(cacheKey,JSON.stringify({blocks:blocks.filter(b=>!String(b.id).startsWith('tmp-')),layouts}))}catch{}}
async function api(body){
 const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:room.code,role:'remote',token:room.token,client_id:client,...body}),cache:'no-store'});
 const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'ERROR');return d
}
function measure(){
 ppm=Math.max(.52,viewport.clientHeight/(12*60));
 cycleH=1440*ppm;
 timeline.style.height=(cycleH*3)+'px';
}
function y(absMin){return absMin*ppm}
function grid(){
 gridLayer.innerHTML='';
 for(let cycle=0;cycle<3;cycle++){
   const base=cycle*1440;
   for(let h=0;h<24;h++){
     const line=document.createElement('div');line.className='hourLine';line.style.top=y(base+h*60)+'px';
     line.innerHTML='<span class="hourLabel">'+String(h).padStart(2,'0')+'</span>';gridLayer.appendChild(line);
     const half=document.createElement('div');half.className='halfLine';half.style.top=y(base+h*60+30)+'px';gridLayer.appendChild(half);
   }
 }
}
function updateNow(){
 const m=nowMin();document.getElementById('now').textContent=fmt(m);
 for(let i=0;i<3;i++)document.getElementById('now'+i).style.top=y(i*1440+m)+'px';
}
function recenter(){
 const top=viewport.scrollTop;
 if(top<cycleH*.55){viewport.scrollTop=top+cycleH}
 else if(top>cycleH*1.55){viewport.scrollTop=top-cycleH}
}
function scrollInitial(){viewport.scrollTop=Math.max(0,cycleH+y(nowMin()-5.5*60))}
viewport.addEventListener('scroll',()=>{if(!rendering)recenter()},{passive:true});

function pairIds(a,b){return [String(a),String(b)].sort()}
function layoutFor(a,b){
 const [x,y]=pairIds(a,b);
 return layouts.find(l=>String(l.block_a)===x&&String(l.block_b)===y)||{block_a:x,block_b:y,ratio:.5}
}
function setLayoutLocal(a,b,ratio){
 const [x,y]=pairIds(a,b),r=Math.max(.12,Math.min(.88,ratio));
 const i=layouts.findIndex(l=>String(l.block_a)===x&&String(l.block_b)===y);
 const row={block_a:x,block_b:y,ratio:r,updated_at:new Date().toISOString()};
 if(i>=0)layouts[i]={...layouts[i],...row};else layouts.push(row);return row
}
let layoutTimer=0,layoutPending=null;
function queueLayout(row,immediate=false){
 if(String(row.block_a).startsWith('tmp-')||String(row.block_b).startsWith('tmp-'))return;
 layoutPending=row;clearTimeout(layoutTimer);
 layoutTimer=setTimeout(async()=>{const x=layoutPending;layoutPending=null;if(!x)return;try{await api({action:'layout_save',block_a:x.block_a,block_b:x.block_b,ratio:x.ratio});cache()}catch(e){toast(String(e.message||e))}},immediate?0:120)
}
function segments(){
 const cuts=[...new Set(blocks.flatMap(b=>[Number(b.start_minute),Number(b.end_minute)]))].sort((a,b)=>a-b);
 const out=[];
 for(let i=0;i<cuts.length-1;i++){
   const start=cuts[i],end=cuts[i+1];if(end<=start)continue;
   const active=blocks.filter(b=>b.enabled!==false&&b.start_minute<=start&&b.end_minute>=end);
   if(!active.length)continue;
   if(active.length===1){out.push({start,end,items:[{b:active[0],left:0,width:1}],pair:null});continue}
   if(active.length===2){
     const [x,y]=pairIds(active[0].id,active[1].id),l=layoutFor(x,y);
     const bx=active.find(b=>String(b.id)===x),by=active.find(b=>String(b.id)===y);
     out.push({start,end,items:[{b:bx,left:0,width:l.ratio},{b:by,left:l.ratio,width:1-l.ratio}],pair:{a:x,b:y,ratio:l.ratio}});continue
   }
   const sorted=active.slice().sort((a,b)=>String(a.id).localeCompare(String(b.id))),w=1/sorted.length;
   out.push({start,end,items:sorted.map((b,i)=>({b,left:i*w,width:w})),pair:null});
 }
 return out
}
function select(id){selected=id;renderBlocks()}
function armSelection(e,b){
 if(e.button!==undefined&&e.button!==0)return;
 const sx=e.clientX,sy=e.clientY,pid=e.pointerId;let cancelled=false,held=false;
 const timer=setTimeout(()=>{if(cancelled)return;held=true;select(b.id);try{navigator.vibrate?.(8)}catch{}},430);
 const move=ev=>{if(ev.pointerId===pid&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>9){cancelled=true;clearTimeout(timer)}};
 const up=ev=>{clearTimeout(timer);window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cancel);if(held)ev.stopPropagation()};
 const cancel=()=>{cancelled=true;clearTimeout(timer);window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cancel)};
 window.addEventListener('pointermove',move,{passive:true});window.addEventListener('pointerup',up,{once:true});window.addEventListener('pointercancel',cancel,{once:true})
}
function showDrag(x,yv,label,m){dragTime.textContent=(label?label+' ':'')+fmt(m);dragTime.style.left=Math.min(innerWidth-82,x+12)+'px';dragTime.style.top=Math.max(8,yv-20)+'px';dragTime.classList.add('show')}
function scheduleWrite(b){
 if(!b)return;
 const key=b.id,t=(dirty.get(key)||0)+1;dirty.set(key,t);const temp=String(key).startsWith('tmp-');
 queueMicrotask(async()=>{try{
   const d=await api({action:'save',id:temp?'':key,title:b.title||labels[b.kind],kind:b.kind,start_minute:b.start_minute,end_minute:b.end_minute,payload:b.payload||{}});
   if(dirty.get(key)!==t)return;
   if(temp){const i=blocks.findIndex(x=>x.id===key);if(i>=0)blocks[i]={...blocks[i],...d.block};if(selected===key)selected=d.block.id;dirty.delete(key);renderBlocks()}
   else dirty.delete(key);cache()
 }catch(e){if(dirty.get(key)===t){dirty.delete(key);toast(String(e.message||e))}}})
}
function beginMove(e,b){
 if(e.target.closest('.handle'))return;
 e.preventDefault();e.stopPropagation();
 const startY=e.clientY,base=b.start_minute,dur=b.end_minute-b.start_minute,threshold=Math.max(34,ppm*30*1.18);
 let cur=base,last=0,changed=false;
 const mv=ev=>{ev.preventDefault();const dy=ev.clientY-startY,step=dy<0?Math.ceil(dy/threshold):Math.floor(dy/threshold);if(step===last)return;last=step;let ns=base+step*30;ns=Math.max(0,Math.min(1440-dur,ns));if(ns===cur)return;cur=ns;changed=true;const i=blocks.findIndex(x=>x.id===b.id);blocks[i]={...blocks[i],start_minute:cur,end_minute:cur+dur};renderBlocks();showDrag(ev.clientX,ev.clientY,'',cur)};
 const done=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',done);window.removeEventListener('pointercancel',done);dragTime.classList.remove('show');const latest=blocks.find(x=>x.id===b.id);if(changed&&latest)scheduleWrite(latest)};
 window.addEventListener('pointermove',mv,{passive:false});window.addEventListener('pointerup',done,{once:true});window.addEventListener('pointercancel',done,{once:true})
}
function beginResize(e,b,edge){
 e.preventDefault();e.stopPropagation();
 const startY=e.clientY,baseStart=b.start_minute,baseEnd=b.end_minute,anchor=edge==='start'?baseEnd:baseStart,baseDragged=edge==='start'?baseStart:baseEnd,threshold=Math.max(34,ppm*30*1.18);
 let last=0,changed=false;
 const mv=ev=>{ev.preventDefault();const dy=ev.clientY-startY,step=dy<0?Math.ceil(dy/threshold):Math.floor(dy/threshold);if(step===last)return;last=step;let v=Math.max(0,Math.min(1440,baseDragged+step*30));if(v===anchor)v+=edge==='start'?-30:30;v=Math.max(0,Math.min(1440,v));let ns,ne;if(v<anchor){ns=v;ne=anchor}else{ns=anchor;ne=v}if(ne-ns<30)return;const i=blocks.findIndex(x=>x.id===b.id);blocks[i]={...blocks[i],start_minute:ns,end_minute:ne};changed=true;renderBlocks();showDrag(ev.clientX,ev.clientY,v<anchor?'INICIO':'FIN',v<anchor?ns:ne)};
 const done=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',done);window.removeEventListener('pointercancel',done);dragTime.classList.remove('show');const latest=blocks.find(x=>x.id===b.id);if(changed&&latest)scheduleWrite(latest)};
 window.addEventListener('pointermove',mv,{passive:false});window.addEventListener('pointerup',done,{once:true});window.addEventListener('pointercancel',done,{once:true})
}
function sliceEl(b,seg,left,width,cycle,showLabel){
 const first=seg.start===b.start_minute,last=seg.end===b.end_minute,isSelected=selected===b.id,dur=seg.end-seg.start;
 const el=document.createElement('div');el.className='block'+(dur<=30?' halfhour':'')+(width<.999?' splitSlice':'')+(isSelected?' selected':'')+(first?' firstSlice':'')+(last?' lastSlice':'');
 el.style.top=y(cycle*1440+seg.start)+'px';el.style.height=Math.max(18,y(dur)+1)+'px';el.style.left=(left*100)+'%';el.style.width=(width*100)+'%';
 const title=b.title||labels[b.kind],same=String(title).toUpperCase()===labels[b.kind],compact=dur<=30&&!same?labels[b.kind]+' · '+title:title;
 const body=showLabel?'<div class="name">'+esc(compact)+'</div><div class="time">'+fmt(b.start_minute)+'–'+fmt(b.end_minute)+'</div>':'';
 el.innerHTML='<button class="handle top"></button><div class="blockBody">'+body+'</div><button class="handle bottom"></button>';
 if(isSelected){el.addEventListener('pointerdown',e=>beginMove(e,b));if(first)el.querySelector('.handle.top').addEventListener('pointerdown',e=>beginResize(e,b,'start'));if(last)el.querySelector('.handle.bottom').addEventListener('pointerdown',e=>beginResize(e,b,'end'))}
 else el.addEventListener('pointerdown',e=>armSelection(e,b));
 return el
}
function beginSplit(e,pair){
 e.preventDefault();e.stopPropagation();
 const rect=eventLayer.getBoundingClientRect(),apply=ev=>{ev.preventDefault();const r=Math.max(.12,Math.min(.88,(ev.clientX-rect.left)/rect.width));const row=setLayoutLocal(pair.a,pair.b,r);renderBlocks();queueLayout(row,false)};
 const done=()=>{window.removeEventListener('pointermove',apply);window.removeEventListener('pointerup',done);window.removeEventListener('pointercancel',done);queueLayout(layoutFor(pair.a,pair.b),true);cache()};
 window.addEventListener('pointermove',apply,{passive:false});window.addEventListener('pointerup',done,{once:true});window.addEventListener('pointercancel',done,{once:true})
}
function renderBlocks(){
 rendering=true;eventLayer.innerHTML='';const segs=segments();
 const bestLabel=new Map();
 for(const seg of segs){
   for(const item of seg.items){
     const score=(seg.end-seg.start)*item.width;
     const prev=bestLabel.get(item.b.id);
     if(!prev||score>prev.score)bestLabel.set(item.b.id,{seg,score});
   }
 }
 for(let cycle=0;cycle<3;cycle++){
   for(const seg of segs){
     for(const item of seg.items){
       const showLabel=bestLabel.get(item.b.id)?.seg===seg;
       eventLayer.appendChild(sliceEl(item.b,seg,item.left,item.width,cycle,showLabel));
     }
     if(seg.pair){
       const grip=document.createElement('div');grip.className='splitGrip';grip.style.top=y(cycle*1440+seg.start)+'px';grip.style.height=Math.max(18,y(seg.end-seg.start))+'px';grip.style.left=(seg.pair.ratio*100)+'%';grip.addEventListener('pointerdown',e=>beginSplit(e,seg.pair));eventLayer.appendChild(grip)
     }
   }
 }
 requestAnimationFrame(()=>rendering=false)
}
eventLayer.addEventListener('click',e=>{if(e.target===eventLayer)select(null)});

function addSample(kind){
 palette.classList.remove('open');
 const dur=(kind==='youtube'||kind==='page')?60:30,start=Math.floor(nowMin()/30)*30,s=samples[kind],id='tmp-'+Date.now().toString(36);
 const b={id,title:s.title,kind,start_minute:start,end_minute:start+dur,payload:s.payload,enabled:true};blocks.push(b);selected=id;renderBlocks();scheduleWrite(b)
}
document.getElementById('add').onclick=()=>palette.classList.toggle('open');
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>addSample(b.dataset.kind));

async function sync(initial=false){try{const d=await api({action:'list'});if(dirty.size===0){blocks=d.blocks||[];layouts=d.layouts||[];cache();renderBlocks()}if(initial&&!loaded){loaded=true;requestAnimationFrame(scrollInitial)}}catch(e){if(initial)toast(String(e.message||e))}}
try{const c=JSON.parse(localStorage.getItem(cacheKey)||'null');if(c&&Array.isArray(c.blocks)){blocks=c.blocks;layouts=Array.isArray(c.layouts)?c.layouts:[];loaded=true}}catch{}
function layout(){measure();grid();renderBlocks();updateNow()}
layout();requestAnimationFrame(()=>{if(loaded)scrollInitial();sync(true)});
setInterval(updateNow,15000);setInterval(()=>{if(dirty.size===0)sync(false)},30000);
window.addEventListener('resize',layout);
})();
</script>
</body>
</html>
