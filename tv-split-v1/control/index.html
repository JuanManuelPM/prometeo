<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c1110">
<title>Control TV</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#0c1110;color:#e9eeeb;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit;color:inherit}.wrap{width:min(720px,100%);margin:auto;padding:18px 14px 128px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.title{font-size:22px;font-weight:800;letter-spacing:-.035em}.conn{font:700 8px ui-monospace,monospace;color:#65746b}.search{display:grid;grid-template-columns:1fr 44px;border-bottom:1px solid #ffffff15;margin-bottom:12px}.search input{height:48px;border:0;background:transparent;outline:none;font-size:15px}.search button{border:0;background:transparent;font-size:18px;color:#a8b8ae}.tabs{display:flex;border-bottom:1px solid #ffffff12;margin-bottom:4px}.tab{height:40px;border:0;border-bottom:2px solid transparent;background:transparent;padding:0;margin-right:24px;font-size:11px;font-weight:750;color:#65746b}.tab.active{color:#e3e9e5;border-color:#7f9387}.section{display:none}.section.active{display:block}.video{width:100%;border:0;border-bottom:1px solid #ffffff0d;background:transparent;padding:10px 0;display:grid;grid-template-columns:132px 1fr;gap:11px;text-align:left}.thumb{width:132px;aspect-ratio:16/9;object-fit:cover;background:#111}.vtitle{font-size:11px;font-weight:720;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.vmeta{font-size:8px;color:#65746b;margin-top:6px}.channel{width:100%;height:64px;border:0;border-bottom:1px solid #ffffff0d;background:transparent;display:flex;align-items:center;gap:11px;text-align:left;padding:0}.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#17201b}.cname{font-size:11px;font-weight:720}.small{font-size:8px;color:#65746b;margin-top:3px}.empty{padding:28px 0;color:#65746b;font-size:10px}.reauth{display:none;width:100%;height:48px;margin:10px 0 2px;border:1px solid #ffffff18;background:linear-gradient(145deg,#17201c,#0b100e);box-shadow:3px 3px 8px #050706,-2px -2px 6px #1d2922aa;color:#dbe5df;font-size:11px;font-weight:760}.reauth.show{display:block}.reauth:active{box-shadow:inset 2px 2px 5px #050706}.now{position:fixed;z-index:20;left:0;right:0;bottom:0;background:#101714f5;border-top:1px solid #ffffff17;padding:9px 12px calc(9px + env(safe-area-inset-bottom));backdrop-filter:blur(16px)}.nowInner{max-width:720px;margin:auto;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.nowTitle{font-size:10px;font-weight:740;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nowMeta{font-size:7px;color:#65746b;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.transport{display:flex;gap:7px}.transport button{width:42px;height:42px;border:1px solid #ffffff16;background:linear-gradient(145deg,#17201c,#0b100e);box-shadow:3px 3px 8px #050706,-2px -2px 6px #1d2922aa;color:#cbd7cf;font-size:17px}.transport button:active{box-shadow:inset 2px 2px 5px #050706}.detailHead{display:flex;align-items:center;gap:12px;padding:10px 0 4px}.back{border:0;background:transparent;color:#89998f;padding:0;font-size:17px}.detailTitle{font-size:15px;font-weight:760}@media(max-width:410px){.video{grid-template-columns:116px 1fr}.thumb{width:116px}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><div class="title">Control</div><div id="conn" class="conn">conectando…</div></div>
<div class="search"><input id="q" placeholder="Buscar en YouTube"><button id="go">⌕</button></div>
<nav class="tabs"><button class="tab active" data-tab="recent">Recientes</button><button class="tab" data-tab="channels">Canales</button></nav>
<section id="recent" class="section active"><div id="videos"><div class="empty">cargando tus suscripciones…</div></div><button id="reauth" class="reauth">Reconectar YouTube</button></section>
<section id="channels" class="section"><div id="channelList"></div></section>
<section id="detail" class="section"><div class="detailHead"><button id="back" class="back">←</button><div id="detailTitle" class="detailTitle"></div></div><div id="detailVideos"></div></section>
</main>
<div class="now"><div class="nowInner"><div><div id="nowTitle" class="nowTitle">Nada reproduciéndose</div><div id="nowMeta" class="nowMeta"></div></div><div class="transport"><button id="prev">‹</button><button id="play">▶</button><button id="next">›</button></div></div></div>
<script>
(()=>{
'use strict';
const MEDIA='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/prometeo-tv-media-v1';
const ROOM='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/prometeo-tv-room-v1';
const AUTH='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/tv-google-auth-v1';
const p=new URLSearchParams(location.hash.slice(1));
const cap=p.get('k')||'',room={code:p.get('room')||'',token:p.get('t')||'',role:'remote'};
const device='r-'+Math.random().toString(36).slice(2,9);
const $=id=>document.getElementById(id);
let feed={videos:[],channels:[]},state={video:null,queue:[],index:-1,playing:false,position:0},last=0;

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dt(x){if(!x)return'';try{return new Intl.DateTimeFormat('es-AR',{day:'numeric',month:'short'}).format(new Date(x))}catch{return''}}
async function media(body){const r=await fetch(MEDIA,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:cap,...body}),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'MEDIA');return d.result}
async function roomApi(body){const r=await fetch(ROOM,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'ROOM');return d}
async function emit(type,payload){await roomApi({action:'emit',code:room.code,role:'remote',token:room.token,client_id:device,event_type:type,payload})}
async function cmd(c){try{await emit('media.command',c)}catch{}}
function compact(v){return{video_id:v.video_id,title:v.title||'',channel_title:v.channel_title||v.channel||'',thumbnail:v.thumbnail||'',published_at:v.published_at||''}}
function queueOf(list){return(list||[]).slice(0,30).map(compact)}
function choose(v,list){const q=queueOf(list?.length?list:[v]);let i=q.findIndex(x=>x.video_id===v.video_id);if(i<0)i=0;cmd({cmd:'load',video:compact(v),queue:q,index:i,playing:true,position:0});state={video:compact(v),queue:q,index:i,playing:true,position:0};renderNow()}
function videoHTML(v){return '<button class="video" data-id="'+esc(v.video_id)+'"><img class="thumb" src="'+esc(v.thumbnail||'')+'" alt=""><div><div class="vtitle">'+esc(v.title||'')+'</div><div class="vmeta">'+esc(v.channel_title||'')+' · '+esc(dt(v.published_at))+'</div></div></button>'}
function renderVideos(root,list){root.innerHTML=list?.length?list.map(videoHTML).join(''):'<div class="empty">No hay videos.</div>';root.querySelectorAll('.video').forEach(b=>{const v=list.find(x=>x.video_id===b.dataset.id);b.onclick=()=>choose(v,list)})}
function renderChannels(){const root=$('channelList');root.innerHTML=(feed.channels||[]).map(c=>'<button class="channel" data-id="'+esc(c.channel_id)+'">'+(c.thumbnail?'<img class="avatar" src="'+esc(c.thumbnail)+'">':'<span class="avatar"></span>')+'<div><div class="cname">'+esc(c.title)+'</div><div class="small">'+Number(c.video_count||0).toLocaleString('es-AR')+' videos</div></div></button>').join('')||'<div class="empty">No hay canales.</div>';root.querySelectorAll('.channel').forEach(b=>b.onclick=()=>openChannel(b.dataset.id))}
async function openChannel(id){const c=feed.channels.find(x=>x.channel_id===id);$('detailTitle').textContent=c?.title||'';select('detail');$('detailVideos').innerHTML='<div class="empty">cargando…</div>';try{const out=await media({action:'channel_latest_id',channel_id:id,label:c?.title||''});renderVideos($('detailVideos'),out.videos||[])}catch(e){$('detailVideos').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function select(name){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$(name).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===name))}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>select(b.dataset.tab));$('back').onclick=()=>select('channels');
async function reconnectGoogle(){const b=$('reauth');b.textContent='abriendo Google…';b.disabled=true;try{const r=await fetch(AUTH,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:cap,return_to:location.href}),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'AUTH');location.href=d.authorization_url}catch(e){b.disabled=false;b.textContent='Reintentar conexión';$('videos').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
$('reauth').onclick=reconnectGoogle;
async function load(){try{feed=await media({action:'subscription_feed'});$('reauth').classList.remove('show');renderVideos($('videos'),feed.videos||[]);renderChannels()}catch(e){const m=String(e.message||e);if(/GOOGLE_REFRESH_FAILED|YOUTUBE_SCOPE_REQUIRED|GOOGLE_NOT_CONNECTED/.test(m)){$('videos').innerHTML='<div class="empty">YouTube necesita volver a conectarse una vez.</div>';$('reauth').classList.add('show')}else{$('videos').innerHTML='<div class="empty">'+esc(m)+'</div>'}}}
async function search(){const q=$('q').value.trim();if(q.length<2)return;$('go').textContent='…';try{const v=await media({action:'search',q});choose(v,[v])}catch{}$('go').textContent='⌕'}
$('go').onclick=search;$('q').onkeydown=e=>{if(e.key==='Enter')search()};
function renderNow(){$('nowTitle').textContent=state.video?.title||'Nada reproduciéndose';$('nowMeta').textContent=state.video?.channel_title||'';$('play').textContent=state.playing?'Ⅱ':'▶'}
$('play').onclick=()=>{if(!state.video)return;state.playing=!state.playing;cmd({cmd:state.playing?'play':'pause',position:state.position||0});renderNow()};
$('next').onclick=()=>cmd({cmd:'next'});$('prev').onclick=()=>cmd({cmd:'prev'});
async function poll(){while(true){try{const d=await roomApi({action:'poll',code:room.code,role:'remote',token:room.token,after_id:last});$('conn').textContent=room.code;for(const e of d.events||[]){last=Math.max(last,Number(e.id)||0);if(e.event_type==='media.snapshot'){state={...state,...(e.payload||{})};renderNow()}}await new Promise(r=>setTimeout(r,380))}catch{$('conn').textContent='sin conexión';await new Promise(r=>setTimeout(r,1300))}}}
if('mediaSession' in navigator){
 try{
 navigator.mediaSession.setActionHandler('play',()=>{if(state.video&&!state.playing){state.playing=true;cmd({cmd:'play',position:state.position||0});renderNow()}});
 navigator.mediaSession.setActionHandler('pause',()=>{if(state.video&&state.playing){state.playing=false;cmd({cmd:'pause',position:state.position||0});renderNow()}});
 navigator.mediaSession.setActionHandler('nexttrack',()=>cmd({cmd:'next'}));
 navigator.mediaSession.setActionHandler('previoustrack',()=>cmd({cmd:'prev'}));
 }catch{}
}
load();poll();emit('media.request_snapshot',{}).catch(()=>{});
})();
</script>
</body>
</html>
