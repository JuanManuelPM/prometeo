<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>TV · horario</title>
<style>
:root{--bg:#050505;--panel:#0b0b0a;--event:#151513;--fg:#f4f2ea;--muted:#77766f;--grid:#20201d;--half:#11110f;--red:#ff3b30;--rail:27px;--sep:#565650;--sepW:2px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif}
button{font:inherit;color:inherit}
.app{height:100dvh;display:flex;flex-direction:column}
.top{flex:0 0 auto;z-index:80;background:var(--bg);border-bottom:1px solid var(--grid)}
.topbar{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
.topLeft{display:flex;align-items:center;gap:6px}
.add{width:34px;height:34px;border:0;background:var(--fg);color:var(--bg);font-size:23px;line-height:1;padding:0}
.previewBtn,.historyBtn{height:34px;border:1px solid #2d2d29;background:#0b0b0a;color:var(--fg);padding:0 10px;font-size:8px;font-weight:900;letter-spacing:.08em}
.now{font:900 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
.remoteDock{position:fixed;z-index:170;right:0;top:34%;display:flex;flex-direction:row-reverse;align-items:center;pointer-events:none;--remote-glow:rgba(244,242,234,.88);--remote-dim:#4b4a45}
.remoteHandle{pointer-events:auto;position:relative;width:46px;height:72px;border:1px solid #2f2f2b;border-right:0;background:linear-gradient(180deg,#171715,#0a0a09);display:grid;place-items:center;padding:0;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:15px 0 0 15px;box-shadow:inset 1px 0 0 #34342f,inset 0 1px 0 #2a2a27,0 8px 24px #0009}
.remoteHandle:before{content:'';width:26px;height:26px;border-radius:50%;border:2px solid #3b3a36;box-shadow:inset 0 0 0 5px #0a0a09,0 0 0 1px #050505;transition:.18s ease}
.remoteHandle:after{content:'';position:absolute;width:3px;height:10px;top:25px;border-radius:3px;background:#34332f;transition:.18s ease}
.remoteDock.live .remoteHandle:before{border-color:#ddd9cf;box-shadow:inset 0 0 0 5px #0a0a09,0 0 8px 1px rgba(244,242,234,.28),0 0 0 1px #050505}
.remoteDock.live .remoteHandle:after{background:#eeeae0;box-shadow:0 0 7px rgba(244,242,234,.36)}
.remoteDock.stale .remoteHandle:before{border-color:#8b8980}
.remoteDock.open .remoteHandle{border-radius:0}
.remotePanel{pointer-events:auto;width:min(326px,calc(100vw - 46px));background:linear-gradient(180deg,#11110f,#080807);border:1px solid #30302c;border-right:0;transform:translateX(calc(100% + 46px));opacity:0;transition:transform .17s cubic-bezier(.2,.7,.2,1),opacity .12s ease;box-shadow:0 18px 48px #000c,inset 0 1px 0 #262623,inset 0 -1px 0 #050505}
.remoteDock.open .remotePanel{transform:translateX(0);opacity:1}
.remotePlate{padding:8px;background:linear-gradient(180deg,#121210,#090908);border-bottom:1px solid #050505}
.remoteKeys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;background:#050505;border:1px solid #050505;border-radius:13px;overflow:hidden;box-shadow:inset 0 1px 2px #000,0 1px 0 #292925}
.remoteKey{position:relative;min-width:0;height:68px;border:0;background:linear-gradient(180deg,#191917 0%,#0d0d0c 82%);color:#55544f;padding:0;display:grid;place-items:center;touch-action:manipulation;box-shadow:inset 0 1px 0 #2f2f2b,inset 0 -2px 5px #000;transition:color .12s ease,filter .12s ease,background .12s ease}
.remoteKey+ .remoteKey{border-left:1px solid #030303}
.remoteKey svg{width:29px;height:29px;overflow:visible;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 0 #000)}
.remoteKey.main:before{content:'';position:absolute;width:48px;height:48px;border-radius:50%;border:2px solid #2f2f2b;background:linear-gradient(180deg,#121211,#070707);box-shadow:inset 0 1px 0 #373732,inset 0 -4px 9px #000;transition:.15s ease}
.remoteKey.main svg{position:relative;z-index:1;width:31px;height:31px}
.remoteKey.lit{color:#f0ede4}
.remoteKey.main.lit:before{border-color:#e8e4da;box-shadow:inset 0 1px 0 #fff8,inset 0 -4px 9px #000,0 0 9px rgba(244,242,234,.26)}
.remoteKey.main.lit svg{filter:drop-shadow(0 0 5px rgba(244,242,234,.5))}
.remoteKey.soundOn{color:#d8d4ca}
.remoteKey:disabled{color:#292925;filter:none}
.remoteKey:active:not(:disabled){filter:brightness(1.35)}
.remoteInfo{min-height:46px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 10px 7px;border-top:1px solid #22221f}
.remoteNow{min-width:0}
.remoteVideo{font-size:9px;font-weight:900;color:#cbc8bf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.remoteMeta{margin-top:4px;color:#66655f;font:700 6px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.remoteMore{width:44px;height:44px;border:0;background:transparent;color:#73726b;padding:0;font-size:18px;font-weight:900;letter-spacing:2px;touch-action:manipulation}
.remoteMore:active{color:#f0ede4}
.remoteUtility{display:grid;grid-template-rows:0fr;transition:grid-template-rows .14s ease;border-top:1px solid transparent}
.remoteUtility.open{grid-template-rows:1fr;border-top-color:#22221f}
.remoteUtilityInner{overflow:hidden}
.remoteUtilityRow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px}
.remoteConnection{display:flex;align-items:center;gap:7px;color:#6c6b64;font:800 6px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em}
.remoteConnectionDot{width:6px;height:6px;border-radius:50%;background:#393934}
.remoteDock.live .remoteConnectionDot{background:#dcd8ce;box-shadow:0 0 7px rgba(244,242,234,.28)}
.remoteUpdate{display:none;min-height:38px;border:1px solid #373731;background:#11110f;color:#d5d1c8;padding:0 10px;font-size:7px;font-weight:900;letter-spacing:.06em;touch-action:manipulation}
.remoteUpdate.show{display:block}
.remoteSr{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}

.remoteAppHead{height:40px;display:grid;grid-template-columns:minmax(0,1fr) 44px;align-items:center;padding:0 8px 0 12px;border-bottom:1px solid #24241f;background:#11110f}
.remoteAppName{font-size:8px;font-weight:900;letter-spacing:.14em;color:#aaa89f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.remoteOpenApp{width:44px;height:40px;border:0;background:transparent;color:#74736c;font-size:17px;touch-action:manipulation}
.remoteInstrument{padding:10px;background:linear-gradient(180deg,#b9b6a8 0%,#a6a395 100%);color:#171713;box-shadow:inset 0 1px 0 #dedbcf,inset 0 -1px 0 #77746a}
.instDeck{display:grid;gap:11px}
.instWell{min-height:82px;padding:9px;display:grid;grid-template-columns:62px minmax(0,1fr);align-items:center;gap:10px;background:linear-gradient(180deg,#55534c,#3b3a35);border-radius:28px;box-shadow:inset 0 2px 5px #1b1b18,0 1px 0 #d3d0c3}
.instWell.compact{min-height:72px}
.instRound{width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(180deg,#cbc7b9,#a7a396);color:#22211d;display:grid;place-items:center;padding:0;box-shadow:0 5px 8px #1f1f1b99,inset 0 1px 0 #f0ede3;touch-action:manipulation}
.instRound svg,.instSegment svg,.instOpen svg,.instAction svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.instRound.lit{color:#0c0c0a;box-shadow:0 5px 8px #1f1f1b99,inset 0 1px 0 #fff,0 0 9px #f6f1dd88}
.instCapsule{height:62px;display:grid;grid-template-columns:1fr 1fr;border-radius:31px;overflow:hidden;background:#aba79a;box-shadow:0 5px 8px #1f1f1b99,inset 0 1px 0 #eeeae0}
.instSegment{border:0;background:linear-gradient(180deg,#c8c4b7,#a6a295);color:#25241f;display:grid;place-items:center;padding:0;touch-action:manipulation}
.instSegment+ .instSegment{border-left:1px solid #7c796f}
.instSegment.lit{background:linear-gradient(180deg,#eeeadd,#bbb7aa);color:#090908}
.instRound:active,.instSegment:active,.instOpen:active,.instAction:active{filter:brightness(.86)}
.instInfoLine{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#2a2924;font:900 7px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}
.instDialArea{display:grid;grid-template-columns:152px minmax(0,1fr);gap:13px;align-items:center}
.instDial{position:relative;width:148px;height:148px;border-radius:50%;border:1px solid #716f66;background:linear-gradient(145deg,#c2beaf,#9c998c);box-shadow:inset 0 1px 0 #ece8dc,0 7px 12px #39383266;display:grid;place-items:center;touch-action:manipulation}
.instDial:before{content:'';position:absolute;inset:13px;border-radius:50%;border:1px solid #8b887e}
.instDialMark{position:absolute;left:50%;top:12px;width:3px;height:23px;background:#22211d;transform-origin:50% 62px;transform:translateX(-50%) rotate(var(--a))}
.instDialKnob{position:relative;width:66px;height:66px;border-radius:50%;background:linear-gradient(180deg,#bdb9ac,#969287);box-shadow:0 8px 14px #29282488,inset 0 1px 0 #e7e2d5;display:grid;place-items:center;font:900 18px ui-monospace,SFMono-Regular,Menlo,monospace}
.instDialKnob:after{content:'';position:absolute;width:4px;height:23px;background:#25241f;top:5px;left:50%;transform:translateX(-50%) rotate(var(--dial-angle));transform-origin:50% 28px}
.instClockSide{display:grid;gap:10px}
.instClockLabel{font-size:7px;font-weight:900;letter-spacing:.12em;color:#34332e}
.instClockValue{margin-top:3px;font:900 22px ui-monospace,SFMono-Regular,Menlo,monospace;color:#171713}
.instPair{height:48px;display:grid;grid-template-columns:1fr 1fr;border-radius:24px;overflow:hidden;background:#aaa699;box-shadow:0 4px 8px #3a393466}
.instPair button{border:0;background:linear-gradient(180deg,#c8c4b7,#a29e91);color:#1c1b18;font-size:24px;font-weight:500;touch-action:manipulation}.instPair button+button{border-left:1px solid #79766d}

.instScrub{padding:10px 12px 9px;background:linear-gradient(180deg,#55534c,#3b3a35);border-radius:22px;box-shadow:inset 0 2px 5px #1b1b18,0 1px 0 #d3d0c3}
.instScrubTop{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#d7d3c7;font:900 8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
.instScrub input[type=range]{appearance:none;-webkit-appearance:none;width:100%;height:34px;margin:3px 0 0;background:transparent;touch-action:none}
.instScrub input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:999px;background:linear-gradient(to right,#e5e1d5 0 var(--seek-pct,0%),#24231f var(--seek-pct,0%) 100%);box-shadow:inset 0 1px 2px #111}
.instScrub input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:50%;border:1px solid #8b887e;background:linear-gradient(180deg,#d8d4c7,#aaa699);box-shadow:0 4px 7px #111b,inset 0 1px 0 #f4f0e5}
.instScrub input[type=range]::-moz-range-track{height:8px;border-radius:999px;background:#24231f;box-shadow:inset 0 1px 2px #111}
.instScrub input[type=range]::-moz-range-progress{height:8px;border-radius:999px;background:#e5e1d5}
.instScrub input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;border:1px solid #8b887e;background:linear-gradient(180deg,#d8d4c7,#aaa699);box-shadow:0 4px 7px #111b}
.instScrub input[type=range]:disabled{opacity:.3}
.instScrubHint{margin-top:-1px;color:#918f86;font:800 6px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em}
.instPageGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.instAction{min-height:68px;border:0;border-radius:24px;background:linear-gradient(180deg,#c8c4b7,#a29e91);color:#1e1d19;display:grid;grid-template-columns:34px 1fr;align-items:center;gap:6px;padding:0 12px;text-align:left;box-shadow:0 5px 8px #4a494366,inset 0 1px 0 #efebe0;touch-action:manipulation}
.instAction span{font-size:8px;font-weight:900;letter-spacing:.08em}
.instEmpty{min-height:86px;display:grid;place-items:center;text-align:center;color:#44423c;font-size:8px;font-weight:900;letter-spacing:.1em}
.palette{display:grid;grid-template-rows:0fr;transition:grid-template-rows .14s ease}
.palette.open{grid-template-rows:1fr}
.paletteInner{overflow:hidden}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:0 7px;opacity:0;transform:translateY(-4px);transition:.14s ease}
.palette.open .tools{padding-bottom:7px;opacity:1;transform:none}
.tool{height:38px;border:1px solid #2c2c28;background:#0a0a09;padding:0 3px;text-align:center;font-size:7px;font-weight:900;overflow:hidden}
.tool span{display:block;margin-top:2px;color:var(--muted);font-size:5.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewport{position:relative;flex:1 1 auto;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior-y:none}
.viewport::-webkit-scrollbar{display:none}
.timeline{position:relative;width:100%}
.gridLayer{position:absolute;inset:0}
.hourLine,.halfLine{position:absolute;left:var(--rail);right:0;height:1px;background:var(--grid)}
.halfLine{background:var(--half)}
.hourLabel{position:absolute;left:calc(-1 * var(--rail) + 2px);top:-6px;width:20px;text-align:right;background:var(--bg);font:900 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#c3c1b9;z-index:40}
.eventLayer{position:absolute;left:calc(var(--rail) + 2px);right:3px;top:0;bottom:0}
.block{position:absolute;min-height:18px;background:var(--event);color:var(--fg);border:0;overflow:visible;user-select:none;touch-action:pan-y;transition:top .10s ease,height .10s ease,left .10s ease,width .10s ease}
.blockBody{position:absolute;inset:0;padding:5px 7px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;background:transparent}
.block.clustered{box-shadow:0 0 0 1px #2d2d29}
.block.selected{outline:2px solid var(--red);outline-offset:-2px;z-index:30;touch-action:none}
.name{font-size:10px;font-weight:900;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font:700 6px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8b8a83;margin-top:3px;white-space:nowrap}
.block.halfhour .blockBody{padding:0 6px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px;align-items:center}
.block.halfhour .name{font-size:7px}.block.halfhour .time{font-size:5px;margin:0}
.handle{display:none;position:absolute;left:14%;right:14%;height:30px;z-index:40;touch-action:none;background:transparent;border:0;padding:0}
.block.selected .handle{display:block}
.handle.top{top:-19px}.handle.bottom{bottom:-19px}
.handle:after{content:'';position:absolute;left:50%;transform:translateX(-50%);width:32px;height:2px;background:var(--red);border-radius:2px}
.handle.top:after{bottom:2px}.handle.bottom:after{top:2px}
.nowLine{position:absolute;left:calc(var(--rail) - 2px);right:0;height:2px;background:var(--red);z-index:55;pointer-events:none}
.nowDot{position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.dragTime{position:fixed;z-index:130;display:none;pointer-events:none;background:var(--red);color:#fff;padding:3px 5px;font:900 9px ui-monospace,monospace}
.dragTime.show{display:block}
.editWin{position:fixed;z-index:100;left:50%;bottom:12px;width:min(480px,calc(100% - 18px));min-height:150px;transform:translate(-50%,calc(100% + 30px));opacity:0;pointer-events:none;background:#090908;border:1px solid #353530;box-shadow:0 18px 50px #000b;transition:.16s ease}
.editWin.open{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.editHead{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 11px;border-bottom:1px solid #22221f}
.editTitle{font-size:8px;font-weight:900;letter-spacing:.12em}.dirtyDot{width:6px;height:6px;border-radius:50%;background:#333}.editWin.dirty .dirtyDot{background:var(--red)}
.editMain{padding:13px 12px 12px}.editName{font-size:22px;font-weight:900;letter-spacing:-.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.editMeta{margin-top:7px;font:800 10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#aaa89f}
.editHint{margin-top:8px;font-size:7px;color:#686862;line-height:1.4}
.editActions{display:grid;grid-template-columns:66px minmax(92px,1fr) 86px 68px;gap:5px;padding:0 10px 10px}
.editActions button{height:42px;border:1px solid #33332f;background:#10100f;font-size:8px;font-weight:900;letter-spacing:.05em}
.editActions .save{background:var(--fg);color:var(--bg);border-color:var(--fg)}.editActions .save:disabled{opacity:.4}
.toast{position:fixed;z-index:140;left:50%;top:12px;transform:translateX(-50%);display:none;background:var(--fg);color:var(--bg);padding:7px 9px;font-size:8px;font-weight:900}.toast.show{display:block}
.tvPreview{position:fixed;inset:0;z-index:200;background:#000;display:none}
.tvPreview.open{display:block}
.tvPreview iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.tvBack{position:absolute;z-index:210;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));height:36px;border:1px solid #ffffff55;background:#000c;color:#fff;padding:0 12px;font-size:8px;font-weight:900;letter-spacing:.08em}
.historyWin{position:fixed;z-index:190;left:8px;right:8px;top:56px;bottom:12px;background:#090908;border:1px solid #34342f;box-shadow:0 20px 60px #000c;display:none;flex-direction:column}
.historyWin.open{display:flex}
.historyHead{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 11px;border-bottom:1px solid #22221f}
.historyHead strong{font-size:9px;letter-spacing:.12em}.historyClose{height:28px;border:1px solid #33332f;background:#10100f;color:var(--fg);font-size:8px;font-weight:900;padding:0 9px}
.historyList{overflow:auto;padding:6px}
.historyRow{padding:9px 7px;border-bottom:1px solid #20201d}
.historyRow:last-child{border-bottom:0}
.historyTitle{font-size:9px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.historyMeta{margin-top:3px;font:700 6px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:#77766f}
.historyEmpty{padding:18px 9px;color:#77766f;font-size:8px}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="topbar"><div class="topLeft"><button id="add" class="add" aria-label="Agregar">+</button><button id="previewBtn" class="previewBtn" aria-label="Ver TV">TV</button><button id="youtubeBtn" class="historyBtn" aria-label="YouTube">YT</button><button id="historyBtn" class="historyBtn" aria-label="Videos vistos">VISTOS</button></div><div id="now" class="now">--:--</div></div>
  <div id="palette" class="palette"><div class="paletteInner"><div class="tools">
    <button class="tool" data-kind="youtube">YOUTUBE<span>contenido</span></button>
    <button class="tool" data-kind="clock">RELOJ<span>25 / 5</span></button>
    <button class="tool" data-kind="page">PÁGINA<span>Calendario</span></button>
    <button class="tool" data-kind="black">NEGRO<span>vacío</span></button>
  </div></div></div>
</header>
<main id="viewport" class="viewport"><section id="timeline" class="timeline">
  <div id="gridLayer" class="gridLayer"></div><div id="eventLayer" class="eventLayer"></div>
  <div id="now0" class="nowLine"><span class="nowDot"></span></div><div id="now1" class="nowLine"><span class="nowDot"></span></div><div id="now2" class="nowLine"><span class="nowDot"></span></div>
</section></main>
</div>

<aside id="remoteDock" class="remoteDock" aria-label="Control remoto">
  <button id="remoteHandle" class="remoteHandle" aria-label="Abrir control remoto" aria-expanded="false"></button>
  <div id="remotePanel" class="remotePanel">
    <div class="remoteAppHead"><div id="remoteAppName" class="remoteAppName">CONTROL</div><button id="remoteOpenApp" class="remoteOpenApp" aria-label="Abrir aplicación">↗</button></div>
    <div id="remoteInstrument" class="remoteInstrument"></div>
    <div class="remoteInfo">
      <div class="remoteNow"><div id="remoteVideo" class="remoteVideo">Sin selección</div><div id="remoteMeta" class="remoteMeta">—</div></div>
      <button id="remoteMore" class="remoteMore" aria-label="Más opciones" aria-expanded="false">···</button>
    </div>
    <div id="remoteUtility" class="remoteUtility"><div class="remoteUtilityInner"><div class="remoteUtilityRow">
      <div class="remoteConnection"><span class="remoteConnectionDot"></span><span id="remoteText">TV</span></div>
      <button id="remoteUpdate" class="remoteUpdate">ACTUALIZAR TV</button>
    </div></div></div>
    <span id="remoteA11y" class="remoteSr" aria-live="polite"></span>
  </div>
</aside>
<section id="editWin" class="editWin">
  <div class="editHead"><span id="editTitle" class="editTitle">EDICIÓN</span><span class="dirtyDot"></span></div>
  <div class="editMain"><div id="editName" class="editName">—</div><div id="editMeta" class="editMeta">—</div><div id="editHint" class="editHint">Mantené un bloque para editar. Las barandas cambian inicio y fin. Las colisiones se ordenan automáticamente.</div></div>

function updateNow(){const m=nowMin();$('now').textContent=fmt(m);for(let i=0;i<3;i++)$('now'+i).style.top=y(i*1440+m)+'px'}
function recenter(){const t=viewport.scrollTop;if(t<cycleH*.55)viewport.scrollTop=t+cycleH;else if(t>cycleH*1.55)viewport.scrollTop=t-cycleH}
function scrollInitial(){viewport.scrollTop=Math.max(0,cycleH+y(nowMin()-5.5*60))}
viewport.addEventListener('scroll',()=>{if(!rendering)recenter()},{passive:true});

function autoLayout(){
  const live=blocks.filter(b=>b.enabled!==false).slice().sort((a,b)=>a.start_minute-b.start_minute||a.end_minute-b.end_minute||String(a.id).localeCompare(String(b.id)));
  const components=[];let current=[],maxEnd=-1;
  for(const b of live){
    if(!current.length||b.start_minute<maxEnd){current.push(b);maxEnd=Math.max(maxEnd,b.end_minute)}
    else{components.push(current);current=[b];maxEnd=b.end_minute}
  }
  if(current.length)components.push(current);
  const out=new Map();
  for(const group of components){
    const laneEnd=[];
    const assigned=[];
    for(const b of group){
      let lane=laneEnd.findIndex(end=>end<=b.start_minute);
      if(lane<0){lane=laneEnd.length;laneEnd.push(b.end_minute)}else laneEnd[lane]=b.end_minute;
      assigned.push({b,lane})
    }
    const cols=Math.max(1,laneEnd.length);
    for(const a of assigned)out.set(String(a.b.id),{lane:a.lane,cols,left:a.lane/cols,width:1/cols})
  }
  return out
}
function updateEditor(){
 const b=blocks.find(x=>x.id===selected);
 const open=!!b||hasDraft();editWin.classList.toggle('open',open);editWin.classList.toggle('dirty',!!hasDraft());$('save').disabled=!hasDraft()||saving;
 const content=$('content');
 if(b){$('editTitle').textContent='EDICIÓN';$('editName').textContent=b.kind==='youtube'?'YOUTUBE':(b.title||labels[b.kind]);$('editMeta').textContent=fmt(b.start_minute)+' — '+fmt(b.end_minute)+' · '+(b.end_minute-b.start_minute)+' min';$('delete').style.visibility='visible';content.style.visibility=b.kind==='youtube'?'visible':'hidden';return}
 $('editTitle').textContent='CAMBIOS';$('editName').textContent='SIN GUARDAR';$('editMeta').textContent='';$('delete').style.visibility='hidden';content.style.visibility='hidden'
}
function select(id){selected=id;renderBlocks();updateEditor();setRemoteOpen(true);renderRemote()}
function youtubeEditorUrl(){return '/prometeo/yt/#room='+encodeURIComponent(room.code)+'&t='+encodeURIComponent(room.token)+'&k='+encodeURIComponent(mediaToken)}
function openYouTubeEditor(b){if(b&&b.kind!=='youtube')return;location.href=youtubeEditorUrl()}
function advancedTarget(b){
 if(b.kind==='youtube')return youtubeEditorUrl();
 if(b.kind==='page')return String(b.payload?.control?.settings_url||b.payload?.url||'');
 return ''
}
function armSelection(e,b){
 if(e.button!==undefined&&e.button!==0)return;
 const sx=e.clientX,sy=e.clientY,pid=e.pointerId;let cancelled=false,held=false;
 const timer=setTimeout(()=>{if(cancelled)return;held=true;const u=advancedTarget(b);if(u)location.href=u;else select(b.id);try{navigator.vibrate?.(8)}catch{}},520);
 const mv=ev=>{if(ev.pointerId===pid&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>9){cancelled=true;clearTimeout(timer)}};
 const up=ev=>{clearTimeout(timer);window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cancel);if(held)ev.stopPropagation();else if(!cancelled)select(b.id)};
 const cancel=()=>{cancelled=true;clearTimeout(timer);window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cancel)};
 window.addEventListener('pointermove',mv,{passive:true});window.addEventListener('pointerup',up,{once:true});window.addEventListener('pointercancel',cancel,{once:true})
}
function showDrag(x,yv,label,m){dragTime.textContent=(label?label+' ':'')+fmt(m);dragTime.style.left=Math.min(innerWidth-82,x+12)+'px';dragTime.style.top=Math.max(8,yv-20)+'px';dragTime.classList.add('show')}
function markBlock(id){dirtyBlocks.add(id);updateEditor()}
function beginMove(e,b){if(e.target.closest('.handle'))return;e.preventDefault();e.stopPropagation();const sy=e.clientY,base=b.start_minute,dur=b.end_minute-b.start_minute,threshold=Math.max(34,ppm*30*1.18);let cur=base,last=0,changed=false;const mv=ev=>{ev.preventDefault();const dy=ev.clientY-sy,step=dy<0?Math.ceil(dy/threshold):Math.floor(dy/threshold);if(step===last)return;last=step;let ns=base+step*30;ns=Math.max(0,Math.min(1440-dur,ns));if(ns===cur)return;cur=ns;changed=true;const i=blocks.findIndex(x=>x.id===b.id);blocks[i]={...blocks[i],start_minute:cur,end_minute:cur+dur};renderBlocks();updateEditor();showDrag(ev.clientX,ev.clientY,'',cur)};const done=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',done);window.removeEventListener('pointercancel',done);dragTime.classList.remove('show');if(changed)markBlock(b.id)};window.addEventListener('pointermove',mv,{passive:false});window.addEventListener('pointerup',done,{once:true});window.addEventListener('pointercancel',done,{once:true})}
function beginResize(e,b,edge){e.preventDefault();e.stopPropagation();const sy=e.clientY,bs=b.start_minute,be=b.end_minute,anchor=edge==='start'?be:bs,base=edge==='start'?bs:be,threshold=Math.max(34,ppm*30*1.18);let last=0,changed=false;const mv=ev=>{ev.preventDefault();const dy=ev.clientY-sy,step=dy<0?Math.ceil(dy/threshold):Math.floor(dy/threshold);if(step===last)return;last=step;let v=Math.max(0,Math.min(1440,base+step*30));if(v===anchor)v+=edge==='start'?-30:30;v=Math.max(0,Math.min(1440,v));let ns,ne;if(v<anchor){ns=v;ne=anchor}else{ns=anchor;ne=v}if(ne-ns<30)return;const i=blocks.findIndex(x=>x.id===b.id);blocks[i]={...blocks[i],start_minute:ns,end_minute:ne};changed=true;renderBlocks();updateEditor();showDrag(ev.clientX,ev.clientY,v<anchor?'INICIO':'FIN',v<anchor?ns:ne)};const done=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',done);window.removeEventListener('pointercancel',done);dragTime.classList.remove('show');if(changed)markBlock(b.id)};window.addEventListener('pointermove',mv,{passive:false});window.addEventListener('pointerup',done,{once:true});window.addEventListener('pointercancel',done,{once:true})}
function eventEl(b,geo,cycle){
  const isSelected=selected===b.id,dur=b.end_minute-b.start_minute,cols=geo?.cols||1,lane=geo?.lane||0;
  const el=document.createElement('div');el.className='block'+(dur<=30?' halfhour':'')+(cols>1?' clustered':'')+(isSelected?' selected':'');
  const gap=2,leftPct=(lane/cols)*100,widthPct=100/cols,leftGap=lane===0?0:gap/2,rightGap=lane===cols-1?0:gap/2;
  el.style.top=y(cycle*1440+b.start_minute)+'px';el.style.height=Math.max(18,y(dur))+'px';
  el.style.left='calc('+leftPct+'% + '+leftGap+'px)';
  el.style.width='calc('+widthPct+'% - '+(leftGap+rightGap)+'px)';
  const title=b.title||labels[b.kind],same=String(title).toUpperCase()===labels[b.kind],compact=dur<=30&&!same?labels[b.kind]+' · '+title:title;
  const body='<div class="name">'+esc(compact)+'</div><div class="time">'+fmt(b.start_minute)+'–'+fmt(b.end_minute)+'</div>';
  el.innerHTML='<button class="handle top"></button><div class="blockBody">'+body+'</div><button class="handle bottom"></button>';
  if(isSelected){
    el.addEventListener('pointerdown',e=>beginMove(e,b));
    el.querySelector('.handle.top').addEventListener('pointerdown',e=>beginResize(e,b,'start'));
    el.querySelector('.handle.bottom').addEventListener('pointerdown',e=>beginResize(e,b,'end'))
  }else el.addEventListener('pointerdown',e=>armSelection(e,b));
  return el
}
function renderBlocks(){
  rendering=true;eventLayer.innerHTML='';
  const layoutMap=autoLayout();
  for(let c=0;c<3;c++)for(const b of blocks.filter(b=>b.enabled!==false))eventLayer.appendChild(eventEl(b,layoutMap.get(String(b.id))||{lane:0,cols:1},c));
  requestAnimationFrame(()=>rendering=false)
}
eventLayer.addEventListener('click',e=>{if(e.target===eventLayer){selected=null;renderBlocks();updateEditor();renderRemote()}});

function addSample(kind){palette.classList.remove('open');const dur=(kind==='page'||kind==='youtube')?60:30,start=Math.floor(nowMin()/30)*30,s=samples[kind],id='tmp-'+Date.now().toString(36);blocks.push({id,title:s.title,kind,start_minute:start,end_minute:start+dur,payload:s.payload,enabled:true});selected=id;dirtyBlocks.add(id);renderBlocks();updateEditor()}
function addYT(channelId,label){
  palette.classList.remove('open');
  const arr=ytByChannel.get(channelId)||[],v=arr.find(x=>!watchedIds.has(String(x.video_id)))||ytLatest.get(channelId);
  if(arr.length&&v&&watchedIds.has(String(v.video_id))){toast('NO HAY VIDEOS NUEVOS');return}
  const fallback={title:label||'YOUTUBE',watch_url:'https://www.youtube.com/watch?v=J1WoNuemKOg',channel_title:label||'YOUTUBE'};
  const picked=v||fallback,start=Math.floor(nowMin()/30)*30,id='tmp-'+Date.now().toString(36);
  blocks.push({id,title:(picked.channel_title||label||'YOUTUBE').toUpperCase(),kind:'youtube',start_minute:start,end_minute:start+60,payload:{url:picked.watch_url,channel_id:channelId,channel_title:picked.channel_title||label||'YOUTUBE',video_title:picked.title||'',auto_next:true},enabled:true});
  selected=id;dirtyBlocks.add(id);renderBlocks();updateEditor()
}
$('add').onclick=()=>palette.classList.toggle('open');
$('remoteUpdate').onclick=async()=>{await sendRemote('reload_now');toast('ACTUALIZANDO TV')};
$('remoteMore').onclick=()=>setRemoteUtility(!remoteUtilityOpen);
$('remoteOpenApp').onclick=()=>{const u=contextOpenUrl(contextBlock());if(u)location.href=u};
$('remoteInstrument').onclick=async e=>{
 const btn=e.target.closest('[data-remote-action]');if(!btn)return;const a=btn.dataset.remoteAction,b=contextBlock();if(!b)return;
 if(a==='news-prev')return api({action:'news_step',block_id:String(b.id),delta:-1}).then(()=>pollTVState()).catch(e=>toast(String(e.message||e)));
 if(a==='news-next')return api({action:'news_step',block_id:String(b.id),delta:1}).then(()=>pollTVState()).catch(e=>toast(String(e.message||e)));
 if(a==='news-toggle'){const p=currentRemotePlayer();return sendContextCommand(Number(p?.state)===1?'pause':'play')}
 if(a==='news-mute')return sendContextCommand(remoteMuted?'unmute':'mute');
 if(a==='news-refresh')return api({action:'news_refresh'}).then(()=>{toast('NOTICIAS ACTUALIZADAS');syncServer(true)}).catch(e=>toast(String(e.message||e)));
 if(a==='yt-prev')return stepRemote(-1);
 if(a==='yt-next')return stepRemote(1);
 if(a==='yt-toggle'){const p=currentRemotePlayer();return sendRemote(Number(p?.state)===1?'pause':'play')}
 if(a==='yt-mute')return sendRemote(remoteMuted?'unmute':'mute');
 if(a==='yt-back15')return sendRemote('seek_relative',-15);
 if(a==='yt-forward15')return sendRemote('seek_relative',15);
 if(a==='open-app'){const u=contextOpenUrl(b);if(u)location.href=u;return}
 if(a==='clock-preset')return cycleClockPreset();
 if(a==='focus-minus')return adjustClock('focus',-1);
 if(a==='focus-plus')return adjustClock('focus',1);
 if(a==='break-minus')return adjustClock('break',-1);
 if(a==='break-plus')return adjustClock('break',1);
 if(a==='page-open'){if(b.payload?.url)location.href=b.payload.url;return}
 if(a==='page-settings'){if(b.payload?.control?.settings_url)location.href=b.payload.control.settings_url;return}
 if(a==='page-refresh')return sendContextCommand('refresh_panel');
 if(a.startsWith('page-'))return sendContextCommand('widget_'+a.slice(5))
};
$('remoteInstrument').addEventListener('pointerdown',e=>{if(e.target.matches('[data-yt-scrub]'))remoteScrubbing=true});
$('remoteInstrument').addEventListener('input',e=>{
 const r=e.target;if(!r.matches('[data-yt-scrub]'))return;remoteScrubbing=true;
 const max=Number(r.max)||0,val=Math.max(0,Math.min(max,Math.round((Number(r.value)||0)/5)*5));r.value=String(val);
 const pct=max>0?val/max*100:0;r.style.setProperty('--seek-pct',pct+'%');
 const a=$('remoteInstrument').querySelector('[data-yt-now]');if(a)a.textContent=mediaTime(val)
});
$('remoteInstrument').addEventListener('change',e=>{
 const r=e.target;if(!r.matches('[data-yt-scrub]'))return;const val=Math.round((Number(r.value)||0)/5)*5;
 const p=currentRemotePlayer();if(p){p.current_time=val;remoteSampleAt=Date.now()}
 sendRemote('seek_absolute',val);remoteScrubbing=false;updateRemoteScrubber(val,Number(p?.duration)||0)
});
$('remoteInstrument').addEventListener('pointercancel',e=>{if(e.target.matches('[data-yt-scrub]'))remoteScrubbing=false});
$('youtubeBtn').onclick=()=>openYouTubeEditor();
$('historyBtn').onclick=async()=>{await loadHistory();$('historyWin').classList.add('open');$('historyWin').setAttribute('aria-hidden','false')};
$('historyClose').onclick=()=>{$('historyWin').classList.remove('open');$('historyWin').setAttribute('aria-hidden','true')};

  const wrap=$('tvPreview'),frame=$('tvPreviewFrame');
  if(!frame.src)frame.src='https://juanmanuelpm.github.io/prometeo/tv/?embed=1';
  previewOpen=true;wrap.classList.add('open');wrap.setAttribute('aria-hidden','false');renderRemote()

initRemoteDock();

  const wrap=$('tvPreview'),frame=$('tvPreviewFrame');
  previewOpen=false;wrap.classList.remove('open');wrap.setAttribute('aria-hidden','true');renderRemote();
  frame.src='about:blank';setTimeout(()=>frame.removeAttribute('src'),0)
};
document.querySelectorAll('.tool[data-kind]').forEach(b=>b.onclick=()=>addSample(b.dataset.kind));
$('content').onclick=()=>{const b=blocks.find(x=>x.id===selected);openYouTubeEditor(b)};

async function saveAll(){
 if(!hasDraft()||saving)return;saving=true;updateEditor();const idMap=new Map();
 try{
   for(const id of [...pendingDeletes])if(!String(id).startsWith('tmp-'))await api({action:'delete',id});
   for(const id of [...dirtyBlocks]){
     if(pendingDeletes.has(id))continue;
     const b=blocks.find(x=>x.id===id);if(!b)continue;
     const d=await api({action:'save',id:String(id).startsWith('tmp-')?'':id,title:b.title||labels[b.kind],kind:b.kind,start_minute:b.start_minute,end_minute:b.end_minute,payload:b.payload||{}});
     if(String(id).startsWith('tmp-')){idMap.set(String(id),d.block.id);const i=blocks.findIndex(x=>x.id===id);if(i>=0)blocks[i]={...blocks[i],...d.block};if(selected===id)selected=d.block.id}
   }
   dirtyBlocks.clear();pendingDeletes.clear();
   await syncServer(true);toast('APLICADO EN TV')
 }catch(e){toast(String(e.message||e))}
 saving=false;updateEditor()
}
function cancelAll(){blocks=clone(serverBlocks);dirtyBlocks.clear();pendingDeletes.clear();selected=null;renderBlocks();updateEditor()}
$('save').onclick=saveAll;$('cancel').onclick=cancelAll;$('delete').onclick=()=>{if(!selected)return;const id=selected;if(String(id).startsWith('tmp-'))blocks=blocks.filter(b=>b.id!==id);else{pendingDeletes.add(id);blocks=blocks.filter(b=>b.id!==id)}dirtyBlocks.delete(id);selected=null;renderBlocks();updateEditor()};

async function syncServer(initial=false){if(hasDraft()&&!initial)return;try{const d=await api({action:'list'});serverBlocks=clone(d.blocks||[]);if(!hasDraft()){blocks=clone(serverBlocks);cache();renderBlocks()}if(initial&&!loaded){loaded=true;requestAnimationFrame(scrollInitial)}}catch(e){if(initial)toast(String(e.message||e))}}
try{const c=JSON.parse(localStorage.getItem(cacheKey)||'null');if(c&&Array.isArray(c.blocks)){serverBlocks=clone(c.blocks);blocks=clone(serverBlocks);loaded=true}}catch{}
function layout(){measure();grid();renderBlocks();updateNow()}
async function checkCanonical(){try{const r=await fetch(CANONICAL+'?t='+Date.now(),{cache:'no-store'}),d=await r.json();if(String(d.control_build||CONTROL_BUILD)!==CONTROL_BUILD)location.replace('/prometeo/ctrl/?v='+Date.now())}catch{}}
layout();loadHistory();renderRemote();pollTVState();checkCanonical();requestAnimationFrame(()=>{if(loaded)scrollInitial();syncServer(true)});setInterval(updateNow,15000);setInterval(()=>syncServer(false),30000);setInterval(pollTVState,900);setInterval(tickRemoteScrubber,200);setInterval(loadHistory,10000);setInterval(checkCanonical,15000);window.addEventListener('resize',layout);
})();
