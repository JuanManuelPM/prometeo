<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>TV · horario</title>
<style>
:root{--bg:#050505;--panel:#0b0b0a;--event:#151513;--fg:#f4f2ea;--muted:#77766f;--grid:#20201d;--half:#11110f;--red:#ff3b30;--rail:27px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif}
button{font:inherit;color:inherit}
.app{height:100dvh;display:flex;flex-direction:column}
.top{flex:0 0 auto;z-index:80;background:var(--bg);border-bottom:1px solid var(--grid)}
.topbar{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
.add{width:34px;height:34px;border:0;background:var(--fg);color:var(--bg);font-size:23px;line-height:1;padding:0}
.now{font:900 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
.palette{display:grid;grid-template-rows:0fr;transition:grid-template-rows .14s ease}
.palette.open{grid-template-rows:1fr}
.paletteInner{overflow:hidden}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:0 7px;opacity:0;transform:translateY(-4px);transition:.14s ease}
.palette.open .tools{padding-bottom:7px;opacity:1;transform:none}
.tool{height:38px;border:1px solid #2c2c28;background:#0a0a09;padding:0 3px;text-align:center;font-size:7px;font-weight:900;overflow:hidden}
.tool span{display:block;margin-top:2px;color:var(--muted);font-size:5.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewport{position:relative;flex:1 1 auto;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior-y:none}
.viewport::-webkit-scrollbar{display:none}
.timeline{position:relative;width:100%}
.gridLayer{position:absolute;inset:0}
.hourLine,.halfLine{position:absolute;left:var(--rail);right:0;height:1px;background:var(--grid)}
.halfLine{background:var(--half)}
.hourLabel{position:absolute;left:calc(-1 * var(--rail) + 2px);top:-6px;width:20px;text-align:right;background:var(--bg);font:900 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#c3c1b9;z-index:40}
.eventLayer{position:absolute;left:calc(var(--rail) + 2px);right:3px;top:0;bottom:0}
.block{position:absolute;min-height:18px;background:var(--event);color:var(--fg);border:0;overflow:visible;user-select:none;touch-action:pan-y;transition:top .10s ease,height .10s ease,left .08s linear,width .08s linear;box-shadow:inset 1px 0 0 #2b2b27,inset -1px 0 0 #2b2b27}
.block.firstSlice{border-top:1px solid #2b2b27}.block.lastSlice{border-bottom:1px solid #2b2b27}
.blockBody{position:absolute;inset:0;padding:5px 7px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;background:transparent}
.name{font-size:10px;font-weight:900;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font:700 6px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8b8a83;margin-top:3px;white-space:nowrap}
.block.halfhour .blockBody{padding:0 6px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px;align-items:center}
.block.halfhour .name{font-size:7px}.block.halfhour .time{font-size:5px;margin:0}
.block.selected{z-index:30;touch-action:none;box-shadow:inset 2px 0 0 var(--red),inset -2px 0 0 var(--red)}
.block.selected.firstSlice{border-top:2px solid var(--red)}.block.selected.lastSlice{border-bottom:2px solid var(--red)}
.handle{display:none;position:absolute;left:14%;right:14%;height:30px;z-index:40;touch-action:none;background:transparent;border:0;padding:0}
.block.selected.firstSlice .handle.top,.block.selected.lastSlice .handle.bottom{display:block}
.handle.top{top:-19px}.handle.bottom{bottom:-19px}
.handle:after{content:'';position:absolute;left:50%;transform:translateX(-50%);width:32px;height:2px;background:var(--red);border-radius:2px}
.handle.top:after{bottom:2px}.handle.bottom:after{top:2px}
.splitGrip{position:absolute;width:34px;transform:translateX(-50%);z-index:22;touch-action:none;background:transparent}
.splitGrip:after{content:'';position:absolute;left:50%;top:0;bottom:0;width:6px;transform:translateX(-50%);background:var(--bg);border-left:1px solid #34342f;border-right:1px solid #34342f}
.splitGrip.active:after{background:var(--red);border-color:var(--red)}
.nowLine{position:absolute;left:calc(var(--rail) - 2px);right:0;height:2px;background:var(--red);z-index:55;pointer-events:none}
.nowDot{position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.dragTime{position:fixed;z-index:130;display:none;pointer-events:none;background:var(--red);color:#fff;padding:3px 5px;font:900 9px ui-monospace,monospace}
.dragTime.show{display:block}
.editWin{position:fixed;z-index:100;left:50%;bottom:12px;width:min(480px,calc(100% - 18px));min-height:150px;transform:translate(-50%,calc(100% + 30px));opacity:0;pointer-events:none;background:#090908;border:1px solid #353530;box-shadow:0 18px 50px #000b;transition:.16s ease}
.editWin.open{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.editHead{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 11px;border-bottom:1px solid #22221f}
.editTitle{font-size:8px;font-weight:900;letter-spacing:.12em}.dirtyDot{width:6px;height:6px;border-radius:50%;background:#333}.editWin.dirty .dirtyDot{background:var(--red)}
.editMain{padding:13px 12px 12px}.editName{font-size:22px;font-weight:900;letter-spacing:-.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.editMeta{margin-top:7px;font:800 10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#aaa89f}
.editHint{margin-top:8px;font-size:7px;color:#686862;line-height:1.4}
.editActions{display:grid;grid-template-columns:70px 1fr 74px;gap:6px;padding:0 10px 10px}
.editActions button{height:42px;border:1px solid #33332f;background:#10100f;font-size:8px;font-weight:900;letter-spacing:.05em}
.editActions .save{background:var(--fg);color:var(--bg);border-color:var(--fg)}.editActions .save:disabled{opacity:.4}
.toast{position:fixed;z-index:140;left:50%;top:12px;transform:translateX(-50%);display:none;background:var(--fg);color:var(--bg);padding:7px 9px;font-size:8px;font-weight:900}.toast.show{display:block}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="topbar"><button id="add" class="add" aria-label="Agregar">+</button><div id="now" class="now">--:--</div></div>
  <div id="palette" class="palette"><div class="paletteInner"><div class="tools">
    <button class="tool ytPreset" data-channel="UCHnyfMqiRRG1u-2MsSQLbXA">YOUTUBE<span>Veritasium</span></button>
    <button class="tool ytPreset" data-channel="UCsXVk37bltHxD1rDPwtNM8Q">YOUTUBE<span>Kurzgesagt</span></button>
    <button class="tool ytPreset" data-channel="UCBJycsmduvYEL83R_U4JriQ">YOUTUBE<span>MKBHD</span></button>
    <button class="tool ytPreset" data-channel="UCSpFnDQr88xCZ80N-X7t0nQ">YOUTUBE<span>Corridor Crew</span></button>
    <button class="tool ytPreset" data-channel="UClHVl2N3jPEbkNJVx-ItQIQ">YOUTUBE<span>HealthyGamer</span></button>
    <button class="tool" data-kind="clock">RELOJ<span>25 / 5</span></button>
    <button class="tool" data-kind="page">PÁGINA<span>Calendario</span></button>
    <button class="tool" data-kind="black">NEGRO<span>vacío</span></button>
  </div></div></div>
</header>
<main id="viewport" class="viewport"><section id="timeline" class="timeline">
  <div id="gridLayer" class="gridLayer"></div><div id="eventLayer" class="eventLayer"></div>
  <div id="now0" class="nowLine"><span class="nowDot"></span></div><div id="now1" class="nowLine"><span class="nowDot"></span></div><div id="now2" class="nowLine"><span class="nowDot"></span></div>
</section></main>
</div>

<section id="editWin" class="editWin">
  <div class="editHead"><span id="editTitle" class="editTitle">EDICIÓN</span><span class="dirtyDot"></span></div>
  <div class="editMain"><div id="editName" class="editName">—</div><div id="editMeta" class="editMeta">—</div><div id="editHint" class="editHint">Mantené un bloque para editar. Las barandas cambian inicio y fin. La división vertical reparte pantalla.</div></div>
  <div class="editActions"><button id="cancel">CANCELAR</button><button id="save" class="save">GUARDAR EN TV</button><button id="delete">BORRAR</button></div>
</section>
<div id="dragTime" class="dragTime">--:--</div><div id="toast" class="toast"></div>

<script>
(()=>{
'use strict';
const API='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/tv-schedule-v1';
const FEED='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/tv-public-feed-v1';
const q=new URLSearchParams(location.hash.slice(1));
const room={code:q.get('room')||'',token:q.get('t')||'',role:'remote'},mediaToken=q.get('k')||'';
const client='tv-editor-'+Math.random().toString(36).slice(2,9);
const $=id=>document.getElementById(id),viewport=$('viewport'),timeline=$('timeline'),gridLayer=$('gridLayer'),eventLayer=$('eventLayer'),palette=$('palette'),dragTime=$('dragTime'),editWin=$('editWin');
const labels={youtube:'YOUTUBE',clock:'RELOJ',page:'PÁGINA',black:'NEGRO'};
const samples={clock:{title:'RELOJ 25/5',payload:{style:'focus25-5'}},page:{title:'CALENDARIO',payload:{url:'https://juanmanuelpm.github.io/prometeo/experiments/tv-split-v1-sample-calendar.html'}},black:{title:'NEGRO',payload:{}}};
const ytLatest=new Map();
let blocks=[],layouts=[],serverBlocks=[],serverLayouts=[],selected=null,layoutSelection=null,ppm=.7,cycleH=1000,loaded=false,rendering=false,saving=false;
const dirtyBlocks=new Set(),dirtyLayouts=new Set(),pendingDeletes=new Set();
const cacheKey='tv.program.editor.v20.'+room.code;

function clone(x){return JSON.parse(JSON.stringify(x))}
function ba(){const ps=new Intl.DateTimeFormat('en-GB',{timeZone:'America/Argentina/Buenos_Aires',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const get=t=>Number(ps.find(x=>x.type===t)?.value||0);return{h:get('hour'),m:get('minute')}}
function nowMin(){const n=ba();return n.h*60+n.m}
function fmt(m){m=((Number(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1200)}
async function api(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:room.code,role:'remote',token:room.token,client_id:client,...body}),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'ERROR');return d}
async function loadYTPresets(){
  if(!mediaToken)return;
  try{
    const r=await fetch(FEED,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'feed',token:mediaToken}),cache:'no-store'});
    const d=await r.json();if(!r.ok||!d.ok)return;
    for(const v of d.result?.videos||[])if(!ytLatest.has(v.channel_id))ytLatest.set(v.channel_id,v);
    document.querySelectorAll('.ytPreset').forEach(btn=>{const v=ytLatest.get(btn.dataset.channel);if(v)btn.title=v.title||''});
  }catch{}
}
function hasDraft(){return dirtyBlocks.size||dirtyLayouts.size||pendingDeletes.size}
function cache(){try{localStorage.setItem(cacheKey,JSON.stringify({blocks:serverBlocks,layouts:serverLayouts}))}catch{}}
function measure(){ppm=Math.max(.52,viewport.clientHeight/(12*60));cycleH=1440*ppm;timeline.style.height=(cycleH*3)+'px'}
function y(m){return m*ppm}
function grid(){gridLayer.innerHTML='';for(let c=0;c<3;c++){for(let h=0;h<24;h++){const a=document.createElement('div');a.className='hourLine';a.style.top=y(c*1440+h*60)+'px';a.innerHTML='<span class="hourLabel">'+String(h).padStart(2,'0')+'</span>';gridLayer.appendChild(a);const b=document.createElement('div');b.className='halfLine';b.style.top=y(c*1440+h*60+30)+'px';gridLayer.appendChild(b)}}}
function updateNow(){const m=nowMin();$('now').textContent=fmt(m);for(let i=0;i<3;i++)$('now'+i).style.top=y(i*1440+m)+'px'}
function recenter(){const t=viewport.scrollTop;if(t<cycleH*.55)viewport.scrollTop=t+cycleH;else if(t>cycleH*1.55)viewport.scrollTop=t-cycleH}
function scrollInitial(){viewport.scrollTop=Math.max(0,cycleH+y(nowMin()-5.5*60))}
viewport.addEventListener('scroll',()=>{if(!rendering)recenter()},{passive:true});

function pairIds(a,b){return [String(a),String(b)].sort()}
function layoutKey(a,b){return pairIds(a,b).join('|')}
function layoutFor(a,b){const [x,y]=pairIds(a,b);return layouts.find(l=>String(l.block_a)===x&&String(l.block_b)===y)||{block_a:x,block_b:y,ratio:.5}}
function setLayoutLocal(a,b,ratio){const [x,y]=pairIds(a,b),r=Math.max(.12,Math.min(.88,ratio));const i=layouts.findIndex(l=>String(l.block_a)===x&&String(l.block_b)===y);const row={block_a:x,block_b:y,ratio:r,updated_at:new Date().toISOString()};if(i>=0)layouts[i]={...layouts[i],...row};else layouts.push(row);dirtyLayouts.add(layoutKey(x,y));layoutSelection={a:x,b:y};updateEditor();return row}
function segments(){const cuts=[...new Set(blocks.flatMap(b=>[+b.start_minute,+b.end_minute]))].sort((a,b)=>a-b),out=[];for(let i=0;i<cuts.length-1;i++){const start=cuts[i],end=cuts[i+1];if(end<=start)continue;const active=blocks.filter(b=>b.enabled!==false&&b.start_minute<=start&&b.end_minute>=end);if(!active.length)continue;if(active.length===1){out.push({start,end,items:[{b:active[0],left:0,width:1}],pair:null});continue}if(active.length===2){const [x,y]=pairIds(active[0].id,active[1].id),l=layoutFor(x,y),bx=active.find(b=>String(b.id)===x),by=active.find(b=>String(b.id)===y);out.push({start,end,items:[{b:bx,left:0,width:l.ratio},{b:by,left:l.ratio,width:1-l.ratio}],pair:{a:x,b:y,ratio:l.ratio}});continue}const sorted=active.slice().sort((a,b)=>String(a.id).localeCompare(String(b.id))),w=1/sorted.length;out.push({start,end,items:sorted.map((b,j)=>({b,left:j*w,width:w})),pair:null})}return out}
function updateEditor(){
 const b=blocks.find(x=>x.id===selected),l=layoutSelection&&layoutFor(layoutSelection.a,layoutSelection.b);
 const open=!!b||!!l||hasDraft();editWin.classList.toggle('open',open);editWin.classList.toggle('dirty',!!hasDraft());$('save').disabled=!hasDraft()||saving;
 if(l&&!b){$('editTitle').textContent='PANTALLA';$('editName').textContent='DIVISIÓN';$('editMeta').textContent=Math.round(l.ratio*100)+' / '+Math.round((1-l.ratio)*100);$('delete').style.visibility='hidden';return}
 if(b){$('editTitle').textContent='EDICIÓN';$('editName').textContent=b.title||labels[b.kind];$('editMeta').textContent=fmt(b.start_minute)+' — '+fmt(b.end_minute)+' · '+(b.end_minute-b.start_minute)+' min';$('delete').style.visibility='visible';return}
 $('editTitle').textContent='CAMBIOS';$('editName').textContent='SIN GUARDAR';$('editMeta').textContent='';$('delete').style.visibility='hidden'
}
function select(id){selected=id;layoutSelection=null;renderBlocks();updateEditor()}
function armSelection(e,b){if(e.button!==undefined&&e.button!==0)return;const sx=e.clientX,sy=e.clientY,pid=e.pointerId;let cancelled=false,held=false;const timer=setTimeout(()=>{if(cancelled)return;held=true;select(b.id);try{navigator.vibrate?.(8)}catch{}},430);const mv=ev=>{if(ev.pointerId===pid&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>9){cancelled=true;clearTimeout(timer)}};const up=ev=>{clearTimeout(timer);window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cancel);if(held)ev.stopPropagation()};const cancel=()=>{cancelled=true;clearTimeout(timer);window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cancel)};window.addEventListener('pointermove',mv,{passive:true});window.addEventListener('pointerup',up,{once:true});window.addEventListener('pointercancel',cancel,{once:true})}
function showDrag(x,yv,label,m){dragTime.textContent=(label?label+' ':'')+fmt(m);dragTime.style.left=Math.min(innerWidth-82,x+12)+'px';dragTime.style.top=Math.max(8,yv-20)+'px';dragTime.classList.add('show')}
function markBlock(id){dirtyBlocks.add(id);updateEditor()}
function beginMove(e,b){if(e.target.closest('.handle'))return;e.preventDefault();e.stopPropagation();const sy=e.clientY,base=b.start_minute,dur=b.end_minute-b.start_minute,threshold=Math.max(34,ppm*30*1.18);let cur=base,last=0,changed=false;const mv=ev=>{ev.preventDefault();const dy=ev.clientY-sy,step=dy<0?Math.ceil(dy/threshold):Math.floor(dy/threshold);if(step===last)return;last=step;let ns=base+step*30;ns=Math.max(0,Math.min(1440-dur,ns));if(ns===cur)return;cur=ns;changed=true;const i=blocks.findIndex(x=>x.id===b.id);blocks[i]={...blocks[i],start_minute:cur,end_minute:cur+dur};renderBlocks();updateEditor();showDrag(ev.clientX,ev.clientY,'',cur)};const done=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',done);window.removeEventListener('pointercancel',done);dragTime.classList.remove('show');if(changed)markBlock(b.id)};window.addEventListener('pointermove',mv,{passive:false});window.addEventListener('pointerup',done,{once:true});window.addEventListener('pointercancel',done,{once:true})}
function beginResize(e,b,edge){e.preventDefault();e.stopPropagation();const sy=e.clientY,bs=b.start_minute,be=b.end_minute,anchor=edge==='start'?be:bs,base=edge==='start'?bs:be,threshold=Math.max(34,ppm*30*1.18);let last=0,changed=false;const mv=ev=>{ev.preventDefault();const dy=ev.clientY-sy,step=dy<0?Math.ceil(dy/threshold):Math.floor(dy/threshold);if(step===last)return;last=step;let v=Math.max(0,Math.min(1440,base+step*30));if(v===anchor)v+=edge==='start'?-30:30;v=Math.max(0,Math.min(1440,v));let ns,ne;if(v<anchor){ns=v;ne=anchor}else{ns=anchor;ne=v}if(ne-ns<30)return;const i=blocks.findIndex(x=>x.id===b.id);blocks[i]={...blocks[i],start_minute:ns,end_minute:ne};changed=true;renderBlocks();updateEditor();showDrag(ev.clientX,ev.clientY,v<anchor?'INICIO':'FIN',v<anchor?ns:ne)};const done=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',done);window.removeEventListener('pointercancel',done);dragTime.classList.remove('show');if(changed)markBlock(b.id)};window.addEventListener('pointermove',mv,{passive:false});window.addEventListener('pointerup',done,{once:true});window.addEventListener('pointercancel',done,{once:true})}
function sliceEl(b,seg,left,width,cycle,showLabel){const first=seg.start===b.start_minute,last=seg.end===b.end_minute,isSelected=selected===b.id,dur=seg.end-seg.start;const el=document.createElement('div');el.className='block'+(dur<=30?' halfhour':'')+(isSelected?' selected':'')+(first?' firstSlice':'')+(last?' lastSlice':'');el.style.top=y(cycle*1440+seg.start)+'px';el.style.height=Math.max(18,y(dur)+1)+'px';el.style.left=(left*100)+'%';el.style.width=(width*100)+'%';const title=b.title||labels[b.kind],same=String(title).toUpperCase()===labels[b.kind],compact=dur<=30&&!same?labels[b.kind]+' · '+title:title,body=showLabel?'<div class="name">'+esc(compact)+'</div><div class="time">'+fmt(b.start_minute)+'–'+fmt(b.end_minute)+'</div>':'';el.innerHTML='<button class="handle top"></button><div class="blockBody">'+body+'</div><button class="handle bottom"></button>';if(isSelected){el.addEventListener('pointerdown',e=>beginMove(e,b));if(first)el.querySelector('.handle.top').addEventListener('pointerdown',e=>beginResize(e,b,'start'));if(last)el.querySelector('.handle.bottom').addEventListener('pointerdown',e=>beginResize(e,b,'end'))}else el.addEventListener('pointerdown',e=>armSelection(e,b));return el}
function beginSplit(e,pair,grip){e.preventDefault();e.stopPropagation();grip.classList.add('active');const rect=eventLayer.getBoundingClientRect();const mv=ev=>{ev.preventDefault();setLayoutLocal(pair.a,pair.b,(ev.clientX-rect.left)/rect.width);renderBlocks()};const done=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',done);window.removeEventListener('pointercancel',done);updateEditor()};window.addEventListener('pointermove',mv,{passive:false});window.addEventListener('pointerup',done,{once:true});window.addEventListener('pointercancel',done,{once:true})}
function renderBlocks(){rendering=true;eventLayer.innerHTML='';const segs=segments(),best=new Map();for(const seg of segs)for(const it of seg.items){const score=(seg.end-seg.start)*it.width,p=best.get(it.b.id);if(!p||score>p.score)best.set(it.b.id,{seg,score})}for(let c=0;c<3;c++)for(const seg of segs){for(const it of seg.items)eventLayer.appendChild(sliceEl(it.b,seg,it.left,it.width,c,best.get(it.b.id)?.seg===seg));if(seg.pair){const g=document.createElement('div');g.className='splitGrip';g.style.top=y(c*1440+seg.start)+'px';g.style.height=Math.max(18,y(seg.end-seg.start))+'px';g.style.left=(seg.pair.ratio*100)+'%';g.addEventListener('pointerdown',e=>beginSplit(e,seg.pair,g));eventLayer.appendChild(g)}}requestAnimationFrame(()=>rendering=false)}
eventLayer.addEventListener('click',e=>{if(e.target===eventLayer){selected=null;layoutSelection=null;renderBlocks();updateEditor()}});

function addSample(kind){palette.classList.remove('open');const dur=kind==='page'?60:30,start=Math.floor(nowMin()/30)*30,s=samples[kind],id='tmp-'+Date.now().toString(36);blocks.push({id,title:s.title,kind,start_minute:start,end_minute:start+dur,payload:s.payload,enabled:true});selected=id;dirtyBlocks.add(id);renderBlocks();updateEditor()}
function addYT(channelId,label){
  palette.classList.remove('open');
  const v=ytLatest.get(channelId);
  const fallback={title:label||'YOUTUBE',watch_url:'https://www.youtube.com/watch?v=J1WoNuemKOg'};
  const picked=v||fallback,start=Math.floor(nowMin()/30)*30,id='tmp-'+Date.now().toString(36);
  blocks.push({id,title:(v?.channel_title||label||'YOUTUBE').toUpperCase(),kind:'youtube',start_minute:start,end_minute:start+60,payload:{url:picked.watch_url},enabled:true});
  selected=id;dirtyBlocks.add(id);renderBlocks();updateEditor()
}
$('add').onclick=()=>palette.classList.toggle('open');
document.querySelectorAll('.tool[data-kind]').forEach(b=>b.onclick=()=>addSample(b.dataset.kind));
document.querySelectorAll('.ytPreset').forEach(b=>b.onclick=()=>addYT(b.dataset.channel,b.querySelector('span')?.textContent||'YOUTUBE'));

function remapLayouts(map){layouts=layouts.map(l=>({ ...l,block_a:map.get(String(l.block_a))||l.block_a,block_b:map.get(String(l.block_b))||l.block_b})).map(l=>{const [a,b]=pairIds(l.block_a,l.block_b);return{...l,block_a:a,block_b:b}})}
async function saveAll(){
 if(!hasDraft()||saving)return;saving=true;updateEditor();const idMap=new Map();
 try{
   for(const id of [...pendingDeletes])if(!String(id).startsWith('tmp-'))await api({action:'delete',id});
   for(const id of [...dirtyBlocks]){
     if(pendingDeletes.has(id))continue;
     const b=blocks.find(x=>x.id===id);if(!b)continue;
     const d=await api({action:'save',id:String(id).startsWith('tmp-')?'':id,title:b.title||labels[b.kind],kind:b.kind,start_minute:b.start_minute,end_minute:b.end_minute,payload:b.payload||{}});
     if(String(id).startsWith('tmp-')){idMap.set(String(id),d.block.id);const i=blocks.findIndex(x=>x.id===id);if(i>=0)blocks[i]={...blocks[i],...d.block};if(selected===id)selected=d.block.id}
   }
   if(idMap.size)remapLayouts(idMap);
   const keys=new Set([...dirtyLayouts].map(k=>{const [a,b]=k.split('|');return layoutKey(idMap.get(a)||a,idMap.get(b)||b)}));
   for(const k of keys){const [a,b]=k.split('|'),l=layoutFor(a,b);await api({action:'layout_save',block_a:a,block_b:b,ratio:l.ratio})}
   dirtyBlocks.clear();dirtyLayouts.clear();pendingDeletes.clear();
   await syncServer(true);toast('APLICADO EN TV')
 }catch(e){toast(String(e.message||e))}
 saving=false;updateEditor()
}
function cancelAll(){blocks=clone(serverBlocks);layouts=clone(serverLayouts);dirtyBlocks.clear();dirtyLayouts.clear();pendingDeletes.clear();selected=null;layoutSelection=null;renderBlocks();updateEditor()}
$('save').onclick=saveAll;$('cancel').onclick=cancelAll;$('delete').onclick=()=>{if(!selected)return;const id=selected;if(String(id).startsWith('tmp-'))blocks=blocks.filter(b=>b.id!==id);else{pendingDeletes.add(id);blocks=blocks.filter(b=>b.id!==id)}dirtyBlocks.delete(id);selected=null;renderBlocks();updateEditor()};

async function syncServer(initial=false){if(hasDraft()&&!initial)return;try{const d=await api({action:'list'});serverBlocks=clone(d.blocks||[]);serverLayouts=clone(d.layouts||[]);if(!hasDraft()){blocks=clone(serverBlocks);layouts=clone(serverLayouts);cache();renderBlocks()}if(initial&&!loaded){loaded=true;requestAnimationFrame(scrollInitial)}}catch(e){if(initial)toast(String(e.message||e))}}
try{const c=JSON.parse(localStorage.getItem(cacheKey)||'null');if(c&&Array.isArray(c.blocks)){serverBlocks=clone(c.blocks);serverLayouts=clone(c.layouts||[]);blocks=clone(serverBlocks);layouts=clone(serverLayouts);loaded=true}}catch{}
function layout(){measure();grid();renderBlocks();updateNow()}
layout();loadYTPresets();requestAnimationFrame(()=>{if(loaded)scrollInitial();syncServer(true)});setInterval(updateNow,15000);setInterval(()=>syncServer(false),30000);window.addEventListener('resize',layout);
})();
</script>
