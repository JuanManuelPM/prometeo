<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090909">
<title>TV · horario</title>
<style>
:root{--bg:#090909;--fg:#f4f3ee;--muted:#7f7f79;--line:#2b2b28;--now:#ff3b30}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit}
.app{min-height:100dvh;background:var(--bg)}
.top{position:sticky;top:0;z-index:60;background:#090909f2;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topInner{max-width:760px;margin:auto;padding:8px 10px}
.mainRow{height:40px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.addBtn{height:34px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);padding:0 12px;font-size:10px;font-weight:900;letter-spacing:.08em}
.nowTop{font:900 13px ui-monospace,SFMono-Regular,Menlo,monospace}
.room{font:700 7px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);margin-top:1px;text-align:right}
.palette{display:grid;grid-template-rows:0fr;transition:grid-template-rows .16s ease}
.palette.open{grid-template-rows:1fr}
.paletteInner{overflow:hidden}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding-top:0;opacity:0;transform:translateY(-5px);transition:.16s ease}
.palette.open .tools{padding-top:7px;opacity:1;transform:none}
.tool{height:48px;border:1px solid #3d3d39;background:#11110f;padding:0 8px;text-align:left}
.tool strong{display:block;font-size:10px;font-weight:900}.tool span{display:block;font-size:8px;color:var(--muted);margin-top:3px}
.tool:active{background:var(--fg);color:var(--bg)}.tool:active span{color:#333}
.viewport{max-width:760px;margin:auto;position:relative;height:calc(100dvh - 57px);overflow:auto;overscroll-behavior:contain;scrollbar-width:none}
.viewport::-webkit-scrollbar{display:none}
.day{position:relative;width:100%}
.hour{position:absolute;left:50px;right:0;height:1px;background:var(--line)}
.hourLabel{position:absolute;left:-48px;top:-11px;width:42px;text-align:right;font:900 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#f1efe8;background:var(--bg);padding-right:6px}
.half{position:absolute;left:50px;right:0;height:1px;background:#171714}
.layer{position:absolute;inset:0}
.block{position:absolute;left:58px;right:8px;min-height:26px;background:var(--fg);color:var(--bg);border:0;overflow:hidden;user-select:none;touch-action:none;transition:top .12s cubic-bezier(.2,.8,.2,1),height .12s cubic-bezier(.2,.8,.2,1),outline-color .12s ease}
.block.selected{outline:2px solid var(--now);outline-offset:2px}
.block.fresh{animation:pulseEdge .8s ease-in-out infinite}
@keyframes pulseEdge{0%,100%{box-shadow:0 0 0 0 #ff3b3000}50%{box-shadow:0 0 0 3px #ff3b30}}
.blockBody{position:absolute;inset:0;padding:6px 28px 6px 8px;text-align:left}
.kind{font-size:7px;font-weight:900;letter-spacing:.14em;opacity:.48}
.name{font-size:14px;font-weight:900;line-height:1;letter-spacing:-.03em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font:800 8px ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.58;margin-top:4px}
.moveMark{position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:18px;font-weight:900;opacity:.55}
.nowLine{position:absolute;left:48px;right:0;height:2px;background:var(--now);z-index:35;pointer-events:none}
.nowDot{position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.nowLabel{position:absolute;left:-44px;top:-13px;background:var(--now);color:#fff;padding:2px 4px;font:900 8px ui-monospace,monospace}
.dragTime{position:fixed;z-index:125;pointer-events:none;background:var(--now);color:#fff;padding:4px 6px;font:900 10px ui-monospace,monospace;display:none}
.dragTime.show{display:block}
.inspector{position:fixed;left:50%;bottom:10px;z-index:80;transform:translateX(-50%) translateY(120%);width:min(430px,calc(100% - 18px));background:#11110ff3;border:1px solid #3b3b37;backdrop-filter:blur(14px);padding:7px;display:grid;grid-template-columns:54px 1fr 54px 64px;gap:6px;transition:transform .16s ease}
.inspector.show{transform:translateX(-50%) translateY(0)}
.inspector button{height:42px;border:1px solid #3b3b37;background:#171714;font-size:11px;font-weight:900}
.inspector .dur{display:grid;place-items:center;border:1px solid #3b3b37;font:900 10px ui-monospace,monospace}
.inspector .delete{font-size:8px;letter-spacing:.04em}
.toast{position:fixed;z-index:140;left:50%;bottom:70px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 12px;font-size:9px;font-weight:900;display:none;white-space:nowrap}.toast.show{display:block}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="topInner">
      <div class="mainRow">
        <button id="addBtn" class="addBtn">+ AGREGAR</button>
        <div><div id="nowTop" class="nowTop">--:--</div><div id="room" class="room">—</div></div>
      </div>
      <div id="palette" class="palette"><div class="paletteInner"><div class="tools">
        <button class="tool" data-kind="youtube"><strong>YOUTUBE</strong><span>ejemplo · Veritasium</span></button>
        <button class="tool" data-kind="clock"><strong>RELOJ</strong><span>reloj animado</span></button>
        <button class="tool" data-kind="page"><strong>PÁGINA</strong><span>ejemplo · Calendario</span></button>
        <button class="tool" data-kind="black"><strong>NEGRO</strong><span>pantalla vacía</span></button>
      </div></div></div>
    </div>
  </header>

  <main id="viewport" class="viewport">
    <section id="day" class="day">
      <div id="grid"></div>
      <div id="layer" class="layer"></div>
      <div id="nowLine" class="nowLine"><span class="nowDot"></span><span id="nowLabel" class="nowLabel">--:--</span></div>
    </section>
  </main>
</div>

<div id="inspector" class="inspector">
  <button id="less">−30</button>
  <div id="dur" class="dur">30 min</div>
  <button id="more">+30</button>
  <button id="delete" class="delete">BORRAR</button>
</div>

<div id="dragTime" class="dragTime">--:--</div>
<div id="toast" class="toast"></div>

<script>
(()=>{
'use strict';
const API='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/tv-schedule-v1';
const params=new URLSearchParams(location.hash.slice(1));
const room={code:params.get('room')||'',token:params.get('t')||'',role:'remote'};
const client='timeline-v3-'+Math.random().toString(36).slice(2,9);
const $=id=>document.getElementById(id);
const viewport=$('viewport'),day=$('day'),layer=$('layer'),palette=$('palette'),inspector=$('inspector'),dragTime=$('dragTime');
const labels={youtube:'YOUTUBE',clock:'RELOJ',page:'PÁGINA',black:'NEGRO'};
const samples={
  youtube:{title:'VERITASIUM',payload:{url:'https://www.youtube.com/watch?v=J1WoNuemKOg'}},
  page:{title:'CALENDARIO',payload:{url:'https://juanmanuelpm.github.io/prometeo/experiments/tv-split-v1-sample-calendar.html'}},
  clock:{title:'RELOJ',payload:{}},
  black:{title:'NEGRO',payload:{}}
};
let blocks=[],selected=null,freshId=null,ppm=1,loaded=false,lastHaptic=null;

function measure(){ppm=Math.max(.58,viewport.clientHeight/(12*60));day.style.height=(1440*ppm)+'px'}
function y(m){return Number(m)*ppm}
function snap30(m){return Math.max(0,Math.min(1440,Math.round(m/30)*30))}
function floor30(m){return Math.max(0,Math.min(1410,Math.floor(m/30)*30))}
function fmt(m){if(m>=1440)return'24:00';m=Math.max(0,Math.min(1439,Number(m)||0));return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ba(){const ps=new Intl.DateTimeFormat('en-GB',{timeZone:'America/Argentina/Buenos_Aires',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const get=t=>Number(ps.find(x=>x.type===t)?.value||0);return{h:get('hour'),m:get('minute')}}
function nowMin(){const n=ba();return n.h*60+n.m}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),1400)}
async function api(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:room.code,role:'remote',token:room.token,client_id:client,...body}),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'ERROR');return d}
async function load(){try{const d=await api({action:'list'});blocks=d.blocks||[];renderBlocks();if(!loaded){loaded=true;requestAnimationFrame(scrollAroundNow)}}catch(e){toast(String(e.message||e))}}
function grid(){const g=$('grid');g.innerHTML='';for(let h=0;h<=24;h++){const a=document.createElement('div');a.className='hour';a.style.top=y(h*60)+'px';if(h<24)a.innerHTML='<span class="hourLabel">'+String(h).padStart(2,'0')+':00</span>';g.appendChild(a);if(h<24){const b=document.createElement('div');b.className='half';b.style.top=y(h*60+30)+'px';g.appendChild(b)}}}
function updateNow(){const n=ba(),m=n.h*60+n.m;$('nowTop').textContent=fmt(m);$('nowLabel').textContent=fmt(m);$('nowLine').style.top=y(m)+'px'}
function scrollAroundNow(){viewport.scrollTop=Math.max(0,y(nowMin()-5.5*60))}
function select(id){selected=id;renderBlocks();renderInspector()}
function renderInspector(){const b=blocks.find(x=>x.id===selected);inspector.classList.toggle('show',!!b);if(b)$('dur').textContent=(b.end_minute-b.start_minute)+' min'}
function blockEl(b){const el=document.createElement('div');el.className='block'+(selected===b.id?' selected':'')+(freshId===b.id?' fresh':'');el.dataset.id=b.id;el.style.top=y(b.start_minute)+'px';el.style.height=Math.max(26,y(b.end_minute-b.start_minute))+'px';el.innerHTML='<div class="blockBody"><div class="kind">'+labels[b.kind]+'</div><div class="name">'+esc(b.title||labels[b.kind])+'</div><div class="time">'+fmt(b.start_minute)+' — '+fmt(b.end_minute)+'</div></div><div class="moveMark">↕</div>';el.addEventListener('pointerdown',e=>beginBlockDrag(e,b,el));el.addEventListener('click',e=>{e.stopPropagation();select(b.id)});return el}
function renderBlocks(){layer.innerHTML='';for(const b of blocks.slice().sort((a,b)=>a.start_minute-b.start_minute))layer.appendChild(blockEl(b));renderInspector()}
day.addEventListener('click',()=>select(null));

function showDragTime(clientX,clientY,m){dragTime.textContent=fmt(m);dragTime.style.left=Math.min(window.innerWidth-58,clientX+12)+'px';dragTime.style.top=Math.max(8,clientY-22)+'px';dragTime.classList.add('show')}
function vibrate(slot){if(slot===lastHaptic)return;lastHaptic=slot;try{navigator.vibrate?.(8)}catch{}}
function setPreview(el,start,end){el.style.top=y(start)+'px';el.style.height=Math.max(26,y(end-start))+'px';const t=el.querySelector('.time');if(t)t.textContent=fmt(start)+' — '+fmt(end)}
function beginBlockDrag(e,b,el){
  if(e.button!==undefined&&e.button!==0)return;
  e.preventDefault();e.stopPropagation();select(b.id);
  const startY=e.clientY,base=b.start_minute,dur=b.end_minute-b.start_minute;
  const threshold=Math.max(24,y(30));
  let current=base,moved=false,lastStep=0;
  const move=ev=>{
    ev.preventDefault();
    const dy=ev.clientY-startY;
    const step=dy<0?Math.ceil(dy/threshold):Math.floor(dy/threshold);
    if(step!==lastStep){
      lastStep=step;
      let next=base+step*30;next=Math.max(0,Math.min(1440-dur,next));
      if(next!==current){current=next;moved=true;setPreview(el,current,current+dur);showDragTime(ev.clientX,ev.clientY,current);vibrate(current)}
    }
  };
  const up=async()=>{
    window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);dragTime.classList.remove('show');lastHaptic=null;
    if(!moved){renderBlocks();return}
    try{
      await api({action:'save',id:b.id,title:b.title||labels[b.kind],kind:b.kind,start_minute:current,end_minute:current+dur,payload:b.payload||{}});
      freshId=null;await load();
    }catch(err){toast(err.message==='TIME_OVERLAP'?'Ese horario ya está ocupado.':String(err.message||err));await load()}
  };
  window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',up,{once:true});
}

function overlaps(start,end,ignore=''){return blocks.some(b=>b.id!==ignore&&start<b.end_minute&&end>b.start_minute)}
function nearestFree(start,dur){
  start=floor30(start);
  if(!overlaps(start,start+dur)&&start+dur<=1440)return start;
  for(let d=30;d<=720;d+=30){
    const a=start+d;if(a+dur<=1440&&!overlaps(a,a+dur))return a;
    const b=start-d;if(b>=0&&!overlaps(b,b+dur))return b;
  }
  return start;
}
async function addSample(kind){
  palette.classList.remove('open');
  const dur=(kind==='youtube'||kind==='page')?60:30;
  const start=nearestFree(nowMin(),dur),s=samples[kind];
  try{
    const d=await api({action:'save',title:s.title,kind,start_minute:start,end_minute:start+dur,payload:s.payload});
    freshId=d.block?.id||null;selected=freshId;await load();
    const b=blocks.find(x=>x.id===freshId);if(b){viewport.scrollTo({top:Math.max(0,y(b.start_minute)-viewport.clientHeight*.42),behavior:'smooth'})}
    setTimeout(()=>{if(freshId===selected){freshId=null;renderBlocks()}},8000);
  }catch(e){toast(e.message==='TIME_OVERLAP'?'Ese horario ya está ocupado.':String(e.message||e))}
}
async function resizeSelected(delta){
  const b=blocks.find(x=>x.id===selected);if(!b)return;
  const next=Math.max(b.start_minute+30,Math.min(1440,b.end_minute+delta));
  try{await api({action:'save',id:b.id,title:b.title||labels[b.kind],kind:b.kind,start_minute:b.start_minute,end_minute:next,payload:b.payload||{}});freshId=null;await load()}
  catch(e){toast(e.message==='TIME_OVERLAP'?'No entra: choca con otro bloque.':String(e.message||e))}
}
$('less').onclick=()=>resizeSelected(-30);$('more').onclick=()=>resizeSelected(30);$('delete').onclick=async()=>{if(!selected)return;try{await api({action:'delete',id:selected});selected=null;freshId=null;await load()}catch(e){toast(String(e.message||e))}};
$('addBtn').onclick=()=>palette.classList.toggle('open');
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>addSample(b.dataset.kind));

$('room').textContent=room.code||'sin sala';
function layout(){measure();grid();renderBlocks();updateNow()}
layout();load();setInterval(updateNow,15000);
window.addEventListener('resize',layout);
})();
</script>
</body>
</html>
