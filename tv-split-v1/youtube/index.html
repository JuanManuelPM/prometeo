<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>YouTube · TV</title>
<style>
:root{--bg:#050505;--fg:#f5f3ec;--muted:#77766f;--line:#242421;--soft:#11110f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.app{width:min(820px,100%);min-height:100dvh;margin:auto;padding:0 14px calc(92px + env(safe-area-inset-bottom))}
.head{position:sticky;top:0;z-index:30;background:#050505f3;backdrop-filter:blur(14px)}
.headline{height:56px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center}
.icon{width:48px;height:48px;border:0;background:transparent;padding:0;font-weight:900;touch-action:manipulation}.icon.left{text-align:left;font-size:18px}.icon.right{text-align:right;font-size:9px;letter-spacing:.08em}
.brand{text-align:center;font-size:13px;font-weight:900;letter-spacing:.12em}
.search{height:46px;display:flex;align-items:center;border-bottom:1px solid #3b3b35}
.search input{flex:1;min-width:0;height:45px;border:0;background:transparent;outline:none;padding:0;font-size:15px}
.search input::placeholder{color:#686861}
.search button{width:44px;height:44px;border:0;background:transparent;padding:0;font-size:16px;touch-action:manipulation}
.searchClear{display:none;color:var(--muted)}.search.hasText .searchClear{display:block}
.tabs{position:fixed;z-index:55;left:0;right:0;bottom:0;min-height:64px;padding:0 max(8px,env(safe-area-inset-left)) env(safe-area-inset-bottom) max(8px,env(safe-area-inset-right));display:flex;align-items:stretch;background:#050505f5;backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tab{flex:1;min-width:0;min-height:60px;border:0;background:transparent;color:var(--muted);padding:8px 4px 7px;font-size:10px;font-weight:900;touch-action:manipulation}
.tab.active{color:var(--fg)}
.tab:active,.icon:active,.textBtn:active,.addTiny:active,.more:active,.channelTap:active,.qmore:active,.folderBack:active,.folderMore:active,.primaryText:active,.sheetRow:active{opacity:.55}
.pane{display:none}.pane.active{display:block}.searchPane{display:none}.searchPane.open{display:block}.searchPane.open~.pane{display:none!important}
.summary{display:none}
.sourceRail{display:flex;gap:4px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;scrollbar-width:none;padding:8px 0 2px;margin:0 -14px;padding-left:14px;padding-right:14px}
.sourceRail::-webkit-scrollbar{display:none}
.sourceItem{flex:0 0 auto;min-width:64px;max-width:96px;min-height:62px;border:0;background:transparent;color:var(--muted);padding:5px 6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;scroll-snap-align:start;touch-action:manipulation}
.sourceItem.active{color:var(--fg)}
.sourceAvatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#171715}
.sourceFolder{width:36px;height:28px;display:grid;place-items:end center;border-bottom:2px solid currentColor;font-size:8px;font-weight:900}
.sourceLabel{width:100%;font-size:7px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.sourceItem.active .sourceLabel{text-decoration:underline;text-underline-offset:4px}
.folderSwitch{display:flex;gap:22px;min-height:50px;align-items:end;border-bottom:1px solid var(--line);margin-bottom:2px}
.folderSwitch button{min-height:48px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:0 0 10px;font-size:10px;font-weight:900;touch-action:manipulation}
.folderSwitch button.active{color:var(--fg);border-bottom-color:var(--fg)}
.folderCrumb{min-height:48px;border:0;background:transparent;padding:0;color:var(--muted);font-size:9px;font-weight:900;text-align:left;touch-action:manipulation}
.libraryHeader{padding:18px 0 4px}.libraryHeader h1{margin:0;font-size:24px;letter-spacing:-.04em}
.section{display:flex;align-items:end;justify-content:space-between;gap:12px;padding:20px 0 8px}
.section h2{margin:0;font-size:19px;line-height:1;font-weight:900;letter-spacing:-.03em}
.textBtn{min-width:44px;min-height:44px;border:0;background:transparent;padding:0 8px;color:var(--fg);font-size:10px;font-weight:900;touch-action:manipulation}
.now{padding:16px 0 10px;display:grid;grid-template-columns:128px minmax(0,1fr);gap:13px;align-items:center}
.now.empty{display:block;color:var(--muted);font-size:9px;padding:22px 0}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#111;display:block}.now .thumb{width:128px}
.eyebrow{font-size:6px;color:var(--muted);font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.title{margin-top:5px;font-size:12px;font-weight:900;line-height:1.23}.meta{margin-top:5px;font-size:7px;color:var(--muted)}
.list{border-top:1px solid var(--line)}
.video{display:grid;grid-template-columns:112px minmax(0,1fr) 32px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.video .thumb{width:112px}.addTiny{width:48px;height:48px;border:0;background:transparent;padding:0;font-size:22px;font-weight:900;touch-action:manipulation}
.folder{min-height:80px;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:0}
.folderName{font-size:15px;font-weight:900}.folderMeta{margin-top:5px;font-size:7px;color:var(--muted)}
.folderRight{display:flex;align-items:center;gap:11px}.faces{display:flex;padding-left:10px}.face{width:33px;height:33px;border-radius:50%;object-fit:cover;background:#161615;border:2px solid var(--bg);margin-left:-8px}
.more{width:48px;height:48px;border:0;background:transparent;padding:0;color:var(--muted);font-size:19px;touch-action:manipulation}
.sync{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:7px;vertical-align:1px;background:#6f6e68;opacity:0}
.sync.saving{opacity:1;animation:pulse .8s infinite alternate}.sync.error{opacity:1;background:#f0ede4;animation:none}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
.inlineName{width:min(320px,78vw);border:0;border-bottom:1px solid var(--fg);background:transparent;outline:none;padding:3px 0;font-size:15px;font-weight:900}
.folderTop{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;padding:12px 0 6px}.folderBack{width:48px;height:48px;border:0;background:transparent;padding:0;text-align:left;font-size:18px;touch-action:manipulation}.folderTitle{font-size:22px;font-weight:900;letter-spacing:-.03em}.folderMore{width:48px;height:48px;border:0;background:transparent;padding:0;color:var(--muted);font-size:19px;touch-action:manipulation}
.channel{min-height:67px;display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:9px 0}
.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#151514}.channelName{font-size:11px;font-weight:900}.channelSub{margin-top:5px;font-size:7px;color:var(--muted)}
.channelTap{width:48px;height:48px;border:0;background:transparent;padding:0;color:var(--muted);font-size:19px;touch-action:manipulation}
.queueRow{min-height:82px;display:grid;grid-template-columns:48px 92px minmax(0,1fr) 48px;gap:9px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0;background:var(--bg)}
.queueRow.dragging{position:fixed!important;z-index:1000;margin:0;border:1px solid #3d3c37;box-shadow:0 14px 34px #000b;pointer-events:none;opacity:.96}
.queuePlaceholder{border-bottom:1px solid var(--line);background:#0b0b0a}
.queueRow .thumb{width:92px}.drag{width:48px;height:56px;display:grid;place-items:center;color:#aaa89f;font-size:18px;font-weight:900;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}.drag:active{cursor:grabbing;color:var(--fg)}.qmore{width:48px;height:48px;border:0;background:transparent;padding:0;color:var(--muted);font-size:19px;touch-action:manipulation}
.history{padding:11px 0;border-bottom:1px solid var(--line)}.history .title{margin:0;font-size:10px}
.resultChannel{min-height:71px;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.resultType{font-size:6px;color:var(--muted);font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.primaryText{min-width:52px;min-height:48px;border:0;background:transparent;padding:0 8px;font-size:10px;font-weight:900;touch-action:manipulation}
.empty,.loading{padding:27px 0;color:var(--muted);font-size:9px;line-height:1.5}
.sheet{position:fixed;z-index:70;inset:0;background:#0009;display:none;align-items:flex-end}.sheet.open{display:flex}
.sheetPanel{width:100%;max-width:820px;max-height:88dvh;overflow:auto;margin:auto;background:#0a0a09;border-top:1px solid #34342f;padding:10px 14px calc(18px + env(safe-area-inset-bottom))}
.sheetHead{position:sticky;top:0;background:#0a0a09;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 12px;z-index:2}
.sheetTitle{font-size:15px;font-weight:900}.sheetClose{min-width:52px;height:48px;border:0;background:transparent;padding:0 8px;font-size:10px;font-weight:900;touch-action:manipulation}
.sheetRow{width:100%;min-height:56px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;padding:0 4px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:11px;font-weight:900;touch-action:manipulation}
.pickChannel{min-height:72px;border-top:1px solid var(--line);display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:10px;align-items:center;touch-action:manipulation}
.pickerActions{position:sticky;bottom:-18px;background:#0a0a09;padding:10px 0 0}
.pickerNew{width:100%;min-height:54px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;padding:0;font-size:11px;font-weight:900;touch-action:manipulation}
.searchContext{display:none;padding:10px 0;border-bottom:1px solid var(--line);font-size:9px;font-weight:900;color:var(--muted)}
.searchContext.show{display:flex;align-items:center;justify-content:space-between;gap:12px}.searchContext button{width:44px;height:44px;border:0;background:transparent;color:var(--fg);font-size:18px}
.pickChannel .avatar{width:42px;height:42px}.check{width:22px;height:22px;border:1px solid #56554f;display:grid;place-items:center;font-size:12px}.check.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.snack{position:fixed;z-index:90;left:50%;bottom:18px;transform:translateX(-50%);display:none;align-items:center;gap:18px;background:var(--fg);color:var(--bg);padding:10px 12px;font-size:9px;font-weight:900}.snack.show{display:flex}.snack button{border:0;background:transparent;color:var(--bg);padding:0;font:inherit;text-decoration:underline}
.toast{position:fixed;z-index:95;left:50%;top:12px;transform:translateX(-50%);display:none;background:var(--fg);color:var(--bg);padding:8px 10px;font-size:8px;font-weight:900}.toast.show{display:block}
@media(max-width:520px){.app{padding-left:12px;padding-right:12px}.video{grid-template-columns:94px minmax(0,1fr) 48px}.video .thumb{width:94px}.queueRow{grid-template-columns:48px 72px minmax(0,1fr) 48px}.queueRow .thumb{width:72px}.now{grid-template-columns:90px minmax(0,1fr)}.now .thumb{width:90px}}
</style>
</head>
<body>
<main class="app">
<header class="head">
<div class="headline"><button id="back" class="icon left">←</button><div class="brand">YOUTUBE</div><button id="tv" class="icon right">TV</button></div>
<div id="searchWrap" class="search"><input id="search" autocomplete="off" placeholder="Buscar en YouTube"><button id="searchClear" class="searchClear">×</button><button id="searchGo">⌕</button></div>
</header>
<section id="searchPane" class="searchPane"><div id="searchContext" class="searchContext"></div><div id="resultList"></div></section>
<section id="home" class="pane active"><div id="summary" class="summary"></div><div id="nowWrap"></div><div id="homeSources" class="sourceRail" aria-label="Filtrar recientes"></div><div class="section"><h2 id="recentTitle">Recientes</h2></div><div id="recentList" class="list"></div></section>
<section id="channels" class="pane"><div id="channelRoot"></div></section>
<section id="queue" class="pane"><div class="section"><h2>Cola</h2></div><div id="queueList" class="list"></div></section>
<section id="history" class="pane"><div class="section"><h2>Vistos</h2></div><div id="historyList" class="list"></div></section>
</main>
<nav class="tabs" aria-label="Navegación de YouTube"><button class="tab active" data-tab="home">Inicio</button><button class="tab" data-tab="channels">Canales</button><button class="tab" data-tab="queue">Cola</button><button class="tab" data-tab="history">Vistos</button></nav>
<section id="sheet" class="sheet"><div class="sheetPanel"><div class="sheetHead"><div id="sheetTitle" class="sheetTitle"></div><button id="sheetClose" class="sheetClose">LISTO</button></div><div id="sheetBody"></div></div></section>
<div id="snack" class="snack"><span id="snackText"></span><button id="snackAction"></button></div>
<div id="toast" class="toast"></div>
<script>
(()=>{
'use strict';
const API='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/tv-schedule-v1';
const MEDIA='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/prometeo-tv-media-v1';
const CANONICAL='https://juanmanuelpm.github.io/prometeo/tv/canonical.json';
const q=new URLSearchParams(location.hash.slice(1));
const DEFAULT_ROOM='TV-PM2K7Q',DEFAULT_REMOTE='1f1a186a7bdc6aa3c9bfbf2016fed69d6b6cbf3066fab5ad8e122e25aa45c63e',DEFAULT_MEDIA='NZT8S9zPPRuTdUQUZK20jEvA-Nly6Ck4HUImnPuBsgQ';
const room={code:q.get('room')||DEFAULT_ROOM,token:q.get('t')||DEFAULT_REMOTE},mediaToken=q.get('k')||DEFAULT_MEDIA;
const client='yt-global-v7-'+Math.random().toString(36).slice(2,9),$=id=>document.getElementById(id);
let library={channels:[],folders:[],state:{queue:[],current_index:0,current_video_id:''},watched_count:0},watchHistory=[],recent=[],searchResults=[],openFolder='',folderView='recent',homeScope={type:'all',id:''},targetFolder='',searchTimer=0,folderSyncTimer=0,pendingDelete=null;

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function img(s){const x=String(s||'');return x.startsWith('//')?'https:'+x:x}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1000)}
function snack(text,action,fn,ms=5000){const s=$('snack');$('snackText').textContent=text;$('snackAction').textContent=action||'';$('snackAction').style.display=action?'block':'none';$('snackAction').onclick=()=>{clearTimeout(snack.t);s.classList.remove('show');fn?.()};s.classList.add('show');clearTimeout(snack.t);snack.t=setTimeout(()=>{s.classList.remove('show');if(!action)fn?.()},ms)}
async function api(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:room.code,role:'remote',token:room.token,client_id:client,...body}),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'ERROR');return d}
async function media(body){const r=await fetch(MEDIA,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:mediaToken,...body}),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.message||d.error||'YOUTUBE_ERROR');return d.result}
function video(v){const id=String(v?.video_id||'');return {video_id:id,title:String(v?.title||'YouTube'),channel_id:String(v?.channel_id||''),channel_title:String(v?.channel_title||v?.channel||''),thumbnail:img(v?.thumbnail||('https://i.ytimg.com/vi/'+id+'/mqdefault.jpg')),watch_url:String(v?.watch_url||('https://www.youtube.com/watch?v='+id)),published_at:v?.published_at||''}}
function applyServer(lib){library={channels:lib.channels||library.channels,folders:lib.folders||library.folders,state:lib.state||library.state,watched_count:Number(lib.watched_count??library.watched_count??0)}}
function selectTab(name){closeSheet();closeSearch(false);openFolder='';folderView='recent';window.history.replaceState({yt:'root'},'');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active',x.id===name));if(name==='channels')renderChannels();if(name==='home'){renderHomeSources();renderRecent()}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>selectTab(b.dataset.tab));

function currentVideo(){const list=library.state.queue||[],i=Math.max(0,Number(library.state.current_index)||0);return list[i]||null}
function renderSummary(){$('summary').textContent=library.channels.length+' canales · '+(library.state.queue||[]).length+' en cola · '+Number(library.watched_count||watchHistory.length||0)+' vistos'}
function renderNow(){const root=$('nowWrap'),v=currentVideo();root.innerHTML=v?'<div class="now"><img class="thumb" src="'+esc(img(v.thumbnail))+'" alt=""><div><div class="eyebrow">Ahora</div><div class="title">'+esc(v.title)+'</div><div class="meta">'+esc(v.channel_title||'YouTube')+'</div></div></div>':'<div class="now empty">La cola está vacía.</div>'}
function videoRow(raw){const v=video(raw),row=document.createElement('div');row.className='video';row.innerHTML='<img class="thumb" src="'+esc(v.thumbnail)+'" alt=""><div><div class="title">'+esc(v.title)+'</div><div class="meta">'+esc(v.channel_title||'YouTube')+'</div></div><button class="addTiny">＋</button>';row.querySelector('.addTiny').onclick=()=>addToQueue(v);return row}
function scopeLabel(){
  if(homeScope.type==='folder')return folderById(homeScope.id)?.name||'Carpeta';
  if(homeScope.type==='channel')return library.channels.find(c=>c.channel_id===homeScope.id)?.title||'Canal';
  return 'Recientes';
}
function scopedRecent(scope=homeScope){
  if(scope.type==='all')return recent;
  if(scope.type==='channel')return recent.filter(v=>String(v.channel_id||'')===String(scope.id));
  if(scope.type==='folder'){
    const ids=new Set(folderChannels(scope.id).map(c=>String(c.channel_id)));
    return recent.filter(v=>ids.has(String(v.channel_id||'')));
  }
  return recent;
}
function setHomeScope(type,id=''){
  homeScope={type,id};
  renderHomeSources();renderRecent();
}
function renderHomeSources(){
  const root=$('homeSources');if(!root)return;root.innerHTML='';
  if(homeScope.type==='folder'&&!folderById(homeScope.id))homeScope={type:'all',id:''};
  if(homeScope.type==='channel'&&!library.channels.some(c=>c.channel_id===homeScope.id))homeScope={type:'all',id:''};
  const add=(type,id,label,visual)=>{
    const b=document.createElement('button');b.className='sourceItem'+(homeScope.type===type&&String(homeScope.id)===String(id)?' active':'');
    b.innerHTML=visual+'<span class="sourceLabel">'+esc(label)+'</span>';
    b.onclick=()=>setHomeScope(type,id);root.appendChild(b)
  };
  add('all','','Todos','<div class="sourceFolder">TODO</div>');
  for(const f of library.folders)add('folder',f.id,f.name,'<div class="sourceFolder">'+folderChannels(f.id).length+'</div>');
  for(const c of library.channels)add('channel',c.channel_id,c.title||'Canal',channelAvatar(c)?'<img class="sourceAvatar" src="'+esc(channelAvatar(c))+'" alt="">':'<div class="sourceAvatar"></div>');
}
function renderRecent(){
  const root=$('recentList'),items=scopedRecent();root.innerHTML='';
  $('recentTitle').textContent=homeScope.type==='all'?'Recientes':scopeLabel();
  if(!items.length){root.innerHTML='<div class="empty">No hay videos recientes para esta selección.</div>';return}
  items.forEach(v=>root.appendChild(videoRow(v)))
}

async function persistQueue(snapshot,keep){try{const d=await api({action:'youtube_queue_set',queue:(library.state.queue||[]).map(video),keep_current:keep||library.state.current_video_id||''});library.state=d.state||library.state;renderQueue();renderNow();renderSummary()}catch(e){library.state=snapshot;renderQueue();renderNow();renderSummary();toast('No se pudo guardar')}}
function addToQueue(v){const x=video(v),list=(library.state.queue||[]).map(video);if(list.some(y=>y.video_id===x.video_id)){toast('Ya está en la cola');return}const snapshot=structuredClone(library.state);library.state.queue=[...list,x];renderQueue();renderSummary();persistQueue(snapshot,snapshot.current_video_id);toast('Agregado')}
function removeQueue(i){const snapshot=structuredClone(library.state),list=(library.state.queue||[]).map(video);list.splice(i,1);library.state.queue=list;renderQueue();renderSummary();persistQueue(snapshot,snapshot.current_video_id)}
function moveQueue(i,d){const snapshot=structuredClone(library.state),list=(library.state.queue||[]).map(video),j=i+d;if(j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];library.state.queue=list;renderQueue();persistQueue(snapshot,snapshot.current_video_id)}
async function playIndex(i){const snapshot=structuredClone(library.state);library.state.current_index=i;library.state.current_video_id=String(library.state.queue?.[i]?.video_id||'');renderQueue();renderNow();try{const d=await api({action:'youtube_play_index',index:i});library.state=d.state||library.state}catch(e){library.state=snapshot;renderQueue();renderNow();toast('No se pudo cambiar')}}
function queueMenu(i){const v=library.state.queue?.[i];openSheet(v?.title||'Video',[['Reproducir ahora',()=>playIndex(i)],['Mover arriba',()=>moveQueue(i,-1)],['Mover abajo',()=>moveQueue(i,1)],['Quitar',()=>removeQueue(i)]])}
function commitQueueOrder(ids,snapshot){
  const map=new Map((library.state.queue||[]).map(v=>[String(v.video_id),v]));
  const next=ids.map(id=>map.get(id)).filter(Boolean);
  if(next.length!==(library.state.queue||[]).length)return;
  const current=String(snapshot.current_video_id||library.state.current_video_id||'');
  library.state.queue=next;
  library.state.current_index=Math.max(0,next.findIndex(v=>String(v.video_id)===current));
  renderQueue();renderNow();
  persistQueue(snapshot,current);
}
function wireQueueDrag(row,handle){
  handle.onpointerdown=e=>{
    if(e.button!==undefined&&e.button!==0)return;
    const root=$('queueList'),rows=[...root.querySelectorAll('.queueRow')];
    if(rows.length<2)return;
    e.preventDefault();
    const snapshot=structuredClone(library.state),rect=row.getBoundingClientRect(),offset=e.clientY-rect.top;
    const ph=document.createElement('div');ph.className='queuePlaceholder';ph.style.height=rect.height+'px';
    row.after(ph);
    row.classList.add('dragging');
    row.style.left=rect.left+'px';row.style.top=rect.top+'px';row.style.width=rect.width+'px';row.style.height=rect.height+'px';
    try{handle.setPointerCapture(e.pointerId)}catch{}
    if(navigator.vibrate)navigator.vibrate(8);
    const move=ev=>{
      ev.preventDefault();
      const top=ev.clientY-offset;
      row.style.top=top+'px';
      const y=ev.clientY;
      const others=[...root.querySelectorAll('.queueRow:not(.dragging)')];
      let placed=false;
      for(const other of others){
        const r=other.getBoundingClientRect();
        if(y<r.top+r.height/2){root.insertBefore(ph,other);placed=true;break}
      }
      if(!placed)root.appendChild(ph);
      const edge=76;
      if(y<edge)window.scrollBy(0,-Math.min(18,edge-y));
      else if(y>innerHeight-edge)window.scrollBy(0,Math.min(18,y-(innerHeight-edge)));
    };
    const end=ev=>{
      try{handle.releasePointerCapture(ev.pointerId)}catch{}
      handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',end);handle.removeEventListener('pointercancel',end);
      row.classList.remove('dragging');row.removeAttribute('style');
      root.insertBefore(row,ph);ph.remove();
      const ids=[...root.querySelectorAll('.queueRow')].map(x=>x.dataset.videoId).filter(Boolean);
      commitQueueOrder(ids,snapshot);
    };
    handle.addEventListener('pointermove',move,{passive:false});
    handle.addEventListener('pointerup',end);
    handle.addEventListener('pointercancel',end);
  };
}
function renderQueue(){
  const root=$('queueList'),list=library.state.queue||[],cur=Math.max(0,Number(library.state.current_index)||0);root.innerHTML='';
  if(!list.length){root.innerHTML='<div class="empty">Nada en cola.</div>';return}
  list.forEach((raw,i)=>{
    const v=video(raw),row=document.createElement('div');row.className='queueRow';row.dataset.videoId=v.video_id;
    row.innerHTML='<div class="drag" role="button" aria-label="Arrastrar '+esc(v.title)+'">≡</div><img class="thumb" src="'+esc(v.thumbnail)+'" alt=""><div><div class="title">'+esc(v.title)+'</div><div class="meta">'+esc(v.channel_title)+(i===cur?' · ahora':'')+'</div></div><button class="qmore">···</button>';
    row.querySelector('.title').onclick=()=>playIndex(i);row.querySelector('.qmore').onclick=()=>queueMenu(i);wireQueueDrag(row,row.querySelector('.drag'));root.appendChild(row)
  })
}

function channelAvatar(c){return img(c.thumbnail)||''}
function faceHtml(c){return channelAvatar(c)?'<img class="face" src="'+esc(channelAvatar(c))+'" alt="">':'<span class="face"></span>'}
function folderChannels(id){return library.channels.filter(c=>String(c.folder_id||'')===String(id||''))}
function folderById(id){return library.folders.find(f=>String(f.id)===String(id))}
function syncClass(f){return f?._sync==='saving'?'saving':f?._sync==='error'?'error':''}
function renderChannelRow(c){const row=document.createElement('div');row.className='channel';const f=folderById(c.folder_id);row.innerHTML=(channelAvatar(c)?'<img class="avatar" src="'+esc(channelAvatar(c))+'" alt="">':'<div class="avatar"></div>')+'<div><div class="channelName">'+esc(c.title||c.channel_id)+'<span class="sync '+(c._sync==='saving'?'saving':c._sync==='error'?'error':'')+'"></span></div><div class="channelSub">'+esc(f?.name||'Sin carpeta')+'</div></div><button class="channelTap">›</button>';row.onclick=e=>{if(e.target.closest('button'))return;openChannelPicker(c)};row.querySelector('.channelTap').onclick=()=>openChannelPicker(c);return row}
function folderRow(f){const chans=folderChannels(f.id),b=document.createElement('div');b.className='folder';if(f._editing){b.innerHTML='<div><input class="inlineName" value="'+esc(f.name||'Nueva carpeta')+'"><span class="sync '+syncClass(f)+'"></span></div><div></div>';const inp=b.querySelector('input');setTimeout(()=>{inp.focus();inp.select()},0);const done=()=>commitFolderName(f,inp.value);inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();done()}};inp.onblur=done;return b}b.innerHTML='<button data-open style="all:unset;display:flex;min-height:80px;align-items:center;width:100%;cursor:pointer;touch-action:manipulation"><div><div class="folderName">'+esc(f.name)+'<span class="sync '+syncClass(f)+'"></span></div><div class="folderMeta">'+chans.length+' '+(chans.length===1?'canal':'canales')+'</div></div></button><div class="folderRight"><div class="faces">'+chans.slice(0,4).map(faceHtml).join('')+'</div><button class="more">···</button></div>';b.querySelector('[data-open]').onclick=()=>{openFolder=f.id;folderView='recent';window.history.pushState({yt:'folder'},'');renderChannels()};b.querySelector('.more').onclick=()=>folderMenu(f);return b}
function renderFolderRecent(f,root){
  const ids=new Set(folderChannels(f.id).map(c=>String(c.channel_id))),items=recent.filter(v=>ids.has(String(v.channel_id||'')));
  const list=document.createElement('div');list.className='list';
  if(!items.length)list.innerHTML='<div class="empty">No hay videos recientes de esta carpeta.</div>';
  else items.forEach(v=>list.appendChild(videoRow(v)));
  root.appendChild(list)
}
function renderChannels(){
  const root=$('channelRoot');root.innerHTML='';
  if(openFolder){
    const f=folderById(openFolder);if(!f){openFolder='';folderView='recent';return renderChannels()}
    const crumb=document.createElement('button');crumb.className='folderCrumb';crumb.textContent='← Todas las carpetas';crumb.onclick=()=>{if(window.history.state?.yt==='folder')window.history.back();else{openFolder='';folderView='recent';renderChannels()}};root.appendChild(crumb);
    const top=document.createElement('div');top.innerHTML='<div class="folderTop"><div></div><div class="folderTitle">'+esc(f.name)+'<span class="sync '+syncClass(f)+'"></span></div><button class="folderMore">···</button></div>';
    top.querySelector('.folderMore').onclick=()=>folderMenu(f);root.appendChild(top);
    const sw=document.createElement('div');sw.className='folderSwitch';sw.innerHTML='<button data-view="recent">Recientes</button><button data-view="channels">Canales</button>';
    sw.querySelectorAll('button').forEach(b=>{b.classList.toggle('active',b.dataset.view===folderView);b.onclick=()=>{folderView=b.dataset.view;renderChannels()}});root.appendChild(sw);
    if(folderView==='recent'){renderFolderRecent(f,root);return}
    const sec=document.createElement('div');sec.className='section';sec.innerHTML='<h2>'+folderChannels(f.id).length+' canales</h2><button class="textBtn">EDITAR</button>';sec.querySelector('button').onclick=()=>openFolderEditor(f);root.appendChild(sec);
    const list=document.createElement('div');list.className='list';const chans=folderChannels(f.id);if(!chans.length)list.innerHTML='<div class="empty">Carpeta vacía.</div>';else chans.forEach(c=>list.appendChild(renderChannelRow(c)));root.appendChild(list);return
  }
  const head=document.createElement('div');head.className='libraryHeader';head.innerHTML='<h1>Biblioteca</h1>';root.appendChild(head);
  const sec=document.createElement('div');sec.className='section';sec.innerHTML='<h2>Carpetas</h2><button class="textBtn">+ NUEVA</button>';sec.querySelector('button').onclick=createFolderOptimistic;root.appendChild(sec);
  const folders=document.createElement('div');folders.className='list';
  if(!library.folders.length)folders.innerHTML='<div class="empty">Todavía no hay carpetas.</div>';else library.folders.forEach(f=>folders.appendChild(folderRow(f)));
  root.appendChild(folders);
  const sec2=document.createElement('div');sec2.className='section';sec2.innerHTML='<h2>Todos los canales</h2><button class="textBtn">BUSCAR</button>';sec2.querySelector('button').onclick=()=>focusSearch('');root.appendChild(sec2);
  const rows=document.createElement('div');rows.className='list';if(!library.channels.length)rows.innerHTML='<div class="empty">Todavía no agregaste canales.</div>';else library.channels.forEach(c=>rows.appendChild(renderChannelRow(c)));root.appendChild(rows)
}
function createFolderOptimistic(){if(library.folders.some(f=>f._editing))return;const f={id:'tmp-'+Date.now(),name:'Nueva carpeta',sort_order:0,_editing:true,_sync:'saving'};library.folders.push(f);renderChannels()}
async function commitFolderName(f,nameRaw){if(!f._editing)return;const name=String(nameRaw||'').trim()||'Nueva carpeta';f.name=name;f._editing=false;f._sync='saving';renderChannels();if(String(f.id).startsWith('tmp-')){try{const d=await api({action:'youtube_folder_create',name});const real=d.folder;const old=f.id;f.id=real.id;f.name=real.name;f._sync='';library.channels.forEach(c=>{if(c.folder_id===old)c.folder_id=real.id});renderHomeSources();renderChannels();openFolderEditor(f)}catch(e){f._sync='error';renderChannels();toast('No se pudo crear')}}else{try{await api({action:'youtube_folder_rename',folder_id:f.id,name});f._sync=''}catch(e){f._sync='error'}renderChannels()}}
function folderMenu(f){openSheet(f.name,[['Editar canales',()=>openFolderEditor(f)],['Buscar canal nuevo',()=>startFolderSearch(f)],['Renombrar',()=>{f._editing=true;renderChannels()}],['Eliminar carpeta',()=>deleteFolderOptimistic(f)]])}
function openFolderEditor(f){
  closeSheet();
  $('sheetTitle').textContent='Canales de '+f.name;
  $('sheetBody').innerHTML='';
  $('sheetClose').textContent='LISTO';
  const ordered=[...library.channels].sort((a,b)=>{
    const aa=String(a.folder_id||'')===String(f.id)?0:1,bb=String(b.folder_id||'')===String(f.id)?0:1;
    return aa-bb||String(a.title||'').localeCompare(String(b.title||''),'es');
  });
  for(const c of ordered){
    const row=document.createElement('div');row.className='pickChannel';
    const on=String(c.folder_id||'')===String(f.id);
    row.innerHTML=(channelAvatar(c)?'<img class="avatar" src="'+esc(channelAvatar(c))+'" alt="">':'<div class="avatar"></div>')+
      '<div><div class="channelName">'+esc(c.title||c.channel_id)+'</div><div class="channelSub">'+
      (on?'En esta carpeta':esc(folderById(c.folder_id)?.name||'Sin carpeta'))+
      '</div></div><div class="check '+(on?'on':'')+'">'+(on?'✓':'')+'</div>';
    row.onclick=()=>toggleFolderChannel(f,c,row);
    $('sheetBody').appendChild(row);
  }
  const actions=document.createElement('div');actions.className='pickerActions';
  actions.innerHTML='<button class="pickerNew">＋ Buscar un canal nuevo</button>';
  actions.querySelector('button').onclick=()=>startFolderSearch(f);
  $('sheetBody').appendChild(actions);
  $('sheet').classList.add('open');
  if(window.history.state?.yt!=='sheet')window.history.pushState({yt:'sheet'},'');
}
function startFolderSearch(f){
  targetFolder=f.id;
  if(window.history.state?.yt==='sheet')window.history.back(); else closeSheet();
  setTimeout(()=>{
    const c=$('searchContext');
    c.classList.add('show');
    c.innerHTML='<span>Agregar a '+esc(f.name)+'</span><button aria-label="Cancelar">×</button>';
    c.querySelector('button').onclick=()=>{targetFolder='';c.classList.remove('show');closeSearch(true)};
    window.scrollTo({top:0,behavior:'smooth'});
    $('search').focus({preventScroll:true});
  },80);
}
function toggleFolderChannel(f,c,row){const isOn=String(c.folder_id||'')===String(f.id);c.folder_id=isOn?null:f.id;const check=row.querySelector('.check');check.classList.toggle('on',!isOn);check.textContent=!isOn?'✓':'';row.querySelector('.channelSub').textContent=!isOn?f.name:'Sin carpeta';f._sync='saving';renderChannels();clearTimeout(folderSyncTimer);folderSyncTimer=setTimeout(()=>persistFolderMembers(f),280)}
async function persistFolderMembers(f){const ids=folderChannels(f.id).map(c=>c.channel_id);try{const d=await api({action:'youtube_folder_set_channels',folder_id:f.id,channel_ids:ids});applyServer(d);const fresh=folderById(f.id);if(fresh)fresh._sync='';renderHomeSources();renderRecent();renderChannels()}catch(e){f._sync='error';renderChannels();toast('No se pudo guardar');loadLibrary(false)}}
function openChannelPicker(c){const opts=[{id:'',name:'Sin carpeta'},...library.folders].map(f=>[f.name,()=>moveChannelOptimistic(c,f.id||'')]);opts.push(['Quitar canal',()=>removeChannelOptimistic(c)]);openSheet(c.title||'Canal',opts)}
async function moveChannelOptimistic(c,folderId){const old=c.folder_id||null;c.folder_id=folderId||null;c._sync='saving';renderChannels();try{await api({action:'youtube_channel_move',channel_id:c.channel_id,folder_id:folderId||''});c._sync=''}catch(e){c.folder_id=old;c._sync='error';toast('No se pudo mover')}renderHomeSources();renderRecent();renderChannels()}
function removeChannelOptimistic(c){const idx=library.channels.indexOf(c);if(idx<0)return;const removedRecent=recent.filter(v=>String(v.channel_id||'')===String(c.channel_id));if(homeScope.type==='channel'&&homeScope.id===c.channel_id)homeScope={type:'all',id:''};library.channels.splice(idx,1);recent=recent.filter(v=>String(v.channel_id||'')!==String(c.channel_id));renderHomeSources();renderRecent();renderChannels();renderSummary();let cancelled=false;snack('Canal quitado','DESHACER',()=>{cancelled=true;library.channels.splice(Math.min(idx,library.channels.length),0,c);recent.push(...removedRecent);recent.sort((a,b)=>new Date(b.published_at||0)-new Date(a.published_at||0));renderHomeSources();renderRecent();renderChannels();renderSummary()});setTimeout(async()=>{if(cancelled)return;try{await api({action:'youtube_channel_remove',channel_id:c.channel_id})}catch(e){library.channels.splice(Math.min(idx,library.channels.length),0,c);recent.push(...removedRecent);recent.sort((a,b)=>new Date(b.published_at||0)-new Date(a.published_at||0));renderHomeSources();renderRecent();renderChannels();renderSummary();toast('No se pudo quitar')}},5200)}
function deleteFolderOptimistic(f){closeSheet();const idx=library.folders.indexOf(f),members=folderChannels(f.id).map(c=>c.channel_id);if(homeScope.type==='folder'&&String(homeScope.id)===String(f.id))homeScope={type:'all',id:''};if(idx<0)return;library.folders.splice(idx,1);library.channels.forEach(c=>{if(String(c.folder_id||'')===String(f.id))c.folder_id=null});if(openFolder===f.id)openFolder='';renderHomeSources();renderRecent();renderChannels();pendingDelete={f,idx,members,cancelled:false};snack('Carpeta eliminada','DESHACER',()=>{if(!pendingDelete)return;pendingDelete.cancelled=true;library.folders.splice(Math.min(idx,library.folders.length),0,f);library.channels.forEach(c=>{if(members.includes(c.channel_id))c.folder_id=f.id});pendingDelete=null;renderHomeSources();renderRecent();renderChannels()});setTimeout(async()=>{const p=pendingDelete;if(!p||p.f!==f||p.cancelled)return;pendingDelete=null;try{await api({action:'youtube_folder_delete',folder_id:f.id})}catch(e){library.folders.splice(Math.min(idx,library.folders.length),0,f);library.channels.forEach(c=>{if(members.includes(c.channel_id))c.folder_id=f.id});renderHomeSources();renderRecent();renderChannels();toast('No se pudo eliminar')}},5200)}
function openSheet(title,rows){$('sheetTitle').textContent=title;$('sheetBody').innerHTML='';$('sheetClose').textContent='CERRAR';for(const [label,fn] of rows){const b=document.createElement('button');b.className='sheetRow';b.innerHTML='<span>'+esc(label)+'</span><span>›</span>';b.onclick=()=>{if(window.history.state?.yt==='sheet'){window.history.back();setTimeout(fn,0)}else{closeSheet();fn()}};$('sheetBody').appendChild(b)}$('sheet').classList.add('open');if(window.history.state?.yt!=='sheet')window.history.pushState({yt:'sheet'},'')}
function closeSheet(){$('sheet').classList.remove('open')}$('sheetClose').onclick=()=>{if(window.history.state?.yt==='sheet')window.history.back();else closeSheet()};$('sheet').onclick=e=>{if(e.target===$('sheet')){if(window.history.state?.yt==='sheet')window.history.back();else closeSheet()}}

function renderHistory(){const root=$('historyList');root.innerHTML='';if(!watchHistory.length){root.innerHTML='<div class="empty">Todavía no hay vistos.</div>';return}watchHistory.forEach(h=>{const row=document.createElement('div');row.className='history';row.innerHTML='<div class="title">'+esc(h.title||h.video_id)+'</div><div class="meta">'+esc(h.channel_title||'YouTube')+' · '+new Date(h.watched_at).toLocaleDateString('es-AR')+'</div>';row.onclick=()=>addToQueue(h);root.appendChild(row)})}

function openSearch(){if(!$('searchPane').classList.contains('open')){window.history.pushState({yt:'search'},'');$('searchPane').classList.add('open')}}function closeSearch(clear=true){searchResults=[];$('searchPane').classList.remove('open');$('resultList').innerHTML='';$('searchContext').classList.remove('show');$('searchContext').innerHTML='';if(clear){$('search').value='';$('searchWrap').classList.remove('hasText');targetFolder=''}}
function focusSearch(folderId=''){targetFolder=folderId;window.scrollTo({top:0,behavior:'smooth'});$('search').focus({preventScroll:true})}
$('searchClear').onclick=()=>{if(window.history.state?.yt==='search')window.history.back();else closeSearch(true)};
$('search').oninput=e=>{const text=e.target.value.trim();$('searchWrap').classList.toggle('hasText',!!text);clearTimeout(searchTimer);if(text.length<2){$('searchPane').classList.remove('open');return}searchTimer=setTimeout(runSearch,320)};
$('search').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(searchTimer);runSearch()}};$('searchGo').onclick=()=>{clearTimeout(searchTimer);runSearch()};
async function runSearch(){const text=$('search').value.trim();if(text.length<2)return;openSearch();$('resultList').innerHTML='<div class="loading">Buscando…</div>';try{const out=await media({action:'search_all',q:text});if(text!==$('search').value.trim())return;searchResults=out.results||[];renderResults()}catch(e){$('resultList').innerHTML='<div class="empty">'+esc(e.message||e)+'</div>'}}
function renderResults(){const root=$('resultList');root.innerHTML='';if(!searchResults.length){root.innerHTML='<div class="empty">Sin resultados.</div>';return}const channels=searchResults.filter(r=>r.type==='channel'),videos=searchResults.filter(r=>r.type==='video');if(channels.length){const s=document.createElement('div');s.className='section';s.innerHTML='<h2>Canales</h2>';root.appendChild(s);for(const r of channels)root.appendChild(resultChannel(r))}if(videos.length){const s=document.createElement('div');s.className='section';s.innerHTML='<h2>Videos</h2>';root.appendChild(s);for(const r of videos)root.appendChild(videoRow(r))}}
function resultChannel(r){const added=library.channels.find(c=>c.channel_id===r.channel_id),row=document.createElement('div');row.className='resultChannel';row.innerHTML=(r.thumbnail?'<img class="avatar" src="'+esc(img(r.thumbnail))+'" alt="">':'<div class="avatar"></div>')+'<div><div class="resultType">Canal</div><div class="channelName">'+esc(r.title||r.channel_id)+'</div><div class="channelSub">'+esc((r.description||'').slice(0,100))+'</div></div><button class="primaryText">'+(added?'✓':'AGREGAR')+'</button>';const btn=row.querySelector('button');btn.disabled=!!added;btn.onclick=()=>addChannelOptimistic(r,btn);return row}
async function refreshRecentForChannel(c){
  try{
    const out=await media({action:'channel_latest_id',channel_id:c.channel_id,label:c.title});
    recent=recent.filter(v=>String(v.channel_id||'')!==String(c.channel_id));
    recent.push(...(out.videos||[]).map(video));
    recent.sort((a,b)=>new Date(b.published_at||0)-new Date(a.published_at||0));
    recent=recent.slice(0,60);
    renderHomeSources();renderRecent();if(openFolder)renderChannels()
  }catch{}
}
async function addChannelOptimistic(r,btn){
  const temp={channel_id:r.channel_id,title:r.title||r.channel_id,thumbnail:img(r.thumbnail||''),folder_id:targetFolder||null,enabled:true,sort_order:0,added_at:new Date().toISOString(),_sync:'saving'};
  library.channels.unshift(temp);btn.textContent='✓';btn.disabled=true;renderHomeSources();renderChannels();
  try{
    const d=await api({action:'youtube_channel_add',channel_id:r.channel_id,title:r.title,thumbnail:temp.thumbnail,folder_id:targetFolder||''});
    applyServer(d);toast('Canal agregado');renderHomeSources();renderChannels();
    const saved=library.channels.find(c=>c.channel_id===r.channel_id)||temp;
    refreshRecentForChannel(saved)
  }catch(e){
    library.channels=library.channels.filter(c=>c!==temp);renderHomeSources();btn.textContent='AGREGAR';btn.disabled=false;renderChannels();toast('No se pudo agregar')
  }
}

async function loadRecent(){recent=[];for(const c of library.channels){try{const out=await media({action:'channel_latest_id',channel_id:c.channel_id,label:c.title});recent.push(...(out.videos||[]).map(video))}catch{}}recent.sort((a,b)=>new Date(b.published_at||0)-new Date(a.published_at||0));recent=recent.slice(0,60);renderHomeSources();renderRecent();if(openFolder)renderChannels()}
async function loadLibrary(withRecent=true){try{const [lib,h]=await Promise.all([api({action:'youtube_library'}),api({action:'watch_history',limit:100})]);applyServer(lib);watchHistory=h.history||[];renderSummary();renderNow();renderHomeSources();renderRecent();renderQueue();renderChannels();renderHistory();if(withRecent)await loadRecent()}catch(e){toast(String(e.message||e))}}

$('back').onclick=()=>{location.href='/prometeo/ctrl/#room='+encodeURIComponent(room.code)+'&t='+encodeURIComponent(room.token)+'&k='+encodeURIComponent(mediaToken)};$('tv').onclick=()=>{location.href='/prometeo/tv/'};
window.history.replaceState({yt:'root'},'');
window.addEventListener('popstate',()=>{if($('sheet').classList.contains('open'))return closeSheet();if($('searchPane').classList.contains('open'))return closeSearch(true);if(openFolder){openFolder='';folderView='recent';renderChannels()}});
async function checkCanonical(){try{const r=await fetch(CANONICAL+'?t='+Date.now(),{cache:'no-store'}),d=await r.json();if(String(d.yt_build||'7')!=='7')location.reload()}catch{}}
loadLibrary(true);checkCanonical();setInterval(checkCanonical,15000);
})();
