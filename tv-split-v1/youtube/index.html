<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>TV · YouTube</title>
<style>
:root{--bg:#050505;--fg:#f4f2ea;--muted:#77766f;--line:#242421;--soft:#11110f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.app{width:min(760px,100%);min-height:100dvh;margin:auto;padding:0 12px 100px}
.top{position:sticky;top:0;z-index:20;background:#050505ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar{height:52px;display:grid;grid-template-columns:72px 1fr 76px;align-items:center}
.back,.save{height:32px;border:1px solid #30302c;background:#0c0c0b;font-size:8px;font-weight:900;letter-spacing:.08em}
.back{justify-self:start;padding:0 9px}.save{justify-self:end;padding:0 10px;background:var(--fg);color:var(--bg);border-color:var(--fg)}
.save:disabled{opacity:.35}
.title{text-align:center;font-size:11px;font-weight:900;letter-spacing:.14em}
.blockMeta{padding:10px 0 12px;font:800 9px ui-monospace,SFMono-Regular,Menlo,monospace;color:#aaa89f}
.blockMeta strong{color:var(--fg)}
.tabs{position:sticky;top:52px;z-index:18;height:43px;display:flex;gap:22px;align-items:end;background:#050505ee;border-bottom:1px solid var(--line)}
.tab{height:42px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-size:9px;font-weight:900;letter-spacing:.08em;padding:0 1px}
.tab.active{color:var(--fg);border-bottom-color:var(--fg)}
.paste{display:grid;grid-template-columns:1fr 44px;gap:7px;padding:12px 0;border-bottom:1px solid var(--line)}
.paste input{height:42px;border:0;border-bottom:1px solid #33332f;background:transparent;outline:none;padding:0 2px;font-size:12px}
.paste button{height:42px;border:1px solid #33332f;background:#0d0d0c;font-size:16px;font-weight:900}
.pane{display:none}.pane.active{display:block}
.sectionHead{height:42px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.sectionHead strong{font-size:9px;letter-spacing:.1em}.sectionHead span{font-size:7px;color:var(--muted)}
.video{width:100%;min-height:88px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;display:grid;grid-template-columns:126px minmax(0,1fr) 38px;gap:10px;align-items:center;padding:9px 0}
.thumb{width:126px;aspect-ratio:16/9;object-fit:cover;background:#111}
.vtext{min-width:0}.vtitle{font-size:11px;font-weight:900;line-height:1.24;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vmeta{margin-top:6px;font-size:7px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vmeta.watched:after{content:' · VISTO';color:#bdbbb2}
.addVideo{width:34px;height:34px;border:1px solid #3a3a35;background:#0d0d0c;font-size:20px;font-weight:900;padding:0}
.channelList{display:grid;grid-template-columns:1fr 1fr}
.channel{min-height:64px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:10px}
.channel:nth-child(even){border-right:0}
.channelName{font-size:10px;font-weight:900;line-height:1.15}.channelMeta{margin-top:5px;font-size:7px;color:var(--muted)}
.channelBack{height:38px;border:0;background:transparent;color:var(--fg);padding:0;font-size:8px;font-weight:900;letter-spacing:.08em}
.queueEmpty,.loading,.error{padding:24px 2px;color:var(--muted);font-size:9px}
.queueRow{min-height:82px;display:grid;grid-template-columns:22px 104px minmax(0,1fr) auto;gap:9px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.qnum{font:900 9px ui-monospace,monospace;color:var(--muted);text-align:center}
.qthumb{width:104px;aspect-ratio:16/9;object-fit:cover;background:#111}
.qtitle{font-size:10px;font-weight:900;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qmeta{font-size:7px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qtools{display:grid;grid-template-columns:28px 28px;gap:3px}
.qtools button{width:28px;height:28px;border:1px solid #31312d;background:#0d0d0c;font-size:11px;padding:0}.qtools .remove{grid-column:1/3;width:59px;font-size:8px}
.bottom{position:fixed;z-index:25;left:0;right:0;bottom:0;background:#050505ee;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.bottomInner{max-width:736px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.summary{min-width:0}.summary strong{font-size:11px}.summary span{display:block;margin-top:3px;font-size:7px;color:var(--muted)}
.goQueue{height:38px;border:1px solid #34342f;background:#0d0d0c;padding:0 12px;font-size:8px;font-weight:900;letter-spacing:.08em}
.toast{position:fixed;z-index:50;left:50%;top:12px;transform:translateX(-50%);display:none;background:var(--fg);color:var(--bg);padding:8px 10px;font-size:8px;font-weight:900}.toast.show{display:block}
@media(max-width:520px){.video{grid-template-columns:106px minmax(0,1fr) 36px}.thumb{width:106px}.queueRow{grid-template-columns:18px 82px minmax(0,1fr) auto}.qthumb{width:82px}.channelList{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
<header class="top">
 <div class="topbar"><button id="back" class="back">← HORARIO</button><div class="title">YOUTUBE</div><button id="save" class="save" disabled>GUARDAR</button></div>
 <div id="blockMeta" class="blockMeta">CARGANDO BLOQUE…</div>
</header>
<nav class="tabs">
 <button class="tab active" data-tab="queue">COLA</button>
 <button class="tab" data-tab="recent">RECIENTES</button>
 <button class="tab" data-tab="channels">CANALES</button>
</nav>
<section class="paste"><input id="url" placeholder="Pegá una URL de YouTube"><button id="resolve">+</button></section>
<section id="queue" class="pane active"><div id="queueList"></div></section>
<section id="recent" class="pane"><div class="sectionHead"><strong>ÚLTIMOS VIDEOS</strong><span id="feedMeta"></span></div><div id="recentList" class="loading">CARGANDO…</div></section>
<section id="channels" class="pane"><div id="channelHead"></div><div id="channelBody" class="channelList"></div></section>
</main>
<footer class="bottom"><div class="bottomInner"><div class="summary"><strong id="count">0 videos</strong><span>se reproducen en este orden durante el bloque</span></div><button id="goQueue" class="goQueue">VER COLA</button></div></footer>
<div id="toast" class="toast"></div>
<script>
(()=>{
'use strict';
const API='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/tv-schedule-v1';
const FEED='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/tv-public-feed-v1';
const CANONICAL='https://juanmanuelpm.github.io/prometeo/tv/canonical.json';
const q=new URLSearchParams(location.hash.slice(1));
const DEFAULT_ROOM='TV-PM2K7Q',DEFAULT_REMOTE='1f1a186a7bdc6aa3c9bfbf2016fed69d6b6cbf3066fab5ad8e122e25aa45c63e',DEFAULT_MEDIA='NZT8S9zPPRuTdUQUZK20jEvA-Nly6Ck4HUImnPuBsgQ';
const room={code:q.get('room')||DEFAULT_ROOM,token:q.get('t')||DEFAULT_REMOTE},mediaToken=q.get('k')||DEFAULT_MEDIA,blockId=q.get('block')||'';
const client='yt-editor-v1-'+Math.random().toString(36).slice(2,9);
const $=id=>document.getElementById(id);
let block=null,queue=[],feed=null,watched=new Set(),dirty=false,activeTab='queue',channelId='';

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(m){m=Number(m)||0;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1300)}
function setDirty(v=true){dirty=v;$('save').disabled=!dirty}
function cloneVideo(v){return {video_id:String(v.video_id||''),title:String(v.title||v.video_title||'YouTube'),channel_id:String(v.channel_id||''),channel_title:String(v.channel_title||''),thumbnail:String(v.thumbnail||('https://i.ytimg.com/vi/'+v.video_id+'/mqdefault.jpg')),watch_url:String(v.watch_url||('https://www.youtube.com/watch?v='+v.video_id))}}
async function api(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:room.code,role:'remote',token:room.token,client_id:client,...body}),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'ERROR');return d}
async function media(body){const r=await fetch(FEED,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:mediaToken,...body}),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'FEED_ERROR');return d.result}
function add(v){const x=cloneVideo(v);if(!x.video_id)return;if(queue.some(y=>y.video_id===x.video_id)){toast('YA ESTÁ EN LA COLA');return}queue.push(x);setDirty();renderQueue();updateSummary();toast('AGREGADO')}
function removeAt(i){queue.splice(i,1);setDirty();renderQueue();updateSummary()}
function move(i,d){const j=i+d;if(j<0||j>=queue.length)return;[queue[i],queue[j]]=[queue[j],queue[i]];setDirty();renderQueue()}
function updateSummary(){$('count').textContent=queue.length+' '+(queue.length===1?'video':'videos')}
function renderQueue(){
 const root=$('queueList');root.innerHTML='';
 if(!queue.length){root.innerHTML='<div class="queueEmpty">Este bloque todavía no tiene contenido. Agregá videos desde RECIENTES, CANALES o pegando una URL.</div>';return}
 queue.forEach((v,i)=>{
   const row=document.createElement('div');row.className='queueRow';
   row.innerHTML='<div class="qnum">'+String(i+1).padStart(2,'0')+'</div><img class="qthumb" src="'+esc(v.thumbnail)+'" alt=""><div><div class="qtitle">'+esc(v.title)+'</div><div class="qmeta">'+esc(v.channel_title||'YOUTUBE')+'</div></div><div class="qtools"><button data-up>↑</button><button data-down>↓</button><button class="remove" data-remove>QUITAR</button></div>';
   row.querySelector('[data-up]').onclick=()=>move(i,-1);row.querySelector('[data-down]').onclick=()=>move(i,1);row.querySelector('[data-remove]').onclick=()=>removeAt(i);root.appendChild(row)
 })
}
function videoNode(v){
 const row=document.createElement('div');row.className='video';
 const seen=watched.has(String(v.video_id));
 row.innerHTML='<img class="thumb" src="'+esc(v.thumbnail||('https://i.ytimg.com/vi/'+v.video_id+'/mqdefault.jpg'))+'" alt=""><div class="vtext"><div class="vtitle">'+esc(v.title)+'</div><div class="vmeta '+(seen?'watched':'')+'">'+esc(v.channel_title||'YOUTUBE')+'</div></div><button class="addVideo">+</button>';
 row.querySelector('.addVideo').onclick=()=>add(v);return row
}
function fillVideos(root,list){root.innerHTML='';if(!list?.length){root.innerHTML='<div class="queueEmpty">No hay videos para mostrar.</div>';return}list.forEach(v=>root.appendChild(videoNode(v)))}
function selectTab(name){activeTab=name;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active',x.id===name));if(name==='channels')renderChannels()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>selectTab(b.dataset.tab));
$('goQueue').onclick=()=>selectTab('queue');

async function loadFeed(){
 try{feed=await media({action:'feed'});$('feedMeta').textContent=(feed.channels?.length||0)+' canales';fillVideos($('recentList'),feed.videos||[]);renderChannels()}catch(e){$('recentList').innerHTML='<div class="error">'+esc(e.message||e)+'</div>'}
}
function renderChannels(){
 const head=$('channelHead'),body=$('channelBody');
 if(channelId){
   const c=(feed?.channels||[]).find(x=>x.id===channelId);head.innerHTML='<button id="channelBack" class="channelBack">← CANALES</button><div class="sectionHead"><strong>'+esc(c?.title||'CANAL')+'</strong><span></span></div>';body.className='';body.innerHTML='<div class="loading">CARGANDO…</div>';$('channelBack').onclick=()=>{channelId='';renderChannels()};
   media({action:'channel',channel_id:channelId}).then(out=>fillVideos(body,out.videos||[])).catch(e=>body.innerHTML='<div class="error">'+esc(e.message||e)+'</div>');return
 }
 head.innerHTML='<div class="sectionHead"><strong>TUS CANALES</strong><span>elegí para ver videos</span></div>';body.className='channelList';body.innerHTML='';
 for(const c of feed?.channels||[]){const b=document.createElement('button');b.className='channel';b.innerHTML='<div class="channelName">'+esc(c.title)+'</div><div class="channelMeta">VER ÚLTIMOS VIDEOS →</div>';b.onclick=()=>{channelId=c.id;renderChannels()};body.appendChild(b)}
}
async function loadBlock(){
 if(!blockId){$('blockMeta').textContent='FALTA IDENTIFICAR EL BLOQUE';$('save').disabled=true;return}
 try{
   const d=await api({action:'list'});block=(d.blocks||[]).find(x=>String(x.id)===String(blockId));
   if(!block||block.kind!=='youtube')throw new Error('BLOQUE_YOUTUBE_NO_ENCONTRADO');
   const p=block.payload||{};queue=(Array.isArray(p.queue)?p.queue:[]).map(cloneVideo);
   if(!queue.length&&p.video_id)queue=[cloneVideo({video_id:p.video_id,title:p.video_title||block.title,channel_id:p.channel_id,channel_title:p.channel_title})];
   $('blockMeta').innerHTML='<strong>'+fmt(block.start_minute)+'–'+fmt(block.end_minute)+'</strong> · '+(block.end_minute-block.start_minute)+' MIN · '+queue.length+' '+(queue.length===1?'VIDEO':'VIDEOS');
   renderQueue();updateSummary()
 }catch(e){$('blockMeta').textContent=String(e.message||e);$('save').disabled=true}
}
async function loadHistory(){try{const d=await api({action:'watch_history',limit:100});watched=new Set((d.history||[]).map(x=>String(x.video_id)))}catch{}}
$('resolve').onclick=async()=>{const raw=$('url').value.trim();if(!raw)return;$('resolve').textContent='…';try{const v=await media({action:'resolve',url:raw});add(v);$('url').value=''}catch(e){toast(String(e.message||e))}$('resolve').textContent='+'};
$('url').onkeydown=e=>{if(e.key==='Enter')$('resolve').click()};
$('save').onclick=async()=>{
 if(!block||!dirty)return;
 $('save').disabled=true;$('save').textContent='…';
 try{
   const first=queue[0]||{};
   const d=await api({action:'save',id:block.id,title:'YOUTUBE',kind:'youtube',start_minute:block.start_minute,end_minute:block.end_minute,payload:{mode:'session',queue,queue_index:0,video_id:first.video_id||'',channel_id:first.channel_id||'',channel_title:first.channel_title||'',video_title:first.title||'',auto_next:true}});
   block=d.block;setDirty(false);toast('COLA GUARDADA')
 }catch(e){toast(String(e.message||e));setDirty(true)}
 $('save').textContent='GUARDAR'
};
$('back').onclick=()=>{location.href='/prometeo/ctrl/#room='+encodeURIComponent(room.code)+'&t='+encodeURIComponent(room.token)+'&k='+encodeURIComponent(mediaToken)};
async function checkCanonical(){try{const r=await fetch(CANONICAL+'?t='+Date.now(),{cache:'no-store'}),d=await r.json();if(String(d.yt_build||'1')!=='1')location.reload()}catch{}}
Promise.all([loadHistory(),loadBlock()]).then(loadFeed);checkCanonical();setInterval(checkCanonical,15000);
})();
</script>
</body>
</html>
