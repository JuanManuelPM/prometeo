<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d0c">
<title>Prometeo</title>
<style>
:root{--bg:#0b0d0c;--surface:#111412;--ink:#f1efe8;--muted:#8f948e;--line:#292d29;--live:#a5c9a7;--warn:#cdb487}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:clamp(18px,4vw,52px)}main{width:min(1040px,100%);margin:auto}.head{display:flex;align-items:end;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:28px}.brand{font-size:clamp(48px,9vw,104px);font-weight:800;line-height:.82;letter-spacing:-.07em;text-transform:uppercase}.tag{max-width:300px;color:var(--muted);font-size:12px;line-height:1.45;text-align:right}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{position:relative;min-height:190px;border:1px solid var(--line);border-radius:24px;background:var(--surface);padding:20px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;color:inherit;transition:transform .18s,border-color .18s,background .18s}.card[href]:hover{transform:translateY(-2px);border-color:#555d55;background:#151916}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.status{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.status.live{color:var(--live)}.status.recovering{color:var(--warn)}.arrow{font-size:22px;color:var(--muted)}h2{font-size:clamp(29px,5vw,50px);line-height:.9;letter-spacing:-.045em;margin:32px 0 7px}.sub{font-size:12px;color:var(--muted)}.disabled{opacity:.55}.foot{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);margin-top:30px;padding-top:16px;color:var(--muted);font-size:10px;line-height:1.4}.empty{grid-column:1/-1;border:1px solid var(--line);border-radius:24px;padding:24px;color:var(--muted)}@media(max-width:680px){.head{align-items:flex-start;flex-direction:column}.tag{text-align:left}.grid{grid-template-columns:1fr}.card{min-height:155px}}
</style>
</head>
<body>
<main>
<header class="head"><div class="brand">Prometeo</div><div class="tag">Un acceso estable a lo que está vivo. Los proyectos cambian por detrás; este mapa conserva la entrada.</div></header>
<section class="grid" id="grid"><div class="empty">Cargando accesos…</div></section>
<footer class="foot"><span>Mapa público · Prometeo</span><span id="stamp">Registro durable</span></footer>
</main>
<script>
const labels={live:'Vivo',recovering:'Recuperando acceso',archived:'Archivo',draft:'En preparación'};
function card(p){const live=Boolean(p.public_url)&&p.status==='live';const el=document.createElement(live?'a':'div');el.className='card'+(live?'':' disabled');el.dataset.id=p.id||'';if(live){el.href=p.public_url;el.rel='noopener';}const top=document.createElement('div');top.className='top';const status=document.createElement('span');status.className='status '+(p.status||'');status.textContent=labels[p.status]||p.status||'Estado';top.append(status);if(live){const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='↗';top.append(arrow);}const body=document.createElement('div');const h=document.createElement('h2');h.textContent=p.title||p.id||'Proyecto';const sub=document.createElement('div');sub.className='sub';sub.textContent=p.subtitle||(p.note||'');body.append(h,sub);el.append(top,body);return el;}
fetch('./projects.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('registry');return r.json()}).then(data=>{const grid=document.getElementById('grid');grid.replaceChildren(...(data.projects||[]).map(card));document.getElementById('stamp').textContent='Actualizado '+(data.updated_at||'');}).catch(()=>{document.getElementById('grid').innerHTML='<div class="empty">El registro no pudo cargarse. Volvé a intentar en unos segundos.</div>';});
</script>
</body>
</html>
