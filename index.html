<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Prometeo</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
#fail{display:none;position:fixed;right:18px;bottom:18px;width:54px;height:54px;border:0;border-radius:50%;background:#151A20;color:#fff;font:800 18px system-ui;box-shadow:0 8px 18px rgba(0,0,0,.18)}
#msg{display:none;position:fixed;right:18px;bottom:84px;max-width:min(420px,calc(100vw - 36px));padding:9px 11px;border-radius:12px;background:#151A20;color:#fff;font:600 10px/1.4 system-ui;opacity:.82;white-space:pre-wrap}
</style>
</head>
<body>
<div id="msg"></div>
<button id="fail" type="button" aria-label="Reintentar Prometeo">!</button>
<script>
(async()=>{
  const PAYLOAD='./shared/universal-shell/v5/payload.html.gz.b64';
  const fail=(err)=>{
    console.error('[Prometeo V5 boot]',err);
    const b=document.getElementById('fail'),m=document.getElementById('msg');
    b.style.display='block';m.style.display='block';
    m.textContent=String(err&&err.message||err||'Error de arranque');
    b.onclick=()=>location.replace(location.pathname+'?retry='+Date.now()+location.hash);
  };
  try{
    const r=await fetch(PAYLOAD+'?v=5d06d529&t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('payload '+r.status);
    const b64=(await r.text()).replace(/\s+/g,'');
    if(!b64.startsWith('H4sI'))throw new Error('payload inválido');
    const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    let html='';
    if('DecompressionStream' in window){
      const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));
      html=await new Response(stream).text();
    }else{
      await new Promise((resolve,reject)=>{
        const s=document.createElement('script');
        s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';
        s.onload=resolve;s.onerror=()=>reject(new Error('gzip no disponible'));
        document.head.appendChild(s);
      });
      html=new TextDecoder().decode(window.pako.ungzip(raw));
    }
    if(!html.includes('Universal Shell V5 Integrated Control'))throw new Error('payload V5 inesperado');
    document.open();document.write(html);document.close();
  }catch(err){fail(err)}
})();
</script>
</body>
</html>
