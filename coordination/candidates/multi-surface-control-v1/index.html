<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Prometeo · Multi-surface Control Candidate</title>
  <style>
    :root{color-scheme:dark;--bg:#0a0a0a;--panel:#111;--panel2:#161616;--line:#2a2a2a;--text:#f3f3f3;--muted:#9b9b9b;--soft:#c8c8c8;--radius:18px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:1160px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px max(32px,env(safe-area-inset-bottom))}
    header{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(26px,5vw,46px);margin:4px 0 0;letter-spacing:-.04em}.stamp{font-size:12px;color:var(--muted);text-align:right}
    .authority{border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--soft);font-size:12px;margin-bottom:14px;display:inline-flex;gap:8px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7}
    .telemetry{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:0 0 18px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}.metric strong{display:block;font-size:26px;letter-spacing:-.04em}.metric span{font-size:11px;color:var(--muted)}
    .projection-note{font-size:12px;color:var(--muted);margin:-8px 0 18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}.card h2{font-size:19px;margin:0 0 4px;letter-spacing:-.02em}.project{font-size:11px;color:var(--muted);margin-bottom:14px}.intent{background:var(--panel2);border-radius:12px;padding:12px;margin-bottom:12px}.intent b{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-bottom:5px}.intent p{margin:0}.rows{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{border-top:1px solid var(--line);padding-top:9px;min-width:0}.row span{display:block;color:var(--muted);font-size:11px}.row strong{display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.capacity{font-size:28px!important;letter-spacing:-.04em}.actions{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap}.button{appearance:none;text-decoration:none;color:var(--text);background:#202020;border:1px solid #333;border-radius:999px;padding:10px 13px;font:inherit;cursor:pointer}.button:hover{background:#292929}.button[aria-disabled="true"]{opacity:.38;cursor:not-allowed;pointer-events:none}.thread{background:transparent;cursor:default;color:var(--muted)}.thread:hover{background:transparent}.status{display:inline-flex!important;width:auto!important;padding:4px 7px;border:1px solid var(--line);border-radius:999px;color:var(--soft)!important}.refs{margin-top:10px;font-size:11px;color:var(--muted);overflow-wrap:anywhere}
    .error{border:1px solid #5d2f2f;background:#1c1010;padding:14px;border-radius:14px;white-space:pre-wrap}
    @media(max-width:760px){header{align-items:flex-start;flex-direction:column}.stamp{text-align:left}.telemetry{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.rows{grid-template-columns:1fr 1fr}}
    @media(max-width:420px){main{padding-left:12px;padding-right:12px}.rows{grid-template-columns:1fr}.telemetry{grid-template-columns:repeat(2,minmax(0,1fr))}.metric:last-child{grid-column:1/-1}}
  </style>
</head>
<body data-prometeo-candidate="multi-surface-control-v1">
  <main>
    <header>
      <div><div class="eyebrow">Prometeo · candidate surface</div><h1>Control multi-superficie</h1></div>
      <div class="stamp" id="stamp"></div>
    </header>
    <div class="authority" id="authority"><span class="dot"></span><span></span></div>
    <section class="telemetry" id="telemetry" aria-label="Telemetría derivada"></section>
    <p class="projection-note">Live/telemetría es una proyección derivada. Claims, runs, returns y autoridad durable siguen siendo la fuente de verdad.</p>
    <section class="grid" id="surfaces" aria-label="Superficies"></section>
    <div id="error" class="error" hidden></div>
  </main>
  <script type="module">
    import { buildControlView } from './control-model.mjs';
    import { sampleState } from './sample-state.mjs';

    const state = window.PROMETEO_CONTROL_STATE || sampleState;
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));

    try {
      const view = buildControlView(state);
      document.querySelector('#stamp').textContent = `estado: ${view.generatedAt}`;
      document.querySelector('#authority span:last-child').textContent = view.authorityBanner;

      const metrics = [
        ['trabajando', view.telemetry.working],
        ['returns', view.telemetry.returned],
        ['sin leer', view.telemetry.unread],
        ['problemas', view.telemetry.problems],
        ['slots útiles', view.telemetry.usefulFreeSlots]
      ];
      document.querySelector('#telemetry').innerHTML = metrics.map(([label,value]) => `<div class="metric"><strong>${value}</strong><span>${label}</span></div>`).join('');

      document.querySelector('#surfaces').innerHTML = view.surfaces.map((surface) => {
        const previewEnabled = Boolean(surface.preview.href) && surface.preview.routeState !== 'UNRESOLVED';
        const preview = previewEnabled
          ? `<a class="button" href="${escapeHtml(surface.preview.href)}" target="_blank" rel="noopener">${escapeHtml(surface.preview.label)}</a>`
          : `<a class="button" aria-disabled="true" tabindex="-1">Ruta no resuelta</a>`;
        const threadKnown = surface.intent.threadRef !== 'UNRESOLVED';
        const thread = `<span class="button thread" role="status" title="${escapeHtml(surface.intent.threadRef)}">${threadKnown ? 'Hilo/intención disponible' : 'Hilo/intención no resuelto'}</span>`;
        return `<article class="card" data-surface-id="${escapeHtml(surface.id)}">
          <h2>${escapeHtml(surface.title)}</h2><div class="project">${escapeHtml(surface.projectId)}</div>
          <div class="intent"><b>Intención durable</b><p>${escapeHtml(surface.intent.summary)}</p></div>
          <div class="rows">
            <div class="row"><span>Workers activos</span><strong>${surface.workers.count}</strong></div>
            <div class="row"><span>Cambios retornados</span><strong>${surface.returns.count} · ${surface.returns.unread} sin leer</strong></div>
            <div class="row"><span>Integración local</span><strong class="status">${escapeHtml(surface.integration.status)}</strong></div>
            <div class="row"><span>Capacidad útil libre</span><strong class="capacity">${surface.capacity.usefulFreeSlots}</strong></div>
          </div>
          <div class="refs">hilo: ${escapeHtml(surface.intent.threadRef)}<br>evidencia: ${escapeHtml(surface.integration.evidenceRef)}<br>capacidad: ${escapeHtml(surface.capacity.basis)}</div>
          <div class="actions">${thread}${preview}</div>
        </article>`;
      }).join('');
    } catch (error) {
      document.querySelector('#error').hidden = false;
      document.querySelector('#error').textContent = error?.message || String(error);
    }
  </script>
</body>
</html>
