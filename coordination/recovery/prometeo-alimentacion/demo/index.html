<!doctype html>
<html lang="es" data-authority="RECONSTRUCTED_CANDIDATE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="prometeo-truth-state" content="RECONSTRUCTED_CANDIDATE">
<meta name="prometeo-authority" content="LAB_ONLY_NOT_CURRENT_NOT_HUMAN_ACCEPTED_NOT_SERVED">
<title>Alimentación · R08 reconstructed candidate</title>
<style>
:root{--bg:#16191f;--fg:#d8ff59;--tap:48px;--gap:12px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif}
body{min-height:100dvh;overscroll-behavior:none}
button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--fg);min-height:var(--tap);padding:0 14px;border-radius:9px;cursor:pointer;touch-action:manipulation;box-shadow:0 3px 0 var(--fg);transition:transform .08s ease,box-shadow .08s ease,background .12s ease,color .12s ease}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--fg)}
button[aria-pressed="true"],button.is-on{background:var(--fg);color:var(--bg)}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
main{width:min(100%,760px);margin:0 auto;padding:14px 14px 34px;display:grid;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;border-bottom:1px solid var(--fg);padding-bottom:10px}
.brand{font-size:13px;font-weight:800;letter-spacing:.13em}
.top-actions{display:flex;gap:8px}.top-actions button{min-height:40px;padding:0 10px;font-size:12px;box-shadow:0 2px 0 var(--fg)}
.block{display:grid;gap:10px}.label{font-size:11px;font-weight:800;letter-spacing:.16em;opacity:.82}
#roller{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:8px;align-items:stretch;touch-action:none;user-select:none;min-height:96px}
.choice{border:1px solid var(--fg);border-radius:10px;display:grid;place-items:center;text-align:center;padding:10px;font-weight:800;min-width:0;overflow-wrap:anywhere}
.choice.side{opacity:.42;cursor:pointer}.choice.center{background:var(--fg);color:var(--bg);box-shadow:0 4px 0 var(--fg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 5px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chips button{flex:0 0 auto;min-height:44px;box-shadow:0 2px 0 var(--fg)}
.balance{display:grid;gap:7px}.meter{display:grid;grid-template-columns:58px 1fr 32px;gap:8px;align-items:center;font-size:10px;font-weight:800;letter-spacing:.05em}.track{height:8px;border:1px solid var(--fg);border-radius:5px;overflow:hidden}.fill{height:100%;width:0;background:var(--fg);transition:width .18s ease}.meter output{text-align:right}
.actions{display:grid;grid-template-columns:1.5fr 1fr;gap:10px}.actions button{min-height:58px;font-weight:900}.actions #decide{background:var(--fg);color:var(--bg)}
#result{min-height:50px;border-top:1px solid var(--fg);border-bottom:1px solid var(--fg);display:flex;align-items:center;padding:10px 2px;font-weight:800;line-height:1.3}
#buyHead{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;box-shadow:0 2px 0 var(--fg)}
#buyPanel{display:grid;gap:14px;padding-top:4px}#buyPanel[hidden]{display:none}
.buy-group{display:grid;gap:7px}.buy-title{font-size:10px;font-weight:800;letter-spacing:.14em}.buy-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.buy-list button{min-height:44px;text-align:left;box-shadow:0 2px 0 var(--fg);overflow-wrap:anywhere}
footer{font-size:9px;letter-spacing:.1em;opacity:.65;text-align:center;padding-top:4px}
@media(min-width:620px){main{padding-top:22px}.buy-list{grid-template-columns:repeat(4,minmax(0,1fr))}#roller{min-height:112px}.choice{font-size:17px}}
@media(max-width:390px){main{padding-inline:10px;gap:15px}.actions{grid-template-columns:1fr}.meter{grid-template-columns:52px 1fr 28px}.choice{padding:7px;font-size:13px}.top-actions{gap:5px}.top-actions button{padding:0 7px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main id="app">
  <header>
    <div class="brand">ALIMENTACIÓN · R08</div>
    <div class="top-actions">
      <button id="theme" type="button">TEMA</button>
      <button id="reset" type="button">LIMPIAR</button>
    </div>
  </header>

  <section class="block" aria-labelledby="principalLabel">
    <div class="label" id="principalLabel">PRINCIPAL</div>
    <div id="roller" tabindex="0" aria-label="Selector principal">
      <div class="choice side" id="prevChoice" data-offset="-1"></div>
      <div class="choice center" id="currentChoice" aria-live="polite"></div>
      <div class="choice side" id="nextChoice" data-offset="1"></div>
    </div>
  </section>

  <section class="block" aria-labelledby="acompLabel">
    <div class="label" id="acompLabel">ACOMPAÑAR</div>
    <div class="chips" id="companions"></div>
  </section>

  <section class="block" aria-labelledby="balanceLabel">
    <div class="label" id="balanceLabel">BALANCE</div>
    <div class="balance" id="balance"></div>
  </section>

  <section class="actions" aria-label="Acciones">
    <button id="decide" type="button">HOY COMÉ ESTO</button>
    <button id="random" type="button">COMER ALGO</button>
  </section>

  <div id="result" aria-live="polite">Elegí una combinación.</div>

  <section class="block" aria-labelledby="buyHead">
    <button id="buyHead" type="button" aria-expanded="false"><span>COMPRAR</span><span id="buyCount">0</span></button>
    <div id="buyPanel" hidden></div>
  </section>

  <footer>RECONSTRUCTED_CANDIDATE · LAB ONLY</footer>
</main>
<script>
(()=>{
'use strict';
const AUTHORITY='RECONSTRUCTED_CANDIDATE';
const STORAGE='prometeo.alimentacion.r08.demo.v1';
const palettes=[
  ['#16191f','#d8ff59'],
  ['#f4d95e','#25224c'],
  ['#173d36','#ffcf5a'],
  ['#48243d','#ffd166'],
  ['#132c45','#ffdc7a'],
  ['#5a2b1c','#ffd46a']
];
const mains=[
  {name:'Huevos',score:{protein:72,carb:12,sugar:5,fat:56}},
  {name:'Legumbres',score:{protein:58,carb:55,sugar:10,fat:15}},
  {name:'Arroz',score:{protein:20,carb:82,sugar:6,fat:8}},
  {name:'Pasta',score:{protein:25,carb:78,sugar:7,fat:10}},
  {name:'Sándwich',score:{protein:42,carb:60,sugar:12,fat:34}}
];
const extras=[
  {name:'Verduras',score:{protein:4,carb:8,sugar:7,fat:0}},
  {name:'Fruta',score:{protein:1,carb:14,sugar:22,fat:0}},
  {name:'Pan',score:{protein:5,carb:20,sugar:4,fat:2}},
  {name:'Yogur',score:{protein:9,carb:8,sugar:10,fat:7}}
];
const shopping=[
  {group:'BASE',items:['Huevos','Legumbres','Arroz','Pasta','Pan']},
  {group:'FRESCO',items:['Verduras','Fruta','Yogur']}
];
const $=id=>document.getElementById(id);
const clamp=n=>Math.max(0,Math.min(100,Math.round(n)));
const cleanState=()=>({main:0,extras:[],shop:[],theme:0});
let state=cleanState();
try{
  const raw=JSON.parse(localStorage.getItem(STORAGE)||'null');
  if(raw&&typeof raw==='object')state={...state,...raw};
}catch{}
state.main=Number.isInteger(state.main)?((state.main%mains.length)+mains.length)%mains.length:0;
state.extras=Array.isArray(state.extras)?state.extras.filter(x=>extras.some(e=>e.name===x)):[];
state.shop=Array.isArray(state.shop)?state.shop.filter(x=>shopping.some(g=>g.items.includes(x))):[];
state.theme=Number.isInteger(state.theme)?((state.theme%palettes.length)+palettes.length)%palettes.length:0;

function save(){localStorage.setItem(STORAGE,JSON.stringify(state));}
function applyTheme(){
  const [bg,fg]=palettes[state.theme];
  document.documentElement.style.setProperty('--bg',bg);
  document.documentElement.style.setProperty('--fg',fg);
}
function mainAt(delta){return mains[(state.main+delta+mains.length)%mains.length];}
function rotate(delta){state.main=(state.main+delta+mains.length)%mains.length;save();renderChooser();renderBalance();}
function renderChooser(){
  $('prevChoice').textContent=mainAt(-1).name;
  $('currentChoice').textContent=mainAt(0).name;
  $('nextChoice').textContent=mainAt(1).name;
}
function renderExtras(){
  const host=$('companions');host.textContent='';
  extras.forEach(extra=>{
    const b=document.createElement('button');b.type='button';b.textContent=extra.name;
    const on=state.extras.includes(extra.name);b.setAttribute('aria-pressed',String(on));
    b.addEventListener('click',()=>{
      state.extras=state.extras.includes(extra.name)?state.extras.filter(x=>x!==extra.name):[...state.extras,extra.name];
      save();renderExtras();renderBalance();
    });
    host.appendChild(b);
  });
}
function totalScore(){
  const base={...mainAt(0).score};
  state.extras.forEach(name=>{
    const e=extras.find(x=>x.name===name);if(!e)return;
    for(const key of Object.keys(base))base[key]+=e.score[key];
  });
  const factor=1+state.extras.length*.22;
  for(const key of Object.keys(base))base[key]=clamp(base[key]/factor);
  return base;
}
const labels={protein:'PROT',carb:'CARB',sugar:'AZÚCAR',fat:'GRASA'};
function renderBalance(){
  const score=totalScore(),host=$('balance');host.textContent='';
  Object.keys(labels).forEach(key=>{
    const row=document.createElement('div');row.className='meter';
    const label=document.createElement('span');label.textContent=labels[key];
    const track=document.createElement('div');track.className='track';track.setAttribute('aria-hidden','true');
    const fill=document.createElement('div');fill.className='fill';fill.style.width=score[key]+'%';track.appendChild(fill);
    const out=document.createElement('output');out.value=score[key];out.textContent=score[key];
    row.append(label,track,out);host.appendChild(row);
  });
}
function suggestion(){
  const parts=[mainAt(0).name,...state.extras];
  $('result').textContent=parts.join(' + ');
}
function randomize(){
  let ticks=0;const max=8;
  $('random').disabled=true;
  const timer=setInterval(()=>{
    state.main=(state.main+1+Math.floor(Math.random()*(mains.length-1)))%mains.length;
    renderChooser();renderBalance();ticks++;
    if(ticks>=max){clearInterval(timer);save();$('random').disabled=false;suggestion();}
  },65);
}
function renderShopping(){
  const panel=$('buyPanel');panel.textContent='';
  shopping.forEach(group=>{
    const wrap=document.createElement('div');wrap.className='buy-group';
    const title=document.createElement('div');title.className='buy-title';title.textContent=group.group;wrap.appendChild(title);
    const list=document.createElement('div');list.className='buy-list';
    group.items.forEach(item=>{
      const b=document.createElement('button');b.type='button';b.textContent=item;
      const on=state.shop.includes(item);b.setAttribute('aria-pressed',String(on));
      b.addEventListener('click',()=>{
        state.shop=state.shop.includes(item)?state.shop.filter(x=>x!==item):[...state.shop,item];
        save();renderShopping();
      });
      list.appendChild(b);
    });
    wrap.appendChild(list);panel.appendChild(wrap);
  });
  $('buyCount').textContent=String(state.shop.length);
}
let start=null;
$('roller').addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY};$('roller').setPointerCapture?.(e.pointerId);});
$('roller').addEventListener('pointerup',e=>{
  if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;
  const dominant=Math.abs(dx)>Math.abs(dy)?dx:dy;
  if(Math.abs(dominant)>=28)rotate(dominant<0?1:-1);
});
$('roller').addEventListener('pointercancel',()=>{start=null;});
$('roller').addEventListener('wheel',e=>{e.preventDefault();rotate((Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX)>0?1:-1);},{passive:false});
$('roller').addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown'].includes(e.key)){e.preventDefault();rotate(1);}
  if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();rotate(-1);}
  if(e.key==='Enter'||e.key===' '){e.preventDefault();suggestion();}
});
$('prevChoice').addEventListener('click',()=>rotate(-1));
$('nextChoice').addEventListener('click',()=>rotate(1));
$('decide').addEventListener('click',suggestion);
$('random').addEventListener('click',randomize);
$('theme').addEventListener('click',()=>{state.theme=(state.theme+1)%palettes.length;save();applyTheme();});
$('reset').addEventListener('click',()=>{state=cleanState();save();applyTheme();render();$('result').textContent='Elegí una combinación.';});
$('buyHead').addEventListener('click',()=>{
  const open=$('buyHead').getAttribute('aria-expanded')==='true';
  $('buyHead').setAttribute('aria-expanded',String(!open));$('buyPanel').hidden=open;
});
function render(){applyTheme();renderChooser();renderExtras();renderBalance();renderShopping();}
render();
window.__PROMETEO_ALIMENTACION_R08__={authority:AUTHORITY,version:'reconstructed-candidate-v1'};
})();
</script>
</body>
</html>
