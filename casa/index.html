<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f2e9">
  <meta name="description" content="CASA: walkie de texto realtime con voces neuronales.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CASA">
  <title>CASA</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <section class="join" id="joinView">
      <button class="iconButton corner" id="joinSettings" type="button" aria-label="Configuración">•••</button>
      <div class="mark" aria-hidden="true"></div>
      <h1>CASA</h1>
      <p>Entrá. Escribí. Se escucha.</p>
      <form id="nameForm">
        <input id="nameInput" maxlength="24" autocomplete="nickname" placeholder="Tu nombre" aria-label="Tu nombre" required>
        <button class="primary" type="submit">Entrar</button>
        <small id="joinError" role="alert"></small>
      </form>
    </section>

    <section class="app hidden" id="chatView">
      <header class="topbar">
        <div class="brand"><i class="miniMark"></i><b>CASA</b></div>
        <button class="onlineButton" id="mobileCount" type="button">0</button>
        <div class="topActions">
          <button class="iconButton active" id="walkieToggle" type="button" aria-pressed="true" aria-label="Silenciar walkie">🔊</button>
          <button class="iconButton" id="settingsButton" type="button" aria-label="Configuración">•••</button>
        </div>
      </header>
      <div class="messages" id="messages" aria-live="polite"><div class="empty" id="empty"><b>Canal abierto.</b><span>El próximo mensaje aparece acá.</span></div></div>
      <button class="pendingPush hidden" id="pendingPush" type="button"><span>▶</span><b>Escuchar mensaje pendiente</b></button>
      <form class="composer" id="messageForm">
        <button class="voicePill emptyVoice" id="voiceButton" type="button" aria-label="Elegir voz"><span>＋</span><b>Voz</b></button>
        <input id="messageInput" maxlength="500" autocomplete="off" placeholder="Escribí para hablar…" aria-label="Mensaje" disabled>
        <button class="sendButton" id="sendButton" type="submit" disabled aria-label="Hablar">↑</button>
      </form>
    </section>
  </main>
  <dialog class="sheet" id="voiceSheet"><div class="sheetHandle"></div><div class="sheetHead"><div><b>Elegí tu voz</b><span>Una por persona. Las ocupadas quedan bloqueadas.</span></div><button class="closeButton" id="voiceClose" type="button" aria-label="Cerrar">×</button></div><div class="voiceList" id="voiceList"></div></dialog>
  <dialog class="sheet compact" id="settingsSheet"><div class="sheetHandle"></div><div class="sheetHead"><div><b>CASA</b><span id="settingsStatus">Configuración de este dispositivo</span></div><button class="closeButton" id="settingsClose" type="button" aria-label="Cerrar">×</button></div><div class="settingsList"><button class="settingRow" id="installButton" type="button"><span>Instalar CASA</span><small id="installState">PWA</small></button><button class="settingRow" id="notifyButton" type="button"><span>Notificaciones</span><small id="notifyState">Configurar</small></button><button class="settingRow" id="testNotifyButton" type="button"><span>Probar aviso</span><small>Push</small></button><button class="settingRow" id="wakeButton" type="button"><span>Mantener pantalla activa</span><small id="wakeState">Off</small></button><button class="settingRow danger" id="leaveButton" type="button"><span>Cambiar nombre / salir</span><small>Salir</small></button></div><p class="settingsHelp" id="settingsHelp"></p></dialog>
  <div class="toast hidden" id="toast" role="status"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
