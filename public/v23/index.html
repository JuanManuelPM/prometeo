<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Prometeo — V23</title><style>html,body{margin:0;width:100%;height:100%;background:#DED4C6}body{display:grid;place-items:center;font:14px system-ui;color:#4C3D19}</style></head><body><span id="status">Cargando…</span><script>(async()=>{try{const files=['00','01','02','03','04'];const parts=await Promise.all(files.map(n=>fetch(`payload/${n}.b64`,{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error(`payload ${n}: ${r.status}`);return r.text()})));const b=atob(parts.join('').replace(/\s/g,''));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('gzip decompression not supported');const ds=new DecompressionStream('gzip');const ab=await new Response(new Blob([u]).stream().pipeThrough(ds)).arrayBuffer();const html=new TextDecoder().decode(ab);document.open();document.write(html);document.close()}catch(e){document.getElementById('status').textContent='No se pudo abrir V23';console.error(e)}})();</script><script type="module" src="/prometeo/shared/prometeo-shell/v2/prometeo-shell.js?v=2" data-prometeo-shell></script>
