<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e1312"><title>SECUENCIA · MAPA COMPLETO</title>
<style>
:root{--bg:#0c1110;--fg:#edeadf;--edge:#a0b6a0;--accent:#dceacb}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--fg)}
header{height:78px;border-bottom:1px solid #34463c;display:flex;justify-content:space-between;align-items:center;padding:0 32px;gap:22px}
.title{font-weight:800;letter-spacing:-.047em;font-size:26px}.title em{font:italic 400 1em Georgia,serif;color:var(--accent)}
.eyebrow{font-size:10px;letter-spacing:.15em;color:#adbbad}
header a{color:#d8e4d4;font-size:11px;letter-spacing:.12em;text-decoration:none}
main{display:grid;grid-template-columns:1fr 300px;height:calc(100dvh - 78px)}
.board{min-width:0;display:flex;flex-direction:column}
.toolbar{display:flex;justify-content:space-between;align-items:center;height:51px;flex:0 0 51px;padding:0 18px;border-bottom:1px solid #334039;gap:15px}
.metrics{font-size:10px;letter-spacing:.11em;color:#aab9aa}
.controls{display:flex;align-items:center;gap:8px}
.controls input{width:180px;background:#18241d;border:1px solid #425b4e;color:#edf0e7;font:12px Arial;padding:8px}
.controls button{background:#202d26;color:#e5e9dd;border:1px solid #4b6252;width:34px;height:32px;font-size:17px;cursor:pointer}
.scroll{flex:1;min-height:0;overflow:auto;background:radial-gradient(circle at 40% 35%,#1f3025,#101814 60%);scrollbar-width:thin;touch-action:pan-x pan-y}
#graph{display:block;max-width:none;cursor:grab}
#graph:active{cursor:grabbing}
.lane{fill:#19241e;stroke:#425b49;stroke-width:1.5}
.lane-alt{fill:#1e2823}
.stage-title{font:700 21px Arial;fill:#e1e9d8;letter-spacing:-.7px}
.stage-desc{font:12px Arial;fill:#afbbad}
.stage-no{font:12px Arial;fill:#b6d5ae;letter-spacing:2px}
.edge{fill:none;stroke:#7c9b89;stroke-width:2;opacity:.42;stroke-linecap:round;stroke-linejoin:round}
.edge.no{stroke:#c7a888;opacity:.34;stroke-dasharray:5 5}
.edge.yes{stroke:#b8d3ae}
.edge.highlight{stroke:#dceacb;stroke-width:4;opacity:1}
.edge.faded{opacity:.08}
.node{cursor:pointer;outline:0}
.card{fill:#28382d;stroke:#5c765c;stroke-width:1.6}
.node.decision .card{fill:#334237;stroke:#adbfa0}
.node.gate .card{fill:#382f29;stroke:#b9a38d}
.node:hover .card,.node.selected .card,.node:focus-visible .card{stroke:#e5f5c8;stroke-width:3;fill:#3d5140}
.node.faded{opacity:.35}
.node-id{font:12px Arial;letter-spacing:1px;fill:#a2bfa5}
.node-name{font:bold 19px Arial;letter-spacing:-.25px;fill:#f3f1e7}
.node-type{font:10px Arial;letter-spacing:1.3px;fill:#b2c1b2}
aside{border-left:1px solid #34463c;background:#171f1a;overflow:auto;padding:25px 23px}
.kicker{font-size:10px;letter-spacing:.2em;color:#a6c9a1;font-weight:700}
#detailTitle{font-size:clamp(22px,2.6vw,34px);letter-spacing:-.05em;line-height:1.1;margin:15px 0}
#detailText{font-size:13px;color:#c3cfc4;line-height:1.75}
.tag{font-size:10px;color:#a9b9ae;letter-spacing:.1em;margin-top:25px}
aside button{width:100%;padding:12px 10px;background:#243228;border:1px solid #49604e;color:#e5f0d9;text-align:left;font:12px Arial;cursor:pointer;margin-top:8px}
.legend{position:fixed;bottom:12px;left:20px;font-size:10px;color:#b1c1b3;letter-spacing:.1em;pointer-events:none}
@media(max-width:780px){header{height:64px;padding:0 16px}.title{font-size:20px}main{height:calc(100dvh - 64px);grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}aside{max-height:28dvh;border-top:1px solid #34463c;border-left:0;padding:14px 18px}.toolbar{padding:0 9px}.metrics{display:none}.controls input{width:min(38vw,180px)}#detailTitle{font-size:20px;margin:8px 0}#detailText{margin:3px 0}.legend{display:none}}
</style></head><body>
<header><div><div class="eyebrow">PROMETEO · ESTUDIO AUDIOVISUAL</div><div class="title">FLUJO <em>COMPLETO.</em></div></div><a href="./">← VISTA POR ETAPAS</a></header>
<main><div class="board"><div class="toolbar"><div class="metrics">06 ETAPAS / 27 NODOS / 36 CONEXIONES</div><div class="controls"><input id="search" type="search" placeholder="Buscar nodo" aria-label="Buscar nodo"><button id="zoomOut" aria-label="Alejar">−</button><button id="zoomIn" aria-label="Acercar">+</button><button id="reset" aria-label="Ver completo">⌗</button></div></div><div id="scroll" class="scroll"><svg id="graph" role="img" aria-label="Mapa dirigido completo de producción audiovisual con veintisiete nodos y treinta y seis aristas" viewBox="0 0 3610 1500" width="3610" height="1500" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="none" stroke="#a8c1ab" stroke-width="1.4"/></marker></defs><g id="stages"></g><g id="edges"></g><g id="nodes"></g></svg></div></div>
<aside aria-label="Ficha de decisión"><div class="kicker" id="detailId">SELECCIONÁ UN NODO</div><h2 id="detailTitle">Decisiones verificables.</h2><p id="detailText">Cada nodo tiene salida principal, alternativa y una condición que la IA debe resolver.</p><div class="tag" id="detailStatus"></div><div id="nextLinks"></div></aside></main>
<div class="legend">ARRASTRÁ O DESPLAZÁ · ZOOM · TOCÁ UN NODO</div>
<script>
(async()=>{
const r=await fetch('./versions/1.0.1/flow.json',{cache:'no-store'});if(!r.ok)throw Error('FLOW_JSON_HTTP_'+r.status);
const data=await r.json(),map=new Map(data.nodes.map(n=>[n.id,n])),$=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const svg=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));parent.appendChild(e);return e};
const pos=new Map(),gid=new Map(),edgeEls=[];let selected=null,zoom=.8;
const nStages=$('stages'),nNodes=$('nodes'),nEdges=$('edges'),scroll=$('scroll'),graph=$('graph');
const X=stage=>80+data.stages.findIndex(x=>x.id===stage)*588;
data.stages.forEach((s,i)=>{
const x=X(s.id)-35,y=55,w=520,h=1390;
svg('rect',{x,y,width:w,height:h,rx:6,class:i%2?'lane lane-alt':'lane'},nStages);
let t=svg('text',{x:x+24,y:y+35,class:'stage-no'},nStages);t.textContent='0'+(i+1)+' / ETAPA';
t=svg('text',{x:x+24,y:y+68,class:'stage-title'},nStages);t.textContent=s.title;
t=svg('text',{x:x+24,y:y+92,class:'stage-desc'},nStages);t.textContent=s.subtitle;
const arr=data.nodes.filter(n=>n.stage===s.id);arr.forEach((n,j)=>pos.set(n.id,{x:X(s.id),y:181+j*165,w:435,h:105,order:j,stage:i}));
});
function edge(a,b,kind){
const p=pos.get(a.id),q=pos.get(b.id);if(!p||!q)return;
let d;
if(p.stage===q.stage){
 if(q.order===p.order+1)d='M'+(p.x+p.w/2)+' '+(p.y+p.h)+' V'+(q.y-11)+' Q'+(p.x+p.w/2)+' '+(q.y-3)+' '+(p.x+p.w/2)+' '+q.y;
 else {
  const channel=p.x+p.w+40+(kind==='no'?25:0);
  d='M'+(p.x+p.w)+' '+(p.y+52)+' H'+channel+' V'+(q.y+52)+' H'+(q.x+q.w);
 }
}else if(q.stage>p.stage){
 const sx=p.x+p.w,sy=p.y+52,tx=q.x,ty=q.y+52;
 d='M'+sx+' '+sy+' H'+(sx+35)+' C'+(sx+100)+' '+sy+','+(tx-110)+' '+ty+','+(tx-15)+' '+ty+' L'+tx+' '+ty;
}else{
 const sx=p.x,sy=p.y+52,tx=q.x+q.w,ty=q.y+52,rail=Math.min(p.y,q.y)-45;
 d='M'+sx+' '+sy+' H'+(sx-50)+' V'+rail+' H'+(tx+50)+' V'+ty+' H'+tx;
}
const el=svg('path',{d,class:'edge '+kind,'marker-end':'url(#arrow)','data-from':a.id,'data-to':b.id},nEdges);edgeEls.push(el);
}
data.nodes.forEach(n=>{for(const key of ['yes','no'])if(n[key])edge(n,map.get(n[key]),key)});
function wrap(text,max=29){const words=text.split(/\s+/),lines=[],line=()=>lines[lines.length-1];for(const w of words){if(!lines.length||line().length+w.length+1>max)lines.push(w);else lines[lines.length-1]+=' '+w}return lines.slice(0,2)}
data.nodes.forEach(n=>{
const p=pos.get(n.id),g=svg('g',{class:'node '+n.type,tabindex:0,role:'button','aria-label':n.id+' '+n.title,'data-id':n.id},nNodes);gid.set(n.id,g);
svg('rect',{x:p.x,y:p.y,width:p.w,height:p.h,rx:4,class:'card'},g);
let x=svg('text',{x:p.x+18,y:p.y+22,class:'node-id'},g);x.textContent=n.id;
x=svg('text',{x:p.x+18,y:p.y+47,class:'node-type'},g);x.textContent=n.type.toUpperCase();
wrap(n.title).forEach((line,i)=>{let e=svg('text',{x:p.x+18,y:p.y+76+i*19,class:'node-name'},g);e.textContent=line});
g.addEventListener('click',()=>choose(n.id,true));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(n.id,true)}});
});
function choose(id,move){
const n=map.get(id);if(!n)return;selected=id;
$('detailId').textContent=n.id+' · '+n.type.toUpperCase();$('detailTitle').textContent=n.title;$('detailText').textContent=n.contract;
$('detailStatus').textContent='ETAPA '+n.stage+' · TRANSICIONES';
$('nextLinks').replaceChildren();
for(const [k,label] of [['yes','SIGUE'],['no','SI NO']])if(n[k]){
 const b=document.createElement('button'),dest=map.get(n[k]);b.textContent=label+' → '+n[k]+' · '+dest.title;b.addEventListener('click',()=>choose(n[k],true));$('nextLinks').appendChild(b);
}
for(const [key,g]of gid)g.classList.toggle('selected',key===id);
for(const el of edgeEls){const hit=el.getAttribute('data-from')===id||el.getAttribute('data-to')===id;el.classList.toggle('highlight',hit);el.classList.toggle('faded',!hit)}
if(move){const p=pos.get(id);scroll.scrollTo({left:Math.max(0,p.x*zoom-scroll.clientWidth*.37),top:Math.max(0,p.y*zoom-scroll.clientHeight*.40),behavior:'smooth'})}
}
function scale(f){zoom=Math.min(1.45,Math.max(.42,zoom*f));graph.style.width=(3610*zoom)+'px';graph.style.height=(1500*zoom)+'px'}
$('zoomIn').addEventListener('click',()=>scale(1.18));$('zoomOut').addEventListener('click',()=>scale(1/1.18));
$('reset').addEventListener('click',()=>{zoom=.8;scale(1);scroll.scrollTo({left:0,top:0,behavior:'smooth'});choose('A01',false)});
$('search').addEventListener('input',e=>{
const q=e.target.value.trim().toLocaleLowerCase('es');
for(const [id,g]of gid){const n=map.get(id),has=!q||(id+' '+n.title+' '+n.contract).toLocaleLowerCase('es').includes(q);g.classList.toggle('faded',!has)}
if(q){const first=data.nodes.find(n=>(n.id+' '+n.title+' '+n.contract).toLocaleLowerCase('es').includes(q));if(first)choose(first.id,true)}
});
scale(1);choose('A01',false);
Object.defineProperty(window,'__graphQA',{value:Object.freeze({nodes:()=>gid.size,edges:()=>edgeEls.length,selected:()=>selected,select:(id)=>choose(id,true)})});
})().catch(e=>{document.getElementById('detailText').textContent='No se pudo recuperar el mapa versionado.';console.error(e)});
</script></body></html>
