<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><meta name="theme-color" content="#101611"><meta name="color-scheme" content="dark"><title>PROMETEO / ÁRBOL · NO SENTIR NADA</title>
<style>
:root{--ink:#101611;--deep:#0b110d;--paper:#f1f0e8;--green:#d1dfb5;--sage:#a4b895;--mute:#7d8b79;--edge:#3a473b;--fog:#202b21;--chrome:clamp(14px,3vw,45px)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);overscroll-behavior:none}
body{font-family:Arial,Helvetica,sans-serif;color:var(--paper);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}button{font:inherit}button:focus-visible{outline:2px solid var(--green);outline-offset:5px}
#app{position:fixed;inset:0;isolation:isolate;background:var(--ink)}
#cinema{position:absolute;inset:0;z-index:1;display:block!important;opacity:1!important;visibility:visible!important;background:#000;pointer-events:none;overflow:hidden}
#film{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;background:#000;outline:none;pointer-events:none}
#shield{position:absolute;inset:0;pointer-events:auto;touch-action:none}
#map{position:absolute;inset:0;z-index:3;background:var(--ink);opacity:1;visibility:visible;pointer-events:auto;transition:opacity .2s ease}
#map.off{opacity:0;visibility:hidden;pointer-events:none}
#scroll{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain;scrollbar-color:#6d7e64 transparent;scrollbar-width:thin;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#world{position:relative;width:min(100%,1060px);margin:0 auto;min-height:1900px;overflow:visible}
#lines{position:absolute;inset:0;z-index:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#nodes{position:absolute;inset:0;z-index:2;pointer-events:none}
#topbar{position:absolute;inset:0 0 auto;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:20px var(--chrome) 28px;pointer-events:none;background:linear-gradient(180deg,#101611f6 0%,#101611cc 55%,#10161100 100%)}
#topbar>*{pointer-events:auto}.brand{font-size:11px;font-weight:900;letter-spacing:.24em;color:var(--green)}.topright{display:flex;align-items:center;gap:23px}
#count{font:800 12px/1 Arial,sans-serif;letter-spacing:.16em;color:var(--paper);font-variant-numeric:tabular-nums}
#reset{border:0;color:var(--sage);background:transparent;font-size:25px;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;opacity:.8}
#reset:hover{color:var(--paper);opacity:1}
#root{position:absolute;z-index:2;left:50%;transform:translateX(-50%);top:138px;width:min(72%,650px);height:185px;border:1px solid var(--paper);background:var(--paper);color:var(--ink);padding:clamp(18px,3vw,38px);text-align:left;display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;cursor:default}
.root-mark{font-size:10px;letter-spacing:.21em;font-weight:900;color:#506348}
#root strong{font-size:clamp(36px,6.2vw,76px);line-height:.88;letter-spacing:-.09em;font-weight:900;white-space:pre-line}
.root-end{height:2px;background:#758968;width:100%}
.tree-node{position:absolute;display:flex;flex-direction:column;justify-content:space-between;gap:17px;min-height:171px;width:360px;padding:19px 21px;border:1px solid #566651;background:#182019;color:var(--paper);text-align:left;cursor:pointer;pointer-events:auto;transform:translateY(0);transition:background .16s,border-color .16s,color .16s,transform .16s,box-shadow .16s}
.tree-node:hover{border-color:var(--green);background:#222d22;transform:translateY(-2px);box-shadow:0 12px 40px #0003}
.tree-node:active{transform:scale(.985)}.tree-node.watched{background:#d5ddc7;color:#182218;border-color:#d5ddc7}
.tree-node.emphasis:not(.watched){background:#e8ede0;color:#152015;border-color:#e8ede0}
.node-top{display:flex;justify-content:space-between;align-items:center;font:800 10px/1.1 Arial,sans-serif;letter-spacing:.20em;opacity:.75}
.node-title{font-size:clamp(27px,3.8vw,49px);font-weight:900;letter-spacing:-.07em;line-height:.98;overflow-wrap:break-word;text-wrap:balance}
.node-bottom{display:flex;align-items:center;justify-content:space-between;border-top:1px solid currentColor;padding-top:11px;opacity:.83;font-size:12px;font-weight:800;letter-spacing:.11em}
.node-bottom b{font-size:20px;font-weight:400;line-height:.7}
#reward{position:absolute;z-index:2;left:50%;transform:translateX(-50%);width:min(74%,520px);min-height:147px;background:#172018;border:1px solid #5b6a56;color:#9baa91;display:flex;flex-direction:column;justify-content:space-between;text-align:left;padding:23px 27px;cursor:not-allowed}
#reward.unlocked{background:#cad9b4;border-color:#cad9b4;color:#182019;cursor:pointer;box-shadow:0 0 55px #abbc8b24}
.reward-top{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.18em;font-weight:900}.reward-title{font-size:clamp(27px,4vw,55px);line-height:.93;letter-spacing:-.08em;font-weight:900}
#slate{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;justify-content:space-between;gap:24px;padding:clamp(33px,7vh,90px) clamp(35px,9vw,140px);background:var(--paper);color:var(--ink);pointer-events:none}
#slate.open{display:flex}#slate.dark{background:#18221a;color:var(--paper)}
.slate-top{font-size:11px;letter-spacing:.25em;font-weight:900;color:inherit;opacity:.65}.slate-title{font-weight:900;font-size:clamp(56px,12vw,156px);line-height:.86;letter-spacing:-.09em;max-width:9ch}.slate-rule{height:2px;width:100%;background:currentColor;opacity:.7}
#back{position:absolute;top:clamp(15px,4vw,35px);left:clamp(15px,4vw,40px);z-index:8;border:1px solid #dce6d174;background:#101611dd;color:var(--paper);width:52px;height:52px;display:none;align-items:center;justify-content:center;font-size:35px;line-height:1;cursor:pointer;touch-action:manipulation}
#back.open{display:flex}
#ending{position:absolute;inset:0;z-index:6;background:var(--paper);color:var(--ink);display:none;flex-direction:column;justify-content:center;padding:clamp(42px,10vw,135px);pointer-events:none}
#ending.open{display:flex}#ending strong{font-size:clamp(51px,10vw,148px);font-weight:900;line-height:.91;letter-spacing:-.09em;white-space:pre-line}
#warning{position:absolute;inset:0;z-index:7;background:var(--ink);display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:35px;color:var(--paper);text-align:center}
#warning.open{display:flex}#warning strong{font-size:clamp(39px,8vw,76px);letter-spacing:-.085em;line-height:.95}
#warning button{border:1px solid #bcccad;background:transparent;color:var(--paper);font-size:13px;letter-spacing:.15em;font-weight:900;padding:14px 18px;cursor:pointer}
#warning .warning-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}#file-input{display:none}
#buffer{position:absolute;bottom:7vh;left:0;right:0;text-align:center;z-index:6;display:none;font-size:12px;font-weight:800;letter-spacing:.18em;color:var(--paper);pointer-events:none}
#buffer.open{display:block}
@media(max-width:650px){#topbar{padding-top:16px}#root{top:115px;height:168px;width:78%;padding:20px}#root strong{font-size:clamp(37px,9vw,62px)}.tree-node{min-height:150px;padding:15px 12px;gap:12px}.node-title{font-size:clamp(22px,5.1vw,29px)}.node-top{font-size:9px}.node-bottom{font-size:10px;padding-top:8px}.node-bottom b{font-size:18px}#reward{min-height:132px;padding:18px;width:76%}.reward-title{font-size:31px}#slate{padding:45px 29px}.slate-title{font-size:clamp(52px,13vw,92px)}}
@media(min-width:651px) and (max-height:540px){#topbar{padding-top:13px}#root{top:81px;height:126px;padding:15px 24px}#root strong{font-size:clamp(37px,6vw,56px)}#root .root-end{height:1px}.tree-node{min-height:145px}}
@media(prefers-reduced-motion:reduce){#map,.tree-node{transition:none}}
</style></head>
<body><main id="app" aria-label="SECUENCIA, árbol audiovisual interactivo">
<section id="cinema" aria-label="Reproducción del fragmento"><video id="film" playsinline webkit-playsinline preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate nofullscreen"></video><div id="shield" aria-hidden="true"></div></section>
<section id="map"><header id="topbar"><span class="brand">P / SECUENCIA</span><div class="topright"><span id="count">00 / 05</span><button id="reset" type="button" aria-label="Reiniciar árbol" title="Reiniciar">↺</button></div></header>
<div id="scroll" role="region" aria-label="Árbol de fragmentos desplazable verticalmente"><div id="world"><svg id="lines" aria-hidden="true" viewBox="0 0 1000 2000" preserveAspectRatio="none"></svg><div id="root"><span class="root-mark">SECUENCIA / 001</span><strong>NO SENTIR<br>NADA.</strong><span class="root-end"></span></div><div id="nodes"></div><button id="reward" type="button" disabled><span class="reward-top"><span>✳ / 02 RAMAS</span><span id="reward-counter">00 / 02</span></span><strong class="reward-title">SÍNTESIS</strong></button></div></div></section>
<section id="slate" aria-hidden="true"><span id="slate-code" class="slate-top"></span><strong id="slate-title" class="slate-title"></strong><span class="slate-rule"></span></section>
<section id="ending" aria-hidden="true"><strong id="ending-title"></strong></section>
<section id="warning" aria-live="polite"><strong id="warning-title">VIDEO NO DISPONIBLE</strong><div class="warning-actions"><button id="choose-file" type="button">ELEGIR ARCHIVO ↗</button><button id="warning-return" type="button">VOLVER ↶</button></div><input id="file-input" type="file" accept="video/*"></section>
<div id="buffer" aria-live="polite">PREPARANDO IMAGEN</div><button id="back" type="button" aria-label="Volver al árbol">‹</button>
<script id="story-data" type="application/json">__STORY_JSON__</script>
<script>'use strict';
/*__FRAME_GUARD_INLINE__*/
/*__TREE_ENGINE_INLINE__*/
</script></main></body></html>
