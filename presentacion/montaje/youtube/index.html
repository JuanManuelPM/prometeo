<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101310"><meta name="color-scheme" content="dark"><title>SECUENCIA · UNA IDEA</title>
<style>
:root{color-scheme:dark;--ink:#101310;--paper:#f0ebde;--accent:#cae2a2}*{box-sizing:border-box}html,body{margin:0;height:100%;width:100%;overflow:hidden;overscroll-behavior:none;background:var(--ink);-webkit-tap-highlight-color:transparent}body{font-family:Arial,Helvetica,sans-serif;user-select:none;-webkit-user-select:none}#stage{position:fixed;inset:0;display:grid;place-items:center;background:#000;overflow:hidden}#film{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;outline:0;background:#000}#start{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;padding:clamp(35px,7vh,94px) clamp(36px,7vw,124px);border:0;color:var(--ink);background:var(--paper);font:inherit;text-align:left;cursor:pointer;transition:opacity .2s ease;z-index:2;touch-action:manipulation}#start[hidden]{display:none}#start .eyebrow{font-weight:800;font-size:clamp(10px,1.1vw,15px);letter-spacing:.22em}#start .title{font-weight:900;font-size:clamp(44px,9vw,150px);line-height:.95;letter-spacing:-.09em;max-width:9.2em}#start .title em{font-family:Georgia,serif;font-weight:400;color:#718256}#start .foot{font-weight:800;font-size:clamp(12px,1.4vw,18px);letter-spacing:.15em;border-top:2px solid #60734d;padding-top:23px}#start:focus-visible{outline:3px solid var(--accent);outline-offset:-8px}#stage.running{cursor:default}#stage.running *{touch-action:none}#status{display:none;position:absolute;bottom:7vh;left:10vw;right:10vw;font-size:13px;font-weight:700;letter-spacing:.13em;text-align:center;color:var(--paper);pointer-events:none}#status.visible{display:block}body.ended #stage{background:var(--ink)}@media(max-width:600px){#start{padding:48px 35px}#start .title{font-size:clamp(42px,12vw,80px)}#start .foot{font-size:11px}}
</style></head><body><main id="stage" aria-label="Montaje audiovisual continuo"><video id="film" playsinline webkit-playsinline preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate nofullscreen" src="./montaje.mp4" aria-label="Video montado, sin controles de reproducción"></video><button id="start" type="button" aria-label="Comenzar a mirar la secuencia"><span class="eyebrow">PROMETEO / ESTUDIO AUDIOVISUAL</span><span class="title">UNA IDEA.<br>TRES <em>cortes.</em></span><span class="foot">TOCÁ PARA VER&nbsp; ↗</span></button><div id="status" role="status" aria-live="polite"></div></main>
<script>
'use strict';
const video=document.getElementById('film'),start=document.getElementById('start'),status=document.getElementById('status'),stage=document.getElementById('stage');let started=false;
function message(s){status.textContent=s;status.classList.toggle('visible',!!s)}
start.addEventListener('click',()=>{if(started)return;started=true;stage.classList.add('running');video.currentTime=0;const p=video.play();if(p?.then)p.then(()=>{start.hidden=true;message('')}).catch(()=>{started=false;stage.classList.remove('running');message('TOCÁ PARA VOLVER A INTENTAR')});else start.hidden=true});
video.addEventListener('playing',()=>{if(started){start.hidden=true;message('')}});
video.addEventListener('error',()=>{started=false;start.hidden=false;message('NO SE PUDO REPRODUCIR EL MONTAJE')});
video.addEventListener('ended',()=>document.body.classList.add('ended'));
video.addEventListener('contextmenu',e=>e.preventDefault());
// Sin listeners de click o toque sobre el video. El espectador no puede pausar ni adelantar.
window.__sequenceQA={started:()=>started,paused:()=>video.paused,ended:()=>video.ended,controls:()=>video.controls,duration:()=>video.duration};
</script></body></html>
