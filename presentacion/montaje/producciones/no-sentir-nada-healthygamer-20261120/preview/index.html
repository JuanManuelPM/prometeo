<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><meta name="theme-color" content="#101310"><meta name="color-scheme" content="dark"><title>SECUENCIA · NO SENTIR NADA</title><style>
:root{--ink:#101310;--paper:#f0ebde;--sage:#cae2a2;--sage-dark:#718256}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);overscroll-behavior:none}body{font-family:Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}#stage{position:fixed;inset:0;background:#000;overflow:hidden}#film{position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain;pointer-events:none;outline:none}#blocker{position:absolute;inset:0;z-index:3;touch-action:none;cursor:default}#cover,#card{position:absolute;inset:0;z-index:4;padding:clamp(33px,7vh,94px) clamp(36px,7vw,124px);background:var(--ink);color:var(--paper);display:flex;flex-direction:column;justify-content:space-between;gap:24px}#cover{background:var(--paper);color:var(--ink);border:0;width:100%;text-align:left;cursor:pointer;font:inherit;touch-action:manipulation}#cover[hidden],#card[hidden]{display:none}#card.paper{background:var(--paper);color:var(--ink)}.eyebrow{font-size:clamp(10px,1.2vw,15px);letter-spacing:.21em;font-weight:800;line-height:1.35}.headline{font-size:clamp(42px,8.6vw,144px);line-height:.98;letter-spacing:-.084em;font-weight:900;margin:0;overflow-wrap:break-word}.headline em{font-family:Georgia,'Times New Roman',serif;color:var(--sage);font-weight:400}.paper .headline em,#cover .headline em{color:var(--sage-dark)}.foot{border-top:2px solid currentColor;padding-top:18px;font-size:clamp(11px,1vw,16px);font-weight:800;letter-spacing:.16em}#card{pointer-events:none}#card .foot{opacity:.45}#cover:focus-visible{outline:3px solid var(--sage);outline-offset:-6px}#error{position:absolute;left:0;right:0;bottom:7vh;z-index:6;color:white;text-align:center;pointer-events:none;font-weight:700;letter-spacing:.12em;font-size:12px;opacity:0;padding:0 16px}#error.visible{opacity:1}@media(max-width:620px){#cover,#card{padding:clamp(35px,8vh,68px) 37px}.headline{font-size:clamp(39px,11vw,75px)}.foot{font-size:11px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main id="stage"><video id="film" playsinline webkit-playsinline preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate nofullscreen" aria-label="Recortes continuos sin controles"></video><div id="blocker" aria-hidden="true"></div><button id="cover" type="button"><span class="eyebrow">PROMETEO / SECUENCIA</span><h1 class="headline">NO SENTIR<br><em>nada.</em></h1><span class="foot" id="cover-note">PREPARANDO VIDEO…</span></button><section id="card" hidden aria-live="polite"><span class="eyebrow" id="card-kicker"></span><h2 class="headline" id="card-title"></h2><span class="foot">PROMETEO</span></section><div id="error" role="status" aria-live="polite"></div></main><script>
'use strict';
// La fuente se entrega en el fragmento (#src=...). NO se guarda en GitHub.
// Los intervalos corresponden a bloques de transcripción del episodio; QA auditiva pendiente.
const VIDEO_ID='CgIGel3zXEI';
const defaultCuts=[{start:156,end:227},{start:357,end:418},{start:887,end:939},{start:1030,end:1072}];
const defaultCards=[{ms:700,kicker:'01 / LA DIFERENCIA',text:'NO ES UN\nDIAGNÓSTICO.',paper:false},{ms:700,kicker:'02 / EL MECANISMO',text:'NO SOLO\nLO MALO.',paper:true},{ms:700,kicker:'03 / OBSERVAR',text:'LO QUE\nEVITAMOS.',paper:false},{ms:1000,kicker:'PROMETEO / CONTEXTO',text:'PEDIR AYUDA\nIMPORTA.',paper:true}];
const cuts=window.__QA_CUTS||defaultCuts,cards=window.__QA_CARDS||defaultCards;
const film=document.querySelector('#film'),cover=document.querySelector('#cover'),card=document.querySelector('#card'),note=document.querySelector('#cover-note'),error=document.querySelector('#error');
let phase='loading',current=0,readyStart=false,gesture=false,cardDelay=false,seekReady=false,timer=0,serial=0,playing=false;
function warn(s){error.textContent=s||'';error.classList.toggle('visible',Boolean(s))}
function showCard(c){card.classList.toggle('paper',!!c.paper);document.querySelector('#card-kicker').textContent=c.kicker;document.querySelector('#card-title').textContent=c.text;card.hidden=false}
function safeURL(){let s=new URLSearchParams(location.hash.replace(/^#/,''));let v=s.get('src');if(!v)return null;try{const u=new URL(v);if(u.protocol!=='https:'||u.hostname!=='storage.googleapis.com'||!u.pathname.startsWith('/vidiq-user-videos/')||!u.pathname.endsWith('.mp4'))return null;return u.href}catch(e){return null}}
function markFirst(){if(phase!=='loading')return;if(!Number.isFinite(film.duration)||film.duration<cuts[cuts.length-1].end-1){phase='failed';note.textContent='FUENTE INCOMPATIBLE';warn('EL ARCHIVO NO CONTIENE LOS FRAGMENTOS');return}if(Math.abs(film.currentTime-cuts[0].start)>0.15){try{film.currentTime=cuts[0].start}catch(e){}return}readyStart=true;phase='ready';note.textContent='TOCÁ PARA VER';}
function trySeekFirst(){if(phase!=='loading')return;if(film.readyState>=1){try{film.currentTime=cuts[0].start}catch(e){};if(!film.seeking)markFirst()}}
function playCurrent(expected){if(expected!==serial)return;const p=film.play();if(p?.then)p.then(()=>{if(expected===serial){playing=true;phase='video';card.hidden=true;cover.hidden=true;warn('')}}).catch(()=>{if(expected!==serial)return;phase='blocked';cover.hidden=false;note.textContent='TOCÁ PARA CONTINUAR';warn('EL NAVEGADOR BLOQUEÓ LA REPRODUCCIÓN CON SONIDO')});else{playing=true;phase='video';card.hidden=true;cover.hidden=true}}
function next(){if(phase!=='video')return;film.pause();playing=false;phase='card';const thisCard=cards[current]||cards[cards.length-1];showCard(thisCard);const nextIndex=current+1;serial++;const g=serial;clearTimeout(timer);if(nextIndex>=cuts.length){phase='ending';timer=setTimeout(()=>{if(g===serial)phase='finished'},thisCard.ms);return}
current=nextIndex;seekReady=false;cardDelay=false;try{film.currentTime=cuts[current].start}catch(e){warn('NO SE PUDO CAMBIAR DE FRAGMENTO')}
timer=setTimeout(()=>{if(g!==serial)return;cardDelay=true;attemptNext(g)},thisCard.ms);
if(!film.seeking&&Math.abs(film.currentTime-cuts[current].start)<.18){seekReady=true;attemptNext(g)}
}
function attemptNext(g){if(g!==serial||phase!=='card'||!seekReady||!cardDelay)return;phase='starting';playCurrent(g)}
film.addEventListener('loadedmetadata',trySeekFirst);
film.addEventListener('seeked',()=>{if(phase==='loading'){markFirst();return}if(phase==='card'&&Math.abs(film.currentTime-cuts[current].start)<.18){seekReady=true;attemptNext(serial)}});
film.addEventListener('playing',()=>{if(phase==='starting'||phase==='ready'||phase==='blocked'){playing=true;phase='video';card.hidden=true;cover.hidden=true;warn('')}});
film.addEventListener('timeupdate',()=>{if(phase==='video'&&playing&&film.currentTime>=cuts[current].end-.12)next()});
film.addEventListener('ended',()=>{if(phase==='video')next()});
film.addEventListener('error',()=>{if(phase==='loading'||phase==='ready'||phase==='starting'||phase==='video'){phase='failed';note.textContent='ERROR DE VIDEO';cover.hidden=false;warn('NO SE PUDO CARGAR EL VIDEO')}});
cover.addEventListener('click',()=>{gesture=true;if(phase==='ready'||phase==='blocked'){serial++;const g=serial;cover.hidden=false;playCurrent(g)}else if(phase==='loading'){note.textContent='PREPARANDO VIDEO…'}});
film.addEventListener('contextmenu',e=>e.preventDefault());
const source=safeURL();if(source){film.src=source;film.load();trySeekFirst()}else{phase='failed';note.textContent='FUENTE NO DISPONIBLE';warn('ABRÍ EL ENLACE COMPLETO DE LA PRESENTACIÓN')}
window.__sequenceQA={state:()=>phase,index:()=>current,ready:()=>readyStart,playing:()=>playing,seeked:()=>seekReady,controls:()=>film.controls,cut:()=>cuts[current],next};
</script></body></html>
