<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1420"><title>Prometeo TV</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#0d1420;color:#e6edf4;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{min-height:100dvh;display:grid;place-items:center}.app{width:min(720px,100%);min-height:100dvh;padding:18px 14px 24px;display:flex;flex-direction:column;gap:14px}.top{font-size:9px;letter-spacing:.16em;color:#5d7087;padding:2px 2px 0}.stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#0a1019;border:1px solid #ffffff0d;display:grid;place-items:center}.stage:empty:before{content:'TV';font-size:11px;letter-spacing:.18em;color:#35465a}.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.close{position:absolute;z-index:2;top:8px;right:8px;width:30px;height:30px;border:0;border-radius:50%;background:#0d1420cc;color:#8da0b4;font-size:18px;line-height:1;display:none}.stage.playing .close{display:block}.dock{margin-top:auto}.row{display:grid;grid-template-columns:1fr 54px;gap:8px}.search{width:100%;height:54px;border:1px solid #ffffff13;background:#111b28;color:#e6edf4;border-radius:17px;padding:0 16px;font-size:16px;outline:none}.search:focus{border-color:#ffffff26}.play{appearance:none;border:1px solid #89aa9940;background:#78978614;color:#c9d8d0;border-radius:17px;font-size:19px;font-weight:700;display:grid;place-items:center;touch-action:manipulation}.play:active{transform:translateY(1px);background:#78978621}.meta{height:21px;padding:7px 4px 0;font-size:9px;color:#61758c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta.ready{color:#829e90}.meta.error{color:#ad7b82}.spinner{width:14px;height:14px;border-radius:50%;border:2px solid #78978633;border-top-color:#9db5a8;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(min-width:780px){.app{min-height:auto;padding:24px}.dock{margin-top:0}}</style></head><body><main class="app"><div class="top">PROMETEO TV</div><section id="stage" class="stage"><button id="close" class="close" aria-label="cerrar">×</button></section><section class="dock"><div class="row"><input id="q" class="search" autocomplete="off" placeholder="Buscar una canción o video"><button id="play" class="play" aria-label="reproducir">▶</button></div><div id="meta" class="meta"></div></section></main><script>(()=>{'use strict';const API='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/prometeo-tv-media-v1';const stage=document.getElementById('stage'),q=document.getElementById('q'),play=document.getElementById('play'),meta=document.getElementById('meta'),close=document.getElementById('close');const params=new URLSearchParams(location.hash.slice(1));let cap=params.get('k')||localStorage.getItem('prometeo.tv.simple.cap.v1')||'';if(params.get('k'))localStorage.setItem('prometeo.tv.simple.cap.v1',params.get('k'));let prepared=null,timer=null,seq=0;function setMeta(text,kind=''){meta.textContent=text||'';meta.className='meta'+(kind?' '+kind:'')}async function search(text){const my=++seq;const query=text.replace(/\s+/g,' ').trim();if(query.length<2)return null;setMeta('buscando…');try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'search',token:cap,q:query}),cache:'no-store'});const d=await r.json().catch(()=>({}));if(my!==seq)return null;if(!r.ok||!d.ok)throw new Error(d.error||'No pude buscar');prepared={query,result:d.result};setMeta(d.result.title||query,'ready');return prepared}catch(e){if(my===seq){prepared=null;setMeta(String(e.message||e),'error')}return null}}function preload(){clearTimeout(timer);const text=q.value.trim();if(text.length<2){prepared=null;setMeta('');return}timer=setTimeout(()=>search(text),950)}async function go(){const text=q.value.trim();if(!text)return;q.blur();play.innerHTML='<span class="spinner"></span>';let hit=prepared&&prepared.query===text?prepared:await search(text);play.textContent='▶';if(!hit)return;const f=document.createElement('iframe');f.allow='autoplay; encrypted-media; picture-in-picture';f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';f.src=hit.result.embed_url;stage.querySelectorAll('iframe').forEach(x=>x.remove());stage.prepend(f);stage.classList.add('playing');setMeta(hit.result.title||text,'ready')}q.addEventListener('input',preload);q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});play.addEventListener('click',go);close.addEventListener('click',()=>{stage.querySelectorAll('iframe').forEach(x=>x.remove());stage.classList.remove('playing');setMeta(prepared?.result?.title||'','ready')});if(!cap)setMeta('Abrí el link vinculado una vez para activar esta prueba.','error')})();</script></body></html>
