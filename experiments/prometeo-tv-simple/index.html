<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1420"><title>Prometeo TV</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#0d1420;color:#e6edf4;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{min-height:100dvh}.app{width:min(720px,100%);min-height:100dvh;margin:auto;padding:18px 14px 28px;display:flex;flex-direction:column;gap:14px}.top{font-size:9px;letter-spacing:.16em;color:#5d7087;padding:2px 2px 0}.stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#0a1019;border:1px solid #ffffff0d;display:grid;place-items:center}.stage:empty:before{content:'TV';font-size:11px;letter-spacing:.18em;color:#35465a}.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.close{position:absolute;z-index:2;top:8px;right:8px;width:30px;height:30px;border:0;border-radius:50%;background:#0d1420cc;color:#8da0b4;font-size:18px;line-height:1;display:none}.stage.playing .close{display:block}.row{display:grid;grid-template-columns:1fr 54px;gap:8px}.search{width:100%;height:54px;border:1px solid #ffffff13;background:#111b28;color:#e6edf4;border-radius:17px;padding:0 16px;font-size:16px;outline:none}.search:focus{border-color:#ffffff26}.play{appearance:none;border:1px solid #89aa9940;background:#78978614;color:#c9d8d0;border-radius:17px;font-size:19px;font-weight:700;display:grid;place-items:center;touch-action:manipulation}.play:active{transform:translateY(1px);background:#78978621}.meta{height:21px;padding:7px 4px 0;font-size:9px;color:#61758c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta.ready{color:#829e90}.meta.error{color:#ad7b82}.spinner{width:14px;height:14px;border-radius:50%;border:2px solid #78978633;border-top-color:#9db5a8;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.section{border-top:1px solid #ffffff0f;padding-top:13px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.head span{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#5d7087}.channelRail{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.channelRail::-webkit-scrollbar{display:none}.channel{appearance:none;flex:0 0 auto;height:38px;border:1px solid #ffffff12;background:#111b28;color:#8fa1b3;border-radius:13px;padding:0 12px;font-weight:650;font-size:11px;white-space:nowrap}.channel.active{border-color:#89aa9940;background:#78978612;color:#c5d5cd}.channel.add{width:38px;padding:0;font-size:18px;color:#66798f}.channelInfo{display:flex;align-items:center;gap:9px;min-height:36px;margin:4px 0 9px}.avatar{width:34px;height:34px;border-radius:50%;background:#111b28;object-fit:cover}.channelName{font-size:13px;font-weight:700;line-height:1.1}.channelMeta{font-size:8px;color:#5f7186;margin-top:4px}.videos{display:flex;flex-direction:column;gap:9px}.video{appearance:none;width:100%;border:1px solid #ffffff10;background:#101925;color:#dce5ed;border-radius:15px;padding:8px;display:grid;grid-template-columns:116px 1fr;gap:10px;text-align:left;min-height:76px}.video:active{transform:translateY(1px);background:#14202e}.thumb{width:116px;aspect-ratio:16/9;border-radius:10px;object-fit:cover;background:#0a1019}.vtitle{font-size:11px;font-weight:650;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.vdate{font-size:8px;color:#5f7186;margin-top:7px}.loading{padding:18px 3px;color:#60748d;font-size:10px}.empty{padding:14px 3px;color:#60748d;font-size:10px}@media(min-width:780px){.app{padding:24px}.video{grid-template-columns:150px 1fr}.thumb{width:150px}}</style></head><body><main class="app"><div class="top">PROMETEO TV</div><section id="stage" class="stage"><button id="close" class="close" aria-label="cerrar">×</button></section><section><div class="row"><input id="q" class="search" autocomplete="off" placeholder="Buscar una canción o video"><button id="play" class="play" aria-label="reproducir">▶</button></div><div id="meta" class="meta"></div></section><section class="section"><div class="head"><span>canales</span></div><div id="channels" class="channelRail"></div><div id="channelInfo" class="channelInfo"></div><div id="videos" class="videos"></div></section></main><script>(()=>{'use strict';const API='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/prometeo-tv-media-v1';const stage=document.getElementById('stage'),q=document.getElementById('q'),play=document.getElementById('play'),meta=document.getElementById('meta'),close=document.getElementById('close'),channels=document.getElementById('channels'),channelInfo=document.getElementById('channelInfo'),videos=document.getElementById('videos');const params=new URLSearchParams(location.hash.slice(1));let cap=params.get('k')||localStorage.getItem('prometeo.tv.simple.cap.v1')||'';if(params.get('k'))localStorage.setItem('prometeo.tv.simple.cap.v1',params.get('k'));let prepared=null,timer=null,seq=0,channelSeq=0,activeChannel='';const baseChannels=['Veritasium','Kurzgesagt – In a Nutshell','Marques Brownlee','Corridor Crew'];let saved=[];try{saved=JSON.parse(localStorage.getItem('prometeo.tv.channels.v1')||'[]')}catch{}let channelList=[...new Set([...baseChannels,...saved])];function setMeta(text,kind=''){meta.textContent=text||'';meta.className='meta'+(kind?' '+kind:'')}async function call(action,text){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token:cap,q:text}),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'No pude cargar');return d.result}async function search(text){const my=++seq,query=text.replace(/\s+/g,' ').trim();if(query.length<2)return null;setMeta('buscando…');try{const result=await call('search',query);if(my!==seq)return null;prepared={query,result};setMeta(result.title||query,'ready');return prepared}catch(e){if(my===seq){prepared=null;setMeta(String(e.message||e),'error')}return null}}function preload(){clearTimeout(timer);const text=q.value.trim();if(text.length<2){prepared=null;setMeta('');return}timer=setTimeout(()=>search(text),950)}function playResult(result){const f=document.createElement('iframe');f.allow='autoplay; encrypted-media; picture-in-picture';f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';f.src=result.embed_url;stage.querySelectorAll('iframe').forEach(x=>x.remove());stage.prepend(f);stage.classList.add('playing');setMeta(result.title||'reproduciendo','ready');window.scrollTo({top:0,behavior:'smooth'})}async function go(){const text=q.value.trim();if(!text)return;q.blur();play.innerHTML='<span class="spinner"></span>';const hit=prepared&&prepared.query===text?prepared:await search(text);play.textContent='▶';if(hit)playResult(hit.result)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dateLabel(iso){if(!iso)return'';const d=new Date(iso);return new Intl.DateTimeFormat('es-AR',{day:'numeric',month:'short',year:'numeric'}).format(d)}function compact(n){return new Intl.NumberFormat('es-AR',{notation:'compact',maximumFractionDigits:1}).format(Number(n||0))}function renderChannels(){channels.innerHTML='';for(const name of channelList){const b=document.createElement('button');b.className='channel'+(name===activeChannel?' active':'');b.textContent=name;b.onclick=()=>loadChannel(name);channels.appendChild(b)}const add=document.createElement('button');add.className='channel add';add.textContent='+';add.setAttribute('aria-label','agregar canal');add.onclick=()=>{const name=prompt('Nombre del canal de YouTube');if(!name)return;const clean=name.trim();if(!clean)return;if(!channelList.includes(clean)){channelList.push(clean);saved=[...new Set([...saved,clean])];localStorage.setItem('prometeo.tv.channels.v1',JSON.stringify(saved))}loadChannel(clean)};channels.appendChild(add)}async function loadChannel(name){const my=++channelSeq;activeChannel=name;renderChannels();channelInfo.innerHTML='';videos.innerHTML='<div class="loading">cargando últimos videos…</div>';try{const out=await call('channel_latest',name);if(my!==channelSeq)return;const c=out.channel||{};channelInfo.innerHTML=`${c.thumbnail?`<img class="avatar" src="${esc(c.thumbnail)}" alt="">`:''}<div><div class="channelName">${esc(c.title||name)}</div><div class="channelMeta">${compact(c.subscriber_count)} suscriptores · ${compact(c.video_count)} videos</div></div>`;videos.innerHTML='';for(const v of out.videos||[]){const b=document.createElement('button');b.className='video';b.innerHTML=`<img class="thumb" src="${esc(v.thumbnail)}" alt=""><div><div class="vtitle">${esc(v.title)}</div><div class="vdate">${esc(dateLabel(v.published_at))}</div></div>`;b.onclick=()=>playResult(v);videos.appendChild(b)}if(!(out.videos||[]).length)videos.innerHTML='<div class="empty">No encontré videos recientes.</div>';const idx=channelList.indexOf(name);if(idx>=0)channelList[idx]=c.title||name;activeChannel=c.title||name;renderChannels()}catch(e){if(my===channelSeq)videos.innerHTML=`<div class="empty">${esc(e.message||e)}</div>`}}q.addEventListener('input',preload);q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});play.addEventListener('click',go);close.addEventListener('click',()=>{stage.querySelectorAll('iframe').forEach(x=>x.remove());stage.classList.remove('playing');setMeta(prepared?.result?.title||'','ready')});renderChannels();if(cap)loadChannel(channelList[0]);else setMeta('Abrí el link vinculado una vez para activar esta prueba.','error')})();</script></body></html>
