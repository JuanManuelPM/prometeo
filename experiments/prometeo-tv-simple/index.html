<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1420"><title>Prometeo TV</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#0d1420;color:#e7edf4;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}.app{width:min(760px,100%);min-height:100dvh;margin:auto;padding:16px 13px 30px}.top{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px}.brand{font-size:9px;letter-spacing:.16em;color:#5e7187}.source{appearance:none;border:1px solid #ffffff12;background:#111b28;color:#aebdca;border-radius:14px;height:38px;padding:0 13px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:7px}.source.active{background:#78978612;border-color:#89aa993a;color:#c8d7cf}.yt{width:18px;height:13px;border-radius:5px;background:#93a89d1f;border:1px solid #93a89d42;display:grid;place-items:center;font-size:8px}.stage{display:none;position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#0a1019;border:1px solid #ffffff0d;margin-bottom:12px}.stage.show{display:block}.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.close{position:absolute;z-index:2;top:8px;right:8px;width:30px;height:30px;border:0;border-radius:50%;background:#0d1420d9;color:#8fa1b5;font-size:18px}.searchRow{display:grid;grid-template-columns:1fr 54px;gap:8px}.search{width:100%;height:54px;border:1px solid #ffffff12;background:#111b28;color:#e7edf4;border-radius:17px;padding:0 16px;font-size:16px;outline:none}.search:focus{border-color:#ffffff25}.play{appearance:none;border:1px solid #89aa9940;background:#78978614;color:#c9d8d0;border-radius:17px;font-size:19px;font-weight:700;display:grid;place-items:center}.play:active{transform:translateY(1px);background:#78978620}.meta{height:20px;padding:6px 4px 0;font-size:9px;color:#61758c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta.ready{color:#829e90}.meta.error{color:#ad7b82}.spinner{width:14px;height:14px;border-radius:50%;border:2px solid #78978633;border-top-color:#9db5a8;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.panel{display:none;margin-top:13px}.panel.open{display:block}.filters{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:1px 0 10px}.filters::-webkit-scrollbar{display:none}.chip{appearance:none;flex:0 0 auto;height:36px;border:1px solid #ffffff10;background:#101925;color:#8193a6;border-radius:13px;padding:0 11px;font-size:10px;font-weight:650;white-space:nowrap}.chip.active{border-color:#89aa9940;background:#78978612;color:#c6d6cd}.chip.folder:before{content:'▰';font-size:7px;margin-right:6px;color:#70869d}.chip.channel:before{content:'•';margin-right:6px;color:#7e9e8d}.chip.add{width:36px;padding:0;font-size:18px;color:#63768c}.feedHead{display:flex;align-items:center;justify-content:space-between;margin:1px 3px 9px}.feedTitle{font-size:10px;font-weight:700;color:#99aabd}.feedMeta{font-size:8px;color:#596b80}.videos{display:flex;flex-direction:column;gap:8px}.video{appearance:none;width:100%;border:1px solid #ffffff0d;background:#101925;color:#dfe6ee;border-radius:15px;padding:8px;display:grid;grid-template-columns:128px 1fr;gap:10px;text-align:left;min-height:80px}.video:active{transform:translateY(1px);background:#14202e}.thumbWrap{position:relative;width:128px;aspect-ratio:16/9}.thumb{width:100%;height:100%;border-radius:10px;object-fit:cover;background:#0a1019}.dur{position:absolute;right:5px;bottom:5px;background:#0b111bd9;color:#d9e2ea;border-radius:5px;padding:2px 4px;font-size:7px;font-weight:700}.vtitle{font-size:11px;font-weight:650;line-height:1.24;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.vmeta{font-size:8px;color:#5f7186;margin-top:7px;line-height:1.35}.loading,.empty{padding:22px 4px;color:#60748d;font-size:10px}.sheet{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;background:#0008;backdrop-filter:blur(5px)}.sheet.open{display:flex}.sheetCard{width:100%;max-width:760px;margin:auto;background:#101925;border-radius:20px 20px 0 0;border:1px solid #ffffff12;border-bottom:0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}.handle{width:34px;height:4px;border-radius:99px;background:#ffffff18;margin:0 auto 14px}.sheetTitle{font-size:12px;font-weight:700;margin:0 2px 10px}.field{width:100%;height:50px;border:1px solid #ffffff12;background:#0d1622;color:#e7edf4;border-radius:14px;padding:0 13px;outline:none;margin-top:8px}.save{width:100%;height:50px;border:1px solid #89aa9940;background:#78978614;color:#c7d7ce;border-radius:14px;font-weight:700;margin-top:10px}.hint{font-size:8px;color:#56697e;margin:8px 3px 0;line-height:1.4}@media(min-width:780px){.app{padding:22px}.video{grid-template-columns:164px 1fr}.thumbWrap{width:164px}.sheetCard{border-radius:20px;margin-bottom:20px;border-bottom:1px solid #ffffff12}}</style></head><body><main class="app"><header class="top"><div class="brand">PROMETEO TV</div><button id="youtubeBtn" class="source active"><span class="yt">▶</span>YouTube</button></header><section id="stage" class="stage"><button id="close" class="close" aria-label="cerrar">×</button></section><section><div class="searchRow"><input id="q" class="search" autocomplete="off" placeholder="Buscar canción o video"><button id="play" class="play" aria-label="reproducir">▶</button></div><div id="meta" class="meta"></div></section><section id="youtubePanel" class="panel open"><div id="filters" class="filters"></div><div class="feedHead"><div id="feedTitle" class="feedTitle">Últimos videos</div><div id="feedMeta" class="feedMeta">sin Shorts</div></div><div id="videos" class="videos"><div class="loading">cargando canales…</div></div></section></main><div id="sheet" class="sheet"><div class="sheetCard"><div class="handle"></div><div class="sheetTitle">Agregar canal</div><input id="channelName" class="field" placeholder="Nombre del canal"><input id="folderName" class="field" placeholder="Carpeta · ej. Ciencia"><button id="saveChannel" class="save">Guardar</button><div class="hint">Si escribís una carpeta nueva, se crea automáticamente.</div></div></div><script>(()=>{'use strict';const API='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/prometeo-tv-media-v1';const stage=document.getElementById('stage'),q=document.getElementById('q'),play=document.getElementById('play'),meta=document.getElementById('meta'),close=document.getElementById('close'),youtubeBtn=document.getElementById('youtubeBtn'),youtubePanel=document.getElementById('youtubePanel'),filters=document.getElementById('filters'),videos=document.getElementById('videos'),feedTitle=document.getElementById('feedTitle'),feedMeta=document.getElementById('feedMeta'),sheet=document.getElementById('sheet'),channelName=document.getElementById('channelName'),folderName=document.getElementById('folderName'),saveChannel=document.getElementById('saveChannel');const params=new URLSearchParams(location.hash.slice(1));let cap=params.get('k')||localStorage.getItem('prometeo.tv.simple.cap.v1')||'';if(params.get('k'))localStorage.setItem('prometeo.tv.simple.cap.v1',params.get('k'));const defaults=[{name:'Veritasium',folder:'Ciencia'},{name:'Kurzgesagt – In a Nutshell',folder:'Ciencia'},{name:'Marques Brownlee',folder:'Tecnología'},{name:'Corridor Crew',folder:'Cine'}];let saved=[];try{const raw=JSON.parse(localStorage.getItem('prometeo.tv.channels.v2')||'null');if(Array.isArray(raw))saved=raw.map(x=>typeof x==='string'?{name:x,folder:'Otros'}:x).filter(x=>x?.name)}catch{}if(!saved.length){try{const old=JSON.parse(localStorage.getItem('prometeo.tv.channels.v1')||'[]');saved=(Array.isArray(old)?old:[]).map(x=>typeof x==='string'?{name:x,folder:'Otros'}:x).filter(x=>x?.name)}catch{}}function dedupe(list){const m=new Map;for(const x of list){const key=String(x.name||'').trim().toLowerCase();if(key&&!m.has(key))m.set(key,{name:String(x.name).trim(),folder:String(x.folder||'Otros').trim()||'Otros'})}return[...m.values()]}let channels=dedupe([...defaults,...saved]);let feed=null,filter={type:'all',value:''},prepared=null,timer=null,seq=0,feedSeq=0;function persist(){const base=new Set(defaults.map(x=>x.name.toLowerCase()));const custom=channels.filter(x=>!base.has(x.name.toLowerCase()));localStorage.setItem('prometeo.tv.channels.v2',JSON.stringify(custom))}function setMeta(text,kind=''){meta.textContent=text||'';meta.className='meta'+(kind?' '+kind:'')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dateLabel(iso){if(!iso)return'';return new Intl.DateTimeFormat('es-AR',{day:'numeric',month:'short'}).format(new Date(iso))}async function api(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:cap,...body}),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'No pude cargar');return d.result}async function search(text){const my=++seq,query=text.replace(/\s+/g,' ').trim();if(query.length<2)return null;setMeta('buscando…');try{const result=await api({action:'search',q:query});if(my!==seq)return null;prepared={query,result};setMeta(result.title||query,'ready');return prepared}catch(e){if(my===seq){prepared=null;setMeta(String(e.message||e),'error')}return null}}function preload(){clearTimeout(timer);const text=q.value.trim();if(text.length<2){prepared=null;setMeta('');return}timer=setTimeout(()=>search(text),850)}function playResult(result){const f=document.createElement('iframe');f.allow='autoplay; encrypted-media; picture-in-picture';f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';f.src=result.embed_url;stage.querySelectorAll('iframe').forEach(x=>x.remove());stage.prepend(f);stage.classList.add('show');setMeta(result.title||'reproduciendo','ready');window.scrollTo({top:0,behavior:'smooth'})}async function go(){const text=q.value.trim();if(!text)return;q.blur();play.innerHTML='<span class="spinner"></span>';const hit=prepared&&prepared.query===text?prepared:await search(text);play.textContent='▶';if(hit)playResult(hit.result)}function folders(){return[...new Set(channels.map(x=>x.folder).filter(Boolean))]}function renderFilters(){filters.innerHTML='';const addChip=(label,type,value,cls='')=>{const b=document.createElement('button');b.className='chip '+cls+((filter.type===type&&filter.value===value)?' active':'');b.textContent=label;b.onclick=()=>{filter={type,value};renderFilters();renderFeed()};filters.appendChild(b)};addChip('Todo','all','','');for(const f of folders())addChip(f,'folder',f,'folder');for(const c of channels)addChip(c.name,'channel',c.name,'channel');const add=document.createElement('button');add.className='chip add';add.textContent='+';add.onclick=()=>{channelName.value='';folderName.value='';sheet.classList.add('open');setTimeout(()=>channelName.focus(),120)};filters.appendChild(add)}function currentVideos(){if(!feed)return[];let list=feed.videos||[];if(filter.type==='folder'){const names=new Set(channels.filter(c=>c.folder===filter.value).map(c=>c.name));list=list.filter(v=>names.has(v.channel_query))}else if(filter.type==='channel')list=list.filter(v=>v.channel_query===filter.value);return list}function renderFeed(){const list=currentVideos();if(filter.type==='all')feedTitle.textContent='Últimos videos';else if(filter.type==='folder')feedTitle.textContent=filter.value;else feedTitle.textContent=filter.value;feedMeta.textContent=`${list.length} · sin Shorts`;videos.innerHTML='';if(!feed){videos.innerHTML='<div class="loading">cargando canales…</div>';return}if(!list.length){videos.innerHTML='<div class="empty">No encontré videos largos recientes acá.</div>';return}for(const v of list){const b=document.createElement('button');b.className='video';b.innerHTML=`<div class="thumbWrap"><img class="thumb" src="${esc(v.thumbnail||'')}" alt="">${v.duration?`<span class="dur">${esc(v.duration)}</span>`:''}</div><div><div class="vtitle">${esc(v.title||'')}</div><div class="vmeta">${esc(v.channel_title||v.channel_query||'')} · ${esc(dateLabel(v.published_at))}</div></div>`;b.onclick=()=>playResult(v);videos.appendChild(b)}}async function loadFeed(){const my=++feedSeq;videos.innerHTML='<div class="loading">mezclando últimos videos…</div>';try{const out=await api({action:'feed',channels:channels.map(c=>c.name)});if(my!==feedSeq)return;feed=out;renderFilters();renderFeed()}catch(e){if(my===feedSeq)videos.innerHTML=`<div class="empty">${esc(e.message||e)}</div>`}}q.addEventListener('input',preload);q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});play.addEventListener('click',go);close.addEventListener('click',()=>{stage.querySelectorAll('iframe').forEach(x=>x.remove());stage.classList.remove('show');setMeta(prepared?.result?.title||'','ready')});youtubeBtn.addEventListener('click',()=>{youtubePanel.classList.toggle('open');youtubeBtn.classList.toggle('active',youtubePanel.classList.contains('open'))});sheet.addEventListener('click',e=>{if(e.target===sheet)sheet.classList.remove('open')});saveChannel.addEventListener('click',()=>{const name=channelName.value.trim(),folder=folderName.value.trim()||'Otros';if(!name)return;const found=channels.find(c=>c.name.toLowerCase()===name.toLowerCase());if(found)found.folder=folder;else channels.push({name,folder});channels=dedupe(channels);persist();sheet.classList.remove('open');filter={type:'all',value:''};renderFilters();loadFeed()});renderFilters();if(cap)loadFeed();else{setMeta('Abrí el link vinculado una vez para activar esta prueba.','error');videos.innerHTML='<div class="empty">Falta vincular esta página.</div>'}})();</script></body></html>
