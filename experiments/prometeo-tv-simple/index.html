<title>Prometeo TV</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#0d1420;color:#e7edf4;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit;color:inherit}.app{width:min(760px,100%);min-height:100dvh;margin:auto;padding:18px 14px 158px}.topline{display:flex;align-items:center;justify-content:space-between;margin:1px 0 16px}.brand{font-size:9px;letter-spacing:.16em;color:#5d7087}.roomBtn{border:0;background:transparent;color:#5d7087;font:700 8px ui-monospace,SFMono-Regular,Menlo,monospace;padding:8px 0}.view{display:none}.view.active{display:block}.viewHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.viewTitle{font-size:21px;font-weight:760;letter-spacing:-.035em}.iconBtn{appearance:none;border:0;background:transparent;color:#91a3b6;width:42px;height:42px;display:grid;place-items:center;font-size:20px;padding:0}.stage{display:none;position:relative;width:100%;aspect-ratio:16/9;background:#070c13;border-top:1px solid #ffffff10;border-bottom:1px solid #ffffff10;margin:0 0 13px}.stage.show{display:block}.stage #ytPlayer{position:absolute;inset:0;width:100%;height:100%}.stage iframe{width:100%;height:100%;border:0}.closeStage{position:absolute;z-index:3;right:7px;top:7px;width:31px;height:31px;border:0;background:#0d1420dc;color:#9aabba;font-size:21px}.searchPane{display:none;border-top:1px solid #ffffff10;border-bottom:1px solid #ffffff10;padding:8px 0 7px;margin-bottom:11px}.searchPane.open{display:block}.searchRow{display:grid;grid-template-columns:1fr 48px;gap:8px}.search{width:100%;height:46px;border:0;border-bottom:1px solid #ffffff1b;background:transparent;padding:0 3px;font-size:15px;outline:none}.search:focus{border-bottom-color:#8ca194}.playSearch{border:0;background:transparent;font-size:18px;color:#a8bbb0}.meta{height:17px;padding:4px 3px 0;font-size:8px;color:#607287;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta.ready{color:#819b8d}.meta.error{color:#ad7b82}.tabs{display:flex;border-bottom:1px solid #ffffff10;margin-bottom:3px}.tab{appearance:none;border:0;border-bottom:2px solid transparent;background:transparent;color:#66798e;height:40px;padding:0 0;margin-right:24px;font-size:11px;font-weight:700}.tab.active{color:#dce5ec;border-bottom-color:#899d92}.section{display:none}.section.active{display:block}.sectionTitle{display:flex;justify-content:space-between;align-items:center;padding:12px 0 6px}.sectionTitle strong{font-size:12px}.sectionTitle span{font-size:8px;color:#596c81}.videoList{display:flex;flex-direction:column}.video{appearance:none;width:100%;border:0;border-bottom:1px solid #ffffff0d;background:transparent;color:#dfe6ee;padding:10px 0;display:grid;grid-template-columns:138px 1fr;gap:11px;text-align:left;min-height:89px}.video:active{background:#ffffff04}.thumbWrap{position:relative;width:138px;aspect-ratio:16/9}.thumb{width:100%;height:100%;object-fit:cover;background:#09111a}.dur{position:absolute;right:4px;bottom:4px;background:#081019e6;color:#e0e8ef;padding:2px 4px;font-size:7px;font-weight:700}.vtitle{font-size:11px;font-weight:680;line-height:1.27;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.vmeta{font-size:8px;color:#607287;margin-top:7px;line-height:1.35}.loading,.empty{padding:26px 0;color:#607287;font-size:10px}.channelGrid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #ffffff0d}.channel{appearance:none;border:0;border-right:1px solid #ffffff0d;border-bottom:1px solid #ffffff0d;background:transparent;min-height:82px;padding:12px 8px;display:flex;align-items:center;gap:10px;text-align:left}.channel:nth-child(even){border-right:0}.channel:active{background:#ffffff04}.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#121c28;flex:0 0 44px}.channelName{font-size:11px;font-weight:700;line-height:1.2}.channelSmall{font-size:7px;color:#617388;margin-top:4px}.addChannel{border:0;background:transparent;color:#74879c;padding:16px 0;font-size:10px}.categoryList{border-top:1px solid #ffffff0d}.category{appearance:none;border:0;border-bottom:1px solid #ffffff0d;background:transparent;width:100%;height:58px;display:flex;align-items:center;justify-content:space-between;text-align:left;padding:0}.category strong{font-size:12px}.category span{font-size:9px;color:#617388}.detail{display:none}.detail.open{display:block}.browse.hidden{display:none}.back{appearance:none;border:0;background:transparent;color:#93a5b7;padding:8px 0 11px;font-size:10px}.detailHead{font-size:17px;font-weight:750;margin:0 0 5px}.reader textarea{width:100%;min-height:46vh;background:transparent;border:0;border-top:1px solid #ffffff10;border-bottom:1px solid #ffffff10;resize:none;outline:none;padding:14px 2px;font-size:16px;line-height:1.55}.readerControls,.timerControls{display:flex;border-top:1px solid #ffffff10;border-bottom:1px solid #ffffff10}.flatControl{flex:1;height:48px;border:0;border-right:1px solid #ffffff10;background:transparent;color:#93a5b7;font-size:11px;font-weight:700}.flatControl:last-child{border-right:0}.pomodoroTop{text-align:center;padding:16px 0 22px}.phase{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#6b7e92}.timer{font-size:74px;font-weight:300;letter-spacing:-.055em;margin:3px 0 8px;font-variant-numeric:tabular-nums}.settings{border-top:1px solid #ffffff10;margin-top:17px}.setting{display:grid;grid-template-columns:1fr auto;align-items:center;height:54px;border-bottom:1px solid #ffffff0d}.settingLabel{font-size:11px}.stepper{display:flex;align-items:center}.stepper button{width:38px;height:38px;border:0;background:transparent;color:#71859a;font-size:18px}.stepper span{min-width:52px;text-align:center;font-size:11px;color:#b7c4d0}.tasks{margin-top:22px}.tasksHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.tasksHead strong{font-size:12px}.taskComposer{display:grid;grid-template-columns:1fr 46px;border-top:1px solid #ffffff10;border-bottom:1px solid #ffffff10}.taskInput{height:48px;border:0;background:transparent;outline:none;padding:0 2px;font-size:13px}.mic{border:0;background:transparent;color:#829689;font-size:18px}.mic.listening{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}.taskList{display:flex;flex-direction:column}.task{display:grid;grid-template-columns:34px 1fr 30px;align-items:center;min-height:52px;border-bottom:1px solid #ffffff0d}.check{width:22px;height:22px;border:1px solid #6f8296;border-radius:50%;background:transparent;display:grid;place-items:center;color:#0d1420;font-size:12px}.task.done .check{background:#8ca194;border-color:#8ca194}.taskText{font-size:12px;line-height:1.25}.task.done .taskText{color:#66798e;text-decoration:line-through}.taskStamp{font-size:7px;color:#506276;margin-top:3px}.deleteTask{border:0;background:transparent;color:#506276;font-size:17px}.mini{position:fixed;z-index:35;left:50%;transform:translateX(-50%);bottom:88px;width:min(730px,calc(100% - 22px));height:58px;display:none;align-items:center;gap:10px;padding:7px 9px 7px 12px;background:#101925ef;border:1px solid #ffffff12;box-shadow:0 9px 24px #0005;backdrop-filter:blur(14px)}.mini.show{display:flex}.miniText{min-width:0;flex:1}.miniTitle{font-size:10px;font-weight:720;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.miniMeta{font-size:7px;color:#607287;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.transport{display:flex;align-items:center;gap:7px}.transport button{width:38px;height:38px;border:1px solid #ffffff12;background:linear-gradient(145deg,#151f2d,#0d1520);color:#a9bbb0;box-shadow:3px 3px 8px #060a0f,-2px -2px 6px #1a2838aa;font-size:16px}.transport button:active{transform:translateY(1px);box-shadow:inset 2px 2px 5px #060a0f,inset -1px -1px 4px #1a2838aa}.transport .primary{width:42px;height:42px;color:#d9e4dd;border-color:#81988a55}.dock{position:fixed;z-index:40;left:0;right:0;bottom:0;height:86px;padding:7px 16px calc(7px + env(safe-area-inset-bottom));background:#0d1420f2;border-top:1px solid #ffffff11;backdrop-filter:blur(14px)}.dockInner{height:100%;max-width:360px;margin:auto;display:flex;justify-content:space-around;align-items:center}.appButton{appearance:none;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:5px;color:#65788e;min-width:82px;font-size:8px}.appButton.active{color:#d3dde6}.appIcon{width:44px;height:44px;display:grid;place-items:center;border:1px solid transparent}.appButton.active .appIcon{background:linear-gradient(145deg,#141e2a,#0c131c);border-color:#ffffff0d;box-shadow:4px 4px 9px #070b10,-3px -3px 7px #1a2736aa}.ytLogo{width:36px;height:25px;background:#ff0033;border-radius:7px;position:relative}.ytLogo:after{content:'';position:absolute;left:14px;top:7px;border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}.textLogo{font-size:23px;font-weight:700;letter-spacing:-.06em;color:#9bb0c3}.timerLogo{width:32px;height:32px;border:2px solid #8da397;border-radius:50%;position:relative}.timerLogo:before{content:'';position:absolute;width:8px;height:2px;background:#8da397;top:-5px;left:10px}.timerLogo:after{content:'';position:absolute;width:2px;height:9px;background:#8da397;left:14px;top:7px;transform-origin:bottom;transform:rotate(35deg)}.drawer,.shareSheet{position:fixed;z-index:70;inset:0;background:#0009;display:none;align-items:flex-end}.drawer.open,.shareSheet.open{display:flex}.drawerPanel,.sharePanel{width:100%;max-width:760px;margin:auto;background:#0d1420;border-top:1px solid #ffffff18;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}.drawerTitle,.shareTitle{font-size:12px;font-weight:750;margin-bottom:10px}.field{width:100%;height:48px;background:transparent;border:0;border-bottom:1px solid #ffffff16;outline:none;padding:0 2px;margin-bottom:8px}.save,.copyLink{width:100%;height:48px;border:0;border-top:1px solid #ffffff13;border-bottom:1px solid #ffffff13;background:transparent;color:#a9bbb0;font-weight:700;margin-top:10px}.roomCode{font:700 26px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;margin:12px 0 4px}.shareHint{font-size:8px;color:#607287;line-height:1.45}.toast{position:fixed;z-index:90;top:14px;left:50%;transform:translateX(-50%);background:#172230;border:1px solid #ffffff14;padding:8px 12px;font-size:9px;color:#b7c5d1;display:none}.toast.show{display:block}@media(max-width:410px){.video{grid-template-columns:118px 1fr}.thumbWrap{width:118px}.timer{font-size:64px}.mini{bottom:86px}}
</style>
</head>
<body>
<main class="app">
  <div class="topline"><div class="brand">PROMETEO TV</div><button id="roomBtn" class="roomBtn">conectando…</button></div>

  <section id="youtubeView" class="view active">
    <div class="viewHead"><div class="viewTitle">YouTube</div><button id="searchToggle" class="iconBtn" aria-label="buscar">⌕</button></div>
    <section id="stage" class="stage"><div id="ytPlayer"></div><button id="closeStage" class="closeStage" aria-label="cerrar">×</button></section>
    <section id="searchPane" class="searchPane"><div class="searchRow"><input id="q" class="search" autocomplete="off" placeholder="Buscar video o canción"><button id="playSearch" class="playSearch">▶</button></div><div id="meta" class="meta"></div></section>
    <div id="browse" class="browse">
      <nav class="tabs"><button class="tab active" data-tab="recent">Recientes</button><button class="tab" data-tab="channels">Canales</button><button class="tab" data-tab="categories">Categorías</button></nav>
      <section id="recent" class="section active"><div class="sectionTitle"><strong>Últimos videos</strong><span>sin Shorts</span></div><div id="recentVideos" class="videoList"><div class="loading">cargando…</div></div></section>
      <section id="channels" class="section"><div id="channelGrid" class="channelGrid"></div><button id="addChannel" class="addChannel">＋ agregar canal</button></section>
      <section id="categories" class="section"><div id="categoryList" class="categoryList"></div></section>
    </div>
    <section id="detail" class="detail"><button id="detailBack" class="back">← volver</button><div id="detailTitle" class="detailHead"></div><div id="detailVideos" class="videoList"></div></section>
  </section>

  <section id="readerView" class="view reader">
    <div class="viewHead"><div class="viewTitle">Texto</div></div>
    <textarea id="readerText" placeholder="Pegá o escribí texto para leerlo en voz alta…"></textarea>
    <div class="readerControls"><button id="readStart" class="flatControl">Leer</button><button id="readPause" class="flatControl">Pausa</button><button id="readStop" class="flatControl">Detener</button></div>
  </section>

  <section id="pomodoroView" class="view">
    <div class="viewHead"><div class="viewTitle">Pomodoro</div></div>
    <div class="pomodoroTop"><div id="phaseLabel" class="phase">trabajo</div><div id="timer" class="timer">25:00</div></div>
    <div class="timerControls"><button id="timerStart" class="flatControl">Empezar</button><button id="timerReset" class="flatControl">Reiniciar</button></div>
    <div class="settings"><div class="setting"><div class="settingLabel">Trabajo</div><div class="stepper"><button data-step="work" data-delta="-5">−</button><span id="workValue">25 min</span><button data-step="work" data-delta="5">+</button></div></div><div class="setting"><div class="settingLabel">Recreo</div><div class="stepper"><button data-step="break" data-delta="-1">−</button><span id="breakValue">5 min</span><button data-step="break" data-delta="1">+</button></div></div></div>
    <section class="tasks"><div class="tasksHead"><strong>Tareas</strong><span id="voiceState" class="phase"></span></div><div class="taskComposer"><input id="taskInput" class="taskInput" placeholder="Agregar tarea"><button id="taskMic" class="mic" aria-label="agregar por voz">●</button></div><div id="taskList" class="taskList"></div></section>
  </section>
</main>

<div id="mini" class="mini"><div class="miniText"><div id="miniTitle" class="miniTitle"></div><div id="miniMeta" class="miniMeta"></div></div><div class="transport"><button id="prevBtn" aria-label="anterior">‹</button><button id="playPauseBtn" class="primary" aria-label="play pausa">▶</button><button id="nextBtn" aria-label="siguiente">›</button></div></div>
<nav class="dock"><div class="dockInner"><button class="appButton active" data-app="youtube"><span class="appIcon"><span class="ytLogo"></span></span><span>YouTube</span></button><button class="appButton" data-app="reader"><span class="appIcon textLogo">Aa</span><span>Texto</span></button><button class="appButton" data-app="pomodoro"><span class="appIcon"><span class="timerLogo"></span></span><span>Pomodoro</span></button></div></nav>

<div id="drawer" class="drawer"><div class="drawerPanel"><div class="drawerTitle">Agregar canal</div><input id="channelName" class="field" placeholder="Canal de YouTube"><input id="folderName" class="field" placeholder="Categoría · ej. Ciencia"><button id="saveChannel" class="save">Guardar</button></div></div>
<div id="shareSheet" class="shareSheet"><div class="sharePanel"><div class="shareTitle">Sala compartida</div><div id="roomCode" class="roomCode">—</div><div class="shareHint">Abrí el mismo enlace en otro dispositivo. Play, pausa, anterior y siguiente pasan por esta sala.</div><button id="copyLink" class="copyLink">Copiar enlace de control</button></div></div>
<div id="toast" class="toast"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
(()=>{
'use strict';
const MEDIA_API='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/prometeo-tv-media-v1';
const ROOM_API='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/prometeo-tv-room-v1';
const $=id=>document.getElementById(id);
const youtubeView=$('youtubeView'),readerView=$('readerView'),pomodoroView=$('pomodoroView'),stage=$('stage'),searchPane=$('searchPane'),q=$('q'),playSearch=$('playSearch'),meta=$('meta'),browse=$('browse'),detail=$('detail'),detailTitle=$('detailTitle'),detailVideos=$('detailVideos'),recentVideos=$('recentVideos'),channelGrid=$('channelGrid'),categoryList=$('categoryList'),drawer=$('drawer'),channelName=$('channelName'),folderName=$('folderName');
const params=new URLSearchParams(location.hash.slice(1));
let cap=params.get('k')||localStorage.getItem('prometeo.tv.simple.cap.v1')||'';if(params.get('k'))localStorage.setItem('prometeo.tv.simple.cap.v1',params.get('k'));
const defaults=[{name:'Veritasium',folder:'Ciencia'},{name:'Kurzgesagt – In a Nutshell',folder:'Ciencia'},{name:'Marques Brownlee',folder:'Tecnología'},{name:'Corridor Crew',folder:'Cine'}];
let saved=[];try{const raw=JSON.parse(localStorage.getItem('prometeo.tv.channels.v2')||'[]');if(Array.isArray(raw))saved=raw}catch{}
function normChannels(list){const m=new Map;for(const x of list){const o=typeof x==='string'?{name:x,folder:'Otros'}:x;const key=String(o?.name||'').trim().toLowerCase();if(key&&!m.has(key))m.set(key,{name:String(o.name).trim(),folder:String(o.folder||'Otros').trim()||'Otros'})}return[...m.values()]}
let channels=normChannels([...defaults,...saved]),feed=null,prepared=null,searchTimer=null,searchSeq=0,feedSeq=0;
function persistChannels(){const base=new Set(defaults.map(x=>x.name.toLowerCase()));localStorage.setItem('prometeo.tv.channels.v2',JSON.stringify(channels.filter(x=>!base.has(x.name.toLowerCase()))))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateLabel(iso){if(!iso)return'';return new Intl.DateTimeFormat('es-AR',{day:'numeric',month:'short'}).format(new Date(iso))}
function setMeta(text,kind=''){meta.textContent=text||'';meta.className='meta'+(kind?' '+kind:'')}
function toast(text){const t=$('toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
async function mediaApi(body){const r=await fetch(MEDIA_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:cap,...body}),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'No pude cargar');return d.result}
function app(name){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.querySelectorAll('.appButton').forEach(b=>b.classList.toggle('active',b.dataset.app===name));({youtube:youtubeView,reader:readerView,pomodoro:pomodoroView}[name]||youtubeView).classList.add('active')}
document.querySelectorAll('.appButton').forEach(b=>b.onclick=()=>app(b.dataset.app));

const deviceId=localStorage.getItem('prometeo.tv.device.v1')||('d-'+Math.random().toString(36).slice(2,10));localStorage.setItem('prometeo.tv.device.v1',deviceId);
let room=null,lastEventId=0,polling=false;
async function roomApi(body){const r=await fetch(ROOM_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'ROOM_ERROR');return d}
function hostShareLink(){if(!room)return location.href;const tok=room.remote_token||room.token;return location.origin+location.pathname+'#k='+encodeURIComponent(cap)+'&room='+encodeURIComponent(room.code)+'&rt='+encodeURIComponent(tok)+'&role=remote'}
async function initRoom(){const code=params.get('room'),rt=params.get('rt'),role=params.get('role');if(code&&rt){room={code,token:rt,remote_token:rt,role:role==='tv'?'tv':'remote'};$('roomBtn').textContent=code}else{let savedRoom=null;try{savedRoom=JSON.parse(localStorage.getItem('prometeo.tv.room.host.v1')||'null')}catch{}if(savedRoom&&new Date(savedRoom.expires_at).getTime()>Date.now()+60000){room={code:savedRoom.code,token:savedRoom.tv_token,remote_token:savedRoom.remote_token,role:'tv',expires_at:savedRoom.expires_at}}else{const d=await roomApi({action:'create_room'});room={code:d.room.code,token:d.room.tv_token,remote_token:d.room.remote_token,role:'tv',expires_at:d.room.expires_at};localStorage.setItem('prometeo.tv.room.host.v1',JSON.stringify(d.room))}$('roomBtn').textContent=room.code}pollRoom();if(room.role==='remote')emitRoom('media.request_snapshot',{})}
async function emitRoom(event_type,payload){if(!room)return;try{await roomApi({action:'emit',code:room.code,role:room.role,token:room.token,client_id:deviceId,event_type,payload})}catch(e){console.warn(e)}}
async function pollRoom(){if(polling||!room)return;polling=true;while(room){try{const d=await roomApi({action:'poll',code:room.code,role:room.role,token:room.token,after_id:lastEventId});for(const e of d.events||[]){lastEventId=Math.max(lastEventId,Number(e.id)||0);if(e.client_id===deviceId)continue;handleRoomEvent(e)}await new Promise(r=>setTimeout(r,450))}catch(e){await new Promise(r=>setTimeout(r,1200))}}polling=false}
function handleRoomEvent(e){if(e.event_type==='media.command'&&room?.role==='tv'){applyCommand(e.payload||{},true)}else if(e.event_type==='media.snapshot'){applySnapshot(e.payload||{},e.created_at)}else if(e.event_type==='media.request_snapshot'&&room?.role==='tv'&&media.video){broadcastSnapshot()}}
$('roomBtn').onclick=()=>{$('roomCode').textContent=room?.code||'—';$('shareSheet').classList.add('open')};$('shareSheet').onclick=e=>{if(e.target===$('shareSheet'))$('shareSheet').classList.remove('open')};$('copyLink').onclick=async()=>{try{await navigator.clipboard.writeText(hostShareLink());toast('Enlace copiado')}catch{toast('No pude copiar el enlace')}};

let ytPlayer=null,ytReady=false,suppressYTUntil=0;
let media={video:null,queue:[],index:-1,playing:false,position:0};
function compactVideo(v){return{video_id:v.video_id,title:v.title||'',channel_title:v.channel_title||v.channel||v.channel_query||'',thumbnail:v.thumbnail||'',duration:v.duration||'',embed_url:v.embed_url||(`https://www.youtube.com/embed/${v.video_id}?autoplay=1&playsinline=1&rel=0`),published_at:v.published_at||''}}
function compactQueue(list){return(list||[]).slice(0,14).map(compactVideo)}
function desiredPosition(snapshot,createdAt){const base=Math.max(0,Number(snapshot.position||0));if(!snapshot.playing)return base;const age=Math.max(0,(Date.now()-new Date(createdAt||Date.now()).getTime())/1000);return base+Math.min(age,8)}
function updateMini(){const mini=$('mini');if(!media.video){mini.classList.remove('show');return}mini.classList.add('show');$('miniTitle').textContent=media.video.title||'YouTube';$('miniMeta').textContent=(media.video.channel_title||'')+(room?` · ${room.code}`:'');$('playPauseBtn').textContent=media.playing?'Ⅱ':'▶'}
function ensureYT(video,position=0,playing=false){if(!video?.video_id)return;stage.classList.add('show');if(!window.YT||!YT.Player){setTimeout(()=>ensureYT(video,position,playing),120);return}const start=Math.max(0,Number(position)||0);suppressYTUntil=Date.now()+1200;if(!ytPlayer){ytPlayer=new YT.Player('ytPlayer',{videoId:video.video_id,playerVars:{playsinline:1,rel:0,enablejsapi:1},events:{onReady:ev=>{ytReady=true;if(start>0)ev.target.seekTo(start,true);playing?ev.target.playVideo():ev.target.pauseVideo()},onStateChange:onYTStateChange,onAutoplayBlocked:()=>toast('Tocá ▶ una vez para activar reproducción')}})}else if(ytReady){const currentId=ytPlayer.getVideoData?.().video_id||'';if(currentId!==video.video_id){playing?ytPlayer.loadVideoById({videoId:video.video_id,startSeconds:start}):ytPlayer.cueVideoById({videoId:video.video_id,startSeconds:start})}else{const cur=Number(ytPlayer.getCurrentTime?.()||0);if(Math.abs(cur-start)>1.4)ytPlayer.seekTo(start,true);playing?ytPlayer.playVideo():ytPlayer.pauseVideo()}}}
function applySnapshot(s,createdAt){if(!s?.video)return;media={video:s.video,queue:Array.isArray(s.queue)?s.queue:[],index:Number.isFinite(Number(s.index))?Number(s.index):-1,playing:!!s.playing,position:Number(s.position||0)};const pos=desiredPosition(s,createdAt);ensureYT(media.video,pos,media.playing);updateMini()}
function currentPosition(){try{return ytReady?Number(ytPlayer.getCurrentTime()||0):Number(media.position||0)}catch{return Number(media.position||0)}}
async function broadcastSnapshot(){if(!room||room.role!=='tv'||!media.video)return;media.position=currentPosition();await emitRoom('media.snapshot',{video:media.video,queue:media.queue,index:media.index,playing:media.playing,position:media.position})}
function loadAt(index,playing=true){if(!media.queue.length)return;const i=Math.max(0,Math.min(media.queue.length-1,index));media.index=i;media.video=media.queue[i];media.position=0;media.playing=playing;ensureYT(media.video,0,playing);updateMini()}
async function applyCommand(cmd,fromRemote=false){const type=String(cmd.cmd||'');if(type==='load'&&cmd.video){media.queue=Array.isArray(cmd.queue)?cmd.queue:[cmd.video];media.index=Number.isFinite(Number(cmd.index))?Number(cmd.index):0;media.video=cmd.video;media.position=Number(cmd.position||0);media.playing=cmd.playing!==false;ensureYT(media.video,media.position,media.playing)}else if(type==='play'){media.position=Number(cmd.position??currentPosition());media.playing=true;ensureYT(media.video,media.position,true)}else if(type==='pause'){media.position=Number(cmd.position??currentPosition());media.playing=false;ensureYT(media.video,media.position,false)}else if(type==='next'){if(media.queue.length)loadAt(Math.min(media.queue.length-1,media.index+1),true)}else if(type==='prev'){if(media.queue.length)loadAt(Math.max(0,media.index-1),true)}else if(type==='stop'){media={video:null,queue:[],index:-1,playing:false,position:0};try{ytPlayer?.stopVideo()}catch{}stage.classList.remove('show');updateMini()}updateMini();if(room?.role==='tv')await broadcastSnapshot();else if(!fromRemote&&room)await emitRoom('media.command',{...cmd,position:cmd.position??currentPosition()})}
async function sendCommand(cmd){await applyCommand(cmd,false)}
function playFromList(v,list){const queue=compactQueue(list?.length?list:[v]);let index=queue.findIndex(x=>x.video_id===v.video_id);if(index<0)index=0;sendCommand({cmd:'load',video:compactVideo(v),queue,index,playing:true,position:0})}
function onYTStateChange(e){if(Date.now()<suppressYTUntil||!media.video)return;const s=e.data;if(s===YT.PlayerState.PLAYING||s===YT.PlayerState.PAUSED){const cmd=s===YT.PlayerState.PLAYING?'play':'pause';media.playing=cmd==='play';media.position=currentPosition();updateMini();if(room?.role==='tv')broadcastSnapshot();else emitRoom('media.command',{cmd,position:media.position})}else if(s===YT.PlayerState.ENDED){sendCommand({cmd:'next'})}}
setInterval(()=>{if(room?.role==='tv'&&media.video&&media.playing)broadcastSnapshot()},5000);
$('prevBtn').onclick=()=>sendCommand({cmd:'prev'});$('nextBtn').onclick=()=>sendCommand({cmd:'next'});$('playPauseBtn').onclick=()=>sendCommand({cmd:media.playing?'pause':'play',position:currentPosition()});$('closeStage').onclick=()=>sendCommand({cmd:'stop'});

function videoNode(v,list){const b=document.createElement('button');b.className='video';b.innerHTML=`<div class="thumbWrap"><img class="thumb" src="${esc(v.thumbnail||'')}" alt="">${v.duration?`<span class="dur">${esc(v.duration)}</span>`:''}</div><div><div class="vtitle">${esc(v.title||'')}</div><div class="vmeta">${esc(v.channel_title||v.channel||v.channel_query||'')} · ${esc(dateLabel(v.published_at))}</div></div>`;b.onclick=()=>playFromList(v,list);return b}
function fillVideos(target,list){target.innerHTML='';if(!list?.length){target.innerHTML='<div class="empty">No hay videos para mostrar.</div>';return}for(const v of list)target.appendChild(videoNode(v,list))}
$('searchToggle').onclick=()=>searchPane.classList.toggle('open');
async function search(text){const my=++searchSeq,query=text.replace(/\s+/g,' ').trim();if(query.length<2)return null;setMeta('buscando…');try{const result=await mediaApi({action:'search',q:query});if(my!==searchSeq)return null;prepared={query,result};setMeta(result.title||query,'ready');return prepared}catch(e){if(my===searchSeq){prepared=null;setMeta(String(e.message||e),'error')}return null}}
q.oninput=()=>{clearTimeout(searchTimer);const text=q.value.trim();if(text.length<2){prepared=null;setMeta('');return}searchTimer=setTimeout(()=>search(text),850)};
async function runSearch(){const text=q.value.trim();if(!text)return;playSearch.textContent='…';const hit=prepared&&prepared.query===text?prepared:await search(text);playSearch.textContent='▶';if(hit)playFromList(hit.result,[hit.result])}
playSearch.onclick=runSearch;q.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();runSearch()}};
function channelInfo(query){return feed?.channels?.find(x=>x.query===query)||null}
function renderChannels(){channelGrid.innerHTML='';for(const c of channels){const info=channelInfo(c.name)?.channel||{};const b=document.createElement('button');b.className='channel';b.innerHTML=`${info.thumbnail?`<img class="avatar" src="${esc(info.thumbnail)}" alt="">`:'<div class="avatar"></div>'}<div><div class="channelName">${esc(info.title||c.name)}</div><div class="channelSmall">${esc(c.folder)}</div></div>`;b.onclick=()=>openDetail('channel',c.name,info.title||c.name);channelGrid.appendChild(b)}}
function renderCategories(){categoryList.innerHTML='';const folders=[...new Set(channels.map(c=>c.folder))];for(const folder of folders){const count=channels.filter(c=>c.folder===folder).length;const b=document.createElement('button');b.className='category';b.innerHTML=`<strong>${esc(folder)}</strong><span>${count} ${count===1?'canal':'canales'} →</span>`;b.onclick=()=>openDetail('folder',folder,folder);categoryList.appendChild(b)}}
function openDetail(type,value,label){browse.classList.add('hidden');detail.classList.add('open');detailTitle.textContent=label;let list=feed?.videos||[];if(type==='channel')list=list.filter(v=>v.channel_query===value);if(type==='folder'){const names=new Set(channels.filter(c=>c.folder===value).map(c=>c.name));list=list.filter(v=>names.has(v.channel_query))}fillVideos(detailVideos,list)}
$('detailBack').onclick=()=>{detail.classList.remove('open');browse.classList.remove('hidden')};
function selectTab(name){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));document.querySelectorAll('#browse .section').forEach(s=>s.classList.remove('active'));$(name).classList.add('active')}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>selectTab(b.dataset.tab));
async function loadFeed(){const my=++feedSeq;recentVideos.innerHTML='<div class="loading">cargando…</div>';try{feed=await mediaApi({action:'feed',channels:channels.map(c=>c.name)});if(my!==feedSeq)return;fillVideos(recentVideos,feed.videos||[]);renderChannels();renderCategories()}catch(e){if(my===feedSeq)recentVideos.innerHTML=`<div class="empty">${esc(e.message||e)}</div>`}}
$('addChannel').onclick=()=>{channelName.value='';folderName.value='';drawer.classList.add('open');setTimeout(()=>channelName.focus(),120)};drawer.onclick=e=>{if(e.target===drawer)drawer.classList.remove('open')};$('saveChannel').onclick=()=>{const name=channelName.value.trim(),folder=folderName.value.trim()||'Otros';if(!name)return;const found=channels.find(c=>c.name.toLowerCase()===name.toLowerCase());if(found)found.folder=folder;else channels.push({name,folder});channels=normChannels(channels);persistChannels();drawer.classList.remove('open');loadFeed()};

const readerText=$('readerText');readerText.value=localStorage.getItem('prometeo.reader.text.v1')||'';readerText.oninput=()=>localStorage.setItem('prometeo.reader.text.v1',readerText.value);let utter=null;$('readStart').onclick=()=>{const text=readerText.value.trim();if(!text)return;speechSynthesis.cancel();utter=new SpeechSynthesisUtterance(text);utter.lang='es-AR';speechSynthesis.speak(utter)};$('readPause').onclick=()=>{if(speechSynthesis.speaking){speechSynthesis.paused?speechSynthesis.resume():speechSynthesis.pause()}};$('readStop').onclick=()=>speechSynthesis.cancel();

const PKEY='prometeo.pomodoro.v1',TKEY='prometeo.tasks.v1';let p={work:25,break:5,phase:'work',running:false,endAt:0,remaining:25*60*1000};try{p={...p,...JSON.parse(localStorage.getItem(PKEY)||'{}')}}catch{}let tasks=[];try{tasks=JSON.parse(localStorage.getItem(TKEY)||'[]');if(!Array.isArray(tasks))tasks=[]}catch{}
function phaseMinutes(){return p.phase==='work'?p.work:p.break}function saveP(){localStorage.setItem(PKEY,JSON.stringify(p))}function fmt(ms){const total=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(total/60),s=total%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}function currentRemaining(){return p.running?Math.max(0,p.endAt-Date.now()):Math.max(0,p.remaining)}function renderPomodoro(){const rem=currentRemaining();$('timer').textContent=fmt(rem);$('phaseLabel').textContent=p.phase==='work'?'trabajo':'recreo';$('timerStart').textContent=p.running?'Pausar':'Empezar';$('workValue').textContent=p.work+' min';$('breakValue').textContent=p.break+' min'}
function chime(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=660;g.gain.setValueAtTime(.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.35);o.start();o.stop(a.currentTime+.36)}catch{}try{navigator.vibrate?.([80,60,80])}catch{}}function finishPhase(){p.running=false;p.phase=p.phase==='work'?'break':'work';p.remaining=phaseMinutes()*60*1000;p.endAt=0;saveP();chime();renderPomodoro()}
$('timerStart').onclick=()=>{if(p.running){p.remaining=currentRemaining();p.running=false;p.endAt=0}else{if(currentRemaining()<=0)p.remaining=phaseMinutes()*60*1000;p.running=true;p.endAt=Date.now()+p.remaining}saveP();renderPomodoro()};$('timerReset').onclick=()=>{p.running=false;p.remaining=phaseMinutes()*60*1000;p.endAt=0;saveP();renderPomodoro()};document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{const k=b.dataset.step,delta=Number(b.dataset.delta);p[k]=Math.max(k==='work'?5:1,Math.min(180,Number(p[k])+delta));if(!p.running&&((k==='work'&&p.phase==='work')||(k==='break'&&p.phase==='break')))p.remaining=p[k]*60*1000;saveP();renderPomodoro()});setInterval(()=>{if(p.running&&currentRemaining()<=0)finishPhase();else renderPomodoro()},500);
function saveTasks(){localStorage.setItem(TKEY,JSON.stringify(tasks))}function stamp(ts){if(!ts)return'';return 'última vez · '+new Intl.DateTimeFormat('es-AR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(ts))}function renderTasks(){const root=$('taskList');root.innerHTML='';for(const t of tasks){const row=document.createElement('div');row.className='task'+(t.done?' done':'');row.innerHTML=`<button class="check">${t.done?'✓':''}</button><div><div class="taskText">${esc(t.text)}</div>${t.lastDone?`<div class="taskStamp">${esc(stamp(t.lastDone))}</div>`:''}</div><button class="deleteTask">×</button>`;row.querySelector('.check').onclick=()=>{t.done=!t.done;if(t.done)t.lastDone=new Date().toISOString();saveTasks();renderTasks()};row.querySelector('.deleteTask').onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);saveTasks();renderTasks()};root.appendChild(row)}}function addTask(text){const clean=String(text||'').replace(/\s+/g,' ').trim();if(!clean)return;tasks.unshift({id:'t-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),text:clean,done:false,lastDone:null});saveTasks();renderTasks();$('taskInput').value=''}$('taskInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addTask(e.target.value)}};
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition=null;if(SpeechRecognition){recognition=new SpeechRecognition();recognition.lang='es-AR';recognition.interimResults=true;recognition.continuous=false;recognition.onstart=()=>{$('taskMic').classList.add('listening');$('voiceState').textContent='escuchando'};recognition.onresult=e=>{let final='';for(let i=e.resultIndex;i<e.results.length;i++){const txt=e.results[i][0].transcript;if(e.results[i].isFinal)final+=txt;else $('taskInput').value=txt}if(final)addTask(final)};recognition.onend=()=>{$('taskMic').classList.remove('listening');$('voiceState').textContent=''};recognition.onerror=()=>{$('taskMic').classList.remove('listening');$('voiceState').textContent='';toast('No pude escuchar')}}$('taskMic').onclick=()=>{if(!recognition){toast('Voz no disponible en este navegador');return}try{recognition.start()}catch{}};
renderTasks();renderPomodoro();initRoom().catch(()=>{$('roomBtn').textContent='sin sala'});if(cap)loadFeed();else recentVideos.innerHTML='<div class="empty">Falta vincular esta página.</div>';
})();
