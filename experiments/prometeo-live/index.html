<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1420">
<title>Prometeo Live</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0d1420;color:#dfe7f0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
.shell{height:100dvh;display:grid;grid-template-rows:34px auto 1fr}.bar{display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #ffffff10;font-size:10px;letter-spacing:.12em;color:#70839a;background:#0d1420}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#779987;margin-right:6px}.dot.live{animation:pulse 1.15s ease-in-out infinite;box-shadow:0 0 12px #77aa9277}.dot.warn{background:#c6a36b;box-shadow:0 0 12px #c6a36b55}@keyframes pulse{50%{opacity:.35;transform:scale(.82)}}
.control{display:none;border-bottom:1px solid #ffffff0e;background:#101927;padding:8px 10px 10px;overflow:hidden}.control.show{display:block}.controlHead{display:flex;align-items:center;justify-content:space-between;margin:0 2px 7px;color:#61758d;font-size:8px;letter-spacing:.14em;text-transform:uppercase}.runrail{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}.runrail::-webkit-scrollbar{display:none}.run{flex:0 0 min(300px,78vw);min-width:0;border:1px solid #ffffff10;border-radius:14px;background:#ffffff05;padding:9px 10px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:start}.run.active{border-color:#7fa69233;background:#7fa69209}.run.done{border-color:#7fa6922b;background:#7fa69207}.run.waiting{border-color:#8d7f6333;background:#8d7f6308}.run.waiting.stale{border-color:#c6a36b66;background:#c6a36b0d}.run.blocked{border-color:#b4916355}.run.failed{border-color:#a96d7755}.runTitle{font-size:11px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.runTime{font:9px ui-monospace,SFMono-Regular,Menlo,monospace;color:#60748d}.phase{font-size:9px;color:#85a795;text-transform:lowercase}.phase:before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:#7ea18f;margin-right:6px;vertical-align:1px}.run.active .phase:before{animation:pulse 1.1s ease-in-out infinite}.run.waiting .phase{color:#a8987d}.run.waiting .phase:before{background:#9f8e70}.run.waiting.stale .phase{color:#cfac74}.run.waiting.stale .phase:before{background:#c6a36b;animation:pulse 1.25s ease-in-out infinite}.run.done .phase{color:#8aa898}.run.failed .phase{color:#bd7c87}.msg{grid-column:1/-1;color:#71849b;font-size:9px;line-height:1.35;min-height:12px}.run.waiting.stale .msg{color:#ad946d}.actions{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:1px}.action{appearance:none;border:1px solid #ffffff16;background:#ffffff08;color:#9cafc4;border-radius:9px;padding:5px 8px;font:600 8px Inter,system-ui,sans-serif;text-decoration:none;letter-spacing:.02em}.action:hover,.action:focus-visible{background:#ffffff0e;border-color:#ffffff27;outline:none}.action.primary{color:#b9d0c3;border-color:#7fa6923d;background:#7fa69210}.hint{grid-column:1/-1;color:#9a8565;font-size:8px;line-height:1.35}
.grid{display:grid;gap:1px;background:#ffffff0d;min-height:0}.grid.single{grid-template-columns:1fr}.grid.split{grid-template-columns:1fr 1fr}.grid.triple{grid-template-columns:1fr 1fr 1fr}.grid.quad{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}.cell{position:relative;min-width:0;min-height:0;background:#111b28}.cell iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:white}.label{position:absolute;z-index:2;left:8px;top:8px;padding:4px 7px;border-radius:8px;background:#0d1420c9;color:#8fa2b9;font-size:9px;backdrop-filter:blur(8px);pointer-events:none}.empty{display:grid;place-items:center;height:100%;color:#4f6176;font-size:13px}
@media(max-width:760px){.grid.split,.grid.triple{grid-template-columns:1fr;grid-auto-rows:1fr}.grid.quad{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}.bar{font-size:9px}.run{flex-basis:84vw}.controlHead{font-size:7px}}
</style>
</head>
<body>
<div class="shell">
  <div class="bar"><span>PROMETEO LIVE</span><span id="status"><i class="dot"></i>esperando</span></div>
  <section id="control" class="control"><div class="controlHead"><span>trabajos y resultados</span><span id="runCount"></span></div><div id="runrail" class="runrail"></div></section>
  <main id="grid" class="grid single"><div class="empty">Esperando al primer worker.</div></main>
</div>
<script>
const CONTROL='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/prometeo-live-lab-v1/control-room';
const RESULT_WINDOW_MS=24*60*60*1000;
const CHAT_SIGNAL_GRACE_SEC=45;
const grid=document.getElementById('grid'),status=document.getElementById('status'),control=document.getElementById('control'),runrail=document.getElementById('runrail'),runCount=document.getElementById('runCount');
let lastManifest=null,lastRunSignature='',lastData=null;
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderManifest(m){const rev=String(m.revision??m.updated_at??'');if(rev===lastManifest)return;lastManifest=rev;const ss=Array.isArray(m.surfaces)?m.surfaces.slice(0,4):[];const fallback={1:'single',2:'split',3:'triple',4:'quad'}[ss.length]||'single';grid.className='grid '+(m.layout||fallback);grid.innerHTML='';if(!ss.length){grid.innerHTML='<div class="empty">Sin superficies.</div>';return}for(const s of ss){const c=document.createElement('section');c.className='cell';const l=document.createElement('div');l.className='label';l.textContent=s.title||s.id||'surface';const f=document.createElement('iframe');const u=new URL(s.url||'./surfaces/placeholder.html',location.href);u.searchParams.set('live_rev',rev||Date.now());f.src=u.href;f.loading='eager';c.append(f,l);grid.append(c)}}
function secondsSince(iso){const ms=Date.now()-new Date(iso||Date.now()).getTime();return Math.max(0,Math.floor(ms/1000))}
function fmt(sec){const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;if(h)return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;return m?`${m}:${String(s).padStart(2,'0')}`:`0:${String(s).padStart(2,'0')}`}
function phaseLabel(p=''){return({HANDOFF_CREATED:'esperando señal del chat',READING_PACKET:'leyendo paquete',RECOVERING_CURRENT:'recuperando estado',BUILDING:'construyendo',PREVIEW_READY:'preview lista',TESTING:'verificando',PUBLISHING:'publicando',JOBS_READY:'trabajos preparados',DONE:'terminado',BLOCKED:'bloqueado',FAILED:'falló'})[String(p).toUpperCase()]||String(p).replaceAll('_',' ').toLowerCase()}
function isTerminal(r){return ['DONE','FAILED','BLOCKED'].includes(String(r.status).toUpperCase())}
function isWaiting(r){const p=String(r.phase||'').toUpperCase(),s=String(r.status||'').toUpperCase();return p==='HANDOFF_CREATED'||s==='WAITING_CHAT'}
function stateOf(r){if(isWaiting(r))return 'waiting';const s=String(r.status||'').toUpperCase();if(s==='DONE')return 'done';if(s==='FAILED')return 'failed';if(s==='BLOCKED')return 'blocked';return 'active'}
function validHttpUrl(raw){if(!raw)return '';try{const u=new URL(raw,location.href);return /^https?:$/.test(u.protocol)?u.href:''}catch{return ''}}
function inferredPreview(r){const direct=validHttpUrl(r.preview_url);if(direct)return direct;const urls=String(r.message||'').match(/https?:\/\/[^\s)>\]]+/g)||[];return urls.map(u=>u.replace(/[.,;:]+$/,'')).find(u=>u.includes('/surfaces/'))||''}
function resultLink(r){return validHttpUrl(r.result_url)}
function visibleRuns(data){const now=Date.now();return (data.runs||[]).filter(r=>!isTerminal(r)||(now-new Date(r.updated_at||r.finished_at||0).getTime()<RESULT_WINDOW_MS)).slice(0,16)}
function summary(runs){const counts={waiting:0,stale:0,active:0,done:0,failed:0,blocked:0};for(const r of runs){const st=stateOf(r);counts[st]=(counts[st]||0)+1;if(st==='waiting'&&secondsSince(r.started_at||r.updated_at)>=CHAT_SIGNAL_GRACE_SEC)counts.stale++}return counts}
function renderRuns(data,force=false){
  lastData=data;
  const runs=visibleRuns(data);
  const nowBucket=Math.floor(Date.now()/5000);
  const sig=runs.map(r=>[r.run_code,r.status,r.phase,r.message,r.updated_at,r.preview_url,r.result_url].join('|')).join('||')+'|'+nowBucket;
  if(!force&&sig===lastRunSignature){updateTimes();return}
  lastRunSignature=sig;
  runrail.innerHTML='';
  const c=summary(runs);
  control.classList.toggle('show',runs.length>0);
  const pieces=[];
  if(c.done)pieces.push(`${c.done} ${c.done===1?'listo':'listos'}`);
  if(c.active)pieces.push(`${c.active} trabajando`);
  if(c.waiting)pieces.push(`${c.waiting} ${c.waiting===1?'esperando chat':'esperando chat'}`);
  if(c.failed||c.blocked)pieces.push(`${c.failed+c.blocked} con problema`);
  runCount.textContent=pieces.join(' · ');
  for(const r of runs){
    const st=stateOf(r),started=r.started_at||r.updated_at;
    const stale=st==='waiting'&&secondsSince(started)>=CHAT_SIGNAL_GRACE_SEC;
    const card=document.createElement('article');
    card.className='run '+st+(stale?' stale':'');
    card.dataset.started=started;
    const preview=inferredPreview(r),result=resultLink(r);
    let phase=phaseLabel(r.phase||r.status),message=r.message||'';
    if(st==='waiting'){
      phase=stale?'sin señal del chat':'esperando señal del chat';
      message=stale?'El handoff sigue sin abrirse. Si ya copiaste el mensaje, revisá si lo pegaste y lo enviaste en el chat.':'Handoff creado. En cuanto un chat abra el packet, este estado cambia solo.';
    }
    const actions=[];
    if(preview)actions.push(`<a class="action primary" href="${esc(preview)}" target="_blank" rel="noopener">abrir preview</a>`);
    if(result)actions.push(`<a class="action" href="${esc(result)}" target="_blank" rel="noopener">ver resultado</a>`);
    card.innerHTML=`<div class="runTitle">${esc(r.title||r.run_code)}</div><div class="runTime">${fmt(secondsSince(started))}</div><div class="phase">${esc(phase)}</div><div></div><div class="msg">${esc(message)}</div>${actions.length?`<div class="actions">${actions.join('')}</div>`:''}${stale?'<div class="hint">Sólo se marca como pendiente mientras no haya señal real del chat; al abrirse, desaparece automáticamente.</div>':''}`;
    runrail.append(card);
  }
  if(c.stale===1&&(c.active+c.done+c.failed+c.blocked)>0){
    status.innerHTML='<i class="dot warn"></i>falta iniciar 1 chat';
  }else if(c.active){
    status.innerHTML=`<i class="dot live"></i>${c.active} ${c.active===1?'trabajando':'trabajando'}`;
  }else if(c.waiting){
    status.innerHTML=`<i class="dot"></i>${c.waiting} esperando chat`;
  }else if(c.done){
    status.innerHTML=`<i class="dot"></i>${c.done} ${c.done===1?'resultado listo':'resultados listos'}`;
  }else{
    status.innerHTML=`<i class="dot"></i>rev ${esc(lastManifest||'—')}`;
  }
}
function updateTimes(){document.querySelectorAll('.run[data-started]').forEach(el=>{const t=el.querySelector('.runTime');if(t)t.textContent=fmt(secondsSince(el.dataset.started))})}
async function manifestTick(){try{const r=await fetch('./live-manifest.json?t='+Date.now(),{cache:'no-store'});if(r.ok)renderManifest(await r.json())}catch{}finally{setTimeout(manifestTick,1200)}}
async function controlTick(){try{const r=await fetch(CONTROL+'?t='+Date.now(),{cache:'no-store'});if(r.ok)renderRuns(await r.json())}catch{}finally{setTimeout(controlTick,900)}}
manifestTick();controlTick();setInterval(()=>{updateTimes();if(lastData)renderRuns(lastData)},1000);
</script>
</body>
</html>
