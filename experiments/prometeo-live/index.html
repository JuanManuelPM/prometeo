<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1420">
<title>Prometeo Live</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0d1420;color:#dfe7f0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
.shell{height:100dvh;display:grid;grid-template-rows:34px auto 1fr}.bar{display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #ffffff10;font-size:10px;letter-spacing:.12em;color:#70839a;background:#0d1420}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#779987;margin-right:6px}.dot.live{animation:pulse 1.15s ease-in-out infinite;box-shadow:0 0 12px #77aa9277}@keyframes pulse{50%{opacity:.35;transform:scale(.82)}}
.control{display:none;border-bottom:1px solid #ffffff0e;background:#101927;padding:8px 10px;overflow:hidden}.control.show{display:block}.controlHead{display:flex;align-items:center;justify-content:space-between;margin:0 2px 7px;color:#61758d;font-size:8px;letter-spacing:.14em;text-transform:uppercase}.runrail{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.runrail::-webkit-scrollbar{display:none}.run{flex:0 0 min(280px,72vw);min-width:0;border:1px solid #ffffff10;border-radius:14px;background:#ffffff05;padding:9px 10px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:start}.run.active{border-color:#7fa69233;background:#7fa69209}.run.blocked{border-color:#b4916333}.run.failed{border-color:#a96d7733}.runTitle{font-size:11px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.runTime{font:9px ui-monospace,SFMono-Regular,Menlo,monospace;color:#60748d}.phase{font-size:9px;color:#85a795;text-transform:lowercase}.phase:before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:#7ea18f;margin-right:6px;vertical-align:1px}.run.active .phase:before{animation:pulse 1.1s ease-in-out infinite}.msg{grid-column:1/-1;color:#71849b;font-size:9px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{grid-column:1/-1;color:#8196ad;font-size:8px}
.grid{display:grid;gap:1px;background:#ffffff0d;min-height:0}.grid.single{grid-template-columns:1fr}.grid.split{grid-template-columns:1fr 1fr}.grid.triple{grid-template-columns:1fr 1fr 1fr}.grid.quad{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}.cell{position:relative;min-width:0;min-height:0;background:#111b28}.cell iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:white}.label{position:absolute;z-index:2;left:8px;top:8px;padding:4px 7px;border-radius:8px;background:#0d1420c9;color:#8fa2b9;font-size:9px;backdrop-filter:blur(8px);pointer-events:none}.empty{display:grid;place-items:center;height:100%;color:#4f6176;font-size:13px}
@media(max-width:760px){.grid.split,.grid.triple{grid-template-columns:1fr;grid-auto-rows:1fr}.grid.quad{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}.bar{font-size:9px}.run{flex-basis:78vw}}
</style>
</head>
<body>
<div class="shell">
  <div class="bar"><span>PROMETEO LIVE</span><span id="status"><i class="dot"></i>esperando</span></div>
  <section id="control" class="control"><div class="controlHead"><span>trabajo vivo</span><span id="runCount"></span></div><div id="runrail" class="runrail"></div></section>
  <main id="grid" class="grid single"><div class="empty">Esperando al primer worker.</div></main>
</div>
<script>
const CONTROL='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/prometeo-live-lab-v1/control-room';
const grid=document.getElementById('grid'),status=document.getElementById('status'),control=document.getElementById('control'),runrail=document.getElementById('runrail'),runCount=document.getElementById('runCount');
let lastManifest=null,lastRunSignature='';
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderManifest(m){const rev=String(m.revision??m.updated_at??'');if(rev===lastManifest)return;lastManifest=rev;const ss=Array.isArray(m.surfaces)?m.surfaces.slice(0,4):[];const fallback={1:'single',2:'split',3:'triple',4:'quad'}[ss.length]||'single';grid.className='grid '+(m.layout||fallback);grid.innerHTML='';if(!ss.length){grid.innerHTML='<div class="empty">Sin superficies.</div>';return}for(const s of ss){const c=document.createElement('section');c.className='cell';const l=document.createElement('div');l.className='label';l.textContent=s.title||s.id||'surface';const f=document.createElement('iframe');const u=new URL(s.url||'./surfaces/placeholder.html',location.href);u.searchParams.set('live_rev',rev||Date.now());f.src=u.href;f.loading='eager';c.append(f,l);grid.append(c)}}
function secondsSince(iso){const ms=Date.now()-new Date(iso||Date.now()).getTime();return Math.max(0,Math.floor(ms/1000))}
function fmt(sec){const m=Math.floor(sec/60),s=sec%60;return m?`${m}:${String(s).padStart(2,'0')}`:`0:${String(s).padStart(2,'0')}`}
function phaseLabel(p=''){return({HANDOFF_CREATED:'esperando chat',READING_PACKET:'leyendo paquete',RECOVERING_CURRENT:'recuperando estado',BUILDING:'construyendo',PREVIEW_READY:'preview lista',TESTING:'verificando',PUBLISHING:'publicando',JOBS_READY:'trabajos preparados',DONE:'terminado',BLOCKED:'bloqueado',FAILED:'falló'})[String(p).toUpperCase()]||String(p).replaceAll('_',' ').toLowerCase()}
function renderRuns(data){const now=Date.now();const runs=(data.runs||[]).filter(r=>{const terminal=['DONE','FAILED','BLOCKED'].includes(String(r.status).toUpperCase());return !terminal||(now-new Date(r.updated_at||0).getTime()<90000)}).slice(0,10);const sig=runs.map(r=>[r.run_code,r.status,r.phase,r.message,r.updated_at,r.preview_url].join('|')).join('||');if(sig===lastRunSignature){updateTimes();return}lastRunSignature=sig;runrail.innerHTML='';const active=runs.filter(r=>!['DONE','FAILED','BLOCKED'].includes(String(r.status).toUpperCase())).length;control.classList.toggle('show',runs.length>0);runCount.textContent=runs.length?`${active} activos · ${runs.length} visibles`:'';for(const r of runs){const terminal=String(r.status).toUpperCase();const card=document.createElement('article');card.className='run '+(!['DONE','FAILED','BLOCKED'].includes(terminal)?'active':terminal==='FAILED'?'failed':terminal==='BLOCKED'?'blocked':'done');card.dataset.started=r.started_at||r.updated_at;card.innerHTML=`<div class="runTitle">${esc(r.title||r.run_code)}</div><div class="runTime">${fmt(secondsSince(card.dataset.started))}</div><div class="phase">${esc(phaseLabel(r.phase||r.status))}</div><div></div><div class="msg">${esc(r.message||'')}</div>${r.preview_url?'<div class="preview">preview disponible</div>':''}`;runrail.append(card)}status.innerHTML=active?`<i class="dot live"></i>${active} trabajando`:`<i class="dot"></i>rev ${esc(lastManifest||'—')}`}
function updateTimes(){document.querySelectorAll('.run[data-started]').forEach(el=>{const t=el.querySelector('.runTime');if(t)t.textContent=fmt(secondsSince(el.dataset.started))})}
async function manifestTick(){try{const r=await fetch('./live-manifest.json?t='+Date.now(),{cache:'no-store'});if(r.ok)renderManifest(await r.json())}catch{}finally{setTimeout(manifestTick,1200)}}
async function controlTick(){try{const r=await fetch(CONTROL+'?t='+Date.now(),{cache:'no-store'});if(r.ok)renderRuns(await r.json())}catch{}finally{setTimeout(controlTick,900)}}
manifestTick();controlTick();setInterval(updateTimes,1000);
</script>
</body>
</html>
