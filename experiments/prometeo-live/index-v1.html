<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1420"><title>Prometeo Live</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0d1420;color:#dfe7f0;font-family:Inter,system-ui,sans-serif;overflow:hidden}.shell{height:100dvh;display:grid;grid-template-rows:34px 1fr}.bar{display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #ffffff10;font-size:10px;letter-spacing:.12em;color:#70839a}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#779987;margin-right:6px}.grid{display:grid;gap:1px;background:#ffffff0d;min-height:0}.grid.single{grid-template-columns:1fr}.grid.split{grid-template-columns:1fr 1fr}.grid.quad{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}.cell{position:relative;min-width:0;min-height:0;background:#111b28}.cell iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:white}.label{position:absolute;z-index:2;left:8px;top:8px;padding:4px 7px;border-radius:8px;background:#0d1420c9;color:#8fa2b9;font-size:9px;backdrop-filter:blur(8px);pointer-events:none}.empty{display:grid;place-items:center;height:100%;color:#4f6176;font-size:13px}@media(max-width:760px){.grid.split{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.grid.quad{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}.bar{font-size:9px}}</style></head><body><div class="shell"><div class="bar"><span>PROMETEO LIVE</span><span id="status"><i class="dot"></i>esperando</span></div><main id="grid" class="grid single"><div class="empty">Esperando al primer worker.</div></main></div><script>const grid=document.getElementById('grid'),status=document.getElementById('status');let last=null;function render(m){const rev=String(m.revision??m.updated_at??'');if(rev===last)return;last=rev;const ss=Array.isArray(m.surfaces)?m.surfaces.slice(0,4):[];grid.className='grid '+(m.layout||({1:'single',2:'split',4:'quad'}[ss.length]||'single'));grid.innerHTML='';if(!ss.length){grid.innerHTML='<div class="empty">Sin superficies.</div>';return}for(const s of ss){const c=document.createElement('section');c.className='cell';const l=document.createElement('div');l.className='label';l.textContent=s.title||s.id||'surface';const f=document.createElement('iframe');const u=new URL(s.url||'./surfaces/placeholder.html',location.href);u.searchParams.set('live_rev',rev||Date.now());f.src=u.href;f.loading='eager';c.append(f,l);grid.append(c)}status.innerHTML='<i class="dot"></i>rev '+(m.revision??'—')}async function tick(){try{const r=await fetch('./live-manifest.json?t='+Date.now(),{cache:'no-store'});if(r.ok)render(await r.json())}catch{}finally{setTimeout(tick,1400)}}tick();</script></body></html>
