<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2efe7">
<title>Texto → Voz</title>
<style>
:root{--paper:#f2efe7;--ink:#171a18}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,textarea,select{font:inherit;color:inherit}.wrap{width:min(720px,100%);margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;gap:10px;min-height:42px}.back{border:0;background:transparent;text-decoration:none;color:inherit;font-size:13px;opacity:.58;padding:10px 0}.name{margin-left:auto;font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.42}.stage{padding-top:clamp(34px,9vh,76px)}textarea{width:100%;min-height:190px;resize:vertical;background:transparent;border:0;border-bottom:1px solid color-mix(in srgb,var(--ink) 18%,transparent);padding:0 0 15px;outline:0;font-size:clamp(22px,5vw,32px);line-height:1.3;letter-spacing:-.03em}textarea::placeholder{color:color-mix(in srgb,var(--ink) 28%,transparent)}.meta{display:flex;align-items:center;gap:10px;margin-top:12px}.voice{display:flex;align-items:center;gap:7px;font-size:11px;opacity:.62}.voice select{border:0;background:transparent;font-weight:750;padding:6px 0}.count{margin-left:auto;font-size:10px;opacity:.36}.actions{display:flex;align-items:center;gap:10px;margin-top:20px}.generate{border:0;background:var(--ink);color:var(--paper);min-width:116px;padding:13px 16px;border-radius:14px;font-weight:800;box-shadow:0 5px 12px color-mix(in srgb,var(--ink) 18%,transparent)}.generate:active{transform:translateY(2px);box-shadow:0 2px 6px color-mix(in srgb,var(--ink) 16%,transparent)}.generate:disabled{opacity:.3;box-shadow:none}.status{font-size:12px;opacity:.55}.player{display:none;margin-top:28px;border-top:1px solid color-mix(in srgb,var(--ink) 16%,transparent);padding-top:15px}.player.show{display:block}.player audio{width:100%;height:42px}.playerMeta{display:flex;justify-content:space-between;gap:8px;font-size:10px;opacity:.48;margin-bottom:8px}.error{margin-top:10px;font-size:11px;line-height:1.45;opacity:.7}@media(min-width:760px){.wrap{padding-left:24px;padding-right:24px}.stage{padding-top:80px}textarea{min-height:240px}}
</style>
</head>
<body><main class="wrap"><header class="top"><a class="back" href="./">← voz</a><span class="name">Texto → Voz</span></header><section class="stage"><textarea id="text" maxlength="520" placeholder="Escribí o pegá un texto…" aria-label="Texto para convertir a voz"></textarea><div class="meta"><label class="voice">voz <select id="voice" aria-label="Voz"></select></label><span id="count" class="count">0 / 520</span></div><div class="actions"><button id="generate" class="generate" type="button">Generar</button><span id="status" class="status">Listo</span></div><div id="error" class="error" role="status"></div><section id="player" class="player"><div class="playerMeta"><span id="playerLabel">Audio listo</span><span id="cache"></span></div><audio id="audio" controls preload="metadata"></audio></section></section></main><script type="module" src="./tts.js"></script></body>
</html>
