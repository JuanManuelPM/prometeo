<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2efe7">
<title>Voz → Texto</title>
<style>
:root{--paper:#f2efe7;--ink:#171a18;--rec:#da3c36}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit;color:inherit}.wrap{width:min(720px,100%);margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;gap:10px;min-height:42px}.back{border:0;background:transparent;text-decoration:none;color:inherit;font-size:13px;opacity:.58;padding:10px 0}.name{margin-left:auto;font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.42}.stage{min-height:44dvh;display:flex;flex-direction:column;justify-content:center;gap:16px}.state{font-size:13px;opacity:.58;min-height:20px}.transcript{font-size:clamp(23px,5vw,34px);line-height:1.28;letter-spacing:-.035em;white-space:pre-wrap;overflow-wrap:anywhere;min-height:120px}.transcript.empty{opacity:.28}.panel{border-top:1px solid color-mix(in srgb,var(--ink) 16%,transparent);padding-top:14px}.recordRow{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:14px}.rec{width:110px;height:54px;padding:0;border:0;background:transparent}.track{display:block;position:relative;width:110px;height:52px;border-radius:28px;background:color-mix(in srgb,var(--ink) 8%,transparent);box-shadow:inset 4px 4px 9px color-mix(in srgb,var(--ink) 14%,transparent);overflow:hidden}.puck{position:absolute;left:5px;top:5px;width:42px;height:42px;border-radius:50%;background:var(--paper);border:1px solid color-mix(in srgb,var(--ink) 18%,transparent);box-shadow:4px 6px 10px color-mix(in srgb,var(--ink) 18%,transparent);transition:transform .2s ease}.mic{position:absolute;right:16px;top:16px;width:20px;height:20px;opacity:.55}.light{position:absolute;left:20px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--rec);opacity:0}.rec[aria-pressed="true"] .puck{transform:translateX(58px)}.rec[aria-pressed="true"] .light{opacity:1;animation:blink 1.05s ease-in-out infinite}.rec[aria-pressed="true"] .mic{opacity:0}@keyframes blink{50%{opacity:.28}}.hint{font-size:12px;line-height:1.35;opacity:.5}.audioBox{display:none;margin-top:14px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}.audioBox.show{display:block}.audioMeta{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;opacity:.55;margin-bottom:8px}.audioBox audio{width:100%;height:40px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid var(--ink);background:transparent;padding:10px 13px;border-radius:12px;font-weight:700;font-size:12px}.btn.primary{background:var(--ink);color:var(--paper);box-shadow:0 4px 10px color-mix(in srgb,var(--ink) 18%,transparent)}.btn:disabled{opacity:.28;box-shadow:none}.diag{margin-top:14px}.diag summary{font-size:11px;opacity:.45;cursor:pointer}.diag pre{white-space:pre-wrap;font:10px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.58;max-height:170px;overflow:auto}.error{font-size:11px;line-height:1.4;margin-top:8px;opacity:.72}@media(min-width:760px){.wrap{padding-left:24px;padding-right:24px}.stage{min-height:50vh}.panel{display:grid;grid-template-columns:1fr 1fr;gap:22px}.audioBox.show{margin-top:0;padding-top:0;border-top:0}}
</style>
</head>
<body><main class="wrap"><header class="top"><a class="back" href="./">← voz</a><span class="name">Voz → Texto</span></header><section class="stage"><div id="state" class="state">Listo para grabar</div><div id="transcript" class="transcript empty">La transcripción aparece acá.</div></section><section class="panel"><div><div class="recordRow"><button id="record" class="rec" type="button" aria-pressed="false" aria-label="Iniciar grabación"><span class="track"><span class="light"></span><span class="mic" aria-hidden="true">◉</span><span class="puck"></span></span></button><div class="hint">El audio se guarda antes de transcribir. Podés seguir usando la página mientras Whisper trabaja.</div></div><div class="actions"><button id="retry" class="btn" type="button" disabled>Reintentar</button><button id="copy" class="btn" type="button" disabled>Copiar texto</button></div><div id="error" class="error" role="status"></div></div><div id="audioBox" class="audioBox"><div class="audioMeta"><span id="audioMeta">Audio guardado</span><span id="model">small → base</span></div><audio id="audio" controls preload="metadata"></audio><details class="diag"><summary>diagnóstico</summary><pre id="log"></pre></details></div></section></main><script type="module" src="./stt.js"></script></body>
</html>
