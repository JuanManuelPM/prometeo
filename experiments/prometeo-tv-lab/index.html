<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172131">
<title>Prometeo TV Lab</title>
<style>
:root{
  --bg:#172131;
  --panel:#1c293b;
  --panel2:#111a27;
  --ink:#eef3f8;
  --muted:#73849a;
  --line:#ffffff12;
  --accent:#8fa7c3;
  --ok:#8db7a0;
  --shadow:#0009;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,textarea{font:inherit}
button{color:inherit}
.hidden{display:none!important}
.app{min-height:100dvh;max-width:760px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 18px calc(120px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.kicker{font-size:9px;letter-spacing:.22em;color:#6e8096;text-transform:uppercase}
h1{font-size:30px;line-height:1;margin:7px 0 0;font-weight:600;letter-spacing:-.04em}
.tvOpen{border:1px solid var(--line);background:#ffffff05;border-radius:14px;padding:10px 12px;font-size:11px;color:#a7b5c7}
.help{font-size:12px;color:#65778e;line-height:1.5;margin:20px 0}
.notes{display:flex;flex-direction:column;gap:10px}
.note{border:1px solid var(--line);background:#ffffff05;border-radius:18px;padding:14px 15px;position:relative}
.note p{margin:0;white-space:pre-wrap;line-height:1.45;font-size:15px}
.noteMeta{margin-top:9px;font-size:10px;color:#657890;display:flex;justify-content:space-between;gap:10px}
.badge{color:#92a7bd}.note.sent{opacity:.62}
.addRow{display:grid;grid-template-columns:1fr auto;gap:10px;margin:16px 0 0}
.noteInput{min-height:48px;max-height:130px;resize:vertical;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:15px;padding:13px 14px;outline:none;box-shadow:inset 4px 4px 9px #0006,inset -1px -1px 3px #ffffff08}
.noteInput::placeholder{color:#566a82}
.addBtn{width:50px;height:50px;border:0;border-radius:50%;font-size:26px;font-weight:300;background:linear-gradient(145deg,#2b3f5b,#1d2c40);box-shadow:6px 8px 15px #0008,-2px -2px 6px #ffffff0e,inset 1px 1px 1px #ffffff17}
.addBtn:active{transform:translateY(2px) scale(.97)}
.bottom{position:fixed;z-index:10;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);padding:22px 18px max(18px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 33%,var(--bg))}
.sendCard{border:1px solid var(--line);background:#172131e8;backdrop-filter:blur(10px);border-radius:20px;padding:11px 12px;display:grid;grid-template-columns:1fr 170px;gap:12px;align-items:center}
.sendCard strong{display:block;font-size:13px}.sendCard small{display:block;margin-top:3px;color:#687a91;font-size:10px}
.slider{position:relative;height:52px;border-radius:27px;background:#0f1823;overflow:hidden;touch-action:none;box-shadow:inset 6px 6px 11px #0009,inset -3px -3px 7px #ffffff07}
.sliderReveal{position:absolute;inset:0;display:grid;place-items:center;padding-left:42px;color:#63748b;font-size:9px;letter-spacing:.14em;text-transform:uppercase}
.knob{position:absolute;left:5px;top:5px;width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#314864,#1f2f45);box-shadow:5px 6px 11px #0009,-2px -2px 5px #ffffff12,inset 1px 1px 1px #ffffff1d;display:grid;place-items:center}
.knob svg{width:20px;height:20px;fill:none;stroke:#9cafc4;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.status{margin-top:9px;font-size:10px;color:#667b92;min-height:15px;text-align:right}.status.ok{color:var(--ok)}
.tv{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;background:#0d1420;overflow:hidden}
.tvHead{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #ffffff0b}
.tvBrand{font-size:10px;letter-spacing:.24em;color:#687c94}.tvState{font-size:10px;color:#64778e}.tvStage{display:grid;place-items:center;padding:26px}
.tvFrame{width:min(100%,1100px);height:min(72dvh,720px);border-radius:24px;overflow:hidden;background:#151f2d;box-shadow:0 28px 80px #0008;position:relative;border:1px solid #ffffff0d}
.tvFrame img{width:100%;height:100%;object-fit:cover;display:block}.tvText{width:100%;height:100%;display:grid;place-items:center;text-align:center;padding:7vw;font-size:clamp(34px,7vw,86px);line-height:1.04;font-weight:650;letter-spacing:-.045em}
.tvEmpty{width:100%;height:100%;display:grid;place-items:center;color:#53657b;font-size:14px}
.tvFoot{padding:14px 20px 18px;display:flex;justify-content:space-between;gap:10px;font-size:10px;color:#53667d}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5e7188;margin-right:7px}.pulse.live{background:#82af95;box-shadow:0 0 10px #82af9566}
@media(max-width:560px){.sendCard{grid-template-columns:1fr 145px}.slider{height:48px}.knob{width:38px;height:38px}.app{padding-left:14px;padding-right:14px}.bottom{padding-left:14px;padding-right:14px}.tvFrame{height:68dvh;border-radius:18px}}
</style>
</head>
<body>
<section id="captureView" class="app">
<div class="top"><div><div class="kicker">PROMETEO LAB</div><h1>Notas</h1></div><button id="openTv" class="tvOpen">Abrir Prometeo TV</button></div>
<p class="help">Las notas se guardan apenas las escribís. Deslizar no “sube” nada: solamente marca un corte y dispara el trabajo con lo que ya estaba guardado.</p>
<div id="notes" class="notes"></div>
<div class="addRow"><textarea id="noteInput" class="noteInput" placeholder="Escribí una nota…"></textarea><button id="addBtn" class="addBtn" aria-label="Agregar nota">+</button></div>
<div class="bottom"><div class="sendCard"><div><strong>Preparar</strong><small id="pendingLabel">1 nota nueva</small></div><div><div id="slider" class="slider"><div class="sliderReveal">enviar</div><div id="knob" class="knob"><svg viewBox="0 0 24 24"><path d="M5 12h12M13 7l5 5-5 5"/></svg></div></div><div id="status" class="status"></div></div></div></div>
</section>
<section id="tvView" class="tv hidden"><div class="tvHead"><div class="tvBrand">PROMETEO TV</div><div id="tvState" class="tvState"><span class="pulse"></span>esperando</div></div><div class="tvStage"><div id="tvFrame" class="tvFrame"><div class="tvEmpty">Esperando una instrucción de Prometeo.</div></div></div><div class="tvFoot"><span id="tvRev">rev —</span><span id="tvTime">sin actualizaciones</span></div></section>
<script>
(() => {
const KEY_NOTES='prometeo_tv_lab_notes_v1',KEY_STATE='prometeo_tv_lab_state_v1',KEY_DISPATCH='prometeo_tv_lab_dispatch_v1';
const CAT_URL='https://images.unsplash.com/photo-1518791841217-8f162f1e1131?auto=format&fit=crop&w=1600&q=85';
const bc=('BroadcastChannel' in window)?new BroadcastChannel('prometeo-tv-lab'):null;
const captureView=document.getElementById('captureView'),tvView=document.getElementById('tvView'),notesEl=document.getElementById('notes'),noteInput=document.getElementById('noteInput'),addBtn=document.getElementById('addBtn'),openTv=document.getElementById('openTv'),pendingLabel=document.getElementById('pendingLabel'),status=document.getElementById('status'),slider=document.getElementById('slider'),knob=document.getElementById('knob');
let notes=loadNotes(),drag={on:false,start:0,x:0};
if(!notes.length){notes=[{id:crypto.randomUUID(),text:'Poné en Prometeo TV una foto de un gato.',createdAt:Date.now(),dispatchedRevision:null}];saveNotes()}
function loadNotes(){try{return JSON.parse(localStorage.getItem(KEY_NOTES)||'[]')}catch{return[]}}
function saveNotes(){localStorage.setItem(KEY_NOTES,JSON.stringify(notes));bc?.postMessage({type:'notes_changed'});renderNotes()}
function pendingNotes(){return notes.filter(n=>!n.dispatchedRevision)}
function renderNotes(){notesEl.innerHTML='';[...notes].reverse().forEach(n=>{const card=document.createElement('article');card.className='note'+(n.dispatchedRevision?' sent':'');const p=document.createElement('p');p.textContent=n.text;const meta=document.createElement('div');meta.className='noteMeta';const left=document.createElement('span');left.textContent=new Date(n.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});const right=document.createElement('span');right.className='badge';right.textContent=n.dispatchedRevision?`enviada · rev ${n.dispatchedRevision}`:'nueva';meta.append(left,right);card.append(p,meta);notesEl.appendChild(card)});const count=pendingNotes().length;pendingLabel.textContent=count===1?'1 nota nueva':`${count} notas nuevas`}
addBtn.onclick=addNote;noteInput.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')addNote()});
function addNote(){const text=noteInput.value.trim();if(!text)return;notes.push({id:crypto.randomUUID(),text,createdAt:Date.now(),dispatchedRevision:null});noteInput.value='';saveNotes();status.textContent='guardado';status.className='status ok';setTimeout(()=>{if(status.textContent==='guardado')status.textContent=''},900)}
openTv.onclick=()=>{const base=location.href.split('#')[0];window.open(base+'#tv','_blank')};
function nextRevision(){let current=0;try{current=JSON.parse(localStorage.getItem(KEY_DISPATCH)||'{}').revision||0}catch{}return current+1}
function interpret(allText){const text=allText.toLowerCase();if(/\bgato\b|\bcat\b/.test(text))return{type:'image',src:CAT_URL,alt:'Foto de un gato',label:'gato'};const quoted=allText.match(/["“](.+?)["”]/);if(/\btexto\b|\bfrase\b|\bmostr[aá]\b/.test(text))return{type:'text',text:quoted?.[1]||allText.replace(/prometeo tv/ig,'').trim()};return{type:'text',text:allText}}
function dispatchNow(){const batch=pendingNotes();if(!batch.length){status.textContent='no hay notas nuevas';status.className='status';return}const revision=nextRevision(),sentAt=Date.now(),instruction=batch.map(n=>n.text).join('\n'),payload={revision,sentAt,noteIds:batch.map(n=>n.id),noteCount:batch.length,instruction,tv:interpret(instruction)};localStorage.setItem(KEY_DISPATCH,JSON.stringify(payload));localStorage.setItem(KEY_STATE,JSON.stringify(payload));notes=notes.map(n=>payload.noteIds.includes(n.id)?{...n,dispatchedRevision:revision}:n);localStorage.setItem(KEY_NOTES,JSON.stringify(notes));bc?.postMessage({type:'dispatch',payload});status.textContent=`enviado · rev ${revision} · ${new Date(sentAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`;status.className='status ok';renderNotes()}
const maxX=()=>slider.clientWidth-knob.clientWidth-10;function draw(){knob.style.transform=`translateX(${drag.x}px)`}
knob.addEventListener('pointerdown',e=>{drag.on=true;drag.start=e.clientX-drag.x;knob.setPointerCapture(e.pointerId)});knob.addEventListener('pointermove',e=>{if(!drag.on)return;drag.x=Math.max(0,Math.min(maxX(),e.clientX-drag.start));draw()});knob.addEventListener('pointerup',()=>{if(!drag.on)return;drag.on=false;const fire=drag.x>maxX()*.78;if(fire){drag.x=maxX();draw();setTimeout(dispatchNow,70)}setTimeout(()=>{drag.x=0;knob.style.transition='transform .28s cubic-bezier(.2,.85,.25,1)';draw();setTimeout(()=>knob.style.transition='',320)},fire?180:0)});
const tvFrame=document.getElementById('tvFrame'),tvState=document.getElementById('tvState'),tvRev=document.getElementById('tvRev'),tvTime=document.getElementById('tvTime');
function showOnTv(payload){if(!payload||!payload.tv)return;tvFrame.innerHTML='';const view=payload.tv;if(view.type==='image'){const img=document.createElement('img');img.src=view.src;img.alt=view.alt||'';img.onerror=()=>{tvFrame.innerHTML='<div class="tvText">🐈</div>'};tvFrame.appendChild(img)}else{const t=document.createElement('div');t.className='tvText';t.textContent=view.text||'';tvFrame.appendChild(t)}tvState.innerHTML='<span class="pulse live"></span>actualizado';tvRev.textContent=`rev ${payload.revision}`;tvTime.textContent=new Date(payload.sentAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
let lastTvRevision=-1;function syncTvFromStorage(){let payload=null;try{payload=JSON.parse(localStorage.getItem(KEY_STATE)||'null')}catch{}if(payload&&payload.revision!==lastTvRevision){lastTvRevision=payload.revision;showOnTv(payload)}}
bc?.addEventListener('message',e=>{if(e.data?.type==='dispatch'){lastTvRevision=e.data.payload?.revision??lastTvRevision;showOnTv(e.data.payload)}});window.addEventListener('storage',e=>{if(e.key===KEY_STATE)syncTvFromStorage()});setInterval(syncTvFromStorage,1200);
function route(){const isTv=location.hash==='#tv';captureView.classList.toggle('hidden',isTv);tvView.classList.toggle('hidden',!isTv);if(isTv)syncTvFromStorage()}
window.addEventListener('hashchange',route);renderNotes();route();
})();
</script>
</body>
</html>
