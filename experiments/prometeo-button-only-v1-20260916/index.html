<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Prometeo · botón</title>
<link rel="stylesheet" href="./style.css?v=1">
<link rel="stylesheet" href="./patch-v3.css?v=3">
</head>
<body>
<div id="veil"></div>
<section id="panel" aria-hidden="true" data-view="menu">
  <header class="panelHead">
    <button id="back" class="headBtn invisible" aria-label="Atrás">‹</button>
    <div id="title">Prometeo</div>
    <button id="close" class="headBtn" aria-label="Cerrar">×</button>
  </header>

  <div id="menuView" class="view">
    <button class="menuRow" data-open="notes"><span>Nota</span><i>›</i></button>
    <button class="menuRow" data-open="work"><span>Trabajos</span><i>›</i></button>
  </div>

  <div id="notesView" class="view hidden">
    <div class="groupsBar">
      <div id="groups" class="groups"></div>
      <button id="newGroup" class="tinyBtn">+</button>
    </div>

    <div class="composer">
      <textarea id="draft" placeholder="Escribí algo…"></textarea>
      <div class="controls">
        <button id="rec" class="rec" aria-pressed="false" aria-label="Grabar">
          <span class="track">
            <span class="led"></span>
            <span class="micMark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 1-10 0M12 16v3"/></svg></span>
            <span class="knob"></span>
          </span>
        </button>
        <div id="state" class="state">Audio</div>
        <button id="addText" class="send" aria-label="Agregar nota"><svg viewBox="0 0 24 24"><path d="M5 12h12M13 7l5 5-5 5"/></svg></button>
      </div>
      <div id="recActions" class="recActions hidden">
        <button id="pause">Pausar</button>
        <button id="saveAudio">Guardar</button>
        <button id="discardAudio">×</button>
      </div>
    </div>

    <section class="accumulated">
      <div class="sectionHead"><span>Acumulado</span><span id="count">0</span></div>
      <div id="notesList"></div>
    </section>

    <section class="sendModes">
      <div class="modeRow">
        <div><b>Planificar</b><small>pensar y devolver un plan</small></div>
        <div class="spring" data-mode="plan"><div class="reveal">enviar</div><div class="springKnob"><svg viewBox="0 0 24 24"><path d="M5 12h12M13 7l5 5-5 5"/></svg></div></div>
      </div>
      <div class="modeRow">
        <div><b>Trabajar</b><small>hacer cambios reales</small></div>
        <div class="spring" data-mode="work"><div class="reveal">enviar</div><div class="springKnob"><svg viewBox="0 0 24 24"><path d="M5 12h12M13 7l5 5-5 5"/></svg></div></div>
      </div>
    </section>
  </div>

  <div id="workView" class="view hidden">
    <section id="activeWork" class="workCard hidden">
      <div class="workTop">
        <div class="ping"></div>
        <div class="workCopy"><b id="workTitle">Listo para pegar</b><small id="workStatus"></small></div>
      </div>
      <div class="progress"><span id="progressFill"></span></div>
      <div id="checkpoints" class="checkpoints"><i></i><i></i><i></i><i></i><i></i></div>
      <p id="workMessage"></p>
      <div class="workActions">
        <button id="copyAgain">Copiar</button>
        <button id="openChat">Abrir chat</button>
        <button id="showPrompt">Prompt</button>
      </div>
      <pre id="promptBox" class="promptBox hidden"></pre>
    </section>

    <section id="result" class="result hidden">
      <div class="sectionHead"><span>Respuesta</span><span id="resultWhen"></span></div>
      <div id="answer" class="answer"></div>
      <div id="buckets" class="buckets"></div>
    </section>

    <section class="history">
      <div class="sectionHead"><span>Anteriores</span><span></span></div>
      <div id="history"></div>
    </section>
  </div>

  <div id="error" class="error hidden"></div>
</section>

<button id="prometeo" aria-label="Prometeo">
  <span class="orbit"></span><span class="core"></span><span class="statusDot"></span>
</button>
<script>
(()=>{
  const key='prometeo.button.only.v1.groups';
  try{
    const current=JSON.parse(localStorage.getItem(key)||'null');
    if(!Array.isArray(current)||!current.length){
      const rid=(globalThis.crypto&&typeof globalThis.crypto.randomUUID==='function')?globalThis.crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`;
      localStorage.setItem(key,JSON.stringify([{id:'group-'+rid,name:'Grupo 1',created:Date.now()}]));
    }
  }catch{
    const rid=`${Date.now()}-${Math.random().toString(16).slice(2)}`;
    try{localStorage.setItem(key,JSON.stringify([{id:'group-'+rid,name:'Grupo 1',created:Date.now()}]))}catch{}
  }
})();
</script>
<script type="module" src="./app.js?v=2"></script>
<script type="module" src="./patch-v3.js?v=3"></script>
</body>
</html>
