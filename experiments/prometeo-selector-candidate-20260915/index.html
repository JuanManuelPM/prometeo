<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f3f0e8">
<title>Prometeo · candidata</title>
<style>
:root{--paper:#f3f0e8;--ink:#171816;--muted:#77756e;--line:rgba(23,24,22,.13);--face:#e8e3d8;--live:#77846e;--danger:#9a5b50;--shadow:rgba(45,39,29,.16)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,textarea{font:inherit;color:inherit}.stage,.home,#pageHost{position:absolute;inset:0}.home{display:flex;flex-direction:column;background:var(--paper);z-index:0}.home[hidden],#pageHost[hidden]{display:none!important}
.homeMark{position:absolute;left:12px;top:calc(10px + env(safe-area-inset-top));font-size:10px;font-weight:780;letter-spacing:.12em;text-transform:uppercase;color:rgba(23,24,22,.38);user-select:none}
#pageHost{border:0;width:100%;height:100%;background:var(--paper);z-index:1}
.captureHome{position:absolute;left:max(8px,env(safe-area-inset-left));right:max(58px,calc(8px + env(safe-area-inset-right)));bottom:max(8px,calc(8px + env(safe-area-inset-bottom)));z-index:2;display:grid;gap:5px;pointer-events:auto}
.noteStream{max-height:34vh;overflow:auto;overscroll-behavior:contain;padding:0 7px;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;scrollbar-width:none}.noteStream:empty{display:none}.noteStream::-webkit-scrollbar{display:none}.note{font-size:12px;line-height:1.28;padding:7px 9px;background:rgba(255,255,255,.29);border:1px solid rgba(23,24,22,.065);border-radius:11px;backdrop-filter:blur(7px);overflow-wrap:anywhere}.note small{display:block;color:var(--muted);font-size:9px;margin-bottom:2px}
.composer{display:grid;grid-template-columns:1fr 38px;align-items:end;gap:4px;border:1px solid rgba(23,24,22,.12);background:rgba(243,240,232,.86);backdrop-filter:blur(12px);border-radius:14px;padding:4px;box-shadow:0 5px 20px rgba(45,39,29,.05)}.composer textarea{border:0;outline:0;background:transparent;resize:none;min-height:36px;max-height:96px;padding:9px 8px;line-height:1.25}.composer textarea::placeholder{color:rgba(23,24,22,.38)}.composer button{height:36px;width:38px;border:0;border-radius:10px;background:var(--ink);color:var(--paper);font-weight:800;cursor:pointer}
.shell{position:fixed;inset:0;z-index:1000;pointer-events:none}.veil{position:absolute;inset:0;background:rgba(26,25,22,.08);backdrop-filter:blur(1.4px);opacity:0;pointer-events:none;transition:opacity .14s}.shell.menu-open .veil{opacity:1;pointer-events:auto}
.anchor{position:absolute;width:64px;height:64px;left:calc(100% - 72px - env(safe-area-inset-right));top:calc(100% - 72px - env(safe-area-inset-bottom));pointer-events:auto;touch-action:none;user-select:none;transition:left .21s cubic-bezier(.2,.8,.2,1),top .21s cubic-bezier(.2,.8,.2,1)}.anchor.dragging{transition:none}.puck{position:absolute;width:34px;height:34px;border-radius:50%;border:1px solid rgba(23,24,22,.20);background:linear-gradient(145deg,#f3efe6,#dcd5c8);box-shadow:0 4px 12px var(--shadow),inset 1px 1px 2px rgba(255,255,255,.72),inset -1px -1px 2px rgba(64,55,42,.08);display:grid;place-items:center;cursor:grab}.anchor.br .puck,.anchor.tr .puck{right:3px}.anchor.bl .puck,.anchor.tl .puck{left:3px}.anchor.br .puck,.anchor.bl .puck{bottom:3px}.anchor.tr .puck,.anchor.tl .puck{top:3px}.puck:active{cursor:grabbing}.dimple{width:12px;height:12px;border-radius:50%;background:#e3ddd1;box-shadow:inset 1px 1px 2px rgba(39,34,27,.17),inset -1px -1px 2px rgba(255,255,255,.75)}.led{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--live);box-shadow:0 0 0 2px rgba(119,132,110,.09),0 0 6px rgba(119,132,110,.4);animation:pulse 1.9s ease-in-out infinite}.anchor.br .led,.anchor.tr .led{right:6px}.anchor.bl .led,.anchor.tl .led{left:6px}.anchor.br .led,.anchor.bl .led{bottom:5px}.anchor.tr .led,.anchor.tl .led{top:5px}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.menu{position:absolute;width:min(302px,calc(100vw - 14px));max-height:min(68dvh,520px);display:flex;flex-direction:column;background:rgba(243,240,232,.94);backdrop-filter:blur(18px);border:1px solid rgba(23,24,22,.11);border-radius:17px;box-shadow:0 12px 42px rgba(45,39,29,.16);overflow:hidden;opacity:0;transform:scale(.97);pointer-events:none;transition:opacity .12s,transform .12s;z-index:3}.shell.menu-open .menu{opacity:1;transform:scale(1);pointer-events:auto}.menuHead{height:40px;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;border-bottom:1px solid var(--line)}.menuHead button{height:40px;border:0;background:transparent;font-size:19px;cursor:pointer}.menuTitle{text-align:center;font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.menuList{overflow:auto;overscroll-behavior:contain;padding:4px}.row{width:100%;min-height:44px;border:0;background:transparent;border-radius:11px;display:grid;grid-template-columns:1fr 24px;align-items:center;text-align:left;padding:0 9px;cursor:pointer}.row span:first-child{font-size:13px;font-weight:680}.row .chev{justify-self:end;color:var(--muted);font-size:17px}.row.selected{background:rgba(23,24,22,.075)}.row:active{background:rgba(23,24,22,.11)}
.recordCard{position:absolute;z-index:4;width:min(270px,calc(100vw - 20px));min-height:112px;background:rgba(243,240,232,.82);backdrop-filter:blur(18px);border:1px solid rgba(23,24,22,.12);border-radius:20px;box-shadow:0 14px 42px rgba(45,39,29,.17);padding:14px;pointer-events:auto;touch-action:none;opacity:0;transform:scale(.96);transition:opacity .14s,transform .14s}.recordCard.on{opacity:1;transform:scale(1)}.recordTop{display:flex;align-items:center;gap:9px}.recDot{width:8px;height:8px;border-radius:50%;background:var(--danger);animation:pulse 1.25s infinite}.recordCard.paused .recDot{animation:none;opacity:.35}.recState{font-size:12px;font-weight:820;flex:1}.recTime{font-variant-numeric:tabular-nums;font-size:12px;font-weight:820}.recordCore{height:58px;display:grid;place-items:center;font-size:11px;color:var(--muted);position:relative}.recordCore:before{content:'';position:absolute;left:50%;top:50%;width:40px;height:40px;border-radius:50%;transform:translate(-50%,-50%);border:1px solid rgba(23,24,22,.12);background:rgba(255,255,255,.18)}.recordCore span{position:relative}.recordHints{display:flex;justify-content:space-between;font-size:9px;color:rgba(23,24,22,.42);letter-spacing:.02em}.recordCard.swipe-left{transform:translateX(-12px) scale(.98)}.recordCard.swipe-right{transform:translateX(12px) scale(.98)}
.toast{position:absolute;left:50%;bottom:max(78px,calc(78px + env(safe-area-inset-bottom)));transform:translate(-50%,8px);background:rgba(23,24,22,.9);color:var(--paper);padding:7px 10px;border-radius:10px;font-size:10px;opacity:0;transition:.14s;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}
.notesPanel{position:absolute;inset:0;z-index:2;background:rgba(243,240,232,.94);backdrop-filter:blur(18px);pointer-events:auto;display:none;overflow:auto;padding:calc(10px + env(safe-area-inset-top)) 12px calc(88px + env(safe-area-inset-bottom))}.notesPanel.on{display:block}.notesHead{display:flex;align-items:center;height:42px;position:sticky;top:0;background:rgba(243,240,232,.92);backdrop-filter:blur(15px);z-index:2}.notesHead strong{font-size:13px;flex:1}.notesHead button{border:0;background:transparent;width:42px;height:42px;font-size:20px}.notesList{display:flex;flex-direction:column;gap:6px;justify-content:flex-end;min-height:calc(100dvh - 160px)}.notesActions{position:fixed;left:12px;right:12px;bottom:max(10px,calc(10px + env(safe-area-inset-bottom)));display:grid;grid-template-columns:1fr 1.5fr;gap:6px}.notesActions button{height:48px;border-radius:13px;border:1px solid var(--line);background:rgba(243,240,232,.92);font-weight:780}.notesActions .work{background:var(--ink);color:var(--paper);border-color:var(--ink)}
@media(max-width:310px){.anchor{width:60px;height:60px}.puck{width:33px;height:33px}.menu{width:calc(100vw - 10px);max-height:72dvh}.row{min-height:42px}.captureHome{right:max(55px,calc(6px + env(safe-area-inset-right)));left:max(6px,env(safe-area-inset-left));bottom:max(6px,calc(6px + env(safe-area-inset-bottom)))}.composer{border-radius:12px}.recordCard{width:calc(100vw - 14px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<main class="stage">
  <section id="home" class="home"><div class="homeMark">Prometeo</div><div class="captureHome"><div id="noteStream" class="noteStream"></div><div class="composer"><textarea id="draft" rows="1" placeholder="Escribir una nota"></textarea><button id="sendNote" aria-label="Guardar">↑</button></div></div></section>
  <iframe id="pageHost" title="Página" hidden></iframe>
</main>
<section id="shell" class="shell">
  <div id="veil" class="veil"></div>
  <div id="menu" class="menu" aria-hidden="true"><div class="menuHead"><button id="menuBack" aria-label="Volver">‹</button><div id="menuTitle" class="menuTitle">Prometeo</div><button id="menuClose" aria-label="Cerrar">×</button></div><div id="menuList" class="menuList"></div></div>
  <div id="anchor" class="anchor br" aria-label="Prometeo"><div class="puck"><span class="dimple"></span><span class="led"></span></div></div>
  <div id="recordCard" class="recordCard" aria-hidden="true"><div class="recordTop"><span class="recDot"></span><span id="recState" class="recState">Grabando</span><span id="recTime" class="recTime">00:00</span></div><div class="recordCore"><span>tocar · pausa</span></div><div class="recordHints"><span>← descartar</span><span>guardar →</span></div></div>
  <div id="toast" class="toast"></div>
  <section id="notesPanel" class="notesPanel"><div class="notesHead"><strong>Notas</strong><button id="notesClose" aria-label="Cerrar">×</button></div><div id="notesList" class="notesList"></div><div class="notesActions"><button id="thinkBtn">Pensar</button><button id="workBtn" class="work">Trabajar</button></div></section>
</section>
<script>window.__PROMETEO_DISABLE_GLOBAL_SHELL__=true;</script>
<script type="module" src="./shell.js?v=3"></script>
</body>
</html>
