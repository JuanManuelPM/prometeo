<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172131"><title>Capture Lab</title><style>

</style></head><body><main class="app"><div class="top"><div><div class="k">CAPTURE LAB</div><h1 id="title">Notas</h1></div><button id="diagBtn" class="diagBtn" aria-label="diagnóstico"></button></div><section id="feed" class="feed"><div id="empty" class="empty">Todo lo que se te ocurra, acá.</div></section><section id="works" class="hidden"><button id="back" class="back">← notas</button><div class="works" id="workList"></div></section></main><div class="bottom" id="bottom"><div id="prepareRow" class="prepareRow hidden"><div><b>Preparar</b><small id="count"></small></div><div class="spring" data-action="prepare"><div class="reveal">ChatGPT</div><div class="springKnob"><svg viewBox="0 0 24 24"><path d="M5 12h12M13 7l5 5-5 5"/></svg></div></div></div><button id="add" class="add"><span>+</span></button></div><div id="scrim" class="scrim hidden"></div><section id="composer" class="composer hidden"><div class="handle"></div><div class="chead"><span>Nueva nota</span><button id="close" class="x">×</button></div><div class="draftBox"><div id="draft" class="draft" contenteditable="true" data-ph="Escribí algo…"></div></div><div class="controls"><button id="rec" class="rec" aria-pressed="false"><span class="track"><span class="led"></span><span class="micMark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0M12 16v3"/></svg></span><span class="knob"></span></span></button><div id="state" class="state">Audio</div><button id="send" class="send"><svg viewBox="0 0 24 24"><path d="M5 12h12M13 7l5 5-5 5"/></svg></button></div></section><aside id="diag" class="diag hidden"><div class="diagHead"><b>Transcripción</b><button id="dx" class="x">×</button></div><div class="grid"><span>Motor</span><b id="de">auto</b><span>Modo</span><b id="dm">detectando</b><span>WebGPU</span><b id="dg">—</b><span>Modelo</span><b id="dmodel">—</b><span>Último audio</span><b id="dl">—</b></div><p id="dn">El audio se graba completo primero. La transcripción final siempre se hace después con Whisper local, en una cola independiente.</p></aside><script type="module">
const $=s=>document.querySelector(s),feed=$('#feed'),empty=$('#empty'),works=$('#works'),workList=$('#workList'),bottom=$('#bottom'),prepareRow=$('#prepareRow'),count=$('#count'),add=$('#add'),composer=$('#composer'),scrim=$('#scrim'),close=$('#close'),draft=$('#draft'),recBtn=$('#rec'),st=$('#state'),send=$('#send'),diag=$('#diag');let notes=JSON.parse(localStorage.getItem('captureLabNotes')||'[]'),active=null,lastRange=null,whisper=null,whisperPromise=null,db=null,transcriptionQueue=Promise.resolve(),pendingTranscriptions=0;
$('#diagBtn').onclick=()=>diag.classList.remove('hidden');$('#dx').onclick=()=>diag.classList.add('hidden');$('#back').onclick=showNotes;add.onclick=()=>{composer.classList.remove('hidden');scrim.classList.remove('hidden')};close.onclick=scrim.onclick=()=>{if(!active){composer.classList.add('hidden');scrim.classList.add('hidden')}};draft.onkeyup=draft.onmouseup=draft.onfocus=()=>saveRange();draft.oninput=()=>saveRange();recBtn.onclick=()=>active?stopRecording():startRecording();send.onclick=saveNote;
function saveRange(){let s=getSelection();if(s&&s.rangeCount&&draft.contains(s.getRangeAt(0).commonAncestorContainer))lastRange=s.getRangeAt(0).cloneRange()}function insertToken(){let t=document.createElement('span');t.className='token';t.contentEditable='false';t.textContent='transcribiendo audio';let r=lastRange;if(!r||!draft.contains(r.commonAncestorContainer)){r=document.createRange();r.selectNodeContents(draft);r.collapse(false)}let z=document.createTextNode('\u200b');r.deleteContents();r.insertNode(z);r.insertNode(t);r.setStartAfter(z);r.collapse(true);lastRange=r.cloneRange();return t}function preferred(){for(let t of['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'])if(MediaRecorder.isTypeSupported?.(t))return t;return''}

function updateCaptureState(){if(active){st.textContent='Grabando';return}st.textContent=pendingTranscriptions?`Transcribiendo ${pendingTranscriptions}`:'Audio'}

function saveNote(){if(active||draft.querySelector('.token')){st.textContent='Esperá la transcripción';return}let text=draft.innerText.replace(/\u200b/g,'').trim();if(!text)return;notes.unshift({id:crypto.randomUUID(),text,ts:Date.now()});localStorage.setItem('captureLabNotes',JSON.stringify(notes));draft.innerHTML='';lastRange=null;composer.classList.add('hidden');scrim.classList.add('hidden');render()}
function render(){works.classList.add('hidden');feed.classList.remove('hidden');bottom.classList.remove('hidden');feed.querySelectorAll('.note').forEach(n=>n.remove());empty.classList.toggle('hidden',!!notes.length);for(let n of notes){let a=document.createElement('article');a.className='note';a.innerHTML=`<p></p><div class="meta">ahora</div>`;a.querySelector('p').textContent=n.text;feed.appendChild(a)}count.textContent=`${notes.length} ${notes.length===1?'nota':'notas'}`;prepareRow.classList.toggle('hidden',!notes.length);add.classList.remove('hidden');bindSprings(document)}function showNotes(){render()}
function prepare(){feed.classList.add('hidden');works.classList.remove('hidden');add.classList.add('hidden');prepareRow.classList.add('hidden');let all=notes.map(n=>n.text.toLowerCase()).join(' '),items=[];if(/calend|evento|día|dia/.test(all))items.push(['Calendario',notes.filter(n=>/calend|evento|día|dia/i.test(n.text)).length||1]);if(/jose|josé|alumno|teor|práct|pract/.test(all))items.push(['Student World',notes.filter(n=>/jose|josé|alumno|teor|práct|pract/i.test(n.text)).length||1]);if(/naveg|bot[oó]n|slider|resorte|volver/.test(all))items.push(['Interacción',notes.filter(n=>/naveg|bot[oó]n|slider|resorte|volver/i.test(n.text)).length||1]);if(!items.length)items.push(['Notas nuevas',notes.length]);workList.innerHTML='';for(let [title,c] of items){let e=document.createElement('article');e.className='work';e.innerHTML=`<h3>${title}</h3><small>${c} ${c===1?'nota':'notas'} · prompt listo</small><div class="spring" data-action="execute"><div class="reveal">Trabajar</div><div class="springKnob"><svg viewBox="0 0 24 24"><path d="M5 12h12M13 7l5 5-5 5"/></svg></div></div>`;workList.appendChild(e)}bindSprings(workList)}
