<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2efe7"><title>Modelos III · Sistémica</title><style>html,body{margin:0;background:#f2efe7;color:#18201d;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;font-size:12px;font-weight:700;opacity:.58}</style></head><body><div id="boot">cargando…</div><script>(async()=>{try{const base='https://raw.githubusercontent.com/JuanManuelPM/prometeo/main/pages/modelos-iii/';const files=['bundle-v13-1.txt','bundle-v13-2.txt','bundle-v13-3a1.txt','bundle-v13-3a2.txt','bundle-v13-3b1.txt','bundle-v13-3b2.txt','bundle-v13-4.txt','bundle-v13-5.txt','bundle-v13-6.txt'];const parts=await Promise.all(files.map(async f=>{const r=await fetch(base+f+'?v=13c',{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);return (await r.text()).trim()}));const bin=atob(parts.join(''));const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('actualizá el navegador para abrir esta página');const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();if(!html.includes('Modelos III')||!html.includes('casa-room-audio'))throw new Error('versión incompleta');document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').textContent='No pude abrir Modelos III · '+(e?.message||e)}})();</script></body></html>
