<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Prometeo Live</title>
<style>
:root{--bg:#050506;--fg:#f4f4f1;--muted:#77777d;--muted2:#a7a7ab;--hair:#1d1d20;--panel:#0b0b0d;--hot:#f0f0ec;--ok:#d9f7df;--warn:#f7e7b1;--bad:#ffb8b8;--r:22px;--safe-t:max(18px,env(safe-area-inset-top));--safe-b:max(22px,env(safe-area-inset-bottom))}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100svh;overflow-x:hidden}button,a{font:inherit;color:inherit}.shell{min-height:100svh;display:flex;flex-direction:column;padding:var(--safe-t) clamp(18px,4vw,52px) var(--safe-b);max-width:1440px;margin:0 auto}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:44px}.brand{display:flex;align-items:center;gap:11px;font-size:12px;letter-spacing:.12em;font-weight:760}.pulse{position:relative;width:11px;height:11px;border:1px solid #69696e;border-radius:50%}.pulse::after{content:"";position:absolute;inset:2px;border-radius:50%;background:#727278;transition:.25s}.pulse.ok::after{background:#e9f7ea;box-shadow:0 0 16px rgba(233,247,234,.38)}.pulse.bad::after{background:#ffaaaa;box-shadow:0 0 14px rgba(255,170,170,.28)}.clock{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}.core{flex:1;display:grid;align-content:center;gap:clamp(26px,5.5vh,58px);padding:clamp(36px,7vh,92px) 0}.sentence{max-width:1100px;font-size:clamp(26px,4.6vw,66px);line-height:1.03;letter-spacing:-.052em;font-weight:540;text-wrap:balance}.sentence .dim{color:#6e6e74}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}.metric{padding:clamp(18px,2.8vw,36px) 0;min-width:0}.metric+.metric{border-left:1px solid var(--hair);padding-left:clamp(16px,2.7vw,38px)}.num{display:block;font-size:clamp(52px,10vw,132px);line-height:.82;letter-spacing:-.085em;font-weight:520;font-variant-numeric:tabular-nums}.label{display:block;margin-top:14px;color:var(--muted);font-size:clamp(10px,1vw,13px);text-transform:uppercase;letter-spacing:.12em;font-weight:720}.actionrow{display:flex;align-items:flex-end;justify-content:space-between;gap:28px}.actioncopy{max-width:880px}.actionkicker{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:760;margin-bottom:8px}.actiontext{font-size:clamp(18px,2.4vw,31px);line-height:1.18;letter-spacing:-.025em}.copybtn{flex:none;border:1px solid #2b2b2f;background:#0a0a0c;border-radius:999px;padding:13px 17px;cursor:pointer;font-size:12px;font-weight:720;letter-spacing:.02em;min-width:112px}.copybtn:active{transform:translateY(1px)}.copybtn[hidden]{display:none}.trace{height:22px;display:flex;align-items:center;gap:6px;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 7%,#000 100%)}.trace i{display:block;height:2px;min-width:18px;flex:1;background:#2b2b2f;border-radius:20px}.trace i.return{height:3px;background:#deded9}.trace i.start{background:#6c6c72}.trace i.problem{height:3px;background:#b87979}.under{display:flex;align-items:center;justify-content:space-between;gap:18px;color:var(--muted);font-size:11px}.detailbtn{border:0;background:transparent;color:var(--muted);padding:8px 0;cursor:pointer;text-decoration:underline;text-decoration-color:#323237;text-underline-offset:4px}.drawer{display:none;border-top:1px solid var(--hair);padding:30px 0 14px}.drawer.open{display:block}.detailgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:46px}.sectiontitle{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:760;margin:0 0 14px}.frontier{font-size:17px;line-height:1.45;color:#d1d1d0;margin:0 0 28px;max-width:880px}.flow{border-top:1px solid var(--hair)}.row{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:16px;align-items:start;padding:14px 0;border-bottom:1px solid var(--hair)}.state{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding-top:2px}.state.working{color:#d8e6ff}.state.returned{color:var(--ok)}.state.ready{color:var(--warn)}.state.problem{color:var(--bad)}.task{font-size:13px;line-height:1.35}.task small{display:block;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prio{color:#5f5f64;font-size:10px;font-variant-numeric:tabular-nums}.events{display:grid;gap:10px}.event{display:grid;grid-template-columns:54px 1fr;gap:12px;font-size:12px;line-height:1.35}.event time{color:#626267;font-variant-numeric:tabular-nums}.event span{color:#b6b6b8}.sources{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}.sources a{font-size:10px;color:#77777d;text-decoration:none;border:1px solid #202024;border-radius:999px;padding:7px 10px}.tiny{font-size:10px;line-height:1.45;color:#5f5f64;margin-top:18px}.errorline{color:var(--bad)}
@media(max-width:780px){.shell{padding-left:18px;padding-right:18px}.core{align-content:start;padding-top:14vh;gap:34px}.sentence{font-size:clamp(28px,9.2vw,46px)}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{padding:20px 0}.metric+.metric{border-left:1px solid var(--hair);padding-left:20px}.metric:nth-child(3){border-left:0;border-top:1px solid var(--hair);padding-left:0}.metric:nth-child(4){border-top:1px solid var(--hair)}.num{font-size:clamp(58px,21vw,92px)}.actionrow{align-items:flex-start;flex-direction:column;gap:18px}.copybtn{width:100%}.detailgrid{grid-template-columns:1fr;gap:34px}.row{grid-template-columns:78px minmax(0,1fr)}.prio{display:none}.under{align-items:flex-end}.clock{font-size:10px}.brand{font-size:11px}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><span class="pulse" id="pulse"></span><span>PROMETEO</span></div>
    <div class="clock" id="clock">leyendo estado…</div>
  </header>

  <main class="core">
    <div class="sentence" id="sentence">Reconstruyendo la producción real.</div>

    <section class="metrics" aria-label="Estado de producción">
      <div class="metric"><span class="num" id="working">–</span><span class="label">trabajando</span></div>
      <div class="metric"><span class="num" id="returned">–</span><span class="label">volvieron</span></div>
      <div class="metric"><span class="num" id="waiting">–</span><span class="label">esperando</span></div>
      <div class="metric"><span class="num" id="problems">–</span><span class="label">problema</span></div>
    </section>

    <section class="actionrow">
      <div class="actioncopy">
        <div class="actionkicker">lo único que necesitás hacer</div>
        <div class="actiontext" id="action">Leyendo la cola y las devoluciones…</div>
      </div>
      <button class="copybtn" id="copy" hidden>copiar worker</button>
    </section>

    <div>
      <div class="trace" id="trace" aria-label="Progreso reciente"></div>
      <div class="under"><span id="generation">—</span><button class="detailbtn" id="detailBtn">ver detalle</button></div>
    </div>
  </main>

  <section class="drawer" id="drawer">
    <div class="detailgrid">
      <div>
        <div class="sectiontitle">frontera actual</div>
        <p class="frontier" id="frontier">—</p>
        <div class="sectiontitle">flujo</div>
        <div class="flow" id="flow"></div>
      </div>
      <aside>
        <div class="sectiontitle">eventos recientes</div>
        <div class="events" id="events"></div>
        <div class="sources" id="sources"></div>
        <div class="tiny" id="diagnostic">La pantalla es una proyección. El estado durable sigue viviendo en GitHub.</div>
      </aside>
    </div>
  </section>
</div>
<script>
(() => {
  const OWNER='JuanManuelPM', REPO='prometeo', BRANCH='main';
  const RAW=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;
  const API=`https://api.github.com/repos/${OWNER}/${REPO}`;
  const GH=`https://github.com/${OWNER}/${REPO}/blob/${BRANCH}/`;
  const WC='PROMETEO → https://juanmanuelpm.github.io/prometeo/wc';
  const QUEUES=[
    'coordination/opportunities/CANARY_QUEUE_V0.json',
    'coordination/opportunities/META_COMPOUND_QUEUE_V1.json',
    'coordination/opportunities/VERIFICATION_QUEUE_V1.json',
    'coordination/opportunities/GENERATED_QUEUE_GEN2_V1.json',
    'coordination/opportunities/UNIVERSAL_COGNITIVE_SWARM_QUEUE_V1.json'
  ];
  const $=id=>document.getElementById(id);
  const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#039;'}[c]));
  const lower=v=>String(v||'').toLowerCase();
  const first=(...vals)=>vals.find(v=>v!==undefined&&v!==null&&v!=='');

  async function raw(path, optional=false){
    const r=await fetch(RAW+path+'?v='+Date.now(),{cache:'no-store'});
    if(!r.ok){if(optional&&r.status===404)return null;throw new Error(`${path}: ${r.status}`)}
    return r.json();
  }
  async function tree(){
    const r=await fetch(`${API}/git/trees/${BRANCH}?recursive=1`,{headers:{'Accept':'application/vnd.github+json'},cache:'no-store'});
    if(!r.ok)throw new Error(`Git tree: ${r.status}`);
    const j=await r.json();
    return (j.tree||[]).map(x=>x.path);
  }
  async function readPath(path){try{return await raw(path,true)}catch(_){return null}}
  function latest(paths,prefix){return paths.filter(p=>p.startsWith(prefix)&&p.endsWith('.json')).sort().at(-1)||null}
  function timeOf(obj){return first(obj?.returned_at,obj?.completed_at,obj?.created_at,obj?.updated_at,obj?.started_at,obj?.claimed_at,obj?.timestamp)||null}
  function fmt(t){if(!t)return'—';const d=new Date(t);if(Number.isNaN(d.getTime()))return'—';return new Intl.DateTimeFormat('es-AR',{hour:'2-digit',minute:'2-digit'}).format(d)}
  function shortMission(s=''){const clean=String(s).replace(/\s+/g,' ').trim();return clean.length>128?clean.slice(0,125)+'…':clean}
  function explicitProblem(obj){const s=lower(first(obj?.state,obj?.status,obj?.verdict,obj?.result));return /fail|error|boundary|reject|stale|conflict|invalid/.test(s)}

  async function inspectOpportunity(op, paths){
    const id=op.opportunity_id;
    const claimPath=`coordination/opportunities/claims/${id}.json`;
    const runPath=latest(paths,`coordination/opportunities/runs/${id}/`);
    const returnPath=latest(paths,`coordination/opportunities/returns/${id}/`);
    const [claim,run,ret]=await Promise.all([
      paths.includes(claimPath)?readPath(claimPath):null,
      runPath?readPath(runPath):null,
      returnPath?readPath(returnPath):null
    ]);
    let state='waiting';
    if(ret)state=explicitProblem(ret)?'problem':'returned';
    else if(run)state=explicitProblem(run)?'problem':'working';
    else if(claim)state='working';
    else if(lower(op.status).includes('ready'))state='ready';
    else if(lower(op.status).includes('blocked'))state='waiting';
    else if(lower(op.status).includes('fail'))state='problem';
    return {...op,claim,run,ret,runPath,returnPath,state};
  }

  function event(kind,label,t){return t?{kind,label,t,date:new Date(t)}:null}
  function renderTrace(events){
    const recent=events.filter(Boolean).sort((a,b)=>a.date-b.date).slice(-18);
    $('trace').innerHTML=recent.length?recent.map(e=>`<i class="${e.kind}" title="${esc(fmt(e.t)+' · '+e.label)}"></i>`).join(''):'<i></i>';
    $('events').innerHTML=recent.slice().reverse().slice(0,8).map(e=>`<div class="event"><time>${esc(fmt(e.t))}</time><span>${esc(e.label)}</span></div>`).join('')||'<div class="tiny">Todavía no hay eventos legibles.</div>';
  }

  function source(name,path){return `<a target="_blank" rel="noreferrer" href="${GH+path}">${esc(name)}</a>`}

  function renderFlow(items){
    const order={problem:0,working:1,ready:2,returned:3,waiting:4};
    const visible=items.slice().sort((a,b)=>(order[a.state]-order[b.state])||((b.priority||0)-(a.priority||0)));
    $('flow').innerHTML=visible.map(x=>{
      const labels={working:'trabajando',returned:'volvió',ready:'libre',waiting:'esperando',problem:'problema'};
      return `<div class="row"><div class="state ${x.state}">${labels[x.state]}</div><div class="task">${esc(x.opportunity_id)}<small>${esc(shortMission(x.mission||x.type||''))}</small></div><div class="prio">${esc(x.priority??'')}</div></div>`;
    }).join('')||'<div class="tiny">Sin oportunidades activas.</div>';
  }

  function setAction(counts){
    $('copy').hidden=true;
    if(counts.ready>0){
      $('action').textContent=`Podés abrir hasta ${counts.ready} ${counts.ready===1?'worker':'workers'} ahora. Todos usan el mismo prompt.`;
      $('copy').hidden=false;
      return;
    }
    if(counts.working>0){$('action').textContent=`Nada obligatorio. Hay ${counts.working} ${counts.working===1?'worker trabajando':'workers trabajando'}; nuevos /wc pueden entrar en recovery/discovery cuando corresponda.`;return}
    if(counts.returned>0){$('action').textContent='No hace falta transportar resultados. Los próximos workers/ste wards pueden integrar y desbloquear sucesores; usá el guía sólo si querés intervenir.';return}
    if(counts.waiting>0){$('action').textContent='La frontera preparada espera dependencias; nuevos /wc pueden revisar recovery/discovery sin inventar filler.';return}
    $('action').textContent='No hay acción humana obligatoria.';
  }

  async function load(){
    $('pulse').className='pulse';$('clock').textContent='actualizando…';
    try{
      const [head,focus,paths,...queues]=await Promise.all([
        raw('coordination/CONTINUITY_HEAD.json'),
        raw('coordination/workstreams/chat-native-control-plane-v1/FOCUS.json'),
        tree(),
        ...QUEUES.map(q=>raw(q,true))
      ]);
      const merged=new Map();
      queues.filter(Boolean).forEach(q=>(q.opportunities||[]).forEach(op=>merged.set(op.opportunity_id,{...op,queue_id:q.queue_id||op.queue_id})));
      const items=await Promise.all([...merged.values()].map(op=>inspectOpportunity(op,paths)));
      const current=items.filter(x=>['ready','working','returned','waiting','problem'].includes(x.state));
      const counts={working:0,returned:0,waiting:0,problem:0,ready:0};
      current.forEach(x=>counts[x.state]++);

      $('working').textContent=counts.working;
      $('returned').textContent=counts.returned;
      $('waiting').textContent=counts.waiting;
      $('problems').textContent=counts.problem;

      const active=current.filter(x=>x.state==='working').sort((a,b)=>(b.priority||0)-(a.priority||0))[0];
      const free=current.filter(x=>x.state==='ready').sort((a,b)=>(b.priority||0)-(a.priority||0))[0];
      const currentLine=active?`Ahora: ${shortMission(active.mission)}`:free?`Hay capacidad libre: ${shortMission(free.mission)}`:counts.returned?`Hay resultados durables disponibles; la red puede seguir integrando.`:(head.next_dot||focus.current_frontier||'Prometeo está al día.');
      $('sentence').innerHTML=esc(currentLine).replace(/^Ahora:/,'<span class="dim">Ahora:</span>');
      setAction(counts);

      const gen=head.distributed_swarm?.status||head.generated_generation?.generation_id||'flujo actual';
      $('generation').textContent=`${gen} · ${counts.ready} lugares libres`;
      $('frontier').textContent=focus.current_frontier||head.global_frontier||'—';
      renderFlow(current);

      const events=[];
      current.forEach(x=>{
        const ct=timeOf(x.claim); if(ct)events.push(event('start',`${x.opportunity_id} · claim`,ct));
        const rt=timeOf(x.run); if(rt)events.push(event(explicitProblem(x.run)?'problem':'start',`${x.opportunity_id} · started`,rt));
        const tt=timeOf(x.ret); if(tt)events.push(event(explicitProblem(x.ret)?'problem':'return',`${x.opportunity_id} · return`,tt));
      });
      if(head.updated_at)events.push(event('return','continuidad actualizada',head.updated_at));
      renderTrace(events);

      $('sources').innerHTML=[
        ['continuidad','coordination/CONTINUITY_HEAD.json'],
        ['foco','coordination/workstreams/chat-native-control-plane-v1/FOCUS.json'],
        ['swarm','coordination/opportunities/UNIVERSAL_COGNITIVE_SWARM_QUEUE_V1.json'],
        ['gen2','coordination/opportunities/GENERATED_QUEUE_GEN2_V1.json'],
        ['worker','wc']
      ].map(([n,p])=>source(n,p)).join('');
      $('diagnostic').textContent=`Lectura: ${current.length} oportunidades combinadas · ${counts.ready} READY estáticas sin claim · actualización cada 2 minutos · discovery/recovery dinámicos no se inventan como porcentaje.`;
      $('pulse').className='pulse ok';
      $('clock').textContent=`actualizado ${fmt(new Date().toISOString())}`;
    }catch(err){
      console.error(err);
      $('pulse').className='pulse bad';
      $('clock').textContent='sin lectura';
      $('sentence').innerHTML='<span class="errorline">No pude leer el estado durable.</span>';
      $('action').textContent='No se inventa estado cuando falta evidencia. Reintentá en un momento.';
      $('diagnostic').textContent=err.message;
    }
  }

  $('copy').addEventListener('click',async()=>{
    try{await navigator.clipboard.writeText(WC);$('copy').textContent='copiado';setTimeout(()=>$('copy').textContent='copiar worker',1000)}
    catch(_){$('copy').textContent=WC}
  });
  $('detailBtn').addEventListener('click',()=>{
    const open=$('drawer').classList.toggle('open');
    $('detailBtn').textContent=open?'ocultar detalle':'ver detalle';
  });
  load();setInterval(load,120000);
})();
</script>
</body>
</html>
