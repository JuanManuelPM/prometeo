<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Prometeo Live</title>
<link rel="stylesheet" href="./mobile.css?v=3">
<link rel="stylesheet" href="./pages.css?v=2">
</head>
<body>
<div id="drawerShade" class="drawerShade"></div>
<aside id="pageDrawer" class="pageDrawer" aria-label="Páginas">
  <div class="drawerTop">
    <button id="drawerRoot" class="drawerRoot" type="button" aria-label="Volver al menú principal">
      <span class="menuIcon"><i></i><i></i><i></i></span>
    </button>
    <strong id="drawerTitle">Páginas</strong>
    <button id="drawerClose" class="drawerClose" type="button" aria-label="Cerrar">×</button>
  </div>
  <div class="drawerScroll">
    <section id="currentFolderSection" class="drawerSection folderContext" hidden>
      <div class="drawerLabel"><span id="currentFolderLabel">Carpeta</span><span id="currentFolderCount"></span></div>
      <div id="currentFolderPages" class="pageList"></div>
    </section>
    <div id="drawerRootContent">
      <section class="drawerSection">
        <div class="drawerLabel">Activas <span id="activePagesCount">0</span></div>
        <div id="activePages" class="pageList"></div>
      </section>
      <section class="drawerSection">
        <div class="drawerLabel">Guardadas <span id="pagesUnread">sin novedades</span></div>
        <div id="storedPages"></div>
      </section>
    </div>
  </div>
</aside>

<section id="pageViewer" class="pageViewer" aria-label="Visor de página">
  <div class="viewerTop">
    <div class="viewerLine">
      <button id="viewerBack" class="viewerBack" type="button" aria-label="Volver">‹</button>
      <button id="viewerMenu" class="viewerMenu menuButton" type="button" aria-label="Abrir carpeta actual">
        <span class="menuIcon"><i></i><i></i><i></i></span>
      </button>
      <div id="viewerTitle" class="viewerTitle">Página</div>
      <a id="viewerExternal" class="viewerExternal" href="#" target="_blank" rel="noopener" aria-label="Abrir aparte">↗</a>
    </div>
    <div id="viewerNote" class="viewerNote"></div>
  </div>
  <iframe id="pageFrame" class="pageFrame" title="Página Prometeo"></iframe>
</section>

<main class="app">
  <header class="top">
    <div class="topLeft">
      <button id="menuButton" class="menuButton" type="button" aria-label="Abrir páginas">
        <span class="menuIcon"><i></i><i></i><i></i></span><span id="menuBadge" class="menuBadge"></span>
      </button>
      <div class="brand">LIVE</div>
    </div>
    <div class="health"><i id="dot" class="dot"></i><span id="age">leyendo…</span></div>
  </header>

  <nav class="tabs" aria-label="Vistas">
    <button class="selected" data-go="nowView">Ahora</button>
    <button data-go="inboxView">Inbox <span id="inboxCount"></span></button>
    <button data-go="projectsView">Proyectos</button>
    <button data-go="productionView">Producción</button>
  </nav>

  <div class="rail" id="rail">
    <section class="view" id="nowView">
      <div class="statusHero">
        <strong id="headline">Leyendo workers…</strong>
        <span id="statusLine">reemplazo seguro a los 10 min sin señal</span>
      </div>

      <section class="block">
        <div class="sectionHead"><h2>Ahora</h2><span id="activeCount"></span></div>
        <div id="active" class="stack"></div>
      </section>

      <section class="block">
        <div class="sectionHead"><h2>Terminaron</h2><span>hoy</span></div>
        <div id="finished" class="stack"></div>
      </section>

      <section class="block historyBlock">
        <div class="sectionHead"><h2>Días anteriores</h2><span>tocá para abrir</span></div>
        <div id="days" class="days"></div>
        <div id="dayDetail" class="dayDetail"></div>
      </section>
    </section>

    <section class="view" id="inboxView">
      <div class="pageTitle"><h1>Inbox</h1><p>mensajes cortos para vos</p></div>
      <div id="inbox" class="inbox"></div>
    </section>

    <section class="view" id="projectsView">
      <div class="pageTitle"><h1>Proyectos</h1><p>qué sigue vivo</p></div>
      <div id="projects" class="projects"></div>
    </section>

    <section class="view" id="productionView">
      <div class="pageTitle"><h1>Producción</h1><p>ritmo real</p></div>
      <div id="productionStats" class="productionStats"></div>
      <div id="productionDays" class="productionDays"></div>
      <details class="plansFold"><summary>Planes de ejecución</summary><div id="plans" class="plans"></div></details>
    </section>
  </div>
</main>
<script src="./mobile.js?v=3" defer></script>
<script src="./pages.js?v=3" defer></script>
</body>
</html>
