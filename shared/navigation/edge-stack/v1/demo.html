<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prometeo Edge Stack v1</title>
<link rel="stylesheet" href="./edge-stack.css">
<style>
:root{--page:#DED4C6}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--page)}
body{min-height:100dvh;overflow-x:hidden;font-family:Arial,sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 14%,rgba(255,255,255,.33),transparent 34%),radial-gradient(circle at 82% 78%,rgba(76,61,25,.065),transparent 38%),repeating-linear-gradient(0deg,rgba(76,61,25,.017) 0,rgba(76,61,25,.017) 1px,transparent 1px,transparent 4px),repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 1px,transparent 5px);mix-blend-mode:multiply;opacity:.72}
main{position:relative;width:min(1500px,100%);min-height:100dvh;margin:0 auto;padding:clamp(20px,4vw,64px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(24px,4vw,60px);align-items:center}
.mount{width:100%;height:min(72dvh,620px);min-height:430px}
@media(max-width:900px){main{grid-template-columns:1fr;padding:12px}.mount{height:68dvh;min-height:460px}}
</style>
</head>
<body>
<main>
  <div id="left" class="mount"></div>
  <div id="right" class="mount"></div>
</main>
<script src="./edge-stack.js"></script>
<script>
const items=[
  {id:'prometeo',title:'Prometeo',url:'/'},
  {id:'jose',title:'José',url:'/jose/'},
  {id:'design',title:'Diseño',url:'/design/'},
  {id:'adriana',title:'Adriana',url:'#'},
  {id:'tools',title:'Herramientas',url:'#'},
  {id:'archive',title:'Archivo',url:'#'},
  {id:'system',title:'Sistema',url:'#'},
  {id:'memory',title:'Memoria',url:'#'}
];
PrometeoEdgeStack.create(document.querySelector('#left'),{items,side:'left',loop:true});
PrometeoEdgeStack.create(document.querySelector('#right'),{items,side:'right',loop:true});
</script>
<script type="module" src="/prometeo/shared/prometeo-shell/v1/prometeo-shell.js?v=1" data-prometeo-shell></script>
</body>
</html>
