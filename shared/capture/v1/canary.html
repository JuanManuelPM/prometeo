<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Prometeo · Capture Canary</title>
  <style>
    :root{--paper:#f4efe5;--ink:#45141b;--line:rgba(69,20,27,.18)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Century Gothic,Avenir,Montserrat,system-ui,sans-serif}
    body{display:grid;grid-template-rows:42px 1fr}
    .bar{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--paper) 94%,transparent);z-index:20}
    .tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.55}.status{font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
    button{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:12px;padding:6px 10px;cursor:pointer}
    iframe{width:100%;height:100%;border:0;background:var(--paper)}
    .dispatch{position:fixed;inset:auto 12px 12px 12px;z-index:100;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 14px 36px rgba(69,20,27,.16)}
    .dispatch[hidden]{display:none}.dispatch textarea{width:100%;min-height:92px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:transparent;color:inherit;padding:10px;font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
  </style>
</head>
<body>
  <div class="bar">
    <span class="tag">P4 canary</span>
    <span class="status" id="p4Status">cargando…</span>
    <button id="p4Diag" type="button">diag</button>
  </div>
  <iframe id="prometeoFrame" src="/prometeo/navigator/" title="Prometeo Navigator"></iframe>
  <section class="dispatch" id="p4Dispatch" hidden>
    <textarea id="p4DispatchText" readonly></textarea>
    <div class="actions">
      <button id="p4CloseDispatch" type="button">Cerrar</button>
      <button id="p4Copy" type="button">Copiar</button>
      <button id="p4Chat" type="button">Abrir ChatGPT</button>
    </div>
  </section>
  <script type="module" src="./shared/capture/v1/canary-app.js"></script>
</body>
</html>
