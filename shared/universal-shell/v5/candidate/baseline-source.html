<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Prometeo · Universal Shell V5 Integrated Control · Corner Anchor</title>
<style>
:root{--surface:#ffffff;--face:#151A20;--text:#151A20;--on:#ffffff;--safeT:env(safe-area-inset-top,0px);--safeR:env(safe-area-inset-right,0px);--safeB:env(safe-area-inset-bottom,0px);--safeL:env(safe-area-inset-left,0px)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--surface);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background 180ms ease,color 180ms ease}
button{font:inherit;color:inherit}
.stage{position:fixed;inset:0;z-index:20;width:100vw;height:100dvh;overflow:hidden;touch-action:none;background:transparent;pointer-events:none}
.selector{--cx:calc(100vw - 58px);--cy:calc(100dvh - 62px - var(--safeB));position:absolute;inset:0;user-select:none;-webkit-user-select:none;pointer-events:none}
.selector:not(.closed){pointer-events:auto}
.selector .puck,.selector .current,.selector .edge-btn{pointer-events:auto}
.stage{pointer-events:none}.stage .puck{pointer-events:auto}
.orbit{position:absolute;left:var(--cx);top:var(--cy);width:0;height:0;pointer-events:none}
.selector.closed .rail,
.selector.closed .edge-btn,
.selector.closed .current,
.selector.closed .label-ring,
.selector.closed .tail-dot,
.selector.closed .meta{
  opacity:0;
  pointer-events:none;
}
.selector.closed .rail,
.selector.closed .label-ring{
  transition:opacity 160ms ease;
}
.selector.closed .edge-btn,
.selector.closed .current,
.selector.closed .tail-dot,
.selector.closed .meta{
  transition:opacity 130ms ease;
}
.selector.closed .neutral{opacity:0 !important}
.selector.closed .close-hint{opacity:0 !important;transform:translate(-50%,-50%) scale(.72) !important}
.rail{position:absolute;left:-132px;top:-132px;width:264px;height:264px;overflow:visible;pointer-events:none;z-index:1}
.rail-shadow,.rail-bed,.rail-line,.rail-edge{fill:none;stroke-linecap:round}
.rail-shadow{stroke:rgba(0,0,0,.15);stroke-width:15;transform:translateY(1px)}
.rail-bed{stroke:color-mix(in srgb,var(--surface) 88%,var(--text) 12%);stroke-width:11}
.rail-edge{stroke:rgba(255,255,255,.04);stroke-width:1.2;transform:translateY(-1px)}
.rail-line{stroke:color-mix(in srgb,var(--text) 35%,transparent);stroke-width:1.1}
.selector.moving .rail-line{stroke:color-mix(in srgb,var(--text) 46%,transparent)}
.selector.armed-enter .rail-line,.selector.armed-back .rail-line{stroke:color-mix(in srgb,var(--text) 54%,transparent)}

.tail-dot{--x:0px;--y:0px;--s:.6;position:absolute;left:0;top:0;width:10px;height:10px;border-radius:50%;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(var(--s));background:var(--face);opacity:1;box-shadow:0 2px 4px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.03);transition:background 180ms ease,box-shadow 100ms ease,opacity 120ms ease;will-change:transform;z-index:4}
.tail-dot.hidden{display:none}

.current{
  --x:0px;--y:0px;--energy:0;
  position:absolute;left:0;top:0;
  width:46px;height:46px;border:0;border-radius:50%;
  transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y)));
  background:transparent;color:var(--on);
  display:grid;place-items:center;pointer-events:auto;cursor:pointer;z-index:8;
  padding:0;will-change:transform;
}

/* Keep a soft receiving socket on the rail, but the selected mark itself is
   a single circle, not a circle-inside-a-circle. */
.current-socket{
  position:absolute;left:50%;top:50%;
  width:31px;height:31px;border-radius:50%;
  transform:translate(-50%,-50%);
  background:color-mix(in srgb,var(--surface) 95%,var(--text) 5%);
  box-shadow:
    inset 0 4px 8px rgba(0,0,0,.10),
    inset 0 0 0 1px color-mix(in srgb,var(--text) 6%,transparent);
  transition:background 180ms ease,box-shadow 100ms ease;
  overflow:visible;pointer-events:none;
}

.current-core{
  position:absolute;left:50%;top:50%;
  width:18px;height:18px;border-radius:50%;
  transform:translate(-50%,-50%) scale(calc(1 - var(--energy) * .02));
  background:var(--face);
  color:var(--on);
  display:flex;align-items:center;justify-content:center;
  box-shadow:
    0 3px 5px rgba(0,0,0,.14),
    inset 0 1px 0 rgba(255,255,255,.05),
    inset 0 -1px 0 rgba(0,0,0,.10);
  transition:background 180ms ease,color 180ms ease,box-shadow 90ms ease;
  will-change:transform,opacity;
}
.current:active .current-socket,
.current.commit .current-socket{
  box-shadow:
    inset 0 6px 10px rgba(0,0,0,.14),
    inset 0 0 0 1px color-mix(in srgb,var(--text) 8%,transparent);
}
.current:active .current-core,
.current.commit .current-core{
  transform:translate(-50%,-50%) scale(.92);
  box-shadow:
    0 1px 2px rgba(0,0,0,.08),
    inset 0 4px 6px rgba(0,0,0,.12),
    inset 0 1px 0 rgba(255,255,255,.02);
}

.relay-core{
  position:absolute;left:50%;top:50%;
  width:18px;height:18px;border-radius:50%;
  transform:translate(-50%,-50%) scale(.22);
  background:var(--face);
  opacity:0;
  box-shadow:
    0 3px 5px rgba(0,0,0,.13),
    inset 0 1px 0 rgba(255,255,255,.04);
  pointer-events:none;
  will-change:transform,opacity;
}
.current-socket.relaying .current-core{opacity:.10}
.current-socket.relaying .relay-core{opacity:1}

/* Semantic marks remain tiny and inside the core. */
.payload{
  position:absolute;left:50%;top:50%;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:2;color:var(--on);
  transform:translate(-50%,-50%);
}

.payload.folder{
  width:9.6px;height:7.2px;
  display:flex;align-items:center;justify-content:center;
}
.payload.folder .folder-mark{
  display:block;
  width:9.6px;height:7.2px;
  overflow:visible;
}
.payload.folder .folder-mark path{
  fill:var(--on);
  opacity:.86;
}

.payload.index{
  position:absolute;left:50%;top:50%;
  width:auto;min-width:0;
  text-align:center;
  font-size:8.2px;
  line-height:1;
  font-weight:900;
  letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
  transform:translate(-50%,-50%) scale(var(--payload-scale,1));
  transform-origin:center center;
  opacity:.92;
}

.label-ring{
  --label-dim:0;
  position:absolute;left:-132px;top:-132px;width:264px;height:264px;
  overflow:visible;pointer-events:none;z-index:6;
}
.label-band-shadow,.label-band{display:none}
.label-guide{
  fill:none;
  stroke:color-mix(in srgb,var(--text) 24%, transparent);
  stroke-width:1.05;
  stroke-linecap:round;
  opacity:calc(.76 - var(--label-dim) * .14);
  transition:stroke 180ms ease, opacity 120ms ease;
}
.label-title{
  font-size:12.6px;
  font-weight:900;
  letter-spacing:-.03em;
  fill:var(--text);
  opacity:calc(1 - var(--label-dim) * .18);
  transition:fill 180ms ease, opacity 120ms ease;
}
.label-count{
  font-size:7px;
  font-weight:820;
  letter-spacing:.08em;
  fill:color-mix(in srgb,var(--text) 52%,transparent);
  opacity:calc(.90 - var(--label-dim) * .30);
  transition:fill 180ms ease, opacity 120ms ease;
  font-variant-numeric:tabular-nums;
}
@media(max-width:420px){
  .label-title{font-size:11.5px}
  .label-count{font-size:6.1px}
}

.edge-btn{--x:0px;--y:0px;--angle:0deg;position:absolute;left:0;top:0;width:42px;height:42px;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y)));border:0;background:transparent;padding:0;pointer-events:auto;cursor:pointer;z-index:10}
.edge-face{position:absolute;left:50%;top:50%;width:22px;height:22px;border-radius:50%;transform:translate(-50%,-50%) rotate(var(--angle));background:var(--face);box-shadow:0 3px 6px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.05),inset 0 -1px 0 rgba(0,0,0,.10);transition:transform 95ms ease,box-shadow 95ms ease,background 180ms ease}
.edge-btn:active .edge-face{transform:translate(-50%,-50%) rotate(var(--angle)) scale(.88);box-shadow:0 2px 4px rgba(0,0,0,.10),inset 0 5px 8px rgba(0,0,0,.18)}
.edge-face svg{position:absolute;left:50%;top:50%;width:8px;height:8px;transform:translate(-50%,-50%);fill:none;stroke:var(--on);stroke-width:2.05;stroke-linecap:round;stroke-linejoin:round;transition:stroke 180ms ease}
.edge-btn.disabled .edge-face{background:color-mix(in srgb,var(--surface) 94%,var(--text) 6%);box-shadow:inset 0 3px 6px rgba(0,0,0,.09),inset 0 0 0 1px color-mix(in srgb,var(--text) 9%,transparent),inset 0 1px 0 rgba(255,255,255,.03)}
.edge-btn.disabled .edge-face svg{stroke:color-mix(in srgb,var(--text) 50%,transparent)}

.puck{position:absolute;left:0;top:0;width:64px;height:64px;touch-action:none;border:0;border-radius:50%;transform:translate(-50%,-50%);background:var(--face);color:var(--on);pointer-events:auto;cursor:pointer;z-index:12;box-shadow:0 10px 17px rgba(0,0,0,.22),0 3px 6px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.055),inset 0 -1px 0 rgba(0,0,0,.14);transition:background 180ms ease,color 180ms ease,box-shadow 100ms ease}
.puck:active{box-shadow:0 4px 7px rgba(0,0,0,.13),inset 0 7px 11px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.025)}
.dimple{position:absolute;left:50%;top:50%;width:23px;height:23px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:inset 0 7px 10px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.025);overflow:hidden}
.intent-arrow{position:absolute;left:50%;top:50%;width:12px;height:12px;transform:var(--corner-icon-transform,translate(-50%,-50%)) scale(.55);opacity:0;fill:none;stroke:var(--on);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:opacity 90ms ease,transform 130ms cubic-bezier(.18,.82,.22,1)}
.close-hint{position:absolute;left:50%;top:50%;width:10px;height:10px;transform:translate(-50%,-50%) scale(.72);opacity:0;fill:none;stroke:var(--on);stroke-width:1.8;stroke-linecap:round;transition:opacity 110ms ease,transform 130ms cubic-bezier(.18,.82,.22,1)}
@media (hover:hover){
  .puck:hover .close-hint,.puck:focus-visible .close-hint{opacity:.78;transform:translate(-50%,-50%) scale(1)}
  .puck:hover .dimple,.puck:focus-visible .dimple{box-shadow:inset 0 9px 13px rgba(0,0,0,.52),inset 0 1px 0 rgba(255,255,255,.02)}
}
.selector.armed-enter .close-hint,.selector.armed-back .close-hint{opacity:0}
.selector.armed-enter .intent-arrow.enter,.selector.armed-back .intent-arrow.back{opacity:.92;transform:var(--corner-icon-transform,translate(-50%,-50%)) scale(1)}
.selector.armed-enter .dimple,.selector.armed-back .dimple{box-shadow:inset 0 9px 13px rgba(0,0,0,.53),inset 0 1px 0 rgba(255,255,255,.02)}

.neutral{--nx:0px;--ny:0px;--pressure:0;position:absolute;width:48px;height:48px;border-radius:50%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;z-index:30;border:1px solid color-mix(in srgb,var(--text) 13%,transparent);background:color-mix(in srgb,var(--surface) 91%,transparent);box-shadow:inset 0 0 0 8px color-mix(in srgb,var(--text) 2.8%,transparent),0 2px 7px rgba(0,0,0,.03)}
.neutral.on{opacity:.42}
.neutral::before{content:"";position:absolute;left:50%;top:50%;width:27px;height:27px;border-radius:50%;transform:translate(-50%,-50%) scale(calc(.90 + var(--pressure) * .08));border:1px solid color-mix(in srgb,var(--text) 10%,transparent);opacity:calc(.32 + var(--pressure) * .35)}
.neutral::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;transform:translate(calc(-50% + var(--nx)),calc(-50% + var(--ny)));background:var(--face);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.meta{position:absolute;left:18px;bottom:calc(16px + var(--safeB));font-size:7px;font-weight:780;letter-spacing:.05em;opacity:.26;pointer-events:none}
@media(max-width:420px){.name{width:min(48vw,168px);font-size:12px}.puck{width:60px;height:60px}}

/* Corner Anchor v1: closed puck drags freely, release snaps exactly once. */
.selector.corner-dragging .puck{cursor:grabbing;box-shadow:0 13px 22px rgba(0,0,0,.24),0 4px 8px rgba(0,0,0,.11),inset 0 1px 0 rgba(255,255,255,.055),inset 0 -1px 0 rgba(0,0,0,.14)}
.selector.corner-snapping .puck{pointer-events:none}
.safe-probe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

#pageHost{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;z-index:1;display:block}
#blankLayer{position:fixed;inset:0;background:#fff;z-index:0}


/* V5 · capabilities are states of the same control.
   Large text is the only thing allowed to claim a full-page surface. */
.native-surface{
  position:fixed;inset:0;z-index:2;display:none;
  background:#fff;color:#151A20;overflow:auto;
  -webkit-overflow-scrolling:touch;
}
.native-surface.show{display:block}
.native-wrap{
  width:min(760px,100%);
  min-height:100dvh;
  margin:0 auto;
  padding:max(7dvh,42px) clamp(22px,7vw,76px) 130px;
}
.native-kicker{
  min-height:12px;
  font:700 9px/1.2 "Century Gothic","Avenir Next",Avenir,system-ui,sans-serif;
  letter-spacing:.12em;text-transform:uppercase;opacity:.33;
  margin-bottom:20px;
}
.native-meta{
  min-height:14px;
  font:600 10px/1.35 "Century Gothic","Avenir Next",Avenir,system-ui,sans-serif;
  letter-spacing:.02em;opacity:.38;margin-bottom:17px;
}
.native-editor{
  display:none;width:100%;min-height:58dvh;resize:none;
  border:0;outline:0;background:transparent;color:#151A20;
  padding:0;margin:0;
  font:500 clamp(16px,2.2vw,20px)/1.62 "Century Gothic","Avenir Next",Avenir,system-ui,sans-serif;
  caret-color:#151A20;
}
.native-editor.show{display:block}
.native-editor[readonly]{cursor:default}
.native-empty{
  display:none;min-height:54dvh;place-items:center;text-align:center;
  font:600 12px/1.55 "Century Gothic","Avenir Next",Avenir,system-ui,sans-serif;
  opacity:.30;
}
.native-empty.show{display:grid}
.native-context{
  display:none;white-space:pre-wrap;overflow-wrap:anywhere;
  font:500 12px/1.62 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:#151A20;opacity:.88;margin:0;
}
.native-context.show{display:block}
.native-code{
  display:none;width:100%;border:0;border-bottom:1px solid rgba(21,26,32,.16);
  outline:0;background:transparent;color:#151A20;padding:10px 0 12px;
  font:500 12px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
.native-code.show{display:block}
.native-status{
  min-height:16px;margin-top:20px;
  font:700 9px/1.35 "Century Gothic","Avenir Next",Avenir,system-ui,sans-serif;
  letter-spacing:.06em;text-transform:uppercase;opacity:.30;
}
.toast{
  position:fixed;left:50%;bottom:24px;z-index:70;
  transform:translate(-50%,14px);opacity:0;pointer-events:none;
  background:#151A20;color:#fff;border-radius:999px;padding:8px 12px;
  font:700 10px/1 system-ui;transition:.16s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.payload.action-icon{width:11px;height:11px}
.payload.action-icon svg{
  width:11px;height:11px;fill:none;stroke:var(--on);
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round
}

/* Recording is not a second widget. It changes the physical state of the puck. */
.puck.recording{
  box-shadow:
    inset 0 5px 11px rgba(0,0,0,.23),
    0 6px 13px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.035);
}
.puck.recording .dimple{
  box-shadow:
    inset 0 8px 14px rgba(0,0,0,.58),
    inset 0 1px 0 rgba(255,255,255,.018);
}
.puck.recording .dimple::after{
  content:"";position:absolute;left:50%;top:50%;
  width:5px;height:5px;border-radius:50%;
  transform:translate(-50%,-50%);
  background:var(--on);opacity:.86;
  animation:recordBreath 1.1s ease-in-out infinite;
}
.puck.recording.paused .dimple::after{animation:none;opacity:.30}
@keyframes recordBreath{
  0%,100%{transform:translate(-50%,-50%) scale(.62);opacity:.34}
  50%{transform:translate(-50%,-50%) scale(1);opacity:.92}
}

/* When deletion is armed, depth—not a warning modal—communicates resistance. */
.selector.delete-armed .current-core{
  box-shadow:
    inset 0 5px 9px rgba(0,0,0,.48),
    inset 0 1px 0 rgba(255,255,255,.018),
    0 1px 2px rgba(0,0,0,.06);
}
.selector.delete-armed .puck{
  box-shadow:
    inset 0 6px 12px rgba(0,0,0,.32),
    0 4px 10px rgba(0,0,0,.13),
    inset 0 1px 0 rgba(255,255,255,.025);
}
/* Favorites are a persistent property of pages, not a second navigation system.
   The fullscreen organizer is deliberately flat: rows, not cards. */
.favorites-organizer{display:none;width:100%;padding:0 0 5dvh}
.favorites-organizer.show{display:block}
.fav-section{margin:0 0 30px}
.fav-section-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:0 0 8px;border-bottom:1px solid rgba(21,26,32,.10);
  font:700 9px/1.2 "Century Gothic","Avenir Next",Avenir,system-ui,sans-serif;
  letter-spacing:.11em;text-transform:uppercase;opacity:.38
}
.fav-section-count{font-variant-numeric:tabular-nums;opacity:.72}
.fav-list{width:100%}
.fav-row{
  min-height:54px;display:grid;grid-template-columns:24px minmax(0,1fr) 40px;
  align-items:center;gap:8px;border-bottom:1px solid rgba(21,26,32,.075);
  background:#fff;position:relative;touch-action:pan-y
}
.fav-row.all{grid-template-columns:minmax(0,1fr) 40px}
.fav-row.dragging{z-index:4;box-shadow:0 8px 20px rgba(0,0,0,.12);touch-action:none}
.fav-handle,.fav-open,.fav-pin{border:0;background:transparent;color:#151A20;margin:0}
.fav-handle{
  width:24px;height:42px;padding:0;cursor:grab;touch-action:none;position:relative;opacity:.24
}
.fav-handle:active{cursor:grabbing}
.fav-handle::before,.fav-handle::after{
  content:"";position:absolute;left:7px;right:7px;height:1px;background:currentColor;
  box-shadow:0 4px 0 currentColor
}
.fav-handle::before{top:15px}.fav-handle::after{display:none}
.fav-open{
  min-width:0;padding:10px 0;text-align:left;cursor:pointer;
  font:600 13px/1.25 "Century Gothic","Avenir Next",Avenir,system-ui,sans-serif
}
.fav-title{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav-path{
  display:block;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font:600 8px/1.2 "Century Gothic","Avenir Next",Avenir,system-ui,sans-serif;
  letter-spacing:.035em;opacity:.30
}
.fav-pin{
  width:40px;height:44px;padding:0;display:grid;place-items:center;cursor:pointer;opacity:.24
}
.fav-pin svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fav-pin.is-pinned{opacity:.88}
.fav-pin.is-pinned svg{fill:currentColor;stroke:currentColor}
.fav-empty{
  min-height:70px;display:grid;place-items:center;text-align:center;
  font:600 10px/1.4 "Century Gothic","Avenir Next",Avenir,system-ui,sans-serif;opacity:.28
}
@media(max-width:620px){
  .native-wrap{padding:max(6dvh,34px) 22px 118px}
  .native-editor{font-size:16px;line-height:1.6}
  .fav-row{min-height:58px}
  .fav-open{font-size:13px}
}

</style>
</head>
<body>

<div id="blankLayer" aria-hidden="true"></div>
<div class="safe-probe" id="safeProbe" aria-hidden="true"></div>
<iframe id="pageHost" title="Página de Prometeo" src="about:blank"></iframe>

<section class="native-surface" id="nativeSurface" aria-live="polite">
  <div class="native-wrap">
    <div class="native-kicker" id="nativeKicker"></div>
    <div class="native-meta" id="nativeMeta"></div>
    <textarea class="native-editor" id="nativeEditor" spellcheck="true"></textarea>
    <div class="native-empty" id="nativeEmpty"></div>
    <pre class="native-context" id="nativeContext"></pre>
    <div class="favorites-organizer" id="favoritesOrganizer"></div>
    <input class="native-code" id="nativeCode" autocomplete="off" spellcheck="false">
    <div class="native-status" id="nativeStatus"></div>
  </div>
</section>

<div class="toast" id="toast"></div>

<div class="stage" id="stage">
  <div class="selector" id="selector">
    <div class="orbit" id="orbit">
      <svg class="rail" viewBox="0 0 264 264" aria-hidden="true">
        <path class="rail-shadow" d="M 18.53 107.88 A 116 116 0 0 1 107.88 18.53"></path>
        <path class="rail-bed" d="M 18.53 107.88 A 116 116 0 0 1 107.88 18.53"></path>
        <path class="rail-edge" d="M 18.53 107.88 A 116 116 0 0 1 107.88 18.53"></path>
        <path class="rail-line" d="M 18.53 107.88 A 116 116 0 0 1 107.88 18.53"></path>
      </svg>
      <button class="edge-btn prev" id="prevBtn" aria-label="Opción anterior"><span class="edge-face"><svg viewBox="0 0 16 16"><path d="M5.5 3.5 10 8l-4.5 4.5"/></svg></span></button>
      <button class="edge-btn next" id="nextBtn" aria-label="Opción siguiente"><span class="edge-face"><svg viewBox="0 0 16 16"><path d="M5.5 3.5 10 8l-4.5 4.5"/></svg></span></button>

function endDrag(e,cancel=false){

function frame(){
  const fe=visual.targetFlow-visual.flow;

     a clean mechanical glide after each page-step impulse. */
  const gain=Math.abs(fe)>.42?.22:.27;
  const maxStep=Math.abs(fe)>.58?.072:.050;
  visual.flow+=clamp(fe*gain,-maxStep,maxStep);

  visual.energy+=(visual.targetEnergy-visual.energy)*.20;
  visual.rot+=(visual.targetRot-visual.rot)*.20;

function normalizePageNode(node,pages){
  if(!node)return null;

    return {id:node.id||p.id,label:p.title||p.id,type:'leaf',kind:'file',page:p,icon:'page'};
  }

  const self={id:node.id,label:node.label||node.id||'Carpeta',type:'hierarchy',kind:'folder',children:raw};
  /* Display compiler only: collapse structural 1/1 wrappers.

function flattenCatalog(node,path=[],out=[]){

  const pdata=await pr.json(),tree=await tr.json();

  const sec=Math.max(0,Math.round((Date.now()-ms)/1000));if(sec<60)return'ahora';
  const min=Math.round(sec/60);if(min<60)return`${min}m`;
  const hr=Math.round(min/60);return hr<24?`${hr}h`:`${Math.round(hr/24)}d`;
}
function statusLabelCompact(note){
  if(note.status==='done')return'nueva';
  if(note.status==='error')return'error';
  return'procesando';
}
function statusLabel(note){
  if(note.status==='preparing')return'Guardando audio…';
  if(note.status==='queued')return'En cola…';
  if(note.status==='loading')return'Preparando Whisper…';
  if(note.status==='transcribing')return'Transcribiendo…';
  if(note.status==='error')return note.error||'Error';
  return note.status==='done'?'Lista':'Procesando…';
}
async function copyText(text){
  try{await navigator.clipboard.writeText(text)}
  catch{
    const ta=document.createElement('textarea');ta.value=text;
    document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();
  }
}
function showToast(text){
  toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove('show'),1400);
}

nativeCode.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();nativeCode.blur();openSelector();render();
  }
  if(e.key==='Escape'){
    e.preventDefault();nativeCode.blur();openSelector();render();
  }
});

await voice.init();
await refreshNotes();
remote.init().then(()=>scheduleSync(80)).catch(()=>{});
ensureCatalog().catch(()=>{});
const hashId=decodeURIComponent((location.hash.match(/^#\/p\/(.+)$/)||[])[1]||'');
if(hashId){
  ensureCatalog().then(()=>{const p=pageRegistry.get(hashId);if(p)loadPage(p,false)}).catch(()=>{});
}

applyControlCorner(controlCorner);
const realignCorner=()=>{if(!closedPuckDrag?.dragging)applyControlCorner(controlCorner)};
window.addEventListener('resize',realignCorner,{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(realignCorner,60),{passive:true});
window.visualViewport?.addEventListener('resize',realignCorner,{passive:true});
window.visualViewport?.addEventListener('scroll',realignCorner,{passive:true});
render();closeSelector(true);requestAnimationFrame(frame);
})();
</script>
