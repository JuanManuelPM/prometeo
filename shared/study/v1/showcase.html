<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prometeo Study Commons v1 · Showcase</title><link rel="stylesheet" href="components.css"><style>
body{margin:0;background:var(--ps-bg);color:var(--ps-ink);font-family:var(--ps-font);padding:28px}.wrap{max-width:1100px;margin:auto}.k{font:800 10px/1 var(--ps-font);letter-spacing:.12em;text-transform:uppercase;color:var(--ps-muted);margin:30px 0 12px}.states{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:12px}.card{position:relative;height:280px;border-radius:28px;overflow:hidden;padding:18px;background:var(--tone);color:#4e5659}.card .n{font:800 22px/1 var(--ps-font-narrow)}.card .t{position:absolute;left:50%;bottom:126px;transform:translateX(-50%);writing-mode:vertical-rl;rotate:180deg;white-space:nowrap;font:800 12px/1 var(--ps-font-narrow);letter-spacing:.1em}.card .subject-state{left:0;right:0;bottom:40px;height:62px;display:grid;place-items:center;font-size:30px}.card .subject-state.locked .ps-lock svg{width:34px;height:34px}.row{border-top:1px solid var(--ps-line);padding:18px 0}.maths{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.sample{padding:18px;border:1px solid var(--ps-line);border-radius:18px}.hint{max-width:560px}.status{font:700 12px/1.4 var(--ps-font);color:var(--ps-muted)}@media(max-width:680px){body{padding:16px}.states{grid-template-columns:repeat(2,1fr)}.maths{grid-template-columns:1fr}}
</style><script src="components.js"></script></head><body><main class="wrap"><h1 class="ps-display" style="font-size:clamp(38px,7vw,74px);margin:0">STUDY COMMONS</h1><div class="status">v1 · living visual contract · no student data</div><div class="k">Subject state extremes</div><div class="states" id="states"></div><div class="k">Resource + disclosure</div><div class="row" id="resource"></div><div class="row ps-disclosure" tabindex="0" aria-expanded="false" style="display:flex;align-items:center;gap:12px"><span class="ps-chevron" id="chev"></span><strong class="ps-row-title">Disclosure universal</strong></div><div class="k">Printed math + inline answers</div><div class="maths" id="maths"></div><div class="k">Hint steps</div><div class="sample hint" id="hint"></div></main><script>
const P=window.PrometeoStudy;
const samples=[{n:'02',t:'FISICOQUÍMICA',tone:'#cbdce2',s:{kind:'locked'}},{n:'03',t:'BIOLOGÍA',tone:'#d5d7c8',s:{kind:'new',label:'NEW'}},{n:'04',t:'LENGUA',tone:'#ded6c8',s:{kind:'progress',label:'99%'}},{n:'05',t:'HISTORIA',tone:'#d7d4df',s:{kind:'done',label:'DONE'}}];
document.getElementById('states').innerHTML=samples.map(x=>`<section class="card" style="--tone:${x.tone}"><div class="n">${x.n}</div><div class="t">${x.t}</div>${P.subjectState(x.s)}</section>`).join('');
document.getElementById('resource').innerHTML=P.resourceLink({href:'#',label:'Buscar videos'});document.getElementById('chev').innerHTML=P.icons.chev;
document.getElementById('maths').innerHTML=`<div class="sample">${P.formula({type:'system',lines:['2x + y = 11','x − y = 1']})}</div><div class="sample">${P.renderMath({fields:[{label:'x'},{label:'y'}],math:{type:'template',html:'x={{0}} &nbsp;&nbsp; y={{1}}'}},{response:['','']})}</div>`;
document.getElementById('hint').innerHTML=P.hintSteps({steps:[{expression:'4x − 3 = x + 9',note:'Ejemplo parecido'},{expression:'3x = 12',note:'Juntamos términos semejantes'},{expression:'x = 4',note:'Solución'}]},{renderFormula:x=>x});
const row=document.querySelector('.ps-disclosure');row.addEventListener('click',()=>row.setAttribute('aria-expanded',row.getAttribute('aria-expanded')!=='true'));
</script><script type="module" src="/prometeo/shared/prometeo-shell/v1/prometeo-shell.js?v=1" data-prometeo-shell></script>
</body></html>
