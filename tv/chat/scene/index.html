<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prometeo · Escena pública</title><meta name="robots" content="noindex">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0c0c0c;color:#f4f2ed}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;width:100%;background:#0c0c0c}
main{min-height:100vh;padding:clamp(25px,5vw,85px);display:flex;flex-direction:column;gap:clamp(12px,3vh,32px)}
header{color:#aaa69f;font-size:clamp(12px,1.4vw,19px);font-weight:700;letter-spacing:.13em}
h1{font-size:clamp(34px,5.5vw,94px);max-width:20ch;line-height:1.02;letter-spacing:-.065em;margin:0;font-weight:760}
#subtitle{font-size:clamp(16px,1.7vw,27px);color:#b6b2aa;line-height:1.3;max-width:55ch;margin:0}
#items{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(310px,100%),1fr));gap:clamp(20px,2.5vw,45px);max-width:95vw;margin-top:2vh}
article{border-top:2px solid #77736d;padding-top:14px}h2{font-size:clamp(22px,2.1vw,34px);margin:0 0 11px;font-weight:650}p{font-size:clamp(16px,1.5vw,25px);line-height:1.4;white-space:pre-wrap;color:#d5d0c7;margin:0}
#state{color:#8c8981;font-size:12px;margin-top:auto;padding-top:24px}
</style></head><body><main><header id="eyebrow">PROMETEO · ESCENA</header><h1 id="title">Cargando escena…</h1><p id="subtitle"></p><section id="items"></section><div id="state"></div></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
let prev=null,loading=false;
async function update(){
if(document.hidden||loading)return;loading=true;
try{
 const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),8000);let resp;
 try{resp=await fetch('scene.json?v='+Date.now(),{signal:ctl.signal,cache:'no-store'})}finally{clearTimeout(timer)}
 if(!resp.ok)throw Error('SCENE_HTTP_'+resp.status);
 const s=await resp.json();
 if(s.schema!=='prometeo.tv-public-scene/v1'||!Number.isSafeInteger(s.revision)||!Array.isArray(s.items)||s.items.length>8)throw Error('SCENE_SCHEMA_INVALID');
 if(prev===s.revision)return;
 $('eyebrow').textContent=String(s.label||'PROMETEO · ESCENA').slice(0,100);
 $('title').textContent=String(s.title||'Escena pública').slice(0,150);
 $('subtitle').textContent=String(s.subtitle||'').slice(0,350);
 $('items').replaceChildren();
 for(const d of s.items){const a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p');
  h.textContent=String(d.title||'').slice(0,100);p.textContent=String(d.text||'').slice(0,900);a.append(h,p);$('items').append(a)}
 $('state').textContent='Material público · revisión '+s.revision;
 prev=s.revision;
}catch(e){$('state').textContent='Sin actualización de escena · '+String(e.message||e).slice(0,120)}
finally{loading=false}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)update()});
update();setInterval(update,15000);
})();
</script></body></html>
