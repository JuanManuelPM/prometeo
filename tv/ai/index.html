<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>IA · TV</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#f2eee6;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#050505}
#bar{position:absolute;z-index:5;left:8px;top:8px;display:flex;gap:7px;align-items:center;max-width:calc(100% - 16px);pointer-events:none}
#dot{width:7px;height:7px;border-radius:50%;background:#89ff62;box-shadow:0 0 8px #89ff6290;flex:0 0 auto}
#label{font:1000 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;background:#050505cc;padding:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#note{color:#8f887f;font-weight:800}
body.compact #bar{left:5px;top:5px}body.compact #label{font-size:6px;padding:4px 5px}body.compact #note{display:none}
#error{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:#777169;font:900 9px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</head>
<body>
<iframe id="frame" allow="autoplay; fullscreen; picture-in-picture"></iframe>
<div id="bar"><i id="dot"></i><span id="label">IA · <span id="title">CARGANDO</span> <span id="note"></span></span></div>
<div id="error">IA · SIN SUPERFICIE</div>
<script>
(()=>{
'use strict';
const BASE='https://catnohyouxqjjtseaueb.supabase.co/rest/v1/';
const KEY='sb_publishable_eqh3PngXs4UjLLWiY3pz1w_nhHtf7X-';
const HEAD={apikey:KEY,Authorization:'Bearer '+KEY};
const frame=document.getElementById('frame'),title=document.getElementById('title'),note=document.getElementById('note'),err=document.getElementById('error');
let current='',lastSig='';
async function pull(){
 try{
  const r=await fetch(BASE+'tv_ai_widget_state?select=title,current_url,mode,note,updated_at&singleton=eq.true',{headers:HEAD,cache:'no-store'});
  if(!r.ok)throw Error(r.status);
  const d=(await r.json())[0];if(!d||!d.current_url)throw Error('EMPTY');
  const sig=[d.current_url,d.title,d.note,d.updated_at].join('|');
  title.textContent=String(d.title||'IA').toUpperCase();
  note.textContent=d.note?'· '+d.note:'';
  if(d.current_url!==current){current=d.current_url;frame.src=current;err.style.display='none'}
  lastSig=sig;
 }catch(e){if(!current)err.style.display='grid'}
}
window.addEventListener('message',e=>{
 const d=e.data||{};
 if(d.type==='prometeo:layout'){
  document.body.classList.toggle('compact',d.profile==='compact'||Number(d.width||0)<520);
 }
 if(d.type==='prometeo:control'&&d.action==='refresh'&&current){frame.src=current+(current.includes('?')?'&':'?')+'tvrefresh='+Date.now()}
});
pull();setInterval(pull,2500);
})();
</script>
</body>
</html>
