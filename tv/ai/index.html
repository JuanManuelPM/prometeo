<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>PROMETEO · GRID TV</title>
<style>
:root{--bg:#050505;--fg:#f2eee6;--muted:#746e66;--line:#2b2722;--hot:#ff6a00;--live:#89ff62;--dead:#ff5148;--action:#f0c84a}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:grid;place-items:start center}
#tv{position:relative;width:min(100vw,177.777vh);height:min(56.25vw,100vh);overflow:hidden;background:var(--bg);container-type:size}
#fallen{position:absolute;z-index:60;left:0;right:0;top:0;height:18cqh;border-bottom:1px solid var(--line);display:grid;grid-template-columns:13cqw 24cqw 1fr 25cqw;gap:1.4cqw;align-items:center;padding:1.4cqh 2cqw;background:#050505}
#fallenAvatar{width:10cqw;height:13cqh;position:relative;justify-self:center;transform:rotate(-2deg)}
#fallenAvatar .botSprite{transform:scale(1.25);transform-origin:center}
#fallenMeta{min-width:0}
#fallenCode{font:1000 2.15cqw/.95 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fallenMeta small{display:block;margin-top:.8cqh;color:var(--muted);font:900 1.05cqw/1.25 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}
#fallenMeta .death{color:var(--dead)}
#life{min-width:0}
#lifeTop{display:none;justify-content:space-between;gap:1cqw;margin-bottom:.8cqh;color:var(--muted);font:900 .68cqw/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.07em}
#timeline{height:3.2cqh;background:#100e0c;border:0;display:flex;overflow:hidden;clip-path:polygon(0 18%,100% 0,100% 82%,0 100%)}
.seg{height:100%;min-width:1px}.seg.work{background:var(--live)}.seg.wait{background:var(--dead)}.seg.action{background:var(--action)}.seg.unknown{background:#38332d}
#legend{display:none;gap:.8cqw;margin-top:.65cqh;color:var(--muted);font:900 .59cqw/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
#legend i{width:.55cqw;height:.55cqw;display:inline-block;margin-right:.25cqw;vertical-align:-.04cqw}.lgWork{background:var(--live)}.lgWait{background:var(--dead)}.lgAction{background:var(--action)}
#globalStats{display:grid;grid-template-columns:1fr 1fr;gap:.7cqw}
.stat{border:0;border-top:.22cqh solid currentColor;padding:1.05cqh .8cqw;background:#090807;font:1000 2.15cqw/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center}
.stat small{display:block;margin-top:.55cqh;color:var(--muted);font-size:.42em;letter-spacing:.12em}.stat.work{color:var(--live)}.stat.dead{color:var(--dead)}
#emptyFallen{position:absolute;inset:0;display:grid;place-items:center;color:#4a443d;font:1000 1cqw/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em}
#fallen.hasDeath #emptyFallen{display:none}

#main{position:absolute;left:0;right:0;top:18cqh;bottom:0;transform-origin:0 0;touch-action:none;will-change:transform}
#mast{display:none}
#brand{display:none}
#brand small{display:block;margin-top:.7cqh;color:var(--muted);font-size:.32em;letter-spacing:.16em}
#progress{font:1000 1.45cqw/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--fg);letter-spacing:.02em}
.scene{position:absolute;inset:0;padding:1.6cqh 2cqw 2cqh;opacity:0;transform:translateY(4%);transition:opacity .55s,transform .8s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.scene.on{opacity:1;transform:none;pointer-events:auto}
.wall{height:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:1.05cqw}
.mini{min-width:0;min-height:0;border-top:1px solid var(--line);position:relative;overflow:hidden;background:linear-gradient(#050505 0 72%,#0b0907 72%);padding-top:.65cqh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:.5cqh}
.minihead{display:flex;justify-content:space-between;align-items:end}.minihead strong{font-size:1.1cqw;letter-spacing:-.05em}.minihead b{font-size:1.5cqw;color:var(--hot)}
.grid{position:relative;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:.17cqw;align-self:center}
.cell{aspect-ratio:1;border:1px solid #302b25;background:#0a0908;position:relative;overflow:hidden}
.cell.done{background:var(--hot);border-color:var(--hot)}.cell.work{border-color:var(--live);box-shadow:inset 0 0 0 1px #89ff6240}.cell.rescue:after{content:"↺";position:absolute;inset:0;display:grid;place-items:center;color:var(--fg);font:1000 .65cqw/1 ui-monospace,SFMono-Regular,Menlo,monospace}
.miniActor{position:absolute;width:1.5cqw;height:1.75cqw;transform:translate(-50%,-62%);transition:left .7s cubic-bezier(.2,.8,.2,1),top .7s cubic-bezier(.2,.8,.2,1),opacity .25s;z-index:8;filter:drop-shadow(0 .12cqw .14cqw #000)}
.miniActor .px{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;filter:drop-shadow(0 .12cqw 0 #000)}
.actor .px,.miniActor .px,.workerPortrait .px,#fallenAvatar .px{overflow:visible}
.actor.work .px{animation:pxWork .42s steps(2,end) infinite}.actor.rescue .px{animation:pxRescue .32s steps(2,end) infinite}.actor.wait .px{animation:pxWait 1.8s steps(2,end) infinite}.actor.dead .px{transform:rotate(90deg) translateY(-8%);filter:grayscale(1)}
@keyframes pxWork{to{transform:translateY(-8%)}}@keyframes pxRescue{to{transform:translateY(-12%) rotate(-6deg)}}@keyframes pxWait{50%{transform:translateY(4%)}}
70%{opacity:1;transform:translate(-50%,-63%) scale(1.12)}} 

.side{display:none}
.score,.scoreLabel{display:none}
.workerList{display:none}.worker{display:none}.workerPortrait{position:relative;width:2.1cqw;height:2.4cqw;display:block}.workerPortrait .px{position:absolute;inset:0;width:100%;height:100%}.workerPortrait .mark{display:none}.worker.work .workerPortrait .px{position:absolute;inset:0;width:100%;height:100%}.worker.dead .workerPortrait .px{position:absolute;inset:0;width:100%;height:100%}.worker.rescue .workerPortrait .px{position:absolute;inset:0;width:100%;height:100%}.worker span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.worker em{font-style:normal;color:var(--muted)}
#idleVeil{position:absolute;inset:0;pointer-events:none;display:none}
#main.idle #idleVeil{display:block}
#main.idle .mini{opacity:.65}
#main.idle .minihead b{color:#5d564e}

@media(max-aspect-ratio:1/1){
  #tv{width:100vw;height:56.25vw}
}
@media(prefers-reduced-motion:reduce){.scene,.actor,.miniActor{transition:none!important}.actor{animation:none!important}}
</style>
</head>

function botSprite(code){return '<span class="botSprite">'+pixelAvatar(code)+'<b class="mark">'+String(code||'W')+'</b></span>'}
function memberEvent(d,m){var es=(d.recent_events||[]).filter(function(e){return e.worker_code===m.worker_code});return es[0]||null}
function speechFor(d,m){
 var e=memberEvent(d,m),t=m.current_task_no||e&&e.task_no||'—',p=e&&e.visual||{},msg='';
 if(p.message)msg=String(p.message);else if(p.summary)msg=String(p.summary);else if(p.result)msg=String(p.result);
 if(msg)return msg.slice(0,78);
 if(!e)return m.current_task_no?'T'+String(t).padStart(2,'0')+' · trabajando':'esperando trabajo';
 var k=String(e.event_type||'');
 if(k==='TASK_LEASED')return'T'+String(t).padStart(2,'0')+' · entro a trabajar';

 if(k==='TASK_EXPIRED')return'T'+String(t).padStart(2,'0')+' · perdí el turno';
 if(k==='MEMBER_JOINED')return'entré a la grilla';
 return k.replaceAll('_',' ').toLowerCase().slice(0,78)
}
function actorState(d,m){
 var st=String(m.status||'').toUpperCase(),ev=memberEvent(d,m),recent=ev&&(Date.now()-new Date(ev.at).getTime()<1800);

function timelineFrom(events,member,deathAt){
 var start=new Date(member.joined_at).getTime(),end=new Date(deathAt).getTime();if(!isFinite(start)||!isFinite(end)||end<=start)return[];
 var es=(events||[]).slice().sort(function(a,b){return new Date(a.at||a.created_at)-new Date(b.at||b.created_at)});
 var segs=[],cursor=start,state='action';
 function push(to,next){to=Math.max(cursor,Math.min(end,to));if(to>cursor)segs.push({state:state,ms:to-cursor});cursor=to;state=next}
 es.forEach(function(e){var t=new Date(e.at||e.created_at).getTime();if(t<start||t>end)return;
   if(e.event_type==='TASK_LEASED')push(t,'work');
   else if(e.event_type==='TASK_DONE')push(t,'action');
   else if(e.event_type==='TASK_EXPIRED')push(t,'wait');
   else if(e.event_type==='MEMBER_JOINED')push(t,'action')
 });
 if(cursor<end)segs.push({state:state==='action'?'wait':state,ms:end-cursor});
 return segs
}
function renderFallen(member,events){
