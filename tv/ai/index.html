<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>PROMETEO · GRID TV</title>
<style>
:root{--bg:#050505;--fg:#f2eee6;--muted:#746e66;--line:#2b2722;--hot:#ff6a00;--live:#89ff62;--dead:#ff5148;--action:#f0c84a}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:grid;place-items:start center}
#tv{position:relative;width:min(100vw,177.777vh);height:min(56.25vw,100vh);overflow:hidden;background:var(--bg);container-type:size}
#fallen{position:absolute;z-index:60;left:0;right:0;top:0;height:14cqh;border-bottom:1px solid var(--line);display:grid;grid-template-columns:9cqw 15cqw 1fr 20cqw;gap:1.4cqw;align-items:center;padding:1.4cqh 2cqw;background:#050505}
#fallenAvatar{width:6.5cqw;height:7.5cqh;position:relative;justify-self:center}
#fallenAvatar .botSprite{transform:scale(1.25);transform-origin:center}
#fallenMeta{min-width:0}
#fallenCode{font:1000 1.75cqw/.9 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fallenMeta small{display:block;margin-top:.8cqh;color:var(--muted);font:900 .72cqw/1.25 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}
#fallenMeta .death{color:var(--dead)}
#life{min-width:0}
#lifeTop{display:none;justify-content:space-between;gap:1cqw;margin-bottom:.8cqh;color:var(--muted);font:900 .68cqw/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.07em}
#timeline{height:3.2cqh;background:#100e0c;border:1px solid var(--line);display:flex;overflow:hidden}
.seg{height:100%;min-width:1px}.seg.work{background:var(--live)}.seg.wait{background:var(--dead)}.seg.action{background:var(--action)}.seg.unknown{background:#38332d}
#legend{display:none;gap:.8cqw;margin-top:.65cqh;color:var(--muted);font:900 .59cqw/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
#legend i{width:.55cqw;height:.55cqw;display:inline-block;margin-right:.25cqw;vertical-align:-.04cqw}.lgWork{background:var(--live)}.lgWait{background:var(--dead)}.lgAction{background:var(--action)}
#globalStats{display:grid;grid-template-columns:1fr 1fr;gap:.7cqw}
.stat{border:1px solid var(--line);padding:1.05cqh .8cqw;font:1000 1.35cqw/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center}
.stat small{display:block;margin-top:.55cqh;color:var(--muted);font-size:.42em;letter-spacing:.12em}.stat.work{color:var(--live)}.stat.dead{color:var(--dead)}
#emptyFallen{position:absolute;inset:0;display:grid;place-items:center;color:#4a443d;font:1000 1cqw/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em}
#fallen.hasDeath #emptyFallen{display:none}

#main{position:absolute;left:0;right:0;top:14cqh;bottom:0;transform-origin:0 0;touch-action:none;will-change:transform}
#mast{position:absolute;z-index:40;left:2cqw;right:2cqw;top:1.8cqh;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
#brand{display:none}
#brand small{display:block;margin-top:.7cqh;color:var(--muted);font-size:.32em;letter-spacing:.16em}
#progress{font:1000 1.45cqw/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--fg);letter-spacing:.02em}
.scene{position:absolute;inset:0;padding:8.2cqh 2cqw 2.2cqh;opacity:0;transform:translateY(4%);transition:opacity .55s,transform .8s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.scene.on{opacity:1;transform:none;pointer-events:auto}
.wall{height:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:1.05cqw}
.mini{min-width:0;min-height:0;border-top:1px solid var(--line);padding-top:.65cqh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:.5cqh}
.minihead{display:flex;justify-content:space-between;align-items:end}.minihead strong{font-size:1.1cqw;letter-spacing:-.05em}.minihead b{font-size:1.5cqw;color:var(--hot)}
.grid{position:relative;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:.17cqw;align-self:center}
.cell{aspect-ratio:1;border:1px solid #302b25;background:#0a0908;position:relative;overflow:hidden}
.cell.done{background:var(--hot);border-color:var(--hot)}.cell.work{border-color:var(--live);box-shadow:inset 0 0 0 1px #89ff6240}.cell.rescue:after{content:"↺";position:absolute;inset:0;display:grid;place-items:center;color:var(--fg);font:1000 .65cqw/1 ui-monospace,SFMono-Regular,Menlo,monospace}
.miniActor{position:absolute;width:.72cqw;height:.72cqw;border-radius:50%;background:var(--fg);box-shadow:0 0 0 .15cqw var(--live),0 0 .6cqw #89ff6250;transform:translate(-50%,-50%);transition:left .7s cubic-bezier(.2,.8,.2,1),top .7s cubic-bezier(.2,.8,.2,1),opacity .25s}
.miniActor.dead{box-shadow:0 0 0 .15cqw var(--dead);opacity:.55}.miniActor.wait{opacity:.35}

.hero{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 28cqw;gap:2cqw;align-items:center}
.heroLeft{min-width:0}.heroTag{margin-bottom:1.2cqh;font:1000 1.75cqw/.9 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.04em}.heroTag small{display:block;margin-top:.65cqh;color:var(--muted);font-size:.4em;letter-spacing:.13em}
#heroGrid{gap:.34cqw}#heroGrid .cell:before{content:attr(data-n);position:absolute;inset:0;display:grid;place-items:center;color:#48413b;font:900 .55cqw/1 ui-monospace,SFMono-Regular,Menlo,monospace}#heroGrid .cell.done:before{color:#090705}#heroGrid .cell.work:before{color:var(--live)}
#heroActors{position:absolute;inset:0;pointer-events:none}
.actor{position:absolute;width:3.15cqw;height:3.8cqw;transform:translate(-50%,-58%);transition:left .72s cubic-bezier(.2,.8,.2,1),top .72s cubic-bezier(.2,.8,.2,1),opacity .25s;z-index:10;filter:drop-shadow(0 .2cqw .3cqw #000)}
.botSprite{position:absolute;inset:0}
.pinAvatar{position:absolute;inset:-4%;overflow:hidden;border-radius:18%;background:#111;border:.11cqw solid #26221e}
.pinAvatar:before{content:"";position:absolute;inset:0;background-image:url("https://i.pinimg.com/736x/50/32/16/503216b71bcce87ab660a31bc4b747b4.jpg");background-repeat:no-repeat;background-size:600% auto;filter:grayscale(1) contrast(1.7) brightness(1.12);mix-blend-mode:screen}
.pinAvatar.p1:before{background-position:0% 8%}.pinAvatar.p2:before{background-position:20% 8%}.pinAvatar.p3:before{background-position:40% 8%}.pinAvatar.p4:before{background-position:60% 8%}
.actor .pinAvatar{box-shadow:0 0 0 .12cqw #16130f,0 0 .55cqw #000}.actor.work .pinAvatar{box-shadow:0 0 0 .14cqw var(--live),0 0 .65cqw #89ff6244}.actor.rescue .pinAvatar{box-shadow:0 0 0 .14cqw var(--action),0 0 .7cqw #f0c84a44}.actor.dead .pinAvatar{box-shadow:0 0 0 .14cqw var(--dead);filter:grayscale(1);opacity:.65}
.actor .pinAvatar~.pack,.actor .pinAvatar~.head,.actor .pinAvatar~.visor,.actor .pinAvatar~.body,.actor .pinAvatar~.arm{display:none}
#fallenAvatar .pinAvatar{position:absolute;inset:0}
.botSprite .pack{position:absolute;left:.3cqw;top:.2cqw;width:2.55cqw;height:2.2cqw;background:#181818;clip-path:polygon(8% 0,92% 4%,100% 84%,0 100%)}
.botSprite .head{position:absolute;left:.62cqw;top:.12cqw;width:2cqw;height:2.35cqw;background:var(--fg);border:.12cqw solid #111;border-radius:46% 46% 41% 41%}
.botSprite .visor{position:absolute;left:.36cqw;top:.9cqw;width:2.45cqw;height:.76cqw;background:var(--live);border:.16cqw solid #0b0b0b;box-shadow:0 0 .5cqw #89ff6266;clip-path:polygon(4% 15%,96% 0,100% 78%,0 100%)}
.botSprite .body{position:absolute;left:.24cqw;bottom:.16cqw;width:2.7cqw;height:1.15cqw;background:var(--fg);border:.12cqw solid #111;clip-path:polygon(19% 0,81% 0,100% 100%,0 100%)}
.botSprite .arm{position:absolute;right:-.05cqw;top:2cqw;width:.9cqw;height:.24cqw;background:var(--fg);transform-origin:left center}
.botSprite .mark{position:absolute;left:50%;top:3.55cqw;transform:translateX(-50%);font:1000 .58cqw/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--fg);white-space:nowrap;text-shadow:0 .08cqw .12cqw #000}
.actor.work .visor{animation:visorPulse .65s steps(2,end) infinite}.actor.work .arm{animation:tap .55s ease-in-out infinite}.actor.publish{animation:publishHop .55s ease-out}.actor.rescue .visor{background:#fff;box-shadow:0 0 .8cqw #fff}.actor.rescue:after{content:"↺";position:absolute;right:-.2cqw;top:-.35cqw;color:var(--action);font:1000 1.2cqw/1 ui-monospace,SFMono-Regular,Menlo,monospace}.actor.wait{opacity:.4}.actor.dead{opacity:.55;filter:grayscale(1)}.actor.dead .visor{background:var(--dead);box-shadow:none}.actor.dead:after{content:"×";position:absolute;left:1.05cqw;top:.62cqw;color:#050505;font:1000 1.1cqw/1 ui-monospace,SFMono-Regular,Menlo,monospace;z-index:20}.actor.enter{animation:enterPop .55s ease-out}
.actor.v1 .head{border-radius:30%}.actor.v2 .pack{clip-path:polygon(20% 0,100% 15%,84% 100%,0 83%)}.actor.v3 .visor{clip-path:none;width:2.15cqw;left:.5cqw}.actor.v4 .head:before{content:"";position:absolute;left:.78cqw;top:-.55cqw;width:.2cqw;height:.55cqw;background:var(--fg);box-shadow:0 -.12cqw 0 .12cqw #111}
@keyframes visorPulse{50%{filter:brightness(1.8)}}@keyframes tap{50%{transform:rotate(-28deg)}}@keyframes publishHop{50%{transform:translate(-50%,-70%) scale(1.1)}}@keyframes enterPop{0%{opacity:0;transform:translate(-50%,-58%) scale(.35)}70%{opacity:1;transform:translate(-50%,-63%) scale(1.12)}} 

.side{height:78%;border-left:1px solid var(--line);padding-left:1.8cqw;display:flex;flex-direction:column;justify-content:center}
.score{font-size:8.8cqw;font-weight:1000;line-height:.72;letter-spacing:-.09em;color:var(--hot)}.scoreLabel{margin-top:1cqh;color:var(--muted);font:900 .9cqw/1 ui-monospace,SFMono-Regular,Menlo,monospace}
.workerList{display:grid;gap:.9cqh;margin-top:3cqh}.worker{border-top:1px solid var(--line);padding-top:.75cqh;display:grid;grid-template-columns:.8cqw 1fr auto;gap:.65cqw;align-items:center;font:900 .82cqw/1.1 ui-monospace,SFMono-Regular,Menlo,monospace}.lamp{width:.65cqw;height:.65cqw;border-radius:50%;background:var(--muted)}.worker.work .lamp{background:var(--live);box-shadow:0 0 .6cqw #89ff6260}.worker.dead .lamp{background:var(--dead)}.worker.rescue .lamp{background:var(--action)}.worker span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.worker em{font-style:normal;color:var(--muted)}
#idleVeil{position:absolute;inset:0;pointer-events:none;display:none}
#main.idle #idleVeil{display:block}
#main.idle .mini{opacity:.65}
#main.idle .minihead b{color:#5d564e}

@media(max-aspect-ratio:1/1){
  #tv{width:100vw;height:56.25vw}
}
@media(prefers-reduced-motion:reduce){.scene,.actor,.miniActor{transition:none!important}.actor{animation:none!important}}
</style>
</head>
<body>
<div id="tv">
  <section id="fallen">
    <div id="emptyFallen">SIN BAJAS TODAVÍA · LA ÚLTIMA MUERTE VA A QUEDAR ACÁ</div>
    <div id="fallenAvatar"></div>
    <div id="fallenMeta"><div id="fallenCode">—</div><small id="fallenLife">VIDA TOTAL · —</small><small class="death" id="fallenDeath">MURIÓ · —</small></div>
    <div id="life"><div id="lifeTop"><span>HISTORIA DEL ÚLTIMO WORKER CAÍDO</span><span id="lifePct">—</span></div><div id="timeline"></div><div id="legend"><span><i class="lgWork"></i>WORK</span><span><i class="lgAction"></i>ACCIÓN</span><span><i class="lgWait"></i>WAIT</span></div></div>
    <div id="globalStats"><div class="stat work"><b id="workCount">0</b><small>WORK</small></div><div class="stat dead"><b id="deadCount">0</b><small>DEAD</small></div></div>
  </section>

  <main id="main" class="idle">
    <div id="mast"><div id="brand">GRID LAB · 10 × 100<small id="brandSub">ARMED · ESPERANDO 20 WORKERS</small></div><div id="progress"><span id="totalDone">0</span>/1000 · <span id="gridsDone">0</span>/10 DONE</div></div>
    <section class="scene on" id="wallScene"><div class="wall" id="wall"></div></section>
    <section class="scene" id="heroScene"><div class="hero"><div class="heroLeft"><div class="heroTag" id="heroTag">GRID 01<small>ESPERANDO WORKERS</small></div><div class="grid" id="heroGrid"><div id="heroActors"></div></div></div><aside class="side"><div class="score" id="heroDone">0</div><div class="scoreLabel">/ 100 COMPLETADAS</div><div class="workerList" id="workerList"></div></aside></div></section>
    <div id="idleVeil"></div>
  </main>
</div>

<script>
(function(){
'use strict';
var BASE='https://catnohyouxqjjtseaueb.supabase.co/rest/v1/';
var KEY='sb_publishable_eqh3PngXs4UjLLWiY3pz1w_nhHtf7X-';
var HEAD={apikey:KEY,Authorization:'Bearer '+KEY};
var $=function(id){return document.getElementById(id)};
var DEMO=new URLSearchParams(location.search).get('demo')==='1';
var rows=[],scene='wall',focus=0,hadExperiment=false,knownWorkers=new Set(),prevTasks=new Map(),demoTick=0,fallenKey='';

function ageMs(a,b){return Math.max(0,new Date(b).getTime()-new Date(a).getTime())}
function fmtDur(ms){var s=Math.max(0,Math.round(ms/1000)),m=Math.floor(s/60),h=Math.floor(m/60);s%=60;m%=60;return h?String(h)+'h '+String(m).padStart(2,'0')+'m':String(m)+'m '+String(s).padStart(2,'0')+'s'}
function fmtClock(ts){if(!ts)return'—';return new Intl.DateTimeFormat('es-AR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'America/Argentina/Buenos_Aires'}).format(new Date(ts))}
function hash(s){var h=0,i;for(i=0;i<String(s).length;i++)h=((h<<5)-h)+String(s).charCodeAt(i);return Math.abs(h)}
function variant(code){return 'v'+((hash(code)%4)+1)}
function pos(task){var n=Math.max(1,Math.min(100,Number(task||1)))-1;return{x:((n%10)+.5)*10,y:(Math.floor(n/10)+.5)*10}}
function botSprite(code){var p='p'+((hash(code)%4)+1);return '<span class="botSprite"><i class="pinAvatar '+p+'"></i><i class="pack"></i><i class="head"></i><i class="visor"></i><i class="body"></i><i class="arm"></i><b class="mark">'+String(code||'W')+'</b></span>'}
function memberEvent(d,m){var es=(d.recent_events||[]).filter(function(e){return e.worker_code===m.worker_code});return es[0]||null}
function actorState(d,m){
 var st=String(m.status||'').toUpperCase(),ev=memberEvent(d,m),recent=ev&&(Date.now()-new Date(ev.at).getTime()<1800);
 if(st==='DEAD')return'dead';
 if(recent&&ev.event_type==='TASK_DONE'&&ev.payload&&ev.payload.rescued)return'rescue';
 if(recent&&ev.event_type==='TASK_DONE')return'publish';
 if(recent&&ev.event_type==='MEMBER_JOINED')return'enter';
 if(m.current_task_no)return'work';
 return'wait'
}
function cellHtml(t,nums){
 var c='cell';if(t.status==='DONE')c+=' done';if(t.status==='LEASED')c+=' work';if(Number(t.rescue_count||0)>0)c+=' rescue';
 return '<i class="'+c+'"'+(nums?' data-n="'+String(t.task_no).padStart(2,'0')+'"':'')+'></i>'
}
function miniActors(d){
 return (d.member_rows||[]).map(function(m){var p=pos(m.current_task_no||Math.min(100,Math.max(1,Number(m.tasks_done||0)+1))),s=actorState(d,m);return '<i class="miniActor '+s+'" style="left:'+p.x+'%;top:'+p.y+'%"></i>'}).join('')
}
function wallHtml(){
 return rows.map(function(d,i){return '<article class="mini"><div class="minihead"><strong>G'+String(i+1).padStart(2,'0')+'</strong><b>'+Number(d.done||0)+'</b></div><div class="grid">'+(d.tasks||[]).map(function(t){return cellHtml(t,false)}).join('')+miniActors(d)+'</div></article>'}).join('')
}
function syncHeroActors(d){
 var layer=$('heroActors'),live=new Set();
 (d.member_rows||[]).forEach(function(m){
   var code=m.worker_code||('W'+m.seat_no),id='actor-'+code.replace(/[^a-z0-9_-]/gi,''),el=document.getElementById(id),fresh=!knownWorkers.has(code);
   if(!el){el=document.createElement('i');el.id=id;el.innerHTML=botSprite(code);layer.appendChild(el)}
   live.add(id);knownWorkers.add(code);
   var task=m.current_task_no||prevTasks.get(code)||Math.min(100,Math.max(1,Number(m.tasks_done||0)+1)),p=pos(task),s=actorState(d,m);
   el.className='actor '+variant(code)+' '+s+(fresh?' enter':'');
   requestAnimationFrame(function(){el.style.left=p.x+'%';el.style.top=p.y+'%'});
   prevTasks.set(code,task)
 });
 Array.prototype.slice.call(layer.querySelectorAll('.actor')).forEach(function(el){if(!live.has(el.id))el.remove()})
}
function workerRows(d){
 return (d.member_rows||[]).map(function(m){var s=actorState(d,m),task=m.current_task_no?'T'+String(m.current_task_no).padStart(2,'0'):'—';return '<div class="worker '+s+'"><i class="lamp"></i><span>'+String(m.worker_code||'WORKER')+' · '+s.toUpperCase()+'</span><em>'+task+'</em></div>'}).join('')
}
function counts(){var work=0,dead=0;rows.forEach(function(d){(d.member_rows||[]).forEach(function(m){var s=String(m.status||'').toUpperCase();if(s==='DEAD')dead++;else if(s==='ACTIVE'&&m.current_task_no)work++})});return{work:work,dead:dead}}
function activeExperiment(){return hadExperiment||rows.some(function(d){return Number(d.members||0)>0||Number(d.done||0)>0||Number(d.working||0)>0||['RUNNING','DONE'].indexOf(String(d.status).toUpperCase())>=0})}
function render(){
 if(!rows.length)return;
 var c=counts(),active=activeExperiment();if(active)hadExperiment=true;
 $('workCount').textContent=c.work;$('deadCount').textContent=c.dead;$('main').classList.toggle('idle',!active);
 $('brandSub').textContent=active?'LIVE · DATOS REALES CADA 1.2s':'ARMED · ESPERANDO 20 WORKERS';
 $('wall').innerHTML=wallHtml();
 var done=rows.reduce(function(a,d){return a+Number(d.done||0)},0);
 $('totalDone').textContent=done;$('gridsDone').textContent=rows.filter(function(d){return String(d.status).toUpperCase()==='DONE'||Number(d.done||0)>=100}).length;
 var d=rows[focus%rows.length];
 $('heroTag').innerHTML='GRID '+String((focus%rows.length)+1).padStart(2,'0')+'<small>'+String(d.status||'').toUpperCase()+' · '+Number(d.members||0)+'/2 WORKERS</small>';
 $('heroDone').textContent=Number(d.done||0);
 var layer=$('heroActors');$('heroGrid').innerHTML=(d.tasks||[]).map(function(t){return cellHtml(t,true)}).join('')+'<div id="heroActors"></div>';
 syncHeroActors(d);$('workerList').innerHTML=workerRows(d);
 $('wallScene').classList.toggle('on',scene==='wall');$('heroScene').classList.toggle('on',scene==='hero')
}

function timelineFrom(events,member,deathAt){
 var start=new Date(member.joined_at).getTime(),end=new Date(deathAt).getTime();if(!isFinite(start)||!isFinite(end)||end<=start)return[];
 var es=(events||[]).slice().sort(function(a,b){return new Date(a.created_at)-new Date(b.created_at)});
 var segs=[],cursor=start,state='action';
 function push(to,next){to=Math.max(cursor,Math.min(end,to));if(to>cursor)segs.push({state:state,ms:to-cursor});cursor=to;state=next}
 es.forEach(function(e){var t=new Date(e.created_at).getTime();if(t<start||t>end)return;
   if(e.event_type==='TASK_LEASED')push(t,'work');
   else if(e.event_type==='TASK_DONE')push(t,'action');
   else if(e.event_type==='TASK_EXPIRED')push(t,'wait');
   else if(e.event_type==='MEMBER_JOINED')push(t,'action')
 });
 if(cursor<end)segs.push({state:state==='action'?'wait':state,ms:end-cursor});
 return segs
}
function renderFallen(member,events){
 if(!member){$('fallen').classList.remove('hasDeath');return}
 var expiry=(events||[]).filter(function(e){return e.event_type==='TASK_EXPIRED'}).slice(-1)[0];
 var deathAt=expiry?expiry.created_at:(member.last_seen_at||member.joined_at),life=ageMs(member.joined_at,deathAt),segs=timelineFrom(events,member,deathAt),total=Math.max(1,segs.reduce(function(a,s){return a+s.ms},0)),work=segs.filter(function(s){return s.state==='work'}).reduce(function(a,s){return a+s.ms},0);
 $('fallen').classList.add('hasDeath');$('fallenAvatar').innerHTML=botSprite(member.worker_code);$('fallenCode').textContent=member.worker_code+' · '+member.run_id;$('fallenLife').textContent='VIDA TOTAL · '+fmtDur(life);$('fallenDeath').textContent='MURIÓ · '+fmtClock(deathAt);$('lifePct').textContent=Math.round(work/total*100)+'% WORK';
 $('timeline').innerHTML=segs.map(function(s){return '<i class="seg '+s.state+'" style="width:'+(s.ms/total*100)+'%"></i>'}).join('')
}
async function pullFallen(){
 if(DEMO)return;
 try{
   var r=await fetch(BASE+'grid_lab_members?select=run_id,worker_code,status,joined_at,last_seen_at,tasks_done&run_id=like.GRID-2-100-*&status=eq.DEAD&order=last_seen_at.desc&limit=1',{headers:HEAD,cache:'no-store'}),m=(await r.json())[0];
   if(!m){renderFallen(null,[]);return}
   var key=m.run_id+'|'+m.worker_code+'|'+m.last_seen_at;if(key===fallenKey)return;fallenKey=key;
   var er=await fetch(BASE+'grid_lab_events?select=event_type,task_no,payload,created_at&run_id=eq.'+encodeURIComponent(m.run_id)+'&worker_code=eq.'+encodeURIComponent(m.worker_code)+'&order=created_at.asc&limit=500',{headers:HEAD,cache:'no-store'}),es=await er.json();renderFallen(m,Array.isArray(es)?es:[])
 }catch(e){}
}
function makeDemo(){
 rows=Array.from({length:10},function(_,g){var done=10+g*4,workers=[0,1].map(function(w){return{seat_no:w+1,worker_code:'W'+String(g*2+w+1).padStart(2,'0'),status:'ACTIVE',current_task_no:Math.min(100,done+1+w*3),tasks_done:Math.floor(done/2),joined_at:new Date(Date.now()-600000).toISOString(),last_seen_at:new Date().toISOString()}});return{run_id:'GRID-2-100-'+String(g+1).padStart(2,'0'),status:'RUNNING',members:2,working:2,done:done,tasks:Array.from({length:100},function(_,i){return{task_no:i+1,status:i<done?'DONE':i<done+2?'LEASED':'READY',rescue_count:(i===done-3&&g%3===0)?1:0}}),member_rows:workers,recent_events:[]}})
 var fm={run_id:'GRID-2-100-03',worker_code:'W05',status:'DEAD',joined_at:new Date(Date.now()-735000).toISOString(),last_seen_at:new Date(Date.now()-70000).toISOString(),tasks_done:7};
 var base=new Date(fm.joined_at).getTime(),ev=[];for(var i=0;i<7;i++){ev.push({event_type:'TASK_LEASED',created_at:new Date(base+20000+i*85000).toISOString()});ev.push({event_type:'TASK_DONE',created_at:new Date(base+65000+i*85000).toISOString()})}ev.push({event_type:'TASK_EXPIRED',created_at:new Date(Date.now()-12000).toISOString()});renderFallen(fm,ev);hadExperiment=true;render()
}
function demoStep(){
 if(!DEMO)return;demoTick++;
 rows.forEach(function(d,gi){(d.member_rows||[]).forEach(function(m,wi){if(m.status==='DEAD')return;var ph=(demoTick+gi+wi)%6;if(ph===0){var t=m.current_task_no;if(t&&d.tasks[t-1]){d.tasks[t-1].status='DONE';d.done=Math.min(100,d.done+1);d.recent_events=[{worker_code:m.worker_code,event_type:'TASK_DONE',at:new Date().toISOString(),payload:{rescued:false}}];m.tasks_done++;m.current_task_no=Math.min(100,t+1)}}else if(ph===2){d.recent_events=[]}if(demoTick===12&&gi===6&&wi===1){m.status='DEAD';m.current_task_no=null}})});render()
}
async function pull(){
 if(DEMO)return;
 try{var r=await fetch(BASE+'grid_batch_dashboard?select=*',{headers:HEAD,cache:'no-store'});if(!r.ok)throw Error(r.status);var d=await r.json();if(Array.isArray(d)&&d.length){rows=d;render()}}catch(e){}
}
setInterval(function(){if(!rows.length)return;if(scene==='wall'){scene='hero'}else{scene='wall';focus=(focus+1)%rows.length}render()},8000);
var inspect={scale:1,x:0,y:0,down:false,moved:false,sx:0,sy:0,ox:0,oy:0,lastTap:0};
function applyInspect(){var m=$('main');m.style.transform='translate('+inspect.x+'px,'+inspect.y+'px) scale('+inspect.scale+')'}
function zoomAt(cx,cy,next){var m=$('main'),r=m.getBoundingClientRect(),old=inspect.scale,n=Math.max(1,Math.min(4,next)),lx=(cx-r.left)/old,ly=(cy-r.top)/old;inspect.x+=lx*(old-n);inspect.y+=ly*(old-n);inspect.scale=n;applyInspect()}
$('main').addEventListener('pointerdown',function(e){if(e.pointerType!=='touch')return;this.setPointerCapture(e.pointerId);inspect.down=true;inspect.moved=false;inspect.sx=e.clientX;inspect.sy=e.clientY;inspect.ox=inspect.x;inspect.oy=inspect.y});
$('main').addEventListener('pointermove',function(e){if(!inspect.down||e.pointerType!=='touch')return;var dx=e.clientX-inspect.sx,dy=e.clientY-inspect.sy;if(Math.abs(dx)+Math.abs(dy)>8)inspect.moved=true;if(inspect.scale>1){inspect.x=inspect.ox+dx;inspect.y=inspect.oy+dy;applyInspect()}});
$('main').addEventListener('pointerup',function(e){if(e.pointerType!=='touch')return;inspect.down=false;if(inspect.moved)return;var now=Date.now();if(now-inspect.lastTap<330){inspect.scale=1;inspect.x=0;inspect.y=0;applyInspect();inspect.lastTap=0;return}inspect.lastTap=now;if(inspect.scale===1)zoomAt(e.clientX,e.clientY,2.65)});
if(DEMO){makeDemo();setInterval(demoStep,900)}else{pull();pullFallen();setInterval(pull,1200);setInterval(pullFallen,2500)}
})();
</script>
