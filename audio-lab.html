<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2efe7"><title>Audio Lab</title><style>html,body{margin:0;background:#f2efe7;color:#171a18;font:13px system-ui,sans-serif}#boot{min-height:100vh;display:grid;place-items:center}#spin{width:18px;height:18px;border:2px solid #171a1820;border-top-color:#171a18;border-radius:50%;margin:0 auto 12px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}#err{max-width:560px;line-height:1.5;padding:20px}</style></head><body><div id="boot"><div><div id="spin"></div><div>cargando Audio Lab…</div></div></div><script>(async()=>{try{const parts=await Promise.all([1,2,3,4].map(i=>fetch(`./audio-lab/v8/payload-${i}.txt?v=8f1`,{cache:'no-store'}).then(async r=>{if(!r.ok)throw new Error('payload '+i+' · HTTP '+r.status);return (await r.text()).replace(/\s+/g,'')})));const b64=parts.join('');if(b64.length!==13656)throw new Error('payload incompleto · '+b64.length+'/13656');if(b64.length%4!==0)throw new Error('Base64 con longitud inválida');if(!/^[A-Za-z0-9+/]*={0,2}$/.test(b64))throw new Error('Base64 contiene caracteres inválidos');const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('Navegador sin soporte gzip');const html=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();if(!html.includes('Audio Lab')||!html.includes('audioLabV8'))throw new Error('payload V8 inesperado');document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').innerHTML='<div id="err"><b>No pude abrir Audio Lab.</b><br><br>'+String(e.message||e)+'</div>'}})();</script></body></html>
