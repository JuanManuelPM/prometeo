<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Lab</title><style>html,body{margin:0;background:#f2efe7;color:#171a18;font:13px system-ui,sans-serif}#boot{min-height:100vh;display:grid;place-items:center}#box{text-align:center}#spin{width:18px;height:18px;border:2px solid #171a1820;border-top-color:#171a18;border-radius:50%;margin:0 auto 12px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}#err{max-width:560px;line-height:1.5;padding:20px}</style></head><body><div id="boot"><div id="box"><div id="spin"></div><div>cargando Audio Lab…</div></div></div><script>
const SRC='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/audio-lab-v2?github=1';
const CP=new Map([[0x20AC,0x80],[0x201A,0x82],[0x0192,0x83],[0x201E,0x84],[0x2026,0x85],[0x2020,0x86],[0x2021,0x87],[0x02C6,0x88],[0x2030,0x89],[0x0160,0x8A],[0x2039,0x8B],[0x0152,0x8C],[0x017D,0x8E],[0x2018,0x91],[0x2019,0x92],[0x201C,0x93],[0x201D,0x94],[0x2022,0x95],[0x2013,0x96],[0x2014,0x97],[0x02DC,0x98],[0x2122,0x99],[0x0161,0x9A],[0x203A,0x9B],[0x0153,0x9C],[0x017E,0x9E],[0x0178,0x9F]]);
function repair(s){if(!/[ÃÂâ]/.test(s))return s;const a=[];for(const ch of s){const c=ch.codePointAt(0),b=c<=255?c:CP.get(c);if(b==null)return s;a.push(b)}try{return new TextDecoder('utf-8',{fatal:true}).decode(new Uint8Array(a))}catch{return s}}
(async()=>{try{const r=await fetch(SRC,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let html=repair(await r.text());if(!html.includes('<!doctype html')||!html.includes('Audio Lab'))throw new Error('respuesta inválida');document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').innerHTML='<div id="err"><b>No pude abrir Audio Lab.</b><br><br>'+String(e.message||e)+'</div>'}})();
</script></body></html>
