 ]},

const $=id=>document.getElementById(id);const el={cats:$('cats'),catnote:$('catnote'),voices:$('voices'),blocks:$('blocks'),masterTrack:$('masterTrack'),overall:$('overall'),player:$('player'),play:$('play'),back:$('back'),forward:$('forward'),selectedName:$('selectedName'),selectedKind:$('selectedKind'),voicePlay:$('voicePlay'),prepareVoice:$('prepareVoice'),promptNav:$('promptNav'),prompt:$('prompt'),runinfo:$('runinfo'),log:$('log'),notice:$('notice')};

sed(c)}`:c.error||'';return `<section class="block ${playingKey===`${selected}:${p}`?'playing':''}" data-status="${c.status}"><div class="meta"><span class="num">${String(p+1).padStart(2,'0')}</span><span class="status">${statusLabel(c.status)}</span><span class="stats">${stats}</span><button class="blockplay" data-play="${selected}:${p}" ${c.status!=='ready'?'disabled':''}>${c.status==='ready'?'▶':'·'}</button></div><div class="text">${t}</div><div class="compare"><span class="compare-label">mismo párrafo</span>${cv.map(v=>{const q=C(v.id,p),k=`${v.id}:${p}`;return `<button class="cmp ${q.status==='ready'?'ready':''} ${playingKey===k?'playing':''}" data-play="${k}" ${q.status!=='ready'?'disabled':''}>${v.name}</button>`}).join('')}</div></section>`}).join(''); el.promptNav.innerHTML=cv.map(v=>`<button class="${selected===v.id?'active':''}" data-prompt-voice="${v.id}">${v.name}</button>`).join(''); document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>selectCategory(b.dataset.cat));document.querySelectorAll('[data-voice]').forEach(b=>b.onclick=()=>selectVoice(b.dataset.voice));document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>playSingle(b.dataset.play));document.querySelectorAll('[data-prompt-voice]').forEach(b=>b.onclick=()=>selectVoice(b.dataset.promptVoice));el.player.classList.toggle('active',!!audio&&playingKey!==null);el.play.textContent=audio&&!audio.paused?'❚❚':'▶';el.voicePlay.textContent=sequenceVoice===selected&&audio&&!audio.paused?'❚❚ voz completa':'▶ voz completa'}
function selectCategory(id){if(!CATEGORIES[id]||id===activeCat)return;stopAudio();activeCat=id;localStorage.setItem(LS+'category',id);selected=localStorage.getItem(LS+'selected:'+id)||categoryVoices()[0].id;if(!categoryVoices().some(v=>v.id===selected))selected=categoryVoices()[0].id;render();prepareVoice(selected,true);setTimeout(()=>{for(const v of categoryVoices())if(v.id!==selected)checkOrQueue(v.id,0,false)},250)}
function showNotice(msg){el.notice.textContent=msg;el.notice.classList.add('show')}function clearNotice(){el.notice.classList.remove('show');el.notice.textContent=''} function selectVoice(id){if(!V(id)||V(id).cat!==activeCat)return;if(selected!==id)stopAudio();selected=id;localStorage.setItem(LS+'selected:'+activeCat,selected);render()} function key(v,p){return `${v}:${p}`}function enqueue(k,front=false){const c=clips.get(k);if(!c||['ready','generating','checking'].includes(c.status))return;c.status='queued';if(!queue.includes(k))front?queue.unshift(k):queue.push(k);render();runQueue()} async function checkOrQueue(v,p,front=false){const c=C(v,p);if(!c||['ready','generating'].includes(c.status))return;c.status='checking';c.error=null;render();const t=performance.now(),ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),3500);try{const r=await fetch(`${API}?id=${encodeURIComponent(clipId(v,p))}`,{cache:'no-store',signal:ctrl.signal});if(r.ok){const blob=await r.blob();setReady(v,p,blob,r,t,'HIT');return}}catch(e){c.error=e?.name==='AbortError'?'cache timeout':String(e?.message||e)}finally{clearTimeout(timer)}c.status='idle';enqueue(key(v,p),front)} function setReady(v,p,blob,r,t,method){const c=C(v,p);if(c.url)URL.revokeObjectURL(c.url);c.blob=blob;c.url=URL.createObjectURL(blob);c.status='ready';c.cache=r.headers.get('x-modelos-cache')||method;c.bytes=blob.size;c.ms=Math.round(performance.now()-t);c.error=null;c.started=0;log(`${V(v).name} · bloque ${p+1} listo · ${c.cache} · ${Math.round(blob.size/1024)} KB`);render();if(waitingKey===key(v,p))playKey(waitingKey)} async function generate(k){const [v,ps]=k.split(':'),p=Number(ps),c=C(v,p),voice=V(v),text=CATEGORIES[voice.cat].texts[p];if(!c||c.status==='ready')return;c.status='generating';c.error=null;c.started=performance.now();render();const t=performance.now(),ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),150000);log(`generando ${voice.name} · bloque ${p+1}`);try{const gap=Math.max(0,3800-(Date.now()-lastPost));if(gap)await new Promise(r=>setTimeout(r,gap));lastPost=Date.now();const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},signal:ctrl.signal,body:JSON.stringify({voicePrompt:voice.prompt,text,messageId:clipId(v,p)})});if(!r.ok){const e=new Error(`HTTP ${r.status}`);e.status=r.status;throw e}const blob=await r.blob();setReady(v,p,blob,r,t,'MISS')}catch(e){c.error=e?.name==='AbortError'?'generation timeout':String(e?.message||e);c.started=0;log(`ERROR ${voice.name} · ${p+1}: ${c.error}`);if(e?.status===429){c.status='idle';setTimeout(()=>enqueue(k,false),15000)}else if(e?.name==='AbortError'){c.status='idle';setTimeout(()=>enqueue(k,false),5000)}else{c.status='error';showNotice(`${voice.name}, bloque ${p+1}: ${c.error}`)}render()}finally{clearTimeout(timer)}} async function runQueue(){if(working)return;working=true;try{while(queue.length){const k=queue.shift(),c=clips.get(k);if(c&&c.status!=='ready')await generate(k)}}finally{working=false;render()}} async function prepareVoice(v,front=true){clearNotice();const tx=CATEGORIES[V(v).cat].texts;await Promise.allSettled(tx.map((_,p)=>checkOrQueue(v,p,front&&p===0)))} function prepareCategory(){clearNotice();for(const id of [selected,...categoryVoices().map(v=>v.id).filter(id=>id!==selected)])for(let p=0;p<texts().length;p++){const c=C(id,p);if(c.status==='idle'||c.status==='error')checkOrQueue(id,p,id===selected&&p===0)}} function stopAudio(){if(audio){audio.pause();audio.src=''}audio=null;playingKey=null;waitingKey=null;sequenceVoice=null;render()} function playKey(k,offset=0){const c=clips.get(k);if(!c)return;if(c.status!=='ready'){waitingKey=k;enqueue(k,true);el.overall.textContent='esperando audio…';return}waitingKey=null;if(audio){audio.pause();audio.src=''}audio=new Audio(c.url);playingKey=k;audio.currentTime=Math.max(0,offset);const [v,ps]=k.split(':'),p=Number(ps),len=CATEGORIES[V(v).cat].texts.length;audio.onplaying=render;audio.onpause=render;audio.onended=()=>{if(sequenceVoice===v&&p<len-1)playKey(key(v,p+1));else stopAudio()};audio.play().catch(e=>{showNotice(`No pude reproducir: ${e.message}`);render()});render()} function playSingle(k){sequenceVoice=null;if(playingKey===k&&audio){audio.paused?audio.play():audio.pause();return}playKey(k)}function playVoice(v){if(sequenceVoice===v&&audio){audio.paused?audio.play():audio.pause();return}sequenceVoice=v;const tx=CATEGORIES[V(v).cat].texts,p=tx.findIndex((_,i)=>C(v,i).status==='ready');playKey(key(v,p>=0?p:0))} function seek(delta){if(!audio||!playingKey)return;const [v,ps]=playingKey.split(':'),p=Number(ps),len=CATEGORIES[V(v).cat].texts.length;let t=audio.currentTime+delta;if(t>=0&&(!Number.isFinite(audio.duration)||t<audio.duration)){audio.currentTime=t;return}if(t<0&&p>0){const prev=C(v,p-1);if(prev.status==='ready'){const probe=new Audio(prev.url);probe.onloadedmetadata=()=>{sequenceVoice=v;playKey(key(v,p-1),Math.max(0,probe.duration+t))}}return}if(Number.isFinite(audio.duration)&&t>=audio.duration&&p<len-1){sequenceVoice=v;playKey(key(v,p+1),t-audio.duration)}} function resetVoice(v){const voice=V(v);voice.run++;localStorage.setItem(LS+'run:'+v,voice.run);for(let p=0;p<CATEGORIES[voice.cat].texts.length;p++){const c=C(v,p);if(c.url)URL.revokeObjectURL(c.url);Object.assign(c,{status:'idle',blob:null,url:null,cache:'',bytes:0,ms:0,error:null,started:0});queue=queue.filter(x=>x!==key(v,p))}log(`nueva toma · ${voice.name} · ${voice.run}`);render();prepareVoice(v,true)}
el.play.onclick=()=>audio&&playingKey?(audio.paused?audio.play():audio.pause()):playVoice(selected);el.back.onclick=()=>seek(-5);el.forward.onclick=()=>seek(10);el.voicePlay.onclick=()=>playVoice(selected);el.prepareVoice.onclick=()=>prepareVoice(selected,true);el.prompt.oninput=()=>{const v=V(selected);v.prompt=el.prompt.value;localStorage.setItem(LS+'prompt:'+v.id,v.prompt)};$('regenVoice').onclick=()=>{stopAudio();resetVoice(selected)};$('prepareAll').onclick=()=>prepareCategory();$('regenAll').onclick=()=>{stopAudio();for(const v of categoryVoices()){v.run++;localStorage.setItem(LS+'run:'+v.id,v.run);for(let p=0;p<CATEGORIES[v.cat].texts.length;p++){const c=C(v.id,p);if(c.url)URL.revokeObjectURL(c.url);Object.assign(c,{status:'idle',blob:null,url:null,cache:'',bytes:0,ms:0,error:null,started:0})}}queue=queue.filter(k=>!categoryVoices().some(v=>k.startsWith(v.id+':')));render();prepareCategory()}; window.addEventListener('error',e=>{showNotice(`Error de interfaz: ${e.message||'desconocido'}`);el.overall.textContent='error de interfaz'});window.addEventListener('unhandledrejection',e=>{showNotice(`Error de red/runtime: ${String(e.reason||'desconocido')}`);el.overall.textContent='error de red/runtime'});watchTimer=setInterval(render,1000);render();log('V8 lista · '+CATEGORIES[activeCat].label);prepareVoice(selected,true);setTimeout(()=>{for(const v of categoryVoices())if(v.id!==selected)checkOrQueue(v.id,0,false)},250);
