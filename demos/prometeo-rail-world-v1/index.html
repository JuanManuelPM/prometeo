<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020302">
<title>Prometeo · Rail World</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
body{font-family:Inter,ui-sans-serif,system-ui,sans-serif}
#shell{position:fixed;inset:0;display:grid;place-items:center;background:#000}
#stage{position:relative;width:min(100vw,177.777vh);height:min(56.25vw,100vh);overflow:hidden;background:#020302;isolation:isolate;touch-action:none}
#world{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:0;pointer-events:none;background:#020403}
#stage:after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 11vw rgba(0,0,0,.20)}
#target{position:absolute;z-index:6;width:25px;height:12px;border:1px solid rgba(223,211,178,.56);border-radius:50%;opacity:0;transform:translate(-50%,-50%) scale(.25);pointer-events:none}
#target.pulse{animation:ping .48s ease-out}
@keyframes ping{0%{opacity:0;transform:translate(-50%,-50%) scale(.25)}28%{opacity:.86}100%{opacity:0;transform:translate(-50%,-50%) scale(1.55)}}
#player{position:absolute;z-index:8;left:50%;top:82%;width:clamp(34px,5.1%,72px);opacity:0;transform:translate(-50%,-100%) scale(var(--s,1));transform-origin:50% 100%;pointer-events:none;will-change:left,top,transform,opacity}
#player.visible{opacity:1}
#player .avatar{display:block;width:100%;height:auto;transform-origin:50% 78%;filter:brightness(.70) contrast(1.12) saturate(.72) drop-shadow(0 7px 7px rgba(0,0,0,.70))}
#player:after{content:"";position:absolute;left:50%;bottom:-5%;width:76%;height:8%;transform:translateX(-50%);border-radius:50%;background:rgba(0,0,0,.38);filter:blur(4px)}
#player.moving .avatar{animation:step .30s ease-in-out infinite}
@keyframes step{0%,100%{transform:translateY(0) rotate(-.25deg)}50%{transform:translateY(-5%) rotate(.25deg)}}
#gates{position:absolute;inset:0;z-index:7;pointer-events:none}
.gate{position:absolute;left:50%;top:50%;width:clamp(58px,6.3vw,108px);height:clamp(92px,10.2vw,174px);opacity:0;pointer-events:none;transform:translate(-50%,-100%) scale(var(--gs,.35));transform-origin:50% 100%;will-change:left,top,transform,opacity;filter:brightness(.64) saturate(.68) contrast(1.08);transition:filter .16s ease}
.gate.visible{opacity:1;pointer-events:auto;cursor:pointer}
.gate .slab{position:absolute;inset:0 8% 0 0;clip-path:polygon(7% 0,92% 0,100% 5%,100% 100%,0 100%,0 7%);background-image:linear-gradient(180deg,rgba(18,30,19,.30),rgba(2,5,3,.62)),url("https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/Dark_green_grey_flecked_speckled_spotted_clean_marble_cemented_building_wall_square_checkered_tile_texture.jpg/1024px-Dark_green_grey_flecked_speckled_spotted_clean_marble_cemented_building_wall_square_checkered_tile_texture.jpg");background-size:cover;background-position:center;border:1px solid rgba(173,157,116,.30);box-shadow:inset 0 0 0 4px rgba(8,15,10,.34),inset 0 0 24px rgba(0,0,0,.70),0 8px 14px rgba(0,0,0,.45)}
.gate .side{position:absolute;right:0;top:6%;width:15%;height:94%;clip-path:polygon(0 0,100% 9%,100% 100%,0 100%);background-image:linear-gradient(180deg,rgba(4,9,5,.45),rgba(0,0,0,.78)),url("https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Stone_Wall_Texture.jpg/1280px-Stone_Wall_Texture.jpg");background-size:cover;border-right:1px solid rgba(177,154,107,.20)}
.gate .cap{position:absolute;left:7%;right:8%;top:-5%;height:9%;transform:skewX(-42deg);transform-origin:left bottom;background-image:linear-gradient(90deg,rgba(112,105,80,.42),rgba(12,20,13,.72)),url("https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Stone_Wall_Texture.jpg/1280px-Stone_Wall_Texture.jpg");background-size:cover;border-top:1px solid rgba(205,188,143,.22)}
.gate .recess{position:absolute;left:17%;right:22%;top:17%;bottom:20%;background:linear-gradient(180deg,rgba(4,8,5,.94),rgba(0,0,0,.98));border:1px solid rgba(180,160,112,.22);box-shadow:inset 0 0 18px rgba(0,0,0,.88),0 0 0 4px rgba(2,5,3,.32)}
.gate .band{position:absolute;left:13%;right:18%;bottom:11%;height:5%;background:rgba(118,102,71,.20);border-top:1px solid rgba(198,177,129,.20);border-bottom:1px solid rgba(0,0,0,.55)}
.gate .mark{position:absolute;left:12%;right:17%;bottom:4%;color:rgba(205,192,157,.35);font:900 clamp(5px,.55vw,9px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.gate .code{position:absolute;left:50%;top:50%;transform:translate(-54%,-50%);color:rgba(178,165,129,.13);font:900 clamp(15px,2vw,34px)/1 Georgia,serif}
.gate.armed{filter:brightness(1.02) saturate(.94) contrast(1.10) drop-shadow(0 0 7px rgba(var(--accent),.30))}
.gate.armed .recess{background:linear-gradient(180deg,rgba(var(--accent),.58),rgba(var(--accent),.16) 38%,rgba(2,4,3,.96));border-color:rgba(var(--accent),.76);box-shadow:inset 0 0 18px rgba(var(--accent),.34),0 0 10px rgba(var(--accent),.18)}
.gate.armed .band{background:rgba(var(--accent),.48);border-color:rgba(var(--accent),.66)}
.gate.armed .mark{color:rgba(242,231,201,.88)}
.gate.armed .code{color:rgba(245,229,190,.54)}
#fade{position:absolute;inset:0;z-index:18;background:#010201;opacity:0;pointer-events:none;transition:opacity .12s ease}
#fade.on{opacity:.92}
#mapName{position:absolute;z-index:19;left:50%;top:50%;transform:translate(-50%,-50%);color:rgba(225,216,184,.74);font:800 9px/1 system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;opacity:0;pointer-events:none}
#mapName.show{animation:mapflash .55s ease}
@keyframes mapflash{0%,100%{opacity:0}24%,66%{opacity:1}}
#hint{position:absolute;z-index:12;left:max(10px,env(safe-area-inset-left));bottom:max(9px,env(safe-area-inset-bottom));color:rgba(224,215,190,.34);font:800 7px/1.25 system-ui,sans-serif;letter-spacing:.10em;text-transform:uppercase;pointer-events:none;transition:opacity .8s}
#loading{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:#020302;color:#69695d;font:800 9px/1 system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;transition:opacity .28s ease}
#loading.off{opacity:0;pointer-events:none}
#orientation{display:none;position:fixed;inset:0;z-index:99;background:#020202;color:#666158;place-items:center;text-align:center;font:800 10px/1.5 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase}
#debug{display:none;position:absolute;z-index:25;right:8px;top:8px;padding:6px 7px;background:rgba(0,0,0,.56);color:#c8bea8;font:700 8px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
body.debug #debug{display:block}
body.review #hint,body.review #target,body.review #debug{display:none!important}
body.review #player .avatar{animation:none!important}
@media(max-width:680px) and (orientation:portrait){#orientation{display:grid}}
</style>
</head>
<body>
<div id="shell">
  <div id="stage">
    <iframe id="world" title="Mundo Prometeo" tabindex="-1" aria-hidden="true"></iframe>
    <div id="target"></div>
    <div id="gates" aria-label="Accesos entre mapas"></div>
    <div id="player"><img class="avatar" src="../../strategy/mask-mouth/assets/mask-transparent.webp" alt=""></div>
    <div id="fade"></div>
    <div id="mapName"></div>
    <div id="hint">click en acceso = acercarse / entrar · click en mundo = mover jugador · scroll / ↑↓ / W S = cámara</div>
    <div id="debug"></div>
    <div id="loading">cargando mundo</div>
  </div>
</div>
<div id="orientation">giralo horizontalmente</div>
<script>
(()=>{
"use strict";

const MAPS=[
  {id:1,name:"ARCOS",minZ:-5,maxZ:132},
  {id:3,name:"CALZADA",minZ:-5,maxZ:165},
  {id:4,name:"TÚNEL",minZ:-5,maxZ:150},
  {id:5,name:"TORRES",minZ:-5,maxZ:118}
];
let route=0;
for(const m of MAPS){
  m.start=route;
  m.length=m.maxZ-m.minZ;
  m.end=m.start+m.length;
  route=m.end;
}
const TOTAL_ROUTE=route;
const mapIndex=id=>Math.max(0,MAPS.findIndex(m=>m.id===id));
const mapSpec=id=>MAPS[mapIndex(id)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function localToGlobal(mapId,z){
  const m=mapSpec(mapId);
  return m.start+clamp(z,m.minZ,m.maxZ)-m.minZ;
}
function globalToLocal(g){
  const x=clamp(g,0,TOTAL_ROUTE-.0001);
  let m=MAPS[MAPS.length-1];
  for(const candidate of MAPS){if(x<candidate.end){m=candidate;break}}
  return{map:m,z:m.minZ+(x-m.start)};
}

const q=new URLSearchParams(location.search);
const review=q.get("review")==="1";
if(review)document.body.classList.add("review");
if(q.get("debug")==="1")document.body.classList.add("debug");
const stage=document.getElementById("stage");
const world=document.getElementById("world");
const playerEl=document.getElementById("player");
const gatesEl=document.getElementById("gates");
const targetEl=document.getElementById("target");
const fade=document.getElementById("fade");
const mapName=document.getElementById("mapName");
const loading=document.getElementById("loading");
const hint=document.getElementById("hint");
const debug=document.getElementById("debug");

const reviewMap=Number(q.get("map")||1);
const reviewZ=Number(q.get("z")||20);
const reviewX=Number(q.get("x")||0);
const reviewT=Number(q.get("t")||5000);
const reviewPlayerMap=Number(q.get("playerMap")||reviewMap);
const reviewPlayerZ=Number(q.get("playerZ")||Math.min(mapSpec(reviewPlayerMap).maxZ-2,reviewZ+18));
const reviewPlayerX=Number(q.get("playerX")||0);
let src="../../visuals/spaces-lab/?embed=1";
if(review)src+="&review=1&map="+encodeURIComponent(reviewMap)+"&z="+encodeURIComponent(reviewZ)+"&x="+encodeURIComponent(reviewX)+"&t="+encodeURIComponent(reviewT);
world.src=src;

let api=null;
let ready=false;
let last=performance.now();
let wheelVelocity=0;
let cameraGlobal=localToGlobal(1,1.4);
let cameraMap=1;
let cameraX=0;
let transitionCount=0;
let lastCameraMap=1;
let touchPointer=null;
let touchStartX=0,touchStartY=0,touchLastX=0,touchLastY=0,touchMoved=false;
const keys=new Set();
const player={
  globalZ:localToGlobal(1,20),
  targetGlobalZ:localToGlobal(1,20),
  x:0,
  tx:0,
  moving:false
};
const GATE_RADIUS_ON=6.4;
const GATE_RADIUS_OFF=8.6;
const DESTINATION_ACCENTS={
  1:"190,151,80",
  3:"105,157,119",
  4:"168,105,76",
  5:"137,101,179"
};
const GATE_LAYOUT={
  1:[
    {destinationMap:3,z:38,x:-.72},
    {destinationMap:4,z:75,x:.72},
    {destinationMap:5,z:111,x:0}
  ],
  3:[
    {destinationMap:1,z:38,x:-2.85},
    {destinationMap:4,z:86,x:2.75},
    {destinationMap:5,z:137,x:-.75}
  ],
  4:[
    {destinationMap:1,z:35,x:-.82},
    {destinationMap:3,z:75,x:.82},
    {destinationMap:5,z:119,x:0}
  ],
  5:[
    {destinationMap:1,z:27,x:0},
    {destinationMap:3,z:58,x:0},
    {destinationMap:4,z:90,x:0}
  ]
};
const gateState={activeKey:null,entering:false};
const gateElements=new Map();
const gateProjections=new Map();
let lastPlayerProjection={rendered:false,visible:false,y:null,scale:null,distance:null,behind:false};

function getCameraState(){
  if(!api)return null;
  const s=api.getState();
  const current=mapSpec(s.map);
  const renderedGlobal=localToGlobal(s.map,s.renderedZ);
  return{...s,current,renderedGlobal};
}
function playerLocation(g=player.globalZ){return globalToLocal(g)}
function targetLocation(){return globalToLocal(player.targetGlobalZ)}
function getState(){
  if(!api)return{ready:false};
  const c=getCameraState();
  const p=playerLocation();
  const t=targetLocation();
  return{
    ready,
    cameraMap:c.map,
    cameraMapName:c.current.name,
    cameraZ:c.cameraZ,
    cameraRenderedZ:c.renderedZ,
    cameraGlobal,
    cameraRenderedGlobal:c.renderedGlobal,
    cameraX:c.cameraX,
    cameraRenderedX:c.renderedX,
    playerMap:p.map.id,
    playerMapName:p.map.name,
    playerZ:p.z,
    playerGlobal:player.globalZ,
    playerX:player.x,
    playerTargetMap:t.map.id,
    playerTargetZ:t.z,
    playerTargetGlobal:player.targetGlobalZ,
    playerTargetX:player.tx,
    playerMoving:player.moving,
    playerProjection:{...lastPlayerProjection},
    sameMap:c.map===p.map.id,
    wheelVelocity,
    transitions:transitionCount,
    gate:{
      active:Boolean(gateState.activeKey),
      key:gateState.activeKey,
      entering:gateState.entering
    },
    gates:gateCandidatesFor(c.map).map(g=>({
      key:g.key,
      mapId:g.mapId,
      destinationMap:g.destinationMap,
      destinationName:mapSpec(g.destinationMap).name,
      z:g.z,
      x:g.x,
      active:gateState.activeKey===g.key,
      projection:{...(gateProjections.get(g.key)||{rendered:false,visible:false})}
    }))
  };
}
function pulseTarget(x,y){
  targetEl.style.left=x+"%";targetEl.style.top=y+"%";
  targetEl.classList.remove("pulse");void targetEl.offsetWidth;targetEl.classList.add("pulse");
}
function flashMap(name){
  mapName.textContent=name;
  mapName.classList.remove("show");void mapName.offsetWidth;mapName.classList.add("show");
}
function announceCameraMap(id){
  if(id===lastCameraMap)return;
  lastCameraMap=id;
  transitionCount++;
  fade.classList.add("on");
  flashMap(mapSpec(id).name);
  setTimeout(()=>fade.classList.remove("on"),120);
}
function setCameraGlobal(nextGlobal,{immediate=false,x=null}={}){
  if(!api)return;
  const m=mapSpec(cameraMap);
  const minG=localToGlobal(m.id,m.minZ);
  const maxG=localToGlobal(m.id,m.maxZ-.18);
  cameraGlobal=clamp(nextGlobal,minG,maxG);
  const loc=globalToLocal(cameraGlobal);
  if(x!==null)cameraX=x;
  api.setCamera({z:loc.z,x:cameraX,immediate});
}
function moveCamera(dz,dx=0){
  if(!api||!ready||review)return;
  if(Math.abs(dx)>.00001){
    const s=api.getState();
    cameraX=clamp(cameraX+dx,-s.lateralLimit,s.lateralLimit);
  }
  setCameraGlobal(cameraGlobal+dz,{x:cameraX});
}

function gateCandidatesFor(mapId){
  return (GATE_LAYOUT[mapId]||[]).map(g=>({
    ...g,
    key:mapId+">"+g.destinationMap,
    mapId,
    destinationName:mapSpec(g.destinationMap).name
  }));
}
function gateByKey(key){
  for(const m of MAPS){
    const g=gateCandidatesFor(m.id).find(x=>x.key===key);
    if(g)return g;
  }
  return null;
}
function buildGateElements(){
  gatesEl.replaceChildren();
  gateElements.clear();
  for(const m of MAPS){
    for(const g of gateCandidatesFor(m.id)){
      const el=document.createElement("div");
      el.className="gate";
      el.dataset.key=g.key;
      el.dataset.map=String(g.mapId);
      el.dataset.destination=String(g.destinationMap);
      el.style.setProperty("--accent",DESTINATION_ACCENTS[g.destinationMap]||"190,151,80");
      const roman={1:"I",3:"II",4:"III",5:"IV"}[g.destinationMap]||"·";
      el.innerHTML='<div class="cap"></div><div class="side"></div><div class="slab"></div><div class="recess"></div><div class="code">'+roman+'</div><div class="band"></div><div class="mark">'+g.destinationName+'</div>';
      el.addEventListener("pointerdown",ev=>{
        if(review||gateState.entering)return;
        ev.preventDefault();ev.stopPropagation();
        if(gateState.activeKey===g.key)enterGate(g);
        else commandPlayerToGate(g);
      });
      el.addEventListener("pointerup",ev=>{ev.preventDefault();ev.stopPropagation()});
      gatesEl.appendChild(el);
      gateElements.set(g.key,el);
    }
  }
}
function gateDistanceFromPlayer(g){
  const p=playerLocation();
  if(p.map.id!==g.mapId)return Infinity;
  const dz=p.z-g.z;
  const dx=(player.x-g.x)*7.5;
  return Math.hypot(dz,dx);
}
function commandPlayerToGate(g){
  if(!g||gateState.entering)return;
  const p=playerLocation();
  if(p.map.id!==g.mapId)return;
  player.targetGlobalZ=localToGlobal(g.mapId,g.z);
  player.tx=g.x;
  player.moving=true;
  const proj=gateProjections.get(g.key);
  if(proj?.visible)pulseTarget(proj.x,proj.y);
}
function nearestActiveGate(){
  const p=playerLocation();
  const candidates=gateCandidatesFor(p.map.id);
  let best=null,bestD=Infinity;
  for(const g of candidates){
    const d=gateDistanceFromPlayer(g);
    if(d<bestD){best=g;bestD=d}
  }
  const keep=best&&gateState.activeKey===best.key;
  const threshold=keep?GATE_RADIUS_OFF:GATE_RADIUS_ON;
  return best&&bestD<=threshold?{...best,distance:bestD}:null;
}
function projectGate(g){
  const el=gateElements.get(g.key);
  if(!el||!api)return;
  const c=getCameraState();
  if(c.map!==g.mapId){
    el.classList.remove("visible","armed");
    gateProjections.set(g.key,{rendered:false,visible:false,key:g.key});
    return;
  }
  const d=g.z-c.renderedZ;
  if(d<=.10){
    el.classList.remove("visible","armed");
    gateProjections.set(g.key,{rendered:true,visible:false,behind:true,distance:d,key:g.key});
    return;
  }
  const safe=Math.max(.18,d);
  const y=43+48*Math.pow(12/safe,.72);
  const x=50+(g.x-c.renderedX)*(160/safe);
  const scale=clamp(12/safe,.24,3.8);
  el.style.left=x+"%";
  el.style.top=y+"%";
  el.style.setProperty("--gs",scale.toFixed(3));
  const onScreen=x>-16&&x<116&&y>34&&y<140;
  const armed=gateState.activeKey===g.key;
  el.classList.toggle("visible",onScreen);
  el.classList.toggle("armed",armed&&onScreen);
  gateProjections.set(g.key,{rendered:true,visible:onScreen,armed,x,y,scale,distance:d,key:g.key});
}
function updateGates(){
  if(!api)return;
  if(!gateState.entering){
    const active=nearestActiveGate();
    gateState.activeKey=active?.key||null;
  }
  for(const m of MAPS){
    for(const g of gateCandidatesFor(m.id))projectGate(g);
  }
}
function enterGate(g){
  if(!g||gateState.entering||gateState.activeKey!==g.key||!api)return;
  gateState.entering=true;
  fade.classList.add("on");
  setTimeout(()=>{
    const dest=mapSpec(g.destinationMap);
    const inbound=gateCandidatesFor(dest.id).find(x=>x.destinationMap===g.mapId)||gateCandidatesFor(dest.id)[0];
    const playerZ=clamp(inbound.z-2,dest.minZ+2,dest.maxZ-2);
    const cameraZ=clamp(playerZ-13,dest.minZ+.6,dest.maxZ-8);
    cameraMap=dest.id;
    lastCameraMap=dest.id;
    cameraX=clamp(inbound.x*.25,-.9,.9);
    cameraGlobal=localToGlobal(dest.id,cameraZ);
    api.setMap(dest.id);
    api.setCamera({z:cameraZ,x:cameraX,immediate:true});
    player.globalZ=player.targetGlobalZ=localToGlobal(dest.id,playerZ);
    player.x=player.tx=inbound.x;
    player.moving=false;
    transitionCount++;
    gateState.activeKey=null;
    flashMap(dest.name);
    setTimeout(()=>{
      fade.classList.remove("on");
      gateState.entering=false;
      updateGates();
    },130);
  },150);
}
buildGateElements();

function clickToPlayerTarget(px,py){
  if(!api||!ready||review)return;
  const c=getCameraState();
  const HORIZON=43,NEAR_Y=91;
  const y=clamp(py,HORIZON+3,NEAR_Y);
  const ratio=clamp((y-HORIZON)/48,.115,1);
  const distance=10/Math.pow(ratio,1/.72);
  const localZ=clamp(c.renderedZ+distance,c.current.minZ+1,c.current.maxZ-.7);
  const lateral=(px-50)/50;
  const worldX=clamp(c.renderedX+lateral*c.lateralLimit*.86,-c.lateralLimit,c.lateralLimit);
  player.targetGlobalZ=localToGlobal(c.map,localZ);
  player.tx=worldX;
  player.moving=Math.abs(player.targetGlobalZ-player.globalZ)>.04||Math.abs(player.tx-player.x)>.01;
  pulseTarget(px,py);
}

function projectPlayer(){
  if(!api)return;
  const c=getCameraState();
  const p=playerLocation();
  if(c.map!==p.map.id){
    playerEl.classList.remove("visible");
    lastPlayerProjection={rendered:false,visible:false,y:null,scale:null,distance:null,behind:false};
    return;
  }
  const d=p.z-c.renderedZ;
  // Keep projecting through the near plane. The stage itself clips the avatar,
  // so overtaking looks like passing a world object rather than toggling visibility.
  if(d<=0){
    playerEl.style.top="145%";
    playerEl.style.setProperty("--s","4.5");
    playerEl.classList.remove("visible");
    lastPlayerProjection={rendered:true,visible:false,y:145,scale:4.5,distance:d,behind:true};
    return;
  }
  const safe=Math.max(.18,d);
  const HORIZON=43;
  const y=HORIZON+48*Math.pow(12/safe,.72);
  const x=50+(player.x-c.renderedX)*(160/safe);
  const scale=clamp(12/safe,.25,4.5);
  playerEl.style.left=x+"%";
  playerEl.style.top=y+"%";
  playerEl.style.setProperty("--s",scale.toFixed(3));
  const intersectsViewport=x>-20&&x<120&&y>35&&y<138;
  playerEl.classList.toggle("visible",intersectsViewport);
  lastPlayerProjection={rendered:true,visible:intersectsViewport,y,scale,distance:d,behind:false};
}

stage.addEventListener("pointerdown",ev=>{
  if(review)return;
  if(ev.button!==undefined&&ev.button!==0)return;
  touchPointer=ev.pointerId;
  touchStartX=touchLastX=ev.clientX;
  touchStartY=touchLastY=ev.clientY;
  touchMoved=false;
  stage.setPointerCapture(ev.pointerId);
});
stage.addEventListener("pointermove",ev=>{
  if(review||ev.pointerId!==touchPointer||!api)return;
  const dx=ev.clientX-touchLastX,dy=ev.clientY-touchLastY;
  touchLastX=ev.clientX;touchLastY=ev.clientY;
  if(Math.hypot(ev.clientX-touchStartX,ev.clientY-touchStartY)>7)touchMoved=true;
  if(!touchMoved)return;
  ev.preventDefault();
  const s=api.getState();
  moveCamera(-dy*.050,-dx*.0038*Math.max(.25,s.lateralLimit));
});
function endPointer(ev){
  if(ev.pointerId!==touchPointer)return;
  ev.preventDefault();
  if(!touchMoved){
    const r=stage.getBoundingClientRect();
    clickToPlayerTarget((ev.clientX-r.left)/r.width*100,(ev.clientY-r.top)/r.height*100);
  }
  touchPointer=null;
  try{stage.releasePointerCapture(ev.pointerId)}catch(_){}
}
stage.addEventListener("pointerup",endPointer);
stage.addEventListener("pointercancel",ev=>{if(ev.pointerId===touchPointer)touchPointer=null});

addEventListener("keydown",ev=>{
  if(review)return;
  const k=ev.key.toLowerCase();
  if(["w","a","s","d","arrowup","arrowdown"].includes(k)){
    keys.add(k);ev.preventDefault();
  }
});
addEventListener("keyup",ev=>keys.delete(ev.key.toLowerCase()));
addEventListener("blur",()=>keys.clear());
addEventListener("wheel",ev=>{
  if(review)return;
  ev.preventDefault();
  const impulse=clamp(-ev.deltaY*.00007,-.026,.026);
  wheelVelocity=clamp(wheelVelocity+impulse,-.050,.050);
  hint.style.opacity=".14";
},{passive:false});
addEventListener("contextmenu",ev=>ev.preventDefault());
addEventListener("selectstart",ev=>ev.preventDefault());
addEventListener("dragstart",ev=>ev.preventDefault());

function updatePlayer(dt){
  const dz=player.targetGlobalZ-player.globalZ;
  const current=playerLocation();
  const targetLoc=targetLocation();
  const desiredX=current.map.id===targetLoc.map.id?player.tx:0;
  const dx=desiredX-player.x;
  if(Math.abs(dz)>.03){
    const speed=28;
    player.globalZ+=Math.sign(dz)*Math.min(Math.abs(dz),speed*dt);
  }else player.globalZ=player.targetGlobalZ;
  if(Math.abs(dx)>.006){
    const xSpeed=2.2;
    player.x+=Math.sign(dx)*Math.min(Math.abs(dx),xSpeed*dt);
  }else player.x=desiredX;
  player.moving=Math.abs(player.targetGlobalZ-player.globalZ)>.03||Math.abs(desiredX-player.x)>.006;
}
function frame(now){
  requestAnimationFrame(frame);
  const dtMs=Math.min(48,now-last||16);last=now;
  if(!ready)return;
  if(review){projectPlayer();updateGates();return}
  const dt=dtMs/1000;
  let dz=0,dx=0;
  if(keys.has("w")||keys.has("arrowup"))dz+=dtMs*.026;
  if(keys.has("s")||keys.has("arrowdown"))dz-=dtMs*.026;
  if(keys.has("a"))dx-=dtMs*.016;
  if(keys.has("d"))dx+=dtMs*.016;
  if(Math.abs(wheelVelocity)>.000025){
    dz+=wheelVelocity*dtMs;
    wheelVelocity*=Math.exp(-dtMs*.0092);
  }else wheelVelocity=0;
  if(Math.abs(dz)>.00001||Math.abs(dx)>.00001)moveCamera(dz,dx);
  updatePlayer(dt);
  playerEl.classList.toggle("moving",player.moving);
  projectPlayer();
  updateGates();
  const s=getState();
  debug.textContent=
    "camera "+s.cameraMapName+" z "+s.cameraZ.toFixed(1)+"\n"+
    "player "+s.playerMapName+" z "+s.playerZ.toFixed(1)+" -> "+s.playerTargetMap+" / "+s.playerTargetZ.toFixed(1)+"\n"+
    "same map "+s.sameMap+"\nwheel "+wheelVelocity.toFixed(4);
}
requestAnimationFrame(frame);

async function waitWorld(){
  for(let i=0;i<300;i++){
    try{
      const w=world.contentWindow;
      if(w&&w.PrometeoSpaces&&w.PrometeoSpacesReview&&w.PrometeoSpacesReview.ready){
        api=w.PrometeoSpaces;
        ready=true;
        if(review){
          cameraMap=reviewMap;
          cameraGlobal=localToGlobal(reviewMap,reviewZ);
          cameraX=reviewX;
          player.globalZ=player.targetGlobalZ=localToGlobal(reviewPlayerMap,reviewPlayerZ);
          player.x=player.tx=reviewPlayerX;
        }else{
          const s=api.getState();
          cameraMap=s.map;
          lastCameraMap=s.map;
          cameraGlobal=localToGlobal(s.map,s.cameraZ);
          cameraX=s.cameraX;
        }
        loading.classList.add("off");
        projectPlayer();
        window.PrometeoRailWorldReview={ready:true,version:"v5-network-gates",map:cameraMap};
        return;
      }
    }catch(_){}
    await new Promise(r=>setTimeout(r,50));
  }
  loading.textContent="no pude cargar el mundo";
}

window.PrometeoRailWorld={
  version:"v5-network-gates",
  getState,
  moveCameraBy(z=0,x=0){moveCamera(Number(z)||0,Number(x)||0);return getState()},
  setPlayerTargetFromPercent(x,y){clickToPlayerTarget(Number(x)||50,Number(y)||50);return getState()},
  setState(next={}){
    if(!api)return getState();
    const cm=Number.isFinite(Number(next.cameraMap))?Number(next.cameraMap):cameraMap;
    const cz=Number.isFinite(Number(next.cameraZ))?Number(next.cameraZ):globalToLocal(cameraGlobal).z;
    cameraMap=mapSpec(cm).id;
    cameraGlobal=localToGlobal(cameraMap,cz);
    cameraX=Number.isFinite(Number(next.cameraX))?Number(next.cameraX):cameraX;
    api.setMap(cameraMap);
    api.setCamera({z:cz,x:cameraX,immediate:next.immediate!==false});
    lastCameraMap=cameraMap;
    if(Number.isFinite(Number(next.playerMap))||Number.isFinite(Number(next.playerZ))){
      const pm=Number.isFinite(Number(next.playerMap))?Number(next.playerMap):playerLocation().map.id;
      const pz=Number.isFinite(Number(next.playerZ))?Number(next.playerZ):playerLocation().z;
      player.globalZ=localToGlobal(pm,pz);
      player.targetGlobalZ=player.globalZ;
    }
    if(Number.isFinite(Number(next.playerX)))player.x=player.tx=Number(next.playerX);
    wheelVelocity=0;
    projectPlayer();
    updateGates();
    return getState();
  }
};
setTimeout(()=>hint.style.opacity=".14",2200);
waitWorld();
})();
</script>
