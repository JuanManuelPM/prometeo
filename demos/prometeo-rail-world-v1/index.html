<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020302">
<title>Prometeo · Rail World</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
body{font-family:Inter,ui-sans-serif,system-ui,sans-serif}
#shell{position:fixed;inset:0;display:grid;place-items:center;background:#000}
#stage{position:relative;width:min(100vw,177.777vh);height:min(56.25vw,100vh);overflow:hidden;background:#020302;isolation:isolate;touch-action:none}
#world{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:0;pointer-events:none;background:#020403}
#stage:after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 11vw rgba(0,0,0,.20)}
#target{position:absolute;z-index:6;width:25px;height:12px;border:1px solid rgba(223,211,178,.56);border-radius:50%;opacity:0;transform:translate(-50%,-50%) scale(.25);pointer-events:none}
#target.pulse{animation:ping .48s ease-out}
@keyframes ping{0%{opacity:0;transform:translate(-50%,-50%) scale(.25)}28%{opacity:.86}100%{opacity:0;transform:translate(-50%,-50%) scale(1.55)}}
#player{position:absolute;z-index:8;left:50%;top:85%;width:clamp(42px,6.4%,92px);transform:translate(-50%,-100%);transform-origin:50% 100%;pointer-events:none;will-change:left,transform}
#player .avatar{display:block;width:100%;height:auto;transform-origin:50% 78%;filter:brightness(.72) contrast(1.15) saturate(.78) drop-shadow(0 8px 8px rgba(0,0,0,.72))}
#player:after{content:"";position:absolute;left:50%;bottom:-5%;width:82%;height:9%;transform:translateX(-50%);border-radius:50%;background:rgba(0,0,0,.40);filter:blur(4px)}
#player.moving .avatar{animation:step .30s ease-in-out infinite}
@keyframes step{0%,100%{transform:translateY(0) rotate(-.35deg)}50%{transform:translateY(-5.5%) rotate(.35deg)}}
#fade{position:absolute;inset:0;z-index:18;background:#010201;opacity:0;pointer-events:none;transition:opacity .14s ease}
#fade.on{opacity:1}
#mapName{position:absolute;z-index:19;left:50%;top:50%;transform:translate(-50%,-50%);color:rgba(225,216,184,.74);font:800 9px/1 system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;opacity:0;pointer-events:none}
#mapName.show{animation:mapflash .62s ease}
@keyframes mapflash{0%,100%{opacity:0}25%,66%{opacity:1}}
#hint{position:absolute;z-index:12;left:max(10px,env(safe-area-inset-left));bottom:max(9px,env(safe-area-inset-bottom));color:rgba(224,215,190,.32);font:800 7px/1.2 system-ui,sans-serif;letter-spacing:.10em;text-transform:uppercase;pointer-events:none;transition:opacity .8s}
#loading{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:#020302;color:#69695d;font:800 9px/1 system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;transition:opacity .28s ease}
#loading.off{opacity:0;pointer-events:none}
#orientation{display:none;position:fixed;inset:0;z-index:99;background:#020202;color:#666158;place-items:center;text-align:center;font:800 10px/1.5 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase}
#debug{display:none;position:absolute;z-index:25;right:8px;top:8px;padding:6px 7px;background:rgba(0,0,0,.56);color:#c8bea8;font:700 8px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
body.debug #debug{display:block}
body.review #hint,body.review #target,body.review #debug{display:none!important}
body.review #player .avatar{animation:none!important}
@media(max-width:680px) and (orientation:portrait){#orientation{display:grid}}
</style>
</head>
<body>
<div id="shell">
  <div id="stage">
    <iframe id="world" title="Mundo Prometeo" tabindex="-1" aria-hidden="true"></iframe>
    <div id="target"></div>
    <div id="player"><img class="avatar" src="../../strategy/mask-mouth/assets/mask-transparent.webp" alt=""></div>
    <div id="fade"></div>
    <div id="mapName"></div>
    <div id="hint">scroll · ↑↓ / W S · swipe · A D lateral</div>
    <div id="debug"></div>
    <div id="loading">cargando mundo</div>
  </div>
</div>
<div id="orientation">giralo horizontalmente</div>
<script>
(()=>{
"use strict";
const MAPS=[
  {id:1,name:"ARCOS",maxZ:132},
  {id:3,name:"CALZADA",maxZ:165},
  {id:4,name:"TÚNEL",maxZ:150},
  {id:5,name:"TORRES",maxZ:118}
];
const q=new URLSearchParams(location.search);
const review=q.get("review")==="1";
if(review)document.body.classList.add("review");
if(q.get("debug")==="1")document.body.classList.add("debug");
const stage=document.getElementById("stage");
const world=document.getElementById("world");
const player=document.getElementById("player");
const target=document.getElementById("target");
const fade=document.getElementById("fade");
const mapName=document.getElementById("mapName");
const loading=document.getElementById("loading");
const hint=document.getElementById("hint");
const debug=document.getElementById("debug");

const reviewMap=Number(q.get("map")||1);
const reviewZ=Number(q.get("z")||20);
const reviewX=Number(q.get("x")||0);
const reviewT=Number(q.get("t")||5000);
let src="../../visuals/spaces-lab/?embed=1";
if(review)src+="&review=1&map="+encodeURIComponent(reviewMap)+"&z="+encodeURIComponent(reviewZ)+"&x="+encodeURIComponent(reviewX)+"&t="+encodeURIComponent(reviewT);
world.src=src;

let api=null;
let ready=false;
let transitioning=false;
let last=performance.now();
let wheelVelocity=0;
let autopilot=null;
let touchPointer=null;
let touchStartX=0,touchStartY=0,touchLastX=0,touchLastY=0,touchMoved=false;
let avatarX=50,avatarTargetX=50;
let movementHold=0;
let transitionCount=0;
const keys=new Set();

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const mapIndex=id=>Math.max(0,MAPS.findIndex(m=>m.id===id));
function getState(){
  if(!api)return{ready:false,map:null};
  const s=api.getState();
  return {
    ready,
    map:s.map,
    mapName:(MAPS.find(m=>m.id===s.map)||MAPS[0]).name,
    cameraZ:s.cameraZ,
    renderedZ:s.renderedZ,
    cameraX:s.cameraX,
    renderedX:s.renderedX,
    maxZ:s.maxZ,
    minZ:s.minZ,
    lateralLimit:s.lateralLimit,
    wheelVelocity,
    autopilotRemaining:autopilot?autopilot.remaining:0,
    transitioning,
    transitions:transitionCount
  };
}
function pulseTarget(x,y){
  target.style.left=x+"%";target.style.top=y+"%";
  target.classList.remove("pulse");void target.offsetWidth;target.classList.add("pulse");
}
function flashMap(name){
  mapName.textContent=name;
  mapName.classList.remove("show");void mapName.offsetWidth;mapName.classList.add("show");
}
function transitionMap(dir){
  if(!api||transitioning)return;
  transitioning=true;
  wheelVelocity*=.72;
  const before=api.getState();
  const i=mapIndex(before.map);
  const next=MAPS[(i+dir+MAPS.length)%MAPS.length];
  fade.classList.add("on");
  setTimeout(()=>{
    api.setMap(next.id);
    const z=dir>0?1.4:Math.max(2,next.maxZ-1.8);
    api.setCamera({x:0,z,immediate:true});
    avatarTargetX=50;
    flashMap(next.name);
    transitionCount++;
    setTimeout(()=>{
      fade.classList.remove("on");
      setTimeout(()=>{transitioning=false},150);
    },80);
  },145);
}
function drive(dz,dx=0){
  if(!api||!ready||review||transitioning)return;
  const s=api.getState();
  if(dz>0&&s.cameraZ>=s.maxZ-.12){transitionMap(1);return}
  if(dz<0&&s.cameraZ<=s.minZ+.12){transitionMap(-1);return}
  api.moveBy({z:dz,x:dx});
  if(Math.abs(dz)>.001||Math.abs(dx)>.001)movementHold=.18;
}
function clickTravel(px,py){
  if(!api||!ready||review)return;
  const s=api.getState();
  const dy=.55-py/100;
  const dir=dy>=0?1:-1;
  const distance=clamp(10+Math.abs(dy)*92,10,52);
  autopilot={dir,remaining:distance};
  const lateral=(px-50)/50;
  const x=clamp(lateral*s.lateralLimit*.72,-s.lateralLimit,s.lateralLimit);
  api.setCamera({x});
  avatarTargetX=clamp(50+lateral*10,39,61);
  pulseTarget(px,py);
}
function pointerPercent(ev){
  const r=stage.getBoundingClientRect();
  return{x:(ev.clientX-r.left)/r.width*100,y:(ev.clientY-r.top)/r.height*100};
}
stage.addEventListener("pointerdown",ev=>{
  if(review)return;
  if(ev.button!==undefined&&ev.button!==0)return;
  touchPointer=ev.pointerId;
  touchStartX=touchLastX=ev.clientX;
  touchStartY=touchLastY=ev.clientY;
  touchMoved=false;
  stage.setPointerCapture(ev.pointerId);
});
stage.addEventListener("pointermove",ev=>{
  if(review||ev.pointerId!==touchPointer||!api)return;
  const dx=ev.clientX-touchLastX,dy=ev.clientY-touchLastY;
  touchLastX=ev.clientX;touchLastY=ev.clientY;
  if(Math.hypot(ev.clientX-touchStartX,ev.clientY-touchStartY)>7)touchMoved=true;
  if(!touchMoved)return;
  ev.preventDefault();
  autopilot=null;
  const s=api.getState();
  drive(-dy*.050,-dx*.0038*Math.max(.25,s.lateralLimit));
  avatarTargetX=clamp(avatarTargetX+dx*.045,41,59);
});
function endPointer(ev){
  if(ev.pointerId!==touchPointer)return;
  ev.preventDefault();
  if(!touchMoved){
    const p=pointerPercent(ev);
    clickTravel(p.x,p.y);
  }
  touchPointer=null;
  try{stage.releasePointerCapture(ev.pointerId)}catch(_){}
}
stage.addEventListener("pointerup",endPointer);
stage.addEventListener("pointercancel",ev=>{if(ev.pointerId===touchPointer)touchPointer=null});

addEventListener("keydown",ev=>{
  if(review)return;
  const k=ev.key.toLowerCase();
  if(["w","a","s","d","arrowup","arrowdown"].includes(k)){
    keys.add(k);autopilot=null;ev.preventDefault();
  }else if(["1","2","3","4"].includes(k)&&api){
    const spec=MAPS[Number(k)-1];
    transitioning=true;fade.classList.add("on");
    setTimeout(()=>{
      api.setMap(spec.id);api.setCamera({z:1.4,x:0,immediate:true});
      flashMap(spec.name);avatarTargetX=50;fade.classList.remove("on");
      setTimeout(()=>transitioning=false,170);
    },120);
    ev.preventDefault();
  }
});
addEventListener("keyup",ev=>keys.delete(ev.key.toLowerCase()));
addEventListener("blur",()=>keys.clear());
addEventListener("wheel",ev=>{
  if(review)return;
  ev.preventDefault();
  autopilot=null;
  const impulse=clamp(-ev.deltaY*.00007,-.026,.026);
  wheelVelocity=clamp(wheelVelocity+impulse,-.050,.050);
  movementHold=.22;
  hint.style.opacity=".14";
},{passive:false});
addEventListener("contextmenu",ev=>ev.preventDefault());
addEventListener("selectstart",ev=>ev.preventDefault());
addEventListener("dragstart",ev=>ev.preventDefault());

function frame(now){
  requestAnimationFrame(frame);
  const dtMs=Math.min(48,now-last||16);last=now;
  if(!ready||review)return;
  const dt=dtMs/1000;
  let dz=0,dx=0;
  if(keys.has("w")||keys.has("arrowup"))dz+=dtMs*.026;
  if(keys.has("s")||keys.has("arrowdown"))dz-=dtMs*.026;
  if(keys.has("a"))dx-=dtMs*.016;
  if(keys.has("d"))dx+=dtMs*.016;
  if(Math.abs(wheelVelocity)>.000025){
    dz+=wheelVelocity*dtMs;
    wheelVelocity*=Math.exp(-dtMs*.0092);
  }else wheelVelocity=0;
  if(autopilot&&Math.abs(dz)<.001){
    const step=Math.min(autopilot.remaining,24*dt);
    dz+=autopilot.dir*step;
    autopilot.remaining-=step;
    if(autopilot.remaining<=.03)autopilot=null;
  }
  if(Math.abs(dz)>.0001||Math.abs(dx)>.0001)drive(dz,dx);
  movementHold=Math.max(0,movementHold-dt);
  const s=api.getState();
  const moving=movementHold>0||Math.abs(s.cameraZ-s.renderedZ)>.12||Boolean(autopilot)||Math.abs(wheelVelocity)>.0001;
  player.classList.toggle("moving",moving);
  if(!keys.has("a")&&!keys.has("d")&&!touchMoved&&Math.abs(s.cameraX)<.04)avatarTargetX=50;
  avatarX=lerp(avatarX,avatarTargetX,1-Math.exp(-dt*7.5));
  player.style.left=avatarX+"%";
  debug.textContent="map "+s.map+"\ntarget z "+s.cameraZ.toFixed(2)+"\nrender z "+s.renderedZ.toFixed(2)+"\nwheel "+wheelVelocity.toFixed(4)+"\ntransitions "+transitionCount;
}
requestAnimationFrame(frame);

async function waitWorld(){
  for(let i=0;i<300;i++){
    try{
      const w=world.contentWindow;
      if(w&&w.PrometeoSpaces&&w.PrometeoSpacesReview&&w.PrometeoSpacesReview.ready){
        api=w.PrometeoSpaces;
        ready=true;
        loading.classList.add("off");
        if(review){
          const s=api.getState();
          avatarTargetX=avatarX=clamp(50+(s.cameraX/Math.max(.001,s.lateralLimit))*8,42,58);
          player.style.left=avatarX+"%";
        }
        window.PrometeoRailWorldReview={ready:true,version:"v2-live-spaces",map:api.map};
        return;
      }
    }catch(_){}
    await new Promise(r=>setTimeout(r,50));
  }
  loading.textContent="no pude cargar el mundo";
}
window.PrometeoRailWorld={
  version:"v2-live-spaces",
  getState,
  moveBy(z=0,x=0){drive(Number(z)||0,Number(x)||0);return getState()},
  setState(next={}){
    if(!api)return getState();
    if(Number.isFinite(Number(next.map)))api.setMap(Number(next.map));
    api.setCamera({
      x:Number.isFinite(Number(next.x))?Number(next.x):api.camera.x,
      z:Number.isFinite(Number(next.z))?Number(next.z):api.camera.z,
      immediate:next.immediate!==false
    });
    transitioning=false;fade.classList.remove("on");autopilot=null;wheelVelocity=0;
    return getState();
  },
  nextMap(){transitionMap(1)},
  previousMap(){transitionMap(-1)}
};
setTimeout(()=>hint.style.opacity=".14",2200);
waitWorld();
})();
</script>
</body>
</html>
