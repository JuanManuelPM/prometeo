<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2efe7">
  <title>Prometeo · Pipeline académico</title>
  <link rel="stylesheet" href="./style.css?v=1">
</head>
<body>
  <main class="page">
    <header class="course-head">
      <div class="course">Modelos y Teorías II</div>
      <div class="source" id="sourceBadge">Fixture público</div>
    </header>

    <article class="reader" aria-live="polite">
      <p class="eyebrow">Documento normalizado</p>
      <h1 id="title">Cargando…</h1>
      <p class="subtitle" id="subtitle"></p>
      <div class="transport" aria-label="Reproducción del documento">
        <button id="play" class="play" type="button" aria-label="Reproducir" disabled>
          <span class="play-mark" aria-hidden="true">▶</span>
          <span class="pause-mark" aria-hidden="true">Ⅱ</span>
        </button>
        <div class="track" aria-hidden="true"><div id="progress" class="progress"></div></div>
        <div id="status" class="status">preparando lector…</div>
      </div>
      <section id="content" class="content"></section>
    </article>

    <footer class="foot">
      <span>Canonical Document → Reader Payload → TTS Chunk Set</span>
      <span id="identity"></span>
    </footer>
  </main>
  <script type="module" src="./app.js?v=1"></script>
</body>
</html>
