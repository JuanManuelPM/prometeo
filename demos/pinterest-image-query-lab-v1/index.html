<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Buscar imágenes · Prometeo</title>
<style>
:root{
  --paper:#f3f0e8;
  --ink:#111;
  --muted:#77736b;
  --line:#111;
  --pad:clamp(14px,3vw,34px);
  --max:1440px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden}
button,input{font:inherit}
button{color:inherit}
button,input{-webkit-tap-highlight-color:transparent}
.app{width:min(100%,var(--max));margin:0 auto;padding:0 var(--pad) 44px}
.top{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1.5px solid var(--line);
}
.brand{
  font:900 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.mode-indicator{
  display:none;
  max-width:52vw;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font:800 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  text-transform:uppercase;
  color:var(--muted);
}
.mode-indicator.show{display:block}
.search-zone{
  position:relative;
  padding:18px 0 0;
}
.search-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 54px 54px;
  min-height:54px;
}
.search-input{
  min-width:0;
  width:100%;
  border:1.5px solid var(--line);
  border-right:0;
  outline:0;
  border-radius:0;
  background:transparent;
  color:var(--ink);
  padding:0 16px;
  font-size:18px;
  font-weight:800;
}
.search-input::placeholder{color:#8d8981}
.icon-btn{
  display:grid;
  place-items:center;
  border:1.5px solid var(--line);
  background:transparent;
  padding:0;
  cursor:pointer;
}
.submit-btn{
  border-right:0;
  background:var(--ink);
  color:var(--paper);
}
.icon-btn svg{
  width:21px;
  height:21px;
  stroke:currentColor;
  stroke-width:2.4;
  fill:none;
  stroke-linecap:square;
  stroke-linejoin:miter;
}
.settings-btn[aria-expanded="true"]{
  background:var(--ink);
  color:var(--paper);
}
.settings-panel{
  display:none;
  border:1.5px solid var(--line);
  border-top:0;
  background:var(--paper);
}
.settings-panel.open{display:block}
.filter-list{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
}
.filter{
  min-height:48px;
  border:0;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  background:transparent;
  padding:9px 12px;
  text-align:left;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
}
.filter:nth-child(4n){border-right:0}
.filter:nth-last-child(-n+4){border-bottom:0}
.filter[aria-selected="true"]{
  background:var(--ink);
  color:var(--paper);
}
.results{
  padding-top:34px;
}
.results[hidden]{display:none}
.results-head{
  display:flex;
  gap:18px;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:14px;
}
.query-title{
  margin:0;
  min-width:0;
  font-size:clamp(30px,5vw,64px);
  line-height:.95;
  letter-spacing:-.055em;
  overflow-wrap:anywhere;
}
.counter{
  flex:0 0 auto;
  font:800 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  text-transform:uppercase;
  color:var(--muted);
}
.gallery{
  columns:5 190px;
  column-gap:10px;
}
.pin{
  display:block;
  width:100%;
  margin:0 0 10px;
  break-inside:avoid;
  border:0;
  background:#e6e1d7;
  overflow:hidden;
  text-decoration:none;
  color:inherit;
}
.pin img{
  display:block;
  width:100%;
  height:auto;
  min-height:80px;
  object-fit:cover;
  background:#e6e1d7;
}
.skeleton{
  display:block;
  width:100%;
  margin:0 0 10px;
  break-inside:avoid;
  background:#e6e1d7;
  animation:pulse .9s steps(2,end) infinite;
}
.skeleton:nth-child(3n+1){height:250px}
.skeleton:nth-child(3n+2){height:180px}
.skeleton:nth-child(3n){height:310px}
@keyframes pulse{50%{opacity:.5}}
.empty{
  width:100%;
  border-top:1.5px solid var(--line);
  padding:18px 0;
  font-size:14px;
  font-weight:800;
}
@media(max-width:760px){
  .app{padding:0 14px 30px}
  .top{height:50px}
  .search-zone{padding-top:14px}
  .search-row{grid-template-columns:minmax(0,1fr) 50px 50px;min-height:50px}
  .search-input{font-size:16px;padding:0 13px}
  .filter-list{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filter:nth-child(4n){border-right:1px solid var(--line)}
  .filter:nth-child(2n){border-right:0}
  .filter:nth-last-child(-n+4){border-bottom:1px solid var(--line)}
  .filter:nth-last-child(-n+2){border-bottom:0}
  .results{padding-top:27px}
  .results-head{margin-bottom:12px}
  .query-title{font-size:clamp(28px,10vw,48px)}
  .gallery{columns:2;column-gap:8px}
  .pin,.skeleton{margin-bottom:8px}
}
@media(max-width:360px){
  .brand{font-size:10px}
  .mode-indicator{font-size:9px}
}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand">Imágenes</div>
    <div class="mode-indicator" id="modeIndicator"></div>
  </header>

  <section class="search-zone">
    <form class="search-row" id="searchForm">
      <input class="search-input" id="searchInput" type="search" autocomplete="off" enterkeyhint="search" placeholder="Buscar…" aria-label="Buscar imágenes">
      <button class="icon-btn submit-btn" type="submit" aria-label="Buscar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
      </button>
      <button class="icon-btn settings-btn" id="settingsButton" type="button" aria-label="Ajustes de búsqueda" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6h6M14 6h6M10 3v6M4 12h10M18 12h2M18 9v6M4 18h3M11 18h9M7 15v6"/>
        </svg>
      </button>
    </form>

    <div class="settings-panel" id="settingsPanel">
      <div class="filter-list" id="filterList"></div>
    </div>
  </section>

  <section class="results" id="results" hidden>
    <div class="results-head">
      <h1 class="query-title" id="title"></h1>
      <div class="counter" id="counter"></div>
    </div>
    <div class="gallery" id="gallery"></div>
  </section>
</main>

<script>
const API="https://catnohyouxqjjtseaueb.supabase.co/functions/v1/pinterest-image-search-v1";
const KEY="pql-v1-7f2b9e31";

const searchFilters=[
  {id:"normal",label:"Normal",suffix:""},
  {id:"ui",label:"Símbolo UI",suffix:"minimal ui symbol icon"},
  {id:"line",label:"Líneas",suffix:"simple line drawing"},
  {id:"hand",label:"Dibujo a mano",suffix:"simple hand drawn illustration"},
  {id:"doodle",label:"Garabato",suffix:"minimal doodle sketch"},
  {id:"graphic",label:"Símbolo",suffix:"minimal graphic symbol"},
  {id:"pictogram",label:"Pictograma",suffix:"pictogram signage symbol"},
  {id:"silhouette",label:"Silueta",suffix:"simple black silhouette"},
  {id:"isolated",label:"Aislado",suffix:"isolated object plain background"},
  {id:"geometric",label:"Geométrico",suffix:"minimal geometric symbol"},
  {id:"emblem",label:"Emblema",suffix:"vintage emblem stamp graphic"},
  {id:"engraving",label:"Grabado",suffix:"vintage engraving black and white"}
];

const form=document.getElementById("searchForm");
const input=document.getElementById("searchInput");
const settingsButton=document.getElementById("settingsButton");
const settingsPanel=document.getElementById("settingsPanel");
const filterList=document.getElementById("filterList");
const modeIndicator=document.getElementById("modeIndicator");
const results=document.getElementById("results");
const title=document.getElementById("title");
const counter=document.getElementById("counter");
const gallery=document.getElementById("gallery");

let activeFilterId="normal";
let lastBaseQuery="";
let requestId=0;

function getFilter(id){
  return searchFilters.find(filter=>filter.id===id)||searchFilters[0];
}

function composedQuery(base){
  const clean=String(base||"").trim().replace(/\s+/g," ");
  const filter=getFilter(activeFilterId);
  return filter.suffix?clean+" "+filter.suffix:clean;
}

function updateModeIndicator(){
  const filter=getFilter(activeFilterId);
  if(filter.id==="normal"){
    modeIndicator.classList.remove("show");
    modeIndicator.textContent="";
  }else{
    modeIndicator.textContent=filter.label;
    modeIndicator.classList.add("show");
  }
}

function renderFilters(){
  filterList.replaceChildren(...searchFilters.map(filter=>{
    const button=document.createElement("button");
    button.type="button";
    button.className="filter";
    button.textContent=filter.label;
    button.setAttribute("aria-selected",String(filter.id===activeFilterId));
    button.addEventListener("click",()=>{
      activeFilterId=filter.id;
      renderFilters();
      updateModeIndicator();
      closeSettings();
      updateUrl();
      if(lastBaseQuery) search(lastBaseQuery);
    });
    return button;
  }));
}

function openSettings(){
  settingsPanel.classList.add("open");
  settingsButton.setAttribute("aria-expanded","true");
}

function closeSettings(){
  settingsPanel.classList.remove("open");
  settingsButton.setAttribute("aria-expanded","false");
}

function toggleSettings(){
  settingsPanel.classList.contains("open")?closeSettings():openSettings();
}

function updateUrl(){
  const u=new URL(location.href);
  if(lastBaseQuery)u.searchParams.set("q",lastBaseQuery);
  else u.searchParams.delete("q");
  if(activeFilterId==="normal")u.searchParams.delete("filter");
  else u.searchParams.set("filter",activeFilterId);
  u.searchParams.delete("v");
  history.replaceState(null,"",u);
}

function skeletons(){
  gallery.replaceChildren(...Array.from({length:10},()=> {
    const block=document.createElement("span");
    block.className="skeleton";
    return block;
  }));
}

function renderResults(data){
  const items=Array.isArray(data.results)?data.results:[];
  gallery.replaceChildren(...items.map((item,i)=>{
    const link=document.createElement("a");
    link.className="pin";
    link.href=item.source_url||item.image;
    link.target="_blank";
    link.rel="noopener noreferrer";
    link.title=item.title||"Abrir Pin";

    const img=document.createElement("img");
    img.src=item.image;
    img.alt=item.title||("Resultado "+(i+1));
    img.loading=i<6?"eager":"lazy";
    img.decoding="async";
    img.referrerPolicy="no-referrer";

    if(item.width&&item.height){
      img.width=item.width;
      img.height=item.height;
    }

    link.append(img);
    return link;
  }));

  counter.textContent=items.length+" "+(items.length===1?"resultado":"resultados");

  if(!items.length){
    gallery.innerHTML='<div class="empty">No encontré resultados.</div>';
  }
}

async function search(base){
  const clean=String(base||"").trim().replace(/\s+/g," ");
  if(!clean)return;

  lastBaseQuery=clean;
  const query=composedQuery(clean);
  const my=++requestId;

  results.hidden=false;
  title.textContent=clean;
  counter.textContent="buscando…";
  skeletons();
  updateUrl();

  try{
    const url=new URL(API);
    url.searchParams.set("q",query);
    url.searchParams.set("limit","10");
    url.searchParams.set("k",KEY);

    const response=await fetch(url,{headers:{"x-prometeo-lab":"pinterest-image-query-lab-v1"}});
    const data=await response.json().catch(()=>({ok:false,error:"INVALID_RESPONSE"}));

    if(my!==requestId)return;
    if(!response.ok||!data.ok)throw new Error(data.error||("HTTP_"+response.status));
    renderResults(data);
  }catch(error){
    if(my!==requestId)return;
    counter.textContent="error";
    gallery.innerHTML='<div class="empty">No se pudo completar la búsqueda.</div>';
    console.error(error);
  }
}

settingsButton.addEventListener("click",toggleSettings);

document.addEventListener("click",(event)=>{
  if(!settingsPanel.classList.contains("open"))return;
  if(event.target.closest(".search-zone"))return;
  closeSettings();
});

form.addEventListener("submit",(event)=>{
  event.preventDefault();
  closeSettings();
  search(input.value);
});

const initialUrl=new URL(location.href);
const initialFilter=initialUrl.searchParams.get("filter");
if(searchFilters.some(filter=>filter.id===initialFilter))activeFilterId=initialFilter;

renderFilters();
updateModeIndicator();

const initialQuery=initialUrl.searchParams.get("q");
if(initialQuery){
  input.value=initialQuery;
  search(initialQuery);
}
</script>
</body>
</html>
