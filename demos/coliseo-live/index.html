function tests(){const p=[];for(let i=0;i<ph.length;i++){const s=scenario(i);if(!C.validateSnapshot(s).ok)p.push('frame '+i);M.deriveVisualState(s);if(i)M.deriveEvents(scenario(i-1),s)}const has=(i,t,f)=>M.deriveEvents(scenario(i-1),scenario(i)).some(e=>e.type===t&&(!f||f(e)));if(!has(2,'WORKER_STALE'))p.push('stale');if(!has(3,'RECOVERY_STARTED'))p.push('recovery');if(!has(4,'OUTPUT_EMITTED',e=>e.node_key==='S-D1'))p.push('output');if(!has(4,'DEPENDENCY_DELIVERED',e=>e.to_node_key==='S-S1'))p.push('delivery');if(!has(4,'NODE_READY',e=>e.node_key==='S-S1'))p.push('ready');if(M.deriveEvents(scenario(7),scenario(7)).some(e=>e.type==='OUTPUT_EMITTED'))p.push('repeat');const rel=M.deriveEvents(scenario(6),scenario(7)),cl=M.deriveEvents(scenario(7),scenario(8));if(!rel.some(e=>e.type==='WORKER_RELEASED'&&e.worker_id==='fixture-worker-05')||!cl.some(e=>e.type==='WORKER_CLAIMED'&&e.worker_id==='fixture-worker-05'))p.push('fungible');return p}const probs=mok?tests():['module'];badge('tests',!probs.length,!probs.length?'SYNTHETIC TESTS OK':'TEST ERROR');if(probs.length)console.error(probs);

function render(s,ev){const v=M.deriveVisualState(s),wm=new Map(v.workers.map(w=>[w.worker_id,w]));$('phase').textContent='FRAME '+(frame+1)+'/'+ph.length+' · '+ph[frame];$('counts').innerHTML=`WORKING <b>${v.derived.productive_workers}</b> · WAIT <b>${v.derived.waiting_workers}</b> · STALE <b>${v.derived.stale_workers}</b> · READY <b>${v.derived.ready_nodes}</b>`;$('pool').innerHTML=v.workers.filter(w=>!w.node_key).map(w=>`<span>${esc(w.display_code||w.worker_id)} · POOL</span>`).join('');$('arena').innerHTML='';for(const p of v.projects){const a=document.createElement('article');a.className='project';const ns=v.nodes.filter(n=>n.project_key===p.project_key).sort((x,y)=>(order[x.node_kind]??9)-(order[y.node_kind]??9)||x.node_key.localeCompare(y.node_key)),c=p.visual_counts||{};a.innerHTML=`<div class="ph"><strong>${esc(p.title)}</strong><span class="ps">A${c.active||0} R${c.ready||0} B${c.blocked||0} S${c.success||0}</span></div><div class="nodes"></div>`;const box=a.querySelector('.nodes');for(const n of ns){const el=document.createElement('div');el.className='node '+n.state+(n.causal_state_consistent?'':' inconsistent');el.dataset.node=n.node_key;const as=n.assignments[0],w=as?wm.get(as.worker_id):null,ins=n.input_buffer.required?Array.from({length:n.input_buffer.required},(_,i)=>`<i class="input ${i<n.input_buffer.delivered?'on':''}"></i>`).join(''):'<i class="root"></i>';el.innerHTML=`<div class="top"><span class="kind">${esc(n.node_kind)}</span><span class="name">${esc(n.title)}</span><span class="state">${esc(n.state)}</span></div><div class="body"><span class="inputs">${ins}</span><span class="job">${as?'JOB '+esc(as.job_id):'—'}</span>${whtml(as,w)}</div>`;box.appendChild(el)}$('arena').appendChild(a)}$('events').innerHTML=(ev||[]).slice(-12).map(e=>{const cl=e.type==='OUTPUT_EMITTED'?'out':e.type==='DEPENDENCY_DELIVERED'?'dep':e.type==='NODE_READY'?'ready':e.type==='WORKER_STALE'?'stale':e.type==='RECOVERY_STARTED'?'recover':'';return `<span class="evt ${c
