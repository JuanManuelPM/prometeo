<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eee8da">
<title>Prometeo · Carpeta Drive</title>
<link rel="stylesheet" href="./style.css?v=1">
</head>
<body>
<main class="app">
  <header class="topbar">
    <div>
      <p class="eyebrow">PROMETEO / FACULTAD / DRIVE</p>
      <h1>Carpeta académica</h1>
    </div>
    <div class="folder-meta">
      <span class="dot"></span>
      <span>11 archivos · Google Drive real</span>
    </div>
  </header>

  <section class="workspace">
    <aside class="folder">
      <div class="folder-head">
        <div class="folder-icon">▣</div>
        <div>
          <strong>Material de estudio</strong>
          <span>1hqc_MBrmfrzPuT_m6GTu8X093_c-T2Dk</span>
        </div>
      </div>
      <div id="fileList" class="file-list" aria-label="Archivos de la carpeta"></div>
    </aside>

    <section class="preview-panel">
      <div class="preview-top">
        <div>
          <p id="fileType" class="eyebrow"></p>
          <h2 id="fileTitle"></h2>
          <p id="fileMeta" class="file-meta"></p>
        </div>
        <div class="page-pill">PÁGINA 1</div>
      </div>

      <div class="paper-stage">
        <article id="paper" class="paper" aria-live="polite">
          <div class="paper-page">1</div>
          <div id="paperContent"></div>
          <div class="fade-bottom"></div>
        </article>
      </div>

      <footer class="bottom-meta">
        <span id="driveId"></span>
        <span>Drive → extracción → vista interna</span>
      </footer>
    </section>
  </section>
</main>
<script src="./app.js?v=1"></script>
</body>
</html>
