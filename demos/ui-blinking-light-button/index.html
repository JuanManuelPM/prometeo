<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Prometeo · Light Button Study</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}body{display:grid;place-items:center;font-family:Arial,sans-serif}
.stage{width:min(92vw,92vh);aspect-ratio:1;display:grid;place-items:center;position:relative}
.button{width:74%;height:74%;border:clamp(5px,1vw,12px) solid #f2eee4;background:#090909;position:relative;display:grid;place-items:center;box-shadow:inset 0 0 0 clamp(2px,.35vw,5px) #090909,inset 0 0 0 clamp(5px,.8vw,10px) #f2eee4;cursor:pointer;transform:translateZ(0)}
.button:active{transform:scale(.975)}
.lamp{width:32%;aspect-ratio:1;border-radius:50%;background:#f2eee4;position:relative;box-shadow:0 0 0 clamp(7px,1.3vw,16px) #090909,0 0 0 clamp(10px,1.8vw,22px) #f2eee4;animation:blink 1.34s steps(1,end) infinite}
.lamp:after{content:"";position:absolute;inset:22%;border-radius:50%;background:#090909;opacity:.12}
@keyframes blink{0%,12%,22%,100%{background:#f2eee4;box-shadow:0 0 0 clamp(7px,1.3vw,16px) #090909,0 0 0 clamp(10px,1.8vw,22px) #f2eee4,0 0 clamp(28px,5vw,70px) clamp(5px,1vw,14px) rgba(242,238,228,.72)}13%,21%,55%,72%{background:#252525;box-shadow:0 0 0 clamp(7px,1.3vw,16px) #090909,0 0 0 clamp(10px,1.8vw,22px) #f2eee4}56%,71%{background:#f2eee4;box-shadow:0 0 0 clamp(7px,1.3vw,16px) #090909,0 0 0 clamp(10px,1.8vw,22px) #f2eee4,0 0 clamp(28px,5vw,70px) clamp(5px,1vw,14px) rgba(242,238,228,.72)}}
.button.paused .lamp{animation-play-state:paused}
</style></head><body><main class="stage"><div class="button" id="b" role="button" aria-label="Luz parpadeante"><span class="lamp"></span></div></main><script>document.getElementById('b').onclick=e=>e.currentTarget.classList.toggle('paused')</script></body></html>
