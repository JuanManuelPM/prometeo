 for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];px(p.x,p.y,2,2,p.col)}
 if(Math.random()<.015)smoke.push({x:1320,y:162,life:4,dx:(Math.random()-.5)*8});
 for(let i=smoke.length-1;i>=0;i--){const p=smoke[i];p.life-=dt;p.y-=7*dt;p.x+=p.dx*dt;px(p.x,p.y,5,5,"#3c3a34");if(p.life<=0)smoke.splice(i,1)}
}
function render(t,dt){
 ctx.fillStyle="#090c0a";ctx.fillRect(0,0,W,H);worldStatic();
 workers.filter(w=>!w.departed).sort((a,b)=>a.y-b.y).forEach(w=>workerSprite(w,t));
 effect(dt);
}
function tick(t){
 const dt=Math.min(.04,(t-last)/1000||0);last=t;workers.forEach(w=>step(w,dt,t));render(t,dt);requestAnimationFrame(tick);
}
async function api(path){const r=await fetch(SUPABASE_BASE+path,{headers:HEAD,cache:"no-store"});if(!r.ok)throw new Error("runtime "+r.status);return r.json()}
async function refresh(){
 try{
  const rows=await api("prometeo_control_live_workers?select=session_id,worker_code,display_code,phase,project_id,project_title,job_key,job_title,last_state,last_reason_code,liveness,phase_started_at,last_seen_at&order=phase_started_at.asc");
  sync(rows||[]);live=true;lastLive=Date.now();statusEl.className="status live";statusEl.textContent="LIVE · "+(rows||[]).length+" workers";
  const active=(rows||[]).filter(r=>!String(r.liveness||"").toUpperCase().includes("DEAD")).length,dead=(rows||[]).length-active;
  summaryEl.textContent="runtime real · activos "+active+" · off "+dead+" · click para inspeccionar";
 }catch(e){
  if(!lastLive)demo();else{statusEl.className="status stale";statusEl.textContent="RUNTIME STALE";summaryEl.textContent="última señal real preservada · reconectando";}
 }
}
function esc(s){return String(s==null?"—":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function show(w){
 selected=w.key;iname.textContent=String(w.row.worker_code||w.row.display_code||w.key);
 ibody.innerHTML=
  '<div class="row"><span>modo</span><strong class="'+(w.demo?'hot':'')+'">'+(w.demo?'DEMO VISUAL':'RUNTIME REAL')+'</strong></div>'+
  '<div class="row"><span>fase</span><strong>'+esc(w.row.phase||w.state)+'</strong></div>'+
  '<div class="row"><span>proyecto</span><strong>'+esc(w.row.project_title||w.row.project_id)+'</strong></div>'+
  '<div class="row"><span>job</span><strong>'+esc(w.row.job_title||w.row.job_key)+'</strong></div>'+
  '<div class="row"><span>destino</span><strong>'+esc((ZONES[w.target]||{}).label)+'</strong></div>'+
  '<div class="row"><span>estado</span><strong>'+esc(w.row.last_state||w.row.liveness||w.state)+'</strong></div>'+
  '<div class="row"><span>última señal</span><strong>'+esc(w.row.last_seen_at||"—")+'</strong></div>';
 inspect.classList.add("show");
}
function hit(x,y){let best=null,bd=9999;workers.forEach(w=>{if(w.departed)return;const d=Math.hypot(w.x-x,w.y-y);if(d<bd&&d<22){bd=d;best=w}});return best}
let drag=null,pinch=null;
c.addEventListener("pointerdown",e=>{c.setPointerCapture(e.pointerId);drag={id:e.pointerId,x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:false}});
c.addEventListener("pointermove",e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>6)drag.moved=true;view.x=drag.vx+dx;view.y=drag.vy+dy});
c.addEventListener("pointerup",e=>{if(!drag||drag.id!==e.pointerId)return;if(!drag.moved){const p=worldPoint(e.clientX,e.clientY),w=hit(p.x,p.y);if(w)show(w)}drag=null});
c.addEventListener("wheel",e=>{e.preventDefault();const before=worldPoint(e.clientX,e.clientY),nz=clamp(view.z*(e.deltaY<0?1.12:.89),baseFit*.7,baseFit*3.8);view.z=nz;view.x=e.clientX-before.x*nz;view.y=e.clientY-before.y*nz},{passive:false});
document.getElementById("close").onclick=()=>{inspect.classList.remove("show");selected=null};
addEventListener("resize",resize,{passive:true});resize();demo();refresh();setInterval(refresh,2500);requestAnimationFrame(tick);
})();
</script>
