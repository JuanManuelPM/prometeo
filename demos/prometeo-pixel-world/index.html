}
function pointIn(s,pad=18){return{x:rnd(s.x+pad,s.x+s.w-pad),y:rnd(s.y+28,s.y+s.h-pad)}}
function reconcile(a){
 if(a.desired==='working'&&a.visual!=='working'&&a.visual!=='walkWork'){a.target=pointIn(stationFor(a),20);a.visual='walkWork'}
 else if((a.desired==='parked'||a.desired==='silent')&&a.visual!==a.desired&&a.visual!=='walkPark'){a.target=pointIn(stationFor(a),12);a.visual='walkPark'}
 else if(a.desired==='dead'&&a.visual!=='dead'&&a.visual!=='walkDead'&&a.visual!=='falling'){a.target=pointIn(stationFor(a),14);a.visual='walkDead'}
 else if(a.desired==='assignable'&&a.visual!=='assignable'&&a.visual!=='wander'){a.target={x:rnd(W*.08,W*.58),y:rnd(150,H-36)};a.visual='wander'}
}
function moveTo(a,dt){
 if(!a.target)return true;const dx=a.target.x-a.x,dy=a.target.y-a.y,d=Math.hypot(dx,dy);if(d<3){a.x=a.target.x;a.y=a.target.y;return true}const sp=40;a.x+=dx/d*sp*dt;a.y+=dy/d*sp*dt;return false
}
function update(a,dt,t){
 reconcile(a);
 if(a.visual==='walkWork'&&moveTo(a,dt)){a.visual='working';a.target=null}
 else if(a.visual==='walkPark'&&moveTo(a,dt)){a.visual=a.desired;a.target=null}
 else if(a.visual==='walkDead'&&moveTo(a,dt)){a.visual='falling';a.fall=.45;a.target=null}
 else if(a.visual==='falling'){a.fall-=dt;a.y+=34*dt;if(a.fall<=0)a.visual='dead'}
 else if(a.visual==='wander'&&moveTo(a,dt)){a.visual='assignable';a.target=null}
 else if(a.visual==='assignable'){
  a.x+=a.vx*dt;a.y+=a.vy*dt;
  if(Math.random()<dt*.12){a.vx=rnd(-13,13);a.vy=rnd(-10,10)}
  if(a.x<30||a.x>W*.64)a.vx*=-1;if(a.y<145||a.y>H-30)a.vy*=-1;
 }
 if(a.visual==='working'&&Math.random()<dt*1.5)sparks.push({x:a.x+rnd(-6,6),y:a.y-8,vx:rnd(-10,10),vy:rnd(-25,-9),life:rnd(.25,.5),color:a.color});
}
function rect(s,fill,stroke){ctx.fillStyle=fill;ctx.fillRect(s.x,s.y,s.w,s.h);ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.strokeRect(s.x+.5,s.y+.5,s.w-1,s.h-1)}
function text(txt,x,y,size=8,color='#706b63',align='left'){ctx.fillStyle=color;ctx.font='900 '+size+'px ui-monospace,SFMono-Regular,Menlo,monospace';ctx.textAlign=align;ctx.textBaseline='top';ctx.fillText(String(txt).slice(0,28),x,y)}
function drawStation(s,t){
 if(s.kind==='pool'){rect(s,'#070707','#555047');ctx.fillStyle='#26231f';for(let i=0;i<5;i++)ctx.fillRect(s.x+10+i*(s.w-20)/5,s.y+27,(s.w-28)/6,4)}
 else{rect(s,'#10100e','#454138')}
 text(s.name.toUpperCase(),s.x+8,s.y+8,Math.max(6,Math.min(9,W/120)),'#b0aaa0');
 if(s.kind==='forge'){for(let i=0;i<4;i++){const x=s.x+14+i*(s.w-28)/4;ctx.fillStyle='#25221d';ctx.fillRect(x,s.y+34,8,s.h-48);ctx.fillStyle='#ff6500';ctx.fillRect(x+3,s.y+38,2,s.h-56)}}
 if(s.kind==='reserve'){for(let i=0;i<5;i++){ctx.fillStyle=i%2?'#2b2822':'#1c1a16';ctx.fillRect(s.x+12+i*(s.w-24)/5,s.y+38,(s.w-32)/7,s.h-54)}}
 if(s.kind==='guide'){ctx.strokeStyle='#38342e';for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(s.x+12,s.y+38+i*22);ctx.lineTo(s.x+s.w-12,s.y+38+i*22);ctx.stroke()}}
 if(s.kind==='monitor'){ctx.fillStyle='#171613';ctx.fillRect(s.x+12,s.y+34,s.w-24,s.h-48);ctx.strokeStyle='#4b4740';ctx.beginPath();for(let i=0;i<7;i++){const x=s.x+16+i*(s.w-32)/6,y=s.y+s.h-24-Math.sin(i*.8+t*.001)*Math.min(26,s.h*.22);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}
 if(s.kind==='park'){ctx.fillStyle='#171613';for(let i=0;i<3;i++)ctx.fillRect(s.x+12,s.y+36+i*24,s.w-24,5)}
}
function drawSprite(a,t,scale){
 const rows=RAW[a.shape],sz=scale||Math.max(2,Math.floor(Math.min(W,H)/290)),w=N*sz,h=N*sz,x0=Math.round(a.x-w/2),y0=Math.round(a.y-h/2+(a.visual==='working'?(Math.floor(t/180+a.i)%2):0));
 let col=a.color;if(a.visual==='silent')col='#6a665f';if(a.visual==='dead')col='#3d3a35';if(a.visual==='falling')col='#777169';
 ctx.fillStyle=col;
 for(let y=0;y<N;y++){const row=rows[y]||0;for(let x=0;x<N;x++)if(row&(1<<(N-1-x)))ctx.fillRect(x0+x*sz,y0+y*sz,sz,sz)}
 if(a.visual==='working'){ctx.fillStyle='#ff6500';const f=(Math.floor(t/160+a.i)%2);ctx.fillRect(x0+w+2,y0+5+f*4,3,7)}
 if(selected===a.code){ctx.strokeStyle='#f0eadf';ctx.strokeRect(x0-4,y0-4,w+8,h+8)}
}
function drawWorld(t){
 ctx.fillStyle='#090908';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#14130f';for(let x=0;x<W;x+=28){ctx.beginPath();ctx.moveTo(x+.5,62);ctx.lineTo(x+.5,H);ctx.stroke()}for(let y=62;y<H;y+=28){ctx.beginPath();ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5);ctx.stroke()}
 ctx.fillStyle='#0d0d0b';ctx.fillRect(W*.04,120,W*.59,H-150);ctx.strokeStyle='#27241f';ctx.setLineDash([5,6]);ctx.strokeRect(W*.04+.5,120.5,W*.59-1,H-151);ctx.setLineDash([]);
 for(const s of stations)drawStation(s,t);
 const ordered=[...agents].sort((a,b)=>(a.visual==='dead'?0:1)-(b.visual==='dead'?0:1));for(const a of ordered)drawSprite(a,t);
 for(const sp of sparks){ctx.fillStyle=sp.color;ctx.fillRect(sp.x,sp.y,2,2)}
}
function topWorkers(){
 return [...agents].sort((a,b)=>scoreOf(b.w)-scoreOf(a.w)).slice(0,6)
}
function drawRace(t){
 ctx.fillStyle='#090908';ctx.fillRect(0,0,W,H);
 const top=topWorkers(),left=Math.max(42,W*.08),right=W-30,topY=135,bottom=H-65;
 text('MEJORES WORKERS · PRODUCCIÓN ACUMULADA',left,104,9,'#f0eadf');
 ctx.strokeStyle='#2a2722';for(let i=0;i<5;i++){const y=topY+i*(bottom-topY)/4;ctx.beginPath();ctx.moveTo(left,y+.5);ctx.lineTo(right,y+.5);ctx.stroke()}
 const max=Math.max(1,...top.map(a=>scoreOf(a.w)));
 top.forEach((a,idx)=>{
   const base=scoreOf(a.w)/max,pts=14;ctx.strokeStyle=a.color;ctx.lineWidth=2;ctx.beginPath();
   for(let i=0;i<pts;i++){const x=left+i*(right-left)/12,y=bottom-(bottom-topY)*(base*(.16+.84*i/(pts-1)))*(1+Math.sin(i*.9+idx)*.04);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();
   const y=topY+idx*22;drawSprite({...a,x:left+11,y:y+5,visual:'assignable'},t,1);text(a.code,left+30,y,7,a.color);text(String(scoreOf(a.w)),right,y,7,a.color,'right')
 });
}
function updateSparks(dt){for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.life-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=60*dt;if(s.life<=0)sparks.splice(i,1)}}
function hit(x,y){let best=null,bd=1e9;for(const a of agents){const d=(a.x-x)*(a.x-x)+(a.y-y)*(a.y-y);if(d<bd&&d<900){best=a;bd=d}}return best}
function stationHit(x,y){return stations.find(s=>x>=s.x&&x<=s.x+s.w&&y>=s.y&&y<=s.y+s.h)}
function panelWorker(a){
 selected=a.code;$('panelTitle').textContent=a.code;$('panelBody').innerHTML='<div class="row"><span>Estado</span><strong>'+a.desired.toUpperCase()+'</strong></div><div class="row"><span>Trabajo</span><strong>'+safe(a.w.current_job||a.w.unit||a.w.assignment||a.w.target,'—')+'</strong></div><div class="row"><span>Outputs</span><strong>'+safe(a.w.outputs_done,0)+'</strong></div><div class="row"><span>Palabras</span><strong>'+safe(a.w.words_done,0)+'</strong></div><div class="row"><span>Proyecto</span><strong>'+stationFor(a).name+'</strong></div>';$('panel').classList.add('show')
}
function panelStation(s){
 selected=null;$('panelTitle').textContent=s.name;$('panelBody').innerHTML='<div class="row"><span>Zona</span><strong>'+s.kind.toUpperCase()+'</strong></div><div class="row"><span>Workers</span><strong>'+agents.filter(a=>stationFor(a)===s).length+'</strong></div><div class="row"><span>Lectura</span><strong>'+((summary&&(summary.guide_headline||summary.guide_summary))||'Sector visual del runtime')+'</strong></div>';$('panel').classList.add('show')
}
c.addEventListener('pointerdown',e=>{if(mode!=='world')return;const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,a=hit(x,y);if(a){panelWorker(a);return}const s=stationHit(x,y);if(s)panelStation(s)});
$('close').onclick=()=>{$('panel').classList.remove('show');selected=null};
$('worldBtn').onclick=()=>{mode='world';$('worldBtn').classList.add('on');$('raceBtn').classList.remove('on')};
$('raceBtn').onclick=()=>{mode='race';$('raceBtn').classList.add('on');$('worldBtn').classList.remove('on');$('panel').classList.remove('show');selected=null};
async function tick(){
 const [m,w,p,o,l]=await Promise.all([get('prometeo_control_minimal?select=*'),get('prometeo_control_workers?select=*&order=joined_at.asc&limit=100'),get('prometeo_control_projects?select=*&order=created_at.desc&limit=12'),get('prometeo_control_outputs?select=worker_code,word_count,published_at&order=published_at.desc&limit=500'),get('prometeo_control_worker_liveness?select=*&order=worker_code.asc&limit=300')]);
 summary=m[0]||summary;workers=w;projects=p;outputs=o;liveness=l;layoutStations();syncAgents();
 const liveN=agents.filter(a=>a.desired!=='dead').length,deadN=agents.filter(a=>a.desired==='dead').length,workN=agents.filter(a=>a.desired==='working').length;
 $('live').textContent=liveN;$('morgue').textContent=deadN;
 $('workPct').textContent=summary&&summary.batch_work_pct!==undefined?Number(summary.batch_work_pct).toFixed(0)+'%':(agents.length?Math.round(workN/agents.length*100)+'%':'—');
 $('eta').textContent=summary&&summary.eta?summary.eta:(summary&&summary.latest_batch?summary.latest_batch:'—');
 $('sub').textContent=(demo?'demo visual':'datos vivos')+' · '+agents.length+' entidades';
 $('status').textContent=demo?'demo':'vivo · '+new Date().toLocaleTimeString();
}
function frame(t){
 const dt=Math.min(.034,(t-last)/1000||0);last=t;if(mode==='world'){for(const a of agents)update(a,dt,t);updateSparks(dt);drawWorld(t)}else drawRace(t);requestAnimationFrame(frame)
}
addEventListener('resize',resize,{passive:true});resize();syncAgents();tick();setInterval(tick,4500);requestAnimationFrame(frame);
})();
</script>
</body>
