<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#030503">
<title>Prometeo · Rail World V10</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
body{font-family:Inter,ui-sans-serif,system-ui,sans-serif}
#shell{position:fixed;inset:0;display:grid;place-items:center;background:#000}
#stage{position:relative;width:min(100vw,177.777vh);height:min(56.25vw,100vh);overflow:hidden;background:#020402;touch-action:none;isolation:isolate}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;background:#020402;touch-action:none}
#veil{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 58%,transparent 34%,rgba(0,0,0,.17) 60%,rgba(0,0,0,.86) 100%);box-shadow:inset 0 0 8vw rgba(0,0,0,.56)}
#grain{position:absolute;inset:-4%;pointer-events:none;opacity:.05;mix-blend-mode:screen;background-image:radial-gradient(circle at 19% 23%,rgba(221,196,144,.18) 0 .55px,transparent .8px),radial-gradient(circle at 63% 71%,rgba(221,196,144,.11) 0 .55px,transparent .8px);background-size:11px 13px,17px 19px}
#hud{position:absolute;inset:0;pointer-events:none;color:#c9b990;text-shadow:0 1px #000}
#sceneName{position:absolute;left:12px;top:11px;font:900 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;opacity:.58}
#mode{position:absolute;right:12px;top:11px;font:800 7px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-align:right;opacity:.42}
#hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);white-space:nowrap;font:800 7px/1 system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;opacity:.31}
#debug{display:none;position:absolute;right:8px;top:34px;padding:6px 7px;background:rgba(0,0,0,.58);font:700 7px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
body.debug #debug{display:block}
#loading{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:#020402;color:#6f705f;font:900 9px/1 system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;transition:opacity .3s ease}
#loading.off{opacity:0;pointer-events:none}
#flash{position:absolute;inset:0;z-index:15;background:#050504;opacity:0;pointer-events:none;transition:opacity .16s ease}
#flash.on{opacity:.96}
#orientation{display:none;position:fixed;inset:0;z-index:99;background:#020202;color:#69655b;place-items:center;text-align:center;font:900 10px/1.5 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase}
body.review #hud{display:none}
@media(max-width:680px) and (orientation:portrait){#orientation{display:grid}}
</style>
</head>
<body>
<div id="shell"><div id="stage">
  <canvas id="scene" aria-label="Prometeo Rail World V10"></canvas>
  <div id="veil"></div><div id="grain"></div>
  <div id="hud"><div id="sceneName"></div><div id="mode"></div><div id="hint">click = caminar · scroll = acercar/alejar · cartel = mirar</div><div id="debug"></div></div>
  <div id="flash"></div><div id="loading">construyendo mundo</div>
</div></div>
<div id="orientation">giralo horizontalmente</div>
<script>
(()=>{
"use strict";

const canvas=document.getElementById("scene");
const ctx=canvas.getContext("2d",{alpha:false});
const stage=document.getElementById("stage");
const loading=document.getElementById("loading");
const flash=document.getElementById("flash");
const sceneNameEl=document.getElementById("sceneName");
const modeEl=document.getElementById("mode");
const debugEl=document.getElementById("debug");

const TAU=Math.PI*2,NEAR=.32,CAMERA_H=1.72;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const hypot=(a,b)=>Math.hypot(a,b);
const wrapAngle=a=>{while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a};
const angleDamp=(a,b,k)=>a+wrapAngle(b-a)*k;
const q=new URLSearchParams(location.search);
const REVIEW=q.get("review")==="1";
if(REVIEW)document.body.classList.add("review");
if(q.get("debug")==="1")document.body.classList.add("debug");

let W=800,H=450,F=330,HORIZON=.47;
function resize(){
  const r=stage.getBoundingClientRect();
  W=Math.max(480,Math.round(r.width));
  H=Math.max(270,Math.round(r.height));
  canvas.width=W;canvas.height=H;
  F=Math.min(W,H*1.777)*.58;
}
addEventListener("resize",resize,{passive:true});resize();

const ASSET_URLS={
  wall:"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/Dark_green_grey_flecked_speckled_spotted_clean_marble_cemented_building_wall_square_checkered_tile_texture.jpg/1024px-Dark_green_grey_flecked_speckled_spotted_clean_marble_cemented_building_wall_square_checkered_tile_texture.jpg",
  floor:"https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Green_mosaic_square_seamless_tiled_floor_texture.jpg/1280px-Green_mosaic_square_seamless_tiled_floor_texture.jpg",
  stone:"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Stone_Wall_Texture.jpg/1280px-Stone_Wall_Texture.jpg",
  avatar:"../../strategy/mask-mouth/assets/mask-transparent.webp",
  arcos:"../prometeo-rail-world-v1/review/arcos-network.png",
  calzada:"../prometeo-rail-world-v1/review/calzada-network.png",
  tunel:"../prometeo-rail-world-v1/review/tunel-network.png",
  torres:"../prometeo-rail-world-v1/review/torres-network.png"
};
const assets={};
function loadAsset(k,u){return new Promise(resolve=>{const im=new Image();im.decoding="async";if(/^https?:/.test(u))im.crossOrigin="anonymous";im.onload=()=>{assets[k]=im;resolve(true)};im.onerror=()=>{assets[k]=null;resolve(false)};im.src=u})}

const SCENE_IDS=["ARCOS","CALZADA","TUNEL","TORRES","MUSEO"];
const SCENE_META={
  ARCOS:{label:"ARCOS",sky:["#010302","#071008","#000100"],accent:[116,139,84]},
  CALZADA:{label:"CALZADA",sky:["#020104","#10071a","#000001"],accent:[111,89,150]},
  TUNEL:{label:"TÚNEL",sky:["#070503","#171008","#010101"],accent:[139,103,68]},
  TORRES:{label:"TORRES",sky:["#02060a","#091522","#010203"],accent:[67,109,128]},
  MUSEO:{label:"MUSEO DE MAPAS",sky:["#050403","#15110b","#010101"],accent:[151,126,76]}
};

function sceneDestinations(id){
  const others=SCENE_IDS.filter(x=>x!==id);
  if(id!=="MUSEO"&&others.includes("MUSEO")){
    return others.filter(x=>x!=="MUSEO").slice(0,3).concat("MUSEO");
  }
  return others;
}
function makeGraph(sceneId){
  const nodes=new Map(),edges=[],gates=[],junctions=new Set();
  const add=(id,x,z,meta={})=>{nodes.set(id,{id,x,z,neighbors:[],...meta});return id};
  const link=(a,b,kind="path")=>{nodes.get(a).neighbors.push(b);nodes.get(b).neighbors.push(a);edges.push({a,b,kind})};
  const chain=(prefix,startId,pts,kind="path",endMeta={})=>{
    let prev=startId,last=startId;
    pts.forEach((p,i)=>{
      const id=prefix+"_"+i;
      add(id,p.x,p.z,i===pts.length-1?endMeta:{});
      link(prev,id,kind);prev=id;last=id;
    });
    return last;
  };
  const linePts=(a,b,n)=>Array.from({length:n},(_,i)=>({x:lerp(a.x,b.x,(i+1)/n),z:lerp(a.z,b.z,(i+1)/n)}));
  const bezierPts=(a,c,b,n)=>Array.from({length:n},(_,i)=>{const t=(i+1)/n,u=1-t;return{x:u*u*a.x+2*u*t*c.x+t*t*b.x,z:u*u*a.z+2*u*t*c.z+t*t*b.z}});
  add("entry",0,0,{entry:true});
  const j1={x:0,z:34},j2={x:0,z:62};
  chain("spineA","entry",linePts({x:0,z:0},j1,8),"spine",{junction:true});
  const j1id="spineA_7";junctions.add(j1id);
  chain("spineB",j1id,linePts(j1,j2,7),"spine",{junction:true});
  const j2id="spineB_6";junctions.add(j2id);
  const dests=sceneDestinations(sceneId);
  const defs=[
    {j:j1id,start:j1,end:{x:-25,z:55},ctrl:{x:-9,z:43}},
    {j:j1id,start:j1,end:{x:25,z:55},ctrl:{x:9,z:43}},
    {j:j2id,start:j2,end:{x:-29,z:90},ctrl:{x:-12,z:75}},
    {j:j2id,start:j2,end:{x:31,z:92},ctrl:{x:15,z:74}}
  ];
  defs.forEach((d,i)=>{
    const dest=dests[i];
    const kind=dest==="MUSEO"?"museum":"branch";
    const endId=chain("b"+i,d.j,bezierPts(d.start,d.ctrl,d.end,10),kind,{gate:true,destination:dest});
    gates.push({nodeId:endId,destination:dest,kind});
  });
  if(sceneId==="MUSEO"){
    const a=chain("galleryL",j1id,bezierPts(j1,{x:-7,z:51},{x:-13,z:68},7),"gallery");
    const b=chain("galleryR",j2id,bezierPts(j2,{x:8,z:73},{x:13,z:83},6),"gallery");
    link(a,b,"gallery");
  }
  return{nodes,edges,gates,junctions};
}

let sceneId=q.get("scene")?.toUpperCase();
if(!SCENE_IDS.includes(sceneId))sceneId="ARCOS";
let graph=makeGraph(sceneId);

const camera={x:Number(q.get("cx")||0),z:Number(q.get("cz")||-5),yaw:Number(q.get("yaw")||0),targetYaw:Number(q.get("yaw")||0),moveVelocity:0};
const player={x:Number(q.get("px")||0),z:Number(q.get("pz")||4),heading:0,currentNode:"entry",route:[],segment:null,moving:false,targetNode:null,walkPhase:0};
const state={
  ready:false,transitioning:false,activeGate:null,lastTurn:null,sceneChanges:0,clickPulse:null,
  manualCameraUntil:0,autoFollowMoves:0,cameraMode:"IDLE_COMPOSITION",
  routeBaseYaw:camera.yaw,manualYawOffset:0,routeAlignUntil:0,
  directedView:null,cameraSettles:0,directedViews:0,
  turnCamera:null,turnTransitions:0,lastTurnKey:null
};
const renderStats={faces:0,boxes:0,paths:0,avatarVisible:false,avatarDepth:null,scene:sceneId};

function nearestNode(x,z){
  let best=null,bd=Infinity;
  for(const n of graph.nodes.values()){
    const d=hypot(n.x-x,n.z-z);
    if(d<bd){bd=d;best=n}
  }
  return best;
}
function bfs(startId,targetId){
  if(startId===targetId)return[];
  const queue=[startId],prev=new Map([[startId,null]]);
  while(queue.length){
    const id=queue.shift();
    for(const nb of graph.nodes.get(id).neighbors){
      if(prev.has(nb))continue;
      prev.set(nb,id);
      if(nb===targetId){
        const out=[];let k=targetId;
        while(k&&k!==startId){out.push(k);k=prev.get(k)}
        return out.reverse();
      }
      queue.push(nb);
    }
  }
  return[];
}
function routeHeadingFrom(startId,route){
  if(!route.length)return player.heading||camera.yaw;
  const a=graph.nodes.get(startId),b=graph.nodes.get(route[0]);
  return a&&b?Math.atan2(b.x-a.x,b.z-a.z):(player.heading||camera.yaw);
}
function queueTurnCamera(turn){
  if(!turn||state.directedView)return false;
  const key=turn.key||("turn@"+turn.pivotX.toFixed(2)+","+turn.pivotZ.toFixed(2));
  if(key===state.lastTurnKey||state.turnCamera?.key===key)return false;
  const back=.35;
  const anchorX=turn.pivotX-Math.sin(turn.incomingYaw)*back;
  const anchorZ=turn.pivotZ-Math.cos(turn.incomingYaw)*back;
  state.turnCamera={
    key,phase:"APPROACH",
    pivotX:turn.pivotX,pivotZ:turn.pivotZ,
    anchorX,anchorZ,
    incomingYaw:turn.incomingYaw,outgoingYaw:turn.outgoingYaw
  };
  state.manualYawOffset=0;
  state.cameraMode="TURN_APPROACH";
  camera.targetYaw=turn.incomingYaw;
  state.turnTransitions++;
  return true;
}
function upcomingTurn(maxDistance=18){
  const pts=[{id:"player",x:player.x,z:player.z}];
  if(player.segment)pts.push({id:player.segment.id,x:player.segment.ex,z:player.segment.ez});
  for(const id of player.route.slice(0,6)){
    const n=graph.nodes.get(id);if(n)pts.push({id,x:n.x,z:n.z});
  }
  if(pts.length<3)return null;
  let walked=0;
  for(let i=1;i<pts.length-1;i++){
    const prev=pts[i-1],pivot=pts[i],next=pts[i+1];
    walked+=hypot(pivot.x-prev.x,pivot.z-prev.z);
    const incomingYaw=Math.atan2(pivot.x-prev.x,pivot.z-prev.z);
    const outgoingYaw=Math.atan2(next.x-pivot.x,next.z-pivot.z);
    const delta=Math.abs(wrapAngle(outgoingYaw-incomingYaw));
    if(delta>.18&&walked<=maxDistance){
      return{key:pivot.id+"→"+next.id,pivotX:pivot.x,pivotZ:pivot.z,incomingYaw,outgoingYaw,distance:walked};
    }
  }
  return null;
}
function maybePrepareTurnCamera(){
  if(!player.moving||state.turnCamera||state.directedView)return;
  const turn=upcomingTurn(18);
  if(turn)queueTurnCamera(turn);
}
function beginRouteComposition(startId,route){
  state.directedView=null;
  state.turnCamera=null;
  state.manualYawOffset=0;
  const nextYaw=routeHeadingFrom(startId,route);
  const delta=Math.abs(wrapAngle(nextYaw-state.routeBaseYaw));
  if(delta>.18){
    queueTurnCamera({
      key:startId+"→"+(route[0]||"route"),
      pivotX:player.x,pivotZ:player.z,
      incomingYaw:state.routeBaseYaw,outgoingYaw:nextYaw
    });
    return;
  }
  state.routeBaseYaw=nextYaw;
  camera.targetYaw=state.routeBaseYaw;
  state.routeAlignUntil=performance.now()+520;
  state.cameraMode="ROUTE_ALIGN";
}
function planToNode(targetId){
  const start=nearestNode(player.x,player.z);
  if(!start||!graph.nodes.has(targetId))return false;
  player.currentNode=start.id;player.segment=null;player.route=bfs(start.id,targetId);player.targetNode=targetId;player.moving=player.route.length>0;
  if(player.moving)beginRouteComposition(start.id,player.route);
  return player.moving;
}
function routeToGate(destination){
  const g=graph.gates.find(x=>x.destination===destination);
  return g?planToNode(g.nodeId):false;
}
function startNextPlayerSegment(){
  if(player.segment||!player.route.length)return;
  const id=player.route.shift(),n=graph.nodes.get(id);
  const dx=n.x-player.x,dz=n.z-player.z,dist=Math.max(.001,hypot(dx,dz));
  const previousHeading=player.heading||state.routeBaseYaw;
  const heading=Math.atan2(dx,dz);
  player.segment={id,sx:player.x,sz:player.z,ex:n.x,ez:n.z,t:0,dist,heading};
  player.heading=heading;
  const nearJunction=graph.junctions.has(player.currentNode)||graph.junctions.has(id);
  if(nearJunction&&Math.abs(wrapAngle(previousHeading-heading))>.12){
    state.lastTurn={from:player.currentNode,to:id,yaw:heading,at:performance.now()};
    if(!state.turnCamera){
      queueTurnCamera({
        key:player.currentNode+"→"+id,
        pivotX:player.x,pivotZ:player.z,
        incomingYaw:previousHeading,outgoingYaw:heading
      });
    }
  }
}
function updatePlayer(dt){
  startNextPlayerSegment();
  if(!player.segment){player.moving=false;return}
  player.moving=true;
  const s=player.segment;
  s.t=clamp(s.t+13.5*dt/s.dist,0,1);
  const u=s.t*s.t*(3-2*s.t);
  player.x=lerp(s.sx,s.ex,u);player.z=lerp(s.sz,s.ez,u);player.walkPhase+=dt*8.5;
  if(s.t>=1){player.x=s.ex;player.z=s.ez;player.currentNode=s.id;player.segment=null;if(!player.route.length)player.moving=false}
}
function updateActiveGate(){
  let best=null,bd=Infinity;
  for(const g of graph.gates){
    const n=graph.nodes.get(g.nodeId),d=hypot(n.x-player.x,n.z-player.z);
    if(d<bd){bd=d;best=g}
  }
  state.activeGate=best&&bd<3.25?best.destination:null;
}

function worldToCamera(p){
  const dx=p.x-camera.x,dz=p.z-camera.z,c=Math.cos(camera.yaw),s=Math.sin(camera.yaw);
  return{x:dx*c-dz*s,y:(p.y||0)-CAMERA_H,z:dx*s+dz*c,u:p.u||0,v:p.v||0};
}
function projectCam(p){const f=F/p.z;return{x:W*.5+p.x*f,y:H*HORIZON-p.y*f,z:p.z,f}}
function clipNear(poly){
  const out=[];
  for(let i=0;i<poly.length;i++){
    const a=poly[i],b=poly[(i+1)%poly.length],ain=a.z>=NEAR,bin=b.z>=NEAR;
    if(ain)out.push(a);
    if(ain!==bin){
      const t=(NEAR-a.z)/(b.z-a.z);
      out.push({x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t),z:NEAR,u:lerp(a.u,b.u,t),v:lerp(a.v,b.v,t)});
    }
  }
  return out;
}
function texTri(img,p0,p1,p2,uv0,uv1,uv2,alpha){
  if(!img)return;
  const den=uv0.x*(uv1.y-uv2.y)+uv1.x*(uv2.y-uv0.y)+uv2.x*(uv0.y-uv1.y);
  if(Math.abs(den)<.001)return;
  const a=(p0.x*(uv1.y-uv2.y)+p1.x*(uv2.y-uv0.y)+p2.x*(uv0.y-uv1.y))/den;
  const c=(p0.x*(uv2.x-uv1.x)+p1.x*(uv0.x-uv2.x)+p2.x*(uv1.x-uv0.x))/den;
  const e=(p0.x*(uv1.x*uv2.y-uv2.x*uv1.y)+p1.x*(uv2.x*uv0.y-uv0.x*uv2.y)+p2.x*(uv0.x*uv1.y-uv1.x*uv0.y))/den;
  const b=(p0.y*(uv1.y-uv2.y)+p1.y*(uv2.y-uv0.y)+p2.y*(uv0.y-uv1.y))/den;
  const d=(p0.y*(uv2.x-uv1.x)+p1.y*(uv0.x-uv2.x)+p2.y*(uv1.x-uv0.x))/den;
  const fy=(p0.y*(uv1.x*uv2.y-uv2.x*uv1.y)+p1.y*(uv2.x*uv0.y-uv0.x*uv2.y)+p2.y*(uv0.x*uv1.y-uv1.x*uv0.y))/den;
  ctx.save();ctx.globalAlpha=alpha;ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.closePath();ctx.clip();
  ctx.setTransform(a,b,c,d,e,fy);ctx.drawImage(img,0,0);ctx.restore();
}
function projectedPoly(points){
  let poly=points.map(worldToCamera);poly=clipNear(poly);if(poly.length<3)return null;
  return{cam:poly,screen:poly.map(projectCam),depth:poly.reduce((s,p)=>s+p.z,0)/poly.length};
}
function solidPoly(points,color,alpha=1){
  const p=projectedPoly(points);if(!p)return;
  ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(p.screen[0].x,p.screen[0].y);
  for(let i=1;i<p.screen.length;i++)ctx.lineTo(p.screen[i].x,p.screen[i].y);ctx.closePath();ctx.fill();ctx.restore();
}
function texturedPoly(points,img,alpha=1,tint=null,tintAlpha=0){
  let poly=points.map((p,i)=>worldToCamera({...p,u:(i===1||i===2)?(img?.width||1):0,v:(i>=2)?(img?.height||1):0}));
  poly=clipNear(poly);if(poly.length<3)return;
  const pp=poly.map(projectCam);
  if(img)for(let i=1;i<poly.length-1;i++)texTri(img,pp[0],pp[i],pp[i+1],{x:poly[0].u,y:poly[0].v},{x:poly[i].u,y:poly[i].v},{x:poly[i+1].u,y:poly[i+1].v},alpha);
  if(tint){
    ctx.save();ctx.globalAlpha=img?tintAlpha:Math.max(.35,alpha);ctx.fillStyle=tint;ctx.beginPath();ctx.moveTo(pp[0].x,pp[0].y);for(let i=1;i<pp.length;i++)ctx.lineTo(pp[i].x,pp[i].y);ctx.closePath();ctx.fill();ctx.restore();
  }
}
function rotateXZ(x,z,yaw){const c=Math.cos(yaw),s=Math.sin(yaw);return{x:x*c+z*s,z:-x*s+z*c}}
function boxFaces(o){
  const hw=o.w/2,hd=o.d/2,y0=o.y||0,y1=y0+o.h;
  const corner=(x,y,z)=>{const r=rotateXZ(x,z,o.yaw||0);return{x:o.x+r.x,y,z:o.z+r.z}};
  const p={flb:corner(-hw,y0,-hd),frb:corner(hw,y0,-hd),blb:corner(-hw,y0,hd),brb:corner(hw,y0,hd),flt:corner(-hw,y1,-hd),frt:corner(hw,y1,-hd),blt:corner(-hw,y1,hd),brt:corner(hw,y1,hd)};
  const norms=[
    {n:rotateXZ(0,-1,o.yaw||0),pts:[p.flt,p.frt,p.frb,p.flb],shade:1},
    {n:rotateXZ(0,1,o.yaw||0),pts:[p.brt,p.blt,p.blb,p.brb],shade:.52},
    {n:rotateXZ(-1,0,o.yaw||0),pts:[p.blt,p.flt,p.flb,p.blb],shade:.68},
    {n:rotateXZ(1,0,o.yaw||0),pts:[p.frt,p.brt,p.brb,p.frb],shade:.78}
  ];
  const out=[];
  for(const f of norms){
    const center=f.pts.reduce((a,v)=>({x:a.x+v.x/4,z:a.z+v.z/4}),{x:0,z:0}),vx=camera.x-center.x,vz=camera.z-center.z;

      const pc=worldToCamera({x:player.x,y:0,z:player.z});
      if(state.cameraMode==="IDLE_COMPOSITION"&&(pc.z>17.0||pc.z<5.6))state.cameraMode="FOLLOW_CATCHUP";
      if(state.cameraMode==="FOLLOW_CATCHUP"){
        const desiredDepth=11.2;
        const err=pc.z-desiredDepth;
        if(Math.abs(err)<1.15){
          state.cameraMode="IDLE_COMPOSITION";
          state.cameraSettles++;
        }else{
          const autoForward=clamp(err*1.5,-14,16)*dt;
          camera.x=clamp(camera.x+Math.sin(camera.yaw)*autoForward,-44,44);
          camera.z=clamp(camera.z+Math.cos(camera.yaw)*autoForward,-12,106);
          state.autoFollowMoves++;
        }
      }
    }
  }
  render(now);
  sceneNameEl.textContent=SCENE_META[sceneId].label+" · V10";
  modeEl.textContent=state.cameraMode.replaceAll("_"," ")+" · "+(camera.yaw*180/Math.PI).toFixed(0)+"°\\n"+(state.activeGate?"ACCESO "+state.activeGate:"COMPOSICIÓN");
  debugEl.textContent="scene "+sceneId+"\\ncamera "+camera.x.toFixed(1)+", "+camera.z.toFixed(1)+" yaw "+(camera.yaw*180/Math.PI).toFixed(1)+"\\nplayer "+player.x.toFixed(1)+", "+player.z.toFixed(1)+" "+(player.moving?"walking":"idle")+"\\nroute "+player.route.length+" target "+(player.targetNode||"-")+"\\nactiveGate "+(state.activeGate||"-")+"\\nlastTurn "+(state.lastTurn?state.lastTurn.from+"→"+state.lastTurn.to:"-")+"\\nfaces "+renderStats.faces+" boxes "+renderStats.boxes+" paths "+renderStats.paths;
  requestAnimationFrame(update);
}
function getState(){
  return{version:"rail-world-v10-turn-handoff-camera-r1",ready:state.ready,scene:sceneId,camera:{x:camera.x,z:camera.z,yaw:camera.yaw,targetYaw:camera.targetYaw,moveVelocity:camera.moveVelocity},composition:{mode:state.cameraMode,manualOverride:performance.now()<state.manualCameraUntil,manualYawOffset:0,autoFollowMoves:state.autoFollowMoves,cameraSettles:state.cameraSettles,directedViews:state.directedViews,directed:Boolean(state.directedView),turnTransitions:state.turnTransitions,turn:state.turnCamera?{key:state.turnCamera.key,phase:state.turnCamera.phase,pivotX:state.turnCamera.pivotX,pivotZ:state.turnCamera.pivotZ,anchorX:state.turnCamera.anchorX,anchorZ:state.turnCamera.anchorZ,incomingYaw:state.turnCamera.incomingYaw,outgoingYaw:state.turnCamera.outgoingYaw}:null},player:{x:player.x,z:player.z,heading:player.heading,moving:player.moving,currentNode:player.currentNode,targetNode:player.targetNode,routeLength:player.route.length},activeGate:state.activeGate,gates:graph.gates.map(g=>({destination:g.destination,nodeId:g.nodeId,x:graph.nodes.get(g.nodeId).x,z:graph.nodes.get(g.nodeId).z})),graph:{nodes:graph.nodes.size,edges:graph.edges.length,junctions:[...graph.junctions]},lastTurn:state.lastTurn,sceneChanges:state.sceneChanges,render:{...renderStats},hasIframe:Boolean(document.querySelector("iframe")),museumPanels:sceneId==="MUSEO"?sceneObjects().filter(x=>x.type==="panel").length:0};
}
window.PrometeoRailWorldV10={
  getState,
  setScene(id){if(SCENE_IDS.includes(id)){sceneId=id;graph=makeGraph(sceneId);player.x=0;player.z=3.8;player.currentNode="entry";player.route=[];player.segment=null;camera.x=0;camera.z=-5.2;camera.yaw=camera.targetYaw=0;state.activeGate=null;state.lastTurn=null;state.directedView=null;state.turnCamera=null;state.lastTurnKey=null;state.cameraMode="IDLE_COMPOSITION";state.routeBaseYaw=0;state.manualYawOffset=0}return getState()},
  setCamera(next={}){if(Number.isFinite(+next.x))camera.x=+next.x;if(Number.isFinite(+next.z))camera.z=+next.z;if(Number.isFinite(+next.yaw)){camera.yaw=camera.targetYaw=+next.yaw;state.routeBaseYaw=+next.yaw;state.manualYawOffset=0}camera.moveVelocity=0;state.cameraMode="IDLE_COMPOSITION";state.directedView=null;state.turnCamera=null;state.lastTurnKey=null;return getState()},
  setPlayer(next={}){if(Number.isFinite(+next.x))player.x=+next.x;if(Number.isFinite(+next.z))player.z=+next.z;player.currentNode=nearestNode(player.x,player.z)?.id||"entry";player.route=[];player.segment=null;player.moving=false;updateActiveGate();return getState()},
  routeToGate(dest){routeToGate(dest);return getState()},
  routeToNode(id){planToNode(id);return getState()},
  enterActive(){if(state.activeGate)enterScene(state.activeGate);return getState()},
  clickWorld(x,z){const n=nearestNode(+x,+z);if(n)planToNode(n.id);return getState()},
  directViewAt(x,z,duration){directViewAt(+x,+z,Number.isFinite(+duration)?+duration:1300);return getState()},
  forceFrame(){render(performance.now());return getState()}
};

Promise.all(Object.entries(ASSET_URLS).map(([k,u])=>loadAsset(k,u))).then(()=>{
  applyReviewState();updateActiveGate();state.ready=true;loading.classList.add("off");
  window.PrometeoRailWorldReview={ready:true,version:"rail-world-v10-turn-handoff-camera-r1"};
  requestAnimationFrame(update);
});
})();
</script>
