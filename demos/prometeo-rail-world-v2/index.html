<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020302">
<title>Prometeo · Rail World V2</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#ddd5c5;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#shell{position:fixed;inset:0;display:grid;place-items:center;background:#000}
#stage{position:relative;width:min(100vw,177.777vh);height:min(56.25vw,100vh);overflow:hidden;background:#020302;isolation:isolate;touch-action:none;cursor:crosshair}
.railFrame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0;will-change:opacity;filter:saturate(.91) contrast(1.07) brightness(.87);pointer-events:none}
#frameA{z-index:0;opacity:1}#frameB{z-index:1}
#grade{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 66%,transparent 0 28%,rgba(0,0,0,.12) 58%,rgba(0,0,0,.43) 100%),linear-gradient(180deg,rgba(0,0,0,.05),transparent 45%,rgba(0,0,0,.18));mix-blend-mode:multiply}
#dust{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.dust{position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(224,215,179,.34);animation:drift var(--t) linear infinite;animation-delay:var(--d)}
@keyframes drift{from{transform:translate3d(0,12vh,0);opacity:0}18%{opacity:.25}to{transform:translate3d(var(--dx),-70vh,0);opacity:0}}
#target{position:absolute;z-index:5;width:28px;height:12px;border:1px solid rgba(224,205,165,.66);border-radius:50%;opacity:0;transform:translate(-50%,-50%) scale(.25);pointer-events:none;box-shadow:0 0 18px rgba(205,168,105,.16)}
#target.show{animation:ping .5s ease-out}
@keyframes ping{0%{opacity:0;transform:translate(-50%,-50%) scale(.25)}28%{opacity:.85}100%{opacity:0;transform:translate(-50%,-50%) scale(1.65)}}
#player{--s:1;position:absolute;z-index:7;width:9.2%;aspect-ratio:.62;transform:translate(-50%,-100%) scale(var(--s));transform-origin:50% 100%;will-change:left,top,transform;pointer-events:none}
#player.flip .actor{transform:scaleX(-1)}
.actor{position:absolute;inset:0;transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite}
#player.walking .actor{animation:walk .34s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6%)}}
@keyframes walk{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-3%) rotate(.7deg)}}
.shadow{position:absolute;left:50%;bottom:-1.5%;width:112%;height:13%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.72),rgba(0,0,0,.06) 68%,transparent);filter:blur(2px)}
.wings{position:absolute;z-index:0;left:50%;top:13%;width:178%;height:auto;transform:translateX(-50%) rotate(-1deg);filter:brightness(.53) saturate(.68) sepia(.18) contrast(1.15) drop-shadow(0 5px 9px rgba(0,0,0,.72));opacity:.88}
.cloak{position:absolute;z-index:1;left:10%;right:10%;bottom:1%;height:61%;clip-path:polygon(28% 0,67% 3%,82% 15%,92% 37%,85% 64%,100% 100%,63% 94%,49% 100%,29% 92%,0 100%,10% 61%,5% 32%,20% 12%);background:radial-gradient(ellipse at 47% 9%,rgba(102,78,52,.55),transparent 34%),repeating-linear-gradient(82deg,rgba(255,255,255,.016) 0 1px,transparent 1px 5px),linear-gradient(100deg,#070706 0 22%,#241e18 43%,#100e0c 61%,#050505 100%)}
.neck{position:absolute;z-index:2;left:37%;right:37%;top:23%;height:17%;background:linear-gradient(90deg,#050505,#2a231c 45%,#0b0a09)}
.eyeGlow{position:absolute;z-index:3;left:50%;top:16%;width:39%;height:18%;transform:translateX(-50%)}
.eyeGlow:before,.eyeGlow:after{content:"";position:absolute;top:45%;width:7%;aspect-ratio:1;border-radius:50%;background:#9d6c33;box-shadow:0 0 8px rgba(199,151,78,.62),0 0 20px rgba(159,112,57,.28);animation:eye 3.2s ease-in-out infinite}
.eyeGlow:before{left:20%}.eyeGlow:after{right:20%}
@keyframes eye{0%,100%{opacity:.48;transform:scale(.8)}50%{opacity:.94;transform:scale(1.05)}}
.mask{position:absolute;z-index:4;left:50%;top:2%;width:60%;height:auto;transform:translateX(-50%);filter:brightness(.78) contrast(1.18) sepia(.06) drop-shadow(0 3px 5px rgba(0,0,0,.65))}
#sign{position:absolute;z-index:6;width:11%;aspect-ratio:1.72;opacity:0;transform-origin:50% -18px;pointer-events:none;will-change:left,top,transform,opacity}
.sign-wire{position:absolute;left:50%;bottom:100%;width:1px;height:33%;background:#211b14}
.sign-board{position:absolute;inset:0;background:linear-gradient(105deg,rgba(190,116,45,.35),transparent 25% 70%,rgba(0,0,0,.3)),repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px),#6e482c;border:1px solid #352416;box-shadow:0 10px 18px rgba(0,0,0,.46);display:grid;place-items:center;text-align:center;color:#d6c7ad;font:800 clamp(6px,.66vw,12px)/1.04 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.11em}
.sign-board b{display:block;font-size:1.7em;margin-bottom:.18em}
#grain{position:absolute;inset:-50%;z-index:20;pointer-events:none;opacity:.065;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.93' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");animation:grain .28s steps(2) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(2%,-1%)}50%{transform:translate(-1%,2%)}75%{transform:translate(1%,1%)}100%{transform:translate(-2%,-1%)}}
#debug{position:absolute;z-index:30;left:10px;top:10px;color:rgba(230,221,199,.34);font:700 8px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;pointer-events:none;white-space:pre}
#orientation{display:none;position:fixed;inset:0;z-index:99;background:#020202;color:#746f65;place-items:center;text-align:center;font:700 10px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase}
@media(max-width:680px) and (orientation:portrait){#orientation{display:grid}}
.review #grain,.review .dust,.review .actor,.review .eyeGlow:before,.review .eyeGlow:after{animation:none!important}
.review #debug{display:none}
</style>
</head>
<body>
<div id="shell">
  <div id="stage" aria-label="Prometeo Rail World">
    <img id="frameA" class="railFrame" alt="">
    <img id="frameB" class="railFrame" alt="">
    <div id="grade"></div>
    <div id="dust"></div>
    <div id="target"></div>
    <div id="sign"><div class="sign-wire"></div><div class="sign-board"><span><b>04</b>ARCHIVE<br>BELOW</span></div></div>
    <div id="player"><div class="actor"><div class="shadow"></div><img class="wings" src="../../visuals/trail-lab/assets/02-wings.png" alt=""><div class="cloak"></div><div class="neck"></div><div class="eyeGlow"></div><img class="mask" src="../../strategy/mask-mouth/assets/mask-transparent.webp" alt=""></div></div>
    <div id="grain"></div>
    <div id="debug"></div>
  </div>
</div>
<div id="orientation">giralo horizontalmente</div>
<script>
(()=>{
"use strict";
const RAIL=[
  {z:8,src:"./rail/arcos-z08.png"},
  {z:14,src:"./rail/arcos-z14.png"},
  {z:20,src:"./rail/arcos-z20.png"},
  {z:26,src:"./rail/arcos-z26.png"},
  {z:32,src:"./rail/arcos-z32.png"},
  {z:38,src:"./rail/arcos-z38.png"},
  {z:44,src:"./rail/arcos-z44.png"},
  {z:50,src:"./rail/arcos-z50.png"}
];
const WORLD={minZ:10,maxZ:64,minCamZ:8,maxCamZ:50,sign:{x:.72,z:34}};
const stage=document.getElementById("stage"),a=document.getElementById("frameA"),b=document.getElementById("frameB"),playerEl=document.getElementById("player"),targetEl=document.getElementById("target"),sign=document.getElementById("sign"),debug=document.getElementById("debug"),dust=document.getElementById("dust");
let cameraZ=8,targetCameraZ=8;
let player={x:0,z:13,tx:0,tz:13};
let last=performance.now();
const PLAYER_SPEED=11.5,CAMERA_EASE=4.6;
const q=new URLSearchParams(location.search),review=q.get("review")==="1";
if(review)document.body.classList.add("review");

function makeDust(){
  const f=document.createDocumentFragment();
  for(let i=0;i<18;i++){
    const d=document.createElement("i");d.className="dust";
    d.style.left=(5+Math.random()*90)+"%";d.style.top=(22+Math.random()*72)+"%";
    d.style.setProperty("--t",(7+Math.random()*10)+"s");d.style.setProperty("--d",(-Math.random()*12)+"s");d.style.setProperty("--dx",(-18+Math.random()*36)+"vw");f.append(d);
  }
  dust.replaceChildren(f);
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function relToScreenY(rel){return 88-rel*1.62}
function screenYToRel(y){return clamp((88-y)/1.62,3.8,30)}
function corridorHalf(rel){return clamp(35-rel*.92,7.5,32)}
function projectX(worldX,rel){return 50+worldX*corridorHalf(rel)}
function scaleForRel(rel){return clamp(1.18-rel*.029,.48,1.08)}
function setRail(z){
  z=clamp(z,RAIL[0].z,RAIL[RAIL.length-1].z);
  let lo=RAIL[0],hi=RAIL[RAIL.length-1];
  for(let i=0;i<RAIL.length-1;i++){
    if(z>=RAIL[i].z&&z<=RAIL[i+1].z){lo=RAIL[i];hi=RAIL[i+1];break}
  }
  const span=Math.max(.001,hi.z-lo.z),t=clamp((z-lo.z)/span,0,1);
  if(a.dataset.src!==lo.src){a.src=lo.src;a.dataset.src=lo.src}
  if(b.dataset.src!==hi.src){b.src=hi.src;b.dataset.src=hi.src}
  a.style.opacity=String(1-t);
  b.style.opacity=String(t);
}
function renderSign(){
  const rel=WORLD.sign.z-cameraZ;
  if(rel<1.2||rel>28){sign.style.opacity="0";return}
  const y=relToScreenY(rel)-8.5;
  const x=projectX(WORLD.sign.x,rel);
  const s=clamp(1.12-rel*.025,.46,1.04);
  const op=clamp((rel-1.2)/5,0,1)*clamp((28-rel)/7,0,1);
  sign.style.left=x+"%";sign.style.top=y+"%";
  sign.style.opacity=String(op);
  sign.style.transform="translate(-50%,-50%) perspective(500px) rotateY(-9deg) rotate(3deg) scale("+s.toFixed(3)+")";
}
function render(){
  const rel=player.z-cameraZ;
  const y=clamp(relToScreenY(rel),48,87);
  const x=projectX(player.x,rel);
  playerEl.style.left=x+"%";playerEl.style.top=y+"%";
  playerEl.style.setProperty("--s",scaleForRel(rel).toFixed(3));
  setRail(cameraZ);renderSign();
  debug.textContent="PLAYER Z "+player.z.toFixed(1)+"\\nCAMERA Z "+cameraZ.toFixed(1)+"\\nREL "+rel.toFixed(1);
}
function desiredCamera(){
  const rel=player.z-cameraZ;
  let desired=cameraZ;
  if(rel>15.5)desired=player.z-12.4;
  else if(rel<5.2)desired=player.z-7.6;
  return clamp(desired,WORLD.minCamZ,WORLD.maxCamZ);
}
function pulse(x,y){
  targetEl.style.left=x+"%";targetEl.style.top=y+"%";
  targetEl.classList.remove("show");void targetEl.offsetWidth;targetEl.classList.add("show");
}
function pointerTarget(ev){
  const r=stage.getBoundingClientRect();
  const sx=(ev.clientX-r.left)/r.width*100,sy=(ev.clientY-r.top)/r.height*100;
  const rel=screenYToRel(clamp(sy,39,87));
  const z=clamp(cameraZ+rel,WORLD.minZ,WORLD.maxZ);
  const half=corridorHalf(rel);
  const x=clamp((sx-50)/half,-.95,.95);
  return{x,z,sx:projectX(x,rel),sy:relToScreenY(rel)};
}
stage.addEventListener("pointerdown",ev=>{
  if(ev.button!==undefined&&ev.button!==0)return;
  const t=pointerTarget(ev);
  player.tx=t.x;player.tz=t.z;
  playerEl.classList.toggle("flip",t.x<player.x);
  playerEl.classList.add("walking");
  pulse(t.sx,t.sy);
});
function step(now){
  const dt=Math.min(.04,(now-last)/1000);last=now;
  const dx=player.tx-player.x,dz=player.tz-player.z;
  const dist=Math.hypot(dx*10,dz);
  if(dist>.04){
    const m=Math.min(dist,PLAYER_SPEED*dt);
    player.x+=dx/dist*m/10;
    player.z+=dz/dist*m;
  }else{
    player.x=player.tx;player.z=player.tz;playerEl.classList.remove("walking");
  }
  targetCameraZ=desiredCamera();
  const alpha=1-Math.exp(-CAMERA_EASE*dt);
  cameraZ+=(targetCameraZ-cameraZ)*alpha;
  render();requestAnimationFrame(step);
}
const preload=RAIL.map(f=>new Promise(res=>{const im=new Image();im.onload=im.onerror=res;im.src=f.src}));
Promise.all(preload.concat([
  document.querySelector(".mask").decode().catch(()=>{}),
  document.querySelector(".wings").decode().catch(()=>{})
])).then(()=>{
  const rc=Number(q.get("cameraZ")),rp=Number(q.get("playerZ")),rx=Number(q.get("playerX"));
  if(review){
    if(Number.isFinite(rc))cameraZ=targetCameraZ=clamp(rc,WORLD.minCamZ,WORLD.maxCamZ);
    if(Number.isFinite(rp))player.z=player.tz=clamp(rp,WORLD.minZ,WORLD.maxZ);
    if(Number.isFinite(rx))player.x=player.tx=clamp(rx,-.95,.95);
  }
  render();
  window.PrometeoRailWorld={ready:true,version:"v2",cameraZ,player:{x:player.x,z:player.z}};
});
makeDust();requestAnimationFrame(step);
})();
</script>
</body>
</html>
