  gl.bindBuffer(gl.ARRAY_BUFFER,postUV);gl.enableVertexAttribArray(aUV);gl.vertexAttribPointer(aUV,2,gl.FLOAT,false,0,0);
  const uni=(n,v,kind='1f')=>{const l=gl.getUniformLocation(postProgram,n);kind==='2f'?gl.uniform2f(l,v[0],v[1]):gl.uniform1f(l,v)};

  uni('u_pixel',FX_CFG.pixel);uni('u_levels',FX_CFG.levels);uni('u_dither',FX_CFG.dither);uni('u_wobble',FX_CFG.wobble);
  uni('u_chroma',FX_CFG.chroma);uni('u_grain',FX_CFG.grain);uni('u_scan',FX_CFG.scan);uni('u_vignette',FX_CFG.vignette);uni('u_poster',FX_CFG.poster);uni('u_curve',FX_CFG.curve);uni('u_roll',FX_CFG.roll);

const TAU=Math.PI*2;

const pointers=new Map(); let pinch=0;
const LAB_PARAMS=new URLSearchParams(location.search);
let COMPONENT_MODE=(LAB_PARAMS.get('mode')||'structures').toLowerCase();
const COMPONENT_SPIN=LAB_PARAMS.get('spin')!=='0';
let FX_PRESET=(LAB_PARAMS.get('fx')||'pixel').toLowerCase();
const FX_PRESETS={
  clean:{label:'limpio',pixel:1,levels:256,dither:0,wobble:0,chroma:0,grain:0,scan:0,vignette:.08,snap:0,poster:0,curve:0,roll:0},
  pixel:{label:'pixel crunch',pixel:3,levels:10,dither:.36,wobble:.0015,chroma:.0018,grain:.055,scan:.025,vignette:.25,snap:.8,poster:.10,curve:.018,roll:.002},
  psx:{label:'psx wobble',pixel:2,levels:11,dither:.50,wobble:.0045,chroma:.0024,grain:.070,scan:.02,vignette:.24,snap:2.6,poster:.08,curve:.012,roll:.003},
  dither:{label:'dither fog',pixel:2,levels:7,dither:.86,wobble:.001,chroma:.0012,grain:.035,scan:0,vignette:.34,snap:.9,poster:.17,curve:.025,roll:.001},
  tape:{label:'tape damage',pixel:2,levels:18,dither:.16,wobble:.010,chroma:.0065,grain:.11,scan:.13,vignette:.40,snap:.4,poster:.04,curve:.055,roll:.014},
  nightmare:{label:'nightmare',pixel:4,levels:6,dither:.76,wobble:.009,chroma:.008,grain:.14,scan:.07,vignette:.52,snap:2.3,poster:.32,curve:.085,roll:.010}
};
let FX_CFG=FX_PRESETS[FX_PRESET]||FX_PRESETS.pixel;
const LAB_FIXTURE='chain';
const LAB_VISUAL='component';

function modeDefaultZoom(mode){
  // One camera contract for every Component Lab mode.
  return .72;
}
zoom=modeDefaultZoom(COMPONENT_MODE);

function updateURL(){

function applyModeState(resetZoom=true){
  if(resetZoom)zoom=modeDefaultZoom(COMPONENT_MODE);

renderPicker();


const C={
 black:'#060504', deep:'#0d0b09', ink:'#17100c', red:'#a82f1c', red2:'#682016',
 ochre:'#d77a2d', amber:'#e6a253', cream:'#cbb08a', sand:'#4a3022', sand2:'#63402a',
 moss:'#27312a', moss2:'#3b493a', stone:'#4a3c34', stone2:'#644c3e', bone:'#866955'
};
const TOWER_NAMES=['ASTERION','EREBOS','HELIOS','NYX','KAIROS'];
const CUT=.05;
const torches=[]; // old stand torches removed: only tower ritual torches light the arena
const BLOCK_COLORS=['#a53b24','#c66d31','#a68a43','#506657','#3c5961','#816049','#b89a68','#6f3631','#58604d'];
const GRID_R=3,BLOCK_STEP=.78,BLOCK_H=.62;
const DIR4=[[1,0],[-1,0],[0,1],[0,-1]];
function key2(x,z){return x+','+z}
function makePattern(seed){
  const targets=new Map();
  const put=(x,z,h)=>{
    if(Math.abs(x)>GRID_R||Math.abs(z)>GRID_R||h<=0)return;
    const k=key2(x,z);targets.set(k,Math.max(targets.get(k)||0,h));
  };
  const type=seed%3;

  if(type===0){
    // SPIRE: every higher layer requires a lower neighbouring tread.
    for(let x=-GRID_R;x<=GRID_R;x++)for(let z=-GRID_R;z<=GRID_R;z++){
      const h=4-(Math.abs(x)+Math.abs(z));
      if(h>0)put(x,z,h);
    }
    put(2,1,1);put(-2,-1,1);put(1,-2,1);
  }else if(type===1){
    // TWIN PEAKS: two small towers joined by a broad walkable saddle.
    for(let x=-GRID_R;x<=GRID_R;x++)for(let z=-GRID_R;z<=GRID_R;z++){
      const d1=Math.abs(x-1)+Math.abs(z),d2=Math.abs(x+1)+Math.abs(z);
      const h=Math.max(4-d1,4-d2);
      if(h>0)put(x,z,h);
    }
    put(0,2,1);put(0,-2,1);
  }else{
    // TERRACE: a short ridge with stepped flanks and side rooms.
    for(let x=-GRID_R;x<=GRID_R;x++)for(let z=-GRID_R;z<=GRID_R;z++){
      const ridge=Math.max(0,Math.abs(x)-1);
      const h=3-(Math.abs(z)+ridge);
      if(h>0)put(x,z,h);
    }
    put(2,1,1);put(2,-1,1);put(-2,1,1);put(-2,-1,1);
  }
  return targets;
}
function newSite(i){
  const ang=.22+i*TAU/6+(hash(i,301)-.5)*.22;

    x:Math.cos(ang)*r,z:Math.sin(ang)*r,targets,
    heights:new Map(),blocks:[],blueprints:new Map(),reservations:new Map(),
    baseColor:BLOCK_COLORS[Math.floor(hash(i,303)*BLOCK_COLORS.length)],
    lastBuilt:-9999,ritual:null

}
const sites=Array.from({length:5},(_,i)=>newSite(i));
function primeShowcaseSite(site){
  for(const [k,targetH] of site.targets){

    if(filled<=0)continue;

    const h=getHeight(site,gx,gz);
    if(h>=targetH)continue;

function startNextSegment(pl){

    t:0,dist,climb:Math.abs(end.h-pl.h)>BLOCK_H*.15

function updateMovement(pl,dt){

  const s=pl.segment;
  s.t=clamp(s.t+pl.speed*dt/s.dist,0,1);
  const smooth=s.t*s.t*(3-2*s.t);
  pl.x=s.sx+(s.ex-s.sx)*smooth;
  pl.z=s.sz+(s.ez-s.sz)*smooth;
  pl.h=s.sh+(s.eh-s.sh)*smooth;

function updatePlayers(dt,now){
  for(let i=0;i<players.length;i++){
    const pl=players[i],site=sites[pl.siteIndex];
    pl.lastX=pl.x;pl.lastZ=pl.z;pl.lastH=pl.h;
    const moving=!!pl.segment||pl.path.length>0;
    const labor=!!pl.task&&(pl.task.type==='build'||pl.task.type==='design');
    const ritualBusy=!!site.ritual&&site.ritual.phase!=='complete';
    const active=moving||labor||ritualBusy;
    const delta=active?-(labor?.022:.013):.040;
    pl.energy=clamp((pl.energy==null?1:pl.energy)+dt*delta,.055,1);
    if(pl.wait>0)pl.energy=clamp(pl.energy+dt*.020,.055,1);
    if(updateRitualPlayer(pl,i,site,dt,now))continue;
    if(pl.wait>0){pl.wait=Math.max(0,pl.wait-dt);updateMovement(pl,dt);continue}
    if(!pl.task&&!pl.path.length&&!pl.segment)assignTask(pl,i);
    updateMovement(pl,dt);

    if(!pl.task||pl.path.length||pl.segment)continue;

    if(pl.task.type==='design'){
      const cand=pl.task.cand;
      if(!pl.task.started)pl.task.started=now;
      const progress=clamp((now-pl.task.started)/pl.task.duration,0,1);
      pl.jump=Math.sin(progress*Math.PI*4)*.025;
      if(progress>=1){
        const ci=Math.floor(hash(i*41+cand.gx*17+cand.y,cand.gz*29+cand.y)*BLOCK_COLORS.length);
        site.blueprints.set(cand.key,{
          cand:{...cand},designer:i,builder:null,status:'ready',
          progress:0,color:BLOCK_COLORS[ci],createdAt:now
        });
        // Keep the block/tread reservation alive for the blueprint.
        reserveCandidate(site,cand,'blueprint:'+cand.key);
        pl.task=null;pl.jump=0;pl.wait=.30+hash(i,91)*.35;
      }
    }else if(pl.task.type==='build'){
      const bp=site.blueprints.get(pl.task.bpKey);
      if(!bp){pl.task=null;pl.wait=.25;continue}
      if(!validateTask(site,bp.cand)){
        releaseCandidate(site,bp.cand);site.blueprints.delete(pl.task.bpKey);
        pl.task=null;pl.wait=.30;continue;
      }
      if(!pl.task.started){
        pl.task.started=now;bp.status='building';bp.progress=.02;
      }
      bp.progress=clamp((now-pl.task.started)/pl.task.duration,0,1);
      pl.jump=.035+Math.sin(bp.progress*Math.PI*8)*.030;
      if(bp.progress>=1){
        const ok=placeTaskBlock(site,bp.cand,bp.color,now);
        releaseCandidate(site,bp.cand);
        site.blueprints.delete(pl.task.bpKey);
        pl.task=null;pl.jump=0;pl.wait=.36+hash(i,Math.floor(now/1000))*.40;
        if(!ok)pl.wait=.55;
      }
    }else if(pl.task.type==='exit'){
      pl.task=null;pl.wait=.90;
    }
  }
}

function drawPlayer(c,pl,t,index){

  roughStroke(c,pts,'#c9a47f',Math.max(.6,R*.045),920+index+edgeFrame*17,true);c.restore();

    const bw=R*1.62,bh=Math.max(2.0,R*.20),by=p.y-R*1.46;
    const framePts=[
      {x:p.x-bw*.54,y:by-bh*.62},{x:p.x+bw*.54,y:by-bh*.58},
      {x:p.x+bw*.52,y:by+bh*.58},{x:p.x-bw*.55,y:by+bh*.62}
    ];
    fillRagged(c,framePts,'#090705',C.ink,Math.max(.65,R*.055),1080+index);

    c.save();c.globalAlpha=.20;roughStroke(c,framePts,shade(pl.color,26),Math.max(.55,R*.040),1110+index+edgeFrame,true);c.restore();

function siteTopHeight(site){
  let top=0;
  for(const b of site.blocks) top=Math.max(top,(b.y+1)*BLOCK_H);
  for(const bp of site.blueprints.values()) top=Math.max(top,(bp.cand.y+1)*BLOCK_H);

}
function siteProgress(site){
  let done=0,total=0;
  for(const [,targetH] of site.targets)total+=targetH;
  for(const [k,targetH] of site.targets){
    const [gx,gz]=k.split(',').map(Number);
    done+=Math.min(targetH,getHeight(site,gx,gz));
  }
  const ratio=total?clamp(done/total,0,1):1;
  return {ratio,remaining:Math.round((1-ratio)*100)};
}

function boardWorldPoint(base,localX,localY,normalOffset=0){
  return {
    x:base.a.x+base.ux*localX+base.nx*normalOffset,
    z:base.a.z+base.uz*localX+base.nz*normalOffset,
    h:base.a.h+localY

}
function boardProject(base,localX,localY,normalOffset=0){
  const w=boardWorldPoint(base,localX,localY,normalOffset);
  return wp(w.x,w.z,w.h);
}
function boardAffine(c,base,normalOffset=0){
  const o=boardProject(base,0,0,normalOffset);
  const ex=boardProject(base,1,0,normalOffset);
  const ey=boardProject(base,0,1,normalOffset);
  c.setTransform(ex.x-o.x,ex.y-o.y,ey.x-o.x,ey.y-o.y,o.x,o.y);

function drawBoardCuboid(c,base,lx,ly,w,h,d,color,seed){
  const x0=lx-w*.5,x1=lx+w*.5,y0=ly-h*.5,y1=ly+h*.5,z0=-d*.5,z1=d*.5;
  const A=boardProject(base,x0,y0,z0),B=boardProject(base,x1,y0,z0);
  const C0=boardProject(base,x1,y1,z0),D=boardProject(base,x0,y1,z0);
  const Af=boardProject(base,x0,y0,z1),Bf=boardProject(base,x1,y0,z1);
  const Cf=boardProject(base,x1,y1,z1),Df=boardProject(base,x0,y1,z1);

  // Back/side body first, then the arena-facing front, exactly like little blocks.
  fillRagged(c,[A,B,Bf,Af],shade(color,-32),'rgba(10,7,5,.96)',.75,seed+1);
  fillRagged(c,[B,C0,Cf,Bf],shade(color,-18),'rgba(10,7,5,.96)',.75,seed+2);
  fillRagged(c,[D,A,Af,Df],shade(color,-42),'rgba(10,7,5,.96)',.75,seed+3);
  fillRagged(c,[D,C0,Cf,Df],shade(color,10),'rgba(10,7,5,.96)',.75,seed+4);
  fillRagged(c,[Af,Bf,Cf,Df],shade(color,20),'rgba(9,6,5,.98)',.85,seed+5);

function panelTextSurfaceMetrics(base,localX,localY,normalOffset=0){
  const p=boardProject(base,localX,localY,normalOffset);
  const px=boardProject(base,localX+1,localY,normalOffset);
  const pd=boardProject(base,localX,localY-1,normalOffset);

  let hx={x:px.x-p.x,y:px.y-p.y};
  // The same physical axis can point either way. Choose the left-to-right orientation
  // without changing the panel or its projected line.
  if(hx.x<0){hx.x=-hx.x;hx.y=-hx.y}

  const down={x:pd.x-p.x,y:pd.y-p.y};
  const hLen=Math.hypot(hx.x,hx.y);
  const vLen=Math.hypot(down.x,down.y);
  const horizontalHealth=Math.abs(hx.x)/Math.max(.001,hLen);
  const slope=Math.atan2(hx.y,hx.x);

  // Native words are allowed to shear/compress with the surface, but disappear
  // before the panel tangent would turn them into near-vertical rigid-looking labels.
  const state=horizontalHealth<.40?'EDGE':(horizontalHealth<.62?'COMPRESSED':'SAFE');
  const alpha=state==='SAFE'?1:clamp((horizontalHealth-.40)/.22,0,1);

  return {p,hx,down,hLen,vLen,horizontalHealth,slope,state,alpha};
}

function drawReadableBoardText(c,base,text,localX,localY,maxWidthWorld,maxSizeWorld,minSizeWorld,weight,family,color,normalOffset){
  const m=panelTextSurfaceMetrics(base,localX,localY,normalOffset||0);
  if(m.state==='EDGE'||m.hLen<.001||m.vLen<.001)return;

  // IMPORTANT: text is not a rigid screen sprite anymore.
  // X follows the projected panel tangent; Y follows projected world-down.
  // This shears/compresses glyphs like the physical sign instead of rotating
  // every letter as one flat word toward vertical at the edge.
  const TEXT_HEIGHT_COMP=1.72;
  let size=maxSizeWorld*TEXT_HEIGHT_COMP;
  const minSize=minSizeWorld*TEXT_HEIGHT_COMP;
  const fam=family||'system-ui',wt=weight||700;

  c.save();
  c.setTransform(
    m.hx.x,m.hx.y,
    m.down.x,m.down.y,
    m.p.x,m.p.y
  );
  c.globalAlpha*=m.alpha;
  c.textAlign='center';c.textBaseline='middle';

  while(size>minSize){
    c.font=wt+' '+size+'px '+fam;
    if(c.measureText(text).width<=maxWidthWorld)break;
    size-=.02;
  }
  c.font=wt+' '+size+'px '+fam;
  c.fillStyle=color;
  c.fillText(text,0,0);
  c.restore();
}

function semanticMetrics(base,normalOffset=0){
  const p=boardProject(base,0,0,normalOffset);
  const px=boardProject(base,1,0,normalOffset);
  const py=boardProject(base,0,1,normalOffset);
  let ux=px.x-p.x,uy=px.y-p.y;
  const vx=py.x-p.x,vy=py.y-p.y;
  const sx=Math.hypot(ux,uy),sy=Math.hypot(vx,vy);
  let rot=Math.atan2(uy,ux);
  if(Math.cos(rot)<0)rot+=Math.PI;
  while(rot>Math.PI)rot-=TAU;
  while(rot<-Math.PI)rot+=TAU;
  const health=sx/Math.max(.001,sy);
  const state=(sx<scale*.22||health<.12)?'EDGE':((sx<scale*.42||health<.24)?'COMPRESSED':'SAFE');
  return {p,sx,sy,health,state,rot:clamp(rot,-.14,.14)};
}
// DEPRECATED FOR POLYGONAL PANEL CONTENT: use physical mini-cuboids or direct projected vertices.
function beginSemanticContent(c,base,normalOffset=0,allowCompressed=true){
  const m=semanticMetrics(base,normalOffset);
  if(m.state==='EDGE'||(!allowCompressed&&m.state!=='SAFE'))return null;
  const safeSx=m.state==='SAFE'?m.sx:Math.max(m.sx,m.sy*.42);
  c.save();
  c.setTransform(
    Math.cos(m.rot)*safeSx,Math.sin(m.rot)*safeSx,
    0,-m.sy,
    m.p.x,m.p.y
  );
  return m;
}
function endSemanticContent(c){c.restore()}

function drawTowerBanner(c,site,index,now){
  if(site.ritual&&['trophy_wait','trophy_carry','trophy_drop','complete'].includes(site.ritual.phase))return;
  const base=bannerBasis(site,index);
  if(base.facing<=.035)return;
  const center=bannerProject(base,0,0);
  if(center.x<-190||center.x>IW+190||center.y<-190||center.y>IH+210)return;

  const title=TOWER_NAMES[index%TOWER_NAMES.length],prog=siteProgress(site);
  const postColor=site.baseColor;
  const panelColor='#c9bda7';
  const panelInk='#1b1510';

  // Posts literally are two tall, thin construction-block prisms.
  const groundLocal=-base.a.h+.08;
  const panelBottom=-BANNER_H*.50,panelTop=BANNER_H*.50;
  const postTop=panelTop+1.02;
  const postHeight=postTop-groundLocal;
  const postY=groundLocal+postHeight*.5;

  drawBoardCuboid(c,base,-BANNER_POLE_GAP*.5,postY,.28,postHeight,.28,postColor,9300+index*30);
  drawBoardCuboid(c,base, BANNER_POLE_GAP*.5,postY,.28,postHeight,.28,postColor,9310+index*30);

  // Four frame rails made from the same block language.
  const railColor=shade(site.baseColor,-12);
  drawBoardCuboid(c,base,0,panelTop-.12,BANNER_W+.34,.24,.18,railColor,9340+index*30);
  drawBoardCuboid(c,base,0,panelBottom+.12,BANNER_W+.34,.24,.18,railColor,9350+index*30);
  drawBoardCuboid(c,base,-BANNER_W*.5-.05,0,.24,BANNER_H,.18,railColor,9360+index*30);
  drawBoardCuboid(c,base, BANNER_W*.5+.05,0,.24,BANNER_H,.18,railColor,9370+index*30);

  // Pale board/paper slab, deliberately quiet so the type is finally readable.
  drawBoardCuboid(c,base,0,0,BANNER_W,BANNER_H,.11,panelColor,9400+index*30);

  // Paper scuffs are world geometry.
  c.save();boardAffine(c,base,.061);
  c.globalAlpha=.085;c.fillStyle=shade(site.baseColor,-18);
  for(let k=0;k<6;k++){
    const y=-BANNER_H*.33+k*BANNER_H*.12;
    c.fillRect(-BANNER_W*.40,y,BANNER_W*(.10+hash(index,k)*.16),.024);
  }
  c.restore();

  // Text uses the full panel surface basis: vertical glyph strokes stay world-vertical,
  // horizontal strokes shear/compress with the sign, and content fades before edge collapse.
  drawReadableBoardText(c,base,title,0,-BANNER_H*.12,BANNER_W*.84,.60,.27,900,'Georgia,serif','rgba(57,38,28,.22)',.063);
  drawReadableBoardText(c,base,title,-.025,-BANNER_H*.14,BANNER_W*.84,.60,.27,900,'Georgia,serif',panelInk,.066);
  const pct=Math.round(prog.ratio*100)+'%';
  drawReadableBoardText(c,base,pct,0,BANNER_H*.27,BANNER_W*.28,.31,.16,900,'Georgia,serif',shade(site.baseColor,-6),.066);

  // Tiny block progress ticks.
  c.save();boardAffine(c,base,.068);
  for(let i=0;i<5;i++){
    const x=-BANNER_W*.24+i*BANNER_W*.12;
    c.fillStyle=i<Math.round(prog.ratio*5)?shade(site.baseColor,12):'#81766a';
    c.fillRect(x-.042,BANNER_H*.35,.084,.084);
  }
  c.restore();

  // Torches remain grounded at the feet of the posts.
  const r=site.ritual,torchesStillHere=!r||r.phase==='fetching';
  if(torchesStillHere){
    const tl=bannerTorchWorld(site,index,-1),tr=bannerTorchWorld(site,index,1);
    drawTorchStakeWorld(c,tl.x,tl.z,tl.h,index*2,now,true);
    drawTorchStakeWorld(c,tr.x,tr.z,tr.h,index*2+1,now,true);
  }
}

function drawProgressTube(c,site,index){
  if(site.ritual&&['trophy_wait','trophy_carry','trophy_drop','complete'].includes(site.ritual.phase))return;
  const prog=siteProgress(site);
  const a=tubeAnchor(site,index);
  const top=a.h+TUBE_H*.5,bot=a.h-TUBE_H*.5;
  const pTop=wp(a.x,a.z,top),pBot=wp(a.x,a.z,bot),pMid=wp(a.x,a.z,a.h);
  const rx=scale*TUBE_R*.95,ry=scale*TUBE_R*.34;
  const H=Math.max(4,pBot.y-pTop.y);

  c.save();
  c.fillStyle='rgba(14,11,9,.92)';
  c.strokeStyle='#231611';
  c.lineWidth=Math.max(.7,scale*.04);
  c.beginPath();
  c.moveTo(pTop.x-rx,pTop.y);
  c.lineTo(pBot.x-rx,pBot.y);
  c.ellipse(pBot.x,pBot.y,rx,ry,0,Math.PI,0,true);
  c.lineTo(pTop.x+rx,pTop.y);
  c.ellipse(pTop.x,pTop.y,rx,ry,0,0,Math.PI,true);
  c.closePath();c.fill();c.stroke();

  const fillH=H*prog.ratio,fillTopY=pBot.y-fillH;
  c.save();
  c.beginPath();
  c.moveTo(pTop.x-rx+1,pTop.y);
  c.lineTo(pBot.x-rx+1,pBot.y);
  c.ellipse(pBot.x,pBot.y,Math.max(1,rx-1),Math.max(1,ry-1),0,Math.PI,0,true);
  c.lineTo(pTop.x+rx-1,pTop.y);
  c.ellipse(pTop.x,pTop.y,Math.max(1,rx-1),Math.max(1,ry-1),0,0,Math.PI,true);
  c.closePath();c.clip();
  c.fillStyle=prog.ratio>=1?'#d74623':'#d77a2d';
  c.fillRect(pBot.x-rx,fillTopY,rx*2,fillH+2);
  c.fillStyle=prog.ratio>=1?'#ef6a31':'#eaa14a';
  c.beginPath();c.ellipse(pMid.x,fillTopY,Math.max(1,rx-1),Math.max(1,ry-1),0,0,TAU);c.fill();
  c.restore();

  c.save();c.globalAlpha=.18;c.fillStyle='#ead7ba';
  c.fillRect(pTop.x-rx*.36,pTop.y+2,Math.max(1,rx*.22),Math.max(1,H-4));
  c.restore();
  c.restore();
}

function panelSemanticState(base,normalOffset=.071){

  const state=(m.sx<scale*.34||m.health<.18)?'EDGE':

    drawReadableBoardText(c,base,'HORA',0,H*.34,W*.50,.18,.10,800,'system-ui','#c2a784',.082);
  }

  // Physical seven-segment clock: the numbers are miniature block objects on the panel.
  const s=.72,cy=-.12;
  const xs=[-.90,-.31,.31,.90];
  for(let i=0;i<4;i++)drawPhysicalDigit(c,base,str[i],xs[i],cy,s,15100+i*100,'#b94729','#2b1b17');
  drawPhysicalColon(c,base,0,cy,s,15550,d.getSeconds()%2===0?'#c64d2c':'#6a2b20');
}

function globalBurnRatio(now){
  let total=0;
  for(const site of sites){
    const r=site.ritual;
    if(!r)continue;
    if(r.phase==='burning'){
      total+=clamp((now-r.started)/r.burnDuration,0,1);
    }else if(['trophy_wait','trophy_carry','trophy_drop','complete'].includes(r.phase)){
      total+=1;
    }
  }
  return total/sites.length;
}
function drawGlobalProgressBoard(c,now){
  const wallAng=-.25;
  const base=wallBoardBasis(wallAng,18.02,5.72);
  if(cut(wallAng)||base.facing<=.035)return;

  const W=4.78,H=1.42;
  drawBlockPanel(c,base,W,H,'#39261f','#74492f',15400);

  const m=panelSemanticState(base,.071);
  if(m.state==='EDGE')return;

  const done=globalBurnRatio(now);
  if(m.state==='SAFE'){
    drawReadableBoardText(c,base,'PROGRESO',0,H*.31,W*.44,.15,.09,800,'system-ui','#c59872',.082);
  }

  // No giant percentage. Twenty physical cells are the progress language.
  const cells=20,filled=Math.floor(done*cells+1e-6);
  const gap=.055,usable=W*.80,cellW=(usable-gap*(cells-1))/cells,cellH=.27;
  const start=-usable*.5+cellW*.5,cy=-.08;
  for(let i=0;i<cells;i++){
    const x=start+i*(cellW+gap);
    const state=i<filled?'done':(i===filled&&filled<cells?'lead':'empty');
    drawPhysicalProgressCell(c,base,x,cy,cellW,cellH,state,15600+i*13,now);
  }
}

function chooseHelpSite(fromIndex){
  let best=-1,bestScore=Infinity;
  for(let i=0;i<sites.length;i++){
    if(i===fromIndex)continue;
    const s=sites[i];
    if(s.ritual)continue;
    const r=siteProgress(s).ratio;
    if(r>=.9999)continue;
    const helpers=players.reduce((n,p)=>n+(p.siteIndex===i?1:0),0);
    const score=r+helpers*.025;
    if(score<bestScore){bestScore=score;best=i}
  }
  return best;
}
function releaseWorkersToHelp(fromIndex){
  const target=chooseHelpSite(fromIndex);
  if(target<0)return false;
  for(let i=0;i<players.length;i++){
    const pl=players[i];
    if(pl.siteIndex!==fromIndex)continue;
    pl.siteIndex=target;pl.task=null;pl.path.length=0;pl.segment=null;pl.jump=0;
    pl.wait=.05+hash(i,target)*.18;
  }
  return true;
}


function trophyStandTarget(site){
  const a=Math.atan2(site.z,site.x),r=12.85;
  return {x:Math.cos(a)*r,z:Math.sin(a)*r,h:.12};
}
function drawTrophyWorld(c,x,z,h,seed,now){
  const flick=.88+.12*Math.sin(now*.004+seed);
  const top=wp(x,z,h+.78);
  c.save();c.globalCompositeOperation='screen';c.globalAlpha=.15*flick;
  const g=c.createRadialGradient(top.x,top.y,0,top.x,top.y,scale*.72);
  g.addColorStop(0,'rgba(255,191,82,.38)');g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=g;c.beginPath();c.arc(top.x,top.y,scale*.72,0,TAU);c.fill();c.restore();

  drawWorldCuboid(c,x,z,h+.03,.56,.13,'#8b6538',seed+1);
  drawWorldCuboid(c,x,z,h+.16,.17,.34,'#a87b3d',seed+11);
  drawWorldCuboid(c,x,z,h+.50,.50,.20,'#b7863f',seed+21);

  const a=Math.atan2(z,x),tx=-Math.sin(a),tz=Math.cos(a);
  drawWorldCuboid(c,x+tx*.34,z+tz*.34,h+.51,.18,.13,'#91652f',seed+31);
  drawWorldCuboid(c,x-tx*.34,z-tz*.34,h+.51,.18,.13,'#91652f',seed+41);
}

function trophyWorldState(site,index){
  const r=site.ritual;if(!r)return null;
  const carrier=players[r.trophyCarrier??r.carrier];
  if(r.phase==='trophy_wait')return {x:site.x,z:site.z,h:.04};
  if(r.phase==='trophy_carry'&&carrier)return {x:carrier.x,z:carrier.z,h:carrier.h+.30};
  if(r.phase==='trophy_drop'||r.phase==='complete'){
    const t=r.trophyTarget||trophyStandTarget(site);return {x:t.x,z:t.z,h:t.h};
  }
  return null;
}

function drawRitualTrophy(c,site,index,now){
  const t=trophyWorldState(site,index);if(!t)return;
  drawTrophyWorld(c,t.x,t.z,t.h,9000+index,now);
}

function siteCarrierIndex(siteIndex){
  for(let i=0;i<players.length;i++)if(players[i].siteIndex===siteIndex)return i;
  return -1;
}
function updateSiteRituals(now){
  for(let si=0;si<sites.length;si++){
    const site=sites[si];
    const complete=siteProgress(site).ratio>=.9999 && site.blueprints.size===0;

    if(!site.ritual && complete){
      const carrier=siteCarrierIndex(si);
      site.ritual={phase:'fetching',started:now,carrier,trophyCarrier:carrier,burnDuration:6200};
      for(let i=0;i<players.length;i++){
        const pl=players[i];
        if(pl.siteIndex!==si)continue;
        pl.task=null;pl.path.length=0;pl.segment=null;pl.wait=0;pl.jump=0;
      }
    }

    if(!site.ritual)continue;
    const r=site.ritual,age=now-r.started;

    if(r.phase==='fetching' && age>900){
      r.phase='carrying';r.started=now;
    }else if(r.phase==='carrying' && age>1200){
      r.phase='throwing';r.started=now;
    }else if(r.phase==='throwing' && age>820){
      r.phase='burning';r.started=now;
    }else if(r.phase==='burning' && age>=r.burnDuration){
      r.phase='trophy_wait';r.ashStarted=now;r.started=now;
      site.blocks.length=0;site.heights.clear();
      for(let i=0;i<players.length;i++){
        const pl=players[i];
        if(pl.siteIndex===si){
          pl.path.length=0;pl.segment=null;pl.task=null;pl.jump=0;
        }
      }
    }else if(r.phase==='trophy_wait' && age>900){
      r.phase='trophy_carry';r.started=now;r.trophyTarget=trophyStandTarget(site);
    }else if(r.phase==='trophy_carry' && age>1900){
      r.phase='trophy_drop';r.started=now;
    }else if(r.phase==='trophy_drop' && age>520){
      r.phase='complete';r.started=now;
      if(!r.workersReleased)r.workersReleased=releaseWorkersToHelp(si);
    }
  }
}
function updateRitualPlayer(pl,index,site,dt,now){
  const r=site.ritual;
  if(!r)return false;
  const si=pl.siteIndex;
  const carrier=index===r.carrier;
  const age=now-r.started;

  if(r.phase==='fetching'){
    if(carrier){
      const l=bannerTorchWorld(site,si,-1),rr=bannerTorchWorld(site,si,1);
      const tx=(l.x+rr.x)*.5,tz=(l.z+rr.z)*.5;
      const k=Math.min(1,dt*4.8);
      pl.x+=(tx-pl.x)*k;pl.z+=(tz-pl.z)*k;pl.h=0;
      pl.jump=Math.max(0,Math.sin(age*.018))*.08;
    }else{
      const a=index*2.1+si*.7,rad=2.7;
      const tx=site.x+Math.cos(a)*rad,tz=site.z+Math.sin(a)*rad;
      const k=Math.min(1,dt*2.6);pl.x+=(tx-pl.x)*k;pl.z+=(tz-pl.z)*k;pl.h=0;pl.jump=0;
    }
    return true;
  }

  if(r.phase==='carrying'){
    if(carrier){
      const a=Math.atan2(pl.z-site.z,pl.x-site.x);
      const tx=site.x+Math.cos(a)*1.9,tz=site.z+Math.sin(a)*1.9;
      const k=Math.min(1,dt*4.5);
      pl.x+=(tx-pl.x)*k;pl.z+=(tz-pl.z)*k;pl.h=0;
      pl.jump=Math.max(0,Math.sin(age*.016))*.10;
    }else{
      const peers=players.filter(p=>p.siteIndex===si);
      const rank=Math.max(0,peers.indexOf(pl));
      const a=rank*TAU/Math.max(1,peers.length)+si*.55;
      const rad=2.75;
      const tx=site.x+Math.cos(a)*rad,tz=site.z+Math.sin(a)*rad;
      const k=Math.min(1,dt*2.7);pl.x+=(tx-pl.x)*k;pl.z+=(tz-pl.z)*k;pl.h=0;
      pl.jump=Math.max(0,Math.sin(now*.008+rank))*.05;
    }
    return true;
  }

  if(r.phase==='throwing'){
    pl.h=0;
    if(carrier)pl.jump=Math.max(0,Math.sin(clamp(age/820,0,1)*Math.PI))*.24;
    else pl.jump=Math.max(0,Math.sin(now*.009+index))*.07;
    return true;
  }

  if(r.phase==='burning'){
    const peers=players.filter(p=>p.siteIndex===si);
    const rank=Math.max(0,peers.indexOf(pl));
    const a=now*.00185+rank*TAU/Math.max(1,peers.length)+si*.7;
    const radius=3.0+.20*Math.sin(now*.003+index);
    const tx=site.x+Math.cos(a)*radius,tz=site.z+Math.sin(a)*radius;
    const k=Math.min(1,dt*3.2);
    pl.x+=(tx-pl.x)*k;pl.z+=(tz-pl.z)*k;pl.h=0;
    pl.jump=Math.max(0,Math.sin(now*.011+rank*1.7))*.22;
    return true;
  }

  if(r.phase==='trophy_wait'){
    const peers=players.filter(p=>p.siteIndex===si),rank=Math.max(0,peers.indexOf(pl));
    if(carrier){
      const k=Math.min(1,dt*4.0);
      pl.x+=(site.x-pl.x)*k;pl.z+=(site.z-pl.z)*k;pl.h=0;pl.jump=Math.max(0,Math.sin(now*.012))*.08;
    }else{
      const a=rank*TAU/Math.max(1,peers.length)+si*.55,rad=2.6;
      const tx=site.x+Math.cos(a)*rad,tz=site.z+Math.sin(a)*rad,k=Math.min(1,dt*2.5);
      pl.x+=(tx-pl.x)*k;pl.z+=(tz-pl.z)*k;pl.h=0;pl.jump=0;
    }
    return true;
  }

  if(r.phase==='trophy_carry'){
    const target=r.trophyTarget||trophyStandTarget(site);
    if(carrier){
      const k=Math.min(1,dt*2.3);
      pl.x+=(target.x-pl.x)*k;pl.z+=(target.z-pl.z)*k;pl.h=0;
      pl.jump=Math.max(0,Math.sin(now*.012))*.07;
    }else{
      const a=index*1.9+si*.7,rad=2.8;
      const tx=site.x+Math.cos(a)*rad,tz=site.z+Math.sin(a)*rad,k=Math.min(1,dt*2.1);
      pl.x+=(tx-pl.x)*k;pl.z+=(tz-pl.z)*k;pl.h=0;pl.jump=0;
    }
    return true;
  }

  if(r.phase==='trophy_drop'){
    const target=r.trophyTarget||trophyStandTarget(site);
    if(carrier){
      const k=Math.min(1,dt*3.2);pl.x+=(target.x-pl.x)*k;pl.z+=(target.z-pl.z)*k;pl.h=0;pl.jump=0;
    }
    return true;
  }

  if(r.phase==='complete')return false;
  return false;
}
function drawRitualTorches(c,site,index,now){
  if(!site.ritual)return;
  const r=site.ritual,carrier=players[r.carrier];
  if(!carrier)return;

  if(r.phase==='carrying'){
    drawTorchStakeWorld(c,carrier.x-.13,carrier.z,carrier.h+.18,index*2,now,true);
    drawTorchStakeWorld(c,carrier.x+.13,carrier.z,carrier.h+.18,index*2+1,now,true);
  }else if(r.phase==='throwing'){
    const t=clamp((now-r.started)/820,0,1);
    for(let j=0;j<2;j++){
      const sx=carrier.x+(j?1:-1)*.14,sz=carrier.z;
      const tx=site.x+(j?1:-1)*.28,tz=site.z;
      const x=sx+(tx-sx)*t,z=sz+(tz-sz)*t;
      const h=.20+Math.sin(Math.PI*t)*1.65;
      drawTorchStakeWorld(c,x,z,h,index*2+j,now,true);
    }
  }
}
function drawViolentTowerFlame(c,x,z,h,height,seed,now){
  const p=wp(x,z,h);
  const phase=now*.012+seed*1.73;
  const flick=.86+.22*Math.sin(phase*1.8);
  const H=scale*(1.00+height*.30)*flick;
  const W=scale*(.58+height*.12);
  const drift=Math.sin(phase)*W*.78;

  c.save();c.globalCompositeOperation='screen';

  // Wide outer tongue, deliberately thrown sideways.
  c.fillStyle='rgba(190,48,20,.48)';
  c.beginPath();
  c.moveTo(p.x-W*.88,p.y);
  c.quadraticCurveTo(p.x-W*.22+drift,p.y-H*.72,p.x+drift*.72,p.y-H*1.26);
  c.quadraticCurveTo(p.x+W*.95,p.y-H*.38,p.x+W*.78,p.y+.05*H);
  c.quadraticCurveTo(p.x,p.y-H*.08,p.x-W*.88,p.y);
  c.fill();

  // Hot middle sheet.
  c.fillStyle='rgba(255,108,36,.78)';
  c.beginPath();
  c.moveTo(p.x-W*.62,p.y);
  c.quadraticCurveTo(p.x+drift*.35,p.y-H*.52,p.x+drift,p.y-H*1.02);
  c.quadraticCurveTo(p.x+W*.64,p.y-H*.33,p.x+W*.48,p.y);
  c.quadraticCurveTo(p.x,p.y-H*.12,p.x-W*.62,p.y);
  c.fill();

  // Dense bright core.
  c.fillStyle='rgba(255,222,139,.92)';
  c.beginPath();
  c.moveTo(p.x-W*.31,p.y);
  c.quadraticCurveTo(p.x+drift*.18,p.y-H*.38,p.x+drift*.46,p.y-H*.72);
  c.quadraticCurveTo(p.x+W*.30,p.y-H*.25,p.x+W*.24,p.y);
  c.closePath();c.fill();

  // Horizontal gusts give the fire mass instead of a row of candles.
  for(let g=0;g<2;g++){
    const side=((seed+g)&1)?1:-1;
    const y=p.y-H*(.24+.24*g);
    c.globalAlpha=.38-g*.08;c.fillStyle=g?'#e65e2c':'#ff8c3c';
    c.beginPath();
    c.moveTo(p.x,y);
    c.quadraticCurveTo(p.x+side*W*.9,y-H*.14,p.x+side*W*1.75,y-H*.05);
    c.quadraticCurveTo(p.x+side*W*.82,y+H*.10,p.x,y);
    c.fill();
  }
  c.restore();
}
function drawTowerFire(c,site,index,now){
  if(!site.ritual||site.ritual.phase!=='burning')return;
  const elapsed=now-site.ritual.started,p=clamp(elapsed/site.ritual.burnDuration,0,1);
  const top=Math.max(BLOCK_H,siteTopHeight(site));
  const glow=wp(site.x,site.z,top*.46);

  // Broad light flood so the whole structure reads as burning.
  c.save();c.globalCompositeOperation='screen';
  let g=c.createRadialGradient(glow.x,glow.y,0,glow.x,glow.y,scale*7.1);
  g.addColorStop(0,'rgba(255,181,86,.42)');
  g.addColorStop(.25,'rgba(245,98,35,.27)');
  g.addColorStop(.62,'rgba(147,35,18,.13)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=g;c.beginPath();c.arc(glow.x,glow.y,scale*7.1,0,TAU);c.fill();c.restore();

  // Front curtain: large overlapping tongues that actually cover the blocks.
  for(let i=0;i<34;i++){
    const a=i*TAU/34+hash(index,i)*.30+now*.00018*(i%3-1);
    const r=.10+hash(i,index)*1.72;
    const fh=(.72+hash(i,77)*1.25)*top*(1.02+.20*(1-p));
    drawViolentTowerFlame(c,site.x+Math.cos(a)*r,site.z+Math.sin(a)*r,.04,fh,i+index*47,now);
  }

  // Fast low side bursts around the base.
  c.save();c.globalCompositeOperation='screen';
  for(let j=0;j<7;j++){
    const a=j*TAU/7+now*.0009*(j%2?1:-1),r=1.1+hash(j,index)*1.1;
    const q0=wp(site.x+Math.cos(a)*r,site.z+Math.sin(a)*r,.10);
    const len=scale*(1.2+hash(index,j)*1.5),dir=(j%2?1:-1);
    c.globalAlpha=.26+hash(j,2)*.15;c.fillStyle=j%2?'#ff7a32':'#d94a24';
    c.beginPath();c.moveTo(q0.x,q0.y);
    c.quadraticCurveTo(q0.x+dir*len*.55,q0.y-scale*.32,q0.x+dir*len,q0.y-scale*.05);
    c.quadraticCurveTo(q0.x+dir*len*.45,q0.y+scale*.18,q0.x,q0.y);
    c.fill();
  }
  c.restore();
}
function drawAshes(c,site,index,now){
  if(!site.ritual||!['trophy_wait','trophy_carry','trophy_drop','complete'].includes(site.ritual.phase))return;
  groundPatch(c,site.x,site.z,1.55,.92,'#171310',.86,7600+index,18);
  groundPatch(c,site.x-.18,site.z+.08,.82,.48,'#4b3b31',.46,7640+index,14);
  drawWorldCuboid(c,site.x-.42,site.z+.18,.018,.30,.10,'#3b302a',7660+index*5);
  drawWorldCuboid(c,site.x+.36,site.z-.12,.018,.22,.08,'#594132',7670+index*5);
  drawWorldCuboid(c,site.x+.05,site.z+.39,.018,.18,.07,'#2b2521',7680+index*5);

  const age=now-site.ritual.ashStarted,fade=clamp(1-age/12000,0,1);
  if(fade>0){
    c.save();c.globalCompositeOperation='screen';c.globalAlpha=.18*fade;
    for(let i=0;i<5;i++){
      const a=hash(i,index)*TAU,r=hash(index,i)*.65;
      const p=wp(site.x+Math.cos(a)*r,site.z+Math.sin(a)*r,.045);
      c.fillStyle=i%2?C.red:C.ochre;c.beginPath();c.arc(p.x,p.y,Math.max(.55,scale*.028),0,TAU);c.fill();
    }
    c.restore();
  }
}

function drawWindowEyes(c,now){
  const COUNT=20,CYCLE=2350;
  const slot=Math.floor(now/CYCLE),phase=(now%CYCLE)/CYCLE;
  if(phase<.08||phase>.80)return;

  let idx=Math.floor(hash(slot,911)*COUNT);
  for(let tries=0;tries<COUNT&&cut(idx*TAU/COUNT+.02);tries++)idx=(idx+1)%COUNT;
  const ang=idx*TAU/COUNT+.02;
  const base=windowBasis(ang);
  if(cut(ang)||base.facing<=.025)return;

  // Eyes disappear before the opening becomes too oblique.
  const m=beginSemanticContent(c,base,.074,false);
  if(!m)return;

  const fade=Math.min(1,(phase-.08)/.12,(.80-phase)/.14);
  const blinkT=(now+slot*617)%1850;
  const open=(blinkT>1280&&blinkT<1440)?Math.max(.10,Math.abs(blinkT-1360)/80):1;
  const look=Math.sin(now*.0028+slot*1.7)*.075;
  const style=Math.floor(hash(slot,933)*4);

  // Clip the semantic layer inside the real black recess.
  c.beginPath();c.rect(-.31,-.59,.62,1.18);c.clip();
  c.globalAlpha=.92*fade;
  c.globalCompositeOperation='screen';

  const ew=.52,eh=.18*open;
  c.beginPath();
  c.moveTo(-ew*.5,0);
  c.quadraticCurveTo(0,-eh,ew*.5,0);
  c.quadraticCurveTo(0,eh,-ew*.5,0);
  c.closePath();
  c.fillStyle=style===2?'rgba(188,169,128,.72)':'rgba(205,191,158,.78)';
  c.fill();

  const irisR=.082;
  c.beginPath();c.arc(look,0,irisR,0,TAU);
  c.fillStyle=style===0?'rgba(185,48,28,.92)':style===1?'rgba(198,133,55,.92)':style===2?'rgba(74,112,88,.92)':'rgba(143,79,108,.92)';
  c.fill();

  c.globalCompositeOperation='source-over';
  c.fillStyle='#050403';
  if(style===1){c.beginPath();c.ellipse(look,0,irisR*.23,irisR*.78,0,0,TAU);c.fill()}
  else{c.beginPath();c.arc(look,0,irisR*.40,0,TAU);c.fill()}

  c.globalCompositeOperation='screen';c.globalAlpha=.52*fade;
  c.fillStyle='#f0c778';c.beginPath();c.arc(look-irisR*.22,-irisR*.20,irisR*.12,0,TAU);c.fill();
  endSemanticContent(c);
}

function drawAnalogSignal(c,now){
  const f=Math.floor(now/92);
  fxctx.setTransform(1,0,0,1,0,0);
  fxctx.drawImage(canvas,0,0);

  // Source-derived chromatic registration, so bright structures bleed from themselves.
  c.save();c.globalCompositeOperation='screen';c.globalAlpha=.030;
  c.drawImage(fxCanvas,1,0);
  c.globalAlpha=.018;c.drawImage(fxCanvas,-1,0);

  c.save();c.globalAlpha=.055;
  for(let i=0;i<3;i++){

    const dx=(hash(f+7,i+91)-.5)*2.2;
    c.drawImage(fxCanvas,0,y,IW,h,dx,y,IW,h);
  }
  c.restore();

  // Sparse temporal grain. It changes with the scene frame and never becomes a fixed texture layer.
  c.save();
  for(let i=0;i<92;i++){
    const x=Math.floor(hash(f*97+i,701)*IW),y=Math.floor(hash(i+37,f*53)*IH);
    const light=hash(i,f+719)>.56;
    c.globalCompositeOperation=light?'screen':'multiply';
    c.globalAlpha=.018+hash(i+5,f)*.030;
    c.fillStyle=light?'#d3aa78':'#120b08';
    const sz=hash(i,f+3)>.84?2:1;
    c.fillRect(x,y,sz,1);
  }

}




/* =========================================================
   COMPONENT LAB
   Three deliberately separate review surfaces:
   structures / workers / effects.

const solidCanvas=document.createElement('canvas');
const solidGL=solidCanvas.getContext('webgl',{
  alpha:true,antialias:true,depth:true,stencil:false,
  premultipliedAlpha:true,preserveDrawingBuffer:false
});

let solidProgram=null,solidPosBuffer=null,solidColorBuffer=null;

function glCompileShader(gl,type,source){
  const sh=gl.createShader(type);
  gl.shaderSource(sh,source);gl.compileShader(sh);
  if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){
    const msg=gl.getShaderInfoLog(sh)||'shader compile failed';
    gl.deleteShader(sh);throw new Error(msg);
  }
  return sh;
}

function initSolidGL(){
  if(!solidGL||solidProgram)return !!solidProgram;
  const gl=solidGL;
  const vs=glCompileShader(gl,gl.VERTEX_SHADER,
    'attribute vec3 a_pos; attribute vec4 a_color; varying vec4 v_color; void main(){ gl_Position=vec4(a_pos,1.0); v_color=a_color; }'
  );
  const fs=glCompileShader(gl,gl.FRAGMENT_SHADER,
    'precision mediump float; varying vec4 v_color; void main(){ gl_FragColor=v_color; }'
  );
  const p=gl.createProgram();gl.attachShader(p,vs);gl.attachShader(p,fs);gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p)||'program link failed');
  solidProgram=p;
  solidPosBuffer=gl.createBuffer();
  solidColorBuffer=gl.createBuffer();
  return true;
}

function solidHexRGBA(hex,alpha=1){
  const n=parseInt(hex.slice(1),16);
  return [((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255,alpha];
}

function cameraProjectSolid(x,z,h){
  const cs=Math.cos(yaw),sn=Math.sin(yaw);
  const sx=x*cs-z*sn;
  const forward=z*cs+x*sn;

  // Screen projection remains EXACTLY the same as wp().
  let px=cx+sx*scale;
  let py=cy+forward*scale*.35-h*scale*.57;

  // Effects may quantize projected vertices, but they never own a second camera.
  if(COMPONENT_MODE==='effects'&&FX_CFG.snap>0){
    const snap=FX_CFG.snap;
    px=Math.round(px/snap)*snap;
    py=Math.round(py/snap)*snap;
  }

  // Missing piece in the old painter:
  // camera depth must include BOTH forward distance and height.
  // This is the orthogonal companion to screen-Y's (.35*forward - .57*height).
  const cameraDepth=forward*.57+h*.35;

  return {
    x:px/IW*2-1,
    y:1-py/IH*2,
    z:clamp(-cameraDepth/42,-.98,.98),
    cameraDepth
  };
}

function solidBoxFaces(box){
  const b=box.baseH,t=box.baseH+box.height;
  const bm=worldCorner(box,-1,-1,b),bp=worldCorner(box,1,-1,b);
  const bpp=worldCorner(box,1,1,b),bmp=worldCorner(box,-1,1,b);
  const tm=worldCorner(box,-1,-1,t),tp=worldCorner(box,1,-1,t);
  const tpp=worldCorner(box,1,1,t),tmp=worldCorner(box,-1,1,t);
  return [
    {corners:[bm,bp,tp,tm],nx:-box.nx,nz:-box.nz,nh:0},
    {corners:[bp,bpp,tpp,tp],nx:box.ux,nz:box.uz,nh:0},
    {corners:[bpp,bmp,tmp,tpp],nx:box.nx,nz:box.nz,nh:0},
    {corners:[bmp,bm,tm,tmp],nx:-box.ux,nz:-box.uz,nh:0},
    {corners:[tm,tp,tpp,tmp],nx:0,nz:0,nh:1}
  ];
}

function pushSolidVertex(arr,p){
  const q0=cameraProjectSolid(p.x,p.z,p.h);
  arr.push(q0.x,q0.y,q0.z);
}

const WORLD_EMISSIVE=[];
function resetWorldEmissive(){WORLD_EMISSIVE.length=0}
function addWorldEmissive(x,z,baseH,height,width,power,seed){
  WORLD_EMISSIVE.push({x,z,baseH,height,width,power,seed});
}
function appendFlameTriangles(pos,col,flame,now){
  const screenUX=Math.cos(yaw),screenUZ=-Math.sin(yaw);
  const phase=now*.010+flame.seed*1.73;
  const flick=.88+.12*Math.sin(phase*1.7);
  const h=flame.height*flick,w=flame.width;
  const drift=Math.sin(phase)*w*.28;
  const baseL={x:flame.x-screenUX*w*.52,z:flame.z-screenUZ*w*.52,h:flame.baseH};
  const baseR={x:flame.x+screenUX*w*.52,z:flame.z+screenUZ*w*.52,h:flame.baseH};
  const midL={x:flame.x-screenUX*w*.26+screenUX*drift*.25,z:flame.z-screenUZ*w*.26+screenUZ*drift*.25,h:flame.baseH+h*.48};
  const midR={x:flame.x+screenUX*w*.30+screenUX*drift*.35,z:flame.z+screenUZ*w*.30+screenUZ*drift*.35,h:flame.baseH+h*.48};
  const tip={x:flame.x+screenUX*drift,z:flame.z+screenUZ*drift,h:flame.baseH+h};
  const hot=[1.0,.47,.12,.86*flame.power],core=[1.0,.86,.42,.92*flame.power],outer=[.72,.16,.055,.58*flame.power];
  const push=(p,c0)=>{const q=cameraProjectSolid(p.x,p.z,p.h);pos.push(q.x,q.y,q.z);col.push(...c0)};
  // outer body
  for(const [p0,c0] of [[baseL,outer],[baseR,outer],[tip,outer],[baseL,outer],[tip,outer],[midL,outer]])push(p0,c0);
  // hot inner tongue
  const ibL={x:flame.x-screenUX*w*.24,z:flame.z-screenUZ*w*.24,h:flame.baseH+.02};
  const ibR={x:flame.x+screenUX*w*.24,z:flame.z+screenUZ*w*.24,h:flame.baseH+.02};
  const itip={x:flame.x+screenUX*drift*.45,z:flame.z+screenUZ*drift*.45,h:flame.baseH+h*.72};
  for(const [p0,c0] of [[ibL,hot],[ibR,hot],[itip,core]])push(p0,c0);
}

function renderWorldSolidsGL(targetCtx){
  if(!solidGL||!initSolidGL())return false;
  const gl=solidGL;
  if(solidCanvas.width!==IW||solidCanvas.height!==IH){
    solidCanvas.width=IW;solidCanvas.height=IH;
  }
  gl.viewport(0,0,IW,IH);
  gl.clearColor(0,0,0,0);
  gl.clearDepth(1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LESS);
  gl.disable(gl.BLEND);

  const triPos=[],triCol=[],linePos=[],lineCol=[];
  let triangleCount=0,lineCount=0;
  const edgeColor=[.045,.030,.022,1];

  for(const box of WORLD_GEOM.boxes){
    const faces=solidBoxFaces(box);
    for(let fi=0;fi<faces.length;fi++){
      const face=faces[fi],mat=box.material;
      const amount=face.nh>0?mat.top:faceTone(face.nx,face.nz);
      const rgba=solidHexRGBA(shade(mat.base,amount),1);
      const p=face.corners;

      // two triangles per physical face
      for(const vi of [0,1,2,0,2,3]){
        pushSolidVertex(triPos,p[vi]);triCol.push(...rgba);
      }
      triangleCount+=2;

      // same physical edges, same depth buffer; hidden edges cannot leak through walls.
      for(const [a,b] of [[0,1],[1,2],[2,3],[3,0]]){
        pushSolidVertex(linePos,p[a]);pushSolidVertex(linePos,p[b]);
        lineCol.push(...edgeColor,...edgeColor);lineCount++;
      }
    }
  }

  gl.useProgram(solidProgram);
  const aPos=gl.getAttribLocation(solidProgram,'a_pos');
  const aColor=gl.getAttribLocation(solidProgram,'a_color');

  gl.bindBuffer(gl.ARRAY_BUFFER,solidPosBuffer);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(triPos),gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(aPos);gl.vertexAttribPointer(aPos,3,gl.FLOAT,false,0,0);

  gl.bindBuffer(gl.ARRAY_BUFFER,solidColorBuffer);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(triCol),gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(aColor);gl.vertexAttribPointer(aColor,4,gl.FLOAT,false,0,0);

  // Push fills microscopically away so structural ink edges win without z-fighting.
  gl.enable(gl.POLYGON_OFFSET_FILL);
  gl.polygonOffset(1,1);
  gl.drawArrays(gl.TRIANGLES,0,triPos.length/3);
  gl.disable(gl.POLYGON_OFFSET_FILL);

  gl.bindBuffer(gl.ARRAY_BUFFER,solidPosBuffer);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(linePos),gl.DYNAMIC_DRAW);
  gl.vertexAttribPointer(aPos,3,gl.FLOAT,false,0,0);

  gl.bindBuffer(gl.ARRAY_BUFFER,solidColorBuffer);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(lineCol),gl.DYNAMIC_DRAW);
  gl.vertexAttribPointer(aColor,4,gl.FLOAT,false,0,0);

  gl.depthFunc(gl.LEQUAL);
  gl.drawArrays(gl.LINES,0,linePos.length/3);
  gl.depthFunc(gl.LESS);

  // Transparent/emissive world effects reuse the SAME projection and SAME depth buffer.
  // Walls therefore occlude fire automatically instead of fire being a 2D overlay.
  if(WORLD_EMISSIVE.length){
    const ePos=[],eCol=[];
    for(const flame of WORLD_EMISSIVE)appendFlameTriangles(ePos,eCol,flame,performance.now());
    gl.bindBuffer(gl.ARRAY_BUFFER,solidPosBuffer);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(ePos),gl.DYNAMIC_DRAW);
    gl.vertexAttribPointer(aPos,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,solidColorBuffer);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(eCol),gl.DYNAMIC_DRAW);
    gl.vertexAttribPointer(aColor,4,gl.FLOAT,false,0,0);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
    gl.depthMask(false);
    gl.depthFunc(gl.LEQUAL);
    gl.drawArrays(gl.TRIANGLES,0,ePos.length/3);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
    gl.depthFunc(gl.LESS);
  }

  targetCtx.drawImage(solidCanvas,0,0);
  window.WORLD_RENDER_STATS={
    renderer:'webgl-depth',
    boxes:WORLD_GEOM.boxes.length,
    triangles:triangleCount,
    edges:lineCount,
    depthFormula:'0.57*forward + 0.35*height',
    mode:COMPONENT_MODE,
    contract:'prometeo.component_world/v2',
    emissives:WORLD_EMISSIVE.length
  };
  return true;
}

const COMPONENT_MODULE=.72;
let COMPONENT_SERIAL=1;
let COMPONENT_USER_DRAG_UNTIL=0;

/* =========================================================
   COMPONENT WORLD CONTRACT V2
   One Coliseo, one camera, one projection, one ring layout,
   one solid renderer, one emissive depth pass.
   ========================================================= */

const COMPONENT_WORLD={
  ringRadius:8.25,
  structureRadius:8.25,
  workerRadius:8.45,
  effectRadius:8.30,
  slots:[
    {id:'tower',angle:-2.62,label:'TORRE'},
    {id:'monument',angle:-1.78,label:'BASE + NÚCLEO'},
    {id:'gate',angle:-.94,label:'PUERTA'},
    {id:'bridge',angle:-.10,label:'PUENTE'},
    {id:'workshop',angle:.74,label:'TALLER'},
    {id:'archive',angle:1.58,label:'ARCHIVO'},
    {id:'spire',angle:2.42,label:'TORRE ALTA'}
  ],
  workerStates:['IDLE','WALK','DESIGN','BUILD','CARRY','STALE','DONE']
};

function slotFrame(slot,radius=COMPONENT_WORLD.ringRadius){
  const angle=slot.angle;
  // Local X is tangent; local Z points inward toward the arena.
  const rot=angle+Math.PI/2;
  const ux=Math.cos(rot),uz=Math.sin(rot),nx=-Math.sin(rot),nz=Math.cos(rot);
  return {
    ...slot,angle,rot,ux,uz,nx,nz,
    x:Math.cos(angle)*radius,
    z:Math.sin(angle)*radius
  };
}
function slotPoint(frame,lx=0,lz=0,h=0){
  return {
    x:frame.x+frame.ux*lx+frame.nx*lz,
    z:frame.z+frame.uz*lx+frame.nz*lz,
    h
  };
}
function slotFrontness(frame){
  // Same front/back convention used by the Coliseo cut.
  return Math.sin(frame.angle+yaw);
}
function slotBox(frame,lx,lz,baseH,w,d,h,color,seed,localRot=0){
  const p=slotPoint(frame,lx,lz,baseH);
  componentModuleBox(p.x,p.z,baseH,w,d,h,color,seed,frame.rot+localRot);
}
function componentModuleBox(x,z,baseH,w,d,h,color,seed,rot=0){
  // All physical Component objects decompose into the same bounded module size.
  const nx=Math.max(1,Math.ceil(w/COMPONENT_MODULE));
  const nz=Math.max(1,Math.ceil(d/COMPONENT_MODULE));
  const sx=w/nx,sz=d/nz;
  const ux=Math.cos(rot),uz=Math.sin(rot),vx=-Math.sin(rot),vz=Math.cos(rot);
  for(let ix=0;ix<nx;ix++)for(let iz=0;iz<nz;iz++){
    const lx=-w*.5+sx*(ix+.5),lz=-d*.5+sz*(iz+.5);
    addWorldBox({
      kind:'componentBox',
      x:x+ux*lx+vx*lz,z:z+uz*lx+vz*lz,baseH,
      width:sx,depth:sz,height:h,
      ux,uz,nx:vx,nz:vz,
      material:color,seed:seed+ix*37+iz*11,
      stableId:COMPONENT_SERIAL++
    });
  }
}
function slotBlock(frame,lx,lz,y,color,seed){
  slotBox(frame,lx,lz,y*.62,.66,.66,.62,color,seed);
}
function componentFaceComparator(a,b){
  const da=a.ownerDepth==null?a.depth:a.ownerDepth;
  const db=b.ownerDepth==null?b.depth:b.ownerDepth;
  if(Math.abs(da-db)>.0005)return da-db;
  const ha=a.ownerBaseH==null?(a.minH||0):a.ownerBaseH;
  const hb=b.ownerBaseH==null?(b.minH||0):b.ownerBaseH;
  if(Math.abs(ha-hb)>.0005)return ha-hb;
  return (a.faceOrder||0)-(b.faceOrder||0)||(a.stableId||0)-(b.stableId||0);
}


/* ---------- circular structure builders ---------- */

function buildRingTower(frame,seed,tall=false){
  const levels=tall?7:5;
  for(let y=0;y<levels;y++){
    const r=Math.max(0,(tall?2:2)-Math.floor(y/2));
    for(let gx=-r;gx<=r;gx++)for(let gz=-r;gz<=r;gz++){
      if(Math.abs(gx)+Math.abs(gz)>r+1)continue;
      slotBlock(frame,gx*.68,gz*.68,y,BLOCK_COLORS[(seed+gx*3+gz*5+y+40)%BLOCK_COLORS.length],seed*100+y*30+gx*7+gz);
    }
  }
}
function buildRingMonument(frame,seed){
  slotBox(frame,0,0,.02,4.2,2.7,.22,'#44382f',seed+1);
  slotBox(frame,0,0,.24,3.1,2.0,.22,'#594539',seed+2);
  slotBox(frame,0,0,.46,2.0,1.35,.22,'#6a5040',seed+3);
  slotBox(frame,0,0,.68,.82,.82,3.00,'#62503f',seed+4);
  for(const [x,z,i] of [[-1.35,-.72,0],[1.35,-.72,1],[-1.35,.72,2],[1.35,.72,3]]){
    slotBox(frame,x,z,.68,.48,.48,1.82,i%2?'#48574d':'#604538',seed+20+i);
    slotBox(frame,x,z,2.50,.62,.62,.20,'#79523a',seed+30+i);
  }
}
function buildRingGate(frame,seed){
  for(const sx of [-1,1]){
    for(let y=0;y<4;y++)slotBox(frame,sx*.92,0,.02+y*.56,.56,.58,.54,y%2?'#4c352d':'#5b4033',seed+sx*10+y);
  }
  slotBox(frame,0,0,2.28,2.42,.58,.42,'#684431',seed+30);
  for(let k=-3;k<=3;k++)slotBox(frame,k*.30,-.03,.04,.085,.18,2.08,'#241714',seed+40+k);
}
function buildRingBridge(frame,seed){
  for(const sx of [-1,1]){
    slotBox(frame,sx*2.08,0,.02,.72,.72,1.56,'#4a3b31',seed+sx*10);
    slotBox(frame,sx*1.32,0,.02,.52,.52,.90,'#3f3630',seed+sx*20);
  }
  for(let i=-5;i<=5;i++)slotBox(frame,i*.42,0,1.58,.38,.66,.16,i%2?'#65513f':'#4f4439',seed+50+i);
  for(const side of [-1,1])for(let i=-5;i<=5;i+=2)slotBox(frame,i*.42,side*.31,1.75,.10,.10,.42,'#6d4d36',seed+80+side*20+i);
}
function buildRingWorkshop(frame,seed){
  slotBox(frame,0,0,.02,2.85,1.95,.14,'#414038',seed+1);
  for(const sx of [-1,1])for(const sz of [-1,1])slotBox(frame,sx*1.10,sz*.66,.16,.13,.13,1.42,'#765038',seed+10+(sx>0?4:0)+(sz>0?1:0));
  for(let i=0;i<6;i++)slotBox(frame,-.68+(i%3)*.46,-.26+Math.floor(i/3)*.45,.16,.32,.32,.24,BLOCK_COLORS[(seed+i)%BLOCK_COLORS.length],seed+30+i);
  slotBox(frame,0,.55,1.00,1.55,.12,.65,'#4d7770',seed+60);
}
function buildRingArchive(frame,seed){
  for(let y=0;y<8;y++){
    const w=1.72-y*.09;
    slotBox(frame,0,0,.02+y*.58,w,w,.54,y%2?'#34483d':'#4b4034',seed+y*10);
    if(y===2||y===5)for(const sx of [-1,1])slotBox(frame,sx*(w*.62),0,.02+y*.58,.24,.24,.54,'#6b4935',seed+80+y*5+(sx>0?1:0));
  }
}
function buildCircularStructureWorld(){
  resetWorldGeometry();
  resetWorldEmissive();
  COMPONENT_SERIAL=1;
  const slots=COMPONENT_WORLD.slots.map(s=>slotFrame(s,COMPONENT_WORLD.structureRadius));
  buildRingTower(slots[0],1,false);
  buildRingMonument(slots[1],2);
  buildRingGate(slots[2],3);
  buildRingBridge(slots[3],4);
  buildRingWorkshop(slots[4],5);
  buildRingArchive(slots[5],6);
  buildRingTower(slots[6],7,true);
}
function drawRingLabels(c,slots=COMPONENT_WORLD.slots){
  c.save();c.textAlign='center';c.textBaseline='middle';
  c.font='750 '+Math.max(7,scale*.27)+'px system-ui';

    const f=slotFrame(slot,COMPONENT_WORLD.ringRadius);
    const front=slotFrontness(f);
    if(front<-.50)continue;
    const p=wp(f.x,f.z,-.18);
    c.globalAlpha=.24+.58*clamp((front+.5)/1.5,0,1);
    c.fillStyle='#c7aa89';
    c.fillText(slot.label,p.x,p.y+scale*.72);
  }
  c.restore();
}
function drawStructureGallery(now){
  buildCircularStructureWorld();
  const gpuOK=renderWorldSolidsGL(ctx);

    const faces=compileWorldFaces();
    faces.sort(componentFaceComparator);

}

/* =========================================================
   HEAVY VISUAL SHOWROOM
   Purpose: make the architecture physically obvious.
   These are world-space prototypes, not UI diagrams.
   ========================================================= */

const WORLD_MATERIALS={
  stone:{base:'#514238',opaque:true,top:18,stroke:'rgba(9,6,5,.96)'},
  road:{base:'#40372f',opaque:true,top:12,stroke:'rgba(9,6,5,.96)'},
  structure:{base:'#4d5147',opaque:true,top:16,stroke:'rgba(9,6,5,.96)'},
  archive:{base:'#343b35',opaque:true,top:10,stroke:'rgba(9,6,5,.96)'}
};
const WORLD_GEOM={boxes:[],transparent:[],stats:{boxes:0,baseFaces:0,culledInternal:0,culledBack:0,faces:0,transparent:0}};
const WORLD_FACE_BUDGET=2400;

function resetWorldGeometry(){
  WORLD_GEOM.boxes.length=0;
  WORLD_GEOM.transparent.length=0;
  WORLD_GEOM.stats={boxes:0,baseFaces:0,culledInternal:0,culledBack:0,faces:0,transparent:0};
}

function materialSpec(material){
  if(material&&WORLD_MATERIALS[material])return WORLD_MATERIALS[material];
  if(typeof material==='string'&&material[0]==='#')return {base:material,opaque:true,top:17,stroke:'rgba(9,6,5,.96)'};
  return WORLD_MATERIALS.stone;
}

function addWorldBox(box){
  box.material=materialSpec(box.material||box.color);
  box.solid=box.solid!==false;
  WORLD_GEOM.boxes.push(box);
  WORLD_GEOM.stats.boxes++;
}

function heavyWorldCuboid(c,x,z,baseH,w,height,color,seed){
  if(c===sctx){
    drawWorldCuboid(c,x,z,baseH,w,height,color,seed);
    return;
  }
  addWorldBox({
    kind:'axisBox',x,z,baseH,width:w,depth:w,height,
    ux:1,uz:0,nx:0,nz:1,material:color,seed
  });
}

function heavyBoardCuboid(c,base,lx,ly,w,h,d,color,seed){
  if(c===sctx){
    drawBoardCuboid(c,base,lx,ly,w,h,d,color,seed);
    return;
  }
  const center=boardWorldPoint(base,lx,ly,0);
  addWorldBox({
    kind:'boardBox',x:center.x,z:center.z,baseH:center.h-h*.5,
    width:w,depth:d,height:h,
    ux:base.ux,uz:base.uz,nx:base.nx,nz:base.nz,
    material:color,seed
  });
}

function worldCorner(box,su,sn,h){
  return {
    x:box.x+box.ux*su*box.width*.5+box.nx*sn*box.depth*.5,
    z:box.z+box.uz*su*box.width*.5+box.nz*sn*box.depth*.5,
    h
  };
}

function boxBaseFaces(box){
  const b=box.baseH,t=box.baseH+box.height;
  const bm=worldCorner(box,-1,-1,b),bp=worldCorner(box,1,-1,b);
  const bpp=worldCorner(box,1,1,b),bmp=worldCorner(box,-1,1,b);
  const tm=worldCorner(box,-1,-1,t),tp=worldCorner(box,1,-1,t);
  const tpp=worldCorner(box,1,1,t),tmp=worldCorner(box,-1,1,t);
  return [
    {corners:[bm,bp,tp,tm],nx:-box.nx,nz:-box.nz,nh:0,du:box.width,dv:box.height,seed:box.seed+1,box},
    {corners:[bp,bpp,tpp,tp],nx:box.ux,nz:box.uz,nh:0,du:box.depth,dv:box.height,seed:box.seed+2,box},
    {corners:[bpp,bmp,tmp,tpp],nx:box.nx,nz:box.nz,nh:0,du:box.width,dv:box.height,seed:box.seed+3,box},
    {corners:[bmp,bm,tm,tmp],nx:-box.ux,nz:-box.uz,nh:0,du:box.depth,dv:box.height,seed:box.seed+4,box},
    {corners:[tm,tp,tpp,tmp],nx:0,nz:0,nh:1,du:box.width,dv:box.depth,seed:box.seed+5,box},
    {corners:[bmp,bpp,bp,bm],nx:0,nz:0,nh:-1,du:box.width,dv:box.depth,seed:box.seed+6,box}
  ];
}

function faceCoincidenceKey(face){
  return face.corners.map(p=>
    Math.round(p.x*1000)+','+Math.round(p.z*1000)+','+Math.round(p.h*1000)
  ).sort().join('|');
}

function lerpWorld(a,b,t){
  return {x:a.x+(b.x-a.x)*t,z:a.z+(b.z-a.z)*t,h:a.h+(b.h-a.h)*t};
}
function bilerpWorld(corners,u,v){
  const a=lerpWorld(corners[0],corners[1],u);
  const b=lerpWorld(corners[3],corners[2],u);
  return lerpWorld(a,b,v);
}

function tileCounts(face){
  const projected=Math.max(face.du,face.dv)*scale;
  let tileWorld=999;
  if(projected>28)tileWorld=.72;
  else if(projected>15)tileWorld=1.15;
  let nu=clamp(Math.ceil(face.du/tileWorld),1,5);
  let nv=clamp(Math.ceil(face.dv/tileWorld),1,5);
  const remaining=Math.max(1,WORLD_FACE_BUDGET-WORLD_GEOM.stats.faces);
  if(nu*nv>remaining){nu=1;nv=1}
  return {nu,nv};
}

function makeRenderFace(face,corners,tileIndex){
  const pts=corners.map(p=>wp(p.x,p.z,p.h));
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),ds=pts.map(p=>p.zv),hs=corners.map(p=>p.h);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  if(maxX<-8||minX>IW+8||maxY<-8||minY>IH+8)return null;

  const mat=face.box.material;
  const amount=face.nh>0?mat.top:faceTone(face.nx,face.nz);
  const depth=ds.reduce((a,b)=>a+b,0)/ds.length;
  const py=ys.reduce((a,b)=>a+b,0)/ys.length;
  return {
    type:'geomFace',
    pts,
    ownerDepth:wp(face.box.x,face.box.z,face.box.baseH+face.box.height*.5).zv,
    ownerBaseH:face.box.baseH,
    stableId:face.box.stableId||face.box.seed||0,
    faceOrder:face.nh>0?5:(face.nh<0?0:2),
    fill:shade(mat.base,amount),
    stroke:mat.stroke,
    seed:face.seed+tileIndex*17,
    depth,py,
    minDepth:Math.min(...ds),maxDepth:Math.max(...ds),
    minH:Math.min(...hs),maxH:Math.max(...hs),
    bounds:{minX,maxX,minY,maxY}
  };
}

function compileWorldFaces(){
  const raw=[];
  for(const box of WORLD_GEOM.boxes)raw.push(...boxBaseFaces(box));
  WORLD_GEOM.stats.baseFaces=raw.length;

  // Exact touching faces of solid boxes cancel before rasterization.
  const byKey=new Map();
  for(let i=0;i<raw.length;i++){
    const key=faceCoincidenceKey(raw[i]);
    if(!byKey.has(key))byKey.set(key,[]);
    byKey.get(key).push(i);
  }
  const internal=new Set();
  for(const ids of byKey.values()){
    if(ids.length>1)for(const id of ids)internal.add(id);
  }
  WORLD_GEOM.stats.culledInternal=internal.size;

  const cameraX=Math.sin(yaw),cameraZ=Math.cos(yaw);
  const out=[];
  for(let fi=0;fi<raw.length;fi++){
    if(internal.has(fi))continue;
    const face=raw[fi];

    // Closed solids never expose their bottom or camera-away faces.
    if(face.nh<0){WORLD_GEOM.stats.culledBack++;continue}
    if(face.nh===0 && face.nx*cameraX+face.nz*cameraZ<=0){
      WORLD_GEOM.stats.culledBack++;continue;
    }

    const {nu,nv}=tileCounts(face);
    for(let iv=0;iv<nv;iv++)for(let iu=0;iu<nu;iu++){
      if(WORLD_GEOM.stats.faces>=WORLD_FACE_BUDGET)break;
      const u0=iu/nu,u1=(iu+1)/nu,v0=iv/nv,v1=(iv+1)/nv;
      const corners=[
        bilerpWorld(face.corners,u0,v0),
        bilerpWorld(face.corners,u1,v0),
        bilerpWorld(face.corners,u1,v1),
        bilerpWorld(face.corners,u0,v1)
      ];
      const rf=makeRenderFace(face,corners,iu+iv*nu);
      if(rf){out.push(rf);WORLD_GEOM.stats.faces++}
    }
  }
  window.WORLD_RENDER_STATS={
    ...WORLD_GEOM.stats,
    budget:WORLD_FACE_BUDGET,
    pressure:WORLD_GEOM.stats.faces/WORLD_FACE_BUDGET,
    mode:LAB_VISUAL
  };
  return out;
}

function renderGeomFace(c,it){
  fillRagged(c,it.pts,it.fill,it.stroke,Math.max(.55,scale*.030),it.seed);
}

function renderBoundsOverlap(a,b){
  if(!a.bounds||!b.bounds)return true;
  return !(a.bounds.maxX<b.bounds.minX||b.bounds.maxX<a.bounds.minX||
           a.bounds.maxY<b.bounds.minY||b.bounds.maxY<a.bounds.minY);
}

function renderItemComparator(a,b){
  const aMinD=a.minDepth==null?a.depth:a.minDepth;
  const aMaxD=a.maxDepth==null?a.depth:a.maxDepth;
  const bMinD=b.minDepth==null?b.depth:b.minDepth;
  const bMaxD=b.maxDepth==null?b.depth:b.maxDepth;

  if(aMaxD<bMinD-.025)return -1;
  if(bMaxD<aMinD-.025)return 1;

  // When surfaces occupy nearly the same depth, vertical stacking wins.
  // This is what keeps a raised tower above the top tiles of its own base.
  const closeDepth=Math.abs(a.depth-b.depth)<.38;
  if(closeDepth&&renderBoundsOverlap(a,b)&&a.minH!=null&&a.maxH!=null&&b.minH!=null&&b.maxH!=null){
    if(a.maxH<=b.minH+.012)return -1;
    if(b.maxH<=a.minH+.012)return 1;
  }

  return a.depth-b.depth ||
    ((a.minH==null?a.h||0:a.minH)-(b.minH==null?b.h||0:b.minH)) ||
    a.py-b.py;
}

function queueGhostBox(x,z,baseH,w,height,color,seed){
  const p=wp(x,z,baseH+height*.5);
  WORLD_GEOM.transparent.push({x,z,baseH,w,height,color,seed,depth:p.zv,py:p.y});
  WORLD_GEOM.stats.transparent++;
}

function flushTransparentGeometry(c){
  WORLD_GEOM.transparent.sort((a,b)=>a.depth-b.depth||a.py-b.py);
  for(const it of WORLD_GEOM.transparent)drawGhostCuboidNow(c,it.x,it.z,it.baseH,it.w,it.height,it.color,it.seed);
}

function heavyOn(name){return LAB_VISUAL==='all'||LAB_VISUAL===name}

function heavyBasis(x,z,h,ux,uz){
  const len=Math.max(.001,Math.hypot(ux,uz));
  ux/=len;uz/=len;
  return {
    a:{x,z,h,ang:Math.atan2(z,x)},
    ux,uz,
    nx:-uz,nz:ux,
    facing:1
  };
}

function heavyRoadFrame(edge,t){
  const p=labRoadPoint(edge,t);if(!p)return null;
  const e=.012;
  const p2=labRoadPoint(edge,clamp(t+e,0,1))||p;
  return heavyBasis(p.x,p.z,.04,p2.x-p.x,p2.z-p.z);
}

function drawHeavyRoadNetwork(c,manifest,now){
  if(!heavyOn('roads')&&!heavyOn('gates')&&!heavyOn('all'))return;
  for(let ei=0;ei<manifest.edges.length;ei++){
    const edge=manifest.edges[ei];
    if(!labEdgeSites(edge))continue;
    const pieces=24;
    for(let i=0;i<pieces;i++){
      if(edge.status==='blocked'&&i>=11&&i<=13)continue;
      const t=(i+.5)/pieces,base=heavyRoadFrame(edge,t);if(!base)continue;
      const critical=edge.critical;
      const stone=edge.status==='ready'?'#6b4932':edge.status==='blocked'?'#3b2a25':'#40372f';
      heavyBoardCuboid(c,base,0,0,.48,.12,.42,stone,21100+ei*100+i*3);
      if(critical){
        heavyBoardCuboid(c,base,0,.075,.20,.045,.18,'#9a512c',21200+ei*100+i*3);
      }
    }
    if(edge.status==='blocked')drawHeavyMonumentGate(c,edge,now,ei);
  }
}

function drawHeavyMonumentGate(c,edge,now,index){
  if(!heavyOn('gates')&&!heavyOn('all')&&!heavyOn('roads'))return;
  const pair=labEdgeSites(edge);if(!pair)return;
  const p=labRoadPoint(edge,.52);if(!p)return;
  const dx=pair.b.x-pair.a.x,dz=pair.b.z-pair.a.z,len=Math.max(.001,Math.hypot(dx,dz));
  const nx=-dz/len,nz=dx/len;
  const base=heavyBasis(p.x,p.z,0,nx,nz);

  // Two massive pylons, each visibly assembled from blocks.
  for(const side of [-1,1]){
    const lx=side*.82;
    for(let y=0;y<4;y++){
      heavyBoardCuboid(c,base,lx,.32+y*.58,.48,.54,.52,y%2?'#4c352d':'#5b4033',21600+index*100+(side>0?30:0)+y*7);
    }
    heavyBoardCuboid(c,base,lx,2.62,.62,.34,.58,'#6a4735',21700+index*30+(side>0?1:0));
  }
  // Lintel and dark portcullis.
  heavyBoardCuboid(c,base,0,2.72,2.18,.40,.50,'#684431',21730+index);
  for(let k=-2;k<=2;k++){
    heavyBoardCuboid(c,base,k*.27,1.34,.09,2.15,.08,'#241714',21800+index*20+k+3);
  }
  // Small ember studs make the blocked state readable without neon UI.
  for(const sx of [-1,1]){
    heavyBoardCuboid(c,base,sx*.58,2.69,.12,.12,.09,'#a94d2b',21880+index*10+(sx>0?1:0));
  }
}

function drawHeavyFocusMonument(c,manifest,now){
  if(!heavyOn('focus')&&!heavyOn('all'))return;
  // Focus is a physical objective, not a badge.
  groundPatch(c,0,0,2.75,1.46,'#241b16',.72,22000,20);
  groundPatch(c,0,0,1.95,1.02,'#69432d',.22,22020,18);

  // Concentric stepped dais.
  for(let y=0;y<3;y++){
    const w=3.10-y*.62;
    heavyWorldCuboid(c,0,0,.02+y*.18,w,.17,y===2?'#554538':'#3b332c',22100+y*13);
  }

  // Four sentinel pylons.
  const sent=[[-1.45,-.80],[1.45,-.80],[-1.45,.80],[1.45,.80]];
  for(let i=0;i<sent.length;i++){
    const [x,z]=sent[i];
    heavyWorldCuboid(c,x,z,.54,.42,1.30,i%2?'#48574d':'#604538',22160+i*11);
    heavyWorldCuboid(c,x,z,1.84,.54,.18,'#79523a',22220+i*7);
  }

  // Central unresolved objective. Height reacts to aggregate durable progress.
  const ratio=manifest.metrics.durable_progress;
  const h=1.55+ratio*2.2;
  heavyWorldCuboid(c,0,0,.57,.78,h,'#62503f',22300);
  heavyWorldCuboid(c,0,0,.57+h,.98,.20,ratio>.72?'#9a6335':'#45362d',22320);

  // Causal spokes stop at the center instead of drawing HUD arrows.
  for(let i=0;i<4;i++){
    const a=i*TAU/4+.25;
    for(let j=0;j<5;j++){
      const r=2.3+j*.38,x=Math.cos(a)*r,z=Math.sin(a)*r;
      heavyWorldCuboid(c,x,z,.025,.24,.055,j<Math.round(ratio*5)?'#77462d':'#30251f',22380+i*30+j);
    }
  }
}

function drawHeavyWorkshop(c,site,index,manifest,now){
  const a=Math.atan2(site.z,site.x);
  const x=site.x+Math.cos(a)*3.00,z=site.z+Math.sin(a)*3.00;
  const agents=manifest.agents.filter(a0=>a0.assignment==='tower-'+index).length;
  const active=agents>0||site.blueprints.size>0;

  groundPatch(c,x,z,1.25,.70,active?'#43372e':'#27241f',.68,22600+index,16);
  // Raised work platform.
  heavyWorldCuboid(c,x,z,.02,1.45,.12,active?'#4d4d41':'#34332d',22640+index*17);
  // Four scaffold posts.
  for(const sx of [-1,1])for(const sz of [-1,1]){
    heavyWorldCuboid(c,x+sx*.62,z+sz*.38,.14,.12,.94,active?'#6c4a32':'#45372b',22700+index*40+(sx>0?10:0)+(sz>0?1:0));
  }
  // Material stacks. Their amount reflects assigned agents.
  for(let m=0;m<Math.min(4,Math.max(1,agents));m++){
    const ox=-.38+(m%2)*.40,oz=-.17+Math.floor(m/2)*.34;
    heavyWorldCuboid(c,x+ox,z+oz,.15,.28,.22,BLOCK_COLORS[(index+m*2)%BLOCK_COLORS.length],22800+index*30+m);
  }
  // Blueprint slab is distinct from accepted tower blocks.
  if(active){
    const base=heavyBasis(x,z,.46,-Math.sin(a),Math.cos(a));
    heavyBoardCuboid(c,base,0,0,.82,.06,.52,'#4d7770',22900+index);
  }
}

function drawHeavyWorkshops(c,manifest,now){
  if(!heavyOn('workshops')&&!heavyOn('all'))return;
  for(let i=0;i<sites.length;i++)drawHeavyWorkshop(c,sites[i],i,manifest,now);
}

function drawGhostCuboidNow(c,x,z,baseH,w,height,color,seed){
  const g=blockGeometry(x,z,baseH,baseH+height,w*.5);
  c.save();c.globalAlpha=.58;c.setLineDash([Math.max(1,scale*.08),Math.max(1,scale*.06)]);
  const edges=[[g.A,g.B],[g.B,g.Cc],[g.Cc,g.D],[g.D,g.A],[g.At,g.Bt],[g.Bt,g.Ct],[g.Ct,g.Dt],[g.Dt,g.At],[g.A,g.At],[g.B,g.Bt],[g.Cc,g.Ct],[g.D,g.Dt]];
  for(let i=0;i<edges.length;i++)roughStroke(c,edges[i],color,Math.max(.55,scale*.028),seed+i,false);
  c.restore();
}
function drawGhostCuboid(c,x,z,baseH,w,height,color,seed){

  queueGhostBox(x,z,baseH,w,height,color,seed);

function drawHeavyStateGallery(c,now){
  if(!heavyOn('states')&&!heavyOn('all'))return;
  const specs=[
    {a:2.72,r:9.8,state:'intent'},
    {a:2.28,r:10.1,state:'active'},
    {a:1.84,r:10.3,state:'accepted'},
    {a:1.40,r:10.4,state:'failed'},
    {a:.96,r:10.3,state:'history'}
  ];
  for(let i=0;i<specs.length;i++){
    const s=specs[i],x=Math.cos(s.a)*s.r,z=Math.sin(s.a)*s.r;
    groundPatch(c,x,z,.88,.48,s.state==='failed'?'#2d1714':'#1d1b18',.62,23100+i,14);

   HEAVY BRANCH LAB
   Universal manifest + roads + artifact transport + work pads
   Everything below is additive. Canonical Coliseo remains untouched.

function labFixtureEdges(now){
  const mk=(from,to,status='relation',critical=false)=>({
    id:'edge-'+from+'-'+to,from:'tower-'+from,to:'tower-'+to,status,critical
  });
  const mg=(from,to,status='relation',critical=false)=>({
    id:'edge-'+from+'-'+to,from,to,status,critical
  });
  if(LAB_FIXTURE==='20'||LAB_FIXTURE==='100'){
    const count=LAB_FIXTURE==='100'?100:20,edges=[];
    for(let i=5;i<count;i++){
      const id='ghost-'+i;
      const cluster='ghost-'+(5+((i-5)%Math.min(8,count-5)));
      const to=i<13?'tower-4':(cluster===id?'tower-4':cluster);
      edges.push(mg(id,to,i%11===0?'blocked':'relation',i%17===0));
    }
    return edges;
  }
  if(LAB_FIXTURE==='fanin'){
    return [mk(0,4,'relation',false),mk(1,4,'relation',false),mk(2,4,'blocked',false),mk(3,4,'ready',true)];
  }
  if(LAB_FIXTURE==='parallel'){
    return [mk(0,4,'ready',true),mk(1,4,'relation',false),mk(2,4,'relation',false),mk(3,4,'relation',false)];
  }
  if(LAB_FIXTURE==='dynamic'){
    const phase=Math.floor(now/(LAB_FAST?4500:9000))%3;
    if(phase===0)return [mk(0,1,'ready',true),mk(1,2,'relation',true),mk(2,3,'blocked',true),mk(3,4,'relation',true)];
    if(phase===1)return [mk(0,4,'relation',false),mk(1,4,'ready',true),mk(2,4,'relation',false),mk(3,4,'blocked',false)];
    return [mk(0,2,'relation',false),mk(1,2,'ready',true),mk(2,4,'relation',true),mk(3,4,'relation',false)];
  }
  return [mk(0,1,'ready',true),mk(1,2,'relation',true),mk(2,3,'blocked',true),mk(3,4,'relation',true)];
}

function labLayoutTargets(nodes,edges){
  const focusId='tower-4';
  const reverse=new Map(nodes.map(n=>[n.id,[]]));
  for(const e of edges){
    if(!reverse.has(e.to))reverse.set(e.to,[]);
    reverse.get(e.to).push(e.from);
  }
  const dist=new Map([[focusId,0]]),queue=[focusId];
  while(queue.length){
    const id=queue.shift(),d=dist.get(id);
    for(const prev of (reverse.get(id)||[])){
      if(!dist.has(prev)){dist.set(prev,d+1);queue.push(prev)}
    }
  }
  const groups=new Map();
  for(const n of nodes){
    const d=dist.has(n.id)?dist.get(n.id):3;
    if(!groups.has(d))groups.set(d,[]);
    groups.get(d).push(n);
  }
  const out={};
  for(const [d,arr] of groups){
    const r=3.2+d*2.15;
    arr.forEach((n,i)=>{
      const a=-Math.PI/2+(i-(arr.length-1)/2)*Math.min(.72,TAU/Math.max(6,arr.length));
      out[n.id]={x:Math.cos(a)*r,z:Math.sin(a)*r,ring:d};
    });
  }
  return out;
}

function labTransportState(now,edges){
  if(!edges.length)return null;
  const cycle=LAB_FAST?6500:12000;
  const raw=(now%cycle)/cycle;
  const edge=edges[Math.floor((now/cycle))%edges.length];
  if(raw<.16)return {edge,state:'idle',t:0};
  if(raw<=.84)return {edge,state:'transfer',t:clamp((raw-.16)/.68,0,1)};
  return {edge,state:'delivered',t:1};
}

const LAB_EVENT_MEMORY=new Map();
function labSyntheticEvents(now){
  const events=[];
  for(let i=0;i<players.length;i++){
    const pl=players[i],id='agent-'+i;
    const moving=Math.hypot(pl.x-pl.lastX,pl.z-pl.lastZ)>.012||!!pl.segment;
    const task=pl.task?pl.task.type:'idle';
    const prev=LAB_EVENT_MEMORY.get(id)||{assignment:null,moving:false,task:'idle'};
    const assignment='tower-'+pl.siteIndex;
    if(prev.assignment!==assignment)events.push({type:'TAKE',agent_id:id,node_id:assignment,at:now});
    if(moving&&!prev.moving)events.push({type:'PROGRESS',agent_id:id,node_id:assignment,at:now});
    if(prev.task!=='idle'&&task==='idle')events.push({type:'SUBMIT',agent_id:id,node_id:assignment,at:now});
    LAB_EVENT_MEMORY.set(id,{assignment,moving,task});
  }
  return events;
}
function buildWorldManifest(now){
  const edges=labFixtureEdges(now);
  const nodes=sites.map((site,i)=>({
    id:'tower-'+i,
    label:TOWER_NAMES[i]||('NODE '+i),
    kind:'node',
    status:site.ritual?'complete':(site.blueprints.size?'active':'ready'),
    durable_progress:siteProgress(site).ratio,
    importance:i===4?1:.55+.09*i,
    position:{x:site.x,z:site.z},
    layout_hint:null
  }));
  if(LAB_FIXTURE==='20'||LAB_FIXTURE==='100'){
    const count=LAB_FIXTURE==='100'?100:20;
    for(let i=5;i<count;i++){
      nodes.push({
        id:'ghost-'+i,label:'N'+String(i).padStart(2,'0'),kind:'node',ghost:true,
        status:i%11===0?'blocked':(i%3===0?'active':'ready'),
        durable_progress:((i*37)%100)/100,
        importance:.20+((i*13)%70)/100,
        position:null,layout_hint:null
      });
    }
  }
  const targets=labLayoutTargets(nodes,edges);
  for(const n of nodes)n.layout_hint=targets[n.id]||null;
  const agents=players.map((pl,i)=>({
    id:'agent-'+i,
    assignment:'tower-'+pl.siteIndex,
    liveness:pl.energy>.18?'working':'suspect',
    energy:pl.energy,
    position:{x:pl.x,z:pl.z,h:pl.h}
  }));
  const transit=labTransportState(now,edges);
  const artifacts=transit&&transit.state!=='idle'?[{
    id:'artifact-demo-0',source:transit.edge.from,destination:transit.edge.to,
    status:transit.state==='transfer'?'in_transit':'delivered',durable:true,t:transit.t
  }]:[];
  const manifest={
    schema:'prometeo.world_manifest/demo-v1',
    synthetic:true,
    fixture:LAB_FIXTURE,
    baseline_sha:LAB_BASELINE,
    build:LAB_BUILD,
    nodes,edges,agents,artifacts,
    events:labSyntheticEvents(now),
    focus:{node_id:'tower-4'},
    metrics:{
      frontier:nodes.filter(n=>n.status==='ready').length,
      working:agents.filter(a=>a.liveness==='working').length,
      durable_progress:nodes.reduce((a,n)=>a+n.durable_progress,0)/Math.max(1,nodes.length)
    }
  };
  window.WORLD_MANIFEST_DEMO=manifest;
  return manifest;
}

function labNodeIndex(id){
  const n=Number(String(id).replace('tower-',''));
  return Number.isFinite(n)?n:-1;
}
function labEdgeSites(edge){
  const a=sites[labNodeIndex(edge.from)],b=sites[labNodeIndex(edge.to)];
  return a&&b?{a,b}:null;
}
function labRoadPoint(edge,t){
  const pair=labEdgeSites(edge);if(!pair)return null;
  const a=pair.a,b=pair.b;
  const mx=(a.x+b.x)*.5,mz=(a.z+b.z)*.5;
  const dx=b.x-a.x,dz=b.z-a.z,len=Math.max(.001,Math.hypot(dx,dz));
  const nx=-dz/len,nz=dx/len;
  const bend=(hash(labNodeIndex(edge.from),labNodeIndex(edge.to))-.5)*1.35;
  const cx0=mx+nx*bend,cz0=mz+nz*bend;
  const u=1-t;
  return {
    x:u*u*a.x+2*u*t*cx0+t*t*b.x,
    z:u*u*a.z+2*u*t*cz0+t*t*b.z
  };
}
function drawLabRoadSegment(c,p0,p1,width,color,alpha,seed){
  const dx=p1.x-p0.x,dz=p1.z-p0.z,len=Math.max(.001,Math.hypot(dx,dz));
  const nx=-dz/len,nz=dx/len,hw=width*.5;
  const pts=[
    wp(p0.x+nx*hw,p0.z+nz*hw,.028),
    wp(p1.x+nx*hw,p1.z+nz*hw,.028),
    wp(p1.x-nx*hw,p1.z-nz*hw,.028),
    wp(p0.x-nx*hw,p0.z-nz*hw,.028)
  ];
  c.save();c.globalAlpha=alpha;fillRagged(c,pts,color,'rgba(15,9,7,.78)',Math.max(.45,scale*.025),seed);c.restore();
}
function drawLabRoad(c,edge,now){
  if(!labEdgeSites(edge))return;
  const pieces=18,width=edge.critical?.28:.22;
  const col=edge.status==='blocked'?'#3a2420':edge.status==='ready'?'#7b4a2b':'#332821';
  for(let i=0;i<pieces;i++){
    if(i%2===1&&edge.status==='blocked'&&i>7&&i<11)continue;
    const p0=labRoadPoint(edge,i/pieces),p1=labRoadPoint(edge,(i+.72)/pieces);
    drawLabRoadSegment(c,p0,p1,width,col,edge.critical?.62:.42,18100+i+labNodeIndex(edge.from)*31);
  }
}
function drawLabGate(c,edge,now){
  if(edge.status!=='blocked')return;
  const pair=labEdgeSites(edge);if(!pair)return;
  const p=labRoadPoint(edge,.55);if(!p)return;
  const dx=pair.b.x-pair.a.x,dz=pair.b.z-pair.a.z,len=Math.max(.001,Math.hypot(dx,dz));
  const nx=-dz/len,nz=dx/len;
  for(const side of [-1,1]){
    drawWorldCuboid(c,p.x+nx*.52*side,p.z+nz*.52*side,.02,.26,.95,'#4a3429',18400+(side>0?1:0));

  drawWorldCuboid(c,p.x,p.z,.80,.88,.18,'#5e3a2d',18410);

    const w=1.25-i*.07;
    drawWorldCuboid(c,x,z,i*.48,w,.46,i%2?'#34483d':'#4b4034',19220+i*11);
  }
  // Archive ruin: persistent/history prototype.
  const a2=-.92,r2=23.7,x2=Math.cos(a2)*r2,z2=Math.sin(a2)*r2;
  groundPatch(c,x2,z2,1.05,.55,'#0f0d0b',.54,19350,14);
  drawWorldCuboid(c,x2-.35,z2,.02,.52,.55,'#302a25',19370);
  drawWorldCuboid(c,x2+.22,z2+.16,.02,.42,.32,'#44352b',19380);
}
function drawLabSelection(c,manifest){
  if(LAB_SELECTED<0||LAB_SELECTED>=sites.length)return;
  const s=sites[LAB_SELECTED];
  groundPatch(c,s.x,s.z,2.05,1.05,'#b47a3c',.16,19500+LAB_SELECTED,18);
}
function labPickNode(screenX,screenY){
  let best=-1,bestD=Infinity;
  for(let i=0;i<sites.length;i++){
    const p=wp(sites[i].x,sites[i].z,.4);
    const d=Math.hypot(p.x-screenX,p.y-screenY);
    if(d<bestD){bestD=d;best=i}
  }
  if(bestD<Math.max(20,scale*1.6))return best;
  return -1;
}

function drawLabPool(c,manifest){
  // Pool is a neutral common-zone marker; current canonical workers are not rerouted yet.
  for(let i=0;i<6;i++){
    const a=i*TAU/6,r=1.25;
    const x=Math.cos(a)*r,z=Math.sin(a)*r;
    drawWorldCuboid(c,x,z,.015,.28,.07,'#2e3731',19400+i*5);
  }
}

function drawDynamic(now){
  drawComponentLab(now);
}
function frame(now){
  if(!visible){requestAnimationFrame(frame);return}
  if(COMPONENT_SPIN&&now>COMPONENT_USER_DRAG_UNTIL){
    yaw+=.0022;
    staticDirty=true;
  }
  if(now-last>=FRAME){
    if(staticDirty){paintBackdrop();staticDirty=false}
    drawDynamic(now);
    last=now-(now-last)%FRAME;
  }
  requestAnimationFrame(frame);
}
function pd(e){
  const pt=pointerPoint(e);
  pointers.set(e.pointerId,pt);canvas.setPointerCapture(e.pointerId);
  if(pointers.size===1)LAB_TAP_START={x:pt.x,y:pt.y};
  if(pointers.size===2){const p=[...pointers.values()];pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}
}
function pm(e){
  const old=pointers.get(e.pointerId);if(!old)return;
  const next=pointerPoint(e);pointers.set(e.pointerId,next);
  if(pointers.size===1){yaw+=(next.x-old.x)*.008;COMPONENT_USER_DRAG_UNTIL=performance.now()+2600;staticDirty=true}
  else if(pointers.size===2){
    const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if(pinch){zoom=clamp(zoom*d/pinch,.34,3.40);scale=Math.min(IW/37,IH/22.5)*zoom;staticDirty=true}
    pinch=d;
  }
}
function pu(e){
  if(LAB_TAP_START){
    const pt=pointerPoint(e);
    const dist=Math.hypot(pt.x-LAB_TAP_START.x,pt.y-LAB_TAP_START.y);
    if(dist<9){
      const sx=pt.x*(IW/Math.max(1,W)),sy=pt.y*(IH/Math.max(1,H));
      LAB_SELECTED=labPickNode(sx,sy);
      if(labBadge){
        if(LAB_SELECTED>=0){
          const m=window.WORLD_MANIFEST_DEMO;
          const n=m&&m.nodes.find(n=>n.id==='tower-'+LAB_SELECTED);
          labBadge.textContent='HEAVY · '+LAB_VISUAL.toUpperCase()+' · '+(n?n.label:'NODE')+' · '+Math.round((n?n.durable_progress:0)*100)+'%';
        }else labBadge.textContent='COMPONENT LAB · '+COMPONENT_MODE.toUpperCase();
      }
    }
  }
  LAB_TAP_START=null;pointers.delete(e.pointerId);pinch=0
}
canvas.addEventListener('pointerdown',pd);canvas.addEventListener('pointermove',pm);canvas.addEventListener('pointerup',pu);canvas.addEventListener('pointercancel',pu);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom*Math.exp(-e.deltaY*.0009),.34,3.40);scale=Math.min(IW/37,IH/22.5)*zoom;staticDirty=true},{passive:false});
addEventListener('resize',resize,{passive:true});
if(window.visualViewport)visualViewport.addEventListener('resize',resize,{passive:true});
document.addEventListener('visibilitychange',()=>{visible=!document.hidden;if(visible){last=0;staticDirty=true}});
resize();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
