0,0],[0,528,480,1008,1752,3804,4092,7182,8190,4088,2340,2340,0,0]];
const N = 14;
const COUNT = 100;
const canvas = document.getElementById("world");
const ctx = canvas.getContext("2d", {alpha:false});
const pauseButton = document.getElementById("pause");
const orderButton = document.getElementById("order");

let W=0,H=0,DPR=1,unit=3,footprint=42;
let paused=false, dragging=-1, orderedUntil=0, last=performance.now();
let pointerLast={x:0,y:0,t:0};
const creatures=[];

const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function makeCreature(i){
  const a=rnd(0,Math.PI*2);
  const speed=rnd(9,24);
  return {
    id:i, rows:RAW[i], x:0,y:0,
    vx:Math.cos(a)*speed, vy:Math.sin(a)*speed,
    phase:rnd(0,Math.PI*2), drift:rnd(.35,.9),
    turn:rnd(.8,1.8)
  };
}
for(let i=0;i<COUNT;i++) creatures.push(makeCreature(i));

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth; H=innerHeight;
  canvas.width=Math.round(W*DPR);
  canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled=false;

  const target=clamp(Math.min(W,H)*0.062,25,54);
  unit=Math.max(2,Math.floor(target/N));
  footprint=N*unit;

  if(!creatures[0]._placed) placeGrid(false);
  else for(const c of creatures){
    c.x=clamp(c.x,footprint/2,W-footprint/2);
    c.y=clamp(c.y,footprint/2,H-footprint/2);
  }
}

function placeGrid(hold=true){
  const top=44;
  const usableH=Math.max(80,H-top);
  const dx=W/10, dy=usableH/10;
  creatures.forEach((c,i)=>{
    const col=i%10,row=Math.floor(i/10);
    c.x=(col+.5)*dx;
    c.y=top+(row+.5)*dy;
    const a=rnd(0,Math.PI*2),s=rnd(9,22);
    c.vx=Math.cos(a)*s;c.vy=Math.sin(a)*s;
    c._placed=true;
  });
  if(hold) orderedUntil=performance.now()+900;
}

function drawSprite(c){
  const left=Math.round(c.x-footprint/2);
  const top=Math.round(c.y-footprint/2);
  ctx.fillStyle="#000";
  for(let y=0;y<N;y++){
    const row=c.rows[y];
    for(let x=0;x<N;x++){
      if(row & (1<<(N-1-x))){
        ctx.fillRect(left+x*unit,top+y*unit,unit,unit);
      }
    }
  }
}

function separate(){
  const minD=footprint*.66;
  const minD2=minD*minD;
  for(let i=0;i<COUNT;i++){
    const a=creatures[i];
    if(i===dragging) continue;
    for(let j=i+1;j<COUNT;j++){
      const b=creatures[j];
      if(j===dragging) continue;
      const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;
      if(d2>0 && d2<minD2){
        const d=Math.sqrt(d2),push=(minD-d)*.006;
        const nx=dx/d,ny=dy/d;
        a.vx-=nx*push;a.vy-=ny*push;
        b.vx+=nx*push;b.vy+=ny*push;
      }
    }
  }
}

function update(dt,t){
  if(paused || t<orderedUntil) return;
  separate();

  const half=footprint/2;
  const topBound=2;
  for(let i=0;i<COUNT;i++){
    if(i===dragging) continue;
    const c=creatures[i];

    c.vx += Math.sin(t*.00035*c.turn+c.phase)*c.drift*dt;
    c.vy += Math.cos(t*.00029*c.turn+c.phase)*c.drift*dt;

    let speed=Math.hypot(c.vx,c.vy);
    if(speed<8){
      const k=8/(speed||1); c.vx*=k;c.vy*=k;
    } else if(speed>27){
      const k=27/speed;c.vx*=k;c.vy*=k;
    }

    c.x+=c.vx*dt;
    c.y+=c.vy*dt;

    if(c.x<half){c.x=half;c.vx=Math.abs(c.vx)}
    if(c.x>W-half){c.x=W-half;c.vx=-Math.abs(c.vx)}
    if(c.y<topBound+half){c.y=topBound+half;c.vy=Math.abs(c.vy)}
    if(c.y>H-half){c.y=H-half;c.vy=-Math.abs(c.vy)}
  }
}

function render(now){
  const dt=Math.min(.034,(now-last)/1000||0);last=now;
  update(dt,now);
  ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
  for(const c of creatures) drawSprite(c);
  requestAnimationFrame(render);
}

function pointerPos(e){
  const r=canvas.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}

function hit(x,y){
  const half=footprint*.52;
  let best=-1,bestD=Infinity;
  for(let i=COUNT-1;i>=0;i--){
    const c=creatures[i];
    const dx=x-c.x,dy=y-c.y;
    if(Math.abs(dx)<=half && Math.abs(dy)<=half){
      const d=dx*dx+dy*dy;
      if(d<bestD){best=i;bestD=d}
    }
  }
  return best;
}

canvas.addEventListener("pointerdown",e=>{
  const p=pointerPos(e);
  dragging=hit(p.x,p.y);
  if(dragging<0) return;
  canvas.setPointerCapture(e.pointerId);
  const c=creatures[dragging];
  c.x=p.x;c.y=p.y;c.vx=0;c.vy=0;
  pointerLast={x:p.x,y:p.y,t:performance.now()};
});

canvas.addEventListener("pointermove",e=>{
  if(dragging<0) return;
  const p=pointerPos(e),c=creatures[dragging],now=performance.now();
  const dt=Math.max(16,now-pointerLast.t)/1000;
  c.vx=clamp((p.x-pointerLast.x)/dt,-90,90);
  c.vy=clamp((p.y-pointerLast.y)/dt,-90,90);
  const half=footprint/2;
  c.x=clamp(p.x,half,W-half);
  c.y=clamp(p.y,half,H-half);
  pointerLast={x:p.x,y:p.y,t:now};
});

function release(e){
  if(dragging<0) return;
  if(canvas.hasPointerCapture?.(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
  const c=creatures[dragging];
  if(Math.hypot(c.vx,c.vy)<7){
    const a=rnd(0,Math.PI*2),s=rnd(11,20);
    c.vx=Math.cos(a)*s;c.vy=Math.sin(a)*s;
  }
  dragging=-1;
}
canvas.addEventListener("pointerup",release);
canvas.addEventListener("pointercancel",release);

pauseButton.addEventListener("click",()=>{
  paused=!paused;
  pauseButton.textContent=paused?"SEGUIR":"PAUSA";
});
orderButton.addEventListener("click",()=>placeGrid(true));

addEventListener("resize",resize,{passive:true});
resize();
requestAnimationFrame(render);
})();
</script>
