<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Prometeo · Visual OS</title>
<style>
:root{color-scheme:dark;--bg:#050505;--fg:#f5f5f2;--muted:#8a8a84;--line:#2b2b28;--soft:#171715;--focus:#f5f5f2}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
button,input{font:inherit}button{color:inherit}
.shell{min-height:100dvh;height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;padding:max(16px,2vw) max(18px,3vw) max(14px,2vw);gap:0}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.mark{width:11px;height:11px;background:var(--fg);flex:0 0 auto}.brand strong{font-size:12px;letter-spacing:.16em;text-transform:uppercase}.brand span{font:700 10px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.clock{text-align:right;font:800 10px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);white-space:nowrap}
.breadcrumb{min-height:48px;display:flex;align-items:center;gap:8px;font:850 clamp(11px,1vw,14px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;white-space:nowrap;overflow:hidden}.breadcrumb span{overflow:hidden;text-overflow:ellipsis}.crumb-muted{color:var(--muted)}
.stage{min-height:0;display:grid;grid-template-columns:minmax(320px,.88fr) minmax(0,1.3fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.navpane{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);border-right:1px solid var(--line);padding-right:clamp(18px,3vw,44px)}
.categories{display:flex;gap:clamp(18px,3vw,48px);align-items:center;min-height:78px;overflow:hidden}
.category{appearance:none;border:0;background:transparent;padding:0;font-size:clamp(17px,2vw,28px);font-weight:900;letter-spacing:-.04em;opacity:.28;cursor:pointer;position:relative}
.category[aria-selected="true"]{opacity:1}.category[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:3px;background:var(--focus)}
.menu{min-height:0;overflow:auto;padding:6px 0 18px;scrollbar-width:none}.menu::-webkit-scrollbar{display:none}
.menu-row{width:100%;appearance:none;border:0;border-top:1px solid var(--soft);background:transparent;display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:66px;padding:8px 2px;text-align:left;cursor:pointer}
.menu-row:first-child{border-top:0}.menu-row .index{font:800 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}.menu-row .name{font-size:clamp(17px,1.7vw,25px);font-weight:820;letter-spacing:-.035em;line-height:1.05}.menu-row .state{font:850 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.09em;border:1px solid var(--line);padding:6px 7px;white-space:nowrap;color:var(--muted)}
.menu-row.active{padding-left:10px;background:var(--focus)}.menu-row.active .index,.menu-row.active .name{color:#050505}.menu-row.active .state{border-color:#050505;color:#050505}
.preview{min-width:0;min-height:0;padding:clamp(24px,4vw,62px);display:flex;flex-direction:column;justify-content:space-between;overflow:auto}.preview-top{max-width:850px}
.preview-kicker{font:850 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.preview h1{margin:12px 0 12px;font-size:clamp(38px,6vw,92px);line-height:.9;letter-spacing:-.07em;max-width:10ch}.preview .desc{margin:0;max-width:62ch;font-size:clamp(14px,1.35vw,20px);line-height:1.5;color:#c6c6c0}
.route{margin-top:24px;font:750 9px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);overflow-wrap:anywhere}
.preview-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}
.enter{appearance:none;border:1px solid var(--fg);background:var(--fg);color:var(--bg);min-height:44px;padding:0 16px;font:900 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.enter[disabled]{background:transparent;color:var(--muted);border-color:var(--line);cursor:default}.hint{text-align:right;font:750 9px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.footer{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:54px;font:750 9px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}.keys{white-space:nowrap}.signal{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.search-layer{position:fixed;inset:0;background:#050505;z-index:10;display:none;grid-template-rows:auto minmax(0,1fr);padding:max(16px,2vw) max(18px,3vw)}.search-layer.open{display:grid}
.search-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;min-height:76px;border-bottom:1px solid var(--line)}.search-head strong{font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.search-head input{width:100%;border:0;outline:0;background:transparent;color:var(--fg);font-size:clamp(24px,5vw,62px);font-weight:850;letter-spacing:-.05em}.search-head button{appearance:none;border:1px solid var(--line);background:transparent;padding:10px 12px;cursor:pointer;font:850 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace}
.search-results{overflow:auto;padding:10px 0 30px}.search-empty{padding:32px 0;color:var(--muted);font-size:18px}.search-results .menu-row{grid-template-columns:70px minmax(0,1fr) auto}.search-results .index{font-size:8px;text-transform:uppercase}
@media (max-width:760px){
  .shell{padding:12px 14px 10px}.topbar{padding-bottom:10px}.brand span,.keys{display:none}.breadcrumb{min-height:42px;font-size:10px}
  .stage{grid-template-columns:1fr;grid-template-rows:minmax(270px,.9fr) minmax(220px,1fr)}.navpane{border-right:0;border-bottom:1px solid var(--line);padding-right:0}
  .categories{min-height:58px;gap:26px;overflow-x:auto;scrollbar-width:none}.category{font-size:19px;flex:0 0 auto}
  .menu-row{min-height:56px;grid-template-columns:32px minmax(0,1fr) auto}.menu-row .name{font-size:18px}
  .preview{padding:22px 2px 14px}.preview h1{font-size:clamp(34px,12vw,58px);max-width:12ch}.preview .desc{font-size:14px}.preview-bottom{margin-top:22px}.hint{display:none}.footer{min-height:42px}
  .search-head{grid-template-columns:1fr auto;gap:10px}.search-head strong{display:none}.search-head input{font-size:32px}
}
@media (min-width:1400px){.shell{padding:28px 48px 22px}.menu-row{min-height:78px}.footer{min-height:66px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="shell" id="shell" tabindex="-1">
  <header class="topbar">
    <div class="brand"><i class="mark" aria-hidden="true"></i><strong>Prometeo Visual OS</strong><span>real routes · candidate states explicit</span></div>
    <div class="clock" id="clock">--:--</div>
  </header>
  <nav class="breadcrumb" id="breadcrumb" aria-label="Ruta actual"></nav>
  <section class="stage" id="stage">
    <div class="navpane">
      <div class="categories" id="categories" role="tablist" aria-label="Categorías"></div>
      <div class="menu" id="menu" role="listbox" aria-label="Entradas"></div>
    </div>
    <aside class="preview" id="preview" aria-live="polite">
      <div class="preview-top">
        <div class="preview-kicker" id="previewKicker"></div>
        <h1 id="previewTitle"></h1>
        <p class="desc" id="previewDesc"></p>
        <div class="route" id="previewRoute"></div>
      </div>
      <div class="preview-bottom">
        <button class="enter" id="openButton">Abrir</button>
        <div class="hint">← → categoría · ↑ ↓ entrada<br>WASD / HJKL · Enter abrir · / buscar · Esc volver</div>
      </div>
    </aside>
  </section>
  <footer class="footer">
    <div class="keys">HOME · consola navegable</div>
    <div class="signal" id="signal">Sin simulación: sólo rutas inspeccionadas o estados candidate/lab declarados.</div>
  </footer>
</main>
<section class="search-layer" id="searchLayer" aria-hidden="true">
  <div class="search-head">
    <strong>Buscar</strong>
    <input id="searchInput" type="search" autocomplete="off" spellcheck="false" placeholder="apps, proyectos, recursos…" aria-label="Buscar en Visual OS">
    <button id="closeSearch">ESC</button>
  </div>
  <div class="search-results" id="searchResults" role="listbox"></div>
</section>
<script>
(()=>{
const BASE='/prometeo/';
const categoriesData=[
  {key:'apps',label:'Apps',items:[
    {name:'Daily Page',state:'CANDIDATE',kind:'APP',href:null,desc:'Entrada reservada para Daily Page. En el inventario inspeccionado no aparece una ruta Daily Page canónica verificable, así que queda visible sin fingir un destino.'},
    {name:'Class Player',state:'REAL ROUTE',kind:'APP',href:BASE+'pages/PROMETEO_CLASS_PLAYER_ULTIMA_VERSION_BUENA_v26.html',desc:'Reproductor de clase recuperado desde una página existente del repositorio. Se abre como superficie real; el nombre del archivo conserva su procedencia histórica.'},
    {name:'Page Factory',state:'CANDIDATE',kind:'APP',href:BASE+'pages/PROMETEO_DAILY_PAGE_FACTORY_v02_VISUAL_IDEAS_SHOWROOM_CANDIDATE.html',desc:'Showroom existente de ideas para Daily Page / Page Factory. La ruta existe, pero el propio artefacto declara estado candidate.'},
    {name:'Student Track · Alumnos',state:'LAB',kind:'APP',href:BASE+'demos/alumnos-user-lab-v1/',desc:'Laboratorio navegable existente para Alumnos. Se presenta como LAB porque la guía de proyecto todavía conserva límites de verificación y no autoriza llamarlo Current.'},
    {name:'Study · Facultad',state:'REAL ROUTE',kind:'APP',href:BASE+'pages/study-library/',desc:'Biblioteca de estudio existente para materias y parciales. Este acceso abre la superficie publicada del repositorio sin elevar su estado de autoridad.'},
    {name:'Visual',state:'REAL ROUTE',kind:'APP',href:BASE+'guides/visual/',desc:'Guide visual real de Prometeo: mensaje actual, trabajo, superficies existentes y capacidades del dominio visual.'}
  ]},
  {key:'projects',label:'Proyectos',items:[
    {name:'Prometeo Hub',state:'REAL ROUTE',kind:'PROJECT',href:BASE,desc:'Raíz pública de Prometeo en GitHub Pages.'},
    {name:'Calendario',state:'REAL ROUTE',kind:'PROJECT',href:BASE+'pages/calendar/',desc:'Superficie pública de calendario declarada en el catálogo del repositorio.'},
    {name:'José Study',state:'REAL ROUTE',kind:'PROJECT',href:'https://juanmanuelpm.github.io/jose-study/',desc:'Proyecto de estudio de José publicado en su repositorio GitHub Pages independiente.'},
    {name:'Arte · BADA',state:'REAL ROUTE',kind:'PROJECT',href:BASE+'arte/',desc:'Superficie pública de Arte / Adriana Giacobbe preservada en el catálogo del repositorio.'}
  ]},
  {key:'resources',label:'Recursos',items:[
    {name:'Guides',state:'REAL ROUTE',kind:'RESOURCE',href:BASE+'guides/',desc:'Índice de Guides de Prometeo.'},
    {name:'Worker Protocol',state:'REAL ROUTE',kind:'RESOURCE',href:BASE+'o/',desc:'Entrada pública del protocolo de workers. Este Visual OS sólo enlaza la superficie; no asume ni simula estado de workers.'},
    {name:'Observatory',state:'REAL ROUTE',kind:'RESOURCE',href:BASE+'observatory/',desc:'Superficie de observación existente del repositorio.'},
    {name:'Strategy',state:'REAL ROUTE',kind:'RESOURCE',href:BASE+'strategy/',desc:'Superficie Strategy existente de Prometeo.'},
    {name:'Navigator histórico',state:'CANDIDATE',kind:'RESOURCE',href:BASE+'navigator/',desc:'Reconstrucción espacial histórica publicada como candidato. Su MANIFEST declara explícitamente CANDIDATE_NOT_HUMAN_ACCEPTED.'}
  ]}
];
let categoryIndex=0,itemIndex=0,searchActive=false,searchIndex=0,searchMatches=[];
const el=id=>document.getElementById(id);
const categories=el('categories'),menu=el('menu'),breadcrumb=el('breadcrumb');
const pKicker=el('previewKicker'),pTitle=el('previewTitle'),pDesc=el('previewDesc'),pRoute=el('previewRoute');
const openButton=el('openButton'),signal=el('signal'),searchLayer=el('searchLayer'),searchInput=el('searchInput'),searchResults=el('searchResults');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const current=()=>categoriesData[categoryIndex].items[itemIndex];
function routeText(item){if(!item.href)return 'SIN RUTA · candidate explícito';return item.href.startsWith('http')?item.href:location.origin+item.href}
function setSignal(text){signal.textContent=text}
function renderCategories(){categories.innerHTML=categoriesData.map((c,i)=>'<button class="category" role="tab" aria-selected="'+(i===categoryIndex)+'" data-cat="'+i+'">'+esc(c.label)+'</button>').join('');categories.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{categoryIndex=Number(btn.dataset.cat);itemIndex=0;render()}));categories.querySelector('[aria-selected="true"]')?.scrollIntoView({block:'nearest',inline:'center'})}
function renderMenu(){const items=categoriesData[categoryIndex].items;if(itemIndex>=items.length)itemIndex=items.length-1;menu.innerHTML=items.map((item,i)=>'<button class="menu-row '+(i===itemIndex?'active':'')+'" role="option" aria-selected="'+(i===itemIndex)+'" data-item="'+i+'"><span class="index">'+String(i+1).padStart(2,'0')+'</span><span class="name">'+esc(item.name)+'</span><span class="state">'+esc(item.state)+'</span></button>').join('');menu.querySelectorAll('button').forEach(btn=>{btn.addEventListener('click',()=>{itemIndex=Number(btn.dataset.item);render()});btn.addEventListener('dblclick',()=>openCurrent())});menu.querySelector('.active')?.scrollIntoView({block:'nearest'})}
function renderPreview(){const cat=categoriesData[categoryIndex],item=current();breadcrumb.innerHTML='<span class="crumb-muted">HOME</span><span>›</span><span>'+esc(cat.label)+'</span><span>›</span><span>'+esc(item.name)+'</span>';pKicker.textContent=item.kind+' · '+item.state;pTitle.textContent=item.name;pDesc.textContent=item.desc;pRoute.textContent=routeText(item);openButton.disabled=!item.href;openButton.textContent=item.href?'Abrir':'Sin ruta'}
function render(){renderCategories();renderMenu();renderPreview()}
function changeCategory(delta){categoryIndex=(categoryIndex+delta+categoriesData.length)%categoriesData.length;itemIndex=0;render()}
function changeItem(delta){const items=categoriesData[categoryIndex].items;itemIndex=(itemIndex+delta+items.length)%items.length;render()}
function openItem(item){if(!item.href){setSignal(item.name+': candidate visible, sin ruta inventada.');return}location.href=item.href}
function openCurrent(){openItem(current())}
function allItems(){return categoriesData.flatMap((c,ci)=>c.items.map((item,ii)=>({...item,category:c.label,ci,ii})))}
function runSearch(){const q=searchInput.value.trim().toLocaleLowerCase('es');searchMatches=allItems().filter(x=>!q||[x.name,x.category,x.state,x.desc].join(' ').toLocaleLowerCase('es').includes(q));if(searchIndex>=searchMatches.length)searchIndex=Math.max(0,searchMatches.length-1);searchResults.innerHTML=searchMatches.length?searchMatches.map((x,i)=>'<button class="menu-row '+(i===searchIndex?'active':'')+'" data-search="'+i+'"><span class="index">'+esc(x.category)+'</span><span class="name">'+esc(x.name)+'</span><span class="state">'+esc(x.state)+'</span></button>').join(''):'<div class="search-empty">No hay coincidencias.</div>';searchResults.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{const x=searchMatches[Number(btn.dataset.search)];categoryIndex=x.ci;itemIndex=x.ii;closeSearchUI();render()}));searchResults.querySelector('.active')?.scrollIntoView({block:'nearest'})}
function openSearchUI(){searchActive=true;searchIndex=0;searchLayer.classList.add('open');searchLayer.setAttribute('aria-hidden','false');searchInput.value='';runSearch();setTimeout(()=>searchInput.focus(),0)}
function closeSearchUI(){searchActive=false;searchLayer.classList.remove('open');searchLayer.setAttribute('aria-hidden','true');el('shell').focus()}
function moveSearch(delta){if(!searchMatches.length)return;searchIndex=(searchIndex+delta+searchMatches.length)%searchMatches.length;runSearch()}
function onKey(e){const tag=document.activeElement?.tagName;if(searchActive){if(e.key==='Escape'){e.preventDefault();closeSearchUI();return}if(e.key==='ArrowDown'){e.preventDefault();moveSearch(1);return}if(e.key==='ArrowUp'){e.preventDefault();moveSearch(-1);return}if(e.key==='Enter'&&searchMatches.length){e.preventDefault();openItem(searchMatches[searchIndex]);return}return}if(tag==='INPUT')return;const k=e.key.toLowerCase();if(k==='/'||k==='f'){e.preventDefault();openSearchUI();return}if(e.key==='ArrowLeft'||k==='a'||k==='h'){e.preventDefault();changeCategory(-1);return}if(e.key==='ArrowRight'||k==='d'||k==='l'){e.preventDefault();changeCategory(1);return}if(e.key==='ArrowUp'||k==='w'||k==='k'){e.preventDefault();changeItem(-1);return}if(e.key==='ArrowDown'||k==='s'||k==='j'){e.preventDefault();changeItem(1);return}if(e.key==='Enter'){e.preventDefault();openCurrent();return}if(e.key==='Escape'){e.preventDefault();if(categoryIndex!==0||itemIndex!==0){categoryIndex=0;itemIndex=0;render();setSignal('Volviste a HOME · Apps.')}else if(history.length>1)history.back();return}if(e.key==='Home'){e.preventDefault();categoryIndex=0;itemIndex=0;render();return}}
let touchX=0,touchY=0;el('stage').addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchX=t.clientX;touchY=t.clientY},{passive:true});el('stage').addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-touchX,dy=t.clientY-touchY;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.2)changeCategory(dx<0?1:-1)},{passive:true});
searchInput.addEventListener('input',()=>{searchIndex=0;runSearch()});el('closeSearch').addEventListener('click',closeSearchUI);openButton.addEventListener('click',openCurrent);document.addEventListener('keydown',onKey);
function tick(){const now=new Date();const date=new Intl.DateTimeFormat('es-AR',{timeZone:'America/Argentina/Buenos_Aires',weekday:'short',day:'2-digit',month:'2-digit'}).format(now);const time=new Intl.DateTimeFormat('es-AR',{timeZone:'America/Argentina/Buenos_Aires',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now);el('clock').textContent=date.toUpperCase()+' · '+time}
tick();setInterval(tick,1000);render();
})();
</script>
</body>
</html>
