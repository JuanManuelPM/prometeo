<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070706">
<title>Coliseo 2.5D</title>
<style>
:root{--paper:#070706;--ink:#d9cab4;--muted:#8c7d6d;--sand:#4b3526}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
body{overscroll-behavior:none}
#stage{position:fixed;inset:0;contain:strict;background:
 radial-gradient(circle at 50% 55%,rgba(71,42,20,.20),transparent 38%),
 linear-gradient(#090908,#030303)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#bg{z-index:1;filter:saturate(.70) contrast(1.12) brightness(.78) blur(.10px)}
#actors{z-index:2;filter:saturate(.78) contrast(1.08) brightness(.90) blur(.16px)}
#fg{z-index:3;pointer-events:none;filter:saturate(.68) brightness(.78) blur(.08px)}
#fx{z-index:4;pointer-events:none;mix-blend-mode:screen}
#post{position:absolute;inset:-3%;z-index:5;pointer-events:none;
 background:
 radial-gradient(ellipse at 50% 52%,transparent 32%,rgba(0,0,0,.20) 58%,rgba(0,0,0,.86) 100%),
 repeating-linear-gradient(93deg,rgba(255,230,194,.010) 0 1px,transparent 1px 5px);
 box-shadow:inset 0 0 13vw rgba(0,0,0,.72);
 opacity:.98}
#post:before{content:"";position:absolute;inset:0;
 background:
 repeating-radial-gradient(circle at 17% 29%,rgba(244,218,181,.045) 0 1px,transparent 1px 5px),
 repeating-radial-gradient(circle at 73% 68%,rgba(0,0,0,.10) 0 1px,transparent 1px 7px);
 background-size:11px 13px,17px 19px;
 mix-blend-mode:soft-light;opacity:.58}
#post:after{content:"";position:absolute;inset:-8%;
 background:
 repeating-radial-gradient(circle at 31% 47%,rgba(255,238,208,.035) 0 1px,transparent 1px 4px);
 background-size:7px 7px;
 opacity:.22;
 animation:grainShift 1.25s steps(6,end) infinite}
@keyframes grainShift{
 0%{transform:translate(0,0)}20%{transform:translate(-1.2%,.7%)}40%{transform:translate(.8%,-.5%)}
 60%{transform:translate(-.4%,-.9%)}80%{transform:translate(.6%,.8%)}100%{transform:translate(0,0)}
}
.ui{position:fixed;inset:0;z-index:10;pointer-events:none}
.brand{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border:1px solid rgba(229,190,139,.18);border-radius:50%;display:grid;place-items:center;background:rgba(12,11,10,.72);font:900 13px/1 system-ui;letter-spacing:-.04em;color:#e6c99f}
.copy b{display:block;font-size:13px;letter-spacing:.12em;text-transform:uppercase}.copy span{display:block;margin-top:2px;font-size:10px;color:var(--muted)}
.badge{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));padding:8px 10px;border:1px solid rgba(229,190,139,.13);border-radius:999px;background:rgba(10,9,8,.70);font:750 10px/1 system-ui;letter-spacing:.08em;text-transform:uppercase;color:#b8a28a}
.help{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:8px 12px;border-radius:999px;background:rgba(8,7,7,.64);border:1px solid rgba(229,190,139,.11);font:650 10px/1 system-ui;color:#9b8c7d;white-space:nowrap}
@media(max-width:560px){.copy span{display:none}.help{bottom:max(12px,env(safe-area-inset-bottom));font-size:9px}.badge{font-size:9px}.mark{width:31px;height:31px}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" aria-hidden="true"></canvas>
  <canvas id="actors" aria-label="Arena del coliseo con jugadores en movimiento"></canvas>
  <canvas id="fg" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="post" aria-hidden="true"></div>
</div>
<div class="ui">
  <div class="brand"><div class="mark">III</div><div class="copy"><b>Arena</b><span>Coliseo 2.5D · collage nocturno</span></div></div>
  <div class="badge">collage · 12 jugadores · 30 fps</div>
  <div class="help">arrastrá para rotar · pellizcá para acercar</div>
</div>
<script>
(function(){
'use strict';
const bg=document.getElementById('bg');
const ac=document.getElementById('actors');
const fg=document.getElementById('fg');
const fx=document.getElementById('fx');
const b=bg.getContext('2d',{alpha:false});
const a=ac.getContext('2d');
const f=fg.getContext('2d');
const x=fx.getContext('2d');
const TWO=Math.PI*2;
const TAU=TWO;
let W=0,H=0,ratio=1,scale=1,cx=0,cy=0;
let yaw=-0.42,zoom=1,dirty=true,visible=true;
let lastFrame=0;
const targetFPS=30,frameMS=1000/targetFPS;
const pointers=new Map();
let pinchDist=0;

const P={
 paper:'#080806', paper2:'#14110e', ink:'#d1b48e', sand:'#4c3022', sand2:'#70452a',
 seat:'#29302b', seat2:'#3d453a', stone:'#493d37', stoneHi:'#705348', stoneLo:'#211b18',
 recess:'#030302', red:'#b8331e', red2:'#6f1e15', ochre:'#e78928', cream:'#dbc6a4',
 pole:'#17110e', shadow:'rgba(0,0,0,.66)', line:'rgba(22,14,11,.86)'
};
const TORCHES=Array.from({length:10},(_,i)=>({ang:i*TAU/10+.12,phase:i*1.73}));

const players=[
 ['#171716',2.6,.36,.18],['#87331f',3.8,-.31,1.10],['#8d7430',5.0,.27,2.15],
 ['#26353b',6.3,-.24,3.05],['#69352f',7.4,.29,4.00],['#8d806d',8.5,-.21,4.88],
 ['#252923',9.3,.19,5.62],['#7f4728',4.6,.34,.70],['#465147',7.0,-.28,1.74],
 ['#8a7952',8.0,.25,2.72],['#2f2926',5.7,-.33,3.74],['#6f2f20',9.5,.17,5.15]
].map((v,i)=>({color:v[0],r:v[1],speed:v[2],phase:v[3],size:.37+(i%3)*.035}));

function fit(){
  W=innerWidth;H=innerHeight;
  const cores=navigator.hardwareConcurrency||8;
  const mem=navigator.deviceMemory||8;
  // Deliberately sub-native. The slight bilinear softness is part of the old-camera look.
  ratio=Math.min(devicePixelRatio||1,(cores<=4||mem<=4)?.78:.94);
  [bg,ac,fg,fx].forEach(c=>{
    c.width=Math.max(1,Math.round(W*ratio));
    c.height=Math.max(1,Math.round(H*ratio));
    c.style.width=W+'px';c.style.height=H+'px';
  });
  [b,a,f,x].forEach(ctx=>ctx.setTransform(ratio,0,0,ratio,0,0));
  scale=Math.min(W/41,H/27)*zoom;
  cx=W*.5;cy=H*(W<620?.56:.57);
  dirty=true;
}

function pr(r,ang,h){
  const t=ang+yaw;
  const sx=Math.cos(t)*r;
  const sy=Math.sin(t)*r;
  return {x:cx+sx*scale,y:cy+sy*scale*.34-h*scale*.57,d:Math.sin(t),t};
}
const CUT=.20;
function frontCut(ang){return Math.sin(ang+yaw)>CUT}
function visibleArc(){
  const A=Math.asin(CUT);
  return {start:Math.PI-A-yaw,end:TAU+A-yaw};
}
function arcPoints(r,h,n){
  const v=visibleArc(),pts=[];
  for(let i=0;i<=n;i++){
    const ang=v.start+(v.end-v.start)*(i/n);
    pts.push(pr(r,ang,h));
  }
  return pts;
}
function q(v){return Math.round(v)}
function line(ctx,p1,p2,color,width){ctx.beginPath();ctx.moveTo(q(p1.x),q(p1.y));ctx.lineTo(q(p2.x),q(p2.y));ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function poly(ctx,pts,fill,stroke,width){
  ctx.beginPath();ctx.moveTo(q(pts[0].x),q(pts[0].y));for(let i=1;i<pts.length;i++)ctx.lineTo(q(pts[i].x),q(pts[i].y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  if(stroke)roughOutline(ctx,pts,stroke,Math.max(.65,width||1),pts.length*3.17+pts[0].x*.01+pts[0].y*.01);
}
function ellipse(ctx,x,y,rx,ry,fill,stroke,width){
  ctx.beginPath();ctx.ellipse(q(x),q(y),Math.max(1,rx),Math.max(1,ry),0,0,TAU);ctx.fillStyle=fill;ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width||1;ctx.stroke();}
}
function blobEllipse(ctx,x,y,rx,ry,fill,stroke,width,seed,jitter,n){
  n=n||52;jitter=jitter==null?.018:jitter;
  const pts=[];
  for(let i=0;i<n;i++){
    const ang=i*TAU/n;
    const j=1+(hash2(i+seed,seed*7+i*.13)-.5)*jitter*2;
    pts.push({x:x+Math.cos(ang)*rx*j,y:y+Math.sin(ang)*ry*j});
  }
  ctx.beginPath();ctx.moveTo(q(pts[0].x),q(pts[0].y));
  for(let i=1;i<pts.length;i++){
    const p=pts[i];ctx.lineTo(q(p.x),q(p.y));
  }
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  if(stroke)roughOutline(ctx,pts,stroke,width||1,seed);
  return pts;
}
function hash2(x,y){const s=Math.sin(x*12.9898+y*78.233)*43758.5453;return s-Math.floor(s)}
function roughOutline(ctx,pts,color,width,seed){
  for(let pass=0;pass<2;pass++){
    ctx.beginPath();
    for(let i=0;i<pts.length;i++){
      const p=pts[i],j=(hash2(i+seed,pass+seed)-.5)*(pass?1.7:1.0);
      const xx=q(p.x+j),yy=q(p.y+(hash2(i+seed*2,pass+3)-.5)*(pass?1.6:.9));
      if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);
    }
    ctx.closePath();ctx.strokeStyle=pass? 'rgba(226,169,98,.16)':color;ctx.lineWidth=width*(pass? .72:1);ctx.stroke();
  }
}
function hatchPoly(ctx,pts,step,alpha,seed){
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for(const p of pts){minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y)}
  ctx.save();ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.closePath();ctx.clip();
  ctx.strokeStyle='rgba(8,6,5,'+alpha+')';ctx.lineWidth=.65;
  for(let y=minY-step;y<maxY+step;y+=step){
    const off=(hash2(y,seed)-.5)*step*.55;ctx.beginPath();ctx.moveTo(minX-8,y+off);ctx.lineTo(maxX+8,y+off+(maxX-minX)*.12);ctx.stroke();
  }
  ctx.restore();
  // manchas y rayado de impresión: textura estática, no partículas animadas.
  ctx.save();ctx.globalAlpha=.28;
  for(let i=0;i<30;i++){
    const rr=Math.sqrt(((i*29)%97)/97)*9.2,ang=((i*61)%89)/89*TAU,p=pr(rr,ang,.012);
    ctx.fillStyle=i%4===0?'#7f2b1c':'#1d1510';
    ctx.beginPath();ctx.ellipse(q(p.x),q(p.y),1+(i%3),.55+(i%2)*.35,(i*.7)%TAU,0,TAU);ctx.fill();
  }
  ctx.restore();
}

function ringBand(ctx,r1,r2,h1,h2,fillTop,fillSide,segments){
  const n=Math.max(40,segments||64);
  const outerLow=arcPoints(r2,h1,n);
  const outerTop=arcPoints(r2,h2,n);
  const innerTop=arcPoints(r1,h2,n);
  const side=outerLow.concat(outerTop.slice().reverse());
  const top=innerTop.concat(outerTop.slice().reverse());
  poly(ctx,side,fillSide,P.line,1.05);
  poly(ctx,top,fillTop,'rgba(16,10,8,.68)',.78);

  // Sparse ink breaks, curved with the architecture instead of ruler-straight seams.
  ctx.save();ctx.globalAlpha=.30;ctx.lineCap='round';
  for(let k=1;k<7;k++){
    const rr=r1+(r2-r1)*(k/7);
    const pts=arcPoints(rr,h2+.01,44);
    ctx.beginPath();
    for(let i=0;i<pts.length;i++){
      const p=pts[i],jy=(hash2(i+k,k*3)-.5)*1.3;
      if(i===0)ctx.moveTo(p.x,p.y+jy);else ctx.lineTo(p.x,p.y+jy);
    }
    ctx.strokeStyle=k%2?'rgba(7,5,4,.55)':'rgba(196,115,63,.16)';
    ctx.lineWidth=k%2?1.0:.7;ctx.stroke();
  }
  ctx.restore();
}

function arena(ctx){
  blobEllipse(ctx,cx,cy,10.95*scale,10.95*scale*.34,P.sand,'rgba(20,11,8,.88)',1.35,17,.014,72);
  blobEllipse(ctx,cx,cy+scale*.03,9.62*scale,9.62*scale*.34,'rgba(119,66,36,.16)',null,0,23,.020,64);

  // Dirt is built from ink flecks and translucent washes, not vector scratches.
  ctx.save();
  for(let i=0;i<125;i++){
    const u=((i*47)%127)/127,v=((i*79)%131)/131;
    const rr=Math.sqrt(u)*9.7,ang=v*TAU,p=pr(rr,ang,.01);
    const s=.35+((i*13)%7)*.16;
    ctx.globalAlpha=.10+((i*17)%5)*.025;
    ctx.fillStyle=i%9===0?P.red2:(i%4===0?'#8a5431':'#17100c');
    ctx.beginPath();ctx.arc(q(p.x),q(p.y),s,0,TAU);ctx.fill();
  }
  ctx.globalAlpha=.08;
  for(let i=0;i<14;i++){
    const rr=2.2+((i*37)%83)/83*7.0,ang=((i*53)%97)/97*TAU,p=pr(rr,ang,.01);
    ctx.fillStyle=i%3===0?'#b34b26':'#241711';
    ctx.beginPath();ctx.ellipse(p.x,p.y,scale*(.45+(i%4)*.20),scale*(.10+(i%3)*.05),(i*.71)%TAU,0,TAU);ctx.fill();
  }
  ctx.restore();
}

function drawArch(ctx,ang,r,baseH,topH,index){
  if(frontCut(ang))return;
  const p=pr(r,ang,(baseH+topH)*.5);
  const pA=pr(r,ang-.012,(baseH+topH)*.5),pB=pr(r,ang+.012,(baseH+topH)*.5);
  const rot=Math.atan2(pB.y-pA.y,pB.x-pA.x);
  const depth=.72+.28*((Math.sin(ang+yaw)+1)*.5);
  const w=scale*1.10*depth,h=scale*(topH-baseH)*.80;
  ctx.save();ctx.translate(q(p.x),q(p.y));ctx.rotate(rot);
  ctx.fillStyle=P.recess;
  ctx.beginPath();
  ctx.moveTo(-w*.42,h*.45);ctx.lineTo(-w*.42,-h*.08);
  ctx.quadraticCurveTo(-w*.42,-h*.45,0,-h*.45);
  ctx.quadraticCurveTo(w*.42,-h*.45,w*.42,-h*.08);
  ctx.lineTo(w*.42,h*.45);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(8,6,5,.92)';ctx.lineWidth=Math.max(1,scale*.075);ctx.stroke();
  ctx.save();ctx.globalAlpha=.23;ctx.translate(1,-1);ctx.strokeStyle='#c13a21';ctx.lineWidth=Math.max(.7,scale*.045);ctx.stroke();ctx.restore();
  if(index%2===0){ctx.fillStyle='rgba(211,180,139,.06)';ctx.fillRect(-w*.34,-h*.29,w*.10,h*.58)}
  ctx.restore();
}

function outerWall(ctx){
  ringBand(ctx,17.68,18.18,4.08,8.58,P.stoneHi,P.stone,84);

  // Broad watercolor-like patches break the large wall mass.
  const wallPts=arcPoints(18.16,6.2,64);
  b.save();b.globalAlpha=.14;
  for(let i=5;i<wallPts.length-5;i+=8){
    const p=wallPts[i],w=scale*(1.6+(i%3)*.45),h=scale*(2.0+(i%4)*.22);
    b.fillStyle=i%2?'#7b4635':'#273027';
    b.beginPath();b.ellipse(p.x,p.y,w,h,(i%5-.2)*.03,0,TAU);b.fill();
  }
  b.restore();

  arcSegments(ctx,18.22,4.14,P.stoneLo,2.0,82);
  arcSegments(ctx,18.22,8.54,P.stoneLo,1.6,82);
  for(let i=0;i<22;i++)drawArch(ctx,i*TAU/22,18.30,4.48,7.62,i);

  // Pilasters are now thick, dark brush accents. No bright ruler-like spokes.
  for(let i=0;i<18;i++){
    const ang=i*TAU/18+TAU/36;if(frontCut(ang))continue;
    const p0=pr(18.31,ang,4.20),p1=pr(18.31,ang,8.46);
    line(ctx,p0,p1,'rgba(13,9,7,.44)',Math.max(1.0,scale*.11));
  }
  ringBand(ctx,18.0,18.56,8.55,9.12,P.stoneHi,P.stone,72);

  for(let i=0;i<18;i++){
    const ang=i*TAU/18+.02;if(frontCut(ang))continue;
    const p=pr(18.42,ang,8.88);
    blobEllipse(ctx,p.x,p.y,scale*.25,scale*.15,'rgba(10,7,6,.72)',null,0,i+91,.10,14);
  }
}

function arcSegments(ctx,r,h,color,width,N){
  const pts=arcPoints(r,h,Math.max(48,N||64));
  for(let pass=0;pass<2;pass++){
    ctx.beginPath();
    for(let i=0;i<pts.length;i++){
      const p=pts[i];
      const j=(hash2(i+pass*11,r*3+h*7)-.5)*(pass?1.4:.8);
      if(i===0)ctx.moveTo(q(p.x),q(p.y+j));else ctx.lineTo(q(p.x),q(p.y+j));
    }
    ctx.strokeStyle=pass?'rgba(193,102,55,.13)':color;
    ctx.lineWidth=pass?Math.max(.65,width*.55):width;ctx.stroke();
  }
}

function terraces(ctx){
  const tiers=[
    [11.45,12.65,1.02,1.38,P.stoneHi,P.stone],
    [12.55,13.70,1.36,1.78,P.seat2,P.seat],
    [13.60,14.72,1.76,2.22,P.seat,P.stoneLo],
    [14.62,15.62,2.20,2.66,P.seat2,P.seat],
    [15.52,16.48,2.64,3.10,P.seat,P.stoneLo]
  ];
  tiers.forEach((t,idx)=>{
    ringBand(ctx,t[0],t[1],t[2],t[3],t[4],t[5],72);
    // A few irregular stains instead of geometric stair spokes.
    const v=visibleArc();
    ctx.save();ctx.globalAlpha=.11;
    for(let j=0;j<5;j++){
      const ang=v.start+(v.end-v.start)*((j+1)/6)+(hash2(j,idx)-.5)*.08;
      const p=pr((t[0]+t[1])*.5,ang,t[3]+.02);
      ctx.fillStyle=(j+idx)%2?'#11100d':'#7a3526';
      ctx.beginPath();ctx.ellipse(p.x,p.y,scale*(.36+.08*j),scale*.10,ang+yaw,0,TAU);ctx.fill();
    }
    ctx.restore();
  });
}

function flags(ctx){
  const list=[];for(let i=0;i<22;i++){const ang=i*TAU/22+.03;if(!frontCut(ang))list.push({ang,d:Math.sin(ang+yaw)})}
  list.sort((x,y)=>x.d-y.d);
  for(const it of list){
    const p0=pr(18.35,it.ang,9.05),p1=pr(18.35,it.ang,10.48);
    line(ctx,p0,p1,P.pole,Math.max(1,scale*.055));
    const tip=pr(18.35,it.ang,10.34);const tangent=it.ang+yaw+Math.PI/2;
    const len=scale*.72,hh=scale*.26;
    const tx=Math.cos(tangent)*len,ty=Math.sin(tangent)*len*.34;
    poly(ctx,[tip,{x:tip.x+tx,y:tip.y+ty-hh*.18},{x:tip.x+tx*.82,y:tip.y+ty+hh*.46}],P.red,'rgba(94,51,28,.20)',.5);
  }
}

function cutEdges(ctx){
  const A=Math.asin(CUT);
  const ts=[A,Math.PI-A];
  for(let n=0;n<ts.length;n++){
    const ang=ts[n]-yaw;
    const p0=pr(11.18,ang,.20),p1=pr(18.58,ang,9.08);
    // dark ink section line
    line(ctx,p0,p1,'rgba(5,4,3,.96)',Math.max(2.0,scale*.17));
    // slightly misregistered ochre/red print edge
    const ox=(n?1:-1)*1.4,oy=-.7;
    line(ctx,{x:p0.x+ox,y:p0.y+oy},{x:p1.x+ox,y:p1.y+oy},'rgba(177,62,31,.34)',Math.max(.9,scale*.07));
  }
  const v=visibleArc();
  const left=pr(11.20,v.end,.22),right=pr(11.20,v.start,.22);
  // Only a soft, irregular lip at the inner arena cut.
  const pts=[];
  for(let i=0;i<=34;i++){
    const t=i/34;
    const xx=left.x+(right.x-left.x)*t;
    const yy=left.y+(right.y-left.y)*t+(hash2(i,44)-.5)*1.6;
    pts.push({x:xx,y:yy});
  }
  f.beginPath();f.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)f.lineTo(pts[i].x,pts[i].y);
  f.strokeStyle='rgba(16,9,6,.82)';f.lineWidth=Math.max(1.2,scale*.10);f.stroke();
}

function renderStatic(){
  scale=Math.min(W/41,H/27)*zoom;
  const grd=b.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#11100d');grd.addColorStop(.48,'#080706');grd.addColorStop(1,'#020202');b.fillStyle=grd;b.fillRect(0,0,W,H);
  // grandes papeles superpuestos, apenas visibles: sensación de collage impreso.
  b.save();b.globalAlpha=.15;
  blobEllipse(b,W*.14,H*.49,W*.28,H*.42,'#51291f',null,0,101,.035,58);
  blobEllipse(b,W*.84,H*.40,W*.26,H*.36,'#243129',null,0,202,.040,58);
  b.restore();
  ellipse(b,cx,cy+scale*5.2,19.8*scale,5.3*scale,P.shadow,null,0);
  arena(b);
  ringBand(b,11.0,11.5,.26,1.08,P.stoneHi,P.stone,64);
  terraces(b);
  outerWall(b);
  flags(b);
  f.clearRect(0,0,W,H);
  cutEdges(f);
  dirty=false;
}

function playerState(pl,t){
  const ang=pl.phase+t*pl.speed;
  const wobble=Math.sin(t*.82+pl.phase*2.7)*.18;
  return {ang,r:pl.r+wobble,color:pl.color,size:pl.size};
}
function drawPlayer(ctx,st,alpha){
  const p=pr(st.r,st.ang,.48),g=pr(st.r,st.ang,.03);
  const depth=(p.d+1)*.5;
  const rr=scale*st.size*(.80+depth*.22);
  const px=q(p.x),py=q(p.y),gx=q(g.x),gy=q(g.y);
  ctx.save();ctx.globalAlpha=alpha==null?1:alpha;

  blobEllipse(ctx,gx,gy+rr*.30,rr*.90,rr*.27,'rgba(0,0,0,.58)',null,0,st.r*17,.08,16);

  const pts=blobEllipse(ctx,px,py,rr,rr,st.color,'rgba(4,3,3,.96)',Math.max(1,rr*.13),st.r*29+st.ang,.075,18);
  // off-register print edge
  ctx.save();ctx.globalAlpha=.30;ctx.translate(1.2,-.7);roughOutline(ctx,pts,P.red,Math.max(.7,rr*.055),st.r*11);ctx.restore();

  blobEllipse(ctx,px-rr*.26,py-rr*.28,rr*.17,rr*.13,'rgba(233,190,119,.66)',null,0,st.r*7,.12,12);

  // irregular ink freckles imply texture without turning into geometry lines.
  ctx.fillStyle='rgba(4,3,3,.46)';
  for(let i=0;i<4;i++){
    const ang=st.ang+i*1.61,rad=rr*(.18+.13*i);
    ctx.beginPath();ctx.arc(px+Math.cos(ang)*rad,py+Math.sin(ang)*rad,Math.max(.55,rr*.055),0,TAU);ctx.fill();
  }
  ctx.restore();
}

function renderActors(now){
  a.clearRect(0,0,W,H);
  const t=now/1000;
  const states=players.map(pl=>playerState(pl,t));
  states.sort((x,y)=>Math.sin(x.ang+yaw)-Math.sin(y.ang+yaw));
  // Tiny shutter smear: one translucent previous pose. Looks softer without a real blur pass.
  for(let i=0;i<states.length;i++){
    const st=states[i],pl=players[i%players.length];
    drawPlayer(a,{ang:st.ang-pl.speed*.055,r:st.r,color:st.color,size:st.size},.10);
  }
  for(const st of states)drawPlayer(a,st,1);
}


function renderFX(now){
  x.clearRect(0,0,W,H);
  const t=now/1000;
  x.save();
  x.globalCompositeOperation='lighter';
  for(const tr of TORCHES){
    if(frontCut(tr.ang))continue;
    const p=pr(11.52,tr.ang,1.62);
    const flick=.88+Math.sin(t*8.7+tr.phase)*.07+Math.sin(t*13.1+tr.phase*1.7)*.045;
    const R=scale*(1.75+.26*flick);
    let g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,R);
    g.addColorStop(0,'rgba(232,113,35,'+(0.18*flick)+')');
    g.addColorStop(.42,'rgba(178,49,25,'+(0.10*flick)+')');
    g.addColorStop(1,'rgba(120,25,12,0)');
    x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,R,0,TAU);x.fill();

    const h=scale*(.46+.06*Math.sin(t*11+tr.phase));
    x.save();x.translate(q(p.x),q(p.y-scale*.10));
    x.fillStyle=P.red;x.strokeStyle='rgba(4,3,2,.96)';x.lineWidth=Math.max(1,scale*.06);
    x.beginPath();x.moveTo(-h*.05,-h*.92);x.lineTo(h*.28,-h*.30);x.lineTo(h*.18,h*.40);x.lineTo(-h*.10,h*.58);x.lineTo(-h*.30,h*.18);x.lineTo(-h*.18,-h*.28);x.closePath();x.fill();x.stroke();
    x.fillStyle=P.ochre;x.beginPath();x.moveTo(0,-h*.46);x.lineTo(h*.12,-h*.04);x.lineTo(0,h*.32);x.lineTo(-h*.10,-h*.02);x.closePath();x.fill();
    x.restore();
  }
  // smoky wash: broad translucent paper-like stains instead of glossy volumetric fog.
  const drift=Math.sin(t*.19)*scale*.45;
  x.globalCompositeOperation='screen';
  x.globalAlpha=.08;
  x.fillStyle='#8d5130';
  x.beginPath();x.ellipse(cx+drift,cy+scale*1.8,scale*10.5,scale*2.8,0,0,TAU);x.fill();
  x.globalAlpha=1;
  x.restore();
}

function loop(now){
  if(!visible){requestAnimationFrame(loop);return}
  if(now-lastFrame>=frameMS){
    if(dirty)renderStatic();
    renderActors(now);
    renderFX(now);
    lastFrame=now-(now-lastFrame)%frameMS;
  }
  requestAnimationFrame(loop);
}

function pointerDown(e){pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});ac.setPointerCapture(e.pointerId);if(pointers.size===2){const ps=[...pointers.values()];pinchDist=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y)}}
function pointerMove(e){
  const old=pointers.get(e.pointerId);if(!old)return;
  const next={x:e.clientX,y:e.clientY};pointers.set(e.pointerId,next);
  if(pointers.size===1){yaw+=(next.x-old.x)*.0085;dirty=true}
  else if(pointers.size===2){const ps=[...pointers.values()];const d=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);if(pinchDist){zoom*=d/pinchDist;zoom=Math.max(.78,Math.min(1.38,zoom));dirty=true}pinchDist=d}
}
function pointerUp(e){pointers.delete(e.pointerId);pinchDist=0}
ac.addEventListener('pointerdown',pointerDown);ac.addEventListener('pointermove',pointerMove);ac.addEventListener('pointerup',pointerUp);ac.addEventListener('pointercancel',pointerUp);
ac.addEventListener('wheel',function(e){e.preventDefault();zoom*=Math.exp(-e.deltaY*.0009);zoom=Math.max(.78,Math.min(1.38,zoom));dirty=true},{passive:false});
addEventListener('resize',fit,{passive:true});
document.addEventListener('visibilitychange',function(){visible=!document.hidden;if(visible){lastFrame=0;dirty=true}});
fit();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
