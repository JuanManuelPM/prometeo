<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050504">
<title>Coliseo · collage nocturno</title>
<style>
:root{--ink:#d7b48b;--muted:#806f60}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050504;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overscroll-behavior:none}
#wrap{position:fixed;inset:0;overflow:hidden;background:#050504}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;filter:contrast(1.13) saturate(.78) brightness(.92)}
#veil{position:absolute;inset:-3%;pointer-events:none;background:
 radial-gradient(ellipse at 50% 53%,transparent 31%,rgba(0,0,0,.17) 57%,rgba(0,0,0,.88) 100%),
 repeating-linear-gradient(91deg,rgba(224,184,134,.012) 0 1px,transparent 1px 5px);
 box-shadow:inset 0 0 12vw rgba(0,0,0,.68);mix-blend-mode:multiply}
#grain{position:absolute;inset:-5%;pointer-events:none;opacity:.18;mix-blend-mode:screen;
 background:
 radial-gradient(circle at 11% 23%,rgba(238,199,146,.16) 0 .6px,transparent .8px),
 radial-gradient(circle at 67% 41%,rgba(238,199,146,.10) 0 .7px,transparent .9px),
 radial-gradient(circle at 38% 72%,rgba(238,199,146,.11) 0 .5px,transparent .8px);
 background-size:9px 11px,13px 15px,17px 19px;
 }
#grade{position:absolute;inset:0;pointer-events:none;z-index:3;
 background:
 radial-gradient(circle at 48% 61%,rgba(173,68,34,.13),transparent 34%),
 radial-gradient(circle at 20% 22%,rgba(28,57,50,.16),transparent 39%),
 linear-gradient(180deg,rgba(11,24,23,.08),rgba(94,40,24,.10));
 mix-blend-mode:soft-light}
#exposure{position:absolute;inset:0;pointer-events:none;z-index:4;
 background:radial-gradient(circle at 52% 56%,rgba(228,143,71,.055),transparent 42%);
 mix-blend-mode:screen;animation:exposurePulse 5.4s steps(4,end) infinite}
@keyframes exposurePulse{0%,100%{opacity:.58}25%{opacity:.72}52%{opacity:.50}78%{opacity:.66}}
.ui{position:fixed;inset:0;pointer-events:none;z-index:5}
.brand{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;text-shadow:0 1px 0 #000}
.mark{width:32px;height:32px;border-radius:50%;border:1px solid rgba(213,163,105,.22);display:grid;place-items:center;background:rgba(6,5,4,.70);font:900 12px/1 system-ui;color:#d28a4b}
.copy b{display:block;font-size:12px;letter-spacing:.13em;text-transform:uppercase}.copy span{display:block;margin-top:2px;font-size:9px;color:var(--muted)}
.badge{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));padding:7px 9px;border-radius:999px;border:1px solid rgba(213,163,105,.15);background:rgba(6,5,4,.66);font:750 9px/1 system-ui;letter-spacing:.08em;text-transform:uppercase;color:#9d846b}
.help{position:absolute;left:50%;bottom:max(13px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:7px 10px;border-radius:999px;border:1px solid rgba(213,163,105,.12);background:rgba(6,5,4,.58);font:650 9px/1 system-ui;color:#8e7965;white-space:nowrap}
@media(max-width:560px){.copy span{display:none}.badge{font-size:8px}.help{font-size:8px}.mark{width:29px;height:29px}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="scene" aria-label="Coliseo nocturno ilustrado con jugadores en movimiento"></canvas>
  <div id="veil" aria-hidden="true"></div>
  <div id="grain" aria-hidden="true"></div>
  <div id="grade" aria-hidden="true"></div>
  <div id="exposure" aria-hidden="true"></div>
</div>
<div class="ui">
  <div class="brand"><div class="mark">III</div><div class="copy"><b>Arena</b><span>collage · campo amplio · construcción</span></div></div>
  <div class="badge">12 constructores · objetivo rápido · ritual de fuego</div>
  <div class="help">arrastrá para rotar · pellizcá para acercar</div>
</div>
<script>
(function(){
'use strict';
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d',{alpha:false});
const staticCanvas=document.createElement('canvas');
const sctx=staticCanvas.getContext('2d',{alpha:false});
const TAU=Math.PI*2;
let IW=640,IH=360,W=innerWidth,H=innerHeight,scale=1,cx=320,cy=220;
let yaw=-.48,zoom=1,staticDirty=true,last=0,visible=true;
const FPS=24,FRAME=1000/FPS;
const pointers=new Map(); let pinch=0;

const C={
 black:'#060504', deep:'#0d0b09', ink:'#17100c', red:'#a82f1c', red2:'#682016',
 ochre:'#d77a2d', amber:'#e6a253', cream:'#cbb08a', sand:'#4a3022', sand2:'#63402a',
 moss:'#27312a', moss2:'#3b493a', stone:'#4a3c34', stone2:'#644c3e', bone:'#866955'
};
const TOWER_NAMES=['ASTERION','EREBOS','HELIOS','NYX','KAIROS'];
const CUT=.05;
const torches=Array.from({length:8},(_,i)=>({ang:i*TAU/8+.08,phase:i*1.81}));
const BLOCK_COLORS=['#a53b24','#c66d31','#a68a43','#506657','#3c5961','#816049','#b89a68','#6f3631','#58604d'];
const GRID_R=3,BLOCK_STEP=.78,BLOCK_H=.62;
const DIR4=[[1,0],[-1,0],[0,1],[0,-1]];
function key2(x,z){return x+','+z}
function makePattern(seed){
  const targets=new Map();
  const put=(x,z,h)=>{
    if(Math.abs(x)>GRID_R||Math.abs(z)>GRID_R||h<=0)return;
    const k=key2(x,z);targets.set(k,Math.max(targets.get(k)||0,h));
  };
  const type=seed%3;

  if(type===0){
    // SPIRE: every higher layer requires a lower neighbouring tread.
    for(let x=-GRID_R;x<=GRID_R;x++)for(let z=-GRID_R;z<=GRID_R;z++){
      const h=4-(Math.abs(x)+Math.abs(z));
      if(h>0)put(x,z,h);
    }
    put(2,1,1);put(-2,-1,1);put(1,-2,1);
  }else if(type===1){
    // TWIN PEAKS: two small towers joined by a broad walkable saddle.
    for(let x=-GRID_R;x<=GRID_R;x++)for(let z=-GRID_R;z<=GRID_R;z++){
      const d1=Math.abs(x-1)+Math.abs(z),d2=Math.abs(x+1)+Math.abs(z);
      const h=Math.max(4-d1,4-d2);
      if(h>0)put(x,z,h);
    }
    put(0,2,1);put(0,-2,1);
  }else{
    // TERRACE: a short ridge with stepped flanks and side rooms.
    for(let x=-GRID_R;x<=GRID_R;x++)for(let z=-GRID_R;z<=GRID_R;z++){
      const ridge=Math.max(0,Math.abs(x)-1);
      const h=3-(Math.abs(z)+ridge);
      if(h>0)put(x,z,h);
    }
    put(2,1,1);put(2,-1,1);put(-2,1,1);put(-2,-1,1);
  }
  return targets;
}
function newSite(i){
  const ang=.22+i*TAU/6+(hash(i,301)-.5)*.22;
  const r=7.45+hash(i,302)*2.25;
  const targets=makePattern(i+1);
  return {
    x:Math.cos(ang)*r,z:Math.sin(ang)*r,targets,
    heights:new Map(),blocks:[],blueprints:new Map(),reservations:new Map(),
    baseColor:BLOCK_COLORS[Math.floor(hash(i,303)*BLOCK_COLORS.length)],
    lastBuilt:-9999,ritual:null
  };
}
const sites=Array.from({length:5},(_,i)=>newSite(i));
function primeShowcaseSite(site){
  for(const [k,targetH] of site.targets){
    const [gx,gz]=k.split(',').map(Number);
    const filled=targetH<=1?targetH:targetH-1;
    if(filled<=0)continue;
    site.heights.set(k,filled);
    for(let y=0;y<filled;y++){
      const ci=Math.floor(hash(gx*31+y*7,gz*29+y*13)*BLOCK_COLORS.length);
      site.blocks.push({gx,gz,y,color:BLOCK_COLORS[ci],born:-9999});
    }
  }
}
primeShowcaseSite(sites[0]);

const playerSeed=[
 '#201c18','#8a321f','#806b31','#32423d','#6d362c','#766958',
 '#273028','#7d4828','#4a5647','#8a744a','#302925','#6a2c20'
];
const players=playerSeed.map((color,i)=>{
  const siteIndex=i%sites.length,site=sites[siteIndex];
  const side=i%4,spread=((i*3)%5)-2,R=GRID_R+1;
  const gx=side===0?R:side===1?-R:spread;
  const gz=side===2?R:side===3?-R:spread;
  const spawn=worldCell(site,gx,gz);
  return {
    color,x:spawn.x,z:spawn.z,h:0,jump:0,
    size:.39+(i%3)*.040,speed:1.48+hash(i,355)*.46,
    siteIndex,wait:hash(i,356)*.6,
    task:null,path:[],segment:null,lastX:spawn.x,lastZ:spawn.z,lastH:0
  };
});

function hash(a,b){const n=Math.sin(a*12.9898+b*78.233)*43758.5453;return n-Math.floor(n)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function q(v){return Math.round(v)}
function resize(){
  W=innerWidth;H=innerHeight;
  const aspect=W/H;
  IH=360;IW=Math.round(IH*aspect);
  if(IW>720){IW=720;IH=Math.round(IW/aspect)}
  if(IW<300){IW=300;IH=Math.round(IW/aspect)}
  canvas.width=staticCanvas.width=IW;canvas.height=staticCanvas.height=IH;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  scale=Math.min(IW/37,IH/22.5)*zoom;cx=IW*.5;cy=IH*(W<620?.63:.61);
  staticDirty=true;
}
function pr(r,ang,h){
  const t=ang+yaw;
  const sx=Math.cos(t)*r,sz=Math.sin(t)*r;
  return {x:cx+sx*scale,y:cy+sz*scale*.35-h*scale*.57,d:Math.sin(t),zv:sz,t};
}
function wp(x,z,h){
  const r=Math.hypot(x,z),ang=Math.atan2(z,x);
  return pr(r,ang,h);
}
function shade(hex,amount){
  const n=parseInt(hex.slice(1),16);
  const r=clamp((n>>16)+amount,0,255),g=clamp(((n>>8)&255)+amount,0,255),b=clamp((n&255)+amount,0,255);
  return '#'+((1<<24)+(Math.round(r)<<16)+(Math.round(g)<<8)+Math.round(b)).toString(16).slice(1);
}
function cut(ang){return Math.sin(ang+yaw)>CUT}
function visibleArc(){
  const A=Math.asin(CUT);
  return {start:Math.PI-A-yaw,end:TAU+A-yaw};
}
function arc(r,h,n,jitter,seed){
  const v=visibleArc(),pts=[];
  for(let i=0;i<=n;i++){
    const ang=v.start+(v.end-v.start)*(i/n);
    const rr=r+(hash(i+seed,seed*.7)-.5)*(jitter||0);
    const p=pr(rr,ang,h+(hash(seed+i*3,seed)-.5)*(jitter||0)*.11);
    pts.push(p);
  }
  return pts;
}
function path(c,pts,close){
  c.beginPath();c.moveTo(q(pts[0].x),q(pts[0].y));
  for(let i=1;i<pts.length;i++)c.lineTo(q(pts[i].x),q(pts[i].y));
  if(close)c.closePath();
}
function roughStroke(c,pts,color,width,seed,close){
  for(let pass=0;pass<2;pass++){
    const p2=pts.map((p,i)=>({x:p.x+(hash(seed+i,pass+7)-.5)*(pass?1.6:.7),y:p.y+(hash(seed*2+i,pass+11)-.5)*(pass?1.5:.7)}));
    path(c,p2,close);
    c.strokeStyle=pass?'rgba(183,67,37,.18)':color;c.lineWidth=pass?Math.max(.6,width*.55):width;c.stroke();
  }
}
function fillRagged(c,pts,fill,stroke,width,seed){
  path(c,pts,true);c.fillStyle=fill;c.fill();
  if(stroke)roughStroke(c,pts,stroke,width,seed,true);
}
function blob(c,x,y,rx,ry,fill,stroke,width,seed,jitter,n){
  n=n||34;jitter=jitter==null?.04:jitter;
  const pts=[];
  for(let i=0;i<n;i++){
    const a=i*TAU/n;
    const j=1+(hash(seed+i,seed*3+i*.23)-.5)*jitter*2;
    pts.push({x:x+Math.cos(a)*rx*j,y:y+Math.sin(a)*ry*j});
  }
  fillRagged(c,pts,fill,stroke,width,seed);
  return pts;
}
function band(c,r1,r2,h1,h2,top,side,seed){
  const n=58;
  const ol=arc(r2,h1,n,.05,seed),ot=arc(r2,h2,n,.05,seed+9),it=arc(r1,h2,n,.05,seed+17);
  const sidePts=ol.concat(ot.slice().reverse());
  const topPts=it.concat(ot.slice().reverse());
  fillRagged(c,sidePts,side,C.ink,1.25,seed);
  fillRagged(c,topPts,top,'rgba(12,8,6,.82)',.9,seed+1);

  c.save();path(c,topPts,true);c.clip();
  for(let i=0;i<22;i++){
    const v=visibleArc(),ang=v.start+(v.end-v.start)*hash(seed+i,3);
    const rr=r1+(r2-r1)*hash(i,seed+6);
    const p=pr(rr,ang,h2+.01);
    c.globalAlpha=.10+hash(i,seed)*.08;
    c.fillStyle=i%3===0?C.red2:(i%3===1?C.black:C.ochre);
    blob(c,p.x,p.y,2+hash(i,2)*6,.7+hash(i,9)*2,c.fillStyle,null,0,seed+i,.18,13);
  }
  c.restore();
}
function inkWash(c,x,y,rx,ry,color,alpha,seed,count){
  c.save();c.globalAlpha=alpha;
  for(let i=0;i<count;i++){
    const ox=(hash(i,seed)-.5)*rx*.8,oy=(hash(seed,i)-.5)*ry*.7;
    blob(c,x+ox,y+oy,rx*(.42+hash(i,4)*.35),ry*(.30+hash(i,8)*.28),color,null,0,seed+i,.18,18);
  }
  c.restore();
}

function paintWallDetails(c){
  const marks=[
    {ang:.52,kind:0},{ang:1.42,kind:1},{ang:2.48,kind:2},
    {ang:3.58,kind:1},{ang:4.82,kind:0},{ang:5.66,kind:2}
  ];
  c.save();
  for(let i=0;i<marks.length;i++){
    const m=marks[i]; if(cut(m.ang))continue;
    const p=pr(17.98,m.ang,5.55);
    c.translate(q(p.x),q(p.y));
    c.rotate((hash(i,19)-.5)*.16);
    c.globalAlpha=.26;
    c.strokeStyle=i%2?C.red:C.ochre;
    c.lineWidth=Math.max(1.1,scale*.08);
    c.lineCap='round';
    c.beginPath();
    if(m.kind===0){
      c.arc(0,0,scale*.34,0,TAU);
      c.moveTo(-scale*.22,0);c.lineTo(scale*.22,0);
    }else if(m.kind===1){
      c.moveTo(-scale*.34,scale*.18);c.lineTo(0,-scale*.28);c.lineTo(scale*.34,scale*.18);
      c.moveTo(-scale*.20,-scale*.02);c.lineTo(scale*.20,-scale*.02);
    }else{
      c.moveTo(-scale*.30,-scale*.20);c.quadraticCurveTo(0,scale*.28,scale*.30,-scale*.20);
      c.moveTo(0,-scale*.34);c.lineTo(0,scale*.28);
    }
    c.stroke();
    c.setTransform(1,0,0,1,0,0);
  }
  c.restore();
}
function paintArenaRelics(c){
  c.save();c.globalAlpha=.22;
  const relics=[
    {r:8.6,a:.55,s:1.0},{r:10.8,a:2.15,s:.75},{r:6.9,a:4.30,s:.82},{r:11.4,a:5.18,s:.66}
  ];
  for(let i=0;i<relics.length;i++){
    const z=relics[i],p=pr(z.r,z.a,.015),R=scale*.22*z.s;
    c.fillStyle=i%2?C.red2:'#20140f';
    blob(c,p.x,p.y,R*1.7,R*.58,c.fillStyle,null,0,1200+i,.18,12);
    c.fillStyle='rgba(214,157,90,.18)';
    blob(c,p.x-R*.30,p.y-R*.12,R*.45,R*.18,c.fillStyle,null,0,1230+i,.20,10);
  }
  c.restore();
}

function paintBackdrop(){
  const c=sctx;
  c.fillStyle='#050504';c.fillRect(0,0,IW,IH);

  inkWash(c,IW*.12,IH*.42,IW*.31,IH*.45,'#2b1712',.12,40,3);
  inkWash(c,IW*.87,IH*.35,IW*.30,IH*.42,'#18231d',.13,71,3);

  // ground shadow and arena
  blob(c,cx,cy+scale*4.8,scale*19.8,scale*4.7,'rgba(0,0,0,.63)',null,0,9,.025,58);
  blob(c,cx,cy,scale*13.05,scale*4.55,C.sand,'#160d09',1.7,18,.018,82);
  blob(c,cx,cy+scale*.06,scale*11.65,scale*4.03,'rgba(115,66,38,.20)',null,0,29,.025,70);

  // stains in arena, not scratches
  c.save();
  for(let i=0;i<120;i++){
    const u=hash(i,17),v=hash(i,29),rr=Math.sqrt(u)*9.5,ang=v*TAU,p=pr(rr,ang,.01);
    const rad=.25+hash(i,44)*1.0;
    c.globalAlpha=.07+hash(i,55)*.11;
    c.fillStyle=i%11===0?C.red2:(i%5===0?'#7a4a2f':'#120c09');
    c.beginPath();c.arc(q(p.x),q(p.y),rad,0,TAU);c.fill();
  }
  c.restore();

  // terraced stands: broad painted bands
  band(c,13.18,14.00,.54,.98,C.stone2,C.stone,100);
  band(c,13.92,14.74,.96,1.38,C.moss2,C.moss,130);
  band(c,14.66,15.46,1.36,1.80,'#39443a','#202a25',160);
  band(c,15.38,16.20,1.78,2.24,'#4b4b3f','#292820',190);

  // rear wall as one ragged illustrated mass
  band(c,16.55,18.20,2.30,7.38,C.stone2,C.stone,260);
  inkWash(c,cx-IW*.16,cy-scale*4.95,scale*5.6,scale*2.9,'#5d2a22',.13,301,2);
  inkWash(c,cx+IW*.18,cy-scale*4.75,scale*5.0,scale*2.7,'#26332a',.13,331,2);

  paintArenaRelics(c);

  // arches as imperfect ink voids
  for(let i=0;i<20;i++){
    const ang=i*TAU/20+.02;if(cut(ang))continue;
    drawArch(c,ang,i);
  }

  // sparse brush pilasters, never bright straight spokes
  for(let i=0;i<13;i++){
    const ang=i*TAU/13+.04;if(cut(ang))continue;
    const p0=pr(18.08,ang,2.56),p1=pr(18.08,ang,7.16);
    const pts=[];
    for(let k=0;k<8;k++){
      const t=k/7;
      pts.push({x:p0.x+(p1.x-p0.x)*t+(hash(i,k)-.5)*1.6,y:p0.y+(p1.y-p0.y)*t+(hash(k,i)-.5)*1.4});
    }
    roughStroke(c,pts,'rgba(17,10,8,.56)',Math.max(1.3,scale*.11),500+i,false);
  }

  paintWallDetails(c);

  // crown
  band(c,17.86,18.62,7.36,7.92,'#715043','#3d2c26',360);

  // tiny paper flags
  for(let i=0;i<15;i++){
    const ang=i*TAU/15+.08;if(cut(ang))continue;
    const p=pr(18.38,ang,8.62);
    const pole=pr(18.38,ang,7.90);
    roughStroke(c,[pole,p],C.ink,1,410+i,false);
    const s=2.2+scale*.10;
    const pts=[p,{x:p.x+s*(.9+hash(i,2)*.3),y:p.y-1.5},{x:p.x+s*.72,y:p.y+s*.36}];
    fillRagged(c,pts,i%3===0?C.red:'#6c2b1c',C.ink,.8,440+i);
  }

  // torch stains are baked into the picture
  for(const tr of torches){
    if(cut(tr.ang))continue;
    const p=pr(13.34,tr.ang,1.22);
    const g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,scale*2.3);
    g.addColorStop(0,'rgba(220,111,45,.22)');g.addColorStop(.38,'rgba(151,55,28,.11)');g.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,scale*2.3,0,TAU);c.fill();
  }

  // clean half-section edges
  paintCutEdges(c);
}
function drawArch(c,ang,index){
  const mid=pr(18.28,ang,4.92);
  const depth=.72+.28*((Math.sin(ang+yaw)+1)*.5);
  const w=scale*.78*depth,h=scale*1.78*depth;
  c.save();c.translate(q(mid.x),q(mid.y));
  const lean=(hash(index,9)-.5)*.06;c.rotate(lean);
  const j=(hash(index,13)-.5)*.055;
  c.beginPath();
  c.moveTo(-w*.48,h*.48);
  c.lineTo(-w*.50,-h*.02);
  c.quadraticCurveTo(-w*.43,-h*.48,0,-h*(.52+j));
  c.quadraticCurveTo(w*.45,-h*.47,w*.48,-h*.02);
  c.lineTo(w*.48,h*.48);c.closePath();
  c.fillStyle='#050403';c.fill();
  c.strokeStyle='rgba(8,5,4,.95)';c.lineWidth=Math.max(1,scale*.09);c.stroke();
  c.save();c.globalAlpha=.22;c.translate(1,-1);c.strokeStyle=C.red;c.lineWidth=Math.max(.6,scale*.045);c.stroke();c.restore();
  c.restore();
}
function paintCutEdges(c){
  const A=Math.asin(CUT);
  for(const base of [A,Math.PI-A]){
    const ang=base-yaw;
    const p0=pr(13.02,ang,.16),p1=pr(18.70,ang,7.94);
    const pts=[];
    for(let i=0;i<12;i++){
      const t=i/11;

function buildingObstacle(site,gx,gz){

      const nh=heightAt(n.gx,n.gz);

    const h=getHeight(site,gx,gz);
    if(h>=targetH)continue;
    const rk=gx+','+gz+','+h;
    if(site.blueprints.has(rk)||site.reservations.has('block:'+rk))continue;

    for(const d of DIR4){
      const sx=gx+d[0],sz=gz+d[1];
      if(!insideNav(sx,sz))continue;
      if(getHeight(site,sx,sz)!==h)continue;
      if(!reach.has(key2(sx,sz)))continue;
      const standKey=sx+','+sz+','+h;
      if(site.reservations.has('stand:'+standKey))continue;
      const cand={gx,gz,y:h,standGx:sx,standGz:sz,key:rk,standKey,targetH};

function pickCandidate(site,playerIndex){

function findPath(site,start,goal){

function cellAnchor(site,cell,prev){

function reserveCandidate(site,cand,owner){

function releaseCandidate(site,cand){

    if(!validateTask(site,bp.cand))continue;
    list.push({key:k,bp});

function assignTask(pl,index){

  if(ready.length){
    const chosen=ready[0],bp=chosen.bp;
    bp.builder=index;bp.status='claimed';
    pl.task={type:'build',bpKey:chosen.key,cand:bp.cand,started:0,duration:360+hash(index,bp.cand.y+91)*260};
    const start=nearestNavCell(site,pl);
    const route=findPath(site,start,{gx:bp.cand.standGx,gz:bp.cand.standGz});
    pl.path=pathToWorld(site,route,start);
    if(!pl.path.length&&(start.gx!==bp.cand.standGx||start.gz!==bp.cand.standGz)){
      bp.builder=null;bp.status='ready';pl.task=null;pl.wait=.28;

  }

  if(buildComplete(site)){
    if(!pl.path.length&&!pl.segment){
      const start=nearestNavCell(site,pl);
      const exits=boundaryGroundCells(site);
      exits.sort((a,b)=>{
        const wa=worldCell(site,a.gx,a.gz),wb=worldCell(site,b.gx,b.gz);

function startNextSegment(pl){

    t:0,dist,climb:Math.abs(end.h-pl.h)>BLOCK_H*.15

function updatePlayers(dt,now){
  for(let i=0;i<players.length;i++){
    const pl=players[i],site=sites[pl.siteIndex];
    pl.lastX=pl.x;pl.lastZ=pl.z;pl.lastH=pl.h;
    if(updateRitualPlayer(pl,i,site,dt,now))continue;
    if(pl.wait>0){pl.wait=Math.max(0,pl.wait-dt);updateMovement(pl,dt);continue}
    if(!pl.task&&!pl.path.length&&!pl.segment)assignTask(pl,i);
    updateMovement(pl,dt);

    if(!pl.task||pl.path.length||pl.segment)continue;

    if(pl.task.type==='design'){
      const cand=pl.task.cand;
      if(!pl.task.started)pl.task.started=now;
      const progress=clamp((now-pl.task.started)/pl.task.duration,0,1);
      pl.jump=Math.sin(progress*Math.PI*4)*.025;
      if(progress>=1){
        const ci=Math.floor(hash(i*41+cand.gx*17+cand.y,cand.gz*29+cand.y)*BLOCK_COLORS.length);
        site.blueprints.set(cand.key,{
          cand:{...cand},designer:i,builder:null,status:'ready',
          progress:0,color:BLOCK_COLORS[ci],createdAt:now
        });
        // Keep the block/tread reservation alive for the blueprint.
        reserveCandidate(site,cand,'blueprint:'+cand.key);
        pl.task=null;pl.jump=0;pl.wait=.30+hash(i,91)*.35;
      }
    }else if(pl.task.type==='build'){
      const bp=site.blueprints.get(pl.task.bpKey);
      if(!bp){pl.task=null;pl.wait=.25;continue}
      if(!validateTask(site,bp.cand)){
        releaseCandidate(site,bp.cand);site.blueprints.delete(pl.task.bpKey);
        pl.task=null;pl.wait=.30;continue;
      }
      if(!pl.task.started){
        pl.task.started=now;bp.status='building';bp.progress=.02;
      }
      bp.progress=clamp((now-pl.task.started)/pl.task.duration,0,1);
      pl.jump=.035+Math.sin(bp.progress*Math.PI*8)*.030;
      if(bp.progress>=1){
        const ok=placeTaskBlock(site,bp.cand,bp.color,now);
        releaseCandidate(site,bp.cand);
        site.blueprints.delete(pl.task.bpKey);

    }

function siteBannerAnchor(site,index){
  // Keep the banner inside the arena, a little farther out than its tower.
  // That naturally puts it behind the blocks when viewed from the arena side.
  const ang=Math.atan2(site.z,site.x);
  const siteR=Math.hypot(site.x,site.z);
  const r=Math.min(11.72,siteR+2.05);
  const tangent=(index%2?1:-1)*.18;
  return {
    x:Math.cos(ang)*r + (-Math.sin(ang))*tangent,
    z:Math.sin(ang)*r + ( Math.cos(ang))*tangent,
    h:2.85,

}
function bannerBasis(site,index){
  const a=siteBannerAnchor(site,index);

  // width follows the arena tangent, front face points toward the arena center.
  const ux=-Math.sin(a.ang),uz=Math.cos(a.ang);
  const nx=-Math.cos(a.ang),nz=-Math.sin(a.ang);

function siteCarrierIndex(siteIndex){

function updateSiteRituals(now){
  for(let si=0;si<sites.length;si++){
    const site=sites[si];
    const complete=siteProgress(site).ratio>=.9999 && site.blueprints.size===0;

    if(!site.ritual && complete){
      const carrier=siteCarrierIndex(si);
      site.ritual={phase:'fetching',started:now,carrier,burnDuration:5600};
      for(let i=0;i<players.length;i++){
        const pl=players[i];
        if(pl.siteIndex!==si)continue;
        pl.task=null;pl.path.length=0;pl.segment=null;pl.wait=0;pl.jump=0;
      }
    }

    if(!site.ritual)continue;
    const r=site.ritual,age=now-r.started;

    if(r.phase==='fetching' && age>900){
      r.phase='carrying';r.started=now;
    }else if(r.phase==='carrying' && age>1200){
      r.phase='throwing';r.started=now;
    }else if(r.phase==='throwing' && age>820){
      r.phase='burning';r.started=now;
    }else if(r.phase==='burning' && age>=r.burnDuration){
      r.phase='ashes';r.ashStarted=now;r.started=now;
      site.blocks.length=0;site.heights.clear();
      for(let i=0;i<players.length;i++){
        const pl=players[i];

          pl.path.length=0;pl.segment=null;pl.task=null;pl.jump=0;
        }
      }
    }
  }
}

      const tx=site.x+Math.cos(a)*rad,tz=site.z+Math.sin(a)*rad;
      const k=Math.min(1,dt*2.6);pl.x+=(tx-pl.x)*k;pl.z+=(tz-pl.z)*k;pl.h=0;pl.jump=0;
    }
    return true;
  }

  if(r.phase==='carrying'){
    if(carrier){
      const a=Math.atan2(pl.z-site.z,pl.x-site.x);
      const tx=site.x+Math.cos(a)*1.9,tz=site.z+Math.sin(a)*1.9;
      const k=Math.min(1,dt*4.5);
      pl.x+=(tx-pl.x)*k;pl.z+=(tz-pl.z)*k;pl.h=0;
      pl.jump=Math.max(0,Math.sin(age*.016))*.10;
    }else{
      const peers=players.filter(p=>p.siteIndex===si);
      const rank=Math.max(0,peers.indexOf(pl));
      const a=rank*TAU/Math.max(1,peers.length)+si*.55;
      const rad=2.75;
      const tx=site.x+Math.cos(a)*rad,tz=site.z+Math.sin(a)*rad;
      const k=Math.min(1,dt*2.7);pl.x+=(tx-pl.x)*k;pl.z+=(tz-pl.z)*k;pl.h=0;
      pl.jump=Math.max(0,Math.sin(now*.008+rank))*.05;
    }
    return true;
  }

  if(r.phase==='throwing'){
    pl.h=0;
    if(carrier)pl.jump=Math.max(0,Math.sin(clamp(age/820,0,1)*Math.PI))*.24;
    else pl.jump=Math.max(0,Math.sin(now*.009+index))*.07;
    return true;
  }

  if(r.phase==='burning'){
    const peers=players.filter(p=>p.siteIndex===si);
    const rank=Math.max(0,peers.indexOf(pl));
    const a=now*.00185+rank*TAU/Math.max(1,peers.length)+si*.7;
    const radius=3.0+.20*Math.sin(now*.003+index);
    const tx=site.x+Math.cos(a)*radius,tz=site.z+Math.sin(a)*radius;
    const k=Math.min(1,dt*3.2);
    pl.x+=(tx-pl.x)*k;pl.z+=(tz-pl.z)*k;pl.h=0;
    pl.jump=Math.max(0,Math.sin(now*.011+rank*1.7))*.22;
    return true;
  }

  if(r.phase==='ashes'){
    const peers=players.filter(p=>p.siteIndex===si);
    const rank=Math.max(0,peers.indexOf(pl));
    const a=rank*TAU/Math.max(1,peers.length)+si*.55,rad=2.85;
    const tx=site.x+Math.cos(a)*rad,tz=site.z+Math.sin(a)*rad;
    const k=Math.min(1,dt*2.0);
    pl.x+=(tx-pl.x)*k;pl.z+=(tz-pl.z)*k;pl.h=0;pl.jump=0;
    return true;
  }
  return false;
}
function drawRitualTorches(c,site,index,now){
  if(!site.ritual)return;
  const r=site.ritual,carrier=players[r.carrier];
  if(!carrier)return;

  if(r.phase==='carrying'){
    drawTorchStakeWorld(c,carrier.x-.13,carrier.z,carrier.h+.18,index*2,now,true);
    drawTorchStakeWorld(c,carrier.x+.13,carrier.z,carrier.h+.18,index*2+1,now,true);
  }else if(r.phase==='throwing'){
    const t=clamp((now-r.started)/820,0,1);
    for(let j=0;j<2;j++){
      const sx=carrier.x+(j?1:-1)*.14,sz=carrier.z;
      const tx=site.x+(j?1:-1)*.28,tz=site.z;
      const x=sx+(tx-sx)*t,z=sz+(tz-sz)*t;
      const h=.20+Math.sin(Math.PI*t)*1.65;
      drawTorchStakeWorld(c,x,z,h,index*2+j,now,true);
    }
  }
}
function drawViolentTowerFlame(c,x,z,h,height,seed,now){
  const p=wp(x,z,h);
  const flick=.82+.28*Math.sin(now*.018+seed);
  const H=scale*(.85+height*.34)*flick,W=scale*(.30+height*.08);
  c.save();c.globalCompositeOperation='screen';
  c.fillStyle='rgba(255,220,135,.88)';
  c.beginPath();c.moveTo(p.x,p.y-H*.95);
  c.quadraticCurveTo(p.x+W*.55,p.y-H*.30,p.x,p.y-H*.05);
  c.quadraticCurveTo(p.x-W*.55,p.y-H*.30,p.x,p.y-H*.95);c.fill();
  c.fillStyle='rgba(255,126,44,.64)';
  c.beginPath();c.moveTo(p.x,p.y-H*1.18);
  c.quadraticCurveTo(p.x+W*1.35,p.y-H*.42,p.x+W*.14,p.y);
  c.quadraticCurveTo(p.x-W*1.08,p.y-H*.24,p.x,p.y-H*1.18);c.fill();
  c.fillStyle='rgba(208,50,22,.30)';
  c.beginPath();c.moveTo(p.x,p.y-H*1.28);
  c.quadraticCurveTo(p.x+W*1.85,p.y-H*.56,p.x+W*.36,p.y+.06*H);
  c.quadraticCurveTo(p.x-W*1.42,p.y-H*.22,p.x,p.y-H*1.28);c.fill();
  c.restore();
}
function drawTowerFire(c,site,index,now){
  if(!site.ritual||site.ritual.phase!=='burning')return;
  const elapsed=now-site.ritual.started,p=clamp(elapsed/site.ritual.burnDuration,0,1);
  const top=Math.max(BLOCK_H,siteTopHeight(site));
  const glow=wp(site.x,site.z,top*.45);
  c.save();c.globalCompositeOperation='screen';
  let g=c.createRadialGradient(glow.x,glow.y,0,glow.x,glow.y,scale*5.2);
  g.addColorStop(0,'rgba(255,170,72,.32)');
  g.addColorStop(.28,'rgba(235,92,34,.22)');
  g.addColorStop(.68,'rgba(90,18,10,.10)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=g;c.beginPath();c.arc(glow.x,glow.y,scale*5.2,0,TAU);c.fill();c.restore();

  for(let i=0;i<22;i++){
    const a=i*TAU/22+now*.00025*(i%2?1:-1)+hash(index,i)*.42;
    const r=.20+hash(i,index)*1.28;
    const fh=(.60+hash(i,77)*1.12)*top*(.90+.34*(1-p));
    drawViolentTowerFlame(c,site.x+Math.cos(a)*r,site.z+Math.sin(a)*r,.08,fh,i+index*31,now);
  }

  // Sparse rising smoke wisps only; no opaque black blot.
  const smoke=wp(site.x,site.z,top*1.05);
  c.save();c.globalAlpha=.09+.08*p;c.globalCompositeOperation='multiply';
  for(let i=0;i<5;i++){
    const ox=(hash(i,index)-.5)*scale*1.5;
    const oy=(hash(index,i)-.5)*scale*.65-i*scale*.28;
    c.beginPath();c.ellipse(smoke.x+ox,smoke.y+oy,scale*(.42+.12*i),scale*(.18+.06*i),0,0,TAU);
    c.fillStyle='rgba(45,29,20,.18)';c.fill();
  }
  c.restore();
}
function drawAshes(c,site,index,now){
  if(!site.ritual||site.ritual.phase!=='ashes')return;
  const p=wp(site.x,site.z,.02),R=scale*1.55;
  c.save();
  blob(c,p.x,p.y+R*.12,R*1.15,R*.30,'rgba(16,13,11,.88)',null,0,7600+index,.18,26);
  blob(c,p.x-R*.16,p.y,R*.60,R*.19,'rgba(73,58,49,.74)',null,0,7640+index,.22,18);
  blob(c,p.x+R*.22,p.y+R*.04,R*.48,R*.15,'rgba(103,79,62,.43)',null,0,7680+index,.24,16);

  // A few dying embers, deliberately sparse.
  const age=now-site.ritual.ashStarted;
  const fade=clamp(1-age/12000,0,1);
  if(fade>0){
    c.globalCompositeOperation='screen';c.globalAlpha=.20*fade;
    for(let i=0;i<5;i++){
      const ex=p.x+(hash(i,index)-.5)*R*.9,ey=p.y+(hash(index,i)-.5)*R*.22;
      c.fillStyle=i%2?C.red:C.ochre;c.beginPath();c.arc(ex,ey,Math.max(.7,scale*.035),0,TAU);c.fill();
    }
  }
  c.restore();
}

function drawDynamic(now){
  ctx.fillStyle=C.black;ctx.fillRect(0,0,IW,IH);
  ctx.drawImage(staticCanvas,0,0);
  drawClock(ctx,now);

  const t=now/1000;
  const dt=Math.min(.08,FRAME/1000);
  updateSiteRituals(now);
  updatePlayers(dt,now);

  for(let i=0;i<sites.length;i++){
    drawSiteShadow(ctx,sites[i],i);
    drawSiteMarker(ctx,sites[i],i);
    drawAshes(ctx,sites[i],i,now);
  }

  const items=[];
  for(let si=0;si<sites.length;si++){
    const site=sites[si];
    for(let bi=0;bi<site.blocks.length;bi++){
      if(site.ritual&&site.ritual.phase==='ashes')continue;
      const b=site.blocks[bi],pos=blockWorld(site,b),p=wp(pos.x,pos.z,(b.y+.5)*BLOCK_H);
      items.push({type:'block',si,bi,depth:p.zv,py:p.y,h:b.y});
    }
    for(const [bpKey,bp] of site.blueprints){
      const pos=worldCell(site,bp.cand.gx,bp.cand.gz),p=wp(pos.x,pos.z,(bp.cand.y+.5)*BLOCK_H);
      items.push({type:bp.status==='building'?'building':'blueprint',si,bpKey,depth:p.zv,py:p.y,h:bp.cand.y});
    }
    const bb=bannerBasis(site,si);
    if(bb.facing>.035){
      const bpv=bannerProject(bb,0,0);
      items.push({type:'banner',si,depth:bpv.zv,py:bpv.y,h:bb.a.h/BLOCK_H});
      const ta=tubeAnchor(site,si),tp=wp(ta.x,ta.z,ta.h);
      items.push({type:'tube',si,depth:tp.zv,py:tp.y,h:ta.h/BLOCK_H});
    }
  }
  for(let i=0;i<players.length;i++){
    const pl=players[i],p=wp(pl.x,pl.z,pl.h+pl.jump+.42);
    items.push({type:'player',i,depth:p.zv,py:p.y,h:(pl.h+pl.jump)/BLOCK_H});
  }
  items.sort((u,v)=>u.depth-v.depth || u.py-v.py || u.h-v.h);
  for(const it of items){
    if(it.type==='block')drawBlock(ctx,sites[it.si],sites[it.si].blocks[it.bi],it.bi,now,it.si);
    else if(it.type==='blueprint')drawBlueprint(ctx,sites[it.si],sites[it.si].blueprints.get(it.bpKey),now,it.si);
    else if(it.type==='building')drawBuildingBlock(ctx,sites[it.si],sites[it.si].blueprints.get(it.bpKey),now,it.si);
    else if(it.type==='banner')drawTowerBanner(ctx,sites[it.si],it.si,now);
    else if(it.type==='tube')drawProgressTube(ctx,sites[it.si],it.si);
    else drawPlayer(ctx,players[it.i],t,it.i);
  }

  for(let i=0;i<sites.length;i++){
    drawRitualTorches(ctx,sites[i],i,now);
    drawTowerFire(ctx,sites[i],i,now);
  }

  ctx.save();ctx.globalCompositeOperation='screen';
  const flameFrame=Math.floor(now/165)%4;
  for(const tr of torches){
    if(cut(tr.ang))continue;
    const p=pr(13.34,tr.ang,1.22);
    const flick=.82+hash(flameFrame,tr.phase)*.22;
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,scale*(1.55+.25*flick));
    g.addColorStop(0,'rgba(226,129,54,'+(0.18*flick)+')');g.addColorStop(.45,'rgba(177,52,28,'+(0.08*flick)+')');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,scale*(1.55+.25*flick),0,TAU);ctx.fill();
    drawFlame(ctx,p,flameFrame,Math.floor(tr.phase*19));
  }
  ctx.restore();

  // Selective print flash: only freshly placed blocks get a brief colored afterimage.
  ctx.save();ctx.globalCompositeOperation='screen';
  for(let i=0;i<sites.length;i++){
    const age=now-sites[i].lastBuilt;
    if(age>=0 && age<240){
      const newest=sites[i].blocks[sites[i].blocks.length-1];if(!newest)continue;
      const pos=blockWorld(sites[i],newest);
      const p=wp(pos.x,pos.z,(newest.y+1)*BLOCK_H);
      const k=1-age/240;
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,scale*(.45+.55*(1-k)));
      g.addColorStop(0,'rgba(227,111,47,'+(0.14*k)+')');g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,scale*.9,0,TAU);ctx.fill();
    }
  }
  ctx.restore();

  // smoky cut-paper wash, intentionally non-volumetric
  ctx.save();ctx.globalAlpha=.055;ctx.fillStyle='#9b5e37';
  blob(ctx,cx,cy+scale*1.85,scale*11.2,scale*2.85,'#9b5e37',null,0,990,.07,30);
  ctx.restore();
}
function frame(now){
  if(!visible){requestAnimationFrame(frame);return}
  if(now-last>=FRAME){
    if(staticDirty){paintBackdrop();staticDirty=false}
    drawDynamic(now);
    last=now-(now-last)%FRAME;
  }
  requestAnimationFrame(frame);
}
function pd(e){
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId);
  if(pointers.size===2){const p=[...pointers.values()];pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}
}
function pm(e){
  const old=pointers.get(e.pointerId);if(!old)return;
  const next={x:e.clientX,y:e.clientY};pointers.set(e.pointerId,next);
  if(pointers.size===1){yaw+=(next.x-old.x)*.008;staticDirty=true}
  else if(pointers.size===2){
    const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if(pinch){zoom=clamp(zoom*d/pinch,.34,3.40);scale=Math.min(IW/37,IH/22.5)*zoom;staticDirty=true}
    pinch=d;
  }
}
function pu(e){pointers.delete(e.pointerId);pinch=0}
canvas.addEventListener('pointerdown',pd);canvas.addEventListener('pointermove',pm);canvas.addEventListener('pointerup',pu);canvas.addEventListener('pointercancel',pu);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom*Math.exp(-e.deltaY*.0009),.34,3.40);scale=Math.min(IW/37,IH/22.5)*zoom;staticDirty=true},{passive:false});
addEventListener('resize',resize,{passive:true});
document.addEventListener('visibilitychange',()=>{visible=!document.hidden;if(visible){last=0;staticDirty=true}});
resize();requestAnimationFrame(frame);
})();
</script>
