<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe9dc">
<title>Prometeo · Drive Reader V2</title>
<link rel="stylesheet" href="./style.css?v=1">
</head>
<body>
<main class="page">
  <header class="top">
    <div>
      <div class="brand">PROMETEO / ARCHIVO</div>
      <div id="mode" class="mode">cargando</div>
    </div>
    <button id="searchToggle" class="search-toggle" aria-label="Buscar">⌕</button>
  </header>

  <section id="searchPanel" class="search-panel" hidden>
    <input id="search" type="search" placeholder="Buscar en todo el Drive" autocomplete="off">
  </section>

  <section id="browser">
    <div id="snapshot" class="snapshot"></div>
    <header class="folder-head">
      <button id="back" class="back" hidden aria-label="Volver">←</button>
      <div class="folder-copy">
        <div id="crumb" class="crumb">PSICOLOGÍA</div>
        <h1 id="folderTitle">Archivo</h1>
      </div>
      <div id="folderCount" class="folder-count"></div>
    </header>
    <div id="list" class="list"><div class="loading">Reconstruyendo índice…</div></div>
  </section>

  <article id="reader" class="reader" hidden>
    <header class="reader-head">
      <button id="readerBack" class="back" aria-label="Volver al archivo">←</button>
      <div>
        <div id="readerKind" class="crumb"></div>
        <h1 id="readerTitle"></h1>
      </div>
    </header>

    <div class="pipeline" aria-label="Estado del documento">
      <span data-stage="index">ÍNDICE</span>
      <span data-stage="source">FUENTE</span>
      <span data-stage="extract">EXTRACCIÓN</span>
      <span data-stage="canonical">DOCUMENTO</span>
      <span data-stage="reader">LECTOR</span>
    </div>
    <div id="readerMeta" class="reader-meta"></div>
    <div id="readerBody" class="reader-body"></div>
  </article>
</main>
<script src="./app.js?v=1"></script>
</body>
</html>
