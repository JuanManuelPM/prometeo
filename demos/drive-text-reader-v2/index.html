<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe9dc">
<meta name="prometeo-rev" content="20260924T2048Z-READER-RESUME-V4">
<title>Prometeo · Drive Reader V2</title>
<link rel="stylesheet" href="./style.css?v=4">
</head>
<body>
<main class="page">
  <header class="top">
    <div>
      <div class="brand">PROMETEO / ARCHIVO</div>
      <div id="mode" class="mode">cargando</div>
    </div>
    <button id="searchToggle" class="search-toggle" aria-label="Buscar">⌕</button>
  </header>

  <section id="searchPanel" class="search-panel" hidden>
    <input id="search" type="search" placeholder="Buscar en todo el Drive" autocomplete="off">
  </section>

  <section id="browser">
    <div id="snapshot" class="snapshot"></div>
    <header class="folder-head">
      <button id="back" class="back" hidden aria-label="Volver">←</button>
      <div class="folder-copy">
        <div id="crumb" class="crumb">PSICOLOGÍA</div>
        <h1 id="folderTitle">Archivo</h1>
      </div>
      <div id="folderCount" class="folder-count"></div>
    </header>
    <div id="list" class="list"><div class="loading">Reconstruyendo índice…</div></div>
  </section>

  <article id="reader" class="reader" hidden>
    <header class="reader-head">
      <button id="readerBack" class="back" aria-label="Volver al archivo">←</button>
      <div>
        <div id="readerKind" class="crumb"></div>
        <h1 id="readerTitle"></h1>
      </div>
    </header>

    <div class="pipeline" aria-label="Estado del documento">
      <span data-stage="index">ÍNDICE</span>
      <span data-stage="source">FUENTE</span>
      <span data-stage="extract">EXTRACCIÓN</span>
      <span data-stage="canonical">DOCUMENTO</span>
      <span data-stage="reader">LECTOR</span>
    </div>
    <div class="reader-provenance" aria-label="Origen y proyección del documento">
      <section class="provenance-block">
        <span class="provenance-kicker">FUENTE DRIVE</span>
        <strong id="sourceLabel">Sin abrir</strong>
        <span id="sourceMeta">El archivo fuente todavía no fue localizado.</span>
      </section>
      <section class="provenance-block">
        <span class="provenance-kicker">DOCUMENTO RENDERIZADO</span>
        <strong id="documentLabel">Pendiente</strong>
        <span id="documentMeta">La vista de lectura se construye después de extraer y normalizar el texto.</span>
      </section>
    </div>

    <div id="readerMeta" class="reader-meta"></div>
    <div id="readerState" class="reader-state" aria-live="polite"></div>
    <div id="readerTools" class="reader-tools" hidden>
      <button id="readerOutlineToggle" type="button">BLOQUES</button>
      <button id="readerTop" type="button">INICIO</button>
    </div>
    <aside id="readerOutline" class="reader-outline" aria-label="Bloques del documento" hidden></aside>
    <div id="readingTrack" class="reading-track" aria-hidden="true" hidden><span id="readingTrackBar"></span></div>
    <div id="readerBody" class="reader-body"></div>

    <nav id="readerNav" class="reader-nav" aria-label="Navegación de lectura" hidden>
      <button id="readerPrev" type="button" aria-label="Bloque anterior">← <span>Anterior</span></button>
      <button id="readerCenter" class="reader-center" type="button" aria-label="Centrar bloque actual">
        <strong id="readerProgress">0 / 0</strong>
        <span>centrar bloque</span>
      </button>
      <button id="readerNext" type="button" aria-label="Bloque siguiente"><span>Siguiente</span> →</button>
    </nav>
  </article>
</main>
<script src="./app.js?v=4"></script>
<script>
(()=>{
 const body=document.getElementById('readerBody'),tools=document.getElementById('readerTools'),outline=document.getElementById('readerOutline');
 const toggle=document.getElementById('readerOutlineToggle'),topBtn=document.getElementById('readerTop');
 const track=document.getElementById('readingTrack'),bar=document.getElementById('readingTrackBar');
 let lastCount=0;
 function segments(){return [...body.querySelectorAll('.reader-segment')]}
 function sync(){
   const segs=segments();
   if(!segs.length){tools.hidden=true;outline.hidden=true;track.hidden=true;lastCount=0;return}
   tools.hidden=false;track.hidden=false;
   const found=segs.findIndex(el=>el.classList.contains('is-current')),current=Math.max(0,found);
   bar.style.width=(((current+1)/segs.length)*100).toFixed(2)+'%';
   outline.querySelectorAll('[data-jump]').forEach((el,i)=>el.classList.toggle('is-current',i===current));
 }
 function safe(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
 function rebuild(){
   const segs=segments();if(!segs.length){sync();return}
   if(segs.length!==lastCount){
     lastCount=segs.length;
     outline.innerHTML=segs.map((el,i)=>{const t=el.textContent.trim();return '<button type="button" data-jump="'+i+'"><span>'+String(i+1).padStart(2,'0')+'</span><b>'+safe(t.slice(0,90))+(t.length>90?'…':'')+'</b></button>'}).join('');
     outline.querySelectorAll('[data-jump]').forEach(el=>el.onclick=()=>{outline.hidden=true;toggle.textContent='BLOQUES';const i=Number(el.dataset.jump);if(typeof selectSegment==='function')selectSegment(i,true)});
   }
   sync();
 }
 toggle.onclick=()=>{rebuild();outline.hidden=!outline.hidden;toggle.textContent=outline.hidden?'BLOQUES':'CERRAR'};
 topBtn.onclick=()=>{if(typeof selectSegment==='function')selectSegment(0,true)};
 new MutationObserver(rebuild).observe(body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
 addEventListener('scroll',sync,{passive:true});
})();
</script>
</body>
</html>
