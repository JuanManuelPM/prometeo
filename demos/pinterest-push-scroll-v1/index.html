<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Push Scroll — Chapters</title>
<style>
  :root{
    --paper:#efedef;
    --ink:#111;
    --line:rgba(17,17,17,.36);
    --rail:clamp(58px,7vw,92px);
    --edge:18px;
    --anchor:22vh;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
  body{overflow-x:hidden}

  .rail{
    position:fixed;
    z-index:20;
    left:var(--edge);
    top:var(--edge);
    bottom:var(--edge);
    width:var(--rail);
    border:1px solid var(--line);
    background:var(--paper);
    overflow:hidden;
    pointer-events:none;
  }

  .number-stage{
    position:absolute;
    left:0;
    right:0;
    top:var(--anchor);
    height:clamp(44px,6vw,72px);
    overflow:hidden;
  }
  .rail-num{
    position:absolute;
    left:0;
    width:100%;
    height:100%;
    display:grid;
    place-items:center;
    font-size:clamp(28px,3.4vw,48px);
    font-weight:900;
    letter-spacing:-.07em;
    line-height:1;
    will-change:transform;
  }
  #currentNum{transform:translateY(0)}
  #nextNum{transform:translateY(100%)}

  main{margin-left:calc(var(--edge) + var(--rail));}
  .chapter{
    min-height:125vh;
    padding:18vh clamp(24px,7vw,112px) 32vh;
    display:flex;
    align-items:flex-start;
  }
  .chapter-title{
    margin:0;
    max-width:8ch;
    font-size:clamp(64px,11vw,180px);
    font-weight:900;
    line-height:.82;
    letter-spacing:-.075em;
    text-transform:uppercase;
  }

  @media (max-width:700px){
    :root{--edge:8px;--rail:52px;--anchor:18vh}
    .chapter{min-height:118vh;padding:16vh 18px 30vh 22px}
    .chapter-title{font-size:clamp(54px,19vw,94px);max-width:6.5ch}
    .rail-num{font-size:26px}
  }
</style>
</head>
<body>
  <aside class="rail" aria-hidden="true">
    <div class="number-stage" id="numberStage">
      <div class="rail-num" id="currentNum">01</div>
      <div class="rail-num" id="nextNum">02</div>
    </div>
  </aside>

  <main>
    <section class="chapter" data-num="01"><h1 class="chapter-title">Chapter One</h1></section>
    <section class="chapter" data-num="02"><h1 class="chapter-title">Chapter Two</h1></section>
    <section class="chapter" data-num="03"><h1 class="chapter-title">Chapter Three</h1></section>
    <section class="chapter" data-num="04"><h1 class="chapter-title">Chapter Four</h1></section>
  </main>

<script>
(() => {
  const sections = [...document.querySelectorAll('.chapter')];
  const currentEl = document.getElementById('currentNum');
  const nextEl = document.getElementById('nextNum');
  const stage = document.getElementById('numberStage');

  let active = 0;

  function render(){
    const anchorY = stage.getBoundingClientRect().top;
    const h = stage.getBoundingClientRect().height || 1;

    let idx = 0;
    for(let i=0;i<sections.length;i++){
      if(sections[i].getBoundingClientRect().top <= anchorY) idx = i;
    }
    active = idx;

    const current = sections[active];
    const next = sections[active + 1];
    currentEl.textContent = current.dataset.num;

    if(!next){
      nextEl.textContent = '';
      currentEl.style.transform = 'translateY(0%)';
      nextEl.style.transform = 'translateY(100%)';
      return;
    }

    nextEl.textContent = next.dataset.num;

    const nextTop = next.getBoundingClientRect().top;
    const start = anchorY + h;
    const progress = Math.max(0, Math.min(1, (start - nextTop) / h));

    currentEl.style.transform = `translateY(${-progress * 100}%)`;
    nextEl.style.transform = `translateY(${100 - progress * 100}%)`;
  }

  addEventListener('scroll', render, {passive:true});
  addEventListener('resize', render);
  render();
})();
</script>
</body>
</html>
