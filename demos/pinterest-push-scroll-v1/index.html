<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Push Scroll Study</title>
<style>
  :root{
    --paper:#efedef;
    --ink:#111111;
    --muted:#8c898d;
    --line:rgba(17,17,17,.42);
    --pad:clamp(18px,2.3vw,34px);
    --rail:76px;
    --nav-h:82px;
  }
  *{box-sizing:border-box}
  html{background:var(--paper); color:var(--ink); scroll-behavior:smooth}
  body{margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--paper); color:var(--ink)}
  a{color:inherit;text-decoration:none}
  .shell{min-height:100vh}

  .topbar{
    position:sticky; top:0; z-index:50;
    height:var(--nav-h);
    margin:18px 18px 0;
    border:1px solid var(--line);
    background:color-mix(in srgb,var(--paper) 94%,transparent);
    backdrop-filter:blur(10px);
    display:grid;
    grid-template-columns:var(--rail) 1fr auto;
    align-items:stretch;
  }
  .brand{display:grid;place-items:center;border-right:1px solid var(--line)}
  .brand i{width:38px;height:38px;border:3px solid var(--ink);border-radius:50%;display:block}
  .menu{display:flex;align-items:center;gap:44px;padding:0 54px}
  .menu a{font-size:12px;font-weight:700;line-height:1.05;position:relative;padding-top:12px}
  .menu a small{display:block;font-size:8px;color:var(--muted);margin-bottom:3px;font-weight:600;letter-spacing:.04em}
  .menu a.active::after{content:"";position:absolute;height:4px;background:var(--ink);left:0;right:0;bottom:-27px}
  .contact{display:flex;align-items:center;gap:18px;padding:0 26px;font-size:12px;font-weight:700}
  .arrow{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:20px}

  .left-rail{
    position:fixed; z-index:20; left:18px; top:calc(18px + var(--nav-h)); bottom:18px;
    width:var(--rail); border:1px solid var(--line); border-top:0;
    display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:18px;padding-bottom:24px;
    pointer-events:none;
  }
  .left-rail span{font-size:10px;opacity:.7}

  .intro{margin-left:calc(18px + var(--rail)); padding:64px 7vw 28px; height:155px}
  .eyebrow{font-size:9px;letter-spacing:.12em;font-weight:700;color:var(--muted)}

  main{margin-left:calc(18px + var(--rail)); padding:0 7vw 12vh}
  .chapter{
    position:relative;
    min-height:145vh;
    display:grid;
    grid-template-columns:minmax(230px,28vw) minmax(0,1fr);
    column-gap:clamp(36px,8vw,140px);
    border-top:1px solid transparent;
  }
  .chapter + .chapter{margin-top:-4vh}
  .number-col{position:relative}
  .number-stick{
    position:sticky;
    top:calc(var(--nav-h) + 88px);
    height:max-content;
    padding-bottom:18vh;
  }
  .num{
    font-size:clamp(104px,15vw,220px);
    font-weight:900;
    line-height:.78;
    letter-spacing:-.085em;
    white-space:nowrap;
  }

  .story{
    padding-top:132px;
    padding-bottom:32vh;
  }
  .rule{height:4px;background:var(--ink);width:100%;margin-bottom:26px}
  .story-grid{display:grid;grid-template-columns:minmax(210px,.85fr) minmax(300px,1.6fr);gap:clamp(28px,6vw,90px)}
  h2{font-size:clamp(28px,3.2vw,52px);line-height:.94;margin:0 0 12px;letter-spacing:-.04em;max-width:10ch}
  .sub{font-size:12px;font-weight:700;margin:0;color:#514f52}
  .copy{max-width:640px;color:#777377;font-size:clamp(15px,1.25vw,20px);line-height:1.62}
  .copy p{margin:0 0 1.35em}
  .copy p:last-child{margin-bottom:0}

  .chapter:nth-child(even) .story{padding-top:170px}
  .chapter:nth-child(3n) .story{padding-top:110px}

  .progress{position:fixed;right:10px;top:0;width:2px;height:100vh;background:rgba(17,17,17,.08);z-index:70}
  .progress i{display:block;width:100%;height:0;background:var(--ink)}
  .hint{position:fixed;right:20px;bottom:18px;z-index:80;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);mix-blend-mode:multiply}

  @media (max-width: 780px){
    :root{--rail:48px;--nav-h:68px}
    .topbar{margin:8px 8px 0;grid-template-columns:var(--rail) 1fr auto}
    .menu{gap:18px;padding:0 14px;overflow:hidden}.menu a:nth-child(n+4){display:none}
    .menu a{font-size:10px}.menu a small{font-size:7px}
    .menu a.active::after{bottom:-23px;height:3px}
    .contact{padding:0 8px}.contact>span:first-child{display:none}.arrow{width:32px;height:32px}
    .brand i{width:28px;height:28px;border-width:2px}
    .left-rail{left:8px;top:calc(8px + var(--nav-h));bottom:8px;width:var(--rail)}
    .intro,main{margin-left:calc(8px + var(--rail));padding-left:18px;padding-right:18px}
    .intro{padding-top:38px;height:110px}
    .chapter{grid-template-columns:1fr;min-height:128vh;column-gap:0}
    .number-col{height:180px}
    .number-stick{top:calc(var(--nav-h) + 20px);z-index:4;padding-bottom:0;width:max-content}
    .num{font-size:118px;line-height:.8;background:linear-gradient(var(--paper),var(--paper));padding-right:14px}
    .story,.chapter:nth-child(even) .story,.chapter:nth-child(3n) .story{padding-top:34px;padding-bottom:34vh}
    .story-grid{grid-template-columns:1fr;gap:26px}
    h2{font-size:34px;max-width:11ch}.copy{font-size:15px;line-height:1.58}.rule{height:3px}
    .hint{display:none}
  }

  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><i></i></div>
    <nav class="menu">
      <a class="active" href="#s1"><small>01.</small>Services</a>
      <a href="#s2"><small>02.</small>Work</a>
      <a href="#s3"><small>03.</small>Company</a>
      <a href="#s4"><small>04.</small>Careers</a>
    </nav>
    <a class="contact" href="#s4"><span>Contact</span><span class="arrow">→</span></a>
  </header>

  <aside class="left-rail" aria-hidden="true"><span>◉</span><span>▣</span><span>♥</span></aside>

  <div class="intro"><div class="eyebrow">FROM START TO FINISH</div></div>

  <main id="chapters"></main>
</div>
<div class="progress"><i></i></div>
<div class="hint">scroll to push</div>

<script>
(() => {
  const titles = [
    'Unlocking the opportunity','Finding the useful signal','Shaping the direction','Building what matters',
    'Turning friction into clarity','Making complexity feel simple','Reading the room carefully','Designing for momentum'
  ];
  const subs = ['Business strategy','Experience design','Product systems','Prototype direction','Research synthesis','Implementation'];
  const starts = [
    'Every project starts by looking closely at the forces already moving through the room.',
    'We begin with a quiet inventory of goals, constraints, habits, and the details people usually skip.',
    'The first useful move is rarely the loudest one; it is the one that makes the next decision obvious.',
    'Good systems are built by finding the smallest structure that can carry the full idea.'
  ];
  const middles = [
    'Conversations, prototypes, observations, and rough models are placed side by side until a pattern becomes visible.',
    'The work stays deliberately concrete: what someone sees, where attention lands, what changes after an action, and what must remain stable.',
    'Instead of decorating uncertainty, the process makes it legible. Assumptions are surfaced early and tested against behavior.',
    'The result is a shared language for deciding what deserves weight, what can disappear, and what should stay flexible.'
  ];
  const ends = [
    'That creates enough confidence to move forward without pretending the future is already known.',
    'From there, the concept can grow without losing the simple logic that made it understandable in the first place.',
    'The final direction feels less like a reveal and more like the inevitable outcome of a sequence of good choices.',
    'What remains is a system that can adapt, scale, and still feel calm when new information arrives.'
  ];
  const pick = a => a[Math.floor(Math.random()*a.length)];
  const used = new Set();
  const uniqueTitle = () => { let x; do{x=pick(titles)}while(used.has(x)); used.add(x); return x; };
  const main = document.querySelector('#chapters');

  for(let i=1;i<=4;i++){
    const section = document.createElement('section');
    section.className='chapter'; section.id='s'+i;
    const t = uniqueTitle();
    section.innerHTML = `
      <div class="number-col"><div class="number-stick"><div class="num">${String(i).padStart(2,'0')}</div></div></div>
      <article class="story">
        <div class="rule"></div>
        <div class="story-grid">
          <div><h2>${t}</h2><p class="sub">${pick(subs)}</p></div>
          <div class="copy">
            <p>${pick(starts)} ${pick(middles)} ${pick(ends)}</p>
            <p>${pick(starts)} ${pick(middles)} ${pick(ends)}</p>
          </div>
        </div>
      </article>`;
    main.appendChild(section);
  }

  const bar = document.querySelector('.progress i');
  const nav = [...document.querySelectorAll('.menu a')];
  const chapters = [...document.querySelectorAll('.chapter')];
  const update = () => {
    const max = document.documentElement.scrollHeight - innerHeight;
    bar.style.height = (max ? scrollY/max*100 : 0) + '%';
    let active = 0;
    const y = innerHeight * .35;
    chapters.forEach((s,idx)=>{ if(s.getBoundingClientRect().top < y) active = idx; });
    nav.forEach((a,idx)=>a.classList.toggle('active', idx===active));
  };
  addEventListener('scroll',update,{passive:true}); addEventListener('resize',update); update();
})();
</script>
</body>
</html>
