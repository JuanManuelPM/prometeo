<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe9dc">
<title>Modelos y Teorías III · Prometeo</title>
<link rel="stylesheet" href="./style.css?v=1">
</head>
<body>
<main class="shell">
  <header class="topline">
    <a class="brand" href="./">PROMETEO / FACULTAD</a>
    <span class="safe">DEMO SINTÉTICA</span>
  </header>

  <section id="libraryView" class="library-view">
    <p class="kicker">Biblioteca de ejemplo</p>
    <h1>Modelos y<br>Teorías III</h1>
    <p class="intro">Tres documentos inventados para probar cómo se siente una materia real cuando SOURCE → Canonical → Reader → TTS ya está conectado.</p>
    <div id="docList" class="doc-list" aria-label="Documentos"></div>
  </section>

  <section id="readerView" class="reader-view" hidden>
    <button id="backBtn" class="back" type="button">← Modelos III</button>
    <div class="reader-head">
      <div>
        <p class="kicker">Documento normalizado</p>
        <h1 id="readerTitle"></h1>
        <p id="readerSubtitle" class="subtitle"></p>
      </div>
      <div class="source-mark"><span></span> Fixture seguro</div>
    </div>

    <div id="audioDock" class="audio-dock" data-open="0">
      <button id="playBtn" class="play-btn" type="button" aria-label="Reproducir" disabled>
        <span class="play-icon" aria-hidden="true">▶</span>
        <span class="pause-icon" aria-hidden="true">Ⅱ</span>
      </button>
      <div class="audio-body" aria-live="polite">
        <div class="track"><div id="bufferBar" class="buffer-bar"></div><div id="playBar" class="play-bar"></div></div>
        <div class="audio-meta"><span id="audioStatus">preparando lector…</span><span id="audioCount"></span></div>
      </div>
    </div>

    <article id="readerText" class="reader-text"></article>
    <footer class="reader-foot"><span id="readerIdentity"></span><span>Canonical → Reader → TTS</span></footer>
  </section>
</main>
<script type="module" src="./app.js?v=1"></script>
</body>
</html>
