<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Display · Texto Vertical</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #000;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
  }

  .stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #000;
  }

  .ticker {
    position: absolute;
    top: 50%;
    left: 0;
    display: flex;
    align-items: center;
    gap: clamp(12px, 1.4vw, 24px);
    color: #fff;
    will-change: transform;
    animation: travel 12s linear infinite;
  }

  .ticker__text {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: clamp(44px, 7vw, 112px);
    font-weight: 700;
    line-height: .9;
    letter-spacing: -0.04em;
    white-space: nowrap;
  }

  .ticker__rule {
    width: 4px;
    height: min(62vh, 620px);
    background: #fff;
    flex: 0 0 auto;
  }

  @keyframes travel {
    from {
      transform: translate3d(calc(100vw + 100%), -50%, 0);
    }
    to {
      transform: translate3d(calc(-100% - 6vw), -50%, 0);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .ticker { animation-duration: 24s; }
  }
</style>
</head>
<body>
  <main class="stage" aria-label="Display animado">
    <div class="ticker" aria-label="Texto en movimiento">
      <div class="ticker__rule" aria-hidden="true"></div>
      <div class="ticker__text">TEXTO VERTICAL · DISPLAY · PRUEBA 01</div>
    </div>
  </main>
</body>
</html>
