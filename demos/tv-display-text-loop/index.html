<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Prometeo · TV Brief</title>
<style>
:root{color-scheme:dark;--fg:#f4f4f0;--muted:#858580;--line:#292927}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#000;color:var(--fg);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden}
.screen{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(20px,3.2vw,58px);background:#000}
.top{display:flex;align-items:center;gap:16px}.brand{font:950 clamp(9px,.9vw,14px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.17em;white-space:nowrap}.rule{height:1px;background:var(--line);flex:1}
.state{display:flex;align-items:center;gap:8px;font:900 clamp(9px,.75vw,12px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em}.dot{width:9px;height:9px;border:1px solid #777}.unread .dot{background:#fff;border-color:#fff}.played{color:#777}
.brief{display:grid;grid-template-columns:minmax(0,1fr) minmax(210px,27vw);gap:clamp(26px,5vw,86px);align-items:center;min-height:0;padding:clamp(18px,3vh,42px) 0}
.copy{min-width:0;transition:opacity .25s ease,transform .25s ease}.swap .copy{opacity:.08;transform:translateY(7px)}
.kicker{display:flex;gap:10px;margin-bottom:clamp(15px,2vh,28px);font:900 clamp(9px,.8vw,13px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.13em;color:var(--muted);text-transform:uppercase}.kicker strong{color:#fff}
h1{max-width:1180px;margin:0;font-size:clamp(46px,6.2vw,112px);line-height:.91;letter-spacing:-.065em;font-weight:900;text-wrap:balance}
.body{max-width:1060px;margin:clamp(18px,3vh,36px) 0 0;color:#aaa;font-size:clamp(17px,1.8vw,31px);line-height:1.24;letter-spacing:-.024em;text-wrap:pretty}
.side{height:100%;border-left:1px solid var(--line);padding-left:clamp(18px,2.2vw,36px);display:flex;flex-direction:column;justify-content:space-between}
.small{font:900 clamp(8px,.62vw,10px)/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.13em;color:var(--muted);text-transform:uppercase}.time{margin-top:9px;font-size:clamp(20px,2.1vw,38px);font-weight:900;line-height:1;letter-spacing:-.04em}
.idline{margin-top:10px;color:#777;font:800 clamp(8px,.68vw,11px)/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}.definition{padding-top:18px;border-top:1px solid var(--line);color:#747470;font:750 clamp(9px,.7vw,11px)/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.definition b{color:#bbb}
.bottom{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;border-top:1px solid var(--line);padding-top:17px}.counter{font:900 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;color:#aaa}.track{height:2px;background:#181817;overflow:hidden}.progress{height:100%;width:0;background:#fff;transition:width 1s linear}
.controls{display:flex;gap:7px}.btn{border:1px solid var(--line);background:#000;color:#fff;min-height:35px;padding:0 10px;font:900 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.07em;cursor:pointer}.btn.primary{background:#fff;color:#000;border-color:#fff}.btn:disabled{opacity:.42}
@media(max-width:760px),(max-aspect-ratio:4/5){.screen{padding:16px 13px}.brief{grid-template-columns:1fr;gap:17px;align-content:center}.side{height:auto;border-left:0;border-top:1px solid var(--line);padding:14px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:14px}.definition{border:0;padding:0;text-align:right}h1{font-size:clamp(40px,12vw,70px)}.body{font-size:clamp(16px,4.5vw,23px)}.bottom{grid-template-columns:auto 1fr}.controls{grid-column:1/-1}.btn{flex:1}.brand{font-size:9px}}
@media(prefers-reduced-motion:reduce){.copy,.progress{transition:none}}
</style>
</head>
<body>
<main class="screen" id="screen" data-build="MB-TV-BRIEF-01">
<header class="top"><div class="brand">PROMETEO · TV BRIEF</div><div class="rule"></div><div class="state unread" id="state"><i class="dot"></i><span id="stateText">UNREAD</span></div></header>
<section class="brief" aria-live="polite">
 <div class="copy"><div class="kicker"><strong id="source">PROMETEO</strong><span>·</span><span id="kind">MENSAJE</span></div><h1 id="title"></h1><p class="body" id="body"></p></div>
 <aside class="side"><div><div class="small">TIMESTAMP DEL MENSAJE</div><div class="time" id="time"></div><div class="idline" id="idline"></div></div><div class="definition"><b>PLAYED</b> = completó una pasada visual. No implica audio ni reproducción de voz.</div></aside>
</section>
<footer class="bottom"><div class="counter" id="counter">01 / 01</div><div class="track"><div class="progress" id="progress"></div></div><div class="controls"><button class="btn" id="pause">PAUSAR LOOP</button><button class="btn primary" id="mark">MARCAR PLAYED</button></div></footer>
</main>
<script>
(function(){
"use strict";
var DWELL_MS=24000,KEY="prometeo.tvBrief.played.v1";
var q=function(id){return document.getElementById(id)},screen=q("screen"),state=q("state"),stateText=q("stateText"),source=q("source"),kind=q("kind"),title=q("title"),body=q("body"),time=q("time"),idline=q("idline"),counter=q("counter"),progress=q("progress"),pause=q("pause"),mark=q("mark");
var messages=[],index=0,paused=false,started=Date.now(),timer=null,ticker=null;
function parse(s,f){try{return JSON.parse(s)}catch(e){return f}}
function seen(){try{return parse(localStorage.getItem(KEY)||"{}",{})||{}}catch(e){return {}}}
function save(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
function hash(v){var s=String(v),h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return "b"+(h>>>0).toString(16)}
function clean(x,i){if(!x||typeof x!=="object")return null;var t=String(x.title||"").trim(),b=String(x.text||x.summary||"").trim();if(!t&&!b)return null;return{id:hash(x.id||t||("brief-"+i)),title:t||"Mensaje",text:b,at:x.at||x.timestamp||new Date().toISOString(),source:String(x.source||"PROMETEO").slice(0,60),kind:String(x.kind||"MENSAJE").slice(0,60)}}
function input(){
 var p=new URLSearchParams(location.search),raw=p.get("messages");
 if(raw){var a=parse(raw,null);if(Array.isArray(a))return a.map(clean).filter(Boolean).slice(0,12)}
 if(p.has("title")||p.has("text"))return[clean({id:p.get("id")||"",title:p.get("title")||"",text:p.get("text")||"",at:p.get("at")||new Date().toISOString(),source:p.get("source")||"PROMETEO",kind:p.get("kind")||"MENSAJE"},0)].filter(Boolean);
 var now=new Date().toISOString();
 return[
  clean({id:"surface-ready",title:"TV Brief listo.",text:"Mensajes escritos, grandes y quietos. El loop cambia despacio y conserva estado local de lectura sin fingir audio live.",at:now,source:"PROMETEO",kind:"SUPERFICIE"},0),
  clean({id:"state-contract",title:"UNREAD y PLAYED significan exactamente eso.",text:"UNREAD marca un mensaje todavía no completado en esta pantalla. PLAYED aparece después de una pasada visual completa o cuando lo marcás manualmente.",at:now,source:"PROMETEO",kind:"CONTRATO"},1)
 ]}
function fmt(v){var d=new Date(v);if(!Number.isFinite(d.getTime()))return String(v||"SIN FECHA");try{return new Intl.DateTimeFormat("es-AR",{timeZone:"America/Argentina/Buenos_Aires",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit",hour12:false}).format(d).replace(",","")}catch(e){return d.toLocaleString("es-AR")}}
function done(m){return Boolean(seen()[m.id])}
function stateFor(m){var d=done(m);state.className="state "+(d?"played":"unread");stateText.textContent=d?"PLAYED":"UNREAD";mark.textContent=d?"PLAYED":"MARCAR PLAYED";mark.disabled=d}
function markNow(){var m=messages[index];if(!m)return;var s=seen();s[m.id]=new Date().toISOString();save(s);stateFor(m)}
function clear(){if(timer)clearTimeout(timer);if(ticker)clearInterval(ticker);timer=ticker=null}
function schedule(){clear();if(paused||!messages.length)return;ticker=setInterval(function(){progress.style.width=Math.min(100,(Date.now()-started)/DWELL_MS*100).toFixed(1)+"%"},1000);timer=setTimeout(function(){markNow();if(messages.length>1)next();else{started=Date.now();schedule()}},DWELL_MS)}
function render(){var m=messages[index];source.textContent=m.source;kind.textContent=m.kind;title.textContent=m.title;body.textContent=m.text;time.textContent=fmt(m.at);idline.textContent="ID "+m.id+" · VISUAL ONLY";counter.textContent=String(index+1).padStart(2,"0")+" / "+String(messages.length).padStart(2,"0");stateFor(m);started=Date.now();progress.style.width="0%";screen.classList.remove("swap");schedule()}
function next(){clear();screen.classList.add("swap");setTimeout(function(){index=(index+1)%messages.length;render()},280)}
pause.onclick=function(){paused=!paused;pause.textContent=paused?"REANUDAR LOOP":"PAUSAR LOOP";if(paused)clear();else{started=Date.now();schedule()}};
mark.onclick=markNow;document.addEventListener("visibilitychange",function(){if(document.hidden)clear();else if(!paused){started=Date.now();schedule()}});
window.addEventListener("keydown",function(e){if(e.key===" "){e.preventDefault();pause.click()}if(e.key==="ArrowRight"&&messages.length>1)next()});
messages=input();render();
})();
</script>
</body>
</html>
