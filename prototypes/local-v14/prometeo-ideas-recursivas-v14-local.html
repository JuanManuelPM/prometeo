const $=id=>document.getElementById(id);
const deep=o=>JSON.parse(JSON.stringify(o));
const makeId=(kind)=>kind+'-'+(globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2));
const timeISO=()=>new Date().toISOString();
const humanTime=(raw)=>{const d=new Date(raw);return Number.isNaN(d.getTime())?'—':new Intl.DateTimeFormat('es-AR',{day:'2-digit',month:'short',timeZone:'America/Argentina/Buenos_Aires'}).format(d).replace('.','')};
const defaultState=()=>({version:13,desktops:[{id:'principal',name:'Principal',widgets:['ideas']},{id:'herramientas',name:'Herramientas',widgets:['timer','notes']}],visibleCount:2,focusDesk:'principal',ideas:deep(SEED),selectedId:'unix',catalogOpen:true,currentView:'chat',pageId:'home',drafts:{},scratch:'',labWidgets:{},timerSeconds:1500,timerRunning:false});
function normalize(raw){const state=(raw?.version===13||raw?.version===14)?raw:defaultState();
 if(!Array.isArray(state.desktops)||!state.desktops.length||!Array.isArray(state.ideas)||!state.ideas.length)return defaultState();
 state.desktops=state.desktops.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string'&&Array.isArray(x.widgets)).slice(0,12);
 if(!state.desktops.length)return defaultState();
 state.ideas=state.ideas.filter(x=>x&&typeof x.id==='string'&&typeof x.title==='string'&&Array.isArray(x.messages)&&Array.isArray(x.pages)).slice(0,50);
 if(!state.ideas.length)state.ideas=deep(SEED);
 if(!state.ideas.some(x=>x.id===state.selectedId))state.selectedId=state.ideas[0].id;
 if(!state.desktops.some(x=>x.id===state.focusDesk))state.focusDesk=state.desktops[0].id;
 state.visibleCount=Math.min(Math.max(1,Number(state.visibleCount)||1),state.desktops.length,4);
 if(!['chat','lab','page'].includes(state.currentView))state.currentView='chat';
 state.drafts=state.drafts&&typeof state.drafts==='object'?state.drafts:{};
 if(typeof state.scratch!=='string')state.scratch='';
 state.labWidgets=state.labWidgets&&typeof state.labWidgets==='object'?state.labWidgets:{};
 state.version=14;
 state.layouts=state.layouts&&typeof state.layouts==='object'?state.layouts:{};
 return state;
}
let loaded;try{loaded=JSON.parse(localStorage.getItem(STORAGE)||localStorage.getItem(PREVIOUS_STORAGE)||'null')}catch{}
let state=normalize(loaded);
let timerId=null,drag=null;
const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){console.warn('Guardado local no disponible',e)}};
const el=(tag,classes,text)=>{const n=document.createElement(tag);if(classes)n.className=classes;if(text!==undefined)n.textContent=text;return n};
const button=(classes,text,title)=>{const b=el('button',classes,text);b.type='button';if(title)b.title=title;return b};
const currentIdea=()=>state.ideas.find(x=>x.id===state.selectedId)||state.ideas[0];
const touch=(idea)=>{idea.updated=timeISO();save()};

 if(node.type==='leaf')return typeof node.id==='string'&&['ideas','chat','lab','page'].includes(node.view);
 if(node.type!=='split'||!['row','column'].includes(node.axis)||typeof node.id!=='string')return false;
 return Number.isFinite(node.ratio)&&node.ratio>=.18&&node.ratio<=.82&&validateLayout(node.first,depth+1)&&validateLayout(node.second,depth+1);

}
function walkLeaves(node,list=[]){if(node.type==='leaf')list.push(node);else{walkLeaves(node.first,list);walkLeaves(node.second,list)}return list}
