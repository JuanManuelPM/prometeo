<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Prometeo</title>
<style>
:root{--bg:#000;--fg:#f3efe6;--muted:#7b766d;--line:#23211d;--soft:#151411;--accent:#ff6a00}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}
button{font:inherit}
main{height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:1000;letter-spacing:-.055em;font-size:21px}.mark{width:5px;height:24px;background:var(--accent)}
.micro{font:850 8.5px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.status{display:flex;align-items:center;gap:10px;min-width:0}
.engine{white-space:nowrap}.engine.ok{color:#b8b1a5}.engine.bad{color:var(--accent)}
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:end}
.mode{font:900 8.5px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.pct{font-size:clamp(52px,15vw,104px);font-weight:1000;letter-spacing:-.085em;line-height:.78}
.pct em{font-style:normal;color:var(--accent)}
.eta{text-align:right}.eta strong{font-size:clamp(22px,6vw,42px);letter-spacing:-.055em}.eta div{margin-top:4px}
.track{grid-column:1/-1;height:8px;background:var(--line);overflow:hidden;margin-top:6px}.fill{height:100%;background:var(--accent);width:0;transition:width .3s ease}
.meta{grid-column:1/-1;display:flex;gap:12px 18px;flex-wrap:wrap;align-items:center;margin-top:1px}.metric{font-size:12px;font-weight:850;white-space:nowrap}.metric b{font-size:15px;color:var(--fg)}.metric.hot b{color:var(--accent)}
.workspace{min-height:0;display:grid;grid-template-rows:auto auto auto minmax(0,1fr);gap:10px}
.stripHead{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:9px}
.flow{display:grid;gap:5px}
.lane{display:grid;grid-template-columns:54px minmax(0,1fr);gap:8px;align-items:start;min-height:25px}
.laneLabel{font:900 8px/25px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);letter-spacing:.08em}
.dots{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.worker{height:25px;min-width:42px;border:1px solid #38352f;background:#090908;color:var(--fg);padding:0 5px;display:inline-flex;align-items:center;justify-content:center;gap:4px;font:900 8.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer}
.worker::before{content:"";width:5px;height:5px;background:var(--fg);display:block;border-radius:50%}
.worker.check::before,.worker.pub::before{background:var(--accent)}
.worker.fresh{border-color:var(--accent)}
.worker.selected{background:var(--fg);color:#070706}.worker.selected::before{background:var(--accent)}
.empty{height:25px;display:flex;align-items:center;color:#393630;font:800 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace}
.detail{display:none;border-left:3px solid var(--accent);padding:6px 9px;background:#0b0b09;min-height:42px}
.detail.show{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.detailCode{font-weight:1000}.detailText{font-size:11px;font-weight:750;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#bdb6aa}.detailTime{font:850 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.diag{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:12px;min-height:0}
.panel{border-top:1px solid var(--line);padding-top:8px;min-width:0}
.stack{height:8px;display:flex;background:var(--line);overflow:hidden;margin:6px 0}.seg{height:100%}.seg.work{background:var(--fg)}.seg.coord{background:#6e6960}.seg.wait{background:#3b3832}.seg.rec{background:var(--accent)}
.legend{display:flex;gap:8px 12px;flex-wrap:wrap}.legend span{font:850 7.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}.legend b{color:var(--fg);font-size:9px}.legend .r b{color:var(--accent)}
.funnel{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-top:5px}.funnel div{text-align:center;border-top:1px solid #2f2c27;padding-top:5px;font-weight:950;font-size:13px}.funnel small{display:block;font:800 6.5px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);margin-top:3px;letter-spacing:.05em}
.bottom{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.receipts{display:grid;gap:3px;align-content:start;overflow:hidden}.receipt{display:grid;grid-template-columns:37px 40px minmax(0,1fr);gap:5px;font:800 7.5px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap}.receipt .t{color:var(--muted)}.receipt .k{color:var(--fg)}.receipt .d{color:#8f897f;overflow:hidden;text-overflow:ellipsis}.receipt.pub .k{color:var(--accent)}
.sys{display:grid;align-content:start;gap:6px}.sysline{display:flex;align-items:center;justify-content:space-between;gap:8px;font:850 8px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace}.sysline span:first-child{color:var(--muted)}.sysline b{color:var(--fg)}.sysline b.hot{color:var(--accent)}
footer{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.copy{height:50px;border:0;background:var(--fg);color:#080807;padding:0 18px;font-weight:1000;letter-spacing:-.025em;font-size:15px;cursor:pointer}.copy:active{transform:translateY(1px)}
.hint{text-align:right;max-width:180px}
@media(max-width:520px){
 main{padding-left:12px;padding-right:12px;gap:10px}
 .diag,.bottom{grid-template-columns:1fr 1fr;gap:9px}
 .lane{grid-template-columns:48px minmax(0,1fr);gap:5px}
 .worker{min-width:38px;padding:0 4px}
 footer{grid-template-columns:1fr}
 .hint{display:none}
}
@media(max-height:730px){
 .bottom{display:none}
 .workspace{grid-template-rows:auto auto auto 1fr}
}
@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<main>
<header>
  <div class="brand"><span class="mark"></span>PROMETEO</div>
  <div class="status">
    <div class="micro engine" id="engine">ENGINE —</div>
    <div class="micro" id="clock">—</div>
  </div>
</header>

<section class="top">
  <div>
    <div class="mode" id="mode">RONDA ACTUAL</div>
    <div class="pct"><em id="pct">—</em>%</div>
  </div>
  <div class="eta">
    <strong id="eta">—</strong>
    <div class="micro" id="remain">—</div>
  </div>
  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="meta">
    <div class="metric"><b id="working">—</b> WORK</div>
    <div class="metric"><b id="rate">—</b>/15m <span id="trend">→</span></div>
    <div class="metric hot"><b id="cap">—</b> CAP</div>
    <div class="metric"><b id="frontier">—</b> FR</div>
    <div class="metric"><b id="branch">—</b> BR</div>
    <div class="metric"><b id="metaShare">—</b> META</div>
    <div class="metric"><b id="startup">—</b> START</div>
    <div class="metric"><b id="startupLost">—</b> LOST</div>
    <div class="metric"><b id="bottle">—</b></div>
    <div class="metric"><b id="parked">—</b> P</div>
    <div class="metric"><b id="dead">—</b> ☠</div>
  </div>
</section>

<section class="workspace">
  <div class="stripHead">
    <div class="micro">FLUJO REAL</div>
    <div class="micro" id="activeCount">0 activos</div>
  </div>

  <div>
    <div class="flow" id="flow"></div>
    <div class="detail" id="detail">
      <div class="detailCode" id="detailCode">—</div>
      <div class="detailText" id="detailText">—</div>
      <div class="detailTime" id="detailTime">—</div>
    </div>
  </div>

  <div class="diag">
    <div class="panel">
      <div class="micro">TIEMPO</div>
      <div class="stack">
        <div class="seg work" id="segWork"></div>
        <div class="seg coord" id="segCoord"></div>
        <div class="seg wait" id="segWait"></div>
        <div class="seg rec" id="segRec"></div>
      </div>
      <div class="legend">
        <span>WORK <b id="workPct">—</b></span>
        <span>COORD <b id="coordPct">—</b></span>
        <span>WAIT <b id="waitPct">—</b></span>
        <span class="r">REC <b id="recPct">—</b></span>
      </div>
    </div>
    <div class="panel">
      <div class="micro" id="batch">COHORTE —</div>
      <div class="funnel">
        <div id="f0">—<small>BOOT</small></div>
        <div id="f1">—<small>PRE</small></div>
        <div id="f2">—<small>ENTER</small></div>
        <div id="f3">—<small>WORK</small></div>
        <div id="f4">—<small>PUB</small></div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="panel receipts" id="receipts"></div>
    <div class="panel sys">
      <div class="sysline"><span>SENTINEL</span><b id="sentinel">—</b></div>
      <div class="sysline"><span>GLOBAL FINITO</span><b id="global">—</b></div>
      <div class="sysline"><span>SILENT</span><b id="silent">—</b></div>
      <div class="sysline"><span>ENGINE</span><b id="engineFocus">—</b></div>
    </div>
  </div>
</section>

<footer>
  <button class="copy" id="copy">🕹️ COPIAR PROMPT</button>
  <div class="micro hint">mismo prompt · roles automáticos</div>
</footer>
</main>

<script>
(()=>{
 const BASE='https://catnohyouxqjjtseaueb.supabase.co/rest/v1/';
 const KEY='sb_publishable_eqh3PngXs4UjLLWiY3pz1w_nhHtf7X-';
 const HEAD={apikey:KEY,Authorization:'Bearer '+KEY};
 const ENGINE='https://raw.githubusercontent.com/JuanManuelPM/prometeo/main/state/prometeo-engine.json';
 const phases=['BOOTSTRAP','WORK','CHECKPOINT','PUBLISH','NEXT'];
 const labels={BOOTSTRAP:'BOOT',WORK:'WORK',CHECKPOINT:'CHECK',PUBLISH:'PUB',NEXT:'NEXT'};
 const $=id=>document.getElementById(id);
 let prompt='',selected=null,workers=[],engineState=null;

 async function get(path){
   const r=await fetch(BASE+path,{headers:HEAD,cache:'no-store'});
   if(!r.ok)throw new Error(String(r.status));
   return r.json();
 }
 async function rpc(name,args={}){
   const r=await fetch(BASE+'rpc/'+name,{
     method:'POST',
     headers:{...HEAD,'Content-Type':'application/json'},
     body:JSON.stringify(args),
     cache:'no-store'
   });
   if(!r.ok)throw new Error(String(r.status));
   return r.json();
 }
 async function getEngine(){
   try{
     const r=await fetch(ENGINE,{cache:'no-store'});
     if(!r.ok)throw new Error('engine');
     engineState=await r.json();
   }catch(e){engineState=null}
 }
 function clamp(n){return Math.max(0,Math.min(100,Number(n)||0))}
 function fmtEta(sec){
   sec=Math.max(0,Number(sec)||0);
   if(!sec)return '0m';
   if(sec<90)return '~1m';
   if(sec<3600)return '~'+Math.max(2,Math.round(sec/60))+'m';
   const h=Math.floor(sec/3600),m=Math.round((sec%3600)/60);
   return '~'+h+'h'+String(m).padStart(2,'0');
 }
 function age(ts){
   if(!ts)return '—';
   const s=Math.max(0,Math.round((Date.now()-new Date(ts))/1000));
   if(s<60)return s+'s';
   return Math.floor(s/60)+'m'+String(s%60).padStart(2,'0');
 }
 function shortJob(j){
   if(!j)return 'sin job';
   return j.replace(/^AUTO-Q0*/,'Q').replace(/^FOLLOWUP-/,'F·').slice(0,25);
 }
 function trend(t){return t==='UP'?'↗':t==='DOWN'?'↘':'→'}

 function renderSummary(s,g,h){
   const p=clamp(s.progress_pct);
   $('mode').textContent=s.progress_mode==='FRONT'?'FRENTE ACTUAL':'RONDA ACTUAL';
   $('pct').textContent=p.toFixed(p>=99?0:1);
   $('fill').style.width=p+'%';
   $('eta').textContent=fmtEta(s.eta_seconds);
   $('remain').textContent=(s.front_remaining??0)+' pendientes · '+(s.front_done??0)+'/'+(s.front_total??0);
   $('working').textContent=s.working_workers??0;
   $('rate').textContent=s.throughput_15m??0;
   $('trend').textContent=trend(s.throughput_trend);
   $('cap').textContent='+'+(s.capacity_open??0);
   $('frontier').textContent=g?Number(g.frontier_ratio||0).toFixed(1)+'×':'—';
   $('branch').textContent=g?Number(g.productive_branching||0).toFixed(1)+'×':'—';
   $('metaShare').textContent=g?Math.round(Number(g.meta_share||0)*100)+'%':'—';
   const startMs=Number(h?.p90_copy_to_work_ms ?? h?.p90_contact_to_work_ms ?? 0);
   $('startup').textContent=startMs?Math.round(startMs/1000)+'s':'—';
   $('startupLost').textContent=h?Number(h.copied_unlinked_60s||0):'—';
   $('bottle').textContent=(h?.startup_state&&h.startup_state!=='HEALTHY')?h.startup_state:((g?.growth_mode&&g.growth_mode!=='BALANCED')?g.growth_mode:(s.bottleneck_code||'—'));
   $('parked').textContent=s.parked_count??0;
   $('dead').textContent=s.dead_count??0;
   $('silent').textContent=s.silent_workers??0;
   $('batch').textContent='COHORTE '+(s.latest_batch||'—');
   ['f0','f1','f2','f3','f4'].forEach((id,i)=>{
     const vals=[s.funnel_launched,s.funnel_bootstrap,s.funnel_entered,s.funnel_work,s.funnel_published];
     $(id).childNodes[0].nodeValue=(vals[i]??0);
   });
   const vals={work:clamp(s.work_pct),coord:clamp(s.coord_pct),wait:clamp(s.wait_pct),rec:clamp(s.recovery_pct)};
   $('segWork').style.width=vals.work+'%';$('segCoord').style.width=vals.coord+'%';$('segWait').style.width=vals.wait+'%';$('segRec').style.width=vals.rec+'%';
   $('workPct').textContent=vals.work.toFixed(0)+'%';$('coordPct').textContent=vals.coord.toFixed(0)+'%';$('waitPct').textContent=vals.wait.toFixed(0)+'%';$('recPct').textContent=vals.rec.toFixed(0)+'%';
   $('sentinel').textContent=[s.guide_cycle,s.guide_status,s.guide_worker].filter(Boolean).join('·')||'—';
   const gp=s.global_progress_pct;
   $('global').textContent=gp==null?'—':Number(gp).toFixed(0)+'%';
   $('clock').textContent=new Date(s.server_time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
 }
 function renderFlow(){
   $('activeCount').textContent=workers.length+' activos';
   const root=$('flow');root.innerHTML='';
   phases.forEach(ph=>{
     const lane=document.createElement('div');lane.className='lane';
     const lab=document.createElement('div');lab.className='laneLabel';lab.textContent=labels[ph];
     const dots=document.createElement('div');dots.className='dots';
     const list=workers.filter(w=>w.phase===ph);
     if(!list.length){
       const e=document.createElement('div');e.className='empty';e.textContent='·';dots.appendChild(e);
     } else {
       list.forEach(w=>{
         const b=document.createElement('button');b.type='button';
         b.className='worker '+(ph==='CHECKPOINT'?'check ':'')+(ph==='PUBLISH'?'pub ':'');
         if(Date.now()-new Date(w.phase_started_at)<12000)b.classList.add('fresh');
         if(selected===w.session_id)b.classList.add('selected');
         b.textContent=w.display_code;
         b.addEventListener('click',()=>{selected=selected===w.session_id?null:w.session_id;renderFlow();renderDetail()});
         dots.appendChild(b);
       });
     }
     lane.append(lab,dots);root.appendChild(lane);
   });
   renderDetail();
 }
 function renderDetail(){
   const el=$('detail'),w=workers.find(x=>x.session_id===selected);
   if(!w){el.classList.remove('show');return}
   el.classList.add('show');
   $('detailCode').textContent=w.display_code+' · '+labels[w.phase];
   $('detailText').textContent=[shortJob(w.job_key),w.job_title,w.event_state].filter(Boolean).join(' · ');
   $('detailTime').textContent=age(w.phase_started_at);
 }
 function renderReceipts(rows){
   const root=$('receipts');root.innerHTML='<div class="micro">RECIBOS</div>';
   rows.slice(0,5).forEach(r=>{
     const d=document.createElement('div');d.className='receipt '+(r.kind==='PUBLISH'?'pub':'');
     const time=new Date(r.at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
     d.innerHTML='<span class="t">'+time+'</span><span class="k">'+(r.worker_code||'SYS')+'</span><span class="d">'+(r.kind==='PUBLISH'?'✓ ':r.kind==='CHECKPOINT'?'◆ ':'G ') +(r.kind==='CHECKPOINT'?r.detail:shortJob(r.job_key))+'</span>';
     root.appendChild(d);
   });
 }
 function renderEngine(){
   if(!engineState){$('engine').textContent='ENGINE —';$('engine').className='micro engine bad';$('engineFocus').textContent='—';return}
   const t=new Date(engineState.generated_at);
   const stale=Date.now()-t>12*60*1000;
   $('engine').textContent='ENGINE '+(stale?'STALE':'✓');
   $('engine').className='micro engine '+(stale?'bad':'ok');
   $('engineFocus').textContent=engineState.summary?.bottleneck||engineState.engine_actions?.suggested_focus||'OK';
 }
 async function tick(){
   try{
     const [s,w,r,p,g,h]=await Promise.all([
       get('prometeo_control_flow_summary?select=*'),
       get('prometeo_control_live_workers?select=*&order=phase_started_at.desc'),
       get('prometeo_control_recent_receipts?select=*&order=at.desc&limit=8'),
       get('prometeo_control_worker_prompt?select=*'),
       get('prometeo_frontier_metrics?select=*'),
       get('prometeo_startup_health?select=*')
     ]);
     if(s[0])renderSummary(s[0],g[0]||null,h[0]||null);
     workers=w||[];
     if(selected&&!workers.some(x=>x.session_id===selected))selected=null;
     renderFlow();renderReceipts(r||[]);
     prompt=p[0]?.prompt_text||prompt;
   }catch(e){$('clock').textContent='reintentando'}
 }
 $('copy').addEventListener('click',async()=>{
   if(!prompt)return;
   const b=$('copy'),old=b.textContent;
   b.disabled=true;b.textContent='MARCANDO PIN…';
   let copied=false;
   try{
     const issued=await rpc('prometeo_issue_launch_intent',{p_launch_batch:'AUTO',p_source:'CONTROL'});
     const token=issued?.intent_token||null;
     if(!token)throw new Error('launch_intent_missing');
     const baseUrl='https://juanmanuelpm.github.io/prometeo/o/';
     if(!prompt.includes(baseUrl))throw new Error('bootstrap_url_missing');
     const text=prompt.replace(
       baseUrl,
       baseUrl+'?launch_intent_token='+encodeURIComponent(token)
     );
     await navigator.clipboard.writeText(text);
     copied=true;
     try{
       await rpc('prometeo_mark_launch_intent_copied',{p_intent_token:token});
       b.textContent='PIN ✓ · COPIADO';
     }catch(e){
       b.textContent='PIN COPIADO · SIN ACK';
     }
   }catch(e){
     b.textContent=copied?'PIN COPIADO · SIN ACK':'PIN ERROR · REINTENTÁ';
   }finally{
     setTimeout(()=>{b.textContent=old;b.disabled=false},1600);
   }
 });
 getEngine().then(renderEngine);setInterval(()=>getEngine().then(renderEngine),30000);
 tick();setInterval(tick,2000);
})();
</script>
</body>
</html>
