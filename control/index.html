<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080807">
<title>Prometeo Control</title>
<style>
:root{--bg:#080807;--paper:#f1ece2;--ink:#0d0d0b;--muted:#898378;--line:#38352f;--soft:#171613;--accent:#ff6900}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--paper);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,a{font:inherit}button{color:inherit}
#app{height:100dvh;min-height:0;display:grid;grid-template-rows:50px 76px minmax(0,1fr) 43px;overflow:hidden}
.top{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,minmax(62px,.34fr));border-bottom:1px solid var(--line);min-width:0}
.brand{min-width:0;display:flex;align-items:center;gap:8px;padding:6px 9px}
.mark{width:4px;height:26px;background:var(--accent);flex:none}
.brandCopy{min-width:0}.brand h1{font-size:clamp(19px,3vw,29px);line-height:.88;letter-spacing:-.055em;margin:0;font-weight:1000;white-space:nowrap}
.sub{font-size:6.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:950;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi{min-width:0;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;padding:5px 7px}
.kpi b{font-size:clamp(16px,2.3vw,24px);letter-spacing:-.05em;line-height:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:5.7px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:950;margin-top:5px;white-space:nowrap}

.projectRail{border-bottom:1px solid var(--line);padding:6px 7px;min-height:0;display:grid;grid-template-rows:12px minmax(0,1fr);gap:5px}
.railHead{display:flex;align-items:center;justify-content:space-between;min-width:0}
.eyebrow{font-size:7px;font-weight:1000;letter-spacing:.14em;text-transform:uppercase}
.railMeta{font-size:6px;color:var(--muted);font-weight:900;white-space:nowrap}
.projects{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(92px,1fr);gap:4px;min-width:0;overflow:hidden}
.project{min-width:0;border:1px solid #292721;background:#0d0d0b;padding:5px 6px;display:grid;grid-template-rows:auto 3px auto;gap:4px;cursor:pointer;text-align:left}
.project:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.project.selected{border-color:var(--paper)}
.projectTop{display:flex;align-items:center;justify-content:space-between;gap:4px;min-width:0}
.projectName{font-size:7px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.projectPct{font-size:7px;color:var(--accent);font-weight:1000}
.bar{background:#24221e;overflow:hidden}.bar i{height:100%;display:block;background:#d8d1c6}
.projectMeta{font-size:5.4px;color:var(--muted);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}

.workspace{min-height:0;display:grid;grid-template-columns:minmax(0,1.72fr) minmax(150px,.72fr);overflow:hidden}
.stage{min-height:0;min-width:0;border-right:1px solid var(--line);display:grid;grid-template-rows:28px minmax(0,1fr)}
.stageTop{display:flex;align-items:center;justify-content:space-between;padding:4px 7px;border-bottom:1px solid #26241f;gap:7px;min-width:0}
.modeBtns{display:flex;gap:3px}
.mode{height:20px;border:1px solid #36332d;background:transparent;padding:0 8px;font-size:6px;font-weight:1000;letter-spacing:.09em;text-transform:uppercase;cursor:pointer}
.mode.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.capacity{font-size:6px;color:var(--muted);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board{position:relative;min-height:0;overflow:hidden;background:
linear-gradient(90deg,transparent calc(100% - 1px),#151410 calc(100% - 1px)),
linear-gradient(transparent calc(100% - 1px),#151410 calc(100% - 1px));
background-size:26px 26px}
#workerGrid{position:absolute;inset:6px;display:grid;align-content:center;justify-content:center;gap:4px}
.worker{appearance:none;position:relative;border:1px solid #5d5850;background:#0d0d0b;color:#b0aa9f;min-width:0;min-height:0;padding:2px 3px;display:grid;grid-template-columns:5px minmax(0,1fr);grid-template-rows:1fr 1fr;column-gap:3px;align-items:center;text-align:left;cursor:pointer;overflow:hidden}
.worker .sig{grid-row:1/3;width:4px;height:55%;align-self:center;background:#777168}
.worker .wid{font-size:var(--idfs,8px);font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1}
.worker .job{font-size:var(--jobfs,5.5px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#777168;line-height:1}
.worker.working{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.worker.working .sig{background:var(--ink);position:relative;overflow:hidden}.worker.working .sig::after{content:"";position:absolute;left:0;right:0;height:35%;top:-35%;background:var(--accent);animation:run 2.3s linear infinite}
.worker.working .job{color:#575248}
.worker.waiting .sig{background:transparent;border:1px solid #777168}
.worker.stale{border-style:dashed}.worker.stale .sig{background:var(--accent)}
.worker.focus{outline:2px solid var(--accent);outline-offset:1px}
@keyframes run{to{transform:translateY(390%)}}
@media(prefers-reduced-motion:reduce){.worker.working .sig::after{animation:none;top:32%}}

.raceView{position:absolute;inset:0;padding:8px;display:none;grid-template-rows:20px minmax(0,1fr);gap:5px}
.raceView.show{display:grid}.raceLegend{display:flex;gap:7px;overflow:hidden;white-space:nowrap}.raceLegend span{font-size:6px;color:var(--muted);font-weight:950}.raceLegend i{display:inline-block;width:10px;height:2px;background:#d5cfc4;margin-right:3px;vertical-align:middle}.raceLegend span:first-child i{background:var(--accent);height:3px}
#raceSvg{width:100%;height:100%;display:block}

.guide{min-width:0;min-height:0;display:grid;grid-template-rows:31px minmax(0,1fr) auto;overflow:hidden}
.guideHead{display:flex;align-items:center;justify-content:space-between;padding:5px 7px;border-bottom:1px solid #26241f}
.guideTitle{font-size:8px;letter-spacing:.15em;font-weight:1000}.guideOpen{height:21px;border:1px solid var(--paper);background:transparent;padding:0 7px;font-size:5.8px;font-weight:1000;letter-spacing:.07em;text-decoration:none;color:var(--paper);display:grid;place-items:center}
.guideBody{min-height:0;padding:7px;overflow:hidden}
.guideBlock{border-top:1px solid #28261f;padding-top:6px;margin-top:6px}.guideBlock:first-child{border-top:0;padding-top:0;margin-top:0}
.gLabel{font-size:5.6px;color:var(--muted);font-weight:1000;letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px}
.gText{font-size:7px;line-height:1.38;font-weight:780;color:#d0c9bd}
.gBig{font-size:12px;line-height:1.05;letter-spacing:-.03em;font-weight:1000}
.gAlert{color:var(--accent)}
.guideActions{border-top:1px solid var(--line);padding:5px 7px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.gBtn{min-height:28px;border:1px solid #4a463e;background:transparent;color:var(--paper);font-size:5.8px;font-weight:1000;letter-spacing:.07em;text-transform:uppercase;cursor:pointer}
.gBtn.primary{background:var(--paper);color:var(--ink);border-color:var(--paper)}

.timeline{border-top:1px solid var(--line);display:grid;grid-template-columns:62px minmax(0,1fr);align-items:center;padding:0 7px;gap:7px;overflow:hidden}
.timeLabel{font-size:6px;color:var(--muted);font-weight:1000;letter-spacing:.12em;text-transform:uppercase}
.events{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;min-width:0}.evt{font-size:6px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#aaa49a}.evt b{color:var(--paper)}
.empty{display:grid;place-items:center;color:var(--muted);font-size:7px;font-weight:900;text-transform:uppercase}

@media(max-width:650px){
 #app{grid-template-rows:46px 72px minmax(0,1fr) 38px}
 .top{grid-template-columns:minmax(0,1fr) 56px 60px 58px}.brand{padding:5px 6px;gap:5px}.mark{height:22px}.brand h1{font-size:18px}.sub{font-size:5px;margin-top:3px}.kpi{padding:4px}.kpi b{font-size:14px}.kpi span{font-size:4.8px}
 .projectRail{padding:5px 6px;gap:4px;grid-template-rows:10px minmax(0,1fr)}.eyebrow{font-size:6px}.railMeta{font-size:5px}.projects{grid-auto-columns:minmax(82px,1fr);gap:3px}.project{padding:4px 5px;gap:3px}.projectName,.projectPct{font-size:6px}.projectMeta{font-size:4.7px}
 .workspace{grid-template-columns:minmax(0,1.64fr) minmax(126px,.76fr)}
 .stage{grid-template-rows:24px minmax(0,1fr)}.stageTop{padding:3px 5px}.mode{height:18px;padding:0 6px;font-size:5px}.capacity{font-size:5px}
 #workerGrid{inset:4px;gap:3px}.worker{padding:1px 2px;column-gap:2px;grid-template-columns:4px minmax(0,1fr)}
 .guide{grid-template-rows:26px minmax(0,1fr) auto}.guideHead{padding:4px 5px}.guideTitle{font-size:7px}.guideOpen{height:18px;font-size:5px;padding:0 5px}.guideBody{padding:5px}.guideBlock{padding-top:4px;margin-top:4px}.gLabel{font-size:4.8px}.gText{font-size:5.9px;line-height:1.28}.gBig{font-size:10px}.guideActions{padding:4px 5px;gap:3px}.gBtn{min-height:24px;font-size:4.8px;padding:0 3px}
 .timeline{grid-template-columns:48px minmax(0,1fr);padding:0 5px;gap:5px}.timeLabel,.evt{font-size:5px}.events{gap:5px}
}
</style>
</head>
<body>
<div id="app">
<header class="top">
 <div class="brand"><span class="mark"></span><div class="brandCopy"><h1>PROMETEO</h1><div class="sub" id="sub">mesa de mando · conectando</div></div></div>
 <div class="kpi"><b id="progress">—</b><span>trabajo</span></div>
 <div class="kpi"><b id="eta">—</b><span>ETA</span></div>
 <div class="kpi"><b id="capacityKpi">—</b><span>trabajando</span></div>
</header>

<section class="projectRail">
 <div class="railHead"><div class="eyebrow">Proyectos vivos</div><div class="railMeta" id="railMeta">—</div></div>
 <div class="projects" id="projects"></div>
</section>

<section class="workspace">
 <section class="stage">
  <div class="stageTop">
   <div class="modeBtns"><button class="mode on" id="modeBoard">MESA</button><button class="mode" id="modeRace">CARRERA</button></div>
   <div class="capacity" id="capacity">—</div>
  </div>
  <div class="board" id="board">
   <div id="workerGrid"></div>
   <div class="raceView" id="raceView"><div class="raceLegend" id="raceLegend"></div><svg id="raceSvg" viewBox="0 0 520 260" preserveAspectRatio="none"></svg></div>
  </div>
 </section>

 <aside class="guide">
  <div class="guideHead"><div class="guideTitle">GUÍA</div><a class="guideOpen" href="/prometeo/guide/" target="_blank">INVOCAR</a></div>
  <div class="guideBody" id="guideBody"></div>
  <div class="guideActions">
   <button class="gBtn primary" id="copyGuide">COPIAR GUÍA</button>
   <button class="gBtn" id="clearFocus">ESTADO</button>
  </div>
 </aside>
</section>

<footer class="timeline">
 <div class="timeLabel">Ahora</div>
 <div class="events" id="events"></div>
</footer>
</div>

<script>
(()=>{
 if(window.__prometeoMesa)return;window.__prometeoMesa=true;
 const BASE='https://catnohyouxqjjtseaueb.supabase.co/rest/v1/';
 const KEY='sb_publishable_eqh3PngXs4UjLLWiY3pz1w_nhHtf7X-';
 const HEAD={apikey:KEY,Authorization:'Bearer '+KEY};
 const $=x=>document.getElementById(x),num=x=>Number(x)||0,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
 const med=a=>{if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y),m=Math.floor(b.length/2);return b.length%2?b[m]:(b[m-1]+b[m])/2};
 const short=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(n>=1e4?0:1)+'k':String(Math.round(n));
 const fmt=m=>!isFinite(m)||m<=0?'—':m<1?'<1m':m<60?Math.round(m)+'m':Math.floor(m/60)+'h'+String(Math.round(m%60)).padStart(2,'0');
 let S={projects:[],workers:[],units:[],outputs:[],activity:[],guide:null,orders:[],focus:null,mode:'board'},busy=false;
 async function get(p){const r=await fetch(BASE+p,{headers:HEAD,cache:'no-store'});if(!r.ok)throw new Error(r.status+' '+p);return r.json()}
 const pk=(t,id)=>t+'|'+id;
 function relevantProjects(){
   return S.projects.filter(p=>{
     const st=String(p.status||'').toUpperCase();
     if(p.project_type==='GLOBAL_POOL')return false;
     if(p.project_type==='POOL')return false;
     return ['RUNNING','OPEN','PLANNING','DRAINING','PAUSED'].includes(st);
   }).sort((a,b)=>{
     const pa=a.project_type==='GLOBAL'?1:0,pb=b.project_type==='GLOBAL'?1:0;
     return pb-pa||new Date(b.created_at)-new Date(a.created_at);
   });
 }
 function projectAlias(p){
   if(p.project_id==='FORGE-BLUEPRINT-84-01')return'B84';
   if(p.project_id==='VISUAL-LAB-01')return'VIS';
   if(p.project_id==='LEGACY-BRIDGE-01')return'BRG';
   const s=(p.title||p.project_id||'P').replace(/[^A-Za-z0-9 ]/g,' ').trim().split(/\s+/).map(x=>x[0]).join('').toUpperCase();
   return(s||'P').slice(0,4);
 }
 function projectForWorker(w,projects){
   if(w.project_type==='GLOBAL_POOL'){
     if(w.current_unit){
       const id=String(w.current_unit).split(' · ')[0].replace(/^→\s*/,'');
       return projects.find(p=>p.project_id===id)||null;
     }
     return null;
   }
   return projects.find(p=>p.project_type===w.project_type&&p.project_id===w.project_id)||null;
 }
 function displayWorker(w){
   const n=String(w.worker_code||'').replace(/\D/g,'').padStart(3,'0');
   if(w.project_type==='GLOBAL_POOL')return'G·K'+n;
   if(w.project_type==='BLUEPRINT')return'B84·K'+n;
   if(w.project_type==='FORGE')return'F·K'+n;
   return'P·K'+n;
 }
 function workerJob(w){
   if(!w.current_unit)return w.status==='WAITING'?'LIBRE':'—';
   let s=String(w.current_unit).replace('VISUAL-LAB-01','VIS').replace('LEGACY-BRIDGE-01','BRG').replace('FORGE-BLUEPRINT-84-01','B84');
   return s.length>20?s.slice(0,19)+'…':s;
 }
 function scoreWorkers(ws){
   const prod=ws.filter(w=>num(w.outputs_done)>0);
   if(!prod.length)return ws.map(w=>({...w,score:0}));
   const mj=Math.max(1,...prod.map(w=>num(w.outputs_done))),mw=Math.max(1,...prod.map(w=>num(w.words_done))),sp=Math.max(1,...prod.map(w=>num(w.words_per_min))),mr=Math.max(1,...prod.map(w=>num(w.rescues_done)));
   return ws.map(w=>({...w,score:45*num(w.outputs_done)/mj+20*num(w.words_done)/mw+30*num(w.words_per_min)/sp+5*num(w.rescues_done)/mr}));
 }
 function calcProgress(projects,units,outputs,workers){
   const keys=new Set(projects.map(p=>pk(p.project_type,p.project_id)));
   const us=units.filter(u=>keys.has(pk(u.project_type,u.project_id))),os=outputs.filter(o=>keys.has(pk(o.project_type,o.project_id)));
   if(!us.length)return{pct:0,eta:0,confidence:'—',capacity:0};
   const valid=os.filter(o=>num(o.elapsed_ms)>0&&num(o.word_count)>0),globalMs=valid.length?med(valid.map(o=>num(o.elapsed_ms)/num(o.word_count))):80,stage={};
   valid.forEach(o=>(stage[o.stage]||(stage[o.stage]=[])).push(num(o.elapsed_ms)/num(o.word_count)));Object.keys(stage).forEach(k=>stage[k]=med(stage[k]));
   let total=0,done=0,rem=0;const now=Date.now();
   us.forEach(u=>{const w=(num(u.min_words)+num(u.max_words))/2||1;total+=w;if(u.status==='DONE'){done+=w;return}let part=0;if(u.status==='LEASED'&&u.lease_started_at){const pred=w*(stage[u.stage]||globalMs);part=pred?clamp((now-new Date(u.lease_started_at))/pred,0,.9):0;done+=w*part}rem+=w*(1-part)});
   const live=workers.filter(w=>w.status==='WORKING'),obs=workers.map(w=>num(w.words_per_min)).filter(v=>v>0),fallback=obs.length?med(obs):globalMs?60000/globalMs:0,cap=live.reduce((s,w)=>s+(num(w.words_per_min)||fallback),0);
   return{pct:total?100*done/total:0,eta:cap?rem/cap:0,confidence:valid.length>=80?'alta':valid.length>=25?'media':'baja',capacity:cap}
 }
 function renderProjects(projects){
   const root=$('projects');root.innerHTML='';if(!projects.length){root.innerHTML='<div class="empty">sin proyectos</div>';return}
   const units=S.units;
   const max=window.innerWidth<=650?4:8;
   projects.slice(0,max).forEach(p=>{
     const us=units.filter(u=>pk(u.project_type,u.project_id)===pk(p.project_type,p.project_id)),total=us.length||num(p.total_units),done=us.length?us.filter(x=>x.status==='DONE').length:num(p.done_units),pct=total?100*done/total:0;
     const b=document.createElement('button');b.type='button';b.className='project'+(S.focus&&S.focus.type==='project'&&S.focus.id===p.project_id?' selected':'');
     b.innerHTML='<div class="projectTop"><span class="projectName">'+projectAlias(p)+' · '+(p.title||p.project_id)+'</span><span class="projectPct">'+pct.toFixed(0)+'%</span></div><div class="bar"><i style="width:'+pct.toFixed(1)+'%"></i></div><div class="projectMeta">'+done+'/'+total+' · '+num(p.active_units)+' work · '+num(p.ready_units)+' ready · '+num(p.blocked_units)+' blocked</div>';
     b.addEventListener('click',()=>{S.focus={type:'project',id:p.project_id,project:p};render()});root.appendChild(b);
   });
   $('railMeta').textContent=projects.length+' activos';
 }
 function fitWorkers(count){
   const b=$('board').getBoundingClientRect(),pad=10;if(!count||!b.width||!b.height)return{cols:1,rows:1,w:60,h:30};
   let best=null;
   for(let c=1;c<=count;c++){const r=Math.ceil(count/c),w=(b.width-pad-(c-1)*4)/c,h=(b.height-pad-(r-1)*4)/r,score=Math.min(h,w/1.8);if(!best||score>best.score)best={cols:c,rows:r,w,h,score}}
   return best;
 }
 function renderWorkers(workers,projects){
   const root=$('workerGrid');root.innerHTML='';if(!workers.length){root.innerHTML='<div class="empty">sin workers</div>';return}
   const sorted=[...workers].sort((a,b)=>{
     const so={WORKING:0,WAITING:1,PAUSED:2,DONE:3};return(so[a.status]??4)-(so[b.status]??4)||displayWorker(a).localeCompare(displayWorker(b));
   });
   const f=fitWorkers(sorted.length);root.style.gridTemplateColumns='repeat('+f.cols+','+Math.max(25,f.w)+'px)';root.style.gridTemplateRows='repeat('+f.rows+','+Math.max(18,f.h)+'px)';
   const idfs=clamp(Math.min(f.h*.26,f.w*.11),5,10),jobfs=clamp(idfs*.7,4.5,7);root.style.setProperty('--idfs',idfs+'px');root.style.setProperty('--jobfs',jobfs+'px');
   sorted.forEach(w=>{
     const b=document.createElement('button'),st=String(w.status||'').toUpperCase();b.type='button';b.className='worker '+(st==='WORKING'?'working':st==='WAITING'?'waiting':'')+(w.last_seen_at&&Date.now()-new Date(w.last_seen_at)>180000&&st==='WORKING'?' stale':'')+(S.focus&&S.focus.type==='worker'&&S.focus.uid===w.project_type+'|'+w.project_id+'|'+w.worker_code?' focus':'');
     b.innerHTML='<i class="sig"></i><span class="wid">'+displayWorker(w)+'</span><span class="job">'+workerJob(w)+'</span>';b.title=displayWorker(w)+' · '+st+' · '+workerJob(w);
     b.addEventListener('click',()=>{S.focus={type:'worker',uid:w.project_type+'|'+w.project_id+'|'+w.worker_code,worker:w};render()});root.appendChild(b);
   });
 }
 function renderRace(workers){
   const svg=$('raceSvg'),leg=$('raceLegend');svg.innerHTML='';leg.innerHTML='';
   const scores=scoreWorkers(workers).sort((a,b)=>b.score-a.score),leaders=scores.filter(w=>num(w.outputs_done)>0).slice(0,5);if(!leaders.length){svg.innerHTML='<text x="20" y="40" fill="#8d877c" font-size="12">Todavía no hay producción comparable.</text>';return}
   leaders.forEach((w,i)=>{const s=document.createElement('span');s.innerHTML='<i style="'+(i>1?'opacity:'+(0.72-i*.08):'')+'"></i>'+displayWorker(w);leg.appendChild(s)});
   const ids=new Map(leaders.map((w,i)=>[w.project_type+'|'+w.project_id+'|'+w.worker_code,{w,i}])),ev=S.activity.filter(e=>/COMPLETED$/.test(e.event_type||'')&&ids.has(e.project_type+'|'+e.project_id+'|'+e.worker_code)).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));if(!ev.length)return;
   const W=520,H=260,pad=13,t0=+new Date(ev[0].created_at),t1=Math.max(t0+1,+new Date(ev[ev.length-1].created_at)),cnt=new Map(leaders.map(w=>[w.project_type+'|'+w.project_id+'|'+w.worker_code,0])),pts=new Map(leaders.map(w=>[w.project_type+'|'+w.project_id+'|'+w.worker_code,[[pad,0]]]));let max=1;
   ev.forEach(e=>{const id=e.project_type+'|'+e.project_id+'|'+e.worker_code,c=(cnt.get(id)||0)+1;cnt.set(id,c);max=Math.max(max,c);pts.get(id).push([pad+(W-2*pad)*(+new Date(e.created_at)-t0)/(t1-t0),c])});
   const ns='http://www.w3.org/2000/svg',axis=document.createElementNS(ns,'line');axis.setAttribute('x1',pad);axis.setAttribute('x2',W-pad);axis.setAttribute('y1',H-pad);axis.setAttribute('y2',H-pad);axis.setAttribute('stroke','#3b3832');svg.appendChild(axis);
   leaders.forEach((w,i)=>{const id=w.project_type+'|'+w.project_id+'|'+w.worker_code,p=pts.get(id).map(([x,c])=>[x,H-pad-(H-2*pad)*c/max]),path=document.createElementNS(ns,'path');path.setAttribute('d',p.map((q,j)=>(j?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' '));path.setAttribute('fill','none');path.setAttribute('stroke',i===0?'#ff6900':'#ded7cc');path.setAttribute('stroke-opacity',String(i===0?1:.78-i*.11));path.setAttribute('stroke-width',i===0?'3':'2');if(i>1)path.setAttribute('stroke-dasharray',i===2?'6 4':'2 4');svg.appendChild(path)})
 }
 function guideDefault(projects,workers){
   const global=workers.filter(w=>w.project_type==='GLOBAL_POOL'),legacy=workers.filter(w=>w.project_type!=='GLOBAL_POOL'),working=workers.filter(w=>w.status==='WORKING').length,free=global.filter(w=>w.status==='WAITING').length;
   const high=projects[0],blocked=projects.reduce((s,p)=>s+num(p.blocked_units),0),next=(S.guide?.next_actions||[])[0]||'Sin siguiente acción registrada.';
   return '<div class="guideBlock"><div class="gLabel">Ahora</div><div class="gBig">'+working+' trabajando · '+free+' libres</div><div class="gText">'+global.length+' globales · '+legacy.length+' legacy visibles</div></div>'+
   '<div class="guideBlock"><div class="gLabel">Foco</div><div class="gText">'+(high?projectAlias(high)+' · '+high.title:'Sin proyecto activo')+'</div></div>'+
   '<div class="guideBlock"><div class="gLabel">Veo</div><div class="gText '+(blocked?'gAlert':'')+'">'+blocked+' jobs bloqueados entre proyectos visibles. '+(legacy.length?'Todavía hay workers legacy fuera del control global.':'Todos los visibles son globales.')+'</div></div>'+
   '<div class="guideBlock"><div class="gLabel">Siguiente</div><div class="gText">'+next+'</div></div>';
 }
 function guideWorker(w,projects){
   const p=projectForWorker(w,projects),age=w.last_seen_at?Math.max(0,Math.round((Date.now()-new Date(w.last_seen_at))/1000))+'s':'—';
   return '<div class="guideBlock"><div class="gLabel">Worker</div><div class="gBig">'+displayWorker(w)+'</div><div class="gText">'+w.status+' · '+(p?projectAlias(p)+' '+p.title:'sin proyecto')+'</div></div>'+
   '<div class="guideBlock"><div class="gLabel">Trabajo</div><div class="gText">'+workerJob(w)+'</div></div>'+
   '<div class="guideBlock"><div class="gLabel">Historial</div><div class="gText">'+num(w.outputs_done)+' outputs · '+short(num(w.words_done))+' palabras · '+num(w.words_per_min).toFixed(0)+' p/min · '+num(w.rescues_done)+' rescates</div></div>'+
   '<div class="guideBlock"><div class="gLabel">Última señal</div><div class="gText">hace '+age+'</div></div>';
 }
 function guideProject(p){
   const us=S.units.filter(u=>pk(u.project_type,u.project_id)===pk(p.project_type,p.project_id)),total=us.length||num(p.total_units),done=us.filter(u=>u.status==='DONE').length,working=us.filter(u=>u.status==='LEASED').length,ready=us.filter(u=>u.status==='READY').length,blocked=us.filter(u=>u.status==='BLOCKED').length,pct=total?100*done/total:0;
   return '<div class="guideBlock"><div class="gLabel">Proyecto</div><div class="gBig">'+projectAlias(p)+' · '+p.title+'</div><div class="gText">'+p.status+' · '+pct.toFixed(0)+'% por unidades</div></div>'+
   '<div class="guideBlock"><div class="gLabel">Cola</div><div class="gText">'+working+' trabajando · '+ready+' ready · '+blocked+' blocked · '+done+' done</div></div>'+
   '<div class="guideBlock"><div class="gLabel">Lectura</div><div class="gText">'+(blocked>ready?'Las dependencias dominan el trabajo restante.':ready?'Hay trabajo inmediatamente asignable.':'No hay trabajo READY ahora.')+'</div></div>';
 }
 function renderGuide(projects,workers){
   let html;if(S.focus?.type==='worker')html=guideWorker(S.focus.worker,projects);else if(S.focus?.type==='project')html=guideProject(S.focus.project);else html=guideDefault(projects,workers);$('guideBody').innerHTML=html;
 }
 function renderEvents(){
   const root=$('events');root.innerHTML='';const ev=S.activity.slice(0,3);if(!ev.length){root.innerHTML='<span class="evt">sin eventos recientes</span>';return}
   ev.forEach(e=>{const d=document.createElement('div');d.className='evt';const code=e.worker_code?((e.project_type==='GLOBAL_POOL'?'G·':'')+e.worker_code):'SYS';d.innerHTML='<b>'+code+'</b> · '+e.event_type+(e.unit?' · '+String(e.unit).replace('VISUAL-LAB-01','VIS').replace('LEGACY-BRIDGE-01','BRG'):'');root.appendChild(d)})
 }
 function render(){
   const projects=relevantProjects(),pkeys=new Set(projects.map(p=>pk(p.project_type,p.project_id)));
   const workers=S.workers.filter(w=>w.status!=='NO_WORK'&&((w.project_type==='GLOBAL_POOL'&&w.status!=='STOPPED')||pkeys.has(pk(w.project_type,w.project_id))));
   const pr=calcProgress(projects,S.units,S.outputs,workers),working=workers.filter(w=>w.status==='WORKING').length,globalFree=workers.filter(w=>w.project_type==='GLOBAL_POOL'&&w.status==='WAITING').length;
   $('progress').textContent=pr.pct.toFixed(pr.pct<10?1:0)+'%';$('eta').textContent=fmt(pr.eta);$('capacityKpi').textContent=working+'/'+workers.length;
   $('sub').textContent=projects.length+' proyectos · '+globalFree+' globales libres · ETA '+pr.confidence;
   $('capacity').textContent=working+' trabajando · '+globalFree+' libres · '+workers.filter(w=>w.project_type!=='GLOBAL_POOL').length+' legacy';
   renderProjects(projects);renderWorkers(workers,projects);renderRace(workers);renderGuide(projects,workers);renderEvents();
   $('workerGrid').style.display=S.mode==='board'?'grid':'none';$('raceView').classList.toggle('show',S.mode==='race');$('modeBoard').classList.toggle('on',S.mode==='board');$('modeRace').classList.toggle('on',S.mode==='race');
 }
 async function tick(){
  if(busy)return;busy=true;
  try{
   const projects=await get('prometeo_control_projects?select=*&order=created_at.desc&limit=60');
   const earliest=projects.filter(p=>['RUNNING','OPEN','PLANNING','DRAINING'].includes(String(p.status).toUpperCase())).map(p=>p.started_at||p.created_at).filter(Boolean).sort()[0],since=encodeURIComponent(earliest||new Date(Date.now()-86400000).toISOString());
   const [workers,units,outputs,activity,guide,orders]=await Promise.all([
    get('prometeo_control_workers?select=*&order=joined_at.asc&limit=800'),
    get('prometeo_control_units?select=*&order=started_at.desc.nullslast&limit=6000'),
    get('prometeo_control_outputs?select=project_type,project_id,worker_code,unit,stage,word_count,elapsed_ms,rescued,published_at&published_at=gte.'+since+'&order=published_at.desc&limit=4500'),
    get('prometeo_control_activity?select=*&created_at=gte.'+since+'&order=created_at.desc&limit=1500'),
    get('prometeo_guide_state?guide_id=eq.MAIN&select=*'),
    get('prometeo_control_orders?select=*&order=created_at.desc&limit=20')
   ]);
   S={...S,projects,workers,units,outputs,activity,guide:guide[0]||null,orders};render();
  }catch(e){$('sub').textContent='reintentando conexión · '+String(e.message||e).slice(0,50)}finally{busy=false}
 }
 $('modeBoard').addEventListener('click',()=>{S.mode='board';render()});$('modeRace').addEventListener('click',()=>{S.mode='race';render()});
 $('clearFocus').addEventListener('click',()=>{S.focus=null;render()});
 $('copyGuide').addEventListener('click',async()=>{const t='GUIDE\nhttps://juanmanuelpm.github.io/prometeo/guide/';try{await navigator.clipboard.writeText(t);$('copyGuide').textContent='COPIADO'}catch(e){window.open('/prometeo/guide/','_blank')}setTimeout(()=>$('copyGuide').textContent='COPIAR GUÍA',1500)});
 window.addEventListener('resize',render);tick();setInterval(tick,2000);
})();
</script>
