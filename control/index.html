<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090908">
<title>Prometeo</title>
<style>
:root{--bg:#090908;--ink:#11110f;--paper:#f1ece2;--muted:#8d887e;--line:#34322d;--soft:#1a1916;--accent:#ff6a00}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--paper);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}
#app{height:100dvh;min-height:0;display:grid;grid-template-rows:54px minmax(0,1fr) 58px;overflow:hidden}
.top{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,minmax(64px,.42fr));border-bottom:1px solid var(--line);min-width:0}
.brand{min-width:0;padding:7px 10px;display:flex;align-items:center;gap:9px}
.brandMark{width:5px;height:27px;background:var(--accent);flex:none}
.brandText{min-width:0}
.brand h1{margin:0;font-size:clamp(19px,3.1vw,30px);line-height:.88;letter-spacing:-.055em;font-weight:1000;white-space:nowrap}
.brandSub{margin-top:4px;color:var(--muted);font-size:7px;font-weight:950;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric{border-left:1px solid var(--line);padding:7px 8px;display:flex;justify-content:center;flex-direction:column;min-width:0}
.metric b{font-size:clamp(17px,2.3vw,27px);letter-spacing:-.05em;line-height:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric span{margin-top:5px;font-size:6.5px;font-weight:950;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
main{min-height:0;display:grid;grid-template-columns:minmax(0,1.48fr) minmax(255px,.9fr);overflow:hidden}
.arenaPanel{min-width:0;min-height:0;padding:7px 8px 5px;display:grid;grid-template-rows:20px minmax(0,1fr) 22px;border-right:1px solid var(--line)}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.title{font-size:8px;font-weight:1000;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.hint{font-size:7px;font-weight:850;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.arena{min-height:0;position:relative;overflow:hidden;border:1px solid #45423b;background:
linear-gradient(45deg,#141310 25%,transparent 25%,transparent 75%,#141310 75%),
linear-gradient(45deg,#141310 25%,#0c0c0a 25%,#0c0c0a 75%,#141310 75%);
background-size:30px 30px;background-position:0 0,15px 15px}
#pieces{position:absolute;inset:7px;display:grid;align-content:center;justify-content:center;align-items:center;justify-items:center;gap:5px}
.piece{appearance:none;width:var(--piece,36px);height:var(--piece,36px);border-radius:50%;border:1.6px solid #aaa59b;background:#11110f;color:#aaa59b;display:grid;place-items:center;position:relative;padding:0;outline:none;transition:.16s ease;cursor:pointer}
.piece:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.piece.working{background:var(--paper);color:var(--ink);border-color:var(--paper);box-shadow:0 0 0 2px var(--accent);animation:pulse .8s ease-in-out infinite alternate}
.piece.waiting{opacity:.7}
.piece.stale{border-style:dashed;opacity:.45}
.piece.done{opacity:.25}
.piece.leader::after{content:"1";position:absolute;right:-4px;top:-5px;width:13px;height:13px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#080808;font-size:7px;font-weight:1000}
.pieceCode{font-size:clamp(7px,1vw,10px);font-weight:1000;letter-spacing:-.035em}
.pieceTask{position:absolute;bottom:2px;max-width:80%;font-size:5.5px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.72}
.arenaFoot{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:8px;min-width:0}
.selection{font-size:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c8c2b6}
.selection b{color:var(--accent)}
.legend{display:flex;gap:7px;color:var(--muted);font-size:6px;font-weight:950;text-transform:uppercase;white-space:nowrap}
.legend i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px;border:1px solid #aaa59b}
.legend .work{background:var(--paper);border-color:var(--accent)}
.side{min-height:0;display:grid;grid-template-rows:minmax(0,1.08fr) minmax(0,.92fr)}
.score{min-height:0;padding:7px 8px 5px;border-bottom:1px solid var(--line);display:grid;grid-template-rows:20px minmax(0,1fr)}
.scoreRows{min-height:0;display:grid;align-content:stretch}
.scoreRow{min-height:0;display:grid;grid-template-columns:16px 48px minmax(0,1fr) 54px;align-items:center;gap:5px;border-bottom:1px solid #24231f;padding:2px 0}
.scoreRow:last-child{border-bottom:0}
.rank{font-size:7px;color:var(--muted);font-weight:1000}
.who{font-size:8px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.race{height:4px;background:#282621;overflow:hidden}
.race i{display:block;height:100%;background:#c9c3b8}
.scoreRow:first-child .race i{background:var(--accent)}
.scoreVal{text-align:right;font-size:7px;font-weight:900;color:#bbb5aa;white-space:nowrap}
.chart{min-height:0;padding:6px 8px 5px;display:grid;grid-template-rows:20px 17px minmax(0,1fr)}
.legendRace{display:flex;gap:8px;align-items:center;min-width:0;overflow:hidden}
.legendRace span{font-size:6px;font-weight:950;color:#aaa49a;white-space:nowrap}
.legendRace i{display:inline-block;width:10px;height:2px;margin-right:3px;vertical-align:middle;background:#d6d0c5}
.legendRace span:first-child i{background:var(--accent);height:3px}
#raceChart{width:100%;height:100%;display:block;min-height:0}
.bottom{min-height:0;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) 170px;overflow:hidden}
.projects{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(130px,1fr);gap:1px;background:var(--line);min-width:0;overflow:hidden}
.project{background:var(--bg);padding:5px 7px;min-width:0;display:grid;grid-template-rows:auto 4px auto;gap:4px}
.projectTop{display:flex;justify-content:space-between;gap:6px;align-items:center;min-width:0}
.projectName{font-size:7px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.projectPct{font-size:8px;color:var(--accent);font-weight:1000}
.prog{background:#24231f;overflow:hidden}.prog i{display:block;height:100%;background:#d4cec3}
.projectMeta{font-size:5.5px;color:var(--muted);font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.activity{padding:5px 7px;border-left:1px solid var(--line);min-width:0}
.activityTitle{font-size:6px;letter-spacing:.12em;text-transform:uppercase;font-weight:1000;color:var(--muted)}
.activityLine{margin-top:5px;font-size:7px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.activityLine b{color:var(--accent)}
.empty{display:grid;place-items:center;font-size:8px;color:var(--muted);font-weight:900;text-transform:uppercase}
@keyframes pulse{from{box-shadow:0 0 0 1px rgba(255,106,0,.7)}to{box-shadow:0 0 0 4px rgba(255,106,0,.13)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@media(max-width:650px){
 #app{grid-template-rows:48px minmax(0,1fr) 50px}
 .top{grid-template-columns:minmax(0,1fr) 62px 66px 64px}
 .brand{padding:6px 7px;gap:6px}.brandMark{height:23px;width:4px}.brand h1{font-size:20px}.brandSub{font-size:5.5px;margin-top:3px}
 .metric{padding:5px}.metric b{font-size:16px}.metric span{font-size:5.5px;margin-top:4px}
 main{grid-template-columns:1fr;grid-template-rows:minmax(0,1.14fr) minmax(0,.86fr)}
 .arenaPanel{border-right:0;border-bottom:1px solid var(--line);padding:4px 6px 3px;grid-template-rows:17px minmax(0,1fr) 17px}
 .title{font-size:7px}.hint{font-size:5.5px}
 #pieces{inset:5px;gap:4px}
 .arenaFoot{gap:4px}.selection{font-size:5.8px}.legend{font-size:5px;gap:5px}
 .side{grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);grid-template-rows:1fr}
 .score{border-bottom:0;border-right:1px solid var(--line);padding:4px 5px 3px;grid-template-rows:16px minmax(0,1fr)}
 .scoreRow{grid-template-columns:12px 37px minmax(0,1fr) 35px;gap:3px;padding:1px 0}.rank,.scoreVal{font-size:5.5px}.who{font-size:6px}.race{height:3px}
 .chart{padding:4px 5px 3px;grid-template-rows:16px 13px minmax(0,1fr)}.legendRace{gap:5px}.legendRace span{font-size:5px}
 .bottom{grid-template-columns:minmax(0,1fr) 106px}.projects{grid-auto-columns:minmax(96px,1fr)}
 .project{padding:4px 5px;gap:3px}.projectName{font-size:6px}.projectPct{font-size:6.5px}.projectMeta{font-size:4.8px}
 .activity{padding:4px 5px}.activityTitle{font-size:5px}.activityLine{font-size:5.5px;margin-top:4px}
}
</style>
</head>
<body>
<div id="app">
<header class="top">
 <div class="brand"><i class="brandMark"></i><div class="brandText"><h1>PROMETEO</h1><div class="brandSub" id="subtitle">control vivo · conectando…</div></div></div>
 <div class="metric"><b id="progress">—</b><span>trabajo</span></div>
 <div class="metric"><b id="eta">—</b><span>ETA</span></div>
 <div class="metric"><b id="workerCount">—</b><span>activos</span></div>
</header>
<main>
 <section class="arenaPanel">
  <div class="head"><div class="title">Workers</div><div class="hint" id="arenaHint">capacidad global</div></div>
  <div class="arena" id="arena"><div id="pieces"></div></div>
  <div class="arenaFoot"><div class="selection" id="selection">Tocá una pieza.</div><div class="legend"><span><i class="work"></i>trabaja</span><span><i></i>espera</span></div></div>
 </section>
 <aside class="side">
  <section class="score">
   <div class="head"><div class="title">Rendimiento</div><div class="hint">no mide calidad</div></div>
   <div class="scoreRows" id="scoreRows"></div>
  </section>
  <section class="chart">
   <div class="head"><div class="title">Carrera</div><div class="hint">outputs</div></div>
   <div class="legendRace" id="raceLegend"></div>
   <svg id="raceChart" viewBox="0 0 420 150" preserveAspectRatio="none" aria-label="Outputs acumulados"></svg>
  </section>
 </aside>
</main>
<footer class="bottom">
 <div class="projects" id="projects"></div>
 <div class="activity"><div class="activityTitle">Último evento</div><div class="activityLine" id="activityLine">—</div></div>
</footer>
</div>
<script>
(()=>{
 if(window.__pc2)return;window.__pc2=true;
 const BASE='https://catnohyouxqjjtseaueb.supabase.co/rest/v1/';
 const KEY='sb_publishable_eqh3PngXs4UjLLWiY3pz1w_nhHtf7X-';
 const HEAD={apikey:KEY,Authorization:'Bearer '+KEY};
 const $=id=>document.getElementById(id),num=x=>Number(x)||0,key=(t,id)=>t+'|'+id;
 const med=a=>{if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y),m=Math.floor(b.length/2);return b.length%2?b[m]:(b[m-1]+b[m])/2};
 const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
 const short=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(n>=1e4?0:1)+'k':String(Math.round(n));
 const fmt=m=>!isFinite(m)||m<=0?'—':m<1?'<1m':m<60?Math.round(m)+'m':Math.floor(m/60)+'h'+String(Math.round(m%60)).padStart(2,'0');
 let state={projects:[],workers:[],units:[],outputs:[],activity:[],selected:null},busy=false;
 async function get(p){const r=await fetch(BASE+p,{headers:HEAD,cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json()}
 const running=p=>['RUNNING','PLANNING'].includes(String(p.status||'').toUpperCase());
 function aliasProjects(projects){
   const map=new Map(),used={};
   projects.forEach(p=>{
     let base=p.project_type==='BLUEPRINT'?'B':p.project_type==='GLOBAL'?'V':p.project_type==='FORGE'?'F':'P';
     if(p.project_id.includes('VISUAL'))base='V';
     const n=(used[base]=(used[base]||0)+1);
     map.set(key(p.project_type,p.project_id),base+(n>1?n:''));
   });
   return map;
 }
 function displayWorker(w){
   const n=String(w.worker_code||'').replace(/\D/g,'').padStart(3,'0');
   if(w.project_type==='GLOBAL_POOL')return 'K'+n;
   if(w.project_type==='BLUEPRINT')return 'B'+n;
   if(w.project_type==='FORGE')return 'F'+n;
   return 'P'+n;
 }
 function scores(ws){
   const mj=Math.max(1,...ws.map(w=>num(w.outputs_done))),mw=Math.max(1,...ws.map(w=>num(w.words_done))),ms=Math.max(1,...ws.map(w=>num(w.words_per_min))),mr=Math.max(1,...ws.map(w=>num(w.rescues_done)));
   return ws.map(w=>({...w,score:45*num(w.outputs_done)/mj+25*num(w.words_done)/mw+25*num(w.words_per_min)/ms+5*num(w.rescues_done)/mr})).sort((a,b)=>b.score-a.score||num(b.outputs_done)-num(a.outputs_done));
 }
 function progress(units,outs,ws){
   if(!units.length)return{pct:0,eta:0,cap:0,conf:'—'};
   const valid=outs.filter(o=>num(o.elapsed_ms)>0&&num(o.word_count)>0);
   const msWord=valid.length?med(valid.map(o=>num(o.elapsed_ms)/num(o.word_count))):60;
   const by={};valid.forEach(o=>(by[o.stage]||(by[o.stage]=[])).push(num(o.elapsed_ms)/num(o.word_count)));
   const sm={};Object.keys(by).forEach(k=>sm[k]=med(by[k]));
   let total=0,done=0,rem=0;const now=Date.now();
   units.forEach(u=>{const wt=(num(u.min_words)+num(u.max_words))/2||1;total+=wt;if(u.status==='DONE'){done+=wt;return}let part=0;if(u.status==='LEASED'&&u.lease_started_at){const pred=wt*(sm[u.stage]||msWord);part=pred?clamp((now-new Date(u.lease_started_at))/pred,0,.9):0;done+=wt*part}rem+=wt*(1-part)});
   const live=ws.filter(w=>w.status==='WORKING'),obs=ws.map(w=>num(w.words_per_min)).filter(Boolean),fallback=obs.length?med(obs):msWord?60000/msWord:0,cap=live.reduce((s,w)=>s+(num(w.words_per_min)||fallback),0);
   return{pct:total?100*done/total:0,eta:cap?rem/cap:0,cap,conf:valid.length>=80?'alta':valid.length>=25?'media':'baja'};
 }
 function fit(count){
   const b=$('arena').getBoundingClientRect(),pad=12;if(!count||!b.width||!b.height)return{cols:1,size:30};let best={cols:1,size:12};
   for(let c=1;c<=count;c++){const r=Math.ceil(count/c),s=Math.min((b.width-pad-(c-1)*5)/c,(b.height-pad-(r-1)*5)/r,50);if(s>best.size)best={cols:c,size:s}}
   best.size=clamp(best.size,15,50);return best;
 }
 function workerTask(w){if(!w.current_unit)return'';const s=String(w.current_unit);if(w.project_type==='GLOBAL_POOL'){const a=s.split(' · ');return (a[0]||'').replace('VISUAL-LAB-01','VIS')}return s.replace(/.* · /,'')}
 function renderPieces(ws,ss){
   const root=$('pieces');root.innerHTML='';if(!ws.length){root.innerHTML='<div class="empty">sin workers</div>';return}
   const rank=new Map(ss.map((w,i)=>[w.project_type+'|'+w.project_id+'|'+w.worker_code,i+1])),f=fit(ws.length);
   root.style.gridTemplateColumns='repeat('+f.cols+','+f.size+'px)';root.style.setProperty('--piece',f.size+'px');
   ws.forEach(w=>{const b=document.createElement('button'),st=String(w.status||'').toUpperCase(),r=rank.get(w.project_type+'|'+w.project_id+'|'+w.worker_code);b.type='button';b.className='piece '+(st==='WORKING'?'working':st==='WAITING'?'waiting':st==='DONE'?'done':'')+(w.last_seen_at&&Date.now()-new Date(w.last_seen_at)>180000&&st==='WORKING'?' stale':'')+(r===1?' leader':'');b.innerHTML='<span class="pieceCode">'+displayWorker(w)+'</span><span class="pieceTask">'+workerTask(w)+'</span>';b.title=displayWorker(w)+' · '+st+' · '+(w.current_unit||'sin tarea');b.addEventListener('click',()=>{state.selected=w;renderSelection(w,ss)});root.appendChild(b)});
 }
 function renderSelection(w,ss){
   if(!w){$('selection').textContent='Tocá una pieza.';return}
   const r=ss.findIndex(x=>x.project_type===w.project_type&&x.project_id===w.project_id&&x.worker_code===w.worker_code)+1;
   $('selection').innerHTML='<b>#'+r+' '+displayWorker(w)+'</b> · '+w.status+' · '+(w.current_unit||'sin tarea')+' · '+num(w.outputs_done)+' jobs · '+short(num(w.words_done))+'p · '+num(w.words_per_min).toFixed(0)+' p/min';
 }
 function renderScore(ss){
   const root=$('scoreRows');root.innerHTML='';const n=window.innerWidth<=650?6:8,top=ss.slice(0,n);if(!top.length){root.innerHTML='<div class="empty">sin producción</div>';return}
   const best=Math.max(1,...top.map(w=>w.score));
   top.forEach((w,i)=>{const d=document.createElement('div');d.className='scoreRow';d.innerHTML='<div class="rank">'+(i+1)+'</div><div class="who">'+displayWorker(w)+'</div><div class="race"><i style="width:'+(100*w.score/best).toFixed(1)+'%"></i></div><div class="scoreVal">'+num(w.outputs_done)+'j · '+short(num(w.words_done))+'</div>';root.appendChild(d)})
 }
 function renderRace(events,ss){
   const svg=$('raceChart'),leg=$('raceLegend'),W=420,H=150,pad=10;svg.innerHTML='';leg.innerHTML='';
   const leaders=ss.filter(w=>num(w.outputs_done)>0).slice(0,4);if(!leaders.length)return;
   leaders.forEach((w,i)=>{const s=document.createElement('span');s.innerHTML='<i style="'+(i>1?'opacity:'+(0.65-i*.08):'')+'"></i>'+displayWorker(w);leg.appendChild(s)});
   const ids=new Map(leaders.map((w,i)=>[w.project_type+'|'+w.project_id+'|'+w.worker_code,{w,i}])),ev=events.filter(e=>/COMPLETED$/.test(e.event_type||'')&&ids.has(e.project_type+'|'+e.project_id+'|'+e.worker_code)).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));if(!ev.length)return;
   const t0=+new Date(ev[0].created_at),t1=Math.max(t0+1,+new Date(ev[ev.length-1].created_at)),cnt=new Map(leaders.map(w=>[w.project_type+'|'+w.project_id+'|'+w.worker_code,0])),pts=new Map(leaders.map(w=>[w.project_type+'|'+w.project_id+'|'+w.worker_code,[[pad,0]]]));let max=1;
   ev.forEach(e=>{const id=e.project_type+'|'+e.project_id+'|'+e.worker_code,c=(cnt.get(id)||0)+1;cnt.set(id,c);max=Math.max(max,c);pts.get(id).push([pad+(W-2*pad)*(+new Date(e.created_at)-t0)/(t1-t0),c])});
   const ns='http://www.w3.org/2000/svg',base=document.createElementNS(ns,'line');base.setAttribute('x1',pad);base.setAttribute('x2',W-pad);base.setAttribute('y1',H-pad);base.setAttribute('y2',H-pad);base.setAttribute('stroke','#3c3933');svg.appendChild(base);
   leaders.forEach((w,i)=>{const id=w.project_type+'|'+w.project_id+'|'+w.worker_code,p=pts.get(id).map(([x,c])=>[x,H-pad-(H-2*pad)*c/max]),path=document.createElementNS(ns,'path');path.setAttribute('d',p.map((q,j)=>(j?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' '));path.setAttribute('fill','none');path.setAttribute('stroke',i===0?'#ff6a00':'#ddd6cb');path.setAttribute('stroke-opacity',String(i===0?1:.78-i*.12));path.setAttribute('stroke-width',i===0?'3':'2');if(i>1)path.setAttribute('stroke-dasharray',i===2?'5 4':'2 4');svg.appendChild(path);const last=p[p.length-1],dot=document.createElementNS(ns,'circle');dot.setAttribute('cx',last[0]);dot.setAttribute('cy',last[1]);dot.setAttribute('r',i===0?'3':'2');dot.setAttribute('fill',i===0?'#ff6a00':'#ddd6cb');svg.appendChild(dot)})
 }
 function renderProjects(ps,us,aliases){
   const root=$('projects');root.innerHTML='';if(!ps.length){root.innerHTML='<div class="empty">sin proyectos en ejecución</div>';return}
   ps.slice(0,6).forEach(p=>{const pk=key(p.project_type,p.project_id),u=us.filter(x=>key(x.project_type,x.project_id)===pk),total=u.length||num(p.total_units),done=u.length?u.filter(x=>x.status==='DONE').length:num(p.done_units),pct=total?100*done/total:0,d=document.createElement('div');d.className='project';d.innerHTML='<div class="projectTop"><span class="projectName">'+(aliases.get(pk)||'')+' · '+p.title+'</span><span class="projectPct">'+pct.toFixed(0)+'%</span></div><div class="prog"><i style="width:'+pct.toFixed(1)+'%"></i></div><div class="projectMeta">'+done+'/'+total+' · '+num(p.active_units)+' trabajando · '+num(p.ready_units)+' ready</div>';root.appendChild(d)})
 }
 function renderActivity(ev){
   const e=ev[0];$('activityLine').innerHTML=e?'<b>'+displayEventWorker(e)+'</b> · '+e.event_type+(e.unit?' · '+e.unit.replace('VISUAL-LAB-01','VIS'):''):'—'
 }
 function displayEventWorker(e){const n=String(e.worker_code||'SYS').replace(/\D/g,'').padStart(3,'0');if(e.project_type==='GLOBAL_POOL')return e.worker_code?'K'+n:'SYS';if(e.project_type==='BLUEPRINT')return e.worker_code?'B'+n:'SYS';return e.worker_code||'SYS'}
 function render(){
   const projects=state.projects.filter(p=>running(p)&&p.project_type!=='GLOBAL_POOL');
   const aliases=aliasProjects(projects),activeKeys=new Set(projects.map(p=>key(p.project_type,p.project_id)));
   const workers=state.workers.filter(w=>w.status!=='NO_WORK'&&((w.project_type==='GLOBAL_POOL'&&w.status!=='STOPPED')||activeKeys.has(key(w.project_type,w.project_id))));
   const units=state.units.filter(u=>activeKeys.has(key(u.project_type,u.project_id))),outs=state.outputs.filter(o=>activeKeys.has(key(o.project_type,o.project_id))),activity=state.activity.filter(a=>a.project_type==='GLOBAL_POOL'||activeKeys.has(key(a.project_type,a.project_id)));
   const ss=scores(workers),pr=progress(units,outs,workers),working=workers.filter(w=>w.status==='WORKING').length,waiting=workers.filter(w=>w.status==='WAITING').length;
   $('progress').textContent=pr.pct.toFixed(pr.pct<10?1:0)+'%';$('eta').textContent=fmt(pr.eta);$('workerCount').textContent=working+'/'+workers.length;
   $('subtitle').textContent=projects.length+' proyectos · '+working+' trabajando · '+waiting+' libres · ETA '+pr.conf;
   $('arenaHint').textContent=workers.length+' workers · '+waiting+' disponibles';
   renderPieces(workers,ss);renderScore(ss);renderRace(activity,ss);renderProjects(projects,units,aliases);renderActivity(activity);
   if(state.selected){const f=workers.find(w=>w.project_type===state.selected.project_type&&w.project_id===state.selected.project_id&&w.worker_code===state.selected.worker_code);f?renderSelection(f,ss):(state.selected=null,renderSelection(null,ss))}
 }
 async function tick(){
   if(busy)return;busy=true;
   try{
     const projects=await get('prometeo_control_projects?select=*&order=created_at.desc&limit=50'),started=projects.filter(running).map(p=>p.started_at||p.created_at).filter(Boolean).sort()[0],since=encodeURIComponent(started||new Date(Date.now()-86400000).toISOString());
     const [workers,units,outputs,activity]=await Promise.all([
       get('prometeo_control_workers?select=*&order=joined_at.asc&limit=700'),
       get('prometeo_control_units?select=*&order=started_at.desc.nullslast&limit=5000'),
       get('prometeo_control_outputs?select=project_type,project_id,worker_code,unit,stage,word_count,elapsed_ms,rescued,published_at&published_at=gte.'+since+'&order=published_at.desc&limit=3500'),
       get('prometeo_control_activity?select=*&created_at=gte.'+since+'&order=created_at.desc&limit=1200')
     ]);
     state={...state,projects,workers,units,outputs,activity};render();
   }catch(e){$('subtitle').textContent='reintentando conexión · '+e.message}finally{busy=false}
 }
 window.addEventListener('resize',render);tick();setInterval(tick,2000);
})();
</script>
