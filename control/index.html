<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Prometeo</title>
<style>
:root{--bg:#000;--fg:#f3efe6;--muted:#6f6b63;--line:#22201c;--accent:#ff6a00}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}
main{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:9px;font-weight:1000;letter-spacing:-.05em;font-size:22px}.mark{width:5px;height:24px;background:var(--accent)}
.small{font:800 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.core{align-self:center;max-width:760px;width:100%;margin:auto}
.capacity{font-size:clamp(44px,12vw,108px);font-weight:1000;letter-spacing:-.075em;line-height:.82;margin:0}
.capacity span{color:var(--accent)}
.sub{font-size:clamp(16px,3.2vw,24px);font-weight:850;letter-spacing:-.025em;margin-top:16px;color:#c9c3b8}
.rule{height:1px;background:var(--line);margin:22px 0}
.row{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:7px 0;align-items:start}
.label{font:900 9px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.value{font-size:14px;line-height:1.35;font-weight:800;min-width:0}
.value.dim{color:#aaa49a}
footer{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.copy{min-height:58px;border:0;background:var(--fg);color:#080807;padding:0 22px;font-weight:1000;letter-spacing:-.025em;font-size:16px;cursor:pointer}
.copy:active{transform:translateY(1px)}
.hint{text-align:right;max-width:210px}
@media(max-width:600px){
 main{padding-left:14px;padding-right:14px}
 .row{grid-template-columns:92px 1fr;gap:10px}
 footer{grid-template-columns:1fr}
 .hint{text-align:left;max-width:none;order:-1}
 .copy{width:100%}
}
</style>
</head>
<body>
<main>
<header>
 <div class="brand"><span class="mark"></span>PROMETEO</div>
 <div class="small" id="heartbeat">conectando</div>
</header>

<section class="core">
 <h1 class="capacity" id="capacity">—</h1>
 <div class="sub" id="subtitle">leyendo capacidad real</div>
 <div class="rule"></div>

 <div class="row">
  <div class="label">Ahora</div>
  <div class="value" id="now">—</div>
 </div>
 <div class="row">
  <div class="label">Tiempo</div>
  <div class="value dim" id="timing">—</div>
 </div>
 <div class="row">
  <div class="label">Sentinel</div>
  <div class="value dim" id="sentinel">—</div>
 </div>
 <div class="row">
  <div class="label">Lectura</div>
  <div class="value dim" id="reading">—</div>
 </div>
</section>

<footer>
 <button class="copy" id="copy">🕹️ COPIAR PROMPT</button>
 <div class="small hint" id="hint">El prompt no cambia. Prometeo asigna rol, cohorte y trabajo.</div>
</footer>
</main>

<script>
(()=>{
 const BASE='https://catnohyouxqjjtseaueb.supabase.co/rest/v1/';
 const KEY='sb_publishable_eqh3PngXs4UjLLWiY3pz1w_nhHtf7X-';
 const HEAD={apikey:KEY,Authorization:'Bearer '+KEY};
 const $=id=>document.getElementById(id);
 let prompt='';
 async function get(path){
   const r=await fetch(BASE+path,{headers:HEAD,cache:'no-store'});
   if(!r.ok)throw new Error(String(r.status));
   return r.json();
 }
 function pct(v){return v===null||v===undefined?'—':Number(v).toFixed(1)+'%'}
 function render(s){
   const n=Number(s.recommended_open||0);
   $('capacity').innerHTML=n>0?'<span>'+n+'</span> lugares':'cola llena';
   $('subtitle').textContent=n>0?'podés abrir hasta '+n+' chats ahora':'la reserva se está reponiendo sola';
   $('now').textContent=(s.working_workers||0)+' trabajando · '+(s.ready_jobs||0)+' listos · '+(s.reservoir_ready||0)+' en reserva';
   const batch=s.latest_batch||'—';
   $('timing').textContent=batch+' · WORK '+pct(s.batch_work_pct)+' · WAIT '+pct(s.batch_wait_pct);
   const guide=[s.guide_cycle,s.guide_status,s.guide_worker].filter(Boolean).join(' · ');
   $('sentinel').textContent=guide||'sin ciclo activo';
   $('reading').textContent=Number(s.recommended_open||0)>0?'reserva automática activa · los próximos chats reciben trabajo real':((s.silent_workers||0)>0?(s.silent_workers+' silenciosos bajo observación'):(Number(s.leased_jobs||0)+' leases activos · '+Number(s.ready_jobs||0)+' listos · '+Number(s.reservoir_ready||0)+' en reserva'));
   $('heartbeat').textContent='vivo · '+new Date(s.server_time).toLocaleTimeString();
 }
 async function tick(){
   try{
     const [summary,p]=await Promise.all([
       get('prometeo_control_minimal?select=*'),
       get('prometeo_control_worker_prompt?select=*')
     ]);
     if(summary[0])render(summary[0]);
     prompt=p[0]?.prompt_text||prompt;
   }catch(e){
     $('heartbeat').textContent='reintentando';
   }
 }
 $('copy').addEventListener('click',async()=>{
   if(!prompt)return;
   try{
     await navigator.clipboard.writeText(prompt);
     const b=$('copy'),old=b.textContent;b.textContent='COPIADO';setTimeout(()=>b.textContent=old,1200);
   }catch(e){}
 });
 tick();setInterval(tick,2000);
})();
</script>
</body>
</html>
