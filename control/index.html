<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Prometeo</title>
<style>
:root{--bg:#000;--fg:#f3efe6;--muted:#7d786f;--line:#27241f;--accent:#ff6a00}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}
main{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:9px;font-weight:1000;letter-spacing:-.05em;font-size:22px}.mark{width:5px;height:24px;background:var(--accent)}
.micro{font:850 9px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.core{align-self:center;max-width:760px;width:100%;margin:auto}
.eyebrow{font:900 9px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}
.front{font-size:clamp(18px,4vw,30px);font-weight:900;letter-spacing:-.035em;color:#cfc8bc;margin-bottom:8px}
.percent{font-size:clamp(68px,18vw,150px);font-weight:1000;letter-spacing:-.085em;line-height:.78;margin:0}
.percent span{color:var(--accent)}
.track{height:8px;background:var(--line);margin:26px 0 12px;overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);transition:width .35s ease}
.eta{display:flex;justify-content:space-between;gap:14px;align-items:baseline;flex-wrap:wrap}
.etaMain{font-size:clamp(18px,4vw,30px);font-weight:950;letter-spacing:-.04em}
.etaSub{font:850 10px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.rule{height:1px;background:var(--line);margin:24px 0 18px}
.statline{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.stat{font-size:14px;font-weight:850;letter-spacing:-.02em}
.stat b{color:var(--accent);font-size:17px}
.sentinel{margin-top:15px;font-size:12px;font-weight:750;color:#aaa49a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
.copy{min-height:58px;border:0;background:var(--fg);color:#080807;padding:0 22px;font-weight:1000;letter-spacing:-.025em;font-size:16px;cursor:pointer}
.copy:active{transform:translateY(1px)}
.hint{text-align:right;max-width:240px}
@media(max-width:600px){
 main{padding-left:14px;padding-right:14px}
 footer{grid-template-columns:1fr}
 .hint{text-align:left;max-width:none;order:-1}
 .copy{width:100%}
 .statline{gap:10px 16px}
}
@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<main>
<header>
 <div class="brand"><span class="mark"></span>PROMETEO</div>
 <div class="micro" id="heartbeat">conectando</div>
</header>

<section class="core">
 <div class="eyebrow">Frente actual</div>
 <div class="front" id="front">—</div>
 <h1 class="percent"><span id="pct">—</span>%</h1>

 <div class="track" aria-label="Progreso del frente actual">
  <div class="fill" id="fill"></div>
 </div>

 <div class="eta">
  <div class="etaMain" id="eta">—</div>
  <div class="etaSub" id="remaining">—</div>
 </div>

 <div class="rule"></div>

 <div class="statline">
  <div class="stat"><b id="working">—</b> trabajando</div>
  <div class="stat"><b id="rate">—</b> salidas / 15 min</div>
  <div class="stat"><b id="open">—</b> lugares</div>
 </div>

 <div class="sentinel" id="sentinel">Sentinel · —</div>
</section>

<footer>
 <button class="copy" id="copy">🕹️ COPIAR PROMPT</button>
 <div class="micro hint">El prompt no cambia. Prometeo asigna rol, cohorte y trabajo.</div>
</footer>
</main>

<script>
(()=>{
 const BASE='https://catnohyouxqjjtseaueb.supabase.co/rest/v1/';
 const KEY='sb_publishable_eqh3PngXs4UjLLWiY3pz1w_nhHtf7X-';
 const HEAD={apikey:KEY,Authorization:'Bearer '+KEY};
 const $=id=>document.getElementById(id);
 let prompt='';

 async function get(path){
   const r=await fetch(BASE+path,{headers:HEAD,cache:'no-store'});
   if(!r.ok)throw new Error(String(r.status));
   return r.json();
 }

 function fmtEta(sec){
   sec=Math.max(0,Number(sec)||0);
   if(sec===0)return 'cierre inmediato';
   if(sec<90)return '~1 min';
   if(sec<3600)return '~'+Math.max(2,Math.round(sec/60))+' min';
   const h=Math.floor(sec/3600),m=Math.round((sec%3600)/60);
   return '~'+h+'h '+String(m).padStart(2,'0');
 }

 function render(summary,progress){
   const pct=Math.max(0,Math.min(100,Number(progress.progress_pct??0)));
   $('front').textContent=progress.front_label||'Trabajo continuo';
   $('pct').textContent=Number.isFinite(pct)?pct.toFixed(pct>=99?0:1):'—';
   $('fill').style.width=pct+'%';
   $('eta').textContent=fmtEta(progress.eta_seconds);
   $('remaining').textContent=(progress.front_remaining??0)+' pendientes · '+(progress.front_done??0)+'/'+(progress.front_total??0)+' terminados';
   $('working').textContent=progress.working_workers??summary.working_workers??0;
   $('rate').textContent=progress.outputs_15m??0;
   $('open').textContent=summary.recommended_open??0;
   const bits=[summary.guide_cycle,summary.guide_status,summary.guide_worker].filter(Boolean);
   $('sentinel').textContent='Sentinel · '+(bits.length?bits.join(' · '):'sin ciclo activo');
   $('heartbeat').textContent='vivo · '+new Date(progress.server_time||summary.server_time).toLocaleTimeString();
 }

 async function tick(){
   try{
     const [s,promptRows,progressRows]=await Promise.all([
       get('prometeo_control_minimal?select=*'),
       get('prometeo_control_worker_prompt?select=*'),
       get('prometeo_control_progress?select=*')
     ]);
     if(s[0]&&progressRows[0])render(s[0],progressRows[0]);
     prompt=promptRows[0]?.prompt_text||prompt;
   }catch(e){
     $('heartbeat').textContent='reintentando';
   }
 }

 $('copy').addEventListener('click',async()=>{
   if(!prompt)return;
   try{
     await navigator.clipboard.writeText(prompt);
     const b=$('copy'),old=b.textContent;
     b.textContent='COPIADO';
     setTimeout(()=>b.textContent=old,1200);
   }catch(e){}
 });

 tick();
 setInterval(tick,2000);
})();
</script>
</body>
</html>
