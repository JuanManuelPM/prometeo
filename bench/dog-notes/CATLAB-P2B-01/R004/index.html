<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dog Notes · R004</title><style>:root{--paper:#f4efe3;--ink:#111}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}main{min-height:100svh;display:grid;grid-template-columns:64px minmax(0,1fr)}aside{border-right:3px solid;display:flex;align-items:flex-start;justify-content:center;padding-top:24px;font-size:11px;font-weight:900;letter-spacing:.15em;writing-mode:vertical-rl;transform:rotate(180deg)}.wrap{padding:clamp(28px,7vw,90px);max-width:900px;width:100%}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}h1{font-size:clamp(52px,11vw,112px);line-height:.82;letter-spacing:-.06em;margin:14px 0 42px;max-width:7ch}.composer{display:grid;grid-template-columns:minmax(0,1fr) auto;border-top:3px solid;border-bottom:3px solid}#dog-note-input{min-height:56px;padding:14px;border:0;border-right:3px solid;background:transparent;color:inherit;font:inherit}#dog-note-add{min-width:110px;border:0;background:var(--ink);color:var(--paper);font-weight:900;cursor:pointer}.status{font-size:12px;min-height:1.5em;margin:10px 0 32px}#dog-note-list{list-style:none;padding:0;margin:0;border-top:3px solid}#dog-note-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start;padding:18px 0;border-bottom:2px solid}#dog-note-list span{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}.remove{border:2px solid;background:transparent;color:inherit;padding:8px 10px;font-weight:800;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid currentColor;outline-offset:3px}@media(max-width:560px){main{grid-template-columns:52px minmax(0,1fr)}.wrap{padding:24px 16px}.composer{grid-template-columns:1fr}#dog-note-input{border-right:0;border-bottom:3px solid}#dog-note-add{min-height:50px}}</style></head><body><main><aside>DOG NOTES · R004</aside><div class="wrap"><p class="eyebrow">Autonomous reallocation · CATLAB-P2B-01</p><h1>Keep the useful bit.</h1><form class="composer" id="dog-note-form"><label class="sr-only" for="dog-note-input"></label><input id="dog-note-input" autocomplete="off" maxlength="280" aria-label="New dog note" placeholder="Write a short note"><button id="dog-note-add" type="submit">Add note</button></form><p class="status" id="dog-note-status" aria-live="polite">Notes persist in this browser.</p><ul id="dog-note-list" aria-label="Saved dog notes"></ul></div></main><script>(()=>{const KEY='dog-notes-p2b-r004-v1',form=document.getElementById('dog-note-form'),input=document.getElementById('dog-note-input'),list=document.getElementById('dog-note-list'),status=document.getElementById('dog-note-status');let notes=[];function save(){try{localStorage.setItem(KEY,JSON.stringify(notes));status.textContent='Saved locally.'}catch(e){status.textContent='Local persistence is unavailable; notes remain for this page session.'}}function load(){try{const parsed=JSON.parse(localStorage.getItem(KEY)||'[]');notes=Array.isArray(parsed)?parsed:[]}catch(e){notes=[];status.textContent='Stored notes could not be read; starting with an empty list.'}}function render(){list.replaceChildren();notes.forEach((text,index)=>{const li=document.createElement('li'),span=document.createElement('span'),remove=document.createElement('button');span.textContent=text;remove.type='button';remove.className='remove';remove.textContent='Remove';remove.setAttribute('aria-label','Remove note '+(index+1));remove.addEventListener('click',()=>{notes.splice(index,1);save();render()});li.append(span,remove);list.append(li)})}function addNote(){const text=input.value.trim();if(!text){status.textContent='Write something before adding a note.';input.focus();return}notes.push(text);input.value='';save();render();input.focus()}form.addEventListener('submit',e=>{e.preventDefault();addNote()});load();render()})();</script></body></html>
