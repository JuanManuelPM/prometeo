<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dog Notes</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f0e6;color:#111}main{min-height:100vh;display:grid;grid-template-columns:minmax(70px,18vw) minmax(0,1fr)}.rail{background:#111;color:#f4f0e6;padding:24px 12px;font-weight:900;writing-mode:vertical-rl;letter-spacing:.12em;text-transform:uppercase}.content{padding:clamp(24px,7vw,88px);max-width:900px}h1{font-size:clamp(3rem,10vw,8rem);line-height:.85;letter-spacing:-.06em;margin:0 0 36px}.entry{display:grid;grid-template-columns:1fr auto;border-top:3px solid #111;border-bottom:3px solid #111}input,button{font:inherit;border:0;border-radius:0;background:transparent;color:inherit}input{min-width:0;padding:18px 0;font-size:1.15rem;outline-offset:4px}button{cursor:pointer;font-weight:900;padding:12px 16px}#dog-note-add{background:#111;color:#f4f0e6}.notes{list-style:none;margin:32px 0 0;padding:0}.notes li{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;padding:18px 0;border-bottom:2px solid #111;font-size:1.15rem;white-space:pre-wrap;overflow-wrap:anywhere}.empty{font-size:.9rem;margin-top:24px}@media(max-width:520px){main{grid-template-columns:48px minmax(0,1fr)}.content{padding:28px 18px}.entry{grid-template-columns:1fr}#dog-note-add{min-height:48px}}
</style>
</head>
<body>
<main><aside class="rail">Dog Notes / R005</aside><section class="content"><h1>Dog<br>Notes.</h1><div class="entry"><input id="dog-note-input" type="text" autocomplete="off" maxlength="280" placeholder="Add a note…" aria-label="New dog note"><button id="dog-note-add" type="button">Add</button></div><p id="dog-note-empty" class="empty">No notes yet.</p><ul id="dog-note-list" class="notes" aria-live="polite"></ul></section></main>
<script>
(()=>{
 const KEY='dog-notes-catlab-p2b-r005-v1';
 const input=document.getElementById('dog-note-input'),add=document.getElementById('dog-note-add'),list=document.getElementById('dog-note-list'),empty=document.getElementById('dog-note-empty');
 let notes=[];try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))notes=saved.filter(x=>typeof x==='string')}catch(_){ }
 const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(_){ }};
 const render=()=>{list.replaceChildren();empty.hidden=notes.length>0;notes.forEach((text,index)=>{const li=document.createElement('li'),span=document.createElement('span'),remove=document.createElement('button');span.textContent=text;remove.type='button';remove.textContent='Remove';remove.setAttribute('aria-label','Remove note '+(index+1));remove.addEventListener('click',()=>{notes.splice(index,1);save();render()});li.append(span,remove);list.append(li)})};
 const addNote=()=>{const text=input.value.trim();if(!text)return;notes.push(text);input.value='';save();render();input.focus()};
 add.addEventListener('click',addNote);input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addNote()}});render();
})();
</script>
</body>
</html>
