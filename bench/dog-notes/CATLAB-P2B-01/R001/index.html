<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dog Notes R001</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#000;font:16px/1.45 system-ui,sans-serif}main{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,38vw)}header{padding:clamp(28px,8vw,100px);border-right:3px solid currentColor;display:flex;flex-direction:column;justify-content:space-between}h1{font-size:clamp(4rem,13vw,10rem);line-height:.78;letter-spacing:-.07em;margin:.2em 0}small{font-weight:900;letter-spacing:.12em}.panel{padding:clamp(24px,5vw,60px);display:flex;flex-direction:column;gap:20px}form{display:grid;grid-template-columns:1fr auto;border:2px solid currentColor}input,button{font:inherit;color:inherit;background:transparent;border:0;padding:14px}input{min-width:0}button{font-weight:800;border-left:2px solid currentColor;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid currentColor;outline-offset:2px}ul{list-style:none;margin:0;padding:0;border-top:2px solid currentColor}.note{display:grid;grid-template-columns:1fr auto;align-items:stretch;border-bottom:2px solid currentColor}.note span{padding:14px;white-space:pre-wrap;overflow-wrap:anywhere}.note button{min-width:48px}.empty{padding:18px 0;font-weight:700}@media(max-width:680px){main{grid-template-columns:1fr}header{min-height:42vh;border-right:0;border-bottom:3px solid currentColor}.panel{padding:22px 16px}h1{font-size:clamp(4rem,24vw,7rem)}}
</style></head><body><main><header><div><small>DOG NOTES · CATLAB-P2B-01 · R001</small><h1>Dog<br>Notes</h1></div><p>Small notes stay on this device.</p></header><section class="panel"><form id="dog-note-form"><input id="dog-note-input" autocomplete="off" aria-label="Dog note" placeholder="Write a note"><button id="dog-note-add" type="submit">Add</button></form><div id="dog-note-empty" class="empty">No notes yet.</div><ul id="dog-note-list" aria-live="polite"></ul></section></main><script>
(()=>{'use strict';const KEY='dog-notes:catlab-p2b:r001',input=document.querySelector('#dog-note-input'),list=document.querySelector('#dog-note-list'),empty=document.querySelector('#dog-note-empty'),form=document.querySelector('#dog-note-form');let notes=[];try{const raw=localStorage.getItem(KEY);const parsed=raw?JSON.parse(raw):[];if(Array.isArray(parsed))notes=parsed.filter(x=>typeof x==='string')}catch{}function save(){try{localStorage.setItem(KEY,JSON.stringify(notes))}catch{}}function render(){list.replaceChildren();empty.hidden=notes.length>0;notes.forEach((text,i)=>{const li=document.createElement('li');li.className='note';const span=document.createElement('span');span.textContent=text;const remove=document.createElement('button');remove.type='button';remove.textContent='Remove';remove.setAttribute('aria-label','Remove note '+(i+1));remove.addEventListener('click',()=>{notes.splice(i,1);save();render()});li.append(span,remove);list.append(li)})}form.addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text)return;notes.push(text);input.value='';save();render();input.focus()});render()})();
</script></body></html>
