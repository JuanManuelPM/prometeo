<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dog Notes · R007</title>
<style>
:root{--paper:#f3efe4;--ink:#151515}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
main{width:min(760px,calc(100% - 28px));margin:0 auto;padding:48px 0 88px}
header{border-bottom:4px solid var(--ink);padding-bottom:22px;margin-bottom:30px}
small{font-weight:800;text-transform:uppercase;letter-spacing:.14em}
h1{font-size:clamp(54px,13vw,112px);line-height:.78;letter-spacing:-.075em;margin:18px 0 0}
form{display:grid;grid-template-columns:1fr auto;border:3px solid var(--ink);margin-bottom:34px}
input,button{font:inherit;border-radius:0}
input{min-width:0;border:0;background:var(--paper);color:var(--ink);padding:16px;font-size:18px;outline:none}
input:focus{box-shadow:inset 0 0 0 3px var(--ink)}
button{border:0;border-left:3px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:900;padding:0 20px;min-height:54px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#dog-note-list{list-style:none;padding:0;margin:0;border-top:3px solid var(--ink)}
.note{display:grid;grid-template-columns:1fr auto;align-items:stretch;border-bottom:3px solid var(--ink);min-height:68px}
.note-text{padding:18px 16px;font-size:18px;overflow-wrap:anywhere}
.remove-note{background:var(--paper);color:var(--ink);min-width:92px}
.empty{padding:22px 16px;border-bottom:3px solid var(--ink)}
.status{font-size:12px;margin-top:12px;min-height:18px;text-transform:uppercase;letter-spacing:.08em}
@media(max-width:520px){
  main{width:calc(100% - 20px);padding-top:28px}
  form{grid-template-columns:1fr}
  form button{border-left:0;border-top:3px solid var(--ink)}
  .note{grid-template-columns:1fr}
  .remove-note{border-left:0;border-top:3px solid var(--ink);text-align:left;padding:12px 16px}
}
</style>
</head>
<body>
<main>
<header>
  <small>Prometeo · DOG-NOTES-POOL · R007</small>
  <h1>DOG<br>NOTES</h1>
</header>
<form id="dog-note-form">
  <input id="dog-note-input" type="text" maxlength="280" autocomplete="off" placeholder="Add a dog note" aria-label="Dog note">
  <button id="dog-note-add" type="submit">ADD</button>
</form>
<ul id="dog-note-list" aria-live="polite"></ul>
<div id="dog-note-status" class="status" role="status">Saved locally in this browser.</div>
</main>
<script>
(function(){
  'use strict';
  var KEY='prometeo.dog-notes.r007.v1';
  var form=document.getElementById('dog-note-form');
  var input=document.getElementById('dog-note-input');
  var list=document.getElementById('dog-note-list');
  var status=document.getElementById('dog-note-status');
  var notes=[];

  function load(){
    try{
      var raw=localStorage.getItem(KEY);
      var parsed=raw?JSON.parse(raw):[];
      notes=Array.isArray(parsed)?parsed.filter(function(x){return x&&typeof x.text==='string';}):[];
    }catch(err){
      notes=[];
      status.textContent='Local storage unavailable; notes will last only for this open page.';
    }
  }

  function save(){
    try{
      localStorage.setItem(KEY,JSON.stringify(notes));
      status.textContent='Saved locally in this browser.';
    }catch(err){
      status.textContent='Local storage unavailable; changes are only in this open page.';
    }
  }

  function removeNote(id){
    notes=notes.filter(function(note){return note.id!==id;});
    save();
    render();
  }

  function render(){
    list.textContent='';
    if(!notes.length){
      var empty=document.createElement('li');
      empty.className='empty';
      empty.textContent='No notes yet.';
      list.appendChild(empty);
      return;
    }
    notes.forEach(function(note){
      var row=document.createElement('li');
      row.className='note';
      var text=document.createElement('div');
      text.className='note-text';
      text.textContent=note.text;
      var remove=document.createElement('button');
      remove.type='button';
      remove.className='remove-note';
      remove.textContent='REMOVE';
      remove.setAttribute('aria-label','Remove note');
      remove.addEventListener('click',function(){removeNote(note.id);});
      row.appendChild(text);
      row.appendChild(remove);
      list.appendChild(row);
    });
  }

  form.addEventListener('submit',function(event){
    event.preventDefault();
    var text=input.value.trim();
    if(!text){
      status.textContent='Write a note before adding it.';
      input.focus();
      return;
    }
    notes.push({id:String(Date.now())+'-'+Math.random().toString(16).slice(2),text:text});
    input.value='';
    save();
    render();
    input.focus();
  });

  load();
  render();
})();
</script>
</body>
</html>
