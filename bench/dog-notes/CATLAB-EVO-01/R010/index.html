<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dog Notes · R010</title>
<meta name="benchmark-worker" content="wc-20260920T173238Z-dda94795cfeb">
<style>
:root{--bg:#f4efe3;--fg:#101010;font-family:Arial,Helvetica,sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg)}body{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;overflow-x:hidden}header,main,footer{display:grid;grid-template-columns:64px minmax(0,1fr)}.rail{border-right:3px solid var(--fg);display:grid;place-items:center;font-weight:900;writing-mode:vertical-rl;letter-spacing:.12em}.panel{padding:clamp(22px,6vw,72px);min-width:0}header{border-bottom:3px solid var(--fg)}header .panel{min-height:42vh;display:flex;flex-direction:column;justify-content:space-between;gap:28px}h1{margin:0;font-size:clamp(3.2rem,12vw,9rem);line-height:.82;letter-spacing:-.07em;text-transform:uppercase;max-width:8ch}.kicker{font-size:.78rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}main .panel{display:grid;align-content:start;gap:22px}.composer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}input,button{font:inherit;border:2px solid var(--fg);border-radius:0;background:var(--bg);color:var(--fg);min-height:48px}input{width:100%;padding:0 12px}button{font-weight:900;padding:0 16px;cursor:pointer}button:hover,button:focus-visible{background:var(--fg);color:var(--bg)}#dog-note-list{list-style:none;margin:0;padding:0;border-top:3px solid var(--fg)}.note{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-bottom:2px solid var(--fg)}.note-text{overflow-wrap:anywhere;line-height:1.45}.remove{min-height:40px;font-size:.78rem;text-transform:uppercase}.empty{padding:18px 0;border-bottom:2px solid var(--fg);font-style:italic}footer{border-top:3px solid var(--fg)}footer .panel{font-size:.8rem;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}@media(max-width:600px){header,main,footer{grid-template-columns:50px minmax(0,1fr)}.panel{padding:22px 16px}h1{font-size:clamp(3rem,17vw,5.4rem)}.composer{grid-template-columns:1fr}.composer button{width:100%}.note{grid-template-columns:1fr}.remove{justify-self:start}}
</style>
</head>
<body>
<header><div class="rail">DOG NOTES</div><div class="panel"><div class="kicker">CATLAB-EVO-01 · R010</div><h1>Keep the useful bit.</h1><p>One field. One list. Everything stays in this browser.</p></div></header>
<main><div class="rail">NOTES</div><div class="panel">
<form class="composer" id="dog-note-form"><input id="dog-note-input" autocomplete="off" maxlength="280" placeholder="Add a dog note…" aria-label="New dog note"><button id="dog-note-add" type="submit">Add note</button></form>
<ul id="dog-note-list" aria-live="polite"></ul>
</div></main>
<footer><div class="rail">LOCAL</div><div class="panel"><strong>No account. No network storage.</strong><span>Remove any note with its Delete button.</span></div></footer>
<script>
(()=>{const KEY='dog-notes.catlab-evo-01.r010';const input=document.getElementById('dog-note-input');const form=document.getElementById('dog-note-form');const list=document.getElementById('dog-note-list');let notes=[];
const load=()=>{try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');notes=Array.isArray(v)?v.filter(x=>x&&typeof x.text==='string'):[]}catch(_){notes=[]}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(_){}};
const render=()=>{list.replaceChildren();if(!notes.length){const li=document.createElement('li');li.className='empty';li.textContent='No notes yet.';list.append(li);return}notes.forEach(n=>{const li=document.createElement('li');li.className='note';li.dataset.id=n.id;const text=document.createElement('span');text.className='note-text';text.textContent=n.text;const remove=document.createElement('button');remove.type='button';remove.className='remove';remove.textContent='Delete';remove.setAttribute('aria-label','Delete note');remove.addEventListener('click',()=>{notes=notes.filter(x=>x.id!==n.id);save();render()});li.append(text,remove);list.append(li)})};
form.addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text)return;notes.push({id:String(Date.now())+'-'+Math.random().toString(16).slice(2),text});input.value='';save();render();input.focus()});
load();render();
})();
</script>
</body>
</html>
