<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dog Notes — R006</title>
<style>
:root{--paper:#f3ecd9;--ink:#111}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 Arial,sans-serif}.wrap{width:min(760px,calc(100% - 28px));margin:auto}header{min-height:42vh;display:flex;align-items:end;border-bottom:5px solid currentColor;padding:48px 0 34px}h1{margin:0;font-size:clamp(58px,14vw,128px);line-height:.78;letter-spacing:-.07em}.tag{font-weight:900;letter-spacing:.16em;font-size:12px;text-transform:uppercase;margin:0 0 18px}.composer{display:grid;grid-template-columns:1fr auto;gap:0;border-bottom:3px solid currentColor;padding:30px 0}input,button{font:inherit;color:inherit;border:3px solid currentColor;border-radius:0;background:transparent;min-height:52px}input{padding:10px 12px;border-right:0;min-width:0}button{font-weight:900;padding:10px 18px;cursor:pointer}button:hover,button:focus-visible{background:var(--ink);color:var(--paper);outline:none}.count{font-size:13px;font-weight:900;padding:14px 0;border-bottom:2px solid currentColor}ul{list-style:none;margin:0;padding:0}li{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;border-bottom:2px solid currentColor;padding:20px 0}.note-text{font:24px/1.25 Georgia,serif;overflow-wrap:anywhere}.remove{min-height:42px;padding:7px 12px}.empty{padding:48px 0;font:24px/1.35 Georgia,serif}footer{padding:60px 0 90px;font-size:13px;font-weight:800}@media(max-width:520px){header{min-height:34vh}.composer{grid-template-columns:1fr}.composer input{border-right:3px solid currentColor;border-bottom:0}.composer button{width:100%}li{gap:10px}.note-text{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
<header><div><p class="tag">DOG NOTES / R006</p><h1>Small notes. Kept local.</h1></div></header>
<main>
<form class="composer" id="dog-note-form">
<input id="dog-note-input" autocomplete="off" maxlength="280" aria-label="Dog note" placeholder="Write a note…" required>
<button id="dog-note-add" type="submit">add</button>
</form>
<div class="count" id="dog-note-count" aria-live="polite">0 notes</div>
<ul id="dog-note-list" aria-label="Saved dog notes"></ul>
<div id="dog-note-empty" class="empty">No notes yet. Add one above; it stays in this browser.</div>
</main>
<footer>Stored with localStorage where available. Remove deletes only the selected note.</footer>
</div>
<script>
(function(){
'use strict';
var KEY='dog-notes-catlab-evo-01-r006-v1';
var input=document.getElementById('dog-note-input');
var form=document.getElementById('dog-note-form');
var list=document.getElementById('dog-note-list');
var empty=document.getElementById('dog-note-empty');
var count=document.getElementById('dog-note-count');
var notes=[];
try{var saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))notes=saved.filter(function(x){return typeof x==='string'})}catch(e){notes=[]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(e){count.textContent=notes.length+' notes · storage unavailable'}}
function removeNote(index){notes.splice(index,1);persist();render()}
function render(){
 list.textContent='';
 notes.forEach(function(text,index){
   var li=document.createElement('li');
   var span=document.createElement('span');span.className='note-text';span.textContent=text;
   var button=document.createElement('button');button.type='button';button.className='remove';button.textContent='remove';button.setAttribute('aria-label','Remove note '+(index+1));
   button.addEventListener('click',function(){removeNote(index)});
   li.appendChild(span);li.appendChild(button);list.appendChild(li);
 });
 empty.hidden=notes.length>0;
 count.textContent=notes.length+' '+(notes.length===1?'note':'notes');
}
form.addEventListener('submit',function(event){
 event.preventDefault();
 var text=input.value.trim();
 if(!text)return;
 notes.push(text);persist();render();input.value='';input.focus();
});
render();
})();
</script>
</body></html>
