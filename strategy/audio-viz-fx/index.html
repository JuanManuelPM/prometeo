<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prometeo · Audio FX Lab</title>
<style>
:root{color-scheme:dark;--bg:#000;--fg:#fff;--dim:rgba(255,255,255,.52);--line:rgba(255,255,255,.18)}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
main{width:min(1180px,100%);margin:0 auto;padding:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding-bottom:14px}
.brand{font-size:12px;font-weight:950;letter-spacing:.18em}
.meta{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
#dot{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff}
#dot[hidden]{display:none}
.hero{display:grid;grid-template-columns:104px 1fr;gap:18px;align-items:center;padding:20px 0 16px}
#play{width:104px;height:104px;border:0;background:#fff;color:#000;font-size:36px;font-weight:950;cursor:pointer}
#play:disabled{opacity:.28}
.kicker{font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
#headline{font-size:clamp(20px,3.1vw,34px);line-height:1.03;font-weight:830;letter-spacing:-.035em;max-width:820px}
#status{margin-top:8px;font-size:11px;color:var(--dim)}
.progress{height:4px;background:rgba(255,255,255,.13);margin-bottom:16px}
#progressFill{height:100%;width:0;background:#fff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fx{position:relative;border:1px solid var(--line);aspect-ratio:1.55;min-height:250px;overflow:hidden;background:#000}
.fxHead{position:absolute;z-index:4;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;gap:12px;pointer-events:none}
.fxTitle{font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.fxMeta{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.fx canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:12px}
.metric{background:#000;padding:10px 12px}
.metric b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.metric span{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
@media(max-width:760px){
  main{padding:12px}
  .hero{grid-template-columns:80px 1fr;gap:12px}
  #play{width:80px;height:80px;font-size:29px}
  .grid{grid-template-columns:1fr}
  .fx{min-height:230px}
  .metrics{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<main>
<header>
  <div class="brand">PROMETEO · AUDIO FX</div>
  <div class="meta"><i id="dot"></i><span id="time">—</span></div>
</header>

<section class="hero">
  <button id="play" type="button" aria-label="Reproducir" disabled>▶</button>
  <div>
    <div class="kicker">UN AUDIO · SEIS RENDERERS</div>
    <div id="headline">Esperando la lectura estratégica.</div>
    <div id="status">cargando</div>
  </div>
</section>
<div class="progress"><div id="progressFill"></div></div>

<section class="grid">
  <article class="fx"><div class="fxHead"><span class="fxTitle">01 · Mirror wave</span><span class="fxMeta">waveform</span></div><canvas id="mirror"></canvas></article>
  <article class="fx"><div class="fxHead"><span class="fxTitle">02 · Radial spectrum</span><span class="fxMeta">FFT</span></div><canvas id="radial"></canvas></article>
  <article class="fx"><div class="fxHead"><span class="fxTitle">03 · Particle burst</span><span class="fxMeta">bass + energy</span></div><canvas id="particles"></canvas></article>
  <article class="fx"><div class="fxHead"><span class="fxTitle">04 · Orbit rings</span><span class="fxMeta">low / mid / high</span></div><canvas id="rings"></canvas></article>
  <article class="fx"><div class="fxHead"><span class="fxTitle">05 · Scope trail</span><span class="fxMeta">persistence</span></div><canvas id="trail"></canvas></article>
  <article class="fx"><div class="fxHead"><span class="fxTitle">06 · Pulse orb</span><span class="fxMeta">combined</span></div><canvas id="orb"></canvas></article>
</section>

<div class="metrics">
  <div class="metric"><b id="rms">0.000</b><span>RMS</span></div>
  <div class="metric"><b id="bass">0.00</b><span>Bass</span></div>
  <div class="metric"><b id="mid">0.00</b><span>Mid</span></div>
  <div class="metric"><b id="treble">0.00</b><span>Treble</span></div>
</div>
</main>

<script>
(()=>{
'use strict';
const BASE='https://catnohyouxqjjtseaueb.supabase.co/rest/v1/rpc/';
const TTS='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/prometeo-strategy-audio-v1';
const KEY='sb_publishable_eqh3PngXs4UjLLWiY3pz1w_nhHtf7X-';
const HEAD={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const CHANNEL='PROMETEO_MAIN';
const HEARD_KEY='prometeo-strategy-heard-v1';
const TZ='America/Argentina/Buenos_Aires';
const CACHE_VERSION='prometeo-strategy-c-e1-v4';
const VOICE='prometeo-c-e1-ironic-clone-v4';
const FIRST=220,MAX=500,AHEAD=2;
const $=id=>document.getElementById(id);

let state=null,surface=null,text='',chunks=[],index=0,audio=null,intent=false,playing=false,epoch=0,clips=new Map();
let audioCtx=null,analyser=null,timeData=null,freqData=null,raf=0,smoothRms=0;
const connected=new WeakSet();
const particles=[];
const canvases={};

async function rpc(name,args){const r=await fetch(BASE+name,{method:'POST',headers:HEAD,body:JSON.stringify(args),cache:'no-store'});if(!r.ok)throw new Error(name+' '+r.status);return r.json()}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function hashText(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
function clean(s){return String(s||'').replace(/[^a-zA-Z0-9._:-]/g,'-').slice(0,82)}
function norm(s){return String(s||'').replace(/\s+/g,' ').trim()}
function timeMs(v){const t=Date.parse(v?.generated_at||'');return Number.isFinite(t)?t:0}
function choose(){const p=state?.preview||null,f=state?.firm||null;if(p&&(!f||timeMs(p)>timeMs(f)))return {...p,spoken_brief:p.preview_text||'',tts_message_id:'strategic-preview-'+String(p.epoch_id||'current')};return f||p||null}
function msgId(v){if(!v)return '';return String(v.tts_message_id||v.epoch_id||'current')+'|'+hashText(norm(v.spoken_brief||v.preview_text||''))}
function heard(){try{const a=JSON.parse(localStorage.getItem(HEARD_KEY)||'[]');return Array.isArray(a)?a:[]}catch{return[]}}
function isHeard(v){const id=msgId(v);return !!id&&heard().includes(id)}
function markHeard(v){const id=msgId(v);if(!id)return;const a=heard().filter(x=>x!==id);a.unshift(id);try{localStorage.setItem(HEARD_KEY,JSON.stringify(a.slice(0,50)))}catch{}}
function dateParts(d){const p=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d),o={};for(const x of p)if(x.type!=='literal')o[x.type]=x.value;return{y:+o.year,m:+o.month,d:+o.day}}
function labelTime(v){const ms=timeMs(v);if(!ms)return'—';const d=new Date(ms),n=new Date(),a=dateParts(d),b=dateParts(n);const delta=Math.round((Date.UTC(b.y,b.m-1,b.d)-Date.UTC(a.y,a.m-1,a.d))/86400000);const tm=new Intl.DateTimeFormat('es-AR',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false}).format(d);const day=delta===0?'HOY':delta===1?'AYER':new Intl.DateTimeFormat('es-AR',{timeZone:TZ,day:'2-digit',month:'short',year:a.y===b.y?undefined:'numeric'}).format(d).replace('.','').toUpperCase();return day+' · '+tm}
function chunk(raw){let s=norm(raw),out=[],off=0;while(s.length){const lim=out.length?MAX:FIRST;if(s.length<=lim){out.push({text:s,start:off,end:off+s.length});break}const w=s.slice(0,lim+1);let cut=-1;for(const sep of ['. ','! ','? ','; ',': ',', ',' ']){const i=w.lastIndexOf(sep);if(i>=Math.floor(lim*.55))cut=Math.max(cut,i+sep.length-1)}if(cut<1)cut=w.lastIndexOf(' ');if(cut<1)cut=lim-1;const part=s.slice(0,cut+1).trim();out.push({text:part,start:off,end:off+part.length});off+=s.slice(0,cut+1).length;s=s.slice(cut+1).trimStart()}return out}
function audioId(i){const c=chunks[i],base=clean(surface?.tts_message_id||surface?.epoch_id||'current');return CACHE_VERSION+'-'+base+'-'+(i+1)+'-'+hashText(VOICE+'|'+c.text)}
function clip(i){if(!clips.has(i))clips.set(i,{status:'idle',audio:null,url:null,promise:null});return clips.get(i)}

async function ensureGraph(a){
  if(!audioCtx){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=2048;
    analyser.smoothingTimeConstant=.76;
    timeData=new Uint8Array(analyser.fftSize);
    freqData=new Uint8Array(analyser.frequencyBinCount);
    analyser.connect(audioCtx.destination);
  }
  if(audioCtx.state==='suspended')await audioCtx.resume();
  if(!connected.has(a)){const src=audioCtx.createMediaElementSource(a);src.connect(analyser);connected.add(a)}
}
function setButton(){const b=$('play');b.disabled=!chunks.length;if(playing){b.textContent='Ⅱ';b.setAttribute('aria-label','Pausar')}else if(intent){b.textContent='…';b.setAttribute('aria-label','Preparando audio')}else{b.textContent='▶';b.setAttribute('aria-label','Reproducir')}}
function updateProgress(){
  $('time').textContent=labelTime(surface);$('dot').hidden=!surface||isHeard(surface);$('headline').textContent=surface?.headline||'Esperando la lectura estratégica.';
  let p=0,c=chunks[index];if(c){let f=0;if(audio&&Number.isFinite(audio.duration)&&audio.duration>0)f=clamp(audio.currentTime/audio.duration,0,1);p=(c.start+(c.end-c.start)*f)/Math.max(1,text.length)}
  $('progressFill').style.width=(clamp(p,0,1)*100)+'%';setButton()
}
async function ensure(i){
  if(i<0||i>=chunks.length)return null;const c=clip(i);if(c.status==='ready')return c;if(c.promise)return c.promise;const my=epoch;
  c.promise=(async()=>{c.status='loading';$('status').textContent='preparando '+(i+1)+'/'+chunks.length;setButton();let r=await fetch(TTS+'?id='+encodeURIComponent(audioId(i)),{cache:'no-store'});if(r.status===404)r=await fetch(TTS,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messageId:audioId(i),text:chunks[i].text})});if(!r.ok)throw new Error('TTS '+r.status);const b=await r.blob();if(my!==epoch)throw new Error('stale');if(b.size<1000)throw new Error('audio vacío');if(c.url)URL.revokeObjectURL(c.url);c.url=URL.createObjectURL(b);c.audio=new Audio(c.url);c.audio.preload='auto';c.status='ready';if(i===0&&!playing)$('status').textContent='listo';return c})().catch(e=>{c.status='idle';c.promise=null;if(e.message!=='stale')$('status').textContent='reintentar';throw e});return c.promise
}
function prefetch(){for(let i=index+1;i<Math.min(chunks.length,index+1+AHEAD);i++)ensure(i).catch(()=>{})}
async function start(){
  if(!chunks.length)return;intent=true;setButton();
  try{const c=await ensure(index);if(!intent||!c?.audio)return;audio=c.audio;await ensureGraph(audio);audio.ontimeupdate=updateProgress;audio.onplay=()=>{playing=true;$('status').textContent='reproduciendo';setButton();prefetch()};audio.onpause=()=>{if(!audio.ended){playing=false;$('status').textContent='pausado';setButton()}};audio.onended=advance;await audio.play()}
  catch(e){intent=false;playing=false;$('status').textContent='tocá PLAY para reintentar';setButton()}
}
function advance(){if(index>=chunks.length-1){intent=false;playing=false;markHeard(surface);$('dot').hidden=true;$('progressFill').style.width='100%';$('status').textContent='escuchado';setButton();return}index++;audio=null;playing=false;updateProgress();if(intent)start()}
$('play').addEventListener('click',()=>{if(playing){intent=false;audio?.pause();return}start()});

function prepCanvas(id){
  const el=$(id),ctx=el.getContext('2d');
  canvases[id]={el,ctx,w:0,h:0};
}
function sizeCanvas(c){
  const dpr=Math.min(2,window.devicePixelRatio||1),r=c.el.getBoundingClientRect(),w=Math.max(2,Math.round(r.width*dpr)),h=Math.max(2,Math.round(r.height*dpr));
  if(c.el.width!==w||c.el.height!==h){c.el.width=w;c.el.height=h;c.w=w;c.h=h}
}
function avgBand(a,b){if(!freqData||!freqData.length)return 0;const n=freqData.length,lo=Math.floor(a*n),hi=Math.max(lo+1,Math.floor(b*n));let s=0;for(let i=lo;i<hi;i++)s+=freqData[i];return(s/(hi-lo))/255}
function featureFrame(){
  let rms=0;
  if(analyser&&playing){analyser.getByteTimeDomainData(timeData);analyser.getByteFrequencyData(freqData);let s=0;for(const v of timeData){const x=(v-128)/128;s+=x*x}rms=Math.sqrt(s/timeData.length)}
  smoothRms=smoothRms*.80+rms*.20;
  return {rms,smooth:smoothRms,bass:avgBand(.005,.06),mid:avgBand(.06,.22),treble:avgBand(.22,.52),active:playing&&smoothRms>.014}
}
function clear(ctx,w,h,alpha=1){ctx.fillStyle='rgba(0,0,0,'+alpha+')';ctx.fillRect(0,0,w,h)}
function drawMirror(c,f){
  const {ctx,w,h}=c;clear(ctx,w,h,1);ctx.save();ctx.translate(0,h/2);ctx.strokeStyle='rgba(255,255,255,.92)';ctx.lineWidth=Math.max(1,w/700);ctx.beginPath();
  const step=Math.max(1,Math.floor((timeData?.length||1)/(w/2)));
  for(let i=0,x=0;i<(timeData?.length||0);i+=step,x++){const v=((timeData[i]-128)/128);const px=x/(Math.max(1,(timeData.length/step)-1))*w,py=v*h*.34;if(x===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}
  ctx.stroke();ctx.scale(1,-1);ctx.globalAlpha=.25;ctx.stroke();ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.10)';ctx.fillRect(0,h/2,w,1)
}
function drawRadial(c,f){
  const {ctx,w,h}=c;clear(ctx,w,h,1);const cx=w/2,cy=h/2,base=Math.min(w,h)*(.18+f.smooth*.45),bars=96,maxR=Math.min(w,h)*.42;
  ctx.save();ctx.translate(cx,cy);
  for(let i=0;i<bars;i++){const idx=Math.floor(i/bars*(freqData?.length||1)*.42),v=freqData?freqData[idx]/255:0,a=i/bars*Math.PI*2-Math.PI/2,r1=base,r2=base+v*(maxR-base);ctx.strokeStyle='rgba(255,255,255,'+(0.24+v*.76)+')';ctx.lineWidth=Math.max(1,w/900);ctx.beginPath();ctx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);ctx.stroke()}
  ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,base,0,Math.PI*2);ctx.stroke();ctx.restore()
}
function spawnParticles(f,w,h){
  if(!f.active)return;const count=Math.min(8,1+Math.floor(f.bass*7));
  for(let i=0;i<count&&particles.length<180;i++){const a=Math.random()*Math.PI*2,s=(.25+f.smooth*5+f.bass*2)*(Math.min(w,h)/380);particles.push({x:w/2,y:h/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,size:1+Math.random()*2+f.smooth*8})}
}
function drawParticles(c,f){
  const {ctx,w,h}=c;clear(ctx,w,h,.18);spawnParticles(f,w,h);ctx.fillStyle='#fff';
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.992;p.vy*=.992;p.life-=.012+f.treble*.015;if(p.life<=0||p.x<0||p.x>w||p.y<0||p.y>h){particles.splice(i,1);continue}ctx.globalAlpha=Math.max(0,p.life);ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}
  ctx.globalAlpha=1;ctx.strokeStyle='rgba(255,255,255,'+(0.18+f.smooth*2)+')';ctx.beginPath();ctx.arc(w/2,h/2,Math.min(w,h)*(.06+f.bass*.06),0,Math.PI*2);ctx.stroke()
}
function drawRings(c,f,t){
  const {ctx,w,h}=c;clear(ctx,w,h,1);const cx=w/2,cy=h/2,base=Math.min(w,h)*.10,vals=[f.bass,f.mid,f.treble];
  ctx.save();ctx.translate(cx,cy);
  for(let k=0;k<8;k++){const band=vals[k%3],r=base+k*Math.min(w,h)*.045+band*Math.min(w,h)*.045;ctx.strokeStyle='rgba(255,255,255,'+(0.12+k*.07)+')';ctx.lineWidth=1+(k%3===0?band*2:0);ctx.beginPath();const pts=90;for(let i=0;i<=pts;i++){const a=i/pts*Math.PI*2,warp=Math.sin(a*(3+k%4)+t*.001*(.4+k*.04))*band*Math.min(w,h)*.012;const rr=r+warp;const x=Math.cos(a)*rr,y=Math.sin(a)*rr;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath();ctx.stroke()}
  ctx.restore()
}
function drawTrail(c,f){
  const {ctx,w,h}=c;clear(ctx,w,h,.09);ctx.strokeStyle='rgba(255,255,255,'+(f.active?.75:.18)+')';ctx.lineWidth=Math.max(1,w/850);ctx.beginPath();
  const len=timeData?.length||0,step=Math.max(1,Math.floor(len/(w/2)));
  for(let i=0,x=0;i<len;i+=step,x++){const px=x/(Math.max(1,(len/step)-1))*w;const v=(timeData[i]-128)/128;const py=h/2+v*h*.38;if(x===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.stroke()
}
function drawOrb(c,f,t){
  const {ctx,w,h}=c;clear(ctx,w,h,.18);const cx=w/2,cy=h/2,base=Math.min(w,h)*(.15+f.smooth*.5),pts=128;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(t*.00008);
  for(let layer=0;layer<3;layer++){ctx.strokeStyle='rgba(255,255,255,'+(0.18+layer*.25)+')';ctx.lineWidth=1+layer;ctx.beginPath();for(let i=0;i<=pts;i++){const a=i/pts*Math.PI*2,idx=Math.floor(i/pts*(freqData?.length||1)*.32),fv=freqData?freqData[idx]/255:0;const rr=base+fv*Math.min(w,h)*(.035+layer*.015)+Math.sin(a*(4+layer)+t*.001)*f.mid*Math.min(w,h)*.02;const x=Math.cos(a)*rr,y=Math.sin(a)*rr;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath();ctx.stroke()}
  ctx.restore();ctx.fillStyle='rgba(255,255,255,'+(0.03+f.bass*.15)+')';ctx.beginPath();ctx.arc(cx,cy,base*.72,0,Math.PI*2);ctx.fill()
}
function frame(t){
  for(const c of Object.values(canvases))sizeCanvas(c);
  const f=featureFrame();
  $('rms').textContent=f.smooth.toFixed(3);$('bass').textContent=f.bass.toFixed(2);$('mid').textContent=f.mid.toFixed(2);$('treble').textContent=f.treble.toFixed(2);
  drawMirror(canvases.mirror,f);drawRadial(canvases.radial,f);drawParticles(canvases.particles,f);drawRings(canvases.rings,f,t);drawTrail(canvases.trail,f);drawOrb(canvases.orb,f,t);
  raf=requestAnimationFrame(frame)
}
async function load(){
  try{const next=await rpc('prometeo_strategic_console_v2',{p_channel_key:CHANNEL});state=next;const s=choose(),key=msgId(s);if(key!==msgId(surface)){epoch++;intent=false;playing=false;try{audio?.pause()}catch{}for(const c of clips.values())if(c.url)try{URL.revokeObjectURL(c.url)}catch{}clips.clear();surface=s;text=norm(s?.spoken_brief||s?.preview_text||'');chunks=chunk(text);index=0;audio=null;$('status').textContent=chunks.length?'preparando':'sin mensaje';updateProgress();if(chunks.length)ensure(0).catch(()=>{})}else{surface=s;updateProgress()}}
  catch(e){$('status').textContent='reconectando'}
}
for(const id of ['mirror','radial','particles','rings','trail','orb'])prepCanvas(id);
cancelAnimationFrame(raf);frame(0);load();setInterval(load,8000);
})();
</script>
</body>
</html>
