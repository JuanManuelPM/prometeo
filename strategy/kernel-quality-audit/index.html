<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prometeo · Kernel Quality Audit</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif}main{max-width:780px;margin:auto;padding:18px}
h1{font-size:28px;margin:4px 0 14px}.k{font:800 9px ui-monospace;letter-spacing:.12em;opacity:.5}
.stats{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid #333}.s{padding:12px;border-right:1px solid #333}.s:last-child{border-right:0}.s b{font-size:22px;display:block}.s span{font-size:9px;opacity:.5;text-transform:uppercase}
.job{padding:13px 0;border-bottom:1px solid #292929;display:flex;justify-content:space-between;gap:12px}.state{font:800 9px ui-monospace;border:1px solid #fff;padding:4px 6px;height:max-content}
.note{font-size:13px;line-height:1.45;opacity:.72;padding:14px 0}.note a{color:#fff;font-weight:800}
</style></head><body><main>
<div class="k">PROMETEO · WORKER KERNEL</div><h1>QUALITY AUDIT V1</h1>
<div class="note">3 reviewers ciegos + 1 adjudicación. Selección: T01, T04, T06, T13, T15 + T05 como control. <a href="/prometeo/coordination/design-dna/experiments/WORKER-KERNEL-QUALITY-AUDIT-V1/WORKER_PROMPT.txt">PROMPT</a></div>
<div class="stats"><div class="s"><b id="r">-</b><span>ready</span></div><div class="s"><b id="a">-</b><span>active</span></div><div class="s"><b id="d">-</b><span>done</span></div><div class="s"><b id="b">-</b><span>blocked</span></div><div class="s"><b id="w">-</b><span>workers</span></div></div>
<div id="jobs"></div></main>
<script>
(()=>{
const B='https://catnohyouxqjjtseaueb.supabase.co/rest/v1/rpc/',K='sb_publishable_eqh3PngXs4UjLLWiY3pz1w_nhHtf7X-';
async function load(){try{
 const x=await fetch(B+'prometeo_worker_kernel_quality_audit_status_v1',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:'{}',cache:'no-store'}).then(r=>r.json());
 const c=x.counts||{},s=x.sessions||{};r.textContent=c.ready||0;a.textContent=c.active||0;d.textContent=c.done||0;b.textContent=c.blocked||0;w.textContent=s.total||0;
 jobs.innerHTML=(x.jobs||[]).map(j=>'<div class="job"><div><b>'+j.node_key+'</b><div class="k">gen '+(j.generation||0)+' · recovery '+(j.recovery_count||0)+' · '+(j.progress_stage||'—')+'</div></div><div class="state">'+j.state+'</div></div>').join('');
}catch{}}
load();setInterval(load,4000);
})();
</script></body></html>
