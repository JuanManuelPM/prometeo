<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prometeo · Widget de voz</title>
<style>
:root{color-scheme:dark;--bg:#000;--fg:#fff;--dim:rgba(255,255,255,.55);--line:rgba(255,255,255,.20)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;color:var(--fg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:grid;place-items:center;overflow:hidden}
#widget{position:relative;width:min(100vw,100vh);height:min(100vw,100vh);aspect-ratio:1;background:var(--bg);overflow:hidden;padding:clamp(14px,5.2vmin,34px);display:grid;grid-template-rows:auto 1fr auto;border:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;min-width:0}
.brand{font-size:clamp(9px,2.1vmin,13px);font-weight:950;letter-spacing:.18em}
.topRight{margin-left:auto;display:flex;align-items:center;gap:clamp(6px,1.7vmin,10px);min-width:0}
.meta{display:flex;align-items:center;gap:clamp(5px,1.5vmin,9px);min-width:0;font-size:clamp(8px,1.9vmin,12px);font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
#readerToggle{width:clamp(34px,8.5vmin,44px);height:clamp(34px,8.5vmin,44px);border:1px solid var(--line);background:#000;color:#fff;padding:0;display:grid;place-items:center;cursor:pointer;font-size:clamp(16px,4.3vmin,22px);line-height:1}
#readerToggle[aria-expanded="true"]{background:#fff;color:#000}
#dot{width:clamp(6px,1.6vmin,9px);height:clamp(6px,1.6vmin,9px);border-radius:50%;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.95);flex:0 0 auto}
#dot[hidden]{display:none}
.center{display:grid;place-items:center;min-height:0}
#play{width:clamp(74px,28vmin,148px);height:clamp(74px,28vmin,148px);border:0;background:#fff;color:#000;padding:0;display:grid;place-items:center;cursor:pointer;font-size:clamp(25px,8.5vmin,48px);font-weight:900;line-height:1}
#play:disabled{opacity:.26;cursor:default}
.bottom{min-width:0}
#headline{font-size:clamp(14px,4.4vmin,27px);line-height:1.08;font-weight:800;letter-spacing:-.03em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.track{height:clamp(3px,.8vmin,5px);margin-top:clamp(10px,3vmin,18px);background:rgba(255,255,255,.16)}
#fill{display:block;width:0;height:100%;background:#fff;transition:width .12s linear}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:clamp(5px,1.6vmin,9px);font-size:clamp(7px,1.65vmin,10px);font-weight:850;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
#status{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#reader{display:none;min-height:0;overflow:hidden;margin-top:clamp(10px,2.5vmin,16px);border-top:1px solid var(--line)}
#widget.readerOpen{grid-template-rows:auto 1fr}
#widget.readerOpen .center,#widget.readerOpen .bottom{display:none}
#widget.readerOpen #reader{display:block}
.readerScroll{height:100%;overflow:auto;overscroll-behavior:contain;padding:clamp(12px,3.2vmin,20px) 2px clamp(18px,5vmin,30px);scrollbar-width:thin}
.readerKicker{font-size:clamp(8px,1.8vmin,10px);font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-bottom:clamp(7px,1.8vmin,10px)}
#readerHeadline{font-size:clamp(16px,4.5vmin,26px);line-height:1.08;font-weight:820;letter-spacing:-.03em;margin-bottom:clamp(10px,2.8vmin,17px)}
#readerLead{font:clamp(14px,3.7vmin,21px)/1.48 Georgia,"Times New Roman",serif;white-space:pre-wrap;padding-bottom:clamp(14px,4vmin,24px)}
.accordions{border-top:1px solid var(--line)}
.acc{border-bottom:1px solid var(--line)}
.accBtn{width:100%;min-height:clamp(42px,10vmin,54px);border:0;background:#000;color:#fff;padding:0;display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:left;cursor:pointer;font:900 clamp(9px,2.1vmin,12px)/1 system-ui;letter-spacing:.12em;text-transform:uppercase}
.accBtn span:last-child{font-size:clamp(16px,4vmin,22px);font-weight:400}
.accBody{display:none;padding:0 0 clamp(14px,3.5vmin,20px)}
.acc.open .accBody{display:block}
.accText{font-size:clamp(12px,3vmin,16px);line-height:1.48;padding:9px 0;border-top:1px solid rgba(255,255,255,.09)}
.accText:first-child{border-top:0}
.accText b{display:block;font-size:.78em;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.accText small{display:block;font-size:.84em;line-height:1.45;color:var(--dim);margin-top:4px}
.readerEmpty{font-size:clamp(11px,2.6vmin,14px);color:var(--dim);padding:12px 0}
@media (prefers-reduced-motion:reduce){#fill{transition:none}}
</style>
</head>
<body>
<section id="widget" aria-label="Prometeo, último mensaje de voz">
  <div class="top">
    <div class="brand">PROMETEO</div>
    <div class="topRight">
      <div class="meta"><i id="dot" aria-label="Mensaje sin escuchar"></i><span id="time">—</span></div>
      <button id="readerToggle" type="button" aria-label="Abrir texto completo" aria-expanded="false">≡</button>
    </div>
  </div>
  <div id="reader" aria-hidden="true">
    <div class="readerScroll">
      <div class="readerKicker">LECTURA COMPLETA</div>
      <div id="readerHeadline"></div>
      <div id="readerLead"></div>
      <div id="readerSections" class="accordions"></div>
    </div>
  </div>
  <div class="center"><button id="play" type="button" aria-label="Reproducir" disabled>▶</button></div>
  <div class="bottom">
    <div id="headline">Esperando una lectura estratégica.</div>
    <div class="track" aria-hidden="true"><i id="fill"></i></div>
    <div class="foot"><span id="status">cargando</span><span id="part">0 / 0</span></div>
  </div>
</section>
<script>
(()=>{
'use strict';
const BASE='https://catnohyouxqjjtseaueb.supabase.co/rest/v1/rpc/';
const TTS='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/prometeo-strategy-audio-v1';
const KEY='sb_publishable_eqh3PngXs4UjLLWiY3pz1w_nhHtf7X-';
const HEAD={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const CHANNEL='PROMETEO_MAIN';
const HEARD_KEY='prometeo-strategy-heard-v1';
const TZ='America/Argentina/Buenos_Aires';
const CACHE_VERSION='prometeo-strategy-c-e1-v4';
const VOICE='prometeo-c-e1-ironic-clone-v4';
const FIRST=220,MAX=500;
const $=id=>document.getElementById(id);
let state=null,surface=null,text='',chunks=[],index=0,audio=null,intent=false,playing=false,epoch=0,clips=new Map();

async function rpc(name,args){
  const r=await fetch(BASE+name,{method:'POST',headers:HEAD,body:JSON.stringify(args),cache:'no-store'});
  if(!r.ok)throw new Error(name+' '+r.status);
  return r.json();
}
function hashText(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
function clean(s){return String(s||'').replace(/[^a-zA-Z0-9._:-]/g,'-').slice(0,82)}
function norm(s){return String(s||'').replace(/\s+/g,' ').trim()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function arr(v){return Array.isArray(v)?v:[]}
function timeMs(v){const t=Date.parse(v?.generated_at||'');return Number.isFinite(t)?t:0}
function choose(){
  const p=state?.preview||null,f=state?.firm||null;
  if(p&&(!f||timeMs(p)>timeMs(f)))return {...p,spoken_brief:p.preview_text||'',tts_message_id:'strategic-preview-'+String(p.epoch_id||'current')};
  return f||p||null;
}
function msgId(v){
  if(!v)return '';
  return String(v.tts_message_id||v.epoch_id||'current')+'|'+hashText(norm(v.spoken_brief||v.preview_text||''));
}
function heard(){try{const a=JSON.parse(localStorage.getItem(HEARD_KEY)||'[]');return Array.isArray(a)?a:[]}catch{return[]}}
function isHeard(v){const id=msgId(v);return !!id&&heard().includes(id)}
function markHeard(v){
  const id=msgId(v);if(!id)return;
  const a=heard().filter(x=>x!==id);a.unshift(id);
  try{localStorage.setItem(HEARD_KEY,JSON.stringify(a.slice(0,50)))}catch{}
}
function dateParts(d){
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d),o={};
  for(const x of p)if(x.type!=='literal')o[x.type]=x.value;
  return {y:+o.year,m:+o.month,d:+o.day};
}
function labelTime(v){
  const ms=timeMs(v);if(!ms)return '—';
  const d=new Date(ms),n=new Date(),a=dateParts(d),b=dateParts(n);
  const delta=Math.round((Date.UTC(b.y,b.m-1,b.d)-Date.UTC(a.y,a.m-1,a.d))/86400000);
  const tm=new Intl.DateTimeFormat('es-AR',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
  const day=delta===0?'HOY':delta===1?'AYER':new Intl.DateTimeFormat('es-AR',{timeZone:TZ,day:'2-digit',month:'short',year:a.y===b.y?undefined:'numeric'}).format(d).replace('.','').toUpperCase();
  return day+' · '+tm;
}
function chunk(raw){
  let s=norm(raw),out=[],off=0;
  while(s.length){
    const lim=out.length?MAX:FIRST;
    if(s.length<=lim){out.push({text:s,start:off,end:off+s.length});break}
    const w=s.slice(0,lim+1);let cut=-1;
    for(const sep of ['. ','! ','? ','; ',': ',', ',' ']){
      const i=w.lastIndexOf(sep);if(i>=Math.floor(lim*.55))cut=Math.max(cut,i+sep.length-1);
    }
    if(cut<1)cut=w.lastIndexOf(' ');if(cut<1)cut=lim-1;
    const part=s.slice(0,cut+1).trim();out.push({text:part,start:off,end:off+part.length});
    off+=s.slice(0,cut+1).length;s=s.slice(cut+1).trimStart();
  }
  return out;
}
function audioId(i){
  const c=chunks[i],base=clean(surface?.tts_message_id||surface?.epoch_id||'current');
  return CACHE_VERSION+'-'+base+'-'+(i+1)+'-'+hashText(VOICE+'|'+c.text);
}
function clip(i){if(!clips.has(i))clips.set(i,{status:'idle',audio:null,url:null});return clips.get(i)}
function setButton(){
  const b=$('play');b.disabled=!chunks.length;
  if(playing){b.textContent='Ⅱ';b.setAttribute('aria-label','Pausar')}
  else if(intent){b.textContent='…';b.setAttribute('aria-label','Preparando audio')}
  else{b.textContent='▶';b.setAttribute('aria-label','Reproducir')}
}
function sectionRows(title,items,renderItem){
  const list=arr(items);if(!list.length)return '';
  const rows=list.map((x,i)=>renderItem?renderItem(x,i):'<div class="accText">'+esc(x)+'</div>').join('');
  return '<section class="acc"><button class="accBtn" type="button" aria-expanded="false"><span>'+esc(title)+'</span><span>+</span></button><div class="accBody">'+rows+'</div></section>';
}
function renderReader(){
  $('readerHeadline').textContent=surface?.headline||'Estado actual';
  $('readerLead').textContent=surface?.spoken_brief||surface?.preview_text||'';
  const options=arr(surface?.action_options);
  const notes=arr(state?.notes);
  let html='';
  html+=sectionRows('Qué cambió',surface?.what_changed);
  html+=sectionRows('Lectura actual',surface?.current_read);
  html+=sectionRows('Fricciones',surface?.frictions);
  html+=sectionRows('Preguntas abiertas',surface?.open_questions);
  html+=sectionRows('No hacer todavía',surface?.do_not_do_yet);
  html+=sectionRows('Opciones',options,(o)=>'<div class="accText"><b>'+esc(o?.label||o?.option_id||'Opción')+'</b>'+esc(o?.objective||o?.why_now||'')+(o?.why_now&&o?.objective?'<small>'+esc(o.why_now)+'</small>':'')+'</div>');
  html+=sectionRows('Memoria',notes,(n)=>'<div class="accText"><b>'+esc(n?.category||'Nota')+'</b>'+esc(n?.text||'')+(n?.created_at?'<small>'+esc(labelTime(n))+'</small>':'')+'</div>');
  $('readerSections').innerHTML=html||'<div class="readerEmpty">No hay bloques adicionales para esta lectura.</div>';
  for(const btn of $('readerSections').querySelectorAll('.accBtn')){
    btn.addEventListener('click',()=>{
      const acc=btn.closest('.acc'),open=!acc.classList.contains('open');
      for(const other of $('readerSections').querySelectorAll('.acc.open')){
        if(other!==acc){other.classList.remove('open');const b=other.querySelector('.accBtn');b.setAttribute('aria-expanded','false');b.lastElementChild.textContent='+'}
      }
      acc.classList.toggle('open',open);
      btn.setAttribute('aria-expanded',open?'true':'false');
      btn.lastElementChild.textContent=open?'−':'+';
    });
  }
}
function update(){
  $('time').textContent=labelTime(surface);
  $('dot').hidden=!surface||isHeard(surface);
  $('headline').textContent=surface?.headline||'Esperando una lectura estratégica.';
  renderReader();
  $('part').textContent=chunks.length?(Math.min(index+1,chunks.length)+' / '+chunks.length):'0 / 0';
  let p=0,c=chunks[index];
  if(c){
    let f=0;if(audio&&Number.isFinite(audio.duration)&&audio.duration>0)f=Math.max(0,Math.min(1,audio.currentTime/audio.duration));
    p=(c.start+(c.end-c.start)*f)/Math.max(1,text.length);
  }
  $('fill').style.width=(Math.max(0,Math.min(1,p))*100)+'%';
  setButton();
}
async function ensure(i){
  if(i<0||i>=chunks.length)return null;
  const c=clip(i);if(c.status==='ready')return c;
  if(c.promise)return c.promise;
  const my=epoch;
  c.promise=(async()=>{
    c.status='loading';$('status').textContent='preparando '+(i+1)+'/'+chunks.length;setButton();
    let r=await fetch(TTS+'?id='+encodeURIComponent(audioId(i)),{cache:'no-store'});
    if(r.status===404){
      r=await fetch(TTS,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messageId:audioId(i),text:chunks[i].text})});
    }
    if(!r.ok)throw new Error('TTS '+r.status);
    const b=await r.blob();if(my!==epoch)throw new Error('stale');if(b.size<1000)throw new Error('audio vacío');
    if(c.url)URL.revokeObjectURL(c.url);
    c.url=URL.createObjectURL(b);c.audio=new Audio(c.url);c.audio.preload='auto';c.status='ready';
    if(i===0&&!playing)$('status').textContent='listo';
    return c;
  })().catch(e=>{c.status='idle';c.promise=null;if(e.message!=='stale')$('status').textContent='reintentar';throw e});
  return c.promise;
}
async function start(){
  if(!chunks.length)return;
  intent=true;setButton();
  try{
    const c=await ensure(index);if(!intent||!c?.audio)return;
    audio=c.audio;
    audio.ontimeupdate=update;
    audio.onplay=()=>{playing=true;$('status').textContent='reproduciendo';setButton();ensure(index+1).catch(()=>{})};
    audio.onpause=()=>{if(!audio.ended){playing=false;$('status').textContent='pausado';setButton()}};
    audio.onended=()=>{advance()};
    await audio.play();
  }catch(e){intent=false;playing=false;$('status').textContent='tocá PLAY para reintentar';setButton()}
}
function advance(){
  if(index>=chunks.length-1){
    intent=false;playing=false;markHeard(surface);$('dot').hidden=true;$('fill').style.width='100%';$('status').textContent='escuchado';setButton();return;
  }
  index++;audio=null;playing=false;update();if(intent)start();
}
$('play').addEventListener('click',()=>{
  if(playing){intent=false;audio?.pause();return}
  start();
});
$('readerToggle').addEventListener('click',()=>{
  const root=$('widget'),open=!root.classList.contains('readerOpen');
  root.classList.toggle('readerOpen',open);
  $('reader').setAttribute('aria-hidden',open?'false':'true');
  $('readerToggle').setAttribute('aria-expanded',open?'true':'false');
  $('readerToggle').setAttribute('aria-label',open?'Cerrar texto completo':'Abrir texto completo');
  $('readerToggle').textContent=open?'×':'≡';
});
async function load(){
  try{
    const next=await rpc('prometeo_strategic_console_v2',{p_channel_key:CHANNEL});
    state=next;const s=choose(),key=msgId(s);
    if(key!==msgId(surface)){
      epoch++;intent=false;playing=false;try{audio?.pause()}catch{}
      for(const c of clips.values())if(c.url)try{URL.revokeObjectURL(c.url)}catch{}
      clips.clear();surface=s;text=norm(s?.spoken_brief||s?.preview_text||'');chunks=chunk(text);index=0;audio=null;
      $('status').textContent=chunks.length?'preparando':'sin mensaje';
      update();if(chunks.length)ensure(0).catch(()=>{});
    }else{surface=s;update()}
  }catch(e){$('status').textContent='reconectando'}
}
load();setInterval(load,8000);
})();
</script>
</body>
</html>
