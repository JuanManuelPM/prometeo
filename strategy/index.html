<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prometeo · Ahora</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif}
body{min-height:100vh}
main{width:min(760px,100%);margin:0 auto;padding:24px 18px 48px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:26px}
h1{font-size:20px;margin:0;font-weight:750}
small,.muted{opacity:.55}
section{border-top:1px solid #fff;padding:18px 0}
h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 12px}
#headline{font-size:26px;line-height:1.08;font-weight:800;margin:0 0 12px}
#brief{font-size:18px;line-height:1.45;white-space:pre-wrap}
button{font:inherit;border:1px solid #fff;background:#000;color:#fff;padding:12px 14px;cursor:pointer}
button.primary{background:#fff;color:#000;font-weight:750}
button:disabled{opacity:.35;cursor:default}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.note{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.15);font-size:14px;line-height:1.35}
.note:last-child{border-bottom:0}
.option{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.15)}
.option input{width:20px;height:20px;margin:2px 0 0}
.option b{display:block;margin-bottom:4px}
.option p{margin:0;line-height:1.35;opacity:.75}
.badge{display:inline-block;border:1px solid rgba(255,255,255,.5);font-size:11px;padding:2px 6px;margin-left:6px;vertical-align:2px}
#empty{padding:28px 0;font-size:18px;line-height:1.4}
#status{font-size:12px;opacity:.55}
#actionResult{margin-top:10px;font-size:13px}\n#audioStatus{font-size:12px;opacity:.58;align-self:center;min-height:1em}
ul{margin:8px 0 0 18px;padding:0}
li{margin:4px 0}
</style>
</head>
<body>
<main>
<header>
  <h1>PROMETEO · AHORA</h1>
  <div id="status">cargando…</div>
</header>

<section id="currentSection">
  <div id="empty">Esperando el primer brief estratégico.</div>
  <div id="current" hidden>
    <h2>Última lectura</h2>
    <div id="headline"></div>
    <div id="brief"></div>
    <div class="controls">
      <button id="play">▶ PLAY</button>
      <span id="audioStatus" role="status" aria-live="polite"></span>
    </div>
  </div>
</section>

<section>
  <h2>Notas acumuladas</h2>
  <div id="notes"></div>
</section>

<section id="optionsSection" hidden>
  <h2>¿Qué querés que Prometeo trabaje?</h2>
  <div id="options"></div>
  <div class="controls">
    <button id="ok" class="primary">OK</button>
  </div>
  <div id="actionResult"></div>
</section>

<section id="contextSection" hidden>
  <h2>Lectura corta</h2>
  <div id="read"></div>
</section>
</main>

<script>
(()=>{
'use strict';
const BASE='https://catnohyouxqjjtseaueb.supabase.co/rest/v1/rpc/';
const TTS='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/audio-lab-page-audio-v1';
const TTS_MAX=1700;
const KEY='sb_publishable_eqh3PngXs4UjLLWiY3pz1w_nhHtf7X-';
const HEAD={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const CHANNEL='PROMETEO_MAIN';
let state=null;
let audio=null,audioKey='',audioEpoch=null,audioIndex=0,audioPlan=[],audioUrls=[],audioInflight=new Map(),audioBusy=false;

const $=id=>document.getElementById(id);
async function rpc(name,args){
  const r=await fetch(BASE+name,{method:'POST',headers:HEAD,body:JSON.stringify(args),cache:'no-store'});
  if(!r.ok)throw new Error(name+' '+r.status);
  return await r.json();
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function arr(v){return Array.isArray(v)?v:[]}
function render(){
  const ch=state?.channel||{};
  const rw=state?.resident_workers||{};
  $('status').textContent=(ch.enabled?'activo':'en preparación')+' · workers '+(rw.sessions||0)+'/'+(ch.resident_workers_target||5);

  const notes=arr(state?.notes);
  $('notes').innerHTML=notes.length?notes.map(n=>'<div class="note"><b>'+esc(n.category)+'</b> · '+esc(n.text)+'</div>').join(''):'<div class="muted">Todavía no hay notas.</div>';

  const cur=state?.current;
  $('empty').hidden=!!cur;
  $('current').hidden=!cur;
  $('optionsSection').hidden=true;
  $('contextSection').hidden=true;
  if(!cur){syncAudio(null);return;}

  $('headline').textContent=cur.headline||'Estado actual';
  $('brief').textContent=cur.spoken_brief||'';
  syncAudio(cur);

  const read=arr(cur.current_read);
  const fr=arr(cur.frictions);
  if(read.length||fr.length){
    $('contextSection').hidden=false;
    $('read').innerHTML=
      (read.length?'<b>Ahora</b><ul>'+read.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+
      (fr.length?'<br><b>Fricciones</b><ul>'+fr.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'');
  }

  const opts=arr(cur.action_options);
  if(opts.length){
    $('optionsSection').hidden=false;
    const chosen=new Map(arr(state?.choices).map(x=>[x.option_id,x.selected]));
    $('options').innerHTML=opts.map(o=>{
      const id=esc(o.option_id);
      const checked=chosen.has(o.option_id)?chosen.get(o.option_id):false;
      const disabled=chosen.has(o.option_id)?' disabled':'';
      return '<label class="option"><input type="checkbox" data-option="'+id+'" '+(checked?'checked':'')+disabled+'><div><b>'+esc(o.label)+'<span class="badge">'+esc(o.perspective||'')+'</span></b><p>'+esc(o.why_now||o.objective||'')+'</p></div></label>';
    }).join('');
    const already=arr(state?.choices).length>0;
    $('ok').disabled=already;
    $('actionResult').textContent=already?'Selección publicada.':'';
  }
}
async function load(){
  try{
    state=await rpc('prometeo_strategic_console_v1',{p_channel_key:CHANNEL});
    render();
  }catch(e){
    $('status').textContent='reconectando';
  }
}
function hashText(s){
  let h=2166136261;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}
  return (h>>>0).toString(36);
}
function chunkSpeech(raw,max=TTS_MAX){
  let s=String(raw||'').replace(/\s+/g,' ').trim();
  const out=[];
  while(s.length>max){
    const w=s.slice(0,max+1);
    let cut=-1;
    for(const sep of ['. ','! ','? ','; ',': ',', ',' ']){
      const i=w.lastIndexOf(sep);
      if(i>=0)cut=Math.max(cut,i+sep.length-1);
    }
    if(cut<Math.floor(max*.55))cut=w.lastIndexOf(' ');
    if(cut<1)cut=max-1;
    out.push(s.slice(0,cut+1).trim());
    s=s.slice(cut+1).trim();
  }
  if(s)out.push(s);
  return out;
}
function cleanAudioId(s){return String(s||'').replace(/[^a-zA-Z0-9._:-]/g,'-').slice(0,112)}
function makeAudioPlan(cur){
  const text=String(cur?.spoken_brief||'').trim();
  if(!text)return[];
  const chunks=chunkSpeech(text);
  const existing=cleanAudioId(cur?.tts_message_id);
  const base=existing||cleanAudioId('strategic-'+(cur?.epoch_id||'current')+'-'+hashText(text));
  return chunks.map((text,i)=>({
    text,
    id:chunks.length===1?base:base.slice(0,82)+'-p'+(i+1)+'of'+chunks.length
  }));
}
function setAudioStatus(s){$('audioStatus').textContent=s||''}
function updateAudioButton(){
  const has=!!state?.current?.spoken_brief;
  if(!has){$('play').disabled=true;$('play').textContent='▶ PLAY';return}
  if(audioBusy){$('play').disabled=true;return}
  $('play').disabled=false;
  if(audio&&!audio.paused&&!audio.ended)$('play').textContent='❚❚ PAUSA';
  else if(audio&&audio.src&&audio.currentTime>0&&!audio.ended)$('play').textContent='▶ CONTINUAR';
  else $('play').textContent='▶ PLAY';
}
function stopAudio(){
  if(audio){
    audio.pause();
    audio.removeAttribute('src');
    try{audio.load()}catch{}
  }
}
function clearAudioUrls(){
  for(const u of audioUrls)if(u)URL.revokeObjectURL(u);
  audioUrls=[];
}
function resetAudio(){
  stopAudio();
  clearAudioUrls();
  audioInflight.clear();
  audioPlan=[];
  audioIndex=0;
  audioEpoch=null;
  audioBusy=false;
  setAudioStatus('');
}
function ensureAudioElement(){
  if(audio)return audio;
  audio=new Audio();
  audio.preload='metadata';
  audio.onplay=()=>{
    updateAudioButton();
    const n=audioPlan.length;
    setAudioStatus(n>1?'reproduciendo '+(audioIndex+1)+'/'+n:'reproduciendo');
    if(audioIndex+1<n)prepareChunk(audioIndex+1,true).catch(()=>{});
  };
  audio.onpause=()=>{if(!audio.ended)updateAudioButton()};
  audio.onended=()=>advanceAudio();
  audio.onerror=()=>{
    audioBusy=false;
    setAudioStatus('error de reproducción · reintentar');
    $('play').textContent='↻ REINTENTAR';
    $('play').disabled=false;
  };
  return audio;
}
function syncAudio(cur){
  const nextKey=cur?.spoken_brief?String(cur.epoch_id||'')+'|'+String(cur.tts_message_id||'')+'|'+hashText(String(cur.spoken_brief)):'';
  if(nextKey===audioKey){updateAudioButton();return}
  resetAudio();
  audioKey=nextKey;
  if(!cur?.spoken_brief){updateAudioButton();return}
  audioEpoch=cur.epoch_id;
  audioPlan=makeAudioPlan(cur);
  audioUrls=new Array(audioPlan.length).fill(null);
  updateAudioButton();
  warmCachedFirst().catch(()=>{});
}
async function fetchTimeout(url,options={},ms=8000){
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),ms);
  try{return await fetch(url,{...options,signal:ctrl.signal})}
  finally{clearTimeout(timer)}
}
async function responseBlob(r){
  const data=await r.arrayBuffer();
  if(data.byteLength<1000)throw new Error('audio vacío');
  const u=new Uint8Array(data);
  const raw=(r.headers.get('content-type')||'').toLowerCase().split(';')[0];
  let type=raw.startsWith('audio/')?raw:'';
  if(!type&&u[0]===0x52&&u[1]===0x49&&u[2]===0x46&&u[3]===0x46)type='audio/wav';
  if(!type&&u[0]===0x4f&&u[1]===0x67&&u[2]===0x67&&u[3]===0x53)type='audio/ogg';
  if(!type&&u[0]===0x49&&u[1]===0x44&&u[2]===0x33)type='audio/mpeg';
  if(!type&&u[0]===0xff&&(u[1]&0xe0)===0xe0)type='audio/mpeg';
  if(!type)throw new Error('respuesta no es audio');
  return new Blob([data],{type});
}
function rememberAudio(i,b){
  if(audioUrls[i])URL.revokeObjectURL(audioUrls[i]);
  const u=URL.createObjectURL(b);
  audioUrls[i]=u;
  return u;
}
async function getCached(i,background=false){
  const d=audioPlan[i];
  if(!d)return null;
  if(!background)setAudioStatus(audioPlan.length>1?'buscando cache '+(i+1)+'/'+audioPlan.length:'buscando cache');
  try{
    const r=await fetchTimeout(TTS+'?id='+encodeURIComponent(d.id),{cache:'no-store'},7000);
    if(r.status===404)return null;
    if(!r.ok)throw new Error('cache '+r.status);
    return rememberAudio(i,await responseBlob(r));
  }catch(e){
    if(e?.name==='AbortError')return null;
    throw e;
  }
}
async function generateChunk(i,background=false){
  const d=audioPlan[i];
  if(!d)throw new Error('parte inexistente');
  if(!background)setAudioStatus(audioPlan.length>1?'generando '+(i+1)+'/'+audioPlan.length:'generando audio');
  const prompt=state?.channel?.voice_prompt||'Speaker identity: Martín, 31, native Buenos Aires. Warm medium-low male voice, calm, intelligent, authentic Rioplatense Spanish, conversational, direct and analytical. Never Iberian and never announcer cadence.';
  const r=await fetchTimeout(TTS,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messageId:d.id,text:d.text,voicePrompt:prompt})
  },180000);
  if(!r.ok){
    let detail='';try{detail=(await r.text()).slice(0,160)}catch{}
    throw new Error('TTS '+r.status+(detail?' · '+detail:''));
  }
  return rememberAudio(i,await responseBlob(r));
}
async function prepareChunk(i,background=false){
  if(audioUrls[i])return audioUrls[i];
  const d=audioPlan[i];
  if(!d)throw new Error('parte inexistente');
  if(audioInflight.has(d.id))return await audioInflight.get(d.id);
  const p=(async()=>{
    const hit=await getCached(i,background);
    if(hit)return hit;
    return await generateChunk(i,background);
  })();
  audioInflight.set(d.id,p);
  try{return await p}
  finally{audioInflight.delete(d.id)}
}
async function warmCachedFirst(){
  if(!audioPlan.length||audioUrls[0])return;
  try{
    const u=await getCached(0,true);
    if(u&&audioIndex===0&&!audioBusy)setAudioStatus('audio en caché');
  }catch{}
}
async function startPrepared(i){
  const a=ensureAudioElement();
  audioIndex=i;
  const u=audioUrls[i]||await prepareChunk(i,false);
  if(a.src!==u){a.src=u;a.load()}
  try{
    await a.play();
  }catch(e){
    if(e?.name==='NotAllowedError'){
      setAudioStatus('audio listo · tocá PLAY');
      $('play').textContent='▶ PLAY';
      $('play').disabled=false;
      return;
    }
    throw e;
  }
}
async function advanceAudio(){
  if(audioIndex+1>=audioPlan.length){
    audioBusy=false;
    setAudioStatus('terminado');
    if(audio)audio.currentTime=0;
    updateAudioButton();
    return;
  }
  audioBusy=true;
  $('play').disabled=true;
  const next=audioIndex+1;
  setAudioStatus('preparando '+(next+1)+'/'+audioPlan.length);
  try{
    await prepareChunk(next,false);
    audioBusy=false;
    await startPrepared(next);
  }catch(e){
    audioBusy=false;
    setAudioStatus('audio no disponible · reintentar');
    $('play').textContent='↻ REINTENTAR';
    $('play').disabled=false;
  }
}
async function playCurrent(){
  const cur=state?.current;
  if(!cur?.spoken_brief)return;
  syncAudio(cur);
  const a=ensureAudioElement();
  if(!a.paused&&!a.ended){
    a.pause();
    updateAudioButton();
    setAudioStatus('pausado');
    return;
  }
  if(audioBusy)return;
  if(audioUrls[audioIndex]&&a.src===audioUrls[audioIndex]&&!a.ended){
    try{await a.play()}
    catch(e){if(e?.name!=='NotAllowedError')setAudioStatus('no se pudo reproducir · reintentar')}
    return;
  }
  audioBusy=true;
  $('play').disabled=true;
  $('play').textContent='…';
  try{
    await prepareChunk(audioIndex,false);
    audioBusy=false;
    await startPrepared(audioIndex);
  }catch(e){
    audioBusy=false;
    setAudioStatus('audio no disponible · reintentar');
    $('play').textContent='↻ REINTENTAR';
    $('play').disabled=false;
  }
}

async function apply(){
  const cur=state?.current;if(!cur)return;
  const ids=[...document.querySelectorAll('input[data-option]:checked')].map(x=>x.dataset.option);
  $('ok').disabled=true;$('actionResult').textContent='Publicando…';
  try{
    const r=await rpc('prometeo_strategic_apply_choices_v1',{
      p_channel_key:CHANNEL,p_epoch_id:cur.epoch_id,p_selected_option_ids:ids
    });
    if(r?.state!=='APPLIED')throw new Error(r?.reason||'apply');
    $('actionResult').textContent='Listo · '+r.selected_count+' trabajos publicados · '+r.discarded_count+' descartados.';
    await load();
  }catch(e){
    $('ok').disabled=false;$('actionResult').textContent='No se pudo publicar la selección.';
  }
}
$('play').addEventListener('click',playCurrent);
$('ok').addEventListener('click',apply);
load();
setInterval(load,8000);
})();
</script>
</body>
</html>
