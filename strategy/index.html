<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prometeo · Ahora</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif}
body{min-height:100vh}
main{width:min(760px,100%);margin:0 auto;padding:24px 18px 48px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:26px}
h1{font-size:20px;margin:0;font-weight:750}
small,.muted{opacity:.55}
section{border-top:1px solid #fff;padding:18px 0}
h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 12px}
#headline{font-size:26px;line-height:1.08;font-weight:800;margin:0 0 12px}
#brief{font-size:18px;line-height:1.45;white-space:pre-wrap}
button{font:inherit;border:1px solid #fff;background:#000;color:#fff;padding:12px 14px;cursor:pointer}
button.primary{background:#fff;color:#000;font-weight:750}
button:disabled{opacity:.35;cursor:default}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.note{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.15);font-size:14px;line-height:1.35}
.note:last-child{border-bottom:0}
.option{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.15)}
.option input{width:20px;height:20px;margin:2px 0 0}
.option b{display:block;margin-bottom:4px}
.option p{margin:0;line-height:1.35;opacity:.75}
.badge{display:inline-block;border:1px solid rgba(255,255,255,.5);font-size:11px;padding:2px 6px;margin-left:6px;vertical-align:2px}
#empty{padding:28px 0;font-size:18px;line-height:1.4}
#status{font-size:12px;opacity:.55}
#actionResult{margin-top:10px;font-size:13px}\n#audioStatus{font-size:12px;opacity:.58;align-self:center;min-height:1em}
ul{margin:8px 0 0 18px;padding:0}
li{margin:4px 0}

.audioProgress{position:relative;height:6px;margin-top:10px;border-top:1px solid rgba(255,255,255,.35);border-bottom:1px solid rgba(255,255,255,.35)}
.audioProgress>i{display:block;width:0;height:100%;background:#fff;transition:width .12s linear}
.audioMeta{display:flex;justify-content:space-between;margin-top:5px;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.55}
</style>
</head>
<body>
<main>
<header>
  <h1>PROMETEO · AHORA</h1>
  <div id="status">cargando…</div>
</header>

<section id="currentSection">
  <div id="empty">Esperando el primer brief estratégico.</div>
  <div id="current" hidden>
    <h2>Última lectura</h2>
    <div id="headline"></div>
    <div id="brief"></div>
    <div class="controls">
      <button id="play">▶ PLAY</button>
      <span id="audioStatus" role="status" aria-live="polite"></span>
    </div>
    <div class="audioProgress" aria-hidden="true"><i id="audioFill"></i></div>
    <div class="audioMeta"><span id="audioPart">0 / 0</span><span id="audioPct">0%</span></div>
  </div>
</section>

<section>
  <h2>Notas acumuladas</h2>
  <div id="notes"></div>
</section>

<section id="optionsSection" hidden>
  <h2>¿Qué querés que Prometeo trabaje?</h2>
  <div id="options"></div>
  <div class="controls">
    <button id="ok" class="primary">OK</button>
  </div>
  <div id="actionResult"></div>
</section>

<section id="contextSection" hidden>
  <h2>Lectura corta</h2>
  <div id="read"></div>
</section>
</main>

<script>
(()=>{
'use strict';
const BASE='https://catnohyouxqjjtseaueb.supabase.co/rest/v1/rpc/';
const TTS='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/modelos-room-audio-v2';
const TTS_MAX=500;
const FIRST_AUDIO_CHARS=220;
const AHEAD=5;
const WORKERS=2;
const POST_MIN_GAP=3500;
const AUDIO_CACHE_VERSION='prometeo-strategy-voice-v3';
const KEY='sb_publishable_eqh3PngXs4UjLLWiY3pz1w_nhHtf7X-';
const HEAD={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const CHANNEL='PROMETEO_MAIN';
let state=null;
let audioKey='',audioEpoch=0,audioText='',audioChunks=[],audioTotalChars=1,audioIndex=0,audioIntent=false,audioPlaying=false,audio=null,audioPendingFraction=0,audioQueue=[],audioActiveJobs=0,audioLastPost=0,audioPostGate=Promise.resolve(),audioClips=new Map(),audioControllers=new Set();

const $=id=>document.getElementById(id);
async function rpc(name,args){
  const r=await fetch(BASE+name,{method:'POST',headers:HEAD,body:JSON.stringify(args),cache:'no-store'});
  if(!r.ok)throw new Error(name+' '+r.status);
  return await r.json();
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function arr(v){return Array.isArray(v)?v:[]}
function surfaceTime(v){const t=Date.parse(v?.generated_at||'');return Number.isFinite(t)?t:0}
function strategicSurface(){
  const p=state?.preview||null,f=state?.firm||null;
  if(p&&(!f||!f.is_high_firm||surfaceTime(p)>surfaceTime(f)))return p;
  return f||p||null;
}
function strategicAudioSurface(){
  const p=state?.preview||null,f=state?.firm||null;
  if(p&&(!f||surfaceTime(p)>surfaceTime(f))){
    return {
      ...p,
      spoken_brief:p.preview_text||'',
      tts_message_id:'strategic-preview-'+String(p.epoch_id||'current')
    };
  }
  return f||null;
}
function render(){
  const ch=state?.channel||{};
  const lw=state?.light_workers||{},hw=state?.high_workers||{};
  $('status').textContent=(ch.enabled?'activo':'en preparación')+' · light '+(lw.sessions||0)+'/'+(ch.resident_workers_target||5)+' · high '+(hw.sessions||0);

  const notes=arr(state?.notes);
  $('notes').innerHTML=notes.length?notes.map(n=>'<div class="note"><b>'+esc(n.category)+'</b> · '+esc(n.text)+'</div>').join(''):'<div class="muted">Todavía no hay notas.</div>';

  const cur=strategicSurface();
  $('empty').hidden=!!cur;
  $('current').hidden=!cur;
  $('optionsSection').hidden=true;
  $('contextSection').hidden=true;
  if(!cur){syncAudio(null);return;}

  $('headline').textContent=cur.headline||'Estado actual';
  $('brief').textContent=cur.preview_text||cur.spoken_brief||'';
  syncAudio(strategicAudioSurface());

  const read=arr(cur.current_read);
  const fr=arr(cur.frictions);
  if(read.length||fr.length){
    $('contextSection').hidden=false;
    $('read').innerHTML=
      (read.length?'<b>Ahora</b><ul>'+read.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+
      (fr.length?'<br><b>Fricciones</b><ul>'+fr.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'');
  }

  const opts=arr(cur.action_options);
  if(opts.length){
    $('optionsSection').hidden=false;
    const epochChoices=arr(state?.choices).filter(x=>String(x.epoch_id)===String(cur.epoch_id));
    const chosen=new Map(epochChoices.map(x=>[x.option_id,x.selected]));
    $('options').innerHTML=opts.map(o=>{
      const id=esc(o.option_id);
      const checked=chosen.has(o.option_id)?chosen.get(o.option_id):false;
      const disabled=chosen.has(o.option_id)?' disabled':'';
      return '<label class="option"><input type="checkbox" data-option="'+id+'" '+(checked?'checked':'')+disabled+'><div><b>'+esc(o.label)+'<span class="badge">'+esc(o.perspective||'')+'</span></b><p>'+esc(o.why_now||o.objective||'')+'</p></div></label>';
    }).join('');
    const already=epochChoices.length>0;
    $('ok').disabled=already;
    $('actionResult').textContent=already?'Selección publicada.':'';
  }
}
async function load(){
  try{
    state=await rpc('prometeo_strategic_console_v2',{p_channel_key:CHANNEL});
    render();
  }catch(e){
    $('status').textContent='reconectando';
  }
}
function hashText(s){
  let h=2166136261;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}
  return (h>>>0).toString(36);
}
function normalizeAudioText(raw){return String(raw||'').replace(/\s+/g,' ').trim()}
function chunkAudioText(raw,max=TTS_MAX){
  let s=normalizeAudioText(raw),offset=0;
  const out=[];
  while(s.length){
    const limit=out.length===0?FIRST_AUDIO_CHARS:max;
    if(s.length<=limit){out.push({text:s,start:offset,end:offset+s.length});break}
    const window=s.slice(0,limit+1);
    let cut=-1;
    for(const sep of ['. ','! ','? ','; ',': ',', ',' ']){
      const i=window.lastIndexOf(sep);
      if(i>=Math.floor(limit*.55))cut=Math.max(cut,i+sep.length-1);
    }
    if(cut<1)cut=window.lastIndexOf(' ');
    if(cut<1)cut=limit-1;
    const part=s.slice(0,cut+1).trim();
    out.push({text:part,start:offset,end:offset+part.length});
    const consumed=s.slice(0,cut+1).length;
    s=s.slice(cut+1).trimStart();
    offset+=consumed;
    while(offset<audioText.length&&/\s/.test(audioText[offset]))offset++;
  }
  return out;
}
function cleanAudioId(s){return String(s||'').replace(/[^a-zA-Z0-9._:-]/g,'-').slice(0,82)}
function currentVoicePrompt(){
  return String(state?.channel?.voice_prompt||'Voz masculina adulta, español rioplatense natural, tono directo, calmo, preciso y analítico. Nada de tono de tráiler ni entusiasmo artificial.').replace(/\s+/g,' ').trim().slice(0,900);
}
function audioMessageId(i){
  const c=audioChunks[i];
  const src=strategicAudioSurface();
  const base=cleanAudioId(src?.tts_message_id||src?.epoch_id||'current');
  return AUDIO_CACHE_VERSION+'-'+base+'-'+(i+1)+'-'+hashText(currentVoicePrompt()+'|'+c.text);
}
function audioClip(i){
  if(!audioClips.has(i))audioClips.set(i,{status:'idle',audio:null,url:null,attempts:0,cache:null,error:null});
  return audioClips.get(i);
}
function setAudioStatus(s){$('audioStatus').textContent=s||''}
function updateAudioProgress(){
  let p=0;
  const c=audioChunks[audioIndex];
  if(c){
    let f=audioPendingFraction||0;
    if(audio&&Number.isFinite(audio.duration)&&audio.duration>0)f=Math.max(0,Math.min(1,audio.currentTime/audio.duration));
    p=(c.start+(c.end-c.start)*f)/Math.max(1,audioTotalChars);
  }
  p=Math.max(0,Math.min(1,p));
  const fill=$('audioFill'),part=$('audioPart'),pct=$('audioPct');
  if(fill)fill.style.width=(p*100)+'%';
  if(part)part.textContent=audioChunks.length?(Math.min(audioIndex+1,audioChunks.length)+' / '+audioChunks.length):'0 / 0';
  if(pct)pct.textContent=Math.round(p*100)+'%';
  updateAudioButton();
}
function updateAudioButton(){
  const b=$('play');
  const has=audioChunks.length>0;
  b.disabled=!has;
  if(!has)b.textContent='▶ PLAY';
  else if(audioPlaying)b.textContent='❚❚ PAUSA';
  else if(audioIntent)b.textContent='…';
  else if(audio&&audio.currentTime>0&&!audio.ended)b.textContent='▶ CONTINUAR';
  else b.textContent='▶ PLAY';
}
function stopActiveAudio(){
  audioIntent=false;
  audioPlaying=false;
  if(audio){try{audio.pause()}catch{}}
  audio=null;
}
function disposeAudioClips(){
  for(const c of audioClips.values()){
    try{c.audio?.pause()}catch{}
    if(c.url)try{URL.revokeObjectURL(c.url)}catch{}
  }
  audioClips.clear();
}
function abortAudioJobs(){
  for(const ctrl of audioControllers){try{ctrl.abort()}catch{}}
  audioControllers.clear();
}
function resetAudio(){
  audioEpoch++;
  stopActiveAudio();
  abortAudioJobs();
  audioQueue=[];
  audioPendingFraction=0;
  audioIndex=0;
  disposeAudioClips();
  audioText='';
  audioChunks=[];
  audioTotalChars=1;
  setAudioStatus('');
  updateAudioProgress();
}
function syncAudio(cur){
  const nextText=normalizeAudioText(cur?.spoken_brief||'');
  const prompt=String(state?.channel?.voice_prompt||'');
  const nextKey=nextText?(String(cur?.epoch_id||'')+'|'+String(cur?.tts_message_id||'')+'|'+hashText(nextText)+'|'+hashText(prompt)):'';
  if(nextKey===audioKey){updateAudioProgress();return}
  resetAudio();
  audioKey=nextKey;
  if(!nextText)return;
  audioText=nextText;
  audioChunks=chunkAudioText(audioText);
  audioTotalChars=Math.max(1,audioText.length);
  setAudioStatus('preparando primer audio…');
  ensureAudio(0,true);
  updateAudioProgress();
}
function ensureAudio(i,priority=false){
  if(i<0||i>=audioChunks.length)return;
  const c=audioClip(i);
  if(['ready','queued','checking','generating','retrying'].includes(c.status))return;
  c.status='queued';
  const job={i,epoch:audioEpoch};
  priority?audioQueue.unshift(job):audioQueue.push(job);
  pumpAudio();
}
function maintainAudioBuffer(){
  for(let i=audioIndex;i<Math.min(audioChunks.length,audioIndex+AHEAD);i++)ensureAudio(i,i===audioIndex);
}
async function pumpAudio(){
  while(audioActiveJobs<WORKERS&&audioQueue.length){
    const job=audioQueue.shift();
    audioActiveJobs++;
    loadAudioClip(job).finally(()=>{audioActiveJobs--;pumpAudio()});
  }
}
async function reserveAudioPost(jobEpoch){
  let release;
  const mine=new Promise(r=>release=r);
  const previous=audioPostGate;
  audioPostGate=mine;
  await previous;
  if(jobEpoch!==audioEpoch){release();return false}
  const wait=Math.max(0,POST_MIN_GAP-(Date.now()-audioLastPost));
  if(wait)await new Promise(r=>setTimeout(r,wait));
  if(jobEpoch!==audioEpoch){release();return false}
  audioLastPost=Date.now();
  release();
  return true;
}
async function fetchCachedAudio(id,signal){
  const r=await fetch(TTS+'?id='+encodeURIComponent(id),{cache:'no-store',signal});
  if(r.status===404)return null;
  if(!r.ok)throw new Error('cache '+r.status);
  return r;
}
async function generateAudio(id,text,signal,jobEpoch){
  if(!await reserveAudioPost(jobEpoch))throw new Error('stale');
  const r=await fetch(TTS,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messageId:id,text,voicePrompt:currentVoicePrompt()}),
    signal
  });
  if(r.status===429){const e=new Error('rate_limit');e.status=429;throw e}
  if(!r.ok){
    let detail='';try{detail=(await r.text()).slice(0,140)}catch{}
    throw new Error('TTS '+r.status+(detail?' · '+detail:''));
  }
  return r;
}
async function acceptAudio(job,c,response){
  if(job.epoch!==audioEpoch)return;
  const blob=await response.blob();
  if(job.epoch!==audioEpoch)return;
  if(blob.size<1000)throw new Error('audio vacío');
  if(c.url)try{URL.revokeObjectURL(c.url)}catch{}
  c.url=URL.createObjectURL(blob);
  c.audio=new Audio(c.url);
  c.audio.preload='auto';
  c.status='ready';
  c.error=null;
  c.cache=response.headers.get('x-modelos-cache')||'?';
  if(job.i===0)setTimeout(()=>maintainAudioBuffer(),0);
  c.audio.addEventListener('error',()=>{
    if(job.epoch!==audioEpoch)return;
    c.status='idle';c.error='media_error';
    if(job.i===audioIndex&&audioIntent)ensureAudio(job.i,true);
  },{once:true});
  if(job.i===audioIndex&&!audioIntent&&!audioPlaying){
    setAudioStatus(audioChunks.length===1?'voz lista · tocá PLAY':'voz lista · '+(job.i+1)+'/'+audioChunks.length+' · tocá PLAY');
  }
  updateAudioProgress();
  if(job.i===audioIndex&&audioIntent&&!audioPlaying)startCurrentAudio();
}
async function loadAudioClip(job){
  if(job.epoch!==audioEpoch)return;
  const c=audioClip(job.i),chunk=audioChunks[job.i];
  if(!chunk)return;
  const id=audioMessageId(job.i);
  const ctrl=new AbortController();
  audioControllers.add(ctrl);
  c.status='checking';
  try{
    try{
      const cached=await fetchCachedAudio(id,ctrl.signal);
      if(job.epoch!==audioEpoch)return;
      if(cached){await acceptAudio(job,c,cached);return}
    }catch(e){
      if(job.epoch!==audioEpoch||e?.name==='AbortError')return;
    }
    for(;;){
      if(job.epoch!==audioEpoch)return;
      c.status=c.attempts?'retrying':'generating';
      c.attempts++;
      if(job.i===audioIndex)setAudioStatus('generando voz '+(job.i+1)+'/'+audioChunks.length+'…');
      try{
        const response=await generateAudio(id,chunk.text,ctrl.signal,job.epoch);
        if(job.epoch!==audioEpoch)return;
        await acceptAudio(job,c,response);
        return;
      }catch(e){
        if(job.epoch!==audioEpoch||e?.name==='AbortError'||e?.message==='stale')return;
        c.error=e.message;
        if(e.status===429)await new Promise(r=>setTimeout(r,12000));
        else await new Promise(r=>setTimeout(r,Math.min(45000,4000+c.attempts*5000)));
      }
    }
  }finally{
    audioControllers.delete(ctrl);
  }
}
function bindCurrentAudio(a,i,boundEpoch){
  a.ontimeupdate=()=>{
    if(audioEpoch!==boundEpoch||audioIndex!==i||audio!==a)return;
    updateAudioProgress();
    if(Number.isFinite(a.duration)&&a.duration-a.currentTime<15)maintainAudioBuffer();
  };
  a.onplay=()=>{
    if(audioEpoch!==boundEpoch||audioIndex!==i||audio!==a)return;
    audioPlaying=true;
    setAudioStatus('reproduciendo '+(i+1)+'/'+audioChunks.length);
    maintainAudioBuffer();
    updateAudioProgress();
  };
  a.onpause=()=>{
    if(audioEpoch!==boundEpoch||audioIndex!==i||audio!==a)return;
    if(!a.ended)audioPlaying=false;
    updateAudioProgress();
  };
  a.onended=()=>{
    if(audioEpoch!==boundEpoch||audioIndex!==i||audio!==a)return;
    advanceAudio();
  };
}
function startCurrentAudio(){
  if(!audioIntent||!audioChunks.length)return;
  const i=audioIndex,c=audioClip(i);
  if(c.status!=='ready'||!c.audio){
    ensureAudio(i,true);
    maintainAudioBuffer();
    setAudioStatus('preparando voz '+(i+1)+'/'+audioChunks.length+'…');
    updateAudioProgress();
    return;
  }
  audio=c.audio;
  bindCurrentAudio(audio,i,audioEpoch);
  const begin=async()=>{
    if(!audioIntent||audio!==c.audio||i!==audioIndex)return;
    if(audioPendingFraction&&Number.isFinite(audio.duration)){
      try{audio.currentTime=(audio.duration||0)*Math.max(0,Math.min(1,audioPendingFraction))}catch{}
      audioPendingFraction=0;
    }
    try{
      await audio.play();
    }catch(e){
      audioPlaying=false;
      audioIntent=false;
      setAudioStatus(e?.name==='NotAllowedError'?'voz lista · tocá PLAY nuevamente':'no se pudo reproducir · tocá PLAY para reintentar');
      updateAudioProgress();
    }
  };
  if(Number.isFinite(audio.duration))begin();
  else audio.addEventListener('loadedmetadata',begin,{once:true});
}
function playCurrent(){
  if(!audioChunks.length)return;
  if(audioPlaying){
    audioIntent=false;
    try{audio?.pause()}catch{}
    setAudioStatus('pausado');
    updateAudioProgress();
    return;
  }
  audioIntent=true;
  startCurrentAudio();
  updateAudioProgress();
}
function advanceAudio(){
  const c=audioChunks[audioIndex];
  if(c)audioPendingFraction=1;
  if(audioIndex>=audioChunks.length-1){
    audioIntent=false;
    audioPlaying=false;
    audioPendingFraction=0;
    setAudioStatus('terminado');
    const fill=$('audioFill'),pct=$('audioPct');
    if(fill)fill.style.width='100%';
    if(pct)pct.textContent='100%';
    updateAudioButton();
    return;
  }
  audioIndex++;
  audioPendingFraction=0;
  audio=null;
  audioPlaying=false;
  maintainAudioBuffer();
  if(audioIntent)startCurrentAudio();
  updateAudioProgress();
}

async function apply(){
  const cur=strategicSurface();if(!cur)return;
  const ids=[...document.querySelectorAll('input[data-option]:checked')].map(x=>x.dataset.option);
  $('ok').disabled=true;$('actionResult').textContent='Publicando…';
  try{
    const r=await rpc('prometeo_strategic_apply_choices_v2',{
      p_channel_key:CHANNEL,p_epoch_id:cur.epoch_id,p_selected_option_ids:ids
    });
    if(r?.state==='STALE'&&r?.reason==='OPTION_SOURCE_CHANGED'){
      await load();
      throw new Error('source_changed');
    }
    if(r?.state!=='APPLIED')throw new Error(r?.reason||'apply');
    $('actionResult').textContent='Listo · '+r.selected_count+' seleccionados · '+(r.new_jobs_count||0)+' trabajos nuevos.';
    await load();
  }catch(e){
    $('ok').disabled=false;
    $('actionResult').textContent=e?.message==='source_changed'?'La lectura cambió. Revisá las opciones actualizadas y tocá OK de nuevo.':'No se pudo publicar la selección.';
  }
}
$('play').addEventListener('click',playCurrent);
$('ok').addEventListener('click',apply);
load();
setInterval(load,8000);
})();
</script>
</body>
</html>
