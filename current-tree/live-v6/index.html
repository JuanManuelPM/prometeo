<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Prometeo · Live State V6</title>
<style>
:root{
 --bg:#08090b;--ink:#f2f1eb;--muted:#858d98;--line:#282d34;--line2:#1e2228;
 --panel:#101216;--warn:#d5aa55;--bad:#e87d7d;--good:#91d39f;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}button{font:inherit;color:inherit}
.shell{max-width:980px;margin:auto}
.top{position:sticky;top:0;z-index:30;background:rgba(8,9,11,.97);border-bottom:1px solid var(--line2);backdrop-filter:blur(10px)}
.topin{padding:11px 14px 9px}
.head{display:flex;justify-content:space-between;gap:12px;align-items:center}
.head b{font-size:13px;letter-spacing:.08em}.head span{font-size:9px;color:var(--muted);white-space:nowrap}
.freshness{display:none;margin-top:7px;padding:7px 9px;border:1px solid #463c28;border-radius:8px;background:#15120c;color:#c9ad70;font-size:8px;line-height:1.4}
.freshness.on{display:flex;align-items:center;justify-content:space-between;gap:9px}.freshness.live{border-color:#294333;background:#0d1510;color:#91d39f}
.freshness button{border:1px solid currentColor;background:transparent;border-radius:6px;padding:4px 7px;font-size:8px;cursor:pointer;white-space:nowrap}
.tabs{display:flex;gap:4px;margin-top:9px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:var(--muted);padding:7px 10px;border-radius:8px;font-size:10px;white-space:nowrap;cursor:pointer}
.tab.on{background:#15181d;color:var(--ink)}
.main{padding:17px 14px 72px}
.view{display:none}.view.on{display:block}
.kicker{font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(28px,7vw,46px);line-height:.98;letter-spacing:-.055em;margin:5px 0 18px}

/* STATE */
.section{margin-top:23px}.section:first-of-type{margin-top:0}
.section-title{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#8f97a1;padding-bottom:7px;border-bottom:1px solid var(--line)}
.statecard{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 14px;background:#0b0d10}
.statecard-title{font-size:19px;font-weight:820;letter-spacing:-.035em;padding:13px 13px 10px;border-bottom:1px solid var(--line)}
.statecard .row,.statecard .primary{padding-left:13px;padding-right:13px}
.moreblock{border-top:1px solid var(--line2)}
.moreblock>summary{list-style:none;cursor:pointer;padding:10px 13px;font-size:9px;color:#8e96a0}
.moreblock>summary::-webkit-details-marker{display:none}
.moreblock>summary::after{content:" ↓";color:#626a75}
.moreblock[open]>summary::after{content:" ↑"}
.moreblock .row:last-child{border-bottom:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:11px 0;border-bottom:1px solid var(--line2)}
.rtitle{font-size:13px;font-weight:720;line-height:1.2}
.rdesc{font-size:9px;color:var(--muted);line-height:1.45;margin-top:4px;max-width:680px}
.rmeta{font-size:8px;color:#757e89;white-space:nowrap;padding-top:2px}
.rmeta.warn{color:var(--warn)}
.rmeta.bad{color:var(--bad)}
.primary{padding:13px 0 14px;border-bottom:1px solid var(--line2)}
.primary .rtitle{font-size:18px;letter-spacing:-.03em}
.primary .rdesc{font-size:10px}
.nextline{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;color:#9ca4ae;font-size:8px}

/* structure at bottom */
.structure{margin-top:28px}
.structure details{border-bottom:1px solid var(--line2)}
.structure>details:first-child{border-top:1px solid var(--line2)}
.structure summary{list-style:none;cursor:pointer}.structure summary::-webkit-details-marker{display:none}
.srow{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:51px;padding:7px 0}
.chev{color:#707984;font-size:15px;transition:transform .12s}.structure details[open]>.srow .chev{transform:rotate(90deg)}
.sname{font-size:11px;font-weight:650}.ssub{font-size:8px;color:#747d88;margin-top:3px}
.branch{margin-left:22px;padding-left:17px;border-left:1px solid #2d3239}
.branch .leaf{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--line2)}
.branch .leaf:last-child{border-bottom:0}
.branch .leaf:before{content:"";position:absolute;left:-17px;top:20px;width:12px;border-top:1px solid #2d3239}
.branch .leaf:last-child:after{content:"";position:absolute;left:-18px;top:21px;bottom:-1px;width:3px;background:var(--bg)}
.lname{font-size:10px}.lsub{font-size:8px;color:#747d88;margin-top:3px}
.state{font-size:8px;color:#7f8792}.state.stale{color:var(--warn)}.state.legacy{color:#666e78}

/* history */
.time-direction{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:18px;font-size:8px;color:#7e8792;letter-spacing:.08em;text-transform:uppercase}
.time-direction b{color:#d7d9d5;font-size:9px}
.timeline{position:relative;margin-left:7px;padding-left:24px}
.timeline:before{content:"";position:absolute;left:6px;top:0;bottom:0;border-left:1px solid #353b43}
.day{margin:0 0 22px}
.dayhead{position:relative;font-size:11px;font-weight:760;letter-spacing:-.01em;color:#d9dad5;padding:0 0 9px}
.dayhead:before{content:"";position:absolute;left:-22px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:1px solid #7a828d}
.event{position:relative;padding:9px 0 11px;border-top:1px solid var(--line2)}
.event:before{content:"";position:absolute;left:-20px;top:16px;width:14px;border-top:1px solid #353b43}
.eventline{display:grid;grid-template-columns:45px minmax(0,1fr) auto;gap:9px;align-items:start}
.eventtime{font-size:9px;color:#7f8792;font-variant-numeric:tabular-nums;padding-top:1px}
.event .rtitle{font-size:12px}
.past-marker{margin-left:-24px;padding:10px 0 0 24px;border-top:1px solid var(--line);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:#666e78}


/* HISTORY DATA */
.history-controls{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin:0 0 10px}
.history-controls::-webkit-scrollbar{display:none}
.hmetric{border:1px solid var(--line);background:transparent;color:#7f8792;border-radius:999px;padding:6px 9px;font-size:8px;white-space:nowrap;cursor:pointer}
.hmetric.on{background:#171a20;color:#ecece7;border-color:#3b424b}
.history-layout{display:grid;gap:16px}
.history-chartbox{border:1px solid var(--line);border-radius:12px;background:#0b0d10;padding:10px;overflow:hidden}
.history-charthead{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:6px}
.history-charttitle{font-size:12px;font-weight:720}.history-chartsub{font-size:8px;color:#737b85}
#historychart{width:100%;height:auto;display:block;overflow:visible}
.chart-grid{stroke:#232831;stroke-width:1;vector-effect:non-scaling-stroke}
.chart-line{fill:none;stroke:#d7d9d4;stroke-width:2;vector-effect:non-scaling-stroke}
.chart-line.alt{stroke:#777f89;stroke-width:1.5}
.chart-dot{fill:#090a0c;stroke:#d7d9d4;stroke-width:1.5;vector-effect:non-scaling-stroke}
.chart-dot.alt{stroke:#777f89}
.chart-label{font-size:9px;fill:#737b85}.chart-value{font-size:8px;fill:#9ea5ae}
.chart-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;font-size:8px;color:#828a94}
.chart-legend span:before{content:"";display:inline-block;width:10px;border-top:2px solid #d7d9d4;margin-right:5px;vertical-align:middle}
.chart-legend span.alt:before{border-color:#777f89}
.daystats{display:flex;gap:8px;flex-wrap:wrap;font-size:8px;color:#79818c;margin:-3px 0 8px}
.partial{color:var(--warn)}
.history-empty{font-size:9px;color:#6d7580;padding:12px 0}
@media(min-width:760px){
 .history-layout{grid-template-columns:minmax(0,1fr) 330px;grid-template-areas:"timeline chart";align-items:start}
 .history-timeline-pane{grid-area:timeline}
 .history-stats-pane{grid-area:chart;position:sticky;top:115px}
}

/* WORK CONTEXTS */
.context-summary{display:flex;gap:10px;flex-wrap:wrap;margin:-5px 0 14px;font-size:8px;color:#7d8590}
.context-list{border-top:1px solid var(--line)}
.context{padding:12px 0;border-bottom:1px solid var(--line)}
.context-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.context-title{font-size:13px;font-weight:720}.context-kind{font-size:8px;color:#727a85;text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.context-status{font-size:8px;color:#838b95}.context-status.active{color:var(--good)}.context-status.stale{color:var(--warn)}
.context-desc{font-size:9px;color:#9ba2ab;line-height:1.45;margin-top:6px}
.context-next{font-size:9px;color:#7f8792;line-height:1.45;margin-top:5px}
.context-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px;font-size:8px;color:#69727d}
.context a{color:#b8bec6;text-decoration:none;border-bottom:1px solid #434a53}
.context-empty{border:1px dashed var(--line);border-radius:10px;padding:12px;font-size:9px;color:#727a85}

/* ORGANISM */
.orgwrap{position:relative;height:calc(100vh - 145px);min-height:560px;border-top:1px solid var(--line2);margin:0 -14px -72px;overflow:hidden}
#orgsvg{width:100%;height:100%;display:block;touch-action:none}
.edge{fill:none;stroke:#31363e;stroke-width:1.3;vector-effect:non-scaling-stroke;opacity:.8}
.edge.impact{stroke:#d4d8da;stroke-width:2;opacity:1}
.edge.stale{stroke:#675735;stroke-dasharray:4 5}
.node{cursor:pointer}
.node .halo{fill:none;stroke:#2a2f36;stroke-width:1;opacity:.5}
.node .core{fill:#0a0c0f;stroke:#8a929b;stroke-width:1.25}
.node.fresh .core{stroke:#e1e4df}
.node.stale .core{stroke:#c6a255;stroke-dasharray:3 4}
.node.legacy .core{stroke:#626a74;stroke-dasharray:2 5}
.node.impact .core{stroke:#f2f1eb;stroke-width:2.3}
.node text{pointer-events:none;text-anchor:middle}
.node .nemoji{font-size:27px;dominant-baseline:middle;text-anchor:middle}
.node .nname{font-size:12px;font-weight:720;fill:#e3e4df}
.node .nage{font-size:8px;fill:#727b86}
.node .expanddot circle{fill:#11141a;stroke:#69727c;stroke-width:1}
.node .expanddot text{font-size:12px;font-weight:800;fill:#c5cad0;dominant-baseline:middle;text-anchor:middle}
.node.stale .nage{fill:#ad945b}
.node.legacy .nname,.node.legacy .nage{fill:#6e7680}
.orgtools{position:absolute;left:10px;top:10px;display:flex;gap:4px;z-index:4}
.orgbtn{border:1px solid #2e343c;background:rgba(12,14,17,.9);border-radius:7px;padding:6px 8px;font-size:8px;color:#929aa4}
.orgbtn.on{color:#eee;background:#171a20}
.zoom{position:absolute;right:10px;top:10px;display:flex;gap:4px;z-index:4}
.orgcoverage{position:absolute;left:10px;bottom:10px;z-index:3;font-size:8px;color:#7d8590;background:rgba(8,9,11,.78);padding:5px 7px;border-radius:7px;pointer-events:none}
.infopanel{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(13,15,18,.97);border:1px solid #30353d;border-radius:12px;padding:11px;transform:translateY(calc(100% + 20px));transition:transform .16s ease;z-index:5}
.infopanel.on{transform:translateY(0)}
.iphead{display:flex;justify-content:space-between;gap:10px}.ipname{font-size:15px;font-weight:760}.ipclose{border:0;background:transparent;color:#7e8792;font-size:18px}
.ipmeta{font-size:8px;color:#7e8792;margin-top:2px}.ipdesc{font-size:9px;color:#b0b6bd;line-height:1.45;margin-top:8px}
.impactbox{margin-top:9px;border-top:1px solid var(--line);padding-top:8px}
.impacttitle{font-size:7px;color:#737b85;text-transform:uppercase;letter-spacing:.11em}
.impactlist{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.impactpill{font-size:8px;border:1px solid #303640;border-radius:999px;padding:4px 6px;color:#aeb4bb}
.empty{font-size:8px;color:#646c76;margin-top:5px}

@media(min-width:760px){
 .topin,.main{padding-left:22px;padding-right:22px}
 .orgwrap{margin-left:-22px;margin-right:-22px}
 .infopanel{left:auto;right:16px;bottom:16px;width:355px}
}
</style>
</head>
<body>
<div class="shell">
<header class="top">
 <div class="topin">
  <div class="head"><b>PROMETEO</b><span id="stamp">cargando</span></div>
  <div class="freshness" id="freshness"><span id="freshnessText"></span><button id="freshnessRetry">actualizar</button></div>
  <div class="tabs">
   <button class="tab on" data-view="estado">Estado</button>
   <button class="tab" data-view="historial">Historial</button>
   <button class="tab" data-view="trabajo">Trabajo</button>
   <button class="tab" data-view="organismo">Organismo</button>
  </div>
 </div>
</header>

<main class="main">
 <section class="view on" id="estado"><div class="kicker">HOY</div><h1>Prometeo</h1><div id="statecontent"></div></section>
 <section class="view" id="historial"><div class="kicker">LÍNEA DE TIEMPO</div><h1>Historial</h1><div id="historycontent"></div></section>
 <section class="view" id="trabajo"><div class="kicker">CONTEXTOS VIVOS</div><h1>Trabajo</h1><div id="workcontent"></div></section>
 <section class="view" id="organismo">
  <div class="orgwrap">
   <div class="orgtools">
    <button class="orgbtn on" data-orgmode="organism">estructura</button>
    <button class="orgbtn" data-orgmode="age">edad</button>
    <button class="orgbtn" data-orgmode="impact">impacto</button>
   </div>
   <div class="zoom"><button class="orgbtn" id="zin">＋</button><button class="orgbtn" id="zout">−</button><button class="orgbtn" id="zreset">↺</button></div>
   <div class="orgcoverage" id="orgcoverage"></div>
   <svg id="orgsvg" viewBox="0 0 1200 1400" preserveAspectRatio="xMidYMid meet"></svg>
   <div class="infopanel" id="infopanel">
    <div class="iphead"><div><div class="ipname" id="ipname"></div><div class="ipmeta" id="ipmeta"></div></div><button class="ipclose" id="ipclose">×</button></div>
    <div class="ipdesc" id="ipdesc"></div>
    <div class="impactbox"><div class="impacttitle">Si cambia esto, revisar</div><div class="impactlist" id="impactlist"></div></div>
   </div>
  </div>
 </section>
</main>
</div>

<script>
const SB='https://catnohyouxqjjtseaueb.supabase.co/rest/v1/rpc/';
const KEY='sb_publishable_eqh3PngXs4UjLLWiY3pz1w_nhHtf7X-';
let D=null,O=null,H=null,C=null,HISTORY_MODE='work',ORG_MODE='organism',SELECTED=null,NODES=[],EDGES=[],RAF=0;
let vb={x:0,y:0,w:1200,h:1400};
const EXPANDED=new Set(['PROJECT:PROMETEO']);
const POINTERS=new Map();
let GESTURE=null,DRAGGED=false,SUPPRESS_CLICK_UNTIL=0;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CACHE_KEY='prometeo_live_v6_bundle_v2';
const FALLBACK_URL='./fallback.json';
const RPC_TIMEOUT_MS=6500;
const RPC_MAP={
 tree:'prometeo_current_tree_v2',
 organism:'prometeo_organism_projection_v1_1',
 historyMetrics:'prometeo_history_metrics_v1',
 contexts:'prometeo_work_contexts_projection_v1'
};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function one(x){return Array.isArray(x)&&x.length===1?x[0]:x}
async function rpc(name){
 let last=null;
 for(let attempt=0;attempt<2;attempt++){
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),RPC_TIMEOUT_MS);
  try{
   const r=await fetch(SB+name,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:'{}',cache:'no-store',signal:ctrl.signal});
   if(!r.ok)throw new Error(name+' · RPC '+r.status);
   return one(await r.json());
  }catch(e){
   last=e;
   if(attempt===0)await sleep(650);
  }finally{clearTimeout(timer)}
 }
 throw last||new Error(name+' · sin respuesta');
}
function cacheRead(){
 try{const x=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');return x?.tree?x:null}catch{return null}
}
function cacheWrite(bundle){
 try{localStorage.setItem(CACHE_KEY,JSON.stringify({...bundle,cached_at:new Date().toISOString()}))}catch{}
}
async function fallbackRead(){
 try{const r=await fetch(FALLBACK_URL+'?v=2',{cache:'no-store'});if(!r.ok)return null;const x=await r.json();return x?.tree?x:null}catch{return null}
}
async function load(base={}){
 const bundle={...base},failures=[];
 try{
  bundle.tree=await rpc(RPC_MAP.tree);
 }catch(e){
  failures.push(RPC_MAP.tree+' · '+(e?.message||e||'error'));
  if(!bundle.tree)throw e;
 }
 await sleep(120);
 const optional=Object.entries(RPC_MAP).filter(([key])=>key!=='tree');
 const settled=await Promise.allSettled(optional.map(([,name])=>rpc(name)));
 settled.forEach((res,i)=>{
  const [key,name]=optional[i];
  if(res.status==='fulfilled')bundle[key]=res.value;
  else failures.push(name+' · '+(res.reason?.message||res.reason||'error'));
 });
 return {bundle:{...bundle,cached_at:new Date().toISOString()},failures,fresh:Object.keys(RPC_MAP).length-failures.length};
}
function snapshotAt(bundle){return bundle?.tree?.generated_at||bundle?.organism?.generated_at||bundle?.cached_at||null}
function freshness(mode,bundle,failures=[]){
 const box=$('#freshness'),txt=$('#freshnessText'),when=snapshotAt(bundle);
 if(mode==='live'&&!failures.length){box.className='freshness live on';txt.textContent='actualizado · '+fmt(when);setTimeout(()=>{if(box.classList.contains('live'))box.classList.remove('on')},2600);return}
 box.className='freshness on';
 const suffix=failures.length?' · actualización incompleta':' · actualizando…';
 txt.textContent='mostrando última copia · '+fmt(when)+suffix;
}
function applyBundle(bundle,mode='stale',failures=[]){
 D=bundle.tree;
 O=bundle.organism||{nodes:[],edges:[],coverage:{}};
 H=bundle.historyMetrics||{daily:[]};
 C=bundle.contexts||{contexts:[]};
 $('#stamp').textContent=(mode==='live'?'actualizado ':'copia ')+fmt(snapshotAt(bundle));
 renderState();renderHistory();renderWork();
 if(NODES.length){NODES=[];EDGES=[]}
 if($('#organismo').classList.contains('on'))drawOrg();
 freshness(mode,bundle,failures);
}
let REFRESHING=false,LAST_BUNDLE=null;
async function refreshNow(){
 if(REFRESHING)return;
 REFRESHING=true;
 try{
  const out=await load(LAST_BUNDLE||{});
  LAST_BUNDLE=out.bundle;
  cacheWrite(out.bundle);
  applyBundle(out.bundle,out.failures.length?'stale':'live',out.failures);
 }catch(e){
  if(LAST_BUNDLE){
   freshness('stale',LAST_BUNDLE,[e.message]);
   $('#stamp').textContent='copia '+fmt(snapshotAt(LAST_BUNDLE));
  }else{
   $('#stamp').textContent='sin snapshot';
   $('#statecontent').innerHTML='<div class="rdesc">No hay una copia previa todavía. Reintentando en segundo plano: '+esc(e.message)+'</div>';
   $('#freshness').className='freshness on';$('#freshnessText').textContent='sin copia local · esperando estado actual';
  }
 }finally{REFRESHING=false}
}
function fmt(d){try{return new Intl.DateTimeFormat('es-AR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'America/Argentina/Buenos_Aires'}).format(new Date(d))}catch{return '—'}}
function mins(d){return d?Math.max(0,(Date.now()-new Date(d).getTime())/60000):null}
function age(m){if(m==null)return '—';if(m<1)return '<1m';if(m<60)return Math.round(m)+'m';if(m<1440)return Math.round(m/60)+'h';return Math.round(m/1440)+'d'}
const reg=k=>(D.semantic_registry||[]).find(x=>x.entity_key===k)||{};
const mod=k=>(D.root_index?.read_order||[]).find(x=>x.module_key===k)||{};
const guide=k=>(D.guides||[]).find(x=>x.guide_key===k)||{};
const wc=k=>Number(D.work?.counts?.[k]||0);

function recentAchievements(){
 return (D.semantic_registry||[])
  .filter(x=>x.effective_status==='CURRENT'&&x.kind!=='LEGACY_INDEX')
  .sort((a,b)=>new Date(b.promoted_at||b.updated_at)-new Date(a.promoted_at||a.updated_at))
  .slice(0,4);
}
function whyFor(x){
 const m={
  PROMETEO_CURRENT_TREE_V2:'Hace rápida y reconstruible la orientación actual.',
  PROMETEO_ARCHITECTURE_WORK_GRAPH_V1_1:'Unifica la arquitectura alrededor de un único Work Graph.',
  WORK_GRAPH_CURRENT_V1_1:'Hace que workers nuevos encuentren trabajo sin conocer la historia.',
  PROMETEO_ROOT_INDEX_V1:'Permite ubicar la fuente correcta sin crear otra verdad paralela.',
  COGNITIVE_FRONTIER_BREAKER_PLAN_V1:'Permite seguir pensando aunque el trabajo material esté bloqueado.'
 };
 return m[x.entity_key]||x.payload?.reason||x.payload?.law||'Pieza vigente del sistema.';
}
function renderState(){
 const achieved=recentAchievements();

function structuralParentMap(){
 const p=new Map();
 (O?.nodes||[]).forEach(n=>{
  const k=n.node_key;
  if(k==='PROJECT:PROMETEO')return;
  if(k.startsWith('SEM:'))p.set(k,'PROJECT:PROMETEO');
  else if(k.startsWith('ROOT:'))p.set(k,'SEM:PROMETEO_ROOT_INDEX_V1');
  else if(k.startsWith('GUIDE:'))p.set(k,'ROOT:GUIDES');
  else if(k.startsWith('OBJECTIVE:'))p.set(k,'ROOT:OBJECTIVES');
 });
 (O?.edges||[]).filter(e=>e.kind==='CONTAINS'&&String(e.to||'').startsWith('EXT:')).forEach(e=>p.set(e.to,e.from));
 (O?.edges||[]).filter(e=>e.kind==='WORK_CONTEXT'&&String(e.to||'').startsWith('CTX:')).forEach(e=>p.set(e.to,e.from));
 (O?.nodes||[]).filter(n=>n.node_key.startsWith('EXT:')&&!p.has(n.node_key)).forEach(n=>p.set(n.node_key,'PROJECT:PROMETEO'));
 (O?.nodes||[]).filter(n=>n.node_key.startsWith('CTX:')&&!p.has(n.node_key)).forEach(n=>p.set(n.node_key,'PROJECT:PROMETEO'));
 return p;
}
function childMap(){
 const p=structuralParentMap(),c=new Map();
 for(const [child,parent] of p.entries()){
  if(!c.has(parent))c.set(parent,[]);
  c.get(parent).push(child);
 }
 for(const arr of c.values())arr.sort();
 return c;
}
function visibleKeys(){

 while(q.length){
  const parent=q.shift();
  if(!EXPANDED.has(parent))continue;
  for(const child of cm.get(parent)||[]){
   visible.add(child);
   if(EXPANDED.has(child))q.push(child);
  }
 }
 return visible;
}
function rawNode(key){return (O?.nodes||[]).find(n=>n.node_key===key)||null}
function placeLayout(keys){
 const cm=childMap(),placed=new Map();
 const center={x:600,y:700};placed.set('PROJECT:PROMETEO',center);

 const top=cm.get('PROJECT:PROMETEO')||[];
 const rx=300,ry=330,start=-Math.PI/2;
 top.forEach((k,i)=>{
   const a=start+(i/Math.max(1,top.length))*Math.PI*2;
   placed.set(k,{x:center.x+Math.cos(a)*rx,y:center.y+Math.sin(a)*ry,angle:a,depth:1});
 });

 function placeDesc(parent,depth){
   const kids=(cm.get(parent)||[]).filter(k=>keys.has(k));
   if(!kids.length)return;
   const pp=placed.get(parent)||center;
   const base=pp.angle!=null?pp.angle:Math.atan2(pp.y-center.y,pp.x-center.x);
   const spread=Math.min(Math.PI*.72,Math.PI*.24*Math.max(1,kids.length-1));
   const dist=depth===2?235:175;
   kids.forEach((k,i)=>{
     const frac=kids.length===1?.5:i/(kids.length-1);
     const a=base-spread/2+spread*frac;
     const x=pp.x+Math.cos(a)*dist;
     const y=pp.y+Math.sin(a)*dist;
     placed.set(k,{x,y,angle:a,depth});
     placeDesc(k,depth+1);
   });
 }
 top.forEach(k=>placeDesc(k,2));
 return placed;
}

function animateOrg(t){
 const ps=new Map();NODES.forEach(n=>{const p=pos(n,t);ps.set(n.id,p);n.el?.setAttribute('transform','translate('+p.x+','+p.y+')')});
 EDGES.forEach(e=>{const a=ps.get(e.a),b=ps.get(e.b);if(!a||!b)return;const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;e.el.setAttribute('d','M '+a.x+' '+a.y+' Q '+mx+' '+my+' '+b.x+' '+b.y)});
 RAF=requestAnimationFrame(animateOrg);
}
function downstream(id){
 const all=(O?.edges||[]).map(e=>({a:e.from,b:e.to}));
 const out=new Set(),q=[id];
 while(q.length){
  const x=q.shift();
  all.filter(e=>e.a===x).forEach(e=>{if(!out.has(e.b)){out.add(e.b);q.push(e.b)}});
 }
 return [...out]
}
function selectOrg(id){
 SELECTED=id;const n=NODES.find(x=>x.id===id);if(!n)return;
 document.querySelectorAll('#orgsvg .node').forEach(x=>x.classList.remove('impact'));
 document.querySelectorAll('#orgsvg .edge').forEach(x=>x.classList.remove('impact'));
 const impacts=downstream(id);n.el.classList.add('impact');
 impacts.forEach(k=>NODES.find(x=>x.id===k)?.el?.classList.add('impact'));
 EDGES.forEach(e=>{if(e.a===id||impacts.includes(e.a)&&impacts.includes(e.b))e.el.classList.add('impact')});
 $('#ipname').textContent=n.label;$('#ipmeta').textContent=(n.status||'—')+' · '+age(mins(n.updated))+' · '+fmt(n.updated);$('#ipdesc').textContent=n.desc||'';
 const semantic=(n.consumers||[]).map(x=>x.replaceAll('_',' '));
 const visual=impacts.map(k=>rawNode(k)?.title||NODES.find(x=>x.id===k)?.label).filter(Boolean);
 const merged=[...new Set([...semantic,...visual])];
 $('#impactlist').innerHTML=merged.length?merged.slice(0,12).map(x=>'<span class="impactpill">'+esc(x)+'</span>').join(''):'<div class="empty">sin consumidores visibles en esta proyección</div>';
 $('#infopanel').classList.add('on');
}
$('#ipclose').onclick=()=>{$('#infopanel').classList.remove('on');SELECTED=null;document.querySelectorAll('#orgsvg .node,#orgsvg .edge').forEach(x=>x.classList.remove('impact'))};
function setVB(){ $('#orgsvg').setAttribute('viewBox',vb.x+' '+vb.y+' '+vb.w+' '+vb.h) }
function clampZoom(w){return Math.max(260,Math.min(1700,w))}
function zoomAt(factor,cx=.5,cy=.5){
 const oldW=vb.w,oldH=vb.h,newW=clampZoom(oldW*factor),ratio=newW/oldW,newH=oldH*ratio;
 const anchorX=vb.x+oldW*cx,anchorY=vb.y+oldH*cy;
 vb.x=anchorX-newW*cx;vb.y=anchorY-newH*cy;vb.w=newW;vb.h=newH;setVB();
}
$('#zin').onclick=()=>zoomAt(.8);
$('#zout').onclick=()=>zoomAt(1.25);
$('#zreset').onclick=()=>{vb={x:0,y:0,w:1200,h:1400};setVB()};

function pointDistance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function screenToVB(clientX,clientY,base=vb){
 const r=$('#orgsvg').getBoundingClientRect();
 return {x:base.x+(clientX-r.left)/r.width*base.w,y:base.y+(clientY-r.top)/r.height*base.h};
}
function startGesture(){
 const pts=[...POINTERS.values()];
 DRAGGED=false;
 if(pts.length===1){
  GESTURE={type:'pan',vb:{...vb},sx:pts[0].x,sy:pts[0].y};
 }else if(pts.length>=2){
  const a=pts[0],b=pts[1],cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
  GESTURE={type:'pinch',vb:{...vb},dist:pointDistance(a,b),cx,cy,anchor:screenToVB(cx,cy,{...vb})};
 }
}
const org=$('#orgsvg');
org.addEventListener('pointerdown',ev=>{
 org.setPointerCapture?.(ev.pointerId);
 POINTERS.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
 startGesture();
});
org.addEventListener('pointermove',ev=>{
 if(!POINTERS.has(ev.pointerId))return;
 POINTERS.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
 const pts=[...POINTERS.values()];
 if(!GESTURE)return;
 if(pts.length===1&&GESTURE.type==='pan'){
  const r=org.getBoundingClientRect(),p=pts[0];
  const dx=p.x-GESTURE.sx,dy=p.y-GESTURE.sy;
  if(Math.hypot(dx,dy)>5)DRAGGED=true;
  vb.x=GESTURE.vb.x-dx/r.width*GESTURE.vb.w;
  vb.y=GESTURE.vb.y-dy/r.height*GESTURE.vb.h;
  setVB();
 }else if(pts.length>=2){
  if(GESTURE.type!=='pinch')startGesture();
  const a=pts[0],b=pts[1],dist=pointDistance(a,b);
  if(Math.abs(dist-GESTURE.dist)>3)DRAGGED=true;
  const scale=GESTURE.dist/Math.max(1,dist);
  const newW=clampZoom(GESTURE.vb.w*scale),ratio=newW/GESTURE.vb.w,newH=GESTURE.vb.h*ratio;
  const r=org.getBoundingClientRect(),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
  const fx=(cx-r.left)/r.width,fy=(cy-r.top)/r.height;
  vb.w=newW;vb.h=newH;
  vb.x=GESTURE.anchor.x-newW*fx;vb.y=GESTURE.anchor.y-newH*fy;
  setVB();
 }
});
function endPointer(ev){
 if(DRAGGED)SUPPRESS_CLICK_UNTIL=Date.now()+300;
 POINTERS.delete(ev.pointerId);
 if(POINTERS.size)startGesture();else GESTURE=null;
}
org.addEventListener('pointerup',endPointer);
org.addEventListener('pointercancel',endPointer);
document.querySelectorAll('[data-orgmode]').forEach(b=>b.onclick=()=>{ORG_MODE=b.dataset.orgmode;document.querySelectorAll('[data-orgmode]').forEach(x=>x.classList.toggle('on',x===b));if(ORG_MODE!=='impact'){$('#infopanel').classList.remove('on');document.querySelectorAll('#orgsvg .node,#orgsvg .edge').forEach(x=>x.classList.remove('impact'))}});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===b.dataset.view));if(b.dataset.view==='organismo'&&!NODES.length)drawOrg()});
$('#freshnessRetry').onclick=refreshNow;
(async()=>{
 const local=cacheRead();
 if(local){LAST_BUNDLE=local;applyBundle(local,'stale')}
 else{
  const fallback=await fallbackRead();
  if(fallback){LAST_BUNDLE=fallback;applyBundle(fallback,'stale')}
 }
 await refreshNow();
 setInterval(refreshNow,60000);
})();
</script>
