<body>
<div class="shell"><header class="top"><div class="topin">
<div class="head"><div class="brand">PROMETEO · CONTROL</div><button class="iconbtn" id="searchBtn">⌕</button></div>
<div class="tabs"><button class="tab on" data-view="ahora">Ahora</button><button class="tab" data-view="proyectos">Proyectos</button><button class="tab" data-view="herramientas">Herramientas</button><button class="tab" data-view="historial">Historial</button><button class="tab" data-view="estadisticas">Estadísticas</button><button class="tab" data-view="organismo">Organismo</button></div>

</div></header>
<main class="main">
<section class="view on" id="ahora"><div class="kicker">CONTROL ROOM</div><h1>Ahora</h1><div id="now"></div></section>
<section class="view" id="proyectos"><div class="kicker">TRABAJO HUMANO</div><h1>Proyectos</h1><div id="projects"></div></section>

<section class="view" id="organismo"><div class="orgwrap"><div class="zoom"><button class="orgbtn" id="zin">＋</button><button class="orgbtn" id="zout">−</button><button class="orgbtn" id="zreset">↺</button></div><svg id="orgsvg" viewBox="0 0 1600 1600"></svg></div></section>
</main></div>

<script>
let SB=null,KEY=null,BOOT=null,D=null,O=null,C=null,A=null,S=null,CAT=null,FOCUS=null,VIEW='ahora',SELECTED=null;
let EXPANDED=new Set(['PROJECT:PROMETEO']),NODES=[],EDGES=[],VB={x:0,y:0,w:1600,h:1600},POINTERS=new Map(),GESTURE=null,DRAGGED=false,SUPPRESS=0,AF=0;
const $=q=>document.querySelector(q),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function boot(){if(BOOT)return BOOT;BOOT=fetch('../control-v7/',{cache:'no-store'}).then(r=>r.text()).then(t=>{const a=t.match(/const SB='([^']+)'/),b=t.match(/const KEY='([^']+)'/);if(!a||!b)throw Error('config');SB=a[1];KEY=b[1]});return BOOT}
async function rpc(n){await boot();const r=await fetch(SB+n,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:'{}',cache:'no-store'});if(!r.ok)throw Error(n+' '+r.status);return r.json()}
async function load(){const [tree,org,ctx,act,stats,cat]=await Promise.all([rpc('prometeo_current_tree_v2'),rpc('prometeo_organism_projection_v1_1'),rpc('prometeo_work_contexts_projection_v1'),rpc('prometeo_control_room_activity_v1'),rpc('prometeo_statistics_v3'),fetch('../control-v8/catalog.json',{cache:'no-store'}).then(r=>r.json())]);return{tree,org,ctx,act,stats,cat}}
function fmt(d){try{return new Intl.DateTimeFormat('es-AR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'America/Argentina/Buenos_Aires'}).format(new Date(d))}catch{return'—'}}function clock(d){try{return new Intl.DateTimeFormat('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/Argentina/Buenos_Aires'}).format(new Date(d))}catch{return'—'}}function day(d){try{return new Intl.DateTimeFormat('es-AR',{day:'numeric',month:'long',year:'numeric',timeZone:'America/Argentina/Buenos_Aires'}).format(new Date(d))}catch{return'—'}}function mins(d){return d?Math.max(0,(Date.now()-new Date(d))/60000):null}function age(m){if(m==null)return'—';if(m<60)return Math.round(m)+'m';if(m<1440)return Math.round(m/60)+'h';return Math.round(m/1440)+'d'}function compact(n){return new Intl.NumberFormat('es-AR',{notation:'compact',maximumFractionDigits:1}).format(Number(n||0))}function duration(ms){ms=Number(ms||0);if(ms<1000)return Math.round(ms)+'ms';if(ms<60000)return(Math.round(ms/100)/10)+'s';return(Math.round(ms/6000)/10)+'m'}
const raw=k=>(O?.nodes||[]).find(n=>n.node_key===k)||null,wc=k=>Number(D?.work?.counts?.[k]||0);function desc(n){const p=n?.payload||{};return p.purpose||p.summary||p.headline||p.mission||p.reason||p.law||p.next_action||''}function matchFocus(t){if(!FOCUS)return true;const n=raw(FOCUS),h=String(t||'').toLowerCase();return[FOCUS,n?.title,n?.owner_key].filter(Boolean).some(x=>h.includes(String(x).toLowerCase()))}
function setView(v){VIEW=v;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.view===v));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v));if(v==='ahora')renderNow();if(v==='proyectos')renderProjects();if(v==='herramientas')renderTools();if(v==='historial')renderHistory();if(v==='estadisticas')renderStats();if(v==='organismo'){drawOrg();if(FOCUS)center(FOCUS)}}document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>setView(x.dataset.view));

function parents(){const p=new Map();(O.nodes||[]).forEach(n=>{const k=n.node_key;if(k==='PROJECT:PROMETEO')return;if(k.startsWith('SEM:'))p.set(k,'PROJECT:PROMETEO');else if(k.startsWith('ROOT:'))p.set(k,'SEM:PROMETEO_ROOT_INDEX_V1');else if(k.startsWith('GUIDE:'))p.set(k,'ROOT:GUIDES');else if(k.startsWith('OBJECTIVE:'))p.set(k,'ROOT:OBJECTIVES')});(O.edges||[]).filter(e=>['CONTAINS','WORK_CONTEXT'].includes(e.kind)).forEach(e=>p.set(e.to,e.from));(O.nodes||[]).filter(n=>(n.node_key.startsWith('EXT:')||n.node_key.startsWith('CTX:'))&&!p.has(n.node_key)).forEach(n=>p.set(n.node_key,'PROJECT:PROMETEO'));return p}function children(){const c=new Map();for(const[k,v]of parents()){if(!c.has(v))c.set(v,[]);c.get(v).push(k)}return c}function visible(){const c=children(),v=new Set(['PROJECT:PROMETEO']),q=['PROJECT:PROMETEO'];while(q.length){const p=q.shift();if(!EXPANDED.has(p))continue;(c.get(p)||[]).forEach(k=>{v.add(k);if(EXPANDED.has(k))q.push(k)})}return v}
function layout(keys){const c=children(),P=new Map(),cen={x:800,y:800};P.set('PROJECT:PROMETEO',{...cen,a:-Math.PI/2,d:0});const top=(c.get('PROJECT:PROMETEO')||[]).filter(k=>keys.has(k)),ring=520;top.forEach((k,i)=>{const a=-Math.PI/2+i*Math.PI*2/Math.max(1,top.length);P.set(k,{x:cen.x+Math.cos(a)*ring,y:cen.y+Math.sin(a)*ring,a,d:1})});function rec(pa,d){const kids=(c.get(pa)||[]).filter(k=>keys.has(k)),pp=P.get(pa);if(!pp)return;const spread=Math.min(Math.PI*.82,Math.max(.42,kids.length*.25)),dist=d===2?300:225;kids.forEach((k,i)=>{const t=kids.length===1?.5:i/(kids.length-1),a=pp.a-spread/2+spread*t;P.set(k,{x:pp.x+Math.cos(a)*dist,y:pp.y+Math.sin(a)*dist,a,d});rec(k,d+1)})}top.forEach(k=>rec(k,2));return P}
function emoji(n){const k=n.node_key;if(k==='PROJECT:PROMETEO')return'🔥';if(k.startsWith('EXT:TOOL_'))return'🧰';if(k.startsWith('EXT:SURFACE_'))return'▣';if(k.startsWith('GUIDE:'))return'🧭';if(k.startsWith('OBJECTIVE:'))return'🎯';if(k.startsWith('CTX:'))return'🗂️';if(k.includes('ROOT_INDEX'))return'🧠';if(k.includes('WORK_GRAPH'))return'⚙️';return'•'}function se(t,a={}){const e=document.createElementNS('http://www.w3.org/2000/svg',t);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));return e}
function drawOrg(){const v=visible(),P=layout(v),pm=parents(),vs=new Set(v);NODES=(O.nodes||[]).filter(n=>v.has(n.node_key)).map(n=>({raw:n,id:n.node_key,x:P.get(n.node_key)?.x||800,y:P.get(n.node_key)?.y||800,a:P.get(n.node_key)?.a||0,r:n.node_key==='PROJECT:PROMETEO'?45:(P.get(n.node_key)?.d===1?33:27)}));EDGES=[];for(const[ch,pa]of pm)if(vs.has(ch)&&vs.has(pa))EDGES.push({a:pa,b:ch,k:'STRUCT'});(O.edges||[]).forEach(e=>{if(vs.has(e.from)&&vs.has(e.to)&&!EDGES.some(x=>x.a===e.from&&x.b===e.to))EDGES.push({a:e.from,b:e.to,k:e.kind})});const s=$('#orgsvg');s.innerHTML='';const eg=se('g'),ng=se('g');s.append(eg,ng);EDGES.forEach(e=>{e.el=se('path',{class:'oedge '+(e.k==='STRUCT'?'':'rel')});eg.append(e.el)});const c=children();NODES.forEach(n=>{const r=n.raw,g=se('g',{class:'onode '+(r.status==='STALE'?'stale ':'')+(['LEGACY','SUPERSEDED'].includes(r.status)?'legacy ':''),'data-key':n.id}),co=se('circle',{class:'core',r:n.r}),em=se('text',{class:'emoji',y:1});em.textContent=emoji(r);const tx=se('text',{class:'name',y:n.r+18});tx.textContent=(r.title||'').length>18?r.title.slice(0,16)+'…':r.title;const ag=se('text',{class:'age',y:n.r+31});ag.textContent=age(mins(r.updated_at));g.append(co,em,tx,ag);const kids=c.get(n.id)||[];if(kids.length){const d=n.r+32,dx=Math.cos(n.a)*d,dy=Math.sin(n.a)*d,deg=n.a*180/Math.PI,ctl=se('g',{class:'branchctl',transform:'translate('+dx+','+dy+') rotate('+deg+')'}),cc=se('circle',{r:18}),ct=se('text',{y:1});ct.textContent=EXPANDED.has(n.id)?'←':'→';ctl.append(cc,ct);ctl.onclick=e=>{e.stopPropagation();EXPANDED.has(n.id)?EXPANDED.delete(n.id):EXPANDED.add(n.id);drawOrg()};g.append(ctl)}g.onclick=()=>Date.now()>SUPPRESS&&openEntity(n.id);n.el=g;ng.append(g)});anim()}
function anim(){cancelAnimationFrame(AF);const loop=T=>{const ps=new Map();NODES.forEach(n=>{const seed=[...n.id].reduce((a,c)=>a+c.charCodeAt(0),0),x=n.x+Math.sin(T*.00028+seed)*2.2,y=n.y+Math.cos(T*.00025+seed*.6)*2.2;ps.set(n.id,{x,y});n.el?.setAttribute('transform','translate('+x+','+y+')')});EDGES.forEach(e=>{const a=ps.get(e.a),b=ps.get(e.b);if(a&&b)e.el.setAttribute('d','M '+a.x+' '+a.y+' Q '+((a.x+b.x)/2)+' '+((a.y+b.y)/2)+' '+b.x+' '+b.y)});AF=requestAnimationFrame(loop)};AF=requestAnimationFrame(loop)}
function setVB(){$('#orgsvg').setAttribute('viewBox',VB.x+' '+VB.y+' '+VB.w+' '+VB.h)}function zoom(f){const nw=Math.max(320,Math.min(2400,VB.w*f)),nh=VB.h*nw/VB.w;VB.x+=(VB.w-nw)/2;VB.y+=(VB.h-nh)/2;VB.w=nw;VB.h=nh;setVB()}$('#zin').onclick=()=>zoom(.8);$('#zout').onclick=()=>zoom(1.25);$('#zreset').onclick=()=>{VB={x:0,y:0,w:1600,h:1600};setVB()};function expandAnc(k){const p=parents();while(p.has(k)){k=p.get(k);EXPANDED.add(k)}}function center(k){expandAnc(k);drawOrg();const n=NODES.find(x=>x.id===k);if(n){VB={x:n.x-360,y:n.y-360,w:720,h:720};setVB()}}
const org=$('#orgsvg');function startG(){const p=[...POINTERS.values()];DRAGGED=false;if(p.length===1)GESTURE={t:'pan',vb:{...VB},x:p[0].x,y:p[0].y};else if(p.length>=2){const r=org.getBoundingClientRect(),cx=(p[0].x+p[1].x)/2,cy=(p[0].y+p[1].y)/2;GESTURE={t:'pinch',vb:{...VB},d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),a:{x:VB.x+(cx-r.left)/r.width*VB.w,y:VB.y+(cy-r.top)/r.height*VB.h}}}}org.addEventListener('pointerdown',e=>{org.setPointerCapture?.(e.pointerId);POINTERS.set(e.pointerId,{x:e.clientX,y:e.clientY});startG()});org.addEventListener('pointermove',e=>{if(!POINTERS.has(e.pointerId)||!GESTURE)return;POINTERS.set(e.pointerId,{x:e.clientX,y:e.clientY});const p=[...POINTERS.values()],r=org.getBoundingClientRect();if(p.length===1&&GESTURE.t==='pan'){const dx=p[0].x-GESTURE.x,dy=p[0].y-GESTURE.y;if(Math.hypot(dx,dy)>5)DRAGGED=true;VB.x=GESTURE.vb.x-dx/r.width*GESTURE.vb.w;VB.y=GESTURE.vb.y-dy/r.height*GESTURE.vb.h;setVB()}else if(p.length>=2){if(GESTURE.t!=='pinch')startG();const dd=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),nw=Math.max(320,Math.min(2400,GESTURE.vb.w*GESTURE.d/Math.max(1,dd))),nh=GESTURE.vb.h*nw/GESTURE.vb.w,cx=(p[0].x+p[1].x)/2,cy=(p[0].y+p[1].y)/2;VB.w=nw;VB.h=nh;VB.x=GESTURE.a.x-nw*(cx-r.left)/r.width;VB.y=GESTURE.a.y-nh*(cy-r.top)/r.height;DRAGGED=true;setVB()}});function end(e){if(DRAGGED)SUPPRESS=Date.now()+300;POINTERS.delete(e.pointerId);POINTERS.size?startG():GESTURE=null}org.addEventListener('pointerup',end);org.addEventListener('pointercancel',end);
function focusUI(){const b=$('#focusbar');if(!FOCUS){b.classList.remove('on');return}const n=raw(FOCUS);b.classList.add('on');$('#focusname').textContent=n?.title||FOCUS;$('#focussub').textContent='centrado · '+(n?.kind||'')}function renderCurrent(){focusUI();if(VIEW==='ahora')renderNow();if(VIEW==='proyectos')renderProjects();if(VIEW==='herramientas')renderTools();if(VIEW==='historial')renderHistory();if(VIEW==='estadisticas')renderStats();if(VIEW==='organismo')drawOrg()}
