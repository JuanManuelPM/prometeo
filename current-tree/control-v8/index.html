.orgwrap{position:relative;height:calc(100vh - 155px);min-height:570px;margin:0 -13px -74px;overflow:hidden;border-top:1px solid var(--line2)}#orgsvg{width:100%;height:100%;display:block;touch-action:none;background:#07090b}.oedge{fill:none;stroke:#30363e;stroke-width:1.1;opacity:.78;vector-effect:non-scaling-stroke}.oedge.rel{stroke:#584f39;stroke-dasharray:4 5;opacity:.5}.onode{cursor:pointer}.onode .core{fill:#090b0e;stroke:#8a929b;stroke-width:1.2}.onode.stale .core{stroke:var(--warn);stroke-dasharray:3 4}.onode.legacy .core{stroke:#646c76;stroke-dasharray:2 5}.onode .emoji{font-size:25px;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.onode .name{fill:#dfe0db;font-size:11px;font-weight:700;text-anchor:middle;pointer-events:none}.onode .age{fill:#717a84;font-size:8px;text-anchor:middle;pointer-events:none}.branchctl{cursor:pointer}.branchctl circle{fill:#141820;stroke:#8a939e;stroke-width:1.2}.branchctl text{fill:#e4e5df;font-size:18px;font-weight:850;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.orgtools,.zoom{position:absolute;z-index:5;top:9px;display:flex;gap:4px}.orgtools{left:9px}.zoom{right:9px}.orgbtn{border:1px solid #2e343c;background:rgba(12,14,17,.9);border-radius:7px;padding:6px 8px;font-size:8px;color:#929aa4}

<script>
let SB=null,KEY=null,BOOT=null,D=null,O=null,H=null,C=null,A=null,CAT=null,FOCUS=null,SELECTED=null,HMODE='work',IMPACT=false;
let EXPANDED=new Set(['PROJECT:PROMETEO']),NODES=[],EDGES=[],VB={x:0,y:0,w:1600,h:1600},POINTERS=new Map(),GESTURE=null,DRAGGED=false,SUPPRESS=0;
const $=q=>document.querySelector(q),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function boot(){if(BOOT)return BOOT;BOOT=fetch('../control-v7/',{cache:'no-store'}).then(r=>r.text()).then(t=>{const a=t.match(/const SB='([^']+)'/),b=t.match(/const KEY='([^']+)'/);if(!a||!b)throw Error('config');SB=a[1];KEY=b[1]});return BOOT}
async function rpc(n){await boot();const r=await fetch(SB+n,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:'{}',cache:'no-store'});if(!r.ok)throw Error(n+' '+r.status);return r.json()}
async function load(){const [tree,org,hist,ctx,act,cat]=await Promise.all([rpc('prometeo_current_tree_v2'),rpc('prometeo_organism_projection_v1_1'),rpc('prometeo_history_metrics_v1'),rpc('prometeo_work_contexts_projection_v1'),rpc('prometeo_control_room_activity_v1'),fetch('./catalog.json',{cache:'no-store'}).then(r=>r.json())]);return{tree,org,hist,ctx,act,cat}}
function fmt(d){try{return new Intl.DateTimeFormat('es-AR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'America/Argentina/Buenos_Aires'}).format(new Date(d))}catch{return'—'}}function clock(d){try{return new Intl.DateTimeFormat('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/Argentina/Buenos_Aires'}).format(new Date(d))}catch{return'—'}}function day(d){try{return new Intl.DateTimeFormat('es-AR',{day:'numeric',month:'long',year:'numeric',timeZone:'America/Argentina/Buenos_Aires'}).format(new Date(d))}catch{return'—'}}function mins(d){return d?Math.max(0,(Date.now()-new Date(d))/60000):null}function age(m){if(m==null)return'—';if(m<60)return Math.round(m)+'m';if(m<1440)return Math.round(m/60)+'h';return Math.round(m/1440)+'d'}
const raw=k=>(O?.nodes||[]).find(n=>n.node_key===k)||null,wc=k=>Number(D?.work?.counts?.[k]||0);function desc(n){const p=n?.payload||{};return p.purpose||p.summary||p.headline||p.mission||p.reason||p.law||p.next_action||''}function matchFocus(t){if(!FOCUS)return true;const n=raw(FOCUS),h=String(t||'').toLowerCase();return[FOCUS,n?.title,n?.owner_key].filter(Boolean).some(x=>h.includes(String(x).toLowerCase()))}
function setView(v){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.view===v));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v));if(v==='organismo'){drawOrg();if(FOCUS)center(FOCUS)}}document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>setView(x.dataset.view));
function focusUI(){const b=$('#focusbar');if(!FOCUS){b.classList.remove('on');return}const n=raw(FOCUS);b.classList.add('on');$('#focusname').textContent=n?.title||FOCUS;$('#focussub').textContent='centrado · '+(n?.kind||'')}$('#focusclear').onclick=()=>{FOCUS=null;HMODE='work';renderAll()};
function row(k,t,d,m,cls=''){return '<div class="row '+cls+'" data-key="'+esc(k||'')+'"><div><div class="rtitle">'+esc(t)+'</div><div class="rdesc">'+esc(d||'')+'</div></div><div class="rmeta">'+esc(m||'')+'</div></div>'}
function renderNow(){const achieved=(D.semantic_registry||[]).filter(x=>(x.effective_status||x.status)==='CURRENT'&&matchFocus([x.title,x.owner_key,x.entity_key].join(' '))).sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at));const obj=(D.work?.active_objectives||[]).filter(x=>matchFocus([x.title,x.guide_key,x.objective_key].join(' ')));const issues=(D.health?.issues||[]).filter(x=>matchFocus([x.title,x.guide_key,x.module_key,x.entity_key].join(' ')));const acts=(A.events||[]).filter(x=>matchFocus([x.title,x.scope,x.node_key].join(' '))).slice(0,6);let h='<section class="section"><div class="section-head"><div class="section-title">Logrado</div></div><div class="card">'+achieved.slice(0,3).map(x=>row('SEM:'+x.entity_key,x.title,x.kind,fmt(x.updated_at))).join('')+'</div></section>';h+='<section class="section"><div class="section-head"><div class="section-title">Ahora</div></div><div class="card">'+(obj.length?obj.map(x=>row('OBJECTIVE:'+x.objective_key,x.title,'objetivo activo · '+x.guide_key,wc('READY')+' ready','hero')).join(''):row('','Sin objetivo activo en este foco','','','hero'))+'</div></section>';h+='<section class="section attention"><div class="section-head"><div class="section-title">Atención · '+issues.length+'</div></div><div class="card">'+issues.slice(0,5).map(x=>'<div class="row" data-key="'+esc(x.guide_key?'GUIDE:'+x.guide_key:x.module_key?'ROOT:'+x.module_key:x.entity_key?'SEM:'+x.entity_key:'')+'"><span class="attn '+(x.severity==='HIGH'?'high':'')+'"></span><div><div class="rtitle">'+esc(x.title)+'</div><div class="rdesc">'+esc(x.reason||x.kind)+'</div></div><div class="rmeta">'+esc(x.severity)+'</div></div>').join('')+'</div></section>';h+='<section class="section"><div class="section-head"><div class="section-title">Actividad</div></div><div class="feed">'+acts.map(x=>'<div class="feeditem" data-key="'+esc(x.node_key||'')+'"><div class="feedtime">'+esc(clock(x.occurred_at))+'</div><div><div class="feedtitle">'+esc(x.title)+'</div><div class="feedsub">'+esc(x.kind)+' · '+esc(x.event_type)+'</div></div></div>').join('')+'</div></section>';$('#now').innerHTML=h;bind($('#now'))}
function renderProjects(){let ps=(CAT.projects||[]).filter(p=>!FOCUS||p.node_key===FOCUS||matchFocus([p.title,p.subtitle,p.node_key].join(' ')));let h='<section class="section"><div class="section-head"><div class="section-title">Anclados</div></div><div class="project-grid">'+ps.filter(p=>p.pinned).map(p=>'<article class="project-card pinned" data-key="'+esc(p.node_key)+'"><div class="project-top"><div><div class="project-title">'+esc(p.title)+'</div><div class="project-sub">'+esc(p.subtitle)+'</div></div><div class="project-status '+String(p.status).toLowerCase()+'">'+esc(p.status)+'</div></div><div class="project-meta"><span>⌁ anclado</span><span>'+p.surface_ids.length+' superficies</span></div></article>').join('')+'</div></section>';const sur=(CAT.surfaces||[]).filter(x=>!FOCUS||ps.some(p=>p.surface_ids.includes(x.id))||x.node_key===FOCUS);h+='<section class="section"><div class="section-head"><div class="section-title">Superficies</div><div class="section-action">'+sur.length+' visibles</div></div><div class="surface-grid">'+sur.map(x=>'<article class="surface-card" data-key="'+esc(x.node_key)+'"><div class="surface-preview"><iframe loading="lazy" src="'+esc(x.public_url)+'" tabindex="-1"></iframe></div><div class="surface-body"><div><div class="surface-title">'+esc(x.title)+'</div><div class="surface-meta">'+esc(x.status)+'</div></div><button class="tool-open" data-open="'+esc(x.public_url)+'">abrir ↗</button></div></article>').join('')+'</div></section>';let cs=(C.contexts||[]).filter(x=>!FOCUS||x.organism_parent_key===FOCUS||matchFocus([x.title,x.summary,x.next_action].join(' ')));h+='<section class="section"><div class="section-head"><div class="section-title">Contextos recientes</div></div><div class="context-list">'+cs.slice(0,8).map(x=>'<article class="context" data-key="CTX:'+esc(x.context_key)+'"><div class="context-title">'+esc(x.title)+'</div><div class="context-kind">'+esc(x.context_kind)+' · '+esc(x.status)+'</div><div class="context-desc">'+esc(x function renderTools(){let ts=(CAT.tools||[]).filter(x=>!FOCUS||x.node_key===FOCUS||matchFocus([x.title,x.summary].join(' ')));$('#tools').innerHTML='<section class="section"><div class="section-head"><div class="section-title">Capacidades</div><div class="section-action">'+ts.length+' registradas</div></div><div class="tool-grid">'+ts.map(x=>'<article class="tool-card" data-key="'+esc(x.node_key)+'"><div class="tool-emoji">'+esc(x.emoji)+'</div><div><div class="tool-top"><div><div class="tool-title">'+esc(x.title)+'</div><div class="tool-sub">'+esc(x.summary)+'</div></div><div class="tool-status '+String(x.status).toLowerCase()+'">'+esc(x.status)+'</div></div><div class="tool-meta"><span>ver en organismo</span></div></div><button class="tool-open" data-open="'+esc(x.public_url)+'">abrir ↗</button></article>').join('')+'</div></section><div class="rdesc">Los estados describen evidencia disponible. Estar acá no promociona una herramienta a Current.</div>';bind($('#tools'));openLinks($('#tools'))}

function renderHistory(){let controls=[['work','Trabajo'],['workers','Workers'],['artifacts','Artifacts'],['health','Salud'],['cumulative','Acumulado']];if(FOCUS)controls.unshift(['focus','Foco']);const ev=(A.events||[]).filter(x=>['SEMANTIC','OBJECTIVE','WORK_CONTEXT'].includes(x.kind)&&matchFocus([x.title,x.scope,x.node_key].join(' ')));const groups={};ev.forEach(x=>(groups[day(x.occurred_at)]??=[]).push(x));let tl='<div class="timeline">'+Object.keys(groups).map(k=>'<section class="day"><div class="dayhead">'+esc(k)+'</div>'+groups[k].slice(0,10).map(x=>'<div class="event" data-key="'+esc(x.node_key||'')+'"><div class="eventtime">'+esc(clock(x.occurred_at))+'</div><div class="eventtitle">'+esc(x.title)+'</div><div class="eventdesc">'+esc(x.kind)+' · '+esc(x.event_type)+'</div></div>').join('')+'</section>').join('')+'</div>';$('#history').innerHTML='<div class="history-controls">'+controls.map(x=>'<button class="hmetric '+(HMODE===x[0]?'on':'')+'" data-h="'+x[0]+'">'+x[1]+'</button>').join('')+'</div><div class="history-grid"><div class="history-time-pane">'+tl+'</div><div class="history-chart-pane"><div class="chartbox">'+chart()+'</div></div></div>';document.querySelectorAll('[data-h]').forEach(x=>x.onclick=()=>{HMODE=x.dataset.h;renderHistory()});bind($('#history'))}
function relations(k){const a=[];(O.edges||[]).forEach(e=>{if(e.from===k)a.push({d:'→',k:e.to});if(e.to===k)a.push({d:'←',k:e.from})});return a}function openEntity(k){const n=raw(k);if(!n)return;SELECTED=k;$('#dname').textContent=n.title;$('#dtype').textContent=n.kind+' · '+k;$('#ddesc').textContent=desc(n)||'Sin descripción adicional.';$('#dstatus').textContent=n.status||'—';$('#dage').textContent=age(mins(n.updated_at));$('#downer').textContent=n.owner_key||'—';$('#rels').innerHTML=relations(k).slice(0,16).map(r=>'<span class="relchip" data-key="'+esc(r.k)+'">'+r.d+' '+esc(raw(r.k)?.title||r.k)+'</span>').join('');const u=n.public_route||n.payload?.public_url;$('#openBtn').hidden=!u;$('#openBtn').onclick=()=>u&&window.open(u.startsWith('http')?u:'https://juanmanuelpm.github.io/prometeo'+u,'_blank');const src=n.source_ref,srcu=src?.startsWith('GitHub:/')?'https://github.com/JuanManuelPM/prometeo/blob/main/'+src.slice(8):null;$('#sourceBtn').hidden=!srcu;$('#sourceBtn').onclick=()=>srcu&&window.open(srcu,'_blank');$('#centerBtn').onclick=()=>{FOCUS=k;HMODE='focus';focusUI();renderAll();setView('organismo');center(k)};$('#drawer').classList.add('on');bind($('#rels'))}$('#dclose').onclick=()=>$('#drawer').classList.remove('on');function bind(root){root.querySelectorAll('[data-key]').forEach(x=>x.onclick=e=>{e.stopPropagation();openEntity(x.dataset.key)})}
$('#searchBtn').onclick=()=>{$('#search').classList.add('on');$('#searchinput').focus();search('')};$('#searchclose').onclick=()=>$('#search').classList.remove('on');$('#searchinput').oninput=e=>search(e.target.value);function search(q){q=q.toLowerCase().trim();const a=(O.nodes||[]).filter(n=>!q||[n.title,n.node_key,n.kind,n.owner_key,desc(n)].join(' ').toLowerCase().includes(q)).slice(0,35);$('#results').innerHTML=a.map(n=>'<div class="result" data-key="'+esc(n.node_key)+'"><div class="resulttitle">'+esc(n.title)+'</div><div class="resultsub">'+esc(n.kind)+' · '+esc(n.status)+'</div></div>').join('');bind($('#results'))}
function parents(){const p=new Map();(O.nodes||[]).forEach(n=>{const k=n.node_key;if(k==='PROJECT:PROMETEO')return;if(k.startsWith('SEM:'))p.set(k,'PROJECT:PROMETEO');else if(k.startsWith('ROOT:'))p.set(k,'SEM:PROMETEO_ROOT_INDEX_V1');else if(k.startsWith('GUIDE:'))p.set(k,'ROOT:GUIDES');else if(k.startsWith('OBJECTIVE:'))p.set(k,'ROOT:OBJECTIVES')});(O.edges||[]).filter(e=>['CONTAINS','WORK_CONTEXT'].includes(e.kind)).forEach(e=>p.set(e.to,e.from));(O.nodes||[]).filter(n=>(n.node_key.startsWith('EXT:')||n.node_key.startsWith('CTX:'))&&!p.has(n.node_key)).forEach(n=>p.set(n.node_key,'PROJECT:PROMETEO'));return p}function children(){const c=new Map();for(const[k,v]of parents()){if(!c.has(v))c.set(v,[]);c.get(v).push(k)}return c}function visible(){const c=children(),v=new Set(['PROJECT:PROMETEO']),q=['PROJECT:PROMETEO'];while(q.length){const p=q.shift();if(!EXPANDED.has(p))continue;(c.get(p)||[]).forEach(k=>{v.add(k);if(EXPANDED.has(k))q.push(k)})}return v}
function layout(keys){const c=children(),P=new Map(),cen={x:800,y:800};P.set('PROJECT:PROMETEO',{...cen,a:-Math.PI/2,d:0});const top=(c.get('PROJECT:PROMETEO')||[]).filter(k=>keys.has(k)),ring=520;top.forEach((k,i)=>{const a=-Math.PI/2+i*Math.PI*2/Math.max(1,top.length);P.set(k,{x:cen.x+Math.cos(a)*ring,y:cen.y+Math.sin(a)*ring,a,d:1})});function rec(pa,d){const kids=(c.get(pa)||[]).filter(k=>keys.has(k)),pp=P.get(pa);if(!pp)return;const spread=Math.min(Math.PI*.82,Math.max(.42,kids.length*.25)),dist=d===2?300:225;kids.forEach((k,i)=>{const t=kids.length===1?.5:i/(kids.length-1),a=pp.a-spread/2+spread*t;P.set(k,{x:pp.x+Math.cos(a)*dist,y:pp.y+Math.sin(a)*dist,a,d});rec(k,d+1)})}top.forEach(k=>rec(k,2));return P}
function emoji(n){const k=n.node_key;if(k==='PROJECT:PROMETEO')return'🔥';if(k.startsWith('EXT:TOOL_'))return'🧰';if(k.startsWith('EXT:SURFACE_'))return'▣';if(k.startsWith('GUIDE:'))return'🧭';if(k.startsWith('OBJECTIVE:'))return'🎯';if(k.startsWith('CTX:'))return'🗂️';if(k.includes('ROOT_INDEX'))return'🧠';if(k.includes('WORK_GRAPH'))return'⚙️';return'•'}function se(t,a={}){const e=document.createElementNS('http://www.w3.org/2000/svg',t);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));return e}
function drawOrg(){const v=visible(),P=layout(v),pm=parents(),vs=new Set(v);NODES=(O.nodes||[]).filter(n=>v.has(n.node_key)).map(n=>({raw:n,id:n.node_key,x:P.get(n.node_key)?.x||800,y:P.get(n.node_key)?.y||800,a:P.get(n.node_key)?.a||0,r:n.node_key==='PROJECT:PROMETEO'?45:(P.get(n.node_key)?.d===1?33:27)}));EDGES=[];for(const[ch,pa]of pm)if(vs.has(ch)&&vs.has(pa))EDGES.push({a:pa,b:ch,k:'STRUCT'});(O.edges||[]).forEach(e=>{if(vs.has(e.from)&&vs.has(e.to)&&!EDGES.some(x=>x.a===e.from&&x.b===e.to))EDGES.push({a:e.from,b:e.to,k:e.kind})});const s=$('#orgsvg');s.innerHTML='';const eg=se('g'),ng=se('g');s.append(eg,ng);EDGES.forEach(e=>{e.el=se('path',{class:'oedge '+(e.k==='STRUCT'?'':'rel')});eg.append(e.el)});const c=children();NODES.forEach(n=>{const r=n.raw,g=se('g',{class:'onode '+(r.status==='STALE'?'stale ':'')+(['LEGACY','SUPERSEDED'].includes(r.status)?'legacy ':''),'data-key':n.id}),co=se('circle',{class:'core',r:n.r}),em=se('text',{class:'emoji',y:1});em.textContent=emoji(r);const tx=se('text',{class:'name',y:n.r+18});tx.textContent=(r.title||'').length>18?r.title.slice(0,16)+'…':r.title;const ag=se('text',{class:'age',y:n.r+31});ag.textContent=age(mins(r.updated_at));g.append(co,em,tx,ag);const kids=c.get(n.id)||[];if(kids.length){const d=n.r+32,dx=Math.cos(n.a)*d,dy=Math.sin(n.a)*d,deg=n.a*180/Math.PI,ctl=se('g',{class:'branchctl',transform:'translate('+dx+','+dy+') rotate('+deg+')'}),cc=se('circle',{r:18}),ct=se('text',{y:1});ct.textContent=EXPANDED.has(n.id)?'←':'→';ctl.append(cc,ct);ctl.onclick=e=>{e.stopPropagation();EXPANDED.has(n.id)?EXPANDED.delete(n.id):EXPANDED.add(n.id);drawOrg()};g.append(ctl)}g.onclick=()=>Date.now()>SUPPRESS&&openEntity(n.id);n.el=g;ng.append(g)});anim()}
let AF=0;function anim(t=0){cancelAnimationFrame(AF);const loop=T=>{const ps=new Map();NODES.forEach(n=>{const seed=[...n.id].reduce((a,c)=>a+c.charCodeAt(0),0),x=n.x+Math.sin(T*.00028+seed)*2.2,y=n.y+Math.cos(T*.00025+seed*.6)*2.2;ps.set(n.id,{x,y});n.el?.setAttribute('transform','translate('+x+','+y+')')});EDGES.forEach(e=>{const a=ps.get(e.a),b=ps.get(e.b);if(a&&b)e.el.setAttribute('d','M '+a.x+' '+a.y+' Q '+((a.x+b.x)/2)+' '+((a.y+b.y)/2)+' '+b.x+' '+b.y)});AF=requestAnimationFrame(loop)};AF=requestAnimationFrame(loop)}

const org=$('#orgsvg');function startG(){const p=[...POINTERS.values()];DRAGGED=false;if(p.length===1)GESTURE={t:'pan',vb:{...VB},x:p[0].x,y:p[0].y};else if(p.length>=2){const r=org.getBoundingClientRect(),cx=(p[0].x+p[1].x)/2,cy=(p[0].y+p[1].y)/2;GESTURE={t:'pinch',vb:{...VB},d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),a:{x:VB.x+(cx-r.left)/r.width*VB.w,y:VB.y+(cy-r.top)/r.height*VB.h}}}}org.addEventListener('pointerdown',e=>{org.setPointerCapture?.(e.pointerId);POINTERS.set(e.pointerId,{x:e.clientX,y:e.clientY});startG()});org.addEventListener('pointermove',e=>{if(!POINTERS.has(e.pointerId)||!GESTURE)return;POINTERS.set(e.pointerId,{x:e.clientX,y:e.clientY});const p=[...POINTERS.values()],r=org.getBoundingClientRect();if(p.length===1&&GESTURE.t==='pan'){const dx=p[0].x-GESTURE.x,dy=p[0].y-GESTURE.y;if(Math.hypot(dx,dy)>5)DRAGGED=true;VB.x=GESTURE.vb.x-dx/r.width*GESTURE.vb.w;VB.y=GESTURE.vb.y-dy/r.height*GESTURE.vb.h;setVB()}else if(p.length>=2){if(GESTURE.t!=='pinch')startG();const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),nw=Math.max(320,Math.min(2400,GESTURE.vb.w*GESTURE.d/Math.max(1,d))),nh=GESTURE.vb.h*nw/GESTURE.vb.w,cx=(p[0].x+p[1].x)/2,cy=(p[0].y+p[1].y)/2;VB.w=nw;VB.h=nh;VB.x=GESTURE.a.x-nw*(cx-r.left)/r.width;VB.y=GESTURE.a.y-nh*(cy-r.top)/r.height;DRAGGED=true;setVB()}});function end(e){if(DRAGGED)SUPPRESS=Date.now()+300;POINTERS.delete(e.pointerId);POINTERS.size?startG():GESTURE=null}org.addEventListener('pointerup',end);org.addEventListener('pointercancel',end);
