<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Prometeo · Home Lab</title>
<style>
:root{
  --bg:#08090b;--panel:#101217;--ink:#f2f1ea;--muted:#8d949f;--line:#2a2e35;
  --ok:#77da92;--warn:#e6bd58;--bad:#ef7979;--blue:#7db5ff;
}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}button{font:inherit;color:inherit}a{color:inherit}
.wrap{max-width:1160px;margin:auto;padding:0 14px 80px}
.top{position:sticky;top:0;z-index:30;background:rgba(8,9,11,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.topin{max-width:1160px;margin:auto;padding:10px 14px 8px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand b{font-size:13px;letter-spacing:.08em}.brand span{font-size:10px;color:var(--muted)}
.chooser{display:flex;gap:5px;margin-top:9px;overflow-x:auto;scrollbar-width:none}.chooser::-webkit-scrollbar{display:none}
.mode{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 9px;font-size:10px;color:var(--muted);white-space:nowrap;cursor:pointer}
.mode.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.state{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-top:8px}.state::-webkit-scrollbar{display:none}
.pill{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 7px;font-size:9px;color:#c2c7ce;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}.ok .dot{background:var(--ok)}.warn .dot{background:var(--warn)}.bad .dot{background:var(--bad)}
.screen{display:none;padding-top:14px}.screen.on{display:block}
.eyebrow{font-size:9px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}.h1{font-size:clamp(25px,6vw,58px);line-height:.98;letter-spacing:-.055em;font-weight:850;margin:5px 0 8px}.lede{color:#b9bec6;font-size:12px;line-height:1.45;max-width:700px;margin:0 0 16px}
.status{font-size:8px;letter-spacing:.08em;border:1px solid var(--line);border-radius:999px;padding:3px 5px;color:var(--muted)}.status.CURRENT{color:var(--ok);border-color:#31593a}.status.STALE{color:var(--warn);border-color:#5d4e26}.status.PENDING{color:var(--blue)}
.nextbox{border-top:1px solid var(--line);margin-top:18px;padding-top:13px}.nextlabel{font-size:9px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase}.nexttitle{font-size:clamp(20px,5vw,38px);letter-spacing:-.045em;line-height:1.02;font-weight:800;margin:5px 0}.nextsub{font-size:10px;color:var(--muted);line-height:1.45}
.disclosure{border-top:1px solid var(--line);margin-top:14px}.disclosure details{border-bottom:1px solid var(--line);padding:9px 0}.disclosure summary{cursor:pointer;font-size:11px;font-weight:650;list-style:none;display:flex;justify-content:space-between;gap:10px}.disclosure summary::-webkit-details-marker{display:none}.disclosure .inside{font-size:10px;color:#b7bdc6;line-height:1.5;padding:8px 0 3px}

/* A MAP */
.map{display:grid;gap:6px}.maprow{display:grid;grid-template-columns:1fr;gap:6px}
.node{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:start}
.node strong{font-size:12px}.node p{margin:3px 0 0;font-size:9px;line-height:1.35;color:var(--muted)}
.connector{text-align:center;height:13px;color:#59616c;font-size:11px;line-height:13px}
.map .pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}

/* B LAYERS */
.layers{display:grid;gap:0;border-top:1px solid var(--line)}
.layer{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:9px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}
.num{font-size:19px;font-weight:850;color:#444b56;letter-spacing:-.05em}.layer b{font-size:12px}.layer p{font-size:9px;color:var(--muted);margin:3px 0 0;line-height:1.35}
.layer.now .num{color:var(--ink)}.layer.next{opacity:.68}.layer.next .num{color:var(--warn)}

/* C EDITORIAL */
.editorial{border-top:1px solid var(--ink)}
.statement{padding:13px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px}
.statement .left{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.11em}.statement .right{font-size:17px;line-height:1.12;letter-spacing:-.025em;font-weight:730}.statement small{display:block;color:var(--muted);font-size:9px;line-height:1.4;margin-top:5px;font-weight:400}

/* D OUTLINE */
.outline{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0c0e12}.olrow{border-bottom:1px solid var(--line);padding:8px 9px;font:10px ui-monospace,SFMono-Regular,Menlo,monospace}.olrow:last-child{border:0}.olhead{display:flex;justify-content:space-between;gap:8px}.indent1{padding-left:22px}.indent2{padding-left:36px}.ghost{color:#777f89}.currenttxt{color:var(--ok)}.warntxt{color:var(--warn)}
.outline details{border-bottom:1px solid var(--line)}.outline details:last-child{border:0}.outline summary{list-style:none;padding:8px 9px;cursor:pointer;font:10px ui-monospace,SFMono-Regular,Menlo,monospace}.outline summary::-webkit-details-marker{display:none}.outline details .olrow{border-top:1px solid #1d2026;border-bottom:0}

/* loading */
.loading{padding:30px 4px;color:var(--muted);font-size:11px}.err{border:1px solid #633838;background:#170e0e;border-radius:10px;padding:12px;color:#d5aaaa;font-size:11px}
@media(min-width:760px){
  .wrap{padding-left:22px;padding-right:22px}.topin{padding-left:22px;padding-right:22px}
  .maprow.wide{grid-template-columns:repeat(3,1fr)}.map .pair{grid-template-columns:1fr 1fr}
  .statement{grid-template-columns:180px minmax(0,1fr);padding:17px 0}.statement .right{font-size:24px}
  .layer{grid-template-columns:55px minmax(0,1fr) auto;padding:14px 0}.num{font-size:27px}
}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="brand"><b>PROMETEO · HOME LAB</b><span id="stamp">cargando</span></div>
    <div class="chooser">
      <button class="mode on" data-mode="map">A · Mapa</button>
      <button class="mode" data-mode="layers">B · Capas</button>
      <button class="mode" data-mode="editorial">C · Editorial</button>
      <button class="mode" data-mode="outline">D · Árbol</button>
    </div>
    <div class="state" id="state"></div>
  </div>
</header>

<main class="wrap">
  <section class="screen on" id="map"><div class="loading">Cargando estado real…</div></section>
  <section class="screen" id="layers"></section>
  <section class="screen" id="editorial"></section>
  <section class="screen" id="outline"></section>
</main>

<script>
const SB='https://catnohyouxqjjtseaueb.supabase.co/rest/v1/rpc/';
const KEY='sb_publishable_eqh3PngXs4UjLLWiY3pz1w_nhHtf7X-';
let D=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>{try{return new Intl.DateTimeFormat('es-AR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Argentina/Buenos_Aires'}).format(new Date(d))}catch{return '—'}};
const badge=s=>'<span class="status '+esc(s)+'">'+esc(s)+'</span>';
async function rpc(){
 const r=await fetch(SB+'prometeo_current_tree_v2',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:'{}',cache:'no-store'});
 if(!r.ok)throw new Error('RPC '+r.status);
 return await r.json();
}
function arch(){return D?.architecture||{}}
function count(k){return Number(D?.work?.counts?.[k]||0)}
function guides(){return D?.guides||[]}
function gstatus(k){return guides().find(g=>g.guide_key===k)?.effective_status||'PENDING'}
function issues(){return D?.health?.issues||[]}
function stateBar(){
 document.getElementById('stamp').textContent='snapshot '+fmt(D.generated_at);
 document.getElementById('state').innerHTML=[
  ['ok','ARCH '+(arch().effective_status||arch().status||'—')],
  [gstatus('STRATEGY')==='STALE'?'warn':'ok','STRATEGY '+gstatus('STRATEGY')],
  ['ok','WORK '+count('ACTIVE')+' active'],
  [issues().length?'warn':'ok',issues().length+' issues']
 ].map(x=>'<span class="pill '+x[0]+'"><span class="dot"></span>'+esc(x[1])+'</span>').join('');
}
function capability(title,desc,status){
 return '<div class="node"><div><strong>'+esc(title)+'</strong><p>'+esc(desc)+'</p></div>'+badge(status||'CURRENT')+'</div>';
}
function commonTail(){
 return '<div class="nextbox"><div class="nextlabel">Siguiente objetivo</div><div class="nexttitle">Memoria operativa que se mantenga sola</div><div class="nextsub">Current Tree + Guides + Work Graph + artifacts: detectar cambios, invalidar lo viejo y sintetizar el nuevo CURRENT sin depender de que vos lo recuerdes.</div></div>'+
 '<div class="disclosure"><details><summary>Después <span>＋</span></summary><div class="inside">Que un objetivo grande pueda recorrer solo: objetivo → trabajo → evidencia → verificación → canon → nueva orientación.</div></details><details><summary>Qué está mal hoy <span>＋</span></summary><div class="inside">'+esc(issues().length)+' problemas detectados. STRATEGY: '+esc(gstatus('STRATEGY'))+'. Trabajo: '+count('READY')+' ready, '+count('ACTIVE')+' active, '+count('BLOCKED')+' blocked.</div></details></div>';
}
function renderMap(){
 const a=arch(), s=a.effective_status||a.status||'CURRENT';
 document.getElementById('map').innerHTML=
 '<div class="eyebrow">ESTILO A · MAPA DE CAPACIDADES</div><div class="h1">Qué puede hacer Prometeo hoy</div><p class="lede">Las piezas que ya existen y cómo se conectan. Tocás sólo cuando necesitás detalle.</p>'+
 '<div class="map">'+
 capability('Objetivos humanos','registran qué queremos conseguir',s)+'<div class="connector">↓</div>'+
 capability('Frontier Compiler','convierte intención en trabajo reclamable',s)+'<div class="connector">↓</div>'+
 capability('Work Graph global','mantiene el trabajo real en un único lugar',s)+'<div class="connector">↓</div>'+
 '<div class="pair">'+capability('Workers universales','toman trabajo sin conocer la historia',s)+capability('Guides','mantienen criterio, dominio y autoridad',gstatus('STRATEGY')==='STALE'?'STALE':s)+'</div><div class="connector">↓</div>'+
 capability('Verificación + canon','separa producir de aceptar',s)+'<div class="connector">↓</div>'+
 capability('Current Tree','dice qué es vigente y qué quedó viejo','CURRENT')+
 '</div>'+commonTail();
}
function renderLayers(){
 const s=arch().effective_status||arch().status||'CURRENT';
 const rows=[
  ['01','Ejecución','Workers pueden hacer trabajo','CURRENT'],
  ['02','Coordinación','Work Graph distribuye y conserva trabajo','CURRENT'],
  ['03','Autonomía','Compiler genera siguiente trabajo','CURRENT'],
  ['04','Memoria','ROOT + Current Tree ubican lo vigente','CURRENT'],
  ['05','Persistencia','Invalidar y re-sintetizar sin recordatorio humano','PENDING'],
  ['06','Prometeo completo','Objetivo grande → producto verificado → canon','PENDING']
 ];
 document.getElementById('layers').innerHTML=
 '<div class="eyebrow">ESTILO B · CAPAS</div><div class="h1">Capacidades acumuladas</div><p class="lede">Cada nivel existe porque el anterior ya fue conquistado.</p>'+
 '<div class="layers">'+rows.map((r,i)=>'<div class="layer '+(i===3?'now ':'')+(i>3?'next':'')+'"><div class="num">'+r[0]+'</div><div><b>'+esc(r[1])+'</b><p>'+esc(r[2])+'</p></div>'+badge(r[3])+'</div>').join('')+'</div>'+
 commonTail();
}
function renderEditorial(){
 const s=gstatus('STRATEGY');
 document.getElementById('editorial').innerHTML=
 '<div class="eyebrow">ESTILO C · EDITORIAL</div><div class="h1">Prometeo ya sabe trabajar.</div><p class="lede">La pregunta ahora no es si puede hacer tareas, sino si puede mantener su propia orientación sin que vos seas la memoria externa.</p>'+
 '<div class="editorial">'+
 '<div class="statement"><div class="left">Ya tenemos</div><div class="right">Trabajo global.<small>Work Graph + workers universales.</small></div></div>'+
 '<div class="statement"><div class="left">Ya tenemos</div><div class="right">Continuidad por dominio.<small>Guides durables, aunque Strategy hoy está '+esc(s)+'.</small></div></div>'+
 '<div class="statement"><div class="left">Ya tenemos</div><div class="right">Una idea de CURRENT.<small>ROOT indexa; Current Tree orienta.</small></div></div>'+
 '<div class="statement"><div class="left">Falta cerrar</div><div class="right">La memoria que se corrige sola.<small>Invalidar, re-sintetizar y volver a conectar conocimiento cuando cambia la arquitectura.</small></div></div>'+
 '</div>'+commonTail();
}
function renderOutline(){
 document.getElementById('outline').innerHTML=
 '<div class="eyebrow">ESTILO D · ÁRBOL</div><div class="h1">Prometeo / hoy</div><p class="lede">La versión más compacta. Casi filesystem, con profundidad detrás de desplegables.</p>'+
 '<div class="outline">'+
 '<div class="olrow"><div class="olhead"><span>PROMETEO</span><span class="currenttxt">CURRENT</span></div></div>'+
 '<details open><summary>├─ capacidades</summary>'+
   '<div class="olrow indent1">├─ ejecución <span class="currenttxt">CURRENT</span></div>'+
   '<div class="olrow indent1">├─ coordinación <span class="currenttxt">CURRENT</span></div>'+
   '<div class="olrow indent1">├─ autonomía <span class="currenttxt">CURRENT</span></div>'+
   '<div class="olrow indent1">└─ memoria <span class="currenttxt">CURRENT</span></div>'+
 '</details>'+
 '<details><summary>├─ componentes</summary>'+
   '<div class="olrow indent1">├─ frontier compiler</div>'+
   '<div class="olrow indent1">├─ work graph</div>'+
   '<div class="olrow indent1">├─ workers</div>'+
   '<div class="olrow indent1">├─ guides <span class="warntxt">STRATEGY '+esc(gstatus('STRATEGY'))+'</span></div>'+
   '<div class="olrow indent1">├─ verification</div>'+
   '<div class="olrow indent1">└─ current tree</div>'+
 '</details>'+
 '<details open><summary>├─ siguiente</summary><div class="olrow indent1 warntxt">└─ memoria operativa autosostenida</div></details>'+
 '<details><summary>└─ health</summary><div class="olrow indent1">├─ '+issues().length+' issues</div><div class="olrow indent1">├─ '+count('READY')+' ready</div><div class="olrow indent1">├─ '+count('ACTIVE')+' active</div><div class="olrow indent1">└─ '+count('BLOCKED')+' blocked</div></details>'+
 '</div>'+commonTail();
}
function renderAll(){stateBar();renderMap();renderLayers();renderEditorial();renderOutline()}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id===b.dataset.mode));
});
(async()=>{try{D=await rpc();renderAll()}catch(e){document.getElementById('map').innerHTML='<div class="err">No pude cargar el estado: '+esc(e.message)+'</div>'}})();
</script>
</body>
</html>
