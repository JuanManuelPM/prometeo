<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Prometeo</title>
  <style>
    :root{
      --bg:#000;
      --ink:#f1f1ef;
      --muted:#777;
      --faint:#3f3f3f;
      --human:#171717;
      --line:#202020;
      --ok:#82d69a;
      --warn:#d9b45f;
      --bad:#ff7676;
      --composer-height:96px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,textarea{font:inherit}
    button{color:inherit}
    .app{width:min(820px,100%);min-height:100vh;margin:0 auto;padding:0 max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}
    .topbar{
      position:sticky;top:0;z-index:20;
      display:flex;align-items:center;gap:12px;
      min-height:54px;
      padding:max(8px,env(safe-area-inset-top)) 2px 8px;
      background:rgba(0,0,0,.94);
    }
    .brand{font-size:12px;font-weight:650;letter-spacing:-.01em;color:#d7d7d2}
    .top-spacer{flex:1}
    #refresh{
      border:0;background:transparent;padding:8px 4px;
      color:#666;font-size:17px;line-height:1;cursor:pointer
    }
    #refresh:hover{color:#aaa}
    #refresh:disabled{opacity:.35}
    #chat-sync{font-size:9px;color:#666}
    #chat-sync.live{color:var(--ok)}
    #chat-sync.stale{color:var(--warn)}
    #status{
      display:none;
      padding:0 2px 8px;
      color:#777;font-size:10px;line-height:1.35
    }
    #status.visible{display:block}
    #thread{padding:20px 2px calc(var(--composer-height) + 28px)}
    .msg{display:flex;flex-direction:column;margin:0 0 28px}
    .msg.human{align-items:flex-end}
    .msg.system{align-items:center;margin:8px 0 22px}
    .msg-main{max-width:90%}
    .human .msg-main{max-width:min(82%,660px)}
    .system .msg-main{max-width:88%;text-align:center}
    .meta{
      display:flex;align-items:center;gap:7px;
      min-height:18px;margin:0 2px 5px;
      color:#5d5d5d;font-size:10px;line-height:1.2
    }
    .human .meta{justify-content:flex-end}
    .actor{color:#858585}
    .source{color:#4f4f4f}
    .body{
      white-space:pre-wrap;overflow-wrap:anywhere;
      font-size:16px;line-height:1.52;letter-spacing:-.01em
    }
    .human .body{
      padding:10px 13px;
      border-radius:18px;
      background:var(--human);
    }
    .human .body.collapsible-long{
      position:relative;
      max-height:9.3em;
      overflow:hidden;
    }
    .human .body.collapsible-long::after{
      content:"";
      position:absolute;left:0;right:0;bottom:0;height:3.4em;
      background:linear-gradient(to bottom,rgba(23,23,23,0),rgba(23,23,23,1) 75%);
      pointer-events:none;
    }
    .human .body.expanded{max-height:none}
    .human .body.expanded::after{display:none}
    .expand-message{
      margin:5px 5px 0;border:0;background:transparent;color:#767672;
      padding:4px 7px;font-size:10px;cursor:pointer
    }
    .assistant .body,.worker .body{padding:1px 2px}
    .system .body{color:#737373;font-size:12px}
    .message-tools{display:flex;gap:8px;margin-top:8px}
    .human .message-tools{justify-content:flex-end}
    .message-debug{color:#555;font-size:10px}
    .message-debug summary{list-style:none;cursor:pointer;user-select:none}
    .message-debug summary::-webkit-details-marker{display:none}
    .message-debug pre{
      margin:7px 0 0;
      max-width:100%;
      white-space:pre-wrap;overflow-wrap:anywhere;
      color:#666;font:10px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace
    }
    .message-widgets{display:grid;gap:8px;margin-top:12px}
    .inline-widget{
      border-top:1px solid var(--line);
      padding-top:10px;
      color:#aaa;
    }
    .inline-widget details>summary,
    .prometeo-progress-widget>summary{
      display:flex;align-items:center;gap:8px;
      list-style:none;cursor:pointer;user-select:none;
      min-height:28px;
      color:#8a8a8a;font-size:11px
    }
    .inline-widget details>summary::-webkit-details-marker,
    .prometeo-progress-widget>summary::-webkit-details-marker{display:none}
    .widget-title{font-weight:650;color:#bdbdb8}
    .widget-note{margin-top:8px;color:#666;font-size:11px;line-height:1.45}
    .stats-grid{
      display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));
      gap:14px;margin-top:12px;padding-bottom:3px
    }
    .stat{min-width:0}
    .stat-value{font-size:19px;line-height:1.05;color:#e2e2df;font-weight:700;letter-spacing:-.03em}
    .stat-label{margin-top:4px;color:#666;font-size:9px;line-height:1.25;text-transform:uppercase;letter-spacing:.06em}
    .widget-link{color:#b7b7b1;text-decoration:none;border-bottom:1px solid #444}
    .run-progress-widget{padding:10px 0 2px}
    .run-progress-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
    .run-progress-pct{font-size:26px;font-weight:760;letter-spacing:-.04em;color:#ecece8}
    .run-progress-label{font-size:10px;color:#70706c}
    .run-progress-rail{height:4px;background:#171717;border-radius:99px;overflow:hidden}
    .run-progress-fill{height:100%;background:#d5d5cf;width:0}
    .run-progress-breakdown{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
    .run-progress-kpi b{display:block;font-size:14px;color:#d2d2cd}
    .run-progress-kpi span{display:block;margin-top:2px;font-size:8px;color:#5e5e5b;text-transform:uppercase;letter-spacing:.05em}
    .run-progress-freshness{margin-top:9px;font-size:9px;color:#5d5d59}
    .run-progress-freshness.stale{color:var(--warn)}
    .run-progress-action{margin-top:9px;font-size:11px;line-height:1.4;color:#bdbdb8;font-weight:650}
    .run-progress-action.warn{color:var(--warn)}
    .run-progress-action.good{color:var(--ok)}
    .run-worker-list{display:grid;gap:6px;margin-top:10px}
    .run-worker-row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid #151515}
    .run-worker-row:first-child{border-top:0}
    .run-worker-dot{width:8px;height:8px;border-radius:50%;background:#555}
    .run-worker-dot.live{background:#67d486;box-shadow:0 0 0 3px rgba(103,212,134,.08)}
    .run-worker-dot.done{background:#83c997}
    .run-worker-dot.warn{background:#d7a85b}
    .run-worker-dot.fail{background:#d56b6b}
    .run-worker-main{min-width:0}
    .run-worker-id{font:9px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:#8b8b86;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .run-worker-meta{margin-top:2px;font-size:9px;color:#555}
    .run-worker-age{font-size:9px;color:#696965;white-space:nowrap}
    .details-block{border-top:1px solid var(--line);padding-top:8px}
    .details-block>summary{list-style:none;cursor:pointer;color:#9b9b96;font-size:11px;min-height:34px;display:flex;align-items:center;gap:7px}
    .details-block>summary::before{content:"›";font-size:18px;line-height:1;color:#666;transform:rotate(0deg);transition:transform .12s ease}
    .details-block[open]>summary::before{transform:rotate(90deg)}
    .details-block>summary::-webkit-details-marker{display:none}
    .details-body{padding:3px 0 2px;color:#a2a29d;font-size:13px;line-height:1.5;white-space:pre-wrap}
    .copy-widget{border-top:1px solid var(--line);padding-top:10px}
    .copy-widget-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .copy-widget-title{font-size:11px;font-weight:650;color:#bdbdb8}
    .copy-list{display:grid;gap:7px;margin-top:9px}
    .copy-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #151515}
    .copy-row:first-child{border-top:0}
    .copy-label{min-width:0;color:#8f8f8a;font-size:11px;line-height:1.35;overflow-wrap:anywhere}
    .copy-button{border:1px solid #2a2a2a;background:#111;color:#d7d7d2;border-radius:999px;padding:7px 10px;font-size:10px;cursor:pointer;white-space:nowrap}
    .copy-button:active{transform:translateY(1px)}
    .copy-button.copied{border-color:#31543a;color:var(--ok)}
    .copy-feedback{min-height:14px;margin-top:7px;color:#666;font-size:9px;line-height:1.35}
    .copy-note{margin-top:6px;color:#555;font-size:9px;line-height:1.4}
    .waiting{
      margin:16px 2px 26px;
      color:#595959;font-size:12px;line-height:1.45
    }

    #chat-canary-progress{min-width:0}
    .prometeo-progress-widget{position:relative}
    .prometeo-progress-widget>summary{
      padding:5px 0;
      min-height:30px;
      color:#777
    }
    .progress-dot{font-size:9px}
    .progress-pct{font-size:11px;color:#bdbdb8}
    .progress-stage{
      max-width:170px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      color:#595959;font-size:9px
    }
    .progress-inner{
      position:absolute;right:0;top:36px;z-index:50;
      width:min(360px,calc(100vw - 28px));
      padding:14px 14px 13px;
      background:#080808;
      border:1px solid #1d1d1d;
      border-radius:14px;
      box-shadow:0 16px 50px rgba(0,0,0,.65)
    }
    .progress-rail{height:3px;background:#1a1a1a;overflow:hidden;border-radius:99px}
    .progress-fill{height:100%;background:#d0d0cb}
    .progress-counts{margin-top:9px;color:#686868;font-size:9px}
    .progress-steps{display:grid;gap:7px;margin-top:11px}
    .progress-step{
      display:grid;grid-template-columns:14px minmax(0,1fr) auto;
      gap:7px;align-items:baseline;
      color:#747474;font-size:9px;line-height:1.3
    }
    .progress-step-state{color:#555}
    .progress-step-state.done{color:var(--ok)}
    .progress-step-weight{color:#4d4d4d}
    .progress-error{color:#666;font-size:9px}

    .composer-shell{
      position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:30;
      width:min(820px,calc(100% - 24px));
      padding:10px 0 max(10px,env(safe-area-inset-bottom));
      background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.98) 26%)
    }
    [data-prometeo-chat-composer-form-v1]{
      display:grid;grid-template-columns:minmax(0,1fr) auto;
      gap:8px;align-items:end;
      padding:6px 7px 6px 14px;
      border:1px solid #232323;
      border-radius:23px;
      background:#0b0b0b
    }
    [data-prometeo-chat-composer-input-v1]{
      width:100%;min-height:30px;max-height:180px;resize:none;
      padding:6px 0;
      border:0;outline:0;background:transparent;color:var(--ink);
      font-size:15px;line-height:1.42
    }
    [data-prometeo-chat-composer-input-v1]::placeholder{color:#505050}
    [data-prometeo-chat-composer-submit-v1]{
      width:34px;height:34px;border:0;border-radius:50%;
      background:#ededeb;color:#050505;
      font-size:20px;line-height:1;font-weight:700;cursor:pointer
    }
    [data-prometeo-chat-composer-submit-v1]:disabled{opacity:.24;cursor:not-allowed}
    [data-prometeo-chat-composer-v1][data-transport-ready="false"] [data-prometeo-chat-composer-form-v1]{
      border-color:#332d20;
    }
    [data-prometeo-chat-composer-v1][data-transport-ready="false"] [data-prometeo-chat-composer-status-v1]{
      color:var(--warn);
    }
    [data-prometeo-chat-composer-status-v1]{
      min-height:0;margin:5px 6px 0;
      color:#707070;font:9px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;
      overflow-wrap:anywhere
    }
    [data-prometeo-chat-composer-status-v1]:empty{display:none}

    @media(max-width:560px){
      .app{padding-left:12px;padding-right:12px}
      .topbar{min-height:48px}
      #thread{padding-top:14px}
      .msg{margin-bottom:24px}
      .msg-main{max-width:94%}
      .human .msg-main{max-width:88%}
      .body{font-size:15.5px}
      .progress-stage{display:none}
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div class="brand">Prometeo</div>
      <div class="top-spacer"></div>
      <div id="chat-sync" aria-label="Estado de sincronización">●</div>
      <button id="refresh" type="button" aria-label="Actualizar conversación">↻</button>
    </div>

    <div id="status" role="status" aria-live="polite"></div>
    <div id="chat-canary-progress" hidden aria-hidden="true"></div>
    <section id="thread" aria-live="polite"></section>

    <div class="composer-shell">
      <div id="chatComposer" data-prometeo-chat-composer-v1></div>
    </div>
  </main>

  <script src="../ingress-v1.js"></script>
  <script src="./input-module-v1.js"></script>
  <script src="./progress-v1.js"></script>
  <script>
  (() => {
    'use strict';

    const THREAD_URL = '../../../coordination/portfolio/evidence/prometeo-autonomous-growth/CHAT_THREAD_MIRROR_CANARY_V1.json';
    const CHAT_OBJECT_ID = 'chat-object-prometeo-chat-control-main';
    const CLIENT_BUILD = 3;
    const HUMAN_FALLBACK = {
      message_id: 'MSG-CANARY-HUMAN-001',
      chat_object_id: CHAT_OBJECT_ID,
      actor_type: 'HUMAN',
      body_kind: 'TEXT',
      body_text: 'Explicá en una sola frase qué significa un worker atómico dentro de este experimento.',
      created_at: null,
      published_at: null,
      status: 'PUBLISHED',
      privacy: 'PUBLIC_SANITIZED_CANARY'
    };

    const thread = document.getElementById('thread');
    const status = document.getElementById('status');
    const refresh = document.getElementById('refresh');
    const chatSync = document.getElementById('chat-sync');
    let lastThreadSignature = null;
    let hasRenderedThread = false;

    function node(tag, text, className) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined && text !== null) element.textContent = String(text);
      return element;
    }

    function actorLabel(actor) {
      const value = String(actor || '').toUpperCase();
      if (value === 'HUMAN') return 'vos';
      if (value === 'SYSTEM') return 'sistema';
      return 'Prometeo';
    }

    function actorClass(actor) {
      const value = String(actor || '').toUpperCase();
      if (value === 'HUMAN') return 'human';
      if (value === 'SYSTEM') return 'system';
      if (value === 'WORKER') return 'worker';
      return 'assistant';
    }

    function timeLabel(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      try {
        return new Intl.DateTimeFormat('es-AR', {
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        }).format(date);
      } catch {
        return date.toISOString().slice(11,16);
      }
    }

    function setStatus(label) {
      status.textContent = label || '';
      status.classList.toggle('visible', Boolean(label));
    }

    function renderExperimentStats(block) {
      const wrap = node('div', null, 'inline-widget');
      const details = document.createElement('details');
      const summary = document.createElement('summary');
      summary.append(node('span', block.label || 'estadísticas', 'widget-title'));

      const grid = node('div', null, 'stats-grid');
      const metrics = block && typeof block.metrics === 'object' && block.metrics ? block.metrics : {};
      for (const [label, value] of Object.entries(metrics)) {
        const stat = node('div', null, 'stat');
        stat.append(
          node('div', value, 'stat-value'),
          node('div', label, 'stat-label')
        );
        grid.append(stat);
      }
      details.append(summary, grid);
      if (block.note) details.append(node('div', block.note, 'widget-note'));
      wrap.append(details);
      return wrap;
    }

    function renderLink(block) {
      const wrap = node('div', null, 'inline-widget');
      const a = node('a', block.label || 'abrir', 'widget-link');
      a.href = block.href || '#';
      a.target = '_blank';
      a.rel = 'noopener';
      wrap.append(a);
      return wrap;
    }

    function renderDetails(block) {
      const details = document.createElement('details');
      details.className = 'details-block';
      const summary = node('summary', block.label || 'ver más');
      const body = node('div', block.body || '', 'details-body');
      details.append(summary, body);
      return details;
    }

    async function copyText(value) {
      const text = String(value || '');
      if (!text) throw new Error('EMPTY_COPY_TEXT');
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function' && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.append(area);
      area.select();
      const ok = document.execCommand && document.execCommand('copy');
      area.remove();
      if (!ok) throw new Error('CLIPBOARD_UNAVAILABLE');
    }

    function renderCopyGroup(block) {
      const wrap = node('div', null, 'copy-widget');
      const items = Array.isArray(block.items)
        ? block.items.filter(item => item && String(item.text || '').trim())
        : [];
      const head = node('div', null, 'copy-widget-head');
      head.append(node('div', block.label || 'copiar', 'copy-widget-title'));
      const feedback = node('div', '', 'copy-feedback');

      const flash = (button, label) => {
        if (!button) return;
        const original = button.textContent;
        button.textContent = label || 'copiado';
        button.classList.add('copied');
        window.setTimeout(() => {
          button.textContent = original;
          button.classList.remove('copied');
        }, 1300);
      };

      if (items.length > 1) {
        const all = node('button', block.copy_all_label || 'Copiar todos juntos', 'copy-button');
        all.type = 'button';
        all.addEventListener('click', async () => {
          try {
            await copyText(items.map(item => String(item.text)).join('\n\n'));
            feedback.textContent = 'Copiados como un solo bloque.';
            flash(all, 'copiados');
          } catch (error) {
            feedback.textContent = 'No pude copiar automáticamente.';
          }
        });
        head.append(all);
      }

      const list = node('div', null, 'copy-list');
      for (const item of items) {
        const row = node('div', null, 'copy-row');
        row.append(node('div', item.label || 'prompt', 'copy-label'));
        const button = node('button', item.button_label || 'Copiar', 'copy-button');
        button.type = 'button';
        button.addEventListener('click', async () => {
          try {
            await copyText(item.text);
            feedback.textContent = 'Copiado: ' + (item.label || 'prompt');
            flash(button, 'copiado');
          } catch (error) {
            feedback.textContent = 'No pude copiar automáticamente.';
          }
        });
        row.append(button);
        list.append(row);
      }

      wrap.append(head, list, feedback);
      if (block.note) wrap.append(node('div', block.note, 'copy-note'));
      return wrap;
    }

    function renderRunProgress(block) {
      const wrap = node('div', null, 'inline-widget run-progress-widget');
      const head = node('div', null, 'run-progress-head');
      const pct = node('div', '—', 'run-progress-pct');
      const label = node('div', block.label || 'progreso del experimento', 'run-progress-label');
      head.append(pct, label);
      const rail = node('div', null, 'run-progress-rail');
      const fill = node('div', null, 'run-progress-fill');
      rail.append(fill);
      const breakdown = node('div', null, 'run-progress-breakdown');
      const freshness = node('div', 'leyendo estado durable…', 'run-progress-freshness');
      const action = node('div', 'calculando próxima acción…', 'run-progress-action');
      wrap.append(head, rail, breakdown, freshness, action);

      const statusUrl = block.status_url || '';
      const labUrl = block.lab_url || '';
      const runtimeUrl = block.runtime_url || '../../../live/runtime.json';
      let timer = null;

      const kpi = (value, labelText) => {
        const box = node('div', null, 'run-progress-kpi');
        box.append(node('b', value), node('span', labelText));
        return box;
      };
      const asTime = value => {
        const d = value ? new Date(value) : null;
        return d && !Number.isNaN(d.getTime()) ? d : null;
      };
      const newestTime = (...values) => values.map(asTime).filter(Boolean).sort((a,b)=>b-a)[0] || null;
      const terminalWorker = w => Boolean(w && ((w.close && w.close.terminal) || String(w.state||'').toUpperCase()==='CLOSED'));
      const lastWorkerAt = w => (w?.close?.at || w?.last_event_at || w?.claim?.at || w?.routed?.at || w?.first_event_at || null);

      async function update() {
        try {
          const stamp = '?t=' + Date.now();
          const [statusRes, labRes, runtimeRes] = await Promise.all([
            statusUrl ? fetch(statusUrl + stamp, {cache:'no-store'}) : Promise.resolve(null),
            labUrl ? fetch(labUrl + stamp, {cache:'no-store'}) : Promise.resolve(null),
            runtimeUrl ? fetch(runtimeUrl + stamp, {cache:'no-store'}) : Promise.resolve(null)
          ]);

          const s = statusRes && statusRes.ok ? await statusRes.json() : null;
          const lab = labRes && labRes.ok ? await labRes.json() : null;
          const runtime = runtimeRes && runtimeRes.ok ? await runtimeRes.json() : null;

          const explicitBatchId = block.batch_id || null;
          if (explicitBatchId) {
            const runtimeBatch = Array.isArray(runtime?.batches)
              ? runtime.batches.find(row => row && row.batch_id === explicitBatchId)
              : null;
            const statusBatch = s && s.batch_id === explicitBatchId ? s : null;
            if (!runtimeBatch && !statusBatch) throw new Error('BATCH_STATE_UNAVAILABLE');

            const summary = runtimeBatch?.summary || {
              expected:statusBatch?.slots_total,
              beaconed:statusBatch?.workers_beaconed,
              closed:statusBatch?.workers_terminal ?? statusBatch?.terminal,
              productive_units_total:statusBatch?.productive_units_total,
              workers_at_checkpoint:statusBatch?.workers_at_checkpoint ?? statusBatch?.primary_complete,
              workers_at_target:statusBatch?.workers_at_target ?? statusBatch?.reallocation_complete,
              workers_at_hard_cap:statusBatch?.workers_at_hard_cap
            };
            const workers = Array.isArray(runtimeBatch?.workers)
              ? runtimeBatch.workers
              : (Array.isArray(statusBatch?.workers) ? statusBatch.workers : []);
            const total = Math.max(1, Number(block.expected_workers ?? summary.expected ?? statusBatch?.slots_total ?? workers.length ?? 0));
            const admitted = runtimeBatch
              ? workers.filter(w => w?.authority_won === true).length
              : Number(statusBatch?.slots_claimed ?? workers.length ?? 0);
            const liveWorkers = workers.filter(w => {
              if (terminalWorker(w) || w?.terminal === true) return false;
              const d = asTime(lastWorkerAt(w));
              return d && (Date.now() - d.getTime()) < 600000;
            });
            const live = runtimeBatch ? liveWorkers.length : Number(statusBatch?.live_recent ?? liveWorkers.length);
            const units = Number(summary.productive_units_total || statusBatch?.productive_units_total || 0);
            const target = Number(summary.workers_at_target || statusBatch?.workers_at_target || 0);
            const closed = Number(summary.closed || statusBatch?.workers_terminal || statusBatch?.terminal || 0);
            const unitTarget = Math.max(1, total * Number(block.resident_target || 6));
            const overall = Math.max(0, Math.min(100,
              ((admitted/total)*25) +
              ((Math.min(units,unitTarget)/unitTarget)*50) +
              ((target/total)*15) +
              ((closed/total)*10)
            ));

            pct.textContent = Math.round(overall) + '%';
            fill.style.width = overall + '%';
            breakdown.style.gridTemplateColumns='repeat(5,minmax(0,1fr))';
            breakdown.replaceChildren(
              kpi(admitted + '/' + total, 'adentro'),
              kpi(String(live), 'vivos'),
              kpi(String(units), 'unidades'),
              kpi(target + '/' + total, 'target'),
              kpi(closed + '/' + total, 'cierre')
            );

            let workerList = wrap.querySelector('.run-worker-list');
            if (!workerList) {
              workerList = node('div', null, 'run-worker-list');
              wrap.insertBefore(workerList, freshness);
            }
            const ageLabel = value => {
              const d=asTime(value);
              if(!d) return 'sin señal';
              const sec=Math.max(0,Math.round((Date.now()-d.getTime())/1000));
              if(sec<60) return 'hace '+sec+'s';
              const min=Math.round(sec/60);
              if(min<60) return 'hace '+min+'m';
              return 'hace '+Math.round(min/60)+'h';
            };
            workerList.replaceChildren();
            for (const w of workers.slice().sort((a,b)=>Date.parse(lastWorkerAt(b)||0)-Date.parse(lastWorkerAt(a)||0))) {
              const terminal=terminalWorker(w)||w?.terminal===true;
              const unitsW=Number(w?.productive_units||0);
              const closeOutcome=String(w?.close?.outcome||w?.close_outcome||'').toUpperCase();
              const noAlloc=Boolean(w?.repo?.no_allocation_ref||w?.no_allocation_ref);
              const recent=!terminal && asTime(lastWorkerAt(w)) && (Date.now()-asTime(lastWorkerAt(w)).getTime())<600000;
              const dotClass=recent?'live':(
                terminal && unitsW>=Number(block.resident_target||6)?'done':
                (noAlloc||/BLOCKED|BOUNDARY|FAIL/.test(closeOutcome))?'fail':
                terminal?'warn':''
              );
              const row=node('div',null,'run-worker-row');
              row.append(node('span',null,'run-worker-dot '+dotClass));
              const main=node('div',null,'run-worker-main');
              main.append(
                node('div',String(w.worker_id||'worker').replace(/^wc-/,'').slice(-22),'run-worker-id'),
                node('div',unitsW+' unidades · '+(closeOutcome||w?.productive_chain_state||w?.state||'sin estado'),'run-worker-meta')
              );
              row.append(main,node('div',ageLabel(lastWorkerAt(w)),'run-worker-age'));
              workerList.append(row);
            }

            const observed = newestTime(runtime?.generated_at, statusBatch?.generated_at, runtimeBatch?.last_event_at, statusBatch?.last_event_at);
            const ageMs = observed ? Date.now() - observed.getTime() : null;
            const stale = ageMs !== null && ageMs > 120000;
            freshness.classList.toggle('stale', stale);
            const hhmm = observed ? observed.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : 'sin hora';
            freshness.textContent =
              explicitBatchId + ' · ' + admitted + '/' + total + ' adentro · ' +
              live + ' vivos · ' + units + ' unidades · ' + target + '/' + total + ' target · ' + closed + '/' + total + ' cierre · observado ' + hhmm +
              (stale ? ' · PROYECCIÓN ATRASADA' : '');

            action.classList.remove('warn','good');
            const targetCoverage = target + live;
            if (admitted < total) {
              action.textContent = 'ACCIÓN: REFILL ' + Math.max(0,total-admitted) + ' · faltan workers admitidos; no rutees tareas.';
              action.classList.add('warn');
            } else if (live > 0 && targetCoverage < total) {
              action.textContent = 'ACCIÓN: REFILL ' + Math.max(0,total-targetCoverage) + ' · murió capacidad antes del target; los workers vivos siguen trabajando.';
              action.classList.add('warn');
            } else if (live > 0) {
              action.textContent = 'ACCIÓN: ninguna · siguen trabajando ' + live + ' worker(s). Última señal arriba.';
            } else {
              action.textContent = 'ACCIÓN: VOLVÉ AL CONTROL AHORA · 0 workers vivos · ' + units + ' unidades · ' + target + '/' + total + ' llegaron al target.';
              action.classList.add(closed >= total ? 'good' : 'warn');
            }
            return;
          }

          const runId = block.run_id || s?.run_id || lab?.current_run?.run_id || null;
          const runtimeRun = runId && Array.isArray(runtime?.launch_runs)
            ? runtime.launch_runs.find(row => row && row.run_id === runId)
            : null;
          const labRun = runId && lab?.current_run?.run_id === runId ? lab.current_run : null;
          const batch = runId && Array.isArray(runtime?.batches)
            ? runtime.batches.find(row => row && row.batch_id === 'RUN-' + runId)
            : null;

          if (!s && !labRun && !runtimeRun) throw new Error('RUN_STATE_UNAVAILABLE');

          const total = Math.max(1, Number(runtimeRun?.slots_total ?? labRun?.slots_total ?? s?.slots_total ?? 0));
          const claimed = Number(runtimeRun?.slots_claimed ?? labRun?.slots_claimed ?? s?.slots_claimed ?? 0);
          const primary = Number(runtimeRun?.primary_complete ?? labRun?.primary_complete ?? s?.primary_complete ?? 0);
          const realloc = Number(runtimeRun?.reallocation_complete ?? labRun?.reallocation_complete ?? s?.reallocation_complete ?? 0);
          const terminal = Number(batch?.summary?.closed ?? labRun?.terminal ?? s?.workers_terminal ?? s?.terminal ?? 0);

          const workers = Array.isArray(batch?.workers) ? batch.workers : [];
          const active = workers.filter(w => {
            if (terminalWorker(w)) return false;
            const d = asTime(lastWorkerAt(w));
            return d && (Date.now() - d.getTime()) < 600000;
          }).length;

          const overall = Math.max(0, Math.min(100,
            ((claimed/total)*20) +
            ((primary/total)*30) +
            ((realloc/total)*30) +
            ((terminal/total)*20)
          ));
          pct.textContent = Math.round(overall) + '%';
          fill.style.width = overall + '%';
          breakdown.replaceChildren(
            kpi(claimed + '/' + total, 'adentro'),
            kpi(primary + '/' + total, 'primary'),
            kpi(realloc + '/' + total, 'realloc'),
            kpi(terminal + '/' + total, 'cierre')
          );

          const observed = newestTime(runtime?.generated_at, s?.generated_at, s?.updated_at, lab?.generated_at);
          const ageMs = observed ? Date.now() - observed.getTime() : null;
          const stale = ageMs !== null && ageMs > 120000;
          freshness.classList.toggle('stale', stale);
          const hhmm = observed ? observed.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : 'sin hora';
          freshness.textContent =
            claimed + '/' + total + ' claims · ' +
            primary + '/' + total + ' primary · ' +
            realloc + '/' + total + ' realloc · ' +
            terminal + '/' + total + ' cierres · ' +
            active + ' vivos <10m · observado ' + hhmm +
            (stale ? ' · PROYECCIÓN ATRASADA' : '');

          action.classList.remove('warn','good');
          if (claimed < total) {
            const missing = total - claimed;
            action.textContent = 'ACCIÓN: si ya lanzaste el lote completo, mandá sólo ' + missing + ' refill(s) idénticos; no numeres ni rutees.';
            action.classList.add('warn');
          } else if (terminal >= total) {
            action.textContent = 'ACCIÓN: VOLVÉ AL CONTROL · el RUN ya está terminal y corresponde síntesis/siguiente paso.';
            action.classList.add('good');
          } else if (active > 0) {
            action.textContent = 'ACCIÓN: ninguna por ahora · hay ' + active + ' worker(s) con señal reciente; el widget sigue refrescando.';
          } else {
            action.textContent = 'ACCIÓN: VOLVÉ AL CONTROL AHORA · no hay motor vivo y todavía faltan ' + Math.max(0,total-terminal) + ' cierres/boundaries por reducir.';
            action.classList.add('warn');
          }
        } catch (err) {
          freshness.classList.add('stale');
          freshness.textContent = 'no pude refrescar el estado: ' + (err?.message || 'error');
          action.classList.add('warn');
          action.textContent = 'ACCIÓN: volver al control; no esperar a ciegas con el widget sin estado.';
        }
      }
      void update();
      timer = setInterval(update, Math.max(10000, Number(block.poll_ms || 10000)));
      wrap.addEventListener('DOMNodeRemoved', () => { if (timer) clearInterval(timer); }, {once:true});
      return wrap;
    }

    function renderUiBlocks(message, host) {
      const blocks = Array.isArray(message.ui_blocks) ? message.ui_blocks : [];
      if (!blocks.length) return;
      const box = node('div', null, 'message-widgets');
      host.append(box);

      for (const block of blocks) {
        if (!block || !block.type) continue;
        if (block.type === 'experiment_stats') {
          box.append(renderExperimentStats(block));
        } else if (block.type === 'link') {
          box.append(renderLink(block));
        } else if (block.type === 'work_unit_progress') {
          const widget = node('div', null, 'inline-widget');
          const progressHost = node('div');
          widget.append(progressHost);
          box.append(widget);
          const api = window.PrometeoChatCanaryProgress;
          if (api && typeof api.load === 'function') void api.load(progressHost);
        } else if (block.type === 'run_progress') {
          box.append(renderRunProgress(block));
        } else if (block.type === 'details') {
          box.append(renderDetails(block));
        } else if (block.type === 'copy_group') {
          box.append(renderCopyGroup(block));
        }
      }
    }

    function renderDebug(message) {
      const refs = [
        ['message', message.message_id],
        ['source', message.source_surface],
        ['actor_ref', message.actor_ref],
        ['result_ref', message.result_ref],
        ['work_unit_ref', message.work_unit_ref]
      ].filter(([,value]) => value);
      if (!refs.length) return null;

      const details = document.createElement('details');
      details.className = 'message-debug';
      const summary = node('summary', '⋯');
      const pre = node('pre', refs.map(([k,v]) => k + ': ' + v).join('\n'));
      details.append(summary, pre);
      return details;
    }

    function wireLongMessage(body, main, actor) {
      if (actor !== 'HUMAN') return;
      const text = body.textContent || '';
      if (text.length < 420) return;
      body.classList.add('collapsible-long');
      const button = node('button', 'ver mensaje completo', 'expand-message');
      button.type = 'button';
      button.addEventListener('click', () => {
        const open = body.classList.toggle('expanded');
        button.textContent = open ? 'contraer' : 'ver mensaje completo';
      });
      main.append(button);
    }

    function compactPreview(text, max = 250) {
      const clean = String(text || '').replace(/\s+/g, ' ').trim();
      if (clean.length <= max) return clean;
      const cut = clean.slice(0, max);
      const lastSpace = cut.lastIndexOf(' ');
      return (lastSpace > max * 0.7 ? cut.slice(0, lastSpace) : cut).trim() + '…';
    }

    function renderMessage(message) {
      const actor = String(message.actor_type || 'ASSISTANT').toUpperCase();
      const article = node('article', null, 'msg ' + actorClass(actor));
      article.dataset.messageId = String(message.message_id || '');
      const main = node('div', null, 'msg-main');

      const meta = node('div', null, 'meta');
      meta.append(node('span', actorLabel(actor), 'actor'));
      const when = timeLabel(message.published_at || message.created_at);
      if (when) meta.append(node('span', when));
      if (message.source_surface) meta.append(node('span', message.source_surface, 'source'));

      const fullBodyText = message.body_kind === 'ARTIFACT_REF'
        ? (message.body_ref || '[artifact]')
        : (message.body_text || '');
      const isLongHuman = actor === 'HUMAN' && String(fullBodyText).length >= 420;
      const bodyText = isLongHuman
        ? (message.summary_text || compactPreview(fullBodyText))
        : fullBodyText;
      const body = node('div', bodyText, 'body');

      main.append(meta, body);
      if (isLongHuman) {
        const full = renderDetails({ label: 'ver mensaje completo', body: fullBodyText });
        full.classList.add('human-full-message');
        main.append(full);
      }
      renderUiBlocks(message, main);

      const debug = renderDebug(message);
      if (debug) {
        const tools = node('div', null, 'message-tools');
        tools.append(debug);
        main.append(tools);
      }

      article.append(main);
      return article;
    }

    function renderWaiting(label) {
      thread.append(node('div', label || 'WAITING · esperando respuesta…', 'waiting'));
    }

    function showLocalBoundaryNotice(label) {
      const article = node('article', null, 'msg system local-boundary-notice');
      const main = node('div', null, 'msg-main');
      const meta = node('div', null, 'meta');
      meta.append(node('span', 'sistema', 'actor'));
      main.append(meta, node('div', label, 'body'));
      article.append(main);
      thread.append(article);
      requestAnimationFrame(() => window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}));
    }

    function captureViewState() {
      const openDetails = [];
      for (const article of thread.querySelectorAll('article.msg[data-message-id]')) {
        const messageId = article.dataset.messageId || '';
        [...article.querySelectorAll('details')].forEach((details, index) => {
          if (details.open) openDetails.push(messageId + '::' + index);
        });
      }
      const doc = document.documentElement;
      const scrollY = window.scrollY || doc.scrollTop || 0;
      const maxScroll = Math.max(0, doc.scrollHeight - window.innerHeight);
      return {
        openDetails,
        scrollY,
        nearBottom: (maxScroll - scrollY) < 140
      };
    }

    function restoreViewState(state) {
      if (!state) {
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'auto' });
        return;
      }
      const wanted = new Set(state.openDetails || []);
      for (const article of thread.querySelectorAll('article.msg[data-message-id]')) {
        const messageId = article.dataset.messageId || '';
        [...article.querySelectorAll('details')].forEach((details, index) => {
          details.open = wanted.has(messageId + '::' + index);
        });
      }
      if (state.nearBottom) {
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'auto' });
      } else {
        window.scrollTo({ top: state.scrollY, behavior: 'auto' });
      }
    }

    function render(messages, previousView = null) {
      thread.replaceChildren();
      const safe = Array.isArray(messages) ? messages.filter(m => m && m.archived !== true) : [];
      const hasHuman = safe.some(m => String(m.actor_type).toUpperCase() === 'HUMAN');
      if (!hasHuman) thread.append(renderMessage(HUMAN_FALLBACK));
      for (const message of safe) thread.append(renderMessage(message));
      if (!safe.some(m => ['ASSISTANT','WORKER'].includes(String(m.actor_type).toUpperCase()))) {
        renderWaiting('WAITING · esperando respuesta…');
      }
      setStatus('');
      requestAnimationFrame(() => restoreViewState(previousView));
    }

    async function load() {
      refresh.disabled = true;
      try {
        const separator = THREAD_URL.includes('?') ? '&' : '?';
        const response = await fetch(THREAD_URL + separator + 't=' + Date.now(), { cache: 'no-store' });
        if (response.status === 404) {
          if (!hasRenderedThread) {
            render([]);
            hasRenderedThread = true;
            lastThreadSignature = '[]';
          }
          return;
        }
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        if (!data || data.schema !== 'prometeo.chat-thread-projection/v1' || data.chat_object_id !== CHAT_OBJECT_ID) {
          throw new Error('THREAD_SHAPE_INCOMPATIBLE');
        }

        const messages = Array.isArray(data.messages) ? data.messages : [];
        const requiredBuild = messages.reduce((max,message)=>{
          for(const block of (Array.isArray(message?.ui_blocks)?message.ui_blocks:[])) {
            max=Math.max(max,Number(block?.min_client_build||0));
          }
          return max;
        },0);
        if(requiredBuild>CLIENT_BUILD) {
          const u=new URL(window.location.href);
          if(u.searchParams.get('client_build')!==String(requiredBuild)) {
            u.searchParams.set('client_build',String(requiredBuild));
            window.location.replace(u.toString());
            return;
          }
        }
        const nextSignature = JSON.stringify(messages);
        if (!hasRenderedThread || nextSignature !== lastThreadSignature) {
          const previousView = hasRenderedThread ? captureViewState() : null;
          render(data.messages, previousView);
          lastThreadSignature = nextSignature;
          hasRenderedThread = true;
        }

        if (chatSync) {
          chatSync.classList.remove('stale');
          chatSync.classList.add('live');
          chatSync.title = 'sincronizado ' + new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
        }
      } catch (error) {
        if (!hasRenderedThread) {
          thread.replaceChildren(renderMessage(HUMAN_FALLBACK));
          renderWaiting('WAITING · no pude releer el thread durable');
        }
        setStatus(error && error.message ? error.message : 'THREAD_UNAVAILABLE');
        if (chatSync) {
          chatSync.classList.remove('live');
          chatSync.classList.add('stale');
          chatSync.title = 'sincronización fallida · mantengo lo que estabas viendo';
        }
      } finally {
        refresh.disabled = false;
      }
    }

    const composerHost = document.getElementById('chatComposer');
    const composerShell = document.querySelector('.composer-shell');
    const syncComposerSpace = () => {
      if (!composerShell) return;
      const height = Math.max(76, Math.ceil(composerShell.getBoundingClientRect().height));
      document.documentElement.style.setProperty('--composer-height', height + 'px');
    };
    if (composerShell) {
      if ('ResizeObserver' in window) {
        const composerObserver = new ResizeObserver(syncComposerSpace);
        composerObserver.observe(composerShell);
      }
      window.addEventListener('resize', syncComposerSpace);
      syncComposerSpace();
    }

    const composerApi = window.PROMETEO_CHAT_CANARY_INPUT_V1;
    if (composerHost && composerApi && typeof composerApi.mount === 'function') {
      const mounted = composerApi.mount(composerHost, {
        rows: 1,
        placeholder: 'Mensaje',
        submitLabel: '↑',
        page: {
          id: 'chat-canary',
          page_id: 'control-v11-chat-canary',
          title: 'Prometeo',
          surface_id: 'current-tree-control-v11-chat-canary',
          project_id: 'prometeo-autonomous-growth',
          target_path: 'current-tree/control-v11/chat-canary/'
        },
        onResult(result) {
          if (result && result.queued === true && result.ref) {
            setStatus('');
            void load();
          } else if (result && result.status) {
            const boundaryLabel = result.status === 'BOUNDARY_AUTH_REQUIRED'
              ? 'NO ENVIADO · falta bridge privado · tu texto sigue en el composer'
              : 'NO ENVIADO · ' + result.status;
            setStatus(boundaryLabel);
            showLocalBoundaryNotice(boundaryLabel);
          }
        }
      });

      const input = mounted && mounted.elements ? mounted.elements.input : null;
      if (input) {
        const resize = () => {
          input.style.height = 'auto';
          input.style.height = Math.min(input.scrollHeight, 180) + 'px';
        };
        input.addEventListener('input', () => {
          resize();
          requestAnimationFrame(syncComposerSpace);
        });
        resize();
        requestAnimationFrame(syncComposerSpace);
      }
    } else if (composerHost) {
      setStatus('input no disponible');
    }

    refresh.addEventListener('click', load);
    load();
    setInterval(() => load(), 10000);
  })();
  </script>
</body>
</html>
