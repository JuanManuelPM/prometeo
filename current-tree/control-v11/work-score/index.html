<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Prometeo · Control</title>
<style>
:root{color-scheme:dark;--bg:#08080a;--panel:#0c0c0f;--fg:#f3f1f6;--muted:#8b8791;--line:#2c2931;--vio:#aa7cff;--blue:#83c7ff;--warn:#e9b35a;--bad:#ff746c;--ok:#79d39d}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{border-top:2px solid var(--vio)}main{padding:12px 14px 22px;display:grid;gap:10px}.top{display:grid;grid-template-columns:minmax(220px,.55fr) minmax(0,1.45fr) minmax(240px,.7fr);gap:10px;align-items:stretch}.clockbox,.capacity,.media,.board,.detail,.timeline,.history{border:1px solid var(--line);background:var(--panel)}.clockbox{padding:10px}.brand{font-size:8px;letter-spacing:.17em;color:var(--muted)}.clock{font-size:clamp(54px,8vw,116px);line-height:.84;font-weight:250;letter-spacing:-.06em;color:var(--blue);font-variant-numeric:tabular-nums}.phase{margin-top:10px;font-size:18px;color:var(--blue)}.micro,.stamp{font-size:8px;color:var(--muted)}.bottleneck{margin-top:8px;font-size:10px}.capacity{display:grid;grid-template-columns:repeat(4,1fr)}.cap{padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.cap:nth-child(4n){border-right:0}.cap:nth-last-child(-n+4){border-bottom:0}.cap small{display:block;font-size:6px;color:var(--muted);letter-spacing:.08em}.cap strong{display:block;margin-top:2px;font-size:22px;font-weight:450}.cap.bad strong{color:var(--bad)}.cap.ok strong{color:var(--ok)}.cap.res strong{color:var(--blue)}.media{display:grid;grid-template-rows:1fr auto;min-height:150px}.mediaFrame{position:relative;min-height:116px;background:#050506}.mediaFrame video,.mediaFrame iframe{width:100%;height:100%;position:absolute;inset:0;border:0}.mediaEmpty{position:absolute;inset:0;display:grid;place-items:center;color:#555;font-size:8px}.mediaCtl{display:flex;gap:6px;padding:6px;border-top:1px solid var(--line)}.mediaCtl input{min-width:0;flex:1;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--muted);font-size:9px;outline:none}.mediaCtl button{background:none;border:1px solid var(--line);color:var(--muted);font-size:8px;padding:5px 7px}.main{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:10px}.board{overflow:auto}.axis,.lane{display:grid;grid-template-columns:66px repeat(12,minmax(112px,1fr));min-width:1410px}.axis{border-bottom:1px solid var(--line)}.axis span,.lname{padding:6px;font-size:7px;color:var(--muted)}.lane{border-bottom:1px solid rgba(255,255,255,.04)}.cell{padding:3px;border-left:1px solid rgba(255,255,255,.035);min-height:38px;display:grid;gap:3px;align-content:start}.block{border:1px solid #302c35;background:#09090b;color:var(--fg);padding:4px 5px;text-align:left;min-height:31px;position:relative}.block.sel{border-color:var(--vio)}.block.ready{box-shadow:inset 2px 0 var(--blue)}.block.in_flight{box-shadow:inset 2px 0 var(--vio)}.block.result{box-shadow:inset 2px 0 var(--warn)}.block.verified{box-shadow:inset 2px 0 var(--blue)}.block.consumed{box-shadow:inset 2px 0 var(--ok);opacity:.6}.block.waiting{opacity:.4}.block.crit:after{content:"";position:absolute;right:3px;top:3px;width:4px;height:4px;background:var(--warn)}.bid{font-size:7px;color:var(--vio)}.bt{font-size:7px;line-height:1.15}.bs{font-size:6px;color:var(--muted);margin-top:3px}.detail{padding:8px}.detail h2{margin:0;font-size:24px;color:var(--vio);font-weight:400}.detail h3{margin:3px 0 9px;font-size:10px;font-weight:500}.kv{border-top:1px solid var(--line);padding:6px 0}.kv small{display:block;font-size:6px;color:var(--muted)}.kv span{display:block;font-size:8px;margin-top:2px;line-height:1.35}.lower{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:10px}.timeline{overflow:auto}.taxis,.trow{display:grid;grid-template-columns:98px minmax(760px,1fr);min-width:870px}.taxis{height:23px;border-bottom:1px solid var(--line)}.ttrack{position:relative}.tick{position:absolute;top:6px;transform:translateX(-50%);font-size:7px;color:var(--muted)}.trow{min-height:22px;border-bottom:1px solid rgba(255,255,255,.035)}.tlabel{font-size:7px;color:var(--muted);padding:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.span{position:absolute;top:9px;height:3px;background:var(--vio);min-width:2px}.now{position:absolute;top:0;bottom:0;width:1px;background:var(--blue)}.history{padding:8px;display:grid;gap:7px}.hrow{display:grid;grid-template-columns:34px 1fr;gap:6px;align-items:center}.hname{font-size:7px;color:var(--muted)}.htrack{height:8px;background:#111114;position:relative}.hfill{position:absolute;left:0;top:0;bottom:0;background:#77707f}.section{font-size:7px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.foot{font-size:7px;color:#666}@media(max-width:900px){.top{grid-template-columns:1fr}.main,.lower{grid-template-columns:1fr}.capacity{grid-template-columns:repeat(2,1fr)}.cap:nth-child(odd){border-right:1px solid var(--line)}.cap:nth-child(even){border-right:0}.media{min-height:180px}.clock{font-size:22vw}.detail{min-height:0}}
</style></head><body><main>
<section class="top"><div class="clockbox"><div class="brand">PROMETEO · CONTROL ÚNICO · 5/25</div><div class="clock" id="clock">--:--</div><div class="phase"><span id="phase">—</span> <span id="count">--:--</span></div><div class="micro" id="next"></div><div class="bottleneck" id="bottleneck">Bottleneck: cargando…</div><div class="stamp" id="fresh"></div></div><div class="capacity" id="capacity"></div><div class="media"><div class="mediaFrame" id="mediaFrame"><video id="player" controls playsinline></video><div class="mediaEmpty" id="mediaEmpty">VIDEO / MÚSICA</div></div><div class="mediaCtl"><input id="mediaUrl" placeholder="YouTube o archivo directo"><button id="mediaSave">usar</button></div></div></section>
<div class="section">MAPA CAUSAL · 64 BLOQUES FUNGIBLES</div><section class="main"><div class="board"><div class="axis" id="axis"></div><div id="board"></div></div><aside class="detail" id="detail"></aside></section>
<div class="section">TIEMPO REAL · WC DEL BATCH / HISTORIA</div><section class="lower"><div class="timeline"><div class="taxis"><div></div><div class="ttrack" id="taxis"></div></div><div id="trows"></div></div><div class="history"><div class="section">últimos 7 días</div><div id="history"></div></div></section>
<div class="foot" id="foot">RESERVE/FALTAN/REFILL_N son proyecciones externas. Ningún WC sabe si es “reserva”. Esta página observa; no concede authority.</div>
<script>
(()=>{'use strict';const PLAN='../work-score/data.json',TL='../../../live/activity-timeline.json',FR='../../../live/claim-frontier.json',AL='../../../live/allocator.json',BATCH='PROMETEO-10WC-PRE-RUN-V1',PREFIX='portfolio-10wc-pre-run-',MEDIA='prometeo.control.media.v1';let plan=null,tl=null,fr=null,al=null,sel=null;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m])),pad=n=>String(n).padStart(2,'0');async function j(u){const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}function tick(){const n=new Date(),s=(n.getMinutes()%30)*60+n.getSeconds(),human=s<300,e=human?s:s-300,total=human?300:1500,rem=Math.max(0,total-e),next=new Date(n.getTime()+rem*1000);$('clock').textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}`;$('phase').textContent=human?'5 min · vos':'25 min · afuera';$('count').textContent=`${pad(Math.floor(rem/60))}:${pad(Math.ceil(rem%60))}`;$('next').textContent=human?`a las ${pad(next.getHours())}:${pad(next.getMinutes())} arranca Prometeo`:`a las ${pad(next.getHours())}:${pad(next.getMinutes())} vuelve tu ventana`}function jid(id){return PREFIX+String(id).toLowerCase()}function readyIds(){const z=new Set();for(const lane of ['ready','queue_ready'])for(const row of al?.[lane]||[])if(String(row?.job_id||'').startsWith(PREFIX))z.add(row.job_id);return z}function eventMap(){const rank={RESULT:1,VERIFIED:2,CONSUMED:3},m=new Map();for(const e of tl?.events||[]){const w=String(e?.work_id||'');if(!w.startsWith(PREFIX)||!rank[e.type])continue;const old=m.get(w);if(!old||rank[e.type]>rank[old])m.set(w,e.type)}return m}function workers(){const now=Date.now(),rows=[];for(const s of tl?.spans||[]){if(s.actor_kind!=='worker'||s.batch_id!==BATCH)continue;if(!['LAUNCHED','OBSERVED_WORKING'].includes(s.status))continue;const t=Date.parse(s.last_activity_at||s.end_at||s.start_at||'');if(Number.isFinite(t)&&now-t<=15*60000)rows.push(s)}return rows}function states(){const ready=readyIds(),events=eventMap(),m=new Map();for(const b of plan?.blocks||[]){const term=events.get(jid(b.block_id));if(term)m.set(b.block_id,term);else if(ready.has(jid(b.block_id)))m.set(b.block_id,'READY');else{const deps=b.dependencies||[],ok=deps.every(id=>['RESULT','VERIFIED','CONSUMED'].includes(m.get(id)||events.get(jid(id))));m.set(b.block_id,deps.length&&!ok?'WAITING':'IN_FLIGHT')}}return m}function render(){if(!plan)return;const st=states(),bs=plan.blocks||[],ws=workers(),working=ws.filter(w=>w.status==='OBSERVED_WORKING').length,transition=ws.length-working,ready=readyIds().size,target=plan.worker_model?.target_concurrent_wc||10,needed=Math.min(target,Math.max(0,ready+working)),missing=Math.max(0,needed-ws.length),reserve=Math.max(0,ws.length-needed),consumed=bs.filter(b=>st.get(b.block_id)==='CONSUMED').length,waiting=bs.filter(b=>st.get(b.block_id)==='WAITING').length;$('capacity').innerHTML=[['WC TARGET',target,''],['OBSERVED',ws.length,ws.length>=target?'ok':''],['WORKING',working,''],['TRANSITION',transition,''],['RESERVE',reserve,'res'],['FALTAN',missing,missing?'bad':'ok'],['REFILL_N',missing,missing?'bad':'ok'],['READY',ready,''],['CONSUMED',consumed,'ok'],['WAITING',waiting,''],['BLOCKS',bs.length,''],['DEPTH LEFT',Math.max(0,...bs.filter(b=>st.get(b.block_id)!=='CONSUMED').map(b=>b.depth)), '']].map(x=>`<div class="cap ${x[2]}"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('');$('bottleneck').textContent='Bottleneck: '+(missing?`faltan ${missing} WC`:ready?`${ready} bloques READY`:(waiting?`${waiting} esperando dependencias`:'sin trabajo pendiente visible'));const md=Math.max(...bs.map(b=>b.depth),0),ds=Array.from({length:md+1},(_,i)=>i),lanes=[...new Set(bs.map(b=>b.lane))],cols=`66px repeat(${ds.length},minmax(112px,1fr))`,mw=66+112*ds.length;$('axis').style.gridTemplateColumns=cols;$('axis').style.minWidth=mw+'px';$('axis').innerHTML='<span>LANE</span>'+ds.map(d=>`<span>D${d}</span>`).join('');if(!sel)sel=bs[0]?.block_id;$('board').innerHTML=lanes.map(l=>`<div class="lane" style="grid-template-columns:${cols};min-width:${mw}px"><div class="lname">${esc(l)}</div>${ds.map(d=>`<div class="cell">${bs.filter(b=>b.lane===l&&b.depth===d).map(b=>`<button class="block ${(st.get(b.block_id)||'WAITING').toLowerCase()} ${b.critical?'crit':''} ${b.block_id===sel?'sel':''}" data-b="${b.block_id}"><div class="bid">${b.block_id}</div><div class="bt">${esc(b.title)}</div><div class="bs">${st.get(b.block_id)||'WAITING'}</div></button>`).join('')}</div>`).join('')}</div>`).join('');document.querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>{sel=x.dataset.b;render()});const b=bs.find(x=>x.block_id===sel)||bs[0],kids=bs.filter(x=>(x.dependencies||[]).includes(b.block_id)).map(x=>x.block_id);$('detail').innerHTML=`<h2>${b.block_id}</h2><h3>${esc(b.title)}</h3><div class="kv"><small>estado</small><span>${st.get(b.block_id)}</span></div><div class="kv"><small>deps</small><span>${esc((b.dependencies||[]).join(', ')||'ninguna')}</span></div><div class="kv"><small>desbloquea</small><span>${esc(kids.join(', ')||'ninguno')}</span></div><div class="kv"><small>estimado</small><span>${b.expected_minutes} min · cualquier WC compatible</span></div>`;renderTimeline();renderHistory()}function renderTimeline(){if(!tl)return;const end=Date.now(),start=end-45*60000,sp=(tl.spans||[]).filter(s=>s.actor_kind==='worker'&&s.batch_id===BATCH&&Date.parse(s.end_at||s.last_activity_at||s.start_at)>=start&&Date.parse(s.start_at)<=end).slice(-40),pct=t=>Math.max(0,Math.min(100,(Date.parse(t)-start)/(end-start)*100));$('taxis').innerHTML=[0,15,30,45].map(m=>`<span class="tick" style="left:${m/45*100}%">-${45-m}m</span>`).join('')+'<i class="now" style="left:100%"></i>';$('trows').innerHTML=sp.map(s=>{const a=pct(s.start_at),b=pct(s.end_at||s.last_activity_at||s.start_at);return `<div class="trow"><div class="tlabel">${esc(String(s.actor_id||'').replace(/^wc-/,'').slice(0,18))}</div><div class="ttrack"><i class="span" style="left:${a}%;width:${Math.max(.2,b-a)}%" title="${esc(s.status)}"></i></div></div>`}).join('')||'<div class="trow"><div class="tlabel">sin WC de este batch</div><div></div></div>'}function renderHistory(){if(!tl)return;const n=new Date(),rows=[];for(let d=6;d>=0;d--){const day=new Date(n);day.setHours(0,0,0,0);day.setDate(day.getDate()-d);const a=+day,b=a+86400000;let count=0;for(const s of tl.spans||[]){const ss=Date.parse(s.start_at),ee=Date.parse(s.end_at||s.last_activity_at||s.start_at);if(ee>=a&&ss<b)count++}rows.push({name:day.toLocaleDateString('es-AR',{weekday:'short'}),count})}const mx=Math.max(1,...rows.map(r=>r.count));$('history').innerHTML=rows.map(r=>`<div class="hrow"><div class="hname">${r.name}</div><div class="htrack"><i class="hfill" style="width:${r.count/mx*100}%"></i></div></div>`).join('')}function mediaId(v){try{const u=new URL(v);if(u.hostname.includes('youtu.be'))return u.pathname.slice(1);if(u.hostname.includes('youtube.com'))return u.searchParams.get('v')||u.pathname.split('/').filter(Boolean).pop()}catch{}return null}function setMedia(src){localStorage.setItem(MEDIA,src||'');const f=$('mediaFrame');f.innerHTML='';if(!src){f.innerHTML='<video id="player" controls playsinline></video><div class="mediaEmpty">VIDEO / MÚSICA</div>';return}const id=mediaId(src);if(id){const x=document.createElement('iframe');x.allow='autoplay; encrypted-media; picture-in-picture';x.allowFullscreen=true;x.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id);f.append(x)}else{const v=document.createElement('video');v.controls=true;v.playsInline=true;v.src=src;f.append(v)}}async function load(){let notes=[];for(const [k,u] of [['plan',PLAN],['tl',TL],['fr',FR],['al',AL]])try{const v=await j(u);if(k==='plan')plan=v;else if(k==='tl')tl=v;else if(k==='fr')fr=v;else al=v}catch{notes.push(k)}const times=[tl?.generated_at,fr?.generated_at,al?.generated_at].map(Date.parse).filter(Number.isFinite),gt=times.length?Math.max(...times):NaN;$('fresh').textContent=Number.isFinite(gt)?`evidencia ${new Date(gt).toLocaleTimeString('es-AR')}`:'sin evidencia live';$('foot').textContent='RESERVE/FALTAN/REFILL_N son proyecciones externas. Ningún WC sabe si es “reserva”. Esta página observa; no concede authority.'+(notes.length?' · faltan fuentes: '+notes.join(', '):'');render()}$('mediaSave').onclick=()=>setMedia($('mediaUrl').value.trim());const saved=localStorage.getItem(MEDIA)||'';$('mediaUrl').value=saved;if(saved)setMedia(saved);tick();setInterval(tick,1000);load();setInterval(load,10000)})();
</script></main></body></html>
