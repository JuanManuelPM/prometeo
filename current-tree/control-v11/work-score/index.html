<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Prometeo · Control</title>
<style>
:root{color-scheme:dark;--bg:#08080a;--panel:#0c0c0f;--fg:#f2f2ef;--muted:#77727f;--line:#2d2932;--blue:#83c7ff;--ok:#79d39d;--warn:#e9b35a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.shell{height:100%;display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,29vw,460px)}
.control{position:relative;min-width:0;height:100%;background:#08080a}
#controlFrame{width:100%;height:100%;border:0;background:#08080a}
.update{position:absolute;z-index:20;left:14px;top:10px;display:none;align-items:center;gap:8px;border:1px solid #49414f;background:#151219;color:#f2eafd;border-radius:999px;padding:7px 11px;font-size:11px;box-shadow:0 10px 30px rgba(0,0,0,.42);cursor:pointer}
.update.show{display:flex}.update i{width:7px;height:7px;border-radius:50%;background:var(--warn)}.update.busy i{background:var(--blue)}
.mediaDock{min-width:0;height:100%;border-left:1px solid var(--line);background:#050506;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.mediaHead{height:34px;display:flex;align-items:center;gap:8px;padding:0 9px;border-bottom:1px solid var(--line);color:var(--muted);font-size:9px;letter-spacing:.08em}
.mediaHead b{color:#bbb7c1;font-weight:600}.mediaHead .spacer{flex:1}.mediaHead button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px}
.mediaFrame{position:relative;min-height:0;background:#000}.mediaFrame video,.mediaFrame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.mediaEmpty{position:absolute;inset:0;display:grid;place-items:center;color:#4d4952;font-size:9px}
.mediaCtl{display:grid;grid-template-columns:auto auto auto minmax(0,1fr) auto;gap:6px;align-items:center;padding:7px;border-top:1px solid var(--line);background:#09090b}
.mediaCtl button{height:28px;min-width:30px;border:1px solid var(--line);background:#0c0c0f;color:#d8d5dc;font-size:10px;cursor:pointer}.mediaTime{font-size:9px;color:var(--muted);min-width:36px;text-align:center}.mediaCtl input{width:100%;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--line);outline:0;color:#aaa4b0;font-size:9px;padding:5px}
.mediaDock.min{grid-template-rows:auto 0 auto}.mediaDock.min .mediaFrame{display:none}
@media(max-width:980px){.shell{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 210px}.mediaDock{border-left:0;border-top:1px solid var(--line);grid-template-rows:auto minmax(0,1fr) auto}.mediaHead{height:28px}.mediaCtl{padding:5px}}
@media(max-width:620px){.shell{grid-template-rows:minmax(0,1fr) 170px}.mediaCtl{grid-template-columns:auto auto auto 1fr}.mediaCtl input{display:none}.mediaCtl .use{display:none}}
</style></head>
<body><main class="shell">
<section class="control">
  <button id="updateBtn" class="update" type="button"><i></i><span>ACTUALIZACIÓN DISPONIBLE</span></button>
  <iframe id="controlFrame" title="Prometeo · Work Score"></iframe>
</section>
<aside class="mediaDock" id="mediaDock">
  <div class="mediaHead"><b>VIDEO / MÚSICA</b><span class="spacer"></span><button id="mediaMin" type="button" title="Minimizar">▾</button></div>
  <div class="mediaFrame" id="mediaFrame"><div class="mediaEmpty">pegá una fuente abajo</div></div>
  <div class="mediaCtl"><button id="mediaPlay" type="button">▶</button><button id="mediaMute" type="button">🔊</button><span class="mediaTime" id="mediaTime">0:00</span><input id="mediaUrl" placeholder="YouTube o archivo directo"><button class="use" id="mediaSave" type="button">usar</button></div>
</aside>
</main>
<script>
(()=>{'use strict';
const APP='./app.html',MEDIA='prometeo.control.media.v2',FRAME=document.getElementById('controlFrame'),UPDATE=document.getElementById('updateBtn');
let loadedHash=null,latestHash=null,checking=false,ytFrame=null;
const pad=n=>String(n).padStart(2,'0');
async function hashText(t){const b=new TextEncoder().encode(t);const d=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function fetchApp(){const r=await fetch(APP+'?probe='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP_'+r.status);const t=await r.text();return {text:t,hash:await hashText(t)}}
async function boot(){try{const x=await fetchApp();loadedHash=x.hash;latestHash=x.hash}catch{}FRAME.src=APP+'?embedded=1&boot='+Date.now()}
async function checkUpdate(){if(checking)return;checking=true;try{const x=await fetchApp();latestHash=x.hash;if(loadedHash&&latestHash!==loadedHash)UPDATE.classList.add('show')}catch{}finally{checking=false}}
UPDATE.onclick=async()=>{if(!latestHash||latestHash===loadedHash)return;UPDATE.classList.add('busy');UPDATE.querySelector('span').textContent='ACTUALIZANDO CONTROL…';FRAME.src=APP+'?embedded=1&v='+encodeURIComponent(latestHash.slice(0,12))+'&t='+Date.now();loadedHash=latestHash;UPDATE.classList.remove('show','busy');UPDATE.querySelector('span').textContent='ACTUALIZACIÓN DISPONIBLE'};
setInterval(checkUpdate,12000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});

function readMedia(){const raw=localStorage.getItem(MEDIA)||'';try{const x=JSON.parse(raw);if(x&&typeof x==='object')return x}catch{}return{src:raw,t:0,volume:1,muted:false,playing:false}}
let ms=readMedia();function saveMedia(){try{localStorage.setItem(MEDIA,JSON.stringify(ms))}catch{}}
function mediaId(v){try{const u=new URL(v);if(u.hostname.includes('youtu.be'))return u.pathname.slice(1);if(u.hostname.includes('youtube.com'))return u.searchParams.get('v')||u.pathname.split('/').filter(Boolean).pop()}catch{}return null}
function fmt(t){t=Math.max(0,Math.floor(Number(t)||0));return Math.floor(t/60)+':'+pad(t%60)}
function buttons(){document.getElementById('mediaTime').textContent=fmt(ms.t);document.getElementById('mediaPlay').textContent=ms.playing?'❚❚':'▶';document.getElementById('mediaMute').textContent=ms.muted?'🔇':'🔊'}
function yt(func,args=[]){try{ytFrame?.contentWindow?.postMessage(JSON.stringify({event:'command',func,args}),'*')}catch{}}
function mountMedia(src,reset=false){if(reset||src!==ms.src)ms={src,t:0,volume:1,muted:false,playing:false};ms.src=src||'';saveMedia();const f=document.getElementById('mediaFrame');f.replaceChildren();ytFrame=null;if(!src){const e=document.createElement('div');e.className='mediaEmpty';e.textContent='pegá una fuente abajo';f.append(e);buttons();return}const id=mediaId(src);if(id){const x=document.createElement('iframe');x.allow='autoplay; encrypted-media; picture-in-picture';x.allowFullscreen=true;x.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?controls=0&rel=0&playsinline=1&enablejsapi=1&start='+Math.floor(ms.t||0);x.addEventListener('load',()=>{ytFrame=x;try{x.contentWindow.postMessage(JSON.stringify({event:'listening',id:'prometeo-shell'}),'*')}catch{}});f.append(x);ytFrame=x}else{const v=document.createElement('video');v.playsInline=true;v.src=src;v.volume=Math.max(0,Math.min(1,ms.volume??1));v.muted=!!ms.muted;v.addEventListener('loadedmetadata',()=>{if(Number.isFinite(ms.t)&&ms.t>0)try{v.currentTime=Math.min(ms.t,Number.isFinite(v.duration)?Math.max(0,v.duration-.2):ms.t)}catch{}});v.addEventListener('timeupdate',()=>{ms.t=v.currentTime;ms.volume=v.volume;ms.muted=v.muted;ms.playing=!v.paused;saveMedia();buttons()});v.addEventListener('play',()=>{ms.playing=true;saveMedia();buttons()});v.addEventListener('pause',()=>{ms.playing=false;saveMedia();buttons()});f.append(v)}buttons()}
document.getElementById('mediaSave').onclick=()=>mountMedia(document.getElementById('mediaUrl').value.trim(),true);
document.getElementById('mediaPlay').onclick=()=>{const v=document.getElementById('mediaFrame').querySelector('video');if(ytFrame){ms.playing?yt('pauseVideo'):yt('playVideo')}else if(v){v.paused?v.play().catch(()=>{}):v.pause()}};
document.getElementById('mediaMute').onclick=()=>{const v=document.getElementById('mediaFrame').querySelector('video');ms.muted=!ms.muted;if(ytFrame)yt(ms.muted?'mute':'unMute');else if(v)v.muted=ms.muted;saveMedia();buttons()};
document.getElementById('mediaMin').onclick=()=>document.getElementById('mediaDock').classList.toggle('min');
window.addEventListener('message',e=>{if(!String(e.origin||'').includes('youtube'))return;let d=e.data;try{if(typeof d==='string')d=JSON.parse(d)}catch{return}const i=d?.info;if(d?.event==='infoDelivery'&&i){if(Number.isFinite(i.currentTime))ms.t=i.currentTime;if(Number.isFinite(i.playerState))ms.playing=i.playerState===1;if(typeof i.muted==='boolean')ms.muted=i.muted;saveMedia();buttons()}});
setInterval(()=>{if(ytFrame){yt('getCurrentTime');yt('getPlayerState')}},2000);
document.getElementById('mediaUrl').value=ms.src||'';if(ms.src)mountMedia(ms.src,false);else buttons();boot();
})();
</script></body></html>
