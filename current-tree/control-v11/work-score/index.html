<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prometeo · Control</title>
<style>
:root{
  color-scheme:dark;
  --bg:#070708;--bar:#0b0b0d;--panel:#0d0d10;--line:#25232b;
  --text:#d7d3dd;--muted:#6e6875;--red:#ef5968;--amber:#d8aa5f;
  --gap:14px;--top:26px;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:radial-gradient(circle at 77% 15%,rgba(119,79,149,.07),transparent 34%),linear-gradient(#080809,#060607)}
button{font:inherit}
.shell{height:100dvh;display:grid;grid-template-rows:var(--top) minmax(0,1fr)}
.topbar{position:relative;z-index:100;display:flex;align-items:center;gap:7px;padding:0 10px;background:rgba(10,10,12,.97);border-bottom:1px solid #18171c}
.top-refresh{width:18px;height:18px;border:0;padding:0;display:grid;place-items:center;background:transparent;color:#88828e;cursor:pointer;font-size:12px}
.top-refresh:hover{color:#d7d3dd}
.top-dot,.widget-dot{width:7px;height:7px;border:0;padding:0;border-radius:50%;background:var(--red);cursor:pointer;box-shadow:0 0 0 0 rgba(239,89,104,.30);animation:pulse 1.8s ease-out infinite}
.top-dot.available{background:var(--amber)}
.top-dot.error,.widget-dot.loading{background:#706a75;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,89,104,.30)}70%{box-shadow:0 0 0 5px rgba(239,89,104,0)}100%{box-shadow:0 0 0 0 rgba(239,89,104,0)}}
.top-spacer{flex:1}
.top-pop{position:absolute;left:28px;top:24px;display:none;min-width:220px;padding:8px 10px;border:1px solid #29252f;border-radius:0 0 6px 6px;background:#0b0a0e;box-shadow:0 12px 26px rgba(0,0,0,.35);color:#7c7482;font:8px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.top-pop.open{display:block}.top-pop b{display:block;color:#c2b8c8;font-weight:600}
.workspace{min-height:0;overflow:auto;padding:var(--gap);scrollbar-width:thin;scrollbar-color:#29252f transparent}
.grid{height:100%;min-height:680px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(430px,2.35fr) minmax(190px,1fr);gap:var(--gap)}
.widget{position:relative;min-width:0;min-height:0;display:grid;grid-template-rows:24px minmax(0,1fr);background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:visible;box-shadow:0 12px 28px rgba(0,0,0,.22)}
.widget.main{grid-column:1/-1}
.widget.is-fullscreen{position:fixed;z-index:90;top:var(--top);left:0;right:0;bottom:0;width:auto!important;height:auto!important;margin:0;border-radius:0;grid-column:auto!important}
.widget-head{position:relative;z-index:3;display:flex;align-items:center;gap:7px;padding:0 7px;background:#0a0a0c;border-bottom:1px solid #1d1b21;user-select:none}
.widget-dot{width:6px;height:6px;flex:0 0 auto;animation-duration:2.2s}
.widget-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#716a78;font:8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}
.widget-spacer{flex:1}
.widget-settings{width:18px;height:18px;display:grid;place-items:center;border:0;background:transparent;color:#5d5763;cursor:pointer;font-size:12px}
.widget-settings:hover{color:#c9c2ce}
.widget-body{position:relative;min-height:0;overflow:hidden;background:#09090b}
.widget iframe{width:100%;height:100%;border:0;display:block;background:#09090b}
.placeholder{height:100%;display:grid;place-items:center;color:#39343e;font:9px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center;padding:20px}
.menu,.status-pop{position:absolute;z-index:30;top:22px;display:none;border:1px solid #2d2834;border-radius:5px;background:#0b0a0e;box-shadow:0 12px 26px rgba(0,0,0,.35)}
.menu{right:5px;width:164px;padding:4px}.status-pop{left:5px;min-width:190px;max-width:290px;padding:8px 9px;color:#746c7c;font:8px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.menu.open,.status-pop.open{display:block}.status-pop b{display:block;color:#bbb0c2;font-weight:600}
.menu button{width:100%;border:0;background:transparent;color:#817888;text-align:left;padding:7px 8px;border-radius:3px;cursor:pointer;font:8px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.05em}
.menu button:hover{background:#151119;color:#d6cbdc}
@media(max-width:800px){.grid{grid-template-columns:1fr;grid-template-rows:72vh 42vh 30vh;min-height:150vh}.widget.main{grid-column:auto}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <button id="checkBtn" class="top-refresh" title="Comprobar actualización">↻</button>
    <button id="topDot" class="top-dot" title="Estado de Control"></button>
    <div id="topPop" class="top-pop"><b>CONTROL</b><span id="topText">comprobando…</span></div>
    <div class="top-spacer"></div>
  </header>

  <main class="workspace">
    <div class="grid">
      <section class="widget main" data-widget data-name="PRIMARY CHAT" data-src="../chat-canary/">
        <div class="widget-head">
          <button class="widget-dot loading" data-dot title="Estado"></button>
          <span class="widget-name">PRIMARY CHAT</span><div class="widget-spacer"></div>
          <button class="widget-settings" data-settings title="Ajustes">⚙</button>
          <div class="status-pop" data-status><b>PRIMARY CHAT</b><span data-status-text>cargando…</span></div>
          <div class="menu" data-menu>
            <button data-action="fullscreen">PANTALLA COMPLETA</button>
            <button data-action="reload">RECARGAR WIDGET</button>
            <button data-action="open">ABRIR SOLO</button>
          </div>
        </div>
        <div class="widget-body"><iframe data-frame title="Primary Chat"></iframe></div>
      </section>

      <section class="widget" data-widget data-name="WORK SCORE" data-src="./app.html?embedded=1">
        <div class="widget-head">
          <button class="widget-dot loading" data-dot title="Estado"></button>
          <span class="widget-name">WORK SCORE</span><div class="widget-spacer"></div>
          <button class="widget-settings" data-settings title="Ajustes">⚙</button>
          <div class="status-pop" data-status><b>WORK SCORE</b><span data-status-text>cargando…</span></div>
          <div class="menu" data-menu>
            <button data-action="fullscreen">PANTALLA COMPLETA</button>
            <button data-action="reload">RECARGAR WIDGET</button>
            <button data-action="open">ABRIR SOLO</button>
          </div>
        </div>
        <div class="widget-body"><iframe data-frame title="Work Score"></iframe></div>
      </section>

      <section class="widget" data-widget data-name="OLA · 60 MIN" data-src="./live-stats.html">
        <div class="widget-head">
          <button class="widget-dot loading" data-dot title="Estado"></button>
          <span class="widget-name">OLA · 60 MIN</span><div class="widget-spacer"></div>
          <button class="widget-settings" data-settings title="Ajustes">⚙</button>
          <div class="status-pop" data-status><b>OLA · 60 MIN</b><span data-status-text>cargando métricas…</span></div>
          <div class="menu" data-menu>
            <button data-action="fullscreen">PANTALLA COMPLETA</button>
            <button data-action="reload">RECARGAR WIDGET</button>
            <button data-action="open">ABRIR SOLO</button>
          </div>
        </div>
        <div class="widget-body"><iframe data-frame title="Ola 60 minutos"></iframe></div>
      </section>
    </div>
  </main>
</div>

<script>
(()=>{
  const MANIFEST='../control-manifest.json';
  const widgets=[...document.querySelectorAll('[data-widget]')];
  const topDot=document.getElementById('topDot'),topPop=document.getElementById('topPop'),topText=document.getElementById('topText');
  let loadedVersion=null,latestVersion=null;

  function closeMenus(except=null){
    document.querySelectorAll('.menu.open,.status-pop.open,.top-pop.open').forEach(x=>{if(x!==except)x.classList.remove('open')});
  }
  function stamp(iso){
    try{return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(new Date(iso))+' ART'}catch{return iso||''}
  }
  async function checkManifest(){
    topDot.classList.remove('available','error');
    try{
      const r=await fetch(MANIFEST+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok)throw Error('HTTP '+r.status);
      const m=await r.json(); latestVersion=m.control_version;
      if(!loadedVersion)loadedVersion=latestVersion;
      if(latestVersion!==loadedVersion){topDot.classList.add('available');topText.textContent='nueva versión · '+String(loadedVersion).slice(0,8)+' → '+String(latestVersion).slice(0,8)}
      else topText.textContent=(m.published_at?stamp(m.published_at)+' · ':'')+'sin cambios';
    }catch(e){topDot.classList.add('error');topText.textContent='no pude comprobar · '+String(e.message||e)}
  }
  function loadWidget(widget){
    const src=widget.dataset.src,frame=widget.querySelector('[data-frame]'),dot=widget.querySelector('[data-dot]'),st=widget.querySelector('[data-status-text]');
    if(!src||!frame){dot?.classList.remove('loading');return}
    dot.classList.add('loading');
    if(st)st.textContent='cargando…';
    frame.onload=()=>{dot.classList.remove('loading');if(st)st.textContent='cargado'};
    frame.src=src+(src.includes('?')?'&':'?')+'shell='+Date.now();
  }
  widgets.forEach(widget=>{
    const menu=widget.querySelector('[data-menu]'),status=widget.querySelector('[data-status]'),settings=widget.querySelector('[data-settings]'),dot=widget.querySelector('[data-dot]'),src=widget.dataset.src;
    settings?.addEventListener('click',e=>{e.stopPropagation();const open=!menu.classList.contains('open');closeMenus();menu.classList.toggle('open',open)});
    dot?.addEventListener('click',e=>{e.stopPropagation();const open=!status.classList.contains('open');closeMenus();status.classList.toggle('open',open)});
    menu?.addEventListener('click',e=>{
      const action=e.target?.dataset?.action;if(!action)return;
      if(action==='fullscreen'){
        const active=widget.classList.toggle('is-fullscreen');
        e.target.textContent=active?'SALIR DE PANTALLA COMPLETA':'PANTALLA COMPLETA';
        widgets.forEach(w=>{if(w!==widget){w.classList.remove('is-fullscreen');const b=w.querySelector('[data-action="fullscreen"]');if(b)b.textContent='PANTALLA COMPLETA'}});
      }
      if(action==='reload')loadWidget(widget);
      if(action==='open'&&src)window.open(new URL(src,location.href).href,'_blank','noopener');
      menu.classList.remove('open');
    });
    loadWidget(widget);
  });
  document.getElementById('checkBtn').addEventListener('click',checkManifest);
  topDot.addEventListener('click',e=>{e.stopPropagation();const open=!topPop.classList.contains('open');closeMenus();topPop.classList.toggle('open',open)});
  document.addEventListener('click',()=>closeMenus());
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){widgets.forEach(w=>{w.classList.remove('is-fullscreen');const b=w.querySelector('[data-action="fullscreen"]');if(b)b.textContent='PANTALLA COMPLETA'});closeMenus()}});
  checkManifest(); setInterval(checkManifest,12000);
})();
</script>
</body>
</html>
