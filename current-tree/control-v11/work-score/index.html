<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prometeo · Work Score</title>
<style>
:root{color-scheme:dark;--bg:#08080a;--panel:#0c0c0f;--fg:#f3f1f6;--muted:#8b8791;--line:#2c2931;--vio:#aa7cff;--blue:#83c7ff;--warn:#e9b35a;--bad:#ff746c;--ok:#79d39d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{border-top:2px solid var(--vio)}main{padding:14px 16px 26px}header{display:flex;justify-content:space-between;gap:12px}.brand{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}.stamp{font-size:8px;color:var(--muted)}
.top{display:grid;grid-template-columns:minmax(240px,.8fr) minmax(0,1.2fr);gap:14px;align-items:end;margin:14px 0}.clock{font-size:clamp(62px,10vw,128px);line-height:.82;font-weight:250;letter-spacing:-.065em;color:var(--blue);font-variant-numeric:tabular-nums}.phase{margin-top:16px;font-size:clamp(16px,2.4vw,28px);color:var(--blue)}.phase small{font-size:.55em;color:var(--muted)}
.capacity{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--line);background:var(--panel)}.cap{padding:9px 10px;border-right:1px solid var(--line)}.cap:last-child{border-right:0}.cap small{display:block;font-size:7px;letter-spacing:.1em;color:var(--muted)}.cap strong{display:block;font-size:22px;font-weight:450;margin-top:3px;font-variant-numeric:tabular-nums}.cap.bad strong{color:var(--bad)}.cap.res strong{color:var(--blue)}
.section-title{display:flex;justify-content:space-between;gap:10px;align-items:end;margin:12px 0 6px;font-size:8px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}.section-title b{color:var(--fg);font-weight:500;letter-spacing:0}
.map-shell{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:9px}.score{border:1px solid var(--line);overflow:auto;background:var(--panel)}.axis,.lane{display:grid;grid-template-columns:68px repeat(12,minmax(128px,1fr));min-width:1604px}.axis{border-bottom:1px solid var(--line)}.axis span{padding:6px 7px;font-size:7px;color:var(--muted);border-right:1px solid rgba(255,255,255,.04)}.lane{border-bottom:1px solid rgba(255,255,255,.04)}.lname{padding:8px 7px;font-size:7px;letter-spacing:.08em;color:var(--muted)}.cell{padding:4px;border-left:1px solid rgba(255,255,255,.035);min-height:44px;display:grid;gap:3px;align-content:start}
.block{position:relative;border:1px solid #302c35;background:#09090b;color:var(--fg);padding:5px 6px;text-align:left;min-height:36px}.block.sel,.block:hover{border-color:var(--vio)}.block.ready{box-shadow:inset 2px 0 var(--blue)}.block.working{box-shadow:inset 2px 0 var(--vio)}.block.done{box-shadow:inset 2px 0 var(--ok);opacity:.62}.block.waiting{opacity:.48}.block.rel{border-color:#655678}.block.crit:after{content:"";position:absolute;right:4px;top:4px;width:4px;height:4px;background:var(--warn)}.bid{font-size:7px;color:var(--vio)}.bt{font-size:7px;line-height:1.2;margin-top:2px}.bs{font-size:6px;color:var(--muted);margin-top:4px;text-transform:uppercase}
.detail{border:1px solid var(--line);background:var(--panel);min-height:270px}.detail h2{font-size:26px;color:var(--vio);font-weight:400;margin:10px 10px 0}.detail h3{font-size:11px;font-weight:500;margin:4px 10px 12px}.kv{border-top:1px solid var(--line);padding:7px 10px}.kv small{display:block;font-size:6px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}.kv span{display:block;font-size:8px;line-height:1.35;margin-top:2px}
.timeline{border:1px solid var(--line);background:var(--panel);overflow:auto}.taxis,.trow{display:grid;grid-template-columns:110px minmax(900px,1fr);min-width:1030px}.taxis{height:24px;border-bottom:1px solid var(--line)}.ttrack{position:relative}.tick{position:absolute;top:6px;transform:translateX(-50%);font-size:7px;color:var(--muted)}.trow{min-height:24px;border-bottom:1px solid rgba(255,255,255,.035)}.tlabel{font-size:7px;color:var(--muted);padding:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.span{position:absolute;top:10px;height:3px;background:var(--vio);min-width:2px}.span.stale{opacity:.25}.now{position:absolute;top:0;bottom:0;width:1px;background:var(--blue)}.note{font-size:7px;color:var(--muted);line-height:1.45;margin-top:6px}
@media(max-width:800px){main{padding:10px}.top{grid-template-columns:1fr}.capacity{grid-template-columns:repeat(3,1fr)}.cap:nth-child(3){border-right:0}.cap:nth-child(-n+3){border-bottom:1px solid var(--line)}.map-shell{grid-template-columns:1fr}.detail{min-height:0}.clock{font-size:22vw}}
</style></head>
<body><main>
<header><div><div class="brand">PROMETEO · WORK SCORE · 10WC</div><div class="stamp" id="date"></div></div><div class="stamp" id="fresh">cargando…</div></header>
<div class="top"><div><div class="clock" id="clock">--:--</div><div class="phase"><span id="phase">—</span> <small id="count">--:--</small></div></div><div class="capacity" id="capacity"></div></div>
<div class="section-title"><span>Mapa causal · bloques fungibles</span><b id="graphTitle">PRE-RUN</b></div>
<div class="map-shell"><div class="score"><div class="axis" id="axis"></div><div id="board"></div></div><aside class="detail" id="detail"></aside></div>
<div class="section-title"><span>Tiempo real · workers observados</span><b>últimos 45 min</b></div>
<div class="timeline"><div class="taxis"><div></div><div class="ttrack" id="taxis"></div></div><div id="trows"></div></div>
<div class="note" id="note">RESERVE/FALTAN son proyección externa. Ningún WC recibe ni conoce el rol “reserva”. La página observa evidencia; no concede authority.</div>
</main><script>
(()=>{const PLAN='./data.json',TL='../../../live/activity-timeline.json',FR='../../../live/claim-frontier.json';let plan=null,tl=null,fr=null,sel=null;
const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),pad=n=>String(n).padStart(2,'0');
async function j(u){const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}
function tick(){const n=new Date(),s=(n.getMinutes()%30)*60+n.getSeconds(),human=s<300,e=human?s:s-300,total=human?300:1500,rem=Math.max(0,total-e);$('clock').textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}`;$('date').textContent=n.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});$('phase').textContent=human?'5 min · vos':'25 min · afuera';$('count').textContent=`${pad(Math.floor(rem/60))}:${pad(Math.ceil(rem%60))}`}
function frontierIds(){const z=new Set(),w=x=>{if(!x)return;if(Array.isArray(x)){x.forEach(w);return}if(typeof x!=='object')return;if(typeof x.job_id==='string')z.add(x.job_id);Object.values(x).forEach(v=>{if(v&&typeof v==='object')w(v)})};w(fr);return z}
function freshWorkers(){const z=new Set(),now=Date.now();for(const s of tl?.spans||[]){if(s.actor_kind!=='worker'||s.status!=='OBSERVED_WORKING')continue;const t=Date.parse(s.last_activity_at||s.end_at||s.start_at||'');if(Number.isFinite(t)&&now-t<=15*60000)z.add(s.actor_id)}return z}
function jid(id){return `portfolio-10wc-pre-run-${id.toLowerCase()}`}
function states(){const f=frontierIds(),m=new Map();for(const b of plan?.blocks||[])m.set(b.block_id,f.has(jid(b.block_id))?'READY':(b.dependencies||[]).length?'WAITING':'READY');return m}
function render(){if(!plan)return;const st=states(),bs=plan.blocks||[],fresh=freshWorkers(),ready=bs.filter(b=>st.get(b.block_id)==='READY').length,target=plan.worker_model?.target_concurrent_wc||10,req=Math.min(target,ready),missing=Math.max(0,req-fresh.size),reserve=Math.max(0,fresh.size-req);
$('capacity').innerHTML=[['WC TARGET',target,''],['WC FRESH',fresh.size,''],['RESERVE',reserve,'res'],['FALTAN',missing,missing?'bad':''],['READY',ready,''],['BLOCKS',bs.length,'']].map(x=>`<div class="cap ${x[2]}"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('');
$('graphTitle').textContent=plan.graph_id||'PRE-RUN';const md=Math.max(...bs.map(b=>b.depth),0),ds=Array.from({length:md+1},(_,i)=>i),lanes=[...new Set(bs.map(b=>b.lane))];const cols=`68px repeat(${ds.length},minmax(128px,1fr))`,mw=68+128*ds.length;$('axis').style.gridTemplateColumns=cols;$('axis').style.minWidth=mw+'px';$('axis').innerHTML='<span>LANE</span>'+ds.map(d=>`<span>DEPTH ${d}</span>`).join('');if(!sel)sel=bs[0]?.block_id;
const cur=bs.find(b=>b.block_id===sel),rel=new Set([...(cur?.dependencies||[]),...bs.filter(b=>(b.dependencies||[]).includes(sel)).map(b=>b.block_id)]);
$('board').innerHTML=lanes.map(l=>`<div class="lane" style="grid-template-columns:${cols};min-width:${mw}px"><div class="lname">${esc(l)}</div>${ds.map(d=>`<div class="cell">${bs.filter(b=>b.lane===l&&b.depth===d).map(b=>`<button class="block ${(st.get(b.block_id)||'WAITING').toLowerCase()} ${b.critical?'crit':''} ${b.block_id===sel?'sel':''} ${rel.has(b.block_id)?'rel':''}" data-b="${b.block_id}"><div class="bid">${b.block_id}</div><div class="bt">${esc(b.title)}</div><div class="bs">${st.get(b.block_id)}</div></button>`).join('')}</div>`).join('')}</div>`).join('');
document.querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>{sel=x.dataset.b;render()});const b=bs.find(x=>x.block_id===sel)||bs[0],kids=bs.filter(x=>(x.dependencies||[]).includes(b.block_id)).map(x=>x.block_id);$('detail').innerHTML=`<h2>${b.block_id}</h2><h3>${esc(b.title)}</h3><div class="kv"><small>estado</small><span>${st.get(b.block_id)}</span></div><div class="kv"><small>deps</small><span>${esc((b.dependencies||[]).join(', ')||'ninguna')}</span></div><div class="kv"><small>desbloquea</small><span>${esc(kids.join(', ')||'ninguno')}</span></div><div class="kv"><small>capabilities</small><span>${esc((b.required_capabilities||[]).join(', '))}</span></div><div class="kv"><small>estimado</small><span>${b.expected_minutes} min · cualquier WC compatible</span></div>`;renderTimeline()}
function renderTimeline(){if(!tl)return;const end=Date.now(),start=end-45*60000,sp=(tl.spans||[]).filter(s=>s.actor_kind==='worker'&&Date.parse(s.end_at||s.last_activity_at||s.start_at)>=start&&Date.parse(s.start_at)<=end).slice(-40),pct=t=>Math.max(0,Math.min(100,(Date.parse(t)-start)/(end-start)*100));$('taxis').innerHTML=[0,15,30,45].map(m=>`<span class="tick" style="left:${m/45*100}%">-${45-m}m</span>`).join('')+'<i class="now" style="left:100%"></i>';$('trows').innerHTML=sp.map(s=>{const a=pct(s.start_at),b=pct(s.end_at||s.last_activity_at||s.start_at);return `<div class="trow"><div class="tlabel">${esc(String(s.actor_id||'').replace(/^wc-/,'').slice(0,18))}</div><div class="ttrack"><i class="span ${s.status==='STALE'?'stale':''}" style="left:${a}%;width:${Math.max(.2,b-a)}%" title="${esc(s.status)}"></i></div></div>`}).join('')||'<div class="trow"><div class="tlabel">sin workers frescos</div><div></div></div>'}
async function load(){let notes=[];try{plan=await j(PLAN)}catch(e){notes.push('plan unavailable')}try{tl=await j(TL)}catch(e){notes.push('timeline unavailable')}try{fr=await j(FR)}catch(e){notes.push('frontier unavailable')}const gt=Date.parse(tl?.generated_at||'');$('fresh').textContent=Number.isFinite(gt)?`evidencia ${new Date(gt).toLocaleTimeString('es-AR')}`:'sin evidencia live';if(notes.length)$('note').textContent+=' · '+notes.join(' · ');render()}
tick();setInterval(tick,1000);load();setInterval(load,10000)})();
</script></body></html>
