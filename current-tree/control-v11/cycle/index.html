<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prometeo · 5/25</title>
<style>
:root{color-scheme:dark;--bg:#09090a;--fg:#f2f2f2;--muted:#8d8d92;--line:#29292d;--accent:#8ed3a7;--warn:#f0b55a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif}body{background:radial-gradient(circle at 75% 18%,#1c1c1f 0,transparent 34%),#09090a}main{min-height:100vh;padding:22px 24px;border-top:2px solid var(--accent)}header,.summary,.runhead{display:flex;justify-content:space-between;gap:18px;align-items:flex-end}.brand{font-size:11px;letter-spacing:.18em;color:var(--muted)}.fresh,.hint,.meta,.notice{font-size:10px;color:var(--muted)}.hero{display:grid;grid-template-columns:1fr minmax(280px,38vw);gap:30px;align-items:end;margin:24px 0}.clock{font-size:clamp(72px,13vw,180px);line-height:.78;font-weight:250;letter-spacing:-.07em;color:var(--accent)}.phase{font-size:clamp(20px,3vw,38px);margin-top:24px;color:var(--accent)}.count{margin-left:12px}.media{aspect-ratio:16/9;border:1px solid var(--line);background:#050506;position:relative}.media video{width:100%;height:100%;display:block}.media-empty{position:absolute;inset:0;display:grid;place-items:center;color:#555;font-size:10px;letter-spacing:.12em}.mediactl{display:flex;gap:8px;margin-top:7px}.mediactl input{flex:1;min-width:0;background:none;border:0;border-bottom:1px solid var(--line);color:var(--muted);padding:6px}.mediactl button,.tabs button{background:none;border:0;color:var(--muted);cursor:pointer}.bottleneck{font-size:13px}.stats{font-size:11px;color:var(--muted);text-align:right}.tabs{display:flex;gap:18px;margin:18px 0 10px;overflow:auto}.tabs button{padding:0 0 5px;border-bottom:1px solid transparent}.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}.panel{display:none;border-top:1px solid var(--line);padding-top:12px}.panel.on{display:block}.runscore{font-size:28px;color:var(--accent)}.rows2{display:grid}.slot{display:grid;grid-template-columns:minmax(170px,1.2fr) 90px 130px minmax(150px,1fr);gap:12px;align-items:center;min-height:56px;border-bottom:1px solid rgba(255,255,255,.045)}.title{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar{height:4px;background:#1a1a1d}.bar i{display:block;height:100%;background:var(--accent)}.state{font-size:11px}.state small{display:block;color:var(--muted);margin-top:3px}.worker{display:grid;grid-template-columns:110px 120px 120px 1fr;gap:12px;min-height:44px;align-items:center;border-bottom:1px solid rgba(255,255,255,.045);font-size:10px}.live{color:var(--accent)}.boundary{color:var(--warn)}.timeline{position:relative;min-width:1000px}.axis{height:28px;position:relative;margin-left:110px;border-bottom:1px solid var(--line)}.hour{position:absolute;font-size:9px;color:#666;transform:translateX(-50%)}.lane{display:grid;grid-template-columns:110px 1fr;min-height:28px;align-items:center}.label{font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px}.track{height:24px;position:relative;border-bottom:1px solid rgba(255,255,255,.035)}.span{position:absolute;top:10px;height:3px;background:#ddd;min-width:2px}.span.stale{opacity:.3}.event{position:absolute;top:5px;width:1px;height:14px;background:#aaa}.now{position:absolute;top:0;bottom:0;width:1px;background:var(--accent);z-index:5}.weekrow{display:grid;grid-template-columns:70px 1fr;height:28px;align-items:center}.weektrack{height:10px;background:#141416;position:relative}.density{position:absolute;inset-block:0;background:#85858b}.notice{margin-top:12px}@media(max-width:800px){main{padding:16px}.hero{grid-template-columns:1fr}.summary{display:block}.stats{text-align:left;margin-top:8px}.clock{font-size:24vw}.slot{grid-template-columns:1fr 80px;padding:8px 0}.slot .state,.slot .meta{grid-column:1/-1}.worker{grid-template-columns:90px 1fr;padding:7px 0}.worker .meta{grid-column:1/-1}.timeline{min-width:820px}.lane{grid-template-columns:78px 1fr}.axis{margin-left:78px}}
</style></head><body><main>
<header><div><div class="brand">PROMETEO · 5/25</div><div class="hint" id="date"></div></div><div class="fresh" id="fresh">cargando…</div></header>
<div class="hero"><div><div class="clock" id="clock">--:--</div><div class="phase"><span id="phase">—</span><span class="count" id="count">--:--</span></div><div class="hint" id="phaseHint"></div></div><div><div class="media"><video id="player" controls playsinline></video><div class="media-empty" id="mediaEmpty">VIDEO / MÚSICA</div></div><div class="mediactl"><input id="mediaUrl" placeholder="fuente directa .mp4 / .webm / audio"><button id="mediaSave">usar</button></div></div></div>
<div class="summary"><div class="bottleneck" id="bottleneck">Bottleneck: cargando…</div><div class="stats" id="stats"></div></div>
<nav class="tabs"><button class="on" data-tab="cycle">CICLO</button><button data-tab="workers">WORKERS</button><button data-tab="day">24H</button><button data-tab="week">SEMANA</button></nav>
<section class="panel on" id="cyclePanel"><div id="cycleView"></div></section><section class="panel" id="workersPanel"><div id="workersView"></div></section><section class="panel" id="dayPanel"><div class="timeline"><div class="axis" id="axis"></div><div id="dayRows"></div></div></section><section class="panel" id="weekPanel"><div id="weekView"></div></section><div class="notice" id="notice"></div>
</main><script>
(()=>{'use strict';
const DATA='../../../live/activity-timeline.json',CACHE='prometeo.activity-timeline.last-good.v1',MEDIA='prometeo.525.media.v1';const LIFE={PLANNED:10,LAUNCHED:20,OBSERVED_WORKING:35,RESULT:60,VERIFIED:80,CONSUMED:100};let model=null;const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function day0(d){const x=new Date(d);x.setHours(0,0,0,0);return x}function pc(ms,a,b){return Math.max(0,Math.min(100,(ms-a)/(b-a)*100))}function ftime(t){if(!t)return'—';const d=new Date(t);return Number.isNaN(+d)?'—':d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}function duration(a,b){if(!a||!b)return'—';const s=Math.max(0,(Date.parse(b)-Date.parse(a))/1000);if(!Number.isFinite(s))return'—';return s<60?Math.round(s)+'s':s<3600?Math.floor(s/60)+'m '+Math.round(s%60)+'s':Math.floor(s/3600)+'h '+Math.round((s%3600)/60)+'m'}
function tick(){const n=new Date(),sec=(n.getMinutes()%30)*60+n.getSeconds(),human=sec<300,total=human?300:1500,left=Math.max(0,total-(human?sec:sec-300));$('clock').textContent=pad(n.getHours())+':'+pad(n.getMinutes());$('date').textContent=n.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});$('phase').textContent=human?'5 min · vos':'25 min · afuera';$('count').textContent=pad(Math.floor(left/60))+':'+pad(left%60);$('phaseHint').textContent=human?'después trabaja Prometeo':'próxima ventana humana al terminar';const line=document.querySelector('.now');if(line){const a=day0(n).getTime();line.style.left=`calc(110px + (100% - 110px) * ${pc(n.getTime(),a,a+86400000)/100})`}}
function latestRun(){return(model?.spans||[]).filter(s=>s.actor_kind==='run_plan').sort((a,b)=>Date.parse(b.start_at)-Date.parse(a.start_at))[0]||null}function workersFor(run){return(model?.spans||[]).filter(s=>s.actor_kind==='worker'&&run&&(s.batch_id===run.batch_id||s.run_id===run.actor_id))}function slotsFor(run){return(model?.events||[]).filter(e=>run&&e.type==='PLANNED'&&e.actor_id===run.actor_id).map(e=>({id:e.work_id||e.id,label:e.label||e.work_id||'slot'}))}
function statusFor(slot,workers){const ev=(model?.events||[]).filter(e=>e.work_id===slot.id||e.slot_id===slot.id),ws=workers.filter(w=>w.work_id===slot.id||w.slot_id===slot.id);let st='PLANNED';for(const e of ev)if((LIFE[e.type]||0)>(LIFE[st]||0))st=e.type;for(const w of ws){const q=w.lifecycle_phase||w.status;if((LIFE[q]||0)>(LIFE[st]||0))st=q}const linked=ev.some(e=>e.type!=='PLANNED')||ws.length>0;return{st,p:linked?(LIFE[st]||0):10,linked,w:ws[0]||null}}
function renderCycle(){const run=latestRun(),root=$('cycleView');if(!run){root.innerHTML='<div class="meta">Sin RUN visible.</div>';$('bottleneck').textContent='Bottleneck: sin RUN visible';return}const workers=workersFor(run),slots=slotsFor(run),rows=slots.map(s=>({s,...statusFor(s,workers)})),score=rows.length?Math.round(rows.reduce((a,r)=>a+r.p,0)/rows.length):0,unknown=rows.filter(r=>!r.linked).length,pending=rows.filter(r=>r.st==='RESULT'||r.st==='VERIFIED').length;$('bottleneck').textContent='Bottleneck: '+(unknown?unknown+' slots sin enlace durable slot↔worker/result':pending?pending+' resultados esperan consumo':'sin bottleneck visible');let h=`<div class="runhead"><div><div class="title">${esc(run.actor_id)}</div><div class="meta">${workers.length} workers observados · ${slots.length} objetivos</div></div><div class="runscore">${score}%</div></div><div class="rows2">`;for(const r of rows){const w=r.w,end=w&&['RESULT','CLOSED'].includes(w.status)?w.end_at:null;h+=`<div class="slot"><div><div class="title">${esc(r.s.label)}</div><div class="meta">${esc(r.s.id)}</div></div><div><div class="bar"><i style="width:${r.p}%"></i></div><div class="meta">${r.linked?r.p+'%':'?'}</div></div><div class="state">${r.linked?esc(r.st):'UNKNOWN'}<small>${r.linked?'lifecycle durable':'no inventado'}</small></div><div class="meta">${w?esc(w.actor_id.replace(/^wc-/,''))+' · '+ftime(w.start_at)+' → '+ftime(end)+' · '+duration(w.start_at,end):'sin worker enlazado en proyección'}</div></div>`}root.innerHTML=h+'</div>'}
function rank(w){if(w.status==='OBSERVED_WORKING')return 0;if(w.status==='LAUNCHED')return 1;if(w.status==='STALE')return 2;if(/BOUNDARY/.test(w.state||''))return 3;return 4}function renderWorkers(){const run=latestRun(),ws=(run?workersFor(run):(model?.spans||[]).filter(s=>s.actor_kind==='worker')).slice().sort((a,b)=>rank(a)-rank(b));$('workersView').innerHTML=ws.length?ws.map(w=>`<div class="worker"><div>${esc(w.actor_id.replace(/^wc-/,'').slice(0,12))}</div><div>${esc(w.work_id||w.slot_id||'sin slot')}</div><div class="${w.status==='OBSERVED_WORKING'?'live':/BOUNDARY/.test(w.state||'')?'boundary':''}">${esc(/BOUNDARY/.test(w.state||'')?'BOUNDARY':w.status||w.state||'UNKNOWN')}</div><div class="meta">${w.productive_units??0} units · ${duration(w.start_at,w.end_at||w.last_activity_at)} · última ${ftime(w.last_activity_at)}</div></div>`).join(''):'<div class="meta">Sin workers observados.</div>'}
function renderDay(){const axis=$('axis'),root=$('dayRows'),n=new Date(),a=day0(n).getTime(),b=a+86400000;axis.innerHTML='';for(let h=0;h<24;h+=2){const e=document.createElement('span');e.className='hour';e.style.left=h/24*100+'%';e.textContent=pad(h);axis.append(e)}const spans=(model?.spans||[]).filter(s=>Date.parse(s.end_at||s.last_activity_at||s.start_at)>=a&&Date.parse(s.start_at)<b);root.innerHTML='';for(const s of spans){const lane=document.createElement('div');lane.className='lane';const lab=document.createElement('div');lab.className='label';lab.textContent=s.actor_kind==='worker'?s.actor_id.replace(/^wc-/,''):s.actor_kind==='run_plan'?'PLAN · '+s.actor_id:s.actor_id;const tr=document.createElement('div');tr.className='track';const x=document.createElement('i');x.className='span '+(s.status==='STALE'?'stale':'');const l=pc(Date.parse(s.start_at),a,b),r=pc(Date.parse(s.end_at||s.last_activity_at||s.start_at),a,b);x.style.left=l+'%';x.style.width=Math.max(.08,r-l)+'%';x.title=(s.status||'')+' · '+(s.productive_units??0)+' units';tr.append(x);lane.append(lab,tr);root.append(lane)}const old=document.querySelector('.now');if(old)old.remove();const now=document.createElement('i');now.className='now';document.querySelector('.timeline').append(now);tick()}
function renderWeek(){const root=$('weekView'),n=new Date();root.innerHTML='';for(let d=6;d>=0;d--){const day=new Date(day0(n).getTime()-d*86400000),a=day.getTime(),b=a+86400000,bins=Array(48).fill(0);for(const s of model?.spans||[]){const ss=Math.max(a,Date.parse(s.start_at)),ee=Math.min(b,Date.parse(s.end_at||s.last_activity_at||s.start_at));if(ee<ss)continue;for(let i=Math.max(0,Math.floor((ss-a)/1800000));i<=Math.min(47,Math.floor((ee-a)/1800000));i++)bins[i]++}const row=document.createElement('div');row.className='weekrow';const name=document.createElement('div');name.className='meta';name.textContent=day.toLocaleDateString('es-AR',{weekday:'short',day:'2-digit'});const tr=document.createElement('div');tr.className='weektrack';bins.forEach((v,i)=>{if(!v)return;const q=document.createElement('i');q.className='density';q.style.left=i/48*100+'%';q.style.width=1/48*100+'%';q.style.opacity=Math.min(.95,.18+v*.11);tr.append(q)});row.append(name,tr);root.append(row)}}
function stats(){const c=model?.counts||{},age=(Date.now()-Date.parse(model.generated_at))/1000,stale=age>900;$('fresh').textContent=(stale?'STALE':'LIVE/last-good')+' · '+(model.generated_at?ftime(model.generated_at):'sin fecha');$('stats').innerHTML=`<b>${c.planned_runs||0}</b> runs · <b>${c.workers||0}</b> workers · <b>${c.events||0}</b> eventos`;$('notice').textContent='Observabilidad, no authority · raw prompt público='+(model?.coverage?.raw_prompt_text_public===false?'NO':'?')}
function show(){stats();renderCycle();renderWorkers();renderDay();renderWeek()}async function load(){let cache=null;try{cache=JSON.parse(localStorage.getItem(CACHE)||'null')}catch{}try{const r=await fetch(DATA+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const x=await r.json();if(x.schema!=='prometeo.activity-timeline/v1')throw 0;model=x;localStorage.setItem(CACHE,JSON.stringify(x));show()}catch{model=cache;if(model){show();$('fresh').textContent='last-good local'}else $('fresh').textContent='sin telemetría'}}
function tab(name){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));['cycle','workers','day','week'].forEach(n=>$(n+'Panel').classList.toggle('on',n===name))}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));function mediaLoad(){let src='';try{src=JSON.parse(localStorage.getItem(MEDIA)||'{}').src||''}catch{}$('mediaUrl').value=src;if(src){$('player').src=src;$('mediaEmpty').style.display='none'}}$('mediaSave').onclick=()=>{const src=$('mediaUrl').value.trim();localStorage.setItem(MEDIA,JSON.stringify({src}));$('player').removeAttribute('src');$('player').load();$('mediaEmpty').style.display=src?'none':'grid';if(src)$('player').src=src};
mediaLoad();tick();setInterval(tick,500);load();setInterval(load,10000);
})();
</script></body></html>
