<style>
:root{color-scheme:dark;--bg:#09090a;--fg:#f2f2f2;--muted:#8d8d92;--faint:#29292d;--line:#55555b;--accent:#8ed3a7;--warn:#f0b55a;--bad:#ff746c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:radial-gradient(circle at 75% 18%,#1c1c1f 0,transparent 34%),#09090a;overflow-x:hidden}

.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,38vw);gap:30px;align-items:end;min-height:190px;margin:22px 0 18px}.clock{font-size:clamp(72px,13vw,180px);line-height:.78;font-weight:250;letter-spacing:-.07em;font-variant-numeric:tabular-nums;color:var(--accent);transition:color .35s ease}.phase{font-size:clamp(20px,3vw,38px);margin-top:24px;color:var(--accent)}.count{font-variant-numeric:tabular-nums;margin-left:12px}.hint{color:var(--muted);font-size:12px;margin-top:8px}.phase-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}.urgency{font-size:11px;color:var(--accent)}.notify-btn,.media-save{border:1px solid var(--faint);background:transparent;color:var(--muted);font-size:11px;padding:6px 9px;border-radius:999px;cursor:pointer}.notify-btn.on{color:var(--fg);border-color:var(--accent)}.phase-alert{display:none;margin-top:10px;font-size:12px;color:var(--accent)}.phase-alert.on{display:block}
.media{align-self:stretch;display:flex;flex-direction:column;justify-content:end}.media-frame{aspect-ratio:16/9;border:1px solid var(--faint);background:#050506;position:relative;overflow:hidden}.media-frame video{width:100%;height:100%;display:block;background:#050506}.media-empty{position:absolute;inset:0;display:grid;place-items:center;color:#555;font-size:10px;letter-spacing:.12em;text-transform:uppercase;pointer-events:none}.media-config{display:flex;gap:7px;margin-top:8px}.media-config input{min-width:0;flex:1;background:transparent;border:0;border-bottom:1px solid var(--faint);color:var(--muted);font-size:10px;padding:6px 2px;outline:none}.media-config input:focus{color:var(--fg);border-color:var(--accent)}
.summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;border-top:1px solid var(--faint);padding-top:12px}.bottleneck{font-size:13px;color:var(--fg)}.stats{font-size:11px;line-height:1.65;color:var(--muted);text-align:right}.stats b{color:var(--fg);font-weight:550}.tabs{display:flex;gap:18px;margin:18px 0 12px;overflow-x:auto;white-space:nowrap}.tabs button{border:0;background:none;color:var(--muted);padding:0 0 5px;font-size:12px;cursor:pointer;border-bottom:1px solid transparent}.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.panel{display:none;border-top:1px solid var(--faint);padding-top:12px}.panel.on{display:block}.cycle-list,.worker-list{display:grid;gap:2px}.cycle-row{display:grid;grid-template-columns:minmax(180px,1.25fr) 92px minmax(120px,1fr) minmax(150px,1.2fr);gap:14px;align-items:center;min-height:54px;border-bottom:1px solid rgba(255,255,255,.045)}.cycle-name{min-width:0}.cycle-title{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cycle-meta{font-size:9px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.progress-wrap{display:flex;align-items:center;gap:7px}.progress{height:4px;flex:1;background:#1a1a1d;position:relative}.progress i{display:block;height:100%;background:var(--accent)}.pct{font-size:10px;color:var(--muted);width:28px;text-align:right}.state{font-size:10px;color:var(--muted)}.state strong{display:block;color:var(--fg);font-size:11px;font-weight:550}.state.boundary strong{color:var(--warn)}.state.stale strong{color:#777}.detail{font-size:10px;color:var(--muted);line-height:1.4}.unknown{color:#777}.run-head{display:flex;justify-content:space-between;gap:14px;align-items:end;margin-bottom:10px}.run-title{font-size:18px}.run-sub{font-size:10px;color:var(--muted);margin-top:4px}.run-score{font-size:28px;font-variant-numeric:tabular-nums;color:var(--accent)}

.view{position:relative;overflow-x:auto}.timeline{position:relative;min-width:1000px}.axis{height:30px;position:relative;margin-left:110px;border-bottom:1px solid var(--faint)}.hour{position:absolute;top:0;font-size:9px;color:#666;transform:translateX(-50%)}.nowline{position:absolute;top:0;bottom:0;width:1px;background:var(--accent);opacity:.8;pointer-events:none;z-index:8}.rows{position:relative}.row{display:grid;grid-template-columns:110px 1fr;min-height:28px;align-items:center}.label{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:12px}.track{position:relative;height:24px;border-bottom:1px solid rgba(255,255,255,.035);overflow:hidden}.cycle-grid{position:absolute;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.07)}.cycle-grid.human{background:rgba(255,255,255,.035)}.span{position:absolute;top:11px;height:2px;background:#bdbdc3;min-width:2px;z-index:3}.span.worker{height:3px;background:#f0f0f0}.span.run_plan{background:#77777d}.span.ai_session{background:repeating-linear-gradient(90deg,#8f8f95 0 5px,transparent 5px 9px);height:2px}.span.stale{opacity:.35}.span::before,.span::after{content:"";position:absolute;top:-2px;width:5px;height:5px;border-radius:50%;background:currentColor}.span::before{left:-2px}.span::after{right:-2px}.event{position:absolute;top:5px;width:1px;height:14px;background:#aaa;z-index:5}.event.human{height:20px;top:2px;background:#fff;width:2px}.event.guide{height:8px;top:9px}.event.return{height:5px;top:10px;width:5px;border-radius:50%;transform:translateX(-2px)}.legend{display:flex;flex-wrap:wrap;gap:14px;margin:8px 0 0 110px;font-size:9px;color:#69696f}.legend i{display:inline-block;width:18px;height:2px;background:#bbb;vertical-align:3px;margin-right:5px}.legend .dash{background:repeating-linear-gradient(90deg,#888 0 4px,transparent 4px 7px)}
.week{min-width:800px}.dayline{display:grid;grid-template-columns:70px 1fr;align-items:center;height:28px}.daytrack{height:10px;position:relative;background:rgba(255,255,255,.025)}.density{position:absolute;top:0;bottom:0;background:#85858b;opacity:.65}.dayname{font-size:10px;color:var(--muted)}.notice{margin-top:12px;font-size:9px;color:#666;line-height:1.45}.bad{color:#c6a57a}.ok{color:#9fa9a0}
@media(max-width:800px){main{padding:16px}.hero{grid-template-columns:1fr;align-items:start}.media{width:100%}.summary{grid-template-columns:1fr}.stats{text-align:left}.clock{font-size:24vw}.cycle-row{grid-template-columns:1fr 82px;gap:8px;padding:8px 0}.cycle-row .state,.cycle-row .detail{grid-column:1/-1}.worker-row{grid-template-columns:90px 1fr;gap:6px;padding:7px 0}.worker-last{grid-column:1/-1}.row{grid-template-columns:78px 1fr}.axis{margin-left:78px}.legend{margin-left:78px}.timeline{min-width:820px}}
</style>

<body>
<main>
<header><div><div class="brand">PROMETEO · 5/25</div><div class="hint" id="date"></div></div><div class="fresh" id="fresh">cargando telemetría…</div></header>
<section class="hero">
  <div><div class="clock" id="clock">--:--</div><div class="phase"><span id="phase">—</span><span class="count" id="count">--:--</span></div><div class="hint" id="phaseHint"></div><div class="phase-tools"><span class="urgency" id="urgency"></span><button class="notify-btn" id="notifyBtn" type="button">activar avisos</button></div><div class="phase-alert" id="phaseAlert"></div></div>
  <div class="media"><div class="media-frame"><video id="mediaPlayer" controls playsinline></video><div class="media-empty" id="mediaEmpty">video / música</div></div><div class="media-config"><input id="mediaUrl" placeholder="fuente directa .mp4 / .webm / audio"><button class="media-save" id="mediaSave">usar</button></div></div>
</section>

<nav class="tabs"><button data-tab="cycle" class="on">CICLO</button><button data-tab="workers">WORKERS</button><button data-tab="day">24H</button><button data-tab="week">SEMANA</button></nav>
<section id="cyclePanel" class="panel on"><div id="cycleView"></div></section>
<section id="workersPanel" class="panel"><div id="workersView" class="worker-list"></div></section>
<section id="dayPanel" class="panel"><div class="view"><div class="timeline"><div class="axis" id="axis"></div><div class="rows" id="rows"></div><div class="legend"><span><i></i>worker observado</span><span><i></i>plan RUN durable</span><span><i class="dash"></i>sesión IA: envelope, no liveness continua</span><span>| prompt/checkpoint</span></div></div></div></section>

<div class="notice" id="notice"></div>
</main>
<script>
(()=>{
const DATA='../../../live/activity-timeline.json',CACHE='prometeo.activity-timeline.last-good.v1';
const ALERT_OPT='prometeo.525.phase-alerts.enabled.v1',ALERT_SEEN='prometeo.525.phase-alerts.last.v1',MEDIA_KEY='prometeo.525.media.v1';
const LIFECYCLE={PLANNED:10,LAUNCHED:20,OBSERVED_WORKING:35,RESULT:60,VERIFIED:80,CONSUMED:100};
let model=null;
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function startDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x}function pct(ms,a,b){return Math.max(0,Math.min(100,(ms-a)/(b-a)*100))}function countdown(s){s=Math.ceil(s);return`${pad(Math.floor(s/60))}:${pad(s%60)}`}function fmt(t){if(!t)return'—';const d=new Date(t);return Number.isNaN(+d)?'—':d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}function dur(a,b){if(!a||!b)return'—';let s=Math.max(0,(Date.parse(b)-Date.parse(a))/1000);if(!Number.isFinite(s))return'—';if(s<60)return`${Math.round(s)}s`;if(s<3600)return`${Math.floor(s/60)}m ${Math.round(s%60)}s`;return`${Math.floor(s/3600)}h ${Math.round((s%3600)/60)}m`}
function phase(now){const sec=(now.getMinutes()%30)*60+now.getSeconds()+now.getMilliseconds()/1000,human=sec<300,elapsed=human?sec:sec-300,total=human?300:1500;return{human,total,remain:Math.max(0,total-elapsed),next:new Date(now.getTime()+(total-elapsed)*1000)}}function urgency(p){const r=p.remain/p.total;if(p.remain<=30)return{color:'#ff746c',label:'cambia ya'};if(p.remain<=120)return{color:'#f0b55a',label:'últimos 2 min'};if(r<=.4)return{color:'#d6cc7a',label:'mitad final'};return{color:p.human?'#7fb7ff':'#8ed3a7',label:p.human?'tu ventana':'trabajo afuera'}}
function clock(){const now=new Date(),p=phase(now),u=urgency(p);document.documentElement.style.setProperty('--accent',u.color);$('clock').textContent=`${pad(now.getHours())}:${pad(now.getMinutes())}`;$('date').textContent=now.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});$('phase').textContent=p.human?'5 min · vos':'25 min · afuera';$('count').textContent=countdown(p.remain);$('phaseHint').textContent=p.human?`a las ${pad(p.next.getHours())}:${pad(p.next.getMinutes())} arrancan los 25 min`:`a las ${pad(p.next.getHours())}:${pad(p.next.getMinutes())} arrancan tus 5 min`;$('urgency').textContent=u.label;maybeAlert(p);renderNow(now)}
function alertsEnabled(){return localStorage.getItem(ALERT_OPT)==='1'}function refreshNotify(){const b=$('notifyBtn'),on=alertsEnabled();b.classList.toggle('on',on);b.textContent=on?'avisos ✓':'activar avisos'}async function toggleAlerts(){if(alertsEnabled()){localStorage.removeItem(ALERT_OPT);refreshNotify();return}if(!('Notification'in window)){localStorage.setItem(ALERT_OPT,'1');refreshNotify();return}const p=await Notification.requestPermission();if(p==='granted'){localStorage.setItem(ALERT_OPT,'1');refreshNotify()}}function maybeAlert(p){const a=$('phaseAlert');if(p.remain>60){a.classList.remove('on');return}const key=String(p.next.getTime()),text=p.human?'En 1 min arrancan los 25 min de trabajo.':'En 1 min arrancan tus 5 min.';a.textContent=text;a.classList.add('on');if(localStorage.getItem(ALERT_SEEN)===key)return;localStorage.setItem(ALERT_SEEN,key);if(alertsEnabled()){try{navigator.vibrate?.([120,70,120])}catch{}if('Notification'in window&&Notification.permission==='granted')try{new Notification('PROMETEO · 5/25',{body:text,tag:'prometeo-525-phase'})}catch{}}}
function latestRun(){return(model?.spans||[]).filter(s=>s.actor_kind==='run_plan').sort((a,b)=>Date.parse(b.start_at)-Date.parse(a.start_at))[0]||null}function runWorkers(run){if(!run)return[];return(model?.spans||[]).filter(s=>s.actor_kind==='worker'&&(s.batch_id===run.batch_id||s.run_id===run.actor_id))}function plannedSlots(run){if(!run)return[];return(model?.events||[]).filter(e=>e.type==='PLANNED'&&e.actor_id===run.actor_id).map(e=>({work_id:e.work_id||e.id,label:e.label||e.work_id||'slot',event:e}))}
function lifecycleFor(slot,run,workers){const ev=(model?.events||[]).filter(e=>(e.work_id&&e.work_id===slot.work_id)||(e.slot_id&&e.slot_id===slot.work_id));const ws=workers.filter(w=>w.work_id===slot.work_id||w.slot_id===slot.work_id);let phase='PLANNED';for(const e of ev)if((LIFECYCLE[e.type]||0)>(LIFECYCLE[phase]||0))phase=e.type;for(const w of ws){const p=w.lifecycle_phase||w.status;if((LIFECYCLE[p]||0)>(LIFECYCLE[phase]||0))phase=p}const linked=ev.length>1||ws.length>0;return{phase,p:linked?(LIFECYCLE[phase]||0):10,linked,workers:ws,events:ev}}
function renderCycle(){const root=$('cycleView'),run=latestRun();if(!run){root.innerHTML='<div class="unknown">No hay RUN planificado en la proyección actual.</div>';$('bottleneck').textContent='Bottleneck: sin RUN visible';return}const workers=runWorkers(run),slots=plannedSlots(run),states=slots.map(s=>({s,...lifecycleFor(s,run,workers)}));const score=states.length?Math.round(states.reduce((a,x)=>a+x.p,0)/states.length):0;const unknown=states.filter(x=>!x.linked).length,resultPending=states.filter(x=>['RESULT','VERIFIED'].includes(x.phase)).length;let bottleneck=unknown?`${unknown} slots sin enlace durable slot↔worker/result en esta proyección`:resultPending?`${resultPending} resultados esperan consumo`:'sin bottleneck visible';$('bottleneck').textContent='Bottleneck: '+bottleneck;let html=`<div class="run-head"><div><div class="run-title">${esc(run.actor_id)}</div><div class="run-sub">${workers.length} workers observados · ${slots.length} objetivos planificados</div></div><div class="run-score">${score}%</div></div><div class="cycle-list">`;for(const x of states){const w=x.workers[0],start=w?.start_at||null,end=(['RESULT','CLOSED'].includes(w?.status)?w?.end_at:null);const detail=x.linked?`${w?esc(w.actor_id.replace(/^wc-/,'')):'evidencia puntual'} · inicio ${fmt(start)} · fin ${fmt(end)} · ${dur(start,end)}`:'sin enlace durable suficiente: UNKNOWN más allá de PLANNED';const cls=/BOUNDARY/.test(w?.state||'')?' boundary':w?.status==='STALE'?' stale':'';html+=`<div class="cycle-row"><div class="cycle-name"><div class="cycle-title">${esc(x.s.label)}</div><div class="cycle-meta">${esc(x.s.work_id)}</div></div><div class="progress-wrap"><div class="progress"><i style="width:${x.p}%"></i></div><span class="pct">${x.linked?x.p+'%':'?'}</span></div><div class="state${cls}"><strong>${x.linked?esc(x.phase):'UNKNOWN'}</strong>${x.linked?'lifecycle durable':'no inventado'}</div><div class="detail">${detail}</div></div>`}root.innerHTML=html+'</div>'}
function workerRank(w){const s=w.status||'';if(s==='OBSERVED_WORKING')return 0;if(s==='LAUNCHED')return 1;if(s==='STALE')return 2;if(/BOUNDARY/.test(w.state||''))return 3;return 4}function renderWorkers(){const run=latestRun(),root=$('workersView');let ws=(run?runWorkers(run):(model?.spans||[]).filter(s=>s.actor_kind==='worker')).slice().sort((a,b)=>workerRank(a)-workerRank(b)||Date.parse(b.last_activity_at||0)-Date.parse(a.last_activity_at||0));if(!ws.length){root.innerHTML='<div class="unknown">Sin workers observados.</div>';return}root.innerHTML=ws.map(w=>{const live=w.status==='OBSERVED_WORKING',boundary=/BOUNDARY/.test(w.state||''),st=boundary?'BOUNDARY':w.status||w.state||'UNKNOWN';return`<div class="worker-row"><div class="worker-id" title="${esc(w.actor_id)}">${esc(w.actor_id.replace(/^wc-/,'').slice(0,12))}</div><div>${esc(w.work_id||w.slot_id||'sin slot enlazado')}</div><div class="worker-status ${live?'live':''} ${boundary?'boundary':''}">${esc(st)}</div><div class="worker-last">${w.productive_units??0} units · ${dur(w.start_at,w.end_at||w.last_activity_at)} · última evidencia ${fmt(w.last_activity_at)}</div></div>`}).join('')}
function cycleGrid(track){for(let i=0;i<48;i++){const c=document.createElement('i');c.className='cycle-grid';c.style.left=i/48*100+'%';c.style.width=1/48*100+'%';track.append(c);const h=document.createElement('i');h.className='cycle-grid human';h.style.left=i/48*100+'%';h.style.width=1/288*100+'%';track.append(h)}}function laneRows(day){const a=startDay(day).getTime(),b=a+86400000,spans=(model?.spans||[]).filter(s=>Date.parse(s.end_at||s.last_activity_at||s.start_at)>=a&&Date.parse(s.start_at)<b),events=(model?.events||[]).filter(e=>{const t=Date.parse(e.at);return t>=a&&t<b}),groups=[{label:'VOS',spans:[],events:events.filter(e=>e.actor_kind==='human')}];for(const s of spans)groups.push({label:s.actor_kind==='worker'?s.actor_id.replace(/^wc-/,''):s.actor_kind==='run_plan'?`PLAN · ${s.actor_id}`:s.actor_id,spans:[s],events:events.filter(e=>e.actor_id===s.actor_id&&e.actor_kind!=='human')});return{groups,a,b}}
function renderDay(day=new Date()){if(!model)return;const axis=$('axis');axis.innerHTML='';for(let h=0;h<24;h+=2){const el=document.createElement('span');el.className='hour';el.style.left=h/24*100+'%';el.textContent=pad(h);axis.append(el)}const{groups,a,b}=laneRows(day),rows=$('rows');rows.innerHTML='';for(const g of groups){const row=document.createElement('div');row.className='row';const lab=document.createElement('div');lab.className='label';lab.textContent=g.label;lab.title=g.label;const tr=document.createElement('div');tr.className='track';cycleGrid(tr);for(const s of g.spans){const x=document.createElement('i');x.className=`span ${s.actor_kind} ${s.status==='STALE'?'stale':''}`;const l=pct(Date.parse(s.start_at),a,b),r=pct(Date.parse(s.end_at||s.last_activity_at||s.start_at),a,b);x.style.left=l+'%';x.style.width=Math.max(.08,r-l)+'%';x.title=`${s.actor_kind} · ${s.status} · ${s.productive_units??''} units`;tr.append(x)}for(const e of g.events){const x=document.createElement('i');x.className='event '+(e.actor_kind==='human'?'human':e.actor_kind==='guide'?'guide':e.type==='RESULT'?'return':'');x.style.left=pct(Date.parse(e.at),a,b)+'%';x.title=e.label||`${e.type}${e.outcome?' · '+e.outcome:''}`;tr.append(x)}row.append(lab,tr);rows.append(row)}const old=$('dayPanel').querySelector('.nowline');if(old)old.remove();const nl=document.createElement('i');nl.className='nowline';$('dayPanel').querySelector('.timeline').append(nl);renderNow(new Date())}function renderNow(now){const line=document.querySelector('.nowline');if(!line)return;const a=startDay(now).getTime(),b=a+86400000;line.style.left=`calc(110px + (100% - 110px) * ${pct(now.getTime(),a,b)/100})`}
function renderWeek(){const root=$('weekView');root.innerHTML='';if(!model)return;const now=new Date();for(let d=6;d>=0;d--){const day=new Date(startDay(now).getTime()-d*86400000),a=day.getTime(),b=a+86400000,row=document.createElement('div');row.className='dayline';const name=document.createElement('div');name.className='dayname';name.textContent=day.toLocaleDateString('es-AR',{weekday:'short',day:'2-digit'});const tr=document.createElement('div');tr.className='daytrack';const bins=Array(48).fill(0);for(const s of model.spans||[]){const ss=Math.max(a,Date.parse(s.start_at)),ee=Math.min(b,Date.parse(s.end_at||s.last_activity_at||s.start_at));if(ee<ss||ee<a||ss>b)continue;for(let i=Math.max(0,Math.floor((ss-a)/1800000));i<=Math.min(47,Math.floor((ee-a)/1800000));i++)bins[i]++}for(const e of model.events||[]){const t=Date.parse(e.at);if(t>=a&&t<b)bins[Math.floor((t-a)/1800000)]++}bins.forEach((n,i)=>{if(!n)return;const el=document.createElement('i');el.className='density';el.style.left=i/48*100+'%';el.style.width=1/48*100+'%';el.style.opacity=Math.min(.95,.18+n*.11);tr.append(el)});row.append(name,tr);root.append(row)}}
function stats(){const c=model?.counts||{};$('stats').innerHTML=`<b>${c.planned_runs||0}</b> runs · <b>${c.workers||0}</b> workers · <b>${c.events||0}</b> eventos durables`;const age=(Date.now()-Date.parse(model.generated_at))/1000,stale=age>900;$('fresh').innerHTML=`<span class="${stale?'bad':'ok'}">${stale?'STALE':'LIVE/last-good'}</span> · ${model.generated_at?new Date(model.generated_at).toLocaleTimeString('es-AR'):'sin fecha'}`;const cov=model.coverage||{};$('notice').textContent=`Observabilidad, no authority · workers=${cov.worker_pipeline||'—'} · lifecycle=${cov.lifecycle||'—'} · raw prompt público=${cov.raw_prompt_text_public===false?'NO':'?'}`}function show(){stats();renderCycle();renderWorkers();renderDay();renderWeek()}
function preferNewest(fresh,cached){const ft=Date.parse(fresh?.generated_at||''),ct=Date.parse(cached?.generated_at||'');if(cached&&Number.isFinite(ct)&&(!Number.isFinite(ft)||ct>ft))return{model:cached,note:'last-good local · fuente remota atrasada'};return{model:fresh,note:null}}async function load(){let cached=null;try{cached=JSON.parse(localStorage.getItem(CACHE)||'null')}catch{}try{const r=await fetch(DATA+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);const x=await r.json();if(x.schema!=='prometeo.activity-timeline/v1')throw new Error('schema');const chosen=preferNewest(x,cached);model=chosen.model;if(model===x)localStorage.setItem(CACHE,JSON.stringify(x));show();if(chosen.note)$('fresh').textContent=chosen.note}catch(e){model=cached;if(model){show();$('fresh').textContent='last-good local · fuente no disponible'}else{$('fresh').textContent='sin telemetría disponible';$('bottleneck').textContent='Bottleneck: telemetría no disponible'}}}
function setTab(name){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));for(const n of['cycle','workers','day','week'])$(n+'Panel').classList.toggle('on',n===name)}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));$('notifyBtn').onclick=toggleAlerts;
function loadMedia(){let v='';try{v=JSON.parse(localStorage.getItem(MEDIA_KEY)||'{}').src||''}catch{}$('mediaUrl').value=v;if(v){$('mediaPlayer').src=v;$('mediaEmpty').style.display='none'}}function saveMedia(){const src=$('mediaUrl').value.trim();localStorage.setItem(MEDIA_KEY,JSON.stringify({src}));$('mediaPlayer').removeAttribute('src');$('mediaPlayer').load();if(src){$('mediaPlayer').src=src;$('mediaEmpty').style.display='none'}else $('mediaEmpty').style.display='grid'}$('mediaSave').onclick=saveMedia;
refreshNotify();loadMedia();clock();setInterval(clock,500);load();setInterval(load,10000);
})();
