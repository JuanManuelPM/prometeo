function preferNewest(remote,cached){
  const r=remote&&Number.isFinite(Date.parse(remote.generated_at||''))?Date.parse(remote.generated_at):null;
  const c=cached&&Number.isFinite(Date.parse(cached.generated_at||''))?Date.parse(cached.generated_at):null;
  if(r===null&&c===null)return {model:remote||cached||null,source:'UNKNOWN'};
  if(r===null)return {model:cached,source:'LAST_GOOD'};
  if(c!==null&&c>r)return {model:cached,source:'LAST_GOOD'};
  return {model:remote,source:'REMOTE'};
}
