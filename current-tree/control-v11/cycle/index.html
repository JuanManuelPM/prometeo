<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prometeo · 5/25</title>
<style>
:root{color-scheme:dark;--bg:#09090a;--fg:#f2f2f2;--muted:#8d8d92;--faint:#29292d;--line:#55555b;--hot:#fff;--accent:#8ed3a7}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:radial-gradient(circle at 75% 20%,#1c1c1f 0,transparent 34%),#09090a;overflow-x:hidden}
main{min-height:100vh;padding:22px 24px 28px;display:grid;grid-template-rows:auto auto 1fr;gap:20px;border-top:2px solid var(--accent);transition:border-color .35s ease}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.brand{font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}.fresh{font-size:11px;color:var(--muted);text-align:right}
.hero{display:flex;align-items:end;justify-content:space-between;gap:28px;min-height:170px}.clock{font-size:clamp(72px,13vw,180px);line-height:.78;font-weight:250;letter-spacing:-.07em;font-variant-numeric:tabular-nums;color:var(--accent);transition:color .35s ease}.phase{font-size:clamp(20px,3vw,38px);margin-top:24px;color:var(--accent);transition:color .35s ease}.count{font-variant-numeric:tabular-nums;margin-left:12px}.hint{color:var(--muted);font-size:12px;margin-top:8px}.phase-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}.urgency{font-size:11px;color:var(--accent);transition:color .35s ease}.notify-btn{border:1px solid var(--faint);background:transparent;color:var(--muted);font:inherit;font-size:11px;padding:6px 9px;border-radius:999px;cursor:pointer;min-height:30px}.notify-btn.on{color:var(--fg);border-color:var(--accent)}.phase-alert{display:none;margin-top:10px;font-size:12px;color:var(--accent)}.phase-alert.on{display:block}
.stats{min-width:220px;font-size:12px;line-height:1.65;color:var(--muted);padding-bottom:6px}.stats b{color:var(--fg);font-weight:550}.tabs{display:flex;gap:18px;margin-bottom:12px}.tabs button{border:0;background:none;color:var(--muted);padding:0;font:inherit;font-size:12px;cursor:pointer}.tabs button.on{color:var(--fg)}
.view{position:relative;border-top:1px solid var(--faint);padding-top:12px;overflow-x:auto}.timeline{position:relative;min-width:1000px}.axis{height:30px;position:relative;margin-left:110px;border-bottom:1px solid var(--faint)}.hour{position:absolute;top:0;font-size:9px;color:#666;transform:translateX(-50%)}.nowline{position:absolute;top:0;bottom:0;width:1px;background:var(--accent);opacity:.8;pointer-events:none;z-index:8;transition:background .35s ease}.rows{position:relative}
.row{display:grid;grid-template-columns:110px 1fr;min-height:28px;align-items:center}.label{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:12px}.track{position:relative;height:24px;border-bottom:1px solid rgba(255,255,255,.035);overflow:hidden}.cycle{position:absolute;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.07)}.cycle.human{background:rgba(255,255,255,.035)}
.span{position:absolute;top:11px;height:2px;background:#bdbdc3;min-width:2px;z-index:3}.span.worker{height:3px;background:#f0f0f0}.span.run_plan{background:#77777d}.span.ai_session{background:repeating-linear-gradient(90deg,#8f8f95 0 5px,transparent 5px 9px);height:2px}.span.stale{opacity:.35}.span::before,.span::after{content:"";position:absolute;top:-2px;width:5px;height:5px;border-radius:50%;background:currentColor}.span::before{left:-2px}.span::after{right:-2px}
.event{position:absolute;top:5px;width:1px;height:14px;background:#aaa;z-index:5}.event.human{height:20px;top:2px;background:#fff;width:2px}.event.guide{height:8px;top:9px}.event.return{height:5px;top:10px;width:5px;border-radius:50%;transform:translateX(-2px)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:8px 0 0 110px;font-size:9px;color:#69696f}.legend i{display:inline-block;width:18px;height:2px;background:#bbb;vertical-align:3px;margin-right:5px}.legend .dash{background:repeating-linear-gradient(90deg,#888 0 4px,transparent 4px 7px)}
.week{display:none;min-width:800px}.week.on{display:block}.dayline{display:grid;grid-template-columns:70px 1fr;align-items:center;height:28px}.daytrack{height:10px;position:relative;background:rgba(255,255,255,.025)}.density{position:absolute;top:0;bottom:0;background:#85858b;opacity:.65}.dayname{font-size:10px;color:var(--muted)}
.notice{position:fixed;right:18px;bottom:16px;max-width:520px;font-size:10px;color:#777;line-height:1.4;text-align:right}.bad{color:#c6a57a}.ok{color:#9fa9a0}
@media(max-width:700px){main{padding:16px}.hero{align-items:start;flex-direction:column}.stats{min-width:0}.clock{font-size:24vw}.row{grid-template-columns:78px 1fr}.axis{margin-left:78px}.legend{margin-left:78px}.timeline{min-width:820px}.notice{display:none}.notify-btn{min-height:36px;padding:8px 11px}}
</style>
</head>
<body>
<main>
<header><div><div class="brand">PROMETEO · 5/25 · ACTIVITY TIMELINE</div><div class="hint" id="date"></div></div><div class="fresh" id="fresh">cargando telemetría…</div></header>
<section class="hero"><div><div class="clock" id="clock">--:--</div><div class="phase"><span id="phase">—</span><span class="count" id="count">--:--</span></div><div class="hint" id="phaseHint"></div><div class="phase-tools"><span class="urgency" id="urgency"></span><button class="notify-btn" id="notifyBtn" type="button">activar avisos</button></div><div class="phase-alert" id="phaseAlert"></div></div><div class="stats" id="stats"></div></section>
<section><div class="tabs"><button id="dayTab" class="on">24 horas</button><button id="weekTab">semana</button></div><div id="dayView" class="view"><div class="timeline"><div class="axis" id="axis"></div><div class="rows" id="rows"></div><div class="legend"><span><i></i>worker observado</span><span><i></i>plan RUN durable</span><span><i class="dash"></i>sesión IA: envelope entre checkpoints, no liveness continua</span><span>| prompt/checkpoint</span></div></div></div><div id="weekView" class="week"></div></section>
</main>
<div class="notice" id="notice"></div>
<script>
(()=>{
const DATA='../../../live/activity-timeline.json'; const CACHE='prometeo.activity-timeline.last-good.v1';
const ALERT_OPT='prometeo.525.phase-alerts.enabled.v1', ALERT_SEEN='prometeo.525.phase-alerts.last.v1';
let model=null, mode='day';
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0');
function startDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
function pct(ms,a,b){return Math.max(0,Math.min(100,(ms-a)/(b-a)*100))}
function phase(now){const sec=(now.getMinutes()%30)*60+now.getSeconds()+now.getMilliseconds()/1000;const human=sec<300;const elapsed=human?sec:sec-300,total=human?300:1500;return{human,total,remain:Math.max(0,total-elapsed),next:new Date(now.getTime()+(total-elapsed)*1000)}}
function countdown(s){s=Math.ceil(s);return `${pad(Math.floor(s/60))}:${pad(s%60)}`}
function urgency(p){const ratio=p.remain/p.total;if(p.remain<=30)return{color:'#ff746c',label:'cambia ya'};if(p.remain<=120)return{color:'#f0b55a',label:'últimos 2 min'};if(ratio<=.4)return{color:'#d6cc7a',label:'mitad final'};return{color:p.human?'#7fb7ff':'#8ed3a7',label:p.human?'tu ventana':'trabajo afuera'}}
function alertsEnabled(){return localStorage.getItem(ALERT_OPT)==='1'}
function refreshNotifyButton(){const b=$('notifyBtn'),on=alertsEnabled();b.classList.toggle('on',on);b.textContent=on?'avisos ✓':'activar avisos'}
async function toggleAlerts(){if(alertsEnabled()){localStorage.removeItem(ALERT_OPT);refreshNotifyButton();return}if(!('Notification' in window)){localStorage.setItem(ALERT_OPT,'1');refreshNotifyButton();$('phaseAlert').textContent='Aviso visual y vibración activados; este navegador no expone notificaciones.';$('phaseAlert').classList.add('on');return}const permission=await Notification.requestPermission();if(permission==='granted'){localStorage.setItem(ALERT_OPT,'1');refreshNotifyButton()}else{$('phaseAlert').textContent='Notificaciones bloqueadas por el navegador; el aviso visual sigue funcionando.';$('phaseAlert').classList.add('on')}}
function maybePhaseAlert(p){const alert=$('phaseAlert');if(p.remain>60){alert.classList.remove('on');return}const key=String(p.next.getTime());const text=p.human?'En 1 min arrancan los 25 min de trabajo.':'En 1 min arrancan tus 5 min.';alert.textContent=text;alert.classList.add('on');if(localStorage.getItem(ALERT_SEEN)===key)return;localStorage.setItem(ALERT_SEEN,key);if(alertsEnabled()){try{navigator.vibrate?.([120,70,120])}catch{}if('Notification' in window&&Notification.permission==='granted'){try{new Notification('PROMETEO · 5/25',{body:text,tag:'prometeo-525-phase'})}catch{}}}}
function clock(){const now=new Date(),p=phase(now),u=urgency(p);document.documentElement.style.setProperty('--accent',u.color);$('clock').textContent=`${pad(now.getHours())}:${pad(now.getMinutes())}`;$('date').textContent=now.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});$('phase').textContent=p.human?'5 min · vos':'25 min · afuera';$('count').textContent=countdown(p.remain);$('phaseHint').textContent=p.human?`a las ${pad(p.next.getHours())}:${pad(p.next.getMinutes())} arrancan los 25 min`:`a las ${pad(p.next.getHours())}:${pad(p.next.getMinutes())} arrancan tus 5 min`;$('urgency').textContent=u.label;maybePhaseAlert(p);renderNow(now)}
function renderNow(now){const line=document.querySelector('.nowline');if(!line)return;const a=startDay(now).getTime(),b=a+86400000;line.style.left=`calc(110px + (100% - 110px) * ${pct(now.getTime(),a,b)/100})`}
function cycleGrid(track){for(let i=0;i<48;i++){const c=document.createElement('i');c.className='cycle';c.style.left=(i/48*100)+'%';c.style.width=(1/48*100)+'%';track.append(c);const h=document.createElement('i');h.className='cycle human';h.style.left=(i/48*100)+'%';h.style.width=(1/288*100)+'%';track.append(h)}}
function laneRows(spans,events,day){const a=startDay(day).getTime(),b=a+86400000;const activeSpans=spans.filter(s=>Date.parse(s.end_at||s.last_activity_at||s.start_at)>=a&&Date.parse(s.start_at)<b);const activeEvents=events.filter(e=>{const t=Date.parse(e.at);return t>=a&&t<b});const groups=[];groups.push({key:'human',label:'VOS',spans:[],events:activeEvents.filter(e=>e.actor_kind==='human')});
for(const s of activeSpans){groups.push({key:s.id,label:s.actor_kind==='worker'?s.actor_id.replace(/^wc-/,''):s.actor_kind==='run_plan'?`PLAN · ${s.actor_id}`:s.actor_id,spans:[s],events:activeEvents.filter(e=>e.actor_id===s.actor_id&&e.actor_kind!=='human')})}
const looseGuide=activeEvents.filter(e=>e.actor_kind==='guide'&&!activeSpans.some(s=>s.actor_id===e.actor_id));if(looseGuide.length)groups.push({key:'guide',label:'GUIDE',spans:[],events:looseGuide});const looseReturns=activeEvents.filter(e=>e.type==='RESULT'&&!activeSpans.some(s=>s.actor_id===e.actor_id));if(looseReturns.length)groups.push({key:'returns',label:'RESULTS',spans:[],events:looseReturns});return{groups,a,b}}
function renderDay(day=new Date()){if(!model)return;const axis=$('axis');axis.innerHTML='';for(let h=0;h<24;h+=2){const el=document.createElement('span');el.className='hour';el.style.left=(h/24*100)+'%';el.textContent=pad(h);axis.append(el)}const {groups,a,b}=laneRows(model.spans||[],model.events||[],day);const rows=$('rows');rows.innerHTML='';for(const g of groups){const row=document.createElement('div');row.className='row';const lab=document.createElement('div');lab.className='label';lab.textContent=g.label;lab.title=g.label;const tr=document.createElement('div');tr.className='track';cycleGrid(tr);for(const s of g.spans){const x=document.createElement('i');x.className=`span ${s.actor_kind} ${s.status==='STALE'?'stale':''}`;const l=pct(Date.parse(s.start_at),a,b),r=pct(Date.parse(s.end_at||s.last_activity_at||s.start_at),a,b);x.style.left=l+'%';x.style.width=Math.max(.08,r-l)+'%';x.title=`${s.actor_kind} · ${s.status} · ${s.productive_units??''} units`;tr.append(x)}for(const e of g.events){const x=document.createElement('i');x.className='event '+(e.actor_kind==='human'?'human':e.actor_kind==='guide'?'guide':e.type==='RESULT'?'return':'');x.style.left=pct(Date.parse(e.at),a,b)+'%';x.title=e.label||`${e.type}${e.outcome?' · '+e.outcome:''}`;tr.append(x)}row.append(lab,tr);rows.append(row)}const nl=document.createElement('i');nl.className='nowline';$('dayView').querySelector('.timeline').append(nl);renderNow(new Date())}
function renderWeek(){if(!model)return;const root=$('weekView');root.innerHTML='';const now=new Date();for(let d=6;d>=0;d--){const day=new Date(startDay(now).getTime()-d*86400000),a=day.getTime(),b=a+86400000;const row=document.createElement('div');row.className='dayline';const name=document.createElement('div');name.className='dayname';name.textContent=day.toLocaleDateString('es-AR',{weekday:'short',day:'2-digit'});const tr=document.createElement('div');tr.className='daytrack';const bins=Array(48).fill(0);for(const s of model.spans||[]){const ss=Math.max(a,Date.parse(s.start_at)),ee=Math.min(b,Date.parse(s.end_at||s.last_activity_at||s.start_at));if(ee<ss||ee<a||ss>b)continue;for(let i=Math.max(0,Math.floor((ss-a)/1800000));i<=Math.min(47,Math.floor((ee-a)/1800000));i++)bins[i]++}for(const e of model.events||[]){const t=Date.parse(e.at);if(t>=a&&t<b)bins[Math.floor((t-a)/1800000)]++}bins.forEach((n,i)=>{if(!n)return;const el=document.createElement('i');el.className='density';el.style.left=(i/48*100)+'%';el.style.width=(1/48*100)+'%';el.style.opacity=Math.min(.95,.18+n*.11);tr.append(el)});row.append(name,tr);root.append(row)}}
function stats(){const c=model?.counts||{};$('stats').innerHTML=`<b>${c.planned_runs||0}</b> runs planificados<br><b>${c.workers||0}</b> workers observados<br><b>${c.ai_sessions||0}</b> sesiones IA con journal<br><b>${c.human_prompt_checkpoints||0}</b> prompts/checkpoints humanos<br><b>${c.events||0}</b> eventos durables`;const age=(Date.now()-Date.parse(model.generated_at))/1000;const stale=age>900;$('fresh').innerHTML=`<span class="${stale?'bad':'ok'}">${stale?'STALE':'LIVE/last-good'}</span> · ${model.generated_at?new Date(model.generated_at).toLocaleTimeString('es-AR'):'sin fecha'}`;const cov=model.coverage||{};$('notice').textContent=`Cobertura: workers=${cov.worker_pipeline||'—'} · prompts Prometeo=${cov.prometeo_chat_sessions||'—'} · IA externa=${cov.arbitrary_external_ai_sessions||'—'} · texto crudo público=${cov.raw_prompt_text_public===false?'NO':'?'}`}
function show(){stats();renderDay();renderWeek()}
/* LAST_GOOD_SELECTOR_START */
function preferNewest(fresh,cached){
  const ft=Date.parse(fresh?.generated_at||''),ct=Date.parse(cached?.generated_at||'');
  if(cached&&Number.isFinite(ct)&&(!Number.isFinite(ft)||ct>ft)) return {model:cached,note:'last-good local · fuente remota atrasada'};
  return {model:fresh,note:null};
}
/* LAST_GOOD_SELECTOR_END */
async function load(){let cached=null;try{cached=JSON.parse(localStorage.getItem(CACHE)||'null')}catch{}try{const r=await fetch(DATA+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);const x=await r.json();if(x.schema!=='prometeo.activity-timeline/v1')throw new Error('schema');const chosen=preferNewest(x,cached);model=chosen.model;if(model===x)localStorage.setItem(CACHE,JSON.stringify(x));show();if(chosen.note)$('fresh').textContent=chosen.note}catch(e){model=cached;if(model){show();$('fresh').textContent='last-good local · fuente no disponible'}else $('fresh').textContent='sin telemetría disponible'}}
$('notifyBtn').onclick=toggleAlerts;$('dayTab').onclick=()=>{mode='day';$('dayTab').classList.add('on');$('weekTab').classList.remove('on');$('dayView').style.display='block';$('weekView').classList.remove('on')};$('weekTab').onclick=()=>{mode='week';$('weekTab').classList.add('on');$('dayTab').classList.remove('on');$('dayView').style.display='none';$('weekView').classList.add('on')};
refreshNotifyButton();clock();setInterval(clock,500);load();setInterval(load,10000);
})();
</script>
</body>
</html>
