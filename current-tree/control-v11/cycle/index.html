<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prometeo · 5/25</title>
<style>
:root{color-scheme:dark;--bg:#09090a;--fg:#f4f4f4;--muted:#8d8d92;--faint:#2a2a2e;--accent:#8ed3a7;--warn:#f0b55a;--bad:#ff746c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:radial-gradient(circle at 78% 17%,#1b1b1e 0,transparent 31%),#09090a}
main{min-height:100vh;padding:20px 24px 28px;border-top:2px solid var(--accent)}
header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.brand{font-size:10px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}.fresh{font-size:10px;color:var(--muted);text-align:right}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,38vw);gap:28px;align-items:end;margin:20px 0 16px;min-height:180px}
.clock{font-size:clamp(72px,13vw,176px);line-height:.78;font-weight:250;letter-spacing:-.07em;color:var(--accent);font-variant-numeric:tabular-nums}.phase{font-size:clamp(20px,3vw,36px);margin-top:24px;color:var(--accent)}.count{margin-left:10px;font-variant-numeric:tabular-nums}.hint{font-size:11px;color:var(--muted);margin-top:7px}
.phase-tools{display:flex;align-items:center;gap:9px;margin-top:10px;flex-wrap:wrap}.urgency{font-size:10px;color:var(--accent)}
.btn{border:1px solid var(--faint);background:transparent;color:var(--muted);font-size:10px;padding:7px 10px;border-radius:999px;cursor:pointer}.btn.on{color:var(--fg);border-color:var(--accent)}
.media{align-self:stretch;display:flex;flex-direction:column;justify-content:flex-end}.media-frame{position:relative;aspect-ratio:16/9;border:1px solid var(--faint);background:#050506;overflow:hidden}.media-frame video,.media-frame iframe{width:100%;height:100%;display:block;border:0;background:#050506}.media-empty{position:absolute;inset:0;display:grid;place-items:center;color:#555;font-size:10px;letter-spacing:.12em;text-transform:uppercase;pointer-events:none}
.media-controls{display:flex;gap:7px;margin-top:8px}.media-controls input{min-width:0;flex:1;background:transparent;border:0;border-bottom:1px solid var(--faint);outline:none;color:var(--muted);font-size:10px;padding:6px 2px}.media-controls input:focus{color:var(--fg);border-color:var(--accent)}
.summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end;border-top:1px solid var(--faint);padding-top:12px}.bottleneck{font-size:13px}.stats{font-size:10px;line-height:1.6;color:var(--muted);text-align:right}.stats b{color:var(--fg);font-weight:550}
.tabs{display:flex;gap:18px;overflow-x:auto;white-space:nowrap;margin:18px 0 12px}.tabs button{border:0;border-bottom:1px solid transparent;background:none;color:var(--muted);font-size:11px;padding:0 0 5px;cursor:pointer}.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.panel{display:none;border-top:1px solid var(--faint);padding-top:12px}.panel.on{display:block}
.run-head{display:flex;justify-content:space-between;gap:14px;align-items:end;margin-bottom:10px}.run-title{font-size:17px}.run-sub{font-size:9px;color:var(--muted);margin-top:4px}.run-score{font-size:28px;color:var(--accent);font-variant-numeric:tabular-nums}
.cycle-list,.worker-list{display:grid}.cycle-row{display:grid;grid-template-columns:minmax(190px,1.3fr) 96px 130px minmax(180px,1.2fr);gap:14px;align-items:center;min-height:54px;border-bottom:1px solid rgba(255,255,255,.045)}.cycle-title{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cycle-meta{font-size:9px;color:var(--muted);margin-top:4px}.progress-wrap{display:flex;align-items:center;gap:7px}.progress{height:4px;flex:1;background:#1c1c20}.progress i{display:block;height:100%;background:var(--accent)}.pct{width:28px;text-align:right;font-size:9px;color:var(--muted)}.state{font-size:9px;color:var(--muted)}.state strong{display:block;font-size:10px;color:var(--fg);font-weight:550}.state.boundary strong{color:var(--warn)}.detail{font-size:9px;line-height:1.4;color:var(--muted)}
.worker-row{display:grid;grid-template-columns:120px 80px 120px 1fr;gap:12px;align-items:center;min-height:44px;border-bottom:1px solid rgba(255,255,255,.045);font-size:9px}.worker-id{color:var(--fg);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}.worker-state{color:var(--muted)}.worker-state.boundary{color:var(--warn)}.worker-state.live{color:var(--accent)}
.timeline{position:relative;min-width:980px}.axis{height:28px;position:relative;margin-left:100px;border-bottom:1px solid var(--faint)}.hour{position:absolute;top:0;transform:translateX(-50%);font-size:8px;color:#666}.rows{position:relative}.row{display:grid;grid-template-columns:100px 1fr;min-height:27px;align-items:center}.label{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px}.track{position:relative;height:23px;border-bottom:1px solid rgba(255,255,255,.035);overflow:hidden}.span{position:absolute;top:10px;height:3px;background:#eee;min-width:2px}.span.run_plan{height:2px;background:#777}.span.ai_session{height:2px;background:repeating-linear-gradient(90deg,#888 0 5px,transparent 5px 9px)}.span.stale{opacity:.3}.event{position:absolute;top:5px;width:1px;height:13px;background:#aaa}.event.human{height:18px;top:2px;width:2px;background:#fff}.event.return{width:5px;height:5px;border-radius:50%;top:9px;transform:translateX(-2px)}.nowline{position:absolute;top:0;bottom:0;width:1px;background:var(--accent);opacity:.8;pointer-events:none}.legend{margin:8px 0 0 100px;font-size:8px;color:#666}
.week{min-width:760px}.dayline{display:grid;grid-template-columns:64px 1fr;align-items:center;height:28px}.dayname{font-size:9px;color:var(--muted)}.daytrack{height:9px;background:rgba(255,255,255,.025);position:relative}.density{position:absolute;top:0;bottom:0;background:#85858b}
.notice{margin-top:12px;font-size:8px;line-height:1.45;color:#666}
@media(max-width:800px){main{padding:15px}.hero{grid-template-columns:1fr;align-items:start}.media{width:100%}.summary{grid-template-columns:1fr}.stats{text-align:left}.clock{font-size:24vw}.cycle-row{grid-template-columns:1fr 82px;gap:8px;padding:8px 0}.cycle-row .state,.cycle-row .detail{grid-column:1/-1}.worker-row{grid-template-columns:100px 1fr;gap:7px;padding:7px 0}.worker-row .worker-detail{grid-column:1/-1}.row{grid-template-columns:74px 1fr}.axis{margin-left:74px}.legend{margin-left:74px}.timeline{min-width:820px}}
</style>
</head>
<body>
<main>
<header><div><div class="brand">PROMETEO · 5/25</div><div class="hint" id="date"></div></div><div class="fresh" id="fresh">cargando…</div></header>
<section class="hero">
  <div><div class="clock" id="clock">--:--</div><div class="phase"><span id="phase">—</span><span class="count" id="count">--:--</span></div><div class="hint" id="phaseHint"></div><div class="phase-tools"><span class="urgency" id="urgency"></span><button class="btn" id="notifyBtn">activar avisos</button></div></div>
  <div class="media"><div class="media-frame" id="mediaFrame"><video id="mediaPlayer" controls playsinline></video><div class="media-empty" id="mediaEmpty">video / música</div></div><div class="media-controls"><input id="mediaUrl" placeholder="YouTube o archivo .mp4/.webm/.mp3"><button class="btn" id="mediaSave">usar</button></div></div>
</section>
<section class="summary"><div class="bottleneck" id="bottleneck">Bottleneck: cargando…</div><div class="stats" id="stats"></div></section>
<nav class="tabs"><button class="on" data-tab="cycle">CICLO</button><button data-tab="workers">WORKERS</button><button data-tab="day">24H</button><button data-tab="week">SEMANA</button></nav>
<section class="panel on" id="cyclePanel"><div id="cycleView"></div></section>
<section class="panel" id="workersPanel"><div class="worker-list" id="workersView"></div></section>
<section class="panel" id="dayPanel"><div class="timeline"><div class="axis" id="axis"></div><div class="rows" id="rows"></div><div class="legend">worker · plan RUN · sesión IA · prompt/checkpoint · result</div></div></section>
<section class="panel" id="weekPanel"><div class="week" id="weekView"></div></section>
<div class="notice" id="notice"></div>
</main>
<script>
(()=>{
const SCORE='../../../live/worker-scoreboard.json',TIMELINE='../../../live/activity-timeline.json';
const SCORE_CACHE='prometeo.525.score.last-good.v1',TL_CACHE='prometeo.activity-timeline.last-good.v1',MEDIA_KEY='prometeo.525.media.v1',ALERT_KEY='prometeo.525.alerts.v1';
const LIFE={PLANNED:10,LAUNCHED:20,OBSERVED_WORKING:35,RESULT:60,VERIFIED:80,CONSUMED:100};
let score=null,timeline=null,tab='cycle';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),pad=n=>String(n).padStart(2,'0');
function fmt(t){if(!t)return'—';const d=new Date(t);return Number.isNaN(+d)?'—':d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}
function age(t){if(!t)return'—';const s=Math.max(0,(Date.now()-Date.parse(t))/1000);if(!Number.isFinite(s))return'—';if(s<60)return`${Math.round(s)}s`;if(s<3600)return`${Math.floor(s/60)}m`;return`${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`}
function dur(a,b){if(!a||!b)return'—';let s=Math.max(0,(Date.parse(b)-Date.parse(a))/1000);if(!Number.isFinite(s))return'—';if(s<60)return`${Math.round(s)}s`;if(s<3600)return`${Math.floor(s/60)}m ${Math.round(s%60)}s`;return`${Math.floor(s/3600)}h ${Math.round((s%3600)/60)}m`}
function phase(now){const sec=(now.getMinutes()%30)*60+now.getSeconds(),human=sec<300,elapsed=human?sec:sec-300,total=human?300:1500;return{human,total,remain:Math.max(0,total-elapsed),next:new Date(now.getTime()+(total-elapsed)*1000)}}
function countdown(s){s=Math.ceil(s);return`${pad(Math.floor(s/60))}:${pad(s%60)}`}
function urgency(p){if(p.remain<=30)return{c:'#ff746c',t:'cambia ya'};if(p.remain<=120)return{c:'#f0b55a',t:'últimos 2 min'};return{c:p.human?'#7fb7ff':'#8ed3a7',t:p.human?'tu ventana':'trabajo afuera'}}
function tick(){const n=new Date(),p=phase(n),u=urgency(p);document.documentElement.style.setProperty('--accent',u.c);$('clock').textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}`;$('date').textContent=n.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});$('phase').textContent=p.human?'5 min · vos':'25 min · afuera';$('count').textContent=countdown(p.remain);$('phaseHint').textContent=p.human?`a las ${pad(p.next.getHours())}:${pad(p.next.getMinutes())} arrancan los 25 min`:`a las ${pad(p.next.getHours())}:${pad(p.next.getMinutes())} arrancan tus 5 min`;$('urgency').textContent=u.t;renderNow(n)}
/* LAST_GOOD_SELECTOR_START */
function preferNewest(fresh,cached){const ft=Date.parse(fresh?.generated_at||''),ct=Date.parse(cached?.generated_at||'');if(cached&&Number.isFinite(ct)&&(!Number.isFinite(ft)||ct>ft))return{model:cached,note:'last-good local · fuente remota atrasada'};return{model:fresh,note:null}}
/* LAST_GOOD_SELECTOR_END */
function readCache(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}}
function saveCache(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
async function fetchJson(url){const r=await fetch(url+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(String(r.status));return r.json()}
function latestRunRows(){const xs=Array.isArray(score?.launch_measurements)?score.launch_measurements.filter(x=>x?.run_id&&x?.slot_id):[];if(!xs.length)return{run:null,rows:[]};const newest=xs.slice().sort((a,b)=>Date.parse(b.launched_at||b.closed_at||0)-Date.parse(a.launched_at||a.closed_at||0))[0];const run=newest.run_id;return{run,rows:xs.filter(x=>x.run_id===run).sort((a,b)=>String(a.slot_id).localeCompare(String(b.slot_id)))}}
function labelFor(r){const v=String(r.evolution_variant||r.slot_id||'');const cut=v.replace(/^PROMETEO_\d+_[A-Z]_\w+_S\d+_/,'').replace(/^PROMETEO_525_B_S\d+_/,'').replace(/_/g,' ');return cut||r.slot_id||'objetivo'}
function rowState(r){if(r.reallocation_complete)return{phase:'CONSUMED',p:100,note:'reallocation complete'};if(r.primary_complete&&r.exam_ref)return{phase:'VERIFIED',p:80,note:'primary complete + E9'};if(r.primary_complete)return{phase:'RESULT',p:60,note:'primary complete'};if(r.exam_ref)return{phase:'BOUNDARY',p:60,note:r.close_reason||r.pipeline_first_non_pass_stage||'boundary'};if(r.launched_at)return{phase:'LAUNCHED',p:20,note:'sin cierre durable'};return{phase:'PLANNED',p:10,note:'sin lanzamiento durable'}}
function renderCycle(){const {run,rows}=latestRunRows(),root=$('cycleView');if(!run){root.innerHTML='<div class="detail">No hay RUN medible en worker-scoreboard.</div>';$('bottleneck').textContent='Bottleneck: sin RUN medible';return}const st=rows.map(r=>({r,s:rowState(r)})),scorePct=st.length?Math.round(st.reduce((n,x)=>n+x.s.p,0)/st.length):0;const boundaries=st.filter(x=>x.s.phase==='BOUNDARY'),open=st.filter(x=>!['VERIFIED','CONSUMED','BOUNDARY'].includes(x.s.phase));let bottleneck='sin bottleneck visible';if(boundaries.length)bottleneck=`${boundaries.map(x=>x.r.slot_id).join(', ')} en boundary`;else if(open.length)bottleneck=`${open.map(x=>x.r.slot_id).join(', ')} sin cierre verificable`;else bottleneck='productores cerrados; falta evidencia explícita de consumo global';$('bottleneck').textContent='Bottleneck: '+bottleneck;root.innerHTML=`<div class="run-head"><div><div class="run-title">${esc(run)}</div><div class="run-sub">${rows.length} slots observados · fuente durable pública</div></div><div class="run-score">${scorePct}%</div></div><div class="cycle-list">${st.map(({r,s})=>`<div class="cycle-row"><div><div class="cycle-title">${esc(r.slot_id)} · ${esc(labelFor(r))}</div><div class="cycle-meta">${esc((r.worker_id||'').replace(/^wc-/,'').slice(0,18)||'worker desconocido')}</div></div><div class="progress-wrap"><div class="progress"><i style="width:${s.p}%"></i></div><span class="pct">${s.p}%</span></div><div class="state ${s.phase==='BOUNDARY'?'boundary':''}"><strong>${esc(s.phase)}</strong>${esc(s.note)}</div><div class="detail">inicio ${fmt(r.launched_at)} · cierre ${fmt(r.closed_at)} · ${dur(r.launched_at,r.closed_at)}${r.product_value_units!=null?` · valor ${r.product_value_units}`:''}</div></div>`).join('')}</div>`}
function renderWorkers(){const {rows}=latestRunRows(),root=$('workersView');if(!rows.length){root.innerHTML='<div class="detail">Sin workers del RUN actual.</div>';return}root.innerHTML=rows.map(r=>{const s=rowState(r),boundary=s.phase==='BOUNDARY',live=s.phase==='OBSERVED_WORKING';return`<div class="worker-row"><div class="worker-id">${esc((r.worker_id||'').replace(/^wc-/,'').slice(0,16))}</div><div>${esc(r.slot_id||'—')}</div><div class="worker-state ${boundary?'boundary':''} ${live?'live':''}">${esc(s.phase)}</div><div class="worker-detail detail">${dur(r.launched_at,r.closed_at)} · inicio ${fmt(r.launched_at)} · cierre ${fmt(r.closed_at)} · ${esc(r.exam_ref?'E9':'sin E9')}</div></div>`}).join('')}
function renderStats(){const {run,rows}=latestRunRows();const gen=score?.generated_at,stale=gen?Date.now()-Date.parse(gen)>15*60*1000:true;$('fresh').innerHTML=`<span style="color:${stale?'var(--warn)':'var(--accent)'}">${stale?'STALE':'FRESH'}</span> · ${gen?fmt(gen):'sin fecha'}`;$('stats').innerHTML=`<b>${esc(run||'—')}</b><br><b>${rows.length}</b> workers/slots · fuente ${esc(score?.schema||'—')}<br>edad de proyección: <b>${age(gen)}</b>`;$('notice').textContent='CICLO/WORKERS usan worker-scoreboard público. 24H/SEMANA cargan activity-timeline sólo al abrir esas vistas. UNKNOWN/BARRIER no se convierten en progreso imaginario.'}
async function loadScore(){const cached=readCache(SCORE_CACHE);try{const fresh=await fetchJson(SCORE);const chosen=preferNewest(fresh,cached);score=chosen.model;if(score===fresh)saveCache(SCORE_CACHE,fresh);renderCycle();renderWorkers();renderStats()}catch{score=cached;renderCycle();renderWorkers();renderStats();$('fresh').textContent=score?'last-good local · scoreboard no disponible':'sin scoreboard'}}
function timelineRows(day){const a=new Date(day);a.setHours(0,0,0,0);const A=+a,B=A+86400000,sp=(timeline?.spans||[]).filter(s=>Date.parse(s.end_at||s.last_activity_at||s.start_at)>=A&&Date.parse(s.start_at)<B);const ev=(timeline?.events||[]).filter(e=>{const t=Date.parse(e.at);return t>=A&&t<B});const groups=[{label:'VOS',spans:[],events:ev.filter(e=>e.actor_kind==='human')}];for(const s of sp.slice(-48))groups.push({label:s.actor_kind==='worker'?String(s.actor_id).replace(/^wc-/,'').slice(0,14):s.actor_kind==='run_plan'?'PLAN · '+s.actor_id:s.actor_id,spans:[s],events:ev.filter(e=>e.actor_id===s.actor_id&&e.actor_kind!=='human')});return{groups,A,B}}
function pos(t,A,B){return Math.max(0,Math.min(100,(Date.parse(t)-A)/(B-A)*100))}
function renderDay(){if(!timeline)return;const axis=$('axis');axis.innerHTML='';for(let h=0;h<24;h+=4){const x=document.createElement('span');x.className='hour';x.style.left=h/24*100+'%';x.textContent=pad(h);axis.append(x)}const {groups,A,B}=timelineRows(new Date()),rows=$('rows');rows.innerHTML='';for(const g of groups){const row=document.createElement('div');row.className='row';const lab=document.createElement('div');lab.className='label';lab.textContent=g.label;const tr=document.createElement('div');tr.className='track';for(const s of g.spans){const x=document.createElement('i');x.className=`span ${s.actor_kind} ${s.status==='STALE'?'stale':''}`;const l=pos(s.start_at,A,B),r=pos(s.end_at||s.last_activity_at||s.start_at,A,B);x.style.left=l+'%';x.style.width=Math.max(.12,r-l)+'%';x.title=`${s.status||''} · ${s.productive_units??0} units`;tr.append(x)}for(const e of g.events){const x=document.createElement('i');x.className='event '+(e.actor_kind==='human'?'human':e.type==='RESULT'?'return':'');x.style.left=pos(e.at,A,B)+'%';x.title=e.label||e.type;tr.append(x)}row.append(lab,tr);rows.append(row)}let nl=document.querySelector('#dayPanel .nowline');if(!nl){nl=document.createElement('i');nl.className='nowline';$('dayPanel').querySelector('.timeline').append(nl)}renderNow(new Date())}
function renderNow(n){const nl=document.querySelector('#dayPanel .nowline');if(!nl)return;const a=new Date(n);a.setHours(0,0,0,0);nl.style.left=`calc(100px + (100% - 100px) * ${((+n-+a)/86400000)})`}
function renderWeek(){if(!timeline)return;const root=$('weekView');root.innerHTML='';const now=new Date();for(let d=6;d>=0;d--){const day=new Date(now);day.setHours(0,0,0,0);day.setDate(day.getDate()-d);const A=+day,B=A+86400000,bins=Array(48).fill(0);for(const s of timeline.spans||[]){const ss=Math.max(A,Date.parse(s.start_at)),ee=Math.min(B,Date.parse(s.end_at||s.last_activity_at||s.start_at));if(!Number.isFinite(ss)||!Number.isFinite(ee)||ee<ss)continue;for(let i=Math.max(0,Math.floor((ss-A)/1800000));i<=Math.min(47,Math.floor((ee-A)/1800000));i++)bins[i]++}const row=document.createElement('div');row.className='dayline';const name=document.createElement('div');name.className='dayname';name.textContent=day.toLocaleDateString('es-AR',{weekday:'short',day:'2-digit'});const tr=document.createElement('div');tr.className='daytrack';bins.forEach((n,i)=>{if(!n)return;const x=document.createElement('i');x.className='density';x.style.left=i/48*100+'%';x.style.width=1/48*100+'%';x.style.opacity=Math.min(.95,.15+n*.08);tr.append(x)});row.append(name,tr);root.append(row)}}
async function ensureTimeline(){if(timeline){renderDay();renderWeek();return}const cached=readCache(TL_CACHE);if(cached){timeline=cached;renderDay();renderWeek()}try{const fresh=await fetchJson(TIMELINE);const chosen=preferNewest(fresh,cached);timeline=chosen.model;if(timeline===fresh)saveCache(TL_CACHE,fresh);renderDay();renderWeek()}catch{}}
function setTab(name){tab=name;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));$(name+'Panel').classList.add('on');if(name==='day'||name==='week')ensureTimeline()}
function mediaId(url){try{const u=new URL(url);if(u.hostname.includes('youtu.be'))return u.pathname.slice(1);if(u.hostname.includes('youtube.com'))return u.searchParams.get('v')||u.pathname.split('/').filter(Boolean).pop()}catch{}return null}
function applyMedia(url){const frame=$('mediaFrame'),empty=$('mediaEmpty');frame.querySelectorAll('iframe').forEach(x=>x.remove());const v=$('mediaPlayer');v.pause();v.removeAttribute('src');v.load();if(!url){v.style.display='block';empty.style.display='grid';return}const id=mediaId(url);if(id){v.style.display='none';const f=document.createElement('iframe');f.allow='autoplay; encrypted-media; picture-in-picture';f.allowFullscreen=true;f.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id);frame.insertBefore(f,empty)}else{v.style.display='block';v.src=url}empty.style.display='none'}
function initMedia(){const saved=localStorage.getItem(MEDIA_KEY)||'';$('mediaUrl').value=saved;applyMedia(saved);$('mediaSave').onclick=()=>{const u=$('mediaUrl').value.trim();localStorage.setItem(MEDIA_KEY,u);applyMedia(u)}}
function initAlerts(){const b=$('notifyBtn');b.classList.toggle('on',localStorage.getItem(ALERT_KEY)==='1');b.onclick=async()=>{const on=localStorage.getItem(ALERT_KEY)==='1';if(on){localStorage.removeItem(ALERT_KEY);b.classList.remove('on');b.textContent='activar avisos';return}if('Notification'in window&&Notification.permission!=='granted')await Notification.requestPermission();localStorage.setItem(ALERT_KEY,'1');b.classList.add('on');b.textContent='avisos ✓'}}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
initMedia();initAlerts();tick();setInterval(tick,500);loadScore();setInterval(loadScore,60000);
})();
</script>
