name: STT Study public selftest egress diagnosis

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/stt-study-transcribe-egress-diagnosis.yml"

permissions:
  contents: read

concurrency:
  group: stt-study-public-selftest-egress-diagnosis
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CONTROL_URL: "https://api.github.com/zen"
      SELFTEST_URL: "https://catnohyouxqjjtseaueb.supabase.co/functions/v1/study-transcribe-v1?selftest=1"
    steps:
      - name: Two bounded read-only GET probes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          readonly METHOD="GET"
          case "$METHOD" in
            GET) ;;
            *) echo "mutating method blocked before network" >&2; exit 64 ;;
          esac

          probe() {
            local label="$1"
            local url="$2"
            : > "out/${label}-body.txt"
            : > "out/${label}-stderr.txt"
            set +e
            curl --silent --show-error --location \
              --connect-timeout 10 \
              --max-time 30 \
              --request "$METHOD" \
              --output "out/${label}-body.txt" \
              --write-out '%{http_code}\t%{time_namelookup}\t%{time_connect}\t%{time_appconnect}\t%{time_starttransfer}\t%{time_total}\t%{remote_ip}\n' \
              "$url" > "out/${label}-metrics.tsv" 2> "out/${label}-stderr.txt"
            local rc="$?"
            set -e
            printf '%s\n' "$rc" > "out/${label}-curl-exit.txt"
          }

          probe control "$CONTROL_URL"
          probe target "$SELFTEST_URL"

          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          def read_probe(label, url):
              parts = Path(f"out/{label}-metrics.tsv").read_text().rstrip("\n").split("\t")
              while len(parts) < 7:
                  parts.append("")
              http_code, dns, connect, tls, ttfb, total, remote_ip = parts[:7]
              body = Path(f"out/{label}-body.txt").read_bytes()
              stderr = Path(f"out/{label}-stderr.txt").read_text()
              return {
                  "label": label,
                  "url": url,
                  "method": "GET",
                  "curl_exit_code": int(Path(f"out/{label}-curl-exit.txt").read_text().strip() or "0"),
                  "http_status": int(http_code or "0"),
                  "time_namelookup_s": float(dns or "0"),
                  "time_connect_s": float(connect or "0"),
                  "time_appconnect_s": float(tls or "0"),
                  "time_starttransfer_s": float(ttfb or "0"),
                  "time_total_s": float(total or "0"),
                  "remote_ip": remote_ip or None,
                  "body_bytes": len(body),
                  "body_sha256": hashlib.sha256(body).hexdigest(),
                  "stderr": stderr[-1200:],
              }

          control = read_probe("control", os.environ["CONTROL_URL"])
          target = read_probe("target", os.environ["SELFTEST_URL"])
          if control["http_status"] > 0 and target["http_status"] == 0:
              classification = "TARGET_OR_PATH_SPECIFIC_PRE_HTTP_BOUNDARY"
          elif control["http_status"] == 0 and target["http_status"] == 0:
              classification = "GENERAL_EGRESS_OR_DNS_BOUNDARY"
          elif target["http_status"] > 0:
              classification = "APPLICATION_HTTP_OBSERVED"
          else:
              classification = "UNCLASSIFIED_BOUNDARY"

          result = {
              "schema": "prometeo.stt-study-public-selftest-egress-diagnosis/v1",
              "request_count": 2,
              "mutating_requests": 0,
              "control": control,
              "target": target,
              "classification": classification,
              "prior_boundary": {
                  "run_id": 36656247320,
                  "artifact_id": 11072971507,
                  "status": "PRESERVED"
              },
              "privacy": {
                  "audio_sent": False,
                  "transcript_sent": False,
                  "session_id_sent": False,
                  "room_token_sent": False,
                  "credentials_sent": False
              }
          }
          Path("out/result.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print(json.dumps(result, sort_keys=True))
          PY

      - name: Guard read-only evidence contract
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open("out/result.json"))
          assert r["request_count"] == 2
          assert r["mutating_requests"] == 0
          assert r["control"]["method"] == "GET"
          assert r["target"]["method"] == "GET"
          assert not any(r["privacy"].values())
          print(r["classification"])
          PY

      - name: Upload diagnosis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stt-study-transcribe-egress-diagnosis-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 7
