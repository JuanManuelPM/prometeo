name: primary-chat-state-renderer-wiring-v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/primary-chat-state-renderer-wiring-v1.yml'
      - 'coordination/guide/PRIMARY_CHAT_STATE_COMMUNICATION_CONTRACT_V1.json'
      - 'coordination/guide/tests/primary_chat_state_communication_v1.mjs'
      - 'coordination/guide/tests/primary_chat_state_renderer_wiring_v1.mjs'
      - 'current-tree/control-v11/chat-canary/progress-v1.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run renderer wiring harness
        run: node coordination/guide/tests/primary_chat_state_renderer_wiring_v1.mjs
