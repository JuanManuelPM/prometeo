name: Worker I/O Transport Trace v1

on:
  push:
    branches: [main]
    paths:
      - 'coordination/workers/WORKER_IO_TRANSPORT_TRACE_CANDIDATE_V1.json'
      - 'coordination/portfolio/evidence/prometeo-autonomous-growth/WORKER_IO_TRANSPORT_TRACE_FIXTURE_V1.json'
      - 'coordination/portfolio/evidence/prometeo-autonomous-growth/WORKER_IO_TRANSPORT_TRACE_PRESERVATION_V1.json'
      - 'scripts/summarize-worker-io-transport-trace-v1.mjs'
      - 'tests/worker-io-accounting-transport-trace-v1.test.mjs'
      - '.github/workflows/worker-io-accounting-transport-trace-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate bounded transport trace semantics
        run: node tests/worker-io-accounting-transport-trace-v1.test.mjs
