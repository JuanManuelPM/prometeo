name: trail-wide-curved-validate-once

on:
  push:
    paths:
      - ".github/workflows/trail-wide-curved-validate-once.yml"

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate wide turn and curved surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("visuals/trail-lab/index.html").read_text()
          m=re.search(r"<script>([\s\S]*?)</script>",s)
          assert m, "inline script missing"
          script=m.group(1)
          Path("/tmp/trail.js").write_text(script)

          required=[
            "m.radiusPx=clamp(Math.min(W*.30,H*.46),130,230)",
            "m.radiusZ=m.radiusPx/m.depthScale",
            "m.turnLen=Math.PI*m.turnMetricRadius",
            "pz=m.nearCenterZ-m.radiusZ*Math.sin(a)",
            "const SURFACE_CURVE=1.05",
            "function drawCurvedSurface",
            "return quality===0?7:(quality===1?9:11)",
            "const sideAngle=Math.acos",
            "drawCurvedSurface(source,w,h,yawAngle,alpha)",
            "pathDistance+=PATH_SPEED*dt",
            "ageT<=.0001?0",
            "const scale=lerp(.56,.97,ageCurve)"
          ]
          for token in required:
              assert token in script, f"missing {token}"

          forbidden=[
            "yawLook.scaleX",
            "if(yawLook.mirror)ctx.scale(-1,1)",
            "function turnAngleAtDistance",
            "new Float32Array(samples+1)"
          ]
          for token in forbidden:
              assert token not in script, f"obsolete narrow/paper model remains: {token}"

          assert "http://" not in script and "https://" not in script, "external runtime URL found"

          state=Path("visuals/fronts/trail/state.json").read_text()
          assert '"current_blob_sha": "33f55a2c9318b4210d1b3c26b4b8695d44ec4c3f"' in state
          decisions=Path("visuals/fronts/trail/decisions.md").read_text()
          assert "## Wide-radius turn geometry" in decisions
          assert "## Curved sprite surface" in decisions
          arch=Path("visuals/fronts/trail/architecture.md").read_text()
          assert "broad racetrack in X/Z" in arch
          assert "SURFACE_CURVE = 1.05" in arch
          print("Trail wide-turn/curved-surface static checks OK")
          PY
          node --check /tmp/trail.js
          echo "node syntax OK"
