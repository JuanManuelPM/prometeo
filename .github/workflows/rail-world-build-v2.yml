name: Rail World Build v10

on:
  push:
    branches: [visual-review-rail-world-v2]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rail-world-build-v6
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-review-rail-world-v2
          fetch-depth: 2

      - id: chrome
        uses: browser-actions/setup-chrome@v1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Serve exact checkout
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . >/tmp/rail-v10-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:4173/demos/prometeo-rail-world-v2/" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rail-v10-http.log
          exit 1

      - name: Browser test and visual review
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf demos/prometeo-rail-world-v2/review
          mkdir -p demos/prometeo-rail-world-v2/review

          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --remote-debugging-port=9222 --user-data-dir=/tmp/rail-v10-chrome about:blank >/tmp/rail-v10-chrome.log 2>&1 &
          echo $! >/tmp/rail-v10-chrome.pid
          trap 'kill "$(cat /tmp/rail-v10-chrome.pid)" 2>/dev/null || true' EXIT

          for i in {1..80}; do
            if curl -fsS "http://127.0.0.1:9222/json/version" >/dev/null; then break; fi
            sleep .25
          done

          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';

          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const pages=await (await fetch('http://127.0.0.1:9222/json/list')).json();
          const page=pages.find(x=>x.type==='page');
          if(!page?.webSocketDebuggerUrl)throw new Error('No Chrome page target');
          const ws=new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{
            ws.addEventListener('open',resolve,{once:true});
            ws.addEventListener('error',reject,{once:true});
          });

          let seq=0;
          const pending=new Map();
          ws.addEventListener('message',ev=>{
            const m=JSON.parse(String(ev.data));
            if(!m.id)return;
            const p=pending.get(m.id);
            if(!p)return;
            pending.delete(m.id);
            m.error?p.reject(new Error(m.error.message||JSON.stringify(m.error))):p.resolve(m.result||{});
          });
          const send=(method,params={})=>{
            const id=++seq;
            return new Promise((resolve,reject)=>{
              pending.set(id,{resolve,reject});
              ws.send(JSON.stringify({id,method,params}));
            });
          };
          const evaluate=async expression=>{
            const r=await send('Runtime.evaluate',{expression,returnByValue:true});
            if(r?.exceptionDetails)throw new Error(r.exceptionDetails.text||'Runtime exception');
            return r?.result?.value;
          };
          async function waitReady(label,attempts=280){
            for(let i=0;i<attempts;i++){
              try{
                if(await evaluate('Boolean(window.PrometeoRailWorldReview&&window.PrometeoRailWorldReview.ready&&window.PrometeoRailWorldV10)'))return;
              }catch{}
              await sleep(125);
            }
            throw new Error('Never ready: '+label);
          }

          await send('Page.enable');
          await send('Runtime.enable');
          await send('Network.enable');
          await send('Emulation.setDeviceMetricsOverride',{width:1365,height:768,deviceScaleFactor:1,mobile:false,screenWidth:1365,screenHeight:768});

          async function state(){return evaluate('window.PrometeoRailWorldV10.getState()')}
          async function shot(name,url){
            await send('Page.navigate',{url});
            await waitReady(name);
            await sleep(650);
            const out=await send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:false});
            const bytes=Buffer.from(out.data,'base64');
            if(bytes.length<15000)throw new Error('Screenshot too small '+name+' '+bytes.length);
            const file='demos/prometeo-rail-world-v2/review/'+name+'.png';
            await fs.mkdir(path.dirname(file),{recursive:true});
            await fs.writeFile(file,bytes);
          }

          const base='http://127.0.0.1:4173/demos/prometeo-rail-world-v2/';
          const reviews=[
            ['arcos-front',base+'?review=1&scene=ARCOS&cx=0&cz=-5&yaw=0&px=0&pz=18'],
            ['arcos-angle',base+'?review=1&scene=ARCOS&cx=-8&cz=18&yaw=0.72&px=0&pz=34'],
            ['calzada-angle',base+'?review=1&scene=CALZADA&cx=8&cz=23&yaw=-0.62&px=0&pz=34'],
            ['tunel-turn',base+'?review=1&scene=TUNEL&cx=-5&cz=37&yaw=0.52&px=0&pz=62'],
            ['torres-angle',base+'?review=1&scene=TORRES&cx=9&cz=28&yaw=-0.56&px=0&pz=40'],
            ['museo-front',base+'?review=1&scene=MUSEO&cx=0&cz=-4&yaw=0&px=0&pz=18'],
            ['museo-gallery',base+'?review=1&scene=MUSEO&cx=-7&cz=42&yaw=1.02&px=-7&pz=48']
          ];
          for(const [name,url] of reviews)await shot(name,url);

          await send('Page.navigate',{url:base});
          await waitReady('runtime');
          await sleep(180);

          const initial=await state();
          if(initial.version!=='rail-world-v10-turn-handoff-camera-r1')throw new Error('Wrong runtime '+JSON.stringify(initial));
          if(initial.hasIframe)throw new Error('V6 still depends on iframe');
          if(!(initial.graph.nodes>50&&initial.graph.edges>50&&initial.gates.length===4))throw new Error('World graph incomplete '+JSON.stringify(initial.graph));
          if(!(initial.render.faces>20&&initial.render.paths>30))throw new Error('Renderer evidence too small '+JSON.stringify(initial.render));

          // Rotation must redraw real world geometry from a new camera angle.
          await evaluate('window.PrometeoRailWorldV10.setCamera({x:-7,z:20,yaw:0})');
          await sleep(120);
          const yaw0=await state();
          await evaluate('window.PrometeoRailWorldV10.setCamera({x:-7,z:20,yaw:0.82})');
          await sleep(120);
          const yaw1=await state();
          if(!(Math.abs(yaw1.camera.yaw-yaw0.camera.yaw)>.7&&yaw0.render.faces>15&&yaw1.render.faces>15)){
            throw new Error('Rotational renderer failed '+JSON.stringify({yaw0,yaw1}));
          }

          // Wheel moves only the camera, preserving the player route/position.
          await evaluate('window.PrometeoRailWorldV10.setCamera({x:0,z:-5,yaw:0});window.PrometeoRailWorldV10.setPlayer({x:0,z:4})');
          const beforeWheel=await state();
          for(let i=0;i<5;i++){
            await send('Input.dispatchMouseEvent',{type:'mouseWheel',x:680,y:380,deltaX:0,deltaY:-420});
            await sleep(55);
          }
          await sleep(850);
          const afterWheel=await state();
          if(!(afterWheel.camera.z>beforeWheel.camera.z+4))throw new Error('Wheel camera movement failed '+JSON.stringify({beforeWheel,afterWheel}));
          if(Math.hypot(afterWheel.player.x-beforeWheel.player.x,afterWheel.player.z-beforeWheel.player.z)>.08)throw new Error('Wheel dragged player '+JSON.stringify({beforeWheel,afterWheel}));

          // Mouse drag must never free-rotate the world. Clicking moves the avatar; camera yaw
          // comes only from route composition or directed views.
          await evaluate('window.PrometeoRailWorldV10.setCamera({x:0,z:-5,yaw:0});window.PrometeoRailWorldV10.setPlayer({x:0,z:4})');
          const beforeDrag=await state();
          await send('Input.dispatchMouseEvent',{type:'mousePressed',x:520,y:390,button:'left',buttons:1,clickCount:1});
          await send('Input.dispatchMouseEvent',{type:'mouseMoved',x:900,y:390,button:'left',buttons:1});
          await sleep(120);
          await send('Input.dispatchMouseEvent',{type:'mouseReleased',x:900,y:390,button:'left',buttons:0,clickCount:1});
          await sleep(120);
          const afterDrag=await state();
          if(Math.abs(afterDrag.camera.yaw-beforeDrag.camera.yaw)>.015)throw new Error('Mouse drag still rotates camera '+JSON.stringify({beforeDrag:beforeDrag.camera,afterDrag:afterDrag.camera}));
          if(Math.hypot(afterDrag.camera.x-beforeDrag.camera.x,afterDrag.camera.z-beforeDrag.camera.z)>.05)throw new Error('Mouse drag still moves camera '+JSON.stringify({beforeDrag:beforeDrag.camera,afterDrag:afterDrag.camera}));

          // Composition camera: a route first aligns the view, then position stays still
          // until the avatar escapes the dead zone. Catch-up must then settle back to idle.
          await evaluate('window.PrometeoRailWorldV10.setScene("ARCOS");window.PrometeoRailWorldV10.setCamera({x:0,z:-5,yaw:0});window.PrometeoRailWorldV10.setPlayer({x:0,z:4});window.PrometeoRailWorldV10.routeToNode("spineB_6")');
          const routeStart=await state();
          if(routeStart.composition.mode!=="ROUTE_ALIGN")throw new Error('Route did not enter ROUTE_ALIGN '+JSON.stringify(routeStart.composition));
          const startCamera={...routeStart.camera};
          let catchup=null,settled=null;
          for(let i=0;i<150;i++){
            await sleep(100);
            const s=await state();
            if(!catchup&&s.composition.autoFollowMoves>0)catchup=s;
            if(catchup&&s.composition.mode==="IDLE_COMPOSITION"&&s.composition.cameraSettles>0){settled=s;break}
          }
          if(!catchup)throw new Error('FOLLOW_CATCHUP never engaged');
          if(!settled)throw new Error('Camera never settled back to IDLE_COMPOSITION');
          if(!(settled.camera.z>startCamera.z+6))throw new Error('Camera did not catch the avatar '+JSON.stringify({startCamera,settled:settled.camera}));
          const dxFollow=settled.player.x-settled.camera.x,dzFollow=settled.player.z-settled.camera.z;
          const relDepth=dxFollow*Math.sin(settled.camera.yaw)+dzFollow*Math.cos(settled.camera.yaw);
          if(!(relDepth>4.5&&relDepth<20.5))throw new Error('Settled composition depth invalid '+JSON.stringify({settled,relDepth}));

          // Directed view is camera-only: it turns toward an object while the avatar stays put.
          await evaluate('window.PrometeoRailWorldV10.setScene("ARCOS");window.PrometeoRailWorldV10.setCamera({x:0,z:-5,yaw:0});window.PrometeoRailWorldV10.setPlayer({x:0,z:4})');
          const directedBefore=await state();
          await evaluate('window.PrometeoRailWorldV10.directViewAt(24,42,650)');
          await sleep(220);
          const directedDuring=await state();
          if(!(directedDuring.composition.mode==="DIRECTED_VIEW"&&directedDuring.composition.directed&&directedDuring.composition.directedViews>0))throw new Error('Directed view did not engage '+JSON.stringify(directedDuring));
          if(Math.hypot(directedDuring.player.x-directedBefore.player.x,directedDuring.player.z-directedBefore.player.z)>.02)throw new Error('Directed view moved avatar');
          if(Math.abs(directedDuring.camera.yaw-directedBefore.camera.yaw)<.12)throw new Error('Directed view did not rotate camera');
          await sleep(700);
          const directedAfter=await state();
          if(!(directedAfter.composition.mode==="IDLE_COMPOSITION"&&!directedAfter.composition.directed))throw new Error('Directed view did not settle '+JSON.stringify(directedAfter.composition));

          // Route to the museum. A turn is not allowed to rotate from the old distant camera
          // position: first the camera must travel to the avatar's old turn position, then rotate.
          await evaluate('window.PrometeoRailWorldV10.setScene("ARCOS");window.PrometeoRailWorldV10.setCamera({x:0,z:-5,yaw:0});window.PrometeoRailWorldV10.setPlayer({x:0,z:4});window.PrometeoRailWorldV10.routeToGate("MUSEO")');
          const gateRouteStart=await state();
          let turnApproach=null,turnRotate=null,armed=null;
          for(let i=0;i<180;i++){
            await sleep(100);
            const s=await state();
            const turn=s.composition.turn;
            if(!turnApproach&&s.composition.mode==="TURN_APPROACH"&&turn?.phase==="APPROACH")turnApproach=s;
            if(turnApproach&&!turnRotate&&s.composition.mode==="TURN_ROTATE"&&turn?.phase==="ROTATE")turnRotate=s;
            if(s.activeGate==='MUSEO'){armed=s;break}
          }
          if(!turnApproach)throw new Error('TURN_APPROACH never engaged');
          if(!turnRotate)throw new Error('TURN_ROTATE never engaged');
          if(!armed)throw new Error('Avatar never reached museum gate');
          const ta=turnApproach.composition.turn;
          const approachDist=Math.hypot(turnApproach.camera.x-ta.anchorX,turnApproach.camera.z-ta.anchorZ);
          if(Math.abs(turnApproach.camera.targetYaw-ta.incomingYaw)>.06)throw new Error('Camera rotated before reaching turn anchor '+JSON.stringify({turnApproach,approachDist}));
          const tr=turnRotate.composition.turn;
          const rotateDist=Math.hypot(turnRotate.camera.x-tr.anchorX,turnRotate.camera.z-tr.anchorZ);
          if(rotateDist>.48)throw new Error('Camera began turn before reaching the exact player handoff point '+JSON.stringify({turnRotate,rotateDist}));
          if(!(tr.playerToPivotAtRotate!==null&&tr.playerToPivotAtRotate<2.3))throw new Error('Camera rotated before avatar reached the turn hinge '+JSON.stringify({turnRotate,playerToPivotAtRotate:tr.playerToPivotAtRotate}));
          if(!(turnRotate.camera.z>gateRouteStart.camera.z+20))throw new Error('Camera did not travel forward before turn '+JSON.stringify({start:gateRouteStart.camera,turn:turnRotate.camera}));
          if(!(Math.abs(armed.camera.yaw)>.18&&armed.player.z>70&&armed.composition.autoFollowMoves>0&&armed.composition.turnTransitions>0))throw new Error('Branch path-turn evidence weak '+JSON.stringify(armed));

          // Gate transition lands in a real museum scene with physical panels and another 4-way graph.
          await evaluate('window.PrometeoRailWorldV10.enterActive()');
          await sleep(650);
          const museum=await state();
          if(!(museum.scene==='MUSEO'&&museum.museumPanels===4&&museum.gates.length===4&&museum.graph.nodes>50)){
            throw new Error('Museum transition failed '+JSON.stringify(museum));
          }
          if(museum.hasIframe)throw new Error('Museum unexpectedly uses iframe');

          console.log('FUNCTIONAL_RAIL_V10 PASS',JSON.stringify({
            initial:{scene:initial.scene,graph:initial.graph,render:initial.render},
            yaw0:{yaw:yaw0.camera.yaw,faces:yaw0.render.faces},
            yaw1:{yaw:yaw1.camera.yaw,faces:yaw1.render.faces},
            wheel:{before:beforeWheel.camera,after:afterWheel.camera},
            composition:{start:routeStart.composition,catchup:catchup.composition,settled:settled.composition,camera:settled.camera,player:settled.player},
            directed:{before:directedBefore.camera,during:directedDuring.camera,after:directedAfter.composition},
            drag:{before:beforeDrag.camera,after:afterDrag.camera},
            turn:{approach:{camera:turnApproach.camera,turn:turnApproach.composition.turn},rotate:{camera:turnRotate.camera,turn:turnRotate.composition.turn}},
            armed:{activeGate:armed.activeGate,player:armed.player,camera:armed.camera},
            museum:{scene:museum.scene,panels:museum.museumPanels,gates:museum.gates.map(g=>g.destination)}
          }));

          await fs.writeFile('demos/prometeo-rail-world-v2/review/manifest.json',JSON.stringify({
            schema:'prometeo.rail-world-review/v9',
            source_sha:process.env.SOURCE_SHA,
            generated_at:new Date().toISOString(),
            runtime:'rail-world-v10-turn-handoff-camera-r1',
            renderer:'world-space canvas perspective; yaw camera; depth-sorted faces; textured triangles',
            controls:['click player route','path-anchored automatic camera','wheel/W-S distance override','gate/sign directed view','no free mouse yaw'],
            scenes:['ARCOS','CALZADA','TUNEL','TORRES','MUSEO'],
            review:reviews.map(x=>x[0]+'.png')
          },null,2)+'\n');

          ws.close();
          NODE

          ls -lh demos/prometeo-rail-world-v2/review

      - name: Upload exact evidence
        uses: actions/upload-artifact@v4
        with:
          name: rail-world-v10-${{ github.sha }}
          path: demos/prometeo-rail-world-v2/review/
          retention-days: 30
          if-no-files-found: error

      - name: Publish V9 source and evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/rail-world-v10
          mkdir -p /tmp/rail-world-v10/demos/prometeo-rail-world-v2 /tmp/rail-world-v10/workflow
          cp demos/prometeo-rail-world-v2/index.html /tmp/rail-world-v10/demos/prometeo-rail-world-v2/index.html
          cp -a demos/prometeo-rail-world-v2/review /tmp/rail-world-v10/demos/prometeo-rail-world-v2/
          cp .github/workflows/rail-world-build-v2.yml /tmp/rail-world-v10/workflow/rail-world-build-v2.yml

          git reset --hard HEAD
          git clean -fd

          publish_branch () {
            local branch="$1"
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
            mkdir -p demos/prometeo-rail-world-v2
            rm -rf demos/prometeo-rail-world-v2
            cp -a /tmp/rail-world-v10/demos/prometeo-rail-world-v2 demos/prometeo-rail-world-v2
            if [ "$branch" = "main" ]; then
              mkdir -p .github/workflows
              cp /tmp/rail-world-v10/workflow/rail-world-build-v2.yml .github/workflows/rail-world-build-v2.yml
            fi
            git add -A demos/prometeo-rail-world-v2
            if [ "$branch" = "main" ]; then git add .github/workflows/rail-world-build-v2.yml; fi
            if git diff --cached --quiet; then return 0; fi
            git commit -m "visuals: publish turn-handoff Rail World V10"
            for n in 1 2 3 4; do
              if git push origin "HEAD:$branch"; then return 0; fi
              git fetch origin "$branch"
              git rebase "origin/$branch"
              sleep 2
            done
            return 1
          }

          publish_branch main
          publish_branch gh-pages

      - name: Verify public V10
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          URL="https://juanmanuelpm.github.io/prometeo/demos/prometeo-rail-world-v2/"
          for i in {1..60}; do
            PAGE="$(curl -fsSL --max-time 12 "$URL" 2>/dev/null || true)"
            if printf '%s' "$PAGE" | grep -Fq "rail-world-v10-turn-handoff-camera-r1"; then break; fi
            sleep 5
          done

          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --remote-debugging-port=9223 --user-data-dir=/tmp/rail-v10-public about:blank >/tmp/rail-v10-public.log 2>&1 &
          echo $! >/tmp/rail-v10-public.pid
          trap 'kill "$(cat /tmp/rail-v10-public.pid)" 2>/dev/null || true' EXIT
          for i in {1..80}; do
            if curl -fsS "http://127.0.0.1:9223/json/version" >/dev/null; then break; fi
            sleep .25
          done

          node --input-type=module <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const pages=await (await fetch('http://127.0.0.1:9223/json/list')).json();
          const page=pages.find(x=>x.type==='page');
          const ws=new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{ws.addEventListener('open',resolve,{once:true});ws.addEventListener('error',reject,{once:true})});
          let seq=0;const pending=new Map();
          ws.addEventListener('message',ev=>{const m=JSON.parse(String(ev.data));if(!m.id)return;const p=pending.get(m.id);if(!p)return;pending.delete(m.id);m.error?p.reject(new Error(m.error.message)):p.resolve(m.result||{})});
          const send=(method,params={})=>{const id=++seq;return new Promise((resolve,reject)=>{pending.set(id,{resolve,reject});ws.send(JSON.stringify({id,method,params}))})};
          const evaluate=async expression=>(await send('Runtime.evaluate',{expression,returnByValue:true}))?.result?.value;
          await send('Page.enable');await send('Runtime.enable');
          await send('Page.navigate',{url:'https://juanmanuelpm.github.io/prometeo/demos/prometeo-rail-world-v2/'});
          for(let i=0;i<280;i++){
            if(await evaluate('Boolean(window.PrometeoRailWorldReview&&window.PrometeoRailWorldReview.ready&&window.PrometeoRailWorldV10)'))break;
            if(i===279)throw new Error('Public V8 never became ready');
            await sleep(125);
          }
          const before=await evaluate('window.PrometeoRailWorldV10.getState()');
          if(before.hasIframe||before.gates.length!==4||before.render.faces<15)throw new Error('Public V8 invalid '+JSON.stringify(before));
          await evaluate('window.PrometeoRailWorldV10.setScene("MUSEO")');
          await sleep(180);
          const museum=await evaluate('window.PrometeoRailWorldV10.getState()');
          if(!(museum.scene==='MUSEO'&&museum.museumPanels===4&&museum.gates.length===4))throw new Error('Public museum invalid '+JSON.stringify(museum));
          await evaluate('window.PrometeoRailWorldV10.setCamera({x:-7,z:42,yaw:1.0});window.PrometeoRailWorldV10.forceFrame()');
          const rotated=await evaluate('window.PrometeoRailWorldV10.getState()');
          if(!(Math.abs(rotated.camera.yaw-1)<.01&&rotated.render.faces>10))throw new Error('Public rotational renderer invalid '+JSON.stringify(rotated));
          console.log('PUBLIC_RAIL_WORLD_V10_VERIFIED',JSON.stringify({before:{scene:before.scene,faces:before.render.faces,gates:before.gates.length},museum:{panels:museum.museumPanels,gates:museum.gates.length},rotated:{yaw:rotated.camera.yaw,faces:rotated.render.faces}}));
          ws.close();
          NODE
