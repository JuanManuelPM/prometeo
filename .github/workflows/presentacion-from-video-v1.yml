name: PROMETEO Video to Presentation V1
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'YouTube URL or exact title and channel'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: prometeo-video-to-deck-publish
  cancel-in-progress: false
jobs:
  transcribe-curate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install caption adapter
        run: python -m pip install --user 'yt-dlp>=2025.1.0'
      - name: Retrieve metadata, timed captions and candidate clips
        env:
          VIDEO_SOURCE: ${{ inputs.source }}
        run: |
          python scripts/presentacion/from_video.py --source "$VIDEO_SOURCE" --out dist/presentacion-auto
          python -m unittest discover -s tests -p 'test_video_flow.py' -v
      - name: Archive evidence
        uses: actions/upload-artifact@v4
        with:
          name: prometeo-video-to-deck-candidate
          path: dist/presentacion-auto/
          retention-days: 30
      - name: Publish isolated candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin gh-pages
          git worktree add /tmp/video-to-deck-pages origin/gh-pages
          mkdir -p /tmp/video-to-deck-pages/presentacion/auto
          cp dist/presentacion-auto/index.html dist/presentacion-auto/recipe.json /tmp/video-to-deck-pages/presentacion/auto/
          # Never publish the raw transcript by default.
          cd /tmp/video-to-deck-pages
          git add presentacion/auto/index.html presentacion/auto/recipe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'pages: video-to-deck candidate'
          for i in 1 2 3 4 5; do
            if git push origin HEAD:gh-pages; then exit 0; fi
            git fetch origin gh-pages
            git rebase origin/gh-pages
          done
          exit 1
