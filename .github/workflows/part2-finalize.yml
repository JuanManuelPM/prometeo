name: Part 2 Finalize

on:
  push:
    branches: [candidate/part2-durable-metabolism-20260904]
    paths: ['.github/workflows/part2-finalize.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply durable closure
        run: python scripts/part2_finalize.py
      - name: Verify before commit
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/r1_candidate.test.mjs tests/runtime-ownership.test.mjs tests/platform-engines.test.mjs tests/part1-static.test.mjs tests/part1-contract.test.mjs tests/part1-runtime-services.test.mjs tests/part1-persistent-engines.test.mjs tests/part1-semantic-restore.test.mjs tests/part1-persistence-cas.test.mjs tests/part1-engine-invariants.test.mjs; do test -f "$f" && node "$f"; done
          for f in tests/part2-*.test.mjs; do node "$f"; done
          find shared -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python - <<'PY'
          import json,pathlib
          for p in pathlib.Path('.').rglob('*.json'):
              if '.git' not in p.parts:
                  with p.open(encoding='utf-8') as f: json.load(f)
          PY
          test ! -e .transport/part2
          test "$(git hash-object navigator/index.html)" = "7ca5f3e223ca843e3f9e4b7be1e53b5b65dd3418"
      - name: Commit final Part 2 closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Prometeo Candidate CI'
          git config user.email '72280945+JuanManuelPM@users.noreply.github.com'
          git add -A
          git commit -m 'Close Part 2 tested candidate and prepare adversarial audit'
          git push origin HEAD:${GITHUB_REF_NAME}
