name: Part 2 Materialize

on:
  push:
    branches:
      - candidate/part2-durable-metabolism-20260904
    paths:
      - '.transport/part2/**'
      - '.github/workflows/part2-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify transport payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .transport/part2/chunk-00.b64 \
            .transport/part2/chunk-01.b64 \
            .transport/part2/chunk-23.b64 \
            .transport/part2/chunk-45.b64 \
            | tr -d '\n\r\t ' \
            | base64 -d > /tmp/part2-payload.tar.xz
          echo '11528f5406ec8d93cb42c8bf3d98bf365fdf83b30bdfb3b9752f9219396432e2  /tmp/part2-payload.tar.xz' | sha256sum -c -
          tar -tJf /tmp/part2-payload.tar.xz >/tmp/part2-files.txt
          test "$(wc -l </tmp/part2-files.txt)" -ge 70
      - name: Materialize normal repository files
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/part2-payload.tar.xz -C .
          rm -rf .transport/part2
          rm -f .github/workflows/part2-materialize.yml
      - name: Run Part 1 regression suite
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            tests/r1_candidate.test.mjs \
            tests/runtime-ownership.test.mjs \
            tests/platform-engines.test.mjs \
            tests/part1-static.test.mjs \
            tests/part1-contract.test.mjs \
            tests/part1-runtime-services.test.mjs \
            tests/part1-persistent-engines.test.mjs \
            tests/part1-semantic-restore.test.mjs \
            tests/part1-persistence-cas.test.mjs \
            tests/part1-engine-invariants.test.mjs; do
              test -f "$f" && node "$f"
          done
      - name: Run complete Part 2 suite
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/part2-*.test.mjs; do node "$f"; done
      - name: Syntax and JSON validation
        shell: bash
        run: |
          set -euo pipefail
          find shared -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python - <<'PY'
          import json, pathlib
          for p in pathlib.Path('.').rglob('*.json'):
              if '.git' in p.parts:
                  continue
              with p.open(encoding='utf-8') as f:
                  json.load(f)
          print('JSON_PARSE_PASS')
          PY
      - name: Commit materialized Part 2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Prometeo Candidate CI'
          git config user.email '72280945+JuanManuelPM@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No materialized changes'; exit 1; }
          git commit -m 'Materialize Part 2 durable metabolism'
          git push origin HEAD:${GITHUB_REF_NAME}
