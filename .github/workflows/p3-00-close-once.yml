name: P3-00 Closure Once

on:
  push:
    branches: [candidate/part2-durable-metabolism-20260904]

permissions:
  contents: write

jobs:
  close:
    if: ${{ !contains(github.event.head_commit.message, '[P3-00-CLOSED]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Revalidate and close P3-00
        shell: bash
        run: |
          set -euo pipefail
          node tests/part3-p3-00-rehydrate.test.mjs
          node scripts/p3-00-close-once.mjs
      - name: Commit durable closure and remove one-shot helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Prometeo Gate Bot"
          git config user.email "72280945+JuanManuelPM@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "[P3-00-CLOSED] Rehydrate durable authority and open P3-01"
          git push origin HEAD:candidate/part2-durable-metabolism-20260904
