name: Universal Control V5 Candidate

on:
  push:
    branches:
      - candidate/universal-control-v5-backend-20260910
      - candidate/universal-control-v5-shadow-favorites-20260910
      - candidate/universal-control-v5-durable-favorites-20260910
      - candidate/universal-control-v5-single-host-release-20260910
    paths:
      - 'shared/universal-shell/v5/backend/**'
      - 'shared/universal-shell/v5/SINGLE_SHELL_HOST_CONTRACT_v1.json'
      - 'tests/universal-control-v5-*.mjs'
      - 'scripts/materialize-universal-control-v5-baseline.py'
      - 'scripts/build-universal-control-v5-favorites-facade.py'
      - 'scripts/build-universal-control-v5-backend-facades.py'
      - 'scripts/build-universal-control-v5-durable-favorites.py'
      - 'scripts/build-universal-control-v5-single-host.py'
      - 'scripts/package-universal-control-v5-release.py'
      - '.github/workflows/universal-control-v5-candidate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'shared/universal-shell/v5/backend/**'
      - 'shared/universal-shell/v5/SINGLE_SHELL_HOST_CONTRACT_v1.json'
      - 'tests/universal-control-v5-*.mjs'
      - 'scripts/materialize-universal-control-v5-baseline.py'
      - 'scripts/build-universal-control-v5-favorites-facade.py'
      - 'scripts/build-universal-control-v5-backend-facades.py'
      - 'scripts/build-universal-control-v5-durable-favorites.py'
      - 'scripts/build-universal-control-v5-single-host.py'
      - 'scripts/package-universal-control-v5-release.py'
      - '.github/workflows/universal-control-v5-candidate.yml'

permissions:
  contents: write

concurrency:
  group: universal-control-v5-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parity-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Node contract parity
        run: |
          node --test \
            tests/universal-control-v5-favorites-store.test.mjs \
            tests/universal-control-v5-backend-runtime.test.mjs \
            tests/universal-control-v5-durable-favorites.test.mjs \
            tests/universal-control-v5-single-shell-contract.test.mjs

      - name: Materialize exact Golden Master source
        run: python scripts/materialize-universal-control-v5-baseline.py

      - name: Build P1 Favorites facade candidate
        run: python scripts/build-universal-control-v5-favorites-facade.py

      - name: Build modular backend candidate
        run: python scripts/build-universal-control-v5-backend-facades.py

      - name: Build durable Favorites candidate
        run: python scripts/build-universal-control-v5-durable-favorites.py

      - name: Build re-draggable single-host candidate
        run: python scripts/build-universal-control-v5-single-host.py

      - name: Package deterministic release candidate
        run: python scripts/package-universal-control-v5-release.py

      - name: Verify candidate cannot mutate current Served runtime
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            index.html \
            shared/universal-shell/v5/chunk-1.b64 \
            shared/universal-shell/v5/chunk-2.b64 \
            shared/universal-shell/v5/chunk-3.b64 \
            shared/universal-shell/v5/chunk-4.b64 \
            shared/universal-shell/v5/chunk-5.b64 \
            shared/universal-shell/v5/CORNER_ANCHOR_v1.json
          test "$(sha256sum shared/universal-shell/v5/candidate/baseline-source.html | awk '{print $1}')" = '67965c4da9161737f06fcf6503d6b73db43eef574796977327c97f165e514d8a'
          grep -q 'PROMETEO_DB_CANONICAL_WITH_SYNC_RECOVERY' shared/universal-shell/v5/candidate/single-host-source.html
          grep -q 'suppressNextClosedClick=true' shared/universal-shell/v5/candidate/single-host-source.html
          grep -q 'puck.getBoundingClientRect()' shared/universal-shell/v5/candidate/single-host-source.html
          grep -q '__PROMETEO_UNIVERSAL_HOST__' shared/universal-shell/v5/candidate/single-host-source.html
          grep -q 'prometeo:nested-shell' shared/universal-shell/v5/candidate/single-host-source.html
          ! grep -q 'corner-snapping .puck{pointer-events:none}' shared/universal-shell/v5/candidate/single-host-source.html
          grep -q 'window.self!==window.top' shared/universal-shell/v5/release-candidate/index.html
          python -m json.tool shared/universal-shell/v5/release-candidate/manifest.json >/dev/null

      - name: Install browser canary dependency
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser parity — legacy, durable and single-host release
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/v5-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/shared/universal-shell/v5/candidate/baseline-source.html >/dev/null; then break; fi
            sleep .25
          done
          V5_CANDIDATE_PATH='shared/universal-shell/v5/candidate/favorites-facade-source.html' node tests/universal-control-v5-browser-parity.mjs
          V5_CANDIDATE_PATH='shared/universal-shell/v5/candidate/backend-facades-source.html' node tests/universal-control-v5-browser-parity.mjs
          V5_CANDIDATE_PATH='shared/universal-shell/v5/candidate/durable-favorites-source.html' node tests/universal-control-v5-browser-parity.mjs
          V5_CANDIDATE_PATH='shared/universal-shell/v5/candidate/single-host-source.html' node tests/universal-control-v5-browser-parity.mjs
          node tests/universal-control-v5-durable-browser.mjs
          node tests/universal-control-v5-single-host-browser.mjs

      - name: Persist candidate source snapshots
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            shared/universal-shell/v5/candidate/baseline-source.html \
            shared/universal-shell/v5/candidate/BASELINE_SOURCE_SHA256.txt \
            shared/universal-shell/v5/candidate/favorites-facade-source.html \
            shared/universal-shell/v5/candidate/FAVORITES_FACADE_SOURCE_SHA256.txt \
            shared/universal-shell/v5/candidate/backend-facades-source.html \
            shared/universal-shell/v5/candidate/BACKEND_FACADES_SOURCE_SHA256.txt \
            shared/universal-shell/v5/candidate/durable-favorites-source.html \
            shared/universal-shell/v5/candidate/DURABLE_FAVORITES_SOURCE_SHA256.txt \
            shared/universal-shell/v5/candidate/single-host-source.html \
            shared/universal-shell/v5/candidate/SINGLE_HOST_SOURCE_SHA256.txt \
            shared/universal-shell/v5/release-candidate
          if git diff --cached --quiet; then
            echo 'Candidate snapshots already persisted.'
            exit 0
          fi
          git commit -m 'shell: persist single-host V5 release candidate [skip ci]'
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
