name: P4 Finalize Source Patch

on:
  push:
    branches: [candidate/p4-anywhere-notes-ai-sessions-20260910]
    paths:
      - '.github/workflows/p4-finalize-source-patch.yml'
      - 'shared/capture/v1/change-loop.js'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/p4-anywhere-notes-ai-sessions-20260910
          fetch-depth: 0
      - name: Make immediate Work click wait for in-flight save
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('shared/capture/v1/change-loop.js')
          s=p.read_text()
          old="async function launch(kind){if(busy)return;busy=true;"
          new="async function launch(kind){if(busy){say('Terminando de guardar…');for(let i=0;i<50&&busy;i++)await sleep(100);if(busy){say('Todavía estoy guardando el audio');return}}busy=true;"
          if old in s:
              p.write_text(s.replace(old,new,1))
          elif new not in s:
              raise SystemExit('launch signature changed; refusing blind patch')
          PY
          node --check shared/capture/v1/change-loop.js
      - name: Commit source fix once
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shared/capture/v1/change-loop.js
          git commit -m 'P4: queue Work behind active note save'
          git pull --rebase origin candidate/p4-anywhere-notes-ai-sessions-20260910
          git push origin HEAD:candidate/p4-anywhere-notes-ai-sessions-20260910
