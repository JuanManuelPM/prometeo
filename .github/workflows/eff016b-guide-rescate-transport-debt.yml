name: EFF016B Guide Rescate Transport Debt

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-fast-allocator.mjs'
      - 'coordination/portfolio/tests/guide_rescate_no_allocation_signal_v1.mjs'
      - 'coordination/efficiency/RATCHET_BASELINE_V1.json'
      - '.github/workflows/eff016b-guide-rescate-transport-debt.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-fast-allocator.mjs'
      - 'coordination/portfolio/tests/guide_rescate_no_allocation_signal_v1.mjs'
      - 'coordination/efficiency/RATCHET_BASELINE_V1.json'
      - '.github/workflows/eff016b-guide-rescate-transport-debt.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eff016b-guide-rescate-transport-debt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check EFF016B behavior and static ratchet
        run: node coordination/portfolio/tests/guide_rescate_no_allocation_signal_v1.mjs
      - name: Check global efficiency ratchet
        run: node scripts/check-efficiency-ratchet.mjs .
