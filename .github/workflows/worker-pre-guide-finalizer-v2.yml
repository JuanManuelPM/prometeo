name: Worker PRE-GUIDE Finalizer v2

on:
  push:
    branches: [main]
    paths:
      - 'coordination/portfolio/evidence/portfolio-worker-pre-guide-finalizer-v2/**'
      - 'coordination/portfolio/evidence/portfolio-worker-pre-guide-critic-v2/**'
      - 'coordination/workers/POOL_PROD01_PROMPT.txt'
      - 'tests/worker-pre-guide-finalizer-v2.test.mjs'
      - '.github/workflows/worker-pre-guide-finalizer-v2.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          ref: 882b57abeab6a114247e093a3444a74dd236d62e
          path: site
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: node source/tests/worker-pre-guide-finalizer-v2.test.mjs site
