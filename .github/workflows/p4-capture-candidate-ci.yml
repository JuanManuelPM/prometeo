name: P4 Capture Candidate CI

on:
  push:
    branches:
      - 'candidate/p4-capture-integration-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p4-capture-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: P4 authority and preparation preflight
        run: node tests/p4-capture-preflight.test.mjs
      - name: Capture lifecycle, memory, Patent v2 and consecutive recorder tests
        run: node --test tests/p4-capture-core.test.mjs tests/p4-recorder-consecutive.test.mjs
      - name: Syntax-check Capture runtime modules
        run: |
          set -euo pipefail
          node --check shared/capture/v1/capture-core.js
          node --check shared/capture/v1/context-memory.js
          node --check shared/capture/v1/identity.js
          node --check shared/capture/v1/patent-v2.js
          node --check shared/capture/v1/recorder.js
          node --check shared/capture/v1/remote.js
          node --check shared/capture/v1/store.js
          node --check shared/capture/v1/v53-host.js
          node --check shared/capture/v1/canary-app.js
      - name: Clean-process reincarnation evidence
        run: node scripts/p3-00-rehydrate.mjs > /tmp/p4-wake.json
      - name: Fresh-process reincarnation regression
        run: node scripts/p3-02-fresh-agent-runner.mjs > /tmp/p4-fresh.json
      - name: Record current served-shell participation
        run: |
          set -euo pipefail
          git fetch origin gh-pages main
          git show origin/gh-pages:navigator/index.html > /tmp/served-nav.html
          grep -o 'prometeo-shell/v[0-9][^" ]*' /tmp/served-nav.html | sort -u > /tmp/served-shell-markers.txt || true
          echo 'served shell markers:'
          cat /tmp/served-shell-markers.txt || true
      - name: Validate single Capture publication owner
        run: |
          set -euo pipefail
          grep -q 'Publish Legacy Prometeo Capture Donors' .github/workflows/inject-prometeo-shell.yml
          ! grep -q 'data-prometeo-shell' .github/workflows/inject-prometeo-shell.yml
          ! grep -q 'inject every Pages HTML' .github/workflows/inject-prometeo-shell.yml
          test ! -f .github/workflows/inject-prometeo-shell-v3.yml
          test -f shared/capture/v1/MANIFEST.json
          node -e "const m=require('./shared/capture/v1/MANIFEST.json'); if(m.status!=='CANDIDATE_ONLY'||m.owners.human_intent!=='shared/capture/v1') process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: p4-preflight-evidence
          path: |
            /tmp/p4-wake.json
            /tmp/p4-fresh.json
            /tmp/served-nav.html
            /tmp/served-shell-markers.txt
      - name: Publish isolated P4 canary
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin gh-pages
          git worktree add /tmp/p4-pages origin/gh-pages
          target=/tmp/p4-pages/__canary/p4-capture
          rm -rf "$target"
          mkdir -p "$target/shared/capture/v1"
          cp -R shared/capture/v1/. "$target/shared/capture/v1/"
          cp shared/capture/v1/canary.html "$target/index.html"
          cd /tmp/p4-pages
          git add __canary/p4-capture
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'canary: publish P4 Capture candidate'
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
