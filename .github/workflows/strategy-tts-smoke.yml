name: Strategy TTS smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/strategy-tts-smoke.yml"
      - "strategy/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tts-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check strategy inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; import re; s=Path("strategy/index.html").read_text(); m=re.search(r"<script>(.*?)</script>",s,re.S); assert m; Path("/tmp/strategy.js").write_text(m.group(1))'
          node --check /tmp/strategy.js
          grep -q "TTS_MAX=500" strategy/index.html
          grep -q "FIRST_AUDIO_CHARS=220" strategy/index.html
          grep -q "AHEAD=5" strategy/index.html
          grep -q "WORKERS=2" strategy/index.html
          grep -q "prometeo-strategy-c-e1-v4" strategy/index.html
          grep -q "prometeo-c-e1-ironic-clone-v4" strategy/index.html
          grep -q 'id="messageTime"' strategy/index.html
          grep -q 'id="unheardDot"' strategy/index.html
          grep -q "prometeo-strategy-heard-v1" strategy/index.html
          grep -q "America/Argentina/Buenos_Aires" strategy/index.html
          if grep -q "prometeo-strategy-arg-v3" strategy/index.html; then exit 1; fi
          grep -q "prometeo-strategy-audio-v1" strategy/index.html
          grep -q 'id="toggleText"' strategy/index.html
          grep -q 'id="toggleThought"' strategy/index.html
          if grep -q "modelos-room-audio-v2" strategy/index.html; then exit 1; fi
          if grep -q "audio-lab-page-audio-v1" strategy/index.html; then exit 1; fi

      - name: Check square strategy widget
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; import re; s=Path("strategy/widget/index.html").read_text(); m=re.search(r"<script>(.*?)</script>",s,re.S); assert m; Path("/tmp/strategy-widget.js").write_text(m.group(1))'
          node --check /tmp/strategy-widget.js
          grep -q 'aspect-ratio:1' strategy/widget/index.html
          grep -q 'id="play"' strategy/widget/index.html
          grep -q 'id="dot"' strategy/widget/index.html
          grep -q 'id="time"' strategy/widget/index.html
          grep -q 'id="readerToggle"' strategy/widget/index.html
          grep -q 'id="readerLead"' strategy/widget/index.html
          grep -q 'id="readerSections"' strategy/widget/index.html
          grep -q "sectionRows('Qué cambió'" strategy/widget/index.html
          grep -q "sectionRows('Memoria'" strategy/widget/index.html
          grep -q "querySelectorAll('.acc.open')" strategy/widget/index.html
          grep -q "prometeo-strategy-heard-v1" strategy/widget/index.html
          grep -q "America/Argentina/Buenos_Aires" strategy/widget/index.html
          grep -q "prometeo-strategy-c-e1-v4" strategy/widget/index.html
          grep -q "prometeo-c-e1-ironic-clone-v4" strategy/widget/index.html
          grep -q "prometeo-strategy-audio-v1" strategy/widget/index.html

      - name: Check synchronized audio visualizer
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; import re; s=Path("strategy/audio-viz/index.html").read_text(); m=re.search(r"<script>(.*?)</script>",s,re.S); assert m; Path("/tmp/strategy-audio-viz.js").write_text(m.group(1))'
          node --check /tmp/strategy-audio-viz.js
          grep -q "prometeo_strategic_console_v2" strategy/audio-viz/index.html
          grep -q "prometeo-strategy-audio-v1" strategy/audio-viz/index.html
          grep -q "prometeo-c-e1-ironic-clone-v4" strategy/audio-viz/index.html
          grep -q 'id="meterBar"' strategy/audio-viz/index.html
          grep -q 'id="voiceState"' strategy/audio-viz/index.html
          grep -q 'id="wave"' strategy/audio-viz/index.html
          grep -q 'id="spectrum"' strategy/audio-viz/index.html
          grep -q 'id="avatar"' strategy/audio-viz/index.html
          grep -q 'createAnalyser' strategy/audio-viz/index.html

      - name: Check richer audio FX lab
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; import re; s=Path("strategy/audio-viz-fx/index.html").read_text(); m=re.search(r"<script>(.*?)</script>",s,re.S); assert m; Path("/tmp/strategy-audio-viz-fx.js").write_text(m.group(1))'
          node --check /tmp/strategy-audio-viz-fx.js
          grep -q "prometeo_strategic_console_v2" strategy/audio-viz-fx/index.html
          grep -q "prometeo-strategy-audio-v1" strategy/audio-viz-fx/index.html
          grep -q "prometeo-c-e1-ironic-clone-v4" strategy/audio-viz-fx/index.html
          grep -q 'id="mirror"' strategy/audio-viz-fx/index.html
          grep -q 'id="radial"' strategy/audio-viz-fx/index.html
          grep -q 'id="particles"' strategy/audio-viz-fx/index.html
          grep -q 'id="rings"' strategy/audio-viz-fx/index.html
          grep -q 'id="trail"' strategy/audio-viz-fx/index.html
          grep -q 'id="orb"' strategy/audio-viz-fx/index.html
          grep -q "createAnalyser" strategy/audio-viz-fx/index.html
          test -f strategy/audio-viz/audio-reactive-contract-v1.md
          grep -q "one audio analysis stream" strategy/audio-viz/audio-reactive-contract-v1.md

      - name: Check hand drawn audio lab
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; import re; s=Path("strategy/audio-viz-hand/index.html").read_text(); m=re.search(r"<script>(.*?)</script>",s,re.S); assert m; Path("/tmp/strategy-audio-viz-hand.js").write_text(m.group(1))'
          node --check /tmp/strategy-audio-viz-hand.js
          grep -q "prometeo_strategic_console_v2" strategy/audio-viz-hand/index.html
          grep -q "prometeo-strategy-audio-v1" strategy/audio-viz-hand/index.html
          grep -q "prometeo-c-e1-ironic-clone-v4" strategy/audio-viz-hand/index.html
          grep -q 'id="boilWave"' strategy/audio-viz-hand/index.html
          grep -q 'id="inkSpectrum"' strategy/audio-viz-hand/index.html
          grep -q 'id="halo"' strategy/audio-viz-hand/index.html
          grep -q 'id="ribbon"' strategy/audio-viz-hand/index.html
          grep -q 'id="swarm"' strategy/audio-viz-hand/index.html
          grep -q 'id="contour"' strategy/audio-viz-hand/index.html
          grep -q "BOIL_MS=125" strategy/audio-viz-hand/index.html
          test -f strategy/audio-viz/hand-drawn-recipe-v1.md
          grep -q "posterized at ~8 fps" strategy/audio-viz/hand-drawn-recipe-v1.md

      - name: Check reactive mask mouth lab
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; import re; s=Path("strategy/mask-mouth/index.html").read_text(); m=re.search(r"<script>(.*?)</script>",s,re.S); assert m; Path("/tmp/strategy-mask-mouth.js").write_text(m.group(1))'
          node --check /tmp/strategy-mask-mouth.js
          grep -q "prometeo_strategic_console_v2" strategy/mask-mouth/index.html
          grep -q "prometeo-strategy-audio-v1" strategy/mask-mouth/index.html
          grep -q "prometeo-c-e1-ironic-clone-v4" strategy/mask-mouth/index.html
          grep -q 'id="mouth1"' strategy/mask-mouth/index.html
          grep -q 'id="mouth2"' strategy/mask-mouth/index.html
          grep -q 'id="mouth3"' strategy/mask-mouth/index.html
          grep -q 'id="mouth4"' strategy/mask-mouth/index.html
          grep -q 'id="mouth5"' strategy/mask-mouth/index.html
          grep -q 'id="mouth6"' strategy/mask-mouth/index.html
          grep -q "data:image/jpeg;base64" strategy/mask-mouth/index.html
          grep -q "BOIL_MS=125" strategy/mask-mouth/index.html

      - name: Generate fixed-voice audio and recover it from cache
        shell: bash
        run: |
          set -euo pipefail
          API="https://catnohyouxqjjtseaueb.supabase.co/functions/v1/prometeo-strategy-audio-v1"
          ID="strategy-fixed-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TEXT="Prometeo mantiene una voz argentina clara, firme y rápida, sin risas ni acento extranjero."
          payload="$(jq -nc --arg id "$ID" --arg text "$TEXT" '{messageId:$id,text:$text}')"

          code="$(curl --retry 2 --retry-delay 4 --max-time 300 -sS -D post.headers -o post.audio -w '%{http_code}' -H 'content-type: application/json' --data "$payload" "$API")"

          POST_CACHE="$(awk 'BEGIN{IGNORECASE=1}/^x-prometeo-cache:/{gsub("\r","");print $2}' post.headers | tail -1)"
          POST_VOICE="$(awk 'BEGIN{IGNORECASE=1}/^x-prometeo-voice:/{gsub("\r","");print $2}' post.headers | tail -1)"
          POST_BYTES="$(wc -c < post.audio)"
          echo "POST diagnostic http=$code cache=${POST_CACHE:-none} voice=${POST_VOICE:-none} bytes=$POST_BYTES"
          if [ "$code" != "200" ]; then
            echo "POST body:"
            head -c 1200 post.audio || true
            echo
          fi
          test "$code" = "200"
          case "$POST_CACHE" in MISS|MISS_UNSTORED) ;; *) exit 1 ;; esac
          test "$POST_VOICE" = "prometeo-c-e1-ironic-clone-v4"
          test "$POST_BYTES" -gt 1000

          python3 -c 'from pathlib import Path; b=Path("post.audio").read_bytes(); ok=b[:4] in (b"RIFF",b"OggS",b"fLaC") or b[:3]==b"ID3" or (len(b)>2 and b[0]==0xff and (b[1]&0xe0)==0xe0); assert len(b)>1000 and ok, repr(b[:12]); print("audio_signature_ok",b[:12].hex())'

          echo "POST http=$code cache=$POST_CACHE voice=$POST_VOICE bytes=$POST_BYTES"
          if [ "$POST_CACHE" = "MISS" ]; then
            get_code="$(curl --retry 2 --retry-delay 2 --max-time 60 -sS -D get.headers -o get.audio -w '%{http_code}' "$API?id=$ID")"
            test "$get_code" = "200"
            GET_CACHE="$(awk 'BEGIN{IGNORECASE=1}/^x-prometeo-cache:/{gsub("\r","");print $2}' get.headers | tail -1)"
            GET_VOICE="$(awk 'BEGIN{IGNORECASE=1}/^x-prometeo-voice:/{gsub("\r","");print $2}' get.headers | tail -1)"
            test "$GET_CACHE" = "HIT"
            test "$GET_VOICE" = "prometeo-c-e1-ironic-clone-v4"
            cmp post.audio get.audio
            echo "GET  http=$get_code cache=$GET_CACHE voice=$GET_VOICE bytes=$(wc -c < get.audio)"
            echo "AUDIO sha256=$(sha256sum get.audio | awk '{print $1}')"
          else
            echo "CACHE degraded: audio is valid but DB store was unavailable"
            echo "AUDIO sha256=$(sha256sum post.audio | awk '{print $1}')"
          fi

      - name: Verify two-chunk E1 identity
        shell: bash
        run: |
          set -euo pipefail
          API="https://catnohyouxqjjtseaueb.supabase.co/functions/v1/prometeo-strategy-audio-v1"
          check_chunk() {
            local id="$1" text="$2" headers audio code voice bytes cache payload
            headers="/tmp/$id.headers"
            audio="/tmp/$id.audio"
            code="$(curl --retry 2 --retry-delay 2 --max-time 60 -sS -D "$headers" -o "$audio" -w '%{http_code}' "$API?id=$id")"
            if [ "$code" = "404" ]; then
              payload="$(jq -nc --arg id "$id" --arg text "$text" '{messageId:$id,text:$text}')"
              code="$(curl --retry 2 --retry-delay 4 --max-time 300 -sS -D "$headers" -o "$audio" -w '%{http_code}' -H 'content-type: application/json' --data "$payload" "$API")"
            fi
            voice="$(grep -i '^x-prometeo-voice:' "$headers" | tail -1 | tr -d '\r' | cut -d' ' -f2)"
            cache="$(grep -i '^x-prometeo-cache:' "$headers" | tail -1 | tr -d '\r' | cut -d' ' -f2)"
            bytes="$(wc -c < "$audio")"
            echo "MULTI id=$id http=$code cache=$cache voice=$voice bytes=$bytes"
            test "$code" = "200"
            test "$voice" = "prometeo-c-e1-ironic-clone-v4"
            test "$bytes" -gt 1000
            python3 -c 'import sys; from pathlib import Path; b=Path(sys.argv[1]).read_bytes(); ok=b[:4] in (b"RIFF",b"OggS",b"fLaC") or b[:3]==b"ID3" or (len(b)>2 and b[0]==0xff and (b[1]&0xe0)==0xe0); assert len(b)>1000 and ok, repr(b[:12])' "$audio"
          }
          check_chunk "strategy-e1-multichunk-v1-1" "Prometeo ya separó el problema en partes concretas; primero conserva lo que funciona y después mueve sólo la pieza que bloquea el avance."
          check_chunk "strategy-e1-multichunk-v1-2" "La segunda parte mantiene exactamente la misma identidad vocal, mientras cambia únicamente el contenido y la prosodia necesaria para continuar la lectura."
          echo "MULTI identity=prometeo-c-e1-ironic-clone-v4 chunks=2"

      - name: Verify published strategy page
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 18); do
            URL="https://juanmanuelpm.github.io/prometeo/strategy/?verify=${GITHUB_RUN_ID}-${n}-$(date +%s)"
            code="$(curl --max-time 60 -sS -L -o /tmp/strategy-public.html -w '%{http_code}' "$URL" || true)"
            if [ "$code" = "200" ] \
              && grep -q "TTS_MAX=500" /tmp/strategy-public.html \
              && grep -q "FIRST_AUDIO_CHARS=220" /tmp/strategy-public.html \
              && grep -q "AHEAD=5" /tmp/strategy-public.html \
              && grep -q "WORKERS=2" /tmp/strategy-public.html \
              && grep -q "prometeo-strategy-c-e1-v4" /tmp/strategy-public.html \
              && grep -q "prometeo-c-e1-ironic-clone-v4" /tmp/strategy-public.html \
              && grep -q 'id="messageTime"' /tmp/strategy-public.html \
              && grep -q 'id="unheardDot"' /tmp/strategy-public.html \
              && grep -q "prometeo-strategy-heard-v1" /tmp/strategy-public.html \
              && grep -q "America/Argentina/Buenos_Aires" /tmp/strategy-public.html \
              && ! grep -q "prometeo-strategy-arg-v3" /tmp/strategy-public.html \
              && grep -q "prometeo-strategy-audio-v1" /tmp/strategy-public.html \
              && grep -q 'id="toggleText"' /tmp/strategy-public.html \
              && grep -q 'id="toggleThought"' /tmp/strategy-public.html \
              && ! grep -q "modelos-room-audio-v2" /tmp/strategy-public.html \
              && ! grep -q "audio-lab-page-audio-v1" /tmp/strategy-public.html; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
          echo "PUBLIC http=200 bytes=$(wc -c < /tmp/strategy-public.html) tts=prometeo-strategy-audio-v1 ui=minimal"

      - name: Verify published square widget
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 18); do
            URL="https://juanmanuelpm.github.io/prometeo/strategy/widget/?verify=${GITHUB_RUN_ID}-${n}-$(date +%s)"
            code="$(curl --max-time 60 -sS -L -o /tmp/strategy-widget-public.html -w '%{http_code}' "$URL" || true)"
            if [ "$code" = "200" ] \
              && grep -q 'aspect-ratio:1' /tmp/strategy-widget-public.html \
              && grep -q 'id="play"' /tmp/strategy-widget-public.html \
              && grep -q 'id="dot"' /tmp/strategy-widget-public.html \
              && grep -q 'id="time"' /tmp/strategy-widget-public.html \
              && grep -q 'id="readerToggle"' /tmp/strategy-widget-public.html \
              && grep -q 'id="readerLead"' /tmp/strategy-widget-public.html \
              && grep -q 'id="readerSections"' /tmp/strategy-widget-public.html \
              && grep -q "sectionRows('Qué cambió'" /tmp/strategy-widget-public.html \
              && grep -q "sectionRows('Memoria'" /tmp/strategy-widget-public.html \
              && grep -q "querySelectorAll('.acc.open')" /tmp/strategy-widget-public.html \
              && grep -q "prometeo-strategy-heard-v1" /tmp/strategy-widget-public.html \
              && grep -q "America/Argentina/Buenos_Aires" /tmp/strategy-widget-public.html \
              && grep -q "prometeo-strategy-c-e1-v4" /tmp/strategy-widget-public.html \
              && grep -q "prometeo-c-e1-ironic-clone-v4" /tmp/strategy-widget-public.html \
              && grep -q "prometeo-strategy-audio-v1" /tmp/strategy-widget-public.html; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
          echo "WIDGET http=200 bytes=$(wc -c < /tmp/strategy-widget-public.html) square=1 unread=shared voice=E1"

      - name: Verify published audio visualizer
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 18); do
            URL="https://juanmanuelpm.github.io/prometeo/strategy/audio-viz/?verify=${GITHUB_RUN_ID}-${n}-$(date +%s)"
            code="$(curl --max-time 60 -sS -L -o /tmp/strategy-audio-viz-public.html -w '%{http_code}' "$URL" || true)"
            if [ "$code" = "200" ] \
              && grep -q "prometeo_strategic_console_v2" /tmp/strategy-audio-viz-public.html \
              && grep -q "prometeo-strategy-audio-v1" /tmp/strategy-audio-viz-public.html \
              && grep -q "prometeo-c-e1-ironic-clone-v4" /tmp/strategy-audio-viz-public.html \
              && grep -q 'id="meterBar"' /tmp/strategy-audio-viz-public.html \
              && grep -q 'id="voiceState"' /tmp/strategy-audio-viz-public.html \
              && grep -q 'id="wave"' /tmp/strategy-audio-viz-public.html \
              && grep -q 'id="spectrum"' /tmp/strategy-audio-viz-public.html \
              && grep -q 'id="avatar"' /tmp/strategy-audio-viz-public.html \
              && grep -q 'createAnalyser' /tmp/strategy-audio-viz-public.html; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
          echo "AUDIO_VIZ http=200 synchronized=1 modules=6 voice=E1"

      - name: Verify published richer audio FX lab
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 18); do
            URL="https://juanmanuelpm.github.io/prometeo/strategy/audio-viz-fx/?verify=${GITHUB_RUN_ID}-${n}-$(date +%s)"
            code="$(curl --max-time 60 -sS -L -o /tmp/strategy-audio-viz-fx-public.html -w '%{http_code}' "$URL" || true)"
            if [ "$code" = "200" ] \
              && grep -q "prometeo_strategic_console_v2" /tmp/strategy-audio-viz-fx-public.html \
              && grep -q "prometeo-strategy-audio-v1" /tmp/strategy-audio-viz-fx-public.html \
              && grep -q "prometeo-c-e1-ironic-clone-v4" /tmp/strategy-audio-viz-fx-public.html \
              && grep -q 'id="mirror"' /tmp/strategy-audio-viz-fx-public.html \
              && grep -q 'id="radial"' /tmp/strategy-audio-viz-fx-public.html \
              && grep -q 'id="particles"' /tmp/strategy-audio-viz-fx-public.html \
              && grep -q 'id="rings"' /tmp/strategy-audio-viz-fx-public.html \
              && grep -q 'id="trail"' /tmp/strategy-audio-viz-fx-public.html \
              && grep -q 'id="orb"' /tmp/strategy-audio-viz-fx-public.html \
              && grep -q "createAnalyser" /tmp/strategy-audio-viz-fx-public.html; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
          echo "AUDIO_VIZ_FX http=200 synchronized=1 modules=6 voice=E1"

      - name: Verify published hand drawn audio lab
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 18); do
            URL="https://juanmanuelpm.github.io/prometeo/strategy/audio-viz-hand/?verify=${GITHUB_RUN_ID}-${n}-$(date +%s)"
            code="$(curl --max-time 60 -sS -L -o /tmp/strategy-audio-viz-hand-public.html -w '%{http_code}' "$URL" || true)"
            if [ "$code" = "200" ] \
              && grep -q "prometeo_strategic_console_v2" /tmp/strategy-audio-viz-hand-public.html \
              && grep -q "prometeo-strategy-audio-v1" /tmp/strategy-audio-viz-hand-public.html \
              && grep -q "prometeo-c-e1-ironic-clone-v4" /tmp/strategy-audio-viz-hand-public.html \
              && grep -q 'id="boilWave"' /tmp/strategy-audio-viz-hand-public.html \
              && grep -q 'id="inkSpectrum"' /tmp/strategy-audio-viz-hand-public.html \
              && grep -q 'id="halo"' /tmp/strategy-audio-viz-hand-public.html \
              && grep -q 'id="ribbon"' /tmp/strategy-audio-viz-hand-public.html \
              && grep -q 'id="swarm"' /tmp/strategy-audio-viz-hand-public.html \
              && grep -q 'id="contour"' /tmp/strategy-audio-viz-hand-public.html \
              && grep -q "BOIL_MS=125" /tmp/strategy-audio-viz-hand-public.html; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
          echo "AUDIO_VIZ_HAND http=200 line_boil=8fps modules=6 voice=E1"

      - name: Verify published reactive mask mouth lab
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 18); do
            URL="https://juanmanuelpm.github.io/prometeo/strategy/mask-mouth/?verify=${GITHUB_RUN_ID}-${n}-$(date +%s)"
            code="$(curl --max-time 60 -sS -L -o /tmp/strategy-mask-mouth-public.html -w '%{http_code}' "$URL" || true)"
            if [ "$code" = "200" ] \
              && grep -q "prometeo_strategic_console_v2" /tmp/strategy-mask-mouth-public.html \
              && grep -q "prometeo-strategy-audio-v1" /tmp/strategy-mask-mouth-public.html \
              && grep -q "prometeo-c-e1-ironic-clone-v4" /tmp/strategy-mask-mouth-public.html \
              && grep -q 'id="mouth1"' /tmp/strategy-mask-mouth-public.html \
              && grep -q 'id="mouth6"' /tmp/strategy-mask-mouth-public.html \
              && grep -q "data:image/jpeg;base64" /tmp/strategy-mask-mouth-public.html \
              && grep -q "BOIL_MS=125" /tmp/strategy-mask-mouth-public.html; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
          echo "MASK_MOUTH http=200 mouths=6 source=user-mask voice=E1"
