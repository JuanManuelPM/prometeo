name: Primary Chat approval replay UI wiring v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-primary-chat-approval-replay-ui-wiring-v1.mjs'
      - 'coordination/portfolio/tests/primary_chat_approval_current_v1.mjs'
      - 'coordination/portfolio/tests/primary_chat_approval_replay_ui_wiring_v1.mjs'
      - '.github/workflows/primary-chat-approval-replay-ui-wiring-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: primary-chat-approval-replay-ui-wiring-v1
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch existing owners
        run: node scripts/patch-primary-chat-approval-replay-ui-wiring-v1.mjs
      - name: Existing approval regression
        run: node coordination/portfolio/tests/primary_chat_approval_current_v1.mjs
      - name: Replay + UI wiring regression
        run: node coordination/portfolio/tests/primary_chat_approval_replay_ui_wiring_v1.mjs
      - name: Commit owner wiring when changed
        run: |
          if git diff --quiet -- current-tree/control-v11/ingress-v1.js current-tree/control-v11/chat-canary/index.html supabase/functions/prometeo-change-loop-v1/index.ts; then
            echo 'Approval replay/UI wiring already present.'
            exit 0
          fi
          git config user.name 'prometeo-ci'
          git config user.email '72280945+JuanManuelPM@users.noreply.github.com'
          git add current-tree/control-v11/ingress-v1.js current-tree/control-v11/chat-canary/index.html supabase/functions/prometeo-change-loop-v1/index.ts
          git commit -m 'primary-chat: wire server approval replay and visible control'
          git pull --rebase origin main
          git push origin HEAD:main
