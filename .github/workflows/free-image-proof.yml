name: Free AI Horde scene proof
on:
  push:
    branches: [candidate/free-image-horde-proof-20261116]
    paths: [.github/workflows/free-image-proof.yml]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Generate both scenes on free AI Horde
        run: |
          python -m pip install --quiet requests pillow
          python - <<'PY'
          import io, json, time, requests
          from pathlib import Path
          from PIL import Image
          root=Path('experiments/free-image-horde-20261116')
          root.mkdir(parents=True,exist_ok=True)
          base='https://aihorde.net/api/v2'
          headers={'apikey':'0000000000','Client-Agent':'PrometeoFreeImageProof:1.0:https://github.com/JuanManuelPM/prometeo'}
          room='Cinematic retro PS1 video game still, art-directed tiny apartment living room, olive-green fabric sofa along back wall, amber standing lamp left, wooden CRT television right, peeling wallpaper, navy night window, controlled ochre green brown palette, low-poly models with beautifully handpainted pixel textures, strong composition, coherent architecture, no primitive-shape collage, moody cinematic lighting'
          prompts=[
          'Wide establishing shot of the empty lived-in room, camera front left at eye level, elegant environment design. '+room,
          'A young character in burgundy jacket sits on the green sofa arguing with a standing friend in faded cream sweater, clear opposing body gestures, over-the-shoulder medium shot. '+room]
          report={'engine':'AI Horde anonymous free API','images':[],'started_utc':time.time()}
          (root/'director_notes.md').write_text('# Free AI Horde proof\n\nScene 1: a coherent PS1 living room, olive sofa, left amber lamp, right CRT.\n\nScene 2: two characters arguing in the room, closer camera.\n\nText-only image generation does not guarantee identical geometry.\n\n'+ '\n\n'.join(prompts),encoding='utf-8')
          def save(): (root/'status.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8')
          save()
          for idx,prompt in enumerate(prompts,1):
           e={'scene':idx,'prompt':prompt,'state':'submitting'}
           report['images'].append(e);save()
           try:
            payload={'prompt':prompt+'###floating props, primitive collage, ugly untextured shapes, grotesque limbs, watermark, text, incoherent room', 'params':{'width':512,'height':512,'steps':20,'n':1,'sampler_name':'k_euler_a','cfg_scale':7},'nsfw':False,'censor_nsfw':True,'r2':True,'shared':True}
            response=requests.post(base+'/generate/async',json=payload,headers=headers,timeout=35);response.raise_for_status()
            job=response.json()['id'];e.update(state='queued',request_id=job);save()
            for attempt in range(52):
             time.sleep(6)
             check=requests.get(base+'/generate/check/'+job,timeout=25).json()
             e.update(state='waiting',queue_position=check.get('queue_position'),wait_time=check.get('wait_time'));save()
             if check.get('faulted'): raise RuntimeError('worker faulted')
             if check.get('done'):
              full=requests.get(base+'/generate/status/'+job,timeout=35).json()
              gen=(full.get('generations') or [])[0]
              source=gen['img']
              if source.startswith('http'):
               r=requests.get(source,timeout=45);r.raise_for_status();raw=r.content
              else:
               import base64
               raw=base64.b64decode(source.split(',')[-1])
              image=Image.open(io.BytesIO(raw)).convert('RGB')
              path=root/f'scene_{idx:02}.webp';image.save(path,'WEBP',quality=90)
              e.update(state='completed',image_file=str(path),model=gen.get('model'),seed=gen.get('seed'),width=image.width,height=image.height);save()
              print('SUCCESS SCENE',idx,flush=True)
              break
            else: e.update(state='timeout',error='No result in 312 seconds');save()
           except Exception as ex: e.update(state='failed',error=repr(ex));save();print('FAILED SCENE',idx,repr(ex),flush=True)
          report['finished_utc']=time.time();save()
          print('RESULTS',[(e['scene'],e['state']) for e in report['images']],flush=True)
          PY
      - name: Persist scene evidence
        if: always()
        run: |
          git config user.name "prometeo-proof-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/free-image-horde-20261116
          git diff --cached --quiet || git commit -m "Record free AI Horde scene generation proof"
          git push origin HEAD:candidate/free-image-horde-proof-20261116
