name: Launch Packet generic v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/check-launch-packet-v1.mjs"
      - "scripts/build-launch-packets.mjs"
      - "coordination/launch-packets/**/PACKET.json"
      - "tests/launch-packet-generic-v1.test.mjs"
      - ".github/workflows/launch-packet-generic-v1.yml"

permissions:
  contents: read

concurrency:
  group: launch-packet-generic-v1
  cancel-in-progress: true

jobs:
  generic-launch-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate generic and legacy packets
        run: node tests/launch-packet-generic-v1.test.mjs
