name: Chat message mirror contract harness v1

on:
  push:
    branches: [main]
    paths:
      - 'coordination/portfolio/tests/chat_message_mirror_contract_harness_v1.mjs'
      - 'coordination/portfolio/tests/primary_chat_mirror_atomic_append_v1.mjs'
      - 'coordination/portfolio/fixtures/chat_message_mirror_contract_harness_v1.json'
      - 'coordination/portfolio/derived/prometeo-autonomous-growth/CHAT_MESSAGE_MIRROR_CANARY_V1.json'
      - 'coordination/portfolio/evidence/prometeo-autonomous-growth/CHAT_THREAD_MIRROR_CANARY_V1.json'
      - 'coordination/portfolio/returns/portfolio-primary-chat-canary-*/RETURN-*.json'
      - 'scripts/reconcile-primary-chat-returns.mjs'
      - 'scripts/lib/primary-chat-mirror-merge.mjs'
      - 'current-tree/control-v11/chat-canary/index.html'
      - 'current-tree/control-v11/chat-canary/progress-v1.js'
      - '.github/workflows/chat-message-mirror-contract-harness-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chat-message-mirror-contract-harness-v1
  cancel-in-progress: true

jobs:
  contract-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile canonical Primary Chat returns
        run: |
          set -euo pipefail
          node scripts/reconcile-primary-chat-returns.mjs

      - name: Run atomic mirror merge semantics test
        run: |
          set -euo pipefail
          mkdir -p artifacts/chat-message-mirror-contract-harness
          node coordination/portfolio/tests/primary_chat_mirror_atomic_append_v1.mjs \
            > artifacts/chat-message-mirror-contract-harness/atomic-merge.json
          cat artifacts/chat-message-mirror-contract-harness/atomic-merge.json

      - name: Prepare gh-pages checkout
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add /tmp/prometeo-gh-pages refs/remotes/origin/gh-pages

      - name: Stage sanitized Primary Chat projection
        run: |
          set -euo pipefail
          thread_rel='coordination/portfolio/evidence/prometeo-autonomous-growth/CHAT_THREAD_MIRROR_CANARY_V1.json'
          page_rel='current-tree/control-v11/chat-canary/index.html'
          progress_rel='current-tree/control-v11/chat-canary/progress-v1.js'
          mkdir -p "/tmp/prometeo-gh-pages/$(dirname "$thread_rel")" "/tmp/prometeo-gh-pages/$(dirname "$page_rel")" "/tmp/prometeo-gh-pages/$(dirname "$progress_rel")"
          cp "$thread_rel" "/tmp/prometeo-gh-pages/$thread_rel"
          cp "$page_rel" "/tmp/prometeo-gh-pages/$page_rel"
          cp "$progress_rel" "/tmp/prometeo-gh-pages/$progress_rel"

      - name: Run deterministic contract harness
        id: harness
        run: |
          mkdir -p artifacts/chat-message-mirror-contract-harness
          node coordination/portfolio/tests/chat_message_mirror_contract_harness_v1.mjs \
            --repo-root . \
            --pages-root /tmp/prometeo-gh-pages \
            --json \
            > artifacts/chat-message-mirror-contract-harness/evidence.json
          cat artifacts/chat-message-mirror-contract-harness/evidence.json

      - name: Publish validated Primary Chat projection
        if: steps.harness.outcome == 'success'
        run: |
          set -euo pipefail
          thread_rel='coordination/portfolio/evidence/prometeo-autonomous-growth/CHAT_THREAD_MIRROR_CANARY_V1.json'
          page_rel='current-tree/control-v11/chat-canary/index.html'
          progress_rel='current-tree/control-v11/chat-canary/progress-v1.js'
          source_thread="$GITHUB_WORKSPACE/$thread_rel"
          source_page="$GITHUB_WORKSPACE/$page_rel"
          source_progress="$GITHUB_WORKSPACE/$progress_rel"
          cd /tmp/prometeo-gh-pages
          git config user.name "prometeo-ci"
          git config user.email "actions@users.noreply.github.com"
          for n in 1 2 3 4; do
            git fetch origin \
              main:refs/remotes/origin/main \
              gh-pages:refs/remotes/origin/gh-pages
            git show "origin/main:$thread_rel" > /tmp/prometeo-origin-main-thread.json
            git show "origin/main:$progress_rel" > /tmp/prometeo-origin-main-progress-v1.js
            if ! cmp -s "$source_thread" /tmp/prometeo-origin-main-thread.json; then
              echo "Main Primary Chat projection advanced; defer gh-pages publication to the newer workflow run."
              exit 0
            fi
            if ! cmp -s "$source_progress" /tmp/prometeo-origin-main-progress-v1.js; then
              echo "Main Primary Chat progress asset advanced; defer gh-pages publication to the newer workflow run."
              exit 0
            fi
            git reset --hard origin/gh-pages
            mkdir -p "$(dirname "$thread_rel")" "$(dirname "$page_rel")" "$(dirname "$progress_rel")"
            cp "$source_thread" "$thread_rel"
            cp "$source_page" "$page_rel"
            cp "$source_progress" "$progress_rel"
            git add "$thread_rel" "$page_rel" "$progress_rel"
            if git diff --cached --quiet; then
              echo "Primary Chat projection already current."
              exit 0
            fi
            git commit -m "chat: publish validated Primary Chat projection"
            if git push origin HEAD:gh-pages; then
              exit 0
            fi
            echo "gh-pages moved during publish attempt $n; reconciling from latest branch head."
          done
          exit 1

      - name: Persist machine-readable run evidence
        if: always()
        env:
          HARNESS_OUTCOME: ${{ steps.harness.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p coordination/portfolio/evidence/prometeo-autonomous-growth
          cp artifacts/chat-message-mirror-contract-harness/evidence.json /tmp/chat-mirror-contract-evidence.json 2>/dev/null || true
          cp artifacts/chat-message-mirror-contract-harness/atomic-merge.json /tmp/chat-mirror-atomic-evidence.json 2>/dev/null || true
          cat > /tmp/persist-chat-mirror-run-evidence.mjs <<'NODE'
          import fs from 'node:fs';
          const contractSrc='/tmp/chat-mirror-contract-evidence.json';
          const atomicSrc='/tmp/chat-mirror-atomic-evidence.json';
          const evidence=fs.existsSync(contractSrc)
            ? JSON.parse(fs.readFileSync(contractSrc,'utf8'))
            : {
                schema:'prometeo.chat-message-mirror-contract-harness-result/v1',
                overall:'NO_EVIDENCE_FILE',
                details:{terminal:{error:'runner did not produce evidence.json'}}
              };
          evidence.atomic_merge=fs.existsSync(atomicSrc)
            ? JSON.parse(fs.readFileSync(atomicSrc,'utf8'))
            : {overall:'NO_EVIDENCE_FILE'};
          evidence.ci={
            run_id:process.env.RUN_ID,
            run_attempt:process.env.RUN_ATTEMPT,
            head_sha:process.env.HEAD_SHA,
            harness_step_outcome:process.env.HARNESS_OUTCOME,
            run_url:`${process.env.SERVER_URL}/${process.env.REPOSITORY}/actions/runs/${process.env.RUN_ID}`
          };
          const dest=`coordination/portfolio/evidence/prometeo-autonomous-growth/CHAT_MESSAGE_MIRROR_CONTRACT_HARNESS_RUN_${process.env.RUN_ID}.json`;
          fs.writeFileSync(dest,JSON.stringify(evidence,null,2)+'\n');
          console.log(dest);
          NODE
          thread_rel='coordination/portfolio/evidence/prometeo-autonomous-growth/CHAT_THREAD_MIRROR_CANARY_V1.json'
          evidence_rel="coordination/portfolio/evidence/prometeo-autonomous-growth/CHAT_MESSAGE_MIRROR_CONTRACT_HARNESS_RUN_${RUN_ID}.json"
          git config user.name "prometeo-ci"
          git config user.email "actions@users.noreply.github.com"
          for n in 1 2 3 4; do
            git fetch origin main:refs/remotes/origin/main
            git reset --hard origin/main
            node scripts/reconcile-primary-chat-returns.mjs
            node coordination/portfolio/tests/primary_chat_mirror_atomic_append_v1.mjs > /tmp/chat-mirror-atomic-latest.json
            node /tmp/persist-chat-mirror-run-evidence.mjs
            git add "$thread_rel" "$evidence_rel"
            if git diff --cached --quiet; then
              echo "Primary Chat main projection/evidence already current."
              exit 0
            fi
            git commit -m "chat canary: persist contract harness CI run ${RUN_ID}"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved during persist attempt $n; discarding stale derived bytes and reconciling again from latest origin/main."
          done
          exit 1
