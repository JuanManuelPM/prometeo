name: Part 3 Macro P3-04 to P3-12

on:
  push:
    branches: [candidate/prometeo-final-20260904]
    paths:
      - 'tests/part3-p3-00-rehydrate.test.mjs'
      - 'tests/part3-p3-04-12-static.test.mjs'
      - 'scripts/p3-macro-*.mjs'
      - 'scripts/p3-macro-*.sh'
      - '.github/workflows/part3-macro-preaccept-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macro-preaccept:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regress Part 1 Part 2 and completed P3 frontier
        run: |
          set -euo pipefail
          for f in tests/part1-*.test.mjs tests/part2-*.test.mjs; do node "$f"; done
          node tests/r1_candidate.test.mjs
          node tests/runtime-ownership.test.mjs
          node tests/platform-engines.test.mjs
          node tests/part3-p3-00-rehydrate.test.mjs
          node tests/part3-p3-01-closure.test.mjs
          node tests/part3-p3-02-closure.test.mjs
          node tests/part3-p3-03-closure.test.mjs
          node tests/part3-p3-03-hop-continuity.test.mjs
      - name: P3-04 to P3-12 static mutation architecture and identity
        run: node tests/part3-p3-04-12-static.test.mjs
      - name: Install pinned browser runner
        run: |
          npm install --global agent-browser@0.34.0
          agent-browser install --with-deps
          agent-browser doctor --offline --quick
      - name: Responsive accessibility navigation products and performance browser matrix
        run: |
          chmod +x scripts/p3-macro-browser-clean.sh
          P3_ARTIFACT_DIR=artifacts/p3-macro scripts/p3-macro-browser-clean.sh
      - name: Compile 500-checkpoint grouped audit and candidate identity
        run: P3_ARTIFACT_DIR=artifacts/p3-macro node scripts/p3-macro-report.mjs
      - name: Verify candidate source invariants
        run: |
          test "$(git hash-object navigator/index.html)" = "7ca5f3e223ca843e3f9e4b7be1e53b5b65dd3418"
          git diff --check
      - name: Upload macro evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-macro-preaccept-${{ github.sha }}
          path: artifacts/p3-macro/
          if-no-files-found: error
          retention-days: 30
