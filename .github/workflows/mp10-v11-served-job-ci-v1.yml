name: MP10 V11 served job CI v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mp10-v11-served-job-ci-v1.yml'
      - 'coordination/portfolio/tests/mp10_v11_served_job_ci_v1.mjs'
      - 'current-tree/control-v11/**'
      - 'coordination/project-context-v1/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mp10-v11-served-job-ci-v1
  cancel-in-progress: false

jobs:
  focused-served-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Gate Chromium on mutated served-cut identity
        env:
          V11_PUBLIC_BASE: https://juanmanuelpm.github.io/prometeo/current-tree/control-v11
        run: |
          set -euo pipefail
          assets='v11.js data-layer.js'
          for i in $(seq 1 36); do
            all_match=1
            for asset in $assets; do
              served="/tmp/prometeo-${asset}"
              source_sha="$(git hash-object "current-tree/control-v11/${asset}")"
              if curl -fsS -H 'Cache-Control: no-cache' "${V11_PUBLIC_BASE}/${asset}?source=${GITHUB_SHA}-${i}" -o "$served"; then
                served_sha="$(git hash-object "$served")"
                if [ "$source_sha" = "$served_sha" ]; then
                  echo "served-byte identity PASS ${asset}: $served_sha"
                else
                  echo "served-byte identity pending ${asset}: source=$source_sha served=$served_sha"
                  all_match=0
                fi
              else
                echo "served-byte fetch pending ${asset}"
                all_match=0
              fi
            done
            if [ "$all_match" = 1 ]; then
              echo "mutated served-cut identity PASS"
              exit 0
            fi
            sleep 5
          done
          echo "mutated served-cut identity did not converge before Chromium" >&2
          exit 1

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright@1.55.0 install --with-deps chromium

      - name: Verify served V11 job contract
        env:
          V11_PUBLIC_URL: https://juanmanuelpm.github.io/prometeo/current-tree/control-v11/
          V11_PROPAGATION_MS: '180000'
          V11_JOB_CI_OUT: artifacts/mp10-v11-served-job-ci
        run: node coordination/portfolio/tests/mp10_v11_served_job_ci_v1.mjs

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mp10-v11-served-job-ci-evidence
          path: artifacts/mp10-v11-served-job-ci/
          if-no-files-found: error
          retention-days: 14
