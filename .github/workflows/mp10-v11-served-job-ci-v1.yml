name: MP10 V11 served job CI v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mp10-v11-served-job-ci-v1.yml'
      - 'coordination/portfolio/tests/mp10_v11_served_job_ci_v1.mjs'
      - 'current-tree/control-v11/**'
      - 'coordination/project-context-v1/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mp10-v11-served-job-ci-v1
  cancel-in-progress: false

jobs:
  focused-served-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Gate Chromium on served v11.js byte identity
        env:
          V11_SERVED_JS: https://juanmanuelpm.github.io/prometeo/current-tree/control-v11/v11.js
        run: |
          set -euo pipefail
          served=/tmp/prometeo-v11-served.js
          source_sha="$(git hash-object current-tree/control-v11/v11.js)"
          for i in $(seq 1 36); do
            if curl -fsS -H 'Cache-Control: no-cache' "${V11_SERVED_JS}?source=${GITHUB_SHA}-${i}" -o "$served"; then
              served_sha="$(git hash-object "$served")"
              if [ "$source_sha" = "$served_sha" ]; then
                echo "served-byte identity PASS: $served_sha"
                exit 0
              fi
              echo "served-byte identity pending: source=$source_sha served=$served_sha"
            fi
            sleep 5
          done
          echo "served-byte identity did not converge before Chromium" >&2
          exit 1

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright@1.55.0 install --with-deps chromium

      - name: Verify served V11 job contract
        env:
          V11_PUBLIC_URL: https://juanmanuelpm.github.io/prometeo/current-tree/control-v11/
          V11_PROPAGATION_MS: '180000'
          V11_JOB_CI_OUT: artifacts/mp10-v11-served-job-ci
        run: node coordination/portfolio/tests/mp10_v11_served_job_ci_v1.mjs

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mp10-v11-served-job-ci-evidence
          path: artifacts/mp10-v11-served-job-ci/
          if-no-files-found: error
          retention-days: 14
