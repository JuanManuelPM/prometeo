name: Prometeo Live Feed

on:
  push:
    branches: [main]
    paths:
      - 'coordination/workers/**'
      - 'coordination/inbox/**'
      - 'coordination/portfolio/**'
      - 'coordination/opportunities/**'
      - 'coordination/CONTINUITY_HEAD.json'
      - 'coordination/workstreams/chat-native-control-plane-v1/FOCUS.json'
      - '.github/scripts/build-live-feed.mjs'
      - '.github/scripts/normalize-live-feed.mjs'
      - '.github/workflows/live-feed.yml'
  workflow_dispatch:

permissions:
  contents: write

# Never cancel the running publisher. GitHub concurrency keeps at most one running
# and one pending; newer pushes replace the pending run, so bursts coalesce
# without starving Live forever.
concurrency:
  group: prometeo-live-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 1

      - name: Build and normalize snapshot
        shell: bash
        run: |
          set -euo pipefail
          node source/.github/scripts/build-live-feed.mjs source /tmp/feed.json
          node source/.github/scripts/normalize-live-feed.mjs source /tmp/feed.json

      - name: Build tiny claim-ready allocator
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const f=JSON.parse(fs.readFileSync('/tmp/feed.json','utf8'));
          const jobs=(f.projects||[]).flatMap(p=>(p.jobs||[]).map(j=>({...j,project_label:p.label})));
          const g=n=>String(n).padStart(6,'0');
          const compact=j=>{
            const current=Number(j.pin_generation||0);
            const next=current+1;
            return {
              job_id:j.job_id,
              dedupe_key:j.dedupe_key||null,
              project_id:j.project_id||null,
              project_label:j.project_label||null,
              title:j.title||j.job_id,
              priority:j.priority||0,
              state:j.state,
              authority_mode:j.authority_mode||null,
              pin_generation:current,
              next_generation:next,
              claim_mode:'PORTFOLIO_PIN_CREATE',
              claim_path:`coordination/portfolio/pins/${j.job_id}/G${g(next)}.json`,
              predecessor_pin_ref:current?`coordination/portfolio/pins/${j.job_id}/G${g(current)}.json`:null,
              last_signal_at:j.last_signal_at||null,
              post_claim_validate:true
            };
          };
          const byPriority=(a,b)=>(b.priority||0)-(a.priority||0)||String(a.job_id).localeCompare(String(b.job_id));
          const ready=jobs.filter(j=>['ready','partial'].includes(j.state)).sort(byPriority).map(compact).slice(0,40);
          const queue_ready=(f.plans||[]).flatMap(p=>(p.items||[]).filter(i=>i.state==='ready').map(i=>({
            opportunity_id:i.opportunity_id,
            mission:i.mission,
            priority:i.priority||0,
            plan_id:p.id,
            claim_mode:'OPPORTUNITY_CLAIM_CREATE',
            claim_path:`coordination/opportunities/claims/${i.opportunity_id}.json`,
            post_claim_validate:true
          }))).sort((a,b)=>b.priority-a.priority).slice(0,30);
          const recovery=jobs.filter(j=>j.state==='replaceable').sort(byPriority).map(compact).slice(0,30);
          const out={
            schema:'prometeo.fast-allocator/v2',
            generated_at:f.generated_at,
            source_sha:f.source_sha||null,
            truth_boundary:'OPTIMISTIC_ATOMIC_CREATE_THEN_POST_CLAIM_VALIDATE',
            max_recovery_snapshot_age_seconds:90,
            preferred_order:['ready','queue_ready','recovery'],
            counts:{ready:ready.length,queue_ready:queue_ready.length,recovery:recovery.length},
            ready,queue_ready,recovery,
            worker_projection:f.summary?.workers||{},
            diagnostics:f.diagnostics||{}
          };
          fs.writeFileSync('/tmp/allocator.json',JSON.stringify(out,null,2)+'\n');
          NODE

      - name: Checkout site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 20

      - name: Publish snapshot and allocator
        shell: bash
        run: |
          set -euo pipefail
          git -C site config user.name github-actions[bot]
          git -C site config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C site pull --ff-only origin gh-pages
          mkdir -p site/live
          cp /tmp/feed.json site/live/feed.json
          cp /tmp/allocator.json site/live/allocator.json
          git -C site add live/feed.json live/allocator.json
          if git -C site diff --cached --quiet; then exit 0; fi
          git -C site commit -m "live: refresh worker feed and allocator"
          for n in 1 2 3; do
            if git -C site push origin HEAD:gh-pages; then exit 0; fi
            git -C site fetch origin gh-pages
            git -C site rebase origin/gh-pages
          done
          exit 1
