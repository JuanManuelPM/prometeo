name: Prometeo Live Feed

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'coordination/workers/**'
      - 'coordination/inbox/**'
      - 'coordination/portfolio/**'
      - 'coordination/opportunities/**'
      - 'coordination/guide/**'
      - 'coordination/efficiency/**'
      - 'coordination/storage-recovery/private-hot-v1/**'
      - 'coordination/CONTINUITY_HEAD.json'
      - 'coordination/workstreams/chat-native-control-plane-v1/FOCUS.json'
      - 'current-tree/control-v11/chat-canary/index.html'
      - 'current-tree/control-v11/chat-canary/progress-v1.js'
      - '.github/scripts/build-live-feed.mjs'
      - 'scripts/live-reproduction-metric.mjs'
      - 'scripts/human-time-ledger-v1.mjs'
      - 'scripts/apply-human-time-ledger.mjs'
      - 'coordination/portfolio/tests/live_reproduction_metric_provenance_v1.mjs'
      - 'coordination/portfolio/tests/human_time_ledger_v1.mjs'
      - 'coordination/portfolio/tests/human_time_ledger_consumer_wiring_v1.mjs'
      - '.github/scripts/normalize-live-feed.mjs'
      - '.github/scripts/augment-live-role-workers.mjs'
      - 'scripts/build-efficiency-snapshot.mjs'
      - 'scripts/build-fast-allocator.mjs'
      - 'scripts/build-fast-allocator-core-v3.mjs'
      - 'scripts/portfolio-prerequisite-gate.mjs'
      - 'tests/portfolio-prerequisite-gate-v1.test.mjs'
      - 'scripts/build-claim-frontier.mjs'
      - 'scripts/apply-page-change-frontier.mjs'
      - 'scripts/g05-lineage-receipt-lib.mjs'
      - 'scripts/guide-recursive-successor-lib.mjs'
      - 'scripts/compiled-dispatch-contract-lib.mjs'
      - 'coordination/portfolio/tests/guide_pre_dispatch_compile_gate_v1.mjs'
      - 'coordination/goal-progress/G05_LINEAGE_RECEIPT_CONTRACT_V1.json'
      - 'coordination/portfolio/tests/page_change_worker_frontier_v1.mjs'
      - 'coordination/portfolio/tests/page_change_worker_frontier_degraded_v1.mjs'
      - 'coordination/portfolio/tests/page_change_prewrite_fencing_v1.mjs'
      - 'supabase/functions/prometeo-change-loop-v1/**'
      - 'coordination/workspaces/PAGE_CHANGE_WORKER_PROTOCOL_V1.md'
      - 'coordination/workspaces/PAGE_CHANGE_VERIFIER_PROTOCOL_V1.md'
      - 'coordination/portfolio/tests/claim_frontier_compact_v1.mjs'
      - 'scripts/apply-project-coverage.mjs'
      - 'scripts/apply-role-evidence-integrity.mjs'
      - 'scripts/apply-fast-allocator-contention-barriers.mjs'
      - 'scripts/suppress-concurrent-guide-rescate.mjs'
      - '.github/workflows/live-feed.yml'
  workflow_dispatch:

permissions:
  contents: write

# Never cancel the running publisher. GitHub concurrency keeps at most one running
# and one pending; newer pushes replace the pending run, so bursts coalesce
# without starving Live forever.
concurrency:
  group: prometeo-live-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main with bounded recent history
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 500

      - name: Build normalize and augment snapshot
        shell: bash
        run: |
          set -euo pipefail
          node source/coordination/portfolio/tests/live_reproduction_metric_provenance_v1.mjs
          node source/coordination/portfolio/tests/human_time_ledger_v1.mjs
          node source/coordination/portfolio/tests/human_time_ledger_consumer_wiring_v1.mjs
          node source/.github/scripts/build-live-feed.mjs source /tmp/feed.json
          node source/.github/scripts/normalize-live-feed.mjs source /tmp/feed.json
          node source/.github/scripts/augment-live-role-workers.mjs source /tmp/feed.json
          node source/scripts/apply-human-time-ledger.mjs /tmp/feed.json source /tmp/feed.json

      - name: Build runtime efficiency snapshot
        shell: bash
        run: |
          set -euo pipefail
          node source/coordination/portfolio/tests/efficiency_recent_transport_regression_v1.mjs
          node source/scripts/build-efficiency-snapshot.mjs source /tmp/efficiency.json

      - name: Build claim-ready execution + role allocator
        shell: bash
        run: |
          set -euo pipefail
          node source/coordination/portfolio/tests/fast_allocator_contention_barrier_routing_v1.mjs
          node source/tests/fast-allocator-finish-critical-v1.test.mjs
          node source/tests/portfolio-prerequisite-gate-v1.test.mjs
          node source/coordination/portfolio/tests/contention_barrier_batch_fanin_v1.mjs
          node source/coordination/portfolio/tests/contention_barrier_fixed_generation_integration_v1.mjs
          node source/coordination/portfolio/tests/started_signal_transport_fallback_v1.mjs
          node source/coordination/portfolio/tests/claim_transport_boundary_contract_v1.mjs
          node source/tests/portfolio-return-terminal-normalization-v1.test.mjs
          node source/coordination/portfolio/tests/guide_rescate_single_active_role_v1.mjs
          node source/coordination/portfolio/tests/guide_critic_consumed_partial_suppression_v1.mjs
          node source/coordination/portfolio/tests/guide_bounded_recursive_work_generation_v1.mjs
          node source/coordination/portfolio/tests/guide_pre_dispatch_compile_gate_v1.mjs
          node source/coordination/portfolio/tests/agentic_adversarial_correction_benchmark_v1.mjs
          node source/coordination/portfolio/tests/repository_test_runtime_capability_gate_v1.mjs
          node source/coordination/portfolio/tests/primary_chat_state_runtime_binding_v1.mjs source
          node source/coordination/portfolio/tests/primary_chat_independence_c010_e2e_v1.mjs
          node source/coordination/storage-recovery/github-native-v1/self-test.mjs
          node source/coordination/storage-recovery/private-hot-v1/private_hot_security_static_v1.mjs
          node source/coordination/integration-runs/PROMETEO-MP10-01/tests/privacy-closure.mjs
          node source/coordination/storage-recovery/github-native-v1/g09-github-native-reconstruction-v1.mjs
          node source/coordination/goal-progress/tests/g05-shard-a-lineage-v1.mjs
          node source/coordination/portfolio/tests/role_ready_claim_path_suppression_v1.mjs
          node source/coordination/portfolio/tests/guide_rescate_capability_recovery_pressure_v1.mjs
          node source/coordination/portfolio/tests/batched_lane_sharding_v1.mjs
          node source/coordination/portfolio/tests/claim_tail_rescue_after_three_collisions_v1.mjs
          node source/coordination/portfolio/tests/claim_branch_head_move_retry_v1.mjs source
          node source/coordination/portfolio/tests/role_signal_compaction_v1.mjs
          node source/coordination/portfolio/tests/claim_frontier_compact_v1.mjs
          node source/coordination/portfolio/tests/project_coverage_allocator_v1.mjs
          node source/coordination/portfolio/tests/project_guide_source_debt_gate_v1.mjs
          node source/coordination/portfolio/tests/project_guide_effective_frontier_v1.mjs
          node source/coordination/portfolio/tests/role_ready_evidence_integrity_v1.mjs
          node source/coordination/portfolio/tests/explicit_safety_denial_recovery_gate_v1.mjs
          node source/scripts/build-fast-allocator.mjs /tmp/feed.json /tmp/efficiency.json /tmp/allocator.json source
          node source/scripts/apply-project-coverage.mjs /tmp/allocator.json /tmp/feed.json /tmp/allocator.json source
          node source/scripts/apply-role-evidence-integrity.mjs /tmp/allocator.json /tmp/allocator.json source
          node source/scripts/apply-fast-allocator-contention-barriers.mjs /tmp/allocator.json /tmp/allocator.json source
          node source/scripts/suppress-concurrent-guide-rescate.mjs /tmp/allocator.json source
          node source/coordination/portfolio/tests/page_change_worker_frontier_v1.mjs
          node source/coordination/portfolio/tests/page_change_worker_frontier_degraded_v1.mjs source
          node source/coordination/portfolio/tests/page_change_prewrite_fencing_v1.mjs source
          node source/coordination/portfolio/tests/finish_g05_prewrite_return_ingest_v1.mjs source
          node source/coordination/portfolio/tests/page_change_independent_verify_v1.mjs source

          # Page Change is an input adapter into the existing allocator, never a second scheduler.
          # Fail-open for the existing worker runtime: if the private control plane is temporarily
          # unavailable, ordinary ready/role/recovery work remains intact.
          if curl --fail --silent --show-error --max-time 12 \
            https://catnohyouxqjjtseaueb.supabase.co/functions/v1/prometeo-change-loop-v1/worker-frontier \
            -o /tmp/page-change-frontier.json; then
            node source/scripts/apply-page-change-frontier.mjs /tmp/allocator.json /tmp/page-change-frontier.json /tmp/allocator.json
          else
            printf '%s\n' '{"schema":"prometeo.page-change-worker-frontier/v1","generated_at":null,"truth_boundary":"EDGE_UNAVAILABLE_NO_PAGE_CHANGE_WORK_ADDED","items":[]}' > /tmp/page-change-frontier.json
            echo "Page Change frontier unavailable; preserving ordinary allocator lanes."
          fi

          node source/scripts/build-claim-frontier.mjs /tmp/allocator.json /tmp/claim-frontier.json
          node source/coordination/portfolio/tests/finish_g05_private_packet_privacy_v1.mjs \
            source /tmp/page-change-frontier.json /tmp/allocator.json /tmp/claim-frontier.json

      - name: Checkout site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 20

      - name: Verify Live mobile PIN lineage static contract
        shell: bash
        run: |
          set -euo pipefail
          node source/coordination/portfolio/tests/live_mobile_pin_lineage_static_contract_v1.mjs source site

      - name: Publish snapshot allocator and efficiency telemetry
        shell: bash
        run: |
          set -euo pipefail
          git -C site config user.name github-actions[bot]
          git -C site config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C site pull --ff-only origin gh-pages
          mkdir -p site/live
          cp /tmp/feed.json site/live/feed.json
          cp /tmp/allocator.json site/live/allocator.json
          cp /tmp/claim-frontier.json site/live/claim-frontier.json
          cp /tmp/efficiency.json site/live/efficiency.json
          cp /tmp/page-change-frontier.json site/live/page-change-frontier.json
          git -C site add live/feed.json live/allocator.json live/claim-frontier.json live/efficiency.json live/page-change-frontier.json
          if git -C site diff --cached --quiet; then exit 0; fi
          git -C site commit -m "live: refresh worker feed allocator and efficiency"
          for n in 1 2 3; do
            if git -C site push origin HEAD:gh-pages; then exit 0; fi
            git -C site fetch origin gh-pages
            git -C site rebase origin/gh-pages
          done
          exit 1
