name: SECUENCIA - visual media regression gate
on:
  push:
    branches: [main]
    paths:
      - 'scripts/presentacion/shared/**'
      - 'presentacion/montaje/elige-tu-camino/**'
      - 'tests/test_sequence_media_gate.py'
      - '.github/workflows/secuencia-visual-media-gate-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install real browser and media test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet --disable-pip-version-check pillow playwright
          python -m playwright install --with-deps chromium
      - name: Compile the universal media player from the canonical module and story
        run: |
          python presentacion/montaje/elige-tu-camino/build.py
          git diff --exit-code -- presentacion/montaje/elige-tu-camino/index.html
      - name: Require actual visible video pixels and preserve branching flow
        run: |
          python -m unittest discover -s tests -p 'test_sequence_media_gate.py' -v
      - name: Keep visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secuencia-painted-video-frame-qa
          path: tests/qa-painted-frame-mobile.png
          if-no-files-found: warn
          retention-days: 7
