name: Jose V11 payload verify one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jose-v11-payload-verify-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify exact V11 payload
        shell: bash
        run: |
          set -euo pipefail
          SRC='coordination/workstreams/jose-study-design-20260911/material/PROMETEO_JOSE_RECOVERY_ENGINE_V11.html.gz.b64'
          OUT='/tmp/PROMETEO_JOSE_RECOVERY_ENGINE_V11.html'
          base64 -d "$SRC" | gzip -dc > "$OUT"
          BYTES="$(wc -c < "$OUT" | tr -d ' ')"
          SHA="$(sha256sum "$OUT" | awk '{print $1}')"
          echo "V11_BYTES=$BYTES"
          echo "V11_SHA256=$SHA"
          test "$BYTES" = '69235'
          test "$SHA" = '0cf9a40fb53e977dccb40c9755d668a3ee922ccd61883f19229bb4a113139a05'
          echo 'V11_PAYLOAD_VERIFY=PASS'
