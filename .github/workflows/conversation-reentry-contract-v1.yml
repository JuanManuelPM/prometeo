name: Conversacion continua · contrato de recuperacion
on:
  pull_request:
    paths:
      - 'tv/chat/relevo/conversaciones/**'
      - 'tv/chat/relevo/CONTINUIDAD_INTELECTUAL_V2.md'
      - 'tv/chat/relevo/tests/conversation-reentry-contract-v1.mjs'
      - '.github/workflows/conversation-reentry-contract-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public continuation contract (not native-chat E2E)
        run: node tv/chat/relevo/tests/conversation-reentry-contract-v1.mjs
