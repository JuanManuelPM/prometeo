name: Build Prometeo Voice APK

on:
  push:
    branches:
      - android-voice-v1
    paths:
      - 'android/prometeo-voice/**'
      - '.github/workflows/prometeo-voice-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: android/prometeo-voice
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prometeo-voice-v1-apk
          path: android/prometeo-voice/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
