name: WC worker-lab canary submit G5

on:
  push:
    paths:
      - '.github/workflows/wc-worker-lab-canary-submit-g5.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Submit exactly one sanitized canary through deployed worker-lab owner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.error, pathlib, time, subprocess
          request_id='wc-route-g5-1d5ac432-20261003t0120z'
          text='CANARY: verificá la ruta autenticada app-owned de worker-lab y devolvé un RETURN sanitizado; no hagas cambios de producto ni promociones.'
          payload={
            'schema':'prometeo.primary-chat-public-canary-submit/v1',
            'public_canary':True,
            'public_envelope':{
              'schema':'prometeo.browser-ingress-request/v1',
              'kind':'CHAT_CANARY_HUMAN_MESSAGE_V1',
              'request_id':request_id,
              'created_at':'2026-10-03T01:20:30Z',
              'page':{'page_id':'control-v11-chat-canary','title':'Primary Chat canary'}
            },
            'private_payload':{'text':text}
          }
          body=json.dumps(payload,separators=(',',':')).encode()
          req=urllib.request.Request(
            'https://worker-lab.vercel.app/api/prometeo-ingress',
            data=body,
            method='POST',
            headers={'Origin':'https://juanmanuelpm.github.io','Content-Type':'application/json','Accept':'application/json'}
          )
          try:
            with urllib.request.urlopen(req, timeout=30) as r:
              status=r.status
              response=json.loads(r.read().decode())
          except urllib.error.HTTPError as e:
            raise SystemExit(f'HTTP_{e.code}: {e.read().decode(errors="replace")}')
          print('HTTP_STATUS',status)
          print('RESPONSE',json.dumps(response,sort_keys=True))
          assert status==200, status
          assert response.get('schema')=='prometeo.ingress-transport-result/v1', response
          assert response.get('queued') is True, response
          assert response.get('status')=='QUEUED_PUBLIC_CANARY_FALLBACK', response
          ref=response.get('ref')
          expected=f'coordination/portfolio/derived/prometeo-autonomous-growth/portfolio-primary-chat-canary-{request_id}.json'
          assert ref==expected,(ref,expected)

          found=False
          for _ in range(10):
            subprocess.run(['git','fetch','--quiet','origin','main'],check=True)
            p=subprocess.run(['git','show',f'origin/main:{ref}'],capture_output=True,text=True)
            if p.returncode==0:
              job=json.loads(p.stdout)
              found=True
              break
            time.sleep(2)
          assert found, f'durable ref not visible after POST: {ref}'
          assert job.get('job_id')==f'portfolio-primary-chat-canary-{request_id}'
          assert job.get('source',{}).get('privacy')=='PUBLIC_SANITIZED_CANARY'
          assert job.get('authority')=='CURRENT_ALLOCATOR_PRIMARY_CHAT_PUBLIC_CANARY_ONLY_NO_PROMOTION'
          assert text in job.get('mission','')

          evidence={
            'schema':'prometeo.worker-lab-canary-submit-route-evidence/v1',
            'worker_id':'wc-20261003T004046Z-1d5ac432cea9',
            'job_id':'portfolio-worker-lab-canary-submit-route-deploy-v1',
            'generation':5,
            'observed_at':'2026-10-03T01:20:30Z',
            'endpoint':'https://worker-lab.vercel.app/api/prometeo-ingress',
            'request_schema':'prometeo.primary-chat-public-canary-submit/v1',
            'request_id':request_id,
            'http_status':status,
            'response':response,
            'durable_ref_verified':ref,
            'privacy':'PUBLIC_SANITIZED_CANARY',
            'secret_read_by_worker':False,
            'browser_secret_exposed':False,
            'authority':'EXISTING_CURRENT_ALLOCATOR_ONLY',
            'product_mutation_requested':False
          }
          out=pathlib.Path('coordination/portfolio/evidence/prometeo-autonomous-growth/WORKER_LAB_CANARY_SUBMIT_ROUTE_G5_wc-20261003T004046Z-1d5ac432cea9.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(evidence,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Commit evidence and remove temporary verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/wc-worker-lab-canary-submit-g5.yml
          git add coordination/portfolio/evidence/prometeo-autonomous-growth/WORKER_LAB_CANARY_SUBMIT_ROUTE_G5_wc-20261003T004046Z-1d5ac432cea9.json
          git commit -m 'worker-lab: attest authenticated canary submit route G5'
          git pull --rebase origin main
          git push origin HEAD:main
