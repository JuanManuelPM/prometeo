name: EFF043 capability-aware frontier pressure

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-fast-allocator.mjs'
      - 'coordination/efficiency/RATCHET_BASELINE_V1.json'
      - 'coordination/portfolio/tests/capability_aware_frontier_pressure_v1.mjs'
      - 'coordination/portfolio/tests/fast_allocator_capability_fit_v1.mjs'
      - 'scripts/check-efficiency-ratchet.mjs'
      - '.github/workflows/eff043-capability-aware-frontier-pressure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-aware-frontier-pressure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Check capability-aware frontier pressure
        run: node coordination/portfolio/tests/capability_aware_frontier_pressure_v1.mjs
      - name: Check capability fit non-regression
        run: node coordination/portfolio/tests/fast_allocator_capability_fit_v1.mjs
      - name: Check efficiency ratchet
        run: node scripts/check-efficiency-ratchet.mjs .
