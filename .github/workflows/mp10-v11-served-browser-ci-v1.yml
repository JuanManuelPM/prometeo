name: MP10 V11 served browser CI runner v1

on:
  push:
    branches: [main]
    paths:
      - 'coordination/portfolio/tests/mp10_v11_served_browser_ci_v1.mjs'
      - 'coordination/portfolio/tests/v11_recovery_locator_uniqueness_v1.mjs'
      - '.github/workflows/mp10-v11-served-browser-ci-v1.yml'
      - 'current-tree/control-v11/**'
      - 'coordination/project-context-v1/**'
      - 'coordination/chat-sessions/**'
      - 'coordination/bootstrap/**'
      - 'coordination/semantic-relations/**'
      - 'current-tree/work-context/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mp10-v11-served-browser-ci-v1
  cancel-in-progress: false

jobs:
  served-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright@1.55.0 install --with-deps chromium

      - name: Verify generic recovery locator uniqueness
        run: node coordination/portfolio/tests/v11_recovery_locator_uniqueness_v1.mjs

      - name: Verify served V11 in Chromium
        id: browser
        continue-on-error: true
        env:
          V11_PUBLIC_URL: https://juanmanuelpm.github.io/prometeo/current-tree/control-v11/
          V11_PROPAGATION_MS: '180000'
        run: node coordination/portfolio/tests/mp10_v11_served_browser_ci_v1.mjs

      - name: Persist machine-readable CI evidence
        if: always()
        env:
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p coordination/portfolio/evidence/prometeo-autonomous-growth
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const src='artifacts/mp10-v11-served-browser-ci/evidence.json';
          const evidence=fs.existsSync(src)?JSON.parse(fs.readFileSync(src,'utf8')):{
            schema:'prometeo.mp10-v11-served-browser-ci/v1',
            overall:'NO_EVIDENCE_FILE',
            error:{message:'runner did not produce evidence.json'}
          };
          evidence.ci={
            run_id:process.env.RUN_ID,
            run_attempt:process.env.RUN_ATTEMPT,
            head_sha:process.env.HEAD_SHA,
            browser_step_outcome:process.env.BROWSER_OUTCOME,
            run_url:`${process.env.SERVER_URL}/${process.env.REPOSITORY}/actions/runs/${process.env.RUN_ID}`
          };
          const dest=`coordination/portfolio/evidence/prometeo-autonomous-growth/V11_SERVED_BROWSER_CI_RUN_${process.env.RUN_ID}.json`;
          fs.writeFileSync(dest,JSON.stringify(evidence,null,2)+'\n');
          console.log(dest);
          NODE
          git config user.name "prometeo-ci"
          git config user.email "actions@users.noreply.github.com"
          git add coordination/portfolio/evidence/prometeo-autonomous-growth/V11_SERVED_BROWSER_CI_RUN_*.json
          git commit -m "v11: persist served browser CI run ${RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload bounded browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mp10-v11-served-browser-ci-evidence
          path: artifacts/mp10-v11-served-browser-ci/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce served browser result
        if: always()
        env:
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: |
          test "$BROWSER_OUTCOME" = "success"
