name: MP10 V11 served browser CI runner v1
# verification trigger: wc-20261002T093330Z-e10abfbb8079 / owner-fix G000003

on:
  push:
    branches: [main]
    paths:
      - 'coordination/portfolio/tests/mp10_v11_served_browser_ci_v1.mjs'
      - 'coordination/portfolio/tests/v11_recovery_locator_uniqueness_v1.mjs'
      - 'coordination/portfolio/tests/v11_activity_board_work_unit_uniqueness_v1.mjs'
      - '.github/workflows/mp10-v11-served-browser-ci-v1.yml'
      - 'current-tree/control-v11/**'
      - 'coordination/project-context-v1/**'
      - 'coordination/chat-sessions/**'
      - 'coordination/bootstrap/**'
      - 'coordination/semantic-relations/**'
      - 'current-tree/work-context/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mp10-v11-served-browser-ci-v1
  cancel-in-progress: false

jobs:
  served-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish atomic V11 candidate served cut
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          source_root="$GITHUB_WORKSPACE/current-tree/control-v11"
          for n in $(seq 1 12); do
            git worktree remove --force /tmp/prometeo-v11-pages 2>/dev/null || true
            rm -rf /tmp/prometeo-v11-pages
            git worktree prune
            git fetch origin gh-pages
            git worktree add --detach /tmp/prometeo-v11-pages origin/gh-pages
            mkdir -p /tmp/prometeo-v11-pages/current-tree/control-v11
            cp "$source_root/v11.js" /tmp/prometeo-v11-pages/current-tree/control-v11/v11.js
            cp "$source_root/data-layer.js" /tmp/prometeo-v11-pages/current-tree/control-v11/data-layer.js
            cp "$source_root/ingress-v1.js" /tmp/prometeo-v11-pages/current-tree/control-v11/ingress-v1.js
            git -C /tmp/prometeo-v11-pages add \
              current-tree/control-v11/v11.js \
              current-tree/control-v11/data-layer.js \
              current-tree/control-v11/ingress-v1.js
            if git -C /tmp/prometeo-v11-pages diff --cached --quiet; then
              echo "V11 candidate served cut already byte-current."
              git worktree remove --force /tmp/prometeo-v11-pages
              exit 0
            fi
            git -C /tmp/prometeo-v11-pages commit -m "v11: publish atomic candidate served cut ${GITHUB_SHA} attempt ${n}"
            if git -C /tmp/prometeo-v11-pages push origin HEAD:gh-pages; then
              git worktree remove --force /tmp/prometeo-v11-pages
              exit 0
            fi
            echo "gh-pages advanced during V11 publish attempt ${n}; rebuilding atomic cut from latest head."
            git worktree remove --force /tmp/prometeo-v11-pages
            sleep 1
          done
          echo "V11 atomic candidate publication exhausted bounded no-force retries" >&2
          exit 1

      - name: Gate Chromium on mutated served-cut identity
        env:
          V11_PUBLIC_BASE: https://juanmanuelpm.github.io/prometeo/current-tree/control-v11
        run: |
          set -euo pipefail
          assets='v11.js data-layer.js ingress-v1.js'
          for i in $(seq 1 36); do
            all_match=1
            for asset in $assets; do
              served="/tmp/prometeo-${asset}"
              source_sha="$(git hash-object "current-tree/control-v11/${asset}")"
              if curl -fsS -H 'Cache-Control: no-cache' "${V11_PUBLIC_BASE}/${asset}?source=${GITHUB_SHA}-${i}" -o "$served"; then
                served_sha="$(git hash-object "$served")"
                if [ "$source_sha" = "$served_sha" ]; then
                  echo "served-byte identity PASS ${asset}: $served_sha"
                else
                  echo "served-byte identity pending ${asset}: source=$source_sha served=$served_sha"
                  all_match=0
                fi
              else
                echo "served-byte fetch pending ${asset}"
                all_match=0
              fi
            done
            if [ "$all_match" = 1 ]; then
              echo "mutated served-cut identity PASS"
              exit 0
            fi
            sleep 5
          done
          echo "mutated served-cut identity did not converge before Chromium" >&2
          exit 1

      - name: Install pinned Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright@1.55.0 install --with-deps chromium

      - name: Verify generic recovery locator uniqueness
        run: node coordination/portfolio/tests/v11_recovery_locator_uniqueness_v1.mjs

      - name: Verify durable activity Work Unit uniqueness
        run: node coordination/portfolio/tests/v11_activity_board_work_unit_uniqueness_v1.mjs

      - name: Verify served V11 in Chromium
        id: browser
        continue-on-error: true
        env:
          V11_PUBLIC_URL: https://juanmanuelpm.github.io/prometeo/current-tree/control-v11/
          V11_PROPAGATION_MS: '180000'
        run: node coordination/portfolio/tests/mp10_v11_served_browser_ci_v1.mjs

      - name: Persist machine-readable CI evidence
        if: always()
        env:
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "prometeo-ci"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
          mkdir -p coordination/portfolio/evidence/prometeo-autonomous-growth
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const src='artifacts/mp10-v11-served-browser-ci/evidence.json';
          const evidence=fs.existsSync(src)?JSON.parse(fs.readFileSync(src,'utf8')):{
            schema:'prometeo.mp10-v11-served-browser-ci/v1',
            overall:'NO_EVIDENCE_FILE',
            error:{message:'runner did not produce evidence.json'}
          };
          evidence.ci={
            run_id:process.env.RUN_ID,
            run_attempt:process.env.RUN_ATTEMPT,
            head_sha:process.env.HEAD_SHA,
            browser_step_outcome:process.env.BROWSER_OUTCOME,
            run_url:`${process.env.SERVER_URL}/${process.env.REPOSITORY}/actions/runs/${process.env.RUN_ID}`
          };
          const dest=`coordination/portfolio/evidence/prometeo-autonomous-growth/V11_SERVED_BROWSER_CI_RUN_${process.env.RUN_ID}.json`;
          fs.writeFileSync(dest,JSON.stringify(evidence,null,2)+'\n');
          console.log(dest);
          NODE
          git add coordination/portfolio/evidence/prometeo-autonomous-growth/V11_SERVED_BROWSER_CI_RUN_*.json
          if git diff --cached --quiet; then
            echo "CI evidence already current"
          else
            git commit -m "v11: persist served browser CI run ${RUN_ID} attempt ${RUN_ATTEMPT}"
            git push origin HEAD:main
          fi

      - name: Upload bounded browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mp10-v11-served-browser-ci-evidence
          path: artifacts/mp10-v11-served-browser-ci/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce served browser result
        if: always()
        env:
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: |
          test "$BROWSER_OUTCOME" = "success"
