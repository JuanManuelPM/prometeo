name: Apply recovered Adriana heart

on:
  push:
    paths:
      - '.github/workflows/publish-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact recovered heart silhouette
