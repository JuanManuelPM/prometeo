name: Apply approved Adriana heart mask

on:
  push:
    paths:
      - '.github/workflows/publish-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire approved clean heart mask
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page=Path('arte/index.html')
          html=page.read_text(encoding='utf-8')

          final_mask='assets/footer/heart-mask-final-approved.png'
          old_masks=[
              'assets/footer/heart-mask.svg',
              'assets/footer/heart-mask.png',
              'https://adriana-giacobbe-bada-2026.netlify.app/assets/footer/heart-mask.png',
          ]
          for old in old_masks:
              html=html.replace(old, final_mask)

          # Preserve the approved generated silhouette without stretching it.
          html=html.replace('aspect-ratio:1200/1123;', 'aspect-ratio:983/1015;', 1)

          # The existing canvas/video/background engine is intentionally untouched.
          page.write_text(html,encoding='utf-8')
          PY
      - name: Commit approved heart mask wiring
        shell: bash
        run: |
          git config user.name 'prometeo-release-bot'
          git config user.email '72280945+JuanManuelPM@users.noreply.github.com'
          git add arte/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(art): use approved clean heart mask'
          git push origin HEAD:main
