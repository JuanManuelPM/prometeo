name: Publish Adriana art to GitHub Pages

on:
  push:
    paths:
      - '.github/workflows/publish-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GitHub-hosted art page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request, re

          BASE='https://adriana-giacobbe-bada-2026.netlify.app/'
          PUBLIC='https://juanmanuelpm.github.io/prometeo/arte/'
          req=urllib.request.Request(BASE,headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8')

          # Keep the already-working production assets, but make their URLs absolute
          # so the GitHub-hosted document does not depend on relative Netlify paths.
          html=re.sub(r'(?P<q>[\"\'])assets/', lambda m:m.group('q')+BASE+'assets/', html)
          html=re.sub(r'url\((?P<q>[\"\']?)assets/', lambda m:'url('+m.group('q')+BASE+'assets/', html)

          # The heart mask MUST stay same-origin on GitHub Pages. Browsers can render
          # ordinary cross-origin images/video, but CSS masks commonly fail closed
          # without CORS, which made the accepted heart disappear on desktop + mobile.
          html=html.replace(BASE+'assets/footer/heart-mask.png','assets/footer/heart-mask.png')

          html=html.replace('https://adriana-giacobbe-bada-2026.netlify.app/\" rel=\"canonical',PUBLIC+'\" rel=\"canonical')
          html=html.replace('content=\"https://adriana-giacobbe-bada-2026.netlify.app/\" property=\"og:url', 'content=\"'+PUBLIC+'\" property=\"og:url')

          css=r'''
          <style id="github-mobile-art-fix-20260827">
          @media(max-width:700px) and (orientation:portrait){
            /* Approved mobile hero: finish the moving art sooner, no dead white tail. */
            .mobile-hero-final{height:136svh!important;min-height:760px!important}
            .mobile-hero-stage{height:100svh!important}

            /* Work hierarchy: title first, count secondary, then image, then data. */
            .github-mobile-work-heading{display:block!important;margin:0 0 18px!important;padding:0 0 13px!important;border-bottom:1px solid rgba(81,69,61,.16)!important}
            .github-mobile-work-heading h2{margin:0 0 7px!important;font-size:clamp(31px,9vw,40px)!important;line-height:1.05!important;font-weight:300!important;letter-spacing:-.025em!important}
            .github-mobile-work-heading span{font-size:10px!important;letter-spacing:.16em!important;color:#b94e31!important}
            .mobile-work-anchor{display:none!important}
            .copy-col>.work-kicker,.copy-col>h2{display:none!important}

            /* Use the ORIGINAL desktop heart engine in portrait. */
            .dense-footer-desktop-champion{display:block!important}
            .mobile-footer-final{display:none!important}
            .dense-footer{height:max(84svh,660px)!important;min-height:660px!important}
            .dense-footer-layout{display:block!important;padding:0!important}
            .dense-heart{display:block!important;position:absolute!important;top:8%!important;left:50%!important;right:auto!important;width:clamp(200px,58vw,250px)!important;transform:translateX(-50%)!important;z-index:25!important}
            .dense-contact{position:absolute!important;left:20px!important;bottom:28px!important;width:min(72vw,315px)!important;max-width:none!important}
            .dense-contact h2{font-size:clamp(31px,9.4vw,40px)!important;margin-bottom:16px!important}
            .dense-contact-links{gap:4px!important}
            .dense-contact-links a{min-height:42px!important;font-size:clamp(11px,3.2vw,13.5px)!important}
            .dense-qr{display:none!important}
            .dense-readability{background:linear-gradient(180deg,rgba(6,4,3,.05),rgba(6,4,3,.04) 34%,rgba(6,4,3,.15) 58%,rgba(6,4,3,.50) 100%)!important}

            /* QR gets its own clean scene after the moving-heart scene. */
            .github-mobile-qr{min-height:100svh;display:grid;place-items:center;padding:72px 20px;background:#f1eee9;color:#51453d;text-align:center}
            .github-mobile-qr img,.github-mobile-qr svg{width:min(84vw,340px)!important;height:auto!important;background:white!important;padding:18px!important}
            .github-mobile-qr p{margin:0 0 25px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#82766c}
          }
          @media(min-width:701px){.github-mobile-work-heading,.github-mobile-qr{display:none!important}}
          </style>
          '''

          js=r'''
          <script id="github-mobile-art-runtime-20260827">
          (()=>{
            const mobile=()=>matchMedia('(max-width:700px) and (orientation:portrait)').matches;
            document.querySelectorAll('.work').forEach((work,i)=>{
              const art=work.querySelector('.art-col'); const h=work.querySelector('.copy-col h2');
              if(!art||!h||work.querySelector('.github-mobile-work-heading'))return;
              const head=document.createElement('div'); head.className='github-mobile-work-heading';
              head.innerHTML='<h2>'+h.textContent+'</h2><span>'+String(i+1).padStart(2,'0')+' / 09</span>';
              work.insertBefore(head,art);
            });
            const footer=document.querySelector('.dense-footer-desktop-champion');
            if(footer && !document.querySelector('.github-mobile-qr')){
              const qr=footer.querySelector('.dense-qr');
              if(qr){
                const sec=document.createElement('section'); sec.className='github-mobile-qr';
                const inner=document.createElement('div');
                const p=document.createElement('p'); p.textContent='Compartir esta exposición';
                inner.appendChild(p); inner.appendChild(qr.cloneNode(true)); sec.appendChild(inner);
                footer.insertAdjacentElement('afterend',sec);
              }
            }
            const video=document.getElementById('denseHeartVideo');
            if(video){video.muted=true;video.loop=true;video.playsInline=true;const kick=()=>{if(mobile()){const p=video.play();if(p&&p.catch)p.catch(()=>{})}};addEventListener('scroll',kick,{passive:true});addEventListener('pointerdown',kick,{passive:true});kick()}
          })();
          </script>
          '''
          html=html.replace('</head>',css+'\n</head>',1).replace('</body>',js+'\n</body>',1)
          out=Path('arte'); out.mkdir(exist_ok=True)
          (out/'index.html').write_text(html,encoding='utf-8')
          PY
      - name: Commit art page
        shell: bash
        run: |
          git config user.name 'prometeo-release-bot'
          git config user.email '72280945+JuanManuelPM@users.noreply.github.com'
          git add arte/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: publish Adriana BADA art on GitHub Pages'
          git push origin HEAD:main
