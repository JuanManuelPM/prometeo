name: Build approved Adriana heart alpha

on:
  push:
    paths:
      - '.github/workflows/publish-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-heart-mask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Rebuild exact approved heart as real alpha PNG
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, io

          # Exact thresholded bitmap derived from the user-approved clean PNG.
          APPROVED_BW_B64 = ''''''

          bw = Image.open(io.BytesIO(base64.b64decode(APPROVED_BW_B64))).convert('L')
          rgba = Image.new('RGBA', bw.size, (255,255,255,0))
          rgba.putalpha(bw)

          out = Path('arte/assets/footer')
          out.mkdir(parents=True, exist_ok=True)
          wired = out / 'heart-mask-final-approved.png'
          canonical = out / 'heart-mask-final-alpha.png'
          rgba.save(wired, optimize=True)
          rgba.save(canonical, optimize=True)

          check = Image.open(wired)
          alpha = check.getchannel('A')
          lo, hi = alpha.getextrema()
          if check.mode != 'RGBA' or check.size != (983,1015) or lo != 0 or hi != 255:
              raise SystemExit(f'alpha QA failed: mode={check.mode} size={check.size} extrema={(lo,hi)}')

          page = Path('arte/index.html').read_text(encoding='utf-8')
          if 'assets/footer/heart-mask-final-approved.png' not in page:
              raise SystemExit('page is not wired to approved mask')
          if '.dense-heart' not in page or 'background:url(' not in page:
              raise SystemExit('existing heart fallback engine not found')

          print('HEART_ALPHA_QA=PASS')
          print('SIZE=', check.size)
          print('MODE=', check.mode)
          print('ALPHA_EXTREMA=', (lo, hi))
          PY
      - name: Commit alpha-only repair
        shell: bash
        run: |
          git config user.name 'prometeo-release-bot'
          git config user.email '72280945+JuanManuelPM@users.noreply.github.com'
          git add arte/assets/footer/heart-mask-final-approved.png arte/assets/footer/heart-mask-final-alpha.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(art): make approved heart mask truly transparent'
          git push origin HEAD:main
