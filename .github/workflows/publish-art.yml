name: Build approved Adriana heart alpha

on:
  push:
    paths:
      - '.github/workflows/publish-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-heart-mask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Convert approved PNG to real alpha mask
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path('arte/assets/footer/heart-mask-final-approved.png')
          if not src.exists():
              raise SystemExit(f'missing approved mask source: {src}')

          original = Image.open(src).convert('L')
          rgba = Image.new('RGBA', original.size, (255,255,255,0))
          rgba.putalpha(original)

          # Preserve the exact approved silhouette; only encode opacity correctly.
          rgba.save(src, optimize=True)
          rgba.save(src.with_name('heart-mask-final-alpha.png'), optimize=True)

          check = Image.open(src)
          alpha = check.getchannel('A')
          lo, hi = alpha.getextrema()
          if check.mode != 'RGBA' or lo != 0 or hi != 255:
              raise SystemExit(f'alpha QA failed: mode={check.mode} extrema={(lo,hi)}')

          page = Path('arte/index.html').read_text(encoding='utf-8')
          if 'assets/footer/heart-mask-final-approved.png' not in page:
              raise SystemExit('page is not wired to approved mask')
          if '.dense-heart' not in page or 'background:url(' not in page:
              raise SystemExit('existing heart fallback engine not found')

          print('HEART_ALPHA_QA=PASS')
          print('SIZE=', check.size)
          print('MODE=', check.mode)
          print('ALPHA_EXTREMA=', (lo, hi))
          PY
      - name: Commit alpha-only repair
        shell: bash
        run: |
          git config user.name 'prometeo-release-bot'
          git config user.email '72280945+JuanManuelPM@users.noreply.github.com'
          git add arte/assets/footer/heart-mask-final-approved.png arte/assets/footer/heart-mask-final-alpha.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(art): make approved heart mask truly transparent'
          git push origin HEAD:main
