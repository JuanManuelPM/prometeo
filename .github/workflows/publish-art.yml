          out=Path('arte/assets/footer')
          out.mkdir(parents=True,exist_ok=True)
          (out/'heart-mask.svg').write_text(svg,encoding='utf-8')

          page=Path('arte/index.html')
          html=page.read_text(encoding='utf-8')
          html=html.replace('assets/footer/heart-mask.png','assets/footer/heart-mask.svg')
          html=html.replace('https://adriana-giacobbe-bada-2026.netlify.app/assets/footer/heart-mask.png','assets/footer/heart-mask.svg')
          page.write_text(html,encoding='utf-8')
          PY
      - name: Commit recovered heart
        shell: bash
        run: |
          git config user.name 'prometeo-release-bot'
          git config user.email '72280945+JuanManuelPM@users.noreply.github.com'
          git add arte/index.html arte/assets/footer/heart-mask.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(art): apply recovered approved heart silhouette'
          git push origin HEAD:main
