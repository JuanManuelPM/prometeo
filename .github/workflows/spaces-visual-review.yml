name: Spaces Visual Review

on:
  push:
    branches: [visual-review-spaces]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spaces-visual-review
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-review-spaces
          fetch-depth: 2

      - id: chrome
        uses: browser-actions/setup-chrome@v1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'


      - name: Serve exact checkout
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . >/tmp/spaces-review-http.log 2>&1 &
          echo $! >/tmp/spaces-review-http.pid
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:4173/visuals/spaces-lab/" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/spaces-review-http.log
          exit 1

      - name: Capture deterministic review frames
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          SOURCE_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -rf visuals/review/spaces/latest
          mkdir -p visuals/review/spaces/latest

          "$CHROME"             --headless=new             --no-sandbox             --disable-gpu             --disable-dev-shm-usage             --hide-scrollbars             --remote-debugging-port=9222             --user-data-dir=/tmp/spaces-review-chrome-profile             about:blank >/tmp/spaces-review-chrome.log 2>&1 &
          echo $! >/tmp/spaces-review-chrome.pid
          trap 'kill "$(cat /tmp/spaces-review-chrome.pid)" 2>/dev/null || true' EXIT

          for i in {1..80}; do
            if curl -fsS "http://127.0.0.1:9222/json/version" >/tmp/spaces-review-version.json; then
              break
            fi
            sleep .25
          done
          test -s /tmp/spaces-review-version.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';

          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const targets=[
            {id:'arcos-desktop',label:'ARCOS · desktop',map:1,z:22,x:0,t:5000,w:1365,h:768},
            {id:'calzada-desktop',label:'CALZADA · desktop',map:3,z:24,x:0,t:5000,w:1365,h:768},
            {id:'tunel-desktop',label:'TÚNEL · desktop',map:4,z:24,x:0,t:5000,w:1365,h:768},
            {id:'torres-entry-desktop',label:'TORRES · entrada',map:5,z:8,x:0,t:7000,w:1365,h:768},
            {id:'torres-mid-desktop',label:'TORRES · medio',map:5,z:34,x:0,t:7000,w:1365,h:768},
            {id:'torres-near-desktop',label:'TORRES · cercano',map:5,z:58,x:0,t:7000,w:1365,h:768},
            {id:'arcos-mobile',label:'ARCOS · mobile',map:1,z:22,x:0,t:5000,w:390,h:844},
            {id:'calzada-mobile',label:'CALZADA · mobile',map:3,z:24,x:0,t:5000,w:390,h:844},
            {id:'tunel-mobile',label:'TÚNEL · mobile',map:4,z:24,x:0,t:5000,w:390,h:844},
            {id:'torres-mobile',label:'TORRES · mobile',map:5,z:34,x:0,t:7000,w:390,h:844},
          ];

          const pages=await (await fetch('http://127.0.0.1:9222/json/list')).json();
          const page=pages.find(x=>x.type==='page');
          if(!page?.webSocketDebuggerUrl)throw new Error('No Chrome page target');

          const ws=new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{
            ws.addEventListener('open',resolve,{once:true});
            ws.addEventListener('error',reject,{once:true});
          });

          let seq=0;
          const pending=new Map();
          ws.addEventListener('message',ev=>{
            const msg=JSON.parse(String(ev.data));
            if(!msg.id)return;
            const p=pending.get(msg.id);
            if(!p)return;
            pending.delete(msg.id);
            if(msg.error)p.reject(new Error(msg.error.message||JSON.stringify(msg.error)));
            else p.resolve(msg.result||{});
          });

          function send(method,params={}){
            const id=++seq;
            return new Promise((resolve,reject)=>{
              pending.set(id,{resolve,reject});
              ws.send(JSON.stringify({id,method,params}));
            });
          }

          await send('Page.enable');
          await send('Runtime.enable');
          await send('Network.enable');
          await send('Network.setCacheDisabled',{cacheDisabled:false});

          const shots=[];
          const outDir='visuals/review/spaces/latest';
          for(const item of targets){
            await send('Emulation.setDeviceMetricsOverride',{
              width:item.w,height:item.h,deviceScaleFactor:1,mobile:false,
              screenWidth:item.w,screenHeight:item.h
            });
            const q=new URLSearchParams({
              review:'1',map:String(item.map),z:String(item.z),x:String(item.x),t:String(item.t)
            });
            const url='http://127.0.0.1:4173/visuals/spaces-lab/?'+q;
            console.log('CAPTURE',item.id,url);

            await send('Page.navigate',{url});
            let ready=false;
            for(let attempt=0;attempt<160;attempt++){
              try{
                const ev=await send('Runtime.evaluate',{
                  expression:'Boolean(window.PrometeoSpacesReview && window.PrometeoSpacesReview.ready)',
                  returnByValue:true
                });
                if(ev?.result?.value){ready=true;break}
              }catch{}
              await sleep(250);
            }
            if(!ready)throw new Error('Review page never became ready: '+item.id);
            await sleep(250);

            const shot=await send('Page.captureScreenshot',{
              format:'png',fromSurface:true,captureBeyondViewport:false
            });
            const bytes=Buffer.from(shot.data,'base64');
            if(bytes.length<10000)throw new Error('Screenshot too small: '+item.id+' '+bytes.length);
            const filename=item.id+'.png';
            await fs.writeFile(path.join(outDir,filename),bytes);
            shots.push({
              id:item.id,label:item.label,map:item.map,z:item.z,x:item.x,t:item.t,
              viewport:{width:item.w,height:item.h},
              url:'./latest/'+filename,
              public_url:'https://juanmanuelpm.github.io/prometeo/visuals/review/spaces/latest/'+filename
            });
          }

          ws.close();

          const html=await fs.readFile('visuals/spaces-lab/index.html','utf8');
          const version=(html.match(/version:'([^']+)'/)||[])[1]||'unknown';
          const now=new Date().toISOString();
          const sourceSha=process.env.SOURCE_SHA;
          const repo=process.env.REPO;

          const manifest={
            schema:'prometeo.visual-review.spaces/v1',
            status:'CAPTURED',
            version,
            generated_at:now,
            source_sha:sourceSha,
            source_commit_url:'https://github.com/'+repo+'/commit/'+sourceSha,
            review_url:'https://juanmanuelpm.github.io/prometeo/visuals/review/spaces/',
            capture_mode:'single persistent Chromium via CDP + deterministic review query',
            screenshots:shots,
            accepted_reference:null,
            review_required:true,
            review_rule:'Inspect generated screenshots for composition, scale, clipping, contrast, depth and integration before calling a visual iteration complete.'
          };
          await fs.writeFile('visuals/review/spaces/latest.json',JSON.stringify(manifest,null,2)+'\n');

          const pointer={
            schema:'PROMETEO_VISUAL_CURRENT_REVIEW_V1',
            front_id:'spaces',
            status:'CAPTURED',
            version,
            source_sha:sourceSha,
            generated_at:now,
            review_url:manifest.review_url,
            manifest_url:'https://juanmanuelpm.github.io/prometeo/visuals/review/spaces/latest.json',
            screenshot_base_url:'https://juanmanuelpm.github.io/prometeo/visuals/review/spaces/latest/',
            screenshots:shots,
            accepted_reference:null,
            capture_contract:{
              deterministic_query:'?review=1&map=<1|3|4|5>&x=<number>&z=<number>&t=<ms>',
              ui_hidden:true,
              fixed_animation_time:true,
              source_branch:'visual-review-spaces',
              single_browser_session:true,
              desktop_and_mobile:true,
              torres_extra_depth_samples:true
            },
            review_rule:manifest.review_rule
          };
          await fs.writeFile('visuals/fronts/spaces/current-review.json',JSON.stringify(pointer,null,2)+'\n');
          NODE

          ls -lh visuals/review/spaces/latest

      - name: Upload exact screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: spaces-visual-review-${{ github.sha }}
          path: |
            visuals/review/spaces/latest/
            visuals/review/spaces/latest.json
            visuals/fronts/spaces/current-review.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish review evidence to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/spaces-review-publish
          mkdir -p /tmp/spaces-review-publish/review /tmp/spaces-review-publish/front
          cp -a visuals/review/spaces/latest /tmp/spaces-review-publish/review/
          cp visuals/review/spaces/latest.json /tmp/spaces-review-publish/review/latest.json
          cp visuals/fronts/spaces/current-review.json /tmp/spaces-review-publish/front/current-review.json

          git fetch origin main
          git checkout -B main origin/main
          mkdir -p visuals/review/spaces visuals/fronts/spaces
          rm -rf visuals/review/spaces/latest
          cp -a /tmp/spaces-review-publish/review/latest visuals/review/spaces/
          cp /tmp/spaces-review-publish/review/latest.json visuals/review/spaces/latest.json
          cp /tmp/spaces-review-publish/front/current-review.json visuals/fronts/spaces/current-review.json

          git add visuals/review/spaces/latest visuals/review/spaces/latest.json visuals/fronts/spaces/current-review.json
          if git diff --cached --quiet; then
            echo "Review evidence unchanged."
          else
            git commit -m "visuals: refresh Spaces visual review evidence"
            for n in 1 2 3 4; do
              if git push origin HEAD:main; then
                break
              fi
              if [ "$n" = 4 ]; then exit 1; fi
              git fetch origin main
              git rebase origin/main
              sleep 2
            done
          fi

      - name: Sync review evidence to gh-pages
        run: |
          set -euo pipefail
          rm -rf /tmp/spaces-review-copy
          mkdir -p /tmp/spaces-review-copy/review /tmp/spaces-review-copy/front
          cp -a visuals/review/spaces /tmp/spaces-review-copy/review/
          cp visuals/fronts/spaces/current-review.json /tmp/spaces-review-copy/front/current-review.json

          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          mkdir -p visuals/review visuals/fronts/spaces
          rm -rf visuals/review/spaces
          cp -a /tmp/spaces-review-copy/review/spaces visuals/review/
          cp /tmp/spaces-review-copy/front/current-review.json visuals/fronts/spaces/current-review.json

          git add visuals/review/spaces visuals/fronts/spaces/current-review.json
          if git diff --cached --quiet; then
            echo "gh-pages review evidence unchanged."
            exit 0
          fi
          git commit -m "visuals: publish Spaces visual review evidence"
          for n in 1 2 3 4; do
            if git push origin HEAD:gh-pages; then exit 0; fi
            git fetch origin gh-pages
            git rebase origin/gh-pages
            sleep 2
          done
          exit 1
