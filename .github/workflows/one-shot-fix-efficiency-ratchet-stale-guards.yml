name: One-shot fix stale efficiency ratchet guards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fix-efficiency-ratchet-stale-guards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20
      - name: Reconcile head and replace only stale guard literals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/check-efficiency-ratchet.mjs')
          s=p.read_text()
          repl={
            "batch_candidates: batchCandidates.slice(0, 40)":"batch_candidates: usefulReserve.ordered.slice(0, 40)",
            "DEFAULT_MAX_SERIALIZED_BYTES = 24_000":"DEFAULT_MAX_SERIALIZED_BYTES = 14_000",
            "bytes<=24000":"bytes<=14000",
          }
          for old,new in repl.items():
              if old not in s:
                  raise SystemExit(f'expected stale guard missing: {old}')
              if s.count(old)!=1:
                  raise SystemExit(f'expected exactly one stale guard: {old} count={s.count(old)}')
              s=s.replace(old,new)
          p.write_text(s)
          PY
          git rm .github/workflows/one-shot-fix-efficiency-ratchet-stale-guards.yml
          git add scripts/check-efficiency-ratchet.mjs
          git commit -m "fix efficiency ratchet guards for current allocator frontier contract"
          for n in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
