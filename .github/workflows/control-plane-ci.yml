name: Prometeo Control Plane CI
on:
  push:
    paths:
      - '.well-known/prometeo.json'
      - 'AGENTS.md'
      - 'coordination/NOW.json'
      - 'coordination/DELTA_FEED.json'
      - 'coordination/WORK_POLICY.md'
      - 'coordination/RETURN_CONTRACT.json'
      - 'coordination/workstreams/**'
      - 'scripts/control-plane-resolve.mjs'
      - 'tests/control-plane.test.mjs'
      - '.github/workflows/control-plane-ci.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tests/control-plane.test.mjs
