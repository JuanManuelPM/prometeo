name: P4 Continuous Improvement v1

on:
  push:
    branches: [candidate/p4-continuous-improvement-v1-20260910]
    paths:
      - 'AGENTS.md'
      - '.well-known/prometeo-execute.json'
      - 'coordination/AGENT_EXECUTION_PROTOCOL_V1.md'
      - 'coordination/*CHANGE*V1.json'
      - 'coordination/EXECUTION_PACKET_CONTRACT_V1.json'
      - 'coordination/PROJECT_AGENT_GRANT_V1.json'
      - 'shared/capture/v1/change-loop.js'
      - 'scripts/build-universal-control-v5-change-loop.py'
      - 'scripts/package-universal-control-v5-change-loop-release.py'
      - 'tests/p4-change-loop-*.mjs'
      - 'tests/fixtures/p4-change-loop-host.html'
      - '.github/workflows/p4-continuous-improvement-v1.yml'
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: p4-continuous-improvement-${{ github.ref }}
  cancel-in-progress: false

jobs:
  end-to-end-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Static and client tests
        run: |
          node --check shared/capture/v1/change-loop.js
          node --test tests/p4-change-loop-client.test.mjs
          python -m json.tool .well-known/prometeo-execute.json >/dev/null
          python -m json.tool coordination/PAGE_CHANGE_THREAD_CONTRACT_V1.json >/dev/null
          python -m json.tool coordination/PAGE_CHANGE_FEED_CONTRACT_V1.json >/dev/null
          python -m json.tool coordination/EXECUTION_PACKET_CONTRACT_V1.json >/dev/null
          python -m json.tool coordination/PROJECT_AGENT_GRANT_V1.json >/dev/null
          grep -q 'PROMETEO EXECUTE' AGENTS.md
          grep -q 'FETCH.*VALIDATE.*REINCARNATE' coordination/AGENT_EXECUTION_PROTOCOL_V1.md

      - name: Build V5 Change Loop candidate
        run: |
          python scripts/build-universal-control-v5-change-loop.py
          python scripts/package-universal-control-v5-change-loop-release.py
          grep -q 'loadPageChangeLoop' shared/universal-shell/v5/candidate/change-loop-source.html
          grep -q 'data-change-unread' shared/universal-shell/v5/candidate/change-loop-source.html
          grep -q 'suppressNextClosedClick=true' shared/universal-shell/v5/candidate/change-loop-source.html
          grep -q '__PROMETEO_UNIVERSAL_HOST__' shared/universal-shell/v5/candidate/change-loop-source.html
          ! grep -q 'data-prometeo-shell' shared/universal-shell/v5/change-loop-release-candidate/root-index.html
          python -m json.tool shared/universal-shell/v5/change-loop-release-candidate/manifest.json >/dev/null

      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser tests
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/p4-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/tests/fixtures/p4-change-loop-host.html >/dev/null && break; sleep .25; done
          node tests/p4-change-loop-browser.mjs
          V5_CANDIDATE_PATH='shared/universal-shell/v5/candidate/change-loop-source.html' node tests/universal-control-v5-browser-parity.mjs

      - name: Privacy and single-owner guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Page Change Thread and Page Change Feed are human projections' coordination/AGENT_EXECUTION_PROTOCOL_V1.md
          grep -q 'Private Capture literals never' coordination/AGENT_EXECUTION_PROTOCOL_V1.md
          grep -q 'shared/capture/v1' coordination/PAGE_CHANGE_THREAD_CONTRACT_V1.json
          grep -q 'single global shell' shared/universal-shell/v5/candidate/CHANGE_LOOP_SOURCE_SHA256.txt
          grep -q 'RETIRED COMPATIBILITY STUB' shared/prometeo-shell/v2/prometeo-shell.js

      - name: Persist verified candidate snapshots
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            shared/universal-shell/v5/candidate/change-loop-source.html \
            shared/universal-shell/v5/candidate/CHANGE_LOOP_SOURCE_SHA256.txt \
            shared/universal-shell/v5/change-loop-release-candidate
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'P4: persist verified Page Change Loop V5 candidate [skip ci]'
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
