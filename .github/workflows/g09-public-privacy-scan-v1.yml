name: G09 public privacy scan v1

on:
  push:
    branches: [main]
    paths:
      - 'coordination/portfolio/tests/public_privacy_scan_v1.mjs'
      - '.github/workflows/g09-public-privacy-scan-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: g09-public-privacy-scan-v1
  cancel-in-progress: true

jobs:
  privacy-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main
      - name: Checkout gh-pages public projection
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public-gh-pages
      - name: Run bounded privacy scan
        id: scan
        working-directory: main
        env:
          GH_PAGES_ROOT: ../public-gh-pages
        run: node coordination/portfolio/tests/public_privacy_scan_v1.mjs
      - name: Persist machine-readable run evidence
        if: always()
        working-directory: main
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p coordination/portfolio/evidence/prometeo-autonomous-growth
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const src='artifacts/public-privacy-scan/evidence.json';
          const evidence=fs.existsSync(src)?JSON.parse(fs.readFileSync(src,'utf8')):{
            schema:'prometeo.public-privacy-scan/v1',
            overall:'NO_EVIDENCE_FILE',
            findings:[],
            error:{message:'scanner did not produce evidence.json'}
          };
          evidence.ci={
            run_id:process.env.RUN_ID,
            run_attempt:process.env.RUN_ATTEMPT,
            head_sha:process.env.HEAD_SHA,
            scan_step_outcome:process.env.SCAN_OUTCOME,
            run_url:`${process.env.SERVER_URL}/${process.env.REPOSITORY}/actions/runs/${process.env.RUN_ID}`
          };
          const dest=`coordination/portfolio/evidence/prometeo-autonomous-growth/G09_PUBLIC_PRIVACY_SCAN_RUN_${process.env.RUN_ID}.json`;
          fs.writeFileSync(dest,JSON.stringify(evidence,null,2)+'\n');
          console.log(dest);
          NODE
          git config user.name "prometeo-ci"
          git config user.email "actions@users.noreply.github.com"
          git add coordination/portfolio/evidence/prometeo-autonomous-growth/G09_PUBLIC_PRIVACY_SCAN_RUN_*.json
          git commit -m "finish G09-C: persist privacy scan run ${RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload bounded privacy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g09-public-privacy-scan-evidence
          path: main/artifacts/public-privacy-scan/
          if-no-files-found: error
          retention-days: 14
