name: M01 isolated work desk candidate quality
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - 'tv/chat/AGENT_ENTRY_V1.md'
      - 'tv/chat/relevo/retomar/index.html'
      - 'tv/chat/relevo/retomar/reentrada.json'
      - 'tv/chat/relevo/tests/m01-work-desk-browser-v1.cjs'
      - 'tv/chat/relevo/tests/j01-m01-source-validation-v1.mjs'
      - '.github/workflows/m01-work-desk-quality.yml'
  push:
    branches: [integration/j01-m01-verified-bridge-20261010, gh-pages]
    paths:
      - 'tv/chat/AGENT_ENTRY_V1.md'
      - 'tv/chat/relevo/retomar/index.html'
      - 'tv/chat/relevo/retomar/reentrada.json'
      - 'tv/chat/relevo/tests/j01-m01-served-verification-v1.cjs'
      - '.github/workflows/m01-work-desk-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m01-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium-six-sizes:
    name: M01 actual DOM, staged ACK fixtures, failover and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium harness
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Parse-check all staged integration and post-publish scripts
        run: |
          node --check tv/chat/relevo/tests/j01-m01-served-verification-v1.cjs
          node --check tv/chat/relevo/tests/m01-work-desk-browser-v1.cjs
          node --check tv/chat/relevo/tests/j01-m01-source-validation-v1.mjs
      - name: Verify genuine J01 bridge ACK against GitHub issue comment and projection
        run: node tv/chat/relevo/tests/j01-m01-source-validation-v1.mjs
      - name: Chromium against checked-out candidate over HTTP
        run: node tv/chat/relevo/tests/m01-work-desk-browser-v1.cjs
      - name: Existing owner HTTP baseline · candidate-only (public readback is a separate post-merge job)
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const file='tv/chat/relevo/tests/retomar-http-smoke-v1.mjs';
          const out='tv/chat/relevo/tests/retomar-http-m01-candidate-only.mjs';
          const original=fs.readFileSync(file,'utf8');
          const trailer="await import('./j10-pages-readback-v1.mjs');";
          if(!original.endsWith(trailer+'\n'))throw Error('Owner baseline changed; review before separating production proof');
          fs.writeFileSync(out,original.slice(0,-(trailer.length+1))+'// Production is gated independently AFTER publication.\\n');
          NODE
          node tv/chat/relevo/tests/retomar-http-m01-candidate-only.mjs
      - name: Existing 6-viewport integrated regressions · candidate with chronologically valid synthetic fixture
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const file='tv/chat/relevo/tests/retomar-integrated-ux-v1.cjs';
          const out='tv/chat/relevo/tests/retomar-integrated-m01-candidate-only.cjs';
          const original=fs.readFileSync(file,'utf8');
          const fixed="date_utc:'2026-10-10T03:00:00.000Z'";
          if(original.split(fixed).length!==2)throw Error('Owner future event fixture changed; review chronology before staging');
          // This particular synthetic future owner event must sort as NEW, not
          // be buried behind today's numerous real receipts in a 12-entry feed.
          fs.writeFileSync(out,original.replace(fixed,"date_utc:new Date().toISOString()"));
          NODE
          node tv/chat/relevo/tests/retomar-integrated-m01-candidate-only.cjs
      - name: Evidence only, never automatic publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m01-candidate-chromium-screens-and-receipts
          path: |
            artifacts/m01-work-desk/
            artifacts/retomar-pr77-http/
            artifacts/retomar-integrated-ux/
          if-no-files-found: warn
          retention-days: 14
  served-pages-proof:
    if: github.event_name == 'push' && github.ref == 'refs/heads/gh-pages'
    name: LIVE GitHub Pages · real ACK in Chromium and exact source hashes
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tv/chat/relevo/tests/j01-m01-served-verification-v1.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j01-m01-production-proof
          path: artifacts/j01-m01-served/
          if-no-files-found: warn
          retention-days: 14
