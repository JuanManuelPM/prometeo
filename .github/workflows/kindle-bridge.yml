name: Build Kindle Bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/kindle-bridge/**'
      - '.github/workflows/kindle-bridge.yml'

permissions:
  contents: write

concurrency:
  group: kindle-bridge-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: SDK packages
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle -p android/kindle-bridge :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare stable download
        shell: bash
        run: |
          set -euo pipefail
          APK='android/kindle-bridge/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          cp "$APK" /tmp/PROMETEO_BRIDGE.apk
          sha256sum /tmp/PROMETEO_BRIDGE.apk | awk '{print $1}' >/tmp/PROMETEO_BRIDGE.sha256
          cp android/kindle-bridge/app/src/main/assets/PROMETEO_KINDLE_INSTALL.sh /tmp/PROMETEO_KINDLE_INSTALL.sh

      - name: Publish APK to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/prometeo-gh-pages
          git worktree add --detach /tmp/prometeo-gh-pages origin/gh-pages
          mkdir -p /tmp/prometeo-gh-pages/kindle/install
          cp /tmp/PROMETEO_BRIDGE.apk /tmp/prometeo-gh-pages/kindle/install/PROMETEO_BRIDGE.apk
          cp /tmp/PROMETEO_KINDLE_INSTALL.sh /tmp/prometeo-gh-pages/kindle/install/PROMETEO_KINDLE_INSTALL.sh
          HASH="$(cat /tmp/PROMETEO_BRIDGE.sha256)"
          printf '{\n  "version": "1.0.0",\n  "commit": "%s",\n  "sha256": "%s"\n}\n' "$GITHUB_SHA" "$HASH" > /tmp/prometeo-gh-pages/kindle/install/build.json
          cd /tmp/prometeo-gh-pages
          git config user.name 'prometeo-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add kindle/install/PROMETEO_BRIDGE.apk kindle/install/PROMETEO_KINDLE_INSTALL.sh kindle/install/build.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'kindle: publish Prometeo Bridge APK [skip ci]'
          if ! git push origin HEAD:gh-pages; then
            git fetch origin gh-pages
            git rebase origin/gh-pages
            git push origin HEAD:gh-pages
          fi
