name: Retired Prometeo Global Shell V3 Injector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-retired:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Universal Shell ownership
        run: |
          set -euo pipefail
          test -f shared/universal-shell/v5/README.md
          echo 'Per-page global shell injection is retired. Universal Shell owns navigation, notes and capture.'
