name: Allocator Fixed Generation Recovery Gate V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-fast-allocator.mjs"
      - "scripts/fixed-generation-recovery-policy-gate-v1.mjs"
      - "scripts/ratcheted-verification-recovery-gate-v1.mjs"
      - "tests/fast-allocator-fixed-generation-recovery-gate-v1.test.mjs"
      - "coordination/portfolio/tests/ratcheted_verification_stale_recovery_suppression_v1.mjs"
      - "coordination/portfolio/recovery-policies/portfolio-alumnos-jose-v11-authoritative-source-recovery-v1.json"
      - ".github/workflows/allocator-fixed-generation-recovery-gate-v1.yml"

permissions:
  contents: read

jobs:
  fixed-generation-recovery-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run fixed-generation recovery ratchet regression
        run: node --test tests/fast-allocator-fixed-generation-recovery-gate-v1.test.mjs
      - name: Run ratcheted verification stale recovery regression
        run: node --test coordination/portfolio/tests/ratcheted_verification_stale_recovery_suppression_v1.mjs
