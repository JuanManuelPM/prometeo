name: Control Room Stats V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'coordination/analytics/control-room-stats-v1/compiler.mjs'
      - 'coordination/analytics/control-room-stats-v1/compiler.test.mjs'
      - 'coordination/analytics/control-room-stats-v1/SCHEMA.json'
      - 'coordination/analytics/control-room-stats-v1/README.md'
      - '.github/workflows/control-room-stats-v1.yml'

permissions:
  contents: write

concurrency:
  group: control-room-stats-v1-main
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 1

      - name: Checkout gh-pages projections
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: projection
          fetch-depth: 1

      - name: Test compiler
        run: node source/coordination/analytics/control-room-stats-v1/compiler.test.mjs

      - name: Compile public projection snapshot
        run: |
          mkdir -p projection/coordination/analytics/control-room-stats-v1
          node source/coordination/analytics/control-room-stats-v1/compiler.mjs \
            --root source \
            --projection projection \
            --out projection/coordination/analytics/control-room-stats-v1/latest.json

      - name: Validate snapshot
        run: |
          node -e "const d=require('./projection/coordination/analytics/control-room-stats-v1/latest.json'); if(d.schema!=='prometeo.control-room-stats/v1') process.exit(1); if(d.source_mode!=='GITHUB_DURABLE_EVIDENCE_ONLY') process.exit(1); if(d.authority!=='OBSERVABILITY_ONLY') process.exit(1); if(!Array.isArray(d.truth_boundaries)||!d.truth_boundaries.length) process.exit(1);"

      - name: Publish gh-pages projection
        working-directory: projection
        run: |
          git config user.name "prometeo-stats-bot"
          git config user.email "prometeo-stats-bot@users.noreply.github.com"
          git add coordination/analytics/control-room-stats-v1/latest.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged"
            exit 0
          fi
          git commit -m "stats: publish control room snapshot [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin gh-pages
            git rebase origin/gh-pages
            if git push origin HEAD:gh-pages; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Upload compiled snapshot
        uses: actions/upload-artifact@v4
        with:
          name: control-room-stats-v1
          path: projection/coordination/analytics/control-room-stats-v1/latest.json
          if-no-files-found: error
          retention-days: 7
