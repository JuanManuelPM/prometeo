name: Part 3 P3-03 Durable Closure

on:
  push:
    branches: [candidate/part2-durable-metabolism-20260904]
    paths:
      - 'scripts/p3-03-close.mjs'
      - 'tests/part3-p3-00-rehydrate.test.mjs'
      - 'tests/part3-p3-01-closure.test.mjs'
      - 'tests/part3-p3-02-closure.test.mjs'
      - 'tests/part3-p3-03-closure.test.mjs'
      - '.github/workflows/part3-p3-03-close.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-p3-03:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize durable P3-03 closure
        run: node scripts/p3-03-close.mjs
      - name: Verify closure before commit
        run: |
          set -euo pipefail
          for f in tests/part2-*.test.mjs; do node "$f"; done
          node tests/part3-p3-00-rehydrate.test.mjs
          node tests/part3-p3-01-closure.test.mjs
          node tests/part3-p3-02-closure.test.mjs
          node tests/part3-p3-03-closure.test.mjs
          node tests/part3-p3-03-hop-continuity.test.mjs
          test "$(git hash-object navigator/index.html)" = "7ca5f3e223ca843e3f9e4b7be1e53b5b65dd3418"
          git diff --check
      - name: Commit durable closure
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then echo 'No closure diff to commit.'; exit 0; fi
          git config user.name 'Juan Manuel Pérez Menéndez'
          git config user.email '72280945+JuanManuelPM@users.noreply.github.com'
          git add receipts/ledger.jsonl state/CURRENT_GRAPH.json state/DOT_STATE.json state/PENDING.json coordination/PART3_GATE_MATRIX.json coordination/P3_03_HOP_CONTINUITY_CLOSURE.json
          git commit -m 'Close P3-03 hop continuity gate durably'
          git push origin HEAD:candidate/part2-durable-metabolism-20260904
