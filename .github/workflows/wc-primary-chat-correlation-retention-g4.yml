name: WC primary chat correlation retention G4

on:
  push:
    paths:
      - '.github/workflows/wc-primary-chat-correlation-retention-g4.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded opaque-correlation patch
        shell: bash
        run: |
          set -o pipefail
          python3 coordination/workers/helpers/wc-primary-chat-correlation-retention-g4.py 2>&1 | tee /tmp/correlation-patch.log
      - name: Run deterministic correlation harness
        run: node current-tree/control-v11/chat-canary/tests/correlation-retention-v1.test.cjs
      - name: Upload bounded diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wc-correlation-retention-g4-diagnostics
          path: /tmp/correlation-patch.log
          if-no-files-found: warn
      - name: Commit verified patch and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/wc-primary-chat-correlation-retention-g4.yml
          git rm coordination/workers/helpers/wc-primary-chat-correlation-retention-g4.py
          git add current-tree/control-v11/ingress-v1.js current-tree/control-v11/chat-canary/input-module-v1.js current-tree/control-v11/chat-canary/tests/correlation-retention-v1.test.cjs
          git commit -m 'primary-chat: retain validated opaque ingress correlation'
          git pull --rebase origin main
          git push origin HEAD:main
