name: Facultad V18 Regression

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/check-facultad-v18-regression.mjs'
      - '.github/workflows/facultad-v18-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
      - name: Verify pinned V18 bundle
        run: node scripts/check-facultad-v18-regression.mjs
