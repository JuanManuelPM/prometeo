name: Chat Recovery Control V2 Smoke

on:
  push:
    branches: [chat-recovery-control-v2-review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-recovery-control-v2-smoke
  cancel-in-progress: true

jobs:
  served-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - id: chrome
        uses: browser-actions/setup-chrome@v1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for public projection
        run: |
          set -euo pipefail
          JS="https://juanmanuelpm.github.io/prometeo/current-tree/control-v11/continuity-v1.js"
          IDX="https://juanmanuelpm.github.io/prometeo/coordination/chat-recovery/INDEX.json"
          for i in {1..48}; do
            if curl -fsSL --max-time 12 "$JS" | grep -Fq "PROMETEO_RECOVERY_CONTROL_V2" \
              && curl -fsSL --max-time 12 "$IDX" | grep -Fq "prometeo.chat-recovery-index/v2"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Browser verify Recovery in Historial
        env:
          CHROME: \${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9222 --user-data-dir=/tmp/recovery-v2-chrome about:blank >/tmp/recovery-v2-chrome.log 2>&1 &
          echo $! >/tmp/recovery-v2.pid
          trap 'kill "$(cat /tmp/recovery-v2.pid)" 2>/dev/null || true' EXIT
          for i in {1..80}; do
            curl -fsS "http://127.0.0.1:9222/json/version" >/dev/null 2>&1 && break
            sleep .25
          done

          node --input-type=module <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const pages=await (await fetch('http://127.0.0.1:9222/json/list')).json();
          const page=pages.find(x=>x.type==='page');
          if(!page?.webSocketDebuggerUrl)throw new Error('No Chrome page target');
          const ws=new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{
            ws.addEventListener('open',resolve,{once:true});
            ws.addEventListener('error',reject,{once:true});
          });

          let seq=0;
          const pending=new Map();
          ws.addEventListener('message',ev=>{
            const m=JSON.parse(String(ev.data));
            if(!m.id)return;
            const p=pending.get(m.id);
            if(!p)return;
            pending.delete(m.id);
            if(m.error)p.reject(new Error(m.error.message||JSON.stringify(m.error)));
            else p.resolve(m.result||{});
          });
          const send=(method,params={})=>{
            const id=++seq;
            return new Promise((resolve,reject)=>{
              pending.set(id,{resolve,reject});
              ws.send(JSON.stringify({id,method,params}));
            });
          };
          const evaluate=async expression=>{
            const r=await send('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});
            if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'Runtime evaluation failed');
            return r.result?.value;
          };

          await send('Page.enable');
          await send('Runtime.enable');
          await send('Emulation.setDeviceMetricsOverride',{width:1365,height:900,deviceScaleFactor:1,mobile:false,screenWidth:1365,screenHeight:900});
          const url='https://juanmanuelpm.github.io/prometeo/current-tree/control-v11/?view=historial&_recovery_v2='+Date.now();
          await send('Page.navigate',{url});

          let ready=false;
          for(let i=0;i<160;i++){
            const n=await evaluate('document.querySelectorAll(".recovery-card").length');
            if(Number(n)>=10){ready=true;break}
            await sleep(250);
          }
          if(!ready)throw new Error('Recovery cards never appeared');

          const result=await evaluate("(async()=>{"+
            "const cards=[...document.querySelectorAll('.recovery-card')];"+
            "const first=cards[0];"+
            "let copied='';"+
            "try{Object.defineProperty(navigator,'clipboard',{configurable:true,value:{writeText:async t=>{copied=String(t);window.__RECOVERY_COPIED=copied}}})}catch(e){navigator.clipboard.writeText=async t=>{copied=String(t);window.__RECOVERY_COPIED=copied}}"+
            "first.querySelector('[data-recovery-locator]')?.click();"+
            "await new Promise(r=>setTimeout(r,100));"+
            "const locator=window.__RECOVERY_COPIED||copied||'';"+
            "window.__RECOVERY_COPIED='';copied='';"+
            "first.querySelector('[data-recovery-adopt]')?.click();"+
            "await new Promise(r=>setTimeout(r,250));"+
            "const adopt=window.__RECOVERY_COPIED||copied||'';"+
            "return {"+
              "card_count:cards.length,"+
              "source:first.querySelector('.recovery-source')?.textContent||'',"+
              "recovered:first.querySelector('.recovery-recovered')?.textContent||'',"+
              "locator_ok:locator.includes('BUSCAR CHAT RECUPERADO V2')&&locator.includes('SEARCH_ANCHORS'),"+
              "adopt_ok:adopt.includes('ADOPTAR CHAT RECUPERADO V2')&&adopt.includes('SESSION_ID + SESSION_PIN')&&adopt.includes('RECOVERY_ENTRY'),"+
              "lineage_link:Boolean(first.querySelector('.recovery-lineage-link')?.href),"+
              "sessions_visible:document.querySelectorAll('#historySessions .history-session').length>0,"+
              "continuity_visible:Boolean(document.querySelector('#continuityCenter')),"+
              "unified_history_visible:Boolean(document.querySelector('#historyUnified .event')),"+
              "recovery_event_visible:[...document.querySelectorAll('#historyUnified .event')].some(x=>x.textContent.includes('RECOVERY')),"+
              "source_recovered_distinct:(first.querySelector('.recovery-source')?.textContent||'')!==(first.querySelector('.recovery-recovered')?.textContent||''),"+
              "no_secret_in_recovery:!document.querySelector('#recoverySection')?.textContent.includes('sb_publishable_')"+
            "};"+
          "})()");

          console.log(JSON.stringify(result,null,2));
          if(result.card_count<10)throw new Error('card_count '+result.card_count);
          for(const k of ['locator_ok','adopt_ok','lineage_link','sessions_visible','continuity_visible','unified_history_visible','recovery_event_visible','source_recovered_distinct','no_secret_in_recovery']){
            if(result[k]!==true)throw new Error(k+' failed');
          }
          if(!result.source||!result.recovered)throw new Error('time labels missing');
          ws.close();
          NODE
