name: Persist P3-13 Acceptance
on:
  push:
    branches: [candidate/prometeo-final-20260904]
    paths:
      - 'scripts/p3-p13-accept.mjs'
      - '.github/workflows/p3-p13-accept.yml'
permissions:
  contents: write
jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/prometeo-final-20260904
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize explicit acceptance
        run: node scripts/p3-p13-accept.mjs
      - name: Validate acceptance state
        run: |
          node -e "const fs=require('fs');for(const p of ['coordination/P3_13_ACCEPTANCE_SCOPE.json','state/CURRENT_GRAPH.json','state/PENDING.json'])JSON.parse(fs.readFileSync(p));"
          git diff --check
      - name: Commit acceptance state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coordination/P3_13_ACCEPTANCE_SCOPE.json state/CURRENT_GRAPH.json state/PENDING.json receipts/ledger.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'part3: record explicit P3-13 human acceptance'
          git push origin HEAD:candidate/prometeo-final-20260904
