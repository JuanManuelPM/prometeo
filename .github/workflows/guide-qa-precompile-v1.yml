name: Guide QA precompile v1

on:
  push:
    branches: [main]
    paths:
      - 'coordination/guide/QA_PRECOMPILE_V1.json'
      - 'coordination/guide/tests/qa-precompile-v1.fixtures.json'
      - 'scripts/guide-qa-precompile-v1.mjs'
      - 'scripts/check-guide-qa-precompile-v1.mjs'
      - '.github/workflows/guide-qa-precompile-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate QA contract and fixtures
        run: |
          node -e "JSON.parse(require('fs').readFileSync('coordination/guide/QA_PRECOMPILE_V1.json','utf8')); JSON.parse(require('fs').readFileSync('coordination/guide/tests/qa-precompile-v1.fixtures.json','utf8'))"
      - name: Run deterministic QA precompile regression
        run: node scripts/check-guide-qa-precompile-v1.mjs
