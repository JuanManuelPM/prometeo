name: Prometeo Efficiency Ratchet

on:
  push:
    branches: [main, gh-pages]
    paths:
      - 'wc'
      - 'g'
      - 'coordination/workers/**'
      - 'coordination/guide/**'
      - 'coordination/efficiency/**'
      - 'coordination/portfolio/recovery-policies/**'
      - 'coordination/portfolio/tests/fixed_generation_recovery_filter_v1.mjs'
      - 'coordination/portfolio/tests/started_signal_transport_fallback_v1.mjs'
      - 'coordination/portfolio/tests/parent_successor_recovery_policy_v1.mjs'
      - 'coordination/portfolio/tests/source_debt_recovery_basis_gate_v1.mjs'
      - 'coordination/portfolio/tests/project_guide_human_decision_gate_v1.mjs'
      - 'coordination/portfolio/tests/authority_boundary_recovery_gate_v1.mjs'
      - 'coordination/portfolio/tests/recovery_terminal_supersession_v1.mjs'
      - 'coordination/portfolio/tests/project_coverage_allocator_v1.mjs'
      - 'coordination/portfolio/tests/batched_lane_sharding_v1.mjs'
      - 'coordination/portfolio/tests/claim_frontier_compact_v1.mjs'
      - 'coordination/portfolio/tests/fast_allocator_capability_fit_v1.mjs'
      - 'coordination/portfolio/tests/capability_aware_frontier_pressure_v1.mjs'
      - 'coordination/portfolio/tests/guide_rescate_capability_recovery_pressure_v1.mjs'
      - 'coordination/portfolio/tests/efficiency_recent_transport_regression_v1.mjs'
      - 'coordination/portfolio/tests/claim_transport_classification_v1.mjs'
      - 'coordination/portfolio/tests/efficiency_recent_no_allocation_regression_v1.mjs'
      - 'coordination/portfolio/tests/efficiency_recent_ttfa_regression_v1.mjs'
      - 'coordination/portfolio/derived/audio-text-to-speech/portfolio-tts-generic-text-surface-browser-smoke-v1.json'
      - 'coordination/portfolio/derived/audio-text-to-speech/portfolio-tts-generic-text-surface-verify-v1.json'
      - 'coordination/portfolio/derived/audio-text-to-speech/portfolio-tts-existing-cache-get-verify-v1.json'
      - 'coordination/portfolio/derived/audio-speech-to-text/portfolio-stt-live-canary-entrypoint-v1.json'
      - '.github/workflows/live-feed.yml'
      - '.github/workflows/worker-runtime-events.yml'
      - '.github/workflows/efficiency-ratchet.yml'
      - '.github/workflows/worker-bootstrap.yml'
      - '.github/scripts/normalize-live-feed.mjs'
      - '.github/scripts/augment-live-role-workers.mjs'
      - 'scripts/check-efficiency-ratchet.mjs'
      - 'scripts/build-efficiency-snapshot.mjs'
      - 'scripts/build-fast-allocator.mjs'
      - 'scripts/build-claim-frontier.mjs'
      - 'scripts/build-worker-runtime.mjs'
      - 'scripts/build-worker-bootstrap.mjs'
      - 'scripts/apply-project-coverage.mjs'
      - 'tests/fast-claim-payload-contract-v1.test.mjs'
      - 'tests/worker-runtime-events-v1.test.mjs'
      - 'tests/worker-strategy-experiment-v1.test.mjs'
      - 'tests/worker-growth-pipeline-v1.test.mjs'
      - 'tests/guide-worker-handoff-v1.test.mjs'
      - 'tests/worker-fresh-launch-v1.test.mjs'
      - 'tests/worker-residency-integrity-v1.test.mjs'
      - 'scripts/worker-residency-integrity.mjs'
      - 'wc/**'
      - 'live/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: efficiency-ratchet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-non-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 1
      - name: Checkout public gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1
      - name: Compile canonical worker bootstrap projection
        run: node source/scripts/build-worker-bootstrap.mjs source site/wc/index.html
      - name: Check fixed-generation recovery filter
        run: node source/coordination/portfolio/tests/fixed_generation_recovery_filter_v1.mjs
      - name: Check post-claim STARTED fallback
        run: node source/coordination/portfolio/tests/started_signal_transport_fallback_v1.mjs
      - name: Check delegated parent successor recovery policy
        run: node source/coordination/portfolio/tests/parent_successor_recovery_policy_v1.mjs
      - name: Check SOURCE_DEBT recovery basis gate
        run: node source/coordination/portfolio/tests/source_debt_recovery_basis_gate_v1.mjs
      - name: Check project guide Human decision gate
        run: node source/coordination/portfolio/tests/project_guide_human_decision_gate_v1.mjs
      - name: Check authority-bound recovery gate
        run: node source/coordination/portfolio/tests/authority_boundary_recovery_gate_v1.mjs
      - name: Check terminal supersession recovery semantics
        run: node source/coordination/portfolio/tests/recovery_terminal_supersession_v1.mjs
      - name: Check project coverage scheduler
        run: node source/coordination/portfolio/tests/project_coverage_allocator_v1.mjs
      - name: Check unified batch sharding
        run: node source/coordination/portfolio/tests/batched_lane_sharding_v1.mjs
      - name: Check compact claim frontier
        run: node source/coordination/portfolio/tests/claim_frontier_compact_v1.mjs
      - name: Check fast allocator capability fit
        run: node source/coordination/portfolio/tests/fast_allocator_capability_fit_v1.mjs
      - name: Check capability-aware frontier pressure
        run: node source/coordination/portfolio/tests/capability_aware_frontier_pressure_v1.mjs
      - name: Check capability-aware recovery rescate pressure
        run: node source/coordination/portfolio/tests/guide_rescate_capability_recovery_pressure_v1.mjs
      - name: Check recent transport efficiency regression
        run: node source/coordination/portfolio/tests/efficiency_recent_transport_regression_v1.mjs
      - name: Check claim transport classification
        run: node source/coordination/portfolio/tests/claim_transport_classification_v1.mjs
      - name: Check recent no-allocation efficiency regression
        run: node source/coordination/portfolio/tests/efficiency_recent_no_allocation_regression_v1.mjs
      - name: Check recent TTFA efficiency regression
        run: node source/coordination/portfolio/tests/efficiency_recent_ttfa_regression_v1.mjs
      - name: Check fast-claim and role-frontier contract
        run: node --test source/tests/fast-claim-payload-contract-v1.test.mjs
      - name: Check worker wave runtime contract
        run: node source/tests/worker-runtime-events-v1.test.mjs
      - name: Check post-ownership strategy experiment
        run: node source/tests/worker-strategy-experiment-v1.test.mjs source
      - name: Check launch-to-value growth pipeline
        run: node source/tests/worker-growth-pipeline-v1.test.mjs source
      - name: Check exhaustive Guide worker handoff
        run: node source/tests/guide-worker-handoff-v1.test.mjs source
      - name: Check fresh-launch anti-replay
        run: node source/tests/worker-fresh-launch-v1.test.mjs source site
      - name: Check pooled worker residency integrity
        run: node source/tests/worker-residency-integrity-v1.test.mjs
      - name: Check ratchet invariants
        run: node source/scripts/check-efficiency-ratchet.mjs source site
