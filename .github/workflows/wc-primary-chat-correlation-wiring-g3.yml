name: WC primary chat correlation wiring G3

on:
  push:
    paths:
      - '.github/workflows/wc-primary-chat-correlation-wiring-g3.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply coherent helper wiring
        run: python3 coordination/workers/helpers/wc-primary-chat-correlation-wiring-g3.py
      - name: Verify syntax and helper contract
        shell: bash
        run: |
          set -euo pipefail
          node --check current-tree/control-v11/ingress-v1.js
          node --check current-tree/control-v11/chat-canary/input-module-v1.js
          node coordination/portfolio/tests/primary_chat_private_ingress_correlation_helper_v1.mjs
      - name: Verify deterministic integration
        run: node current-tree/control-v11/chat-canary/tests/correlation-retention-v1.test.cjs
      - name: Commit verified wiring and remove temporary executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/wc-primary-chat-correlation-wiring-g3.yml
          git rm coordination/workers/helpers/wc-primary-chat-correlation-wiring-g3.py
          git add current-tree/control-v11/ingress-v1.js current-tree/control-v11/chat-canary/input-module-v1.js current-tree/control-v11/chat-canary/tests/correlation-retention-v1.test.cjs
          git commit -m 'primary-chat: wire canonical private correlation helper'
          git pull --rebase origin main
          git push origin HEAD:main
