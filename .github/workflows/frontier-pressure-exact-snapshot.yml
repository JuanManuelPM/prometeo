name: Frontier Pressure Exact Snapshot

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-hex main commit SHA to verify
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-pressure-exact-snapshot.yml'
      - 'coordination/portfolio/FRONTIER_PRESSURE_REQUEST_PROTOCOL_V1.md'
      - 'coordination/portfolio/frontier-pressure-requests/*.json'
      - 'scripts/compile-frontier-pressure-base.mjs'
      - 'scripts/compile-frontier-pressure.mjs'
      - 'scripts/resolve-frontier-pressure-request.mjs'
      - 'scripts/run-frontier-pressure-exact-snapshot.mjs'
      - 'tests/frontier-pressure-request-resolver-v1.test.mjs'
      - 'tests/frontier-pressure-exact-snapshot-executor-v1.test.mjs'
      - 'tests/frontier-pressure-compiler-v1.test.mjs'
      - 'tests/frontier-pressure-dedupe-repair-v1.test.mjs'
      - 'tests/frontier-pressure-superseded-owner-suppression-v1.test.mjs'
      - 'tests/frontier-pressure-routable-scope-parity-v1.test.mjs'

permissions:
  contents: read

concurrency:
  group: frontier-pressure-exact-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout request envelope and resolver
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate request resolver regression
        if: github.event_name == 'push'
        shell: bash
        run: node --test tests/frontier-pressure-request-resolver-v1.test.mjs

      - name: Resolve exact source SHA
        id: request
        shell: bash
        env:
          DISPATCH_SHA: ${{ inputs.source_sha }}
          EVENT_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          node scripts/resolve-frontier-pressure-request.mjs \
            --root . \
            --event-name "$EVENT_NAME" \
            --dispatch-sha "$DISPATCH_SHA" \
            --before-sha "$BEFORE_SHA" \
            --event-sha "$EVENT_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.source_sha }}
          fetch-depth: 1

      - name: Verify checkout identity
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          REQUEST_MODE: ${{ steps.request.outputs.request_mode }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          REQUEST_PATH: ${{ steps.request.outputs.request_path }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$SOURCE_SHA"
          mkdir -p artifacts
          printf '{"requested_source_sha":"%s","checked_out_source_sha":"%s","request_mode":"%s","request_id":"%s","request_path":"%s"}\n' \
            "$SOURCE_SHA" "$ACTUAL_SHA" "$REQUEST_MODE" "$REQUEST_ID" "$REQUEST_PATH" \
            > artifacts/frontier-pressure-request.json

      - name: Run executor and regression tests with durable receipt
        id: regressions
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -uo pipefail
          mkdir -p artifacts
          if (
            set -euo pipefail
            node --test tests/frontier-pressure-exact-snapshot-executor-v1.test.mjs
            node --test tests/frontier-pressure-compiler-v1.test.mjs
            node --test tests/frontier-pressure-dedupe-repair-v1.test.mjs
            node --test tests/frontier-pressure-superseded-owner-suppression-v1.test.mjs
            node --test tests/frontier-pressure-routable-scope-parity-v1.test.mjs
            node scripts/check-efficiency-ratchet.mjs .
          ) 2>&1 | tee artifacts/frontier-pressure-regression.log; then
            printf '{"schema":"prometeo.frontier-pressure-regression-evidence/v1","status":"PASS","source_sha":"%s"}\n' "$SOURCE_SHA" > artifacts/frontier-pressure-regression-evidence.json
          else
            code=${PIPESTATUS[0]}
            printf '{"schema":"prometeo.frontier-pressure-regression-evidence/v1","status":"FAIL","source_sha":"%s","exit_status":%s}\n' "$SOURCE_SHA" "$code" > artifacts/frontier-pressure-regression-evidence.json
            exit "$code"
          fi

      - name: Execute compiler on exact snapshot
        id: execute
        continue-on-error: true
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          node scripts/run-frontier-pressure-exact-snapshot.mjs \
            --root . \
            --source-sha "$SOURCE_SHA" \
            --out artifacts/frontier-pressure-exact-snapshot-evidence.json \
            --compiler-out artifacts/frontier-pressure.json \
            --canary-job portfolio-recovery-generation-fixed-fixture-filter-v1

      - name: Upload exact-snapshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-pressure-exact-${{ steps.request.outputs.source_sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Summarize evidence
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/frontier-pressure-regression-evidence.json ]]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/frontier-pressure-regression-evidence.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f artifacts/frontier-pressure-exact-snapshot-evidence.json ]]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/frontier-pressure-exact-snapshot-evidence.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail closed when exact-snapshot execution failed
        if: steps.execute.outcome != 'success'
        shell: bash
        run: exit 1
