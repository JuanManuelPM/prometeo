name: Persistencia V6 browser proof
on:
  push:
    branches:
      - integration/persistencia-visual-77-78-20261009
  pull_request:
    branches:
      - feature/retomar-live-evidence-hop3-20261009
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node tv/chat/relevo/tests/retomar-v6-original-real-dom-v1.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistencia-v6-candidate-proof
          path: artifacts/retomar-v6-real/
          retention-days: 14
