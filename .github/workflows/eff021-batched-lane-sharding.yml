name: EFF021 batched lane sharding

on:
  push:
    paths:
      - 'wc'
      - 'coordination/workers/FAST_ALLOCATION_PROTOCOL_V1.md'
      - 'coordination/efficiency/RATCHET_BASELINE_V1.json'
      - 'coordination/portfolio/tests/batched_lane_sharding_v1.mjs'
      - '.github/workflows/eff021-batched-lane-sharding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node coordination/portfolio/tests/batched_lane_sharding_v1.mjs
