name: Publish Legacy Prometeo Capture Donors

on:
  push:
    branches: [main]
    paths:
      - 'shared/prometeo-shell/**'
      - '.github/workflows/inject-prometeo-shell.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prometeo-legacy-capture-assets
  cancel-in-progress: false

jobs:
  publish-assets-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate legacy donors
        run: |
          set -euo pipefail
          node --check shared/prometeo-shell/v1/db.js
          node --check shared/prometeo-shell/v1/voice.js
          node --check shared/prometeo-shell/v1/prometeo-shell.js
          node --check shared/prometeo-shell/v1/prometeo-voice-worker.js
          node --check shared/prometeo-shell/v2/sync.js
          node --check shared/prometeo-shell/v2/prometeo-shell.js
          test -s shared/prometeo-shell/v1/shell.css
          test -s shared/prometeo-shell/v2/shell.css
      - name: Publish donor assets without mutating product HTML
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin gh-pages
          git worktree add /tmp/prometeo-pages origin/gh-pages
          mkdir -p /tmp/prometeo-pages/shared/prometeo-shell
          rsync -a --delete shared/prometeo-shell/ /tmp/prometeo-pages/shared/prometeo-shell/
          cd /tmp/prometeo-pages
          git add shared/prometeo-shell
          if git diff --cached --quiet; then
            echo 'Legacy donor assets already current.'
            exit 0
          fi
          git commit -m 'shell: publish legacy Capture donor assets only'
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages

# P4 authority note:
# This workflow deliberately does NOT inject a Capture shell into Navigator or
# arbitrary page HTML. P4 Capture owns integration through a single declared
# host/canary/release path. V1/V2 remain donors; existence is not participation.
