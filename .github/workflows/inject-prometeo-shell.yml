name: Retired Prometeo Global Shell Injector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-retired:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify legacy shell stays inert
        run: |
          set -euo pipefail
          grep -q 'RETIRED COMPATIBILITY STUB' shared/prometeo-shell/v2/prometeo-shell.js
          ! grep -q "host.attachShadow" shared/prometeo-shell/v2/prometeo-shell.js
          echo 'Legacy per-page shell injection is retired. Universal Shell is the sole global UI owner.'
