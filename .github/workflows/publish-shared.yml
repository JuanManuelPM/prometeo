name: Publish Prometeo Shared Commons
on:
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - '.github/workflows/publish-shared.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize shared commons on Pages branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin gh-pages
          git worktree add /tmp/prometeo-pages origin/gh-pages
          mkdir -p /tmp/prometeo-pages/shared
          rsync -a --delete shared/ /tmp/prometeo-pages/shared/
          cd /tmp/prometeo-pages
          git add shared
          if git diff --cached --quiet; then
            echo 'Shared commons already current.'
            exit 0
          fi
          git commit -m 'shared: publish Prometeo Commons from main'
          git push origin HEAD:gh-pages
