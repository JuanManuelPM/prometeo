name: trail-yaw-validate-once

on:
  push:
    paths:
      - ".github/workflows/trail-yaw-validate-once.yml"

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Trail yaw/backface patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("visuals/trail-lab/index.html").read_text()
          m=re.search(r"<script>([\s\S]*?)</script>",s)
          assert m, "inline script missing"
          script=m.group(1)
          Path("/tmp/trail.js").write_text(script)
          required=[
            "function updateVisualYaw",
            "function yawAppearance",
            "s.yaw=yawValue",
            "vz=(z-pz)/dt",
            "drawWhole(x,y,z,visualAngle,1.045,1,true,visualYaw)",
            "SHADE_BRIGHTNESS=[.22,.34,.46,.58,.70,.82,.90]"
          ]
          for token in required:
              assert token in script, f"missing {token}"
          assert "scale(-" not in script, "negative x scale mirror found"
          assert "http://" not in script and "https://" not in script, "external runtime image URL found"
          state=Path("visuals/fronts/trail/state.json").read_text()
          assert '"current_blob_sha": "d3891dc6059ee1e54544f374503de204c9d6a243"' in state
          assert "2.5D facing / yaw" in Path("visuals/fronts/trail/decisions.md").read_text()
          assert "2.5D yaw / backface hiding" in Path("visuals/fronts/trail/architecture.md").read_text()
          print("Trail yaw static checks OK")
          PY
          node --check /tmp/trail.js
          echo "node syntax OK"
