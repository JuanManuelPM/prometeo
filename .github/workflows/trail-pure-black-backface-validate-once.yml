name: trail-pure-black-backface-validate-once

on:
  push:
    paths:
      - ".github/workflows/trail-pure-black-backface-validate-once.yml"

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate pure-black backface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("visuals/trail-lab/index.html").read_text()
          m=re.search(r"<script>([\s\S]*?)</script>",s)
          assert m, "inline script missing"
          script=m.group(1)
          Path("/tmp/trail.js").write_text(script)

          required=[
            "bc.fillStyle='#000000'",
            "const backSource=backShadeSprites[0]",
            "const source=isFront?frontSource:backSource",
            "const source=rear?backSource:frontSource"
          ]
          for token in required:
              assert token in script, f"missing {token}"

          forbidden=[
            "const rearValue=",
            "const backBrightness=",
            "backShadeSprites[shadeIndexFor(backBrightness)]"
          ]
          for token in forbidden:
              assert token not in script, f"gray rear path remains: {token}"

          state=Path("visuals/fronts/trail/state.json").read_text()
          assert '"current_blob_sha": "3cacb066945b31a22a13786ca1cc9a11fd1ec8b5"' in state
          assert '"color": "#000000"' in state
          assert '"brightness_variation": false' in state

          decisions=Path("visuals/fronts/trail/decisions.md").read_text()
          assert "## Backface is always pure black" in decisions

          print("pure-black backface invariants OK")
          PY
          node --check /tmp/trail.js
          echo "node syntax OK"
