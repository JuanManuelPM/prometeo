name: Prometeo Agent Runtime v2
on:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prometeo-agent-runtime-v2
  cancel-in-progress: true
jobs:
  compile-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch all worker branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
      - name: Compile runtime packets
        run: node scripts/build-agent-runtime.mjs --out dist/agent-runtime
      - name: Validate runtime
        run: node tests/agent-runtime-v2.test.mjs
      - name: Publish derived runtime only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin gh-pages
          git worktree add /tmp/prometeo-pages origin/gh-pages
          rm -rf /tmp/prometeo-pages/agent-runtime
          mkdir -p /tmp/prometeo-pages/agent-runtime
          cp -R dist/agent-runtime/. /tmp/prometeo-pages/agent-runtime/
          cd /tmp/prometeo-pages
          git add agent-runtime
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'runtime: publish compiled multi-chat work packets'
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
