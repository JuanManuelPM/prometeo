name: SECUENCIA · Flow and browser acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "presentacion/fabrica/**"
      - ".github/workflows/presentacion-fabrica-browser-qa.yml"
permissions:
  contents: read
concurrency:
  group: prometeo-av-browser-qa
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify contracts and recipes
        run: node --test presentacion/fabrica/tests/*.test.mjs
      - name: Install representative Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser E2E and capture visual evidence
        run: node presentacion/fabrica/tests/browser-live.mjs
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: av-factory-browser-qa
          path: artifacts/av-factory/
          if-no-files-found: warn
          retention-days: 14
