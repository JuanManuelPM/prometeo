name: WC legacy capability final verify 8f2c91

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wc-legacy-capability-final-verify-8f2c91.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 1
      - name: Checkout public gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1
      - name: Capability regression
        run: node source/coordination/portfolio/tests/fast_allocator_capability_fit_v1.mjs
      - name: Ratchet invariants
        run: node source/scripts/check-efficiency-ratchet.mjs source site
