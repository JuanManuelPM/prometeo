name: Prometeo Live Pages

on:
  push:
    branches: [main]
    paths:
      - 'coordination/live/PAGE_WATCH_REGISTRY_V1.json'
      - 'coordination/pages/contexts/CNY001.json'
      - 'coordination/pages/plates/CNY001.json'
      - 'coordination/pages/publications/CNY001/**'
      - 'coordination/portfolio/tests/cny001_registry_handoff_static_gate_v1.mjs'
      - '.github/workflows/live-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prometeo-live-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 1
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 20
      - name: Verify CNY001 registry handoff gate
        shell: bash
        run: |
          set -euo pipefail
          node source/coordination/portfolio/tests/cny001_registry_handoff_static_gate_v1.mjs source site

      - name: Publish page registry
        shell: bash
        run: |
          set -euo pipefail
          git -C site config user.name github-actions[bot]
          git -C site config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C site pull --ff-only origin gh-pages
          mkdir -p site/live
          cp source/coordination/live/PAGE_WATCH_REGISTRY_V1.json site/live/pages.json
          git -C site add live/pages.json
          if git -C site diff --cached --quiet; then exit 0; fi
          git -C site commit -m "live: refresh page watch registry"
          for n in 1 2 3; do
            if git -C site push origin HEAD:gh-pages; then exit 0; fi
            git -C site fetch origin gh-pages
            git -C site rebase origin/gh-pages
          done
          exit 1
