name: guide-atomic-work-decomposer-recovery-revalidation-v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/guide-atomic-work-decomposer-recovery-revalidation-v1.yml'
      - 'coordination/guide/ATOMIC_TASK_V1.json'
      - 'coordination/guide/GUIDE_ATOMIC_DECOMPOSITION_V1.md'
      - 'coordination/guide/tests/atomic-work-decomposer-v1.fixtures.json'
      - 'scripts/guide-atomic-work-decomposer-v1.mjs'
      - 'scripts/check-guide-atomic-work-decomposer-v1.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-guide-atomic-work-decomposer-v1.mjs
