name: Channels JavaScript syntax

on:
  push:
    paths:
      - 'pages/lab/channels/**/*.js'
      - '.github/workflows/channels-js-syntax.yml'
  pull_request:
    paths:
      - 'pages/lab/channels/**/*.js'
      - '.github/workflows/channels-js-syntax.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "checking $file"
            node --check "$file"
          done < <(find pages/lab/channels -type f -name '*.js' -print0 | sort -z)
