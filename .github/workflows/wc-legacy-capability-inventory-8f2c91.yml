name: WC legacy capability inventory 8f2c91

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wc-legacy-capability-inventory-8f2c91.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inventory singular legacy capability fields
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('coordination/portfolio/derived')
          rows=[]
          for p in sorted(root.rglob('*.json')):
              try: d=json.loads(p.read_text())
              except Exception: continue
              if 'capability_required' in d:
                  rows.append({'path':str(p),'job_id':d.get('job_id'),'value':d.get('capability_required')})
          print('LEGACY_CAPABILITY_REQUIRED_INVENTORY='+json.dumps(rows,separators=(',',':'),sort_keys=True))
          print('LEGACY_CAPABILITY_REQUIRED_COUNT='+str(len(rows)))
          PY
