name: elastic-kernel-recovery-storm-harness-v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/elastic-kernel-recovery-storm-harness-v1.yml'
      - 'coordination/portfolio/tests/elastic_kernel_recovery_storm_harness_v1.mjs'
      - 'coordination/portfolio/tests/worker_liveness_fast_recovery_v1.mjs'
      - 'coordination/portfolio/tests/portfolio_pin_race_v1.mjs'
      - 'coordination/portfolio/tests/repeated_capability_boundary_gate_v1.mjs'
      - 'coordination/portfolio/tests/fixed_generation_recovery_filter_v1.mjs'
      - 'coordination/portfolio/tests/recovery_terminal_supersession_v1.mjs'
      - 'coordination/portfolio/tests/local_batch_e5_single_generation_recovery_v1.mjs'
      - 'coordination/portfolio/tests/authority_boundary_recovery_gate_v1.mjs'
      - 'coordination/portfolio/tests/parent_successor_recovery_policy_v1.mjs'
      - 'coordination/portfolio/tests/new_evidence_gate_recovery_filter_v1.mjs'
      - 'scripts/build-fast-allocator.mjs'
      - '.github/scripts/build-live-feed.mjs'
      - 'scripts/build-claim-frontier.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-storm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run recovery storm harness
        run: node coordination/portfolio/tests/elastic_kernel_recovery_storm_harness_v1.mjs
