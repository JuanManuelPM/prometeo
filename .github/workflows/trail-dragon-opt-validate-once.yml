name: trail-dragon-opt-validate-once

on:
  push:
    paths:
      - ".github/workflows/trail-dragon-opt-validate-once.yml"

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate optimized dragon tail
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("visuals/trail-lab/index.html").read_text()
          m=re.search(r"<script>([\s\S]*?)</script>",s)
          assert m, "inline script missing"
          script=m.group(1)
          Path("/tmp/trail.js").write_text(script)

          required=[
            "const TRAIL_SPACING=reduced?14:12",
            "const CURVED_DETAIL_T=.82",
            "const scale=lerp(.22,.98,scaleCurve)",
            "function drawCheapSurface",
            "const widthScale=lerp(1,.30,Math.pow(side,.82))",
            "function tailWaveOffset",
            "Math.sin(pathD*.045)*amp",
            "function stampByDistance",
            "stampTravel+=travel",
            "trailDistance+=travel",
            "s.pathD=trailDistance",
            "if(isHead||trailT>=CURVED_DETAIL_T)drawCurvedSurface",
            "else drawCheapSurface(source,w,h,yawAngle)",
            "return {rear,rearAmount,sideAngle,alpha:1}",
            "alpha:1"
          ]
          for token in required:
              assert token in script, f"missing {token}"

          forbidden=[
            "alpha:lerp(1,.68",
            "ctx.globalAlpha=alpha*lerp",
            "const alpha=(isHead?1:p.alpha)"
          ]
          for token in forbidden:
              assert token not in script, f"transparency path remains: {token}"

          assert "http://" not in script and "https://" not in script, "external runtime URL found"

          state=Path("visuals/fronts/trail/state.json").read_text()
          assert '"current_blob_sha": "780146353aaa62558dfb32fb19bbc25f03e494bc"' in state
          assert '"oldest_scale_3d": 0.22' in state
          decisions=Path("visuals/fronts/trail/decisions.md").read_text()
          assert "## Dragon-tail hierarchy / optimization" in decisions
          arch=Path("visuals/fronts/trail/architecture.md").read_text()
          assert "## Dragon-tail optimization" in arch
          assert "TRAIL_SPACING = 12px" in arch
          print("Trail dragon optimization static checks OK")
          PY
          node --check /tmp/trail.js
          echo "node syntax OK"
