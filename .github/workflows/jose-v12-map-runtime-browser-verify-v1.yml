name: Jose V12 map runtime browser verify v1
run-name: Jose V12 runtime verify · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - 'coordination/portfolio/tests/jose_v12_map_runtime_browser_verify_v1.mjs'
      - '.github/workflows/jose-v12-map-runtime-browser-verify-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jose-v12-map-runtime-browser-verify-v1
  cancel-in-progress: true

jobs:
  browser-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install representative Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify exact current Jose V12 LAB candidate
        env:
          JOSE_V12_TIMEOUT_MS: '45000'
        run: node coordination/portfolio/tests/jose_v12_map_runtime_browser_verify_v1.mjs
      - name: Upload bounded runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jose-v12-map-runtime-browser-evidence
          path: artifacts/jose-v12-map-runtime-browser-verify/
          if-no-files-found: error
          retention-days: 14
