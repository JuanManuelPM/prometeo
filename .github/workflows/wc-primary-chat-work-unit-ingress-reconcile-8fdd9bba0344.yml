# trigger-after-registration: wc-20261001T184827Z-8fdd9bba0344
name: WC primary chat work-unit ingress reconcile 8fdd9bba0344

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wc-primary-chat-work-unit-ingress-reconcile-8fdd9bba0344.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile authenticated ingress into Work Unit projection
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, datetime

          worker_id = 'wc-20261001T184827Z-8fdd9bba0344'
          job_id = 'portfolio-primary-chat-work-unit-ingress-reconcile-v1'
          generation = 2
          authority_ref = 'coordination/portfolio/pins/portfolio-primary-chat-work-unit-ingress-reconcile-v1/G000002.json'
          projection_path = pathlib.Path('coordination/portfolio/derived/INTERACTIVE_WORK_UNITS_V1.json')
          receipt_path = pathlib.Path(f'coordination/portfolio/evidence/{job_id}/RECONCILE-{worker_id}-G000002.json')
          evidence = [
              'coordination/portfolio/returns/portfolio-chat-canary-auth-bridge-reuse-v1/RETURN-wc-20261001T171811Z-841dbc04e5b8-G000007-VERIFIED.json',
              'coordination/portfolio/evidence/portfolio-chat-canary-auth-bridge-reuse-v1/VERIFIED-wc-20261001T171811Z-841dbc04e5b8-G000007.json',
              'coordination/portfolio/returns/portfolio-primary-chat-ingress-canary-regression-harness-v1/RETURN-wc-20261001T171811Z-841dbc04e5b8-G000001-VERIFIED.json',
              'coordination/portfolio/evidence/portfolio-primary-chat-ingress-canary-regression-harness-v1/REGRESSION_RECEIPT-wc-20261001T171811Z-841dbc04e5b8.json',
              'coordination/portfolio/derived/prometeo-autonomous-growth/portfolio-primary-chat-canary-gh-36901064582-1.json'
          ]
          proof_completed_at = '2026-10-01T17:41:30Z'
          now = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')

          data = json.loads(projection_path.read_text())
          wu = next(x for x in data['work_units'] if x['work_unit_id'] == 'WU-CHAT-CANARY-DURABLE-MESSAGE-V1')
          before = {
              'progress': wu['progress'],
              'current_stage': wu['current_stage'],
              'latest_checkpoint_id': wu['latest_checkpoint_id'],
              'authenticated_ingress_status': next(s for s in wu['steps'] if s['step_id']=='AUTHENTICATED_INGRESS')['status']
          }
          step = next(s for s in wu['steps'] if s['step_id'] == 'AUTHENTICATED_INGRESS')
          step['status'] = 'DONE'
          step['completed_at'] = proof_completed_at
          step['time_confidence'] = 'EVIDENCE_TIME'
          step['evidence'] = evidence
          step.pop('boundary', None)
          step['truth_boundary'] = 'Verified public-sanitized authenticated ingress transport with queued=true and durable coordination refs; does not prove representative served E2E, response-job completion, private human-message transport, Current, Human Accepted or Served state.'

          total = sum(int(s['weight']) for s in wu['steps'])
          done = sum(int(s['weight']) for s in wu['steps'] if s['status'] == 'DONE')
          progress = round(done / total * 100, 6)
          assert total == 100, total
          assert progress == 80, progress
          assert next(s for s in wu['steps'] if s['step_id']=='E2E_VERIFICATION')['status'] == 'PENDING'

          checkpoint_id = 'CP-CHAT-CANARY-006-AUTHENTICATED-INGRESS'
          checkpoint = {
              'checkpoint_id': checkpoint_id,
              'stage': 'AUTHENTICATED_INGRESS',
              'status': 'DONE',
              'record_created_at': now,
              'record_created_at_confidence': 'EXACT_FROM_PROJECTION_RECONCILIATION',
              'published_at': now,
              'published_at_confidence': 'EXACT_FROM_PROJECTION_RECONCILIATION',
              'summary': 'Reconciled durable ingress evidence into the non-authoritative Work Unit. Authenticated ingress is now DONE from verified queued=true transport plus exact durable refs. Representative served E2E remains independently PENDING.',
              'evidence': evidence,
              'next': 'E2E_VERIFICATION',
              'resume': 'Do not redo authenticated ingress. Resume from representative served E2E at 80% evidence-backed progress; preserve the Work Unit as observability only.'
          }
          wu['checkpoints'] = [c for c in wu.get('checkpoints', []) if c.get('checkpoint_id') != checkpoint_id]
          wu['checkpoints'].append(checkpoint)
          wu['progress'] = progress
          wu['progress_derivation'] = 'done weights 15+20+20+10+5+10 = 80 of total 100; E2E_VERIFICATION 20 remains pending'
          wu['current_stage'] = 'E2E_VERIFICATION'
          wu['status'] = 'PARTIAL'
          wu['observability_state']['durable_work_state'] = 'PARTIAL'
          wu['observability_state']['liveness_claim'] = False
          wu['latest_checkpoint_id'] = checkpoint_id
          wu['latest_checkpoint_ref'] = f'coordination/portfolio/derived/INTERACTIVE_WORK_UNITS_V1.json#{checkpoint_id}'
          wu['last_progress_at'] = now
          wu['last_progress_at_confidence'] = 'EXACT_FROM_PROJECTION_RECONCILIATION'
          wu['next_action'] = 'Run representative served E2E. Authenticated ingress is durably verified; E2E remains independent and pending.'
          wu['resume_instruction'] = 'Resume from E2E_VERIFICATION at 80% evidence-backed progress. Do not redo authenticated ingress and do not infer E2E completion from transport proof.'
          for ref in evidence:
              if ref not in wu['latest_evidence']:
                  wu['latest_evidence'].append(ref)
          data['updated_at'] = now
          data['updated_at_confidence'] = 'EXACT_FROM_PROJECTION_RECONCILIATION'
          projection_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          reloaded = json.loads(projection_path.read_text())
          rwu = next(x for x in reloaded['work_units'] if x['work_unit_id'] == 'WU-CHAT-CANARY-DURABLE-MESSAGE-V1')
          auth = next(s for s in rwu['steps'] if s['step_id']=='AUTHENTICATED_INGRESS')
          e2e = next(s for s in rwu['steps'] if s['step_id']=='E2E_VERIFICATION')
          checks = {
              'work_unit_reloaded': rwu['work_unit_id'] == 'WU-CHAT-CANARY-DURABLE-MESSAGE-V1',
              'authenticated_ingress_done': auth['status'] == 'DONE',
              'authenticated_ingress_completed_at_from_proof': auth['completed_at'] == proof_completed_at,
              'weighted_progress_recomputed_80': rwu['progress'] == 80,
              'e2e_still_pending': e2e['status'] == 'PENDING',
              'projection_non_authoritative_preserved': rwu['projection_status'] == 'NON_AUTHORITATIVE_EXECUTION_PROJECTION'
          }
          assert all(checks.values()), checks
          receipt_path.parent.mkdir(parents=True, exist_ok=True)
          receipt = {
              'schema': 'prometeo.work-unit-reconciliation-receipt/v1',
              'job_id': job_id,
              'worker_id': worker_id,
              'generation': generation,
              'authority_ref': authority_ref,
              'verified_at': now,
              'work_unit_ref': 'coordination/portfolio/derived/INTERACTIVE_WORK_UNITS_V1.json#WU-CHAT-CANARY-DURABLE-MESSAGE-V1',
              'before': before,
              'after': {
                  'progress': rwu['progress'],
                  'current_stage': rwu['current_stage'],
                  'latest_checkpoint_id': rwu['latest_checkpoint_id'],
                  'authenticated_ingress_status': auth['status'],
                  'authenticated_ingress_completed_at': auth['completed_at'],
                  'e2e_status': e2e['status']
              },
              'evidence': evidence,
              'reconstruction_checks': checks,
              'truth_boundary': 'Projection reconciliation only. This receipt proves the Work Unit can be reconstructed with AUTHENTICATED_INGRESS DONE at 80% weighted progress while E2E_VERIFICATION stays PENDING. It grants no scheduler, queue, Current, acceptance, promotion, liveness or representative E2E authority.'
          }
          receipt_path.write_text(json.dumps(receipt, indent=2, ensure_ascii=False) + '\n')
          PY
          git config user.name 'prometeo-wc'
          git config user.email 'prometeo-wc@users.noreply.github.com'
          git add coordination/portfolio/derived/INTERACTIVE_WORK_UNITS_V1.json coordination/portfolio/evidence/portfolio-primary-chat-work-unit-ingress-reconcile-v1/RECONCILE-wc-20261001T184827Z-8fdd9bba0344-G000002.json
          git diff --cached --check
          git commit -m 'primary chat: reconcile durable ingress work unit'
          git push origin HEAD:main
