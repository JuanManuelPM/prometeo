name: PULSO J12 browser acceptance
on:
  push:
    branches:
      - feature/emblem-001-pulso-20261009
    paths:
      - 'experiments/emblem-001-pulso/**'
      - '.github/workflows/pulso-j12-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run pure physics tests
        run: node experiments/emblem-001-pulso/tests/engine.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve real source through HTTP
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/pulso-j12-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8765/experiments/emblem-001-pulso/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/pulso-j12-http.log
          exit 1
      - name: Test live module imports, touchscreen, UI and offline standalone
        run: node experiments/emblem-001-pulso/tests/browser_j12.mjs
      - name: Fetch pinned original Demo Engine V6 source
        run: |
          python3 - <<'PY'
          import pathlib,urllib.request
          base='https://raw.githubusercontent.com/JuanManuelPM/Experimentos/6a497b66cb28abf6015df42255936819260d8ee8/'
          paths=["demo-engine-v4/demo-engine-v3-base.js","demo-engine-v4/demo-engine-v4.js","demo-engine-v4/pointer-assets.js","demo-engine-v4/gesture-assets.js","demo-engine-v5/viewport.js","demo-engine-v5/annotation.js","demo-engine-v5/camera.js","demo-engine-v5/audio.js","demo-engine-v5/page-inspector.js","demo-engine-v5/recipe.js","demo-engine-v5/demo-engine-v5.js","demo-engine-v6/audio-v6.js","demo-engine-v6/viewport-authority.js","demo-engine-v6/annotation-v6.js","demo-engine-v6/demo-engine-v6.js"]
          for path in paths:
            target=pathlib.Path('/tmp/pulso-v6-runtime')/path
            target.parent.mkdir(parents=True,exist_ok=True)
            target.write_bytes(urllib.request.urlopen(base+path,timeout=30).read())
          print('Pinned Demo Engine V6 modules:',len(paths))
          PY
      - name: V6 semantic walkthrough against actual game DOM
        run: node experiments/emblem-001-pulso/tests/demo_v6_j12.mjs
      - name: Upload honest screenshots and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulso-j12-browser-proof
          path: |
            experiments/emblem-001-pulso/validation/j12-ci/
            experiments/emblem-001-pulso/PULSO_JUGAR.html
          if-no-files-found: warn
