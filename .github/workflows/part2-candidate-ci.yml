name: Part 2 Candidate CI

on:
  push:
    branches: [candidate/part2-durable-metabolism-20260904]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Part 1 regression
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/r1_candidate.test.mjs tests/runtime-ownership.test.mjs tests/platform-engines.test.mjs tests/part1-static.test.mjs tests/part1-contract.test.mjs tests/part1-runtime-services.test.mjs tests/part1-persistent-engines.test.mjs tests/part1-semantic-restore.test.mjs tests/part1-persistence-cas.test.mjs tests/part1-engine-invariants.test.mjs; do
            test -f "$f" && node "$f"
          done
      - name: Part 2 verification
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/part2-*.test.mjs; do node "$f"; done
      - name: Syntax JSON and closure invariants
        shell: bash
        run: |
          set -euo pipefail
          find shared -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python - <<'PY'
          import json,pathlib
          for p in pathlib.Path('.').rglob('*.json'):
              if '.git' not in p.parts:
                  with p.open(encoding='utf-8') as f: json.load(f)
          PY
          test ! -e .transport/part2
          test "$(git hash-object navigator/index.html)" = "7ca5f3e223ca843e3f9e4b7be1e53b5b65dd3418"
          grep -q 'TESTED_CANDIDATE_GITHUB_CI_PASS' coordination/PART2_CANDIDATE_MANIFEST.json
          grep -q 'R-P2-COMPLETE-0003' state/CURRENT_GRAPH.json
          grep -q 'PENDING-PART2-AUDIT-001' state/PENDING.json
          grep -q 'R-P2-COMPLETE-0003' receipts/ledger.jsonl
