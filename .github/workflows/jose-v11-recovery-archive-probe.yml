name: Jose V11 recovery archive probe

on:
  push:
    paths:
      - '.github/workflows/jose-v11-recovery-archive-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect historical export without mutation
        shell: bash
        run: |
          set -euo pipefail
          HIST='158357fe4e1cb672e4574d9ebe6f317b9418a30f'
          TARGET='0cf9a40fb53e977dccb40c9755d668a3ee922ccd61883f19229bb4a113139a05'
          EXPECTED_BYTES='69235'
          WORK="$RUNNER_TEMP/jose-v11-probe"
          mkdir -p "$WORK/unpacked"
          git show "$HIST:exports/PROMETEO_EXPORT_CURRENT.zip" > "$WORK/export.zip"
          unzip -qq "$WORK/export.zip" -d "$WORK/unpacked"
          {
            echo "schema=prometeo.jose-v11-archive-probe/v1"
            echo "historical_commit=$HIST"
            echo "target_sha256=$TARGET"
            echo "expected_bytes=$EXPECTED_BYTES"
            echo "zip_sha256=$(sha256sum "$WORK/export.zip" | awk '{print $1}')"
            echo "zip_bytes=$(wc -c < "$WORK/export.zip")"
            echo "candidate_names:"
            find "$WORK/unpacked" -type f -printf '%P\n' | grep -Ei 'jose|v11|recovery|study|student' || true
            echo "content_mentions:"
            grep -RIlE 'PROMETEO_JOSE_RECOVERY_ENGINE_V11|0cf9a40fb53e977dccb40c9755d668a3ee922ccd61883f19229bb4a113139a05' "$WORK/unpacked" || true
          } > "$WORK/report.txt"

          found=0
          while IFS= read -r -d '' f; do
            bytes=$(wc -c < "$f")
            sha=$(sha256sum "$f" | awk '{print $1}')
            if [ "$sha" = "$TARGET" ]; then
              found=$((found+1))
              rel="${f#$WORK/unpacked/}"
              echo "MATCH path=$rel bytes=$bytes sha256=$sha" >> "$WORK/report.txt"
              cp "$f" "$WORK/PROMETEO_JOSE_RECOVERY_ENGINE_V11.html"
            elif [ "$bytes" = "$EXPECTED_BYTES" ]; then
              rel="${f#$WORK/unpacked/}"
              echo "SAME_SIZE_NONMATCH path=$rel bytes=$bytes sha256=$sha" >> "$WORK/report.txt"
            fi
          done < <(find "$WORK/unpacked" -type f -print0)

          echo "match_count=$found" >> "$WORK/report.txt"
          if [ "$found" -eq 1 ]; then
            gzip -n -c "$WORK/PROMETEO_JOSE_RECOVERY_ENGINE_V11.html" | base64 -w0 > "$WORK/PROMETEO_JOSE_RECOVERY_ENGINE_V11_RECOVERED_LAB.html.gz.b64"
            echo >> "$WORK/PROMETEO_JOSE_RECOVERY_ENGINE_V11_RECOVERED_LAB.html.gz.b64"
            echo "recovered_b64_bytes=$(wc -c < "$WORK/PROMETEO_JOSE_RECOVERY_ENGINE_V11_RECOVERED_LAB.html.gz.b64")" >> "$WORK/report.txt"
          fi
          cat "$WORK/report.txt"

      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: jose-v11-recovery-archive-probe
          path: |
            ${{ runner.temp }}/jose-v11-probe/report.txt
            ${{ runner.temp }}/jose-v11-probe/PROMETEO_JOSE_RECOVERY_ENGINE_V11.html
            ${{ runner.temp }}/jose-v11-probe/PROMETEO_JOSE_RECOVERY_ENGINE_V11_RECOVERED_LAB.html.gz.b64
          if-no-files-found: warn
          retention-days: 7
