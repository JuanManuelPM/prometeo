
name: Personal App Hub v1 CI
on:
  push:
    branches: [ "feat/personal-app-hub-v1-*" ]
    paths: [ "lab/personal-app-hub-v1/**", ".github/workflows/personal-app-hub-v1.yml" ]
  pull_request:
    paths: [ "lab/personal-app-hub-v1/**", ".github/workflows/personal-app-hub-v1.yml" ]
  workflow_dispatch:
jobs:
  real-http-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check lab/personal-app-hub-v1/server.mjs
      - run: node --check lab/personal-app-hub-v1/ui.js
      - run: node --test lab/personal-app-hub-v1/tests.mjs
