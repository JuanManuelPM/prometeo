name: Single Worker Reality v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fixtures/worker-reality-01/**'
      - 'coordination/launch-packets/SINGLE-WORKER-REALITY-01/**'
      - 'pages/bench/reality/SINGLE-WORKER-REALITY-01/**'
      - 'tests/single-worker-reality-v1.test.mjs'
      - '.github/workflows/single-worker-reality-v1.yml'

permissions:
  contents: read

concurrency:
  group: single-worker-reality-v1
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated generic packet + reality fixture
        run: |
          node tests/launch-packet-generic-v1.test.mjs
          node tests/single-worker-reality-v1.test.mjs
