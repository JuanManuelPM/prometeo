name: Prometeo Mobile CI

on:
  push:
    branches:
      - android-mobile-v1
    paths:
      - 'android/prometeo-mobile/**'
      - 'backend/mobile/**'
      - '.github/workflows/prometeo-mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prometeo-mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests
        working-directory: android/prometeo-mobile
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint
        working-directory: android/prometeo-mobile
        run: gradle --no-daemon lintDebug

      - name: Build debug APK
        working-directory: android/prometeo-mobile
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signature and launcher contract
        working-directory: android/prometeo-mobile
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

          APKANALYZER="$SDK/cmdline-tools/latest/bin/apkanalyzer"
          APP_ID="$("$APKANALYZER" manifest application-id "$APK")"
          test -n "$APP_ID"

          "$APKANALYZER" manifest print "$APK" > /tmp/prometeo-manifest.xml
          grep -q 'android.intent.action.MAIN' /tmp/prometeo-manifest.xml
          grep -q 'android.intent.category.LAUNCHER' /tmp/prometeo-manifest.xml
          grep -q 'android:icon=' /tmp/prometeo-manifest.xml
          grep -q 'android:roundIcon=' /tmp/prometeo-manifest.xml
          if grep -q 'android:testOnly="true"' /tmp/prometeo-manifest.xml; then
            echo "Refusing to publish a testOnly APK"
            exit 1
          fi
          echo "Verified installable launcher package: $APP_ID"

      - name: Build unsigned sideload APK
        working-directory: android/prometeo-mobile
        run: gradle --no-daemon assembleSideload

      - name: Verify sideload manifest
        working-directory: android/prometeo-mobile
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/sideload/app-sideload-unsigned.apk"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKANALYZER="$SDK/cmdline-tools/latest/bin/apkanalyzer"
          test -f "$APK"
          APP_ID="$("$APKANALYZER" manifest application-id "$APK")"
          test "$APP_ID" = "com.prometeo.mobile.sideload"
          "$APKANALYZER" manifest print "$APK" > /tmp/prometeo-sideload-manifest.xml
          grep -q 'android.intent.action.MAIN' /tmp/prometeo-sideload-manifest.xml
          grep -q 'android.intent.category.LAUNCHER' /tmp/prometeo-sideload-manifest.xml
          if grep -q 'android:debuggable="true"' /tmp/prometeo-sideload-manifest.xml; then
            echo "Sideload APK must not be debuggable"
            exit 1
          fi
          echo "Verified release-like sideload package: $APP_ID"

      - name: Upload unsigned sideload APK
        uses: actions/upload-artifact@v4
        with:
          name: prometeo-mobile-sideload-unsigned
          path: android/prometeo-mobile/app/build/outputs/apk/sideload/app-sideload-unsigned.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload verification APK
        uses: actions/upload-artifact@v4
        with:
          name: prometeo-mobile-v1-verification
          path: android/prometeo-mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
