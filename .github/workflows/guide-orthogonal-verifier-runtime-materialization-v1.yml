name: guide-orthogonal-verifier-runtime-materialization-v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/guide-orthogonal-verifier-runtime-materialization-v1.yml'
      - 'coordination/guide/ORTHOGONAL_VERIFIER_MATRIX_V1.json'
      - 'scripts/guide-orthogonal-verifier-materializer-v1.mjs'
      - 'scripts/guide-recursive-successor-lib.mjs'
      - 'scripts/discovery-dedup-lib.mjs'
      - 'scripts/prometeo-metabolism-tick.mjs'
      - 'scripts/prometeo-metabolism-lib.mjs'
      - 'scripts/check-guide-orthogonal-verifier-runtime-materialization-v1.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-runtime-materialization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check orthogonal verifier matrix
        run: node scripts/check-guide-orthogonal-verifier-matrix-v1.mjs
      - name: Check runtime materialization
        run: node scripts/check-guide-orthogonal-verifier-runtime-materialization-v1.mjs
      - name: Exercise CURRENT metabolism tick in dry-run mode
        run: node scripts/prometeo-metabolism-tick.mjs --dry-run
