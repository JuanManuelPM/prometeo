name: Modelos III static publish

on:
  push:
    branches: [main]
    paths:
      - coordination/modelos-static-publish.trigger

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build self-contained Modelos III page
        run: |
          python - <<'PY'
          import base64, gzip, pathlib
          root = pathlib.Path('pages/modelos-iii')
          files = [
              'bundle-v13-1.txt',
              'bundle-v13-2.txt',
              'bundle-v13-3a1.txt',
              'bundle-v13-3a2.txt',
              'bundle-v13-3b1.txt',
              'bundle-v13-3b2.txt',
              'bundle-v13-4.txt',
              'bundle-v13-5.txt',
              'bundle-v13-6.txt',
          ]
          b64 = ''.join((root / f).read_text().strip() for f in files)
          html = gzip.decompress(base64.b64decode(b64)).decode('utf-8')
          pathlib.Path('/tmp/modelos-iii-index.html').write_text(html)
          print('built bytes:', len(html.encode('utf-8')))
          PY

      - name: Publish self-contained page to gh-pages
        run: |
          git config user.name "prometeo-publish-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin gh-pages
          git switch gh-pages
          mkdir -p pages/modelos-iii
          cp /tmp/modelos-iii-index.html pages/modelos-iii/index.html
          git add pages/modelos-iii/index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Modelos III: publish self-contained page"
          git push origin HEAD:gh-pages
