name: Modelos III static publish

on:
  push:
    branches: [main]
    paths:
      - coordination/modelos-static-publish.trigger

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build self-contained Modelos III page
        run: |
          python - <<'PY'
          import base64, gzip, pathlib, re
          root = pathlib.Path('pages/modelos-iii')
          payloads = [root / f'payload-{i}.txt' for i in range(1, 6)]
          b64 = ''.join(p.read_text().strip() for p in payloads)
          html = gzip.decompress(base64.b64decode(b64)).decode('utf-8')

          # The external walkie patch owns audio setup, so remove the legacy bootstrap call.
          html = re.sub(r'prepareAudio\(\);\s*(?=applyPalette\(\))', '', html, count=1)

          audio = (root / 'audio-walkie-v1.js').read_text()
          audio = audio.replace('</script', '<\\/script')
          patch = '<script>\n' + audio + '\n<\\/script>'
          if re.search(r'</body>', html, flags=re.I):
              html = re.sub(r'</body>', patch + '\n</body>', html, count=1, flags=re.I)
          else:
              html += patch

          pathlib.Path('/tmp/modelos-iii-index.html').write_text(html)
          print('built bytes:', len(html.encode('utf-8')))
          PY

      - name: Publish self-contained page to gh-pages
        run: |
          git config user.name "prometeo-publish-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin gh-pages
          git switch gh-pages
          mkdir -p pages/modelos-iii
          cp /tmp/modelos-iii-index.html pages/modelos-iii/index.html
          git add pages/modelos-iii/index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Modelos III: publish self-contained page"
          git push origin HEAD:gh-pages
