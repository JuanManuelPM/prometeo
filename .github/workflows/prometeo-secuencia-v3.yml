name: PROMETEO SECUENCIA V3 · Caption-verified example
on:
  push:
    branches: ['candidate/prometeo-secuencia-semantic-cut-v3-20261120',main]
    paths:
      - 'scripts/presentacion/sequence_semantic_v3.py'
      - 'presentacion/secuencia-v3/**'
      - 'tests/test_sequence_semantic_v3.py'
      - '.github/workflows/prometeo-secuencia-v3.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prometeo-secuencia-v3
  cancel-in-progress: false
jobs:
  verify-transcript-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install caption fetchers
        run: python -m pip install 'youtube-transcript-api>=1.2,<2' 'yt-dlp>=2025.1'
      - name: Check source and fail-closed selection
        run: python -m unittest discover -s tests -p test_sequence_semantic_v3.py -v
      - name: Investigate Rosetta actual video timestamps and transcript availability
        run: |
          python - <<'PY'
          import requests,re,json,html
          u='https://rosetta.to/u/chriswillx/does-psychology-have-a-negative-view-of-masculinity-dr-john-barry'
          try:
              r=requests.get(u,timeout=20)
              print('ROSETTA_HTTP',r.status_code,'BYTES',len(r.content))
              doc=r.text
              for token in ['Full transcript','Beta bias','00:09:59','subtitle','transcript','__NEXT_DATA__','__next_f']:
                  print('ROSETTA_TOKEN',token,doc.find(token),doc.count(token))
              for match in re.finditer(r'<script[^>]*>',doc):
                  start=match.start();end=doc.find('</script>',start)
                  chunk=doc[start:end]
                  if 'transcript' in chunk.lower() or '__next' in chunk.lower():
                      print('SCRIPT_META',chunk[:250].replace('\n',' '),'LEN',len(chunk))
              for m in re.finditer('00:09:59|599|full transcript',doc,re.I):
                  print('CONTEXT',re.sub(r'\s+',' ',doc[max(0,m.start()-80):m.start()+140])[:220])
                  if m.start()>100000:break
          except Exception as e:print('ROSETTA_ERROR',repr(e))
          PY
      - name: Fetch ACTUAL Youtube timed captions and align 6 phrase boundaries
        run: python scripts/presentacion/sequence_semantic_v3.py --out dist/secuencia-v3
      - name: Install representative browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Real Chromium UI tests with mock YouTube player (not audio QA)
        run: |
          python tests/browser_sequence_v3.py --url "file://$GITHUB_WORKSPACE/dist/secuencia-v3/index.html"
      - name: Archive transcript and edit decision as private CI evidence
        uses: actions/upload-artifact@v4
        with:
          name: secuencia-v3-verified-caption-decisions
          path: dist/secuencia-v3/
          retention-days: 14
      - name: Publish isolated working example; NEVER overwrite existing presentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin gh-pages
          git worktree add /tmp/pages-sequence-v3 origin/gh-pages
          mkdir -p /tmp/pages-sequence-v3/presentacion/secuencia-v3
          cp dist/secuencia-v3/index.html dist/secuencia-v3/recipe.json dist/secuencia-v3/QA.json /tmp/pages-sequence-v3/presentacion/secuencia-v3/
          cd /tmp/pages-sequence-v3
          git add presentacion/secuencia-v3
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'pages: SECUENCIA v3 caption-anchored example'
          for i in 1 2 3 4 5; do
            if git push origin HEAD:gh-pages; then exit 0; fi
            git fetch origin gh-pages
            git rebase origin/gh-pages
          done
          exit 1
