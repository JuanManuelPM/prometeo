name: Alumnos Student World adoption browser CI v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alumnos-student-world-route-adoption-browser-ci-v1.yml'
      - 'coordination/portfolio/tests/alumnos_student_world_route_adoption_browser_ci_v1.mjs'
      - 'coordination/portfolio/evidence/alumnos/ALUMNOS_STUDENT_WORLD_ROUTE_ADOPTION_CANDIDATE_20260930_G1.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alumnos-student-world-route-adoption-browser-ci-v1
  cancel-in-progress: false

jobs:
  representative-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install representative Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run adoption candidate desktop+narrow browser suite
        env:
          ALUMNOS_ADOPTION_URL: https://juanmanuelpm.github.io/prometeo/__candidate/portfolio-alumnos-student-world-route-adoption-candidate-v1/G000001/
          ALUMNOS_ADOPTION_EXPECTED_BLOB: 6488c296f8f4793cb45087207c01747af13dd1bf
          ALUMNOS_ADOPTION_DONOR_BLOB: fa069bf02362243afd5cf04676de8cf2b2fc852c
          ALUMNOS_ADOPTION_PROPAGATION_MS: '180000'
          ALUMNOS_ADOPTION_ARTIFACT_DIR: artifacts/alumnos-student-world-route-adoption-browser-ci
        run: node coordination/portfolio/tests/alumnos_student_world_route_adoption_browser_ci_v1.mjs

      - name: Upload bounded browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alumnos-student-world-route-adoption-browser-ci-evidence
          path: artifacts/alumnos-student-world-route-adoption-browser-ci/
          if-no-files-found: error
          retention-days: 14
