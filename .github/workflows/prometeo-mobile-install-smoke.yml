name: Prometeo Mobile Install Smoke

on:
  push:
    branches:
      - android-mobile-v1
    paths:
      - 'android/prometeo-mobile/**'
      - '.github/workflows/prometeo-mobile-install-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prometeo-mobile-install-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-13:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK + ATD image
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "emulator"             "platforms;android-36"             "build-tools;36.0.0"             "system-images;android-33;aosp_atd;x86_64"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build exact APK
        working-directory: android/prometeo-mobile
        run: gradle --no-daemon assembleDebug

      - name: Install and launch on Android 13
        working-directory: android/prometeo-mobile
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$SDK/platform-tools:$SDK/emulator:$SDK/cmdline-tools/latest/bin:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo no | avdmanager create avd             --force             --name prometeo-api33             --package "system-images;android-33;aosp_atd;x86_64"             --device "pixel_2"

          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi

          emulator             -avd prometeo-api33             -no-window             -noaudio             -no-boot-anim             -no-snapshot             -gpu swiftshader_indirect             > /tmp/prometeo-emulator.log 2>&1 &

          timeout 120 adb wait-for-device
          for i in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"

          adb install "$APK"

          APKANALYZER="$SDK/cmdline-tools/latest/bin/apkanalyzer"
          APP_ID="$("$APKANALYZER" manifest application-id "$APK")"
          adb shell pm list packages | grep -F "package:$APP_ID"

          LAUNCHABLE="$(adb shell cmd package resolve-activity --brief             -a android.intent.action.MAIN             -c android.intent.category.LAUNCHER             -p "$APP_ID" | tr -d '\r' | tail -n 1)"
          test -n "$LAUNCHABLE"
          echo "Launcher resolved to: $LAUNCHABLE"

          adb shell am start -W -n "$LAUNCHABLE"
          sleep 2
          adb shell pidof "$APP_ID"

          adb shell dumpsys package "$APP_ID" > /tmp/prometeo-package.txt
          grep -q "android.intent.category.LAUNCHER" /tmp/prometeo-package.txt

      - name: Fingerprint tested APK
        working-directory: android/prometeo-mobile
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee /tmp/prometeo-tested-apk.sha256

      - name: Upload exact tested APK
        uses: actions/upload-artifact@v4
        with:
          name: prometeo-mobile-preview-tested
          path: android/prometeo-mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Diagnostics
        if: failure()
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/platform-tools/adb" devices -l || true
          "$SDK/platform-tools/adb" logcat -d -t 400 || true
          cat /tmp/prometeo-avds.txt || true
          cat /tmp/prometeo-emulator.log || true
