name: Append-only host adapter canary v1

on:
  push:
    branches: [main]
    paths:
      - "scripts/append-only-create-retry-lib.mjs"
      - "scripts/github-contents-append-only-host-v1.mjs"
      - "tests/append-only-create-retry-v1.test.mjs"
      - "tests/append-only-create-retry-github-host-v1.test.mjs"
      - ".github/workflows/append-only-host-adapter-canary-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run append-only primitive and GitHub host adapter canaries
        run: |
          node --test \
            tests/append-only-create-retry-v1.test.mjs \
            tests/append-only-create-retry-github-host-v1.test.mjs
