name: Pinterest image query lab smoke

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/pinterest-image-search-v1/**'
      - 'demos/pinterest-image-query-lab-v1/**'
      - '.github/workflows/pinterest-image-query-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Bing image result metadata
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36'
          curl -L --silent --show-error --max-time 25 -A "$UA"             'https://www.bing.com/images/search?q=naruto%20site%3Apinterest.com%2Fpin%2F&form=HDRSC3&first=1&count=35' > /tmp/bing.html
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('/tmp/bing.html','utf8');
          const tags=[...html.matchAll(/<a\b[^>]*>/gi)].map(x=>x[0]).filter(x=>/\biusc\b/i.test(x));
          console.log('iusc tags', tags.length);
          function dec(s){return s.replace(/&quot;/g,'"').replace(/&#34;/g,'"').replace(/&amp;/g,'&').replace(/&#39;/g,"'")}
          for(const [i,tag] of tags.slice(0,8).entries()){
            const mm=tag.match(/\bm=(["'])([\s\S]*?)\1/i);
            console.log('\nTAG '+i, tag.slice(0,1200));
            if(mm){
              const raw=dec(mm[2]);
              console.log('META RAW',raw.slice(0,2500));
              try{console.log('META JSON',JSON.stringify(JSON.parse(raw),null,2).slice(0,3500))}catch(e){console.log('JSON ERR',String(e))}
            }
          }
          NODE
