name: Pinterest image query lab smoke

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/pinterest-image-search-v1/**'
      - 'demos/pinterest-image-query-lab-v1/**'
      - '.github/workflows/pinterest-image-query-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect web search for Pinterest Pin URLs
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36'
          curl -L --silent --show-error --max-time 25 -A "$UA"             'https://www.bing.com/search?q=naruto%20site%3Apinterest.com%2Fpin%2F&count=50' > /tmp/bing-web.html
          curl -L --silent --show-error --max-time 25 -A "$UA"             'https://www.google.com/search?q=naruto%20site%3Apinterest.com%2Fpin%2F&num=50' > /tmp/google-web.html

          node - <<'NODE'
          const fs=require('fs');
          for(const name of ['bing-web','google-web']){
            const html=fs.readFileSync('/tmp/'+name+'.html','utf8')
              .replace(/&amp;/g,'&')
              .replace(/%2F/gi,'/')
              .replace(/%3A/gi,':');
            const ids=[...html.matchAll(/pinterest\.[a-z.]+\/pin\/(?:[^0-9"' <]*)(\d{8,20})/gi)].map(x=>x[1]);
            const urls=[...html.matchAll(/https?:\/\/(?:www\.)?pinterest\.[^"' <&]+\/pin\/[^"' <&]+/gi)].map(x=>x[0]);
            console.log('\n### '+name);
            console.log(JSON.stringify({bytes:html.length,uniquePinIds:[...new Set(ids)].length},null,2));
            console.log('ids', [...new Set(ids)].slice(0,20));
            console.log('urls', [...new Set(urls)].slice(0,12));
            const idx=html.toLowerCase().indexOf('pinterest');
            console.log('context', idx>=0?html.slice(Math.max(0,idx-500),idx+1800):'NO PINTEREST');
          }
          NODE
