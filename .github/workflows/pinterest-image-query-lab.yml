name: Pinterest image query lab smoke

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/pinterest-image-search-v1/**'
      - 'demos/pinterest-image-query-lab-v1/**'
      - '.github/workflows/pinterest-image-query-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe current Pinterest BaseSearchResource contract
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36'
          DATA='{"options":{"query":"naruto","bookmarks":[""]},"context":{}}'
          code="$(curl -L --silent --show-error --max-time 30 -A "$UA"             -H 'Accept: application/json, text/javascript, */*, q=0.01'             -H 'X-Requested-With: XMLHttpRequest'             -H 'X-Pinterest-AppState: active'             -H 'X-Pinterest-Source-Url: /ideas/'             -H 'X-Pinterest-PWS-Handler: www/ideas.js'             --get             --data-urlencode "data=$DATA"             -o /tmp/pinterest.json             -w '%{http_code}'             'https://www.pinterest.com/resource/BaseSearchResource/get/')"
          echo "HTTP $code"
          head -c 600 /tmp/pinterest.json || true
          echo
          node - <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync('/tmp/pinterest.json','utf8');
          const data=JSON.parse(raw);
          const rr=data.resource_response||{};
          const results=rr.data?.results||[];
          console.log(JSON.stringify({
            status:rr.status,
            count:results.length,
            bookmark:rr.bookmark,
            sample:results.slice(0,3).map(x=>({
              id:x.id,
              type:x.type,
              title:x.title||x.grid_title||x.auto_alt_text||'',
              image:x.images?.orig?.url,
              thumb:x.images?.['236x']?.url
            }))
          },null,2));
          if(results.length<5) throw new Error('expected >=5 Pinterest results');
          if(!results.slice(0,5).every(x=>/^https:\/\/i\.pinimg\.com\//.test(x.images?.orig?.url||''))) throw new Error('missing clean pinimg originals');
          NODE
