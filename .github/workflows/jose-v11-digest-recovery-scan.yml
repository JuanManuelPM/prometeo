name: Jose V11 digest recovery scan

on:
  push:
    paths:
      - '.github/workflows/jose-v11-digest-recovery-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan main and gh-pages Git blobs for exact V11 HTML digest
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
          git cat-file --batch-all-objects --batch-check='%(objectname) %(objecttype) %(objectsize)' > /tmp/all-objects.txt
          python3 - <<'PY'
          import hashlib,subprocess
          EXPECTED='0cf9a40fb53e977dccb40c9755d668a3ee922ccd61883f19229bb4a113139a05'
          candidates=[]; total=0
          for line in open('/tmp/all-objects.txt',encoding='ascii'):
              oid,typ,size=line.split(); size=int(size)
              if typ!='blob': continue
              total+=1
              if 10000 <= size <= 4000000: candidates.append((oid,size))
          proc=subprocess.Popen(['git','cat-file','--batch'],stdin=subprocess.PIPE,stdout=subprocess.PIPE)
          found=[]
          for oid,size in candidates:
              proc.stdin.write((oid+'\n').encode()); proc.stdin.flush()
              header=proc.stdout.readline().decode().strip().split()
              if len(header)!=3 or header[1]!='blob': raise RuntimeError((oid,header))
              n=int(header[2]); data=proc.stdout.read(n); proc.stdout.read(1)
              if hashlib.sha256(data).hexdigest()==EXPECTED: found.append((oid,n))
          proc.stdin.close(); proc.wait()
          print(f'V11_DIGEST_SCAN total_blobs={total} scanned_candidate_blobs={len(candidates)} found={len(found)} expected={EXPECTED}')
          for oid,size in found: print(f'V11_DIGEST_FOUND oid={oid} size={size}')
          if not found: raise SystemExit(1)
          open('/tmp/found-oids.txt','w').write('\n'.join(oid for oid,_ in found)+'\n')
          PY
          while read -r oid; do
            git rev-list --objects --all | grep "^$oid " || true
          done < /tmp/found-oids.txt
