name: Jose V11 digest recovery scan

on:
  push:
    paths:
      - '.github/workflows/jose-v11-digest-recovery-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan main and gh-pages Git blobs for exact V11 HTML digest
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='0cf9a40fb53e977dccb40c9755d668a3ee922ccd61883f19229bb4a113139a05'
          git fetch --no-tags origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
          git cat-file --batch-all-objects --batch-check='%(objectname) %(objecttype) %(objectsize)' > /tmp/all-objects.txt
          total=0
          scanned=0
          found=0
          while read -r oid type size; do
            [ "$type" = blob ] || continue
            total=$((total+1))
            # V11 HTML is expected to be a substantial page; avoid hashing tiny telemetry and giant assets.
            if [ "$size" -lt 10000 ] || [ "$size" -gt 4000000 ]; then
              continue
            fi
            scanned=$((scanned+1))
            observed="$(git cat-file blob "$oid" | sha256sum | awk '{print $1}')"
            if [ "$observed" = "$EXPECTED" ]; then
              found=$((found+1))
              echo "V11_DIGEST_FOUND oid=$oid size=$size"
              git rev-list --objects --all | grep "^$oid " || true
            fi
          done < /tmp/all-objects.txt
          echo "V11_DIGEST_SCAN total_blobs=$total scanned_candidate_blobs=$scanned found=$found expected=$EXPECTED"
          test "$found" -gt 0
