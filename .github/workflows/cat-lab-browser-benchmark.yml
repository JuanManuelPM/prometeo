name: CAT-LAB Browser Benchmark

on:
  push:
    branches: [main]
    paths:
      - 'pages/bench/cat-lab/**'
      - 'tests/cat-lab-browser-v1.mjs'
      - 'tests/cat-lab-contract-v1.mjs'
      - '.github/workflows/cat-lab-browser-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cat-lab-browser-benchmark
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static contracts
        shell: bash
        run: |
          set -u
          if [ ! -d pages/bench/cat-lab ]; then
            echo "No Cat Lab slots yet."
            exit 0
          fi
          targets=/tmp/catlab-targets.txt
          git diff --name-only HEAD^ HEAD -- 'pages/bench/cat-lab/**/index.html' | sort > "$targets"
          if [ ! -s "$targets" ]; then
            find pages/bench/cat-lab -type f -name index.html | sort > "$targets"
          fi
          echo "CATLAB targets:"
          cat "$targets"
          failures=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "::group::STATIC $f"
            if ! node tests/cat-lab-contract-v1.mjs "$(dirname "$f")"; then
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          done < "$targets"
          if [ "$failures" -ne 0 ]; then
            echo "CATLAB_STATIC_FAILURES=$failures"
            exit 1
          fi
      - name: Install representative Chromium
        if: ${{ hashFiles('pages/bench/cat-lab/**/index.html') != '' }}
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve benchmark pages
        if: ${{ hashFiles('pages/bench/cat-lab/**/index.html') != '' }}
        shell: bash
        run: |
          python3 -m http.server 4173 --directory pages >/tmp/catlab-http.log 2>&1 &
          echo $! >/tmp/catlab-http.pid
          sleep 2
      - name: Browser contracts
        if: ${{ hashFiles('pages/bench/cat-lab/**/index.html') != '' }}
        shell: bash
        run: |
          set -u
          targets=/tmp/catlab-targets.txt
          if [ ! -s "$targets" ]; then
            find pages/bench/cat-lab -type f -name index.html | sort > "$targets"
          fi
          failures=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            rel="${f#pages/}"
            dir="$(dirname "$rel")"
            echo "::group::BROWSER $dir"
            if ! node tests/cat-lab-browser-v1.mjs "http://127.0.0.1:4173/$dir/"; then
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          done < "$targets"
          if [ "$failures" -ne 0 ]; then
            echo "CATLAB_BROWSER_FAILURES=$failures"
            exit 1
          fi
