name: storage-zero-write-ratchet-v1

on:
  push:
    branches: [main]
    paths:
      - "current-tree/control-v11/data-layer.js"
      - "current-tree/control-v11/chat-canary/input-module-v1.js"
      - "supabase/migrations/20260925132506_prometeo_current_tree_v2_light_bootstrap.sql"
      - "supabase/migrations/20260925163500_prometeo_organism_projection_v1.sql"
      - "supabase/migrations/20260925170500_prometeo_history_work_context_v1.sql"
      - "supabase/migrations/20260925173500_prometeo_control_room_v7.sql"
      - "supabase/migrations/20260925220200_prometeo_statistics_v3.sql"
      - "coordination/storage-recovery/github-native-v1/ZERO_WRITE_AUDIT.json"
      - "coordination/storage-recovery/github-native-v1/zero-write-ratchet-v1.mjs"
      - ".github/workflows/storage-zero-write-ratchet-v1.yml"
  pull_request:
    paths:
      - "current-tree/control-v11/data-layer.js"
      - "current-tree/control-v11/chat-canary/input-module-v1.js"
      - "supabase/migrations/20260925132506_prometeo_current_tree_v2_light_bootstrap.sql"
      - "supabase/migrations/20260925163500_prometeo_organism_projection_v1.sql"
      - "supabase/migrations/20260925170500_prometeo_history_work_context_v1.sql"
      - "supabase/migrations/20260925173500_prometeo_control_room_v7.sql"
      - "supabase/migrations/20260925220200_prometeo_statistics_v3.sql"
      - "coordination/storage-recovery/github-native-v1/ZERO_WRITE_AUDIT.json"
      - "coordination/storage-recovery/github-native-v1/zero-write-ratchet-v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify zero-write observation paths and local-first Primary Chat
        run: node coordination/storage-recovery/github-native-v1/zero-write-ratchet-v1.mjs
