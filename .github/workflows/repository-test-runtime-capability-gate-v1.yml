name: Repository Test Runtime Capability Gate V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "coordination/portfolio/tests/repository_test_runtime_capability_gate_v1.mjs"
      - "coordination/portfolio/derived/prometeo-autonomous-growth/portfolio-agentic-dynamic-child-subcompile-v1.json"
      - "coordination/portfolio/derived/prometeo-autonomous-growth/portfolio-agentic-claim-ready-combined-validator-v1.json"
      - "coordination/portfolio/derived/prometeo-autonomous-growth/portfolio-repository-test-runtime-capability-gate-v1.json"
      - "scripts/universal-cognitive-worker-lib.mjs"
      - "scripts/build-claim-frontier.mjs"
      - ".github/workflows/repository-test-runtime-capability-gate-v1.yml"

permissions:
  contents: read

jobs:
  repository-test-runtime-capability-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run repository-test runtime capability regression
        run: node coordination/portfolio/tests/repository_test_runtime_capability_gate_v1.mjs
