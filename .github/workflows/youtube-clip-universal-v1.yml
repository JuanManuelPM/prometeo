name: PROMETEO - Universal YouTube clip component
on:
  push:
    branches: [main]
    paths:
      - 'componentes/youtube-clip/v1/**'
      - 'tests/test_component_youtube_clip.py'
      - '.github/workflows/youtube-clip-universal-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-universal-component:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test prerequisites
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Execute universal component tests
        run: python3 -m unittest discover -s tests -p 'test_component_youtube_clip.py' -v
