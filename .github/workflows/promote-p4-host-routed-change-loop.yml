name: Promote P4 Host-Routed Change Loop

on:
  push:
    branches: [main]
    paths:
      - 'shared/capture/v1/change-loop.js'
      - 'scripts/build-universal-control-v5-change-loop.py'
      - 'scripts/package-universal-control-v5-change-loop-release.py'
      - '.github/workflows/promote-p4-host-routed-change-loop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prometeo-p4-host-routed-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Re-sync before build
        run: |
          set -euo pipefail
          git pull --rebase origin main

      - name: Build and verify candidate
        run: |
          set -euo pipefail
          node --check shared/capture/v1/change-loop.js
          python scripts/build-universal-control-v5-change-loop.py
          python scripts/package-universal-control-v5-change-loop-release.py
          grep -q "routeUrl:(pageId,workItemId=null)" shared/universal-shell/v5/candidate/change-loop-source.html
          grep -q "launchWorkItem" shared/universal-shell/v5/candidate/change-loop-source.html
          grep -q "openResult?.(p,launchWorkItem" shared/universal-shell/v5/candidate/change-loop-source.html
          grep -q "page-change-loop-ui/v2" shared/capture/v1/change-loop.js
          grep -q "Ver en Prometeo" shared/capture/v1/change-loop.js
          grep -q "background:rgba(246,246,243,.30)" shared/capture/v1/change-loop.js

      - name: Promote verified bytes to source-of-served runtime
        run: |
          set -euo pipefail
          cp shared/universal-shell/v5/change-loop-release-candidate/chunk-*.b64 shared/universal-shell/v5/
          cp shared/universal-shell/v5/change-loop-release-candidate/manifest.json shared/universal-shell/v5/SERVED_MANIFEST.json
          cp shared/universal-shell/v5/change-loop-release-candidate/root-index.html index.html
          python - <<'PY'
          import json, pathlib
          m=json.loads(pathlib.Path('shared/universal-shell/v5/SERVED_MANIFEST.json').read_text())
          assert m['schema']=='prometeo.universal-shell-served-manifest/v1'
          assert m['capabilities']['single_top_level_shell'] is True
          assert m['capabilities']['page_change_feed'] is True
          text=pathlib.Path('shared/universal-shell/v5/candidate/change-loop-source.html').read_text()
          for s in ['launchWorkItem','openResult?.(p,launchWorkItem','routeUrl:(pageId,workItemId=null)','suppressNextClosedClick=true']:
              assert s in text,s
          print('PROMOTION INPUT PASS',m['source_sha256'])
          PY

      - name: Commit atomically without overwriting parallel main work
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html shared/universal-shell/v5/chunk-*.b64 shared/universal-shell/v5/SERVED_MANIFEST.json shared/universal-shell/v5/candidate/change-loop-source.html shared/universal-shell/v5/candidate/CHANGE_LOOP_SOURCE_SHA256.txt shared/universal-shell/v5/change-loop-release-candidate
          if git diff --cached --quiet; then
            echo 'Host-routed Change Loop already promoted.'
            exit 0
          fi
          git commit -m 'shell: promote host-routed Page Change Loop v2'
          git pull --rebase origin main
          git push origin HEAD:main
