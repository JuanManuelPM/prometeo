name: Prometeo Guide Takeover Canary

on:
  push:
    branches: [main]
    paths:
      - 'coordination/guide/takeovers/**'
      - 'coordination/guide/visible-responses/**'
      - 'coordination/guide/GUIDE_TAKEOVER_CANARY_V1.json'
      - 'coordination/guide/CURRENT_MISSION_V1.json'
      - 'coordination/live/PAGE_WATCH_REGISTRY_V1.json'
      - 'scripts/check-guide-takeover-v1.mjs'
      - '.github/workflows/guide-takeover-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prometeo-guide-takeover-canary
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Validate takeover sessions
        run: node scripts/check-guide-takeover-v1.mjs .
