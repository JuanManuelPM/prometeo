name: MP10 V11 ingress Page Change integration v1

on:
  push:
    branches: [main]
    paths:
      - 'current-tree/control-v11/index.html'
      - 'current-tree/control-v11/ingress-v1.js'
      - 'current-tree/control-v11/v11.js'
      - 'current-tree/control-v11/config-v1.js'
      - 'current-tree/control-v11/result-adapter-v1.js'
      - 'current-tree/control-v11/result-candidate-v1.json'
      - 'coordination/goal-progress/G05_VERIFICATION.json'
      - 'shared/capture/v1/github-change-loop.js'
      - 'coordination/portfolio/tests/mp10_v11_ingress_page_change_integration_v1.mjs'
      - 'coordination/portfolio/tests/control_v11_visible_result_prewire_v1.mjs'
      - '.github/workflows/mp10-v11-ingress-page-change-integration-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mp10-v11-ingress-page-change-integration-v1
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify V11 ingress ↔ Page Change privacy/fail-closed contract
        run: node coordination/portfolio/tests/mp10_v11_ingress_page_change_integration_v1.mjs
      - name: Syntax-check V11 result surface
        run: |
          node --check current-tree/control-v11/v11.js
          node --check current-tree/control-v11/result-adapter-v1.js
      - name: Verify G06 visible-result prewire contract
        run: node coordination/portfolio/tests/control_v11_visible_result_prewire_v1.mjs
      - name: Verify G06 served candidate surface
        shell: bash
        run: |
          set -euo pipefail
          base='https://juanmanuelpm.github.io/prometeo/current-tree/control-v11'
          g05='https://juanmanuelpm.github.io/prometeo/coordination/goal-progress/G05_VERIFICATION.json'
          ok=0
          for i in $(seq 1 12); do
            stamp="$(date +%s)-$i"
            if curl -fsS "$base/result-candidate-v1.json?v=$stamp" -o /tmp/g06-result.json \
              && curl -fsS "$base/result-adapter-v1.js?v=$stamp" -o /tmp/g06-adapter.js \
              && curl -fsS "$base/v11.js?v=$stamp" -o /tmp/g06-v11.js \
              && curl -fsS "$g05?v=$stamp" -o /tmp/g05-verification.json \
              && grep -q 'prometeo.v11-visible-result-projection/v1' /tmp/g06-result.json \
              && grep -q 'prometeo.g05-lineage-verification/v1' /tmp/g05-verification.json \
              && grep -q 'G05_REAL_PRIVATE_E2E_NOT_VERIFIED' /tmp/g06-result.json \
              && grep -q 'normalizeVisibleResultProjection' /tmp/g06-adapter.js \
              && grep -q 'data-visible-result-state' /tmp/g06-v11.js \
              && grep -q 'builder_return_ref' /tmp/g06-v11.js \
              && grep -q 'verifier_ref' /tmp/g06-v11.js; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
