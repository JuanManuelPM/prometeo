name: Calendar habits custom trackers v1

on:
  push:
    branches: [main]
    paths:
      - 'candidate/calendar-habits-custom-trackers-v1/**'
      - 'coordination/portfolio/tests/calendar_habits_custom_trackers_v1.mjs'
      - '.github/workflows/calendar-habits-custom-trackers-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify configurable Habits candidate
        run: node coordination/portfolio/tests/calendar_habits_custom_trackers_v1.mjs
