name: Guide atomic work decomposer v1

on:
  push:
    branches: [main]
    paths:
      - 'coordination/guide/ATOMIC_TASK_V1.json'
      - 'coordination/guide/GUIDE_ATOMIC_DECOMPOSITION_V1.md'
      - 'coordination/guide/tests/atomic-work-decomposer-v1.fixtures.json'
      - 'scripts/guide-atomic-work-decomposer-v1.mjs'
      - 'scripts/check-guide-atomic-work-decomposer-v1.mjs'
      - '.github/workflows/guide-atomic-work-decomposer-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JSON contracts and fixtures
        run: |
          node -e "JSON.parse(require('fs').readFileSync('coordination/guide/ATOMIC_TASK_V1.json','utf8')); JSON.parse(require('fs').readFileSync('coordination/guide/tests/atomic-work-decomposer-v1.fixtures.json','utf8'))"
      - name: Run deterministic atomic decomposition regression
        run: node scripts/check-guide-atomic-work-decomposer-v1.mjs
