name: trail-hairpin-validate-once

on:
  push:
    paths:
      - ".github/workflows/trail-hairpin-validate-once.yml"

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate trajectory-coupled hairpin turning
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("visuals/trail-lab/index.html").read_text()
          m=re.search(r"<script>([\s\S]*?)</script>",s)
          assert m, "inline script missing"
          script=m.group(1)
          Path("/tmp/trail.js").write_text(script)

          required=[
            "function hairpinPose",
            "const lane=clamp(W*.22,72,220)",
            "const turn=clamp((lane*2)/250,.90,1.80)",
            "pz=zNear;",
            "yaw=Math.PI*u;",
            "pz=lerp(zNear,zFar,u);",
            "yaw=Math.PI;",
            "pz=zFar;",
            "yaw=Math.PI*(1-u);",
            "visualYaw=worldMode==='approach'?0:Math.PI",
            "const LIFE_MS=reduced?1040:860",
            "{scale:1,max:34,stamp:30,fan:7}"
          ]
          for token in required:
              assert token in script, f"missing {token}"

          forbidden=["yawTravel","yawFrom","yawDirection","updateVisualYaw("]
          for token in forbidden:
              assert token not in script, f"obsolete independent yaw remains: {token}"

          assert "http://" not in script and "https://" not in script, "external runtime URL found"

          state=Path("visuals/fronts/trail/state.json").read_text()
          assert '"current_blob_sha": "c99d7b24f938721b9a4dd6824682c2b6dd53014b"' in state
          assert "Trajectory-coupled turning" in Path("visuals/fronts/trail/decisions.md").read_text()
          arch=Path("visuals/fronts/trail/architecture.md").read_text()
          assert "The retreat/backward straight never begins" in arch
          assert "hairpin" in arch.lower()
          print("Trail hairpin static checks OK")
          PY
          node --check /tmp/trail.js
          echo "node syntax OK"
