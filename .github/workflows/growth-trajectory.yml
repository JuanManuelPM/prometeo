name: Prometeo Growth Trajectory

on:
  push:
    branches: [main, gh-pages]
    paths:
      - 'coordination/guide/GROWTH_TRAJECTORY_V1.json'
      - 'coordination/guide/CURRENT_MISSION_V1.json'
      - 'coordination/guide/GUIDE_POWER_COMPASS_V1.json'
      - 'coordination/guide/GROWTH_CAMPAIGN_V1.json'
      - 'live/runtime.json'
      - 'live/worker-scoreboard.json'
      - 'live/claim-frontier.json'
      - 'scripts/build-growth-trajectory.mjs'
      - '.github/workflows/growth-trajectory.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prometeo-growth-trajectory
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 1
      - name: Checkout public gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 5
      - name: Build trajectory
        run: node source/scripts/build-growth-trajectory.mjs source site site/trajectory
      - name: Publish trajectory
        run: |
          set -euo pipefail
          git -C site config user.name github-actions[bot]
          git -C site config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C site pull --ff-only origin gh-pages
          node source/scripts/build-growth-trajectory.mjs source site site/trajectory
          git -C site add trajectory/index.html trajectory/trajectory.json
          if git -C site diff --cached --quiet; then exit 0; fi
          git -C site commit -m "growth: refresh public trajectory"
          for n in 1 2 3 4; do
            if git -C site push origin HEAD:gh-pages; then exit 0; fi
            git -C site fetch origin gh-pages
            git -C site rebase origin/gh-pages
            node source/scripts/build-growth-trajectory.mjs source site site/trajectory
            git -C site add trajectory/index.html trajectory/trajectory.json
            git -C site commit --amend --no-edit
          done
          exit 1
