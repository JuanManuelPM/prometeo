name: Study System V2 QA

on:
  push:
    branches: [main]
    paths:
      - 'pages/study-system-v2-generic*.js'
      - 'pages/study-system-v2-generic*.css'
      - 'pages/study-system-v2-generic.html'
      - 'pages/study-library/instances/*.json'
      - 'pages/study-system-v2-whiteboard-v*.js'
      - 'pages/study-system-v2-whiteboard-v*.css'
      - 'pages/study-system-v2-whiteboard-v*.html'
      - 'scripts/study-system-v2-qa.mjs'
      - 'scripts/study-system-v2-browser-qa.mjs'
      - '.github/workflows/study-system-v2-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check pages/study-system-v2-generic-v2.js
      - name: Instance structure and provenance
        run: node scripts/study-system-v2-qa.mjs pages/study-library/instances/modelos-teorias-ii-p1-v2.json

  browser:
    runs-on: ubuntu-latest
    needs: qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve candidate
        run: python3 -m http.server 4173 >/tmp/study-v2-http.log 2>&1 &
      - name: Desktop + mobile + WB10 browser QA
        run: node scripts/study-system-v2-browser-qa.mjs
      - name: Preserve screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-system-v2-browser-qa
          path: qa-artifacts
          if-no-files-found: ignore
