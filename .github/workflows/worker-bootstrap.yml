name: Prometeo Worker Bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'wc'
      - 'coordination/guide/CURRENT_MISSION_V1.json'
      - 'coordination/workers/WORKER_FRESH_LAUNCH_POLICY_V1.json'
      - 'scripts/build-worker-bootstrap.mjs'
      - 'tests/worker-fresh-launch-v1.test.mjs'
      - '.github/workflows/worker-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prometeo-worker-bootstrap
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard source launch semantics
        run: node source/tests/worker-fresh-launch-v1.test.mjs source

      - name: Checkout public site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 10

      - name: Build public /wc from Current Mission
        run: node source/scripts/build-worker-bootstrap.mjs source site/wc/index.html

      - name: Guard exact public launch prompt
        run: node source/tests/worker-fresh-launch-v1.test.mjs source site

      - name: Publish guarded worker bootstrap
        run: |
          set -euo pipefail
          git -C site config user.name github-actions[bot]
          git -C site config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C site add wc/index.html
          if git -C site diff --cached --quiet; then exit 0; fi
          git -C site commit -m "wc: publish guarded fresh resident launch"
          for n in 1 2 3 4; do
            if git -C site push origin HEAD:gh-pages; then exit 0; fi
            git -C site fetch origin gh-pages
            git -C site rebase origin/gh-pages
            node source/scripts/build-worker-bootstrap.mjs source site/wc/index.html
            git -C site add wc/index.html
            git -C site commit --amend --no-edit
          done
          exit 1
