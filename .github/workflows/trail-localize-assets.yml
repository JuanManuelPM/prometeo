name: trail-localize-assets-once

on:
  push:
    paths:
      - ".github/workflows/trail-localize-assets.yml"

permissions:
  contents: write

jobs:
  localize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow opencv-python-headless numpy
      - name: Download and cut out Trail assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/trail-src visuals/trail-lab/assets
          curl -L --fail --retry 3 -o /tmp/trail-src/base.png "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Flea_Micrographia_Hooke.png/960px-Flea_Micrographia_Hooke.png"
          curl -L --fail --retry 3 -o /tmp/trail-src/wings.png "https://upload.wikimedia.org/wikipedia/commons/8/8a/Pseudocreobotra_ocellata.png"
          curl -L --fail --retry 3 -o /tmp/trail-src/oni.jpg "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Ritual_mask_of_oni_%28demon%29_used_in_tsuina_%28oni_yarai%29_exorcism%2C_Japan%2C_Edo_period%2C_wood_with_color_-_Freer_Gallery_of_Art_-_DSC05526.JPG/960px-Ritual_mask_of_oni_%28demon%29_used_in_tsuina_%28oni_yarai%29_exorcism%2C_Japan%2C_Edo_period%2C_wood_with_color_-_Freer_Gallery_of_Art_-_DSC05526.JPG"
          curl -L --fail --retry 3 -o /tmp/trail-src/hannya.jpg "https://commons.wikimedia.org/wiki/Special:Redirect/file/Hannya%20%28Noh%20mask%29%2C%20Tokyo%20National%20Museum%20C-1554.jpg?width=960"
          curl -L --fail --retry 3 -o /tmp/trail-src/shishi.jpg "https://commons.wikimedia.org/wiki/Special:Redirect/file/Shishiguchi%20%28Noh%20mask%29%2C%20Tokyo%20National%20Museum.jpg?width=960"
          curl -L --fail --retry 3 -o /tmp/trail-src/shikami.jpg "https://commons.wikimedia.org/wiki/Special:Redirect/file/Shikami%20%28Noh%20mask%29%2C%20Tokyo%20National%20Museum.jpg?width=960"
          cat > /tmp/process_trail_assets.py <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path
          import cv2, numpy as np

          SRC=Path("/tmp/trail-src")
          OUT=Path("visuals/trail-lab/assets")
          OUT.mkdir(parents=True, exist_ok=True)

          def fit(img,max_dim):
              img=img.convert("RGBA")
              w,h=img.size
              if max(w,h)>max_dim:
                  k=max_dim/max(w,h)
                  img=img.resize((max(1,round(w*k)),max(1,round(h*k))),Image.Resampling.LANCZOS)
              return img

          def trim(im,pad=8):
              bbox=im.getbbox()
              if not bbox:
                  return im
              x0,y0,x1,y1=bbox
              return im.crop((max(0,x0-pad),max(0,y0-pad),min(im.width,x1+pad),min(im.height,y1+pad)))

          def save_baseline(src,out):
              im=fit(Image.open(src),720)
              px=im.load()
              for y in range(im.height):
                  for x in range(im.width):
                      r,g,b,a=px[x,y]
                      lum=r*.299+g*.587+b*.114
                      aa=max(0,min(255,round((247-lum)*5.25)))
                      px[x,y]=(5,5,5,round(aa*(a/255)))
              trim(im,4).save(out,optimize=True)

          def cut_pale(src,out,lo=10,hi=54,contrast=1.08):
              im=fit(Image.open(src),640)
              arr=np.array(im)
              rgb=arr[:,:,:3].astype(np.float32)
              a=arr[:,:,3].astype(np.float32)
              edge=np.concatenate([rgb[0,:,:],rgb[-1,:,:],rgb[:,0,:],rgb[:,-1,:]],axis=0)
              bg=np.median(edge,axis=0)
              dist=np.sqrt(((rgb-bg)**2).sum(axis=2))
              t=np.clip((dist-lo)/(hi-lo),0,1)
              alpha=(t*t*(3-2*t)*a).astype(np.uint8)
              outarr=arr.copy()
              outarr[:,:,3]=alpha
              res=Image.fromarray(outarr,"RGBA")
              trim(res,6).save(out,optimize=True)

          def grabcut(src,out,iterations=9):
              im=fit(Image.open(src),640)
              rgb=np.array(im.convert("RGB"))
              h,w=rgb.shape[:2]
              margin=max(2,round(min(w,h)*0.012))
              mask=np.zeros((h,w),np.uint8)
              bgd=np.zeros((1,65),np.float64)
              fgd=np.zeros((1,65),np.float64)
              rect=(margin,margin,w-2*margin,h-2*margin)
              cv2.grabCut(rgb,mask,rect,bgd,fgd,iterations,cv2.GC_INIT_WITH_RECT)
              fg=np.where((mask==cv2.GC_FGD)|(mask==cv2.GC_PR_FGD),255,0).astype(np.uint8)

              # Retain substantial connected foreground components, discard museum/background islands.
              n,labels,stats,_=cv2.connectedComponentsWithStats((fg>0).astype(np.uint8),8)
              keep=np.zeros_like(fg)
              min_area=max(80,int(w*h*0.0015))
              comps=sorted(((stats[i,cv2.CC_STAT_AREA],i) for i in range(1,n)),reverse=True)
              for area,i in comps:
                  if area>=min_area or (comps and i==comps[0][1]):
                      keep[labels==i]=255

              kernel=np.ones((3,3),np.uint8)
              keep=cv2.morphologyEx(keep,cv2.MORPH_CLOSE,kernel,iterations=1)
              alpha=Image.fromarray(keep,"L").filter(ImageFilter.GaussianBlur(0.7))
              rgba=im.copy()
              rgba.putalpha(alpha)
              trim(rgba,8).save(out,optimize=True)

          save_baseline(SRC/"base.png",OUT/"01-base.png")
          cut_pale(SRC/"wings.png",OUT/"02-wings.png",lo=8,hi=50,contrast=1.08)
          grabcut(SRC/"oni.jpg",OUT/"03-oni.png")
          grabcut(SRC/"hannya.jpg",OUT/"04-hannya.png")
          grabcut(SRC/"shishi.jpg",OUT/"05-shishi.png")
          grabcut(SRC/"shikami.jpg",OUT/"06-shikami.png")

          for p in sorted(OUT.glob("*.png")):
              im=Image.open(p).convert("RGBA")
              a=np.array(im)[:,:,3]
              transparent=float((a<16).mean())
              opaque=float((a>240).mean())
              print(f"{p} bytes={p.stat().st_size} size={im.size} transparent={transparent:.3f} opaque={opaque:.3f} corners={[int(a[0,0]),int(a[0,-1]),int(a[-1,0]),int(a[-1,-1])]}")
          PY
          python /tmp/process_trail_assets.py
      - name: Commit localized assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "prometeo-visual-bot"
          git config user.email "actions@users.noreply.github.com"
          git add visuals/trail-lab/assets
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "trail: refine repo-local color cutouts"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo "Could not push localized assets after retries" >&2
          exit 1
