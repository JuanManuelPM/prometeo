name: trail-localize-assets-once

on:
  push:
    paths:
      - ".github/workflows/trail-localize-assets.yml"

permissions:
  contents: write

jobs:
  localize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Download and cut out Trail assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/trail-src visuals/trail-lab/assets
          curl -L --fail --retry 3 -o /tmp/trail-src/base.png "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Flea_Micrographia_Hooke.png/960px-Flea_Micrographia_Hooke.png"
          curl -L --fail --retry 3 -o /tmp/trail-src/wings.png "https://upload.wikimedia.org/wikipedia/commons/8/8a/Pseudocreobotra_ocellata.png"
          curl -L --fail --retry 3 -o /tmp/trail-src/oni.jpg "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Ritual_mask_of_oni_%28demon%29_used_in_tsuina_%28oni_yarai%29_exorcism%2C_Japan%2C_Edo_period%2C_wood_with_color_-_Freer_Gallery_of_Art_-_DSC05526.JPG/960px-Ritual_mask_of_oni_%28demon%29_used_in_tsuina_%28oni_yarai%29_exorcism%2C_Japan%2C_Edo_period%2C_wood_with_color_-_Freer_Gallery_of_Art_-_DSC05526.JPG"
          curl -L --fail --retry 3 -o /tmp/trail-src/hannya.jpg "https://commons.wikimedia.org/wiki/Special:Redirect/file/Hannya%20%28Noh%20mask%29%2C%20Tokyo%20National%20Museum%20C-1554.jpg?width=960"
          curl -L --fail --retry 3 -o /tmp/trail-src/shishi.jpg "https://commons.wikimedia.org/wiki/Special:Redirect/file/Shishiguchi%20%28Noh%20mask%29%2C%20Tokyo%20National%20Museum.jpg?width=960"
          curl -L --fail --retry 3 -o /tmp/trail-src/shikami.jpg "https://commons.wikimedia.org/wiki/Special:Redirect/file/Shikami%20%28Noh%20mask%29%2C%20Tokyo%20National%20Museum.jpg?width=960"
          cat > /tmp/process_trail_assets.py <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path
          import math

          SRC=Path("/tmp/trail-src")
          OUT=Path("visuals/trail-lab/assets")
          OUT.mkdir(parents=True, exist_ok=True)

          def fit(img, max_dim=900):
              img=img.convert("RGBA")
              w,h=img.size
              if max(w,h)>max_dim:
                  k=max_dim/max(w,h)
                  img=img.resize((max(1,round(w*k)),max(1,round(h*k))), Image.Resampling.LANCZOS)
              return img

          def save_baseline(src, out):
              im=fit(Image.open(src), 720)
              px=im.load()
              for y in range(im.height):
                  for x in range(im.width):
                      r,g,b,a=px[x,y]
                      lum=r*.299+g*.587+b*.114
                      aa=max(0,min(255,round((247-lum)*5.25)))
                      px[x,y]=(5,5,5,round(aa*(a/255)))
              bbox=im.getbbox()
              if bbox: im=im.crop(bbox)
              im.save(out,optimize=True)

          def border_color(im):
              rgb=im.convert("RGB")
              w,h=rgb.size
              pts=[]
              step=max(1,min(w,h)//80)
              for x in range(0,w,step):
                  pts.append(rgb.getpixel((x,0))); pts.append(rgb.getpixel((x,h-1)))
              for y in range(0,h,step):
                  pts.append(rgb.getpixel((0,y))); pts.append(rgb.getpixel((w-1,y)))
              pts.sort(key=lambda c:sum(c))
              mid=pts[len(pts)//5:len(pts)*4//5] or pts
              return tuple(round(sum(p[i] for p in mid)/len(mid)) for i in range(3))

          def cutout(src,out,lo=24,hi=76,contrast=1.04):
              im=fit(Image.open(src), 640)
              bg=border_color(im)
              rgba=im.convert("RGBA")
              pix=rgba.load()
              alpha=Image.new("L",rgba.size,255)
              ap=alpha.load()
              for y in range(rgba.height):
                  for x in range(rgba.width):
                      r,g,b,a=pix[x,y]
                      d=math.sqrt((r-bg[0])**2+(g-bg[1])**2+(b-bg[2])**2)
                      t=(d-lo)/(hi-lo)
                      aa=0 if t<=0 else 255 if t>=1 else round(255*t*t*(3-2*t))
                      if aa:
                          nr=max(0,min(255,round((r-128)*contrast+128)))
                          ng=max(0,min(255,round((g-128)*contrast+128)))
                          nb=max(0,min(255,round((b-128)*contrast+128)))
                          pix[x,y]=(nr,ng,nb,a)
                      ap[x,y]=round(aa*(a/255))
              alpha=alpha.filter(ImageFilter.GaussianBlur(0.65))
              rgba.putalpha(alpha)
              bbox=rgba.getbbox()
              if bbox:
                  pad=10
                  x0,y0,x1,y1=bbox
                  rgba=rgba.crop((max(0,x0-pad),max(0,y0-pad),min(rgba.width,x1+pad),min(rgba.height,y1+pad)))
              rgba.save(out,optimize=True)

          save_baseline(SRC/"base.png",OUT/"01-base.png")
          cutout(SRC/"wings.png",OUT/"02-wings.png",lo=8,hi=48,contrast=1.08)
          cutout(SRC/"oni.jpg",OUT/"03-oni.png",lo=20,hi=68,contrast=1.08)
          cutout(SRC/"hannya.jpg",OUT/"04-hannya.png",lo=18,hi=64,contrast=1.07)
          cutout(SRC/"shishi.jpg",OUT/"05-shishi.png",lo=18,hi=66,contrast=1.08)
          cutout(SRC/"shikami.jpg",OUT/"06-shikami.png",lo=18,hi=66,contrast=1.08)
          for p in sorted(OUT.glob("*.png")):
              print(p, p.stat().st_size)
          PY
          python /tmp/process_trail_assets.py
      - name: Commit localized assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "prometeo-visual-bot"
          git config user.email "actions@users.noreply.github.com"
          git add visuals/trail-lab/assets
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "trail: localize color cutout assets"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo "Could not push localized assets after retries" >&2
          exit 1
