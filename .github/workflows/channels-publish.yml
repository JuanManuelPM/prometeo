name: Publish Channels to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/lab/channels/**'
      - '.github/workflows/channels-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: channels-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Syntax check Channels JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set -euo pipefail
          find main/pages/lab/channels -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 0
      - name: Sync Channels surface from main
        run: |
          set -euo pipefail
          mkdir -p site/pages/lab/channels
          # assets/ may contain binary public fixtures that are intentionally
          # Pages-owned. Never erase them just because main has no binary copy.
          rsync -a --delete --exclude='assets/' \
            main/pages/lab/channels/ site/pages/lab/channels/
      - name: Restore required binary canary if missing
        run: |
          set -euo pipefail
          asset='pages/lab/channels/assets/apple-cut-demo.mp4'
          if [ ! -s "site/$asset" ]; then
            mkdir -p "site/$(dirname "$asset")"
            git -C site show 12da46a2439262587be2e147064d2a4d52a31236:"$asset" > "site/$asset"
          fi
          test -s "site/$asset"
      - name: Publish only if changed
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/lab/channels
          if git diff --cached --quiet; then
            echo 'Channels already synchronized.'
            exit 0
          fi
          git commit -m 'pages: sync Channels from main'
          git push origin gh-pages
