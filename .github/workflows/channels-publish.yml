name: Publish Channels to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/lab/channels/**'
      - '.github/workflows/channels-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: channels-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Syntax check Channels JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set -euo pipefail
          find main/pages/lab/channels -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Replace Channels surface from main
        run: |
          set -euo pipefail
          rm -rf site/pages/lab/channels
          mkdir -p site/pages/lab/channels
          cp -a main/pages/lab/channels/. site/pages/lab/channels/
      - name: Publish only if changed
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/lab/channels
          if git diff --cached --quiet; then
            echo 'Channels already synchronized.'
            exit 0
          fi
          git commit -m 'pages: sync Channels from main'
          git push origin gh-pages
