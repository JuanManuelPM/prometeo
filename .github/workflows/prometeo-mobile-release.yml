name: Prometeo Mobile Signed Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require protected signing secrets
        env:
          KS_B64: ${{ secrets.PROMETEO_ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.PROMETEO_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PROMETEO_ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.PROMETEO_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KS_B64"
          test -n "$KS_PASS"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASS"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing keystore
        env:
          KS_B64: ${{ secrets.PROMETEO_ANDROID_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/prometeo-release.jks"
          chmod 600 "$RUNNER_TEMP/prometeo-release.jks"

      - name: Unit tests and lint
        working-directory: android/prometeo-mobile
        run: |
          gradle --no-daemon testDebugUnitTest
          gradle --no-daemon lintRelease

      - name: Build signed release
        working-directory: android/prometeo-mobile
        env:
          PROMETEO_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/prometeo-release.jks
          PROMETEO_ANDROID_STORE_PASSWORD: ${{ secrets.PROMETEO_ANDROID_STORE_PASSWORD }}
          PROMETEO_ANDROID_KEY_ALIAS: ${{ secrets.PROMETEO_ANDROID_KEY_ALIAS }}
          PROMETEO_ANDROID_KEY_PASSWORD: ${{ secrets.PROMETEO_ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Verify signing certificate and hash
        id: meta
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/prometeo-mobile/app/build.gradle | head -1)
          VERSION_CODE=$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" android/prometeo-mobile/app/build.gradle | head -1)
          APK="prometeo-mobile-${VERSION}-${VERSION_CODE}.apk"
          cp android/prometeo-mobile/app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: prometeo-mobile-signed-${{ steps.meta.outputs.version }}
          path: |
            ${{ steps.meta.outputs.apk }}
            ${{ steps.meta.outputs.apk }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.meta.outputs.apk }}
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
        run: |
          TAG="prometeo-mobile-v${VERSION}-${VERSION_CODE}"
          gh release create "$TAG" "$APK" "$APK.sha256"             --title "Prometeo Mobile ${VERSION}"             --notes "Signed Prometeo Mobile release. Android must verify the existing app signing identity before updating."
