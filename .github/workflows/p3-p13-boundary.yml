name: Persist P3-13 Human Boundary

on:
  push:
    branches: [candidate/prometeo-final-20260904]
    paths:
      - 'scripts/p3-p13-boundary.mjs'
      - '.github/workflows/p3-p13-boundary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/prometeo-final-20260904
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize human boundary
        run: node scripts/p3-p13-boundary.mjs
      - name: Validate boundary state
        run: |
          node -e "const fs=require('fs');for(const p of ['coordination/P3_13_ACCEPTANCE_SCOPE.json','state/CURRENT_GRAPH.json','state/PENDING.json'])JSON.parse(fs.readFileSync(p));"
          git diff --check
      - name: Commit boundary
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coordination/P3_13_ACCEPTANCE_SCOPE.json state/CURRENT_GRAPH.json state/PENDING.json receipts/ledger.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'part3: persist P3-13 human acceptance boundary'
          git push origin HEAD:candidate/prometeo-final-20260904
