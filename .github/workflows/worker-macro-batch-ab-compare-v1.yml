name: Worker Macro Batch AB Compare v1
on:
  push:
    branches: [main]
    paths:
      - 'coordination/portfolio/evidence/prometeo-autonomous-growth/MACRO_BATCH_AB_COMPARE_prod01-20260929T2257-03-229ca3deaf7e_G000002.json'
      - 'tests/worker-macro-batch-ab-compare-v1.test.mjs'
      - '.github/workflows/worker-macro-batch-ab-compare-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/worker-macro-batch-ab-compare-v1.test.mjs
