name: Prometeo Guide Current Mission Continuity

on:
  push:
    branches: [main, gh-pages]
    paths:
      - 'g'
      - 'p.txt'
      - '.well-known/prometeo.json'
      - 'g/index.html'
      - 'coordination/CONTINUITY_HEAD.json'
      - 'coordination/guide/CURRENT_MISSION_V1.json'
      - 'coordination/guide/CONTINUOUS_COGNITIVE_PRODUCTION_CONTINUITY_V1.md'
      - 'coordination/guide/GUIDE_CURRENT_MISSION_WRITEBACK_V1.md'
      - 'coordination/guide/GUIDE_WORKER_HANDOFF_V1.json'
      - 'coordination/guide/GROWTH_CAMPAIGN_V1.json'
      - 'coordination/workers/WORKER_FRESH_LAUNCH_POLICY_V1.json'
      - 'coordination/workstreams/chat-native-control-plane-v1/FOCUS.json'
      - 'coordination/workstreams/chat-native-control-plane-v1/CHAT_OBJECT.json'
      - 'coordination/workstreams/chat-native-control-plane-v1/GUIDE_SUCCESSOR_FIXLIST_V1.md'
      - 'tests/guide-current-mission-continuity-v1.test.mjs'
      - 'tests/guide-worker-handoff-v1.test.mjs'
      - 'tests/worker-fresh-launch-v1.test.mjs'
      - '.github/workflows/guide-current-mission-continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prometeo-guide-current-mission-continuity
  cancel-in-progress: false

jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 1
      - name: Checkout public gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1
      - name: Verify current mission continuity
        run: node source/tests/guide-current-mission-continuity-v1.test.mjs source site
      - name: Verify worker handoff contract
        run: node source/tests/guide-worker-handoff-v1.test.mjs source
      - name: Verify fresh-launch anti-replay contract
        run: node source/tests/worker-fresh-launch-v1.test.mjs source
