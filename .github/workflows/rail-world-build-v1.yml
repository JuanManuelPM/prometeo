name: Rail World Build v5

on:
  push:
    branches: [visual-review-rail-world-v1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rail-world-build-v5
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-review-rail-world-v1
          fetch-depth: 2

      - id: chrome
        uses: browser-actions/setup-chrome@v1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Serve exact checkout
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . >/tmp/rail-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:4173/demos/prometeo-rail-world-v1/" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rail-http.log
          exit 1

      - name: Review and network-gate browser test
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf demos/prometeo-rail-world-v1/review
          mkdir -p demos/prometeo-rail-world-v1/review

          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --remote-debugging-port=9222 --user-data-dir=/tmp/rail-world-chrome about:blank >/tmp/rail-chrome.log 2>&1 &
          echo $! >/tmp/rail-chrome.pid
          trap 'kill "$(cat /tmp/rail-chrome.pid)" 2>/dev/null || true' EXIT

          for i in {1..80}; do
            if curl -fsS "http://127.0.0.1:9222/json/version" >/tmp/rail-version.json; then break; fi
            sleep .25
          done
          test -s /tmp/rail-version.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';

          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const pages=await (await fetch('http://127.0.0.1:9222/json/list')).json();
          const page=pages.find(x=>x.type==='page');
          if(!page?.webSocketDebuggerUrl)throw new Error('No Chrome page target');
          const ws=new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{
            ws.addEventListener('open',resolve,{once:true});
            ws.addEventListener('error',reject,{once:true});
          });

          let seq=0;
          const pending=new Map();
          ws.addEventListener('message',ev=>{
            const msg=JSON.parse(String(ev.data));
            if(!msg.id)return;
            const p=pending.get(msg.id);
            if(!p)return;
            pending.delete(msg.id);
            if(msg.error)p.reject(new Error(msg.error.message||JSON.stringify(msg.error)));
            else p.resolve(msg.result||{});
          });
          const send=(method,params={})=>{
            const id=++seq;
            return new Promise((resolve,reject)=>{
              pending.set(id,{resolve,reject});
              ws.send(JSON.stringify({id,method,params}));
            });
          };

          await send('Page.enable');
          await send('Runtime.enable');
          await send('Network.enable');
          await send('Emulation.setDeviceMetricsOverride',{width:1365,height:768,deviceScaleFactor:1,mobile:false,screenWidth:1365,screenHeight:768});

          async function waitExpression(expression,label,attempts=240){
            for(let i=0;i<attempts;i++){
              try{
                const ev=await send('Runtime.evaluate',{expression,returnByValue:true});
                if(ev?.result?.value)return ev.result.value;
              }catch{}
              await sleep(125);
            }
            throw new Error('Never ready: '+label);
          }
          async function evaluate(expression){
            const ev=await send('Runtime.evaluate',{expression,returnByValue:true});
            return ev?.result?.value;
          }
          async function state(){return evaluate('window.PrometeoRailWorld.getState()')}
          async function click(x,y){
            await send('Input.dispatchMouseEvent',{type:'mouseMoved',x,y});
            await send('Input.dispatchMouseEvent',{type:'mousePressed',x,y,button:'left',clickCount:1});
            await send('Input.dispatchMouseEvent',{type:'mouseReleased',x,y,button:'left',clickCount:1});
          }
          async function gateRect(key){
            return evaluate('(()=>{const e=document.querySelector('.gate[data-key="'+key+'"]');if(!e)return null;const r=e.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,w:r.width,h:r.height,cls:e.className,animation:getComputedStyle(e).animationName,recess:getComputedStyle(e.querySelector(".recess")).backgroundImage}})()');
          }
          async function shot(url,file){
            await send('Page.navigate',{url});
            await waitExpression('Boolean(window.PrometeoRailWorldReview&&window.PrometeoRailWorldReview.ready)',file);
            await sleep(500);
            const out=await send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:false});
            const bytes=Buffer.from(out.data,'base64');
            if(bytes.length<10000)throw new Error('Screenshot too small '+file+' '+bytes.length);
            await fs.mkdir(path.dirname(file),{recursive:true});
            await fs.writeFile(file,bytes);
          }

          const reviews=[
            ['arcos-network','http://127.0.0.1:4173/demos/prometeo-rail-world-v1/?review=1&map=1&z=20&playerMap=1&playerZ=20&playerX=0'],
            ['arcos-active','http://127.0.0.1:4173/demos/prometeo-rail-world-v1/?review=1&map=1&z=88&playerMap=1&playerZ=111&playerX=0'],
            ['calzada-network','http://127.0.0.1:4173/demos/prometeo-rail-world-v1/?review=1&map=3&z=18&playerMap=3&playerZ=18&playerX=0'],
            ['tunel-network','http://127.0.0.1:4173/demos/prometeo-rail-world-v1/?review=1&map=4&z=18&playerMap=4&playerZ=18&playerX=0'],
            ['torres-network','http://127.0.0.1:4173/demos/prometeo-rail-world-v1/?review=1&map=5&z=12&playerMap=5&playerZ=12&playerX=0']
          ];
          for(const [id,url] of reviews)await shot(url,'demos/prometeo-rail-world-v1/review/'+id+'.png');

          await send('Page.navigate',{url:'http://127.0.0.1:4173/demos/prometeo-rail-world-v1/'});
          await waitExpression('Boolean(window.PrometeoRailWorldReview&&window.PrometeoRailWorldReview.ready&&window.PrometeoRailWorld)', 'rail runtime');

          // 1. Every map exposes every other map exactly once.
          const mapIds=[1,3,4,5];
          const connectivity={};
          for(const mapId of mapIds){
            await evaluate('window.PrometeoRailWorld.setState({cameraMap:'+mapId+',cameraZ:12,cameraX:0,playerMap:'+mapId+',playerZ:12,playerX:0,immediate:true})');
            await sleep(90);
            const s=await state();
            const dest=s.gates.map(g=>g.destinationMap).sort((a,b)=>a-b);
            const expected=mapIds.filter(x=>x!==mapId).sort((a,b)=>a-b);
            if(s.gates.length!==3||JSON.stringify(dest)!==JSON.stringify(expected)){
              throw new Error('Incomplete all-to-all connectivity '+JSON.stringify({mapId,dest,expected,gates:s.gates}));
            }
            connectivity[mapId]=dest;
          }

          // 2. Fixed gate exists and is visible while player is far. No rotation/animation.
          await evaluate('window.PrometeoRailWorld.setState({cameraMap:1,cameraZ:88,cameraX:0,playerMap:1,playerZ:76,playerX:0,immediate:true})');
          await sleep(180);
          const far=await state();
          const farGate=far.gates.find(g=>g.key==='1>5');
          const farRect=await gateRect('1>5');
          if(!(farGate&&farGate.projection.visible&&!farGate.active&&farRect&&farRect.w>10)){
            throw new Error('Fixed inactive gate missing '+JSON.stringify({far,farRect}));
          }
          if(farRect.animation!=='none')throw new Error('Gate is still animated '+JSON.stringify(farRect));
          const inactiveMaterial=farRect.recess;

          // 3. First click on inactive architecture sends avatar to that exact gate.
          await click(farRect.x,farRect.y);
          await sleep(1500);
          const arrived=await state();
          const activeGate=arrived.gates.find(g=>g.key==='1>5');
          const activeRect=await gateRect('1>5');
          if(!(arrived.gate.active&&arrived.gate.key==='1>5'&&activeGate.active)){
            throw new Error('Player arrival did not arm selected gate '+JSON.stringify(arrived));
          }
          if(activeRect.recess===inactiveMaterial){
            throw new Error('Gate material/color did not change on arrival '+JSON.stringify({inactiveMaterial,active:activeRect.recess}));
          }

          // 4. Moving avatar away does NOT remove architecture; it only deactivates its material.
          await evaluate('window.PrometeoRailWorld.setState({cameraMap:1,cameraZ:88,cameraX:0,playerMap:1,playerZ:92,playerX:0,immediate:true})');
          await sleep(180);
          const away=await state();
          const awayGate=away.gates.find(g=>g.key==='1>5');
          const awayRect=await gateRect('1>5');
          if(!(awayGate.projection.visible&&!awayGate.active&&awayRect.w>10)){
            throw new Error('Gate disappeared instead of deactivating '+JSON.stringify({away,awayRect}));
          }

          // 5. Direct non-sequential travel ARCOS -> TORRES by second click.
          await evaluate('window.PrometeoRailWorld.setState({cameraMap:1,cameraZ:88,cameraX:0,playerMap:1,playerZ:111,playerX:0,immediate:true})');
          await sleep(160);
          const armed15=await state();
          if(armed15.gate.key!=='1>5')throw new Error('ARCOS->TORRES gate not armed '+JSON.stringify(armed15));
          const rect15=await gateRect('1>5');
          await click(rect15.x,rect15.y);
          await sleep(620);
          const inTorres=await state();
          if(!(inTorres.cameraMap===5&&inTorres.playerMap===5&&inTorres.sameMap)){
            throw new Error('Direct ARCOS->TORRES failed '+JSON.stringify(inTorres));
          }

          // 6. Another arbitrary edge TORRES -> CALZADA proves network, not a linear chain.
          const gate53=inTorres.gates.find(g=>g.key==='5>3');
          await evaluate('window.PrometeoRailWorld.setState({cameraMap:5,cameraZ:38,cameraX:0,playerMap:5,playerZ:58,playerX:0,immediate:true})');
          await sleep(160);
          const armed53=await state();
          if(armed53.gate.key!=='5>3')throw new Error('TORRES->CALZADA gate not armed '+JSON.stringify({gate53,armed53}));
          const rect53=await gateRect('5>3');
          await click(rect53.x,rect53.y);
          await sleep(620);
          const inCalzada=await state();
          if(!(inCalzada.cameraMap===3&&inCalzada.playerMap===3&&inCalzada.sameMap)){
            throw new Error('Direct TORRES->CALZADA failed '+JSON.stringify(inCalzada));
          }

          console.log('FUNCTIONAL_RAIL_V5 PASS',JSON.stringify({connectivity,farGate,arrived:arrived.gate,awayGate,inTorres:{cameraMap:inTorres.cameraMap,playerMap:inTorres.playerMap},inCalzada:{cameraMap:inCalzada.cameraMap,playerMap:inCalzada.playerMap}}));
          ws.close();

          await fs.writeFile('demos/prometeo-rail-world-v1/review/manifest.json',JSON.stringify({
            schema:'prometeo.rail-world-review/v5',
            source_sha:process.env.SOURCE_SHA,
            generated_at:new Date().toISOString(),
            renderer:'visuals/spaces-lab v35 live bridge',
            runtime:'v5-network-gates',
            semantics:{
              gates_per_map:3,
              network:'all-to-all between ARCOS, CALZADA, TUNEL, TORRES',
              geometry:'fixed architectural monolith/sign; no rotation',
              inactive:'dark wall/stone material remains visible',
              active:'same fixed object changes panel material/color by player proximity',
              first_click:'walk player to selected gate',
              second_click:'enter selected destination',
              transition:'camera and player arrive together near reverse gate'
            },
            review:['arcos-network.png','arcos-active.png','calzada-network.png','tunel-network.png','torres-network.png']
          },null,2)+'\n');
          NODE

          ls -lh demos/prometeo-rail-world-v1/review

      - name: Upload exact evidence
        uses: actions/upload-artifact@v4
        with:
          name: rail-world-v5-${{ github.sha }}
          path: demos/prometeo-rail-world-v1/review/
          retention-days: 30
          if-no-files-found: error

      - name: Publish source and evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/rail-world-v5
          mkdir -p /tmp/rail-world-v5/demos/prometeo-rail-world-v1 /tmp/rail-world-v5/visuals/spaces-lab /tmp/rail-world-v5/workflow
          cp demos/prometeo-rail-world-v1/index.html /tmp/rail-world-v5/demos/prometeo-rail-world-v1/index.html
          cp -a demos/prometeo-rail-world-v1/review /tmp/rail-world-v5/demos/prometeo-rail-world-v1/
          cp visuals/spaces-lab/index.html /tmp/rail-world-v5/visuals/spaces-lab/index.html
          cp .github/workflows/rail-world-build-v1.yml /tmp/rail-world-v5/workflow/rail-world-build-v1.yml

          git reset --hard HEAD
          git clean -fd

          publish_branch () {
            local branch="$1"
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
            mkdir -p demos/prometeo-rail-world-v1 visuals/spaces-lab
            cp /tmp/rail-world-v5/demos/prometeo-rail-world-v1/index.html demos/prometeo-rail-world-v1/index.html
            rm -rf demos/prometeo-rail-world-v1/review demos/prometeo-rail-world-v1/frames
            cp -a /tmp/rail-world-v5/demos/prometeo-rail-world-v1/review demos/prometeo-rail-world-v1/
            cp /tmp/rail-world-v5/visuals/spaces-lab/index.html visuals/spaces-lab/index.html
            if [ "$branch" = "main" ]; then
              mkdir -p .github/workflows
              cp /tmp/rail-world-v5/workflow/rail-world-build-v1.yml .github/workflows/rail-world-build-v1.yml
            fi
            git add -A demos/prometeo-rail-world-v1 visuals/spaces-lab
            if [ "$branch" = "main" ]; then git add .github/workflows/rail-world-build-v1.yml; fi
            if git diff --cached --quiet; then return 0; fi
            git commit -m "visuals: publish Rail World all-to-all gate network v5"
            for n in 1 2 3 4; do
              if git push origin "HEAD:$branch"; then return 0; fi
              git fetch origin "$branch"
              git rebase "origin/$branch"
              sleep 2
            done
            return 1
          }

          publish_branch main
          publish_branch gh-pages

      - name: Verify public all-to-all gate network
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          URL="https://juanmanuelpm.github.io/prometeo/demos/prometeo-rail-world-v1/"
          for i in {1..48}; do
            PAGE="$(curl -fsSL --max-time 12 "$URL" 2>/dev/null || true)"
            if printf '%s' "$PAGE" | grep -Fq "v5-network-gates"; then break; fi
            sleep 5
          done

          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --remote-debugging-port=9223 --user-data-dir=/tmp/rail-world-public about:blank >/tmp/rail-public.log 2>&1 &
          echo $! >/tmp/rail-public.pid
          trap 'kill "$(cat /tmp/rail-public.pid)" 2>/dev/null || true' EXIT
          for i in {1..80}; do
            if curl -fsS "http://127.0.0.1:9223/json/version" >/dev/null; then break; fi
            sleep .25
          done

          node --input-type=module <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const pages=await (await fetch('http://127.0.0.1:9223/json/list')).json();
          const page=pages.find(x=>x.type==='page');
          const ws=new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{ws.addEventListener('open',resolve,{once:true});ws.addEventListener('error',reject,{once:true})});
          let seq=0;const pending=new Map();
          ws.addEventListener('message',ev=>{const m=JSON.parse(String(ev.data));if(!m.id)return;const p=pending.get(m.id);if(!p)return;pending.delete(m.id);m.error?p.reject(new Error(m.error.message)):p.resolve(m.result||{})});
          const send=(method,params={})=>{const id=++seq;return new Promise((resolve,reject)=>{pending.set(id,{resolve,reject});ws.send(JSON.stringify({id,method,params}))})};
          const evaluate=async expression=>(await send('Runtime.evaluate',{expression,returnByValue:true}))?.result?.value;
          await send('Page.enable');await send('Runtime.enable');
          await send('Page.navigate',{url:'https://juanmanuelpm.github.io/prometeo/demos/prometeo-rail-world-v1/'});
          for(let i=0;i<240;i++){
            if(await evaluate('Boolean(window.PrometeoRailWorldReview&&window.PrometeoRailWorldReview.ready&&window.PrometeoRailWorld)'))break;
            if(i===239)throw new Error('Public Rail World never became ready');
            await sleep(125);
          }
          const state=()=>evaluate('window.PrometeoRailWorld.getState()');
          await evaluate('window.PrometeoRailWorld.setState({cameraMap:1,cameraZ:88,cameraX:0,playerMap:1,playerZ:111,playerX:0,immediate:true})');
          await sleep(180);
          const armed=await state();
          if(!(armed.gates.length===3&&armed.gate.key==='1>5'))throw new Error('Public V5 network not armed '+JSON.stringify(armed));
          const rect=await evaluate('(()=>{const e=document.querySelector('.gate[data-key="1>5"]');const r=e.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}})()');
          await send('Input.dispatchMouseEvent',{type:'mouseMoved',x:rect.x,y:rect.y});
          await send('Input.dispatchMouseEvent',{type:'mousePressed',x:rect.x,y:rect.y,button:'left',clickCount:1});
          await send('Input.dispatchMouseEvent',{type:'mouseReleased',x:rect.x,y:rect.y,button:'left',clickCount:1});
          await sleep(620);
          const entered=await state();
          if(!(entered.cameraMap===5&&entered.playerMap===5&&entered.sameMap))throw new Error('Public direct ARCOS->TORRES failed '+JSON.stringify(entered));
          console.log('PUBLIC_RAIL_WORLD_V5_VERIFIED',JSON.stringify({armed:{gate:armed.gate,gates:armed.gates.map(g=>g.destinationMap)},entered:{cameraMap:entered.cameraMap,playerMap:entered.playerMap}}));
          ws.close();
          NODE
