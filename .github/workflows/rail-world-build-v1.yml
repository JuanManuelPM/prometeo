name: Rail World Build v3

on:
  push:
    branches: [visual-review-rail-world-v1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rail-world-build-v3
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-review-rail-world-v1
          fetch-depth: 2

      - id: chrome
        uses: browser-actions/setup-chrome@v1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Serve exact checkout
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . >/tmp/rail-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:4173/demos/prometeo-rail-world-v1/" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rail-http.log
          exit 1

      - name: Review and decoupled-control browser test
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf demos/prometeo-rail-world-v1/review
          mkdir -p demos/prometeo-rail-world-v1/review

          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --remote-debugging-port=9222 --user-data-dir=/tmp/rail-world-chrome about:blank >/tmp/rail-chrome.log 2>&1 &
          echo $! >/tmp/rail-chrome.pid
          trap 'kill "$(cat /tmp/rail-chrome.pid)" 2>/dev/null || true' EXIT

          for i in {1..80}; do
            if curl -fsS "http://127.0.0.1:9222/json/version" >/tmp/rail-version.json; then break; fi
            sleep .25
          done
          test -s /tmp/rail-version.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';

          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const pages=await (await fetch('http://127.0.0.1:9222/json/list')).json();
          const page=pages.find(x=>x.type==='page');
          if(!page?.webSocketDebuggerUrl)throw new Error('No Chrome page target');
          const ws=new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{
            ws.addEventListener('open',resolve,{once:true});
            ws.addEventListener('error',reject,{once:true});
          });

          let seq=0;
          const pending=new Map();
          ws.addEventListener('message',ev=>{
            const msg=JSON.parse(String(ev.data));
            if(!msg.id)return;
            const p=pending.get(msg.id);
            if(!p)return;
            pending.delete(msg.id);
            if(msg.error)p.reject(new Error(msg.error.message||JSON.stringify(msg.error)));
            else p.resolve(msg.result||{});
          });
          const send=(method,params={})=>{
            const id=++seq;
            return new Promise((resolve,reject)=>{
              pending.set(id,{resolve,reject});
              ws.send(JSON.stringify({id,method,params}));
            });
          };

          await send('Page.enable');
          await send('Runtime.enable');
          await send('Network.enable');
          await send('Emulation.setDeviceMetricsOverride',{width:1365,height:768,deviceScaleFactor:1,mobile:false,screenWidth:1365,screenHeight:768});

          async function waitExpression(expression,label,attempts=240){
            for(let i=0;i<attempts;i++){
              try{
                const ev=await send('Runtime.evaluate',{expression,returnByValue:true});
                if(ev?.result?.value)return ev.result.value;
              }catch{}
              await sleep(125);
            }
            throw new Error('Never ready: '+label);
          }
          async function evaluate(expression){
            const ev=await send('Runtime.evaluate',{expression,returnByValue:true});
            return ev?.result?.value;
          }
          async function state(){return evaluate('window.PrometeoRailWorld.getState()')}
          async function key(key,code,down){
            await send('Input.dispatchKeyEvent',{
              type:down?'keyDown':'keyUp',
              key,code,
              windowsVirtualKeyCode:key==='ArrowUp'?38:key==='ArrowDown'?40:0,
              nativeVirtualKeyCode:key==='ArrowUp'?38:key==='ArrowDown'?40:0
            });
          }
          async function click(x,y){
            await send('Input.dispatchMouseEvent',{type:'mouseMoved',x,y});
            await send('Input.dispatchMouseEvent',{type:'mousePressed',x,y,button:'left',clickCount:1});
            await send('Input.dispatchMouseEvent',{type:'mouseReleased',x,y,button:'left',clickCount:1});
          }
          async function shot(url,file){
            await send('Page.navigate',{url});
            await waitExpression('Boolean(window.PrometeoRailWorldReview&&window.PrometeoRailWorldReview.ready)',file);
            await sleep(420);
            const out=await send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:false});
            const bytes=Buffer.from(out.data,'base64');
            if(bytes.length<10000)throw new Error('Screenshot too small '+file+' '+bytes.length);
            await fs.mkdir(path.dirname(file),{recursive:true});
            await fs.writeFile(file,bytes);
          }

          const reviews=[
            ['arcos','http://127.0.0.1:4173/demos/prometeo-rail-world-v1/?review=1&map=1&z=28&playerMap=1&playerZ=49&playerX=0'],
            ['calzada','http://127.0.0.1:4173/demos/prometeo-rail-world-v1/?review=1&map=3&z=42&playerMap=3&playerZ=64&playerX=0'],
            ['tunel','http://127.0.0.1:4173/demos/prometeo-rail-world-v1/?review=1&map=4&z=42&playerMap=4&playerZ=64&playerX=0'],
            ['torres','http://127.0.0.1:4173/demos/prometeo-rail-world-v1/?review=1&map=5&z=42&playerMap=5&playerZ=64&playerX=0']
          ];
          for(const [id,url] of reviews)await shot(url,'demos/prometeo-rail-world-v1/review/'+id+'.png');

          await send('Page.navigate',{url:'http://127.0.0.1:4173/demos/prometeo-rail-world-v1/'});
          await waitExpression('Boolean(window.PrometeoRailWorldReview&&window.PrometeoRailWorldReview.ready&&window.PrometeoRailWorld)', 'rail runtime');

          // 1. CLICK MOVES PLAYER, NOT CAMERA.
          const initial=await state();
          await click(683,255);
          await sleep(1050);
          const clicked=await state();
          if(!(clicked.playerGlobal>initial.playerGlobal+16)){
            throw new Error('Click did not move player far enough '+JSON.stringify({initial,clicked}));
          }
          if(Math.abs(clicked.cameraGlobal-initial.cameraGlobal)>.35){
            throw new Error('Click incorrectly moved camera '+JSON.stringify({initial,clicked}));
          }

          // 2. ARROW MOVES CAMERA WHILE PLAYER KEEPS ITS OWN TARGET.
          const clickTarget=clicked.playerTargetGlobal;
          await key('ArrowUp','ArrowUp',true);
          await sleep(850);
          await key('ArrowUp','ArrowUp',false);
          await sleep(220);
          const arrow=await state();
          if(!(arrow.cameraGlobal>clicked.cameraGlobal+12)){
            throw new Error('Arrow did not move camera '+JSON.stringify({clicked,arrow}));
          }
          if(Math.abs(arrow.playerTargetGlobal-clickTarget)>.02){
            throw new Error('Camera movement changed player target '+JSON.stringify({clicked,arrow}));
          }

          // 3. WHEEL ADDS CAMERA INERTIA, STILL WITHOUT RETARGETING PLAYER.
          const beforeWheel=await state();
          for(let i=0;i<5;i++){
            await send('Input.dispatchMouseEvent',{type:'mouseWheel',x:680,y:380,deltaX:0,deltaY:-420});
            await sleep(65);
          }
          await sleep(720);
          const wheel=await state();
          if(!(wheel.cameraGlobal>beforeWheel.cameraGlobal+4)){
            throw new Error('Wheel did not move camera '+JSON.stringify({beforeWheel,wheel}));
          }
          if(Math.abs(wheel.playerTargetGlobal-clickTarget)>.02){
            throw new Error('Wheel changed player target '+JSON.stringify({beforeWheel,wheel}));
          }

          // 4. BACKWARD PLAYER MOVE: CAMERA FIRST, THEN CLICK A VISIBLE POINT BEHIND PLAYER.
          await evaluate('window.PrometeoRailWorld.setState({cameraMap:1,cameraZ:5,cameraX:0,playerMap:1,playerZ:70,playerX:0,immediate:true})');
          const beforeBack=await state();
          await evaluate('window.PrometeoRailWorld.setPlayerTargetFromPercent(50,88)');
          await sleep(900);
          const backward=await state();
          if(!(backward.playerTargetGlobal<beforeBack.playerGlobal-20 && backward.playerGlobal<beforeBack.playerGlobal-12)){
            throw new Error('Backward click model failed '+JSON.stringify({beforeBack,backward}));
          }
          if(Math.abs(backward.cameraGlobal-beforeBack.cameraGlobal)>.35){
            throw new Error('Backward player move dragged camera '+JSON.stringify({beforeBack,backward}));
          }

          // 5. CAMERA CAN CROSS TO NEXT MAP WHILE PLAYER REMAINS IN THE OLD MAP.
          await evaluate('window.PrometeoRailWorld.setState({cameraMap:1,cameraZ:131.85,cameraX:0,playerMap:1,playerZ:52,playerX:0,immediate:true})');
          const beforeCross=await state();
          await key('ArrowUp','ArrowUp',true);
          await sleep(720);
          await key('ArrowUp','ArrowUp',false);
          await sleep(180);
          const crossed=await state();
          if(!(crossed.cameraMap===3 && crossed.playerMap===1 && crossed.transitions>=1)){
            throw new Error('Independent map crossing failed '+JSON.stringify({beforeCross,crossed}));
          }

          console.log('FUNCTIONAL_RAIL_V3 PASS',JSON.stringify({initial,clicked,arrow,wheel,beforeBack,backward,crossed}));
          ws.close();

          await fs.writeFile('demos/prometeo-rail-world-v1/review/manifest.json',JSON.stringify({
            schema:'prometeo.rail-world-review/v3',
            source_sha:process.env.SOURCE_SHA,
            generated_at:new Date().toISOString(),
            renderer:'visuals/spaces-lab v35 live bridge',
            runtime:'v3-decoupled',
            semantics:{
              click:'player target only',
              wheel:'camera only',
              arrows:'camera only',
              touch_drag:'camera only',
              camera_and_player:'independent global route coordinates'
            },
            map_sequence:[1,3,4,5],
            review:['arcos.png','calzada.png','tunel.png','torres.png']
          },null,2)+'\n');
          NODE

          ls -lh demos/prometeo-rail-world-v1/review

      - name: Upload exact evidence
        uses: actions/upload-artifact@v4
        with:
          name: rail-world-v3-${{ github.sha }}
          path: demos/prometeo-rail-world-v1/review/
          retention-days: 30
          if-no-files-found: error

      - name: Publish source and evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/rail-world-v3
          mkdir -p /tmp/rail-world-v3/demos/prometeo-rail-world-v1 /tmp/rail-world-v3/visuals/spaces-lab /tmp/rail-world-v3/workflow
          cp demos/prometeo-rail-world-v1/index.html /tmp/rail-world-v3/demos/prometeo-rail-world-v1/index.html
          cp -a demos/prometeo-rail-world-v1/review /tmp/rail-world-v3/demos/prometeo-rail-world-v1/
          cp visuals/spaces-lab/index.html /tmp/rail-world-v3/visuals/spaces-lab/index.html
          cp .github/workflows/rail-world-build-v1.yml /tmp/rail-world-v3/workflow/rail-world-build-v1.yml

          git reset --hard HEAD
          git clean -fd

          publish_branch () {
            local branch="$1"
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
            mkdir -p demos/prometeo-rail-world-v1 visuals/spaces-lab
            cp /tmp/rail-world-v3/demos/prometeo-rail-world-v1/index.html demos/prometeo-rail-world-v1/index.html
            rm -rf demos/prometeo-rail-world-v1/review demos/prometeo-rail-world-v1/frames
            cp -a /tmp/rail-world-v3/demos/prometeo-rail-world-v1/review demos/prometeo-rail-world-v1/
            cp /tmp/rail-world-v3/visuals/spaces-lab/index.html visuals/spaces-lab/index.html
            if [ "$branch" = "main" ]; then
              mkdir -p .github/workflows
              cp /tmp/rail-world-v3/workflow/rail-world-build-v1.yml .github/workflows/rail-world-build-v1.yml
            fi
            git add -A demos/prometeo-rail-world-v1 visuals/spaces-lab
            if [ "$branch" = "main" ]; then git add .github/workflows/rail-world-build-v1.yml; fi
            if git diff --cached --quiet; then return 0; fi
            git commit -m "visuals: publish decoupled Rail World v3"
            for n in 1 2 3 4; do
              if git push origin "HEAD:$branch"; then return 0; fi
              git fetch origin "$branch"
              git rebase "origin/$branch"
              sleep 2
            done
            return 1
          }

          publish_branch main
          publish_branch gh-pages

      - name: Verify public decoupled controls
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          URL="https://juanmanuelpm.github.io/prometeo/demos/prometeo-rail-world-v1/"
          for i in {1..48}; do
            PAGE="$(curl -fsSL --max-time 12 "$URL" 2>/dev/null || true)"
            if printf '%s' "$PAGE" | grep -Fq "v3-decoupled"; then break; fi
            sleep 5
          done

          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --remote-debugging-port=9223 --user-data-dir=/tmp/rail-world-public about:blank >/tmp/rail-public.log 2>&1 &
          echo $! >/tmp/rail-public.pid
          trap 'kill "$(cat /tmp/rail-public.pid)" 2>/dev/null || true' EXIT
          for i in {1..80}; do
            if curl -fsS "http://127.0.0.1:9223/json/version" >/dev/null; then break; fi
            sleep .25
          done

          node --input-type=module <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const pages=await (await fetch('http://127.0.0.1:9223/json/list')).json();
          const page=pages.find(x=>x.type==='page');
          const ws=new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{ws.addEventListener('open',resolve,{once:true});ws.addEventListener('error',reject,{once:true})});
          let seq=0;const pending=new Map();
          ws.addEventListener('message',ev=>{const m=JSON.parse(String(ev.data));if(!m.id)return;const p=pending.get(m.id);if(!p)return;pending.delete(m.id);m.error?p.reject(new Error(m.error.message)):p.resolve(m.result||{})});
          const send=(method,params={})=>{const id=++seq;return new Promise((resolve,reject)=>{pending.set(id,{resolve,reject});ws.send(JSON.stringify({id,method,params}))})};
          await send('Page.enable');await send('Runtime.enable');
          await send('Page.navigate',{url:'https://juanmanuelpm.github.io/prometeo/demos/prometeo-rail-world-v1/'});
          for(let i=0;i<240;i++){
            const ev=await send('Runtime.evaluate',{expression:'Boolean(window.PrometeoRailWorldReview&&window.PrometeoRailWorldReview.ready&&window.PrometeoRailWorld)',returnByValue:true});
            if(ev?.result?.value)break;
            if(i===239)throw new Error('Public Rail World never became ready');
            await sleep(125);
          }
          const state=async()=> (await send('Runtime.evaluate',{expression:'window.PrometeoRailWorld.getState()',returnByValue:true}))?.result?.value;
          const before=await state();
          await send('Input.dispatchMouseEvent',{type:'mouseMoved',x:683,y:255});
          await send('Input.dispatchMouseEvent',{type:'mousePressed',x:683,y:255,button:'left',clickCount:1});
          await send('Input.dispatchMouseEvent',{type:'mouseReleased',x:683,y:255,button:'left',clickCount:1});
          await sleep(900);
          const afterClick=await state();
          if(!(afterClick.playerGlobal>before.playerGlobal+12 && Math.abs(afterClick.cameraGlobal-before.cameraGlobal)<.35)){
            throw new Error('Public click/camera decoupling failed '+JSON.stringify({before,afterClick}));
          }

          await send('Input.dispatchKeyEvent',{type:'keyDown',key:'ArrowUp',code:'ArrowUp',windowsVirtualKeyCode:38,nativeVirtualKeyCode:38});
          await sleep(720);
          await send('Input.dispatchKeyEvent',{type:'keyUp',key:'ArrowUp',code:'ArrowUp',windowsVirtualKeyCode:38,nativeVirtualKeyCode:38});
          await sleep(180);
          const afterArrow=await state();
          if(!(afterArrow.cameraGlobal>afterClick.cameraGlobal+9 && Math.abs(afterArrow.playerTargetGlobal-afterClick.playerTargetGlobal)<.02)){
            throw new Error('Public camera control failed '+JSON.stringify({afterClick,afterArrow}));
          }

          const beforeWheel=await state();
          for(let i=0;i<4;i++){
            await send('Input.dispatchMouseEvent',{type:'mouseWheel',x:680,y:380,deltaX:0,deltaY:-420});
            await sleep(60);
          }
          await sleep(650);
          const afterWheel=await state();
          if(!(afterWheel.cameraGlobal>beforeWheel.cameraGlobal+3 && Math.abs(afterWheel.playerTargetGlobal-beforeWheel.playerTargetGlobal)<.02)){
            throw new Error('Public wheel camera control failed '+JSON.stringify({beforeWheel,afterWheel}));
          }

          console.log('PUBLIC_RAIL_WORLD_V3_VERIFIED',JSON.stringify({before,afterClick,afterArrow,afterWheel}));
          ws.close();
          NODE
