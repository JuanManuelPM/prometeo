name: Rail World Build v4

on:
  push:
    branches: [visual-review-rail-world-v1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rail-world-build-v4
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-review-rail-world-v1
          fetch-depth: 2

      - id: chrome
        uses: browser-actions/setup-chrome@v1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Serve exact checkout
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . >/tmp/rail-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:4173/demos/prometeo-rail-world-v1/" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rail-http.log
          exit 1

      - name: Review and gated-world browser test
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf demos/prometeo-rail-world-v1/review
          mkdir -p demos/prometeo-rail-world-v1/review

          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --remote-debugging-port=9222 --user-data-dir=/tmp/rail-world-chrome about:blank >/tmp/rail-chrome.log 2>&1 &
          echo $! >/tmp/rail-chrome.pid
          trap 'kill "$(cat /tmp/rail-chrome.pid)" 2>/dev/null || true' EXIT

          for i in {1..80}; do
            if curl -fsS "http://127.0.0.1:9222/json/version" >/tmp/rail-version.json; then break; fi
            sleep .25
          done
          test -s /tmp/rail-version.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';

          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const pages=await (await fetch('http://127.0.0.1:9222/json/list')).json();
          const page=pages.find(x=>x.type==='page');
          if(!page?.webSocketDebuggerUrl)throw new Error('No Chrome page target');
          const ws=new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{
            ws.addEventListener('open',resolve,{once:true});
            ws.addEventListener('error',reject,{once:true});
          });

          let seq=0;
          const pending=new Map();
          ws.addEventListener('message',ev=>{
            const msg=JSON.parse(String(ev.data));
            if(!msg.id)return;
            const p=pending.get(msg.id);
            if(!p)return;
            pending.delete(msg.id);
            if(msg.error)p.reject(new Error(msg.error.message||JSON.stringify(msg.error)));
            else p.resolve(msg.result||{});
          });
          const send=(method,params={})=>{
            const id=++seq;
            return new Promise((resolve,reject)=>{
              pending.set(id,{resolve,reject});
              ws.send(JSON.stringify({id,method,params}));
            });
          };

          await send('Page.enable');
          await send('Runtime.enable');
          await send('Network.enable');
          await send('Emulation.setDeviceMetricsOverride',{width:1365,height:768,deviceScaleFactor:1,mobile:false,screenWidth:1365,screenHeight:768});

          async function waitExpression(expression,label,attempts=240){
            for(let i=0;i<attempts;i++){
              try{
                const ev=await send('Runtime.evaluate',{expression,returnByValue:true});
                if(ev?.result?.value)return ev.result.value;
              }catch{}
              await sleep(125);
            }
            throw new Error('Never ready: '+label);
          }
          async function evaluate(expression){
            const ev=await send('Runtime.evaluate',{expression,returnByValue:true});
            return ev?.result?.value;
          }
          async function state(){return evaluate('window.PrometeoRailWorld.getState()')}
          async function key(key,code,down){
            await send('Input.dispatchKeyEvent',{
              type:down?'keyDown':'keyUp',
              key,code,
              windowsVirtualKeyCode:key==='ArrowUp'?38:key==='ArrowDown'?40:0,
              nativeVirtualKeyCode:key==='ArrowUp'?38:key==='ArrowDown'?40:0
            });
          }
          async function click(x,y){
            await send('Input.dispatchMouseEvent',{type:'mouseMoved',x,y});
            await send('Input.dispatchMouseEvent',{type:'mousePressed',x,y,button:'left',clickCount:1});
            await send('Input.dispatchMouseEvent',{type:'mouseReleased',x,y,button:'left',clickCount:1});
          }
          async function shot(url,file){
            await send('Page.navigate',{url});
            await waitExpression('Boolean(window.PrometeoRailWorldReview&&window.PrometeoRailWorldReview.ready)',file);
            await sleep(420);
            const out=await send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:false});
            const bytes=Buffer.from(out.data,'base64');
            if(bytes.length<10000)throw new Error('Screenshot too small '+file+' '+bytes.length);
            await fs.mkdir(path.dirname(file),{recursive:true});
            await fs.writeFile(file,bytes);
          }

          const reviews=[
            ['arcos','http://127.0.0.1:4173/demos/prometeo-rail-world-v1/?review=1&map=1&z=28&playerMap=1&playerZ=49&playerX=0'],
            ['arcos-gate','http://127.0.0.1:4173/demos/prometeo-rail-world-v1/?review=1&map=1&z=105&playerMap=1&playerZ=124.5&playerX=0'],
            ['calzada','http://127.0.0.1:4173/demos/prometeo-rail-world-v1/?review=1&map=3&z=42&playerMap=3&playerZ=64&playerX=0'],
            ['tunel','http://127.0.0.1:4173/demos/prometeo-rail-world-v1/?review=1&map=4&z=42&playerMap=4&playerZ=64&playerX=0'],
            ['torres','http://127.0.0.1:4173/demos/prometeo-rail-world-v1/?review=1&map=5&z=42&playerMap=5&playerZ=64&playerX=0']
          ];
          for(const [id,url] of reviews)await shot(url,'demos/prometeo-rail-world-v1/review/'+id+'.png');

          await send('Page.navigate',{url:'http://127.0.0.1:4173/demos/prometeo-rail-world-v1/'});
          await waitExpression('Boolean(window.PrometeoRailWorldReview&&window.PrometeoRailWorldReview.ready&&window.PrometeoRailWorld)', 'rail runtime');

          // 1. CLICK MOVES PLAYER, NEVER CAMERA.
          const initial=await state();
          await click(683,255);
          await sleep(900);
          const clicked=await state();
          if(!(clicked.playerGlobal>initial.playerGlobal+14))throw new Error('Click did not move player '+JSON.stringify({initial,clicked}));
          if(Math.abs(clicked.cameraGlobal-initial.cameraGlobal)>.35)throw new Error('Click moved camera '+JSON.stringify({initial,clicked}));

          // 2. CAMERA OVERTAKE IS A PROJECTION EXIT, NOT AN EARLY VISIBILITY TOGGLE.
          await evaluate('window.PrometeoRailWorld.setState({cameraMap:1,cameraZ:20,cameraX:0,playerMap:1,playerZ:32,playerX:0,immediate:true})');
          await sleep(80);
          const pass0=await state();
          await evaluate('window.PrometeoRailWorld.moveCameraBy(6,0)');
          await sleep(160);
          const pass1=await state();
          await evaluate('window.PrometeoRailWorld.moveCameraBy(4,0)');
          await sleep(160);
          const pass2=await state();
          await evaluate('window.PrometeoRailWorld.moveCameraBy(3,0)');
          await sleep(160);
          const pass3=await state();
          if(!(pass0.playerProjection.visible && pass1.playerProjection.y>pass0.playerProjection.y+18 && pass1.playerProjection.scale>pass0.playerProjection.scale+.5)){
            throw new Error('Player did not grow/drop while camera approached '+JSON.stringify({pass0,pass1}));
          }
          if(!(pass2.playerProjection.rendered && !pass2.playerProjection.visible && pass2.playerProjection.y>130 && !pass2.playerProjection.behind)){
            throw new Error('Player did not leave through bottom before overtake '+JSON.stringify(pass2));
          }
          if(!(pass3.playerProjection.behind && !pass3.playerProjection.visible)){
            throw new Error('Player not behind camera after overtake '+JSON.stringify(pass3));
          }

          // 3. CAMERA CANNOT SCROLL INTO THE NEXT MAP. MAP BOUNDARY IS PHYSICAL.
          await evaluate('window.PrometeoRailWorld.setState({cameraMap:1,cameraZ:131.55,cameraX:0,playerMap:1,playerZ:100,playerX:0,immediate:true})');
          await key('ArrowUp','ArrowUp',true);
          await sleep(850);
          await key('ArrowUp','ArrowUp',false);
          await sleep(180);
          const clamped=await state();
          if(!(clamped.cameraMap===1 && clamped.cameraZ<132 && clamped.cameraZ>131.5)){
            throw new Error('Camera crossed map without portal '+JSON.stringify(clamped));
          }

          // 4. PORTAL IS DORMANT WHILE PLAYER IS FAR.
          await evaluate('window.PrometeoRailWorld.setState({cameraMap:1,cameraZ:105,cameraX:0,playerMap:1,playerZ:94,playerX:0,immediate:true})');
          await sleep(120);
          const dormant=await state();
          if(dormant.gate.active)throw new Error('Gate active while player far '+JSON.stringify(dormant));

          // 5. FIRST CLICK: PLAYER APPROACHES EXIT; PORTAL MATERIALIZES.
          await evaluate('window.PrometeoRailWorld.setPlayerTargetFromPercent(50,45)');
          await sleep(1050);
          const armed=await state();
          if(!(armed.gate.active && armed.gate.key==='1>3' && armed.gate.projection.visible)){
            throw new Error('Gate did not materialize near player '+JSON.stringify(armed));
          }

          // 6. WALK AWAY; PORTAL MUST RETRACT.
          await evaluate('window.PrometeoRailWorld.moveCameraBy(-15,0)');
          await evaluate('window.PrometeoRailWorld.setPlayerTargetFromPercent(50,90)');
          await sleep(900);
          const retracted=await state();
          if(retracted.gate.active)throw new Error('Gate stayed active after player left '+JSON.stringify(retracted));

          // 7. RETURN TO GATE, THEN SECOND CLICK ON THE PRISM ENTERS NEXT MAP WITH PLAYER + CAMERA TOGETHER.
          await evaluate('window.PrometeoRailWorld.setState({cameraMap:1,cameraZ:105,cameraX:0,playerMap:1,playerZ:124.5,playerX:0,immediate:true})');
          await sleep(180);
          const readyGate=await state();
          if(!(readyGate.gate.active&&readyGate.gate.projection.visible))throw new Error('Prepared gate not visible '+JSON.stringify(readyGate));
          const rect=await evaluate('(()=>{const r=document.querySelector("#portal").getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,w:r.width,h:r.height}})()');
          await click(rect.x,rect.y);
          await sleep(620);
          const entered=await state();
          if(!(entered.cameraMap===3 && entered.playerMap===3 && entered.sameMap && !entered.gate.entering && entered.transitions>=1)){
            throw new Error('Portal did not bring camera and player together '+JSON.stringify({rect,entered}));
          }

          console.log('FUNCTIONAL_RAIL_V4 PASS',JSON.stringify({initial,clicked,pass0,pass1,pass2,pass3,clamped,dormant,armed,retracted,entered}));
          ws.close();

          await fs.writeFile('demos/prometeo-rail-world-v1/review/manifest.json',JSON.stringify({
            schema:'prometeo.rail-world-review/v4',
            source_sha:process.env.SOURCE_SHA,
            generated_at:new Date().toISOString(),
            renderer:'visuals/spaces-lab v35 live bridge',
            runtime:'v4-gated-world',
            semantics:{
              click:'player target only',
              wheel_arrows_touch_drag:'camera only',
              camera_overtake:'projection exits through viewport bottom',
              map_boundary:'camera clamps; cannot auto-cross',
              map_transition:'player proximity arms a world-space prism; second click enters',
              portal_exit:'camera and player arrive together',
              portal_retract:'moving player away hides it'
            },
            map_sequence:[1,3,4,5],
            review:['arcos.png','arcos-gate.png','calzada.png','tunel.png','torres.png']
          },null,2)+'\n');
          NODE

          ls -lh demos/prometeo-rail-world-v1/review

      - name: Upload exact evidence
        uses: actions/upload-artifact@v4
        with:
          name: rail-world-v4-${{ github.sha }}
          path: demos/prometeo-rail-world-v1/review/
          retention-days: 30
          if-no-files-found: error

      - name: Publish source and evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/rail-world-v4
          mkdir -p /tmp/rail-world-v4/demos/prometeo-rail-world-v1 /tmp/rail-world-v4/visuals/spaces-lab /tmp/rail-world-v4/workflow
          cp demos/prometeo-rail-world-v1/index.html /tmp/rail-world-v4/demos/prometeo-rail-world-v1/index.html
          cp -a demos/prometeo-rail-world-v1/review /tmp/rail-world-v4/demos/prometeo-rail-world-v1/
          cp visuals/spaces-lab/index.html /tmp/rail-world-v4/visuals/spaces-lab/index.html
          cp .github/workflows/rail-world-build-v1.yml /tmp/rail-world-v4/workflow/rail-world-build-v1.yml

          git reset --hard HEAD
          git clean -fd

          publish_branch () {
            local branch="$1"
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
            mkdir -p demos/prometeo-rail-world-v1 visuals/spaces-lab
            cp /tmp/rail-world-v4/demos/prometeo-rail-world-v1/index.html demos/prometeo-rail-world-v1/index.html
            rm -rf demos/prometeo-rail-world-v1/review demos/prometeo-rail-world-v1/frames
            cp -a /tmp/rail-world-v4/demos/prometeo-rail-world-v1/review demos/prometeo-rail-world-v1/
            cp /tmp/rail-world-v4/visuals/spaces-lab/index.html visuals/spaces-lab/index.html
            if [ "$branch" = "main" ]; then
              mkdir -p .github/workflows
              cp /tmp/rail-world-v4/workflow/rail-world-build-v1.yml .github/workflows/rail-world-build-v1.yml
            fi
            git add -A demos/prometeo-rail-world-v1 visuals/spaces-lab
            if [ "$branch" = "main" ]; then git add .github/workflows/rail-world-build-v1.yml; fi
            if git diff --cached --quiet; then return 0; fi
            git commit -m "visuals: publish gated Rail World v4"
            for n in 1 2 3 4; do
              if git push origin "HEAD:$branch"; then return 0; fi
              git fetch origin "$branch"
              git rebase "origin/$branch"
              sleep 2
            done
            return 1
          }

          publish_branch main
          publish_branch gh-pages

      - name: Verify public gated world
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          URL="https://juanmanuelpm.github.io/prometeo/demos/prometeo-rail-world-v1/"
          for i in {1..48}; do
            PAGE="$(curl -fsSL --max-time 12 "$URL" 2>/dev/null || true)"
            if printf '%s' "$PAGE" | grep -Fq "v4-gated-world"; then break; fi
            sleep 5
          done

          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --remote-debugging-port=9223 --user-data-dir=/tmp/rail-world-public about:blank >/tmp/rail-public.log 2>&1 &
          echo $! >/tmp/rail-public.pid
          trap 'kill "$(cat /tmp/rail-public.pid)" 2>/dev/null || true' EXIT
          for i in {1..80}; do
            if curl -fsS "http://127.0.0.1:9223/json/version" >/dev/null; then break; fi
            sleep .25
          done

          node --input-type=module <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const pages=await (await fetch('http://127.0.0.1:9223/json/list')).json();
          const page=pages.find(x=>x.type==='page');
          const ws=new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{ws.addEventListener('open',resolve,{once:true});ws.addEventListener('error',reject,{once:true})});
          let seq=0;const pending=new Map();
          ws.addEventListener('message',ev=>{const m=JSON.parse(String(ev.data));if(!m.id)return;const p=pending.get(m.id);if(!p)return;pending.delete(m.id);m.error?p.reject(new Error(m.error.message)):p.resolve(m.result||{})});
          const send=(method,params={})=>{const id=++seq;return new Promise((resolve,reject)=>{pending.set(id,{resolve,reject});ws.send(JSON.stringify({id,method,params}))})};
          const evaluate=async expression=>(await send('Runtime.evaluate',{expression,returnByValue:true}))?.result?.value;
          await send('Page.enable');await send('Runtime.enable');
          await send('Page.navigate',{url:'https://juanmanuelpm.github.io/prometeo/demos/prometeo-rail-world-v1/'});
          for(let i=0;i<240;i++){
            if(await evaluate('Boolean(window.PrometeoRailWorldReview&&window.PrometeoRailWorldReview.ready&&window.PrometeoRailWorld)'))break;
            if(i===239)throw new Error('Public Rail World never became ready');
            await sleep(125);
          }
          const state=()=>evaluate('window.PrometeoRailWorld.getState()');

          await evaluate('window.PrometeoRailWorld.setState({cameraMap:1,cameraZ:105,cameraX:0,playerMap:1,playerZ:124.5,playerX:0,immediate:true})');
          await sleep(180);
          const armed=await state();
          if(!(armed.gate.active&&armed.gate.projection.visible))throw new Error('Public portal not armed '+JSON.stringify(armed));

          const rect=await evaluate('(()=>{const r=document.querySelector("#portal").getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}})()');
          await send('Input.dispatchMouseEvent',{type:'mouseMoved',x:rect.x,y:rect.y});
          await send('Input.dispatchMouseEvent',{type:'mousePressed',x:rect.x,y:rect.y,button:'left',clickCount:1});
          await send('Input.dispatchMouseEvent',{type:'mouseReleased',x:rect.x,y:rect.y,button:'left',clickCount:1});
          await sleep(620);
          const entered=await state();
          if(!(entered.cameraMap===3&&entered.playerMap===3&&entered.sameMap))throw new Error('Public portal transition failed '+JSON.stringify({armed,entered}));

          console.log('PUBLIC_RAIL_WORLD_V4_VERIFIED',JSON.stringify({armed,entered}));
          ws.close();
          NODE
