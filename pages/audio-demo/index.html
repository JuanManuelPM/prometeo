<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3efe5">
<title>Audio · demo</title>
<style>
:root{--paper:#f3efe5;--ink:#20211f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(680px,100%);border-top:1px solid color-mix(in srgb,var(--ink) 25%,transparent);border-bottom:1px solid color-mix(in srgb,var(--ink) 25%,transparent);padding:28px 0}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.55;margin-bottom:18px}p{font-size:clamp(22px,4vw,36px);line-height:1.22;letter-spacing:-.025em;margin:0 0 28px}.row{display:flex;align-items:center;gap:12px}.play{width:44px;height:44px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:700 18px/1 system-ui;display:grid;place-items:center;cursor:pointer;border-radius:0}.play[disabled]{cursor:default;opacity:.45}.status{font-size:12px;font-weight:650;opacity:.5;min-height:1em}.meta{margin-top:24px;font-size:11px;opacity:.42}
</style>
</head>
<body>
<main class="card">
  <div class="eyebrow">Audio · demo</div>
  <p id="text">La retroalimentación negativa reduce una desviación y favorece la estabilidad del sistema.</p>
  <div class="row">
    <button id="play" class="play" type="button" aria-label="Reproducir" disabled>◌</button>
    <span id="status" class="status">preparando audio…</span>
  </div>
  <div class="meta">Generación y caché compartido · misma infraestructura de voz usada por Modelos III</div>
</main>
<script>
(()=>{
'use strict';
const ENDPOINT='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/casa-room-audio';
const ID='modelos-audio-demo-v1';
const TEXT=document.getElementById('text').textContent.trim();
const VOICE_PROMPT='A young adult Argentine Spanish-speaking teacher with a warm, natural, clear, slightly low voice. Rioplatense accent should be subtle and authentic, never caricatured. Conversational and pedagogical, as if explaining a difficult idea one-to-one before an exam. Natural phrasing, moderate energy, brief meaningful pauses, precise articulation of academic vocabulary, no announcer voice, no assistant voice, no robotic cadence, no theatrical acting.';
const play=document.getElementById('play'),status=document.getElementById('status');
let blob=null,ctx=null,buffer=null,source=null,preparing=null;
const isAudio=r=>r.ok&&(r.headers.get('content-type')||'').toLowerCase().startsWith('audio/');
async function request(){
  let r=await fetch(`${ENDPOINT}?id=${encodeURIComponent(ID)}`,{cache:'no-store'});
  if(isAudio(r))return r.blob();
  if(r.status!==404)throw new Error(`GET ${r.status}`);
  r=await fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({voicePrompt:VOICE_PROMPT,text:TEXT,messageId:ID}),cache:'no-store'});
  if(!isAudio(r))throw new Error(`POST ${r.status}`);
  return r.blob();
}
async function prepare(){
  if(blob)return blob;if(preparing)return preparing;
  play.disabled=true;play.textContent='◌';status.textContent='preparando audio…';
  preparing=request().then(b=>{if(!b.size)throw new Error('audio vacío');blob=b;play.disabled=false;play.textContent='▶';status.textContent='listo';return b}).catch(e=>{console.error(e);play.disabled=false;play.textContent='↻';status.textContent='no respondió · reintentar';throw e}).finally(()=>preparing=null);
  return preparing;
}
async function ensureBuffer(){
  await prepare();
  if(buffer)return buffer;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error('AudioContext no disponible');
  ctx=ctx||new AC();if(ctx.state==='suspended')await ctx.resume();
  buffer=await ctx.decodeAudioData((await blob.arrayBuffer()).slice(0));return buffer;
}
play.onclick=async()=>{
  if(play.textContent==='↻'){prepare().catch(()=>{});return}
  if(source){try{source.stop()}catch{}source=null;play.textContent='▶';status.textContent='listo';return}
  try{
    play.disabled=true;play.textContent='◌';status.textContent='abriendo…';
    const b=await ensureBuffer();if(ctx.state==='suspended')await ctx.resume();
    source=ctx.createBufferSource();source.buffer=b;source.connect(ctx.destination);source.onended=()=>{source=null;play.disabled=false;play.textContent='▶';status.textContent='listo'};
    source.start();play.disabled=false;play.textContent='❚❚';status.textContent='reproduciendo';
  }catch(e){console.error(e);source=null;play.disabled=false;play.textContent='↻';status.textContent='no respondió · reintentar'}
};
prepare().catch(()=>{});
})();
</script>
</body>
</html>
