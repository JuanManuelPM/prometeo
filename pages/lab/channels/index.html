#home{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:30px}.channel-cloud{display:flex;flex-wrap:wrap;justify-content:center;gap:38px 32px;max-width:1000px}.channel-pick{width:146px;text-align:center}.channel-circle{width:146px;height:146px;border-radius:50%;overflow:hidden;border:1px solid rgba(36,41,35,.72)}.channel-circle img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.08)}.channel-label{margin-top:10px;font-size:11px;font-weight:700}.channel-pick:hover .channel-circle{outline:2px solid var(--fg);outline-offset:4px}
#channel{min-height:100dvh;padding:18px 24px 28px}.top{height:48px;display:grid;grid-template-columns:42px 1fr auto;align-items:center}.back{font-size:24px;text-align:left}.name{font-size:18px;font-weight:700;letter-spacing:-.04em}.tabs{display:flex;gap:18px}.tab{font-size:10px;font-weight:700;padding:7px 0;border-bottom:2px solid transparent}.tab.active{border-bottom-color:var(--fg)}.body{padding-top:30px}.stories{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;max-width:1120px}.story{min-height:174px;border:1px solid rgba(36,41,35,.75);padding:17px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}.story.active{background:var(--fg);color:var(--bg)}.story-title{font-size:19px;line-height:1.04;font-weight:700;letter-spacing:-.045em}.story-copy{font-size:10px;line-height:1.48;margin-top:12px}.story-foot{display:flex;justify-content:space-between;font-size:9px;margin-top:18px}.story-arrow{font-size:18px}.detail{max-width:1120px;margin-top:31px}.detail-head{display:flex;justify-content:space-between;gap:16px;margin-bottom:12px}.detail-name{font-size:13px;font-weight:700}.work{font-size:9px;border-bottom:1px solid var(--fg);padding-bottom:3px}.episodes{display:flex;gap:12px;overflow-x:auto;padding-bottom:5px}.episode{flex:0 0 155px;text-align:left}.poster{width:100%;aspect-ratio:9/16;overflow:hidden;border:1px solid rgba(36,41,35,.78)}.poster img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.08)}.ep-title,.ready-title{font-size:10px;font-weight:700;line-height:1.28;margin-top:7px}.ep-state,.ready-meta{font-size:8px;margin-top:3px}.ask{display:grid;grid-template-columns:1fr auto;max-width:760px;margin-top:25px;border-bottom:1px solid var(--fg)}.ask input{border:0;outline:0;background:none;padding:11px 0;font-size:11px}.ask input::placeholder{color:var(--fg);opacity:.6}.send{font-size:19px;padding-left:14px}.ready-grid{display:grid;grid-template-columns:repeat(5,minmax(110px,180px));gap:14px;max-width:1040px}
.worker{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:22px}.worker-box{width:min(560px,100%)}.worker-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:27px}.worker-head b{font-size:14px}.worker-close{font-size:24px}.worker-task{font-size:25px;font-weight:700;line-height:1.08;letter-spacing:-.05em}.worker-small{font-size:10px;line-height:1.55;margin-top:23px;max-width:460px}.worker-actions{display:flex;gap:9px;margin-top:24px}.worker-action{border:1px solid var(--fg);padding:10px 12px;font-size:9px}.worker-action.primary{background:var(--fg);color:var(--bg)}.done{margin-top:18px;font-size:10px;font-weight:700}
@media(max-width:780px){#home{padding:24px 14px}.channel-cloud{gap:28px 17px}.channel-pick{width:112px}.channel-circle{width:112px;height:112px}#channel{padding:14px 12px 24px}.top{grid-template-columns:36px 1fr auto}.stories{display:flex;overflow-x:auto}.story{flex:0 0 78%}.episode{flex:0 0 42%}.ready-grid{display:flex;overflow-x:auto}.ready-grid .episode{flex:0 0 42%}}

<button class="channel-pick" data-name="Odd Cities"><div class="channel-circle"><img src="https://upload.wikimedia.org/wikipedia/commons/4/4c/Nuremberg_chronicles_-_Strange_People_-_No_Nose_%28XIIr%29.jpg" alt=""></div><div class="channel-label">Odd Cities</div></button>
</div></section>
<section id="channel" class="hidden"><header class="top"><button class="back" id="back">←</button><div class="name" id="channelName"></div><div class="tabs"><button class="tab active" data-view="ideas">Ideas</button><button class="tab" data-view="ready">Listos</button></div></header><main class="body"><section id="ideasView"><div class="stories" id="stories"></div><div class="detail"><div class="detail-head"><div class="detail-name" id="detailName"></div><button class="work" id="work">↗ trabajar esta historia</button></div><div class="episodes" id="episodes"></div><div class="ask"><input id="request" placeholder="pedir una historia, cambio o video..."><button class="send" id="send">→</button></div></div></section><section id="readyView" class="hidden"><div class="ready-grid" id="readyGrid"></div></section></main></section>
<section class="worker hidden" id="worker"><div class="worker-box"><div class="worker-head"><b id="workerChannel"></b><button class="worker-close" id="workerClose">×</button></div><div class="worker-task" id="workerTask"></div><div class="worker-small" id="workerSmall"></div><div class="worker-actions"><button class="worker-action" id="copy">copiar enlace</button><button class="worker-action primary" id="simulate">simular →</button></div><div class="done hidden" id="done">cambio recibido · volver</div></div></section>
<script>
const IMG={pear:"https://upload.wikimedia.org/wikipedia/commons/thumb/e/ed/The_Apple_and_pear_as_vintage_fruits_%28Page_191%29_BHL6364698.jpg/960px-The_Apple_and_pear_as_vintage_fruits_%28Page_191%29_BHL6364698.jpg",skull:"https://upload.wikimedia.org/wikipedia/commons/5/56/Skull_with_hourglass.jpg",person:"https://upload.wikimedia.org/wikipedia/commons/4/4c/Nuremberg_chronicles_-_Strange_People_-_No_Nose_%28XIIr%29.jpg",deer:"https://upload.wikimedia.org/wikipedia/commons/3/38/Musk_1616.jpg"};
const data={"Frutidrama":[{title:"La boda secreta de Banana",copy:"Banana se casa con Durazno. Frutilla aparece con un compromiso anterior.",eps:[["Banana propone matrimonio en secreto","person","idea"],["Limón encuentra el anillo equivocado","pear","guion"],["Frutilla llega sin invitación","person","idea"],["Durazno descubre el pacto","skull","idea"]]},{title:"La herencia de Sandía",copy:"El testamento sólo premia a quien nunca le haya mentido a la abuela.",eps:[["Sandía deja una condición imposible","deer","listo"],["Manzana falsifica una carta","person","guion"],["Pera acusa al heredero equivocado","pear","idea"],["El abogado también estaba a prueba","skull","idea"]]},{title:"La doble vida de Frutilla",copy:"Dos familias creen que Frutilla vive con ellas. Los cumpleaños caen el mismo día.",eps:[["Dos cumpleaños, una Frutilla","pear","idea"],["Uva la ve entrar en otra casa","person","idea"],["Las dos familias compran la misma torta","deer","idea"],["Frutilla inventa una gemela","skull","idea"]]}],"Tiny Science":[{title:"El animal que ve colores imposibles",copy:"Una percepción que el ojo humano nunca puede experimentar.",eps:[["Lo que ve una mantis marina","pear","idea"],["Un color fuera de tu visión","deer","idea"],["Por qué tus ojos tienen un límite","person","guion"]]},{title:"El tiempo no corre igual",copy:"Dos relojes idénticos dejan de coincidir.",eps:[["Dos relojes se separan","skull","idea"],["El piso de arriba envejece distinto","person","idea"],["Cómo medirlo","pear","guion"]]},{title:"Lo que atraviesa tu cuerpo",copy:"Miles de partículas cruzan tu cuerpo sin que lo notes.",eps:[["Una lluvia invisible","deer","idea"],["Por qué no la sentís","pear","idea"],["Cómo sabemos que existe","person","idea"]]}],"Dark Maps":[{title:"La ciudad debajo de la ciudad",copy:"Un mapa conserva calles que ya no existen en la superficie.",eps:[["Calles enterradas","skull","guion"],["La entrada que quedó escondida","person","idea"],["El mapa viejo","pear","idea"]]},{title:"La isla que nunca estuvo ahí",copy:"Décadas de mapas insistieron en un lugar inexistente.",eps:[["La isla fantasma","deer","idea"],["Quién la inventó","person","idea"],["Cuándo desapareció del mapa","pear","guion"]]},{title:"La frontera móvil",copy:"Una frontera física cambia con el terreno.",eps:[["Dónde empieza el país","person","idea"],["El río mueve la línea","pear","idea"],["La casa entre dos países","deer","idea"]]}],"Forgotten Machines":[{title:"La computadora antes de la electricidad",copy:"Una máquina calculaba cuando la computadora aún no existía.",eps:[["La máquina imposible","person","guion"],["Cómo calculaba","pear","idea"],["Por qué nadie la terminó","skull","idea"]]},{title:"El correo por tubos",copy:"Una red urbana estuvo cerca de ser infraestructura cotidiana.",eps:[["La ciudad de tubos","deer","idea"],["Un mensaje a 60 km/h","person","idea"],["Por qué desapareció","skull","guion"]]},{title:"El avión nuclear",copy:"Una idea enorme que avanzó demasiado antes de ser cancelada.",eps:[["El reactor dentro del avión","skull","idea"],["Cómo protegían a la tripulación","person","idea"],["Por qué no voló","pear","guion"]]}],"Odd Cities":[{title:"La ciudad dentro de un edificio",copy:"Miles de personas resuelven casi toda su vida sin salir.",eps:[["Una ciudad vertical","deer","idea"],["Qué hay adentro","person","idea"],["Quién vive ahí","pear","guion"]]},{title:"La estación fantasma",copy:"Una estación cerrada sigue intacta debajo de una línea activa.",eps:[["El tren que no para","skull","guion"],["Qué quedó adentro","person","idea"],["Por qué cerró","pear","idea"]]},{title:"El barrio sin autos",copy:"Una regla simple reorganizó toda la calle.",eps:[["La calle sin motores","deer","idea"],["Cómo llega la gente","pear","idea"],["Qué pasó con los comercios","person","guion"]]}]};
let current="Frutidrama",selected=0;const $=s=>document.querySelector(s);function showChannel(name){current=name;selected=0;$("#home").classList.add("hidden");$("#channel").classList.remove("hidden");$("#channelName").textContent=name;view("ideas");render()}function render(){const arr=data[current],root=$("#stories");root.innerHTML="";arr.forEach((s,i)=>{const b=document.createElement("button");b.className="story"+(i===selected?" active":"");b.innerHTML=`<div><div class="story-title">${s.title}</div><div class="story-copy">${s.copy}</div></div><div class="story-foot"><span>${s.eps.length} videos</span><span class="story-arrow">→</span></div>`;b.onclick=()=>{selected=i;render()};root.appendChild(b)});const s=arr[selected];$("#detailName").textContent=s.title;const eps=$("#episodes");eps.innerHTML="";s.eps.forEach(e=>{const b=document.createElement("button");b.className="episode";b.innerHTML=`<div class="poster"><img src="${IMG[e[1]]}" alt=""></div><div class="ep-title">${e[0]}</div><div class="ep-state">${e[2]}</div>`;eps.appendChild(b)});renderReady()}function renderReady(){const root=$("#readyGrid");root.innerHTML="";const all=[];data[current].forEach(s=>s.eps.forEach(e=>{if(e[2]!=="idea")all.push(e)}));if(!all.length)data[current][0].eps.slice(0,2).forEach(e=>all.push(e));all.forEach(e=>{const d=document.createElement("div");d.className="episode";d.innerHTML=`<div class="poster"><img src="${IMG[e[1]]}" alt=""></div><div class="ready-title">${e[0]}</div><div class="ready-meta">${e[2]}</div>`;root.appendChild(d)})}function view(v){$("#ideasView").classList.toggle("hidden",v!=="ideas");$("#readyView").classList.toggle("hidden",v!=="ready");document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.view===v))}function openWorker(task){$("#workerChannel").textContent=current;$("#workerTask").textContent=task||`Desarrollar “${data[current][selected].title}” y devolver nuevas posibilidades de video.`;$("#workerSmall").textContent="Se compartiría el mundo del canal, esta historia y sus videos actuales. La otra IA devuelve cambios al mismo archivo.";$("#done").classList.add("hidden");$("#worker").classList.remove("hidden")}document.querySelectorAll(".channel-pick").forEach(b=>b.onclick=()=>showChannel(b.dataset.name));$("#back").onclick=()=>{$("#channel").classList.add("hidden");$("#home").classList.remove("hidden")};document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>view(t.dataset.view));$("#work").onclick=()=>openWorker();$("#send").onclick=()=>{const v=$("#request").value.trim();if(v){openWorker(v);$("#request").value=""}};$("#request").addEventListener("keydown",e=>{if(e.key==="Enter")$("#send").click()});$("#workerClose").onclick=()=>$("#worker").classList.add("hidden");$("#copy").onclick=()=>{$("#copy").textContent="copiado";setTimeout(()=>$("#copy").textContent="copiar enlace",800)};$("#simulate").onclick=()=>{$("#workerSmall").textContent="trabajando…";setTimeout(()=>{data[current][selected].eps.unshift(["Nueva posibilidad devuelta por la otra IA","person","idea"]);$("#workerSmall").textContent="cambio incorporado";$("#done").classList.remove("hidden");render()},800)};$("#done").onclick=()=>$("#worker").classList.add("hidden");
</script></body></html>
