<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Channels</title>
<link rel="stylesheet" href="./channels.css">
<link rel="stylesheet" href="./channels-v2.css">
<link rel="stylesheet" href="./channels-v3.css">
<link rel="stylesheet" href="./channels-v4.css">
<link rel="stylesheet" href="./channels-v5.css">
<link rel="stylesheet" href="./channels-v6.css">
</head>
<body>
<section id="home">
  <div class="channel-cloud">
    <button class="channel-pick" data-name="Frutidrama"><div class="channel-circle"><img data-fruti src="https://upload.wikimedia.org/wikipedia/commons/4/4c/Nuremberg_chronicles_-_Strange_People_-_No_Nose_%28XIIr%29.jpg" alt=""></div><div class="channel-label">Frutidrama</div></button>
    <button class="channel-pick" data-name="Tiny Science"><div class="channel-circle"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ed/The_Apple_and_pear_as_vintage_fruits_%28Page_191%29_BHL6364698.jpg/960px-The_Apple_and_pear_as_vintage_fruits_%28Page_191%29_BHL6364698.jpg" alt=""></div><div class="channel-label">Tiny Science</div></button>
    <button class="channel-pick" data-name="Dark Maps"><div class="channel-circle"><img src="https://upload.wikimedia.org/wikipedia/commons/5/56/Skull_with_hourglass.jpg" alt=""></div><div class="channel-label">Dark Maps</div></button>
    <button class="channel-pick" data-name="Forgotten Machines"><div class="channel-circle"><img src="https://upload.wikimedia.org/wikipedia/commons/3/38/Musk_1616.jpg" alt=""></div><div class="channel-label">Forgotten Machines</div></button>
    <button class="channel-pick" data-name="Odd Cities"><div class="channel-circle"><img src="https://upload.wikimedia.org/wikipedia/commons/4/4c/Nuremberg_chronicles_-_Strange_People_-_No_Nose_%28XIIr%29.jpg" alt=""></div><div class="channel-label">Odd Cities</div></button>
  </div>
</section>
<section id="channel" class="hidden">
  <header class="top"><button class="back" id="back">←</button><div class="name" id="channelName"></div><div class="tabs"><button class="tab active" data-view="ideas">Ideas</button><button class="tab" data-view="ready">Listos</button></div></header>
  <main class="body">
    <section id="ideasView"><div class="stories" id="stories"></div><div class="detail"><div class="detail-head"><div class="detail-name" id="detailName"></div><button class="work" id="work">↗ trabajar esta historia</button></div><div class="episodes" id="episodes"></div><div class="ask"><input id="request" placeholder="pedir una historia, cambio o video..."><button class="send" id="send">→</button></div></div></section>
    <section id="readyView" class="hidden ready-section"><div class="ready-grid" id="readyGrid"></div><div class="published"><div class="pub-head"><b>Publicados</b><div class="pub-controls"><button class="changes-button" id="changesButton">cambios</button><button class="metric-button" id="metricButton">vistas/día⌄</button><div class="metric-menu hidden" id="metricMenu"><button data-metric="views">vistas/día</button><button data-metric="subs">subs/día</button><button data-metric="retention">retención</button><button data-metric="ctr">CTR</button><button data-metric="revenue">ingreso/día</button></div></div></div><div class="timeline-scroll" id="timelineScroll"><div class="timeline" id="timeline"><div class="chart-area" id="chartArea"><svg id="chartSvg" aria-hidden="true"></svg></div><div class="drag-rail" id="dragRail"><div class="drag-knob"></div></div><div class="interval-layer" id="intervalLayer"></div><div class="change-layer hidden" id="changeLayer"></div><div class="published-row" id="publishedRow"></div></div></div><div class="interval-readout" id="readout"></div></div></section>
  </main>
</section>
<section class="worker hidden" id="worker"><div class="worker-box"><div class="worker-head"><b id="workerChannel"></b><button class="worker-close" id="workerClose">×</button></div><div class="worker-task" id="workerTask"></div><div class="worker-small" id="workerSmall"></div><div class="worker-actions"><button class="worker-action" id="copy">copiar enlace</button><button class="worker-action primary" id="simulate">simular →</button></div><div class="done hidden" id="done">cambio recibido · volver</div></div></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
<script src="./creator-client.js"></script>
<script src="./data.js"></script>
<script src="./app.js"></script>
<script src="./live-patch.js"></script>
<script src="./channels-v2.js"></script>
<script src="./channels-v3.js"></script>
<script src="./channels-v4.js"></script>
<script src="./channels-v5.js"></script>
<script src="./channels-v6.js"></script>
<script src="./channels-v7.js"></script>
<script src="./channels-v8.js"></script>
</body></html>
