const data={"Frutidrama":[{title:"La boda secreta de Banana",copy:"Banana se casa con Durazno. Frutilla aparece con un compromiso anterior.",eps:[["Banana propone matrimonio en secreto","fruti","idea"],["Limón encuentra el anillo equivocado","pear","guion"],["Frutilla llega sin invitación","person","idea"],["Durazno descubre el pacto","skull","idea"]]},{title:"La herencia de Sandía",copy:"El testamento sólo premia a quien nunca le haya mentido a la abuela.",eps:[["Sandía deja una condición imposible","deer","listo"],["Manzana falsifica una carta","person","guion"],["Pera acusa al heredero equivocado","pear","idea"],["El abogado también estaba a prueba","skull","idea"]]},{title:"La doble vida de Frutilla",copy:"Dos familias creen que Frutilla vive con ellas. Los cumpleaños caen el mismo día.",eps:[["Dos cumpleaños, una Frutilla","fruti","idea"],["Uva la ve entrar en otra casa","person","idea"],["Las dos familias compran la misma torta","deer","idea"],["Frutilla inventa una gemela","skull","idea"]]}],"Tiny Science":[{title:"El animal que ve colores imposibles",copy:"Una percepción que el ojo humano nunca puede experimentar.",eps:[["Lo que ve una mantis marina","pear","idea"],["Un color fuera de tu visión","deer","idea"],["Por qué tus ojos tienen un límite","person","guion"]]},{title:"El tiempo no corre igual",copy:"Dos relojes idénticos dejan de coincidir.",eps:[["Dos relojes se separan","skull","idea"],["El piso de arriba envejece distinto","person","idea"],["Cómo medirlo","pear","guion"]]},{title:"Lo que atraviesa tu cuerpo",copy:"Miles de partículas cruzan tu cuerpo sin que lo notes.",eps:[["Una lluvia invisible","deer","idea"],["Por qué no la sentís","pear","idea"],["Cómo sabemos que existe","person","idea"]]}],"Dark Maps":[{title:"La ciudad debajo de la ciudad",copy:"Un mapa conserva calles que ya no existen en la superficie.",eps:[["Calles enterradas","skull","guion"],["La entrada que quedó escondida","person","idea"],["El mapa viejo","pear","idea"]]},{title:"La ll",153,590,73,7.8],["La máquina vuelve","03 sep","pear",205,1080,81,9.4]],"Odd Cities":[["La ciudad vertical","02 ago","deer",76,190,61,5.2],["El tren no para","06 ago","skull",119,330,69,6.8],["Una calle sin autos","10 ago","pear",108,280,67,6.3],["La estación fantasma","14 ago","person",149,470,73,7.6],["Todo dentro de un edificio","18 ago","deer",137,420,71,7.2],["Debajo de la línea","22 ago","skull",176,660,77,8.6],["El barrio cambió","26 ago","pear",152,520,74,7.9],["Nadie sale del edificio","30 ago","person",184,760,79,8.9],["La puerta cerrada","03 sep","deer",169,640,76,8.4]]};
let current="Frutidrama",selected=0,currentMetric="views",selectedPublished=3;const $=s=>document.querySelector(s);function imageSrc(k){return k==="fruti"?FRUTI:IMG[k]}
function showChannel(name){current=name;selected=0;selectedPublished=3;$("#home").classList.add("hidden");$("#channel").classList.remove("hidden");$("#channelName").textContent=name;view("ideas");render()}function render(){const arr=data[current],root=$("#stories");root.innerHTML="";arr.forEach((s,i)=>{const b=document.createElement("button");b.className="story"+(i===selected?" active":"");b.innerHTML=`<div><div class="story-title">${s.title}</div><div class="story-copy">${s.copy}</div></div><div class="story-foot"><span>${s.eps.length} videos</span><span class="story-arrow">→</span></div>`;b.onclick=()=>{selected=i;render()};root.appendChild(b)});const s=arr[selected];$("#detailName").textContent=s.title;const eps=$("#episodes");eps.innerHTML="";s.eps.forEach(e=>{const src=imageSrc(e[1]);const b=document.createElement("button");b.className="episode";b.innerHTML=`<div class="poster"><img ${e[1]==="fruti"?'data-imgkey="fruti"':''} src="${src}" alt=""></div><div class="ep-title">${e[0]}</div><div class="ep-state">${e[2]}</div>`;eps.appendChild(b)});renderReady();renderHistory()}
function renderReady(){const root=$("#readyGrid");root.innerHTML="";const all=[];data[current].forEach(s=>s.eps.forEach(e=>{if(e[2]!=="idea")all.push(e)}));while(all.length<3)data[current][0].eps.slice(0,3-all.length).forEach(e=>all.push(e));all.slice(0,3).forEach(e=>{const src=imageSrc(e[1]);const d=document.createElement("div");d.className="episode";d.innerHTML=`<div class="poster"><img ${e[1]==="fruti"?'data-imgkey="fruti"':''} src="${src}" alt=""></div><div class="ready-title">${e[0]}</div><div class="ready-meta">${e[2]}</div>`;root.appendChild(d)})}
function renderHistory(){const list=published[current],row=$("#publishedRow");row.innerHTML="";list.forEach((e,i)=>{const d=document.createElement("button");d.className="published"+(i===selectedPublished?" active":"");d.innerHTML=`<div class="poster"><img ${e[2]==="fruti"?'data-imgkey="fruti"':''} src="${imageSrc(e[2])}" alt=""></div><div class="published-title">${e[0]}</div><div class="published-date">${e[1]}</div>`;d.onclick=()=>{selectedPublished=i;renderHistory()};row.appendChild(d)});drawChart()}
function metricValue(e){return currentMetric==="views"?e[3]:currentMetric==="subs"?e[4]:currentMetric==="retention"?e[5]:e[6]}
function metricText(e){if(currentMetric==="views")return e[3]+"k vistas/día";if(currentMetric==="subs")return "+"+e[4]+" subs/día";if(currentMetric==="retention")return e[5]+"% retención";return e[6].toFixed(1)+"% CTR"}
function drawChart(){const list=published[current],vals=list.map(metricValue),min=Math.min(...vals),max=Math.max(...vals),W=1240,H=172,pad=26,step=W/list.length;const y=v=>H-pad-((v-min)/(max-min||1))*(H-pad*2);let html="";for(let i=0;i<list.length;i++){const x=step*i+step/2;html+=`<line class="guide" x1="${x}" y1="18" x2="${x}" y2="168"/>`}const avg=vals.reduce((a,b)=>a+b,0)/vals.length;html+=`<line class="avg" x1="0" y1="${y(avg)}" x2="${W}" y2="${y(avg)}"/>`;const pts=vals.map((v,i)=>`${step*i+step/2},${y(v)}`).join(" ");html+=`<polyline class="line" points="${pts}"/>`;vals.forEach((v,i)=>{const x=step*i+step/2;html+=`<circle class="point ${i===selectedPublished?'active':''}" data-i="${i}" cx="${x}" cy="${y(v)}" r="5"/>`});$("#chartSvg").innerHTML=html;$("#chartSvg").querySelectorAll('.point').forEach(p=>p.onclick=()=>{selectedPublished=+p.dataset.i;renderHistory()});const e=list[selectedPublished],prev=selectedPublished?list[selectedPublished-1]:null;$("#intervalNote").textContent=`${e[1]} → ${selectedPublished<list.length-1?list[selectedPublished+1][1]:"hoy"} · ${metricText(e)}${prev?` · ${metricValue(e)>metricValue(prev)?"↑":"↓"} vs anterior`:""}`;$("#chartLabel").textContent=currentMetric==="views"?"rendimiento entre publicaciones":currentMetric==="subs"?"crecimiento entre publicaciones":currentMetric==="retention"?"retención por video":"CTR por video"}
function view(v){$("#ideasView").classList.toggle("hidden",v!=="ideas");$("#readyView").classList.toggle("hidden",v!=="ready");document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.view===v));if(v==="ready")renderHistory()}
function openWorker(task){$("#workerChannel").textContent=current;$("#workerTask").textContent=task||`Desarrollar “${data[current][selected].title}” y devolver nuevas posibilidades de video.`;$("#workerSmall").textContent="Se compartiría el mundo del canal, esta historia y sus videos actuales. La otra IA devuelve cambios al mismo archivo.";$("#done").classList.add("hidden");$("#worker").classList.remove("hidden")}
document.querySelectorAll(".channel-pick").forEach(b=>b.onclick=()=>showChannel(b.dataset.name));$("#back").onclick=()=>{$("#channel").classList.add("hidden");$("#home").classList.remove("hidden")};document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>view(t.dataset.view));$("#work").onclick=()=>openWorker();$("#send").onclick=()=>{const v=$("#request").value.trim();if(v){openWorker(v);$("#request").value=""}};$("#request").addEventListener("keydown",e=>{if(e.key==="Enter")$("#send").click()});$("#workerClose").onclick=()=>$("#worker").classList.add("hidden");$("#copy").onclick=()=>{$("#copy").textContent="copiado";setTimeout(()=>$("#copy").textContent="copiar enlace",800)};$("#simulate").onclick=()=>{$("#workerSmall").textContent="trabajando…";setTimeout(()=>{data[current][selected].eps.unshift(["Nueva posibilidad devuelta por la otra IA","person","idea"]);$("#workerSmall").textContent="cambio incorporado";$("#done").classList.remove("hidden");render()},800)};$("#done").onclick=()=>$("#worker").classList.add("hidden");$("#metricBtn").onclick=()=>$("#metricMenu").classList.toggle("hidden");$("#metricMenu").querySelectorAll('button').forEach(b=>b.onclick=()=>{currentMetric=b.dataset.metric;$("#metricBtn").textContent=b.textContent+"⌄";$("#metricMenu").classList.add("hidden");renderHistory()});document.addEventListener('click',e=>{if(!e.target.closest('.metric-wrap'))$("#metricMenu").classList.add('hidden')});
</script></body></html>
