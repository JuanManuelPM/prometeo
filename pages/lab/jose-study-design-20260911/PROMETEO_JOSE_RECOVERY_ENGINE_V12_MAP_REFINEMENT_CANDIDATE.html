<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>José Study V12 LAB · map refinement candidate</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#f1eee6}body{display:grid;grid-template-rows:42px 1fr}#labbar{display:flex;align-items:center;gap:10px;min-width:0;padding:0 10px;border-bottom:1px solid rgba(241,238,230,.22);background:#111;color:#f1eee6;font-size:12px;letter-spacing:.01em}#labbar strong{font-size:11px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}#status{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.78}#toggle{margin-left:auto;border:1px solid rgba(241,238,230,.36);background:transparent;color:inherit;border-radius:999px;padding:5px 9px;font:inherit;cursor:pointer;white-space:nowrap}#toggle:disabled{opacity:.4;cursor:default}#stage{position:relative;min-height:0}#preview{display:block;width:100%;height:100%;border:0;background:#f3f1eb}#fatal{display:none;position:absolute;inset:0;place-items:center;padding:24px;background:#111;color:#f1eee6;text-align:center;line-height:1.45}#fatal.show{display:grid}#fatal code{display:block;max-width:880px;margin-top:10px;white-space:pre-wrap;overflow-wrap:anywhere;opacity:.75}
</style>
</head>
<body>
<div id="labbar"><strong>LAB V12 · candidato</strong><span id="status">cargando V11 fijado…</span><button id="toggle" type="button" disabled>ver V11 intacto</button></div>
<div id="stage"><iframe id="preview" title="José Study V12 LAB preview" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads"></iframe><div id="fatal"><div><strong>V12 detenido en modo fail-closed.</strong><code id="fatalText"></code></div></div></div>
<script>
(() => {
'use strict';
const SOURCE_COMMIT='158357fe4e1cb672e4574d9ebe6f317b9418a30f';
const SOURCE_URL='https://raw.githubusercontent.com/JuanManuelPM/prometeo/'+SOURCE_COMMIT+'/coordination/workstreams/jose-study-design-20260911/material/PROMETEO_JOSE_RECOVERY_ENGINE_V11.html.gz.b64';
const EXPECTED_SHA256='0cf9a40fb53e977dccb40c9755d668a3ee922ccd61883f19229bb4a113139a05';
const EXPECTED_LEVELS=12;
const statusEl=document.getElementById('status'),toggleEl=document.getElementById('toggle'),frame=document.getElementById('preview'),fatal=document.getElementById('fatal'),fatalText=document.getElementById('fatalText');
let refined=true,sourceVerified=false,observer=null,scanTimer=0;
const setStatus=t=>statusEl.textContent=t;
const hex=b=>Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('');
function failClosed(error){console.error(error);fatalText.textContent=String(error&&error.stack?error.stack:error);fatal.classList.add('show');toggleEl.disabled=true;setStatus('fail-closed · sin uso del candidato')}
function base64ToBytes(text){const clean=text.replace(/\s+/g,'');const raw=atob(clean),out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out}
async function gunzip(bytes){if(!('DecompressionStream'in window))throw new Error('DecompressionStream(gzip) no está disponible en este navegador.');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return new Uint8Array(await new Response(stream).arrayBuffer())}
function token(el){const cls=typeof el.className==='string'?el.className:'';return`${el.id||''} ${cls} ${el.getAttribute('role')||''}`.toLowerCase()}
function visibleRect(el,win){const r=el.getBoundingClientRect(),cs=win.getComputedStyle(el);return{r,cs,visible:r.width>0&&r.height>0&&cs.display!=='none'&&cs.visibility!=='hidden'}}
function candidateLevelNodes(rail){const q=['[class*="level" i]','[id*="level" i]','[data-level]','[class*="node" i]','[data-node]','[class*="step" i]','[data-step]'].join(',');let nodes=Array.from(rail.querySelectorAll(q)).filter(el=>!/container|list|rail|map|levels/i.test(token(el)));if(nodes.length<8)nodes=Array.from(rail.querySelectorAll('button,a,[role="button"],li')).filter(el=>{const txt=(el.textContent||'').trim();return txt.length>0&&txt.length<90});return Array.from(new Set(nodes))}
function findRail(doc,win){const semantic=Array.from(doc.querySelectorAll('body *')).filter(el=>/(map|rail|route|levels?|progress)/i.test(token(el)));const scored=semantic.map(el=>{const{r,cs,visible}=visibleRect(el,win);if(!visible)return{el,score:-999,levels:[]};const levels=candidateLevelNodes(el).filter(n=>visibleRect(n,win).visible);let score=0,t=token(el);if(/map|rail/i.test(t))score+=4;if(/level|route|progress/i.test(t))score+=2;if(r.left<win.innerWidth*.45)score+=2;if(r.height>win.innerHeight*.34)score+=3;if(r.width>=48&&r.width<=Math.max(420,win.innerWidth*.45))score+=2;if(/auto|scroll/.test(cs.overflowY))score+=1;if(levels.length>=8)score+=4;if(levels.length>=EXPECTED_LEVELS)score+=2;return{el,score,levels}}).sort((a,b)=>b.score-a.score);return scored[0]&&scored[0].score>=9?scored[0]:null}
function activeLike(el){if(el.matches('[aria-current],[data-current="true"],[data-active="true"],.active,.current,.selected,[class*="active" i],[class*="current" i]'))return true;return!!el.querySelector('[aria-current],[data-current="true"],[data-active="true"],.active,.current,.selected,[class*="active" i],[class*="current" i]')}
function installPatchStyle(doc){let style=doc.getElementById('prometeo-v12-map-style');if(style)return;style=doc.createElement('style');style.id='prometeo-v12-map-style';style.textContent=`html.prometeo-v12-on [data-prometeo-v12-rail]{min-width:var(--prometeo-v12-rail-width,168px)!important;padding-inline:clamp(8px,1.35vw,16px)!important;scroll-padding-block:28px!important}html.prometeo-v12-on [data-prometeo-v12-level]{min-height:32px!important;margin-block:5px!important;line-height:1.16!important;transition:opacity 160ms ease,transform 160ms ease!important}html.prometeo-v12-on [data-prometeo-v12-level="inactive"]{opacity:.58!important}html.prometeo-v12-on [data-prometeo-v12-level="active"]{opacity:1!important;font-weight:800!important;transform:translateX(4px) scale(1.015)!important;transform-origin:left center!important}html.prometeo-v12-on [data-prometeo-v12-round]{margin-block-start:clamp(18px,3.2vh,34px)!important;padding-block-start:10px!important;border-top:1px solid rgba(127,127,127,.28)!important}@media(max-width:620px){html.prometeo-v12-on [data-prometeo-v12-rail]{padding-inline:8px!important}html.prometeo-v12-on [data-prometeo-v12-level]{margin-block:4px!important}}@media(prefers-reduced-motion:reduce){html.prometeo-v12-on [data-prometeo-v12-level]{transition:none!important}}`; (doc.head||doc.documentElement).appendChild(style)}
function markRounds(rail){const q='[class*="round" i],[id*="round" i],[data-round],[class*="stage" i],[data-stage]';let rounds=Array.from(rail.querySelectorAll(q)).filter(el=>!/container|list|rail|map/i.test(token(el)));if(!rounds.length)rounds=Array.from(rail.querySelectorAll('h1,h2,h3,h4,h5,h6,[role="heading"]')).filter(el=>/round|ronda/i.test(el.textContent||''));rounds.forEach(el=>el.setAttribute('data-prometeo-v12-round',''));return rounds}
function describe(el){if(!el)return'none';const cls=typeof el.className==='string'?el.className.trim().split(/\s+/).slice(0,3).join('.'):'';return`${el.tagName.toLowerCase()}${el.id?'#'+el.id:''}${cls?'.'+cls:''}`}
function scanAndPatch(){if(!sourceVerified||!frame.contentDocument||!frame.contentWindow)return;const doc=frame.contentDocument,win=frame.contentWindow,best=findRail(doc,win);if(!best){setStatus('V11 SHA-256 PASS · esperando mapa de tema para aplicar V12');return}installPatchStyle(doc);const root=doc.documentElement,rail=best.el,levels=best.levels.slice(0,24),rounds=markRounds(rail);rail.setAttribute('data-prometeo-v12-rail','');const targetWidth=win.innerWidth<620?Math.round(Math.max(142,Math.min(190,win.innerWidth*.34))):Math.round(Math.max(172,Math.min(270,win.innerWidth*.24)));root.style.setProperty('--prometeo-v12-rail-width',targetWidth+'px');levels.forEach(el=>el.setAttribute('data-prometeo-v12-level',activeLike(el)?'active':'inactive'));root.classList.toggle('prometeo-v12-on',refined);const levelNote=levels.length===EXPECTED_LEVELS?'12/12 niveles':levels.length+' niveles detectados';setStatus(`V11 SHA-256 PASS · V12 ${refined?'activo':'apagado'} · ${levelNote} · ${rounds.length} rondas · ${describe(rail)}`);toggleEl.disabled=false;toggleEl.textContent=refined?'ver V11 intacto':'ver V12 refinado'}
function scheduleScan(){clearTimeout(scanTimer);scanTimer=setTimeout(scanAndPatch,120)}
function attachObserver(){if(observer)observer.disconnect();const doc=frame.contentDocument;if(!doc||!doc.body)return;observer=new MutationObserver(scheduleScan);observer.observe(doc.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','aria-current','data-current','data-active','hidden','style']});frame.contentWindow.addEventListener('resize',scheduleScan,{passive:true})}
toggleEl.addEventListener('click',()=>{refined=!refined;const doc=frame.contentDocument;if(doc)doc.documentElement.classList.toggle('prometeo-v12-on',refined);scanAndPatch()});
async function boot(){try{const res=await fetch(SOURCE_URL,{cache:'no-store',mode:'cors'});if(!res.ok)throw new Error(`No se pudo leer V11 fijado: HTTP ${res.status}`);const gzipBytes=base64ToBytes(await res.text()),htmlBytes=await gunzip(gzipBytes),digest=hex(await crypto.subtle.digest('SHA-256',htmlBytes));if(digest!==EXPECTED_SHA256)throw new Error(`SHA-256 V11 no coincide. esperado=${EXPECTED_SHA256} observado=${digest}`);sourceVerified=true;setStatus(`V11 SHA-256 PASS · ${htmlBytes.byteLength} bytes · cargando preview…`);frame.addEventListener('load',()=>{try{attachObserver();scheduleScan()}catch(err){failClosed(err)}},{once:true});frame.srcdoc=new TextDecoder('utf-8',{fatal:true}).decode(htmlBytes)}catch(err){failClosed(err)}}
boot();
})();
</script>
</body>
</html>
