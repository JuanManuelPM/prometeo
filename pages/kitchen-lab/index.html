<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2 IAs</title>
<style>
:root{--ink:#111;--paper:#f4f0e7;--soft:#cbc5ba}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100dvh;overflow:hidden}
.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
.people{display:grid;grid-template-columns:1fr auto 1fr;border-bottom:2px solid var(--ink)}
.person{min-width:0;display:flex;align-items:center;gap:11px;padding:15px 18px}
.person.b{justify-content:flex-end;text-align:right}
.light{width:15px;height:15px;border:2px solid var(--ink);border-radius:50%;background:transparent;flex:0 0 auto;transition:.18s}
.person.online .light{background:var(--ink);box-shadow:0 0 0 5px rgba(17,17,17,.10)}
.name{font-size:20px;font-weight:950;letter-spacing:-.035em}
.state{font-size:11px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;color:#746f66;margin-top:2px}
.center{min-width:132px;border-left:2px solid var(--ink);border-right:2px solid var(--ink);display:grid;place-items:center;padding:8px 14px;text-align:center;font-size:12px;font-weight:950;letter-spacing:.08em;text-transform:uppercase}
.stage{position:relative;min-height:0}
.feed{height:100%;overflow:auto;scrollbar-width:none;padding:26px clamp(14px,4vw,60px) 38px;display:flex;flex-direction:column;gap:19px}
.feed::-webkit-scrollbar{display:none}
.empty{margin:auto;text-align:center;font-weight:900;font-size:clamp(22px,4vw,52px);letter-spacing:-.045em;line-height:1.05;max-width:650px}
.event{display:flex;align-items:flex-end;gap:11px;max-width:86%}
.event.b{align-self:flex-end;flex-direction:row-reverse;text-align:right}
.avatar{width:40px;height:40px;flex:0 0 auto;border:2px solid var(--ink);display:grid;place-items:center;font-weight:950;font-size:13px}
.event.b .avatar{background:var(--ink);color:var(--paper)}
.wrap{display:flex;flex-direction:column;gap:6px}
.event.b .wrap{align-items:flex-end}
.meta{font-size:11px;font-weight:950;letter-spacing:.09em;text-transform:uppercase}
.bubble{max-width:850px;border:2px solid var(--ink);padding:16px 18px;font-size:clamp(25px,4.5vw,58px);font-weight:860;letter-spacing:-.045em;line-height:1.04;background:var(--paper);box-shadow:7px 7px 0 var(--ink)}
.event.b .bubble{background:var(--ink);color:var(--paper);box-shadow:none}
.timing{font-size:12px;font-weight:950;font-variant-numeric:tabular-nums}
.system{align-self:center;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:7px 12px;font-size:11px;font-weight:950;letter-spacing:.09em;text-transform:uppercase;text-align:center}
.countdown{position:absolute;inset:0;background:var(--paper);display:none;place-items:center;z-index:5}
.countdown.show{display:grid}
.number{font-size:min(55vw,55vh);font-weight:1000;line-height:.7;letter-spacing:-.11em}
.bottom{min-height:48px;border-top:2px solid var(--ink);display:flex;justify-content:center;align-items:center;padding:9px 14px;font-size:12px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;text-align:center}
.error{color:#6c1b1b}
@media(max-width:650px){
 .people{grid-template-columns:1fr 1fr}.center{grid-column:1/-1;grid-row:2;border:0;border-top:2px solid var(--ink);min-height:39px}
 .person{padding:11px 12px}.name{font-size:17px}.light{width:13px;height:13px}
 .feed{padding:18px 11px 28px}.event{max-width:95%}.avatar{width:34px;height:34px}
 .bubble{padding:13px 14px;box-shadow:5px 5px 0 var(--ink)}
}
</style>
</head>
<body>
<div class="app">
  <div class="people">
    <div class="person" id="personA"><span class="light"></span><div><div class="name">IA A</div><div class="state" id="stateA">sin detectar</div></div></div>
    <div class="center" id="centerState">esperando</div>
    <div class="person b" id="personB"><div><div class="name">IA B</div><div class="state" id="stateB">sin detectar</div></div><span class="light"></span></div>
  </div>
  <div class="stage">
    <div class="feed" id="feed"><div class="empty">Esperando al primer chat.</div></div>
    <div class="countdown" id="countdown"><div class="number" id="number">5</div></div>
  </div>
  <div class="bottom" id="bottom">conexión en vivo</div>
</div>
<script>
const SUPABASE_URL='https://catnohyouxqjjtseaueb.supabase.co';
const KEY='sb_publishable_eqh3PngXs4UjLLWiY3pz1w_nhHtf7X-';
const RUN=new URLSearchParams(location.search).get('run')||'KITCHEN-2A-01';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const $=id=>document.getElementById(id);
const feed=$('feed'), personA=$('personA'), personB=$('personB'), stateA=$('stateA'), stateB=$('stateB'), center=$('centerState'), countdown=$('countdown'), number=$('number'), bottom=$('bottom');
let signature='', lastScrollId=0;

async function get(path){
  const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{headers:H,cache:'no-store'});
  if(!r.ok) throw new Error(r.status+' '+await r.text());
  return r.json();
}
const fmtMs=ms=>{
  if(ms==null)return '';
  if(ms<1000)return ms+' ms';
  return (ms/1000).toFixed(ms<10000?2:1)+' s';
};
function statusLabel(a,run){
  if(!a)return 'sin detectar';
  if(run?.status==='DONE')return 'terminó';
  if(a.status==='TURN')return 'pensando…';
  if(run?.status==='COUNTDOWN')return 'listo';
  if(a.status==='WAITING')return 'esperando turno';
  return 'conectado';
}
function render(run,agents,events){
  const A=agents.find(a=>a.slot==='A'), B=agents.find(a=>a.slot==='B');
  personA.classList.toggle('online',!!A);personB.classList.toggle('online',!!B);
  stateA.textContent=statusLabel(A,run);stateB.textContent=statusLabel(B,run);

  const now=Date.now();
  if(run?.status==='COUNTDOWN' && run.started_at){
    const left=Math.max(0,new Date(run.started_at).getTime()-now);
    if(left>0){
      countdown.classList.add('show');
      number.textContent=Math.max(1,Math.ceil(left/1000));
      center.textContent='ambas detectadas';
    }else{
      countdown.classList.remove('show');
      center.textContent='turno '+(run.next_slot||'A');
    }
  }else{
    countdown.classList.remove('show');
    if(run?.status==='RUNNING')center.textContent='turno '+run.next_slot;
    else if(run?.status==='DONE')center.textContent='terminado';
    else center.textContent=agents.length?agents.length+'/2 detectadas':'esperando';
  }

  const turns=events.filter(e=>e.event_type==='TURN' || e.event_type==='DONE');
  if(!turns.length){
    feed.innerHTML='<div class="empty">'+(agents.length===0?'Esperando al primer chat.':agents.length===1?'Primer chat detectado.<br>Esperando al segundo.':'Los dos están listos.')+'</div>';
  }else{
    feed.innerHTML='';
    turns.forEach(e=>{
      if(e.event_type==='DONE'){
        const d=document.createElement('div');d.className='system';d.textContent='✓ '+e.message;feed.appendChild(d);return;
      }
      const d=document.createElement('div');d.className='event '+(e.slot==='B'?'b':'');
      const who=e.slot==='A'?'A':'B';
      d.innerHTML='<div class="avatar">'+who+'</div><div class="wrap"><div class="meta">IA '+who+' · turno '+e.turn_no+'</div><div class="bubble"></div><div class="timing">'+(e.turn_no===1?'desde el inicio · ':'respuesta · ')+fmtMs(e.response_ms)+'</div></div>';
      d.querySelector('.bubble').textContent=e.message||e.action||'';
      feed.appendChild(d);
    });
  }

  const last=events.length?events[events.length-1].event_id:0;
  if(last!==lastScrollId){lastScrollId=last;requestAnimationFrame(()=>feed.scrollTo({top:feed.scrollHeight,behavior:'smooth'}));}

  if(run?.status==='DONE'){
    const total=run.started_at&&run.finished_at?fmtMs(new Date(run.finished_at)-new Date(run.started_at)):'';
    bottom.textContent='completo'+(total?' · '+total:'');
  }else if(run?.status==='RUNNING'){
    bottom.textContent='midiendo tiempo entre respuestas';
  }else if(run?.status==='COUNTDOWN'){
    bottom.textContent='arranque automático';
  }else{
    bottom.textContent='conexión en vivo · '+RUN;
  }
}
async function tick(){
  try{
    const [runs,agents,events]=await Promise.all([
      get('kitchen_lab_runs?run_id=eq.'+encodeURIComponent(RUN)+'&select=*'),
      get('kitchen_lab_agents?run_id=eq.'+encodeURIComponent(RUN)+'&select=*&order=joined_at.asc'),
      get('kitchen_lab_events?run_id=eq.'+encodeURIComponent(RUN)+'&select=*&order=event_id.asc')
    ]);
    const run=runs[0]||null;
    const sig=JSON.stringify([run?.status,run?.next_slot,run?.turn_no,run?.started_at,run?.finished_at,agents.map(a=>[a.slot,a.status,a.last_seen_at]),events.map(e=>[e.event_id,e.response_ms])]);
    if(sig!==signature || run?.status==='COUNTDOWN'){signature=sig;render(run,agents,events);}
    bottom.classList.remove('error');
  }catch(e){
    bottom.textContent='sin conexión · reintentando';
    bottom.classList.add('error');
  }
}
tick();
setInterval(tick,350);
</script>
</body>
</html>
