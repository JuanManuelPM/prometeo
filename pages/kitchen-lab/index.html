<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kitchen Lab · 2 IAs</title>
<style>
:root{--ink:#111;--paper:#f5f1e8;--line:#111;--muted:#746f66}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100dvh;overflow-x:hidden}
.shell{min-height:100dvh;display:grid;grid-template-rows:auto auto 1fr auto}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:18px 22px 14px;border-bottom:3px solid var(--line)}
.brand{font-weight:900;font-size:clamp(24px,4vw,52px);letter-spacing:-.055em;line-height:.9}
.sub{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.livebar{display:grid;grid-template-columns:1fr auto 1fr;border-bottom:3px solid var(--line);min-height:84px}
.agent{display:flex;align-items:center;gap:12px;padding:12px 20px}
.agent.b{justify-content:flex-end;text-align:right}
.face{font-size:36px;line-height:1}
.agent-name{font-weight:950;font-size:20px}
.agent-status{font-size:13px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kitchen{display:flex;align-items:center;justify-content:center;padding:0 18px;border-left:3px solid var(--line);border-right:3px solid var(--line);font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;text-align:center;min-width:220px}
main{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:0;padding:24px clamp(14px,4vw,54px) 30px}
.feed{width:min(1180px,100%);margin:0 auto;display:flex;flex-direction:column;gap:18px;overflow:auto;scrollbar-width:none;padding:6px 0}
.feed::-webkit-scrollbar{display:none}
.event{display:flex;gap:12px;align-items:flex-end;max-width:84%;animation:rise .28s ease both}
.event.b{align-self:flex-end;flex-direction:row-reverse;text-align:right}
.avatar{width:46px;min-width:46px;height:46px;border:3px solid var(--line);display:grid;place-items:center;font-size:23px;background:var(--paper)}
.wrap{display:flex;flex-direction:column;gap:5px}
.event.b .wrap{align-items:flex-end}
.meta{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.bubble{border:3px solid var(--line);padding:16px 18px;font-size:clamp(25px,4vw,54px);font-weight:850;line-height:1.04;letter-spacing:-.04em;background:var(--paper);box-shadow:8px 8px 0 var(--ink)}
.event.b .bubble{background:var(--ink);color:var(--paper);box-shadow:-8px 8px 0 transparent}
.system{align-self:center;max-width:92%;font-size:13px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:8px 14px;text-align:center}
.thinking .bubble{font-size:clamp(19px,2.4vw,30px);font-weight:800;letter-spacing:.02em}
.dots span{display:inline-block;animation:blink 1.1s infinite both}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-top:3px solid var(--line)}
.truth{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
button{appearance:none;border:3px solid var(--line);background:var(--ink);color:var(--paper);font:inherit;font-weight:950;padding:12px 18px;cursor:pointer;min-height:48px}
button:active{transform:translateY(2px)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes blink{0%,20%{opacity:.2}50%,100%{opacity:1}}
@media(max-width:700px){
 header{padding:14px}.brand{font-size:32px}.sub{display:none}
 .livebar{grid-template-columns:1fr 1fr}.kitchen{grid-column:1/-1;grid-row:2;border:0;border-top:3px solid var(--line);min-height:42px}
 .agent{padding:10px 12px}.face{font-size:28px}.agent-name{font-size:16px}
 main{padding:16px 12px 24px}.event{max-width:94%}.avatar{width:38px;min-width:38px;height:38px;font-size:19px}
 .bubble{padding:13px 14px;box-shadow:5px 5px 0 var(--ink)}.event.b .bubble{box-shadow:-5px 5px 0 transparent}
 footer{align-items:stretch;flex-direction:column}.truth{text-align:center}button{width:100%}
}
</style>
</head>
<body>
<div class="shell">
<header>
  <div class="brand">KITCHEN<br>LAB</div>
  <div class="sub">2 IAs · coordinación visible</div>
</header>
<section class="livebar">
  <div class="agent" id="agentA"><div class="face">🟣</div><div><div class="agent-name">IA A</div><div class="agent-status" id="statusA">esperando</div></div></div>
  <div class="kitchen" id="kitchenState">🥕 verdura sucia · 🍽️ platos sucios</div>
  <div class="agent b" id="agentB"><div><div class="agent-name">IA B</div><div class="agent-status" id="statusB">esperando</div></div><div class="face">🟠</div></div>
</section>
<main>
  <div class="feed" id="feed" aria-live="polite"></div>
</main>
<footer>
  <div class="truth">SIMULACIÓN VISUAL · todavía no son dos chats reales</div>
  <button id="demo">▶ REPRODUCIR DEMO</button>
</footer>
</div>
<script>
const feed=document.getElementById('feed');
const statusA=document.getElementById('statusA');
const statusB=document.getElementById('statusB');
const kitchenState=document.getElementById('kitchenState');
const btn=document.getElementById('demo');
let running=false, timers=[];

const steps=[
 {t:0,kind:'system',text:'Ambas IAs entran a la misma cocina'},
 {t:650,who:'a',status:'recibió estado',thinking:true,text:'Recibí el estado de la cocina'},
 {t:1450,who:'b',status:'pensando',thinking:true,text:'Estoy mirando qué tarea está libre'},
 {t:2350,who:'a',status:'escribiendo',text:'🧽 Empiezo a lavar los platos.'},
 {t:3150,kind:'system',text:'CLAIM · lavar_platos · IA A'},
 {t:3900,who:'b',status:'escribiendo',text:'🥕 Yo empiezo a lavar la verdura.'},
 {t:4700,kind:'system',text:'CLAIM · lavar_verdura · IA B'},
 {t:5550,who:'a',status:'trabajando',thinking:true,text:'Lavando platos'},
 {t:6200,who:'b',status:'trabajando',thinking:true,text:'Lavando verdura'},
 {t:7200,who:'a',status:'terminó',text:'✅ Platos limpios.'},
 {t:7600,kind:'state',text:'🥕 verdura sucia · ✨ platos limpios'},
 {t:8300,who:'b',status:'terminó',text:'✅ Verdura lavada.'},
 {t:8700,kind:'state',text:'🥬 verdura lavada · ✨ platos limpios'},
 {t:9450,who:'a',status:'recibió cambio',thinking:true,text:'Vi que la verdura ya está lavada'},
 {t:10200,who:'a',status:'escribiendo',text:'🔪 Entonces ahora puedo cortarla.'},
 {t:10900,kind:'system',text:'UNLOCK · cortar_verdura'}
];

function addEvent(s){
 if(s.kind==='state'){kitchenState.textContent=s.text;return}
 const el=document.createElement('div');
 if(s.kind==='system'){
   el.className='system'; el.textContent=s.text;
 }else{
   el.className='event '+(s.who==='b'?'b ':'')+(s.thinking?'thinking':'');
   const emoji=s.who==='a'?'🟣':'🟠';
   const label=s.who==='a'?'IA A':'IA B';
   el.innerHTML='<div class="avatar">'+emoji+'</div><div class="wrap"><div class="meta">'+label+' · '+s.status+'</div><div class="bubble">'+s.text+(s.thinking?' <span class="dots"><span>.</span><span>.</span><span>.</span></span>':'')+'</div></div>';
   (s.who==='a'?statusA:statusB).textContent=s.status;
 }
 feed.appendChild(el);
 requestAnimationFrame(()=>feed.scrollTo({top:feed.scrollHeight,behavior:'smooth'}));
}

function reset(){
 timers.forEach(clearTimeout);timers=[];running=false;
 feed.innerHTML='';statusA.textContent='esperando';statusB.textContent='esperando';
 kitchenState.textContent='🥕 verdura sucia · 🍽️ platos sucios';
 btn.textContent='▶ REPRODUCIR DEMO';
}
btn.addEventListener('click',()=>{
 if(running){reset();return}
 reset();running=true;btn.textContent='■ REINICIAR';
 steps.forEach(s=>timers.push(setTimeout(()=>addEvent(s),s.t)));
 timers.push(setTimeout(()=>{running=false;btn.textContent='↻ REPETIR DEMO'},11800));
});
addEvent({kind:'system',text:'Lista para observar dos agentes'});
</script>
</body>
</html>
