<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Prometeo</title>
<style>
:root{--paper:#f4efe5;--ink:#45141b;--line:rgba(69,20,27,.18)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Century Gothic,Avenir,Montserrat,system-ui,sans-serif}body{min-height:100dvh;display:grid;place-items:center;padding:24px}main{display:grid;justify-items:center;gap:22px}.mark,.ready{width:76px;height:76px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 8px 18px rgba(69,20,27,.10),inset 0 1px 0 rgba(255,255,255,.7)}.mark:after{content:"";width:18px;height:18px;border-radius:50%;background:var(--ink)}.ready{display:none;font-size:30px;font-weight:700}.status{font-size:13px;opacity:.68;text-align:center;max-width:280px;min-height:20px}body[data-state="working"] .mark{animation:pulse 1s ease-in-out infinite alternate}body[data-state="ready"] .mark{display:none}body[data-state="ready"] .ready{display:grid}@keyframes pulse{to{transform:scale(.94);opacity:.5}}
</style>
</head>
<body data-state="working">
<main><div class="mark"></div><div class="ready">✓</div><div class="status" id="status"></div></main>
<script>
const API='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/prometeo-device-bootstrap-v1';
const SESSION_KEY='prometeo.device.session.v1';
const CLAIM_KEY='prometeo.owner.claim.v1';
const statusNode=document.getElementById('status');
const calendar='../calendar/';
function setState(s,msg=''){document.body.dataset.state=s;statusNode.textContent=msg}
function getClaim(){
  const p=new URLSearchParams(location.hash.slice(1));
  const fromUrl=p.get('claim');
  if(fromUrl&&fromUrl.length>=32){localStorage.setItem(CLAIM_KEY,fromUrl);history.replaceState(null,'',location.pathname+location.search);return fromUrl}
  return localStorage.getItem(CLAIM_KEY)||'';
}
async function boot(){
  const existing=localStorage.getItem(SESSION_KEY);
  if(existing){location.replace(calendar);return}
  const claim=getClaim();
  if(!claim){setState('error','Este dispositivo todavía no está vinculado.');return}
  setState('working','');
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({claimToken:claim}),cache:'no-store'});
    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.code||'BOOTSTRAP_FAILED');
    if(!data.deviceToken) throw new Error('NO_DEVICE_TOKEN');
    localStorage.setItem(SESSION_KEY,data.deviceToken);
    if(data.financeProfileId)localStorage.setItem('prometeo.finance.profile.v1',data.financeProfileId);
    localStorage.removeItem(CLAIM_KEY);
    setState('ready','');
    setTimeout(()=>location.replace(calendar),450);
  }catch(e){
    const code=String(e?.message||'');
    if(code==='BOOTSTRAP_EXPIRED')setState('error','El acceso inicial venció.');
    else if(code==='OWNER_ALREADY_CLAIMED'||code==='BOOTSTRAP_USED')setState('error','Prometeo ya fue vinculado.');
    else setState('error','No se pudo completar la vinculación.');
  }
}
boot();
</script>
</body>
</html>
