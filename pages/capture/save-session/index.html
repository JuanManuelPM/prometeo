<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Prometeo · Guardar</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#151a20;background:#fff}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px}.box{width:min(420px,100%)}h1{font-size:18px;margin:0 0 8px}p{font-size:14px;line-height:1.45;margin:0 0 16px;color:#626871}a,button{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:0 16px;border:0;border-radius:12px;background:#151a20;color:#fff;text-decoration:none;font:800 14px inherit;cursor:pointer}.error{color:#8b1e1e}code{word-break:break-word;font-size:11px}
</style>
</head>
<body>
<main class="box"><h1 id="title">Guardando…</h1><p id="status">Enviando la nota a Prometeo.</p><div id="action"></div></main>
<script>
const ENDPOINT='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/prometeo-change-loop-v1';
const title=document.querySelector('#title'),status=document.querySelector('#status'),action=document.querySelector('#action');
function b64urlDecode(s){s=String(s||'').replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function fail(message){title.textContent='No se pudo guardar';status.textContent=message||'El enlace no es válido o venció.';status.className='error'}
(async()=>{
  try{
    const rawHash=location.hash;
    history.replaceState(null,'',location.pathname);
    const params=new URLSearchParams(rawHash.slice(1));
    const token=params.get('t')||'',encoded=params.get('p')||'';
    if(token.length<24||!encoded)throw new Error('Falta la autorización privada de guardado.');
    let payload;try{payload=JSON.parse(b64urlDecode(encoded))}catch{throw new Error('La nota no tiene un formato válido.')}
    const r=await fetch(`${ENDPOINT}/session-save/${encodeURIComponent(token)}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload),cache:'no-store',referrerPolicy:'no-referrer'});
    const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data?.message||data?.error||`HTTP ${r.status}`);
    title.textContent='Guardado en Prometeo';status.textContent='La sesión quedó resumida como una nota de IA en esta página. Ya podés cerrar este chat o seguir trabajando.';
    if(data.prometeo_url){const a=document.createElement('a');a.href=data.prometeo_url;a.textContent='Volver a Prometeo';a.rel='noreferrer';action.append(a)}
  }catch(error){fail(error?.message||String(error))}
})();
</script>
</body>
</html>
