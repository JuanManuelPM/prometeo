<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dog Notes · R002</title><style>:root{--a:#111;--b:#f4efe3}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--a);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}main{min-height:100vh;display:grid;grid-template-rows:auto 1fr;padding:24px;gap:28px}header{display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid currentColor;padding-bottom:18px}h1{margin:0;font-size:clamp(2.5rem,10vw,7rem);letter-spacing:-.08em;line-height:.85}.mark{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em}form{display:grid;grid-template-columns:1fr auto;gap:10px;align-self:start}input,button{font:inherit;border:2px solid currentColor;background:var(--b);color:var(--a);border-radius:0;min-height:48px}input{padding:10px 12px}button{padding:10px 16px;cursor:pointer}.notes{list-style:none;margin:0;padding:0;border-top:2px solid currentColor}.notes li{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;border-bottom:2px solid currentColor;padding:14px 0;word-break:break-word}.empty{padding:18px 0;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em}@media(max-width:560px){main{padding:16px}header{display:block}form{grid-template-columns:1fr}.notes li{grid-template-columns:1fr}.notes button{justify-self:start}}</style></head><body><main><header><h1>DOG<br>NOTES</h1><div class="mark">R002 · local only</div></header><section><form id="dog-note-form"><input id="dog-note-input" autocomplete="off" aria-label="Nueva nota" placeholder="Escribí una nota"><button id="dog-note-add" type="submit">Agregar</button></form><ul id="dog-note-list" class="notes" aria-live="polite"></ul></section></main><script>(()=>{'use strict';const KEY='dognotes.r002.items';const form=document.getElementById('dog-note-form'),input=document.getElementById('dog-note-input'),list=document.getElementById('dog-note-list');let notes=[];try{notes=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(notes))notes=[];}catch(_){notes=[];}const save=()=>localStorage.setItem(KEY,JSON.stringify(notes));function render(){list.innerHTML='';if(!notes.length){const li=document.createElement('li');li.className='empty';li.textContent='Sin notas todavía.';list.append(li);return;}notes.forEach((text,i)=>{const li=document.createElement('li'),span=document.createElement('span'),btn=document.createElement('button');span.textContent=text;btn.type='button';btn.textContent='Eliminar';btn.setAttribute('aria-label','Eliminar nota '+(i+1));btn.addEventListener('click',()=>{notes.splice(i,1);save();render();});li.append(span,btn);list.append(li);});}form.addEventListener('submit',e=>{e.preventDefault();const value=input.value.trim();if(!value)return;notes.push(value);save();input.value='';render();input.focus();});render();})();</script></body></html>
