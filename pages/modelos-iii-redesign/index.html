<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2efe7"><title>Modelos III · UI Lab v4</title><style>html,body{margin:0;min-height:100%;background:#f2efe7;color:#18201d;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;font-size:12px;font-weight:760;opacity:.58}</style></head><body><div id="boot">cargando versión de prueba…</div><script>(async()=>{try{const raw='https://raw.githubusercontent.com/JuanManuelPM/prometeo/main/pages/modelos-iii/';const [manifest,css2,js2,css4,js4]=await Promise.all([fetch(raw+'AUDIO_PARAGRAPH_V2.json?uilab=4',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('manifest');return r.json()}),fetch('./ui-v2.css?v=4',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('css2');return r.text()}),fetch('./ui-v2.js?v=4',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('js2');return r.text()}),fetch('./ui-v4.css?v=4',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('css4');return r.text()}),fetch('./ui-v4.js?v=4',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('js4');return r.text()})]);new Function(js2);new Function(js4);const files=manifest.bundleFiles;if(!Array.isArray(files)||!files.length)throw Error('bundle');const parts=await Promise.all(files.map(f=>fetch(raw+f+'?uilab=4',{cache:'no-store'}).then(async r=>{if(!r.ok)throw Error(f);return (await r.text()).trim()})));const bin=atob(parts.join('')),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw Error('actualizá el navegador');let html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();html=html.replace('</head>',`<style id="uiLabV2">${css2}</style><style id="uiLabV4">${css4}</style></head>`).replace('</body>',`<script id="uiLabScriptV2">${js2}<\/script><script id="uiLabScriptV4">${js4}<\/script></body>`);document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').textContent='No pude abrir la prueba · '+(e?.message||e)}})();</script></body></html>
