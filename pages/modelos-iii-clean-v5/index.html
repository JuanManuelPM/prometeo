<style>
:root{--paper:#f4f1ea;--ink:#161816;--muted:#777b75;--line:rgba(22,24,22,.14);--soft:rgba(22,24,22,.07);--green:#4aa66b;--yellow:#d6ad3a;--bar:72px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body.dark{--paper:#111411;--ink:#f3f1ea;--muted:#92968f;--line:rgba(243,241,234,.15);--soft:rgba(243,241,234,.08)}button{font:inherit;color:inherit}.app{min-height:100svh}.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 95%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.topline{height:54px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:0 14px}.brand{border:0;background:none;padding:0;text-align:left;font-weight:900;letter-spacing:-.03em;font-size:18px}.theme{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:transparent;display:grid;place-items:center}.theme:before{content:"";width:16px;height:16px;border-radius:50%;background:linear-gradient(90deg,var(--ink) 50%,var(--paper) 50%);border:1px solid var(--line)}.unitstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding:0 12px 10px}.unitbtn{height:34px;border:1px solid var(--line);border-radius:9px;background:transparent;font-size:11px;font-weight:850;position:relative}.unitbtn.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}.unitbtn .mini{position:absolute;left:5px;right:5px;bottom:4px;height:3px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.unitbtn .mini i{border-radius:99px;background:currentColor;opacity:.17}.unitbtn .mini i.good{background:var(--green);opacity:1}.unitbtn .mini i.review{background:var(--yellow);opacity:1}.main{padding:20px 16px calc(var(--bar) + 34px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}.homeTitle{font-size:13px;font-weight:850;letter-spacing:.04em;text-transform:uppercase;opacity:.52;margin:8px 0 8px}.topicCard{width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:20px 0}.topicCard h2{margin:0 0 7px;font-size:24px;line-height:1.12;letter-spacing:-.035em}.topicCard p{margin:0;color:var(--muted);font-size:16px;line-height:1.48}.topicStatus{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:90px;margin-top:12px}.topicStatus i{height:5px;border-radius:99px;background:var(--soft)}.topicStatus i.good{background:var(--green)}.topicStatus i.review{background:var(--yellow)}.topicView{display:none}.topicView.active{display:block}.topicHead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-top:2px}.topicKicker{font-size:11px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;opacity:.48;margin-bottom:6px}.topicHead h1{font-size:clamp(36px,10vw,54px);line-height:.98;letter-spacing:-.055em;margin:0;max-width:11ch}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0 26px}.level{height:42px;border:0;border-radius:10px;background:var(--soft);font-size:13px;font-weight:900}.level.good{background:var(--green);color:#fff}.level.review{background:var(--yellow);color:#201b0f}.level.active{outline:2px solid var(--ink);outline-offset:2px}.copy{font-size:20px;line-height:1.54;letter-spacing:-.015em}.copy p{margin:0 0 18px}.keys{padding-top:14px;margin-top:18px;border-top:1px solid var(--line);font-size:13px;font-weight:850;color:var(--muted)}.depth h3{font-size:18px;margin:24px 0 8px;letter-spacing:-.025em}.depth p{font-size:17px;line-height:1.52;margin:0 0 14px}.reinforce{display:grid;gap:12px}.qa{border:1px solid var(--line);border-radius:14px;padding:14px}.qa strong{display:block;font-size:15px;line-height:1.35}.qa button{margin-top:12px;border:1px solid var(--line);border-radius:9px;background:transparent;padding:8px 10px;font-size:12px;font-weight:800}.answer{display:none;margin-top:12px;font-size:14px;line-height:1.46;color:var(--muted)}.qa.open .answer{display:block}.swipehint{text-align:center;font-size:10px;font-weight:760;opacity:.38;margin-top:24px}.bottom{position:fixed;z-index:40;left:0;right:0;bottom:0;min-height:var(--bar);padding:7px 7px calc(7px + env(safe-area-inset-bottom));display:none;grid-template-columns:1fr 44px 1fr 48px;gap:5px;background:color-mix(in srgb,var(--paper) 96%,transparent);border-top:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.bottom.show{display:grid}.bottom button{min-width:0;height:48px;border:1px solid var(--line);border-radius:10px;background:transparent;font-size:11px;font-weight:850}.bottom .bad.on{background:var(--yellow);color:#201b0f;border-color:var(--yellow)}.bottom .good.on{background:var(--green);color:white;border-color:var(--green)}.bottom .next{background:var(--ink);color:var(--paper);border-color:var(--ink);font-size:20px}.boardIcon svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.board{position:fixed;inset:0;z-index:100;display:none;background:#fff;color:#111;grid-template-rows:54px 1fr}.board.open{display:grid}.boardTop{display:flex;align-items:center;gap:6px;padding:6px;border-bottom:1px solid #e8e8e3;overflow-x:auto}.boardTop button{width:40px;height:40px;flex:0 0 40px;border:1px solid #ddd;border-radius:9px;background:#fff;display:grid;place-items:center;padding:0}.boardTop button.active{background:#111;color:#fff}.boardTop svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.boardWork{display:grid;grid-template-columns:minmax(250px,32vw) 1fr;min-height:0}.boardTheory{overflow:auto;background:#faf9f5;border-right:1px solid #e5e5df;padding:20px}.boardTheory h2{margin:0 0 12px;font-size:25px;line-height:1.02}.boardTheory p{font-size:14px;line-height:1.48}.boardCanvasWrap{position:relative;overflow:hidden;touch-action:none}.boardCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.emojiLayer{position:absolute;inset:0;pointer-events:none}.emoji{position:absolute;transform:translate(-50%,-50%);font-size:38px;pointer-events:auto;touch-action:none;user-select:none}.emojiPalette{position:absolute;right:10px;top:10px;display:none;grid-template-columns:repeat(5,40px);gap:4px;background:#fff;border:1px solid #ddd;border-radius:12px;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.12)}.emojiPalette.open{display:grid}.emojiPalette button{width:40px;height:40px;border:0;background:transparent;font-size:24px}.board.mobileTheory .boardTheory{transform:translateX(0)}.board.hideTheory .boardTheory{display:none}.board.hideTheory .boardWork{grid-template-columns:1fr}.boardNote{position:absolute;left:10px;bottom:10px;font-size:10px;background:rgba(255,255,255,.85);border:1px solid #ddd;border-radius:8px;padding:5px 7px;opacity:.58}.colorDot{width:26px!important;height:26px!important;border-radius:50%!important;background:var(--c)!important;border:2px solid white!important;box-shadow:0 0 0 1px #bbb}.colorDot.active{box-shadow:0 0 0 2px #111}
@media(max-width:700px){.topline{padding:0 12px}.unitstrip{padding-left:8px;padding-right:8px;gap:4px}.unitbtn{height:32px;font-size:10px;border-radius:8px}.main{padding-left:14px;padding-right:14px}.topicHead h1{max-width:none}.copy{font-size:19px}.boardWork{display:block;position:relative}.boardTheory{position:absolute;z-index:4;left:0;top:0;bottom:0;width:min(88vw,360px);box-shadow:10px 0 28px rgba(0,0,0,.12);transition:transform .18s ease}.board.hideTheory .boardTheory{display:block;transform:translateX(-105%)}.boardCanvasWrap{position:absolute;inset:0}.boardTop{gap:4px}.boardTop button{width:38px;height:38px;flex-basis:38px}.brand{font-size:17px}}
@media(max-width:340px){.main{padding-left:11px;padding-right:11px}.unitstrip{gap:3px}.unitbtn{font-size:9px}.bottom{grid-template-columns:1fr 42px 1fr 44px}.bottom button{font-size:10px}.copy{font-size:18px}.topicHead h1{font-size:31px}}
</style>

<body>
<div class="app">
<header class="top"><div class="topline"><button class="brand" id="homeBtn">Modelos III</button><button class="theme" id="themeBtn" aria-label="Cambiar tema"></button></div><div class="unitstrip" id="unitStrip"></div></header>
<main class="main"><section id="home"></section><section id="topic" class="topicView"></section></main>
<nav class="bottom" id="bottom"><button class="bad" id="badBtn">No entendí</button><button class="boardIcon" id="boardBtn" aria-label="Pizarrón"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button><button class="good" id="goodBtn">Entendí</button><button class="next" id="nextBtn">→</button></nav>
</div>

<button class="tool active" data-tool="pen"><svg viewBox="0 0 24 24"><path d="M4 20l4.2-1 10-10-3.2-3.2-10 10L4 20zM13.8 7l3.2 3.2"/></svg></button>

</div>
<div class="boardWork"><aside class="boardTheory" id="boardTheory"></aside><div class="boardCanvasWrap"><canvas class="boardCanvas" id="canvas"></canvas><div class="emojiLayer" id="emojiLayer"></div><div class="emojiPalette" id="emojiPalette"></div><div class="boardNote">Apple Pencil / lápiz: dibuja · dedo: dibuja si no hay lápiz activo</div></div></div>
</section>
<script>
const DATA=[
{t:'Noción de sujeto',s:'La unidad de análisis se amplía: del individuo aislado al sujeto-en-relación y en contexto.',k:'sujeto monádico · sujeto relacional · contexto',d:['La perspectiva sistémica deja de explicar una conducta sólo por propiedades internas. Pregunta qué relaciones, secuencias y contextos la mantienen o le dan sentido.','La causalidad deja de pensarse como una flecha única A→B y pasa a una lógica circular: A influye en B y B modifica a A dentro de una secuencia.'],q:[['¿Qué cambia en la noción de sujeto?','Pasa de un sujeto aislado e intrapsíquico a un sujeto relacional y contextual; la unidad de análisis incluye vínculos y patrones de interacción.'],['¿Qué significa causalidad circular?','Que los efectos vuelven sobre las condiciones que los produjeron: no hay una causa única, sino influencias recíprocas dentro de un circuito.']]},
{t:'Teoría General de los Sistemas',s:'Un sistema es una totalidad organizada: importan los elementos, pero sobre todo sus relaciones y patrones de organización.',k:'totalidad · sistema abierto · homeostasis · equifinalidad',d:['Un sistema no se entiende sumando partes aisladas. Sus propiedades emergen de la organización y de las relaciones entre sus componentes.','Los sistemas abiertos intercambian materia, energía o información con el entorno. Pueden conservar organización mediante homeostasis o cambiar mediante procesos morfogenéticos.'],q:[['¿Qué significa totalidad?','Que el sistema posee propiedades que dependen de la organización del conjunto y no pueden reducirse a una sola parte.'],['¿Qué es equifinalidad?','Que condiciones iniciales diferentes pueden conducir a estados finales semejantes.']]},
{t:'Cibernética',s:'La cibernética estudia regulación y control mediante circuitos de retroalimentación.',k:'feedback · regulación · cambio · observador',d:['La retroalimentación negativa reduce desviaciones y favorece estabilidad. La positiva amplifica desviaciones y puede impulsar cambio. Ninguna es buena o mala por sí misma.','La segunda cibernética incluye al observador dentro del sistema observado: observar también modifica la descripción de aquello que se observa.'],q:[['¿Feedback negativo significa algo malo?','No. Significa reducción de desviación respecto de un patrón; suele estabilizar el sistema.'],['¿Primera vs segunda cibernética?','En la primera el observador se piensa fuera del sistema; en la segunda se reconoce que el observador participa en la construcción de lo observado.']]},
{t:'Teoría de la información',s:'La información reduce incertidumbre; en Bateson, es una diferencia que produce una diferencia para algún sistema.',k:'información · diferencia · ruido · redundancia',d:['En Shannon-Weaver aparecen fuente, mensaje, canal, receptor y ruido. La información puede pensarse como reducción de posibilidades o incertidumbre.','Bateson desplaza el foco del mensaje como objeto a la diferencia relevante para un sistema: no toda diferencia informa, sólo la que produce alguna modificación.'],q:[['¿Qué es información para Bateson?','Una diferencia que produce una diferencia en algún sistema capaz de responder a ella.'],['¿Qué función cumple el ruido?','Introduce perturbaciones en la transmisión y puede aumentar la incertidumbre o dificultar la reconstrucción del mensaje.']]},
{t:'Teoría de la Comunicación Humana',s:'Toda conducta en una interacción puede adquirir valor comunicacional y organizar una relación.',k:'axiomas · metacomunicación · puntuación · digital/analógico',d:['Los cinco axiomas: es imposible no comunicar; toda comunicación tiene contenido y relación; cada participante puntúa la secuencia; usamos modalidades digital y analógica; las relaciones pueden organizarse simétrica o complementariamente.','Los problemas aparecen cuando se confunden niveles, se puntúan de modo incompatible las secuencias, se traducen mal mensajes analógicos/digitales o se rigidizan patrones simétricos o complementarios.'],q:[['¿Qué significa contenido y relación?','Todo mensaje dice algo sobre un contenido y, al mismo tiempo, define cómo debe entenderse la relación entre los participantes.'],['¿Qué es puntuación de la secuencia?','La manera en que cada participante organiza dónde empieza y por qué continúa una interacción; puntuaciones distintas pueden sostener conflictos.']]},
{t:'Constructivismo y construccionismo',s:'El conocimiento y los significados no son copias neutras: se construyen desde marcos, relaciones, lenguaje y prácticas.',k:'observador · realidad · lenguaje · construcción social',d:['El constructivismo subraya que el observador participa activamente en la construcción del conocimiento. Watzlawick diferencia realidad de primer orden y realidad de segundo orden.','El construccionismo social desplaza el foco hacia cómo lenguaje, discursos, prácticas y relaciones producen significados y realidades compartidas.'],q:[['¿Constructivismo vs construccionismo?','El constructivismo enfatiza la construcción del conocimiento por el observador; el construccionismo enfatiza la producción social y lingüística de significados.'],['¿Realidad de primer y segundo orden?','La primera refiere a propiedades y regularidades empíricas; la segunda a significados, valores e interpretaciones atribuidas.']]},
{t:'Modelo de mente de Bateson',s:'La mente puede entenderse como un sistema distribuido de diferencias, transformaciones y circuitos autocorrectivos.',k:'patrón que conecta · diferencia · circuito · tipos lógicos',d:['Para Bateson la mente no se reduce necesariamente al interior del cráneo. Puede describirse a escala de un circuito organizado que incluye organismo, ambiente y flujos de información.','Entre sus criterios aparecen partes interactuantes, diferencias que desencadenan procesos, energía colateral, cadenas circulares, transformaciones de diferencias y jerarquías de tipos lógicos.'],q:[['¿Por qué la mente puede extenderse más allá de la piel?','Porque la unidad relevante puede ser el circuito completo de diferencias y retroalimentaciones del que participa el organismo.'],['¿Qué significa mapa ≠ territorio?','Que una representación o descripción nunca es idéntica a aquello que representa; selecciona diferencias según un marco.']]}
];
const S=JSON.parse(localStorage.getItem('m3cleanV5')||'{}'); if(!S.states)S.states=DATA.map(()=>['','','']); if(!S.boards)S.boards={};
let unit=0,level=0,view='home'; const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function save(){localStorage.setItem('m3cleanV5',JSON.stringify(S))}
function renderStrip(){const el=$('#unitStrip');el.innerHTML=DATA.map((x,i)=>`<button class="unitbtn ${view==='topic'&&i===unit?'active':''}" data-u="${i}">${i+1}<span class="mini">${S.states[i].map(v=>`<i class="${v}"></i>`).join('')}</span></button>`).join('');$$('.unitbtn').forEach(b=>b.onclick=()=>openUnit(+b.dataset.u))}
function renderHome(){view='home';$('#home').style.display='block';$('#topic').classList.remove('active');$('#bottom').classList.remove('show');$('#home').innerHTML='<div class="homeTitle">7 unidades</div>'+DATA.map((x,i)=>`<button class="topicCard" data-u="${i}"><h2>${String(i+1).padStart(2,'0')} · ${x.t}</h2><p>${x.s}</p><span class="topicStatus">${S.states[i].map(v=>`<i class="${v}"></i>`).join('')}</span></button>`).join('');$$('.topicCard').forEach(b=>b.onclick=()=>openUnit(+b.dataset.u));renderStrip();scrollTo(0,0)}
function openUnit(i,l=0){unit=(i+DATA.length)%DATA.length;level=l;view='topic';$('#home').style.display='none';$('#topic').classList.add('active');$('#bottom').classList.add('show');renderTopic();scrollTo(0,0)}
function renderTopic(){const x=DATA[unit];let body='';if(level===0)body=`<div class="copy"><p>${x.s}</p></div><div class="keys">${x.k}</div>`;if(level===1)body=`<div class="depth">${x.d.map((p,i)=>`<h3>${i+1}</h3><p>${p}</p>`).join('')}</div>`;if(level===2)body=`<div class="reinforce">${x.q.map(([q,a])=>`<div class="qa"><strong>${q}</strong><button>Ver respuesta</button><div class="answer">${a}</div></div>`).join('')}</div>`;$('#topic').innerHTML=`<div class="topicHead"><div><div class="topicKicker">Unidad ${unit+1} / ${DATA.length}</div><h1>${x.t}</h1></div></div><div class="levels">${[0,1,2].map(i=>`<button class="level ${S.states[unit][i]} ${i===level?'active':''}" data-l="${i}">${i+1}</button>`).join('')}</div>${body}<div class="swipehint">deslizá horizontalmente para cambiar de unidad</div>`;$$('.level').forEach(b=>b.onclick=()=>{level=+b.dataset.l;renderTopic()});$$('.qa button').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));syncBottom();renderStrip()}
function syncBottom(){const st=S.states[unit][level];$('#badBtn').classList.toggle('on',st==='review');$('#goodBtn').classList.toggle('on',st==='good')}
$('#badBtn').onclick=()=>{S.states[unit][level]='review';save();renderTopic()};$('#goodBtn').onclick=()=>{S.states[unit][level]='good';save();renderTopic()};$('#nextBtn').onclick=()=>{if(level<2){level++;renderTopic();scrollTo(0,0)}else openUnit(unit+1,0)};$('#homeBtn').onclick=renderHome;$('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');S.dark=document.body.classList.contains('dark');save()};if(S.dark)document.body.classList.add('dark');
let gx=0,gy=0,drag=false;$('#topic').addEventListener('touchstart',e=>{if(e.target.closest('button'))return;gx=e.touches[0].clientX;gy=e.touches[0].clientY;drag=true},{passive:true});$('#topic').addEventListener('touchend',e=>{if(!drag)return;drag=false;const t=e.changedTouches[0],dx=t.clientX-gx,dy=t.clientY-gy;if(Math.abs(dx)>58&&Math.abs(dx)>Math.abs(dy)*1.25)openUnit(unit+(dx<0?1:-1),level)},{passive:true});
/* whiteboard */
const B=$('#board'),C=$('#canvas'),ctx=C.getContext('2d'),emojiLayer=$('#emojiLayer');let tool='pen',color='#111',drawing=null,penSeen=false;const emojis=['🧠','💡','🔁','⚠️','✅','❌','❓','⭐','📌','👤','👥','💬','👁️','🌐','🧩','🔗','➡️','⬅️','↔️','🔄'];$('#emojiPalette').innerHTML=emojis.map(e=>`<button>${e}</button>`).join('');function boardState(){return S.boards[unit]||(S.boards[unit]={strokes:[],emojis:[]})}function resize(){const r=C.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);C.width=r.width*d;C.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);drawAll()}new ResizeObserver(resize).observe(C.parentElement);function pos(e){const r=C.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}function drawStroke(s){const r=C.getBoundingClientRect(),p=s.points;if(!p.length)return;ctx.save();ctx.strokeStyle=s.color;ctx.lineWidth=s.w;ctx.lineCap='round';ctx.lineJoin='round';if(s.type==='high'){ctx.globalAlpha=.33;ctx.globalCompositeOperation='multiply'}ctx.beginPath();ctx.moveTo(p[0].x*r.width,p[0].y*r.height);for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x*r.width,p[i].y*r.height);ctx.stroke();if(s.type==='arrow'&&p.length>1){const a=p[0],b=p[p.length-1],x=b.x*r.width,y=b.y*r.height,ang=Math.atan2((b.y-a.y)*r.height,(b.x-a.x)*r.width),L=14;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-L*Math.cos(ang-.55),y-L*Math.sin(ang-.55));ctx.moveTo(x,y);ctx.lineTo(x-L*Math.cos(ang+.55),y-L*Math.sin(ang+.55));ctx.stroke()}ctx.restore()}function drawAll(){const r=C.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);boardState().strokes.forEach(drawStroke);if(drawing)drawStroke(drawing);emojiLayer.innerHTML='';boardState().emojis.forEach((e,i)=>{const n=document.createElement('span');n.className='emoji';n.textContent=e.c;n.style.left=e.x*100+'%';n.style.top=e.y*100+'%';n.onpointerdown=ev=>dragEmoji(ev,i);emojiLayer.appendChild(n)})}function allowed(e){if(e.pointerType==='pen'){penSeen=true;return true}if(e.pointerType==='touch'&&penSeen)return false;return true}C.onpointerdown=e=>{if(!allowed(e))return;e.preventDefault();try{C.setPointerCapture(e.pointerId)}catch{};const p=pos(e);if(tool==='eraser'){erase(p);return}drawing={type:tool,color:tool==='high'?'#f0ca32':color,w:tool==='high'?18:3,points:[p]}};C.onpointermove=e=>{if(!drawing||!allowed(e))return;e.preventDefault();const p=pos(e);if(drawing.type==='arrow')drawing.points[1]=p;else drawing.points.push(p);drawAll()};C.onpointerup=e=>{if(!drawing)return;e.preventDefault();if(drawing.points.length>1)boardState().strokes.push(drawing);drawing=null;save();drawAll()};function erase(p){const r=C.getBoundingClientRect();let bi=-1,bd=24;boardState().strokes.forEach((s,i)=>s.points.forEach(q=>{const d=Math.hypot((q.x-p.x)*r.width,(q.y-p.y)*r.height);if(d<bd){bd=d;bi=i}}));if(bi>=0){boardState().strokes.splice(bi,1);save();drawAll()}}function dragEmoji(ev,i){if(ev.pointerType==='touch'&&penSeen)return;ev.preventDefault();const n=ev.currentTarget,m=x=>{const r=C.getBoundingClientRect(),e=boardState().emojis[i];e.x=Math.max(0,Math.min(1,(x.clientX-r.left)/r.width));e.y=Math.max(0,Math.min(1,(x.clientY-r.top)/r.height));n.style.left=e.x*100+'%';n.style.top=e.y*100+'%'},u=()=>{n.onpointermove=null;n.onpointerup=null;save()};n.onpointermove=m;n.onpointerup=u}$('#boardBtn').onclick=()=>{B.classList.add('open');B.classList.toggle('hideTheory',innerWidth<700);$('#boardTheory').innerHTML=`<h2>${DATA[unit].t}</h2><p>${DATA[unit].s}</p><p>${DATA[unit].d.join('</p><p>')}</p>`;setTimeout(resize,30)};$('#closeBoard').onclick=()=>B.classList.remove('open');$('#theoryBtn').onclick=()=>B.classList.toggle('hideTheory');$$('.tool').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;$$('.tool').forEach(x=>x.classList.toggle('active',x===b))});$$('.colorDot').forEach(b=>b.onclick=()=>{color=b.dataset.color;$$('.colorDot').forEach(x=>x.classList.toggle('active',x===b))});$('#emojiBtn').onclick=()=>$('#emojiPalette').classList.toggle('open');$$('#emojiPalette button').forEach(b=>b.onclick=()=>{boardState().emojis.push({c:b.textContent,x:.5,y:.5});save();$('#emojiPalette').classList.remove('open');drawAll()});$('#undoBtn').onclick=()=>{const st=boardState();if(st.emojis.length)st.emojis.pop();else st.strokes.pop();save();drawAll()};
renderHome();renderStrip();
