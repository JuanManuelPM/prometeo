<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F5DABF">
  <title>Prometeo · Calendario + Hábitos v3</title>
  <base href="../workspace-v4/">
  <link rel="stylesheet" href="./styles.css?v=20260905-traces3">
  <link rel="stylesheet" href="/prometeo/pages/calendar/previews/habits-traces-v1/traces.css?v=20260905-traces3">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <h1>Calendario</h1>
        <p>tiempo · hábitos · dinero</p>
      </div>
      <div class="top-actions" aria-label="Acciones">
        <button class="tool" type="button">+</button>
        <button class="tool" type="button">◐</button>
        <button class="tool" type="button">•••</button>
      </div>
    </header>

    <nav class="workspace-tabs" aria-label="Área">
      <button data-space="calendar" class="active">CALENDARIO</button>
      <button data-space="habits">HÁBITOS</button>
      <button data-space="money">DINERO</button>
    </nav>

    <section id="calendarSpace" class="space active">
      <div class="romantic-calendar-wrap">
        <iframe id="romanticCalendarFrame" class="romantic-calendar-frame" src="/prometeo/pages/calendar/?romantic-preview=1" title="Calendario semanal Prometeo"></iframe>
      </div>

      <div class="romantic-calendar-legacy" aria-hidden="true">
        <div class="subnav calendar-subnav">
          <div class="segmented" id="calendarViews">
            <button data-view="week" class="active">SEMANA</button>
            <button data-view="month">MES</button>
            <button data-view="agenda">AGENDA</button>
          </div>
          <div class="nav-pair">
            <button id="weekPrev">←</button>
            <span id="weekLabel"></span>
            <button id="weekNext">→</button>
          </div>
        </div>
        <div class="surface calendar-surface">
          <div id="weekView"></div>
          <div id="calendarMonthView" hidden></div>
          <div id="agendaView" hidden></div>
        </div>
      </div>
    </section>

    <section id="habitsSpace" class="space" hidden>
      <div class="traces-toolbar">
        <div>
          <span class="eyebrow">HÁBITOS</span>
          <strong>Últimos 14 días</strong>
        </div>
        <div class="trace-month-nav">
          <button id="tracePrev" type="button" aria-label="14 días anteriores">←</button>
          <span id="traceMonth"></span>
          <button id="traceNext" type="button" aria-label="14 días siguientes">→</button>
        </div>
      </div>

      <div class="surface traces-surface">
        <div class="trace-axis">
          <div class="trace-axis-label">14 DÍAS</div>
          <div class="trace-axis-track" id="traceAxis"></div>
        </div>
        <div id="traceRows"></div>
        <div class="trace-editor" id="traceEditor" hidden>
          <div>
            <strong id="traceEditorTitle"></strong>
            <span id="traceEditorState"></span>
          </div>
          <div class="trace-editor-actions" id="traceEditorActions"></div>
        </div>
        <div class="trace-legend">
          <span><i class="k-line"></i> bien</span>
          <span><i class="k-line"></i><i class="k-dot"></i> ganas</span>
          <span><i class="k-break"></i> caída</span>
          <span><i class="k-done"></i> hecho</span>
        </div>
      </div>

      <div class="legacy-habits" aria-hidden="true">
        <div id="habitRail"></div>
        <span id="habitFamily"></span><strong id="habitTitle"></strong>
        <img id="fireIcon" alt=""><b id="habitStreak"></b>
        <img id="fallIcon" alt=""><b id="habitFalls"></b>
        <button id="habitPrev"></button><strong id="habitMonthLabel"></strong><button id="habitNext"></button>
        <div id="habitActionTray"></div><div id="habitGrid"></div><div id="habitFooter"></div>
      </div>
    </section>

    <section id="moneySpace" class="space" hidden>
      <div class="subnav money-subnav">
        <span class="eyebrow">DINERO</span>
        <span class="money-caption">entra → sale → queda</span>
      </div>
      <div class="surface money-surface">
        <div id="moneyMonths" class="money-months"></div>
        <div class="money-main">
          <div class="money-hero">
            <span class="eyebrow" id="moneyMonthTitle"></span>
            <strong id="moneyNet"></strong>
            <span class="money-word">TE QUEDA</span>
            <div class="money-mini-grid">
              <div><span>seguro</span><b id="moneySafe"></b></div>
              <div><span>con potencial</span><b id="moneyPotential"></b></div>
            </div>
          </div>
          <div class="money-flow" id="moneyFlow"></div>
        </div>
        <button id="moneyDetailsButton" class="details-button">DETALLE</button>
        <div id="moneyDetails" class="money-details" hidden></div>
      </div>
    </section>
  </main>

  <script src="./app.js?v=20260905-traces3"></script>
  <script src="/prometeo/pages/calendar/previews/habits-traces-v1/traces.js?v=20260905-traces3"></script>
  <script src="/prometeo/pages/calendar/previews/habits-traces-v1/romantic.js?v=20260905-traces3"></script>
<script type="module" src="/prometeo/shared/prometeo-shell/v3/prometeo-shell.js?v=3" data-prometeo-shell></script>
</body>
</html>
