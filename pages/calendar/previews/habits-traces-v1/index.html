<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F5DABF">
  <title>Prometeo · Tiempo, hábitos y dinero</title>
  <link rel="stylesheet" href="/prometeo/pages/calendar/previews/habits-traces-v1/traces.css?v=20260905-ux6">
</head>
<body>
  <main class="prometeo-app">
    <header class="app-header">
      <div class="app-brand">
        <span class="app-kicker">PROMETEO</span>
        <h1 id="activeTitle">Calendario</h1>
      </div>
      <button class="icon-button" id="themeButton" type="button" aria-label="Cambiar tema" title="Cambiar tema">◐</button>
    </header>
    <nav class="mode-switch" id="modeSwitch" aria-label="Qué querés mirar">
      <button class="active" data-space="calendar" type="button">CALENDARIO</button>
      <button data-space="habits" type="button">HÁBITOS</button>
      <button data-space="money" type="button">DINERO</button>
    </nav>
    <section class="space active" id="calendarSpace">
      <div class="calendar-frame-shell">
        <iframe id="romanticCalendarFrame" class="romantic-calendar-frame" src="/prometeo/pages/calendar/?romantic-preview=1" title="Calendario semanal Prometeo"></iframe>
      </div>
    </section>
    <section class="space" id="habitsSpace" hidden>
      <div class="section-toolbar habits-toolbar">
        <div><span class="eyebrow">HISTORIAL</span><strong>Todos juntos</strong></div>
        <div class="range-nav"><button id="tracePrev" type="button" aria-label="14 días anteriores">←</button><span id="traceRange"></span><button id="traceNext" type="button" aria-label="14 días siguientes">→</button></div>
      </div>
      <div class="habit-field">
        <div class="habit-grid-row habit-axis-row"><div class="habit-axis-title">14 DÍAS</div><div class="habit-days-axis" id="traceAxis"></div></div>
        <div id="traceRows"></div>
        <div class="trace-editor" id="traceEditor" hidden><div class="trace-editor-copy"><strong id="traceEditorTitle"></strong><span id="traceEditorState"></span></div><div class="trace-editor-actions" id="traceEditorActions"></div></div>
      </div>
    </section>
    <section class="space" id="moneySpace" hidden>
      <div class="section-toolbar money-toolbar"><div><span class="eyebrow">SEPTIEMBRE 2026</span><strong>Dinero</strong></div><span class="money-rule">ENTRA → SALE → QUEDA</span></div>
      <div class="money-panel">
        <div class="money-hero"><span class="eyebrow">TE QUEDA</span><strong class="money-unknown">—</strong><span class="money-help">cargá egresos para calcularlo</span></div>
        <div class="money-summary"><div class="money-row"><span>ENTRA CONFIRMADO</span><strong>$800k</strong></div><div class="money-row potential"><span>POTENCIAL</span><strong>+$50k</strong></div><div class="money-row"><span>SALE</span><strong>—</strong></div></div>
        <div class="money-note">Esta superficie queda separada del calendario y de hábitos: acá sólo vive la lectura financiera.</div>
      </div>
    </section>
  </main>
  <script src="/prometeo/pages/calendar/previews/habits-traces-v1/shell.js?v=20260905-ux6"></script>
  <script src="/prometeo/pages/calendar/previews/habits-traces-v1/traces.js?v=20260905-ux6"></script>
  <script src="/prometeo/pages/calendar/previews/habits-traces-v1/romantic.js?v=20260905-ux7"></script>
</body>
</html>
