<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F5DABF">
  <title>Prometeo · Tiempo, hábitos y dinero</title>
  <link rel="stylesheet" href="/prometeo/pages/calendar/previews/habits-traces-v1/traces.css?v=20260905-ux13">
  <link rel="stylesheet" href="/prometeo/pages/calendar/previews/habits-traces-v1/habits-v13.css?v=20260905-ux13">
  <link rel="stylesheet" href="/prometeo/pages/calendar/previews/habits-traces-v1/habits-v16.css?v=20260907-ux16">
  <link rel="stylesheet" href="/prometeo/pages/calendar/previews/habits-traces-v1/habits-v17.css?v=20260907-ux17">
  <link rel="stylesheet" href="/prometeo/pages/calendar/previews/habits-traces-v1/habits-v18.css?v=20260907-ux18">
  <link rel="stylesheet" href="/prometeo/pages/calendar/previews/habits-traces-v1/habits-v19.css?v=20260907-ux19">
  <link rel="stylesheet" href="/prometeo/pages/calendar/previews/habits-traces-v1/habits-v20.css?v=20260907-ux20">
  <link rel="stylesheet" href="/prometeo/pages/calendar/previews/habits-traces-v1/habits-v21.css?v=20260907-ux21">
  <link rel="stylesheet" href="/prometeo/pages/calendar/previews/habits-traces-v1/habits-v22.css?v=20260907-ux22">
  <link rel="stylesheet" href="/prometeo/pages/calendar/previews/habits-traces-v1/habits-v23.css?v=20260907-ux23">
  <link rel="stylesheet" href="/prometeo/pages/calendar/previews/habits-traces-v1/habits-v24.css?v=20260907-ux24">
  <link rel="stylesheet" href="/prometeo/pages/calendar/previews/habits-traces-v1/habits-v25.css?v=20260907-ux25">
  <link rel="stylesheet" href="/prometeo/pages/calendar/previews/habits-traces-v1/money-v15.css?v=20260907-ux15">
  <script src="/prometeo/pages/calendar/previews/habits-traces-v1/profile-seed.js?v=20260905-ux8"></script>
  <script src="/prometeo/pages/calendar/previews/habits-traces-v1/shell.js?v=20260905-ux14"></script>
</head>
<body>
  <main class="prometeo-app">
    <header class="app-header">
      <div class="app-brand">
        <span class="app-kicker">PROMETEO</span>
        <h1 id="activeTitle">Calendario</h1>
      </div>
      <button class="icon-button" id="themeButton" type="button" aria-label="Cambiar tema" title="Cambiar tema">◐</button>
    </header>

    <nav class="mode-switch" id="modeSwitch" aria-label="Qué querés mirar">
      <button class="active" data-space="calendar" type="button">CALENDARIO</button>
      <button data-space="habits" type="button">HÁBITOS</button>
      <button data-space="money" type="button">DINERO</button>
    </nav>

    <section class="space active" id="calendarSpace">
      <div class="calendar-frame-shell">
        <iframe id="romanticCalendarFrame" class="romantic-calendar-frame" src="/prometeo/pages/calendar/?romantic-preview=1&v=ux17" title="Calendario semanal Prometeo"></iframe>
      </div>
    </section>

    <section class="space" id="habitsSpace" hidden>
      <div class="section-toolbar habits-toolbar">
        <div><span class="eyebrow">HISTORIAL</span><strong>Todos juntos</strong></div>
        <div class="range-nav"><button id="tracePrev" type="button" aria-label="14 días anteriores">←</button><span id="traceRange"></span><button id="traceNext" type="button" aria-label="14 días siguientes">→</button></div>
      </div>

      <div class="habit-field">
        <div class="habit-grid-row habit-axis-row"><div class="habit-axis-title">14 DÍAS</div><div class="habit-days-axis" id="traceAxis"></div></div>
        <div id="traceRows"></div>
      </div>
    </section>

    <section class="space" id="moneySpace" hidden>
      <div class="money-v15">
        <div class="money-monthbar" aria-label="Mes financiero">
          <button id="moneyPrevMonth" type="button" aria-label="Mes anterior">←</button>
          <div class="money-monthbar-copy"><span class="eyebrow">MES</span><strong id="moneyMonthLabel">—</strong></div>
          <button id="moneyNextMonth" type="button" aria-label="Mes siguiente">→</button>
          <button class="money-add" id="moneyAdd" type="button" aria-label="Agregar movimiento">+</button>
        </div>

        <section class="money-hero" aria-label="Saldo proyectado del mes">
          <span class="money-hero-kicker">QUEDA PROYECTADO</span>
          <strong class="money-hero-value" id="moneyRemain">—</strong>
          <div class="money-hero-meta">
            <span>ENTRA <b id="moneyIncome">—</b></span>
            <span>SALE <b id="moneyExpense">—</b></span>
          </div>
          <div class="money-potential-v15" id="moneyPotential" hidden></div>
        </section>

        <section class="money-flow-v15" aria-label="Próximos movimientos">
          <div class="money-section-label"><span>PRÓXIMO</span><strong>flujo del mes</strong></div>
          <div id="moneyTimeline"></div>
        </section>

        <section class="money-disclosures" aria-label="Detalle financiero">
          <details><summary>INGRESOS</summary><div class="money-detail-panel" id="moneyIncomeDetail"></div></details>
          <details><summary>GASTOS</summary><div class="money-detail-panel" id="moneyExpenseDetail"></div></details>
          <details><summary>RECURRENTES</summary><div class="money-detail-panel" id="moneyRecurringDetail"></div></details>
          <details><summary>HISTORIAL</summary><div class="money-detail-panel" id="moneyHistoryDetail"></div></details>
        </section>
      </div>

      <dialog class="money-editor" id="moneyEditor">
        <div class="money-editor-head"><strong>Movimiento</strong><button id="moneyEditorCancel" type="button" aria-label="Cerrar">×</button></div>
        <form class="money-editor-form" id="moneyEditorForm">
          <label>TIPO<select id="moneyEntryType"><option value="expense">Gasto</option><option value="income">Ingreso</option></select></label>
          <label>MONTO<input id="moneyEntryAmount" inputmode="decimal" autocomplete="off" placeholder="0"></label>
          <label>QUÉ FUE<input id="moneyEntryTitle" autocomplete="off" placeholder="Ej. Internet"></label>
          <label>FECHA<input id="moneyEntryDate" type="date"></label>
          <label class="money-editor-check"><input id="moneyEntryRecurring" type="checkbox"> Se repite todos los meses</label>
          <div class="money-editor-actions"><button id="moneyEditorCancelBottom" type="button" onclick="document.getElementById('moneyEditorCancel').click()">CANCELAR</button><button class="primary" type="submit">GUARDAR</button></div>
        </form>
      </dialog>
    </section>
  </main>

  <script src="/prometeo/pages/calendar/previews/habits-traces-v1/traces-v24.js?v=20260907-ux24"></script>
  <script src="/prometeo/pages/calendar/previews/habits-traces-v1/habits-v25.js?v=20260907-ux25"></script>
  <script src="/prometeo/pages/calendar/previews/habits-traces-v1/money-v15.js?v=20260907-ux15"></script>
  <script src="/prometeo/pages/calendar/previews/habits-traces-v1/romantic.js?v=20260907-ux17"></script>
</body>
</html>
