<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F5DABF">
  <title>Prometeo · Tiempo, hábitos y dinero</title>
  <link rel="stylesheet" href="/prometeo/pages/calendar/previews/habits-traces-v1/traces.css?v=20260905-ux9">
  <script src="/prometeo/pages/calendar/previews/habits-traces-v1/profile-seed.js?v=20260905-ux8"></script>
</head>
<body>
  <main class="prometeo-app">
    <header class="app-header">
      <div class="app-brand">
        <span class="app-kicker">PROMETEO</span>
        <h1 id="activeTitle">Calendario</h1>
      </div>
      <button class="icon-button" id="themeButton" type="button" aria-label="Cambiar tema" title="Cambiar tema">◐</button>
    </header>

    <nav class="mode-switch" id="modeSwitch" aria-label="Qué querés mirar">
      <button class="active" data-space="calendar" type="button">CALENDARIO</button>
      <button data-space="habits" type="button">HÁBITOS</button>
      <button data-space="money" type="button">DINERO</button>
    </nav>

    <section class="space active" id="calendarSpace">
      <div class="calendar-frame-shell">
        <iframe id="romanticCalendarFrame" class="romantic-calendar-frame" src="/prometeo/pages/calendar/?romantic-preview=1&v=ux9" title="Calendario semanal Prometeo"></iframe>
      </div>
    </section>

    <section class="space" id="habitsSpace" hidden>
      <div class="section-toolbar habits-toolbar">
        <div><span class="eyebrow">HISTORIAL</span><strong>Todos juntos</strong></div>
        <div class="range-nav"><button id="tracePrev" type="button" aria-label="14 días anteriores">←</button><span id="traceRange"></span><button id="traceNext" type="button" aria-label="14 días siguientes">→</button></div>
      </div>
      <div class="habit-field">
        <div class="habit-grid-row habit-axis-row"><div class="habit-axis-title">14 DÍAS</div><div class="habit-days-axis" id="traceAxis"></div></div>
        <div id="traceRows"></div>
        <div class="trace-editor" id="traceEditor" hidden>
          <div class="trace-editor-copy"><strong id="traceEditorTitle"></strong><span id="traceEditorState"></span></div>
          <div class="trace-editor-actions" id="traceEditorActions"></div>
        </div>
        <div class="momentum-row" id="momentumPanel">
          <div class="momentum-copy">
            <span class="eyebrow">EVOLUCIÓN</span>
            <strong id="momentumFocus">Todas</strong>
            <small id="momentumMeta">misma escala · 0–100</small>
          </div>
          <div class="momentum-plot">
            <svg id="momentumChart" class="momentum-chart" role="img" aria-label="Evolución de hábitos alineada con los mismos catorce días"></svg>
          </div>
        </div>
      </div>
    </section>

    <section class="space" id="moneySpace" hidden>
      <div class="section-toolbar money-toolbar">
        <div><span class="eyebrow">FLUJO</span><strong>Dinero</strong></div>
        <span class="money-rule">INGRESOS — GASTOS</span>
      </div>
      <div class="money-panel">
        <div class="money-chart-head">
          <div class="money-chart-copy"><span class="eyebrow">6 MESES</span><strong>Entradas y salidas</strong><div class="money-potential" id="moneyPotential">—</div></div>
          <div class="money-chart-legend">
            <div class="money-legend-item"><span class="money-legend-line"></span><span>INGRESOS</span></div>
            <div class="money-legend-item"><span class="money-legend-line expense"></span><span>GASTOS</span></div>
          </div>
        </div>
        <div class="money-chart-wrap"><svg class="money-chart" id="moneyChart" role="img" aria-label="Ingresos y gastos por mes"></svg></div>
        <div class="money-readout">
          <div class="money-readout-card"><span>ENTRA</span><strong id="moneyIncome">—</strong><small>programado este mes</small></div>
          <div class="money-readout-card"><span>SALE</span><strong id="moneyExpense">—</strong><small>fijo + variable</small></div>
          <div class="money-readout-card"><span>QUEDA</span><strong id="moneyRemain">—</strong><small>después de gastos</small></div>
        </div>
        <div class="money-foot">
          <div class="money-foot-copy"><strong>GASTOS</strong><span id="moneyExpenseHint">Cargá gastos para completar la segunda línea.</span></div>
          <button class="money-edit" id="moneyEditExpenses" type="button">CARGAR / EDITAR</button>
        </div>
      </div>
    </section>
  </main>

  <script src="/prometeo/pages/calendar/previews/habits-traces-v1/shell.js?v=20260905-ux8"></script>
  <script src="/prometeo/pages/calendar/previews/habits-traces-v1/traces.js?v=20260905-ux9"></script>
  <script src="/prometeo/pages/calendar/previews/habits-traces-v1/money.js?v=20260905-ux8"></script>
  <script src="/prometeo/pages/calendar/previews/habits-traces-v1/romantic.js?v=20260905-ux9"></script>
</body>
</html>
