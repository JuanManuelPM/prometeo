<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F5DABF">
  <title>Prometeo · Workspace v4</title>
  <link rel="stylesheet" href="./styles.css?v=20260904-v4">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <h1>Calendario</h1>
        <p>tiempo · hábitos · dinero</p>
      </div>
      <div class="top-actions" aria-label="Acciones">
        <button class="tool" type="button">+</button>
        <button class="tool" type="button">◐</button>
        <button class="tool" type="button">•••</button>
      </div>
    </header>

    <nav class="workspace-tabs" aria-label="Área">
      <button data-space="calendar" class="active">CALENDARIO</button>
      <button data-space="habits">HÁBITOS</button>
      <button data-space="money">DINERO</button>
    </nav>

    <section id="calendarSpace" class="space active">
      <div class="subnav calendar-subnav">
        <div class="segmented" id="calendarViews">
          <button data-view="week" class="active">SEMANA</button>
          <button data-view="month">MES</button>
          <button data-view="agenda">AGENDA</button>
        </div>
        <div class="nav-pair">
          <button id="weekPrev">←</button>
          <span id="weekLabel"></span>
          <button id="weekNext">→</button>
        </div>
      </div>
      <div class="surface calendar-surface">
        <div id="weekView"></div>
        <div id="calendarMonthView" hidden></div>
        <div id="agendaView" hidden></div>
      </div>
    </section>

    <section id="habitsSpace" class="space" hidden>
      <div class="subnav habits-subnav">
        <div class="habit-rail" id="habitRail" aria-label="Hábitos"></div>
        <div class="habit-meta">
          <div>
            <span id="habitFamily" class="eyebrow"></span>
            <strong id="habitTitle"></strong>
          </div>
          <div class="habit-stats-inline">
            <span><img id="fireIcon" alt=""> <b id="habitStreak">—</b></span>
            <span><img id="fallIcon" alt=""> <b id="habitFalls">—</b></span>
          </div>
        </div>
      </div>
      <div class="surface habit-surface">
        <div class="month-nav">
          <button id="habitPrev">←</button>
          <strong id="habitMonthLabel"></strong>
          <button id="habitNext">→</button>
        </div>
        <div id="habitActionTray" class="habit-action-tray" hidden></div>
        <div class="weekday-row compact"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
        <div id="habitGrid" class="habit-grid"></div>
        <div id="habitFooter" class="habit-footer"></div>
      </div>
    </section>

    <section id="moneySpace" class="space" hidden>
      <div class="subnav money-subnav">
        <span class="eyebrow">DINERO</span>
        <span class="money-caption">entra → sale → queda</span>
      </div>
      <div class="surface money-surface">
        <div id="moneyMonths" class="money-months"></div>
        <div class="money-main">
          <div class="money-hero">
            <span class="eyebrow" id="moneyMonthTitle"></span>
            <strong id="moneyNet"></strong>
            <span class="money-word">TE QUEDA</span>
            <div class="money-mini-grid">
              <div><span>seguro</span><b id="moneySafe"></b></div>
              <div><span>con potencial</span><b id="moneyPotential"></b></div>
            </div>
          </div>
          <div class="money-flow" id="moneyFlow"></div>
        </div>
        <button id="moneyDetailsButton" class="details-button">DETALLE</button>
        <div id="moneyDetails" class="money-details" hidden></div>
      </div>
    </section>
  </main>

  <script src="./app.js?v=20260904-v4"></script>
<script type="module" src="/prometeo/shared/prometeo-shell/v2/prometeo-shell.js?v=2" data-prometeo-shell></script>
</body>
</html>
