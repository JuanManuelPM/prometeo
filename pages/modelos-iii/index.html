<script>
/* Audio V11: usa el mismo backend estable de Walkie (casa-room-audio), con cache remoto + IndexedDB. */
const DATA = {"topics": [{"id": "sujeto", "n": "01", "title": "Noción de sujeto", "short": "Sujeto", "question": "¿Qué cambia en la noción de sujeto con la perspectiva sistémica?", "one": "La unidad de análisis se amplía: del individuo aislado al sujeto-en-relación y en contexto.", "overview": "La sistémica no elimina al individuo; cuestiona que alcance con explicar su conducta desde propiedades internas. Una conducta adquiere sentido dentro de relaciones, secuencias y contextos.", "concepts": ["sujeto monádico", "sujeto relacional", "contexto", "causalidad lineal", "causalidad circular", "unidad de análisis"], "sections": [["Idea central", "Una mirada monádica privilegia al individuo como unidad explicativa. La mirada sistémica amplía el foco hacia las pautas de interacción: quién responde a quién, cómo se modifica la conducta del otro y en qué contexto ocurre."], ["Lineal vs circular", "En causalidad lineal buscamos A → B. En circularidad observamos A ↔ B: cada respuesta funciona a la vez como consecuencia y como condición de la siguiente respuesta. Ejemplo: crítica → retraimiento → más crítica → más retraimiento."], ["Contexto", "Una conducta aislada puede parecer absurda. Al ampliar el marco puede adquirir sentido. “Juan es retraído” informa menos que “Juan se retrae cada vez que su padre lo critica y vuelve a hablar cuando cambia el contexto”."], ["No confundir", "Sistémica no significa que el individuo no exista, que todo lo cause la familia ni que nadie tenga características propias. Significa que esas características no agotan la explicación de la conducta."]], "exam": "El paradigma sistémico desplaza una concepción monádica del sujeto, centrada principalmente en propiedades intrapsíquicas, hacia una concepción relacional y contextual. La conducta pasa a comprenderse como parte de pautas de interacción recíproca, por lo que adquieren centralidad el contexto, la comunicación y la causalidad circular.", "connect": "Si el sujeto se entiende dentro de relaciones, necesitamos una teoría capaz de describir totalidades organizadas: la Teoría General de los Sistemas.", "recall": [["Explicá en 30 segundos qué cambia en la noción de sujeto.", "Tiene que aparecer: sujeto monádico → sujeto relacional/contextual; ampliación de unidad de análisis; interacción/circularidad."], ["Inventá un ejemplo donde una propiedad individual cambie de significado al ampliar el contexto.", "Buscá mostrar una conducta que parece rasgo estable pero aparece ligada a una relación o situación específica."]]}, {"id": "tgs", "n": "02", "title": "Teoría General de los Sistemas", "short": "Sistemas", "question": "¿Qué permite explicar la TGS que se pierde al estudiar elementos aislados?", "one": "Un sistema es una totalidad organizada: importan los elementos, pero sobre todo sus relaciones y patrones de organización.", "overview": "Bertalanffy permite pensar totalidades interdependientes. En sistemas abiertos, las partes se modifican mutuamente y mantienen intercambios con el entorno.", "concepts": ["sistema", "totalidad", "sistemas abiertos", "circularidad", "homeostasis", "morfostasis", "morfogénesis", "equifinalidad", "isomorfismo"], "sections": [["Sistema", "Conjunto de elementos interrelacionados cuya organización produce propiedades que no pueden comprenderse adecuadamente sumando partes aisladas. Sistema = elementos + relaciones + organización."], ["Totalidad", "“El todo es más que la suma de sus partes” significa que las relaciones agregan propiedades. Dos personas tranquilas por separado pueden producir juntas una pauta competitiva: esa propiedad pertenece a la interacción."], ["Sistemas abiertos", "Los sistemas humanos intercambian información, personas, recursos y significados con otros sistemas. Una familia no está aislada de escuela, trabajo, cultura o instituciones."], ["Homeostasis", "Tendencia a conservar determinados estados o reglas. No equivale a salud: un sistema puede estabilizar una pauta disfuncional."], ["Morfostasis / morfogénesis", "Morfostasis: procesos que conservan organización. Morfogénesis: procesos que transforman organización. Un sistema adaptable necesita estabilidad y capacidad de cambio."], ["Equifinalidad", "Diferentes condiciones iniciales pueden conducir a estados finales semejantes. No debe definirse como “todas las partes buscan el mismo fin”."], ["Multifinalidad", "Condiciones iniciales semejantes pueden conducir a resultados distintos. Un mismo evento no determina el mismo desenlace en todas las personas."], ["Isomorfismo", "Sistemas distintos pueden compartir una forma de organización. Un termostato y ciertos procesos biológicos no son iguales, pero pueden describirse con regulación, desviación y feedback."]], "exam": "La TGS estudia sistemas como totalidades organizadas de elementos interdependientes. Sus propiedades centrales incluyen totalidad, apertura al entorno, circularidad y procesos de estabilidad y cambio. La equifinalidad muestra que distintos recorridos pueden producir resultados semejantes, lo cual cuestiona explicaciones deterministas simples.", "connect": "Una vez que pensamos sistemas, la pregunta siguiente es cómo se regulan y cambian. Esa es la puerta de entrada a la cibernética.", "recall": [["Definí sistema sin usar la frase “conjunto de cosas”.", "Tiene que aparecer organización, elementos interrelacionados y propiedades emergentes de las relaciones."], ["¿Por qué homeostasis no significa salud?", "Porque describe estabilidad/regulación, y una pauta disfuncional también puede mantenerse estable."], ["Definí equifinalidad y da un ejemplo.", "Diferentes condiciones iniciales → resultado semejante."]]}, {"id": "cibernetica", "n": "03", "title": "Cibernética", "short": "Cibernética", "question": "¿Cómo mantiene o modifica su organización un sistema?", "one": "La cibernética estudia regulación y control mediante circuitos de retroalimentación.", "overview": "Wiener introduce el feedback como mecanismo central de autorregulación. Una salida vuelve como información y modifica el funcionamiento posterior del sistema.", "concepts": ["feedback", "retroalimentación negativa", "retroalimentación positiva", "autorregulación", "cambio 1º orden", "cambio 2º orden", "1ª cibernética", "2ª cibernética"], "sections": [["Circuito de feedback", "En un sistema regulado la salida no termina el proceso: información sobre esa salida vuelve al sistema y ajusta su conducta posterior."], ["Feedback negativo", "Reduce una desviación y favorece estabilidad/homeostasis. “Negativo” no quiere decir malo."], ["Feedback positivo", "Amplifica una desviación y puede favorecer transformación o escalada. “Positivo” no quiere decir bueno."], ["Cambio de primer orden", "Hay cambios dentro de las reglas del sistema, pero la organización básica permanece. Cambia la jugada, no necesariamente el juego."], ["Cambio de segundo orden", "Cambian reglas, marco u organización del sistema. Ya no se modifica sólo una conducta: cambia el modo de organizar las conductas."], ["Primera cibernética", "El observador describe un sistema observado como si pudiera mantenerse afuera de él."], ["Segunda cibernética", "Incluye al observador en la descripción: seleccionar límites, hacer preguntas y producir distinciones también participa en el sistema observado."], ["Trampa", "Primera/segunda cibernética NO es lo mismo que cambio de primer/segundo orden. Son dos distinciones diferentes."]], "exam": "La cibernética introduce la retroalimentación como principio de regulación. El feedback negativo contrarresta desviaciones y favorece estabilidad, mientras que el positivo amplifica desviaciones y puede promover transformación. La segunda cibernética agrega al observador dentro del proceso de conocimiento y cuestiona la idea de una observación completamente externa.", "connect": "Para que exista feedback tiene que circular algo que permita discriminar estados y ajustar respuestas: información.", "recall": [["Diferenciá feedback positivo y negativo sin usar “bueno/malo”.", "Negativo: reduce desviación/estabiliza. Positivo: amplifica desviación/favorece cambio o escalada."], ["¿Qué diferencia primera y segunda cibernética?", "La segunda incorpora al observador dentro del sistema de observación/conocimiento."], ["¿Cambio de 2º orden = segunda cibernética?", "No. Uno refiere al nivel de cambio del sistema; lo otro al lugar epistemológico del observador."]]}, {"id": "informacion", "n": "04", "title": "Teoría de la información", "short": "Información", "question": "¿Qué significa que algo sea información para un sistema?", "one": "La información reduce incertidumbre; en Bateson, es una diferencia que produce una diferencia para algún sistema.", "overview": "Shannon y Weaver formalizan la transmisión de señales. La sistémica toma esas herramientas y Bateson las transforma para pensar organismos, comunicación y significado.", "concepts": ["fuente", "mensaje", "canal", "receptor", "ruido", "incertidumbre", "entropía", "redundancia", "diferencia"], "sections": [["Modelo básico", "Fuente → mensaje → canal → receptor. El ruido puede interferir. El modelo original se concentra en transmisión e incertidumbre, no principalmente en el significado psicológico."], ["Reducción de incertidumbre", "Información permite discriminar alternativas. Si hay 100 posibilidades y una señal descarta 80, esa señal redujo incertidumbre."], ["Entropía", "En teoría de la información se relaciona con incertidumbre. Para este parcial importa la intuición: más incertidumbre sobre posibles mensajes, mayor entropía informacional."], ["Redundancia", "Regularidades que vuelven parcialmente predecible una secuencia. Las relaciones humanas también construyen pautas repetidas y expectativas."], ["Bateson", "“Una diferencia que hace una diferencia”: no toda diferencia del universo es información para todo sistema. Debe poder ser detectada y producir un cambio pertinente."], ["Energía ≠ información", "Si pateo una piedra, la energía de mi patada la mueve. Si pateo un perro y muerde, la energía del mordisco proviene del perro; la patada funcionó como señal que desencadenó una respuesta."]], "exam": "La teoría de la información permite pensar la reducción de incertidumbre mediante señales transmitidas por un canal. Bateson reformula la información como una diferencia que hace una diferencia: una diferencia es informativa en relación con un sistema capaz de detectarla y modificar su estado o conducta en función de ella.", "connect": "En los sistemas humanos, gran parte de la información circula mediante comunicación. Por eso el siguiente paso es estudiar la pragmática de la interacción.", "recall": [["Explicá “una diferencia que hace una diferencia”.", "Una diferencia sólo funciona como información si un sistema puede detectarla y produce una modificación pertinente en él."], ["¿Por qué información no es lo mismo que energía?", "La señal puede desencadenar una respuesta cuya energía proviene del propio sistema receptor."]]}, {"id": "comunicacion", "n": "05", "title": "Teoría de la comunicación humana", "short": "Comunicación", "question": "¿Qué reglas aparecen cuando pensamos la conducta como comunicación dentro de relaciones?", "one": "La pragmática de la comunicación estudia cómo los mensajes y las respuestas organizan relaciones y conducta.", "overview": "Watzlawick, Beavin y Jackson pasan del modelo lineal de transmisión al estudio circular de la interacción. Los cinco axiomas permiten leer casos concretos.", "concepts": ["pragmática", "5 axiomas", "metacomunicación", "puntuación", "digital/analógico", "simetría/complementariedad"], "sections": [["Sintáctica / semántica / pragmática", "Sintáctica: transmisión y código. Semántica: significado. Pragmática: efectos de la comunicación sobre conducta y relación. El foco de Watzlawick está especialmente en esta última."], ["1 · Es imposible no comunicar", "En una situación interpersonal no existe “no conducta”: hablar, callar, mirar o evitar pueden adquirir valor de mensaje. No requiere intención consciente."], ["2 · Contenido y relación", "Todo mensaje transmite contenido y también propone cómo entender ese mensaje y la relación. La relación funciona como metacomunicación sobre el contenido."], ["3 · Puntuación de la secuencia", "Cada participante puede elegir un comienzo diferente en una secuencia circular. “Me retraigo porque criticás” / “critico porque te retraés”."], ["4 · Digital y analógico", "Digital: signos convencionales, especialmente lenguaje verbal. Analógico: aspectos no verbales/relacionales como tono, gesto, postura, distancia y contexto. Las traducciones entre ambos pueden ser ambiguas."], ["5 · Simetría y complementariedad", "Simetría: posiciones semejantes/igualdad relativa; puede haber escalada competitiva. Complementariedad: posiciones diferentes que encajan recíprocamente. Ninguna es sana o patológica por definición."], ["Metacomunicación", "Comunicación acerca de cómo debe interpretarse la comunicación. “¿Lo decís en serio o me estás cargando?” pregunta por el nivel relacional del mensaje."], ["Doble vínculo · ampliación", "Históricamente asociado a Bateson: mensajes contradictorios en distintos niveles dentro de una relación significativa, junto con dificultad para metacomunicar la contradicción. No debe tomarse hoy como explicación causal suficiente de la esquizofrenia."]], "exam": "La teoría de la comunicación humana estudia pragmáticamente la interacción. Sus cinco axiomas sostienen que es imposible no comunicar; todo mensaje contiene aspectos de contenido y relación; las relaciones dependen de la puntuación de las secuencias; se utilizan modalidades digitales y analógicas; y los intercambios pueden organizarse simétrica o complementariamente.", "connect": "Si la comunicación no sólo transmite datos sino que organiza significados y relaciones, aparece la pregunta por cómo conocemos y construimos aquello que llamamos realidad.", "recall": [["Decí los cinco axiomas sin mirar.", "1 no comunicar; 2 contenido/relación; 3 puntuación; 4 digital/analógico; 5 simetría/complementariedad."], ["Aplicá el 3º axioma a una pelea de pareja.", "Mostrá dos puntuaciones diferentes de una misma secuencia circular."], ["¿Complementario = patológico?", "No. Lo problemático puede ser la rigidez; simetría y complementariedad son formas de organizar intercambios."]]}, {"id": "construccion", "n": "06", "title": "Constructivismo y construccionismo", "short": "Construcción", "question": "¿Qué papel cumplen el observador, el lenguaje y las relaciones en lo que llamamos realidad?", "one": "El constructivismo destaca la participación del observador en el conocimiento; el construccionismo social enfatiza la producción relacional y lingüística de significados.", "overview": "El giro ya no pregunta solamente qué hay afuera, sino cómo nuestras distinciones, categorías, lenguaje e interacciones participan en la realidad que conocemos y habitamos.", "concepts": ["observador", "1º/2º orden de realidad", "constructivismo", "construccionismo", "lenguaje", "significado", "Planolandia", "mapa/territorio"], "sections": [["Constructivismo", "Conocer no es copiar pasivamente un mundo ya dado. El observador selecciona, distingue, clasifica e interpreta. Esto no equivale a decir que “cualquier cosa es verdad”."], ["Realidad de primer orden", "En Watzlawick: propiedades físicas o acontecimientos susceptibles de consenso y comprobación. Ejemplo: un mensaje no fue respondido durante cuatro horas."], ["Realidad de segundo orden", "Significados y valores atribuidos. “No respondió porque no le importo” / “debe estar trabajando” son construcciones distintas a partir del mismo acontecimiento."], ["Planolandia", "Un habitante bidimensional sólo puede percibir secciones compatibles con su marco. La metáfora muestra que el marco de observación limita lo que podemos concebir y que ningún nuevo marco queda automáticamente convertido en verdad absoluta."], ["Construccionismo social", "Desplaza el énfasis desde el observador individual hacia lenguaje, relaciones, prácticas y consensos sociales mediante los cuales se producen significados."], ["Lenguaje", "El lenguaje no sólo etiqueta una realidad neutra: categorías diferentes destacan aspectos diferentes y habilitan acciones diferentes. “Rebeldía” y “búsqueda de autonomía” construyen posiciones distintas."], ["Mapa / territorio", "Una representación no es idéntica a aquello que representa. Operamos mediante distinciones, mapas, signos y descripciones; esta idea será central también en Bateson."]], "exam": "El constructivismo sostiene que el observador participa activamente en la construcción del conocimiento, por lo que conocer no equivale a copiar pasivamente una realidad independiente. El construccionismo social desplaza el énfasis hacia la dimensión relacional, histórica y lingüística de esa construcción: los significados se producen y sostienen en prácticas e interacciones compartidas.", "connect": "Bateson integra observación, diferencias, contexto, información, comunicación y circularidad en una concepción sistémica de los procesos mentales.", "recall": [["Diferenciá constructivismo y construccionismo social en dos frases.", "Constructivismo: observador/conocimiento. Construccionismo: producción relacional, social y lingüística de significados."], ["Diferenciá realidad de 1º y 2º orden con un ejemplo.", "1º: acontecimiento/propiedad consensuable. 2º: significado o valor atribuido."], ["¿Constructivismo = nada existe?", "No. La tesis central refiere a las condiciones y operaciones mediante las cuales conocemos/organizamos la experiencia."]]}, {"id": "bateson", "n": "07", "title": "Modelo de mente de Gregory Bateson", "short": "Bateson", "question": "¿Por qué la mente no puede reducirse simplemente a un cerebro aislado?", "one": "Para Bateson, un proceso mental es un circuito organizado de diferencias, información, relaciones y retroalimentación; sus fronteras dependen del sistema pertinente.", "overview": "Bateson funciona como integrador del parcial: sistemas + cibernética + información + comunicación + contexto + niveles lógicos.", "concepts": ["pauta que conecta", "diferencia", "energía colateral", "circularidad", "transformas", "tipos lógicos", "contexto", "mapa/territorio"], "sections": [["La pauta que conecta", "Bateson privilegia relaciones y patrones: no sólo pregunta qué es una cosa, sino qué relación mantiene con otras y qué forma común conecta fenómenos diferentes."], ["1 · Partes interactuantes", "Una mente es un agregado de partes o componentes interactuantes. Un proceso mental requiere organización y relación entre diferencias."], ["2 · Activada por diferencias", "La interacción se activa por diferencias. La información es una diferencia que hace una diferencia para el sistema."], ["3 · Energía colateral", "La señal no aporta necesariamente la energía de toda la respuesta. El sistema receptor utiliza energía propia para responder a información."], ["4 · Cadenas circulares", "El proceso mental requiere cadenas circulares o más complejas de determinación: feedback, corrección, memoria y adaptación."], ["5 · Transformas", "Los efectos de las diferencias son versiones codificadas de acontecimientos anteriores. Una representación no es el acontecimiento mismo: mapa ≠ territorio."], ["6 · Tipos lógicos", "Los procesos se organizan jerárquicamente. Un mensaje y un mensaje acerca de cómo interpretar ese mensaje pertenecen a niveles diferentes: comunicación y metacomunicación."], ["Hombre · hacha · árbol", "El circuito relevante puede atravesar organismo y entorno: percepción del árbol → acción → golpe → cambio en árbol → nueva percepción → corrección. La pregunta “¿dónde termina la mente?” depende del circuito que analizamos."], ["Contexto", "El significado depende del contexto y del contexto del contexto. Levantar una mano significa algo distinto en una clase, una subasta o una rendición."]], "exam": "Bateson concibe los procesos mentales sistémicamente: requieren partes interactuantes, diferencias que activan interacción, energía colateral, cadenas circulares, transformaciones codificadas y jerarquías de tipos lógicos. Por eso la unidad mental pertinente no tiene que coincidir siempre con los límites de la piel: puede incluir circuitos de información entre organismo y ambiente.", "connect": "Bateson cierra la cadena: sujeto en contexto → sistema → feedback → información → comunicación → observador/construcción → mente como circuito relacional.", "recall": [["Decí los seis criterios de Bateson en orden aproximado.", "Partes interactuantes; diferencias; energía colateral; cadenas circulares; transformas; tipos lógicos."], ["¿Qué demuestra hombre-hacha-árbol?", "Que el circuito de información y corrección puede atravesar organismo y ambiente; la mente pertinente no tiene por qué limitarse al cráneo."], ["Explicá mapa ≠ territorio.", "La representación/codificación no es idéntica al acontecimiento o dominio que representa."]]}], "exam": [["¿Qué transformación se produce en la noción de sujeto con la perspectiva sistémica?", ["concepción monádica", "ampliación de unidad de análisis", "sujeto relacional/contextual", "circularidad", "ejemplo"]], ["Defina sistema y desarrolle propiedades centrales de la TGS.", ["elementos interrelacionados", "organización", "totalidad", "sistema abierto", "homeostasis/cambio", "equifinalidad"]], ["Diferencie retroalimentación positiva y negativa.", ["feedback", "desviación", "negativa reduce/estabiliza", "positiva amplifica/cambia", "no bueno/malo", "ejemplo"]], ["Diferencie primera y segunda cibernética.", ["sistema observado", "observador", "segunda incluye observador", "epistemología", "no confundir con cambio 1º/2º"]], ["Explique la noción de información y relaciónela con Bateson.", ["reducción incertidumbre", "diferencia", "hace una diferencia", "sistema receptor", "energía colateral"]], ["Desarrolle los cinco axiomas de la comunicación humana.", ["no comunicar", "contenido/relación", "puntuación", "digital/analógico", "simetría/complementariedad", "ejemplos"]], ["Compare constructivismo y construccionismo social.", ["observador/conocimiento", "lenguaje/relaciones", "construcción", "significado", "diferencia de énfasis"]], ["Diferencie realidad de primer y segundo orden en Watzlawick.", ["propiedades/acontecimientos consensuables", "significado/valor", "ejemplo", "no confundir"]], ["Explique el modelo de mente de Gregory Bateson.", ["partes interactuantes", "diferencias", "energía colateral", "circularidad", "transformas", "tipos lógicos", "circuito organismo-entorno"]], ["Relacione TGS, cibernética, información y comunicación.", ["sistema", "regulación/feedback", "diferencias/señales", "interacción humana", "circularidad"]]], "cases": [{"title": "Control y ocultamiento", "text": "Una madre dice: “Lo controlo porque nunca me cuenta nada”. El hijo responde: “No le cuento porque controla absolutamente todo”.", "keys": ["sujeto relacional", "circularidad", "feedback", "puntuación", "constructivismo", "información"]}, {"title": "No estoy enojado", "text": "Una persona dice “no estoy enojado” mientras evita mirar, habla entre dientes y golpea la mesa al levantarse.", "keys": ["contenido/relación", "digital/analógico", "metacomunicación", "contexto"]}, {"title": "Silencio en el ascensor", "text": "Dos personas comparten un ascensor. Una se pone auriculares, mira al suelo y no responde al saludo.", "keys": ["imposibilidad de no comunicar", "conducta como mensaje", "contexto", "pragmática"]}, {"title": "Dos historias, mismo resultado", "text": "Tres personas llegan a un patrón de ansiedad semejante luego de trayectorias familiares, laborales y biográficas muy diferentes.", "keys": ["equifinalidad", "sistema abierto", "no determinismo lineal"]}, {"title": "Competencia que escala", "text": "A eleva la voz para imponerse. B responde elevándola más. A sube todavía más el tono y B hace lo mismo.", "keys": ["feedback positivo", "escalada simétrica", "circularidad"]}], "emergency": {"chain": ["Sujeto aislado → sujeto en contexto", "Sistema → relaciones + organización", "Cibernética → feedback + regulación", "Información → reducción de incertidumbre / diferencia", "Comunicación → interacción + 5 axiomas", "Constructivismo → observador", "Construccionismo → lenguaje/relaciones", "Bateson → mente como circuito de diferencias"], "traps": ["Feedback negativo ≠ malo; reduce desviaciones.", "Feedback positivo ≠ bueno; amplifica desviaciones.", "Homeostasis ≠ salud.", "Equifinalidad = distintos inicios pueden llegar a resultados semejantes.", "Simetría ≠ salud y complementariedad ≠ patología.", "Primera/segunda cibernética ≠ cambio de primer/segundo orden.", "Constructivismo ≠ ‘nada existe’.", "Comunicación no exige intención consciente."]}};
const STORE='modelosIII_parcial_v3';
const OLD_STORE='modelosIII_parcial_v2';
const OLDER_STORE='modelosIII_parcial_v1';
const BW=1000,BH=600;
const BOARD_HINTS={
  sujeto:'Dibujá: individuo aislado → persona ↔ contexto.',
  tgs:'Dibujá varios elementos conectados formando una totalidad.',
  cibernetica:'Dibujá un circuito: una salida vuelve como feedback.',
  informacion:'Dibujá una diferencia que entra y cambia lo que pasa después.',

  construccion:'Dibujá el mismo hecho y dos significados diferentes.',
  bateson:'Dibujá organismo ↔ entorno como un circuito de diferencias.'
};
const QUICK={
  sujeto:'La sistémica cambia la unidad de análisis. En vez de explicar una conducta sólo por propiedades internas del individuo, observa la relación y el contexto en que aparece. “Es retraído” puede convertirse en “se retrae cuando lo critican”: la conducta pasa a leerse como parte de una secuencia. Para describir esas relaciones como una totalidad aparece la idea de sistema.',
  tgs:'Un sistema no es sólo un conjunto de partes: es una organización de elementos que se afectan mutuamente. El todo tiene propiedades que no aparecen al estudiar cada parte por separado; en sistemas humanos también importan los intercambios con el entorno. La pregunta siguiente es cómo esa organización conserva estabilidad o cambia.',
  cibernetica:'La cibernética estudia cómo un sistema se regula usando información sobre lo que acaba de ocurrir. Esa información vuelve como feedback: puede reducir una desviación (negativo) o amplificarla (positivo). En la segunda cibernética el observador deja de pensarse como completamente externo. Para que exista feedback tiene que circular información.',
  informacion:'La teoría de la información pregunta cuánto reduce una señal nuestra incertidumbre. En Bateson, algo se vuelve información cuando una diferencia produce otra diferencia en un sistema capaz de detectarla. La señal no necesita aportar la energía de la respuesta: puede simplemente desencadenarla. En sistemas humanos, esas diferencias circulan dentro de interacciones comunicativas.',

function levelState(id){

  if(s.recall==='new'&&old.recoverable)s.recall='good';
  return s
}

async function generateClip(clip){if(!clip||clip.status==='ready')return;const cached=await audioGet(clip.key);if(cached){clip.blob=cached;setClipStatus(clip,'ready');maybeResumeWaitingPlayer(clip.id);return}clip.attempts++;setClipStatus(clip,'generating');try{const gap=Math.max(0,AUDIO_POST_GAP-(Date.now()-lastPostAt));if(gap)await sleep(gap);lastPostAt=Date.now();const r=await fetch(AUDIO_API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({voicePrompt:VOICE_STYLE,text:clip.text,messageId:clip.serverId})});if(!r.ok){let detail='';try{const j=await r.json();detail=j?.error||j?.detail||''}catch{}const err=new Error((detail?detail+' · ':'')+'HTTP '+r.status);err.status=r.status;throw err}const blob=await r.blob();if(!blob.size)throw new Error('audio vacío');clip.blob=await audioPut(clip.key,blob);clip.error=null;clip.attempts=0;setClipStatus(clip,'ready');maybeResumeWaitingPlayer(clip.id)}catch(e){clip.error=String(e?.message||e);const status=e?.status||0;if(clip.attempts<AUDIO_MAX_ATTEMPTS){const wait=status===429?Math.max(18000,retryDelay(clip.attempts)):retryDelay(clip.attempts);clip.retryAt=Date.now()+wait;setClipStatus(clip,'waiting',clip.error);setTimeout(()=>{if(clip.status==='waiting'){clip.status='missing';enqueueClip(clip,clip.priority-.1)}},wait)}else setClipStatus(clip,'error',clip.error)}}
function enqueueClip(clip,priority=clip?.priority??500){if(!clip||clip.status==='ready'||clip.status==='generating'||clip.status==='checking')return;if(clip.status==='queued'){const q=audioQueue.find(x=>x.id===clip.id);if(q&&priority<q.priority){q.priority=priority;audioQueue.sort((a,b)=>a.priority-b.priority||a.order-b.order)}return}if(clip.status==='waiting'&&Date.now()<clip.retryAt)return;clip.status='queued';audioQueue.push({id:clip.id,priority,order:Date.now()+Math.random()});audioQueue.sort((a,b)=>a.priority-b.priority||a.order-b.order);updateAudioMonitor();updateReaderUI();runAudioQueue()}
async function runAudioQueue(){if(audioWorking)return;audioWorking=true;try{while(audioQueue.length){const task=audioQueue.shift(),clip=AUDIO_CLIPS.get(task.id);if(!clip||clip.status==='ready'||clip.status==='generating'||clip.status==='checking')continue;await generateClip(clip)}}finally{audioWorking=false;updateAudioMonitor()}}
function queueAllMissing(){[...AUDIO_CLIPS.values()].sort((a,b)=>a.priority-b.priority).forEach(c=>{if(['missing','idle'].includes(c.status))enqueueClip(c,c.priority)})}
async function mapLimit(items,limit,fn){let i=0;const workers=Array.from({length:Math.min(limit,items.length)},async()=>{while(i<items.length){const x=items[i++];await fn(x)}});await Promise.all(workers)}
async function hydrateAudioCatalog(){const clips=[...AUDIO_CLIPS.values()];await mapLimit(clips,8,async c=>{const b=await audioGet(c.key);if(b){c.blob=b;c.status='ready'}});const missing=clips.filter(c=>c.status!=='ready').sort((a,b)=>a.priority-b.priority);audioPrepared=true;updateAudioMonitor();updateReaderUI();mapLimit(missing,6,fetchRemoteClip).then(()=>{queueAllMissing();updateAudioMonitor();updateReaderUI()}).catch(()=>{})}
function readingStatus(id){const r=READINGS.get(id);if(!r||!r.clips.length)return'idle';const cs=r.clips.map(cid=>AUDIO_CLIPS.get(cid)).filter(Boolean);if(cs.every(c=>c.status==='ready'))return'ready';if(cs[0]?.status==='ready')return'partial';if(cs.some(c=>['checking','generating','queued','waiting','missing'].includes(c.status)))return'loading';if(cs[0]?.status==='error')return'error';return'idle'}
function readingCanStart(id){const r=READINGS.get(id),c=r&&AUDIO_CLIPS.get(r.clips[0]);return !!c&&c.status==='ready'}
function prioritizeReading(id){const r=READINGS.get(id);if(!r)return;r.clips.forEach((cid,i)=>{const c=AUDIO_CLIPS.get(cid);if(!c||c.status==='ready'||c.status==='generating')return;c.priority=Math.min(c.priority,-100+i*.01);if(c.status==='checking')return;if(c.status==='error'){c.status='missing';c.attempts=0;c.error=null}enqueueClip(c,c.priority)})}
async function ensureAudioContext(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume();return audioCtx}
async function decodeClip(clip){if(decodedCache.has(clip.key))return decodedCache.get(clip.key);let blob=clip.blob||await audioGet(clip.key);if(!blob)return null;clip.blob=blob;const ctx=await ensureAudioContext();const ab=await blob.arrayBuffer();const buffer=await ctx.decodeAudioData(ab.slice(0));decodedCache.set(clip.key,buffer);return buffer}
function currentOffset(){if(!playerState.actualPlaying||!audioCtx)return playerState.offset||0;return Math.max(0,(playerState.offset||0)+(audioCtx.currentTime-playerState.startedAt))}
function stopSource(manual=true){if(playerState.source){const s=playerState.source;playerState.source=null;if(manual)playerState.token++;try{s.onended=null;s.stop()}catch{}}playerState.actualPlaying=false}
function resetPlayer(){stopSource();Object.assign(playerState,{id:null,index:0,source:null,started:false,actualPlaying:false,paused:false,waiting:false,wantPlay:false,offset:0,startedAt:0,pendingSeek:null});updateReaderUI()}
function stopReading(){resetPlayer()}
function readingClip(id,index){const r=READINGS.get(id);return r?AUDIO_CLIPS.get(r.clips[index]):null}
async function startBuffer(id,index,offset=0){const r=READINGS.get(id),clip=readingClip(id,index);if(!r||!clip)return;if(clip.status!=='ready'){playerState.id=id;playerState.index=index;playerState.waiting=true;playerState.wantPlay=true;playerState.pendingSeek={offset};prioritizeReading(id);updateReaderUI();return}const buffer=await decodeClip(clip);if(!buffer){clip.status='missing';playerState.waiting=true;prioritizeReading(id);updateReaderUI();return}const ctx=await ensureAudioContext();stopSource();playerState.id=id;playerState.index=index;playerState.offset=Math.max(0,Math.min(Math.max(0,buffer.duration-.03),offset));playerState.startedAt=ctx.currentTime;playerState.waiting=false;playerState.wantPlay=true;playerState.paused=false;const src=ctx.createBufferSource();src.buffer=buffer;src.connect(ctx.destination);const token=++playerState.token;playerState.source=src;src.onended=()=>{if(token!==playerState.token||playerState.source!==src)return;playerState.source=null;playerState.actualPlaying=false;playerState.offset=0;const next=index+1;if(next<r.clips.length){playerState.index=next;playerState.waiting=true;playerState.wantPlay=true;startBuffer(id,next,0)}else resetPlayer()};src.start(0,playerState.offset);playerState.started=true;playerState.actualPlaying=true;updateReaderUI();const nextClip=readingClip(id,index+1);if(nextClip&&nextClip.status==='ready')decodeClip(nextClip).catch(()=>{});else if(nextClip)enqueueClip(nextClip,-90)}
function maybeResumeWaitingPlayer(clipId){if(!playerState.id||!playerState.waiting||!playerState.wantPlay)return;const r=READINGS.get(playerState.id);if(!r||r.clips[playerState.index]!==clipId)return;const offset=playerState.pendingSeek?.offset||0;playerState.pendingSeek=null;startBuffer(playerState.id,playerState.index,offset)}
async function toggleReading(id){buildAudioCatalog();await ensureAudioContext();if(playerState.id!==id){resetPlayer();playerState.id=id;playerState.index=0;playerState.wantPlay=true;prioritizeReading(id);if(readingCanStart(id))await startBuffer(id,0,0);else{playerState.waiting=true;updateReaderUI()}return}if(playerState.waiting){prioritizeReading(id);return}if(playerState.actualPlaying){playerState.offset=currentOffset();stopSource();playerState.paused=true;playerState.wantPlay=false;updateReaderUI();return}playerState.wantPlay=true;playerState.paused=false;await startBuffer(id,playerState.index,playerState.offset||0)}
async function seekReading(id,seconds){if(playerState.id!==id||!playerState.started){await toggleReading(id);return}const r=READINGS.get(id);if(!r)return;const wasPlaying=playerState.actualPlaying;let idx=playerState.index,offset=currentOffset()+seconds;stopSource();while(true){const clip=readingClip(id,idx);if(!clip){resetPlayer();return}if(clip.status!=='ready'){playerState.id=id;playerState.index=idx;playerState.offset=Math.max(0,offset);playerState.waiting=true;playerState.wantPlay=wasPlaying;playerState.paused=!wasPlaying;playerState.pendingSeek={offset:Math.max(0,offset)};prioritizeReading(id);updateReaderUI();return}const buf=await decodeClip(clip);if(!buf)return;if(offset<0){if(idx===0){offset=0;break}idx--;const prev=readingClip(id,idx);if(prev?.status!=='ready'){playerState.index=idx;playerState.waiting=true;playerState.wantPlay=wasPlaying;playerState.pendingSeek={offset:0};prioritizeReading(id);updateReaderUI();return}const pb=await decodeClip(prev);offset=(pb?.duration||0)+offset;continue}if(offset>=buf.duration&&idx<r.clips.length-1){offset-=buf.duration;idx++;continue}offset=Math.min(Math.max(0,offset),Math.max(0,buf.duration-.03));break}playerState.index=idx;playerState.offset=offset;playerState.paused=!wasPlaying;playerState.wantPlay=wasPlaying;if(wasPlaying)await startBuffer(id,idx,offset);else updateReaderUI()}
function updateReaderUI(){document.querySelectorAll('.readctl').forEach(el=>{const id=el.dataset.readId,st=readingStatus(id),same=id===playerState.id,active=same&&playerState.started,waiting=same&&playerState.waiting&&!playerState.started,main=el.querySelector('.read-main');el.classList.toggle('active',active);el.classList.toggle('waiting',waiting);el.classList.toggle('speaking',active&&playerState.actualPlaying);el.classList.toggle('loading',!active&&st==='loading'&&!readingCanStart(id));el.classList.toggle('audio-error',st==='error');if(!main)return;if(waiting){main.textContent='◌';main.title='Preparando audio'}else if(active){main.textContent=playerState.actualPlaying?'❚❚':'▶';main.title=playerState.actualPlaying?'Pausar':'Continuar'}else if(readingCanStart(id)){main.textContent='▶';main.title=st==='partial'?'Reproducir · el resto sigue cargando':'Reproducir'}else if(st==='error'){main.textContent='↻';main.title='Reintentar audio'}else if(st==='loading'){main.textContent='◌';main.title='Preparando audio'}else{main.textContent='▶';main.title='Preparar y reproducir'}})}
function wireAudio(root=document){root.querySelectorAll('.readctl').forEach(el=>{const id=el.dataset.readId;el.querySelector('.read-main').onclick=e=>{e.stopPropagation();toggleReading(id)};el.querySelector('.read-back').onclick=e=>{e.stopPropagation();seekReading(id,-5)};el.querySelector('.read-forward').onclick=e=>{e.stopPropagation();seekReading(id,10)};el.addEventListener('mouseenter',()=>prioritizeReading(id),{once:true})});updateReaderUI()}
function preloadVisibleAudio(root,priority=0){[...root.querySelectorAll('.readctl')].slice(0,2).forEach(el=>{const r=READINGS.get(el.dataset.readId);r?.clips.forEach((cid,i)=>{const c=AUDIO_CLIPS.get(cid);if(c&&['idle','missing'].includes(c.status))enqueueClip(c,priority+i*.01)})})}
function topicReadingStatus(topic,tier){const id=`topic-${topic}-${tier}`,r=READINGS.get(id);if(!r)return'idle';const cs=r.clips.map(x=>AUDIO_CLIPS.get(x)).filter(Boolean);if(cs.every(c=>c.status==='ready'))return'ready';if(cs.some(c=>c.status==='generating'))return'generating';if(cs.some(c=>c.status==='error'))return'error';if(cs.some(c=>c.status==='checking'))return'checking';if(cs.some(c=>c.status==='queued'))return'queued';if(cs.some(c=>c.status==='waiting'))return'waiting';if(cs.some(c=>c.status==='missing'))return'missing';return'idle'}
function updateAudioMonitor(){const panel=document.getElementById('audioPanel'),list=document.getElementById('audioTierList'),overall=document.getElementById('audioOverall'),foot=document.getElementById('audioPanelFoot');if(!panel||!list)return;const tiers=['quick','deep','recall','apply'];const rows=tiers.map(tier=>{const sts=DATA.topics.map(t=>topicReadingStatus(t.id,tier)),ready=sts.filter(s=>s==='ready').length;return {tier,sts,ready}});list.innerHTML=rows.map(({tier,sts,ready})=>`<div class="audio-tier"><span class="audio-tier-name">${AUDIO_TIER_LABELS[tier]}</span><span class="audio-unit-track">${sts.map((s,i)=>`<i class="${s}" title="${DATA.topics[i].n} · ${esc(DATA.topics[i].title)} · ${s}"></i>`).join('')}</span><span class="audio-tier-count">${ready}/7</span></div>`).join('');const firstPending=rows.find(x=>x.ready<7);const clips=[...AUDIO_CLIPS.values()],errors=clips.filter(c=>c.status==='error').length,generating=clips.find(c=>c.status==='generating');overall.textContent=firstPending?`${AUDIO_TIER_LABELS[firstPending.tier]} ${firstPending.ready}/7`:'núcleo listo';const extra=clips.filter(c=>c.meta?.tier==='extras'),extraReady=extra.filter(c=>c.status==='ready').length;let left=generating?`generando · ${generating.meta?.label||'audio'}`:`extras ${extraReady}/${extra.length}`;if(!audioPrepared)left='buscando audios guardados…';foot.innerHTML=`<span>${esc(left)}</span><span>${errors?`${errors} pendiente${errors===1?'':'s'}`:'cacheando en segundo plano'}</span>`}
function retryAllAudio(){[...AUDIO_CLIPS.values()].filter(c=>c.status==='error').forEach(c=>{c.status='missing';c.attempts=0;c.error=null;enqueueClip(c,c.priority)});updateAudioMonitor()}
async function prepareAudio(){buildAudioCatalog();updateAudioMonitor();await hydrateAudioCatalog();updateAudioMonitor()}

const IMG_DB='modelosIII_board_images_v1',IMG_STORE='images';
let imgDBPromise=null;
const imageCache=new Map(),imageLoads=new Map();
const boardRuntime={tool:{},selected:{}};
function openImgDB(){if(imgDBPromise)return imgDBPromise;imgDBPromise=new Promise((resolve,reject)=>{try{const r=indexedDB.open(IMG_DB,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(IMG_STORE))db.createObjectStore(IMG_STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)}catch(e){reject(e)}});return imgDBPromise}
async function imgPut(blob,id){const db=await openImgDB();return new Promise((resolve,reject)=>{const tx=db.transaction(IMG_STORE,'readwrite');tx.objectStore(IMG_STORE).put(blob,id);tx.oncomplete=()=>resolve(id);tx.onerror=()=>reject(tx.error)})}
async function imgGet(id){const db=await openImgDB();return new Promise((resolve,reject)=>{const tx=db.transaction(IMG_STORE,'readonly');const r=tx.objectStore(IMG_STORE).get(id);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}
async function imgDelete(id){try{const db=await openImgDB();await new Promise((resolve,reject)=>{const tx=db.transaction(IMG_STORE,'readwrite');tx.objectStore(IMG_STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});const cached=imageCache.get(id);if(cached?.src?.startsWith('blob:'))URL.revokeObjectURL(cached.src);imageCache.delete(id)}catch(e){}}
async function clearAllImages(){try{const db=await openImgDB();await new Promise((resolve,reject)=>{const tx=db.transaction(IMG_STORE,'readwrite');tx.objectStore(IMG_STORE).clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});imageCache.forEach(im=>{if(im?.src?.startsWith('blob:'))URL.revokeObjectURL(im.src)});imageCache.clear()}catch(e){}}
function blobToImage(blob){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(blob);const im=new Image();im.onload=()=>resolve(im);im.onerror=e=>{URL.revokeObjectURL(url);reject(e)};im.src=url})}
async function normalizeImageBlob(blob){let im;try{im=await blobToImage(blob)}catch(e){throw new Error('No pude leer esa imagen')}const maxW=1800,maxH=1350,scale=Math.min(1,maxW/im.naturalWidth,maxH/im.naturalHeight);if(scale>=.999&&blob.size<1800000)return {blob,w:im.naturalWidth,h:im.naturalHeight};const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*scale));c.height=Math.max(1,Math.round(im.naturalHeight*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);const out=await new Promise(resolve=>c.toBlob(resolve,'image/webp',.92));return {blob:out||blob,w:c.width,h:c.height}}

function cacheImageBlob(id,blob){if(imageCache.has(id))return Promise.resolve(imageCache.get(id));return blobToImage(blob).then(im=>{imageCache.set(id,im);return im})}
function ensureImage(id,inline=null){if(imageCache.has(id))return Promise.resolve(imageCache.get(id));if(imageLoads.has(id))return imageLoads.get(id);const source=inline?Promise.resolve(inline):imgGet(id);const p=source.then(v=>{if(!v)return null;if(typeof v==='string')return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=v});return cacheImageBlob(id,v)}).then(im=>{imageLoads.delete(id);if(im){imageCache.set(id,im);requestAnimationFrame(()=>{DATA.topics.forEach(t=>refreshBoardViews(t.id));refreshAllThumbs(document)})}return im}).catch(()=>{imageLoads.delete(id);return null});imageLoads.set(id,p);return p}
function resolveImageItems(id,override=null){const map=new Map(),order=[];for(const op of bstate(id).ops){if(op.t==='image'){if(!map.has(op.itemId))order.push(op.itemId);map.set(op.itemId,{...(map.get(op.itemId)||{}),...op})}else if(op.t==='imageDelete'){map.delete(op.itemId)}}let arr=order.filter(k=>map.has(k)).map(k=>map.get(k));if(override?.t==='imageTransform')arr=arr.map(it=>it.itemId===override.item.itemId?override.item:it);return arr}
function imageBlobIds(id){return [...new Set(bstate(id).ops.filter(o=>o.t==='image'&&o.blobId).map(o=>o.blobId))]}
function newId(prefix='i'){return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
async function addImageToBoard(id,blob,at=null){if(!blob||!blob.type?.startsWith('image/'))return;showToast('Preparando imagen…');try{const n=await normalizeImageBlob(blob);const blobId=newId('blob'),itemId=newId('img');let inline=null,persist='idb';try{await imgPut(n.blob,blobId);cacheImageBlob(blobId,n.blob).catch(()=>{})}catch(e){persist='inline';inline=await compactFallbackDataURL(n.blob);ensureImage(blobId,inline)}const sc=Math.min(1,560/n.w,370/n.h),w=Math.max(90,Math.round(n.w*sc)),h=Math.max(70,Math.round(n.h*sc));let x=at?at[0]-w/2:(BW-w)/2,y=at?at[1]-h/2:(BH-h)/2;x=Math.max(0,Math.min(BW-w,x));y=Math.max(0,Math.min(BH-h,y));addBoardOp(id,{t:'image',itemId,blobId,x:Math.round(x),y:Math.round(y),w,h,aspect:n.w/n.h,inline});boardRuntime.selected[id]=itemId;setBoardTool(id,'select');boardRuntime.selected[id]=itemId;syncImageDeleteUI(id);setBoardOpen(id,true);refreshBoardViews(id);showToast(persist==='idb'?'Imagen agregada':'Imagen agregada')}catch(e){showToast('No pude agregar esa imagen')}}
function currentImage(id,itemId){return resolveImageItems(id).find(x=>x.itemId===itemId)||null}
function syncImageDeleteUI(id){const c=document.querySelector(`canvas[data-board-id="${id}"]`);c?.closest('.boardsection')?.querySelector('[data-board-action="delete"]')?.classList.toggle('ready',!!boardRuntime.selected[id])}
function setBoardTool(id,tool){boardRuntime.tool[id]=tool;document.querySelectorAll(`canvas[data-board-id="${id}"]`).forEach(c=>{c.classList.toggle('selecting',tool==='select');if(tool!=='select')c.classList.remove('dragging')});const c=document.querySelector(`canvas[data-board-id="${id}"]`);const section=c?.closest('.boardsection');section?.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===tool));if(tool!=='select')boardRuntime.selected[id]=null;syncImageDeleteUI(id);refreshBoardViews(id)}
function deleteSelectedImage(id){const itemId=boardRuntime.selected[id];if(!itemId)return showToast('Seleccioná una imagen primero');addBoardOp(id,{t:'imageDelete',itemId});boardRuntime.selected[id]=null;syncImageDeleteUI(id);showToast('Imagen borrada · Deshacer la recupera')}
async function pasteFromClipboard(id){try{if(!navigator.clipboard?.read)throw new Error();const items=await navigator.clipboard.read();for(const it of items){const type=it.types.find(t=>t.startsWith('image/'));if(type){await addImageToBoard(id,await it.getType(type));return}}showToast('El portapapeles no tiene una imagen')}catch(e){showToast('Usá Ctrl+V para pegar la captura')}}

function topicById(id){return DATA.topics.find(t=>t.id===id)}
function thumbHTML(id,cls=''){return `<canvas class="${cls}" data-thumb="${id}" aria-hidden="true"></canvas>`}
function memoryHTML(current,compact=false){return DATA.topics.map(t=>`<div class="memoryitem ${current===t.id?'current':''} ${boardHas(t.id)?'':'empty-sketch'}"><button class="memorypreview" data-sketch="${t.id}" aria-label="Ampliar dibujo de ${esc(t.title)}">${thumbHTML(t.id)}</button><button class="memorylabel" data-memory-topic="${t.id}"><span>${t.n}</span>${esc(t.title)}<span class="levelmarks" data-level-mark-id="${t.id}">${LEVEL_DEFS.map(([k])=>`<i class="${levelClass(levelState(t.id)[k])}"></i>`).join('')}</span></button></div>`).join('')}
function memoryRail(current){return `<aside class="memoryrail">${memoryHTML(current)}</aside>`}
function memoryStrip(current){return `<div class="memorystrip" aria-label="Mapa visual de temas">${memoryHTML(current,true)}</div>`}
function sequenceHTML(current){const idx=DATA.topics.findIndex(t=>t.id===current);return `<div class="visual-seq">${DATA.topics.slice(0,idx+1).map((t,i)=>`${i?'<span class="seqarrow">→</span>':''}<div class="seqitem"><canvas data-thumb="${t.id}"></canvas><div class="seqcap">${t.n} ${esc(t.title)}</div></div>`).join('')}</div>`}
function wireMemory(root=document){root.querySelectorAll('[data-sketch]').forEach(b=>b.onclick=e=>{e.stopPropagation();openSketch(b.dataset.sketch)});root.querySelectorAll('[data-memory-topic]').forEach(b=>b.onclick=e=>{e.stopPropagation();openTopic(b.dataset.memoryTopic)});requestAnimationFrame(()=>refreshAllThumbs(root))}

function fitCanvas(c){const rect=c.getBoundingClientRect();const cssW=Math.max(120,rect.width||300);const ratio=c.classList.contains('boardcanvas')&&innerWidth<=520?3/4:BH/BW;const dpr=Math.min(2,window.devicePixelRatio||1);const w=Math.round(cssW*dpr),h=Math.round(cssW*ratio*dpr);if(c.width!==w||c.height!==h){c.width=w;c.height=h}return {sx:c.width/BW,sy:c.height/BH}}
function drawOp(ctx,op){ctx.lineCap='round';ctx.lineJoin='round';if(op.t==='text'){ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.fillStyle=currentInk();ctx.font='700 32px system-ui,-apple-system,sans-serif';ctx.fillText(op.s,op.x,op.y);return}if(op.t==='arrow'){ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.strokeStyle=currentInk();ctx.fillStyle=currentInk();ctx.lineWidth=6;const [x1,y1,x2,y2]=op.a;const ang=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();const z=24;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-z*Math.cos(ang-Math.PI/6),y2-z*Math.sin(ang-Math.PI/6));ctx.lineTo(x2-z*Math.cos(ang+Math.PI/6),y2-z*Math.sin(ang+Math.PI/6));ctx.closePath();ctx.fill();return}if(!op.p||op.p.length<2)return;ctx.globalCompositeOperation=op.t==='eraser'?'destination-out':'source-over';ctx.globalAlpha=op.t==='highlight'?.22:1;ctx.strokeStyle=currentInk();ctx.lineWidth=op.t==='eraser'?48:(op.t==='highlight'?34:6);ctx.beginPath();ctx.moveTo(op.p[0],op.p[1]);for(let i=2;i<op.p.length;i+=2)ctx.lineTo(op.p[i],op.p[i+1]);ctx.stroke();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
function renderBoardCanvas(c,id,temp=null){if(!c)return;fitCanvas(c);const ctx=c.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);const sx=c.width/BW,sy=c.height/BH;ctx.setTransform(sx,0,0,sy,0,0);
  const imgs=resolveImageItems(id,temp?.t==='imageTransform'?temp:null);for(const item of imgs){const im=imageCache.get(item.blobId);if(im){ctx.drawImage(im,item.x,item.y,item.w,item.h)}else{ctx.save();ctx.globalAlpha=.06;ctx.fillStyle=currentInk();ctx.fillRect(item.x,item.y,item.w,item.h);ctx.globalAlpha=.2;ctx.strokeStyle=currentInk();ctx.lineWidth=2;ctx.strokeRect(item.x,item.y,item.w,item.h);ctx.globalAlpha=1;ctx.restore();ensureImage(item.blobId,item.inline)}}
  const layer=document.createElement('canvas');layer.width=c.width;layer.height=c.height;const lctx=layer.getContext('2d');lctx.setTransform(sx,0,0,sy,0,0);for(const op of bstate(id).ops){if(op.t==='image'||op.t==='imageDelete')continue;drawOp(lctx,op)}if(temp&&temp.t!=='imageTransform')drawOp(lctx,temp);ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(layer,0,0);
  const sel=boardRuntime.selected[id];if(sel&&c.hasAttribute('data-board-id')){const item=imgs.find(x=>x.itemId===sel);if(item){ctx.setTransform(sx,0,0,sy,0,0);ctx.save();ctx.strokeStyle=currentInk();ctx.lineWidth=3;ctx.setLineDash([10,8]);ctx.strokeRect(item.x,item.y,item.w,item.h);ctx.setLineDash([]);const hs=18;ctx.fillStyle=currentPaper();ctx.strokeStyle=currentInk();ctx.lineWidth=3;ctx.fillRect(item.x+item.w-hs/2,item.y+item.h-hs/2,hs,hs);ctx.strokeRect(item.x+item.w-hs/2,item.y+item.h-hs/2,hs,hs);ctx.restore()}}
}
function refreshAllThumbs(root=document){root.querySelectorAll('canvas[data-thumb]').forEach(c=>renderBoardCanvas(c,c.dataset.thumb))}
function refreshBoardViews(id){document.querySelectorAll(`canvas[data-thumb="${id}"],canvas[data-board-id="${id}"]`).forEach(c=>renderBoardCanvas(c,id));document.querySelectorAll(`[data-board-state="${id}"]`).forEach(n=>n.textContent=boardHas(id)?'guardado':'vacío');const modal=document.getElementById('sketchModal');if(modal.classList.contains('open')&&modal.dataset.id===id)renderBoardCanvas(document.getElementById('sketchCanvas'),id)}
function setBoardOpen(id,open=true){const c=document.querySelector(`canvas[data-board-id="${id}"]`);const section=c?.closest('.boardsection');if(!section)return;section.classList.toggle('open',open);const b=section.querySelector('[data-board-toggle]');if(b){b.setAttribute('aria-expanded',open?'true':'false');const lab=b.querySelector('[data-board-toggle-label]');if(lab)lab.textContent=open?'cerrar':'abrir'}if(open)requestAnimationFrame(()=>renderBoardCanvas(c,id))}
function addBoardOp(id,op){const b=bstate(id);b.ops.push(op);if(b.ops.length>350)b.ops.shift();b.redo=[];save();refreshBoardViews(id)}
function undoBoard(id){const b=bstate(id);if(!b.ops.length)return;b.redo.push(b.ops.pop());save();refreshBoardViews(id)}
function redoBoard(id){const b=bstate(id);if(!b.redo.length)return;b.ops.push(b.redo.pop());save();refreshBoardViews(id)}
function clearBoard(id){if(!bstate(id).ops.length)return;if(confirm('¿Limpiar este pizarrón?')){const blobs=imageBlobIds(id);bstate(id).ops=[];bstate(id).redo=[];boardRuntime.selected[id]=null;save();refreshBoardViews(id);blobs.forEach(imgDelete)}}
function pointFor(e,c){const r=c.getBoundingClientRect();return [Math.round((e.clientX-r.left)/r.width*BW),Math.round((e.clientY-r.top)/r.height*BH)]}
function initBoard(id){const c=document.querySelector(`canvas[data-board-id="${id}"]`);if(!c)return;let drawing=false,start=null,pts=[],transformMode=null,transformBase=null,tempImage=null;const section=c.closest('.boardsection'),wrap=c.closest('.boardwrap');
  const toggle=section.querySelector('[data-board-toggle]');if(toggle)toggle.onclick=()=>setBoardOpen(id,!section.classList.contains('open'));
  setBoardTool(id,boardRuntime.tool[id]||'pen');section.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setBoardTool(id,b.dataset.tool));section.querySelector('[data-board-action="undo"]').onclick=()=>{boardRuntime.selected[id]=null;undoBoard(id)};section.querySelector('[data-board-action="redo"]').onclick=()=>{boardRuntime.selected[id]=null;redoBoard(id)};section.querySelector('[data-board-action="clear"]').onclick=()=>clearBoard(id);section.querySelector('[data-board-action="delete"]').onclick=()=>deleteSelectedImage(id);const input=section.querySelector('[data-board-image-input]');section.querySelector('[data-board-action="image"]').onclick=()=>input.click();input.onchange=async()=>{const f=input.files?.[0];if(f)await addImageToBoard(id,f);input.value=''};section.querySelector('[data-board-action="paste"]').onclick=()=>pasteFromClipboard(id);
  wrap.addEventListener('dragover',e=>{if([...e.dataTransfer.types].includes('Files')){e.preventDefault();wrap.classList.add('dragover')}});wrap.addEventListener('dragleave',()=>wrap.classList.remove('dragover'));wrap.addEventListener('drop',async e=>{wrap.classList.remove('dragover');const f=[...e.dataTransfer.files].find(x=>x.type.startsWith('image/'));if(!f)return;e.preventDefault();await addImageToBoard(id,f,pointFor(e,c))});
  c.addEventListener('pointerdown',e=>{e.preventDefault();const tool=boardRuntime.tool[id]||'pen',p=pointFor(e,c);if(tool==='select'){const imgs=resolveImageItems(id);let hit=null;for(let i=imgs.length-1;i>=0;i--){const it=imgs[i];if(p[0]>=it.x&&p[0]<=it.x+it.w&&p[1]>=it.y&&p[1]<=it.y+it.h){hit=it;break}}if(!hit){boardRuntime.selected[id]=null;syncImageDeleteUI(id);refreshBoardViews(id);return}boardRuntime.selected[id]=hit.itemId;syncImageDeleteUI(id);const hs=30,nearResize=Math.abs(p[0]-(hit.x+hit.w))<hs&&Math.abs(p[1]-(hit.y+hit.h))<hs;transformMode=nearResize?'resize':'move';transformBase={...hit,px:p[0],py:p[1]};tempImage={...hit};drawing=true;c.classList.add('dragging');c.setPointerCapture?.(e.pointerId);refreshBoardViews(id);return}if(tool==='text'){const text=prompt('Texto corto para tu mapa:');if(text&&text.trim())addBoardOp(id,{t:'text',x:p[0],y:p[1],s:text.trim().slice(0,42)});return}drawing=true;start=p;pts=[p[0],p[1]];c.setPointerCapture?.(e.pointerId)});
  c.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const tool=boardRuntime.tool[id]||'pen',p=pointFor(e,c);if(tool==='select'&&transformBase){if(transformMode==='move'){tempImage.x=Math.max(0,Math.min(BW-tempImage.w,transformBase.x+(p[0]-transformBase.px)));tempImage.y=Math.max(0,Math.min(BH-tempImage.h,transformBase.y+(p[1]-transformBase.py)))}else{const ratio=transformBase.aspect||transformBase.w/transformBase.h;let nw=Math.max(70,p[0]-transformBase.x),nh=nw/ratio;if(transformBase.y+nh>BH){nh=BH-transformBase.y;nw=nh*ratio}if(transformBase.x+nw>BW){nw=BW-transformBase.x;nh=nw/ratio}tempImage.w=Math.round(nw);tempImage.h=Math.round(nh)}renderBoardCanvas(c,id,{t:'imageTransform',item:tempImage});return}if(tool==='arrow'){renderBoardCanvas(c,id,{t:'arrow',a:[start[0],start[1],p[0],p[1]]});return}const lx=pts[pts.length-2],ly=pts[pts.length-1];if((p[0]-lx)**2+(p[1]-ly)**2<18)return;pts.push(p[0],p[1]);renderBoardCanvas(c,id,{t:tool==='highlighter'?'highlight':tool,p:pts})});
  const end=e=>{if(!drawing)return;drawing=false;c.classList.remove('dragging');const tool=boardRuntime.tool[id]||'pen',p=pointFor(e,c);if(tool==='select'&&transformBase&&tempImage){const changed=['x','y','w','h'].some(k=>Math.round(tempImage[k])!==Math.round(transformBase[k]));if(changed)addBoardOp(id,{t:'image',itemId:tempImage.itemId,blobId:tempImage.blobId,x:Math.round(tempImage.x),y:Math.round(tempImage.y),w:Math.round(tempImage.w),h:Math.round(tempImage.h),aspect:tempImage.aspect,inline:tempImage.inline||null});else refreshBoardViews(id);transformBase=null;tempImage=null;return}if(tool==='arrow'){if(Math.hypot(p[0]-start[0],p[1]-start[1])>10)addBoardOp(id,{t:'arrow',a:[start[0],start[1],p[0],p[1]]});else renderBoardCanvas(c,id);return}if(pts.length<4)pts.push(p[0]+1,p[1]+1);addBoardOp(id,{t:tool==='highlighter'?'highlight':tool,p:pts})};c.addEventListener('pointerup',end);c.addEventListener('pointercancel',()=>{drawing=false;transformBase=null;tempImage=null;c.classList.remove('dragging');renderBoardCanvas(c,id)});requestAnimationFrame(()=>renderBoardCanvas(c,id))}
function boardBlock(t,firstPass=false){return `<section class="boardsection"><button class="boardbar" data-board-toggle aria-expanded="false"><span class="boardbar-title">Pizarrón</span><span class="boardbar-state" data-board-state="${t.id}">${boardHas(t.id)?'guardado':'vacío'}</span><span class="boardbar-spacer"></span><span class="boardbar-action" data-board-toggle-label>abrir</span></button><div class="boardpanel"><div class="boardtools" role="toolbar" aria-label="Herramientas del pizarrón"><button class="toolbtn active" data-tool="pen">Lápiz</button><button class="toolbtn" data-tool="highlighter">Marca</button><button class="toolbtn" data-tool="eraser">Goma</button><button class="toolbtn" data-tool="arrow">Flecha</button><button class="toolbtn" data-tool="text">Texto</button><span class="toolsep"></span><button class="toolbtn" data-tool="select">Seleccionar</button><button class="toolbtn" data-board-action="image">Imagen</button><button class="toolbtn" data-board-action="paste">Pegar</button><input class="boardimageinput" data-board-image-input type="file" accept="image/*"><button class="toolbtn warn" data-board-action="delete">Borrar imagen</button></div><div class="boardwrap"><canvas class="boardcanvas" tabindex="0" data-board-id="${t.id}" aria-label="Pizarrón de ${esc(t.title)}"></canvas><div class="dropnote">Soltá la imagen acá</div></div>${visualSearchHTML(t.id)}<div class="boardfoot"><div class="boardactions"><button class="toolbtn" data-board-action="undo">Deshacer</button><button class="toolbtn" data-board-action="redo">Rehacer</button><button class="toolbtn" data-board-action="clear">Limpiar</button></div></div></div></section>`}

function openSketch(id){const t=topicById(id);const m=document.getElementById('sketchModal');m.dataset.id=id;document.getElementById('sketchTitle').textContent=t.title;document.getElementById('sketchEyebrow').textContent=t.n;document.getElementById('sketchConcepts').innerHTML=t.concepts.slice(0,4).map(x=>`<span class="concept">${esc(x)}</span>`).join('');document.getElementById('sketchGo').onclick=()=>{closeSketch();openTopic(id)};m.classList.add('open');m.setAttribute('aria-hidden','false');requestAnimationFrame(()=>renderBoardCanvas(document.getElementById('sketchCanvas'),id))}
function closeSketch(){const m=document.getElementById('sketchModal');m.classList.remove('open');m.setAttribute('aria-hidden','true')}

function setView(v){if(['recall','cases','exam'].includes(v)&&!firstPassDone()){showToast(`${quickCoverage()}/7`);v='map'}if(v!==activeView)stopReading();activeView=v;document.getElementById('drawer').classList.remove('topicactive');document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));const target=document.getElementById('view-'+v);if(target)target.classList.add('active');closeDrawer();window.scrollTo({top:0,behavior:'instant'});if(v==='map')renderMap();if(v==='recall')renderRecall();if(v==='cases')renderCases();if(v==='exam')renderExam();if(v==='emergency'){state.finalVisited=true;save();renderEmergency()}const active=document.getElementById('view-'+v);if(active)preloadVisibleAudio(active,0);updateMetrics()}
function renderMap(){const el=document.getElementById('view-map');el.innerHTML=`<div class="map-wrap"><div class="chain">${DATA.topics.map(t=>`<div class="chainitem" role="button" tabindex="0" data-topic="${t.id}"><button class="mapthumbbtn ${boardHas(t.id)?'':'empty-sketch'}" data-sketch="${t.id}" aria-label="Ver dibujo de ${esc(t.title)}">${thumbHTML(t.id)}</button><div class="chainmain"><div class="chaintitle">${t.n} · ${t.title}</div><div class="chainone">${t.one}</div><span class="levelmarks" data-level-mark-id="${t.id}">${LEVEL_DEFS.map(([k])=>`<i class="${levelClass(levelState(t.id)[k])}"></i>`).join('')}</span></div></div>`).join('')}</div><div class="mapfoot"><button class="resetlink" id="resetBtn">Reiniciar</button></div></div>`;el.querySelectorAll('[data-topic]').forEach(n=>{n.onclick=()=>openTopic(n.dataset.topic);n.onkeydown=e=>{if(e.key==='Enter')openTopic(n.dataset.topic)}});el.querySelector('#resetBtn').onclick=()=>{if(confirm('¿Reiniciar progreso y pizarrones?')){stopReading();state=blankState();applyPalette('paper',false);save();clearAllImages();renderMap();showToast('Reiniciado')}};wireMemory(el);wireAudio(el);updateMetrics()}
function openTopic(id,requestedLevel=null){
  if(activeTopic!==id)stopReading();activeTopic=id;state.lastTopic=id;
  if(!state.topicLevel)state.topicLevel={};const level=requestedLevel||state.topicLevel[id]||'quick';state.topicLevel[id]=level;touchLevel(id,level);save();
  const t=topicById(id),idx=DATA.topics.findIndex(x=>x.id===id),prev=DATA.topics[idx-1],next=DATA.topics[idx+1],view=document.getElementById('view-topic');
  let content='',audioText='';
  if(level==='quick'){
    audioText=`${t.title}. ${QUICK[id]}. Conceptos: ${t.concepts.slice(0,3).join(', ')}.`;
    content=`<div class="quickcopy">${QUICK[id]}</div><div class="keyline">${t.concepts.slice(0,3).join(' · ')}</div>${boardBlock(t,true)}`;
  }else if(level==='deep'){
    audioText=`${t.title}. ${t.question}. ${t.sections.map(sec=>sec[0]+'. '+sec[1]).join(' ')} Respuesta de parcial. ${t.exam}`;
    content=`<div class="deep-question">${t.question}</div><div class="keyline">${t.concepts.slice(0,5).join(' · ')}</div>${t.sections.map((sec,i)=>`<section class="section" id="sec-${i}"><h2>${sec[0]}</h2><p>${sec[1]}</p></section>`).join('')}<section class="section"><h2>Respuesta de parcial</h2><div class="examanswer">${t.exam}</div></section>${boardBlock(t,false)}`;
  }else if(level==='recall'){
    audioText=`${t.title}. ${t.recall.map(r=>r[0]).join(' ')}`;
    content=`${t.recall.map((r,i)=>`<div class="practicecard"><h3>${r[0]}</h3><textarea class="answerbox" placeholder="Tu respuesta…"></textarea><div class="actions"><button class="btn small" data-topic-reveal="${i}">Mostrar núcleo</button></div><div class="reveal" id="topic-reveal-${i}">${r[1]}</div></div>`).join('')}${boardBlock(t,false)}`;
  }else{
    const a=APPLY_DATA[id];audioText=`${t.title}. ${a.text}. ${a.prompt}`;
    content=`<div class="applybox"><div class="casequote">${a.text}</div><div class="applyprompt">${a.prompt}</div><textarea class="answerbox" placeholder="Pensalo o escribí una respuesta…"></textarea><div class="actions"><button class="btn small" data-apply-reveal="apply-${id}">Ver conceptos</button></div><div class="applyreveal" id="apply-${id}"><div class="applykeys">${a.keys.map(k=>`<span>${k}</span>`).join('')}</div></div></div>${boardBlock(t,false)}`;
  }
  view.innerHTML=`${memoryStrip(id)}<div class="study-grid"><div>${memoryRail(id)}</div><div class="topic-main"><div class="topichead"><div class="topicnum">${t.n}</div><h1>${t.title}</h1>${topicReadingButton(id,level)}</div>${levelNav(id,level)}${content}${levelAssessment(id,level)}<div class="footerNav"><button class="btn ghost" id="prevTopic">← Anterior</button><button class="btn primary" id="nextTopic">${next?'Siguiente →':'Mapa'}</button></div></div></div>`;
  setViewRaw('topic');document.getElementById('prevTopic').disabled=!prev;document.getElementById('prevTopic').onclick=()=>prev&&openTopic(prev.id,level);document.getElementById('nextTopic').onclick=()=>next?openTopic(next.id,level):setView('map');
  view.querySelectorAll('[data-topic-reveal]').forEach(b=>b.onclick=()=>{document.getElementById('topic-reveal-'+b.dataset.topicReveal)?.classList.add('show');if(levelState(id).recall==='visited')setLevelStatus(id,'recall','review')});
  wireMemory(view);wireLevelControls(view,id,level);wireAudio(view);preloadVisibleAudio(view,0);initBoard(id);if(level==='recall')renderDrawer(t)
}
function setViewRaw(v){activeView=v;document.getElementById('drawer').classList.toggle('topicactive',v==='topic');document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById('view-'+v).classList.add('active');updateMetrics();closeDrawer();window.scrollTo({top:0,behavior:'instant'})}
function mark(id,key,val=true){const s=tstate(id);s[key]=val;if(key==='understood'&&val)s.seen=true;if(key==='recoverable'&&val){s.seen=true;s.understood=true}save()}
function renderDrawer(t){const body=document.getElementById('drawerBody');body.innerHTML=`<div class="eyebrow">${t.title} · recuperación</div>${t.recall.map((r,i)=>`<div class="practicecard"><h3>${r[0]}</h3><textarea class="answerbox" placeholder="Escribí o explicalo en voz alta…" data-answer="${i}"></textarea><div class="actions"><button class="btn small ghost" data-hint="${i}">Pista</button><button class="btn small" data-reveal="${i}">Mostrar núcleo</button></div><div class="hint hidden" id="hint-${i}">${hintFor(r[1])}</div><div class="reveal" id="reveal-${i}">${r[1]}<div class="self"><button class="btn small ghost" data-score="0" data-i="${i}">No salió</button><button class="btn small ghost" data-score="1" data-i="${i}">Más o menos</button><button class="btn small primary" data-score="2" data-i="${i}">Salió</button></div></div></div>`).join('')}`;body.querySelectorAll('[data-hint]').forEach(b=>b.onclick=()=>document.getElementById('hint-'+b.dataset.hint).classList.toggle('hidden'));body.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>document.getElementById('reveal-'+b.dataset.reveal).classList.add('show'));body.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>scoreTopic(t.id,+b.dataset.score))}
function hintFor(core){return 'Buscá nombrar primero la oposición central: '+core.split(';')[0]+'.'}
function scoreTopic(id,score){if(score===0){state.weak[id]=(state.weak[id]||0)+2;setLevelStatus(id,'recall','review')}else if(score===1){state.weak[id]=(state.weak[id]||0)+1;setLevelStatus(id,'recall','review')}else{state.weak[id]=Math.max(0,(state.weak[id]||0)-2);setLevelStatus(id,'recall','good')}save();showToast(score===2?'Entendido':'Queda para revisar')}
function openDrawerFor(t){renderDrawer(t);document.getElementById('drawer').classList.add('open');document.getElementById('drawerToggle').textContent='Práctica ↓'}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('drawerToggle').textContent='Práctica ↑'}
function weakOrder(){return [...DATA.topics].sort((a,b)=>(state.weak[b.id]||0)-(state.weak[a.id]||0) || Number(tstate(a.id).recoverable)-Number(tstate(b.id).recoverable))}
function renderRecall(){const list=weakOrder();const el=document.getElementById('view-recall');el.innerHTML=`<div class="modehead"><h1>Recordar</h1></div>${list.map((t,ti)=>`<div class="recallcard"><div class="eyebrow">${t.n} · ${t.title}</div><button class="recallsketch ${boardHas(t.id)?'':'empty-sketch'}" data-sketch="${t.id}">${thumbHTML(t.id)}</button><div class="readrow"><h2>${t.recall[0][0]}</h2>${readingButton(t.recall[0][0])}</div><textarea class="answerbox" placeholder="Tu respuesta…"></textarea><div class="actions"><button class="btn small" data-rr="${ti}" data-rid="${t.id}">Mostrar núcleo</button></div><div class="reveal" id="rr-${ti}">${t.recall[0][1]}<div class="self"><button class="btn small ghost" data-rscore="0" data-rid="${t.id}">No salió</button><button class="btn small ghost" data-rscore="1" data-rid="${t.id}">Más o menos</button><button class="btn small primary" data-rscore="2" data-rid="${t.id}">Salió</button></div></div></div>`).join('')}`;el.querySelectorAll('[data-rr]').forEach(b=>b.onclick=()=>{document.getElementById('rr-'+b.dataset.rr).classList.add('show');if(levelState(b.dataset.rid).recall==='new'||levelState(b.dataset.rid).recall==='visited')setLevelStatus(b.dataset.rid,'recall','review')});el.querySelectorAll('[data-rscore]').forEach(b=>b.onclick=()=>scoreTopic(b.dataset.rid,+b.dataset.rscore));wireMemory(el);wireAudio(el);updateMetrics()}
function renderCases(){const el=document.getElementById('view-cases');el.innerHTML=`<div class="modehead"><h1>Casos</h1></div>${DATA.cases.map((c,i)=>`<div class="casecard"><div class="eyebrow">Caso ${String(i+1).padStart(2,'0')}</div><div class="readrow"><h2>${c.title}</h2>${readingButton(`${c.title}. ${c.text}`)}</div><p>${c.text}</p><div class="actions"><button class="btn small" data-case="${i}">Ver conceptos</button></div><div class="reveal" id="case-${i}">${c.keys.map(x=>`<span class="concept">${x}</span>`).join(' ')}</div><div class="case-assess"><button class="${caseState(i)==='good'?'active':''}" data-case-status="good" data-case-i="${i}">✓ Entendí bien</button><button class="${caseState(i)==='review'?'active':''}" data-case-status="review" data-case-i="${i}">○ Falta revisar</button></div></div>`).join('')}`;el.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{document.getElementById('case-'+b.dataset.case).classList.add('show');if(caseState(b.dataset.case)==='new')state.caseStatus[b.dataset.case]='visited';state.caseSeen[b.dataset.case]=true;save();updateMetrics()});el.querySelectorAll('[data-case-status]').forEach(b=>b.onclick=()=>setCaseStatus(b.dataset.caseI,b.dataset.caseStatus));wireAudio(el);updateMetrics()}
function renderExam(){const el=document.getElementById('view-exam');el.innerHTML=`<div class="modehead"><h1>Parcial</h1></div>${DATA.exam.map((q,i)=>`<div class="examcard"><div class="eyebrow">Pregunta ${String(i+1).padStart(2,'0')}</div><div class="readrow"><h2>${q[0]}</h2>${readingButton(q[0])}</div><textarea class="answerbox" style="min-height:130px" placeholder="Desarrollá tu respuesta…"></textarea><div class="actions"><button class="btn small" data-exam="${i}">Mostrar esqueleto</button></div><div class="skelet" id="exam-${i}"><strong>Debería aparecer:</strong><ul>${q[1].map(k=>`<li>${k}</li>`).join('')}</ul></div><div class="exam-assess"><button class="${examState(i)==='good'?'active':''}" data-exam-status="good" data-exam-i="${i}">✓ Entendí bien</button><button class="${examState(i)==='review'?'active':''}" data-exam-status="review" data-exam-i="${i}">○ Falta revisar</button></div></div>`).join('')}`;el.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>{document.getElementById('exam-'+b.dataset.exam).classList.add('show');if(examState(b.dataset.exam)==='new')state.examStatus[b.dataset.exam]='visited';state.examSeen[b.dataset.exam]=true;save();updateMetrics()});el.querySelectorAll('[data-exam-status]').forEach(b=>b.onclick=()=>setExamStatus(b.dataset.examI,b.dataset.examStatus));wireAudio(el);updateMetrics()}
function renderEmergency(){
  const el=document.getElementById('view-emergency'),ax=topicById('comunicacion').sections.filter(x=>/^\d/.test(x[0])),bc=topicById('bateson').sections.filter(x=>/^\d/.test(x[0]));
  const summaries={sujeto:[DATA.emergency.chain[0]],tgs:[DATA.emergency.chain[1]],cibernetica:[DATA.emergency.chain[2]],informacion:[DATA.emergency.chain[3]],comunicacion:[DATA.emergency.chain[4]],construccion:[DATA.emergency.chain[5],DATA.emergency.chain[6]],bateson:[DATA.emergency.chain[7]]};
  const refs=[['sujeto'],['tgs'],['cibernetica'],['cibernetica'],['informacion','bateson'],['comunicacion'],['construccion'],['construccion'],['bateson'],['tgs','cibernetica','informacion','comunicacion']];
  el.innerHTML=`<div class="modehead"><h1>Última vuelta</h1></div><div class="emergency"><div class="recap-list">${DATA.topics.map(t=>{const speech=`${t.title}. ${summaries[t.id].join(' ')}`;return `<section class="recap-topic" id="recap-${t.id}"><div class="readrow"><h2><span>${t.n}</span>${esc(t.title)}</h2>${readingButton(speech)}</div><div class="recap-body ${boardHas(t.id)?'has-image':''}">${boardHas(t.id)?`<button class="recap-sketch" data-sketch="${t.id}" aria-label="Ampliar dibujo de ${esc(t.title)}">${thumbHTML(t.id)}</button>`:''}<div class="recap-copy">${summaries[t.id].map(x=>`<p>${x}</p>`).join('')}</div></div></section>`}).join('')}</div><h2>5 axiomas</h2><ol class="axioms">${ax.map(x=>`<li><strong>${x[0].replace(/^\d · /,'')}</strong> — ${x[1]}</li>`).join('')}</ol><h2>6 criterios de Bateson</h2><ol class="criteria">${bc.map(x=>`<li><strong>${x[0].replace(/^\d · /,'')}</strong> — ${x[1]}</li>`).join('')}</ol><h2>Trampas</h2><ul class="trap-list">${DATA.emergency.traps.map(x=>`<li>${x}</li>`).join('')}</ul><h2>10 preguntas probables</h2><ol class="probable">${DATA.exam.map((x,i)=>`<li><div>${x[0]}</div><div class="qrefs">${refs[i].map(id=>{const t=topicById(id);return `<button data-recap-jump="${id}">${t.n}</button>`}).join('')}</div></li>`).join('')}</ol></div>`;
  wireMemory(el);wireAudio(el);el.querySelectorAll('[data-recap-jump]').forEach(b=>b.onclick=()=>document.getElementById('recap-'+b.dataset.recapJump)?.scrollIntoView({behavior:'smooth',block:'center'}));updateMetrics()
}

document.querySelectorAll('.stage').forEach(b=>b.onclick=()=>setView(b.dataset.view));
const audioEgg=document.getElementById('audioEgg'),audioPanel=document.getElementById('audioPanel');
function toggleAudioPanel(){const open=audioPanel.classList.toggle('open');audioPanel.setAttribute('aria-hidden',open?'false':'true');audioEgg.setAttribute('aria-expanded',open?'true':'false');if(open){updateAudioMonitor();try{navigator.storage?.persist?.()}catch(e){}}}
audioEgg.onclick=e=>{e.stopPropagation();toggleAudioPanel()};audioEgg.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleAudioPanel()}};
window.addEventListener('online',()=>{retryAllAudio()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)runAudioQueue()});
const paletteToggle=document.getElementById('paletteToggle'),paletteMenu=document.getElementById('paletteMenu');
paletteToggle.onclick=e=>{e.stopPropagation();const open=paletteMenu.classList.toggle('open');paletteToggle.setAttribute('aria-expanded',open?'true':'false');paletteMenu.setAttribute('aria-hidden',open?'false':'true')};
paletteMenu.querySelectorAll('[data-palette]').forEach(b=>b.onclick=e=>{e.stopPropagation();applyPalette(b.dataset.palette,true)});
document.addEventListener('click',e=>{if(!e.target.closest('.palettewrap')){paletteMenu.classList.remove('open');paletteToggle.setAttribute('aria-expanded','false');paletteMenu.setAttribute('aria-hidden','true')}});
document.getElementById('drawerToggle').onclick=()=>{const d=document.getElementById('drawer');if(d.classList.contains('open'))closeDrawer();else if(activeView==='topic')openDrawerFor(topicById(activeTopic))};
document.getElementById('sketchClose').onclick=closeSketch;document.getElementById('sketchStay').onclick=closeSketch;document.getElementById('sketchModal').onclick=e=>{if(e.target.id==='sketchModal')closeSketch()};
document.addEventListener('paste',async e=>{if(activeView!=='topic'||['TEXTAREA','INPUT'].includes(document.activeElement?.tagName))return;const item=[...e.clipboardData?.items||[]].find(x=>x.type?.startsWith('image/'));if(!item)return;const f=item.getAsFile();if(!f)return;e.preventDefault();await addImageToBoard(activeTopic,f)});

document.addEventListener('keydown',e=>{if((e.key==='Delete'||e.key==='Backspace')&&activeView==='topic'&&boardRuntime.selected[activeTopic]&&!['TEXTAREA','INPUT'].includes(document.activeElement.tagName)){e.preventDefault();deleteSelectedImage(activeTopic);return}if(e.key==='Escape'){if(document.getElementById('sketchModal').classList.contains('open')){closeSketch();return}boardRuntime.selected[activeTopic]=null;refreshBoardViews(activeTopic);closeDrawer()}if(activeView==='topic'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')&&!['TEXTAREA','INPUT'].includes(document.activeElement.tagName)){const idx=DATA.topics.findIndex(t=>t.id===activeTopic);const target=e.key==='ArrowLeft'?DATA.topics[idx-1]:DATA.topics[idx+1];if(target)openTopic(target.id,state.topicLevel?.[activeTopic]||'quick')}});
window.addEventListener('resize',()=>{if(activeView==='topic')refreshBoardViews(activeTopic);refreshAllThumbs(document)});
prepareAudio();applyPalette(state.palette||'paper',false);renderMap();renderRecall();renderCases();renderExam();renderEmergency();updateMetrics();

</script>
</body></html>
