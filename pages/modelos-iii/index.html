<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2efe7"><title>Modelos III · Sistémica</title><style>html,body{margin:0;background:#f2efe7;color:#18201d;font-family:system-ui,sans-serif}#boot{min-height:100vh;display:grid;place-items:center;font-size:12px;font-weight:700;opacity:.58}</style></head><body><div id="boot">cargando…</div><script>(async()=>{try{const files=['bundle-v13-1.txt','bundle-v13-2.txt','bundle-v13-3a1.txt','bundle-v13-3a2.txt','bundle-v13-3b1.txt','bundle-v13-3b2.txt','bundle-v13-4.txt','bundle-v13-5.txt','bundle-v13-6.txt'];const parts=await Promise.all(files.map(f=>fetch(`${f}?v=13b`).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));const b64=parts.join('').trim(),bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('Este navegador necesita una versión más reciente');const ds=new DecompressionStream('gzip'),html=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').textContent='No pude abrir la página · '+(e?.message||e)}})();</script></body></html>
