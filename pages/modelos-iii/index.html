<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2efe7"><title>Modelos III · Sistémica</title><style>html,body{margin:0;background:#f2efe7;color:#18201d;font-family:system-ui,sans-serif}#boot{min-height:100vh;display:grid;place-items:center;font-size:12px;font-weight:700;opacity:.58}</style></head><body><div id="boot">cargando…</div><script>(async()=>{try{const parts=await Promise.all([1,2,3,4,5].map(i=>fetch(`payload-${i}.txt?v=12`).then(r=>{if(!r.ok)throw new Error('payload '+i);return r.text()})));const b64=parts.join('').trim(),bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('Este navegador necesita una versión más reciente');const ds=new DecompressionStream('gzip'),htmlRaw=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();let html=htmlRaw.replace(/prepareAudio\(\);(?=applyPalette\()/,'');const patch='<script src="./audio-walkie-v1.js?v=1"><\/script>';html=/<\/body>/i.test(html)?html.replace(/<\/body>/i,patch+'</body>'):html+patch;document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').textContent='No pude abrir la página · '+(e?.message||e)}})();</script></body></html>
