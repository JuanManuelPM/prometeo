<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F5DABF"><title>Modelos y Teorías II</title><style>html,body{margin:0;min-height:100%;background:#F5DABF;color:#6C151E;font-family:Inter,system-ui,sans-serif}#s{padding:24px;font-weight:900}</style></head><body><div id="s">Cargando…</div><script>(async()=>{try{const base='https://raw.githubusercontent.com/JuanManuelPM/prometeo/main/pages/';const u=[1,2,3,4].map(n=>base+'modelos-teorias-ii-v10-c'+n+'.txt?v=20260909v10');const z=(await Promise.all(u.map(x=>fetch(x,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()})))).join('');const b=Uint8Array.from(atob(z),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const t=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close()}catch(e){document.getElementById('s').textContent='No cargó. Recargá la página.';console.error(e)}})();</script></body></html>
