<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<meta name="theme-color" content="#f4f1ea"/>
<title>Modelos III · Sistémica</title>
<link rel="stylesheet" href="./app.css?v=7"/>
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top">
    <button class="brand" id="homeBtn">Modelos III</button>
    <div class="topRight">
      <span class="sourceState" id="sourceState">contenido completo</span>
      <button class="theme" id="themeBtn" aria-label="Cambiar tema"></button>
    </div>
  </header>

  <main class="main">
    <section id="home" class="home"></section>
    <section id="topic" class="topicView" aria-hidden="true">
      <div class="unitNavRow">
        <button id="backHome" class="back" aria-label="Volver">‹</button>
        <nav id="unitNav" class="unitNav" aria-label="Unidades"></nav>
      </div>
      <div class="topicHeading">
        <div id="topicKicker" class="topicKicker"></div>
        <h1 id="topicTitle"></h1>
        <nav id="nbNav" class="nbNav" aria-label="Niveles"></nav>
      </div>
      <div class="sourceWrap" id="sourceWrap">
        <div id="sourceLoading" class="sourceLoading">cargando contenido completo…</div>
        <iframe id="sourceFrame" class="sourceFrame" title="Contenido de estudio"></iframe>
      </div>
    </section>
  </main>

  <nav id="bottom" class="bottom" aria-label="Acciones del tema">
    <button id="reviewBtn" class="stateBtn reviewBtn" aria-pressed="false"><span class="stateIcon">!</span><span>Revisar</span></button>
    <button id="boardBtn" class="boardBtn" aria-label="Abrir pizarrón" title="Pizarrón">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="12" rx="1.8"/><path d="M7 12l2.8-2.8 2.2 1.9 4-4.1M8.5 16l-2 4M15.5 16l2 4M7 20h10"/><path d="M18.2 4.3l1.5 1.5"/></svg>
    </button>
    <button id="goodBtn" class="stateBtn goodBtn" aria-pressed="false"><span class="stateIcon">✓</span><span>Entendí</span></button>
    <button id="nextBtn" class="nextBtn" aria-label="Siguiente unidad">→</button>
  </nav>
</div>
<div id="roundToast" class="roundToast" role="status" aria-live="polite"></div>

<section id="board" class="board" aria-hidden="true">
  <div class="boardTop">
    <button id="closeBoard" class="iconBtn" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button id="theoryBtn" class="iconBtn" aria-label="Mostrar u ocultar teoría"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 8h6M9 12h6M9 16h4"/></svg></button>
    <span class="boardDivider"></span>
    <button class="iconBtn tool active" data-tool="select" aria-label="Seleccionar"><svg viewBox="0 0 24 24"><path d="M5 3l10 9-5 1 3 6-2.5 1-3-6-3.5 3z"/></svg></button>
    <button class="iconBtn tool" data-tool="pen" aria-label="Lápiz"><svg viewBox="0 0 24 24"><path d="M4 20l4.2-1 10-10-3.2-3.2-10 10L4 20zM13.8 7l3.2 3.2"/></svg></button>
    <button class="iconBtn tool" data-tool="high" aria-label="Resaltador"><svg viewBox="0 0 24 24"><path d="M5 16l7-10 6 4-7 10H5zM4 21h16"/></svg></button>
    <button id="lineBtn" class="iconBtn toolMenu" aria-label="Línea o flecha"><svg viewBox="0 0 24 24"><path d="M4 19L19 4M12 4h7v7"/></svg></button>
    <button class="iconBtn tool" data-tool="eraser" aria-label="Goma"><svg viewBox="0 0 24 24"><path d="M5 15l7-8 7 6-6 7H8l-3-3zM12 20h7"/></svg></button>
    <button id="emojiBtn" class="iconBtn" aria-label="Emoji"><span class="emojiGlyph">☺</span></button>
    <button id="imageBtn" class="iconBtn" aria-label="Agregar imagen"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M5 17l4.5-4 3 2.5 2.5-2 4 3.5"/></svg></button>
    <button id="pinBtn" class="iconBtn pinBtn" aria-label="Pinterest" title="Pinterest">P</button>
    <span class="boardDivider"></span>
    <button id="colorBtn" class="colorBtn" aria-label="Color"><span id="colorWell"></span></button>
    <button id="widthBtn" class="iconBtn widthBtn" aria-label="Grosor"><span class="widthSample"></span></button>
    <button id="undoBtn" class="iconBtn" aria-label="Deshacer"><svg viewBox="0 0 24 24"><path d="M9 8H4V3M4 8c3-4 9-5 13-1 4 4 3 10-1 13"/></svg></button>
    <button id="redoBtn" class="iconBtn" aria-label="Rehacer"><svg viewBox="0 0 24 24"><path d="M15 8h5V3M20 8c-3-4-9-5-13-1-4 4-3 10 1 13"/></svg></button>
  </div>
  <div class="boardWork">
    <aside id="boardTheory" class="boardTheory"></aside>
    <div id="canvasWrap" class="canvasWrap">
      <canvas id="boardCanvas" class="boardCanvas"></canvas>
      <div id="selectionBar" class="selectionBar">
        <button id="smallerSel" aria-label="Achicar">−</button>
        <button id="biggerSel" aria-label="Agrandar">＋</button>
        <button id="duplicateSel" aria-label="Duplicar"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 16H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
        <button id="deleteSel" aria-label="Eliminar"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/></svg></button>
      </div>
      <div id="colorPopover" class="popover colorPopover"></div>
      <div id="widthPopover" class="popover widthPopover"></div>
      <div id="linePopover" class="popover linePopover"></div>
      <div id="emojiPopover" class="popover emojiPopover"></div>
      <div id="pinPopover" class="popover pinPopover"></div>
      <input id="imageInput" type="file" accept="image/*" hidden/>
    </div>
  </div>
</section>
<script src="./app.js?v=7"></script>
</body>
</html>
