<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eee5d2">
<title>Agustín Pardo — Clases de bajo online</title>
<meta name="description" content="Clases particulares de bajo online con Agustín Pardo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Teko:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d0d0b;
  --bone:#eee5d2;
  --sand:#b9aa8d;
  --pad:clamp(16px,4.6vw,34px);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  max-width:100vw;
  overflow-x:clip;
  background:var(--bone);
  color:var(--ink);
}
html{overscroll-behavior-x:none}
body{
  min-height:100%;
  font-family:"Bebas Neue","Arial Narrow",sans-serif;
  touch-action:manipulation;
}
a{color:inherit}
main,.poster{
  width:100%;
  max-width:100%;
  overflow:hidden;
}
.poster{
  position:relative;
  height:220svh;
  background:var(--bone);
  isolation:isolate;
}
.field-sand,
.field-black{
  position:absolute;
  left:0;
  right:0;
  z-index:0;
}
.field-sand{
  top:88svh;
  height:62svh;
  background:var(--sand);
}
.field-black{
  top:150svh;
  height:70svh;
  background:var(--ink);
}
.bass{
  position:absolute;
  z-index:2;
  top:0;
  left:-42vw;
  height:150svh;
  width:auto;
  max-width:none;
  object-fit:contain;
  object-position:left top;
  filter:grayscale(1) contrast(1.12);
  mix-blend-mode:multiply;
  pointer-events:none;
  user-select:none;
}
.top-copy{
  position:absolute;
  z-index:3;
  top:7svh;
  right:var(--pad);
  width:60vw;
  max-width:520px;
  text-transform:uppercase;
}
.strap{
  margin:0 0 2.2svh;
  font-size:clamp(14px,4vw,22px);
  line-height:.9;
  letter-spacing:.11em;
  max-width:15ch;
}
.name{
  margin:0;
  max-width:100%;
  font-family:"Teko","Arial Narrow",sans-serif;
  font-weight:700;
  font-size:clamp(62px,17vw,146px);
  line-height:.72;
  letter-spacing:-.045em;
}
.name span{display:block}
.mid-copy{
  position:absolute;
  z-index:3;
  top:103svh;
  right:var(--pad);
  width:47vw;
  max-width:470px;
  text-transform:uppercase;
}
.mid-copy small{
  display:block;
  margin:0 0 1.3svh;
  font-size:clamp(13px,3.5vw,19px);
  letter-spacing:.12em;
}
.bajo{
  margin:0;
  max-width:100%;
  font-family:"Teko","Arial Narrow",sans-serif;
  font-weight:700;
  font-size:clamp(88px,24vw,198px);
  line-height:.65;
  letter-spacing:-.055em;
}
.mid-copy p:last-child{
  margin:2.4svh 0 0;
  font-size:clamp(22px,6vw,38px);
  line-height:.88;
  max-width:10ch;
}

.level-strip{
  position:absolute;
  z-index:4;
  top:140svh;
  left:0;
  width:100%;
  max-width:100%;
  height:10svh;
  min-height:78px;
  overflow:hidden;
  background:var(--bone);
  color:var(--ink);
  border-top:1px solid rgba(13,13,11,.22);
  border-bottom:1px solid rgba(13,13,11,.22);
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.level-head{
  padding:0 var(--pad);
  margin:0 0 1.15svh;
  font-size:clamp(12px,3.1vw,17px);
  line-height:1;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.level-marquee{
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  overscroll-behavior-x:contain;
  scroll-snap-type:x mandatory;
  scroll-padding-left:var(--pad);
  scrollbar-width:none;
  -ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-x;
}
.level-marquee::-webkit-scrollbar{display:none}
.level-track{
  display:flex;
  width:max-content;
  gap:clamp(14px,3.8vw,24px);
  padding:0 var(--pad);
}
.level-set{
  display:flex;
  gap:clamp(14px,3.8vw,24px);
  align-items:flex-start;
}
.level-item{
  flex:0 0 min(62vw,320px);
  scroll-snap-align:start;
  white-space:nowrap;
  font-family:"Teko","Arial Narrow",sans-serif;
  font-weight:700;
  font-size:clamp(31px,7.8vw,50px);
  line-height:.82;
  letter-spacing:-.02em;
  text-transform:uppercase;
  padding-right:clamp(12px,3vw,20px);
  position:relative;
  min-height:1em;
  display:flex;
  align-items:center;
}
.level-item::after{
  content:"";
  position:absolute;
  top:50%;
  right:0;
  width:2px;
  height:.72em;
  transform:translateY(-50%);
  background:var(--sand);
}
.level-item:last-child{
  flex-basis:auto;
}
.level-item:last-child::after{display:none}
.level-item--bass{
  flex:0 0 auto;
  width:max-content;
  gap:.34em;
  font-size:clamp(31px,7.8vw,50px);
  line-height:.82;
  letter-spacing:-.02em;
  align-items:center;
  padding-right:clamp(12px,3vw,20px);
}
.level-item--bass > span:last-child{
  display:block;
  white-space:nowrap;
}
.cart-mark{
  flex:none;
  width:1.05em;
  height:1.05em;
  margin:0;
  display:flex;
  align-items:center;
  justify-content:center;
}
.cart-mark svg{
  display:block;
  width:100%;
  height:100%;
  fill:none;
  stroke:currentColor;
  stroke-width:3.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.level-dots{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:.9svh;
  padding:0 var(--pad);
}
.level-dot-btn{
  appearance:none;
  width:7px;
  height:7px;
  padding:0;
  border:0;
  border-radius:50%;
  background:rgba(13,13,11,.22);
  cursor:pointer;
  transition:transform 160ms ease, background 160ms ease;
}
.level-dot-btn[aria-current="true"]{
  background:var(--ink);
  transform:scale(1.22);
}

.contact{
  position:absolute;
  z-index:3;
  top:150svh;
  left:0;
  width:100%;
  max-width:100%;
  height:70svh;
  overflow:hidden;
  color:var(--bone);
  padding:7svh var(--pad) var(--pad);
  display:flex;
  flex-direction:column;
}
.contact-kicker{
  margin:0 0 3svh;
  max-width:25ch;
  font-size:clamp(13px,3.5vw,19px);
  line-height:.95;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.wa{
  display:block;
  width:100%;
  max-width:680px;
  overflow:visible;
  text-decoration:none;
  font-family:"Teko","Arial Narrow",sans-serif;
  font-weight:700;
  font-size:clamp(54px,15vw,126px);
  line-height:.84;
  letter-spacing:-.035em;
  text-transform:uppercase;
  padding-top:.10em;
}
.wa span{
  display:block;
  width:100%;
  max-width:100%;
}
.wa .last{
  font-size:.79em;
  letter-spacing:-.018em;
}

.band-marquee{
  width:calc(100% + (var(--pad) * 2));
  margin-left:calc(var(--pad) * -1);
  margin-top:auto;
  overflow:hidden;
  border-top:1px solid rgba(238,229,210,.45);
  border-bottom:1px solid rgba(238,229,210,.45);
  padding:1.7svh 0;
}
.band-track{
  display:flex;
  width:max-content;
  will-change:transform;
  animation:bandLoop 28s linear infinite;
}
.band-set{
  display:flex;
  align-items:center;
  gap:clamp(34px,7vw,88px);
  padding-right:clamp(34px,7vw,88px);
  flex:none;
}
.band-logo{
  height:clamp(32px,5.5vw,54px);
  min-width:clamp(88px,16vw,180px);
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
}
.band-logo img{
  display:block;
  height:100%;
  width:auto;
  max-width:clamp(110px,19vw,220px);
  object-fit:contain;
  filter:grayscale(1) brightness(0) invert(94%) sepia(9%) saturate(520%) hue-rotate(342deg) brightness(103%) contrast(92%);
  opacity:.92;
}
.band-logo[data-name="RHCP"] img{max-width:clamp(46px,7vw,66px)}
.band-logo[data-name="The Who"] img{max-width:clamp(52px,8vw,78px)}
.band-logo.failed img{display:none}
.band-logo.failed::after{
  content:attr(data-name);
  font-size:clamp(22px,4vw,36px);
  letter-spacing:.08em;
  color:var(--bone);
  white-space:nowrap;
}
@keyframes bandLoop{
  to{transform:translate3d(-50%,0,0)}
}

.contact-foot{
  margin:2.2svh 0 0;
  width:100%;
  display:flex;
  justify-content:space-between;
  gap:18px;
  font-size:clamp(12px,3.2vw,17px);
  line-height:1;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.contact-foot span:last-child{text-align:right}

@media (max-width:360px){
  .top-copy{width:61vw}
  .name{font-size:16.2vw}
  .mid-copy{width:46vw}
  .bajo{font-size:22.5vw}
  .wa{font-size:14.2vw}
}

@media (min-width:761px){
  .poster{height:205svh}
  .field-sand{top:82svh;height:58svh}
  .field-black{top:140svh;height:65svh}
  .bass{
    left:-10vw;
    height:140svh;
  }
  .top-copy{
    top:8svh;
    right:6vw;
    width:47vw;
  }
  .strap{font-size:clamp(18px,1.8vw,28px)}
  .name{font-size:clamp(88px,11.6vw,176px)}
  .online{font-size:clamp(44px,4.8vw,76px)}
  .mid-copy{
    top:96svh;
    right:6vw;
    width:46vw;
  }
  .mid-copy small{font-size:clamp(16px,1.55vw,24px)}
  .bajo{font-size:clamp(118px,16vw,248px)}
  .mid-copy p:last-child{font-size:clamp(27px,3.4vw,50px)}
  .level-strip{top:130svh}
  .contact{
    top:140svh;
    height:65svh;
    padding:8svh 6vw 4vw;
  }
  .contact-kicker{font-size:clamp(16px,1.55vw,24px)}
  .wa{font-size:clamp(76px,9.4vw,145px)}
  .contact-foot{font-size:clamp(14px,1.25vw,20px)}
}
</style>
</head>
<body>
<!--
  Bass image: "Tune fretless Bass.png" by 海獺, Wikimedia Commons.
  Source: https://commons.wikimedia.org/wiki/File:Tune_fretless_Bass.png
  License: CC BY-SA 4.0.
  The image is displayed vertically and converted to monochrome via CSS.
-->
<main>
<section class="poster" aria-label="Agustín Pardo · clases particulares de bajo online">
  <div class="field-sand" aria-hidden="true"></div>
  <div class="field-black" aria-hidden="true"></div>

  <img
    class="bass"
    src="https://upload.wikimedia.org/wikipedia/commons/6/6c/Tune_fretless_Bass.png"
    alt=""
    width="739"
    height="2048"
    decoding="async"
    fetchpriority="high">

  <div class="top-copy">
    <p class="strap">Clases particulares de bajo</p>
    <h1 class="name"><span>Agustín</span><span>Pardo</span></h1>
</div>

  <div class="mid-copy">
    <small>Bajo eléctrico</small>
    <p class="bajo">BAJO</p>
    <p>Clases online, uno a uno</p>
  </div>

  
  <div class="level-strip" aria-label="Cosas que podés aprender">
    <p class="level-head">Entrás donde estés.</p>
    <div class="level-marquee" id="levelRail" aria-label="Deslizá para ver más">
      <div class="level-track">
        <div class="level-set">
          <span class="level-item">De cero</span>
          <span class="level-item">Primeras líneas</span>
          <span class="level-item">Groove</span>
          <span class="level-item">Armar líneas</span>
          <span class="level-item">Improvisar</span>
          <span class="level-item level-item--bass">
            <span class="cart-mark" aria-hidden="true">
              <svg viewBox="0 0 32 32">
                <path d="M3 5h4l3.2 14h13.4l3-9H9.2"/>
                <circle cx="13" cy="25" r="1.8"/>
                <circle cx="23" cy="25" r="1.8"/>
              </svg>
            </span>
            <span>Te ayudo a conseguir tu bajo</span>
          </span>
        </div>
      </div>
    </div>
    <div class="level-dots" id="levelDots" aria-label="Posición en las opciones">
      <button class="level-dot-btn" type="button" aria-label="De cero" aria-current="true"></button>
      <button class="level-dot-btn" type="button" aria-label="Primeras líneas" aria-current="false"></button>
      <button class="level-dot-btn" type="button" aria-label="Groove" aria-current="false"></button>
      <button class="level-dot-btn" type="button" aria-label="Armar líneas" aria-current="false"></button>
      <button class="level-dot-btn" type="button" aria-label="Improvisar" aria-current="false"></button>
      <button class="level-dot-btn" type="button" aria-label="Conseguir tu bajo" aria-current="false"></button>
    </div>
  </div>

<div class="contact">
    <p class="contact-kicker">Agustín Pardo · clases particulares de bajo</p>
    <a class="wa" id="whatsappLink" href="#" rel="noopener">
      <span>Hablame</span>
      <span class="last">por WhatsApp ↗</span>
    </a>

    <div class="band-marquee" aria-label="Bandas y referencias musicales">
      <div class="band-track">
        <div class="band-set">
          <span class="band-logo" data-name="Rush"><img src="https://upload.wikimedia.org/wikipedia/commons/d/d9/Rush_logo.png" alt="Rush" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="RHCP"><img src="https://upload.wikimedia.org/wikipedia/commons/3/33/Red_Hot_Chili_Peppers_logo.png" alt="Red Hot Chili Peppers" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="Black Sabbath"><img src="https://upload.wikimedia.org/wikipedia/commons/0/0f/Black_Sabbath_%28Logo%2C_black%29.svg" alt="Black Sabbath" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="Led Zeppelin"><img src="https://upload.wikimedia.org/wikipedia/commons/a/a0/Led_Zeppelin_logo.png" alt="Led Zeppelin" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="The Who"><img src="https://cdn.freebiesupply.com/logos/large/2x/the-who-logo-png-transparent.png" alt="The Who" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="Primus"><img src="https://cdn.freebiesupply.com/logos/large/2x/primus-logo-png-transparent.png" alt="Primus" onerror="this.parentElement.classList.add('failed')"></span>
        </div>
        <div class="band-set" aria-hidden="true">
          <span class="band-logo" data-name="Rush"><img src="https://upload.wikimedia.org/wikipedia/commons/d/d9/Rush_logo.png" alt="" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="RHCP"><img src="https://upload.wikimedia.org/wikipedia/commons/3/33/Red_Hot_Chili_Peppers_logo.png" alt="" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="Black Sabbath"><img src="https://upload.wikimedia.org/wikipedia/commons/0/0f/Black_Sabbath_%28Logo%2C_black%29.svg" alt="" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="Led Zeppelin"><img src="https://upload.wikimedia.org/wikipedia/commons/a/a0/Led_Zeppelin_logo.png" alt="" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="The Who"><img src="https://cdn.freebiesupply.com/logos/large/2x/the-who-logo-png-transparent.png" alt="" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="Primus"><img src="https://cdn.freebiesupply.com/logos/large/2x/primus-logo-png-transparent.png" alt="" onerror="this.parentElement.classList.add('failed')"></span>
        </div>
      </div>
    </div>

    <div class="contact-foot">
      <span>100% online</span>
      <span>Bajo eléctrico</span>
    </div>
  </div>
</section>
</main>

<script>
const WHATSAPP_URL = "[PEGAR_LINK_DE_WHATSAPP]";
const whatsappLink = document.getElementById("whatsappLink");
const ready = /^https?:\/\//i.test(WHATSAPP_URL);
whatsappLink.href = ready ? WHATSAPP_URL : "#";
whatsappLink.setAttribute(
  "aria-label",
  ready
    ? "Hablar con Agustín Pardo por WhatsApp"
    : "WhatsApp pendiente de configurar"
);
if (!ready) {
  whatsappLink.addEventListener("click", event => event.preventDefault());
}

const levelRail = document.getElementById("levelRail");
const levelItems = [...document.querySelectorAll(".level-item")];
const levelDots = [...document.querySelectorAll(".level-dot-btn")];

function setLevelDot(index) {
  levelDots.forEach((dot, i) => {
    dot.setAttribute("aria-current", i === index ? "true" : "false");
  });
}

function nearestLevelIndex() {
  if (!levelRail || !levelItems.length) return 0;
  const railLeft = levelRail.getBoundingClientRect().left;
  let best = 0;
  let distance = Infinity;
  levelItems.forEach((item, i) => {
    const d = Math.abs(item.getBoundingClientRect().left - railLeft);
    if (d < distance) {
      distance = d;
      best = i;
    }
  });
  return best;
}

if (levelRail && levelDots.length) {
  let ticking = false;
  levelRail.addEventListener("scroll", () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      setLevelDot(nearestLevelIndex());
      ticking = false;
    });
  }, { passive:true });

  levelDots.forEach((dot, index) => {
    dot.addEventListener("click", () => {
      levelItems[index]?.scrollIntoView({
        behavior:"smooth",
        block:"nearest",
        inline:"start"
      });
      setLevelDot(index);
    });
  });
}
</script>
</body>
</html>
