<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eee5d2">
<title>Agustín Pardo — Clases de bajo online</title>
<meta name="description" content="Clases particulares de bajo online con Agustín Pardo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Teko:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d0d0b;
  --bone:#eee5d2;
  --sand:#b9aa8d;
  --pad:18px;
  --text-start:33vw;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  max-width:100%;
  overflow-x:hidden;
  background:var(--bone);
  color:var(--ink);
}
html{overscroll-behavior-x:none}
body{
  min-height:100%;
  font-family:"Bebas Neue","Arial Narrow",sans-serif;
  touch-action:manipulation;
}
a{color:inherit}
.poster{width:100%;overflow:hidden}
.upper{
  position:relative;
  width:100%;
  overflow:hidden;
  isolation:isolate;
}
.hero{
  position:relative;
  height:62svh;
  background:var(--bone);
}
.journey{
  position:relative;
  height:50svh;
  background:var(--sand);
  border-top:1px solid rgba(13,13,11,.22);
}
.bass-crop{
  position:absolute;
  z-index:2;
  left:0;
  top:0;
  width:29vw;
  height:112svh;
  overflow:hidden;
  pointer-events:none;
}
.bass{
  position:absolute;
  top:-1svh;
  left:-18vw;
  height:112svh;
  width:auto;
  max-width:none;
  filter:grayscale(1) contrast(1.18) brightness(.86);
  mix-blend-mode:multiply;
  opacity:.88;
  user-select:none;
}
.top-copy{
  position:absolute;
  z-index:3;
  top:5svh;
  left:var(--text-start);
  right:var(--pad);
  text-transform:uppercase;
}
.strap{
  margin:0 0 2svh;
  font-size:clamp(14px,4vw,22px);
  line-height:.9;
  letter-spacing:.11em;
  max-width:15ch;
}
.name{
  margin:0;
  font-family:"Teko","Arial Narrow",sans-serif;
  font-weight:700;
  font-size:clamp(54px,14.8vw,128px);
  line-height:.73;
  letter-spacing:-.045em;
}
.name span{display:block}
.level-head{
  position:absolute;
  z-index:3;
  left:var(--text-start);
  right:var(--pad);
  bottom:3svh;
  margin:0;
  font-size:clamp(13px,3.6vw,19px);
  line-height:1;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.journey-inner{
  position:relative;
  z-index:3;
  margin-left:var(--text-start);
  width:calc(100% - var(--text-start));
  height:100%;
  display:grid;
  grid-template-rows:1fr auto;
  padding:3svh var(--pad) 2.8svh 0;
}
.level-marquee{
  align-self:center;
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  overscroll-behavior-x:contain;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
  -ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-x;
}
.level-marquee::-webkit-scrollbar{display:none}
.level-track{
  display:flex;
  width:max-content;
  gap:clamp(12px,3vw,18px);
  padding-right:calc(100vw - var(--text-start) - 48vw - var(--pad));
}
.level-item{
  flex:0 0 48vw;
  width:48vw;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  white-space:normal;
  font-family:"Teko","Arial Narrow",sans-serif;
  font-weight:700;
  font-size:clamp(25px,7.8vw,50px);
  line-height:.82;
  letter-spacing:-.025em;
  text-transform:uppercase;
  position:relative;
  min-height:2.35em;
  display:flex;
  align-items:center;
  padding-right:16px;
}
.level-item::after{
  content:"";
  position:absolute;
  top:50%;
  right:0;
  width:2px;
  height:.8em;
  transform:translateY(-50%);
  background:rgba(13,13,11,.28);
}
.level-item:last-child::after{display:none}
.level-dots{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0;
  padding:0;
}
.level-dot-btn{
  appearance:none;
  width:7px;
  height:7px;
  padding:0;
  border:0;
  border-radius:50%;
  background:rgba(13,13,11,.25);
  cursor:pointer;
  transition:transform 150ms ease,background 150ms ease;
}
.level-dot-btn[aria-current="true"]{
  background:var(--ink);
  transform:scale(1.18);
}
.contact{
  position:relative;
  min-height:68svh;
  overflow:hidden;
  background:var(--ink);
  color:var(--bone);
  padding:7svh var(--pad) var(--pad);
  display:flex;
  flex-direction:column;
}
.contact-kicker{
  margin:0 0 3svh;
  max-width:25ch;
  font-size:clamp(13px,3.5vw,19px);
  line-height:.95;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.wa{
  display:block;
  width:100%;
  max-width:680px;
  overflow:visible;
  text-decoration:none;
  font-family:"Teko","Arial Narrow",sans-serif;
  font-weight:700;
  font-size:clamp(54px,15vw,126px);
  line-height:.84;
  letter-spacing:-.035em;
  text-transform:uppercase;
  padding-top:.10em;
}
.wa span{display:block}
.wa .last{
  font-size:.79em;
  letter-spacing:-.018em;
}
.band-marquee{
  width:calc(100% + (var(--pad) * 2));
  margin-left:calc(var(--pad) * -1);
  margin-top:auto;
  overflow:hidden;
  border-top:1px solid rgba(238,229,210,.45);
  border-bottom:1px solid rgba(238,229,210,.45);
  padding:1.7svh 0;
}
.band-track{
  display:flex;
  width:max-content;
  will-change:transform;
  animation:bandLoop 28s linear infinite;
}
.band-set{
  display:flex;
  align-items:center;
  gap:clamp(34px,7vw,88px);
  padding-right:clamp(34px,7vw,88px);
  flex:none;
}
.band-logo{
  height:clamp(32px,5.5vw,54px);
  min-width:clamp(88px,16vw,180px);
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
}
.band-logo img{
  display:block;
  height:100%;
  width:auto;
  max-width:clamp(110px,19vw,220px);
  object-fit:contain;
  filter:grayscale(1) brightness(0) invert(94%) sepia(9%) saturate(520%) hue-rotate(342deg) brightness(103%) contrast(92%);
  opacity:.92;
}
.band-logo[data-name="RHCP"] img{max-width:clamp(46px,7vw,66px)}
.band-logo[data-name="The Who"] img{max-width:clamp(52px,8vw,78px)}
.band-logo.failed img{display:none}
.band-logo.failed::after{
  content:attr(data-name);
  font-size:clamp(22px,4vw,36px);
  letter-spacing:.08em;
  color:var(--bone);
  white-space:nowrap;
}
@keyframes bandLoop{to{transform:translate3d(-50%,0,0)}}
.contact-foot{
  margin:2.2svh 0 0;
  display:flex;
  justify-content:space-between;
  gap:18px;
  font-size:clamp(12px,3.2vw,17px);
  line-height:1;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.contact-foot span:last-child{text-align:right}
@media (max-width:360px){
  .name{font-size:14.4vw}
  .level-item{font-size:clamp(24px,7.5vw,28px)}
  .wa{font-size:14.2vw}
}
@media (min-width:761px){
  :root{--text-start:30vw;--pad:6vw}
  .hero{height:58svh}
  .journey{height:50svh}
  .bass-crop{width:27vw;height:108svh}
  .bass{left:-10vw;height:108svh}
  .top-copy{top:7svh}
  .strap{font-size:clamp(18px,1.8vw,28px)}
  .name{font-size:clamp(86px,10.5vw,164px)}
  .level-head{
    bottom:3.5svh;
    font-size:clamp(16px,1.5vw,22px);
  }
  .journey-inner{padding-top:4svh;padding-bottom:3.2svh}
  .level-track{
    padding-right:calc(100vw - var(--text-start) - 50vw - var(--pad));
  }
  .level-item{
    flex-basis:50vw;
    width:50vw;
    font-size:clamp(46px,5vw,78px);
  }
  .contact{
    min-height:68svh;
    padding:8svh 6vw 4vw;
  }
  .contact-kicker{font-size:clamp(16px,1.55vw,24px)}
  .wa{font-size:clamp(76px,9.4vw,145px)}
  .contact-foot{font-size:clamp(14px,1.25vw,20px)}
}
</style>
</head>
<body>
<!--
  Bass image: "Tune fretless Bass.png" by 海獺, Wikimedia Commons.
  Source: https://commons.wikimedia.org/wiki/File:Tune_fretless_Bass.png
  License: CC BY-SA 4.0.
-->
<main class="poster">
  <div class="upper">
    <section class="hero" aria-label="Agustín Pardo · clases particulares de bajo">
      <div class="top-copy">
        <p class="strap">Clases particulares de bajo</p>
        <h1 class="name"><span>Agustín</span><span>Pardo</span></h1>
      </div>
      <p class="level-head">Entrás donde estés.</p>
    </section>

    <section class="journey" aria-label="Recorrido de aprendizaje">
      <div class="journey-inner">
        <div class="level-marquee" id="levelRail" aria-label="Deslizá para ver más">
          <div class="level-track">
            <span class="level-item">Elegir tu primer bajo</span>
            <span class="level-item">Empezar de cero</span>
            <span class="level-item">Primeras líneas</span>
            <span class="level-item">Tocar tu primer tema</span>
            <span class="level-item">Groove</span>
            <span class="level-item">Crear tus propias líneas</span>
            <span class="level-item">Improvisar</span>
          </div>
        </div>
        <div class="level-dots" id="levelDots" aria-label="Posición en las opciones">
          <button class="level-dot-btn" type="button" aria-label="Elegir tu primer bajo" aria-current="true"></button>
          <button class="level-dot-btn" type="button" aria-label="Empezar de cero" aria-current="false"></button>
          <button class="level-dot-btn" type="button" aria-label="Primeras líneas" aria-current="false"></button>
          <button class="level-dot-btn" type="button" aria-label="Tocar tu primer tema" aria-current="false"></button>
          <button class="level-dot-btn" type="button" aria-label="Groove" aria-current="false"></button>
          <button class="level-dot-btn" type="button" aria-label="Crear tus propias líneas" aria-current="false"></button>
          <button class="level-dot-btn" type="button" aria-label="Improvisar" aria-current="false"></button>
        </div>
      </div>
    </section>

    <div class="bass-crop" aria-hidden="true">
      <img
        class="bass"
        src="https://upload.wikimedia.org/wikipedia/commons/6/6c/Tune_fretless_Bass.png"
        alt=""
        width="739"
        height="2048"
        decoding="async"
        fetchpriority="high">
    </div>
  </div>

  <section class="contact">
    <p class="contact-kicker">Agustín Pardo · clases particulares de bajo</p>
    <a class="wa" id="whatsappLink" href="#" rel="noopener">
      <span>Hablame</span>
      <span class="last">por WhatsApp ↗</span>
    </a>

    <div class="band-marquee" aria-label="Bandas y referencias musicales">
      <div class="band-track">
        <div class="band-set">
          <span class="band-logo" data-name="Rush"><img src="https://upload.wikimedia.org/wikipedia/commons/d/d9/Rush_logo.png" alt="Rush" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="RHCP"><img src="https://upload.wikimedia.org/wikipedia/commons/3/33/Red_Hot_Chili_Peppers_logo.png" alt="Red Hot Chili Peppers" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="Black Sabbath"><img src="https://upload.wikimedia.org/wikipedia/commons/0/0f/Black_Sabbath_%28Logo%2C_black%29.svg" alt="Black Sabbath" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="Led Zeppelin"><img src="https://upload.wikimedia.org/wikipedia/commons/a/a0/Led_Zeppelin_logo.png" alt="Led Zeppelin" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="The Who"><img src="https://cdn.freebiesupply.com/logos/large/2x/the-who-logo-png-transparent.png" alt="The Who" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="Primus"><img src="https://cdn.freebiesupply.com/logos/large/2x/primus-logo-png-transparent.png" alt="Primus" onerror="this.parentElement.classList.add('failed')"></span>
        </div>
        <div class="band-set" aria-hidden="true">
          <span class="band-logo" data-name="Rush"><img src="https://upload.wikimedia.org/wikipedia/commons/d/d9/Rush_logo.png" alt="" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="RHCP"><img src="https://upload.wikimedia.org/wikipedia/commons/3/33/Red_Hot_Chili_Peppers_logo.png" alt="" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="Black Sabbath"><img src="https://upload.wikimedia.org/wikipedia/commons/0/0f/Black_Sabbath_%28Logo%2C_black%29.svg" alt="" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="Led Zeppelin"><img src="https://upload.wikimedia.org/wikipedia/commons/a/a0/Led_Zeppelin_logo.png" alt="" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="The Who"><img src="https://cdn.freebiesupply.com/logos/large/2x/the-who-logo-png-transparent.png" alt="" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="Primus"><img src="https://cdn.freebiesupply.com/logos/large/2x/primus-logo-png-transparent.png" alt="" onerror="this.parentElement.classList.add('failed')"></span>
        </div>
      </div>
    </div>

    <div class="contact-foot">
      <span>100% online</span>
      <span>Bajo eléctrico</span>
    </div>
  </section>
</main>

<script>
const WHATSAPP_URL = "[PEGAR_LINK_DE_WHATSAPP]";
const whatsappLink = document.getElementById("whatsappLink");
const ready = /^https?:\/\//i.test(WHATSAPP_URL);
whatsappLink.href = ready ? WHATSAPP_URL : "#";
whatsappLink.setAttribute(
  "aria-label",
  ready
    ? "Hablar con Agustín Pardo por WhatsApp"
    : "WhatsApp pendiente de configurar"
);
if (!ready) {
  whatsappLink.addEventListener("click", event => event.preventDefault());
}

const levelRail = document.getElementById("levelRail");
const levelItems = [...document.querySelectorAll(".level-item")];
const levelDots = [...document.querySelectorAll(".level-dot-btn")];

function setLevelDot(index) {
  levelDots.forEach((dot, i) => {
    dot.setAttribute("aria-current", i === index ? "true" : "false");
  });
}

function itemTarget(index) {
  return levelItems[index]?.offsetLeft ?? 0;
}

function nearestLevelIndex() {
  if (!levelRail || !levelItems.length) return 0;
  const x = levelRail.scrollLeft;
  let best = 0;
  let distance = Infinity;
  levelItems.forEach((item, i) => {
    const d = Math.abs(itemTarget(i) - x);
    if (d < distance) {
      distance = d;
      best = i;
    }
  });
  return best;
}

function snapLevel(index, smooth = true) {
  if (!levelRail || !levelItems[index]) return;
  levelRail.scrollTo({
    left:itemTarget(index),
    behavior:smooth ? "smooth" : "auto"
  });
  setLevelDot(index);
}

if (levelRail && levelDots.length) {
  let settleTimer = null;
  let rafPending = false;

  const settle = () => {
    clearTimeout(settleTimer);
    settleTimer = setTimeout(() => {
      snapLevel(nearestLevelIndex(), true);
    }, 90);
  };

  levelRail.addEventListener("scroll", () => {
    if (!rafPending) {
      rafPending = true;
      requestAnimationFrame(() => {
        setLevelDot(nearestLevelIndex());
        rafPending = false;
      });
    }
    settle();
  }, {passive:true});

  levelRail.addEventListener("pointerup", settle, {passive:true});
  levelRail.addEventListener("touchend", settle, {passive:true});

  levelDots.forEach((dot, index) => {
    dot.addEventListener("click", () => snapLevel(index, true));
  });

  window.addEventListener("resize", () => {
    snapLevel(nearestLevelIndex(), false);
  });

  requestAnimationFrame(() => snapLevel(0, false));
}
</script>
</body>
</html>
