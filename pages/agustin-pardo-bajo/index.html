<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b9aa8d">
<title>Agustín Pardo · Clases de bajo</title>
<meta name="description" content="Clases particulares de bajo online con Agustín Pardo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Teko:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d0d0b;
  --sand:#b9aa8d;
  --bone:#eee5d2;
  --pad:clamp(16px,4.5vw,30px);
  --rail-start:34vw;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  max-width:100%;
  overflow-x:hidden;
  background:var(--sand);
  color:var(--ink);
}
html{overscroll-behavior-x:none}
body{
  font-family:"Bebas Neue","Arial Narrow",sans-serif;
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
}
main{width:100%;overflow:hidden}
.stage{
  position:relative;
  height:94svh;
  background:var(--sand);
  overflow:hidden;
  isolation:isolate;
}
.hero{
  position:relative;
  height:54svh;
  border-bottom:1px solid rgba(13,13,11,.22);
}
.copy{
  position:absolute;
  z-index:4;
  top:5svh;
  left:var(--rail-start);
  right:var(--pad);
  text-transform:uppercase;
}
.strap{
  margin:0 0 1.8svh;
  max-width:13ch;
  font-size:clamp(14px,3.8vw,21px);
  line-height:.92;
  letter-spacing:.10em;
}
.name{
  margin:0;
  font-family:"Teko","Arial Narrow",sans-serif;
  font-weight:700;
  font-size:clamp(56px,15vw,128px);
  line-height:.72;
  letter-spacing:-.045em;
}
.name span{display:block}
.lead{
  position:absolute;
  z-index:4;
  left:var(--rail-start);
  right:var(--pad);
  bottom:3svh;
  margin:0;
  font-size:clamp(13px,3.4vw,18px);
  line-height:1;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.bass{
  position:absolute;
  z-index:6;
  left:-8vw;
  top:0;
  height:91svh;
  width:auto;
  max-width:none;
  mix-blend-mode:multiply;
  filter:contrast(1.08) grayscale(.25);
  pointer-events:none;
  user-select:none;
}
.journey{
  position:relative;
  height:40svh;
  background:var(--sand);
}
.rail{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:2.5svh 0 2.3svh;
}
.marquee{
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
  -ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
  padding-left:var(--rail-start);
}
.marquee::-webkit-scrollbar{display:none}
.track{
  display:flex;
  gap:14px;
  width:max-content;
  padding-right:calc(100vw - var(--rail-start) - 49vw - var(--pad));
}
.item{
  flex:0 0 49vw;
  width:49vw;
  min-height:2.1em;
  display:flex;
  align-items:center;
  position:relative;
  padding-right:16px;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  font-family:"Teko","Arial Narrow",sans-serif;
  font-weight:700;
  font-size:clamp(30px,8.5vw,54px);
  line-height:.82;
  letter-spacing:-.035em;
  text-transform:uppercase;
  white-space:normal;
}
.item::after{
  content:"";
  position:absolute;
  right:0;
  top:50%;
  width:2px;
  height:.76em;
  transform:translateY(-50%);
  background:rgba(13,13,11,.25);
}
.item:last-child::after{display:none}
.dots{
  position:absolute;
  left:var(--rail-start);
  bottom:2.2svh;
  display:flex;
  gap:9px;
  align-items:center;
}
.dot{
  appearance:none;
  width:7px;
  height:7px;
  border:0;
  border-radius:50%;
  padding:0;
  background:rgba(13,13,11,.25);
}
.dot[aria-current="true"]{
  background:var(--ink);
  transform:scale(1.18);
}
.contact{
  min-height:60svh;
  background:var(--ink);
  color:var(--bone);
  padding:7svh var(--pad) var(--pad);
  display:flex;
  flex-direction:column;
}
.kicker{
  margin:0 0 2.6svh;
  max-width:24ch;
  font-size:clamp(13px,3.4vw,18px);
  line-height:.95;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.wa{
  display:block;
  color:inherit;
  text-decoration:none;
  font-family:"Teko","Arial Narrow",sans-serif;
  font-weight:700;
  font-size:clamp(54px,15vw,126px);
  line-height:.84;
  letter-spacing:-.04em;
  text-transform:uppercase;
}
.wa span{display:block}
.wa .last{font-size:.8em}
.band-marquee{
  width:calc(100% + (var(--pad) * 2));
  margin-left:calc(var(--pad) * -1);
  margin-top:auto;
  overflow:hidden;
  border-top:1px solid rgba(238,229,210,.4);
  border-bottom:1px solid rgba(238,229,210,.4);
  padding:1.5svh 0;
}
.band-track{
  display:flex;
  width:max-content;
  animation:bandLoop 28s linear infinite;
}
.band-set{
  display:flex;
  align-items:center;
  gap:clamp(34px,7vw,88px);
  padding-right:clamp(34px,7vw,88px);
  flex:none;
}
.band-logo{
  height:clamp(32px,5.5vw,54px);
  min-width:clamp(88px,16vw,180px);
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
}
.band-logo img{
  display:block;
  height:100%;
  width:auto;
  max-width:clamp(110px,19vw,220px);
  object-fit:contain;
  filter:grayscale(1) brightness(0) invert(94%);
  opacity:.92;
}
.band-logo[data-name="RHCP"] img{max-width:clamp(46px,7vw,66px)}
.band-logo[data-name="The Who"] img{max-width:clamp(52px,8vw,78px)}
.band-logo.failed img{display:none}
.band-logo.failed::after{
  content:attr(data-name);
  font-size:clamp(22px,4vw,36px);
  letter-spacing:.08em;
  white-space:nowrap;
}
@keyframes bandLoop{to{transform:translate3d(-50%,0,0)}}
.foot{
  margin-top:2.2svh;
  display:flex;
  justify-content:space-between;
  gap:18px;
  font-size:clamp(12px,3vw,16px);
  letter-spacing:.12em;
  text-transform:uppercase;
}
@media(max-width:360px){
  .name{font-size:14.4vw}
  .item{font-size:7.9vw}
  .bass{left:-10vw}
}
@media(min-width:761px){
  :root{--rail-start:29vw;--pad:6vw}
  .stage{height:90svh}
  .hero{height:52svh}
  .journey{height:38svh}
  .bass{left:-4vw;height:88svh}
  .copy{top:7svh}
  .name{font-size:clamp(88px,10.4vw,160px)}
  .lead{bottom:3.5svh}
  .track{padding-right:calc(100vw - var(--rail-start) - 46vw - var(--pad))}
  .item{flex-basis:46vw;width:46vw;font-size:clamp(46px,5vw,78px)}
  .contact{min-height:58svh;padding:8svh 6vw 4vw}
  .wa{font-size:clamp(76px,9.2vw,146px)}
}
</style>
</head>
<body>
<main>
  <section class="stage">
    <div class="hero">
      <div class="copy">
        <p class="strap">Clases particulares de bajo</p>
        <h1 class="name"><span>Agustín</span><span>Pardo</span></h1>
      </div>
      <p class="lead">Entrás donde estés.</p>
    </div>

    <div class="journey">
      <div class="rail">
        <div class="marquee" id="levelRail" aria-label="Deslizá para ver más">
          <div class="track">
            <span class="item">Elegir tu primer bajo</span>
            <span class="item">Empezar de cero</span>
            <span class="item">Primeras líneas</span>
            <span class="item">Tocar tu primer tema</span>
            <span class="item">Groove</span>
            <span class="item">Crear tus propias líneas</span>
            <span class="item">Improvisar</span>
          </div>
        </div>
        <div class="dots" id="levelDots">
          <button class="dot" aria-current="true"></button>
          <button class="dot" aria-current="false"></button>
          <button class="dot" aria-current="false"></button>
          <button class="dot" aria-current="false"></button>
          <button class="dot" aria-current="false"></button>
          <button class="dot" aria-current="false"></button>
          <button class="dot" aria-current="false"></button>
        </div>
      </div>
    </div>

    <img
      class="bass"
      src="https://giggear.2dimg.com/1/1_bc80ef9d2f.jpg"
      alt=""
      width="512"
      height="512"
      decoding="async"
      fetchpriority="high">
  </section>

  <section class="contact">
    <p class="kicker">Agustín Pardo · clases particulares de bajo</p>
    <a class="wa" id="whatsappLink" href="#" rel="noopener">
      <span>Hablame</span>
      <span class="last">por WhatsApp ↗</span>
    </a>

    <div class="band-marquee" aria-label="Bandas y referencias musicales">
      <div class="band-track">
        <div class="band-set">
          <span class="band-logo" data-name="Rush"><img src="https://upload.wikimedia.org/wikipedia/commons/d/d9/Rush_logo.png" alt="Rush" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="RHCP"><img src="https://upload.wikimedia.org/wikipedia/commons/3/33/Red_Hot_Chili_Peppers_logo.png" alt="Red Hot Chili Peppers" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="Black Sabbath"><img src="https://upload.wikimedia.org/wikipedia/commons/0/0f/Black_Sabbath_%28Logo%2C_black%29.svg" alt="Black Sabbath" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="Led Zeppelin"><img src="https://upload.wikimedia.org/wikipedia/commons/a/a0/Led_Zeppelin_logo.png" alt="Led Zeppelin" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="The Who"><img src="https://cdn.freebiesupply.com/logos/large/2x/the-who-logo-png-transparent.png" alt="The Who" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="Primus"><img src="https://cdn.freebiesupply.com/logos/large/2x/primus-logo-png-transparent.png" alt="Primus" onerror="this.parentElement.classList.add('failed')"></span>
        </div>
        <div class="band-set" aria-hidden="true">
          <span class="band-logo" data-name="Rush"><img src="https://upload.wikimedia.org/wikipedia/commons/d/d9/Rush_logo.png" alt="" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="RHCP"><img src="https://upload.wikimedia.org/wikipedia/commons/3/33/Red_Hot_Chili_Peppers_logo.png" alt="" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="Black Sabbath"><img src="https://upload.wikimedia.org/wikipedia/commons/0/0f/Black_Sabbath_%28Logo%2C_black%29.svg" alt="" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="Led Zeppelin"><img src="https://upload.wikimedia.org/wikipedia/commons/a/a0/Led_Zeppelin_logo.png" alt="" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="The Who"><img src="https://cdn.freebiesupply.com/logos/large/2x/the-who-logo-png-transparent.png" alt="" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="Primus"><img src="https://cdn.freebiesupply.com/logos/large/2x/primus-logo-png-transparent.png" alt="" onerror="this.parentElement.classList.add('failed')"></span>
        </div>
      </div>
    </div>

    <div class="foot">
      <span>100% online</span>
      <span>Bajo eléctrico</span>
    </div>
  </section>
</main>

<script>
const WHATSAPP_URL = "[PEGAR_LINK_DE_WHATSAPP]";
const whatsappLink = document.getElementById("whatsappLink");
const ready = /^https?:\/\//i.test(WHATSAPP_URL);
whatsappLink.href = ready ? WHATSAPP_URL : "#";
if (!ready) whatsappLink.addEventListener("click", e => e.preventDefault());

const rail = document.getElementById("levelRail");
const items = [...document.querySelectorAll(".item")];
const dots = [...document.querySelectorAll(".dot")];

function itemX(i){ return items[i]?.offsetLeft || 0; }
function setDot(i){
  dots.forEach((dot,k) => dot.setAttribute("aria-current", k === i ? "true" : "false"));
}
function nearest(){
  let best = 0, dist = Infinity;
  items.forEach((item,i) => {
    const d = Math.abs(itemX(i) - rail.scrollLeft);
    if (d < dist){ dist = d; best = i; }
  });
  return best;
}
function snap(i, smooth = true){
  rail.scrollTo({left:itemX(i), behavior:smooth ? "smooth" : "auto"});
  setDot(i);
}
let settleTimer = null;
rail.addEventListener("scroll", () => {
  setDot(nearest());
  clearTimeout(settleTimer);
  settleTimer = setTimeout(() => snap(nearest(), true), 90);
}, {passive:true});
rail.addEventListener("touchend", () => {
  clearTimeout(settleTimer);
  settleTimer = setTimeout(() => snap(nearest(), true), 70);
}, {passive:true});
rail.addEventListener("pointerup", () => {
  clearTimeout(settleTimer);
  settleTimer = setTimeout(() => snap(nearest(), true), 70);
}, {passive:true});
dots.forEach((dot,i) => dot.addEventListener("click", () => snap(i,true)));
requestAnimationFrame(() => snap(0,false));
</script>
</body>
</html>
