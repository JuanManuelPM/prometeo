<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#efe7d6">
  <title>Agustín Pardo — Clases particulares de bajo</title>
  <meta name="description" content="Agustín Pardo · clases particulares de bajo · presenciales / online.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#11110f;
      --bone:#efe7d6;
      --sand:#b8a78a;
      --gap:clamp(18px,3.2vw,54px);
      --bass-lane:47vw;
    }

    *{box-sizing:border-box}

    html{
      background:var(--bone);
      color:var(--ink);
    }

    body{
      margin:0;
      overflow-x:hidden;
      background:var(--bone);
      color:var(--ink);
      font-family:"Bebas Neue","Arial Narrow",sans-serif;
    }

    a{color:inherit}

    .poster{
      position:relative;
      min-height:330svh;
      background:var(--bone);
      isolation:isolate;
    }

    /*
      COMPOSITION INVARIANT:
      The instrument owns --bass-lane.
      All copy starts to the right of that lane.
      No decorative line, label or animated element may enter the instrument lane.
    */
    .instrument-lane{
      position:sticky;
      top:0;
      height:100svh;
      width:var(--bass-lane);
      overflow:hidden;
      z-index:1;
      pointer-events:none;
    }

    .bass{
      position:absolute;
      left:clamp(-6vw,-2vw,-1vw);
      top:-8svh;
      height:116svh;
      width:auto;
      max-width:none;
      transform:rotate(-7deg);
      transform-origin:50% 50%;
      filter:grayscale(1) brightness(.13) contrast(2);
      user-select:none;
    }

    .copy-flow{
      position:relative;
      z-index:2;
      margin-top:-100svh;
      margin-left:var(--bass-lane);
      min-height:330svh;
      padding-right:var(--gap);
    }

    .intro,
    .statement,
    .mode{
      min-height:100svh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:flex-start;
    }

    .intro{
      padding:7svh 0 10svh clamp(10px,2vw,30px);
      justify-content:flex-start;
    }

    .eyebrow{
      margin:0 0 2.4svh;
      font-size:clamp(16px,1.55vw,25px);
      line-height:1;
      letter-spacing:.13em;
      text-transform:uppercase;
    }

    h1{
      margin:0;
      font-family:"Archivo Black",Impact,sans-serif;
      font-size:clamp(66px,10.8vw,178px);
      line-height:.79;
      letter-spacing:-.075em;
      text-transform:uppercase;
      max-width:5.7ch;
    }

    h1 span{display:block}

    .sub{
      margin:5svh 0 0;
      max-width:13ch;
      font-size:clamp(25px,2.7vw,46px);
      line-height:.9;
      text-transform:uppercase;
    }

    .statement{
      padding-left:clamp(10px,2vw,30px);
      padding-bottom:5svh;
    }

    .statement .small{
      margin:0 0 2svh;
      font-size:clamp(17px,1.5vw,23px);
      letter-spacing:.15em;
      text-transform:uppercase;
    }

    .statement h2{
      margin:0;
      font-family:"Archivo Black",Impact,sans-serif;
      font-size:clamp(56px,8.2vw,132px);
      line-height:.82;
      letter-spacing:-.065em;
      text-transform:uppercase;
      max-width:5.9ch;
    }

    .statement h2 em{
      display:block;
      font-style:normal;
      color:var(--sand);
    }

    .mode{
      justify-content:flex-end;
      padding:0 0 8svh clamp(10px,2vw,30px);
    }

    .mode-band{
      width:calc(100% + var(--gap));
      margin-right:calc(var(--gap) * -1);
      padding:4svh var(--gap) 4svh 0;
      background:var(--sand);
    }

    .mode-label{
      margin:0 0 1.3svh;
      font-size:clamp(15px,1.35vw,21px);
      letter-spacing:.16em;
      text-transform:uppercase;
    }

    .mode-copy{
      margin:0;
      font-family:"Archivo Black",Impact,sans-serif;
      font-size:clamp(50px,7.6vw,122px);
      line-height:.82;
      letter-spacing:-.055em;
      text-transform:uppercase;
    }

    .mode-copy span{display:block}

    .contact{
      position:relative;
      min-height:92svh;
      background:var(--ink);
      color:var(--bone);
      padding:clamp(26px,5vw,78px);
      display:flex;
      flex-direction:column;
      justify-content:center;
      overflow:hidden;
    }

    .contact:after{
      content:"BAJO";
      position:absolute;
      left:-.05em;
      bottom:-.16em;
      font-family:"Archivo Black",Impact,sans-serif;
      font-size:clamp(160px,34vw,620px);
      line-height:.75;
      color:var(--sand);
      opacity:.13;
      letter-spacing:-.085em;
      pointer-events:none;
    }

    .contact-copy{
      position:relative;
      z-index:1;
      margin-left:auto;
      width:min(780px,78vw);
    }

    .contact-kicker{
      margin:0 0 2svh;
      font-size:clamp(16px,1.5vw,24px);
      letter-spacing:.14em;
      text-transform:uppercase;
    }

    .wa{
      display:inline-block;
      text-decoration:none;
      font-family:"Archivo Black",Impact,sans-serif;
      font-size:clamp(48px,7.8vw,124px);
      line-height:.84;
      letter-spacing:-.055em;
      text-transform:uppercase;
      border-bottom:clamp(3px,.32vw,6px) solid currentColor;
      padding-bottom:.08em;
      touch-action:manipulation;
    }

    .wa span{display:block}

    .contact-meta{
      position:absolute;
      left:clamp(26px,5vw,78px);
      right:clamp(26px,5vw,78px);
      bottom:clamp(24px,3.2vw,46px);
      z-index:1;
      display:flex;
      justify-content:space-between;
      gap:18px;
      font-size:clamp(13px,1.15vw,18px);
      letter-spacing:.13em;
      text-transform:uppercase;
    }

    @media (max-width:760px){
      :root{
        --gap:18px;
        --bass-lane:43vw;
      }

      .poster{
        min-height:315svh;
      }

      .instrument-lane{
        width:var(--bass-lane);
      }

      .bass{
        left:-34vw;
        top:-3svh;
        height:106svh;
        transform:rotate(-5deg);
      }

      .copy-flow{
        min-height:315svh;
        padding-right:18px;
      }

      .intro{
        min-height:100svh;
        padding:7svh 0 10svh 6px;
      }

      .eyebrow{
        font-size:13px;
        letter-spacing:.11em;
        max-width:16ch;
      }

      h1{
        font-size:clamp(55px,17.5vw,88px);
        line-height:.8;
        max-width:5ch;
      }

      .sub{
        margin-top:4svh;
        font-size:clamp(22px,7vw,33px);
        max-width:9ch;
      }

      .statement{
        min-height:105svh;
        padding-left:6px;
        justify-content:flex-end;
        padding-bottom:12svh;
      }

      .statement .small{
        font-size:13px;
      }

      .statement h2{
        font-size:clamp(50px,15vw,76px);
        max-width:5.5ch;
      }

      .mode{
        min-height:110svh;
        padding:0 0 9svh 6px;
      }

      .mode-band{
        width:calc(100% + 18px);
        margin-right:-18px;
        padding:3.2svh 18px 3.2svh 0;
      }

      .mode-label{
        font-size:13px;
      }

      .mode-copy{
        font-size:clamp(43px,13.5vw,70px);
      }

      .contact{
        min-height:86svh;
        padding:24px 18px 82px;
      }

      .contact-copy{
        width:76vw;
      }

      .contact-kicker{
        font-size:13px;
      }

      .wa{
        font-size:clamp(42px,13.8vw,69px);
        line-height:.86;
      }

      .contact-meta{
        left:18px;
        right:18px;
        bottom:24px;
        font-size:11px;
      }
    }

    @media (max-width:380px){
      :root{--bass-lane:42vw}
      .bass{
        left:-39vw;
        height:103svh;
      }
      h1{font-size:16.8vw}
      .statement h2{font-size:14.3vw}
    }
  </style>
</head>
<body>
  <!--
    Bass asset: "Fender Jazz Bass.svg" by piemaster / Open Clip Art Library.
    Wikimedia Commons source:
    https://commons.wikimedia.org/wiki/File:Fender_Jazz_Bass.svg
    License: CC0 1.0 / public domain.
    Original SVG:
    https://upload.wikimedia.org/wikipedia/commons/1/14/Fender_Jazz_Bass.svg
  -->

  <main>
    <section class="poster" aria-label="Agustín Pardo, clases particulares de bajo">
      <div class="instrument-lane" aria-hidden="true">
        <img
          class="bass"
          src="https://upload.wikimedia.org/wikipedia/commons/1/14/Fender_Jazz_Bass.svg"
          alt=""
          width="233"
          height="801"
          decoding="async"
          fetchpriority="high">
      </div>

      <div class="copy-flow">
        <section class="intro">
          <p class="eyebrow">Clases particulares de bajo</p>
          <h1>
            <span>Agustín</span>
            <span>Pardo</span>
          </h1>
          <p class="sub">Presenciales / Online</p>
        </section>

        <section class="statement">
          <p class="small">Bajo eléctrico</p>
          <h2>
            Clases
            <em>particulares</em>
            de bajo
          </h2>
        </section>

        <section class="mode">
          <div class="mode-band">
            <p class="mode-label">Modalidad</p>
            <p class="mode-copy">
              <span>Presenciales</span>
              <span>/ Online</span>
            </p>
          </div>
        </section>
      </div>
    </section>

    <section class="contact">
      <div class="contact-copy">
        <p class="contact-kicker">Agustín Pardo · clases particulares de bajo</p>
        <a class="wa" id="whatsappLink" href="#" rel="noopener">
          <span>Hablame</span>
          <span>por WhatsApp ↗</span>
        </a>
      </div>

      <div class="contact-meta">
        <span>Presenciales / Online</span>
        <span>Bajo eléctrico</span>
      </div>
    </section>
  </main>

  <script>
    const WHATSAPP_URL = "[PEGAR_LINK_DE_WHATSAPP]";

    const whatsappLink = document.getElementById("whatsappLink");
    const hasWhatsapp = /^https?:\/\//i.test(WHATSAPP_URL);

    whatsappLink.href = hasWhatsapp ? WHATSAPP_URL : "#";
    whatsappLink.setAttribute(
      "aria-label",
      hasWhatsapp
        ? "Hablar con Agustín Pardo por WhatsApp"
        : "WhatsApp pendiente de configurar"
    );

    if (!hasWhatsapp) {
      whatsappLink.addEventListener("click", event => event.preventDefault());
    }
  </script>
</body>
</html>
