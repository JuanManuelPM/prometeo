<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eee6d4">
  <title>Agustín Pardo — Clases particulares de bajo</title>
  <meta name="description" content="Clases particulares de bajo con Agustín Pardo. Presenciales / Online.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#11110f;
      --bone:#eee6d4;
      --sand:#b9a98b;
      --edge:clamp(18px,3.2vw,54px);
      --bass-shift:0px;
      --bass-tilt:-24deg;
    }
    *{box-sizing:border-box}
    html{background:var(--bone);scroll-behavior:auto}
    body{
      margin:0;
      color:var(--ink);
      background:var(--bone);
      overflow-x:hidden;
      font-family:"Bebas Neue","Arial Narrow",sans-serif;
    }
    a{color:inherit}
    .poster{
      position:relative;
      min-height:355svh;
      background:var(--bone);
      isolation:isolate;
    }
    .bass-stage{
      position:sticky;
      top:0;
      height:100svh;
      overflow:hidden;
      z-index:2;
      pointer-events:none;
    }
    .bass{
      position:absolute;
      height:142svh;
      width:auto;
      max-width:none;
      left:-7vw;
      top:-20svh;
      transform-origin:50% 48%;
      transform:translate3d(0,var(--bass-shift),0) rotate(var(--bass-tilt));
      filter:grayscale(1) brightness(.12) contrast(1.7);
      will-change:transform;
      user-select:none;
    }
    .rail{
      position:absolute;
      top:0;
      bottom:0;
      left:clamp(22px,4.5vw,82px);
      width:2px;
      background:var(--ink);
      opacity:.96;
      z-index:1;
    }
    .rail:after{
      content:"";
      position:absolute;
      top:0;
      left:11px;
      width:1px;
      height:100%;
      background:var(--ink);
      opacity:.34;
    }
    .flow{
      position:relative;
      z-index:3;
      margin-top:-100svh;
    }
    .screen{
      min-height:100svh;
      position:relative;
      padding:var(--edge);
      display:flex;
      align-items:flex-start;
    }
    .hero{
      justify-content:flex-end;
      padding-top:10svh;
    }
    .hero-copy{
      width:min(49vw,760px);
      margin-right:1vw;
    }
    .kicker,
    .micro{
      font-family:"Bebas Neue","Arial Narrow",sans-serif;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .kicker{
      display:flex;
      align-items:center;
      gap:.65em;
      font-size:clamp(15px,1.55vw,25px);
      margin-bottom:2.5vh;
    }
    .kicker:before{
      content:"";
      width:clamp(26px,4vw,72px);
      height:2px;
      background:var(--ink);
      display:block;
    }
    h1{
      margin:0;
      font-family:"Archivo Black",Impact,sans-serif;
      font-size:clamp(64px,10.1vw,172px);
      line-height:.78;
      letter-spacing:-.075em;
      text-transform:uppercase;
      max-width:7ch;
    }
    h1 span{display:block}
    .hero-note{
      margin:4.5vh 0 0 auto;
      width:min(21ch,100%);
      font-size:clamp(22px,2.4vw,40px);
      line-height:.88;
      text-transform:uppercase;
      text-align:left;
    }
    .chapter{
      min-height:104svh;
      align-items:center;
    }
    .chapter-copy{
      margin-left:clamp(7vw,12vw,180px);
      width:min(44vw,700px);
      transform:translateY(3svh);
    }
    .chapter .eyebrow{
      margin:0 0 2.2vh;
      font-size:clamp(17px,1.5vw,24px);
      letter-spacing:.14em;
    }
    .chapter h2{
      margin:0;
      font-family:"Archivo Black",Impact,sans-serif;
      font-size:clamp(54px,8.7vw,146px);
      line-height:.82;
      letter-spacing:-.065em;
      text-transform:uppercase;
    }
    .chapter h2 .sand{color:var(--sand)}
    .slash{
      display:block;
      margin:3.6vh 0 0;
      width:min(28vw,410px);
      height:clamp(11px,1.35vw,20px);
      background:var(--ink);
      transform:skewX(-28deg);
    }
    .bass-word{
      min-height:102svh;
      align-items:flex-end;
      padding-bottom:8svh;
      overflow:hidden;
    }
    .bass-word:before{
      content:"";
      position:absolute;
      left:0;
      right:0;
      top:17svh;
      height:31svh;
      background:var(--sand);
      z-index:-1;
    }
    .bass-word-copy{
      width:100%;
      display:grid;
      grid-template-columns:1fr auto;
      align-items:end;
      gap:4vw;
    }
    .giant{
      margin:0 0 -1.1vw -1vw;
      font-family:"Archivo Black",Impact,sans-serif;
      font-size:clamp(118px,27vw,510px);
      line-height:.65;
      letter-spacing:-.085em;
      text-transform:uppercase;
      white-space:nowrap;
    }
    .modes{
      margin:0 2vw 1vh 0;
      font-size:clamp(24px,3vw,54px);
      line-height:.9;
      text-transform:uppercase;
      text-align:right;
      white-space:nowrap;
    }
    .modes small{
      display:block;
      font-size:.42em;
      letter-spacing:.16em;
      margin-bottom:.6em;
    }
    .contact{
      min-height:92svh;
      position:relative;
      background:var(--ink);
      color:var(--bone);
      display:grid;
      align-content:center;
      padding:clamp(28px,6vw,96px);
      overflow:hidden;
    }
    .contact:before{
      content:"BAJO";
      position:absolute;
      right:-.08em;
      top:-.12em;
      font-family:"Archivo Black",Impact,sans-serif;
      font-size:clamp(160px,37vw,680px);
      line-height:.8;
      color:var(--sand);
      opacity:.14;
      letter-spacing:-.08em;
      pointer-events:none;
    }
    .contact-copy{
      position:relative;
      z-index:2;
      width:min(860px,86vw);
      margin-left:auto;
      margin-right:2vw;
    }
    .contact .micro{
      font-size:clamp(16px,1.6vw,25px);
      margin:0 0 2vh;
      opacity:.82;
    }
    .wa{
      display:inline-block;
      text-decoration:none;
      font-family:"Archivo Black",Impact,sans-serif;
      font-size:clamp(46px,8vw,132px);
      line-height:.84;
      letter-spacing:-.055em;
      text-transform:uppercase;
      padding:.16em 0;
      border-bottom:clamp(3px,.36vw,6px) solid currentColor;
      pointer-events:auto;
      touch-action:manipulation;
    }
    .wa span{display:block}
    .wa .arrow{
      display:inline-block;
      font-family:"Bebas Neue","Arial Narrow",sans-serif;
      font-size:.7em;
      margin-left:.12em;
      transform:translateY(-.05em);
    }
    .footerline{
      position:absolute;
      left:var(--edge);
      right:var(--edge);
      bottom:clamp(20px,3.5vw,48px);
      display:flex;
      justify-content:space-between;
      gap:18px;
      border-top:1px solid currentColor;
      padding-top:10px;
      font-size:clamp(13px,1.25vw,19px);
      letter-spacing:.13em;
      text-transform:uppercase;
    }
    @media (max-width:760px){
      :root{--edge:20px;--bass-tilt:-17deg}
      .poster{min-height:360svh}
      .rail{left:18px;opacity:.75}
      .rail:after{left:7px}
      .bass{
        height:126svh;
        left:-43vw;
        top:-9svh;
      }
      .hero{
        padding-top:9svh;
        justify-content:flex-end;
      }
      .hero-copy{
        width:64vw;
        margin-right:-2px;
      }
      .kicker{
        font-size:14px;
        letter-spacing:.1em;
        margin-bottom:2vh;
      }
      .kicker:before{width:20px}
      h1{
        font-size:clamp(54px,18.4vw,92px);
        max-width:6ch;
        line-height:.79;
      }
      .hero-note{
        margin-top:4vh;
        font-size:23px;
        width:14ch;
      }
      .chapter{
        align-items:flex-end;
        padding-bottom:12svh;
      }
      .chapter-copy{
        width:76vw;
        margin-left:auto;
        transform:none;
      }
      .chapter .eyebrow{font-size:15px}
      .chapter h2{
        font-size:clamp(51px,16.2vw,84px);
        line-height:.83;
      }
      .slash{width:42vw;height:9px}
      .bass-word{
        min-height:103svh;
        padding:0 16px 9svh;
      }
      .bass-word:before{
        top:22svh;
        height:24svh;
      }
      .bass-word-copy{
        display:block;
      }
      .giant{
        font-size:clamp(112px,42vw,205px);
        margin-left:-8px;
        margin-bottom:7vh;
      }
      .modes{
        text-align:left;
        margin-left:42vw;
        font-size:31px;
        white-space:normal;
        max-width:8ch;
      }
      .contact{
        min-height:88svh;
        padding:24px 20px 86px;
      }
      .contact-copy{
        width:84vw;
        margin:0 0 0 auto;
      }
      .contact .micro{font-size:15px}
      .wa{
        font-size:clamp(44px,15vw,76px);
        line-height:.86;
      }
      .footerline{
        left:20px;
        right:20px;
        bottom:24px;
        font-size:12px;
      }
    }
    @media (max-width:380px){
      .bass{left:-50vw;height:122svh}
      .hero-copy{width:68vw}
      h1{font-size:17.8vw}
      .chapter-copy{width:79vw}
      .modes{margin-left:36vw}
    }
    @media (prefers-reduced-motion:reduce){
      .bass{will-change:auto;transform:rotate(var(--bass-tilt))}
    }
  </style>
</head>
<body>
  <!--
    Bass visual: "Bass Guitar.svg" by AJ / Open Clip Art Library,
    hosted on Wikimedia Commons. CC0 / public domain.
    Source page: https://commons.wikimedia.org/wiki/File:Bass_Guitar.svg
  -->
  <main>
    <section class="poster" aria-label="Agustín Pardo, clases particulares de bajo">
      <div class="bass-stage" aria-hidden="true">
        <div class="rail"></div>
        <img
          class="bass"
          src="https://upload.wikimedia.org/wikipedia/commons/9/96/Bass_Guitar.svg"
          alt=""
          width="375"
          height="900"
          decoding="async"
          fetchpriority="high">
      </div>

      <div class="flow">
        <section class="screen hero">
          <div class="hero-copy">
            <div class="kicker">Clases particulares de bajo</div>
            <h1><span>Agustín</span><span>Pardo</span></h1>
            <p class="hero-note">Un instrumento. Cuatro cuerdas. Mucho espacio para encontrar tu sonido.</p>
          </div>
        </section>

        <section class="screen chapter">
          <div class="chapter-copy">
            <p class="eyebrow">01 / clases</p>
            <h2>Particulares<br><span class="sand">de bajo</span></h2>
            <i class="slash" aria-hidden="true"></i>
          </div>
        </section>

        <section class="screen bass-word">
          <div class="bass-word-copy">
            <p class="giant">BAJO</p>
            <p class="modes"><small>Modalidad</small>Presenciales<br>/ Online</p>
          </div>
        </section>
      </div>
    </section>

    <section class="contact">
      <div class="contact-copy">
        <p class="micro">Agustín Pardo · clases particulares de bajo</p>
        <a class="wa" id="whatsappLink" href="#" rel="noopener">
          <span>Hablame</span>
          <span>por WhatsApp <b class="arrow">↗</b></span>
        </a>
      </div>
      <div class="footerline">
        <span>Presenciales / Online</span>
        <span>Buenos Aires · 2026</span>
      </div>
    </section>
  </main>

  <script>
    const WHATSAPP_URL = "[PEGAR_LINK_DE_WHATSAPP]";

    const whatsappLink = document.getElementById("whatsappLink");
    const hasWhatsapp = /^https?:\/\//i.test(WHATSAPP_URL);
    whatsappLink.href = hasWhatsapp ? WHATSAPP_URL : "#";
    whatsappLink.setAttribute("aria-label", hasWhatsapp
      ? "Hablar con Agustín Pardo por WhatsApp"
      : "WhatsApp pendiente de configurar");
    if (!hasWhatsapp) {
      whatsappLink.addEventListener("click", (event) => event.preventDefault());
    }

    if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      let ticking = false;
      const poster = document.querySelector(".poster");

      const render = () => {
        const rect = poster.getBoundingClientRect();
        const travel = Math.max(1, poster.offsetHeight - innerHeight);
        const p = Math.min(1, Math.max(0, -rect.top / travel));
        const shift = (p - 0.5) * -28;
        document.documentElement.style.setProperty("--bass-shift", shift + "px");
        ticking = false;
      };

      addEventListener("scroll", () => {
        if (!ticking) {
          requestAnimationFrame(render);
          ticking = true;
        }
      }, {passive:true});

      addEventListener("resize", render, {passive:true});
      render();
    }
  </script>
</body>
</html>
