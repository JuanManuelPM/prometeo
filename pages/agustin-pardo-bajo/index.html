<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eee5d2">
<title>Agustín Pardo · Clases particulares de bajo</title>
<meta name="description" content="Clases particulares de bajo online con Agustín Pardo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Teko:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0e0e0b;
  --bone:#eee5d2;
  --pad:18px;
  --text-x:36vw;
  --item-w:52vw;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  max-width:100%;
  overflow-x:hidden;
  background:var(--bone);
  color:var(--ink);
}
body{
  font-family:"Bebas Neue","Arial Narrow",sans-serif;
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
}
a{color:inherit}
.poster{width:100%;overflow:hidden;background:var(--bone)}
.stage{
  position:relative;
  isolation:isolate;
  overflow:hidden;
}
.hero{
  position:relative;
  height:55svh;
  background:var(--bone);
  border-bottom:2px solid var(--ink);
}
.journey{
  position:relative;
  height:32svh;
  background:var(--bone);
  border-bottom:2px solid var(--ink);
  overflow:hidden;
}
.bass{
  position:absolute;
  z-index:5;
  top:-1.5svh;
  left:-27vw;
  height:89svh;
  width:auto;
  max-width:none;
  pointer-events:none;
  user-select:none;
  filter:grayscale(1) contrast(1.55) brightness(.34);
  opacity:.98;
}
.hero-copy{
  position:absolute;
  z-index:4;
  top:5svh;
  left:var(--text-x);
  right:var(--pad);
  text-transform:uppercase;
}
.strap{
  margin:0 0 2svh;
  width:max-content;
  max-width:14ch;
  padding:.34em .42em .26em;
  background:var(--ink);
  color:var(--bone);
  font-size:clamp(13px,3.7vw,20px);
  line-height:.9;
  letter-spacing:.1em;
}
.name{
  margin:0;
  font-family:"Teko","Arial Narrow",sans-serif;
  font-weight:700;
  font-size:clamp(56px,15vw,126px);
  line-height:.72;
  letter-spacing:-.045em;
}
.name span{display:block}
.lead{
  position:absolute;
  z-index:4;
  left:calc(var(--text-x) + 8vw);
  right:var(--pad);
  bottom:3.2svh;
  margin:0;
  font-size:clamp(13px,3.6vw,19px);
  line-height:1;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.hero::after{
  content:"BAJO · ONLINE";
  position:absolute;
  z-index:4;
  top:4svh;
  right:calc(var(--pad) * .55);
  writing-mode:vertical-rl;
  transform:rotate(180deg);
  font-size:11px;
  letter-spacing:.24em;
  line-height:1;
}
.journey-label{
  position:absolute;
  z-index:5;
  top:1.8svh;
  left:var(--text-x);
  right:var(--pad);
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  padding-bottom:.7svh;
  border-bottom:1px solid var(--ink);
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
}
.level-marquee{
  position:absolute;
  z-index:2;
  inset:0;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
  touch-action:pan-x;
}
.level-marquee::-webkit-scrollbar{display:none}
.level-track{
  height:100%;
  width:max-content;
  display:flex;
  align-items:center;
  gap:0;
  counter-reset:level;
  padding-left:var(--text-x);
  padding-right:calc(100vw - var(--text-x) - var(--item-w));
}
.level-item{
  flex:0 0 var(--item-w);
  width:var(--item-w);
  min-height:2.1em;
  scroll-snap-align:start;
  counter-increment:level;
  scroll-snap-stop:always;
  display:flex;
  align-items:center;
  position:relative;
  padding:2.2svh 18px 0 0;
  font-family:"Teko","Arial Narrow",sans-serif;
  font-weight:700;
  font-size:clamp(31px,8.8vw,56px);
  line-height:.8;
  letter-spacing:-.025em;
  text-transform:uppercase;
  white-space:normal;
}
.level-item::before{
  content:"0" counter(level);
  position:absolute;
  top:.1svh;
  left:0;
  font-family:"Bebas Neue","Arial Narrow",sans-serif;
  font-size:11px;
  line-height:1;
  letter-spacing:.14em;
}
.level-item::after{
  content:"";
  position:absolute;
  right:0;
  top:22%;
  bottom:16%;
  width:1px;
  background:var(--ink);
  opacity:.28;
}
.level-item:last-child::after{display:none}
.level-dots{
  position:absolute;
  z-index:6;
  left:var(--text-x);
  bottom:1.5svh;
  display:flex;
  align-items:center;
  gap:9px;
}
.level-dot{
  appearance:none;
  width:7px;
  height:7px;
  padding:0;
  border:0;
  border-radius:50%;
  background:rgba(14,14,11,.22);
  transition:transform .15s ease,background .15s ease;
}
.level-dot[aria-current="true"]{
  background:var(--ink);
  transform:scale(1.18);
}
.contact{
  position:relative;
  min-height:66svh;
  overflow:hidden;
  background:var(--ink);
  color:var(--bone);
  padding:7svh var(--pad) var(--pad);
  display:flex;
  flex-direction:column;
}
.contact-kicker{
  margin:0 0 3svh;
  max-width:24ch;
  font-size:clamp(13px,3.5vw,19px);
  line-height:.95;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.wa{
  display:block;
  width:100%;
  max-width:680px;
  padding-top:.08em;
  overflow:visible;
  text-decoration:none;
  font-family:"Teko","Arial Narrow",sans-serif;
  font-weight:700;
  font-size:clamp(54px,15vw,126px);
  line-height:.84;
  letter-spacing:-.035em;
  text-transform:uppercase;
}
.wa span{display:block}
.wa .last{font-size:.79em;letter-spacing:-.018em}
.band-marquee{
  width:calc(100% + (var(--pad) * 2));
  margin-left:calc(var(--pad) * -1);
  margin-top:auto;
  overflow:hidden;
  border-top:1px solid rgba(238,229,210,.42);
  border-bottom:1px solid rgba(238,229,210,.42);
  padding:1.6svh 0;
}
.band-track{
  display:flex;
  width:max-content;
  will-change:transform;
  animation:bandLoop 46s linear infinite;
}
.band-set{
  display:flex;
  align-items:center;
  gap:clamp(34px,7vw,88px);
  padding-right:clamp(34px,7vw,88px);
  flex:none;
}
.band-logo{
  height:clamp(32px,5.5vw,54px);
  min-width:clamp(88px,16vw,180px);
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
}
.band-logo img{
  display:block;
  height:100%;
  width:auto;
  max-width:clamp(110px,19vw,220px);
  object-fit:contain;
  filter:grayscale(1) brightness(0) invert(94%) sepia(9%) saturate(520%) hue-rotate(342deg) brightness(103%) contrast(92%);
  opacity:.92;
}
.band-logo[data-name="RHCP"] img{max-width:clamp(46px,7vw,66px)}
.band-logo[data-name="The Who"] img{max-width:clamp(52px,8vw,78px)}
.band-logo.failed img{display:none}
.band-logo.failed::after{
  content:attr(data-name);
  font-size:clamp(22px,4vw,36px);
  letter-spacing:.08em;
  color:var(--bone);
  white-space:nowrap;
}
@keyframes bandLoop{to{transform:translate3d(-50%,0,0)}}
@media(prefers-reduced-motion:reduce){.band-track{animation:none}}
.contact-foot{
  margin:2.2svh 0 0;
  display:flex;
  justify-content:space-between;
  gap:18px;
  font-size:clamp(12px,3.2vw,17px);
  line-height:1;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.contact-foot span:last-child{text-align:right}
@media(max-width:360px){
  :root{--text-x:34vw;--item-w:51vw}
  .bass{left:-28vw;height:89svh}
  .name{font-size:14.5vw}
  .level-item{font-size:8.2vw}
  .wa{font-size:14.2vw}
}
@media(min-width:761px){
  :root{--pad:6vw;--text-x:30vw;--item-w:47vw}
  .hero{height:50svh}
  .journey{height:31svh}
  .bass{left:-10vw;height:85svh}
  .hero-copy{top:7svh}
  .strap{font-size:clamp(18px,1.8vw,28px)}
  .name{font-size:clamp(88px,10.5vw,164px)}
  .lead{bottom:3.6svh;font-size:clamp(16px,1.5vw,22px)}
  .level-item{font-size:clamp(48px,5.4vw,84px)}
  .contact{min-height:64svh;padding:8svh 6vw 4vw}
  .contact-kicker{font-size:clamp(16px,1.55vw,24px)}
  .wa{font-size:clamp(76px,9.4vw,145px)}
  .contact-foot{font-size:clamp(14px,1.25vw,20px)}
}
</style>
</head>
<body>
<!--
  Bass image: "Fender Jaguar Bass front.png" by Brian Reading, Wikimedia Commons.
  Source: https://commons.wikimedia.org/wiki/File:Fender_Jaguar_Bass_front.png
  License: CC BY-SA 4.0 / 3.0 / 2.5 / 2.0 / 1.0 and GFDL; displayed in grayscale via CSS.
-->
<main class="poster">
  <div class="stage">
    <section class="hero" aria-label="Agustín Pardo · clases particulares de bajo">
      <div class="hero-copy">
        <p class="strap">Clases particulares de bajo</p>
        <h1 class="name"><span>Agustín</span><span>Pardo</span></h1>
      </div>
      <p class="lead">Entrás donde estés.</p>
    </section>

    <section class="journey" aria-label="Recorrido de aprendizaje">
      <div class="journey-label" aria-hidden="true"><span>Recorrido</span><span>01—07</span></div>
      <div class="level-marquee" id="levelRail" aria-label="Deslizá para ver más">
        <div class="level-track">
          <span class="level-item">Elegir tu primer bajo</span>
          <span class="level-item">Empezar de cero</span>
          <span class="level-item">Primeras líneas</span>
          <span class="level-item">Tocar tu primer tema</span>
          <span class="level-item">Groove</span>
          <span class="level-item">Crear tus propias líneas</span>
          <span class="level-item">Improvisar</span>
        </div>
      </div>
      <div class="level-dots" id="levelDots" aria-label="Posición en las opciones">
        <button class="level-dot" aria-label="Elegir tu primer bajo" aria-current="true"></button>
        <button class="level-dot" aria-label="Empezar de cero" aria-current="false"></button>
        <button class="level-dot" aria-label="Primeras líneas" aria-current="false"></button>
        <button class="level-dot" aria-label="Tocar tu primer tema" aria-current="false"></button>
        <button class="level-dot" aria-label="Groove" aria-current="false"></button>
        <button class="level-dot" aria-label="Crear tus propias líneas" aria-current="false"></button>
        <button class="level-dot" aria-label="Improvisar" aria-current="false"></button>
      </div>
    </section>

    <img class="bass"
      src="https://upload.wikimedia.org/wikipedia/commons/6/6a/Fender_Jaguar_Bass_front.png"
      alt=""
      width="594"
      height="1709"
      decoding="async"
      fetchpriority="high"
      aria-hidden="true">
  </div>

  <section class="contact">
    <p class="contact-kicker">Agustín Pardo · clases particulares de bajo</p>
    <div class="wa" aria-label="Consultas por WhatsApp">
      <span>Hablame</span>
      <span class="last">por WhatsApp</span>
    </div>

    <div class="band-marquee" aria-label="Bandas y referencias musicales">
      <div class="band-track">
        <div class="band-set">
          <span class="band-logo" data-name="Rush"><img src="https://upload.wikimedia.org/wikipedia/commons/d/d9/Rush_logo.png" alt="Rush" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="RHCP"><img src="https://upload.wikimedia.org/wikipedia/commons/3/33/Red_Hot_Chili_Peppers_logo.png" alt="Red Hot Chili Peppers" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="Black Sabbath"><img src="https://upload.wikimedia.org/wikipedia/commons/0/0f/Black_Sabbath_%28Logo%2C_black%29.svg" alt="Black Sabbath" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="Led Zeppelin"><img src="https://upload.wikimedia.org/wikipedia/commons/a/a0/Led_Zeppelin_logo.png" alt="Led Zeppelin" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="The Who"><img src="https://cdn.freebiesupply.com/logos/large/2x/the-who-logo-png-transparent.png" alt="The Who" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="Primus"><img src="https://cdn.freebiesupply.com/logos/large/2x/primus-logo-png-transparent.png" alt="Primus" onerror="this.parentElement.classList.add('failed')"></span>
        </div>
        <div class="band-set" aria-hidden="true">
          <span class="band-logo" data-name="Rush"><img src="https://upload.wikimedia.org/wikipedia/commons/d/d9/Rush_logo.png" alt="" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="RHCP"><img src="https://upload.wikimedia.org/wikipedia/commons/3/33/Red_Hot_Chili_Peppers_logo.png" alt="" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="Black Sabbath"><img src="https://upload.wikimedia.org/wikipedia/commons/0/0f/Black_Sabbath_%28Logo%2C_black%29.svg" alt="" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="Led Zeppelin"><img src="https://upload.wikimedia.org/wikipedia/commons/a/a0/Led_Zeppelin_logo.png" alt="" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="The Who"><img src="https://cdn.freebiesupply.com/logos/large/2x/the-who-logo-png-transparent.png" alt="" onerror="this.parentElement.classList.add('failed')"></span>
          <span class="band-logo" data-name="Primus"><img src="https://cdn.freebiesupply.com/logos/large/2x/primus-logo-png-transparent.png" alt="" onerror="this.parentElement.classList.add('failed')"></span>
        </div>
      </div>
    </div>

    <div class="contact-foot">
      <span>100% online</span>
      <span>Bajo eléctrico</span>
    </div>
  </section>
</main>

<script>
const rail=document.getElementById("levelRail");
const items=[...document.querySelectorAll(".level-item")];
const dots=[...document.querySelectorAll(".level-dot")];

function cssPx(name){
  const raw=getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  if(raw.endsWith("vw")) return innerWidth*parseFloat(raw)/100;
  return parseFloat(raw)||0;
}
function target(i){
  return Math.max(0,(items[i]?.offsetLeft||0)-cssPx("--text-x"));
}
function nearest(){
  const x=rail.scrollLeft;
  let best=0,dist=Infinity;
  items.forEach((el,i)=>{
    const d=Math.abs(target(i)-x);
    if(d<dist){dist=d;best=i}
  });
  return best;
}
function setDot(i){
  dots.forEach((d,k)=>d.setAttribute("aria-current",k===i?"true":"false"));
}
function snap(i,smooth=true){
  rail.scrollTo({left:target(i),behavior:smooth?"smooth":"auto"});
  setDot(i);
}

let timer=null,raf=false;
let touchStartIndex=0;
let touchStartLeft=0;
let touching=false;

function finishTouch(){
  if(!touching) return;
  touching=false;
  clearTimeout(timer);

  const delta=rail.scrollLeft-touchStartLeft;
  const width=items[touchStartIndex]?.offsetWidth||innerWidth*.5;
  const threshold=Math.max(18,Math.min(48,width*.12));
  const step=Math.abs(delta)>=threshold?(delta>0?1:-1):0;
  const next=Math.max(0,Math.min(items.length-1,touchStartIndex+step));

  snap(next,true);
}

rail.addEventListener("scroll",()=>{
  if(!raf){
    raf=true;
    requestAnimationFrame(()=>{
      setDot(nearest());
      raf=false;
    });
  }
  if(touching) return;
  clearTimeout(timer);
  timer=setTimeout(()=>snap(nearest(),true),90);
},{passive:true});

rail.addEventListener("touchstart",()=>{
  touching=true;
  clearTimeout(timer);
  touchStartIndex=nearest();
  touchStartLeft=rail.scrollLeft;
},{passive:true});
rail.addEventListener("touchend",finishTouch,{passive:true});
rail.addEventListener("touchcancel",finishTouch,{passive:true});

dots.forEach((d,i)=>d.addEventListener("click",()=>snap(i,true)));
addEventListener("resize",()=>snap(nearest(),false));
requestAnimationFrame(()=>snap(0,false));
</script>
</body>
</html>
