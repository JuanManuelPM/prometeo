<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe7d7">
<title>Agustín Pardo — Clases de bajo online</title>
<meta name="description" content="Clases particulares de bajo online con Agustín Pardo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=League+Gothic&display=swap" rel="stylesheet">
<style>
:root{--ink:#11100e;--bone:#efe7d7;--sand:#b8a486;--pad:clamp(16px,4vw,56px)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;max-width:100%;overflow-x:clip;background:var(--bone);color:var(--ink)}
html{overscroll-behavior-x:none}
body{min-height:100%;font-family:"League Gothic","Arial Narrow",sans-serif;touch-action:pan-y}
img{display:block;max-width:100%}
a{color:inherit}
.poster-run{position:relative;width:100%;max-width:100%;height:286svh;overflow:clip;background:var(--bone);isolation:isolate}
.bass-layer{position:sticky;top:0;width:100%;height:100svh;overflow:clip;z-index:1;pointer-events:none}
.bass-photo{position:absolute;height:118svh;width:auto;max-width:none;left:-8vw;top:-7svh;transform:rotate(-12deg);transform-origin:48% 50%;filter:grayscale(1) contrast(1.45) brightness(.56);mix-blend-mode:multiply;opacity:.97;user-select:none}
.copy{position:absolute;z-index:2;right:var(--pad);width:min(53vw,780px);text-transform:uppercase}
.copy p,.copy h1,.copy h2{margin:0}
.copy--name{top:7svh}
.kicker{font-size:clamp(18px,2vw,30px);letter-spacing:.13em;line-height:.9;margin-bottom:2.5svh!important}
h1{font-family:"Archivo Black",Impact,sans-serif;font-size:clamp(68px,10.7vw,174px);line-height:.77;letter-spacing:-.075em;max-width:6ch}
h1 span{display:block}
.online-mark{display:inline-block;margin-top:4svh!important;padding:.16em .22em .11em;background:var(--ink);color:var(--bone);font-size:clamp(33px,4.4vw,68px);line-height:.85;letter-spacing:.04em}
.copy--classes{top:113svh}
.copy--classes .overline{font-size:clamp(18px,1.8vw,27px);letter-spacing:.13em;margin-bottom:2svh!important}
h2{font-family:"Archivo Black",Impact,sans-serif;font-size:clamp(61px,8.6vw,138px);line-height:.78;letter-spacing:-.07em}
h2 span{display:block}
h2 .sand{color:var(--sand)}
.copy--bass{top:203svh;width:min(58vw,850px)}
.word-bajo{font-family:"Archivo Black",Impact,sans-serif;font-size:clamp(96px,18vw,290px);line-height:.66;letter-spacing:-.085em}
.copy--bass .only{margin-top:4svh!important;font-size:clamp(31px,4vw,62px);line-height:.84;max-width:9ch}
.sand-field{position:absolute;z-index:0;top:176svh;right:0;width:58%;height:57svh;background:var(--sand)}
.contact{position:relative;width:100%;max-width:100%;min-height:94svh;overflow:clip;background:var(--ink);color:var(--bone);padding:var(--pad);display:flex;flex-direction:column;justify-content:center}
.contact-inner{width:min(900px,86%);margin-left:auto;position:relative;z-index:1}
.contact small{display:block;margin-bottom:2.2svh;font-size:clamp(17px,1.8vw,27px);letter-spacing:.13em;text-transform:uppercase}
.wa{display:inline-block;max-width:100%;text-decoration:none;font-family:"Archivo Black",Impact,sans-serif;font-size:clamp(48px,8.5vw,138px);line-height:.8;letter-spacing:-.065em;text-transform:uppercase;border-bottom:clamp(3px,.35vw,6px) solid currentColor;padding-bottom:.12em}
.wa span{display:block}
.contact-meta{position:absolute;left:var(--pad);bottom:var(--pad);font-size:clamp(15px,1.5vw,22px);letter-spacing:.13em;text-transform:uppercase}
.contact:before{content:"ONLINE";position:absolute;left:-.04em;bottom:-.18em;font-family:"Archivo Black",Impact,sans-serif;font-size:clamp(145px,30vw,520px);line-height:.76;letter-spacing:-.08em;color:var(--sand);opacity:.13;white-space:nowrap}
@media (max-width:760px){
:root{--pad:18px}
.poster-run{height:272svh}
.bass-photo{height:106svh;left:-25vw;top:-2svh;transform:rotate(-10deg);filter:grayscale(1) contrast(1.55) brightness(.52)}
.copy{right:18px;width:57vw}
.copy--name{top:6svh}
.kicker{font-size:15px;max-width:13ch;margin-bottom:2svh!important}
h1{font-size:clamp(54px,17.8vw,92px);line-height:.79;max-width:5.1ch}
.online-mark{margin-top:3svh!important;font-size:clamp(28px,8.5vw,42px)}
.copy--classes{top:102svh;width:60vw}
.copy--classes .overline{font-size:14px}
h2{font-size:clamp(52px,15.5vw,78px);line-height:.8}
.sand-field{top:167svh;width:64%;height:50svh}
.copy--bass{top:190svh;width:62vw}
.word-bajo{font-size:clamp(92px,27vw,138px)}
.copy--bass .only{margin-top:3svh!important;font-size:clamp(28px,8vw,40px)}
.contact{min-height:88svh;padding:18px 18px 74px}
.contact-inner{width:78%}
.contact small{font-size:14px;max-width:18ch}
.wa{font-size:clamp(44px,14vw,72px);line-height:.82}
.contact-meta{left:18px;bottom:22px;font-size:12px}
}
@media (max-width:390px){
.bass-photo{left:-31vw;height:103svh}
.copy{width:59vw}
h1{font-size:17vw}
h2{font-size:14.6vw}
}
</style>
</head>
<body>
<!--
  Visual asset: "Baixo yamahax.PNG" by Tyreonx, Wikimedia Commons.
  Public domain. Original: https://upload.wikimedia.org/wikipedia/commons/4/4d/Baixo_yamahax.PNG
  Source/license: https://commons.wikimedia.org/wiki/File:Baixo_yamahax.PNG
-->
<main>
<section class="poster-run" aria-label="Agustín Pardo, clases particulares de bajo online">
<div class="bass-layer" aria-hidden="true">
<img class="bass-photo" src="https://upload.wikimedia.org/wikipedia/commons/4/4d/Baixo_yamahax.PNG" alt="" width="167" height="571" decoding="async" fetchpriority="high">
</div>
<div class="copy copy--name">
<p class="kicker">Clases particulares de bajo</p>
<h1><span>Agustín</span><span>Pardo</span></h1>
<p class="online-mark">Online</p>
</div>
<div class="copy copy--classes">
<p class="overline">Bajo eléctrico</p>
<h2><span>Clases</span><span class="sand">particulares</span><span>de bajo</span></h2>
</div>
<div class="sand-field" aria-hidden="true"></div>
<div class="copy copy--bass">
<p class="word-bajo">BAJO</p>
<p class="only">Clases 100% virtuales</p>
</div>
</section>
<section class="contact">
<div class="contact-inner">
<small>Agustín Pardo · clases particulares de bajo · online</small>
<a class="wa" id="whatsappLink" href="#" rel="noopener">
<span>Hablame</span>
<span>por WhatsApp ↗</span>
</a>
</div>
<div class="contact-meta">Clases online</div>
</section>
</main>
<script>
const WHATSAPP_URL = "[PEGAR_LINK_DE_WHATSAPP]";
const whatsappLink = document.getElementById("whatsappLink");
const hasWhatsapp = /^https?:\/\//i.test(WHATSAPP_URL);
whatsappLink.href = hasWhatsapp ? WHATSAPP_URL : "#";
whatsappLink.setAttribute("aria-label", hasWhatsapp ? "Hablar con Agustín Pardo por WhatsApp" : "WhatsApp pendiente de configurar");
if (!hasWhatsapp) whatsappLink.addEventListener("click", event => event.preventDefault());
</script>
</body>
</html>
