<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eee5d2">
<title>Agustín Pardo — Clases de bajo online</title>
<meta name="description" content="Clases particulares de bajo online con Agustín Pardo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Teko:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d0d0b;
  --bone:#eee5d2;
  --sand:#b9aa8d;
  --pad:clamp(16px,4.6vw,34px);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  max-width:100vw;
  overflow-x:clip;
  background:var(--bone);
  color:var(--ink);
}
html{overscroll-behavior-x:none}
body{
  min-height:100%;
  font-family:"Bebas Neue","Arial Narrow",sans-serif;
  touch-action:pan-y;
}
a{color:inherit}
main,.poster{
  width:100%;
  max-width:100%;
  overflow:hidden;
}
.poster{
  position:relative;
  height:220svh;
  background:var(--bone);
  isolation:isolate;
}
.field-sand,
.field-black{
  position:absolute;
  left:0;
  right:0;
  z-index:0;
}
.field-sand{
  top:88svh;
  height:62svh;
  background:var(--sand);
}
.field-black{
  top:150svh;
  height:70svh;
  background:var(--ink);
}
.bass{
  position:absolute;
  z-index:2;
  top:0;
  left:-42vw;
  height:150svh;
  width:auto;
  max-width:none;
  object-fit:contain;
  object-position:left top;
  filter:grayscale(1) contrast(1.12);
  mix-blend-mode:multiply;
  pointer-events:none;
  user-select:none;
}
.top-copy{
  position:absolute;
  z-index:3;
  top:7svh;
  right:var(--pad);
  width:60vw;
  max-width:520px;
  text-transform:uppercase;
}
.strap{
  margin:0 0 2.2svh;
  font-size:clamp(14px,4vw,22px);
  line-height:.9;
  letter-spacing:.11em;
  max-width:15ch;
}
.name{
  margin:0;
  max-width:100%;
  font-family:"Teko","Arial Narrow",sans-serif;
  font-weight:700;
  font-size:clamp(62px,17vw,146px);
  line-height:.72;
  letter-spacing:-.045em;
}
.name span{display:block}
.online{
  margin:3svh 0 0;
  font-family:"Teko","Arial Narrow",sans-serif;
  font-weight:600;
  font-size:clamp(33px,8.7vw,70px);
  line-height:.8;
  letter-spacing:.045em;
}
.mid-copy{
  position:absolute;
  z-index:3;
  top:103svh;
  right:var(--pad);
  width:47vw;
  max-width:470px;
  text-transform:uppercase;
}
.mid-copy small{
  display:block;
  margin:0 0 1.3svh;
  font-size:clamp(13px,3.5vw,19px);
  letter-spacing:.12em;
}
.bajo{
  margin:0;
  max-width:100%;
  font-family:"Teko","Arial Narrow",sans-serif;
  font-weight:700;
  font-size:clamp(88px,24vw,198px);
  line-height:.65;
  letter-spacing:-.055em;
}
.mid-copy p:last-child{
  margin:2.4svh 0 0;
  font-size:clamp(22px,6vw,38px);
  line-height:.88;
  max-width:10ch;
}
.contact{
  position:absolute;
  z-index:3;
  top:150svh;
  left:0;
  width:100%;
  max-width:100%;
  height:70svh;
  overflow:hidden;
  color:var(--bone);
  padding:7svh var(--pad) var(--pad);
  display:flex;
  flex-direction:column;
}
.contact-kicker{
  margin:0 0 3svh;
  max-width:25ch;
  font-size:clamp(13px,3.5vw,19px);
  line-height:.95;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.wa{
  display:block;
  width:100%;
  max-width:680px;
  overflow:hidden;
  text-decoration:none;
  font-family:"Teko","Arial Narrow",sans-serif;
  font-weight:700;
  font-size:clamp(54px,15vw,126px);
  line-height:.72;
  letter-spacing:-.035em;
  text-transform:uppercase;
}
.wa span{
  display:block;
  width:100%;
  max-width:100%;
}
.wa .last{
  font-size:.79em;
  letter-spacing:-.018em;
}
.contact-foot{
  margin:auto 0 0;
  width:100%;
  display:flex;
  justify-content:space-between;
  gap:18px;
  font-size:clamp(12px,3.2vw,17px);
  line-height:1;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.contact-foot span:last-child{text-align:right}

@media (max-width:360px){
  .top-copy{width:61vw}
  .name{font-size:16.2vw}
  .mid-copy{width:46vw}
  .bajo{font-size:22.5vw}
  .wa{font-size:14.2vw}
}

@media (min-width:761px){
  .poster{height:205svh}
  .field-sand{top:82svh;height:58svh}
  .field-black{top:140svh;height:65svh}
  .bass{
    left:-10vw;
    height:140svh;
  }
  .top-copy{
    top:8svh;
    right:6vw;
    width:47vw;
  }
  .strap{font-size:clamp(18px,1.8vw,28px)}
  .name{font-size:clamp(88px,11.6vw,176px)}
  .online{font-size:clamp(44px,4.8vw,76px)}
  .mid-copy{
    top:96svh;
    right:6vw;
    width:46vw;
  }
  .mid-copy small{font-size:clamp(16px,1.55vw,24px)}
  .bajo{font-size:clamp(118px,16vw,248px)}
  .mid-copy p:last-child{font-size:clamp(27px,3.4vw,50px)}
  .contact{
    top:140svh;
    height:65svh;
    padding:8svh 6vw 4vw;
  }
  .contact-kicker{font-size:clamp(16px,1.55vw,24px)}
  .wa{font-size:clamp(76px,9.4vw,145px)}
  .contact-foot{font-size:clamp(14px,1.25vw,20px)}
}
</style>
</head>
<body>
<!--
  Bass image: "Tune fretless Bass.png" by 海獺, Wikimedia Commons.
  Source: https://commons.wikimedia.org/wiki/File:Tune_fretless_Bass.png
  License: CC BY-SA 4.0.
  The image is displayed vertically and converted to monochrome via CSS.
-->
<main>
<section class="poster" aria-label="Agustín Pardo · clases particulares de bajo online">
  <div class="field-sand" aria-hidden="true"></div>
  <div class="field-black" aria-hidden="true"></div>

  <img
    class="bass"
    src="https://upload.wikimedia.org/wikipedia/commons/6/6c/Tune_fretless_Bass.png"
    alt=""
    width="739"
    height="2048"
    decoding="async"
    fetchpriority="high">

  <div class="top-copy">
    <p class="strap">Clases particulares de bajo</p>
    <h1 class="name"><span>Agustín</span><span>Pardo</span></h1>
    <p class="online">100% online</p>
  </div>

  <div class="mid-copy">
    <small>Bajo eléctrico</small>
    <p class="bajo">BAJO</p>
    <p>Clases online, uno a uno</p>
  </div>

  <div class="contact">
    <p class="contact-kicker">Agustín Pardo · clases particulares de bajo</p>
    <a class="wa" id="whatsappLink" href="#" rel="noopener">
      <span>Hablame</span>
      <span class="last">por WhatsApp ↗</span>
    </a>
    <div class="contact-foot">
      <span>100% online</span>
      <span>Bajo eléctrico</span>
    </div>
  </div>
</section>
</main>

<script>
const WHATSAPP_URL = "[PEGAR_LINK_DE_WHATSAPP]";
const whatsappLink = document.getElementById("whatsappLink");
const ready = /^https?:\/\//i.test(WHATSAPP_URL);
whatsappLink.href = ready ? WHATSAPP_URL : "#";
whatsappLink.setAttribute(
  "aria-label",
  ready
    ? "Hablar con Agustín Pardo por WhatsApp"
    : "WhatsApp pendiente de configurar"
);
if (!ready) {
  whatsappLink.addEventListener("click", event => event.preventDefault());
}
</script>
</body>
</html>
