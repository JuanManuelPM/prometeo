<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Exámenes paralelos</title>
<style>
:root{--bg:#f4f0e7;--ink:#111;--muted:#756f66;--soft:#d7d0c4;--paper:#fffdfa}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100dvh}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--ink)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;padding:14px 16px 11px}
.title{font-weight:1000;font-size:clamp(28px,5vw,54px);letter-spacing:-.06em;line-height:.9}
.run{font-size:10px;font-weight:950;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.stats{text-align:right;font-variant-numeric:tabular-nums}
.mainstat{font-weight:1000;font-size:clamp(24px,4vw,40px);letter-spacing:-.05em}
.substat{font-size:10px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.workers{display:flex;gap:7px;overflow:auto;scrollbar-width:none;padding:7px 10px;border-top:1px solid var(--soft)}
.workers::-webkit-scrollbar{display:none}
.worker{display:flex;align-items:center;gap:6px;border:2px solid var(--ink);padding:6px 8px;white-space:nowrap;font-size:11px;font-weight:950}
.dot{width:8px;height:8px;border-radius:50%;border:2px solid var(--ink)}
.worker.writing .dot{background:var(--ink);animation:pulse .8s infinite alternate}
.worker.done{opacity:.48}
.empty{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
main{padding:10px 10px 42px;display:flex;flex-direction:column;gap:10px}
.exam{border:2px solid var(--ink);background:var(--paper)}
.examhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 10px;border-bottom:2px solid var(--ink)}
.examtitle{display:flex;align-items:baseline;gap:10px}
.examno{font-size:26px;font-weight:1000;letter-spacing:-.05em}
.owner{font-size:12px;font-weight:950}
.owner.free{color:var(--muted)}
.progress{font-size:10px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.questions{display:grid;grid-template-columns:repeat(var(--qcount,5),minmax(0,1fr))}
.q{min-height:148px;padding:10px 10px 12px;border-right:1px solid var(--soft);cursor:default;overflow:hidden;position:relative}
.q:last-child{border-right:0}
.q.published{cursor:pointer}
.q.writing{background:var(--ink);color:var(--bg)}
.q.rejected::after{content:"AJUSTANDO";position:absolute;right:8px;bottom:7px;font-size:9px;font-weight:1000;letter-spacing:.09em}
.qhead{display:flex;justify-content:space-between;gap:8px;font-size:9px;font-weight:1000;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.q.writing .qhead{color:#aaa59d}
.body{margin-top:11px}
.state{font-size:clamp(16px,1.7vw,24px);font-weight:900;line-height:1.04;letter-spacing:-.025em}
.q.pending .state{color:var(--soft);font-size:30px}
.preview{margin-top:8px;font-size:12px;line-height:1.25;font-weight:700;color:#4d4943;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.metrics{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;font-size:10px;font-weight:950;font-variant-numeric:tabular-nums}
.q.writing .metrics{color:#c7c1b8}
.dots span{display:inline-block;animation:blink 1s infinite both}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
.badge{position:fixed;right:10px;bottom:10px;background:var(--ink);color:var(--bg);padding:7px 9px;font-size:9px;font-weight:1000;letter-spacing:.09em;text-transform:uppercase;z-index:30}
dialog{width:min(820px,calc(100vw - 20px));max-height:88dvh;border:2px solid var(--ink);padding:0;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.modalhead{position:sticky;top:0;background:var(--paper);display:flex;justify-content:space-between;gap:14px;align-items:center;padding:12px 14px;border-bottom:2px solid var(--ink)}
.modaltitle{font-size:18px;font-weight:1000}
.close{border:2px solid var(--ink);background:var(--ink);color:var(--paper);font:inherit;font-weight:1000;padding:7px 10px;cursor:pointer}
.modalmeta{padding:10px 14px;border-bottom:1px solid var(--soft);font-size:11px;font-weight:900}
.modalanswer{padding:18px 16px 26px;font-size:16px;line-height:1.5;white-space:pre-wrap}
@keyframes pulse{from{opacity:.3}to{opacity:1}}
@keyframes blink{0%,25%{opacity:.25}65%,100%{opacity:1}}
@media(max-width:900px){
 .questions{grid-template-columns:1fr}
 .q{min-height:92px;border-right:0;border-bottom:1px solid var(--soft)}
 .q:last-child{border-bottom:0}
 .preview{-webkit-line-clamp:2}
}
@media(max-width:600px){
 .top{padding:11px 10px 9px}.title{font-size:31px}.mainstat{font-size:24px}
 main{padding:7px 7px 40px}.examhead{padding:7px 8px}.examno{font-size:22px}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div><div class="title" id="title">EXÁMENES</div><div class="run" id="runLabel"></div></div>
    <div class="stats">
      <div class="mainstat"><span id="published">0</span>/<span id="totalQ">0</span></div>
      <div class="substat"><span id="doneExams">0</span>/<span id="totalExams">0</span> terminados · <span id="words">0</span> palabras · <span id="totalTime">0 s</span></div>
    </div>
  </div>
  <div class="workers" id="workers"><div class="empty">Esperando chats…</div></div>
</header>
<main id="main"></main>
<div class="badge" id="badge">READY</div>
<dialog id="dialog">
  <div class="modalhead"><div class="modaltitle" id="modalTitle"></div><button class="close" id="close">CERRAR</button></div>
  <div class="modalmeta" id="modalMeta"></div>
  <div class="modalanswer" id="modalAnswer"></div>
</dialog>
<script>
const SUPABASE_URL='https://catnohyouxqjjtseaueb.supabase.co';
const KEY='sb_publishable_eqh3PngXs4UjLLWiY3pz1w_nhHtf7X-';
const RUN=new URLSearchParams(location.search).get('run')||'EXAM-10-02';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const $=id=>document.getElementById(id);
const main=$('main'),workersEl=$('workers'),dialog=$('dialog');
$('runLabel').textContent=RUN;
$('close').onclick=()=>dialog.close();
let D={run:null,workers:[],exams:[],questions:[],events:[]};
let sig='';
async function get(path){
 const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{headers:H,cache:'no-store'});
 if(!r.ok)throw new Error(r.status+' '+await r.text());
 return r.json();
}
function fmtMs(ms){if(ms==null)return '';if(ms<1000)return ms+' ms';return (ms/1000).toFixed(ms<10000?2:1)+' s'}
function age(ts){return ts?Math.max(0,Date.now()-new Date(ts).getTime()):0}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openAnswer(q){
 if(!q||q.status!=='PUBLISHED')return;
 $('modalTitle').textContent='Examen '+String(q.exam_no).padStart(2,'0')+' · Respuesta '+q.question_no;
 $('modalMeta').textContent=(q.word_count||0)+' palabras · '+(q.char_count||0)+' caracteres · '+fmtMs(q.elapsed_ms);
 $('modalAnswer').textContent=q.answer||'';
 dialog.showModal();
}
function renderWorkers(){
 if(!D.workers.length){workersEl.innerHTML='<div class="empty">Esperando chats…</div>';return}
 workersEl.innerHTML='';
 D.workers.forEach(w=>{
   const e=document.createElement('div');
   e.className='worker '+(w.status==='WRITING'?'writing ':'')+(w.status==='DONE'?'done':'');
   const ex=D.exams.find(x=>x.exam_no===w.exam_no);
   let label=w.exam_no?'E'+String(w.exam_no).padStart(2,'0'):'sin trabajo';
   if(w.status==='WRITING'&&ex)label+=' · R'+ex.current_question;
   if(w.status==='DONE')label+=' · ✓';
   e.innerHTML='<span class="dot"></span><b>'+esc(w.worker_code)+'</b><span>'+esc(label)+'</span>';
   workersEl.appendChild(e);
 });
}
function rejectionCount(exam,qn){
 return D.events.filter(e=>e.exam_no===exam&&e.question_no===qn&&e.event_type==='ANSWER_REJECTED_LENGTH').length;
}
function renderMain(){
 main.innerHTML='';
 const totalExams=D.run?.total_exams||10;
 const qCount=D.run?.questions_per_exam||5;
 $('title').textContent=totalExams+' EXÁMENES';
 for(let n=1;n<=totalExams;n++){
   const ex=D.exams.find(e=>e.exam_no===n);
   const box=document.createElement('section');box.className='exam';
   const done=D.questions.filter(q=>q.exam_no===n&&q.status==='PUBLISHED').length;
   box.innerHTML='<div class="examhead"><div class="examtitle"><span class="examno">'+String(n).padStart(2,'0')+'</span><span class="owner '+(!ex?.worker_code?'free':'')+'">'+esc(ex?.worker_code||'LIBRE')+'</span></div><div class="progress">'+done+'/'+qCount+'</div></div>';
   const qs=document.createElement('div');qs.className='questions';qs.style.setProperty('--qcount',qCount);
   for(let qn=1;qn<=qCount;qn++){
     const q=D.questions.find(x=>x.exam_no===n&&x.question_no===qn);
     const st=q?.status||'PENDING';
     const rejects=rejectionCount(n,qn);
     const cell=document.createElement('div');
     cell.className='q '+st.toLowerCase()+(rejects&&st==='WRITING'?' rejected':'');
     let state='○',preview='',metrics='';
     if(st==='WRITING'){
       state=rejects?'reajustando longitud<span class="dots"><span>.</span><span>.</span><span>.</span></span>':'escribiendo<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
       metrics='<span>'+fmtMs(age(q.started_at))+'</span><span>'+q.min_words+'–'+q.max_words+' palabras</span>';
     }else if(st==='PUBLISHED'){
       state='publicado ✓';
       preview='<div class="preview">'+esc(q.answer||'')+'</div>';
       metrics='<span>'+q.word_count+' palabras</span><span>'+q.char_count+' caracteres</span><span>'+fmtMs(q.elapsed_ms)+'</span>';
     }else{
       metrics='<span>'+(q?.min_words||'')+'–'+(q?.max_words||'')+' palabras</span>';
     }
     cell.innerHTML='<div class="qhead"><span>respuesta '+qn+'</span><span>'+st.toLowerCase()+'</span></div><div class="body"><div class="state">'+state+'</div>'+preview+'<div class="metrics">'+metrics+'</div></div>';
     if(st==='PUBLISHED')cell.onclick=()=>openAnswer(q);
     qs.appendChild(cell);
   }
   box.appendChild(qs);main.appendChild(box);
 }
}
function renderStats(){
 const run=D.run;
 const total=(run?.total_exams||0)*(run?.questions_per_exam||0);
 const pub=D.questions.filter(q=>q.status==='PUBLISHED');
 $('published').textContent=pub.length;
 $('totalQ').textContent=total;
 $('doneExams').textContent=D.exams.filter(e=>e.status==='DONE').length;
 $('totalExams').textContent=run?.total_exams||0;
 $('words').textContent=pub.reduce((a,q)=>a+(q.word_count||0),0).toLocaleString('es-AR');
 let elapsed=0;if(run?.started_at)elapsed=new Date(run.finished_at||Date.now())-new Date(run.started_at);
 $('totalTime').textContent=fmtMs(Math.max(0,elapsed));
 $('badge').textContent=run?.status||'READY';
}
function render(){renderWorkers();renderMain();renderStats()}
async function tick(){
 try{
  const [runs,workers,exams,questions,events]=await Promise.all([
   get('exam_lab_runs?run_id=eq.'+encodeURIComponent(RUN)+'&select=*'),
   get('exam_lab_workers?run_id=eq.'+encodeURIComponent(RUN)+'&select=*&order=joined_at.asc'),
   get('exam_lab_exams?run_id=eq.'+encodeURIComponent(RUN)+'&select=*&order=exam_no.asc'),
   get('exam_lab_questions?run_id=eq.'+encodeURIComponent(RUN)+'&select=*&order=exam_no.asc,question_no.asc'),
   get('exam_lab_events?run_id=eq.'+encodeURIComponent(RUN)+'&select=*&order=event_id.asc')
  ]);
  D={run:runs[0]||null,workers,exams,questions,events};
  const s=JSON.stringify([D.run?.status,D.run?.started_at,D.run?.finished_at,workers.map(w=>[w.worker_code,w.status]),exams.map(e=>[e.exam_no,e.status,e.worker_code,e.current_question]),questions.map(q=>[q.exam_no,q.question_no,q.status,q.word_count,q.char_count,q.elapsed_ms]),events.filter(e=>e.event_type==='ANSWER_REJECTED_LENGTH').map(e=>e.event_id)]);
  if(s!==sig){sig=s;render()}else renderStats();
 }catch(e){$('badge').textContent='REINTENTANDO'}
}
tick();setInterval(tick,500);setInterval(()=>{if(D.questions.some(q=>q.status==='WRITING'))renderMain();renderStats()},250);
</script>
</body>
</html>
