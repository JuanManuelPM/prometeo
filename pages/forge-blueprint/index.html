<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cognitive Forge · 84</title>
<style>
:root{--bg:#f3efe6;--paper:#fffdf8;--ink:#111;--muted:#766f65;--soft:#d9d0c3}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100dvh}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--ink)}
.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;padding:13px 15px 10px}
.title{font-size:clamp(27px,5vw,52px);font-weight:1000;letter-spacing:-.06em;line-height:.9}
.sub{margin-top:6px;font-size:9px;font-weight:950;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.stats{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:clamp(21px,4vw,36px);font-weight:1000;letter-spacing:-.05em}
.small{font-size:9px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(8,1fr);border-top:1px solid var(--soft)}
.metric{text-align:center;padding:7px 4px;border-right:1px solid var(--soft)}
.metric:last-child{border-right:0}
.metric b{display:block;font-size:17px}
.metric span{display:block;font-size:8px;font-weight:1000;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
section{padding:10px}
.sectionTitle{font-size:10px;font-weight:1000;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:0 0 7px 2px}
.workers{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
.worker{border:2px solid var(--ink);background:var(--paper);padding:7px;min-height:79px;position:relative}
.wcode{font-size:17px;font-weight:1000}
.wstate{font-size:8px;font-weight:1000;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.wtask{font-size:9px;font-weight:900;color:var(--muted);margin-top:8px;line-height:1.2}
.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink);margin-right:4px;animation:pulse .8s infinite alternate}
.sectionBlock{margin-bottom:14px}
.sectionHead{display:flex;justify-content:space-between;align-items:end;border-bottom:2px solid var(--ink);padding:4px 2px 6px}
.sectionName{font-size:19px;font-weight:1000;letter-spacing:-.03em}
.sectionCount{font-size:9px;font-weight:950;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding-top:6px}
.point{border:2px solid var(--ink);background:var(--paper);min-height:146px;padding:8px 9px;cursor:pointer;position:relative}
.point:hover{transform:translateY(-1px)}
.pno{font-size:20px;font-weight:1000}
.ptitle{font-size:13px;font-weight:950;line-height:1.12;margin-top:7px}
.seed{font-size:10px;line-height:1.28;color:var(--muted);margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.phases{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-top:9px}
.phase{height:6px;background:#ddd4c7;border:1px solid #c8beaf}
.phase.done{background:var(--ink);border-color:var(--ink)}
.phase.live{animation:pulse .7s infinite alternate;background:#777}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;font-size:8px;font-weight:950;color:var(--muted)}
.gripAccent{position:absolute;right:7px;top:7px;width:28px;height:18px;pointer-events:none;z-index:4;animation:gripAccent .72s ease-out both}
.gripAccent::before,.gripAccent::after{content:"";position:absolute;top:2px;width:9px;height:14px;border:2px solid var(--ink)}
.gripAccent::before{left:0;border-right:0}
.gripAccent::after{right:0;border-left:0}
.gripAccent i{position:absolute;left:11px;top:6px;width:6px;height:6px;background:var(--ink)}
.gripAccent.deposit{transform:rotate(180deg)}
@keyframes gripAccent{0%{opacity:0;transform:scale(1.22)}18%{opacity:1;transform:scale(.88)}48%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.badge{position:fixed;right:9px;bottom:9px;background:var(--ink);color:var(--paper);padding:7px 9px;font-size:9px;font-weight:1000;letter-spacing:.1em;text-transform:uppercase;z-index:30}
dialog{width:min(960px,calc(100vw - 18px));max-height:90dvh;border:2px solid var(--ink);padding:0;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.46)}
.modalHead{position:sticky;top:0;background:var(--paper);display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 13px;border-bottom:2px solid var(--ink);z-index:2}
.modalTitle{font-size:19px;font-weight:1000}
.close{border:2px solid var(--ink);background:var(--ink);color:var(--paper);font:inherit;font-weight:1000;padding:7px 9px}
.modalMeta{padding:8px 13px;border-bottom:1px solid var(--soft);font-size:10px;font-weight:900}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--soft);overflow:auto}
.tab{border:0;border-right:1px solid var(--soft);background:transparent;padding:9px 10px;font:inherit;font-size:9px;font-weight:1000;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tab.active{background:var(--ink);color:var(--paper)}
.modalText{padding:16px 15px 28px;white-space:pre-wrap;font-size:14px;line-height:1.52}

.graphStage{border:2px solid var(--ink);background:var(--paper);padding:8px;overflow:hidden}
.graphLegend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:2px 2px 8px;font-size:8px;font-weight:1000;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.graphLegend i{display:inline-block;width:9px;height:9px;border:1.5px solid var(--ink);margin-right:4px;vertical-align:-1px;background:var(--paper)}
.graphLegend .done{background:var(--ink)}.graphLegend .leased{background:var(--muted)}.graphLegend .blocked{background:var(--soft);border-color:var(--soft)}
.graphSvg{display:block;width:100%;height:auto;background:var(--paper)}
.graphCell{fill:none;stroke:var(--soft);stroke-width:1}
.graphLabel{fill:var(--ink);font:1000 11px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.graphEdge{stroke:var(--soft);stroke-width:2}
.graphEdge.done{stroke:var(--ink)}
.graphJob{stroke:var(--ink);stroke-width:2;fill:var(--paper);cursor:pointer}
.graphJob.done{fill:var(--ink)}.graphJob.leased{fill:var(--muted);animation:pulse .7s infinite alternate}.graphJob.blocked{fill:var(--soft);stroke:var(--soft)}
.graphJob:hover{stroke-width:4}

@keyframes pulse{from{opacity:.3}to{opacity:1}}
@media(max-width:1000px){.metrics{grid-template-columns:repeat(4,1fr)}.metric:nth-child(-n+4){border-bottom:1px solid var(--soft)}.workers{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){
 .top{padding:11px 9px 8px}.title{font-size:30px}.metrics{grid-template-columns:repeat(4,1fr)}
 .workers{grid-template-columns:repeat(2,1fr)}
 section{padding:7px}.grid{grid-template-columns:1fr}.point{min-height:128px}
}
</style>
</head>
<body>
<header>
 <div class="top">
  <div><div class="title">BLUEPRINT · 84</div><div class="sub" id="bid"></div></div>
  <div class="stats"><div class="big"><span id="done">0</span>/84</div><div class="small"><span id="words">0</span> palabras canónicas</div></div>
 </div>
 <div class="metrics">
  <div class="metric"><b id="workersN">0/8</b><span>workers</span></div>
  <div class="metric"><b id="jobsDone">0</b><span>jobs done</span></div>
  <div class="metric"><b id="jobsTotal">420</b><span>jobs total</span></div>
  <div class="metric" id="progressMetric"><b id="progressW">0%</b><span>progreso pond.</span></div>
  <div class="metric"><b id="active">0</b><span>trabajando</span></div>
  <div class="metric"><b id="rescues">0</b><span>rescates</span></div>
  <div class="metric"><b id="elapsed">0 s</b><span>tiempo</span></div>
  <div class="metric" id="etaMetric"><b id="eta">—</b><span>ETA</span></div>
 </div>
</header>

<section>
 <div class="sectionTitle">Pool residente</div>
 <div class="workers" id="workers"></div>
</section>


<section>
 <div class="sectionTitle">Grafo físico central · 84 puntos × 5 jobs</div>
 <div class="graphStage">
  <div class="graphLegend"><span><i class="done"></i>done</span><span><i class="leased"></i>leased</span><span><i></i>ready</span><span><i class="blocked"></i>blocked</span></div>
  <svg id="jobGraph" class="graphSvg" viewBox="0 0 1000 1200" role="img" aria-label="Grafo físico de jobs y dependencias del Blueprint"></svg>
 </div>
</section>

<section id="sections"></section>

<div class="badge" id="badge">OPEN</div>
<dialog id="dialog">
 <div class="modalHead"><div class="modalTitle" id="modalTitle"></div><button class="close" id="close">CERRAR</button></div>
 <div class="modalMeta" id="modalMeta"></div>
 <div class="tabs" id="tabs"></div>
 <div class="modalText" id="modalText"></div>
</dialog>

<script>
const URL='https://catnohyouxqjjtseaueb.supabase.co';
const KEY='sb_publishable_eqh3PngXs4UjLLWiY3pz1w_nhHtf7X-';
const BP=new URLSearchParams(location.search).get('blueprint')||'FORGE-BLUEPRINT-84-01';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const $=id=>document.getElementById(id);
$('bid').textContent=BP;
$('close').onclick=()=>$('dialog').close();
let D={project:null,points:[],jobs:[],outputs:[],workers:[]},signature='',jobState=new Map(),jobStatePrimed=false;

async function get(path){
 const r=await fetch(URL+'/rest/v1/'+path,{headers:H,cache:'no-store'});
 if(!r.ok)throw new Error(r.status+' '+await r.text());
 return r.json();
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(ms){if(!ms)return '0 s';const s=ms/1000;if(s<60)return s.toFixed(0)+' s';if(s<3600)return (s/60).toFixed(1)+' min';if(s<86400)return (s/3600).toFixed(1)+' h';return (s/86400).toFixed(1)+' d'}
function jobWeight(j){
 const lo=Number(j.min_words)||0,hi=Number(j.max_words)||0;
 return Math.max(1,lo&&hi?(lo+hi)/2:(hi||lo||1));
}
function estimator(){
 const total=D.jobs.reduce((a,j)=>a+jobWeight(j),0);
 const done=D.jobs.filter(j=>j.status==='DONE').reduce((a,j)=>a+jobWeight(j),0);
 const doneJobs=D.jobs.filter(j=>j.status==='DONE').length;
 const progress=total?Math.min(1,done/total):0;
 if(!total)return {progress:0,eta:null,ready:false};
 if(D.project?.status==='DONE'||done>=total)return {progress:1,eta:0,ready:true};
 if(!D.project?.started_at||doneJobs<3||done<=0)return {progress,eta:null,ready:false};
 const elapsed=Math.max(1,Date.now()-new Date(D.project.started_at).getTime());
 const rate=done/elapsed;
 const eta=rate>0?(total-done)/rate:null;
 return {progress,eta,ready:Number.isFinite(eta)};
}
function phaseName(p){return ['','Arquitectura','Desarrollo','Adversarial','Canónico','Aprendizaje'][p]}
function renderWorkers(){
 const root=$('workers');root.innerHTML='';
 for(let i=1;i<=8;i++){
  const code='K'+String(i).padStart(3,'0'),w=D.workers.find(x=>x.worker_code===code);
  const live=w&&['WAITING','WORKING'].includes(w.status);
  const task=w?.status==='WORKING'?'P'+String(w.current_point_no).padStart(2,'0')+' · '+phaseName(w.current_phase):(w?.status==='WAITING'?'esperando':(w?.status==='DONE'?'terminado':'—'));
  const c=document.createElement('div');c.className='worker';c.dataset.worker=code;
  c.innerHTML='<div class="wcode">'+code+'</div><div class="wstate '+(live?'live':'')+'">'+(w?.status||'offline')+'</div><div class="wtask">'+esc(task)+'</div>';
  root.appendChild(c);
 }
}
function pointJobs(n){return D.jobs.filter(j=>j.point_no===n).sort((a,b)=>a.phase-b.phase)}
function pointOutputs(n){return D.outputs.filter(o=>o.point_no===n).sort((a,b)=>a.phase-b.phase)}
function renderPoints(){
 const root=$('sections');root.innerHTML='';
 const sections=[...new Set(D.points.map(p=>p.section))];
 sections.forEach(sec=>{
  const pts=D.points.filter(p=>p.section===sec);
  const done=pts.filter(p=>p.status==='DONE').length;
  const block=document.createElement('div');block.className='sectionBlock';
  block.innerHTML='<div class="sectionHead"><div class="sectionName">'+esc(sec)+'</div><div class="sectionCount">'+done+'/'+pts.length+' completos</div></div><div class="grid"></div>';
  const grid=block.querySelector('.grid');
  pts.forEach(p=>{
   const jobs=pointJobs(p.point_no),outs=pointOutputs(p.point_no);
   const c=document.createElement('div');c.className='point';c.dataset.point=String(p.point_no);
   c.innerHTML='<div class="pno">'+String(p.point_no).padStart(2,'0')+'</div><div class="ptitle">'+esc(p.title)+'</div><div class="seed">'+esc(p.seed_text)+'</div>'+
    '<div class="phases">'+jobs.map(j=>'<span class="phase '+(j.status==='DONE'?'done':j.status==='LEASED'?'live':'')+'"></span>').join('')+'</div>'+
    '<div class="meta"><span>'+outs.reduce((a,o)=>a+(o.word_count||0),0).toLocaleString('es-AR')+' palabras</span><span>'+p.status+'</span></div>';
   c.onclick=()=>openPoint(p.point_no);
   grid.appendChild(c);
  });
  root.appendChild(block);
 });
}
async function openPoint(n,phase=4){
 const p=D.points.find(x=>x.point_no===n),outs=pointOutputs(n);
 $('modalTitle').textContent=String(n).padStart(2,'0')+' · '+p.title;
 $('modalMeta').textContent=p.section+' · '+p.status+(p.canonical_words?' · canónico '+p.canonical_words+' palabras':'');
 const tabs=$('tabs');tabs.innerHTML='';
 const seed=document.createElement('button');seed.className='tab '+(phase===0?'active':'');seed.textContent='Semilla';seed.onclick=()=>openPoint(n,0);tabs.appendChild(seed);
 for(let i=1;i<=5;i++){
  const o=outs.find(x=>x.phase===i),b=document.createElement('button');
  b.className='tab '+(phase===i?'active':'');b.textContent=phaseName(i)+(o?' · '+o.word_count+'p':'');
  b.disabled=!o;b.onclick=()=>openPoint(n,i);tabs.appendChild(b);
 }
 if(phase===0){$('modalText').textContent=p.seed_text}
 else{
  let o=outs.find(x=>x.phase===phase);
  if(!o){
   const rows=await get('blueprint_outputs?blueprint_id=eq.'+encodeURIComponent(BP)+'&point_no=eq.'+n+'&phase=eq.'+phase+'&select=*');
   o=rows[0];
  } else {
   const rows=await get('blueprint_outputs?blueprint_id=eq.'+encodeURIComponent(BP)+'&point_no=eq.'+n+'&phase=eq.'+phase+'&select=output_text,meta,worker_code,word_count,elapsed_ms');
   if(rows[0])o={...o,...rows[0]};
  }
  $('modalText').textContent=o?.output_text||'Todavía no producido.';
 }
 if(!$('dialog').open)$('dialog').showModal();
 history.replaceState(null,'',location.pathname+'?blueprint='+encodeURIComponent(BP)+'&point='+n);
}

const SVGNS='http://www.w3.org/2000/svg';
function svg(tag,attrs={}){const n=document.createElementNS(SVGNS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);return n}
function renderGraph(){
 const root=$('jobGraph');root.innerHTML='';
 const pts=[...D.points].sort((a,b)=>a.point_no-b.point_no);
 const cols=6,cellW=160,cellH=82,ox=20,oy=24;
 pts.forEach((p,i)=>{
  const col=i%cols,row=Math.floor(i/cols),x=ox+col*cellW,y=oy+row*cellH;
  const g=svg('g',{'data-point':p.point_no});
  g.appendChild(svg('rect',{x,y,width:148,height:70,rx:0,class:'graphCell'}));
  const label=svg('text',{x:x+8,y:y+15,class:'graphLabel'});label.textContent=String(p.point_no).padStart(2,'0');g.appendChild(label);
  const jobs=pointJobs(p.point_no);
  for(let phase=1;phase<=5;phase++){
   const j=jobs.find(v=>v.phase===phase);
   const nx=x+30+(phase-1)*25,ny=y+38;
   if(phase>1){
    const prev=jobs.find(v=>v.phase===phase-1);
    g.appendChild(svg('line',{x1:nx-13,y1:ny+6,x2:nx-1,y2:ny+6,class:'graphEdge '+(prev?.status==='DONE'?'done':'')}));
   }
   const cls='graphJob '+String(j?.status||'BLOCKED').toLowerCase();
   const node=svg('rect',{x:nx,y:ny,width:12,height:12,class:cls,tabindex:'0',role:'button','aria-label':String(p.point_no).padStart(2,'0')+' '+phaseName(phase)+' '+(j?.status||'BLOCKED')});
   const title=svg('title');title.textContent=String(p.point_no).padStart(2,'0')+' · '+p.title+' · '+phaseName(phase)+' · '+(j?.status||'BLOCKED');node.appendChild(title);
   node.addEventListener('click',()=>openPoint(p.point_no,phase));
   node.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPoint(p.point_no,phase)}});
   g.appendChild(node);
  }
  root.appendChild(g);
 });
}

function renderStats(){
 const p=D.project,done=D.points.filter(x=>x.status==='DONE').length;
 $('done').textContent=done;
 $('words').textContent=D.points.reduce((a,x)=>a+(x.canonical_words||0),0).toLocaleString('es-AR');
 $('workersN').textContent=D.workers.filter(x=>x.status!=='NO_WORK').length+'/'+(p?.expected_workers||8);
 $('jobsDone').textContent=D.jobs.filter(x=>x.status==='DONE').length;
 $('jobsTotal').textContent=D.jobs.length||420;
 const est=estimator(),pct=(est.progress*100).toFixed(1)+'%';
 $('progressW').textContent=pct;
 $('progressMetric').title='Ponderado por el midpoint de min_words/max_words de cada job; sólo DONE suma progreso.';
 $('eta').textContent=est.eta===0?'listo':(est.ready?fmt(est.eta):'—');
 $('etaMetric').title=est.ready?'ETA = presupuesto ponderado restante / throughput ponderado observado desde started_at.':'ETA aparece después de al menos 3 jobs DONE.';
 $('active').textContent=D.jobs.filter(x=>x.status==='LEASED').length;
 $('rescues').textContent=D.jobs.reduce((a,x)=>a+(x.rescue_count||0),0);
 let ms=0;if(p?.started_at)ms=new Date(p.finished_at||Date.now())-new Date(p.started_at);
 $('elapsed').textContent=fmt(ms);$('badge').textContent=p?.status||'OPEN';
}
function render(){renderWorkers();renderGraph();renderPoints();renderStats()}
function importantGripJob(j){return Number(j?.phase)>=4}
function collectGripEvents(jobs){
 const next=new Map(),events=[];
 for(const j of jobs){
  const key=j.point_no+':'+j.phase;
  const cur={status:j.status,worker:j.assigned_worker_code,point:j.point_no,phase:j.phase};
  next.set(key,cur);
  const prev=jobState.get(key);
  if(jobStatePrimed&&prev&&importantGripJob(j)&&prev.status!==cur.status){
   if(cur.status==='LEASED'&&cur.worker)events.push({mode:'take',worker:cur.worker,point:cur.point});
   if(prev.status==='LEASED'&&cur.status==='DONE')events.push({mode:'deposit',worker:prev.worker||cur.worker,point:cur.point});
  }
 }
 jobState=next;jobStatePrimed=true;return events;
}
function flashGrip(evt){
 const target=evt.mode==='take'
  ?document.querySelector('[data-worker="'+evt.worker+'"]')
  :document.querySelector('[data-point="'+evt.point+'"]');
 if(!target)return;
 target.querySelectorAll('.gripAccent').forEach(x=>x.remove());
 const mark=document.createElement('span');mark.className='gripAccent '+evt.mode;mark.setAttribute('aria-hidden','true');mark.innerHTML='<i></i>';
 target.appendChild(mark);setTimeout(()=>mark.remove(),760);
}
async function tick(){
 try{
  const [projects,points,jobs,outputs,workers]=await Promise.all([
   get('blueprint_projects?blueprint_id=eq.'+encodeURIComponent(BP)+'&select=*'),
   get('blueprint_points?blueprint_id=eq.'+encodeURIComponent(BP)+'&select=blueprint_id,point_no,section,title,seed_text,status,canonical_words,canonical_chars,completed_at&order=point_no.asc'),
   get('blueprint_jobs?blueprint_id=eq.'+encodeURIComponent(BP)+'&select=point_no,phase,phase_name,status,assigned_worker_code,is_rescue,rescue_count,lease_expires_at,min_words,max_words,started_at,completed_at&order=point_no.asc,phase.asc'),
   get('blueprint_outputs?blueprint_id=eq.'+encodeURIComponent(BP)+'&select=point_no,phase,worker_code,word_count,char_count,elapsed_ms,rescued,published_at&order=point_no.asc,phase.asc'),
   get('blueprint_workers?blueprint_id=eq.'+encodeURIComponent(BP)+'&select=*&order=worker_code.asc')
  ]);
  D={project:projects[0]||null,points,jobs,outputs,workers};
  const gripEvents=collectGripEvents(jobs);
  const s=JSON.stringify([D.project?.status,D.project?.finished_at,points.map(x=>[x.point_no,x.status,x.canonical_words]),jobs.map(x=>[x.point_no,x.phase,x.status,x.assigned_worker_code,x.rescue_count]),outputs.map(x=>[x.point_no,x.phase,x.word_count]),workers.map(x=>[x.worker_code,x.status,x.current_point_no,x.current_phase,x.jobs_done])]);
  if(s!==signature){signature=s;render()}else{renderWorkers();renderStats()}
  gripEvents.forEach(flashGrip);
  const selected=Number(new URLSearchParams(location.search).get('point'));
  if(selected&&!$('dialog').dataset.auto){$('dialog').dataset.auto='1';openPoint(selected,D.points.find(x=>x.point_no===selected)?.canonical_words?4:0)}
 }catch(e){$('badge').textContent='REINTENTANDO'}
}
tick();setInterval(tick,800);
</script>
</body>
</html>
