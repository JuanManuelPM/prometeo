<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#111326">
<title>Transcripción de clase</title>
<style>
:root{--bg:#111326;--ink:#D8D1FF;--line:color-mix(in srgb,var(--ink) 20%,transparent);--soft:color-mix(in srgb,var(--ink) 6%,transparent)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,"Century Gothic",system-ui,sans-serif}button{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer}.page{max-width:980px;margin:auto;padding:18px 18px 70px}.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start;padding-bottom:15px;border-bottom:1px solid var(--line)}.title small{font-size:7px;letter-spacing:.08em;text-transform:uppercase;opacity:.35}.title h1{font-size:clamp(20px,4vw,34px);line-height:1.03;letter-spacing:-.045em;margin:5px 0 0}.title p{font-size:8px;opacity:.42;margin:7px 0 0}.theme{width:29px;height:29px;border:1px solid var(--line);position:relative}.theme:before{content:"";position:absolute;inset:6px 14px 6px 6px;background:var(--ink)}.theme:after{content:"";position:absolute;inset:6px 6px 6px 14px;background:var(--bg);border:1px solid var(--ink)}.actions{display:flex;gap:5px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}.actions button{height:30px;padding:0 9px;border:1px solid var(--line);font-size:8px;font-weight:800}.actions button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-top:10px}.tabs button{padding:8px 0;font-size:8px;opacity:.4;position:relative}.tabs button.on{opacity:1;font-weight:850}.tabs button.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}.panel{display:none;padding-top:18px}.panel.on{display:block}.transcript{white-space:pre-wrap;font-size:12px;line-height:1.72;max-width:820px}.notes{white-space:pre-wrap;font-size:11px;line-height:1.65;max-width:760px}.empty{font-size:10px;opacity:.34}.foot{margin-top:42px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;font-size:7px;opacity:.28}.fatal{padding:28px;max-width:680px;margin:auto}.fatal b{font-size:13px}.fatal p{font-size:9px;opacity:.5}.busy{padding:28px;font-size:10px;opacity:.42}@media(max-width:620px){.page{padding:13px 12px 52px}.actions{display:grid;grid-template-columns:1fr 1fr}.actions button{height:34px}.actions button:last-child{grid-column:1/-1}.transcript{font-size:11px;line-height:1.64}.foot{display:block}.foot span{display:block;margin-top:4px}}
</style>
</head>
<body><main id="app"><div class="busy">cargando…</div></main>
<script>
(()=>{'use strict';
const API='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/study-transcript-share-v1';
const THEMES=[['noche','#111326','#D8D1FF'],['crema','#F5DABF','#6C151E'],['tinta','#111827','#D9E4FF'],['bosque','#10231C','#D8EED0'],['petroleo','#0C2630','#CDECF2'],['borgona','#2A1017','#F1D0C7'],['ciruela','#201427','#E9C8FF'],['papel','#F1E7D8','#241F1A']];let share=null,theme=0;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function applyTheme(){const t=THEMES[theme%THEMES.length];document.documentElement.style.setProperty('--bg',t[1]);document.documentElement.style.setProperty('--ink',t[2]);document.querySelector('meta[name="theme-color"]')?.setAttribute('content',t[1]);localStorage.setItem('study:share:theme',t[0])}
function promptFor(mode){const url=location.href.split('#')[0],task={clean:'Pasá esta clase en limpio como apuntes fieles y ordenados.',summary:'Hacé un resumen estructurado y breve sin perder conceptos importantes.',study:'Convertí esta clase en un apunte de estudio completo: explicación conectada, conceptos y definiciones, ejemplos del docente, relaciones, dudas y pendientes.'}[mode]||'';return `Abrí esta transcripción pública de una clase: ${url}\n\n${task}\nReglas: usá la transcripción y las notas de esa página como fuente principal; no inventes contenido que no aparezca; si algo es dudoso o inaudible marcá [dudoso/inaudible] en vez de completarlo; conservá fechas, nombres, ejemplos y consignas. Al final agregá una sección “Listo para pegar en notas” con texto limpio.`}
async function chat(mode){const p=promptFor(mode);try{await navigator.clipboard.writeText(p)}catch{}const w=window.open('about:blank','_blank');const url='https://chatgpt.com/?prompt='+encodeURIComponent(p);if(w)w.location.replace(url);else location.href=url}
async function copyText(){try{await navigator.clipboard.writeText(share.transcript||'');flash('copiado')}catch{flash('no pude copiar')}}
function download(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([share.transcript||''],{type:'text/plain;charset=utf-8'}));a.download=((share.title||'clase').replace(/[^a-z0-9áéíóúñ]+/gi,'-')||'clase')+'-transcripcion.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function flash(t){const b=$('#copy');if(!b)return;const old=b.textContent;b.textContent=t;setTimeout(()=>b.textContent=old,1100)}
function render(){const when=share.class_date?new Date(share.class_date+'T12:00:00').toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'}):'',snap=new Date(share.created_at).toLocaleString('es-AR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});$('#app').innerHTML=`<div class="page"><header class="top"><div class="title"><small>${esc(share.course_id||'clase')}</small><h1>${esc(share.title||'Transcripción')}</h1><p>${esc(when)} · copia ${esc(snap)}</p></div><button class="theme" id="theme" title="Color"></button></header><div class="actions"><button data-chat="clean">PASAR EN LIMPIO</button><button data-chat="summary">RESUMIR</button><button data-chat="study" class="primary">APUNTE DE ESTUDIO</button><button id="copy">COPIAR</button><button id="download">TXT</button></div><nav class="tabs"><button class="on" data-tab="transcript">transcripción</button><button data-tab="notes">notas compartidas</button></nav><section class="panel on transcript" data-panel="transcript">${esc(share.transcript||'')}</section><section class="panel notes" data-panel="notes">${share.shared_notes?esc(share.shared_notes):'<span class="empty">sin notas compartidas en esta copia</span>'}</section><footer class="foot"><span>público sólo con este link · no da acceso a la clase</span><span>vence ${esc(new Date(share.expires_at).toLocaleDateString('es-AR'))}</span></footer></div>`;$('#theme').onclick=()=>{theme=(theme+1)%THEMES.length;applyTheme()};document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>chat(b.dataset.chat));$('#copy').onclick=copyText;$('#download').onclick=download;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('[data-panel]').forEach(x=>x.classList.toggle('on',x.dataset.panel===b.dataset.tab))})}
async function init(){const saved=localStorage.getItem('study:share:theme'),i=THEMES.findIndex(t=>t[0]===saved);if(i>=0)theme=i;applyTheme();const s=new URLSearchParams(location.search).get('s');if(!s)return fail('Falta el link de la transcripción.');try{const r=await fetch(API+'?s='+encodeURIComponent(s),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'share');share=d.share;render()}catch(e){fail('Esta copia no está disponible o ya venció.')}}
function fail(text){$('#app').innerHTML=`<div class="fatal"><b>Transcripción no disponible</b><p>${esc(text)}</p></div>`}
init();
})();
</script></body></html>
