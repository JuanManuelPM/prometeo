.studyBoot15{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#111326;color:#d8d1ff;opacity:1;transition:opacity .22s ease;pointer-events:auto}.studyBoot15.done{opacity:0;pointer-events:none}.studyBootCore15{width:min(270px,68vw);display:grid;gap:12px}.studyBootMark15{font:600 11px/1 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;opacity:.68}.studyBootText15{font:500 13px/1.2 system-ui,sans-serif}.studyBootTrack15{height:2px;background:color-mix(in srgb,currentColor 18%,transparent);overflow:hidden}.studyBootTrack15 i{display:block;width:100%;height:100%;background:currentColor;transform-origin:left center;transform:scaleX(var(--p,.05));transition:transform .24s ease;position:relative}.studyBootTrack15 i:after{content:"";position:absolute;right:-12px;top:-4px;width:10px;height:10px;border-radius:50%;background:currentColor;opacity:.75;animation:studyPulse15 1s ease-in-out infinite}.studyTask15{position:fixed;z-index:99998;top:max(10px,env(safe-area-inset-top));left:50%;transform:translate(-50%,-8px);display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid currentColor;background:var(--bg,#111326);color:var(--ink,#d8d1ff);font:600 11px/1 system-ui,sans-serif;opacity:0;pointer-events:none;transition:opacity .16s ease,transform .16s ease}.studyTask15.show{opacity:.94;transform:translate(-50%,0)}.studyTask15 i{width:16px;height:2px;background:currentColor;position:relative;overflow:hidden}.studyTask15 i:after{content:"";position:absolute;inset:0;background:currentColor;transform:translateX(-100%);animation:studySlide15 .8s ease-in-out infinite}
