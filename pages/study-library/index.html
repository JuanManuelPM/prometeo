<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111326">
<title>Estudio</title>
<link rel="stylesheet" href="./study-v2.css?v=2">
</head>
<body>
<div class="app" id="app">
  <aside class="calendarRail" aria-label="Calendario">
    <div class="brand"><span class="brandDot"></span><span>Estudio</span></div>
    <div class="calTop"><div class="monthTitle" id="monthTitle"></div><button class="todayBtn" id="todayBtn">hoy</button></div>
    <nav class="viewTabs"><button class="viewTab active" data-view="month">mes</button><button class="viewTab" data-view="week">semana</button><button class="viewTab" data-view="agenda">agenda</button></nav>
    <section class="calView active" id="monthView"><div class="weekdays"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div><div class="monthGrid" id="monthGrid"></div></section>
    <section class="calView" id="weekView"><div class="weekList" id="weekList"></div></section>
    <section class="calView" id="agendaView"><div class="agendaList" id="agendaList"></div></section>
    <div class="railNext"><div class="railNextLabel">Lo próximo</div><div class="railNextTitle" id="nextTitle"></div><div class="railNextDate" id="nextDate"></div></div>
  </aside>
  <div class="stage">
    <main class="library" id="library"></main>
    <main class="courseView" id="courseView" aria-live="polite"></main>
  </div>
</div>
<script src="./study-v2.js?v=2"></script>
</body>
</html>
