<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111326"><title>Transcripción · Prometeo</title><style>:root{--bg:#111326;--ink:#d8d1ff;--line:color-mix(in srgb,var(--ink) 22%,transparent);--soft:color-mix(in srgb,var(--ink) 6%,transparent)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}body{font:14px/1.55 Inter,"Century Gothic",system-ui,sans-serif}button{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer}.wrap{max-width:980px;margin:auto;padding:24px 22px 80px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:18px}.id small{display:block;font-size:8px;letter-spacing:.1em;opacity:.35;text-transform:uppercase}.id h1{font-size:22px;line-height:1.1;letter-spacing:-.035em;margin:5px 0 0}.id span{display:block;font-size:9px;opacity:.42;margin-top:6px}.actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end}.actions button{font-size:8px;font-weight:850;opacity:.56;padding:4px 0}.actions button:hover{opacity:1}.actions .ai{opacity:1}.main{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:30px;margin-top:24px}.transcript{white-space:pre-wrap;font-size:13px;line-height:1.7}.side{border-left:1px solid var(--line);padding-left:18px}.side h2{font-size:9px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 9px}.notes{white-space:pre-wrap;font-size:10px;line-height:1.55;opacity:.62}.empty{opacity:.3}.aiMenu{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 84%,transparent);display:grid;place-items:center;padding:14px}.aiMenu section{width:min(360px,calc(100vw - 28px));background:var(--bg);border:1px solid var(--line);padding:10px}.aiMenu header{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 8px}.aiMenu header b{font-size:11px}.aiMenu header button{font-size:18px;opacity:.4}.aiMenu section>button{display:grid;grid-template-columns:95px 1fr;gap:12px;width:100%;text-align:left;padding:11px 4px;border-top:1px solid var(--line)}.aiMenu section>button b{font-size:9px}.aiMenu section>button span{font-size:8px;opacity:.42}.status{padding:40px 0;font-size:11px;opacity:.45}@media(max-width:760px){.wrap{padding:18px 14px 60px}.top{display:block}.actions{justify-content:flex-start;margin-top:14px}.main{display:block}.side{border-left:0;border-top:1px solid var(--line);padding:18px 0 0;margin-top:28px}.transcript{font-size:12px}}</style></head><body><main class="wrap" id="app"><div class="status">abriendo transcripción…</div></main><script>(()=>{'use strict';const API='https://catnohyouxqjjtseaueb.supabase.co/functions/v1/study-transcript-share-v1',q=new URLSearchParams(location.search),s=q.get('s')||'',app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function api(){return API+'?s='+encodeURIComponent(s)}function prompt(kind){const base=`Usá como fuente principal esta transcripción de una clase: ${api()}\nNo inventes contenido que no esté respaldado por la transcripción. Si algo es dudoso o quedó cortado, marcá la incertidumbre.`;if(kind==='clean')return `${base}\nPasala en limpio como apuntes claros y completos. Conservá conceptos, ejemplos, relaciones, nombres y preguntas importantes. Organizá por temas, no por cortes técnicos de audio.`;if(kind==='study')return `${base}\nConvertí la clase en material de estudio: resumen conectado, conceptos clave, relaciones, ejemplos, preguntas de recuperación activa y dudas pendientes. Separá explícitamente lo dicho en clase de cualquier inferencia.`;return `${base}\nHacé un resumen fiel y compacto de la clase: ideas principales, argumentos, ejemplos, definiciones y pendientes. Al final agregá 5 puntos que conviene recordar.`}function openAI(k){window.open('https://chatgpt.com/?q='+encodeURIComponent(prompt(k)),'_blank','noopener')}function menu(){document.getElementById('menu')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="aiMenu" id="menu"><section><header><b>ChatGPT</b><button id="close">×</button></header><button data-k="summary"><b>resumir</b><span>ideas, ejemplos y pendientes</span></button><button data-k="clean"><b>pasar en limpio</b><span>apuntes fieles y ordenados</span></button><button data-k="study"><b>estudiar</b><span>recall, relaciones y dudas</span></button></section></div>`);document.getElementById('close').onclick=()=>document.getElementById('menu').remove();document.getElementById('menu').onclick=e=>{if(e.target.id==='menu')e.currentTarget.remove()};document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;document.getElementById('menu').remove();openAI(k)})}async function copy(t,label){try{await navigator.clipboard.writeText(t);const b=document.activeElement,old=b?.textContent;if(b&&b.tagName==='BUTTON'){b.textContent='copiado';setTimeout(()=>b.textContent=old,900)}}catch{prompt('Copiá',t)}}async function boot(){if(!s){app.innerHTML='<div class="status">Falta el enlace de transcripción.</div>';return}try{const r=await fetch(api(),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw 0;const x=d.share,dt=x.class_date?new Date(x.class_date+'T12:00:00').toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'}):'';app.innerHTML=`<header class="top"><div class="id"><small>Prometeo · clase</small><h1>${esc(x.title||'Transcripción')}</h1><span>${esc(dt)}${x.course_id?' · '+esc(x.course_id):''}</span></div><div class="actions"><button id="copy">copiar transcripción</button><button id="copyPrompt">copiar prompt</button><button class="ai" id="ai">ChatGPT</button></div></header><div class="main"><article class="transcript">${esc(x.transcript||'')}</article><aside class="side"><h2>Notas compartidas</h2><div class="notes ${x.shared_notes?'':'empty'}">${esc(x.shared_notes||'sin notas compartidas')}</div></aside></div>`;document.getElementById('copy').onclick=()=>copy(x.transcript||'');document.getElementById('copyPrompt').onclick=()=>copy(prompt('clean'));document.getElementById('ai').onclick=menu}catch{app.innerHTML='<div class="status">Este enlace no existe, venció o fue revocado.</div>'}}boot()})();</script></body></html>
