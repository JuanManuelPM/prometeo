plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('PROMETEO_ANDROID_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('PROMETEO_ANDROID_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('PROMETEO_ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('PROMETEO_ANDROID_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.prometeo.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'com.prometeo.mobile'
        minSdk 30
        targetSdk 36
        versionCode 2
        versionName '0.1.1'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            minifyEnabled false
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.11.0'
    implementation 'androidx.media3:media3-session:1.11.0'

    testImplementation 'junit:junit:4.13.2'
}
