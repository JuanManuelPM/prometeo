<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>GRID · Prometeo</title>
<style>
:root{--bg:#000;--fg:#f2eee6;--muted:#7b756c;--line:#27231f;--soft:#0c0b0a;--orange:#ff6a00;--red:#ff4c43}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100dvh;overflow-x:hidden}.wrap{max-width:880px;margin:auto;padding:max(12px,env(safe-area-inset-top)) 12px 82px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:10;background:#000;padding:4px 0 11px;border-bottom:1px solid var(--line)}
.brand{font-weight:1000;letter-spacing:-.055em;font-size:21px;display:flex;align-items:center;gap:7px}.brand i{width:5px;height:23px;background:var(--orange);display:block}
.nav{display:flex;gap:9px;align-items:center}.nav a{color:var(--muted);text-decoration:none;font:900 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}.clock{font:900 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.hero{padding:14px 0 10px;border-bottom:1px solid var(--line)}.heroTop{display:flex;justify-content:space-between;gap:12px;align-items:end}.kicker{font:900 8px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--orange);letter-spacing:.12em}.run{font-size:clamp(27px,8vw,48px);font-weight:1000;letter-spacing:-.06em;line-height:.9}.big{font-size:clamp(38px,12vw,70px);font-weight:1000;letter-spacing:-.075em;line-height:.8;color:var(--orange)}
.track{height:8px;background:var(--line);margin:12px 0 8px;overflow:hidden}.fill{height:100%;background:var(--orange);transition:width .25s}
.meta{display:flex;gap:8px 15px;flex-wrap:wrap}.meta span{font:850 8px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}.meta b{color:var(--fg);font-size:10px}
.section{padding:12px 0;border-bottom:1px solid var(--line)}.head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:9px}.title{font:900 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;width:100%}
.cell{position:relative;aspect-ratio:1;border:1px solid #2d2924;background:#080706;color:#6e685f;padding:0;display:grid;place-items:center;font:900 clamp(6px,1.8vw,10px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}
.cell.ready{background:#080706}.cell.done{background:var(--orange);border-color:var(--orange);color:#050403}.cell.leased{border-color:var(--orange);color:var(--fg);background:#0c0907;animation:breathe 1.1s ease-in-out infinite}
.cell.leased::after{content:"";position:absolute;inset:-30% -120%;background:linear-gradient(100deg,transparent 44%,rgba(255,106,0,.55) 49%,transparent 55%);animation:sweep 1.25s linear infinite}
.cell .wk{position:absolute;right:2px;bottom:2px;font-size:5px;color:var(--orange);z-index:2}.cell.done .wk{color:#000}.cell.rescued::before{content:"↺";position:absolute;left:2px;top:2px;font-size:6px;z-index:2}
@keyframes breathe{50%{box-shadow:inset 0 0 0 2px rgba(255,106,0,.35)}}@keyframes sweep{to{transform:translateX(70%)}}
.workers{display:grid;gap:5px}.worker{display:grid;grid-template-columns:26px 48px minmax(0,1fr) 42px 46px;gap:6px;align-items:center;min-height:29px;border-top:1px solid #171411;font:850 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace}
.seat{color:var(--muted)}.code{color:var(--fg);font-weight:1000}.state{color:var(--muted)}.state.ACTIVE{color:var(--orange)}.state.DEAD{color:var(--red)}.count{text-align:right}.current{text-align:right;color:var(--muted)}
.empty{opacity:.35}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{border-top:1px solid var(--line);padding-top:7px}.stat b{display:block;font-size:18px;letter-spacing:-.05em}.stat small{font:800 6px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.events{display:grid;gap:4px}.event{display:grid;grid-template-columns:42px 40px minmax(0,1fr);gap:6px;font:800 7.5px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace}.event .t{color:var(--muted)}.event .w{color:var(--fg)}.event .d{color:#918a80;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail{display:none;margin-top:8px;padding:9px;border-left:3px solid var(--orange);background:#0c0a08;font:800 8px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:#a9a197}.detail.show{display:block}.detail b{color:var(--fg)}
.copy{position:fixed;right:12px;bottom:max(10px,env(safe-area-inset-bottom));height:42px;padding:0 15px;border:1px solid #2c2823;background:var(--fg);color:#050403;font-weight:1000;font-size:11px;z-index:12;box-shadow:0 5px 22px #000}.copy:disabled{background:#171411;color:#6f685f}
@media(max-width:520px){.wrap{padding-left:10px;padding-right:10px}.grid{gap:3px}.stats{grid-template-columns:repeat(2,1fr)}.worker{grid-template-columns:22px 42px minmax(0,1fr) 38px 40px}.copy{height:40px}}
@media(prefers-reduced-motion:reduce){.cell.leased,.cell.leased::after{animation:none}.fill{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand"><i></i>GRID</div><div class="nav"><a href="../control/">CONTROL</a><span class="clock" id="clock">—</span></div></header>

<section class="hero">
  <div class="heroTop">
    <div><div class="kicker" id="status">ARMED</div><div class="run" id="run">GRID-5-100-01</div></div>
    <div class="big" id="doneBig">0</div>
  </div>
  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="meta">
    <span><b id="done">0/100</b> DONE</span>
    <span><b id="members">0/5</b> COHORTE</span>
    <span><b id="working">0</b> TRABAJANDO</span>
    <span><b id="ready">100</b> READY</span>
    <span><b id="quiet">—</b> ÚLTIMO EVENTO</span>
    <span><b>NO</b> REEMPLAZOS</span>
  </div>
</section>

<section class="section">
  <div class="head"><div class="title">100 TAREAS · 10×10</div><div class="title" id="gridHint">tocá una celda</div></div>
  <div class="grid" id="grid"></div>
  <div class="detail" id="detail"></div>
</section>

<section class="section">
  <div class="head"><div class="title">5 WORKERS RESIDENTES</div><div class="title" id="seatState">0/5</div></div>
  <div class="workers" id="workers"></div>
</section>

<section class="section">
  <div class="head"><div class="title">RENDIMIENTO</div><div class="title">TAKE → PENSAR → SUBMIT</div></div>
  <div class="stats">
    <div class="stat"><b id="p50">—</b><small>P50 / TAREA</small></div>
    <div class="stat"><b id="p90">—</b><small>P90 / TAREA</small></div>
    <div class="stat"><b id="rate">0</b><small>TAREAS / MIN · 5M</small></div>
    <div class="stat"><b id="eta">—</b><small>ETA RECIENTE</small></div>
  </div>
</section>

<section class="section">
  <div class="head"><div class="title">EVENTOS</div><div class="title" id="rescued">0 RESCATES</div></div>
  <div class="events" id="events"></div>
</section>
</div>
<button class="copy" id="copy">🕹️ COPIAR PROMPT · 5 SEATS</button>
<script>
(()=>{
const BASE='https://catnohyouxqjjtseaueb.supabase.co/rest/v1/';
const KEY='sb_publishable_eqh3PngXs4UjLLWiY3pz1w_nhHtf7X-';
const HEAD={apikey:KEY,Authorization:'Bearer '+KEY};
const $=id=>document.getElementById(id);
let selected=null,lastData=null;

async function get(path){const r=await fetch(BASE+path,{headers:HEAD,cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json()}
function age(ts){if(!ts)return '—';const s=Math.max(0,Math.round((Date.now()-new Date(ts))/1000));if(s<60)return s+'s';return Math.floor(s/60)+'m'+String(s%60).padStart(2,'0')}
function dur(ms){ms=Number(ms||0);if(!ms)return '—';const s=ms/1000;return s<60?s.toFixed(0)+'s':(s/60).toFixed(1)+'m'}
function eventLabel(e){const n=e.task_no?'T'+String(e.task_no).padStart(2,'0')+' · ':'';return n+String(e.event_type||'').replaceAll('_',' ')}
function render(d){
  lastData=d;
  $('run').textContent=d.run_id||'—';
  $('status').textContent=d.status||'—';
  $('doneBig').textContent=d.done??0;
  $('done').textContent=(d.done??0)+'/'+(d.task_count??100);
  $('members').textContent=(d.members??0)+'/'+(d.worker_limit??5);
  $('working').textContent=d.working??0;
  $('ready').textContent=d.ready??0;
  $('fill').style.width=Math.max(0,Math.min(100,Number(d.progress_pct||0)))+'%';
  $('rescued').textContent=(d.rescued??0)+' RESCATES';
  $('p50').textContent=dur(d.p50_ms);
  $('p90').textContent=dur(d.p90_ms);
  $('rate').textContent=Number(d.throughput_5m||0).toFixed(1);
  $('eta').textContent=d.eta_minutes==null?'—':Number(d.eta_minutes).toFixed(1)+'m';
  const ev=(d.recent_events||[])[0];$('quiet').textContent=ev?age(ev.at):age(d.created_at);
  $('clock').textContent=new Date(d.server_time||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  $('seatState').textContent=(d.members??0)+'/'+(d.worker_limit??5)+(d.status==='SEALED'?' · SELLADA':d.status==='DONE'?' · DONE':' · ABIERTA');

  const root=$('grid');root.innerHTML='';
  (d.tasks||[]).forEach(t=>{
    const b=document.createElement('button');b.type='button';
    b.className='cell '+String(t.status||'ready').toLowerCase()+(Number(t.rescue_count)>0?' rescued':'');
    b.innerHTML='<span>'+String(t.task_no).padStart(2,'0')+'</span>'+(t.worker_code?'<span class="wk">'+t.worker_code+'</span>':'');
    b.title='T'+t.task_no+' · '+t.category+' · '+t.status;
    b.onclick=()=>{selected=t.task_no;renderDetail()};
    root.appendChild(b);
  });
  renderWorkers(d.member_rows||[],d.worker_limit||5);
  renderEvents(d.recent_events||[]);
  renderDetail();

  const left=Math.max(0,(d.worker_limit||5)-(d.members||0));
  const copy=$('copy');
  if(d.status==='ARMED'&&left>0){copy.disabled=false;copy.textContent='🕹️ COPIAR PROMPT · '+left+' SEAT'+(left===1?'':'S')}
  else{copy.disabled=true;copy.textContent=d.status==='DONE'?'✓ RUN TERMINADO':'✓ COHORTE SELLADA'}
}
function renderWorkers(rows,limit){
  const root=$('workers');root.innerHTML='';
  const map=new Map(rows.map(x=>[Number(x.seat_no),x]));
  for(let i=1;i<=limit;i++){
    const w=map.get(i);const r=document.createElement('div');r.className='worker'+(w?'':' empty');
    if(w){
      r.innerHTML='<span class="seat">#'+i+'</span><span class="code">'+w.worker_code+'</span><span class="state '+w.status+'">'+w.status+(w.current_task_no?' · T'+w.current_task_no:'')+'</span><span class="count">'+w.tasks_done+'✓</span><span class="current">'+age(w.last_seen_at)+'</span>';
    }else{
      r.innerHTML='<span class="seat">#'+i+'</span><span class="code">—</span><span class="state">ESPERANDO</span><span class="count">0✓</span><span class="current">—</span>';
    }
    root.appendChild(r);
  }
}
function renderEvents(rows){
  const root=$('events');root.innerHTML='';
  rows.slice(0,12).forEach(e=>{const x=document.createElement('div');x.className='event';x.innerHTML='<span class="t">'+age(e.at)+'</span><span class="w">'+(e.worker_code||'SYS')+'</span><span class="d">'+eventLabel(e)+'</span>';root.appendChild(x)});
  if(!rows.length)root.innerHTML='<div class="event"><span class="t">—</span><span class="w">SYS</span><span class="d">RUN ARMED · esperando primer worker</span></div>';
}
function renderDetail(){
  const el=$('detail');if(!selected||!lastData){el.classList.remove('show');return}
  const t=(lastData.tasks||[]).find(x=>Number(x.task_no)===Number(selected));if(!t){el.classList.remove('show');return}
  el.classList.add('show');
  el.innerHTML='<b>TAREA '+String(t.task_no).padStart(2,'0')+'</b> · '+t.category+' · '+t.difficulty+'<br>'+
    'estado <b>'+t.status+'</b> · worker <b>'+(t.worker_code||'—')+'</b> · intentos <b>'+t.attempt_count+'</b> · rescates <b>'+t.rescue_count+'</b>'+
    (t.elapsed_ms?'<br>duración <b>'+dur(t.elapsed_ms)+'</b>':'');
}
async function tick(){try{const x=await get('grid_lab_dashboard?select=*');if(x[0])render(x[0])}catch(e){$('clock').textContent='reintentando'}}
$('copy').onclick=async()=>{
  const b=$('copy');if(b.disabled)return;const old=b.textContent;
  try{
    b.textContent='COPIANDO…';
    const r=await fetch('../o/',{cache:'no-store'});const html=await r.text();
    const doc=new DOMParser().parseFromString(html,'text/html');const prompt=doc.querySelector('pre')?.textContent?.trim();
    if(!prompt)throw new Error();
    await navigator.clipboard.writeText(prompt);
    b.textContent='✓ PROMPT COPIADO';
  }catch(e){b.textContent='ERROR · REINTENTÁ'}
  setTimeout(()=>{if(lastData)render(lastData);else b.textContent=old},1400)
};
tick();setInterval(tick,1200);
})();
</script>
</body>
</html>
