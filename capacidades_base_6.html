<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>6 capacidades base</title><style>:root{--bg:#F3EBDD;--ink:#111}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;overflow:hidden}button{font:inherit;color:inherit}.top{position:fixed;z-index:30;left:0;right:0;top:0;height:54px;background:var(--bg);border-bottom:2px solid var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 16px}.count{font-size:12px;font-weight:900;letter-spacing:.18em}.dots{display:flex;gap:6px}.dot{width:8px;height:8px;border:2px solid var(--ink);border-radius:50%;background:var(--bg);padding:0}.dot.on{background:var(--ink)}.screens{width:100vw;height:100dvh;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}.screens::-webkit-scrollbar{display:none}.screen{flex:0 0 100vw;width:100vw;height:100dvh;overflow-y:auto;scroll-snap-align:start;scroll-snap-stop:always;padding-top:54px;background:var(--bg);overscroll-behavior-y:contain}.page{width:min(100%,760px);margin:auto;padding:34px 24px 170px}.n{font-size:12px;font-weight:900;letter-spacing:.2em;margin-bottom:18px}.title{margin:0;font-family:Impact,"Arial Black",Arial,sans-serif;font-size:clamp(55px,14vw,110px);line-height:.84;letter-spacing:-.045em}.lead{margin:18px 0 50px;font-size:clamp(18px,5vw,28px);line-height:1.05;font-weight:900;text-transform:uppercase;max-width:620px}.section{border-top:3px solid var(--ink);padding:22px 0 28px}.section h2{margin:0 0 14px;font-family:Impact,"Arial Black",Arial,sans-serif;font-size:clamp(29px,7vw,46px);line-height:.92;letter-spacing:-.025em}.section ul{margin:0;padding-left:20px}.section li{font-size:16px;line-height:1.25;font-weight:700;margin:0 0 9px}.done{font-size:13px;font-weight:900;letter-spacing:.12em}.work{position:fixed;z-index:50;left:50%;bottom:18px;transform:translateX(-50%);width:112px;height:54px;border:2px solid var(--ink);border-radius:999px;background:var(--bg);font-weight:900;letter-spacing:.08em;touch-action:none;user-select:none;cursor:grab;display:grid;place-items:center}.targets{position:fixed;z-index:45;left:14px;right:14px;bottom:12px;height:80px;display:flex;gap:12px;opacity:0;pointer-events:none}.targets.show{opacity:1}.target{flex:1;border:2px dashed var(--ink);display:grid;place-items:center;font-size:12px;font-weight:900;letter-spacing:.12em;background:var(--bg)}.toast{position:fixed;z-index:70;top:66px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 13px;font-size:12px;font-weight:900;letter-spacing:.1em;opacity:0;pointer-events:none}.toast.show{opacity:1}@media(min-width:800px){.page{padding-left:36px;padding-right:36px}.work{width:130px}}</style></head><body><header class="top"><div class="count" id="count">01 / 06</div><div class="dots" id="dots"></div></header><div class="toast" id="toast">PROMPT COPIADO</div><div class="targets" id="targets"><div class="target" data-action="copy">COPIAR</div><div class="target" data-action="chat">CHAT</div></div><button class="work" id="work">TRABAJAR</button><main class="screens" id="screens"></main><script>const DATA=[{title:'VOZ ↔ TEXTO',lead:'Grabar, transcribir, pegar texto y escucharlo sin perder material.',flow:['Micrófono, archivo de audio o texto pegado.','Guardar el original antes de procesar.','Audio → transcripción por cola; texto → lectura por fragmentos concatenables.','Pausa, reanudar, siguiente, anterior y posición persistente.','Salida: texto limpio, transcript crudo y lectura.'],guards:['Nunca perder una grabación si falla la transcripción.','No bloquear la interfaz mientras procesa.','Los textos largos se sienten como una sola lectura.','Corregir, borrar y reprocesar sin duplicados.'],qa:['Permiso de micrófono aceptado y denegado.','Audio corto/largo y texto corto/largo.','Cerrar y reabrir conservando posición.'],prompt:'Construí una capacidad web reusable VOZ ↔ TEXTO en un único HTML mobile-first. Aceptá micrófono, archivos de audio y texto pegado; guardá el original antes de procesar; transcribí audio en segundo plano sin bloquear; permití lectura en voz alta de textos largos por fragmentos concatenados que se comporten como una sola lectura; incluí play/pausa/anterior/siguiente, posición persistente, corrección y borrado. Separá estado crudo de estado procesado. Nunca pierdas una grabación si falla Whisper o TTS. Entregá HTML funcional, contrato de datos y pruebas móvil/escritorio. No integres otras funciones.'},{title:'PUBLICAR WEB',lead:'HTML → link público estable sin repetir 404, ramas equivocadas ni caché vieja.',flow:['Elegir repo, ruta canónica y URL final antes de escribir.','Detectar la fuente real de GitHub Pages: main, /docs o gh-pages.','Si existe: leer SHA y actualizar; si no: crear.','Publicar en la autoridad correcta sin inventar rutas paralelas.','Verificar la rama y después la URL pública real.'],guards:['Nunca decir “publicado” sólo porque existe un commit.','No cambiar el link estable por una versión nueva sin pedido.','Diagnosticar 404 por rama/ruta/Pages antes de rehacer HTML.','Evitar main y gh-pages divergentes cuando ambas deban conservar copia.','Cache-bust sólo para verificar; URL canónica limpia.'],qa:['Crear página nueva.','Actualizar misma página sin cambiar URL.','Provocar y resolver un 404.','Comprobar que lo público coincide con el último contenido.'],prompt:'Creá un HTML-guía reusable PUBLICAR WEB para GitHub Pages. Debe conducir a una IA o humano por el flujo exacto: elegir repo/ruta/URL estable, detectar fuente de Pages (main, docs o gh-pages), obtener archivo y SHA antes de update, crear si no existe, actualizar sin cambiar el link, verificar rama y luego verificar la URL pública real, diagnosticar 404 y caché. Prohibido declarar publicado sólo por tener commit. Incluí checklist DONE y reglas explícitas para main vs gh-pages. Diseño mobile-first, bicolor y directo.'},{title:'ARCHIVOS ↔ CONTENIDO',lead:'Una puerta común para convertir materiales distintos en contenido utilizable.',flow:['Aceptar PDF, imagen, audio, texto, CSV/Excel, JSON y ZIP.','Conservar original + metadatos + representación normalizada.','Extraer sólo cuando haga falta.','Interfaz común para que otras páginas consuman el contenido.','Exportar archivo, selección o ZIP.'],guards:['Nunca reemplazar el original por el procesado.','No usar OCR si ya existe texto fiable.','Un archivo fallido no rompe el lote.','Identidad estable para evitar duplicados.'],qa:['Un archivo de cada tipo.','Lote mixto.','Cerrar/reabrir conservando originales y derivados.','Exportar y reimportar sin pérdida esencial.'],prompt:'Construí un módulo HTML reusable ARCHIVOS ↔ CONTENIDO. Importá PDF, imágenes, audio, texto, CSV/Excel, JSON y ZIP; conservá siempre el original con metadatos; generá representaciones normalizadas sin sobrescribir el origen; evitá OCR cuando exista texto; manejá lotes sin que un archivo fallido rompa los demás; asigná identidad estable; permití exportar archivo, selección y ZIP. Diseñá un contrato de datos común para cualquier página. Demo client-side donde sea posible y marcá qué requiere backend.'},{title:'GUARDAR ↔ VOLVER',lead:'Persistir lo importante y volver exactamente al mismo contexto.',flow:['Estado serializable y versionado.','Guardar cambios relevantes con debounce.','Persistir pantalla, scroll, foco lógico, selección, progreso y datos.','Restaurar datos antes de posición visual.','Migrar estados viejos al cambiar el esquema.'],guards:['Separar Back del navegador de Exact Back interno.','No restaurar scroll antes de que exista contenido.','No perder estado por refresh, cierre o cambio de pantalla.','Migración fallida conserva copia recuperable.'],qa:['Refresh en mitad de tarea.','Cerrar y reabrir.','Migrar schema.','Volver desde fullscreen/overlay al foco y scroll exactos.'],prompt:'Construí un módulo HTML reusable GUARDAR ↔ VOLVER. Definí estado serializable y versionado que preserve datos, pantalla activa, scroll, foco lógico, selección, progreso y configuración. Guardá con debounce; restaurá datos antes de posición; separá Back del navegador de Exact Back interno; incluí migraciones y copia recuperable si fallan. Demo obligatoria: editar, navegar, scrollear, recargar y volver exactamente al contexto anterior.'},{title:'RECURSOS WEB',lead:'Mostrar links, videos, PDFs, imágenes y herramientas externas sin cuadros rotos.',flow:['Entrada universal: URL + tipo opcional.','Elegir embed, preview o tarjeta externa.','YouTube, PDF, imagen, GeoGebra y web genérica comparten contrato.','Si no puede embeberse, fallback útil.','Conservar URL original y abrir externo.'],guards:['No asumir que toda URL permite iframe.','Un embed invisible no bloquea scroll/touch.','Fallo de carga degrada a tarjeta, no rompe layout.','Nunca perder la fuente original.'],qa:['YouTube embebible y restringido.','PDF, imagen y web con X-Frame-Options.','Offline/URL inválida.','Móvil pequeño y escritorio.'],prompt:'Construí un componente HTML reusable RECURSOS WEB. Aceptá una URL y representá YouTube, PDF, imagen, GeoGebra o web genérica mediante un contrato común. Usá embed cuando sea viable y fallback de tarjeta cuando no; conservá siempre URL original y Abrir externo. Un iframe fallido jamás queda como cuadro roto ni bloquea gestos. Incluí loading/error/fallback, demo y pruebas móvil/escritorio.'},{title:'CONTROLES UNIVERSALES',lead:'Gestos y botones iguales en móvil, mouse y lápiz sin pelearse con el scroll.',flow:['Pointer Events para touch, mouse y stylus.','Separar tap, hold, drag y scroll con umbrales.','Estados idle/pressed/dragging/disabled/busy.','Fullscreen, cerrar, volver y selección con reglas predecibles.','Feedback visual/sonoro desacoplado.'],guards:['Drag no dispara click al soltar.','Control no secuestra scroll de página.','Sin handlers duplicados touch+mouse.','Enter no ejecuta acciones peligrosas.','Pointer cancel siempre limpia captura y estado.'],qa:['Android táctil pequeño.','Desktop mouse/trackpad.','Stylus/Wacom.','Overlay con scroll y cierre sin saltos.'],prompt:'Construí una librería/demo HTML reusable CONTROLES UNIVERSALES basada en Pointer Events. Resolvé tap, hold, drag y scroll con umbrales; estados idle/pressed/dragging/disabled/busy; fullscreen, cerrar, volver y selección; evitá click fantasma al terminar drag; no secuestres scroll; limpiá pointer capture en cancel; evitá handlers touch/mouse duplicados; no uses Enter para acciones peligrosas. Feedback visual/sonoro desacoplado y matriz de pruebas Android, desktop y stylus/Wacom.'}];const screens=document.getElementById('screens'),dots=document.getElementById('dots'),count=document.getElementById('count'),work=document.getElementById('work'),targets=document.getElementById('targets'),toast=document.getElementById('toast');DATA.forEach((d,i)=>{const s=document.createElement('section');s.className='screen';s.innerHTML=`<div class="page"><div class="n">0${i+1} / 06</div><h1 class="title">${d.title}</h1><div class="lead">${d.lead}</div><div class="section"><h2>FLUJO</h2><ul>${d.flow.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="section"><h2>NO PUEDE FALLAR</h2><ul>${d.guards.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="section"><h2>LISTO CUANDO</h2><ul>${d.qa.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="section"><div class="done">ARRASTRÁ “TRABAJAR” → COPIAR / CHAT</div></div></div>`;screens.appendChild(s);const b=document.createElement('button');b.className='dot'+(i===0?' on':'');b.onclick=()=>screens.scrollTo({left:i*innerWidth,behavior:'smooth'});dots.appendChild(b)});let active=0,timer;function update(){active=Math.max(0,Math.min(5,Math.round(screens.scrollLeft/innerWidth)));count.textContent=`0${active+1} / 06`;[...dots.children].forEach((d,i)=>d.classList.toggle('on',i===active))}screens.addEventListener('scroll',()=>{clearTimeout(timer);timer=setTimeout(update,60)});addEventListener('resize',update);async function copyPrompt(){const text=DATA[active].prompt;try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1100)}let dragging=false,start={x:0,y:0};work.addEventListener('pointerdown',e=>{dragging=true;work.setPointerCapture(e.pointerId);start={x:e.clientX,y:e.clientY};targets.classList.add('show')});work.addEventListener('pointermove',e=>{if(dragging)work.style.transform=`translate(calc(-50% + ${e.clientX-start.x}px),${e.clientY-start.y}px)`});function hitTarget(x,y){for(const t of document.querySelectorAll('.target')){const r=t.getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return t}return null}function finish(e){if(!dragging)return;dragging=false;const target=hitTarget(e.clientX,e.clientY);work.style.transform='translateX(-50%)';targets.classList.remove('show');if(!target)return;if(target.dataset.action==='chat')window.open('https://chatgpt.com/','_blank');copyPrompt()}work.addEventListener('pointerup',finish);work.addEventListener('pointercancel',()=>{dragging=false;work.style.transform='translateX(-50%)';targets.classList.remove('show')});update();</script></body></html>
