<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTube · Ventana</title>
<style>
:root{color-scheme:dark;font:14px system-ui,-apple-system,Arial,sans-serif;background:#080809;color:#f1f1f2}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{display:grid;place-items:center;padding:10px}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid white;outline-offset:2px}
.window{width:min(980px,100%);height:min(610px,calc(100dvh - 20px));min-width:310px;min-height:250px;display:flex;flex-direction:column;resize:both;overflow:hidden;border:1px solid #333338;border-radius:9px;background:#101013;box-shadow:0 30px 80px #0008}
.header{height:44px;display:flex;align-items:center;gap:12px;padding:0 10px 0 15px;flex:none;background:#19191c;border-bottom:1px solid #333338;cursor:grab;touch-action:none;user-select:none}
.dot{width:8px;height:8px;border-radius:50%;background:#aaa}.title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;max-width:56%}.spacer{flex:1}
.icon{display:grid;place-items:center;width:33px;height:33px;border:0;background:transparent;color:#ddd;border-radius:4px;text-decoration:none;font-size:19px}.icon:hover{background:#333}
.edit{display:none;gap:7px;padding:9px;background:#17171b;border-bottom:1px solid #333338}.edit.open{display:flex}
.edit input{flex:1;min-width:0;background:#09090a;color:#eee;border:1px solid #555;border-radius:5px;padding:8px 10px}
.edit button,.sound{background:#29292e;color:#eee;border:1px solid #505055;padding:7px 12px;border-radius:5px}
.frame{flex:1;min-height:0;background:black}.frame iframe{display:block;width:100%;height:100%;border:0;background:#000}
.foot{height:43px;background:#17171a;border-top:1px solid #333338;display:flex;align-items:center;padding:5px 9px;gap:10px;flex:none}
.sound{font-size:12px}.sound:hover,.edit button:hover{background:#38383d}
.note{color:#aaa;font-size:11px;margin-left:auto}
.window.max{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;border:0;border-radius:0;resize:none;z-index:3}
@media(max-width:600px){body{padding:0}.window{width:100vw;height:100dvh;min-width:0;min-height:0;resize:none;border-radius:0;border:0}.header{touch-action:auto;cursor:default}.note{display:none}.title{max-width:44%}}
</style>
</head>
<body>
<section class="window" id="window" aria-label="Ventana de YouTube">
 <header class="header" id="header">
  <span class="dot" aria-hidden="true"></span><strong class="title" id="title">Brown noise</strong><span class="spacer"></span>
  <button class="icon" id="editBtn" type="button" title="Cambiar video" aria-label="Cambiar video">+</button>
  <a class="icon" id="external" href="https://www.youtube.com/watch?v=HPauaZfL6BI" target="_blank" rel="noopener" title="Ver en YouTube" aria-label="Ver en YouTube">↗</a>
  <button class="icon" id="maxBtn" type="button" aria-label="Maximizar" title="Maximizar">⛶</button>
 </header>
 <form class="edit" id="edit"><input id="url" aria-label="Enlace de video" placeholder="Pegá un enlace de YouTube" inputmode="url" autocomplete="off"><button>Cargar</button></form>
 <div class="frame" id="frame"></div>
 <footer class="foot"><button class="sound" type="button" id="sound">Activar sonido</button><span class="note">YouTube · Reproducción automática silenciada</span></footer>
</section>
<script>
(function(){
'use strict';
const DEFAULT='HPauaZfL6BI', BASE='https://www.youtube.com/watch?v=';
const $=id=>document.getElementById(id);
let id=DEFAULT,player=null;const win=$('window'),frame=$('frame'),edit=$('edit'),input=$('url');
function valid(x){return /^[a-zA-Z0-9_-]{11}$/.test(x||'')?x:null}
function parse(value){
 const str=value.trim();if(valid(str))return str;let u;
 try{u=new URL(str)}catch{return null}
 if(!['http:','https:'].includes(u.protocol))return null;
 const h=u.hostname.toLowerCase(),p=u.pathname.split('/').filter(Boolean);
 if(['youtu.be','www.youtu.be'].includes(h))return valid(p[0]);
 if(!['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com','youtube-nocookie.com','www.youtube-nocookie.com'].includes(h))return null;
 if(p[0]==='watch')return valid(u.searchParams.get('v'));
 if(['embed','shorts','live','v'].includes(p[0]))return valid(p[1]);
 return null;
}
function load(video){
 id=video;const url=BASE+id;
 $('external').href=url;
 $('title').textContent=id===DEFAULT?'Brown noise · 10 horas':'Video de YouTube';
 const params=new URLSearchParams({autoplay:'1',mute:'1',playsinline:'1',controls:'1',enablejsapi:'1',rel:'0',origin:location.origin});
 const el=document.createElement('iframe');
 el.title='Video de YouTube';el.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';el.allowFullscreen=true;
 el.referrerPolicy='strict-origin-when-cross-origin';
 el.src='https://www.youtube.com/embed/'+id+'?'+params;
 frame.replaceChildren(el);player=el;
 input.value=url;edit.classList.remove('open');
 try{localStorage.setItem('youtube-window-video',id)}catch{}
}
$('editBtn').onclick=()=>{edit.classList.toggle('open');if(edit.classList.contains('open')){input.value=BASE+id;input.focus();input.select()}};
edit.onsubmit=e=>{e.preventDefault();const result=parse(input.value);if(result)load(result);else{input.setCustomValidity('Pegá un enlace válido de YouTube');input.reportValidity()}};
input.oninput=()=>input.setCustomValidity('');
$('sound').onclick=()=>{
 if(!player)return;
 try{const api=player.contentWindow;for(const func of ['unMute','playVideo'])api.postMessage(JSON.stringify({event:'command',func,args:[]}), 'https://www.youtube.com');api.postMessage(JSON.stringify({event:'command',func:'setVolume',args:[75]}),'https://www.youtube.com')}catch{}
 $('sound').textContent='Sonido de YouTube ↗';
};
$('maxBtn').onclick=()=>{win.classList.toggle('max');$('maxBtn').textContent=win.classList.contains('max')?'▢':'⛶'};
let drag=null;const header=$('header');
header.addEventListener('pointerdown',e=>{
 if(innerWidth<600||e.button!==0||e.target.closest('button,a')||win.classList.contains('max'))return;
 const r=win.getBoundingClientRect();drag={x:e.clientX,y:e.clientY,left:r.left,top:r.top};
 Object.assign(win.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
 header.setPointerCapture(e.pointerId);
});
header.addEventListener('pointermove',e=>{
 if(!drag)return;
 win.style.left=Math.min(innerWidth-55,Math.max(0,drag.left+e.clientX-drag.x))+'px';
 win.style.top=Math.min(innerHeight-44,Math.max(0,drag.top+e.clientY-drag.y))+'px';
});
header.addEventListener('pointerup',()=>drag=null);header.addEventListener('pointercancel',()=>drag=null);
let first=new URLSearchParams(location.search).get('v');
if(!valid(first)){try{first=localStorage.getItem('youtube-window-video')}catch{}}
load(valid(first)||DEFAULT);
})();
</script>
</body>
</html>
