<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0d">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Frecuencia · Widget musical</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f2f2f0;color:#fff;accent-color:#fff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}body{min-height:100svh;display:grid;place-items:center;padding:24px 12px}
button,input{font:inherit}button{color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:3px}
.widget{--pad:16px;width:min(344px,100%);min-width:288px;position:relative;background:#171717;border-radius:38px;padding:6px var(--pad) 27px;box-shadow:0 13px 30px #0002;color:#fff;isolation:isolate}
.pill-area{height:27px;display:flex;justify-content:center;align-items:flex-start;position:relative;z-index:11}
.pill{width:100px;height:24px;border:0;padding:0;background:transparent;display:grid;place-items:center}
.pill:before{content:"";height:6px;width:65px;border-radius:99px;background:#f8f8f8;transition:width .2s ease}
.pill:hover:before,.pill[aria-expanded="true"]:before{width:78px}
.screen{border-radius:21px;overflow:hidden;position:relative;width:100%;aspect-ratio:1;background:#080808;isolation:isolate}
.frame{position:absolute;inset:0;background:#000;overflow:hidden}
.widget.artwork-view .frame{visibility:hidden}
.widget.artwork-view .screenTap{display:none}
.widget.artwork-view .cover{display:block}
.video-wide{position:absolute;top:0;left:-38.889%;width:177.778%;height:100%}
#ytPlayer,#ytPlayer iframe{display:block;width:100%;height:100%;border:0}
.cover{position:absolute;z-index:3;inset:0;background:#111}
.cover.hidden{display:none}
.widget.artwork-view .cover.hidden{display:block}
.cover img{width:100%;height:100%;object-fit:cover}
.cover button{position:absolute;inset:0;display:block;width:100%;height:100%;border:0;padding:0;color:transparent;background:transparent}
.cover button span{display:none}
.screenTap{position:absolute;inset:0;z-index:2;border:0;background:transparent;width:100%;height:100%}
.err{position:absolute;inset:0;z-index:5;display:none;place-items:center;align-content:center;gap:9px;background:#121213;padding:25px;text-align:center;font-size:12px;line-height:1.6}
.err.show{display:grid}.err a{color:#fff}
.controls-block{margin-top:66px;padding:0 3px}
.seek{display:block;width:100%;height:19px;padding:0;margin:0;cursor:pointer;appearance:none;-webkit-appearance:none;background:transparent;--pos:0%}
.seek::-webkit-slider-runnable-track{height:3px;background:linear-gradient(to right,#fff var(--pos),#737373 var(--pos));border-radius:4px}
.seek::-moz-range-track{height:3px;background:#737373;border-radius:4px}
.seek::-moz-range-progress{height:3px;background:#fff;border-radius:4px}
.seek::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#fff;border:0;margin-top:-4px;opacity:0}
.seek:hover::-webkit-slider-thumb,.seek:focus-visible::-webkit-slider-thumb{opacity:1}
.seek::-moz-range-thumb{width:9px;height:9px;border:0;border-radius:50%;background:#fff;opacity:.8}
.times{display:flex;justify-content:space-between;font-size:11px;line-height:1;color:#e8e8e8;font-variant-numeric:tabular-nums}
.transport{display:flex;align-items:center;justify-content:center;gap:29px;margin-top:14px}
.key{padding:0;display:grid;place-items:center;min-width:55px;min-height:62px;border:0;background:transparent;color:white}
.key svg{width:30px;height:30px;fill:currentColor}.key.primary svg{width:34px;height:34px}
.key:hover{opacity:.75}.key:disabled{opacity:.8}
.sound{display:flex;align-items:center;gap:10px;margin-top:23px}
.sound-icon{width:15px;height:20px;display:grid;place-items:center;flex:none}
.sound-icon svg{width:15px;height:15px;fill:currentColor}
.sound input{min-width:0;flex:1;width:100%;height:22px;appearance:none;-webkit-appearance:none;background:transparent;margin:0;--pos:75%}
.sound input::-webkit-slider-runnable-track{height:3px;border-radius:10px;background:linear-gradient(to right,#fff var(--pos),#777 var(--pos))}
.sound input::-moz-range-track{height:3px;background:#747474;border-radius:10px}
.sound input::-moz-range-progress{height:3px;background:#fff;border-radius:10px}
.sound input::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:white;margin-top:-7px;box-shadow:0 1px 3px #0005}
.sound input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:0}
.sound-icon:last-child svg{width:18px;height:18px}
.settings{position:absolute;z-index:10;top:31px;left:var(--pad);right:var(--pad);bottom:16px;border-radius:21px;background:#202021;box-shadow:0 8px 24px #0009;display:flex;flex-direction:column;padding:19px 15px;gap:14px;overflow-y:auto;overscroll-behavior:contain;opacity:0;transform:translateY(-7px);visibility:hidden;pointer-events:none;transition:opacity .15s ease,transform .15s ease,visibility .15s}
.widget.settings-open .settings{opacity:1;transform:none;visibility:visible;pointer-events:auto}
.settings-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:1px solid #424244;padding-bottom:11px}
.settings h2{font-size:19px;line-height:1.1;font-weight:600;letter-spacing:-.5px;margin:0}
.settings .caption{font-size:11px;color:#b2b2b3}
.seeds{display:grid;gap:7px}
.seed{display:flex;align-items:center;gap:10px;text-align:left;width:100%;border:1px solid transparent;padding:7px;background:transparent;border-radius:9px}
.seed:hover{background:#313133}.seed.selected,.seed[aria-pressed="true"]{border-color:#67676a;background:#363638}
.seed img{width:58px;height:58px;flex:none;object-fit:cover;border-radius:6px;background:#333}
.seed .meta strong{display:block;font-size:13px;font-weight:600;line-height:1.25}
.seed .meta span{display:block;margin-top:3px;font-size:11px;color:#c4c4c4;line-height:1.2}
.seed .arrow{display:none}
fieldset{border:0;margin:0;padding:0}fieldset legend{font-size:11px;color:#b5b5b5;margin-bottom:9px}
.link-form{display:flex;gap:6px;min-width:0}
.link-form input{flex:1;min-width:0;border:1px solid #59595d;background:#101011;color:white;border-radius:5px;padding:10px 8px;font-size:13px}
.link-form button{padding:0 12px;border:1px solid #777;background:#f0f0f0;color:#151515;border-radius:5px;font-size:13px;font-weight:700}
.info-line{font-size:11px;color:#b4b4b5;line-height:1.45;min-height:29px;margin:0}
.radio-link{font-size:12px;color:#eee;text-underline-offset:3px;align-self:flex-start}
.settings-foot{font-size:10px;color:#8e8e92;margin:0;padding-top:6px;border-top:1px solid #414145}
.hidden-meta{display:none}
@media(max-width:380px){body{padding:10px 6px}.widget{width:min(342px,100%);padding-bottom:23px}.controls-block{margin-top:54px}.transport{margin-top:11px}.sound{margin-top:16px}}
@media(prefers-reduced-motion:reduce){.pill:before,.settings{transition:none}}
</style>
</head>
<body>
<main class="widget" id="widget" aria-label="Reproductor de música">
 <div class="pill-area"><button id="pill" class="pill" aria-label="Abrir ajustes y cambiar canción" aria-expanded="false" aria-controls="settings" type="button"></button></div>
 <section class="screen" id="screen" aria-label="Video musical">
  <div class="frame"><div class="video-wide"><div id="ytPlayer"></div></div></div>
  <button type="button" class="screenTap" id="screenTap" aria-label="Reproducir o pausar video"></button>
  <div class="cover" id="cover"><img id="coverImg" src="https://i.ytimg.com/vi/5NV6Rdv1a3I/hqdefault.jpg" alt=""><button id="start" type="button" aria-label="Reproducir video">Reproducir</button></div>
  <div class="err" id="error" role="status"><span>Este video no se pudo reproducir aquí.</span><a id="errorLink" target="_blank" rel="noopener">Abrir en YouTube ↗</a></div>
 </section>
 <div class="controls-block">
  <input id="seek" class="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Posición de reproducción">
  <div class="times"><span id="elapsed">0:00</span><span id="remaining">−0:00</span></div>
  <div class="transport">
   <button id="prev" class="key" type="button" title="Anterior" aria-label="Canción anterior"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 8h2v16H5zm1 8L22 7v18zm14 0L29 7v18z"/></svg></button>
   <button id="pause" class="key primary" type="button" title="Reproducir" aria-label="Reproducir"><svg id="playIcon" viewBox="0 0 32 32" aria-hidden="true"><path d="M10 6 26 16 10 26z"/></svg></button>
   <button id="next" class="key" type="button" title="Siguiente" aria-label="Siguiente canción"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M25 8h2v16h-2zM3 7l9 9-9 9zm7 0 16 9-16 9z"/></svg></button>
  </div>
  <div class="sound">
   <span class="sound-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/></svg></span>
   <input id="volume" type="range" min="0" max="100" value="75" aria-label="Volumen">
   <span class="sound-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2 9v6h4l5 4V5L6 9zM15 8a6 6 0 0 1 0 8v-2a4 4 0 0 0 0-4zm2-4a11 11 0 0 1 0 16v-2.5a8.5 8.5 0 0 0 0-11z"/></svg></span>
  </div>
 </div>
 <section id="settings" class="settings" aria-label="Cambiar música y ajustes" aria-hidden="true" inert>
  <div class="settings-head"><h2>Elegir estación</h2><span class="caption">Radio · YouTube</span></div>
  <div class="seeds" id="seeds"></div>
  <form id="addForm"><fieldset><legend>O pegá una canción de YouTube</legend><div class="link-form"><input id="url" type="url" inputmode="url" placeholder="https://youtu.be/…" aria-label="Enlace de canción"><button type="submit">Abrir</button></div></fieldset></form>
  <p id="status" class="info-line" role="status" aria-live="polite">Elegí una canción para iniciar la radio.</p>
  <a id="original" class="radio-link" target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/watch?v=5NV6Rdv1a3I&list=RD5NV6Rdv1a3I&start_radio=1">Escuchar la radio en YouTube ↗</a>
  <p id="moreInfo" class="settings-foot">El reproductor prueba una lista Mix. Si YouTube la bloquea, continúa con los ejemplos.</p>
  <div class="hidden-meta" aria-hidden="true"><span id="eyebrow"></span><h1 id="title"></h1><p id="artist"></p></div>
 </section>
</main>
<script>
'use strict';
(()=>{
const SONGS=[
 {id:'5NV6Rdv1a3I',title:'Get Lucky',artist:'Daft Punk · Pharrell Williams'},
 {id:'HyHNuVaZJ-k',title:'Feel Good Inc.',artist:'Gorillaz'},
 {id:'bpOSxM0rNPM',title:'Do I Wanna Know?',artist:'Arctic Monkeys'}
];
const $=id=>document.getElementById(id);
const byId=new Map(SONGS.map(s=>[s.id,s]));
const state={seed:SONGS[0],player:null,ready:false,started:false,playing:false,mode:'idle',request:0,volume:75,muted:false};
let mixTimer=0,startTimer=0;
function safe(fn,other){try{return fn()}catch{return other}}
function updateRadioLink(){const id=state.seed.id;const l='https://www.youtube.com/watch?v='+id+'&list=RD'+id+'&start_radio=1';$('original').href=l;$('errorLink').href='https://www.youtube.com/watch?v='+id}
function renderSeeds(){
 $('seeds').replaceChildren();
 SONGS.forEach(song=>{
  const b=document.createElement('button');b.type='button';b.className='seed'+(song.id===state.seed.id?' selected':'');
  b.setAttribute('aria-label','Crear radio desde '+song.title);b.setAttribute('aria-pressed',String(song.id===state.seed.id));
  const img=document.createElement('img');img.src='https://i.ytimg.com/vi/'+song.id+'/mqdefault.jpg';img.alt='';img.loading='lazy';
  const m=document.createElement('span');m.className='meta';
  const title=document.createElement('strong');title.textContent=song.title;
  const artist=document.createElement('span');artist.textContent=song.artist;
  m.append(title,artist);
  const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='↗';
  b.append(img,m,arrow);b.addEventListener('click',()=>selectSong(song));$('seeds').append(b);
 });
}
function status(t){$('status').textContent=t}
function thumb(videoId=state.seed.id){ $('coverImg').src='https://i.ytimg.com/vi/'+videoId+'/hqdefault.jpg'}
function currentVideoId(){
 const data=safe(()=>state.player&&state.player.getVideoData(),null);
 return data&&/^[a-zA-Z0-9_-]{11}$/.test(data.video_id||'')?data.video_id:state.seed.id;
}
function showArtwork(){
 thumb(currentVideoId());
 $('widget').classList.add('artwork-view');
 $('cover').classList.remove('hidden');
 $('start').setAttribute('aria-label','Reanudar reproducción');
}
function showVideo(){
 $('widget').classList.remove('artwork-view');
 $('cover').classList.add('hidden');
}
function setTitle(song){$('title').textContent=song.title;$('artist').textContent=song.artist}
function updateButtons(){
 for(const id of ['prev','pause','next'])$(id).disabled=false;
 $('pause').setAttribute('aria-label',state.playing?'Pausar':'Reproducir');$('pause').title=state.playing?'Pausar':'Reproducir';
 $('playIcon').innerHTML=state.playing?'<path d="M8 6h6v20H8zm10 0h6v20h-6z"/>':'<path d="M10 6 26 16 10 26z"/>';
}
function syncCurrent(){
 if(!state.player||!state.ready)return;
 const data=safe(()=>state.player.getVideoData(),null);
 if(!data||!data.video_id)return;
 const known=byId.get(data.video_id);
 $('title').textContent=known?known.title:(data.title||'Tema de YouTube');
 $('artist').textContent=known?known.artist:(data.author||'Reproducción de YouTube');
}
function fallback(request){
 if(request!==state.request||!state.ready||!state.player)return;
 clearTimeout(mixTimer);
 state.mode='examples';
 $('eyebrow').textContent='MODO EJEMPLOS';
 status('YouTube no habilitó Mix dentro del reproductor. Siguen los 3 ejemplos, no recomendaciones.');
 const start=SONGS.findIndex(s=>s.id===state.seed.id);
 const playlist=[...SONGS.slice(start),...SONGS.slice(0,start)].map(s=>s.id);
 safe(()=>{state.player.loadPlaylist(playlist,0,0);state.player.setLoop(true);state.player.setVolume(state.volume);state.player.unMute()});
 state.started=true;$('cover').classList.add('hidden');updateButtons();
}
function checkMix(request){
 if(request!==state.request||!state.ready||!state.player)return;
 const list=safe(()=>state.player.getPlaylist(),[]);
 if(Array.isArray(list)&&list.length>=2){
  state.mode='mix';$('eyebrow').textContent='YOUTUBE MIX';status('Lista Mix cargada · reproducción automática de la cola disponible.');
  state.started=true;syncCurrent();updateButtons();return;
 }
 fallback(request);
}
function selectSong(song){
 state.seed=song;state.request+=1;const req=state.request;
 state.mode='checking';state.started=true;state.playing=false;
 clearTimeout(mixTimer);clearTimeout(startTimer);
 $('error').classList.remove('show');$('cover').classList.remove('hidden');
 $('widget').classList.remove('artwork-view');
 $('eyebrow').textContent='BUSCANDO RADIO';
 setTitle(song);thumb();renderSeeds();updateRadioLink();status('Probando la radio Mix de YouTube…');updateButtons();
 if(!state.ready||!state.player){
  status('Cargando reproductor de YouTube…');$('cover').classList.remove('hidden');
  return;
 }
 const mix='RD'+song.id;
 const ok=safe(()=>{state.player.loadPlaylist({listType:'playlist',list:mix,index:0,startSeconds:0});state.player.unMute();state.player.setVolume(state.volume);return true},false);
 if(!ok){fallback(req);return}
 mixTimer=setTimeout(()=>checkMix(req),6500);
}
function start(){
 if(!state.ready){state.started=true;status('Cargando YouTube…');return}
 selectSong(state.seed);
}
function playOrPause(){
 const p=state.player;
 if(!p||!state.ready){state.started=true;status('Cargando YouTube…');return}
 if(!state.started){start();return}
 const playing=safe(()=>p.getPlayerState()===1,false);
 if(playing){p.pauseVideo();state.playing=false;showArtwork();updateButtons()}
 else{
  $('widget').classList.remove('artwork-view');
  p.unMute();p.setVolume(state.volume);p.playVideo();
 }
}
function advance(direction){
 if(!state.ready||!state.player){if(!state.started){selectSong(SONGS[(SONGS.indexOf(state.seed)+direction+SONGS.length)%SONGS.length])}return}
 if(!state.started){selectSong(SONGS[(SONGS.indexOf(state.seed)+direction+SONGS.length)%SONGS.length]);return}
 if(state.mode==='checking'){status('Esperá a que se cargue la radio…');return}
 const p=state.player;
 if(state.mode==='mix'||state.mode==='examples'){
  const index=safe(()=>p.getPlaylistIndex(),0);
  const list=safe(()=>p.getPlaylist(),[]);
  const canGo=Array.isArray(list)&&list.length>1;
  if(canGo){
   if(direction>0 && index===list.length-1)p.playVideoAt(0);
   else if(direction<0 && index===0)p.playVideoAt(list.length-1);
   else if(direction>0)p.nextVideo();else p.previousVideo();
   return;
  }
 }
 // Fallback ante una cola que haya dejado de estar disponible.
 const idx=SONGS.findIndex(s=>s.id===state.seed.id);
 selectSong(SONGS[(idx+direction+SONGS.length)%SONGS.length]);
}
function onState(e){
 if(!state.ready)return;
 state.playing=e.data===1;
 if(e.data===1){
  showVideo();$('error').classList.remove('show');
  if(state.mode==='examples'||state.mode==='mix')syncCurrent();
 }else if(e.data===2||e.data===5){
  showArtwork();
 }else if(e.data===0){
  showArtwork();
  if(state.mode==='examples'){
   const list=safe(()=>state.player.getPlaylist(),[]);
   if(!Array.isArray(list)||list.length<2)advance(1);
  }
 }
 updateButtons();
}
function playerError(e){
 if(state.mode==='checking'){fallback(state.request);return}
 if([2,5,100,101,150,153].includes(e.data)){
  $('error').classList.add('show');state.playing=false;updateButtons();status('Este video no permite reproducirse aquí. Podés abrirlo en YouTube.');
 }
}
window.onYouTubeIframeAPIReady=()=>{
 state.player=new YT.Player('ytPlayer',{
  height:'100%',width:'100%',videoId:state.seed.id,
  playerVars:{controls:0,autoplay:0,playsinline:1,iv_load_policy:3,rel:1,origin:location.origin},
  events:{
   onReady:e=>{state.ready=true;e.target.setVolume(state.volume);updateButtons();if(state.started)selectSong(state.seed);else status('Elegí un tema y empieza a sonar.');},
   onStateChange:onState,onError:playerError,
   onAutoplayBlocked:()=>{state.playing=false;updateButtons();status('El navegador bloqueó el inicio automático. Tocá Reproducir.')}
  }
 });
};
$('start').addEventListener('click',playOrPause);
$('pause').addEventListener('click',playOrPause);
$('prev').addEventListener('click',()=>advance(-1));
$('next').addEventListener('click',()=>advance(1));
$('volume').addEventListener('input',e=>{
 state.volume=Number(e.target.value)||0;
 if(state.ready&&state.player){state.player.setVolume(state.volume);if(state.volume>0)state.player.unMute();else state.player.mute();}
});
document.addEventListener('keydown',e=>{
 if(e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea,button,select'))return;
 if(e.code==='Space'){e.preventDefault();playOrPause()}
 if(e.code==='ArrowRight')advance(1);
 if(e.code==='ArrowLeft')advance(-1);
});
renderSeeds();thumb();updateRadioLink();updateButtons();$('widget').classList.add('artwork-view');
const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';script.async=true;
script.onerror=()=>status('No se pudo conectar con YouTube. Revisá la conexión.');
document.head.appendChild(script);
setTimeout(()=>{if(!state.player)status('YouTube no respondió. Probá recargar la página.')},12500);

const widget = $('widget'),bar = $('pill'),seek = $('seek');
function showSettings(open) {
 widget.classList.toggle('settings-open',open);
 bar.setAttribute('aria-expanded',String(open));
 bar.setAttribute('aria-label',open?'Cerrar ajustes':'Abrir ajustes y cambiar canción');
 $('settings').setAttribute('aria-hidden',String(!open));
 $('settings').inert=!open;
}
bar.addEventListener('click',()=>showSettings(!widget.classList.contains('settings-open')));
$('screenTap').addEventListener('click',playOrPause);
$('seeds').addEventListener('click',e=>{if(e.target.closest('.seed'))showSettings(false)});
$('addForm').addEventListener('submit',e=>{e.preventDefault();const id=parse($('url').value);if(!id){status('Pegá un enlace válido de YouTube.');return}const newSong={id,title:'Canción agregada',artist:'YouTube'}; const existing=SONGS.find(song=>song.id===id);if(!existing)SONGS.unshift(newSong);selectSong(existing||newSong);$('url').value='';showSettings(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&widget.classList.contains('settings-open'))showSettings(false)});
function labelTime(s){
 if(!Number.isFinite(s)||s<0)return '0:00';
 s=Math.floor(s);
 return s>=3600?Math.floor(s/3600)+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'):Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
function paintSlider(input,pct){input.style.setProperty('--pos',Math.max(0,Math.min(100,pct))+'%')}
let draggingSeek=false;
function updatePosition(){
 if(!state.ready||!state.player||!state.started)return;
 const duration=Number((()=>{try{return state.player.getDuration()}catch{return 0}})())||0;
 const seconds=Number((()=>{try{return state.player.getCurrentTime()}catch{return 0}})())||0;
 if(!draggingSeek){
  seek.value=duration>0?Math.min(1000,Math.max(0,Math.round(seconds/duration*1000))):0;
  paintSlider(seek,Number(seek.value)/10);
  $('elapsed').textContent=labelTime(seconds);
  $('remaining').textContent=duration>0?'−'+labelTime(Math.max(0,duration-seconds)):'−0:00';
 }
}
seek.addEventListener('input',()=>{
 draggingSeek=true;paintSlider(seek,Number(seek.value)/10);
 if(!state.ready||!state.player)return;
 const duration=Number((()=>{try{return state.player.getDuration()}catch{return 0}})())||0;
 if(duration>0){const target=duration*Number(seek.value)/1000;$('elapsed').textContent=labelTime(target);$('remaining').textContent='−'+labelTime(duration-target)}
});
seek.addEventListener('change',()=>{
 if(state.ready&&state.player){const duration=Number((()=>{try{return state.player.getDuration()}catch{return 0}})())||0;if(duration>0)state.player.seekTo(duration*Number(seek.value)/1000,true)}
 draggingSeek=false;updatePosition();
});
seek.addEventListener('pointercancel',()=>{draggingSeek=false;updatePosition()});
$('volume').addEventListener('input',()=>paintSlider($('volume'),Number($('volume').value)));
paintSlider($('volume'),75);paintSlider(seek,0);
setInterval(updatePosition,400);

})();
</script>
</body>
