<!doctype html>
<html lang="es" data-p-material="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prometeo · Design</title>
<link rel="stylesheet" href="../shared/material/v1/material.css">
<style>
*{box-sizing:border-box}html{background:var(--pm-canvas);color:var(--pm-text);scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 24% 8%,rgba(255,255,255,.035),transparent 24%),linear-gradient(145deg,var(--pm-canvas),#121310);font-family:"Century Gothic","Avenir Next",Avenir,Futura,system-ui,sans-serif;color:var(--pm-text)}button{font:inherit}.wrap{width:min(940px,100%);margin:auto;padding:22px 16px 80px}.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 26px}.brand{font-size:12px;letter-spacing:.16em;text-transform:uppercase}.theme{width:46px;height:46px;display:grid;place-items:center;cursor:pointer}.theme::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}.hero{min-height:72vh;display:grid;place-items:center;text-align:center}.hub{width:min(520px,100%);aspect-ratio:1/.82;position:relative;display:grid;place-items:center}.core{width:132px;height:132px;border:0;border-radius:50%;display:grid;place-items:center;font-size:14px;letter-spacing:.08em;cursor:pointer}.node{position:absolute;width:124px;height:84px;border:0;padding:0 14px;display:grid;place-items:center;text-decoration:none;font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.n1{top:2%;left:50%;transform:translateX(-50%)}.n2{left:2%;top:52%;transform:translateY(-50%)}.n3{right:2%;top:52%;transform:translateY(-50%)}.n4{bottom:2%;left:50%;transform:translateX(-50%)}.line{position:absolute;left:50%;top:50%;width:1px;height:30%;background:linear-gradient(transparent,rgba(255,255,255,.16),transparent);transform-origin:50% 0;pointer-events:none}.l1{transform:rotate(0deg)}.l2{transform:rotate(90deg)}.l3{transform:rotate(180deg)}.l4{transform:rotate(270deg)}.section{padding:70px 0 20px;scroll-margin-top:20px}.section h2{margin:0 0 28px;font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}.specimen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.demo{min-height:180px;padding:22px;display:flex;align-items:center;justify-content:center}.demo strong{font-size:16px;font-weight:500}.inset-demo{min-height:180px;padding:22px;display:grid;place-items:center}.controls{display:flex;gap:18px;flex-wrap:wrap}.control{min-width:110px;height:54px;padding:0 20px;cursor:pointer}.type-grid{display:grid;gap:18px}.type-row{padding:24px}.display{font-size:clamp(34px,8vw,74px);letter-spacing:-.06em;line-height:.9}.ui{font-size:16px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:.04em}.motion-stage{padding:26px;min-height:190px;display:grid;place-items:center}.motion-object{width:94px;height:94px;border-radius:30px;transition:transform .45s var(--pm-ease)}.motion-stage.active .motion-object{transform:translateY(-14px) rotate(3deg)}.color-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.swatch{height:92px;border:0;cursor:pointer}.s1{background:#20211e}.s2{background:#2a2520}.s3{background:#232421}.s4{background:#2a2022}.back{display:inline-flex;margin-top:30px;color:var(--pm-muted);text-decoration:none;font-size:11px}@media(max-width:640px){.wrap{padding:18px 14px 70px}.hero{min-height:620px}.hub{aspect-ratio:1/1.08}.core{width:116px;height:116px}.node{width:112px;height:76px}.n2{left:0}.n3{right:0}.specimen{grid-template-columns:1fr}.color-row{grid-template-columns:repeat(2,1fr)}.section{padding-top:58px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.motion-object{transition:none}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div class="brand">Prometeo · Design</div><button class="p-control theme" id="theme" aria-label="Cambiar tema"></button></header>
<section class="hero">
<div class="hub" aria-label="Mapa de diseño">
<div class="line l1"></div><div class="line l2"></div><div class="line l3"></div><div class="line l4"></div>
<a class="node p-surface n1" href="#material">Material</a>
<a class="node p-surface n2" href="#type">Type</a>
<button class="core p-control" id="core">Design</button>
<a class="node p-surface n3" href="#motion">Motion</a>
<a class="node p-surface n4" href="#color">Color</a>
</div>
</section>
<section class="section" id="material"><h2>Material</h2><div class="specimen"><p-surface class="demo"><strong>Surface</strong></p-surface><p-inset class="inset-demo"><strong>Inset</strong></p-inset><p-shell class="demo"><strong>Shell</strong></p-shell><div class="demo p-surface"><div class="controls"><button class="p-control control">Press</button><button class="p-control control">Hold</button></div></div></div></section>
<section class="section" id="type"><h2>Type</h2><div class="type-grid"><p-surface class="type-row"><div class="display">Aa</div></p-surface><p-surface class="type-row"><div class="ui">Interface</div></p-surface><p-inset class="type-row"><div class="mono">01 · SYSTEM</div></p-inset></div></section>
<section class="section" id="motion"><h2>Motion</h2><p-surface class="motion-stage" id="motionStage"><button class="p-control control" id="motionButton">Move</button><div class="motion-object p-surface" aria-hidden="true"></div></p-surface></section>
<section class="section" id="color"><h2>Color</h2><div class="color-row"><button class="swatch p-surface s1" aria-label="Graphite"></button><button class="swatch p-surface s2" aria-label="Warm"></button><button class="swatch p-surface s3" aria-label="Stone"></button><button class="swatch p-surface s4" aria-label="Garnet"></button></div></section>
<a class="back" href="../">← Prometeo</a>
</main>
<script>
const root=document.documentElement;const theme=document.getElementById('theme');theme.addEventListener('click',()=>{root.dataset.pMaterial=root.dataset.pMaterial==='dark'?'light':'dark'});const stage=document.getElementById('motionStage');document.getElementById('motionButton').addEventListener('click',()=>stage.classList.toggle('active'));document.getElementById('core').addEventListener('click',()=>document.getElementById('material').scrollIntoView({behavior:'smooth'}));
</script>
<script type="module" src="/prometeo/shared/prometeo-shell/v1/prometeo-shell.js?v=1" data-prometeo-shell></script>
</body>
</html>
